<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈/私域文案生成器 - Private Domain Copywriter</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        .markdown-body p {
            margin-bottom: 0.5em;
        }

        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-bottom: 0.5em;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .mobile-stack {
                flex-direction: column;
            }

            .mobile-full-width {
                width: 100%;
            }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">
    <div id="app" class="h-full flex flex-col">
        <!-- Navigation -->
        <nav class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center shrink-0 z-10">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-slate-500 hover:text-indigo-600 transition-colors">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-100 p-2 rounded-lg">
                        <i data-lucide="message-circle-heart" class="w-5 h-5 text-indigo-600"></i>
                    </div>
                    <h1 class="font-bold text-lg text-slate-800">朋友圈/私域文案生成器</h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <select v-model="selectedModel"
                        class="appearance-none bg-slate-100 border-none text-sm font-medium py-2 pl-3 pr-8 rounded-lg cursor-pointer hover:bg-slate-200 transition-colors focus:ring-2 focus:ring-indigo-500">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                    <i data-lucide="chevron-down"
                        class="w-4 h-4 text-slate-500 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
                <button @click="showConfig = true"
                    class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors" title="API 设置">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 flex overflow-hidden mobile-stack">
            <!-- Left Sidebar: Input -->
            <aside class="w-full md:w-[400px] bg-white border-r border-slate-200 flex flex-col shrink-0 z-0">
                <div class="p-5 flex-1 overflow-y-auto custom-scrollbar">
                    <div class="space-y-6">
                        <!-- Input Section -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">
                                输入内容
                                <span class="text-xs font-normal text-slate-500 ml-1">(产品信息、生活片段、活动通知等)</span>
                            </label>
                            <textarea v-model="inputText"
                                class="w-full h-48 p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none text-sm leading-relaxed transition-all placeholder:text-slate-400"
                                placeholder="例如：
1. 刚到的新款草莓蛋糕，用了进口奶油。
2. 周末去露营了，风景很好，心情很放松。
3. 双十一活动最后一天，全场五折。"></textarea>
                        </div>

                        <!-- Style Selection -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-3">生成风格 (默认全选)</label>
                            <div class="grid grid-cols-1 gap-2">
                                <label v-for="style in availableStyles" :key="style.id"
                                    class="flex items-center p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-colors"
                                    :class="{'border-indigo-500 bg-indigo-50': selectedStyles.includes(style.id)}">
                                    <input type="checkbox" :value="style.id" v-model="selectedStyles" class="hidden">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-full flex items-center justify-center"
                                            :class="style.bgClass">
                                            <i :data-lucide="style.icon" class="w-4 h-4"
                                                :class="style.textClass"></i>
                                        </div>
                                        <div>
                                            <div class="text-sm font-medium text-slate-900">{{ style.name }}</div>
                                            <div class="text-xs text-slate-500">{{ style.desc }}</div>
                                        </div>
                                    </div>
                                    <div class="ml-auto">
                                        <div class="w-4 h-4 rounded border flex items-center justify-center transition-colors"
                                            :class="selectedStyles.includes(style.id) ? 'bg-indigo-500 border-indigo-500' : 'border-slate-300'">
                                            <i data-lucide="check" class="w-3 h-3 text-white"
                                                v-if="selectedStyles.includes(style.id)"></i>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="p-5 border-t border-slate-200 bg-white">
                    <button @click="generateAll" :disabled="!inputText.trim() || isGenerating"
                        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium rounded-xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                        <i v-if="isGenerating" data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                        <i v-else data-lucide="sparkles" class="w-5 h-5"></i>
                        <span>{{ isGenerating ? '正在生成文案...' : '生成朋友圈文案' }}</span>
                    </button>
                </div>
            </aside>

            <!-- Right Content: Results -->
            <section class="flex-1 bg-slate-50/50 overflow-y-auto custom-scrollbar p-4 md:p-8 relative">
                <!-- Empty State -->
                <div v-if="results.length === 0 && !isGenerating"
                    class="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
                    <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                        <i data-lucide="pen-tool" class="w-10 h-10 text-slate-300"></i>
                    </div>
                    <p class="text-lg font-medium text-slate-500">输入内容，开始创作私域爆款文案</p>
                    <p class="text-sm mt-2">支持多种风格，专为微信生态优化</p>
                </div>

                <!-- Results Grid -->
                <div v-else class="max-w-5xl mx-auto space-y-6">
                    <div class="flex justify-between items-center mb-2" v-if="results.length > 0">
                        <h2 class="text-xl font-bold text-slate-800">生成结果</h2>
                        <button @click="exportAll"
                            class="text-sm text-indigo-600 hover:text-indigo-700 font-medium flex items-center gap-1">
                            <i data-lucide="download" class="w-4 h-4"></i> 导出全部
                        </button>
                    </div>

                    <div v-for="(result, index) in results" :key="index"
                        class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden transition-all hover:shadow-md">
                        <!-- Card Header -->
                        <div
                            class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center"
                                    :class="getStyleConfig(result.styleId).bgClass">
                                    <i :data-lucide="getStyleConfig(result.styleId).icon" class="w-4 h-4"
                                        :class="getStyleConfig(result.styleId).textClass"></i>
                                </div>
                                <h3 class="font-bold text-slate-800">{{ getStyleConfig(result.styleId).name }}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <button @click="copyContent(result.content)"
                                    class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors"
                                    title="复制文案">
                                    <i data-lucide="copy" class="w-4 h-4"></i>
                                </button>
                                <button @click="regenerateSingle(index)" :disabled="result.loading"
                                    class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors"
                                    title="重新生成">
                                    <i :class="{'animate-spin': result.loading}" data-lucide="refresh-cw"
                                        class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Card Content -->
                        <div class="p-6">
                            <!-- Reasoning (DeepSeek V4 Pro) -->
                            <details v-if="result.reasoning" class="mb-4 group">
                                <summary
                                    class="flex items-center gap-2 text-xs font-medium text-amber-600 cursor-pointer select-none mb-2">
                                    <i data-lucide="brain-circuit" class="w-3 h-3"></i>
                                    <span>深度思考过程</span>
                                    <i data-lucide="chevron-down"
                                        class="w-3 h-3 transition-transform group-open:rotate-180"></i>
                                </summary>
                                <div
                                    class="p-3 bg-amber-50/50 rounded-lg border border-amber-100 text-xs text-slate-600 leading-relaxed whitespace-pre-wrap font-mono">
                                    {{ result.reasoning }}
                                </div>
                            </details>

                            <!-- Main Content -->
                            <div class="prose prose-slate prose-sm max-w-none">
                                <div v-if="result.loading && !result.content" class="space-y-3 animate-pulse">
                                    <div class="h-4 bg-slate-100 rounded w-3/4"></div>
                                    <div class="h-4 bg-slate-100 rounded w-1/2"></div>
                                    <div class="h-4 bg-slate-100 rounded w-5/6"></div>
                                </div>
                                <div v-else class="whitespace-pre-wrap text-slate-700 leading-7 font-medium"
                                    v-html="formatContent(result.content)"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Config Modal -->
        <div v-if="showConfig"
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="font-bold text-slate-800">API 设置</h3>
                    <button @click="showConfig = false" class="text-slate-400 hover:text-slate-600">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiKey"
                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                            placeholder="sk-...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">自定义系统提示词 (System Prompt)</label>
                        <textarea v-model="customSystemPrompt"
                            class="w-full h-32 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all resize-none text-sm"
                            placeholder="可选：覆盖默认的系统提示词..."></textarea>
                    </div>
                    <div class="pt-2">
                        <button @click="saveConfig"
                            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition-colors">
                            保存配置
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick, computed } = Vue;

        const LucideIcon = {
            props: {
                name: { type: String, required: true },
                class: { type: String, default: '' }
            },
            setup(props) {
                const svgHtml = computed(() => {
                    if (!window.lucide || !window.lucide.icons) return '';

                    const iconName = props.name.split('-')
                        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
                        .join('');

                    const icon = window.lucide.icons[iconName];
                    if (!icon) {
                        console.warn(`Icon not found: ${props.name} (${iconName})`);
                        return '';
                    }

                    // Create SVG with the passed classes
                    return icon.toSvg({ class: props.class });
                });

                return { svgHtml };
            },
            template: `<span v-html="svgHtml" style="display: contents;"></span>`
        };

        createApp({
            components: {
                LucideIcon
            },
            setup() {
                const inputText = ref('');
                const apiKey = ref('');
                const selectedModel = ref('deepseek-v4-flash');
                const showConfig = ref(false);
                const isGenerating = ref(false);
                const results = ref([]);
                const customSystemPrompt = ref('');

                const availableStyles = [
                    {
                        id: 'anti_fold',
                        name: '不折叠长文案',
                        desc: '排版清晰，利用空行和符号避免被折叠，适合干货输出。',
                        icon: 'align-left',
                        bgClass: 'bg-blue-100',
                        textClass: 'text-blue-600',
                        prompt: '请生成一条【不折叠长文案】风格的朋友圈文案。特点：排版极其讲究，利用短句、空行、Emoji符号来控制视觉节奏，避免被微信折叠。开头要有吸引力，中间内容有条理（可以使用序号），结尾有互动或行动号召。语气专业但亲切。'
                    },
                    {
                        id: 'script_murder',
                        name: '剧本杀式营销',
                        desc: '故事感强，悬疑引入，沉浸式体验，最后反转带出产品。',
                        icon: 'scroll',
                        bgClass: 'bg-purple-100',
                        textClass: 'text-purple-600',
                        prompt: '请生成一条【剧本杀式营销】风格的朋友圈文案。特点：像讲一个微型悬疑故事或剧本片段。开头设置悬念（“我从未想过会发生这种事...”），中间铺陈细节，营造氛围，最后神反转带出产品或信息。让人忍不住读完。'
                    },
                    {
                        id: 'soft_ad',
                        name: '生活化软广',
                        desc: '像朋友分享日常，真实自然，产品植入不生硬。',
                        icon: 'coffee',
                        bgClass: 'bg-green-100',
                        textClass: 'text-green-600',
                        prompt: '请生成一条【生活化软广】风格的朋友圈文案。特点：完全像是在分享日常生活点滴，语气随意、真实、像老朋友聊天。不要有明显的广告痕迹，产品只是生活场景中的一部分。配上适合的Emoji。'
                    },
                    {
                        id: 'emotional',
                        name: '深夜走心文',
                        desc: '情感共鸣，感性，适合深夜发布，建立信任感。',
                        icon: 'moon',
                        bgClass: 'bg-indigo-100',
                        textClass: 'text-indigo-600',
                        prompt: '请生成一条【深夜走心文】风格的朋友圈文案。特点：感性、细腻、引发共鸣。适合深夜阅读，探讨生活感悟、成长、奋斗等话题，最后温柔地关联到产品或个人品牌。语气温暖、治愈。'
                    }
                ];

                const selectedStyles = ref(availableStyles.map(s => s.id));

                onMounted(() => {
                    lucide.createIcons();
                    const config = localStorage.getItem('global_llm_config');
                    if (config) {
                        const parsed = JSON.parse(config);
                        apiKey.value = parsed.deepseek || '';
                        customSystemPrompt.value = parsed.systemPrompt || '';
                    }
                });

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...current,
                        deepseek: apiKey.value.trim(),
                        systemPrompt: customSystemPrompt.value
                    }));
                    showConfig.value = false;
                };

                const getStyleConfig = (id) => availableStyles.find(s => s.id === id);

                const formatContent = (content) => {
                    if (!content) return '';
                    // Simple formatting: preserve newlines, maybe highlight hashtags
                    return content.replace(/#([^\s#]+)/g, '<span class="text-indigo-600 font-bold">#$1</span>');
                };

                const copyContent = async (text) => {
                    try {
                        await navigator.clipboard.writeText(text);
                        // Optional: Show toast
                    } catch (err) {
                        console.error('Failed to copy:', err);
                    }
                };

                const exportAll = () => {
                    const content = results.value.map(r => {
                        const style = getStyleConfig(r.styleId);
                        let text = `【风格：${style.name}】\n\n${r.content}\n`;
                        if (r.reasoning) {
                            text += `\n[深度思考]:\n${r.reasoning}\n`;
                        }
                        return text + '\n' + '-'.repeat(50) + '\n';
                    }).join('\n');

                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `朋友圈文案_${new Date().toISOString().slice(0, 10)}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                const generateSingle = async (styleId, index) => {
                    const style = getStyleConfig(styleId);
                    const resultItem = results.value[index];

                    resultItem.loading = true;
                    resultItem.content = '';
                    resultItem.reasoning = '';

                    const systemPrompt = customSystemPrompt.value || "你是一个资深的朋友圈私域运营专家。你擅长撰写高转化、高互动的朋友圈文案。你的文案风格多样，深谙微信生态的社交礼仪和用户心理。请根据用户输入的内容，创作符合特定风格的朋友圈文案。";

                    const userPrompt = `输入内容：\n${inputText.value}\n\n要求：\n${style.prompt}`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey.value}`
                            },
                            body: JSON.stringify({
                                model: selectedModel.value,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                stream: true
                            })
                        });

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n');

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const json = JSON.parse(data);
                                        const delta = json.choices[0].delta;

                                        if (delta.reasoning_content) {
                                            resultItem.reasoning += delta.reasoning_content;
                                        }

                                        if (delta.content) {
                                            resultItem.content += delta.content;
                                        }
                                    } catch (e) {
                                        console.error('Error parsing JSON:', e);
                                    }
                                }
                            }
                        }
                    } catch (error) {
                        console.error('API Error:', error);
                        resultItem.content = `生成出错: ${error.message}`;
                    } finally {
                        resultItem.loading = false;
                    }
                };

                const generateAll = async () => {
                    if (!apiKey.value) {
                        showConfig.value = true;
                        return;
                    }

                    isGenerating.value = true;
                    results.value = selectedStyles.value.map(id => ({
                        styleId: id,
                        content: '',
                        reasoning: '',
                        loading: true
                    }));

                    // Parallel generation
                    const promises = results.value.map((_, index) =>
                        generateSingle(results.value[index].styleId, index)
                    );

                    await Promise.all(promises);
                    isGenerating.value = false;

                    // nextTick(() => { lucide.createIcons(); }); // Removed manual call
                };

                const regenerateSingle = async (index) => {
                    if (!apiKey.value) {
                        showConfig.value = true;
                        return;
                    }
                    await generateSingle(results.value[index].styleId, index);
                };

                return {
                    inputText,
                    apiKey,
                    selectedModel,
                    showConfig,
                    isGenerating,
                    results,
                    availableStyles,
                    selectedStyles,
                    customSystemPrompt,
                    saveConfig,
                    generateAll,
                    regenerateSingle,
                    getStyleConfig,
                    formatContent,
                    copyContent,
                    exportAll
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
