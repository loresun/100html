    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识付费课程策划 (Course Planner)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                    <i class="fa-solid fa-book-open text-indigo-600 text-2xl"></i>
                    <span class="font-bold text-xl text-slate-900">Course Planner</span>
                </div>
                <div class="flex items-center gap-4">
                    <!-- V4 Flash/V4 Pro 模型切换器 -->
                    <div class="flex items-center gap-2 bg-slate-100 rounded-lg p-1">
                        <button @click="apiConfig.model = 'deepseek-v4-flash'"
                            :class="{'bg-white shadow text-indigo-600': apiConfig.model === 'deepseek-v4-flash', 'text-slate-500': apiConfig.model !== 'deepseek-v4-flash'}"
                            class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                        <button @click="apiConfig.model = 'deepseek-v4-pro'"
                            :class="{'bg-white shadow text-indigo-600': apiConfig.model === 'deepseek-v4-pro', 'text-slate-500': apiConfig.model !== 'deepseek-v4-pro'}"
                            class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                    </div>
                    <button @click="showSettings = true"
                        class="text-slate-500 hover:text-indigo-600 flex items-center gap-1 text-sm font-medium"><i
                            class="fa-solid fa-gear"></i> 设置</button>
                </div>
            </div>
        </nav>

        <div class="flex-grow flex flex-col md:flex-row overflow-hidden h-[calc(100vh-4rem)]">
            <div
                class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-slate-200 flex flex-col h-full z-20 p-5 overflow-y-auto space-y-6">
                <div class="space-y-3">
                    <label class="block text-sm font-bold text-slate-700">课程主题</label>
                    <input type="text" v-model="input.topic" placeholder="例如：零基础学会短视频剪辑"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>
                <div class="space-y-3">
                    <label class="block text-sm font-bold text-slate-700">目标人群 & 痛点</label>
                    <textarea v-model="input.audience" rows="4" placeholder="例如：想做副业的宝妈、职场新人；痛点是没时间、学不会复杂软件..."
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-sm"></textarea>
                </div>
                <div class="space-y-3">
                    <label class="block text-sm font-bold text-slate-700">课程亮点/特色 (可选)</label>
                    <textarea v-model="input.highlights" rows="2" placeholder="例如：赠送素材包、1对1答疑..."
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-sm"></textarea>
                </div>
                <button @click="generatePlan" :disabled="isGenerating || !input.topic"
                    class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-indigo-700 transition disabled:opacity-50 flex items-center justify-center gap-2">
                    <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin"></i>
                    <span v-else>生成课程大纲</span>
                </button>
            </div>

            <div
                class="flex-grow bg-slate-50 flex flex-col h-full overflow-hidden relative p-6 md:p-10 overflow-y-auto">
                <div v-if="!result && !isGenerating"
                    class="flex flex-col items-center justify-center h-full text-slate-400">
                    <i class="fa-solid fa-list text-6xl mb-4 opacity-50"></i>
                    <p>输入主题，一键生成卖爆的课程大纲</p>
                </div>

                <div v-if="result" class="max-w-4xl mx-auto space-y-8 animate-fade-in">
                    <!-- 课程概览 -->
                    <div class="bg-white rounded-2xl p-8 border border-indigo-100 shadow-sm">
                        <h2 class="text-2xl font-black text-slate-900 mb-2">{{ result.title }}</h2>
                        <p class="text-indigo-600 font-medium mb-4">{{ result.subtitle }}</p>
                        <div class="flex gap-2 flex-wrap">
                            <span v-for="tag in result.tags" :key="tag"
                                class="px-2 py-1 bg-indigo-50 text-indigo-600 text-xs rounded-md font-bold">#{{ tag
                                }}</span>
                        </div>
                    </div>

                    <!-- 课程大纲 -->
                    <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm">
                        <h3 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2"><i
                                class="fa-solid fa-sitemap text-indigo-600"></i> 课程大纲</h3>
                        <div class="space-y-6">
                            <div v-for="(module, idx) in result.modules" :key="idx"
                                class="border-l-4 border-indigo-200 pl-4">
                                <h4 class="font-bold text-lg text-slate-800 mb-2">第{{ idx + 1 }}章：{{ module.title }}
                                </h4>
                                <ul class="space-y-2">
                                    <li v-for="(lesson, lIdx) in module.lessons" :key="lIdx"
                                        class="flex items-start gap-2 text-sm text-slate-600">
                                        <div class="mt-1 w-1.5 h-1.5 rounded-full bg-indigo-400 flex-shrink-0"></div>
                                        <div>
                                            <span class="font-medium text-slate-700">{{ lesson.title }}</span>
                                            <span class="text-slate-400 ml-2">- {{ lesson.benefit }}</span>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- 宣发文案 -->
                    <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm">
                        <h3 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2"><i
                                class="fa-solid fa-bullhorn text-red-500"></i> 朋友圈/详情页文案</h3>
                        <div
                            class="prose prose-slate max-w-none bg-slate-50 p-6 rounded-xl whitespace-pre-wrap text-sm">
                            {{ result.copywriting }}</div>
                        <button @click="copyText(result.copywriting)"
                            class="mt-4 text-sm text-indigo-600 font-medium flex items-center gap-1 hover:text-indigo-800"><i
                                class="fa-solid fa-copy"></i> 复制文案</button>
                    </div>

                    <div class="flex justify-end">
                        <button @click="exportJSON"
                            class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-bold hover:bg-slate-800 flex items-center gap-2"><i
                                class="fa-solid fa-download"></i> 导出方案</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 (复用) -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <h3 class="text-lg font-bold mb-4">API 配置</h3>
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label><input
                            type="password" v-model="apiConfig.deepseek"
                            class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">模型</label><select
                            v-model="apiConfig.model"
                            class="w-full rounded-lg border-slate-300 border p-2 outline-none">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select></div>
                </div>
                <div class="mt-6 flex justify-end gap-2"><button @click="showSettings = false"
                        class="px-4 py-2 hover:bg-slate-100 rounded-lg text-slate-500">取消</button><button
                        @click="saveConfig"
                        class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">保存</button></div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted, nextTick } = Vue;
        createApp({
            setup() {

                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });
                const input = reactive({ topic: '', audience: '', highlights: '' });
                const isGenerating = ref(false);
                const result = ref(null);

                onMounted(() => {
                    // 初始化 Lucide 图标
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                        } catch (e) {
                            console.error('Failed to parse global_llm_config', e);
                        }
                    }
                });

                const saveConfig = () => {
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...JSON.parse(localStorage.getItem('global_llm_config') || '{}'), ...apiConfig.value }));
                    showSettings.value = false;
                };

                const generatePlan = async () => {
                    if (!apiConfig.value.deepseek) return showSettings.value = true;
                    isGenerating.value = true;
                    const prompt = `请为课程主题“${input.topic}”设计一份详细的课程策划案。
目标人群：${input.audience}
特色亮点：${input.highlights}
请返回 JSON 格式：
{
  "title": "极具吸引力的课程主标题",
  "subtitle": "痛点/利益点副标题",
  "tags": ["标签1", "标签2"],
  "modules": [
    { "title": "章节名称", "lessons": [{ "title": "课时标题", "benefit": "用户学完这节课能得到什么" }] }
  ],
  "copywriting": "一篇适合发朋友圈或详情页的招生文案，Emoji 丰富，结构清晰（痛点->解决方案->课程亮点->行动呼吁）"
}`;
                    try {
                        const res = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.value.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.value.model,
                                messages: [{ role: "system", content: "You are a course designer. Return JSON only." }, { role: "user", content: prompt }],
                                response_format: { type: 'json_object' }
                            })
                        });
                        if (!res.ok) {
                            const error = await res.json().catch(() => ({}));
                            throw new Error(error.error?.message || `HTTP error! status: ${res.status}`);
                        }
                        const data = await res.json();
                        result.value = JSON.parse(data.choices[0].message.content);
                    } catch (e) {
                        console.error('Generate error:', e);
                        alert('生成失败: ' + e.message);
                    }
                };

                const copyText = (text) => navigator.clipboard.writeText(text).then(() => alert('已复制'));
                const exportJSON = () => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([JSON.stringify(result.value, null, 2)], { type: 'application/json' }));
                    a.download = 'course_plan.json';
                    a.click();
                };

                return {
                    showSettings, apiConfig, saveConfig, input, isGenerating, result, generatePlan, copyText, exportJSON
                };
            }
        }).mount('#app');
    </script>

</html>
