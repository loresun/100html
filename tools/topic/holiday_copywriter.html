<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节日节气文案生成器 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 基础样式 - 节日红色与金色主题 */
        body {
            background: linear-gradient(135deg, #fef2f2 0%, #fef3c7 50%, #fce7f3 100%);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 3px; }

        /* 动画效果 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.4s ease-out forwards; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .animate-sparkle { animation: sparkle 1.5s ease-in-out infinite; }

        /* 节日卡片样式 */
        .holiday-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .holiday-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.15);
        }
        .holiday-card.active {
            border-color: #dc2626;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            box-shadow: 0 8px 25px -8px rgba(220, 38, 38, 0.3);
        }

        /* 分类标签样式 */
        .category-tab {
            transition: all 0.2s ease;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            transform: scale(1.02);
        }

        /* 平台标签样式 */
        .platform-chip {
            transition: all 0.2s ease;
        }
        .platform-chip.active {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            border-color: transparent;
        }

        /* 风格标签样式 */
        .style-chip {
            transition: all 0.2s ease;
        }
        .style-chip.active {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            border-color: transparent;
        }

        /* 文案结果卡片 */
        .result-card {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .result-card:hover {
            transform: translateX(4px);
            border-left-color: #dc2626;
            box-shadow: 0 4px 20px -6px rgba(0, 0, 0, 0.1);
        }

        /* 流式文字效果 */
        @keyframes typing {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .stream-text { animation: typing 0.05s ease-in; }

        /* 装饰性背景图案 */
        .decoration-pattern {
            background-image: radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.1) 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, rgba(220, 38, 38, 0.1) 0%, transparent 50%);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <!--
        节日节气文案生成器 - Alpine.js 应用
        功能：
        1. 支持24节气 + 传统节日 + 现代节日
        2. 多平台输出：小红书、公众号、朋友圈、短视频
        3. 多种文案风格：抒情/促销/互动/话题
        4. 支持品牌/产品植入
    -->
    <div x-data="holidayCopyApp" class="min-h-screen flex flex-col decoration-pattern">

        <!-- 顶部导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-red-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <!-- Logo 和标题 -->
                    <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition"
                        onclick="location.href='../../index.html'">
                        <div class="w-10 h-10 bg-gradient-to-br from-red-500 to-amber-500 rounded-xl flex items-center justify-center shadow-lg">
                            <i data-lucide="calendar-heart" class="text-white h-5 w-5"></i>
                        </div>
                        <div>
                            <span class="font-bold text-lg text-slate-900">节日节气文案生成器</span>
                            <span class="hidden sm:inline text-xs text-slate-500 ml-2">24节气 · 传统节日 · 现代节日</span>
                        </div>
                    </div>
                    <!-- 右侧按钮 -->
                    <div class="flex items-center gap-3">
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-red-600 transition flex items-center gap-1 text-sm font-medium px-3 py-2 rounded-lg hover:bg-red-50">
                            <i data-lucide="settings" class="h-4 w-4"></i>
                            <span class="hidden sm:inline">设置</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="flex-grow flex flex-col lg:flex-row overflow-hidden h-[calc(100vh-4rem)]">

            <!-- 左侧：输入面板 -->
            <div class="w-full lg:w-2/5 bg-white/70 backdrop-blur-sm border-r border-red-100 p-5 overflow-y-auto space-y-5">

                <!-- 节日分类选择 -->
                <div class="space-y-3">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-2">
                        <i data-lucide="calendar" class="w-4 h-4 text-red-600"></i>
                        选择节日类型
                    </label>
                    <!-- 分类标签 -->
                    <div class="flex flex-wrap gap-2">
                        <template x-for="cat in holidayCategories" :key="cat.value">
                            <button @click="selectedCategory = cat.value"
                                :class="['category-tab px-4 py-2 rounded-full text-sm font-medium border transition',
                                    selectedCategory === cat.value ? 'active' : 'bg-white border-red-200 text-slate-600 hover:border-red-400']">
                                <span x-text="cat.icon + ' ' + cat.label"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- 节日选择网格 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center justify-between">
                        <span class="flex items-center gap-2">
                            <i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i>
                            选择具体节日 <span class="text-red-500">*</span>
                        </span>
                        <span class="text-xs text-slate-400" x-text="'共 ' + currentHolidays.length + ' 个'"></span>
                    </label>
                    <div class="grid grid-cols-4 sm:grid-cols-5 gap-2 max-h-48 overflow-y-auto p-1">
                        <template x-for="holiday in currentHolidays" :key="holiday.value">
                            <div @click="input.selectedHoliday = holiday.value"
                                :class="['holiday-card p-2 rounded-xl bg-white cursor-pointer text-center',
                                    input.selectedHoliday === holiday.value ? 'active' : 'border border-slate-200 hover:border-red-300']">
                                <span class="text-xl block" x-text="holiday.icon"></span>
                                <span class="text-xs font-medium text-slate-700 block mt-1 truncate" x-text="holiday.label"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 输出平台选择 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-2">
                        <i data-lucide="share-2" class="w-4 h-4 text-red-600"></i>
                        输出平台 <span class="text-xs text-slate-400 ml-2">(可多选)</span>
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <template x-for="platform in platforms" :key="platform.value">
                            <button @click="togglePlatform(platform.value)"
                                :class="['platform-chip px-3 py-1.5 text-xs font-medium rounded-full border transition',
                                    input.selectedPlatforms.includes(platform.value) ? 'active' : 'bg-white border-amber-300 text-slate-600 hover:border-amber-500']">
                                <span x-text="platform.icon + ' ' + platform.label"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- 文案风格选择 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-2">
                        <i data-lucide="palette" class="w-4 h-4 text-purple-600"></i>
                        文案风格 <span class="text-xs text-slate-400 ml-2">(可多选)</span>
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <template x-for="style in copyStyles" :key="style.value">
                            <button @click="toggleStyle(style.value)"
                                :class="['style-chip px-3 py-1.5 text-xs font-medium rounded-full border transition',
                                    input.selectedStyles.includes(style.value) ? 'active' : 'bg-white border-purple-200 text-slate-600 hover:border-purple-400']">
                                <span x-text="style.icon + ' ' + style.label"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- 品牌/产品植入（可选） -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-2">
                        <i data-lucide="building-2" class="w-4 h-4 text-blue-600"></i>
                        品牌/产品植入 <span class="text-xs text-slate-400">(可选)</span>
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <span class="text-xs text-slate-500 block mb-1">品牌名称</span>
                            <input type="text" x-model="input.brandName" placeholder="如：星巴克"
                                class="w-full bg-white border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                        </div>
                        <div>
                            <span class="text-xs text-slate-500 block mb-1">产品名称</span>
                            <input type="text" x-model="input.productName" placeholder="如：新年限定礼盒"
                                class="w-full bg-white border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                        </div>
                    </div>
                    <textarea x-model="input.productDesc" rows="2"
                        placeholder="产品描述或核心卖点（可选）..."
                        class="w-full bg-white border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition resize-none"></textarea>
                </div>

                <!-- 额外要求 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-2">
                        <i data-lucide="message-square-plus" class="w-4 h-4 text-green-600"></i>
                        额外要求 <span class="text-xs text-slate-400">(可选)</span>
                    </label>
                    <textarea x-model="input.extraRequirements" rows="2"
                        placeholder="例如：文案要温馨感人、需要包含特定hashtag、要有互动引导..."
                        class="w-full bg-white border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition resize-none"></textarea>
                </div>

                <!-- 生成按钮 -->
                <button @click="generateCopy" 
                    :disabled="isGenerating || !input.selectedHoliday || input.selectedPlatforms.length === 0"
                    class="w-full bg-gradient-to-r from-red-600 via-amber-500 to-red-600 bg-[length:200%_auto] hover:bg-right text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-all duration-500">
                    <template x-if="isGenerating">
                        <i data-lucide="loader-2" class="animate-spin w-5 h-5"></i>
                    </template>
                    <template x-if="!isGenerating">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </template>
                    <span x-text="isGenerating ? '正在生成节日文案...' : '🎉 生成节日文案'"></span>
                </button>

                <!-- 快捷操作提示 -->
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">
                    <div class="flex items-start gap-2">
                        <i data-lucide="lightbulb" class="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5"></i>
                        <div class="text-xs text-amber-800">
                            <p class="font-medium mb-1">💡 使用技巧</p>
                            <ul class="space-y-0.5 text-amber-700">
                                <li>• 可同时选择多个平台和风格，生成多版本文案</li>
                                <li>• 添加品牌/产品信息可生成软植入文案</li>
                                <li>• 今天是 <span class="font-bold" x-text="getTodayInfo()"></span></li>
                            </ul>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 右侧：结果展示区 -->
            <div class="flex-grow bg-gradient-to-br from-red-50/30 via-amber-50/30 to-pink-50/30 p-6 overflow-y-auto">

                <!-- 空状态 -->
                <div x-show="results.length === 0 && !isGenerating"
                    class="h-full flex flex-col items-center justify-center text-slate-400">
                    <div class="relative">
                        <div class="w-28 h-28 bg-gradient-to-br from-red-100 to-amber-100 rounded-full flex items-center justify-center mb-6 animate-float">
                            <span class="text-5xl">🎊</span>
                        </div>
                        <div class="absolute -top-2 -right-2 text-2xl animate-sparkle">✨</div>
                        <div class="absolute -bottom-1 -left-3 text-xl animate-sparkle" style="animation-delay: 0.5s;">🌟</div>
                    </div>
                    <h3 class="text-xl font-bold text-slate-600 mb-2">节日节气文案生成器</h3>
                    <p class="text-center max-w-md text-slate-500">
                        24节气 · 传统节日 · 现代节日<br>
                        一键生成多平台、多风格的节日文案
                    </p>
                </div>

                <!-- 加载状态 -->
                <div x-show="isGenerating && results.length === 0" class="h-full flex flex-col items-center justify-center">
                    <div class="text-6xl animate-float">🎆</div>
                    <p class="mt-6 text-slate-600 font-medium">AI 正在创作节日文案...</p>
                    <p class="text-sm text-slate-400 mt-2" x-text="'为 ' + getSelectedHolidayLabel() + ' 生成精彩内容'"></p>
                </div>

                <!-- 结果展示 -->
                <div x-show="results.length > 0" class="max-w-4xl mx-auto space-y-6">

                    <!-- 顶部信息栏 -->
                    <div class="bg-gradient-to-r from-red-600 to-amber-500 rounded-2xl p-5 text-white shadow-lg animate-fade-in">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <span class="text-4xl" x-text="getSelectedHolidayIcon()"></span>
                                <div>
                                    <h2 class="text-2xl font-bold" x-text="getSelectedHolidayLabel()"></h2>
                                    <p class="opacity-90 text-sm mt-1">
                                        <span x-text="results.length + ' 条文案'"></span>
                                        <span class="mx-2">·</span>
                                        <span x-text="input.selectedPlatforms.length + ' 个平台'"></span>
                                        <template x-if="input.brandName">
                                            <span>
                                                <span class="mx-2">·</span>
                                                <span x-text="'品牌: ' + input.brandName"></span>
                                            </span>
                                        </template>
                                    </p>
                                </div>
                            </div>
                            <button @click="exportResults"
                                class="flex items-center gap-2 px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg transition backdrop-blur">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                <span class="text-sm font-medium">导出</span>
                            </button>
                        </div>
                    </div>

                    <!-- 文案列表 -->
                    <div class="space-y-4">
                        <template x-for="(item, index) in results" :key="index">
                            <div class="result-card bg-white rounded-xl p-5 shadow-sm animate-fade-in"
                                :style="'animation-delay: ' + (index * 0.1) + 's'">
                                
                                <!-- 文案头部信息 -->
                                <div class="flex items-center justify-between mb-3">
                                    <div class="flex items-center gap-2">
                                        <span class="px-2.5 py-1 bg-gradient-to-r from-red-100 to-amber-100 text-red-700 text-xs font-bold rounded-full"
                                            x-text="getPlatformLabel(item.platform)"></span>
                                        <span class="px-2.5 py-1 bg-purple-100 text-purple-700 text-xs font-medium rounded-full"
                                            x-text="getStyleLabel(item.style)"></span>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <button @click="copySingle(item.content)"
                                            class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition"
                                            title="复制">
                                            <i data-lucide="copy" class="w-4 h-4"></i>
                                        </button>
                                        <button @click="regenerateSingle(item, index)"
                                            class="p-2 text-slate-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition"
                                            title="重新生成">
                                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- 文案内容 -->
                                <div class="text-slate-700 leading-relaxed whitespace-pre-wrap" x-text="item.content"></div>

                                <!-- 底部标签（如有） -->
                                <template x-if="item.hashtags && item.hashtags.length > 0">
                                    <div class="mt-3 pt-3 border-t border-slate-100">
                                        <div class="flex flex-wrap gap-1.5">
                                            <template x-for="tag in item.hashtags" :key="tag">
                                                <span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded" x-text="tag"></span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- 底部操作区 -->
                    <div class="flex justify-center gap-4 pt-4">
                        <button @click="generateMore"
                            :disabled="isGenerating"
                            class="flex items-center gap-2 px-6 py-3 bg-white border-2 border-red-500 text-red-600 font-medium rounded-xl hover:bg-red-50 transition disabled:opacity-50">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                            继续生成
                        </button>
                        <button @click="clearResults"
                            class="flex items-center gap-2 px-6 py-3 bg-slate-100 text-slate-600 font-medium rounded-xl hover:bg-slate-200 transition">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                            清空结果
                        </button>
                    </div>

                </div>

            </div>

        </div>

        <!-- API 设置弹窗 -->
        <div x-show="showSettings" x-transition
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-fade-in" @click.outside="showSettings = false">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" x-model="apiConfig.deepseek"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-red-500 outline-none"
                            placeholder="sk-...">
                        <p class="text-xs text-slate-500 mt-1">
                            <i data-lucide="lock" class="w-3 h-3 inline-block mr-1"></i>
                            Key 仅保存在本地浏览器，所有工具共享使用
                        </p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">默认模型</label>
                        <select x-model="apiConfig.model"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-red-500 outline-none bg-white">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button @click="saveConfig"
                        class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">保存配置</button>
                </div>
            </div>
        </div>

        <!-- Toast 提示 -->
        <div x-show="toast.show" x-transition
            class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in z-[200]">
            <i :data-lucide="toast.icon" class="w-4 h-4"></i>
            <span class="text-sm" x-text="toast.message"></span>
        </div>

    </div>

    <script>
        /**
         * 节日节气文案生成器 - Alpine.js 应用
         * 功能：为各类节日节气生成多平台、多风格的营销文案
         * 
         * 数据结构说明：
         * - holidayCategories: 节日分类（节气、传统节日、现代节日等）
         * - holidays: 各分类下的具体节日
         * - platforms: 输出平台（小红书、公众号等）
         * - copyStyles: 文案风格（抒情、促销等）
         */
        document.addEventListener('alpine:init', () => {
            Alpine.data('holidayCopyApp', () => ({
                // ==================== 状态管理 ====================
                showSettings: false,
                apiConfig: { deepseek: '', model: 'deepseek-v4-flash' },

                /**
                 * 安全解析JSON - 处理常见的格式错误
                 * 主要修复：未正确引用的hashtags标签
                 * @param {string} jsonStr - 需要解析的JSON字符串
                 * @returns {object|null} - 解析后的对象，失败返回null
                 */
                safeParseJSON(jsonStr) {
                    try {
                        // 首先尝试直接解析
                        return JSON.parse(jsonStr);
                    } catch (e) {
                        console.warn('[Holiday Copy] JSON解析失败，尝试修复...', e.message);
                        
                        try {
                            // 修复常见问题1：未引用的hashtags（如 #标签 变成 "#标签"）
                            // 匹配 [#xxx, #yyy] 或 ["#xxx", #yyy] 这种混合格式
                            let fixedStr = jsonStr;
                            
                            // 修复 hashtags 数组中未引用的值
                            // 匹配 [... #非引号字符 ...] 的模式
                            fixedStr = fixedStr.replace(/\[\s*([^\]]*)\s*\]/g, (match, content) => {
                                // 检查是否是hashtags相关的数组
                                if (content.includes('#')) {
                                    // 分割数组项
                                    const items = content.split(',').map(item => {
                                        item = item.trim();
                                        // 如果以#开头但没有引号包裹，添加引号
                                        if (item.startsWith('#') && !item.startsWith('"')) {
                                            return `"${item}"`;
                                        }
                                        // 如果已经有引号，保持原样
                                        return item;
                                    });
                                    return '[' + items.join(', ') + ']';
                                }
                                return match;
                            });
                            
                            // 修复可能的尾随逗号
                            fixedStr = fixedStr.replace(/,\s*([\]}])/g, '$1');
                            
                            // 再次尝试解析
                            const result = JSON.parse(fixedStr);
                            console.log('[Holiday Copy] JSON修复成功');
                            return result;
                        } catch (e2) {
                            console.error('[Holiday Copy] JSON修复失败:', e2.message);
                            
                            // 最后尝试：提取copies数组内容
                            try {
                                const copiesMatch = jsonStr.match(/"copies"\s*:\s*\[([\s\S]*)\]/);
                                if (copiesMatch) {
                                    // 手动构建简化的结果
                                    console.log('[Holiday Copy] 尝试手动提取copies...');
                                    return { copies: [] }; // 返回空数组，让用户重试
                                }
                            } catch (e3) {
                                // 放弃
                            }
                            
                            return null;
                        }
                    }
                },

                /**
                 * 清理hashtags数组 - 确保格式正确
                 * @param {any} hashtags - 可能是数组、字符串或其他
                 * @returns {string[]} - 清理后的hashtags数组
                 */
                cleanHashtags(hashtags) {
                    // 如果不存在或不是数组，返回空数组
                    if (!hashtags) return [];
                    
                    // 如果是字符串，尝试分割
                    if (typeof hashtags === 'string') {
                        return hashtags.split(/[,\s]+/).filter(tag => tag.startsWith('#'));
                    }
                    
                    // 如果是数组，清理每个元素
                    if (Array.isArray(hashtags)) {
                        return hashtags
                            .map(tag => {
                                // 确保是字符串
                                if (typeof tag !== 'string') return '';
                                // 清理多余的引号和空格
                                tag = tag.trim().replace(/^["']+|["']+$/g, '');
                                // 确保以#开头
                                if (tag && !tag.startsWith('#')) {
                                    tag = '#' + tag;
                                }
                                return tag;
                            })
                            .filter(tag => tag.length > 1); // 过滤掉空的或只有#的
                    }
                    
                    return [];
                },


                /**
                 * 生成文案 - 核心方法
                 */
                async generateCopy() {
                    // 检查 API Key
                    if (!this.apiConfig.deepseek) {
                        this.showSettings = true;
                        this.showToast('请先配置 API Key', 'alert-circle');
                        return;
                    }

                    this.isGenerating = true;

                    try {
                        const holidayLabel = this.getSelectedHolidayLabel();
                        const holidayIcon = this.getSelectedHolidayIcon();
                        
                        // 获取平台和字数要求
                        const platformsInfo = this.input.selectedPlatforms.map(p => {
                            const platform = this.platforms.find(pl => pl.value === p);
                            return `${platform.label}(${platform.wordLimit})`;
                        }).join('、');

                        // 获取风格标签
                        const stylesInfo = this.input.selectedStyles.map(s => {
                            return this.copyStyles.find(st => st.value === s)?.label;
                        }).filter(Boolean).join('、');

                        // 构建系统提示词 - 强调JSON格式要求
                        const systemPrompt = `You are a top-tier social media copywriting expert specializing in holiday marketing.
Generate engaging holiday copy for users.

IMPORTANT JSON RULES:
1. Output MUST be valid JSON only, no markdown or code blocks
2. All string values MUST be wrapped in double quotes
3. The hashtags array MUST contain properly quoted strings like ["#tag1", "#tag2"]
4. Do NOT use unquoted values like #tag - always use "#tag"
5. Content can be in Chinese, but JSON structure must be valid`;

                        // 构建用户提示词
                        let userPrompt = `Please generate holiday copy for "${holidayLabel}${holidayIcon}".

## Requirements
- Target platforms: ${platformsInfo}
- Writing styles: ${stylesInfo}
- Generate 1 copy per platform per style

## Word count limits
${this.platforms.filter(p => this.input.selectedPlatforms.includes(p.value)).map(p => `- ${p.label}: ${p.wordLimit}`).join('\n')}
`;

                        // 品牌植入信息
                        if (this.input.brandName || this.input.productName) {
                            userPrompt += `
## Brand/Product Integration
${this.input.brandName ? `- Brand: ${this.input.brandName}` : ''}
${this.input.productName ? `- Product: ${this.input.productName}` : ''}
${this.input.productDesc ? `- Description: ${this.input.productDesc}` : ''}
- Naturally integrate the brand/product into the copy`;
                        }

                        // 额外要求
                        if (this.input.extraRequirements) {
                            userPrompt += `
## Additional Requirements
${this.input.extraRequirements}`;
                        }

                        // 输出格式说明 - 特别强调hashtags格式
                        userPrompt += `

## Output Format (STRICT JSON)
Respond with ONLY valid JSON, no markdown:
{
  "copies": [
    {
      "platform": "platform_value",
      "style": "style_value",
      "content": "Copy content in Chinese...",
      "hashtags": ["#tag1", "#tag2"]
    }
  ]
}

CRITICAL: hashtags MUST be an array of quoted strings like ["#tag1", "#tag2"]
NEVER output hashtags like [#tag1, #tag2] - this is invalid JSON!

Platform values: ${this.input.selectedPlatforms.join(', ')}
Style values: ${this.input.selectedStyles.join(', ')}`;

                        // 调用 API
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model || 'deepseek-v4-flash',
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                response_format: { type: 'json_object' },
                                stream: false,
                                temperature: 0.8
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`API 请求失败: ${response.status}`);
                        }

                        const data = await response.json();
                        const content = data.choices?.[0]?.message?.content;

                        if (content) {
                            // 使用容错解析处理可能的JSON格式问题
                            const parsed = this.safeParseJSON(content);
                            if (parsed && parsed.copies && Array.isArray(parsed.copies)) {
                                // 清理每条文案的hashtags，确保格式正确
                                this.results = parsed.copies.map(copy => ({
                                    ...copy,
                                    hashtags: this.cleanHashtags(copy.hashtags)
                                }));
                                this.showToast(`成功生成 ${this.results.length} 条文案！`, 'check-circle');
                            } else {
                                throw new Error('返回数据格式不正确');
                            }
                        }

                    } catch (error) {
                        console.error('[Holiday Copy] 生成失败:', error);
                        this.showToast('生成失败: ' + error.message, 'alert-circle');
                    } finally {
                        this.isGenerating = false;
                        this.refreshIcons();
                    }
                },

                /**
                 * 继续生成更多文案
                 */
                async generateMore() {
                    const existingResults = [...this.results];
                    await this.generateCopy();
                    this.results = [...existingResults, ...this.results];
                },

                /**

                 */
                async regenerateSingle(item, index) {
                    if (!this.apiConfig.deepseek) {
                        this.showSettings = true;

                    }

                    const holidayLabel = this.getSelectedHolidayLabel();
                    const platform = this.platforms.find(p => p.value === item.platform);
                    const style = this.copyStyles.find(s => s.value === item.style);

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model || 'deepseek-v4-flash',
                                messages: [
                                    { 
                                        role: 'system', 
                                        content: 'You are a social media copywriter. Output valid JSON only with properly quoted strings.' 
                                    },
                                    { 
                                        role: 'user', 
                                        content: `Generate 1 ${platform.label} copy for "${holidayLabel}", style: ${style.label}, word limit: ${platform.wordLimit}.
${this.input.brandName ? `Brand: ${this.input.brandName}` : ''}
${this.input.productName ? `Product: ${this.input.productName}` : ''}

Output format (valid JSON with quoted hashtags):
{"content": "Copy content in Chinese...", "hashtags": ["#tag1", "#tag2"]}`
                                    }
                                ],
                                response_format: { type: 'json_object' },
                                stream: false,
                                temperature: 0.9
                            })
                        });

                        const data = await response.json();
                        const content = data.choices?.[0]?.message?.content;
                        if (content) {
                            const parsed = this.safeParseJSON(content);
                            if (parsed && parsed.content) {
                                this.results[index] = {
                                    ...item,
                                    content: parsed.content,

                            }

                },

                /**
                 * 复制单条文案
                 */
                copySingle(text) {
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制到剪贴板', 'copy');
                    });
                },

                /**
                 * 清空结果
                 */
                clearResults() {
                    this.results = [];
                    this.refreshIcons();
                },

                /**
                 * 导出所有结果
                 */
                exportResults() {
                    const holidayLabel = this.getSelectedHolidayLabel();
                    let content = `# ${holidayLabel} 节日文案\n\n`;
                    content += `生成时间: ${new Date().toLocaleString()}\n`;
                    if (this.input.brandName) {
                        content += `品牌: ${this.input.brandName}\n`;
                    }
                    content += `\n---\n\n`;

                    this.results.forEach((item, idx) => {
                        content += `## ${idx + 1}. ${this.getPlatformLabel(item.platform)} - ${this.getStyleLabel(item.style)}\n\n`;
                        content += `${item.content}\n\n`;
                        if (item.hashtags && item.hashtags.length > 0) {
                            content += `标签: ${item.hashtags.join(' ')}\n\n`;
                        }
                        content += `---\n\n`;
                    });

                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${holidayLabel}_节日文案_${new Date().toISOString().slice(0, 10)}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    this.showToast('已导出文案', 'download');
                }
            }));
        });
    </script>
