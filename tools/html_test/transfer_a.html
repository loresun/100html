<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A 页面 | 内容传递</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #1f2a44;
    }

    .page {
      max-width: 960px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    p {
      margin: 4px 0 0;
      color: #5c6b85;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(31, 42, 68, 0.08);
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      display: block;
      margin-bottom: 8px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid #d7deea;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fefefe;
      transition: border 0.2s ease;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #4c6fff;
    }

    .block-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .block {
      border: 1px solid #e2e8f3;
      border-radius: 12px;
      padding: 16px;
      background: #fafcff;
    }

    .block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .block-header span {
      font-weight: 600;
    }

    .block-header button {
      border: none;
      background: transparent;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      background: #4c6fff;
      color: #fff;
      box-shadow: 0 10px 18px rgba(76, 111, 255, 0.25);
    }

    .secondary {
      background: #e9efff;
      color: #3552b5;
    }

    .hint {
      font-size: 12px;
      color: #7a869d;
      margin-top: 6px;
    }

    .preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .preview img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #dde4f2;
    }

    .preview span {
      font-size: 13px;
      color: #5c6b85;
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>
  <div class="page">
    <header>
      <h1>A 页面：内容采集与跳转</h1>
      <p>把文本、多个区域内容、JSON 或图片打包后跳转到 B 页面展示。</p>
    </header>

    <div class="card">
      <h2>基础内容区域</h2>
      <div class="grid">
        <div>
          <label for="title">标题文本</label>
          <input id="title" type="text" placeholder="输入标题" />
        </div>
        <div>
          <label for="subtitle">副标题文本</label>
          <input id="subtitle" type="text" placeholder="输入副标题" />
        </div>
      </div>
      <div style="margin-top: 16px;">
        <label for="summary">摘要说明</label>
        <textarea id="summary" placeholder="输入摘要说明"></textarea>
      </div>
    </div>

    <div class="card">
      <h2>多个区域内容</h2>
      <p class="hint">可添加任意数量的内容块，模拟多个不同区域。</p>
      <div class="block-list" id="blockList"></div>
      <div class="actions" style="margin-top: 16px;">
        <button class="secondary" id="addBlock">+ 添加内容块</button>
      </div>
    </div>

    <div class="card">
      <h2>JSON 与图片</h2>
      <div class="grid">
        <div>
          <label for="jsonData">JSON 数据</label>
          <textarea id="jsonData" placeholder='{"key": "value"}'></textarea>
          <div class="hint">支持输入任意 JSON 字符串。</div>
        </div>
        <div>
          <label for="imageInput">图片上传</label>
          <input id="imageInput" type="file" accept="image/*" />
          <div class="preview" id="imagePreview" style="display: none;">
            <img alt="预览" />
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>发送到 B 页面</h2>
      <div class="actions">
        <button class="primary" id="send">跳转到 B 页面</button>
        <button class="secondary" id="reset">清空内容</button>
      </div>
      <div class="hint">将内容写入 sessionStorage，并在新页面读取展示。</div>
    </div>
  </div>

  <script>
    const blockList = document.getElementById("blockList");
    const addBlockButton = document.getElementById("addBlock");
    const imageInput = document.getElementById("imageInput");
    const imagePreview = document.getElementById("imagePreview");
    const imageElement = imagePreview.querySelector("img");
    const imageMeta = imagePreview.querySelector("span");
    const sendButton = document.getElementById("send");
    const resetButton = document.getElementById("reset");

    const createBlock = (index) => {
      const wrapper = document.createElement("div");
      wrapper.className = "block";

      const header = document.createElement("div");
      header.className = "block-header";

      const title = document.createElement("span");
      title.textContent = `区域内容 ${index}`;

      const removeButton = document.createElement("button");
      removeButton.textContent = "删除";
      removeButton.type = "button";
      removeButton.addEventListener("click", () => {
        wrapper.remove();
        refreshBlockTitles();
      });

      header.append(title, removeButton);

      const label = document.createElement("label");
      label.textContent = "内容文本";
      label.setAttribute("for", `block-content-${index}`);

      const textarea = document.createElement("textarea");
      textarea.id = `block-content-${index}`;
      textarea.placeholder = "输入区域内容";

      wrapper.append(header, label, textarea);
      return wrapper;
    };

    const refreshBlockTitles = () => {
      Array.from(blockList.children).forEach((child, idx) => {
        const title = child.querySelector(".block-header span");
        const textarea = child.querySelector("textarea");
        title.textContent = `区域内容 ${idx + 1}`;
        textarea.id = `block-content-${idx + 1}`;
      });
    };

    const addBlock = () => {
      const index = blockList.children.length + 1;
      const block = createBlock(index);
      blockList.append(block);
    };

    addBlockButton.addEventListener("click", addBlock);
    addBlock();
    addBlock();

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (!file) {
        imagePreview.style.display = "none";
        imageElement.src = "";
        imageMeta.textContent = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        imageElement.src = event.target.result;
        imageMeta.textContent = `${file.name} (${Math.round(file.size / 1024)} KB)`;
        imagePreview.style.display = "flex";
        imagePreview.dataset.image = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    const collectBlocks = () => {
      return Array.from(blockList.querySelectorAll("textarea"))
        .map((textarea, index) => ({
          id: index + 1,
          content: textarea.value.trim()
        }))
        .filter((block) => block.content.length > 0);
    };

    const parseJson = (value) => {
      if (!value.trim()) {
        return null;
      }

      try {
        return JSON.parse(value);
      } catch (error) {
        return { error: "JSON 解析失败", raw: value };
      }
    };

    sendButton.addEventListener("click", () => {
      const payload = {
        title: document.getElementById("title").value.trim(),
        subtitle: document.getElementById("subtitle").value.trim(),
        summary: document.getElementById("summary").value.trim(),
        blocks: collectBlocks(),
        json: parseJson(document.getElementById("jsonData").value),
        image: imagePreview.dataset.image || null
      };

      sessionStorage.setItem("transfer_payload", JSON.stringify(payload));
      window.location.href = "transfer_b.html";
    });

    resetButton.addEventListener("click", () => {
      document.getElementById("title").value = "";
      document.getElementById("subtitle").value = "";
      document.getElementById("summary").value = "";
      document.getElementById("jsonData").value = "";
      imageInput.value = "";
      imagePreview.style.display = "none";
      imageElement.src = "";
      imageMeta.textContent = "";
      imagePreview.dataset.image = "";
      blockList.innerHTML = "";
      addBlock();
      addBlock();
    });
  </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
