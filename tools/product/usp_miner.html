<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品卖点提炼器 (USP Miner)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                    <i class="fa-solid fa-gem text-blue-600 text-xl"></i>
                    <span class="font-bold text-xl text-slate-900">USP Miner</span>
                </div>
                <button @click="showSettings = true"
                    class="text-slate-500 hover:text-blue-600 flex items-center gap-1 text-sm font-medium"><i
                        class="fa-solid fa-gear"></i> 设置</button>
            </div>
        </nav>

        <div class="flex-grow flex flex-col md:flex-row overflow-hidden h-[calc(100vh-4rem)]">
            <!-- Input -->
            <div class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-slate-200 p-5 overflow-y-auto space-y-5 z-20">
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700">我的产品</label>
                    <textarea v-model="input.product" rows="3" placeholder="名称、核心功能、适用场景..."
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700">竞品信息 (对手)</label>
                    <textarea v-model="input.competitor" rows="3" placeholder="对手是谁？他们主打什么？缺点是什么？"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700">目标用户</label>
                    <input type="text" v-model="input.target" placeholder="例如：追求性价比的学生党"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button @click="analyzeUSP" :disabled="isAnalyzing || !input.product"
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow hover:bg-blue-700 disabled:opacity-50 flex items-center justify-center gap-2">
                    <i v-if="isAnalyzing" class="fa-solid fa-spinner fa-spin"></i> <span v-else>挖掘差异化卖点</span>
                </button>
            </div>

            <!-- Output -->
            <div class="flex-grow bg-slate-50 p-6 md:p-10 overflow-y-auto">
                <div v-if="!result" class="h-full flex flex-col items-center justify-center text-slate-400">
                    <i class="fa-solid fa-file-code text-6xl mb-4 opacity-50"></i>
                    <p>找不到产品卖点？输入信息，让 AI 帮你定位。</p>
                </div>

                <div v-else class="max-w-4xl mx-auto space-y-6 animate-fade-in">
                    <!-- 核心 Slogan -->
                    <div
                        class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-8 text-white shadow-lg text-center">
                        <h2 class="text-3xl font-black mb-2">"{{ result.killer_slogan }}"</h2>
                        <p class="opacity-90 text-sm">一句话击穿痛点的超级 Slogan</p>
                    </div>

                    <!-- 差异化对比 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i
                                class="fa-solid fa-chess-knight text-blue-500"></i> 差异化战局分析</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-4 bg-red-50 rounded-xl border border-red-100">
                                <h4 class="font-bold text-red-800 mb-2">竞品弱点 / 市场空白</h4>
                                <ul class="list-disc list-inside text-sm text-slate-600 space-y-1">
                                    <li v-for="weak in result.competitor_weaknesses" :key="weak">{{ weak }}</li>
                                </ul>
                            </div>
                            <div class="p-4 bg-green-50 rounded-xl border border-green-100">
                                <h4 class="font-bold text-green-800 mb-2">我方绝对优势 (USP)</h4>
                                <ul class="list-disc list-inside text-sm text-slate-600 space-y-1">
                                    <li v-for="adv in result.our_advantages" :key="adv">{{ adv }}</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- 3个核心卖点卡片 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div v-for="(point, idx) in result.selling_points" :key="idx"
                            class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
                            <div
                                class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center font-bold mb-4">
                                0{{ idx + 1 }}</div>
                            <h4 class="font-bold text-lg text-slate-900 mb-2">{{ point.title }}</h4>
                            <p class="text-sm text-slate-500 leading-relaxed">{{ point.desc }}</p>
                            <div class="mt-4 p-2 bg-slate-50 text-xs text-slate-600 rounded border border-slate-100">
                                话术示例: "{{ point.pitch }}"
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-md p-6">
                <h3 class="font-bold mb-4">API 设置</h3>
                <input type="password" v-model="apiConfig.deepseek" class="w-full border p-2 rounded mb-4"
                    placeholder="DeepSeek Key">
                <div class="flex justify-end gap-2">
                    <button @click="showSettings=false" class="px-4 py-2 text-slate-500">取消</button>
                    <button @click="saveConfig" class="bg-blue-600 text-white px-4 py-2 rounded">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted, nextTick } = Vue;
        createApp({
            setup() {
                // Removed renderIcon as Font Awesome is used via CSS classes

                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-pro' }); // Default to V4 Pro for deep analysis
                const input = reactive({ product: '', competitor: '', target: '' });
                const isAnalyzing = ref(false);
                const result = ref(null);

                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                });

                const saveConfig = () => {
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...JSON.parse(localStorage.getItem('global_llm_config') || '{}'), ...apiConfig.value }));
                    showSettings.value = false;
                };

                const analyzeUSP = async () => {
                    if (!apiConfig.value.deepseek) return showSettings.value = true;
                    isAnalyzing.value = true;
                    try {
                        const prompt = `请分析以下产品信息，提炼最具竞争力的 USP (Unique Selling Proposition)。
我方产品：${input.product}
竞品情况：${input.competitor}
目标用户：${input.target}

请返回 JSON：
{
  "killer_slogan": "一句极具杀伤力的Slogan（15字以内）",
  "competitor_weaknesses": ["竞品痛点1", "竞品痛点2"],
  "our_advantages": ["我方优势1", "我方优势2"],
  "selling_points": [
    { "title": "卖点1标题", "desc": "详细解释", "pitch": "销售话术示例" },
    { "title": "卖点2标题", "desc": "详细解释", "pitch": "销售话术示例" },
    { "title": "卖点3标题", "desc": "详细解释", "pitch": "销售话术示例" }
  ]
}`;
                        const res = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.value.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.value.model,
                                messages: [{ role: "system", content: "You are a marketing strategist. Return JSON only." }, { role: "user", content: prompt }],
                                response_format: { type: 'json_object' }
                            })
                        });
                        const data = await res.json();
                        result.value = JSON.parse(data.choices[0].message.content);
                    } catch (e) { alert('分析失败: ' + e.message); }
                };

                return {
                    showSettings, apiConfig, saveConfig, input, isAnalyzing, result, analyzeUSP
                };
            }
        }).mount('#app');
    </script>


<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/product_usp_miner.md"></script>

    </body>

</html>
