    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品展示图生成器 - 电商精修助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fff5eb 0%, #ffedd5 50%, #fed7aa 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .product-card {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(249, 115, 22, 0.3);
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }

            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        .shine-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 3s infinite;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="min-h-screen p-4">
    <div x-data="productApp()" x-init="init()" class="max-w-7xl mx-auto">
        <!-- 导航栏 -->
        <nav class="glass rounded-2xl shadow-2xl mb-6 p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                    <div class="p-2 bg-gradient-to-br from-orange-500 to-amber-500 rounded-xl">
                        <i class="fa-solid fa-box-open text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-2xl text-slate-900">产品展示图生成器</h1>
                        <p class="text-sm text-slate-500">电商精修、AI场景合成、一键出图</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <!-- 当前模型显示 -->
                    <div class="flex items-center gap-2 px-3 py-2 bg-orange-50 rounded-lg border border-orange-200">
                        <i class="fa-solid fa-microchip text-orange-600 text-xs"></i>
                        <span class="text-xs text-orange-600">当前:</span>
                        <span class="text-sm font-medium text-orange-900" x-text="getModelDisplayName()"></span>
                    </div>
                    <button @click="showSettings = true"
                        class="flex items-center gap-2 px-4 py-2 bg-orange-100 hover:bg-orange-200 rounded-lg transition">
                        <i class="fa-solid fa-gear text-orange-600 text-sm"></i>
                        <span class="text-sm font-medium">模型配置</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：配置面板 -->
            <div class="lg:col-span-1 space-y-6">
                <!-- 产品图片上传 -->
                <div class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-slate-900">
                        <i class="fa-solid fa-arrow-up-from-bracket text-orange-600"></i>
                        上传产品图
                    </h3>

                    <div @click="$refs.productInput.click()"
                        class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-orange-400 transition">
                        <div x-show="!productImage">
                            <i class="fa-solid fa-image text-4xl mx-auto text-slate-400 mb-3"></i>
                            <p class="text-sm text-slate-600 mb-2">点击上传产品照片</p>
                            <p class="text-xs text-slate-400">建议：白底或干净背景</p>
                        </div>
                        <div x-show="productImage" class="relative">
                            <img :src="productImage" class="max-h-48 mx-auto rounded-lg shadow">
                            <button @click.stop="productImage = null; productImageBase64 = null"
                                class="absolute top-2 right-2 p-1.5 bg-red-500 text-white rounded-full hover:bg-red-600 flex items-center justify-center">
                                <i class="fa-solid fa-xmark text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                    <input type="file" x-ref="productInput" @change="handleImageUpload($event)" accept="image/*"
                        class="hidden">
                </div>

                <!-- 场景选择 -->
                <div class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-slate-900">
                        <i class="fa-solid fa-wand-magic-sparkles text-orange-600"></i>
                        场景选择
                    </h3>
                    <div class="space-y-2">
                        <template x-for="scene in scenes" :key="scene.id">
                            <button @click="selectedScene = scene.id"
                                :class="selectedScene === scene.id ? 'bg-orange-500 text-white ring-2 ring-orange-300' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200'"
                                class="w-full text-left p-4 rounded-lg transition flex items-start gap-3">
                                <div :class="selectedScene === scene.id ? 'bg-white/20' : 'bg-orange-50'"
                                    class="p-2 rounded-lg flex items-center justify-center w-9 h-9">
                                    <i
                                        :class="[scene.icon, selectedScene === scene.id ? 'text-white' : 'text-orange-600']"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="font-medium mb-1" x-text="scene.name"></div>
                                    <div :class="selectedScene === scene.id ? 'text-white/80' : 'text-slate-500'"
                                        class="text-xs" x-text="scene.desc"></div>
                                </div>
                                <i x-show="selectedScene === scene.id" class="fa-solid fa-circle-check text-white"></i>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- 促销标签 -->
                <div class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-slate-900">
                        <i class="fa-solid fa-tag text-orange-600"></i>
                        促销标签
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="flex items-center gap-2 text-sm text-slate-700 mb-3">
                                <input type="checkbox" x-model="addPromoTag" class="rounded">
                                <span>添加促销标签</span>
                            </label>
                        </div>

                        <div x-show="addPromoTag" class="space-y-3">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">标签类型</label>
                                <select x-model="promoType"
                                    class="w-full rounded-lg border-slate-200 border p-2 text-sm">
                                    <option value="discount">折扣优惠</option>
                                    <option value="newproduct">新品上市</option>
                                    <option value="bestseller">热卖爆款</option>
                                    <option value="limited">限时抢购</option>
                                    <option value="custom">自定义</option>
                                </select>
                            </div>

                            <div x-show="promoType === 'custom'">
                                <label class="block text-sm font-medium text-slate-700 mb-2">标签文字</label>
                                <input type="text" x-model="customPromoText" placeholder="例如：满100减20"
                                    class="w-full rounded-lg border-slate-200 border p-2 text-sm">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 生成按钮 -->
                <button @click="generate()" :disabled="isGenerating || !productImage"
                    :class="isGenerating ? 'bg-slate-400' : 'bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600'"
                    class="w-full text-white font-bold py-4 rounded-xl transition disabled:opacity-50 disabled:cursor-not-allowed shadow-lg flex items-center justify-center gap-2">
                    <i
                        :class="isGenerating ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-wand-magic-sparkles text-lg'"></i>
                    <span x-text="isGenerating ? '生成中...' : '生成精修图'"></span>
                </button>

                <div class="p-4 bg-orange-50 rounded-lg border border-orange-200">
                    <div class="flex items-start gap-2">
                        <i class="fa-solid fa-lightbulb text-orange-600 mt-0.5"></i>
                        <div class="text-sm text-orange-900">
                            <div class="font-medium mb-1">使用技巧</div>
                            <ul class="text-xs space-y-1 opacity-75">
                                <li>• 白底图效果最佳</li>
                                <li>• 可选择不同场景快速出图</li>
                                <li>• 支持添加促销标签</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：结果展示 -->
            <div class="lg:col-span-2">
                <div class="glass rounded-2xl shadow-xl p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-bold text-xl flex items-center gap-2 text-slate-900">
                            <i class="fa-solid fa-images text-orange-600"></i>
                            精修成品
                        </h3>
                        <div x-show="result" class="flex gap-2">
                            <button @click="downloadImage()"
                                class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center gap-2 text-sm">
                                <i class="fa-solid fa-download text-xs text-white"></i>
                                下载图片
                            </button>
                            <button @click="regenerate()"
                                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex items-center gap-2 text-sm">
                                <i class="fa-solid fa-rotate text-xs text-white"></i>
                                重新生成
                            </button>
                        </div>
                    </div>

                    <!-- 空状态 -->
                    <div x-show="!result && !isGenerating"
                        class="flex flex-col items-center justify-center py-20 text-slate-400">
                        <i class="fa-solid fa-box-open text-6xl mb-4 opacity-50"></i>
                        <p class="text-lg font-medium">还没有生成图片</p>
                        <p class="text-sm">上传产品图后开始创作</p>
                    </div>

                    <!-- 加载状态 -->
                    <div x-show="isGenerating" class="flex flex-col items-center justify-center py-20">
                        <div class="relative">
                            <div class="w-32 h-32 border-8 border-orange-200 rounded-full"></div>
                            <div
                                class="absolute top-0 left-0 w-32 h-32 border-8 border-orange-500 rounded-full border-t-transparent animate-spin">
                            </div>
                        </div>
                        <p class="text-slate-600 mt-6 font-medium">AI精修中...</p>
                        <p class="text-slate-400 text-sm mt-2">正在生成专业级产品展示图</p>
                    </div>

                    <!-- 结果展示 -->
                    <div x-show="result && !isGenerating">
                        <div class="product-card glass rounded-xl overflow-hidden shine-effect">
                            <img :src="result?.url" class="w-full">
                            <div class="p-6 border-t border-slate-100">
                                <div class="flex items-center justify-between mb-4">
                                    <div>
                                        <div class="text-sm text-slate-500">场景</div>
                                        <div class="font-medium text-slate-900" x-text="getSceneName()"></div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-sm text-slate-500">分辨率</div>
                                        <div class="font-medium text-slate-900">1024x1024</div>
                                    </div>
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <button @click="downloadImage()"
                                        class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg transition text-sm flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-download text-xs"></i>
                                        下载
                                    </button>
                                    <button @click="copyImage()"
                                        class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg transition text-sm flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-copy text-xs"></i>
                                        复制
                                    </button>
                                    <button @click="viewFullscreen()"
                                        class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg transition text-sm flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-expand text-xs"></i>
                                        预览
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div x-show="showSettings" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div @click.away="showSettings = false" class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6">
                <h3 class="text-xl font-bold mb-6 flex items-center gap-2 text-slate-900">
                    <i class="fa-solid fa-gear text-orange-600"></i>
                    模型配置
                </h3>

                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">图像生成模型</label>
                        <select x-model="apiConfig.model"
                            class="w-full rounded-lg border-slate-300 border p-3 bg-white">
                            <optgroup label="豆包 (Doubao)">
                                <option value="doubao-seedream-4.5">Doubao-Seedream-4.5（推荐）</option>
                                <option value="doubao-seedream-4.0">Doubao-Seedream-4.0</option>
                            </optgroup>
                            <optgroup label="谷歌 (Google)">
                                <option value="nanobanana-flash">Nano Banana (2.5 Flash)</option>
                                <option value="nanobanana-pro">Nano Banana Pro (3.0 Pro)</option>
                                <option value="imagen-3">Imagen 3</option>
                            </optgroup>
                            <optgroup label="OpenRouter">
                                <option value="openrouter-dalle3">DALL-E 3</option>
                                <option value="openrouter-flux">FLUX.1 Schnell</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- 豆包配置 -->
                    <div x-show="apiConfig.model.startsWith('doubao')" class="space-y-3 p-4 bg-orange-50 rounded-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-orange-600 font-medium">豆包 (Doubao) 配置</span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                API Key
                                <a href="https://console.volcengine.com/ark" target="_blank"
                                    class="text-xs text-blue-600 ml-2">获取Key</a>
                            </label>
                            <input type="password" x-model="apiConfig.apiKey" placeholder="输入火山引擎 API Key"
                                class="w-full rounded-lg border-slate-300 border p-3">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Endpoint ID</label>
                            <input type="text" x-model="apiConfig.endpointId" placeholder="ep-20241203xxxxxx"
                                class="w-full rounded-lg border-slate-300 border p-3">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">分辨率</label>
                                <select x-model="apiConfig.size"
                                    class="w-full rounded-lg border-slate-300 border p-3 bg-white">
                                    <option value="2K">2K</option>
                                    <option value="4K">4K</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">水印</label>
                                <select x-model="apiConfig.watermark"
                                    class="w-full rounded-lg border-slate-300 border p-3 bg-white">
                                    <option :value="true">关闭水印</option>
                                    <option :value="false">开启水印</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 谷歌配置 (共用) -->
                    <div x-show="apiConfig.model.startsWith('nanobanana') || apiConfig.model === 'imagen-3'"
                        class="space-y-3 p-4 bg-blue-50 rounded-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-blue-600 font-medium">谷歌 (Google) 配置</span>
                            <span class="text-xs text-slate-500">(Nano Banana / Imagen 共用)</span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                API Key
                                <a href="https://aistudio.google.com/apikey" target="_blank"
                                    class="text-xs text-blue-600 ml-2">获取Key</a>
                            </label>
                            <input type="password" x-model="apiConfig.googleApiKey" placeholder="输入 Google API Key"
                                class="w-full rounded-lg border-slate-300 border p-3">
                        </div>
                    </div>

                    <!-- OpenRouter配置 -->
                    <div x-show="apiConfig.model.startsWith('openrouter')" class="space-y-3 p-4 bg-green-50 rounded-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-green-600 font-medium">OpenRouter 配置</span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                API Key
                                <a href="https://openrouter.ai/keys" target="_blank"
                                    class="text-xs text-blue-600 ml-2">获取Key</a>
                            </label>
                            <input type="password" x-model="apiConfig.openrouterApiKey"
                                placeholder="输入 OpenRouter API Key"
                                class="w-full rounded-lg border-slate-300 border p-3">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3">
                    <button @click="showSettings = false"
                        class="px-6 py-2 hover:bg-slate-100 rounded-lg text-slate-700">
                        取消
                    </button>
                    <button @click="saveConfig()"
                        class="bg-orange-600 text-white px-6 py-2 rounded-lg hover:bg-orange-700">
                        保存配置
                    </button>
                </div>
            </div>
        </div>

        <!-- 全屏预览 -->
        <div x-show="fullscreenImage" @click="fullscreenImage = null"
            class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
            <img :src="fullscreenImage" class="max-w-full max-h-full rounded-lg">
            <button @click.stop="fullscreenImage = null"
                class="absolute top-4 right-4 p-2 bg-white/20 hover:bg-white/30 rounded-lg backdrop-blur-sm flex items-center justify-center">
                <i class="fa-solid fa-xmark text-xl text-white"></i>
            </button>
        </div>
    </div>

    <script>
        function productApp() {
            return {
                // 状态
                showSettings: false,
                isGenerating: false,
                fullscreenImage: null,

                // 数据
                productImage: null,
                productImageBase64: null,
                result: null,
                selectedScene: 'clean',
                addPromoTag: false,
                promoType: 'discount',
                customPromoText: '',

                // 配置
                apiConfig: {
                    model: 'doubao-seedream-4.5',
                    apiKey: '',
                    endpointId: 'doubao-seedream-4-5-251128',
                    disableWatermark: true,
                    size: '2K',
                    googleApiKey: '',
                    openrouterApiKey: ''
                },

                // 场景列表
                scenes: [
                    { id: 'clean', name: '简约白底', desc: '电商主图标准款', icon: 'fa-solid fa-square' },
                    { id: 'desk', name: '书桌场景', desc: '文创、办公用品', icon: 'fa-solid fa-house-laptop' },
                    { id: 'coffee', name: '咖啡桌', desc: '生活方式、美学', icon: 'fa-solid fa-mug-hot' },
                    { id: 'outdoor', name: '户外自然', desc: '户外、运动产品', icon: 'fa-solid fa-tree' },
                    { id: 'floating', name: '悬浮特效', desc: '科技感、创新产品', icon: 'fa-solid fa-wand-magic-sparkles' },
                    { id: 'lifestyle', name: '生活场景', desc: '家居、日用品', icon: 'fa-solid fa-house-chimney' }
                ],

                // 初始化
                init() {
                    this.loadConfig();
                    // 初始化图标已由 Font Awesome 自动处理

                    // 监听模型变化，自动更新接入点 ID
                    this.$watch('apiConfig.model', value => {
                        if (value === 'doubao-seedream-4.5') {
                            this.apiConfig.endpointId = 'doubao-seedream-4-5-251128';
                        } else if (value === 'doubao-seedream-4.0') {
                            this.apiConfig.endpointId = 'doubao-seedream-4-0-250828';
                        }
                    });
                },

                // 加载配置
                loadConfig() {
                    const saved = localStorage.getItem('product_showcase_config');
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            this.apiConfig = { ...this.apiConfig, ...data };
                        } catch (e) {
                            console.error('解析配置失败:', e);
                        }
                    }
                },

                // 保存配置
                saveConfig() {
                    localStorage.setItem('product_showcase_config', JSON.stringify(this.apiConfig));
                    this.showSettings = false;
                },

                // 获取模型显示名称
                getModelDisplayName() {
                    const names = {
                        'doubao-seedream-4.5': 'Doubao-Seedream-4.5',
                        'doubao-seedream-4.0': 'Doubao-Seedream-4.0',
                        'nanobanana-flash': 'Nano Banana',
                        'nanobanana-pro': 'Nano Banana Pro',
                        'imagen-3': 'Imagen 3',
                        'openrouter-dalle3': 'DALL-E 3',
                        'openrouter-flux': 'FLUX.1'
                    };
                    return names[this.apiConfig.model] || '未配置';
                },

                // 处理图片上传
                handleImageUpload(event) {
                    const file = event.target.files[0];
                    if (file && file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.productImage = e.target.result;
                            this.productImageBase64 = e.target.result.split(',')[1];
                        };
                        reader.readAsDataURL(file);
                    }
                },

                // 主生成函数
                async generate() {
                    // 验证配置
                    if (this.apiConfig.model.startsWith('doubao')) {
                        if (!this.apiConfig.apiKey || !this.apiConfig.endpointId) {
                            this.showSettings = true;
                            alert('请先配置豆包 API Key');
                            return;
                        }
                    } else if (this.apiConfig.model.startsWith('nanobanana') || this.apiConfig.model === 'imagen-3') {
                        if (!this.apiConfig.googleApiKey) {
                            this.showSettings = true;
                            alert('请先配置 Google API Key');
                            return;
                        }
                    } else if (this.apiConfig.model.startsWith('openrouter')) {
                        if (!this.apiConfig.openrouterApiKey) {
                            this.showSettings = true;
                            alert('请先配置 OpenRouter API Key');
                            return;
                        }
                    }

                    this.isGenerating = true;

                    try {
                        const scene = this.scenes.find(s => s.id === this.selectedScene);
                        let prompt = `Product photography: ${scene.desc}.

High-quality, professional, 4K resolution, studio lighting.
Background: ${scene.name}.
Style: Clean, modern, e-commerce product shot.`;

                        if (this.addPromoTag) {
                            const promoTexts = {
                                'discount': 'Add promotion tag: "Special Discount"',
                                'newproduct': 'Add promotion tag: "New Arrival"',
                                'bestseller': 'Add promotion tag: "Best Seller"',
                                'limited': 'Add promotion tag: "Limited Time"',
                                'custom': `Add promotion tag: "${this.customPromoText}"`
                            };
                            prompt += `\n${promoTexts[this.promoType]}`;
                        }

                        this.result = await this.callImageAPI(prompt);
                    } catch (error) {
                        console.error('生成失败:', error);
                        alert(error.message || '生成失败，请重试');
                    } finally {
                        this.isGenerating = false;
                    }
                },

                // 调用图像生成API
                async callImageAPI(prompt) {
                    if (this.apiConfig.model.startsWith('doubao')) {
                        return await this.callDoubaoAPI(prompt);
                    } else if (this.apiConfig.model.startsWith('nanobanana') || this.apiConfig.model === 'imagen-3') {
                        return await this.callGoogleAPI(prompt);
                    } else if (this.apiConfig.model.startsWith('openrouter')) {
                        return await this.callOpenRouterAPI(prompt);
                    }
                    throw new Error('未选择的模型');
                },

                // 豆包 API
                async callDoubaoAPI(prompt) {
                    const requestBody = {
                        model: this.apiConfig.endpointId,
                        prompt: prompt,
                        size: this.apiConfig.size || '2K',
                        watermark: !this.apiConfig.disableWatermark,
                        quality: 'hd',
                        reference_image: this.productImageBase64,
                        strength: 0.7
                    };

                    const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiConfig.apiKey}`
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(`API错误: ${errorData.error?.message || errorData.message || response.status}`);
                    }

                    const data = await response.json();

                    if (data.data && data.data[0]) {
                        const imageData = data.data[0];
                        return {
                            url: imageData.url || `data:image/jpeg;base64,${imageData.b64_json}`,
                            prompt: prompt,
                            timestamp: Date.now()
                        };
                    }

                    throw new Error('API返回格式错误');
                },

                // 谷歌 API (Nano Banana / Imagen)
                async callGoogleAPI(prompt) {
                    const apiKey = this.apiConfig.googleApiKey;

                    let modelId;
                    if (this.apiConfig.model === 'nanobanana-flash') {
                        modelId = 'gemini-2.5-flash-image';
                    } else if (this.apiConfig.model === 'nanobanana-pro') {
                        modelId = 'gemini-3-pro-image-preview';
                    } else {
                        modelId = 'imagen-3.0-generate-001';
                    }

                    const sizeMap = {
                        '2K': { width: 2048, height: 2048 },
                        '4K': { width: 4096, height: 2160 }
                    };

                    const size = sizeMap[this.apiConfig.size] || { width: 1024, height: 1024 };

                    if (modelId === 'imagen-3.0-generate-001') {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateImages?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: prompt,
                                imageSize: { width: size.width, height: size.height },
                                generateImageResponse: { mimeType: 'image/png' }
                            })
                        });

                        if (!response.ok) {
                            const error = await response.json().catch(() => ({}));
                            throw new Error(error.error?.message || `API Error: ${response.status}`);
                        }

                        const data = await response.json();
                        if (data.generatedImages && data.generatedImages[0]) {
                            return {
                                url: `data:image/png;base64,${data.generatedImages[0].generatedImage}`,
                                prompt: prompt,
                                timestamp: Date.now()
                            };
                        }
                    } else {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: {
                                    responseModalities: ['IMAGE'],
                                    imageGenerationConfig: {
                                        width: size.width,
                                        height: size.height,
                                        outputCompressionQuality: 90,
                                        outputFormat: 'PNG'
                                    }
                                }
                            })
                        });

                        if (!response.ok) {
                            const error = await response.json().catch(() => ({}));
                            throw new Error(error.error?.message || `API Error: ${response.status}`);
                        }

                        const data = await response.json();

                        if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                            for (const part of data.candidates[0].content.parts) {
                                if (part.inlineData && part.inlineData.data) {
                                    return {
                                        url: `data:image/png;base64,${part.inlineData.data}`,
                                        prompt: prompt,
                                        timestamp: Date.now()
                                    };
                                }
                            }
                        }
                    }

                    throw new Error('API 返回格式错误');
                },

                // OpenRouter API
                async callOpenRouterAPI(prompt) {
                    const apiKey = this.apiConfig.openrouterApiKey;

                    let model, size;
                    if (this.apiConfig.model === 'openrouter-dalle3') {
                        model = 'dall-e-3';
                        size = '1024x1024';
                    } else {
                        model = 'black-forest-labs/FLUX.1-schnell';
                        size = '1024x1024';
                    }

                    const requestBody = {
                        model: model,
                        prompt: prompt,
                        n: 1,
                        size: size
                    };

                    const response = await fetch('https://openrouter.ai/api/v1/images/generations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`,
                            'HTTP-Referer': window.location.origin,
                            'X-Title': 'AI Content Suite'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();

                    if (data.data && data.data[0]) {
                        return {
                            url: data.data[0].url || `data:image/png;base64,${data.data[0].b64_json}`,
                            prompt: prompt,
                            timestamp: Date.now()
                        };
                    }

                    throw new Error('API 返回格式错误');
                },

                // 调用图像生成API（图生图模式）
                async callImageAPI(prompt) {
                    const requestBody = {
                        model: this.apiConfig.endpointId,
                        prompt: prompt,
                        size: this.apiConfig.size || '2K',
                        watermark: !this.apiConfig.disableWatermark,
                        quality: 'hd',
                        // 对于火山引擎 Seedream，通常使用 reference_image 字段
                        reference_image: this.productImageBase64,
                        strength: 0.7
                    };

                    const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiConfig.apiKey}`
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(`API错误: ${errorData.error?.message || errorData.message || response.status}`);
                    }

                    const data = await response.json();

                    if (data.data && data.data[0]) {
                        const imageData = data.data[0];
                        return {
                            url: imageData.url || `data:image/jpeg;base64,${imageData.b64_json}`,
                            prompt: prompt,
                            timestamp: Date.now()
                        };
                    }

                    throw new Error('API返回格式错误');
                },

                // 获取场景名称
                getSceneName() {
                    const scene = this.scenes.find(s => s.id === this.selectedScene);
                    return scene ? scene.name : '';
                },

                // 重新生成
                regenerate() {
                    this.generate();
                },

                // 下载图片
                downloadImage() {
                    if (this.result) {
                        const a = document.createElement('a');
                        a.href = this.result.url;
                        a.download = `product_${this.result.timestamp}.png`;
                        a.click();
                    }
                },

                // 复制图片
                async copyImage() {
                    try {
                        const response = await fetch(this.result.url);
                        const blob = await response.blob();
                        await navigator.clipboard.write([
                            new ClipboardItem({ [blob.type]: blob })
                        ]);
                        alert('已复制到剪贴板');
                    } catch (err) {
                        alert('复制失败，请尝试下载');
                    }
                },

                // 全屏预览
                viewFullscreen() {
                    this.fullscreenImage = this.result.url;
                }
            }
        }
    </script>
