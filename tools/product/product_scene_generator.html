        body {
            background: linear-gradient(135deg, #0f766e 0%, #14b8a6 50%, #5eead4 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            transition: all 0.3s ease;

        .scene-card:hover {
            transform: translateY(-4px);
        }

        .scene-card.selected {
            ring: 4px;
            ring-color: #14b8a6;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .loading-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;

    <script>
        function productSceneGen() {
            return {
                showSettings: false,
                isGenerating: false,
                generatedCount: 0,
                totalCount: 0,
                progress: 0,
                productImage: null,
                productImageBase64: null,
                scene: 'lifestyle',
                scenePrompt: '',
                batchCount: 1,
                model: 'doubao-seedream-4.5',
                results: [],

                apiConfig: {
                    apiKey: '',
                    endpointId: 'doubao-seedream-4-5-251128',
                    size: '2K',
                    disableWatermark: true
                },
                googleApiKey: '',
                openrouterApiKey: '',

                init() {
                    this.loadConfig();
                    // 初始化图标已由 Font Awesome 自动处理
                },

                loadConfig() {
                    const saved = localStorage.getItem('product_scene_config');
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            this.model = data.model || this.model;
                            this.apiConfig = { ...this.apiConfig, ...data.apiConfig };
                            this.googleApiKey = data.googleApiKey || '';
                            this.openrouterApiKey = data.openrouterApiKey || '';
                        } catch (e) {
                            console.error('解析配置失败:', e);
                        }
                    }
                    // 从全局配置读取 API Key 作为 fallback
                    const globalConfig = localStorage.getItem('global_llm_config');
                    if (globalConfig) {
                        try {
                            const parsed = JSON.parse(globalConfig);
                            if (!this.googleApiKey && parsed.google) {
                                this.googleApiKey = parsed.google;
                            }
                        } catch (e) {
                            console.error('解析全局配置失败:', e);
                        }
                    }
                },

                saveConfig() {
                    localStorage.setItem('product_scene_config', JSON.stringify({
                        model: this.model,
                        apiConfig: this.apiConfig,
                        googleApiKey: this.googleApiKey,
                        openrouterApiKey: this.openrouterApiKey
                    }));
                    this.showSettings = false;
                },

                getModelDisplayName() {
                    const names = {
                        'doubao-seedream-4.5': '豆包 Seedream 4.5',
                        'doubao-seedream-4.0': '豆包 Seedream 4.0',
                        'nanobanana-flash': 'Nano Banana (2.5 Flash)',
                        'nanobanana-pro': 'Nano Banana Pro',
                        'google-imagen': '谷歌 Imagen 3',
                        'openrouter-dalle3': 'OpenRouter DALL-E 3'
                    };
                    return names[this.model] || '未配置';
                },

                handleProductImageUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.productImage = e.target.result;
                            this.productImageBase64 = e.target.result.split(',')[1];
                        };
                        reader.readAsDataURL(file);
                    }
                },

                canGenerate() {
                    return this.productImage && this.scenePrompt.trim() !== '';
                },

                async generate() {
                    this.isGenerating = true;
                    this.results = [];
                    this.generatedCount = 0;
                    this.totalCount = this.batchCount;

                    try {
                        for (let i = 0; i < this.batchCount; i++) {
                            const prompt = this.buildPrompt();
                            const result = await this.callImageAPI(prompt);
                            if (result) {
                                this.results.push({
                                    ...result,
                                    scene: this.getSceneName(),
                                    timestamp: Date.now()
                                });
                            }
                            this.generatedCount++;
                        }
                    } catch (error) {
                        alert(error.message || '生成失败');
                    } finally {
                        this.isGenerating = false;
                    }
                },

                buildPrompt() {
                    const sceneDescriptions = {
                        'lifestyle': 'A natural lifestyle scene showing the product in everyday use. Warm, inviting atmosphere with soft natural lighting. The product is organically integrated into the scene.',
                        'studio': 'Professional studio product photography. Clean, high-end commercial look with dramatic lighting. The product is the clear focus with perfect composition.',
                        'outdoor': 'Outdoor natural scene with the product. Sunlight filtering through trees, natural environment, fresh air feeling. The product blends naturally with nature.',
                        'indoor': 'Cozy indoor home setting. Warm ambient lighting, comfortable furniture, homey atmosphere. The product shown in a realistic living environment.',
                        'minimal': 'Clean minimal studio setting with solid colored background. Simple, elegant, focus solely on the product. Modern e-commerce style.',
                        'creative': 'Creative and dreamy composition with surreal elements. Magical atmosphere, unique visual impact, artistic interpretation of the product.'
                    };

                    return `${sceneDescriptions[this.scene]}

Product reference image will be integrated into this scene.

Additional scene details: ${this.scenePrompt}

The product should be naturally placed in the scene, maintaining its original appearance while being contextually appropriate. High quality, professional photography look.`;
                },

                getSceneName() {
                    const names = {
                        'lifestyle': '生活场景',
                        'studio': '专业棚拍',
                        'outdoor': '户外场景',
                        'indoor': '室内家居',
                        'minimal': '极简纯色',
                        'creative': '创意合成'
                    };
                    return names[this.scene] || this.scene;
                },

                async callImageAPI(prompt) {
                    if (this.model.startsWith('doubao')) {
                        return await this.callDoubaoAPI(prompt);
                    } else if (this.model.startsWith('nanobanana')) {
                        return await this.callNanoBananaAPI(prompt);
                    } else if (this.model === 'google-imagen') {
                        return await this.callGoogleAPI(prompt);
                    } else if (this.model === 'openrouter-dalle3') {
                        return await this.callOpenRouterAPI(prompt);
                    }
                    throw new Error('未选择的模型');
                },

                async callNanoBananaAPI(prompt) {
                    if (!this.googleApiKey) throw new Error('请先配置 Google API Key');

                    const modelId = this.model === 'nanobanana-pro' ? 'gemini-3-pro-image-preview' : 'gemini-2.5-flash-image';

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${this.googleApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: {
                                responseModalities: ['IMAGE'],
                                imageGenerationConfig: {
                                    width: 1024,
                                    height: 1024,
                                    outputCompressionQuality: 90,
                                    outputFormat: 'PNG'
                                }
                            }
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();

                    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                        for (const part of data.candidates[0].content.parts) {
                            if (part.inlineData && part.inlineData.data) {
                                return {
                                    url: `data:image/png;base64,${part.inlineData.data}`,
                                    base64: part.inlineData.data,
                                    model: 'Nano Banana'
                                };
                            }
                        }
                    }
                    throw new Error('API 返回格式错误');
                },

                async callDoubaoAPI(prompt) {
                    if (!this.apiConfig.apiKey) throw new Error('请先配置 API Key');

                    const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiConfig.apiKey}`
                        },
                        body: JSON.stringify({
                            model: this.apiConfig.endpointId,
                            prompt: prompt,
                            size: this.apiConfig.size === '2K' ? '2048x2048' : '4096x2160',
                            watermark: !this.apiConfig.disableWatermark,
                            reference_image: this.productImageBase64
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    if (data.data && data.data[0]) {
                        return {
                            url: data.data[0].url || `data:image/png;base64,${data.data[0].b64_json}`,
                            base64: data.data[0].b64_json,
                            model: '豆包 Seedream'
                        };
                    }
                    throw new Error('API 返回格式错误');
                },

                async callGoogleAPI(prompt) {
                    if (!this.googleApiKey) throw new Error('请先配置谷歌 API Key');

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-001:generateImages?key=${this.googleApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: prompt,
                            imageSize: { width: 1024, height: 1024 },
                            generateImageResponse: { mimeType: 'image/png' }
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    if (data.generatedImages && data.generatedImages[0]) {
                        return {
                            url: `data:image/png;base64,${data.generatedImages[0].generatedImage}`,
                            base64: data.generatedImages[0].generatedImage,
                            model: '谷歌 Imagen'
                        };
                    }
                    throw new Error('API 返回格式错误');
                },

                async callOpenRouterAPI(prompt) {
                    if (!this.openrouterApiKey) throw new Error('请先配置 OpenRouter API Key');

                    const response = await fetch('https://openrouter.ai/api/v1/images/generations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.openrouterApiKey}`,
                            'HTTP-Referer': window.location.origin
                        },
                        body: JSON.stringify({
                            model: 'dall-e-3',
                            prompt: prompt,
                            n: 1,
                            size: '1024x1024'
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    if (data.data && data.data[0]) {
                        return {
                            url: data.data[0].url,
                            base64: data.data[0].b64_json,
                            model: 'DALL-E 3'
                        };
                    }
                    throw new Error('API 返回格式错误');
                },

                downloadImage(result) {
                    const a = document.createElement('a');
                    a.href = result.url;
                    a.download = `product_scene_${result.timestamp}.png`;
                    a.click();
                },

                downloadAll() {
                    this.results.forEach((result, idx) => {
                        setTimeout(() => this.downloadImage(result), idx * 500);
                    });
                },

                clearResults() {
                    if (confirm('确定要清空所有结果吗？')) {
                        this.results = [];
                    }
                },

                copyImageUrl(result) {
                    navigator.clipboard.writeText(result.url).then(() => {
                        alert('链接已复制');
                    });
                }
            }
        }
    </script>
