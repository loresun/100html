<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品详情页文案生成器 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 基础样式 - 采用橙红色/珊瑚色调 */
        body {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 50%, #fed7aa 100%);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 3px; }

        /* 动画效果 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.4s ease-out forwards; }

        /* 模块卡片样式 */
        .module-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px -12px rgba(249, 115, 22, 0.25);
        }

        /* 加载动画 */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            50% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(0.8); opacity: 1; }
        }
        .loading-pulse { animation: pulse-ring 1.5s ease-in-out infinite; }

        /* 风格卡片选中效果 */
        .style-card { transition: all 0.2s ease; }
        .style-card.active {
            border-color: #f97316;
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
        }

        /* 标签高亮 */
        .highlight-tag {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <!--
        产品详情页文案生成器 - Alpine.js 应用
        功能：
        1. 输入产品信息，生成模块化详情页文案
        2. 支持多种文案风格
        3. 模块可独立重新生成
        4. 支持一键复制和导出
    -->
    <div x-data="productDetailApp" class="min-h-screen flex flex-col">

        <!-- 顶部导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-orange-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition"
                        onclick="location.href='../../index.html'">
                        <i data-lucide="shopping-bag" class="text-orange-600 h-6 w-6"></i>
                        <span class="font-bold text-xl tracking-tight text-slate-900">产品详情页文案生成器</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <select x-model="apiConfig.model"
                            class="text-sm border border-orange-200 rounded-lg px-3 py-1.5 bg-white outline-none focus:ring-2 focus:ring-orange-500">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-orange-600 transition flex items-center gap-1 text-sm font-medium">
                            <i data-lucide="settings" class="h-4 w-4"></i>
                            <span class="hidden sm:inline">设置</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="flex-grow flex flex-col lg:flex-row overflow-hidden h-[calc(100vh-4rem)]">

            <!-- 左侧：输入面板 -->
            <div class="w-full lg:w-2/5 bg-white/70 backdrop-blur-sm border-r border-orange-200 p-5 overflow-y-auto space-y-5">

                <!-- 产品名称 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i data-lucide="package" class="w-4 h-4 text-orange-600"></i>
                        产品名称 <span class="text-red-500">*</span>
                    </label>
                    <input type="text" x-model="input.productName" placeholder="例如：智能按摩椅 Pro Max"
                        class="w-full bg-white border border-orange-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
                </div>

                <!-- 核心卖点 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i data-lucide="star" class="w-4 h-4 text-orange-600"></i>
                        核心卖点 <span class="text-red-500">*</span>
                    </label>
                    <textarea x-model="input.coreFeatures" rows="4"
                        placeholder="请列出产品的核心卖点（每行一个）&#10;&#10;例如：&#10;- 3D 零重力太空舱设计&#10;- 全身 128 个按摩点覆盖&#10;- AI 智能体感检测"
                        class="w-full bg-white border border-orange-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition resize-none"></textarea>
                </div>

                <!-- 目标人群 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i data-lucide="users" class="w-4 h-4 text-orange-600"></i>
                        目标人群
                    </label>
                    <input type="text" x-model="input.targetAudience" placeholder="例如：25-45岁都市白领、久坐办公人群"
                        class="w-full bg-white border border-orange-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
                </div>

                <!-- 价格区间 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i data-lucide="tag" class="w-4 h-4 text-orange-600"></i>
                        价格区间
                    </label>
                    <div class="flex gap-2 items-center">
                        <input type="text" x-model="input.priceRange" placeholder="例如：3999-5999元"
                            class="flex-grow bg-white border border-orange-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-orange-500 transition">
                        <select x-model="input.pricePosition"
                            class="bg-white border border-orange-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-orange-500">
                            <option value="budget">性价比</option>
                            <option value="mid">中端</option>
                            <option value="premium">高端</option>
                            <option value="luxury">奢侈品</option>
                        </select>
                    </div>
                </div>

                <!-- 文案风格 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i data-lucide="palette" class="w-4 h-4 text-orange-600"></i>
                        文案风格
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="style in styles" :key="style.value">
                            <div @click="input.style = style.value"
                                :class="['style-card p-3 rounded-xl border cursor-pointer', input.style === style.value ? 'active' : 'border-orange-200 bg-white hover:border-orange-300']">
                                <div class="flex items-center gap-2">
                                    <span class="text-xl" x-text="style.icon"></span>
                                    <div>
                                        <span class="text-sm font-bold text-slate-700" x-text="style.label"></span>
                                        <span class="text-xs text-slate-500 block" x-text="style.desc"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 生成模块选择 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i data-lucide="layout-list" class="w-4 h-4 text-orange-600"></i>
                        生成模块
                    </label>
                    <div class="space-y-2">
                        <template x-for="mod in modules" :key="mod.value">
                            <label class="flex items-center gap-3 p-3 bg-white rounded-lg border border-orange-200 cursor-pointer hover:border-orange-300 transition">
                                <input type="checkbox" :value="mod.value" x-model="input.selectedModules"
                                    class="w-4 h-4 text-orange-600 rounded focus:ring-orange-500">
                                <span class="text-lg" x-text="mod.icon"></span>
                                <div class="flex-grow">
                                    <span class="text-sm font-medium text-slate-700" x-text="mod.label"></span>
                                    <span class="text-xs text-slate-500 block" x-text="mod.desc"></span>
                                </div>
                            </label>
                        </template>
                    </div>
                </div>

                <!-- 额外信息 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i data-lucide="plus-circle" class="w-4 h-4 text-orange-600"></i>
                        补充信息 (可选)
                    </label>
                    <textarea x-model="input.extraInfo" rows="2" placeholder="品牌故事、资质认证、促销活动等..."
                        class="w-full bg-white border border-orange-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition resize-none"></textarea>
                </div>

                <!-- 生成按钮 -->
                <button @click="generateContent" :disabled="isGenerating || !input.productName || !input.coreFeatures"
                    class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl hover:from-orange-600 hover:to-red-600 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-all">
                    <template x-if="isGenerating">
                        <i data-lucide="loader-2" class="animate-spin w-5 h-5"></i>
                    </template>
                    <template x-if="!isGenerating">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </template>
                    <span x-text="isGenerating ? '正在生成中...' : '✨ 一键生成文案'"></span>
                </button>
            </div>

            <!-- 右侧：结果展示区 -->
            <div class="flex-grow bg-gradient-to-br from-orange-50/50 to-red-50/50 p-6 overflow-y-auto">

                <!-- 空状态 -->
                <div x-show="Object.keys(result).length === 0 && !isGenerating" class="h-full flex flex-col items-center justify-center text-slate-400">
                    <div class="w-24 h-24 bg-orange-100 rounded-full flex items-center justify-center mb-6 loading-pulse">
                        <i data-lucide="shopping-bag" class="w-12 h-12 text-orange-400"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-600 mb-2">产品详情页文案生成器</h3>
                    <p class="text-center max-w-md">
                        输入产品信息，AI 自动生成模块化的详情页文案<br>
                        <span class="text-orange-600 font-medium">痛点引入 · 卖点展开 · 场景描述 · 促单转化</span>
                    </p>
                </div>

                <!-- 加载状态 -->
                <div x-show="isGenerating && Object.keys(result).length === 0" class="h-full flex flex-col items-center justify-center">
                    <div class="relative">
                        <div class="w-20 h-20 border-4 border-orange-200 rounded-full animate-spin border-t-orange-500"></div>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <i data-lucide="brain" class="w-8 h-8 text-orange-600"></i>
                        </div>
                    </div>
                    <p class="mt-6 text-slate-600 font-medium">AI 正在生成高转化文案...</p>
                    <p class="text-sm text-slate-400 mt-2">生成详情页文案需要约 20-40 秒</p>
                </div>

                <!-- 结果展示 -->
                <div x-show="Object.keys(result).length > 0" class="max-w-4xl mx-auto space-y-4">

                    <!-- 顶部操作栏 -->
                    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-slate-500">已生成</span>
                            <span class="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-sm font-bold"
                                x-text="Object.keys(result || {}).length + ' 个模块'"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button @click="expandAll"
                                class="flex items-center gap-1.5 px-3 py-2 bg-white border border-orange-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-orange-50 transition">
                                <i data-lucide="chevrons-down" class="w-4 h-4"></i>
                                全部展开
                            </button>
                            <button @click="copyAllContent"
                                class="flex items-center gap-1.5 px-3 py-2 bg-white border border-orange-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-orange-50 transition">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                                复制全部
                            </button>
                            <button @click="exportContent"
                                class="flex items-center gap-1.5 px-3 py-2 bg-orange-600 text-white rounded-lg text-sm font-medium hover:bg-orange-700 transition">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                导出文档
                            </button>
                        </div>
                    </div>

                    <!-- 模块列表 -->
                    <template x-for="(module, key, index) in result" :key="key">
                        <div class="module-card bg-white rounded-2xl border border-orange-100 overflow-hidden animate-fade-in"
                            :style="{ animationDelay: index * 0.1 + 's' }">

                            <!-- 模块头部 -->
                            <div @click="toggleModule(key)"
                                class="px-5 py-4 bg-gradient-to-r from-orange-50 to-red-50 border-b border-orange-100 cursor-pointer flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <span class="text-2xl" x-text="getModuleIcon(key)"></span>
                                    <div>
                                        <h3 class="font-bold text-slate-800" x-text="getModuleName(key)"></h3>
                                        <p class="text-xs text-slate-500" x-text="getModuleDesc(key)"></p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button @click.stop="regenerateModule(key)"
                                        class="p-2 text-slate-400 hover:text-orange-600 hover:bg-orange-50 rounded-lg transition" title="重新生成">
                                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                    </button>
                                    <button @click.stop="copyModule(key)"
                                        class="p-2 text-slate-400 hover:text-orange-600 hover:bg-orange-50 rounded-lg transition" title="复制">
                                        <i data-lucide="copy" class="w-4 h-4"></i>
                                    </button>
                                    <i :data-lucide="expandedModules.includes(key) ? 'chevron-up' : 'chevron-down'"
                                        class="w-5 h-5 text-slate-400 transition-transform"></i>
                                </div>
                            </div>

                            <!-- 模块内容 -->
                            <div x-show="expandedModules.includes(key)" x-transition class="p-5">
                                <!-- 如果是数组（多个版本） -->
                                <template x-if="Array.isArray(module)">
                                    <div class="space-y-4">
                                        <template x-for="(item, idx) in module" :key="idx">
                                            <div class="p-4 bg-orange-50/50 rounded-xl border border-orange-100">
                                                <div class="flex items-start justify-between gap-2 mb-2">
                                                    <span class="highlight-tag px-2 py-0.5 rounded-full text-xs font-medium"
                                                        x-text="'版本 ' + (idx + 1)"></span>
                                                    <button @click="copyText(item)"
                                                        class="text-slate-400 hover:text-orange-600 transition text-xs">复制</button>
                                                </div>
                                                <p class="text-slate-700 leading-relaxed whitespace-pre-wrap text-sm" x-text="item"></p>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <!-- 如果是单个文本 -->
                                <template x-if="!Array.isArray(module)">
                                    <div class="text-slate-700 leading-relaxed whitespace-pre-wrap" x-text="module"></div>
                                </template>
                            </div>
                        </div>
                    </template>

                </div>
            </div>
        </div>

        <!-- API 设置弹窗 -->
        <div x-show="showSettings" x-transition
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-fade-in" @click.outside="showSettings = false">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" x-model="apiConfig.deepseek"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-orange-500 outline-none"
                            placeholder="sk-...">
                        <p class="text-xs text-slate-500 mt-1">Key 将保存到本地，所有工具共享使用</p>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button @click="saveConfig"
                        class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700 transition">保存配置</button>
                </div>
            </div>
        </div>

        <!-- Toast 提示 -->
        <div x-show="toast.show" x-transition
            class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in z-[200]">
            <i :data-lucide="toast.icon" class="w-4 h-4"></i>
            <span class="text-sm" x-text="toast.message"></span>
        </div>

    </div>

    <script>
        /**
         * 产品详情页文案生成器 - Alpine.js 应用
         * 功能：输入产品信息，生成模块化详情页文案
         */
        document.addEventListener('alpine:init', () => {
            Alpine.data('productDetailApp', () => ({
                // ==================== 状态管理 ====================
                showSettings: false,

                apiConfig: {
                    deepseek: '',
                    model: 'deepseek-v4-flash'
                },

                // 文案风格选项
                styles: [
                    { value: 'premium', label: '高端品质', icon: '👑', desc: '强调品质、格调' },
                    { value: 'value', label: '性价比', icon: '💰', desc: '突出优惠、实惠' },
                    { value: 'emotional', label: '情感共鸣', icon: '💝', desc: '打动人心、代入感' },
                    { value: 'technical', label: '专业技术', icon: '🔬', desc: '数据说话、专业可信' }
                ],

                // 生成模块选项
                modules: [
                    { value: 'painpoint', label: '痛点引入', icon: '😰', desc: '3种不同开头方式' },
                    { value: 'highlights', label: '产品亮点', icon: '✨', desc: '核心卖点深度展开' },
                    { value: 'scenarios', label: '使用场景', icon: '🎬', desc: '3-5个使用场景描述' },
                    { value: 'trust', label: '信任背书', icon: '🏆', desc: '资质、评价、数据' },
                    { value: 'cta', label: '促单话术', icon: '🛒', desc: '限时优惠、行动号召' }
                ],

                // 用户输入
                input: {
                    productName: '',
                    coreFeatures: '',
                    targetAudience: '',
                    priceRange: '',
                    pricePosition: 'mid',
                    style: 'premium',
                    selectedModules: ['painpoint', 'highlights', 'scenarios', 'trust', 'cta'],
                    extraInfo: ''
                },

                // 生成状态
                isGenerating: false,
                result: {},  // 初始化为空对象，避免 null 访问错误
                expandedModules: [],

                // Toast 提示
                toast: { show: false, message: '', icon: 'check' },

                // ==================== 生命周期 ====================
                init() {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
                    }
                    this.refreshIcons();
                },

                // ==================== 方法 ====================
                refreshIcons() {
                    setTimeout(() => {
                        try { lucide.createIcons(); } catch (e) { /* 忽略 */ }
                    }, 50);
                },

                showToast(message, icon = 'check') {
                    this.toast = { show: true, message, icon };
                    this.refreshIcons();
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                saveConfig() {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...this.apiConfig }));
                    this.showSettings = false;
                    this.showToast('配置已保存', 'check');
                },

                getModuleIcon(key) {
                    const icons = { painpoint: '😰', highlights: '✨', scenarios: '🎬', trust: '🏆', cta: '🛒' };
                    return icons[key] || '📄';
                },

                getModuleName(key) {
                    const names = { painpoint: '痛点引入', highlights: '产品亮点', scenarios: '使用场景', trust: '信任背书', cta: '促单话术' };
                    return names[key] || key;
                },

                getModuleDesc(key) {
                    const descs = { painpoint: '吸引用户注意，引发共鸣', highlights: '展示核心卖点，建立认知', scenarios: '场景化描述，增强代入感', trust: '建立信任，消除顾虑', cta: '促进转化，引导下单' };
                    return descs[key] || '';
                },

                toggleModule(key) {
                    const index = this.expandedModules.indexOf(key);
                    if (index > -1) {
                        this.expandedModules.splice(index, 1);
                    } else {
                        this.expandedModules.push(key);
                    }
                    this.refreshIcons();
                },

                expandAll() {
                    if (this.result) {
                        this.expandedModules = Object.keys(this.result);
                        this.refreshIcons();
                    }
                },

                getStyleName() {
                    return this.styles.find(s => s.value === this.input.style)?.label || this.input.style;
                },

                getSelectedModuleNames() {
                    return this.input.selectedModules.map(m => this.modules.find(mod => mod.value === m)?.label).join('、');
                },

                async generateContent() {
                    if (!this.apiConfig.deepseek) {
                        this.showSettings = true;
                        this.showToast('请先配置 API Key', 'alert-circle');
                        return;
                    }

                    this.isGenerating = true;
                    this.result = {};
                    this.expandedModules = [];

                    try {
                        const systemPrompt = `你是一位顶级电商文案专家，精通消费者心理学和转化文案技巧。请严格按照 JSON 格式输出。`;

                        const userPrompt = `请为以下产品生成详情页文案：

## 产品信息
- **产品名称**：${this.input.productName}
- **核心卖点**：\n${this.input.coreFeatures}
- **目标人群**：${this.input.targetAudience || '未指定'}
- **价格区间**：${this.input.priceRange || '未指定'}
- **价格定位**：${this.input.pricePosition === 'budget' ? '性价比' : this.input.pricePosition === 'mid' ? '中端' : this.input.pricePosition === 'premium' ? '高端' : '奢侈品'}
- **文案风格**：${this.getStyleName()}
${this.input.extraInfo ? `- **补充信息**：${this.input.extraInfo}` : ''}

## 生成模块
${this.getSelectedModuleNames()}

## 输出格式
请返回 JSON 格式：
{
  ${this.input.selectedModules.includes('painpoint') ? '"painpoint": ["开头版本1（50-80字）", "开头版本2", "开头版本3"],' : ''}
  ${this.input.selectedModules.includes('highlights') ? '"highlights": "产品亮点详细展开（300-500字，分点阐述每个卖点）",' : ''}
  ${this.input.selectedModules.includes('scenarios') ? '"scenarios": ["场景1描述（80-120字）", "场景2", "场景3", "场景4", "场景5"],' : ''}
  ${this.input.selectedModules.includes('trust') ? '"trust": "信任背书内容（200-300字，包含资质、数据、用户好评等）",' : ''}
  ${this.input.selectedModules.includes('cta') ? '"cta": ["促单话术1", "促单话术2", "促单话术3"]' : ''}
}`;

                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                response_format: { type: 'json_object' },
                                stream: false
                            })
                        });

                        if (!response.ok) throw new Error(`API 请求失败: ${response.status}`);

                        const data = await response.json();
                        const content = data.choices?.[0]?.message?.content;

                        if (content) {
                            this.result = JSON.parse(content);
                            if (Object.keys(this.result).length > 0) {
                                this.expandedModules = [Object.keys(this.result)[0]];
                            }
                            this.showToast('文案生成成功！', 'check-circle');
                        }

                    } catch (error) {
                        console.error('[Product Detail] 生成失败:', error);
                        this.showToast('生成失败: ' + error.message, 'alert-circle');
                    } finally {
                        this.isGenerating = false;
                        this.refreshIcons();
                    }
                },

                async regenerateModule(moduleKey) {
                    if (!this.apiConfig.deepseek) {
                        this.showToast('请先配置 API Key', 'alert-circle');
                        return;
                    }

                    this.showToast('正在重新生成...', 'loader-2');

                    try {
                        const moduleName = this.getModuleName(moduleKey);
                        const systemPrompt = `你是一位顶级电商文案专家，请重新生成一段${moduleName}文案。`;
                        const userPrompt = `产品：${this.input.productName}\n核心卖点：${this.input.coreFeatures}\n风格：${this.getStyleName()}\n\n请生成新的${moduleName}内容，格式与之前保持一致。`;

                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                stream: false
                            })
                        });

                        if (!response.ok) throw new Error('API 请求失败');

                        const data = await response.json();
                        const content = data.choices?.[0]?.message?.content;

                        if (content) {
                            try {
                                this.result[moduleKey] = JSON.parse(content);
                            } catch {
                                this.result[moduleKey] = content;
                            }
                            this.showToast('重新生成成功', 'check');
                        }

                    } catch (error) {
                        this.showToast('重新生成失败', 'alert-circle');
                    }
                },

                copyModule(key) {
                    const content = this.result[key];
                    const text = Array.isArray(content) ? content.join('\n\n---\n\n') : content;
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制到剪贴板', 'copy');
                    });
                },

                copyText(text) {
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制', 'copy');
                    });
                },

                copyAllContent() {
                    if (!this.result) return;

                    let text = `【${this.input.productName}】详情页文案\n\n`;

                    for (const [key, value] of Object.entries(this.result)) {
                        text += `## ${this.getModuleName(key)}\n\n`;
                        if (Array.isArray(value)) {
                            value.forEach((item, idx) => {
                                text += `【版本${idx + 1}】\n${item}\n\n`;
                            });
                        } else {
                            text += value + '\n\n';
                        }
                        text += '---\n\n';
                    }

                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制全部内容', 'copy');
                    });
                },

                exportContent() {
                    if (!this.result) return;

                    let content = `# ${this.input.productName} - 详情页文案\n\n`;
                    content += `生成时间: ${new Date().toLocaleString()}\n`;
                    content += `文案风格: ${this.getStyleName()}\n\n---\n\n`;

                    for (const [key, value] of Object.entries(this.result)) {
                        content += `## ${this.getModuleName(key)}\n\n`;
                        if (Array.isArray(value)) {
                            value.forEach((item, idx) => {
                                content += `### 版本 ${idx + 1}\n\n${item}\n\n`;
                            });
                        } else {
                            content += value + '\n\n';
                        }
                    }

                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${this.input.productName}_详情页文案_${new Date().toISOString().slice(0, 10)}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    this.showToast('已导出文档', 'download');
                }
            }));
        });
    </script>
