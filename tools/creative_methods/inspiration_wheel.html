<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感转盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #fdf4ff 0%, #f8fafc 60%, #fce7f3 100%);
        }

        .wheel {
            width: 280px;
            height: 280px;
            border-radius: 999px;
            background: conic-gradient(#f472b6 0deg 90deg, #a855f7 90deg 180deg, #38bdf8 180deg 270deg, #facc15 270deg 360deg);
            transition: transform 1.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 22px solid #0f172a;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen">
        <header class="py-10 px-4">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-fuchsia-500 flex items-center justify-center">
                        <i class="fa-solid fa-rotate text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">灵感转盘</h1>
                        <p class="text-slate-500">转盘给出角度 + 情绪 + 场景，AI 生成灵感提示。</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="showSettings = true" class="p-2 rounded-full bg-white border border-slate-200 text-slate-500 hover:text-fuchsia-600">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                    <a href="../../index.html" class="text-sm text-slate-500 hover:text-fuchsia-600">返回首页</a>
                </div>
            </div>
        </header>

        <main class="px-4 pb-16">
            <div class="max-w-5xl mx-auto grid lg:grid-cols-[1fr_1fr] gap-8 items-center">
                <section class="glass-card rounded-3xl p-8 shadow-lg flex flex-col items-center">
                    <div class="pointer"></div>
                    <div class="wheel mt-3" :style="{ transform: `rotate(${rotation}deg)` }"></div>
                    <button @click="spin" class="mt-6 px-5 py-2.5 rounded-xl bg-fuchsia-600 text-white font-medium hover:bg-fuchsia-500">开始旋转</button>
                    <p class="text-sm text-slate-500 mt-3">当前角度：{{ currentAngle }}°</p>
                </section>

                <section class="glass-card rounded-3xl p-8 shadow-lg">
                    <div class="grid gap-3">
                        <input v-model="topic" class="border border-slate-200 rounded-xl px-4 py-3" placeholder="你想要的主题">
                        <div class="grid grid-cols-3 gap-2 text-sm">
                            <div class="bg-fuchsia-50 rounded-xl p-3">角度：{{ result.angle }}</div>
                            <div class="bg-fuchsia-50 rounded-xl p-3">情绪：{{ result.emotion }}</div>
                            <div class="bg-fuchsia-50 rounded-xl p-3">场景：{{ result.scene }}</div>
                        </div>
                    </div>
                    <button @click="generate" class="mt-4 px-5 py-2.5 rounded-xl bg-slate-900 text-white font-medium hover:bg-slate-700 disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2" :disabled="isLoading">
                        <span x-show="!isLoading">生成灵感提示</span>
                        <span x-show="isLoading" class="flex items-center gap-2">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                            AI 正在思考...
                        </span>
                    </button>
                    <p v-if="error" class="text-sm text-red-500 mt-3">{{ error }}</p>
                    <div class="mt-4 bg-fuchsia-50 rounded-2xl p-4 text-slate-700 whitespace-pre-line min-h-[180px] flex items-center justify-center">
                        <template v-if="isLoading">
                            <div class="flex flex-col items-center gap-3">
                                <div class="flex gap-2">
                                    <div class="w-3 h-3 rounded-full bg-fuchsia-500 animate-bounce" style="animation-delay: 0s"></div>
                                    <div class="w-3 h-3 rounded-full bg-fuchsia-500 animate-bounce" style="animation-delay: 0.1s"></div>
                                    <div class="w-3 h-3 rounded-full bg-fuchsia-500 animate-bounce" style="animation-delay: 0.2s"></div>
                                </div>
                                <p class="text-sm text-slate-500">正在生成灵感...</p>
                            </div>
                        </template>
                        <template v-else>
                            {{ output || '等待生成。' }}
                        </template>
                    </div>
                </section>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-md">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                    <input v-model="apiConfig.deepseek" type="password" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">模型</label>
                    <select v-model="apiConfig.model" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>
                <button @click="saveConfig" class="mt-6 w-full px-4 py-2 rounded-lg bg-fuchsia-600 text-white font-medium hover:bg-fuchsia-500">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {


                const rotation = ref(0);
                const currentAngle = ref(0);
                const topic = ref('短视频创作');
                const result = ref({ angle: '反差', emotion: '兴奋', scene: '夜晚' });
                const output = ref('');
                const error = ref('');
                const isLoading = ref(false);
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });

                const angles = ['反差', '数据', '痛点', '情绪', '故事', '悬念'];
                const emotions = ['兴奋', '治愈', '惊讶', '松弛', '热血', '好奇'];
                const scenes = ['清晨', '通勤', '夜晚', '海边', '咖啡店', '办公室'];

                const pick = (list) => list[Math.floor(Math.random() * list.length)];

                const spin = () => {
                    const extra = 720 + Math.floor(Math.random() * 360);
                    rotation.value += extra;
                    currentAngle.value = rotation.value % 360;
                    result.value = {
                        angle: pick(angles),
                        emotion: pick(emotions),
                        scene: pick(scenes)
                    };
                };

                const callLLM = async (prompt) => {
                    if (!apiConfig.value.deepseek) {
                        error.value = '请先配置 DeepSeek API Key。';
                        return '';
                    }
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${apiConfig.value.deepseek}`
                        },
                        body: JSON.stringify({
                            model: apiConfig.value.model,
                            messages: [
                                { role: 'system', content: '你是创意策划师，输出一句可执行灵感提示。' },
                                { role: 'user', content: prompt }
                            ],
                            temperature: 0.8
                        })
                    });
                    if (!response.ok) throw new Error(`API 请求失败: ${response.status}`);
                    const data = await response.json();
                    return data.choices?.[0]?.message?.content || '';
                };

                const generate = async () => {
                    error.value = '';
                    isLoading.value = true;
                    try {
                        const prompt = `主题：${topic.value}\n角度：${result.value.angle}\n情绪：${result.value.emotion}\n场景：${result.value.scene}\n请输出 2 句灵感提示，简洁有行动性。`;
                        output.value = await callLLM(prompt);
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        isLoading.value = false;
                    }
                };

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                onMounted(() => {
                    // 初始化 Lucide 图标

                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                });

                return {

                    rotation,
                    currentAngle,
                    topic,
                    result,
                    output,
                    error,
                    isLoading,
                    showSettings,
                    apiConfig,
                    spin,
                    generate,
                    saveConfig
                };
            }
        }).mount('#app');
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/creative_methods_inspiration_wheel.md"></script>
<!-- HELP-WIDGET-END -->
</body>

</html>
