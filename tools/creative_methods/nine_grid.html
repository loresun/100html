<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>九宫格创意</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-white via-slate-50 to-amber-50 text-slate-800" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <div x-data="nineGridApp()" class="max-w-6xl mx-auto px-6 py-8">
    <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <p class="text-xs text-slate-500">Creative Toolkit</p>
        <h1 class="text-3xl font-bold mt-1">九宫格创意</h1>
        <p class="text-slate-600 mt-2">把主题拆解成九个视角与行动点，快速形成可执行的创意矩阵。</p>
      </div>
      <div class="flex items-center gap-3">
        <a href="../../index.html" class="text-sm text-slate-500 hover:text-slate-700">← 返回工具合集</a>
        <button @click="showSettings = true" class="text-sm px-3 py-2 rounded-lg bg-slate-900 text-white hover:bg-slate-800">API 设置</button>
      </div>
    </header>

    <section class="mt-8 grid lg:grid-cols-[360px_1fr] gap-6">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
        <h2 class="font-semibold text-lg">输入需求</h2>
        <div class="mt-4 space-y-4">
          <div>
            <label class="text-sm text-slate-600">选择模式</label>
            <select x-model="mode" class="mt-2 w-full rounded-lg border border-slate-200 p-2">
              <option value="new">拓展新机会</option>
              <option value="improve">优化现有方案</option>
              <option value="solve">突破痛点问题</option>
            </select>
          </div>
          <div>
            <label class="text-sm text-slate-600">主题/产品</label>
            <textarea x-model="topic" rows="4" class="mt-2 w-full rounded-lg border border-slate-200 p-3" placeholder="例如：提升线上课程的完课率"></textarea>
          </div>
          <div>
            <label class="text-sm text-slate-600">补充信息（选填）</label>
            <textarea x-model="context" rows="4" class="mt-2 w-full rounded-lg border border-slate-200 p-3" placeholder="已有方向、限制条件、目标受众"></textarea>
          </div>
          <button @click="generate" :disabled="loading" class="w-full py-3 rounded-lg bg-amber-500 text-white font-semibold hover:bg-amber-600 disabled:opacity-60">
            <span x-show="!loading">生成九宫格</span>
            <span x-show="loading">生成中...</span>
          </button>
          <p class="text-xs text-slate-500">输出为 3×3 创意格，并附带行动建议。</p>
        </div>
      </div>

      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">渲染结果</h2>
          <button @click="exportImage" :disabled="!resultReady" class="text-sm px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-100 disabled:opacity-40">导出为图片</button>
        </div>
        <div x-ref="renderArea" class="bg-white rounded-2xl border border-slate-200 p-6 min-h-[300px]">
          <template x-if="!resultReady">
            <div class="text-slate-400 text-sm">等待生成结果。</div>
          </template>
          <template x-if="resultReady">
            <div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <template x-for="item in result.items" :key="item.title">
                  <div class="border border-slate-200 rounded-xl p-3 bg-amber-50/40">
                    <h3 class="font-semibold text-slate-700" x-text="item.title"></h3>
                    <p class="text-sm text-slate-600 mt-2" x-text="item.description"></p>
                    <p class="text-xs text-amber-600 mt-3">行动：<span x-text="item.action"></span></p>
                  </div>
                </template>
              </div>
              <div class="mt-6 rounded-xl bg-slate-50 border border-dashed border-slate-200 p-4" x-show="result.summary">
                <h4 class="font-semibold">策略摘要</h4>
                <div class="text-sm text-slate-600 mt-2" x-html="renderMarkdown(result.summary)"></div>
              </div>
              <template x-if="result.raw">
                <div class="mt-6 text-sm text-slate-500" x-html="renderMarkdown(result.raw)"></div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </section>

    <div x-show="showSettings" class="fixed inset-0 bg-black/40 flex items-center justify-center p-6">
      <div class="bg-white rounded-2xl p-6 w-full max-w-lg">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">API 设置</h3>
          <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>
        <form @submit.prevent="saveConfig" class="mt-4 space-y-4">
          <input type="text" name="username" autocomplete="username" style="display:none;">
          <div>
            <label class="text-sm text-slate-600">模型提供方</label>
            <select x-model="api.provider" class="mt-2 w-full rounded-lg border border-slate-200 p-2">
              <option value="deepseek">DeepSeek</option>
              <option value="custom">其他兼容模型</option>
            </select>
          </div>
          <div x-show="api.provider === 'deepseek'" class="space-y-3">
            <div>
              <label class="text-sm text-slate-600">DeepSeek API Key</label>
              <input type="password" x-model="api.deepseekKey" class="mt-2 w-full rounded-lg border border-slate-200 p-2" placeholder="sk-..." autocomplete="current-password">
            </div>
            <div>
              <label class="text-sm text-slate-600">DeepSeek 模型</label>
              <select x-model="api.deepseekModel" class="mt-2 w-full rounded-lg border border-slate-200 p-2">
                <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
              </select>
            </div>
          </div>
          <div x-show="api.provider === 'custom'" class="space-y-3">
            <div>
              <label class="text-sm text-slate-600">自定义 API Base URL</label>
              <input type="text" x-model="api.customBase" class="mt-2 w-full rounded-lg border border-slate-200 p-2" placeholder="https://api.openai.com/v1">
            </div>
            <div>
              <label class="text-sm text-slate-600">API Key</label>
              <input type="password" x-model="api.customKey" class="mt-2 w-full rounded-lg border border-slate-200 p-2" placeholder="sk-..." autocomplete="current-password">
            </div>
            <div>
              <label class="text-sm text-slate-600">模型名称</label>
              <input type="text" x-model="api.customModel" class="mt-2 w-full rounded-lg border border-slate-200 p-2" placeholder="gpt-4o-mini">
            </div>
          </div>
          <div class="mt-6 flex justify-end gap-3">
            <button type="button" @click="resetConfig" class="px-4 py-2 text-sm rounded-lg border border-slate-200">重置</button>
            <button type="submit" class="px-4 py-2 text-sm rounded-lg bg-slate-900 text-white">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const GRID_HINTS = {
      new: '请输出新机会与创意角度。',
      improve: '请输出优化建议与升级方向。',
      solve: '请输出解决痛点的策略。'
    };

    function nineGridApp() {
      // 优先从全局配置读取，兼容旧配置
      const globalConfig = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
      const savedKey = localStorage.getItem('creative_deepseek_key') || '';
      const savedModel = localStorage.getItem('creative_deepseek_model') || 'deepseek-v4-flash';

      return {
        mode: 'new',
        topic: '',
        context: '',
        loading: false,
        result: { items: [], summary: '', raw: '' },
        showSettings: false,
        api: {
          provider: 'deepseek',
          // 优先使用全局配置的 key，如果没有则回退到本地存储
          deepseekKey: globalConfig.deepseek || savedKey,
          deepseekModel: globalConfig.model || savedModel,
          customBase: localStorage.getItem('creative_custom_base') || 'https://api.openai.com/v1',
          customKey: localStorage.getItem('creative_custom_key') || '',
          customModel: localStorage.getItem('creative_custom_model') || 'gpt-4o-mini'
        },
        get resultReady() {
          return this.result.items.length > 0 || this.result.raw;
        },
        renderMarkdown(content) {
          return content ? marked.parse(content) : '';
        },
        saveConfig() {
          try {
            localStorage.setItem('creative_deepseek_key', this.api.deepseekKey);
            localStorage.setItem('creative_deepseek_model', this.api.deepseekModel);
            localStorage.setItem('creative_custom_base', this.api.customBase);
            localStorage.setItem('creative_custom_key', this.api.customKey);
            localStorage.setItem('creative_custom_model', this.api.customModel);

            // 同步到全局配置
            const currentGlobal = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
            localStorage.setItem('global_llm_config', JSON.stringify({
              ...currentGlobal,
              deepseek: this.api.deepseekKey,
              model: this.api.deepseekModel
            }));
          } catch (e) {
            console.error('Failed to save config', e);
          }
          this.showSettings = false;
        },
        resetConfig() {
          this.api.deepseekKey = '';
          this.api.deepseekModel = 'deepseek-v4-flash';
          this.api.customBase = 'https://api.openai.com/v1';
          this.api.customKey = '';
          this.api.customModel = 'gpt-4o-mini';
        },
        async callModel(systemPrompt, userPrompt) {
          const payload = {
            model: this.api.provider === 'deepseek' ? this.api.deepseekModel : this.api.customModel,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userPrompt }
            ],
            temperature: 0.7
          };

          const endpoint = this.api.provider === 'deepseek'
            ? 'https://api.deepseek.com/chat/completions'
            : `${this.api.customBase.replace(/\/$/, '')}/chat/completions`;
          const apiKey = this.api.provider === 'deepseek' ? this.api.deepseekKey : this.api.customKey;

          if (!apiKey) {
            this.showSettings = true;
            throw new Error('请先配置 API Key');
          }

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error('请求失败，请检查 API Key 或网络连接');
          }

          const data = await response.json();
          return data.choices?.[0]?.message?.content || '';
        },
        parseJSON(content) {
          try {
            // 尝试直接解析
            return JSON.parse(content);
          } catch (e) {
            // 移除 markdown 代码块标记
            let clean = content.replace(/```json\n?|```/g, '').trim();
            try {
              return JSON.parse(clean);
            } catch (e2) {
              // 尝试提取第一个 { 到最后一个 } 之间的内容
              const start = content.indexOf('{');
              const end = content.lastIndexOf('}');
              if (start !== -1 && end !== -1 && end > start) {
                try {
                  return JSON.parse(content.substring(start, end + 1));
                } catch (e3) {
                  // 仍然失败，抛出原始错误
                  throw e;
                }
              }
              throw e;
            }
          }
        },
        async generate() {
          if (!this.topic.trim()) return;
          this.loading = true;
          this.result = { items: [], summary: '', raw: '' };
          let content = '';
          try {
            const systemPrompt = '你是创意分析师，擅长用九宫格拆解主题。请直接输出 JSON，不要用代码块包裹。';
            const userPrompt = `主题：${this.topic}\n补充信息：${this.context || '无'}\n需求：${GRID_HINTS[this.mode]}\n\n请输出严格 JSON：\n{\n  "items": [\n    {"title": "格子标题", "description": "说明", "action": "行动建议"}\n  ],\n  "summary": "整体策略摘要（Markdown）"\n}\nitems 必须包含 9 个元素。直接输出 JSON，不要用代码块包裹。`;
            content = await this.callModel(systemPrompt, userPrompt);
            
            const parsed = this.parseJSON(content);
            
            this.result.items = parsed.items || [];
            this.result.summary = parsed.summary || '';
            if (this.result.items.length === 0) {
              this.result.raw = content;
            }
          } catch (error) {
            console.error('JSON Parse Error:', error);
            this.result.raw = content ? `${content}\n\n**解析失败：** ${error.message}` : `**生成失败：** ${error.message}`;
          } finally {
            this.loading = false;
          }
        },
        async exportImage() {
          if (!this.resultReady) return;
          try {
            const dataUrl = await htmlToImage.toPng(this.$refs.renderArea, { backgroundColor: '#ffffff', pixelRatio: 2 });
            const link = document.createElement('a');
            link.download = `nine-grid-${Date.now()}.png`;
            link.href = dataUrl;
            link.click();
          } catch (error) {
            console.error('Export failed:', error);
            alert('导出图片失败，请尝试截图或更换浏览器。');
          }
        }
      };
    }
  </script>
