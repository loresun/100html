<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek 改写与提取 - API 交易平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, rgba(99, 102, 241, 0.12), transparent 55%),
        linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
      min-height: 100vh;
    }

    .glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
  <div x-data="deepseekLab" class="min-h-screen flex flex-col">
    <nav class="glass sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-3">
          <a href="index.html" class="w-10 h-10 rounded-xl bg-violet-600 text-white flex items-center justify-center">
            <i class="fa-solid fa-wand-magic-sparkles w-5 h-5"></i>
          </a>
          <div>
            <p class="text-sm text-violet-600 font-semibold">API 交易平台</p>
            <h1 class="text-xl md:text-2xl font-bold">DeepSeek 改写与提取</h1>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex bg-slate-100 rounded-lg p-1">
            <button @click="apiConfig.model = 'deepseek-v4-flash'"
              :class="apiConfig.model === 'deepseek-v4-flash' ? 'bg-white shadow text-violet-600' : 'text-slate-500'"
              class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
            <button @click="apiConfig.model = 'deepseek-v4-pro'"
              :class="apiConfig.model === 'deepseek-v4-pro' ? 'bg-white shadow text-violet-600' : 'text-slate-500'"
              class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
          </div>
          <div class="flex bg-slate-100 rounded-lg p-1">
            <button @click="apiConfig.thinking = 'disabled'"
              :class="apiConfig.thinking === 'disabled' ? 'bg-white shadow text-violet-600' : 'text-slate-500'"
              class="px-3 py-1 text-xs font-medium rounded-md transition">快速</button>
            <button @click="apiConfig.thinking = 'enabled'"
              :class="apiConfig.thinking === 'enabled' ? 'bg-white shadow text-violet-600' : 'text-slate-500'"
              class="px-3 py-1 text-xs font-medium rounded-md transition">思考</button>
          </div>
          <div x-show="apiConfig.thinking === 'enabled'" class="flex bg-slate-100 rounded-lg p-1">
            <button @click="apiConfig.reasoning_effort = 'high'"
              :class="apiConfig.reasoning_effort === 'high' ? 'bg-white shadow text-violet-600' : 'text-slate-500'"
              class="px-3 py-1 text-xs font-medium rounded-md transition">High</button>
            <button @click="apiConfig.reasoning_effort = 'max'"
              :class="apiConfig.reasoning_effort === 'max' ? 'bg-white shadow text-violet-600' : 'text-slate-500'"
              class="px-3 py-1 text-xs font-medium rounded-md transition">Max</button>
          </div>
          <button @click="showSettings = true" class="text-slate-500 hover:text-violet-600">
            <i class="fa-solid fa-gear w-5 h-5"></i>
          </button>
        </div>
      </div>
    </nav>

    <main class="flex-1">
      <section class="max-w-6xl mx-auto px-4 py-8 grid lg:grid-cols-[1.05fr_1fr] gap-6">
        <div class="glass rounded-3xl p-6 shadow-sm">
          <h2 class="text-lg font-bold mb-3">输入内容</h2>
          <textarea x-model="inputText"
            class="w-full h-56 border border-slate-200 rounded-2xl p-4 resize-none focus:ring-2 focus:ring-violet-200"
            placeholder="粘贴需要改写/提取/关系识别的内容..."></textarea>
          <div class="mt-4 grid md:grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-slate-500">任务模式</label>
              <select x-model="mode" class="mt-2 w-full border border-slate-200 rounded-xl p-2 text-sm">
                <option value="rewrite">润色改写</option>
                <option value="summary">要点提取</option>
                <option value="relation">关系抽取</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-500">输出风格</label>
              <select x-model="tone" class="mt-2 w-full border border-slate-200 rounded-xl p-2 text-sm">
                <option value="modern">现代化简洁</option>
                <option value="professional">专业商务</option>
                <option value="warm">温暖细腻</option>
              </select>
            </div>
          </div>
          <button @click="runDeepSeek" :disabled="isGenerating"
            class="mt-5 w-full bg-violet-600 text-white py-3 rounded-2xl font-semibold hover:bg-violet-700 disabled:opacity-50">
            <span x-show="!isGenerating">开始生成</span>
            <span x-show="isGenerating" class="flex items-center justify-center gap-2">
              <i class="fa-solid fa-spinner fa-spin w-4 h-4"></i>
              生成中...
            </span>
          </button>
          <p class="text-xs text-slate-500 mt-3">提示：模型使用 DeepSeek 官方接口，需先在设置中填写 API Key。</p>
        </div>

        <div class="glass rounded-3xl p-6 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold">输出结果</h2>
            <button @click="copyResult" class="text-xs text-violet-600 hover:text-violet-700">复制结果</button>
          </div>
          <template x-if="!result && !isGenerating">
            <div class="text-sm text-slate-400">等待输入内容后生成结果。</div>
          </template>
          <template x-if="result">
            <div class="space-y-4">
              <div class="bg-white rounded-2xl border border-slate-200 p-4">
                <div x-html="renderedResult" class="prose max-w-none text-sm"></div>
              </div>
              <template x-if="structuredItems.length">
                <div class="grid gap-3">
                  <template x-for="(item, index) in structuredItems" :key="index">
                    <div class="bg-white rounded-2xl border border-slate-200 p-4">
                      <p class="text-xs text-slate-400">结构化条目 #<span x-text="index + 1"></span></p>
                      <pre class="mt-2 text-xs text-slate-600 whitespace-pre-wrap"
                        x-text="JSON.stringify(item, null, 2)"></pre>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="reasoningContent">
                <details class="bg-white rounded-2xl border border-slate-200 p-4">
                  <summary class="cursor-pointer text-sm font-semibold text-violet-600">查看 V4 Pro 推理过程</summary>
                  <pre class="mt-3 text-xs text-slate-500 whitespace-pre-wrap" x-text="reasoningContent"></pre>
                </details>
              </template>
            </div>
          </template>
        </div>
      </section>
    </main>

    <div x-show="showSettings" x-transition class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
      @click.self="showSettings = false">
      <div class="bg-white rounded-2xl w-full max-w-md p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold">DeepSeek 设置</h3>
          <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark w-5 h-5"></i>
          </button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
            <input type="password" x-model="apiConfig.deepseek" class="w-full border rounded-lg p-2"
              placeholder="sk-...">
          </div>
          <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-500">
            Key 仅保存在浏览器 localStorage 中，不会上传至服务器。
          </div>
        </div>
        <div class="mt-6 flex justify-end gap-2">
          <button @click="showSettings = false" class="px-4 py-2 text-slate-500">取消</button>
          <button @click="saveConfig" class="px-4 py-2 bg-violet-600 text-white rounded-lg">保存</button>
        </div>
      </div>
    </div>

    <div x-show="toast.show" x-transition
      class="fixed bottom-6 right-6 bg-white rounded-lg shadow-lg border px-4 py-3 flex items-center gap-2 z-50">
      <i :class="{
        'check': 'fa-solid fa-circle-check', 
        'alert-circle': 'fa-solid fa-circle-exclamation', 
        'x-circle': 'fa-solid fa-circle-xmark'
      }[toast.icon] || 'fa-solid fa-circle-info'" class="w-5 h-5 text-emerald-500"></i>
      <span x-text="toast.message"></span>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('deepseekLab', () => ({
        inputText: '',
        mode: 'rewrite',
        tone: 'modern',
        isGenerating: false,
        showSettings: false,
        apiConfig: { deepseek: '', model: 'deepseek-v4-flash', thinking: 'disabled', reasoning_effort: 'high' },
        result: '',
        renderedResult: '',
        reasoningContent: '',
        structuredItems: [],
        toast: { show: false, message: '', icon: 'check' },
        init() {
          // 初始化加载全局配置
          this.loadConfig();

        },
        loadConfig() {
          // 读取全局配置
          const saved = localStorage.getItem('global_llm_config');
          if (saved) {
            try {
              this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
            } catch (e) {
              console.error('解析 global_llm_config 失败:', e);
            }
          }
        },
        saveConfig() {
          // 保存配置到 localStorage（合并策略）
          let current = {};
          try {
            current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
          } catch (e) {
            console.error('解析 global_llm_config 失败:', e);
          }
          localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...this.apiConfig }));
          this.showToast('配置已保存');
          this.showSettings = false;
        },
        showToast(message, icon = 'check') {
          this.toast = { show: true, message, icon };
          // this.refreshIcons();
          setTimeout(() => { this.toast.show = false; }, 2500);
        },
        refreshIcons() {
          // Font Awesome auto-renders
        },
        async copyResult() {
          // 复制结果到剪贴板
          if (!this.result) return;
          try {
            await navigator.clipboard.writeText(this.result);
            this.showToast('已复制到剪贴板');
          } catch (e) {
            this.showToast('复制失败', 'x-circle');
          }
        },
        buildPrompt() {
          // 根据模式构建提示词
          const toneMap = {
            modern: '现代化、简洁、重点突出',
            professional: '专业、商务、结构清晰',
            warm: '温暖、细腻、有感染力'
          };

          if (this.mode === 'rewrite') {
            return `你是内容润色专家，请用${toneMap[this.tone]}的风格改写以下内容，保持信息准确，并让语言更流畅。`;
          }

          if (this.mode === 'summary') {
            return `请从以下内容中提取要点，输出 JSON 格式：{ "items": [ { "title": "要点", "detail": "解释" } ] }。要求使用中文。`;
          }

          return `请做关系抽取，输出 JSON 格式：{ "items": [ { "subject": "主体", "relation": "关系", "object": "客体", "evidence": "原文依据" } ] }。要求使用中文，关系尽量具体。`;
        },
        async runDeepSeek() {
          // 调用 DeepSeek API 获取结果
          if (!this.inputText.trim()) {
            this.showToast('请输入内容', 'alert-circle');
            return;
          }
          if (!this.apiConfig.deepseek) {
            this.showToast('请先配置 API Key', 'alert-circle');
            this.showSettings = true;
            return;
          }

          this.isGenerating = true;
          this.result = '';
          this.renderedResult = '';
          this.reasoningContent = '';
          this.structuredItems = [];

          try {
            const messages = [
              { role: 'system', content: '你是严谨的内容分析助手，遵循用户要求输出。' },
              { role: 'user', content: `${this.buildPrompt()}\n\n内容：\n${this.inputText}` }
            ];

            const payload = {
              model: this.apiConfig.model,
              messages,
              thinking: { type: this.apiConfig.thinking || 'disabled' }
            };
            if (this.apiConfig.thinking === 'enabled') {
              payload.reasoning_effort = this.apiConfig.reasoning_effort || 'high';
            }

            if (this.mode !== 'rewrite') {
              payload.response_format = { type: 'json_object' };
            }

            const response = await fetch('https://api.deepseek.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.apiConfig.deepseek}`
              },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              throw new Error(`网络请求失败: ${response.status}`);
            }

            const data = await response.json();
            const message = data.choices?.[0]?.message || {};
            this.result = message.content || '';
            this.reasoningContent = message.reasoning_content || '';

            if (this.mode !== 'rewrite') {
              const parsed = JSON.parse(this.result || '{}');
              this.structuredItems = parsed.items || [];
              this.renderedResult = marked.parse('已输出结构化 JSON，可在下方查看条目卡片。');
            } else {
              this.renderedResult = marked.parse(this.result || '');
            }

            this.showToast('生成完成');
          } catch (error) {
            console.log('DeepSeek API 异常', error);
            this.showToast('生成失败，请稍后再试', 'x-circle');
          } finally {
            this.isGenerating = false;
            // this.refreshIcons();
          }
        }
      }));
    });

    document.addEventListener('DOMContentLoaded', () => {

    });
  </script>

</html>
