<html lang="zh-CN">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时数据联动看板 - API 交易平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, rgba(14, 116, 144, 0.12), transparent 55%),
        linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
      min-height: 100vh;
    }

    .glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
  <div x-data="liveDashboard" class="min-h-screen flex flex-col">
    <nav class="glass sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-3">
          <a href="index.html" class="w-10 h-10 rounded-xl bg-cyan-600 text-white flex items-center justify-center">
            <i class="fa-solid fa-chart-line w-5 h-5"></i>
          </a>
          <div>
            <p class="text-sm text-cyan-600 font-semibold">API 交易平台</p>
            <h1 class="text-xl md:text-2xl font-bold">实时数据联动看板</h1>
          </div>
        </div>
        <div class="flex items-center flex-wrap gap-2">
          <button @click="refreshAll"
            class="px-3 py-2 rounded-xl bg-cyan-600 text-white text-sm font-semibold hover:bg-cyan-700">
            <i class="fa-solid fa-rotate w-4 h-4 inline-block mr-1"></i>
            一键刷新
          </button>
          <button @click="toggleAutoRefresh"
            :class="autoRefresh ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'"
            class="px-3 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
            <i :class="autoRefresh ? 'fa-solid fa-pause' : 'fa-solid fa-play'" class="w-4 h-4"></i>
            <span x-text="autoRefresh ? '自动刷新中' : '开启自动刷新'"></span>
          </button>
          <span class="text-xs text-slate-500">最近更新：<span x-text="lastUpdated || '等待刷新'">等待刷新</span></span>
        </div>
      </div>
    </nav>

    <main class="flex-1">
      <section class="max-w-6xl mx-auto px-4 pt-8">
        <div class="grid lg:grid-cols-3 gap-6">
          <div class="glass rounded-3xl p-6 shadow-lg lg:col-span-2">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h2 class="text-lg font-bold">组合联动指数</h2>
                <p class="text-sm text-slate-500">结合天气舒适度 + 加密行情 + 汇率波动的实时评分</p>
              </div>
              <span :class="pulseBadge" class="px-3 py-1 rounded-full text-xs font-semibold" x-text="pulseLabel"></span>
            </div>
            <div class="grid md:grid-cols-3 gap-4">
              <div class="bg-white rounded-2xl border border-slate-200 p-4">
                <p class="text-xs text-slate-500">综合指数</p>
                <p class="text-3xl font-bold text-slate-900" x-text="pulseScore"></p>
                <p class="text-xs text-slate-500 mt-2">指数由三类 API 联动计算</p>
              </div>
              <div class="bg-white rounded-2xl border border-slate-200 p-4">
                <p class="text-xs text-slate-500">行情热度</p>
                <p class="text-xl font-semibold"
                  :class="marketTrend > 0 ? 'text-emerald-600' : marketTrend < 0 ? 'text-rose-500' : 'text-slate-600'">
                  <span x-text="marketTrendText"></span>
                </p>
                <p class="text-xs text-slate-500 mt-2">比特币 & 以太坊价格变动</p>
              </div>
              <div class="bg-white rounded-2xl border border-slate-200 p-4">
                <p class="text-xs text-slate-500">汇率波动</p>
                <p class="text-xl font-semibold"
                  :class="fxTrend > 0 ? 'text-emerald-600' : fxTrend < 0 ? 'text-amber-600' : 'text-slate-600'">
                  <span x-text="fxTrendText"></span>
                </p>
                <p class="text-xs text-slate-500 mt-2">USD 对主要货币变化</p>
              </div>
            </div>
          </div>
          <div class="glass rounded-3xl p-6 shadow-lg">
            <h3 class="text-lg font-bold mb-3">自动刷新设置</h3>
            <p class="text-sm text-slate-500 mb-4">每隔 <span class="font-semibold"
                x-text="refreshInterval / 1000"></span> 秒自动拉取免费 API。</p>
            <div class="bg-white rounded-2xl border border-slate-200 p-4">
              <p class="text-xs text-slate-500">接口状态</p>
              <div class="mt-2 space-y-2">
                <template x-for="item in statusItems" :key="item.label">
                  <div class="flex items-center justify-between text-sm">
                    <span class="text-slate-600" x-text="item.label"></span>
                    <span :class="item.ok ? 'text-emerald-600' : 'text-rose-500'" x-text="item.ok ? '正常' : '异常'"></span>
                  </div>
                </template>
              </div>
              <div class="mt-4 text-xs text-slate-400">失败时可点击“一键刷新”重新请求。</div>
            </div>
          </div>
        </div>
      </section>

      <section class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid lg:grid-cols-3 gap-6">
          <div class="glass rounded-3xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold">城市天气</h3>
              <button @click="fetchWeather" class="text-xs text-cyan-600 hover:text-cyan-700">刷新</button>
            </div>
            <template x-if="weatherLoading">
              <div class="flex items-center gap-2 text-sm text-slate-500">
                <i class="fa-solid fa-spinner fa-spin w-4 h-4"></i>
                正在更新天气数据...
              </div>
            </template>
            <template x-if="!weatherLoading && !weather">
              <div class="text-sm text-slate-400">暂无数据，点击刷新获取。</div>
            </template>
            <template x-if="weather">
              <div>
                <p class="text-sm text-slate-500" x-text="weather.location"></p>
                <div class="flex items-end gap-2">
                  <p class="text-3xl font-bold" x-text="weather.temperature + '°C'"></p>
                  <span class="text-xs text-slate-500">体感 <span x-text="weather.apparent + '°C'"></span></span>
                </div>
                <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
                  <div class="bg-white rounded-xl border border-slate-200 p-3">
                    <p class="text-xs text-slate-400">风速</p>
                    <p class="font-semibold" x-text="weather.wind + ' km/h'"></p>
                  </div>
                  <div class="bg-white rounded-xl border border-slate-200 p-3">
                    <p class="text-xs text-slate-400">湿度</p>
                    <p class="font-semibold" x-text="weather.humidity + '%'"></p>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <div class="glass rounded-3xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold">加密行情</h3>
              <button @click="fetchCrypto" class="text-xs text-cyan-600 hover:text-cyan-700">刷新</button>
            </div>
            <template x-if="cryptoLoading">
              <div class="flex items-center gap-2 text-sm text-slate-500">
                <i class="fa-solid fa-spinner fa-spin w-4 h-4"></i>
                正在更新行情数据...
              </div>
            </template>
            <template x-if="!cryptoLoading && !crypto">
              <div class="text-sm text-slate-400">暂无数据，点击刷新获取。</div>
            </template>
            <template x-if="crypto">
              <div class="space-y-3">
                <div class="bg-white rounded-2xl border border-slate-200 p-4">
                  <p class="text-xs text-slate-400">Bitcoin / USD</p>
                  <p class="text-xl font-semibold" x-text="formatCurrency(crypto.bitcoin)"></p>
                  <svg class="w-full h-12 mt-2" viewBox="0 0 120 40">
                    <polyline :points="sparklinePoints(cryptoHistory.btc)" fill="none" stroke="#0ea5e9"
                      stroke-width="2" />
                  </svg>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 p-4">
                  <p class="text-xs text-slate-400">Ethereum / USD</p>
                  <p class="text-xl font-semibold" x-text="formatCurrency(crypto.ethereum)"></p>
                  <svg class="w-full h-12 mt-2" viewBox="0 0 120 40">
                    <polyline :points="sparklinePoints(cryptoHistory.eth)" fill="none" stroke="#8b5cf6"
                      stroke-width="2" />
                  </svg>
                </div>
              </div>
            </template>
          </div>

          <div class="glass rounded-3xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold">汇率快照</h3>
              <button @click="fetchFx" class="text-xs text-cyan-600 hover:text-cyan-700">刷新</button>
            </div>
            <template x-if="fxLoading">
              <div class="flex items-center gap-2 text-sm text-slate-500">
                <i class="fa-solid fa-spinner fa-spin w-4 h-4"></i>
                正在更新汇率数据...
              </div>
            </template>
            <template x-if="!fxLoading && !fx">
              <div class="text-sm text-slate-400">暂无数据，点击刷新获取。</div>
            </template>
            <template x-if="fx">
              <div class="space-y-3">
                <div class="bg-white rounded-2xl border border-slate-200 p-4">
                  <p class="text-xs text-slate-400">USD / CNY</p>
                  <p class="text-xl font-semibold" x-text="fx.cny"></p>
                  <svg class="w-full h-12 mt-2" viewBox="0 0 120 40">
                    <polyline :points="sparklinePoints(fxHistory.cny)" fill="none" stroke="#f97316" stroke-width="2" />
                  </svg>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 p-4">
                  <p class="text-xs text-slate-400">USD / EUR</p>
                  <p class="text-xl font-semibold" x-text="fx.eur"></p>
                  <svg class="w-full h-12 mt-2" viewBox="0 0 120 40">
                    <polyline :points="sparklinePoints(fxHistory.eur)" fill="none" stroke="#10b981" stroke-width="2" />
                  </svg>
                </div>
              </div>
            </template>
          </div>
        </div>
      </section>
    </main>

    <footer class="border-t border-slate-200 bg-white/70">
      <div
        class="max-w-6xl mx-auto px-4 py-6 text-xs text-slate-500 flex flex-col md:flex-row md:items-center md:justify-between gap-2">
        <span>数据来源：Open-Meteo / CoinGecko / ExchangeRate.host</span>
        <span>每次刷新都会更新组合指数与趋势图</span>
      </div>
    </footer>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('liveDashboard', () => ({
        weather: null,
        crypto: null,
        fx: null,
        weatherLoading: false,
        cryptoLoading: false,
        fxLoading: false,
        autoRefresh: true,
        refreshInterval: 30000,
        lastUpdated: '',
        intervalId: null,
        cryptoHistory: { btc: [], eth: [] },
        fxHistory: { cny: [], eur: [] },
        statusItems: [
          { label: '天气 API (Open-Meteo)', ok: true },
          { label: '行情 API (CoinGecko)', ok: true },
          { label: '汇率 API (ExchangeRate)', ok: true }
        ],
        init() {
          // 初始化：请求数据并启动自动刷新
          this.refreshAll();
          this.startAutoRefresh();

        },
        refreshAll() {
          // 并行刷新所有 API
          this.fetchWeather();
          this.fetchCrypto();
          this.fetchFx();
          this.lastUpdated = new Date().toLocaleTimeString();
        },
        toggleAutoRefresh() {
          // 切换自动刷新状态
          this.autoRefresh = !this.autoRefresh;
          if (this.autoRefresh) {
            this.startAutoRefresh();
          } else {
            this.stopAutoRefresh();
          }
          // this.refreshIcons();
        },
        startAutoRefresh() {
          // 启动定时轮询
          this.stopAutoRefresh();
          this.intervalId = setInterval(() => {
            if (this.autoRefresh) {
              this.refreshAll();
            }
          }, this.refreshInterval);
        },
        stopAutoRefresh() {
          // 停止定时轮询
          if (this.intervalId) {
            clearInterval(this.intervalId);
            this.intervalId = null;
          }
        },
        async fetchWeather() {
          // 拉取天气数据
          this.weatherLoading = true;
          try {
            const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=31.2304&longitude=121.4737&current=temperature_2m,apparent_temperature,wind_speed_10m,relative_humidity_2m&timezone=auto');
            const data = await response.json();
            this.weather = {
              location: '上海 · 实况天气',
              temperature: data.current.temperature_2m,
              apparent: data.current.apparent_temperature,
              wind: data.current.wind_speed_10m,
              humidity: data.current.relative_humidity_2m
            };
            this.statusItems[0].ok = true;
          } catch (error) {
            console.log('天气 API 异常', error);
            this.statusItems[0].ok = false;
          } finally {
            this.weatherLoading = false;
          }
        },
        async fetchCrypto() {
          // 拉取加密行情数据
          this.cryptoLoading = true;
          try {
            const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
            const data = await response.json();
            this.crypto = {
              bitcoin: data.bitcoin.usd,
              ethereum: data.ethereum.usd
            };
            this.pushHistory(this.cryptoHistory.btc, data.bitcoin.usd);
            this.pushHistory(this.cryptoHistory.eth, data.ethereum.usd);
            this.statusItems[1].ok = true;
          } catch (error) {
            console.log('行情 API 异常', error);
            this.statusItems[1].ok = false;
          } finally {
            this.cryptoLoading = false;
          }
        },
        async fetchFx() {
          // 拉取汇率数据
          this.fxLoading = true;
          try {
            const response = await fetch('https://api.exchangerate.host/latest?base=USD&symbols=CNY,EUR');
            const data = await response.json();
            this.fx = {
              cny: data.rates.CNY.toFixed(4),
              eur: data.rates.EUR.toFixed(4)
            };
            this.pushHistory(this.fxHistory.cny, data.rates.CNY);
            this.pushHistory(this.fxHistory.eur, data.rates.EUR);
            this.statusItems[2].ok = true;
          } catch (error) {
            console.log('汇率 API 异常', error);
            this.statusItems[2].ok = false;
          } finally {
            this.fxLoading = false;
          }
        },
        pushHistory(list, value) {
          // 维护历史数据队列
          list.push(value);
          if (list.length > 12) {
            list.shift();
          }
        },
        sparklinePoints(values) {
          // 将历史数据转换为 SVG 折线坐标
          if (!values.length) return '0,40 120,40';
          const max = Math.max(...values);
          const min = Math.min(...values);
          const range = max - min || 1;
          return values.map((val, idx) => {
            const x = (idx / (values.length - 1 || 1)) * 120;
            const y = 40 - ((val - min) / range) * 32 - 4;
            return `${x},${y}`;
          }).join(' ');
        },
        formatCurrency(value) {
          return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(value);
        },
        refreshIcons() {
          // Font Awesome auto-renders
        },
        get marketTrend() {
          if (this.cryptoHistory.btc.length < 2) return 0;
          const delta = this.cryptoHistory.btc[this.cryptoHistory.btc.length - 1] - this.cryptoHistory.btc[this.cryptoHistory.btc.length - 2];
          return Math.sign(delta);
        },
        get marketTrendText() {
          if (this.marketTrend > 0) return '上涨中';
          if (this.marketTrend < 0) return '回调中';
          return '横盘';
        },
        get fxTrend() {
          if (this.fxHistory.cny.length < 2) return 0;
          const delta = this.fxHistory.cny[this.fxHistory.cny.length - 1] - this.fxHistory.cny[this.fxHistory.cny.length - 2];
          return Math.sign(delta);
        },
        get fxTrendText() {
          if (this.fxTrend > 0) return '美元走强';
          if (this.fxTrend < 0) return '美元回落';
          return '平稳';
        },
        get pulseScore() {
          const weatherScore = this.weather ? Math.max(0, 30 - Math.abs(22 - this.weather.temperature)) : 10;
          const cryptoScore = this.cryptoHistory.btc.length > 1 ? 20 + this.marketTrend * 10 : 20;
          const fxScore = this.fxHistory.cny.length > 1 ? 20 - this.fxTrend * 5 : 20;
          return Math.round(weatherScore + cryptoScore + fxScore);
        },
        get pulseLabel() {
          if (this.pulseScore >= 70) return '热度高';
          if (this.pulseScore >= 55) return '稳态';
          return '观望';
        },
        get pulseBadge() {
          if (this.pulseScore >= 70) return 'bg-emerald-100 text-emerald-700';
          if (this.pulseScore >= 55) return 'bg-amber-100 text-amber-700';
          return 'bg-slate-100 text-slate-700';
        }
      }));
    });

    document.addEventListener('DOMContentLoaded', () => {

    });
  </script>
