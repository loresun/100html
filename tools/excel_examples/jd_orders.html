<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京东自营订单监控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
            <div>
                <p class="text-sm text-blue-600 font-medium">京东自营 · SKU 分析</p>
                <h1 class="text-2xl font-bold">京东自营订单监控</h1>
                <p class="text-sm text-slate-500 mt-1">按 SKU 统计 GMV、均单价值与毛利，适合运营主管快速审查订单结构。</p>
            </div>
            <div class="flex items-center gap-3">
                <a class="text-sm text-slate-500 hover:text-slate-900" href="index.html">返回示例库</a>
                <a class="text-sm text-blue-600 hover:text-blue-700" href="demo/jd_orders_demo.csv">下载 CSV Demo</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 space-y-6">
        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-lg font-semibold">上传订单文件</h2>
                    <p class="text-sm text-slate-500">字段需包含：日期、订单编号、SKU、件数、单价、成本、配送费。</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <label class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg cursor-pointer hover:bg-blue-700">
                        <i class="fa-solid fa-upload w-4 h-4"></i>
                        上传文件
                        <input id="fileInput" type="file" accept=".csv,.xlsx" class="hidden">
                    </label>
                    <button id="loadDemo" class="px-4 py-2 text-sm font-medium border border-blue-200 text-blue-700 rounded-lg hover:bg-blue-50">载入内嵌 Demo 数据</button>
                    <button id="exportExcel" class="px-4 py-2 text-sm font-medium border border-blue-200 text-blue-700 rounded-lg hover:bg-blue-50">导出当前 Excel</button>
                    <a class="text-sm text-slate-500 hover:text-slate-700" href="demo/jd_orders_demo.csv">下载 CSV Demo</a>
                </div>
            </div>
            <div id="fileStatus" class="mt-3 text-xs text-slate-500">未选择文件。</div>
        </section>

        <section class="grid gap-4 md:grid-cols-4" id="statsCards"></section>

        <section class="grid gap-6 lg:grid-cols-5">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-3">
                <h3 class="text-base font-semibold">SKU GMV 分布</h3>
                <canvas id="skuChart" class="mt-4 h-64"></canvas>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-2">
                <h3 class="text-base font-semibold">订单明细预览</h3>
                <div class="mt-4 overflow-auto max-h-80">
                    <table class="min-w-full text-sm text-slate-600" id="dataTable"></table>
                </div>
            </div>
        </section>
    </main>

    <script>


        const demoData = [
            { '日期': '2025-03-05', '订单编号': 'JD20250305001', 'SKU': 'JD-Keyboard', '件数': 1, '单价': 299, '成本': 180, '配送费': 12 },
            { '日期': '2025-03-05', '订单编号': 'JD20250305002', 'SKU': 'JD-Mouse', '件数': 2, '单价': 89, '成本': 40, '配送费': 8 },
            { '日期': '2025-03-06', '订单编号': 'JD20250306003', 'SKU': 'JD-Monitor', '件数': 1, '单价': 899, '成本': 620, '配送费': 25 },
            { '日期': '2025-03-06', '订单编号': 'JD20250306004', 'SKU': 'JD-USBHub', '件数': 3, '单价': 59, '成本': 25, '配送费': 10 },
            { '日期': '2025-03-07', '订单编号': 'JD20250307005', 'SKU': 'JD-SSD', '件数': 2, '单价': 429, '成本': 300, '配送费': 18 }
        ];

        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const statsCards = document.getElementById('statsCards');
        const dataTable = document.getElementById('dataTable');
        const loadDemo = document.getElementById('loadDemo');
        const exportExcel = document.getElementById('exportExcel');
        let chartInstance = null;
        let currentRows = demoData;

        const parseNumber = (value) => {
            if (value === null || value === undefined || value === '') return 0;
            if (typeof value === 'number') return value;
            return parseFloat(String(value).replace(/,/g, '')) || 0;
        };

        const normalizeRow = (row) => {
            return {
                date: row['日期'] || row['下单日期'],
                orderId: row['订单编号'] || row['订单号'],
                sku: row['SKU'] || row['商品编码'],
                qty: parseNumber(row['件数'] || row['数量']),
                price: parseNumber(row['单价']),
                cost: parseNumber(row['成本']),
                shipping: parseNumber(row['配送费'] || row['运费'])
            };
        };

        const render = (rows) => {
            currentRows = rows;
            const normalized = rows.map(normalizeRow).filter((row) => row.date && row.orderId);
            if (!normalized.length) return;

            const totalGmv = normalized.reduce((sum, row) => sum + row.qty * row.price, 0);
            const totalCost = normalized.reduce((sum, row) => sum + row.qty * row.cost + row.shipping, 0);
            const totalProfit = totalGmv - totalCost;
            const avgOrder = totalGmv / normalized.length;
            const margin = totalGmv ? totalProfit / totalGmv : 0;

            statsCards.innerHTML = [
                { label: 'GMV', value: totalGmv, suffix: '¥' },
                { label: '总利润', value: totalProfit, suffix: '¥' },
                { label: '平均客单价', value: avgOrder, suffix: '¥' },
                { label: '毛利率', value: margin * 100, suffix: '%' }
            ].map((item) => `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <p class="text-xs text-slate-500">${item.label}</p>
                    <p class="text-2xl font-semibold mt-2">${item.suffix === '%' ? item.value.toFixed(1) + item.suffix : item.suffix + item.value.toFixed(2)}</p>
                </div>
            `).join('');

            const skuMap = {};
            normalized.forEach((row) => {
                skuMap[row.sku] = (skuMap[row.sku] || 0) + row.qty * row.price;
            });
            const labels = Object.keys(skuMap);
            const values = labels.map((key) => skuMap[key]);

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(document.getElementById('skuChart'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: 'GMV (¥)',
                        data: values,
                        backgroundColor: '#3b82f6'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            const headerHtml = `
                <tr class="text-left text-xs text-slate-400 border-b">
                    <th class="py-2">日期</th>
                    <th class="py-2">订单编号</th>
                    <th class="py-2">SKU</th>
                    <th class="py-2">件数</th>
                    <th class="py-2">GMV</th>
                    <th class="py-2">利润</th>
                </tr>
            `;
            const bodyHtml = normalized.map((row) => {
                const gmv = row.qty * row.price;
                const profit = gmv - (row.qty * row.cost + row.shipping);
                return `
                    <tr class="border-b text-xs">
                        <td class="py-2">${row.date}</td>
                        <td class="py-2">${row.orderId}</td>
                        <td class="py-2">${row.sku}</td>
                        <td class="py-2">${row.qty}</td>
                        <td class="py-2">¥${gmv.toFixed(2)}</td>
                        <td class="py-2">¥${profit.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
            dataTable.innerHTML = headerHtml + bodyHtml;
        };

        const handleFile = (file) => {
            if (!file) return;
            fileStatus.textContent = `已选择文件：${file.name}`;
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                render(json);
            };
            reader.readAsArrayBuffer(file);
        };

        fileInput.addEventListener('change', (event) => handleFile(event.target.files[0]));
        loadDemo.addEventListener('click', () => {
            fileStatus.textContent = '已载入内嵌 Demo 数据。';
            render(demoData);
        });
        exportExcel.addEventListener('click', () => {
            const worksheet = XLSX.utils.json_to_sheet(currentRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, '订单数据');
            XLSX.writeFile(workbook, 'jd_orders_export.xlsx');
        });

        render(demoData);
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
