<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广告投放 ROI 追踪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
            <div>
                <p class="text-sm text-orange-600 font-medium">市场投放 · ROI 复盘</p>
                <h1 class="text-2xl font-bold">广告投放 ROI 追踪</h1>
                <p class="text-sm text-slate-500 mt-1">上传投放报表，自动计算 ROI、CPO 与转化率。</p>
            </div>
            <div class="flex items-center gap-3">
                <a class="text-sm text-slate-500 hover:text-slate-900" href="index.html">返回示例库</a>
                <a class="text-sm text-orange-600 hover:text-orange-700" href="demo/ads_report_demo.csv">下载 CSV Demo</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 space-y-6">
        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-lg font-semibold">上传投放文件</h2>
                    <p class="text-sm text-slate-500">字段需包含：日期、渠道、点击量、花费、订单数、成交额。</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <label class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium bg-orange-600 text-white rounded-lg cursor-pointer hover:bg-orange-700">
                        <i class="fa-solid fa-upload w-4 h-4"></i>
                        上传文件
                        <input id="fileInput" type="file" accept=".csv,.xlsx" class="hidden">
                    </label>
                    <button id="loadDemo" class="px-4 py-2 text-sm font-medium border border-orange-200 text-orange-700 rounded-lg hover:bg-orange-50">载入内嵌 Demo 数据</button>
                    <button id="exportExcel" class="px-4 py-2 text-sm font-medium border border-orange-200 text-orange-700 rounded-lg hover:bg-orange-50">导出当前 Excel</button>
                    <a class="text-sm text-slate-500 hover:text-slate-700" href="demo/ads_report_demo.csv">下载 CSV Demo</a>
                </div>
            </div>
            <div id="fileStatus" class="mt-3 text-xs text-slate-500">未选择文件。</div>
        </section>

        <section class="grid gap-4 md:grid-cols-4" id="statsCards"></section>

        <section class="grid gap-6 lg:grid-cols-5">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-3">
                <h3 class="text-base font-semibold">渠道 ROI 分布</h3>
                <canvas id="roiChart" class="mt-4 h-64"></canvas>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-2">
                <h3 class="text-base font-semibold">投放明细预览</h3>
                <div class="mt-4 overflow-auto max-h-80">
                    <table class="min-w-full text-sm text-slate-600" id="dataTable"></table>
                </div>
            </div>
        </section>
    </main>

    <script>


        const demoData = [
            { '日期': '2025-03-01', '渠道': '抖音广告', '点击量': 3200, '花费': 4800, '订单数': 86, '成交额': 25800 },
            { '日期': '2025-03-02', '渠道': '小红书', '点击量': 2100, '花费': 3100, '订单数': 54, '成交额': 17600 },
            { '日期': '2025-03-03', '渠道': '信息流', '点击量': 2800, '花费': 4200, '订单数': 71, '成交额': 22100 },
            { '日期': '2025-03-04', '渠道': 'SEM', '点击量': 1900, '花费': 3600, '订单数': 60, '成交额': 18400 },
            { '日期': '2025-03-05', '渠道': '联盟投放', '点击量': 1500, '花费': 2600, '订单数': 38, '成交额': 12600 }
        ];

        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const statsCards = document.getElementById('statsCards');
        const dataTable = document.getElementById('dataTable');
        const loadDemo = document.getElementById('loadDemo');
        const exportExcel = document.getElementById('exportExcel');
        let chartInstance = null;
        let currentRows = demoData;

        const parseNumber = (value) => {
            if (value === null || value === undefined || value === '') return 0;
            if (typeof value === 'number') return value;
            return parseFloat(String(value).replace(/,/g, '')) || 0;
        };

        const normalizeRow = (row) => {
            return {
                date: row['日期'] || row['日期'],
                channel: row['渠道'] || row['投放渠道'],
                clicks: parseNumber(row['点击量'] || row['点击']),
                spend: parseNumber(row['花费'] || row['成本']),
                orders: parseNumber(row['订单数'] || row['转化数']),
                revenue: parseNumber(row['成交额'] || row['GMV'])
            };
        };

        const render = (rows) => {
            currentRows = rows;
            const normalized = rows.map(normalizeRow).filter((row) => row.date && row.channel);
            if (!normalized.length) return;

            const totalSpend = normalized.reduce((sum, row) => sum + row.spend, 0);
            const totalRevenue = normalized.reduce((sum, row) => sum + row.revenue, 0);
            const totalOrders = normalized.reduce((sum, row) => sum + row.orders, 0);
            const roi = totalSpend ? totalRevenue / totalSpend : 0;
            const cpo = totalOrders ? totalSpend / totalOrders : 0;
            const cpc = normalized.reduce((sum, row) => sum + row.clicks, 0);
            const avgCpc = cpc ? totalSpend / cpc : 0;

            statsCards.innerHTML = [
                { label: '总花费', value: totalSpend, suffix: '¥' },
                { label: '成交额', value: totalRevenue, suffix: '¥' },
                { label: 'ROI', value: roi, suffix: 'x' },
                { label: 'CPO', value: cpo, suffix: '¥' }
            ].map((item) => `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <p class="text-xs text-slate-500">${item.label}</p>
                    <p class="text-2xl font-semibold mt-2">${item.suffix === 'x' ? item.value.toFixed(2) + item.suffix : item.suffix + item.value.toFixed(2)}</p>
                </div>
            `).join('');

            const channelMap = {};
            normalized.forEach((row) => {
                const value = row.spend ? row.revenue / row.spend : 0;
                channelMap[row.channel] = value;
            });
            const labels = Object.keys(channelMap);
            const values = labels.map((key) => channelMap[key]);

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(document.getElementById('roiChart'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: 'ROI',
                        data: values,
                        backgroundColor: '#f97316'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            const headerHtml = `
                <tr class="text-left text-xs text-slate-400 border-b">
                    <th class="py-2">日期</th>
                    <th class="py-2">渠道</th>
                    <th class="py-2">点击量</th>
                    <th class="py-2">花费</th>
                    <th class="py-2">ROI</th>
                </tr>
            `;
            const bodyHtml = normalized.map((row) => {
                const rowRoi = row.spend ? row.revenue / row.spend : 0;
                return `
                    <tr class="border-b text-xs">
                        <td class="py-2">${row.date}</td>
                        <td class="py-2">${row.channel}</td>
                        <td class="py-2">${row.clicks}</td>
                        <td class="py-2">¥${row.spend.toFixed(2)}</td>
                        <td class="py-2">${rowRoi.toFixed(2)}x</td>
                    </tr>
                `;
            }).join('');
            dataTable.innerHTML = headerHtml + bodyHtml;
        };

        const handleFile = (file) => {
            if (!file) return;
            fileStatus.textContent = `已选择文件：${file.name}`;
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                render(json);
            };
            reader.readAsArrayBuffer(file);
        };

        fileInput.addEventListener('change', (event) => handleFile(event.target.files[0]));
        loadDemo.addEventListener('click', () => {
            fileStatus.textContent = '已载入内嵌 Demo 数据。';
            render(demoData);
        });
        exportExcel.addEventListener('click', () => {
            const worksheet = XLSX.utils.json_to_sheet(currentRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, '投放数据');
            XLSX.writeFile(workbook, 'ads_report_export.xlsx');
        });

        render(demoData);
    </script>

<script src="../../help/help-widget-v2.js"></script>

</body>
</html>
