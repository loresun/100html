<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薪资汇总与成本分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
            <div>
                <p class="text-sm text-indigo-600 font-medium">HR · 薪资分析</p>
                <h1 class="text-2xl font-bold">薪资汇总与成本分析</h1>
                <p class="text-sm text-slate-500 mt-1">导入薪资表，自动计算人力成本、部门占比与人均成本。</p>
            </div>
            <div class="flex items-center gap-3">
                <a class="text-sm text-slate-500 hover:text-slate-900" href="index.html">返回示例库</a>
                <a class="text-sm text-indigo-600 hover:text-indigo-700" href="demo/payroll_summary_demo.csv">下载 CSV Demo</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 space-y-6">
        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-lg font-semibold">上传薪资文件</h2>
                    <p class="text-sm text-slate-500">字段需包含：月份、姓名、部门、基本工资、绩效奖金、社保扣款、个税扣款。</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <label class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium bg-indigo-600 text-white rounded-lg cursor-pointer hover:bg-indigo-700">
                        <i class="fa-solid fa-upload w-4 h-4"></i>
                        上传文件
                        <input id="fileInput" type="file" accept=".csv,.xlsx" class="hidden">
                    </label>
                    <button id="loadDemo" class="px-4 py-2 text-sm font-medium border border-indigo-200 text-indigo-700 rounded-lg hover:bg-indigo-50">载入内嵌 Demo 数据</button>
                    <button id="exportExcel" class="px-4 py-2 text-sm font-medium border border-indigo-200 text-indigo-700 rounded-lg hover:bg-indigo-50">导出当前 Excel</button>
                    <a class="text-sm text-slate-500 hover:text-slate-700" href="demo/payroll_summary_demo.csv">下载 CSV Demo</a>
                </div>
            </div>
            <div id="fileStatus" class="mt-3 text-xs text-slate-500">未选择文件。</div>
        </section>

        <section class="grid gap-4 md:grid-cols-4" id="statsCards"></section>

        <section class="grid gap-6 lg:grid-cols-5">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-3">
                <h3 class="text-base font-semibold">部门成本分布</h3>
                <canvas id="deptChart" class="mt-4 h-64"></canvas>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-2">
                <h3 class="text-base font-semibold">员工薪资预览</h3>
                <div class="mt-4 overflow-auto max-h-80">
                    <table class="min-w-full text-sm text-slate-600" id="dataTable"></table>
                </div>
            </div>
        </section>
    </main>

    <script>


        const demoData = [
            { '月份': '2025-02', '姓名': '李薇', '部门': '运营', '基本工资': 12000, '绩效奖金': 2500, '社保扣款': 1200, '个税扣款': 600 },
            { '月份': '2025-02', '姓名': '张晨', '部门': '销售', '基本工资': 10000, '绩效奖金': 4000, '社保扣款': 1100, '个税扣款': 750 },
            { '月份': '2025-02', '姓名': '王敏', '部门': '财务', '基本工资': 11000, '绩效奖金': 2000, '社保扣款': 1300, '个税扣款': 520 },
            { '月份': '2025-02', '姓名': '赵凯', '部门': '仓储', '基本工资': 8500, '绩效奖金': 1200, '社保扣款': 900, '个税扣款': 350 },
            { '月份': '2025-02', '姓名': '孙颖', '部门': '市场', '基本工资': 9800, '绩效奖金': 1800, '社保扣款': 1000, '个税扣款': 420 }
        ];

        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const statsCards = document.getElementById('statsCards');
        const dataTable = document.getElementById('dataTable');
        const loadDemo = document.getElementById('loadDemo');
        const exportExcel = document.getElementById('exportExcel');
        let chartInstance = null;
        let currentRows = demoData;

        const parseNumber = (value) => {
            if (value === null || value === undefined || value === '') return 0;
            if (typeof value === 'number') return value;
            return parseFloat(String(value).replace(/,/g, '')) || 0;
        };

        const normalizeRow = (row) => {
            return {
                month: row['月份'] || row['薪资月份'],
                name: row['姓名'] || row['员工'],
                dept: row['部门'] || row['部门名称'],
                base: parseNumber(row['基本工资'] || row['基本薪资']),
                bonus: parseNumber(row['绩效奖金'] || row['奖金']),
                social: parseNumber(row['社保扣款'] || row['社保']),
                tax: parseNumber(row['个税扣款'] || row['个税'])
            };
        };

        const render = (rows) => {
            currentRows = rows;
            const normalized = rows.map(normalizeRow).filter((row) => row.name && row.dept);
            if (!normalized.length) return;

            const totalCost = normalized.reduce((sum, row) => sum + row.base + row.bonus + row.social, 0);
            const totalTax = normalized.reduce((sum, row) => sum + row.tax, 0);
            const headcount = normalized.length;
            const avgCost = headcount ? totalCost / headcount : 0;

            statsCards.innerHTML = [
                { label: '人力成本', value: totalCost, suffix: '¥' },
                { label: '个税合计', value: totalTax, suffix: '¥' },
                { label: '人数', value: headcount, suffix: '' },
                { label: '人均成本', value: avgCost, suffix: '¥' }
            ].map((item) => `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <p class="text-xs text-slate-500">${item.label}</p>
                    <p class="text-2xl font-semibold mt-2">${item.suffix ? item.suffix + item.value.toFixed(2) : item.value.toFixed(0)}</p>
                </div>
            `).join('');

            const deptMap = {};
            normalized.forEach((row) => {
                const cost = row.base + row.bonus + row.social;
                deptMap[row.dept] = (deptMap[row.dept] || 0) + cost;
            });
            const labels = Object.keys(deptMap);
            const values = labels.map((key) => deptMap[key]);

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(document.getElementById('deptChart'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: '部门成本 (¥)',
                        data: values,
                        backgroundColor: '#6366f1'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            const headerHtml = `
                <tr class="text-left text-xs text-slate-400 border-b">
                    <th class="py-2">姓名</th>
                    <th class="py-2">部门</th>
                    <th class="py-2">基本工资</th>
                    <th class="py-2">奖金</th>
                    <th class="py-2">个税</th>
                </tr>
            `;
            const bodyHtml = normalized.map((row) => {
                return `
                    <tr class="border-b text-xs">
                        <td class="py-2">${row.name}</td>
                        <td class="py-2">${row.dept}</td>
                        <td class="py-2">¥${row.base.toFixed(2)}</td>
                        <td class="py-2">¥${row.bonus.toFixed(2)}</td>
                        <td class="py-2">¥${row.tax.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
            dataTable.innerHTML = headerHtml + bodyHtml;
        };

        const handleFile = (file) => {
            if (!file) return;
            fileStatus.textContent = `已选择文件：${file.name}`;
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                render(json);
            };
            reader.readAsArrayBuffer(file);
        };

        fileInput.addEventListener('change', (event) => handleFile(event.target.files[0]));
        loadDemo.addEventListener('click', () => {
            fileStatus.textContent = '已载入内嵌 Demo 数据。';
            render(demoData);
        });
        exportExcel.addEventListener('click', () => {
            const worksheet = XLSX.utils.json_to_sheet(currentRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, '薪资汇总');
            XLSX.writeFile(workbook, 'payroll_summary_export.xlsx');
        });

        render(demoData);
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
