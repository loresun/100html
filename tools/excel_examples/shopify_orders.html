<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify 独立站收入分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
            <div>
                <p class="text-sm text-purple-600 font-medium">独立站 · 渠道贡献</p>
                <h1 class="text-2xl font-bold">Shopify 独立站收入分析</h1>
                <p class="text-sm text-slate-500 mt-1">对比渠道、折扣、物流与税费，掌握净销售额趋势与利润结构。</p>
            </div>
            <div class="flex items-center gap-3">
                <a class="text-sm text-slate-500 hover:text-slate-900" href="index.html">返回示例库</a>
                <a class="text-sm text-purple-600 hover:text-purple-700" href="demo/shopify_orders_demo.csv">下载 CSV Demo</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 space-y-6">
        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-lg font-semibold">上传订单文件</h2>
                    <p class="text-sm text-slate-500">字段需包含：日期、订单号、渠道、商品、数量、订单金额、折扣、物流、税费、成本。</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <label class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium bg-purple-600 text-white rounded-lg cursor-pointer hover:bg-purple-700">
                        <i class="fa-solid fa-upload w-4 h-4"></i>
                        上传文件
                        <input id="fileInput" type="file" accept=".csv,.xlsx" class="hidden">
                    </label>
                    <button id="loadDemo" class="px-4 py-2 text-sm font-medium border border-purple-200 text-purple-700 rounded-lg hover:bg-purple-50">载入内嵌 Demo 数据</button>
                    <button id="exportExcel" class="px-4 py-2 text-sm font-medium border border-purple-200 text-purple-700 rounded-lg hover:bg-purple-50">导出当前 Excel</button>
                    <a class="text-sm text-slate-500 hover:text-slate-700" href="demo/shopify_orders_demo.csv">下载 CSV Demo</a>
                </div>
            </div>
            <div id="fileStatus" class="mt-3 text-xs text-slate-500">未选择文件。</div>
        </section>

        <section class="grid gap-4 md:grid-cols-4" id="statsCards"></section>

        <section class="grid gap-6 lg:grid-cols-5">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-3">
                <h3 class="text-base font-semibold">净销售额趋势</h3>
                <canvas id="salesChart" class="mt-4 h-64"></canvas>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-2">
                <h3 class="text-base font-semibold">订单明细预览</h3>
                <div class="mt-4 overflow-auto max-h-80">
                    <table class="min-w-full text-sm text-slate-600" id="dataTable"></table>
                </div>
            </div>
        </section>
    </main>

    <script>


        const demoData = [
            { '日期': '2025-03-08', '订单号': 'SH20250308001', '渠道': 'Shopify', '商品': 'T-Shirt', '数量': 3, '订单金额': 420, '折扣': 30, '物流': 25, '税费': 12, '成本': 180 },
            { '日期': '2025-03-09', '订单号': 'SH20250309002', '渠道': 'Instagram', '商品': 'Hoodie', '数量': 2, '订单金额': 560, '折扣': 40, '物流': 30, '税费': 18, '成本': 260 },
            { '日期': '2025-03-10', '订单号': 'SH20250310003', '渠道': 'Email', '商品': 'Cap', '数量': 4, '订单金额': 320, '折扣': 20, '物流': 16, '税费': 8, '成本': 120 },
            { '日期': '2025-03-11', '订单号': 'SH20250311004', '渠道': 'Shopify', '商品': 'Sneakers', '数量': 1, '订单金额': 780, '折扣': 50, '物流': 35, '税费': 22, '成本': 420 },
            { '日期': '2025-03-12', '订单号': 'SH20250312005', '渠道': 'TikTok', '商品': 'Backpack', '数量': 2, '订单金额': 680, '折扣': 60, '物流': 28, '税费': 20, '成本': 310 }
        ];

        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const statsCards = document.getElementById('statsCards');
        const dataTable = document.getElementById('dataTable');
        const loadDemo = document.getElementById('loadDemo');
        const exportExcel = document.getElementById('exportExcel');
        let chartInstance = null;
        let currentRows = demoData;

        const parseNumber = (value) => {
            if (value === null || value === undefined || value === '') return 0;
            if (typeof value === 'number') return value;
            return parseFloat(String(value).replace(/,/g, '')) || 0;
        };

        const normalizeRow = (row) => {
            return {
                date: row['日期'] || row['下单日期'],
                orderId: row['订单号'] || row['订单编号'],
                channel: row['渠道'] || row['来源'],
                product: row['商品'] || row['商品名称'],
                qty: parseNumber(row['数量'] || row['件数']),
                gross: parseNumber(row['订单金额'] || row['销售额']),
                discount: parseNumber(row['折扣'] || row['优惠']),
                shipping: parseNumber(row['物流'] || row['运费']),
                tax: parseNumber(row['税费'] || row['税']),
                cost: parseNumber(row['成本'])
            };
        };

        const render = (rows) => {
            currentRows = rows;
            const normalized = rows.map(normalizeRow).filter((row) => row.date && row.orderId);
            if (!normalized.length) return;

            const netSales = normalized.reduce((sum, row) => sum + row.gross - row.discount, 0);
            const totalShipping = normalized.reduce((sum, row) => sum + row.shipping, 0);
            const totalTax = normalized.reduce((sum, row) => sum + row.tax, 0);
            const totalCost = normalized.reduce((sum, row) => sum + row.cost, 0);
            const totalProfit = netSales - totalCost - totalShipping - totalTax;
            const margin = netSales ? totalProfit / netSales : 0;

            statsCards.innerHTML = [
                { label: '净销售额', value: netSales, suffix: '¥' },
                { label: '物流+税费', value: totalShipping + totalTax, suffix: '¥' },
                { label: '总利润', value: totalProfit, suffix: '¥' },
                { label: '利润率', value: margin * 100, suffix: '%' }
            ].map((item) => `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <p class="text-xs text-slate-500">${item.label}</p>
                    <p class="text-2xl font-semibold mt-2">${item.suffix === '%' ? item.value.toFixed(1) + item.suffix : item.suffix + item.value.toFixed(2)}</p>
                </div>
            `).join('');

            const grouped = {};
            normalized.forEach((row) => {
                grouped[row.date] = (grouped[row.date] || 0) + row.gross - row.discount;
            });
            const labels = Object.keys(grouped);
            const values = labels.map((key) => grouped[key]);

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(document.getElementById('salesChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: '净销售额 (¥)',
                        data: values,
                        borderColor: '#8b5cf6',
                        backgroundColor: 'rgba(139,92,246,0.15)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            const headerHtml = `
                <tr class="text-left text-xs text-slate-400 border-b">
                    <th class="py-2">日期</th>
                    <th class="py-2">订单号</th>
                    <th class="py-2">渠道</th>
                    <th class="py-2">净销售额</th>
                    <th class="py-2">利润</th>
                </tr>
            `;
            const bodyHtml = normalized.map((row) => {
                const net = row.gross - row.discount;
                const profit = net - row.cost - row.shipping - row.tax;
                return `
                    <tr class="border-b text-xs">
                        <td class="py-2">${row.date}</td>
                        <td class="py-2">${row.orderId}</td>
                        <td class="py-2">${row.channel}</td>
                        <td class="py-2">¥${net.toFixed(2)}</td>
                        <td class="py-2">¥${profit.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
            dataTable.innerHTML = headerHtml + bodyHtml;
        };

        const handleFile = (file) => {
            if (!file) return;
            fileStatus.textContent = `已选择文件：${file.name}`;
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                render(json);
            };
            reader.readAsArrayBuffer(file);
        };

        fileInput.addEventListener('change', (event) => handleFile(event.target.files[0]));
        loadDemo.addEventListener('click', () => {
            fileStatus.textContent = '已载入内嵌 Demo 数据。';
            render(demoData);
        });
        exportExcel.addEventListener('click', () => {
            const worksheet = XLSX.utils.json_to_sheet(currentRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, '订单数据');
            XLSX.writeFile(workbook, 'shopify_orders_export.xlsx');
        });

        render(demoData);
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
