    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淘宝订单审查仪表盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
            <div>
                <p class="text-sm text-emerald-600 font-medium">电商订单 · 日常审查</p>
                <h1 class="text-2xl font-bold">淘宝订单审查仪表盘</h1>
                <p class="text-sm text-slate-500 mt-1">上传订单 Excel/CSV，自动计算销售额、利润率与退款影响。</p>
            </div>
            <div class="flex items-center gap-3">
                <a class="text-sm text-slate-500 hover:text-slate-900" href="index.html">返回示例库</a>
                <a class="text-sm text-emerald-600 hover:text-emerald-700" href="demo/taobao_orders_demo.csv">下载 CSV Demo</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 space-y-6">
        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-lg font-semibold">上传订单文件</h2>
                    <p class="text-sm text-slate-500">字段需包含：日期、订单号、商品、数量、单价、成本、退款。</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <label class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium bg-emerald-600 text-white rounded-lg cursor-pointer hover:bg-emerald-700">
                        <i class="fa-solid fa-upload w-4 h-4"></i>
                        上传文件
                        <input id="fileInput" type="file" accept=".csv,.xlsx" class="hidden">
                    </label>
                    <button id="loadDemo" class="px-4 py-2 text-sm font-medium border border-emerald-200 text-emerald-700 rounded-lg hover:bg-emerald-50">载入内嵌 Demo 数据</button>
                    <button id="exportExcel" class="px-4 py-2 text-sm font-medium border border-emerald-200 text-emerald-700 rounded-lg hover:bg-emerald-50">导出当前 Excel</button>
                    <a class="text-sm text-slate-500 hover:text-slate-700" href="demo/taobao_orders_demo.csv">下载 CSV Demo</a>
                </div>
            </div>
            <div id="fileStatus" class="mt-3 text-xs text-slate-500">未选择文件。</div>
        </section>

        <section class="grid gap-4 md:grid-cols-4" id="statsCards"></section>

        <section class="grid gap-6 lg:grid-cols-5">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-3">
                <h3 class="text-base font-semibold">销售额走势</h3>
                <canvas id="salesChart" class="mt-4 h-64"></canvas>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-2">
                <h3 class="text-base font-semibold">订单明细预览</h3>
                <div class="mt-4 overflow-auto max-h-80">
                    <table class="min-w-full text-sm text-slate-600" id="dataTable"></table>
                </div>
            </div>
        </section>
    </main>

    <script>


        const demoData = [
            { '日期': '2025-03-01', '订单号': 'TB20250301001', '商品': '蓝牙耳机', '数量': 2, '单价': 199, '成本': 120, '退款': 0 },
            { '日期': '2025-03-01', '订单号': 'TB20250301002', '商品': '手机支架', '数量': 3, '单价': 39, '成本': 12, '退款': 0 },
            { '日期': '2025-03-02', '订单号': 'TB20250302003', '商品': '充电宝', '数量': 1, '单价': 149, '成本': 90, '退款': 20 },
            { '日期': '2025-03-03', '订单号': 'TB20250303004', '商品': '运动水杯', '数量': 4, '单价': 59, '成本': 28, '退款': 0 },
            { '日期': '2025-03-04', '订单号': 'TB20250304005', '商品': '键盘', '数量': 1, '单价': 329, '成本': 210, '退款': 0 }
        ];

        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const statsCards = document.getElementById('statsCards');
        const dataTable = document.getElementById('dataTable');
        const loadDemo = document.getElementById('loadDemo');
        const exportExcel = document.getElementById('exportExcel');
        let chartInstance = null;
        let currentRows = demoData;

        const parseNumber = (value) => {
            if (value === null || value === undefined || value === '') return 0;
            if (typeof value === 'number') return value;
            return parseFloat(String(value).replace(/,/g, '')) || 0;
        };

        const normalizeRow = (row) => {
            return {
                date: row['日期'] || row['下单日期'] || row['订单日期'],
                orderId: row['订单号'] || row['订单编号'],
                product: row['商品'] || row['商品名称'],
                qty: parseNumber(row['数量'] || row['件数']),
                price: parseNumber(row['单价'] || row['成交价']),
                cost: parseNumber(row['成本'] || row['采购成本']),
                refund: parseNumber(row['退款'] || row['退款金额'])
            };
        };

        const render = (rows) => {
            currentRows = rows;
            const normalized = rows.map(normalizeRow).filter((row) => row.date && row.orderId);
            if (!normalized.length) return;

            const totalRevenue = normalized.reduce((sum, row) => sum + row.qty * row.price - row.refund, 0);
            const totalCost = normalized.reduce((sum, row) => sum + row.qty * row.cost, 0);
            const totalProfit = totalRevenue - totalCost;
            const avgOrderValue = totalRevenue / normalized.length;
            const margin = totalRevenue ? (totalProfit / totalRevenue) : 0;

            statsCards.innerHTML = [
                { label: '销售额', value: totalRevenue, suffix: '¥' },
                { label: '总利润', value: totalProfit, suffix: '¥' },
                { label: '平均客单价', value: avgOrderValue, suffix: '¥' },
                { label: '利润率', value: margin * 100, suffix: '%' }
            ].map((item) => `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <p class="text-xs text-slate-500">${item.label}</p>
                    <p class="text-2xl font-semibold mt-2">${item.suffix === '%' ? item.value.toFixed(1) + item.suffix : item.suffix + item.value.toFixed(2)}</p>
                </div>
            `).join('');

            const grouped = {};
            normalized.forEach((row) => {
                grouped[row.date] = (grouped[row.date] || 0) + row.qty * row.price - row.refund;
            });
            const labels = Object.keys(grouped);
            const values = labels.map((key) => grouped[key]);

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(document.getElementById('salesChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: '销售额 (¥)',
                        data: values,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16,185,129,0.15)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            const headerHtml = `
                <tr class="text-left text-xs text-slate-400 border-b">
                    <th class="py-2">日期</th>
                    <th class="py-2">订单号</th>
                    <th class="py-2">商品</th>
                    <th class="py-2">数量</th>
                    <th class="py-2">销售额</th>
                    <th class="py-2">利润</th>
                </tr>
            `;
            const bodyHtml = normalized.map((row) => {
                const revenue = row.qty * row.price - row.refund;
                const profit = revenue - row.qty * row.cost;
                return `
                    <tr class="border-b text-xs">
                        <td class="py-2">${row.date}</td>
                        <td class="py-2">${row.orderId}</td>
                        <td class="py-2">${row.product}</td>
                        <td class="py-2">${row.qty}</td>
                        <td class="py-2">¥${revenue.toFixed(2)}</td>
                        <td class="py-2">¥${profit.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
            dataTable.innerHTML = headerHtml + bodyHtml;
        };

        const handleFile = (file) => {
            if (!file) return;
            fileStatus.textContent = `已选择文件：${file.name}`;
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                render(json);
            };
            reader.readAsArrayBuffer(file);
        };

        fileInput.addEventListener('change', (event) => handleFile(event.target.files[0]));
        loadDemo.addEventListener('click', () => {
            fileStatus.textContent = '已载入内嵌 Demo 数据。';
            render(demoData);
        });
        exportExcel.addEventListener('click', () => {
            const worksheet = XLSX.utils.json_to_sheet(currentRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, '订单数据');
            XLSX.writeFile(workbook, 'taobao_orders_export.xlsx');
        });

        render(demoData);
    </script>

<script src="../../help/help-widget-v2.js"></script>

</body>
</html>
