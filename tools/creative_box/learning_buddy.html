<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深度学习伙伴 - AI 创意生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8b5cf6; /* Violet */
            --secondary-color: #a78bfa;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-color: #1e293b;
            --subtle-text: #64748b;
            --border-color: #e2e8f0;
            --user-bubble: #ede9fe;
            --ai-bubble: #f1f5f9;
        }
        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
        }
        .linear-gradient-bg {
            background: linear-gradient(120deg, var(--primary-color), var(--secondary-color));
        }
        .main-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 24px;
        }
        .card {
            background-color: var(--card-background);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--secondary-color);
        }
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #f8fafc;
        }
        .hidden { display: none; }
        #settings-panel {
            position: fixed; top: 20px; right: -350px; width: 320px;
            background: var(--card-background); padding: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            border-radius: 8px 0 0 8px; transition: right 0.3s ease-in-out;
            z-index: 1000;
        }
        #settings-panel.visible { right: 0; }
        
        #chat-window {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .chat-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .user-message {
            background-color: var(--user-bubble);
            color: var(--primary-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            background-color: var(--ai-bubble);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--subtle-text);
            animation: typing 1s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>
    <!-- Settings Panel and Toggle -->

    <header class="linear-gradient-bg text-white text-center py-12 px-4">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">深度学习伙伴</h1>
        <p class="mt-4 text-lg md:text-xl max-w-3xl mx-auto opacity-90">不止是获取答案，更是学会提问。你的AI伙伴会用苏格拉底式提问，引导你探索知识的深层结构。</p>
    </header>

    <main class="main-container">
        <div id="setup-screen" class="card p-8 text-center">
            <label for="topic-input" class="block text-xl font-semibold mb-4">今天我们一起学习什么？</label>
            <input type="text" id="topic-input" class="input-field text-center text-lg mb-6" placeholder="例如：量子力学、红楼梦、或者JavaScript的闭包">
            <button id="start-learning-btn" class="btn btn-primary text-lg px-8 py-3">
                <i class="fas fa-brain mr-2"></i> 开始探索
            </button>
        </div>

        <div id="learning-screen" class="hidden">
            <div class="card overflow-hidden">
                <div class="p-4 border-b flex justify-between items-center">
                    <h2 class="text-xl font-bold">探索中：<span id="current-topic"></span></h2>
                    <div>
                        <button id="summarize-btn" class="btn bg-green-100 text-green-700 text-sm">生成学习小结</button>
                        <button id="reset-btn" class="btn bg-gray-200 text-gray-700 text-sm ml-2">重新开始</button>
                    </div>
                </div>
                <div id="chat-window" class="flex flex-col space-y-4">
                    <!-- Chat messages will appear here -->
                </div>
                <div class="p-4 border-t flex items-center gap-4">
                    <input type="text" id="chat-input" class="input-field flex-grow" placeholder="输入你的想法或回答...">
                    <button id="send-btn" class="btn btn-primary px-6">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
             <div id="summary-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
                <div class="card p-6 max-w-2xl w-full">
                    <h3 class="text-2xl font-bold mb-4">学习小结</h3>
                    <div id="summary-content" class="prose max-w-none h-64 overflow-y-auto"></div>
                    <div class="text-right mt-4">
                        <button id="close-summary-btn" class="btn bg-gray-200 text-gray-700">关闭</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        // 获取全局 DeepSeek Key
        function getGlobalDeepSeekKey() {
            try {
                const config = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                return config.deepseek || '';
            } catch (e) {
                return '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const setupScreen = document.getElementById('setup-screen');
            const learningScreen = document.getElementById('learning-screen');
            const startBtn = document.getElementById('start-learning-btn');
            const topicInput = document.getElementById('topic-input');
            const currentTopicSpan = document.getElementById('current-topic');
            const chatWindow = document.getElementById('chat-window');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const summarizeBtn = document.getElementById('summarize-btn');
            const resetBtn = document.getElementById('reset-btn');
            const summaryModal = document.getElementById('summary-modal');
            const summaryContent = document.getElementById('summary-content');
            const closeSummaryBtn = document.getElementById('close-summary-btn');

            // --- API Settings (使用全局配置) ---
            const API_URL = "https://api.deepseek.com/chat/completions";
            const API_MODEL = "deepseek-v4-flash";
            
            // 获取 API Key（优先使用全局配置）
            function getApiKey() {
                return getGlobalDeepSeekKey();
            }

            // --- State ---
            let conversationHistory = [];

            // --- Functions ---
            const startLearning = async () => {
                const topic = topicInput.value.trim();
                if (!topic) {
                    alert("请输入一个学习主题。");
                    return;
                }

                setupScreen.classList.add('hidden');
                learningScreen.classList.remove('hidden');
                currentTopicSpan.textContent = topic;

                const systemPrompt = "你是一个深度学习伙伴，采用苏格拉底式的教学方法。你的目标不是直接回答问题，而是通过提出启发性的问题来引导用户自己思考和探索。保持你的回答简洁、专注，并且总是以一个问题结束。";
                conversationHistory = [{ role: 'system', content: systemPrompt }];

                addMessageToChat('ai', `好的，我们来一起探索"${topic}"。要理解它，你认为我们首先应该从哪里开始呢？`);
                
                chatInput.focus();
            };

            const addMessageToChat = (sender, text, isLoading = false) => {
                const messageElement = document.createElement('div');
                messageElement.classList.add('chat-bubble');

                if (sender === 'user') {
                    messageElement.classList.add('user-message');
                    messageElement.textContent = text;
                } else if (isLoading) {
                    messageElement.classList.add('ai-message', 'typing-indicator');
                    messageElement.innerHTML = `<span></span><span></span><span></span>`;
                } else {
                    messageElement.classList.add('ai-message');
                    messageElement.textContent = text;
                }
                chatWindow.appendChild(messageElement);
                chatWindow.scrollTop = chatWindow.scrollHeight;
                return messageElement;
            };

            const handleUserMessage = async () => {
                const userInput = chatInput.value.trim();
                if (!userInput) return;

                addMessageToChat('user', userInput);
                conversationHistory.push({ role: 'user', content: userInput });
                chatInput.value = '';
                sendBtn.disabled = true;

                const loadingIndicator = addMessageToChat('ai', '', true);

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getApiKey()}` },
                        body: JSON.stringify({ model: API_MODEL, messages: conversationHistory })
                    });
                    if (!response.ok) throw new Error(`API error: ${response.statusText}`);
                    const data = await response.json();
                    const aiResponse = data.choices[0].message.content;

                    loadingIndicator.remove();
                    addMessageToChat('ai', aiResponse);
                    conversationHistory.push({ role: 'assistant', content: aiResponse });

                } catch (error) {
                    loadingIndicator.remove();
                    addMessageToChat('ai', `抱歉，我好像断线了... (${error.message})`);
                } finally {
                    sendBtn.disabled = false;
                    chatInput.focus();
                }
            };

            const generateSummary = async () => {
                const summaryPrompt = `基于我们以上的对话，请为我生成一份关于"${topicInput.value.trim()}"的学习小结。小结应该结构清晰，包含关键概念、核心问题和我的主要观点。`;
                const tempHistory = [...conversationHistory, { role: 'user', content: summaryPrompt }];
                
                summaryModal.classList.remove('hidden');
                summaryContent.innerHTML = '<p>正在为您总结...</p>';

                try {
                     const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getApiKey()}` },
                        body: JSON.stringify({ model: API_MODEL, messages: tempHistory })
                    });
                    if (!response.ok) throw new Error(`API error: ${response.statusText}`);
                    const data = await response.json();
                    const summary = data.choices[0].message.content;
                    summaryContent.innerHTML = summary.replace(/\n/g, '<br/>');
                } catch (error) {
                    summaryContent.innerHTML = `<p>总结生成失败: ${error.message}</p>`;
                }
            };
            
            const resetLearning = () => {
                conversationHistory = [];
                chatWindow.innerHTML = '';
                topicInput.value = '';
                learningScreen.classList.add('hidden');
                setupScreen.classList.remove('hidden');
            };

            // --- Event Listeners ---
            startBtn.addEventListener('click', startLearning);
            sendBtn.addEventListener('click', handleUserMessage);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleUserMessage();
            });
            summarizeBtn.addEventListener('click', generateSummary);
            resetBtn.addEventListener('click', resetLearning);
            closeSummaryBtn.addEventListener('click', () => summaryModal.classList.add('hidden'));

        });
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/creative_box_learning_buddy.md"></script>

</body>
</html>
