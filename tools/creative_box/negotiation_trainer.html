    <meta charset="UTF-8">

    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f7f8fa; }
        .linear-button { background-color: #5E6AD2; color: white; padding: 10px 20px; border-radius: 8px; font-weight: 500; transition: background-color 0.2s; }
        .linear-button:hover { background-color: #4a54a8; }
        .linear-button:disabled { background-color: #a5b4fc; cursor: not-allowed; }
        .secondary-button { background-color: transparent; color: #16a34a; border: 1px solid #16a34a; padding: 8px 16px; border-radius: 8px; font-weight: 500; transition: all 0.2s; }
        .secondary-button:hover { background-color: #16a34a; color: white; }
        .input-field, .textarea-field { border: 1px solid #E1E5E9; border-radius: 8px; padding: 12px 16px; width: 100%; transition: border-color 0.2s, box-shadow 0.2s; background-color: white; }
        .input-field:focus, .textarea-field:focus { outline: none; border-color: #5E6AD2; box-shadow: 0 0 0 2px rgba(94, 106, 210, 0.2); }
        #settings-panel { transition: transform 0.3s ease-in-out; transform: translateX(100%); }
        #settings-panel.open { transform: translateX(0); }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: #333; color: white; padding: 10px 20px; border-radius: 8px; z-index: 1000; opacity: 0; transition: opacity 0.3s, transform 0.3s; }
        .toast.show { opacity: 1; transform: translate(-50%, -10px); }
        .chat-container { height: 55vh; overflow-y: auto; scroll-behavior: smooth; }
        .chat-bubble { max-width: 75%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; }
        .user-bubble { background-color: #5E6AD2; color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
        .ai-bubble { background-color: #e5e7eb; color: #1f2937; border-bottom-left-radius: 4px; align-self: flex-start; }
        .typing-indicator span { height: 8px; width: 8px; background-color: #9ca3af; border-radius: 50%; display: inline-block; animation: wave 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes wave { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 32px; border-radius: 16px; max-width: 800px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #16a34a; animation: spin 1s ease infinite; }

<body class="p-4 sm:p-6 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800">
                <i class="fa-solid fa-handshake text-indigo-500"></i>
                74. 商务谈判练习室
            </h1>
            <button id="settings-btn" class="text-gray-600 hover:text-indigo-500 transition-colors"><i class="fa-solid fa-gear fa-2x"></i></button>
        </header>

        <div id="setup-container" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6">
            <h2 class="text-xl font-bold mb-4 text-gray-700">设定你的谈判场景</h2>
            <div class="space-y-4">
                <div>
                    <label class="font-medium text-gray-700">选择预设场景</label>
                    <select id="scenario-selector" class="input-field mt-1"></select>
                </div>
                <div>
                    <label class="font-medium text-gray-700">你的角色</label>
                    <input type="text" id="user-role" class="input-field mt-1" placeholder="例如：采购经理">
                </div>
                <div>
                    <label class="font-medium text-gray-700">你的谈判目标 (SMART原则)</label>
                    <textarea id="user-goal" rows="3" class="textarea-field mt-1" placeholder="例如：为1000个芯片争取到单价不高于$15，并要求2周内交货。"></textarea>
                </div>
                <div>
                    <label class="font-medium text-gray-700">你的谈判底线 (BATNA)</label>
                    <textarea id="user-batna" rows="2" class="textarea-field mt-1" placeholder="例如：如果单价高于$18或交货期超过1个月，我将转向备选供应商B。"></textarea>
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button id="start-btn" class="linear-button text-lg"><i class="fa-solid fa-gavel mr-2"></i>开始谈判</button>
            </div>
        </div>

        <div id="chat-container-wrapper" class="bg-white rounded-xl shadow-sm border border-gray-200 hidden">
            <div class="p-4 border-b border-gray-200"><h3 id="chat-title" class="font-bold text-lg text-gray-800"></h3></div>
            <div id="chat-container" class="p-6 flex flex-col gap-4 chat-container"></div>
            <div id="typing-indicator" class="p-6 hidden"><div class="ai-bubble typing-indicator"><span></span><span></span><span></span></div></div>
            <div class="p-4 border-t border-gray-200">
                <div class="flex items-center gap-4"><input type="text" id="message-input" class="input-field" placeholder="输入你的回应..." disabled><button id="send-btn" class="linear-button px-5" disabled><i class="fa-solid fa-paper-plane-top"></i></button></div>
                <div class="mt-4 flex justify-between items-center">
                    <button id="reset-btn" class="text-sm text-gray-500 hover:text-red-500"><i class="fa-solid fa-arrow-rotate-left mr-1"></i>放弃并重置</button>
                    <button id="analyze-btn" class="secondary-button" disabled><i class="fa-solid fa-chart-line mr-2"></i>结束谈判并复盘</button>
                </div>
            </div>
        </div>
    </div>

    <div id="analysis-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-green-600">谈判复盘报告</h2>
                <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-xmark fa-2x"></i></button>
            </div>
            <div id="analysis-content"></div>
            <div id="analysis-loader" class="text-center py-10">
                <div class="spinner mx-auto"></div>
                <p class="mt-4 text-gray-600">AI谈判专家正在分析本次谈判...</p>
            </div>
        </div>
    </div>

    <div id="settings-panel" class="fixed top-0 right-0 h-full w-96 bg-white shadow-lg p-6 z-50">
        <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">API 设置</h2><button id="close-settings-btn" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-xmark fa-2x"></i></button></div>
        <div class="space-y-4">
            <div><label for="api-url" class="font-medium text-gray-700">API URL</label><input type="text" id="api-url" class="input-field mt-1"></div>
            <div><label for="api-key" class="font-medium text-gray-700">API Key</label><input type="password" id="api-key" class="input-field mt-1" placeholder="留空使用默认Key"></div>
            <div><label for="api-model" class="font-medium text-gray-700">模型选择</label><select id="api-model" class="input-field mt-1"><option value="deepseek-v4-flash">DeepSeek V4 Flash</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option><option value="doubao-seed-1-6-thinking-250615">doubao-seed-1-6-thinking-250615</option><option value="doubao-seed-1-6-250615">doubao-seed-1-6-250615</option></select></div>
            <button id="save-settings-btn" class="linear-button w-full mt-4">保存设置</button>
        </div>
    </div>
    <div id="toast" class="toast"></div>

<script>
        // 获取全局 DeepSeek Key
        function getGlobalDeepSeekKey() {
            try {
                const config = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                return config.deepseek || '';
            } catch (e) {
                return '';
            }
        }

const dom = {
    setup: document.getElementById('setup-container'),
    chat: document.getElementById('chat-container-wrapper'),
    scenario: document.getElementById('scenario-selector'),
    userRole: document.getElementById('user-role'),
    userGoal: document.getElementById('user-goal'),
    userBatna: document.getElementById('user-batna'),
    startBtn: document.getElementById('start-btn'),
    resetBtn: document.getElementById('reset-btn'),
    chatTitle: document.getElementById('chat-title'),
    chatContainer: document.getElementById('chat-container'),
    messageInput: document.getElementById('message-input'),
    sendBtn: document.getElementById('send-btn'),
    typing: document.getElementById('typing-indicator'),
    analyzeBtn: document.getElementById('analyze-btn'),
    analysisModal: document.getElementById('analysis-modal'),
    analysisContent: document.getElementById('analysis-content'),
    analysisLoader: document.getElementById('analysis-loader'),
    closeModalBtn: document.getElementById('close-modal-btn'),
    settingsBtn: document.getElementById('settings-btn'),
    closeSettingsBtn: document.getElementById('close-settings-btn'),
    settingsPanel: document.getElementById('settings-panel'),
    saveSettingsBtn: document.getElementById('save-settings-btn'),
    apiUrlInput: document.getElementById('api-url'),
    apiKeyInput: document.getElementById('api-key'),
    apiModelInput: document.getElementById('api-model'),
    toast: document.getElementById('toast')
};

const DEFAULT_API_KEY = "";
let conversationHistory = [];
let negotiationData = {};

const scenarios = {
    price_negotiation: {
        title: "与供应商进行价格谈判",
        ai_role: "供应商销售总监",
        ai_goal: "维持芯片单价至少$16.5，并争取4周的交货期，因为最近原材料上涨且产能紧张。",
        ai_batna: "如果价格低于$15.5，将拒绝订单，并转向利润更高的欧洲客户。"
    },
    salary_negotiation: {
        title: "与新雇主进行薪酬谈判",
        ai_role: "公司HR总监",
        ai_goal: "将年薪总包控制在35万以内，并强调公司的期权和发展前景。",
        ai_batna: "如果候选人要求超过38万，将启动备选候选人B的招聘流程。"
    },
    project_deadline: {
        title: "与客户协商项目延期",
        ai_role: "甲方项目负责人",
        ai_goal: "最多只能接受1周的延期，并要求乙方提供每日进度报告作为补偿。",
        ai_batna: "如果延期超过10天，将根据合同条款要求赔偿，并考虑更换供应商。"
    }
};

function loadSettings() {
    dom.apiUrlInput.value = localStorage.getItem('apiUrl') || 'https://api.deepseek.com/chat/completions';
    dom.apiKeyInput.value = localStorage.getItem('apiKey') || '';
    dom.apiModelInput.value = localStorage.getItem('apiModel') || 'deepseek-v4-pro';
}
function saveSettings() {
    localStorage.setItem('apiUrl', dom.apiUrlInput.value);
    localStorage.setItem('apiKey', dom.apiKeyInput.value);
    localStorage.setItem('apiModel', dom.apiModelInput.value);
    showToast('设置已保存！');
    dom.settingsPanel.classList.remove('open');
}
function getApiKey() { return dom.apiKeyInput.value.trim() || getGlobalDeepSeekKey(); }
function getApiUrl() { return dom.apiUrlInput.value.trim(); }
function getModel() { return dom.apiModelInput.value; }
function showToast(message) {
    dom.toast.textContent = message;
    dom.toast.classList.add('show');
    setTimeout(() => dom.toast.classList.remove('show'), 3000);
}

function populateScenarios() {
    for (const key in scenarios) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = scenarios[key].title;
        dom.scenario.appendChild(option);
    }
}

function switchUI(mode) {
    dom.setup.classList.toggle('hidden', mode === 'chat');
    dom.chat.classList.toggle('hidden', mode === 'setup');
    dom.messageInput.disabled = (mode === 'setup');
    dom.sendBtn.disabled = (mode === 'setup');
    dom.analyzeBtn.disabled = (mode === 'setup');
}

function addMessage(role, text) {
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${role === 'user' ? 'user-bubble' : 'ai-bubble'}`;
    bubble.textContent = text;
    dom.chatContainer.appendChild(bubble);
    dom.chatContainer.scrollTop = dom.chatContainer.scrollHeight;
}

function setTyping(typing) {
    dom.typing.classList.toggle('hidden', !typing);
    if(typing) dom.chatContainer.scrollTop = dom.chatContainer.scrollHeight;
}

function createNegotiatorPrompt() {
    return `你是一位经验丰富的商务人士，现在你将扮演 **${negotiationData.ai_role}**。
你的谈判对手是 **${negotiationData.user_role}**。

---
**本次谈判的核心信息（你需要严格保密，不能直接告诉对手）：**
- **你的目标:** ${negotiationData.ai_goal}
- **你的底线 (BATNA):** ${negotiationData.ai_batna}
---

**你的任务:**
1.  根据你的秘密目标和底线，与对手进行专业、有策略的谈判。
2.  你的性格沉着、老练，既会坚持原则，也懂得在适当时机让步以促成协议。
3.  仔细分析对手的每一句话，洞察其真实意图和底线。
4.  不要轻易接受对方的第一个报价，要通过提问和论证来为自己争取最大利益。

现在，谈判开始。你的对手 (${negotiationData.user_role}) 的开场陈述是: "${negotiationData.user_goal}"

请根据以上所有信息，给出你的第一句回应。直接开始对话，不要有任何其他前言。`;
}

async function startNegotiation() {
    const selectedKey = dom.scenario.value;
    const scenario = scenarios[selectedKey];
    if (!dom.userRole.value || !dom.userGoal.value || !dom.userBatna.value) {
        showToast("请填写所有谈判设定信息");
        return;
    }

    negotiationData = {
        ...scenario,
        user_role: dom.userRole.value,
        user_goal: dom.userGoal.value,
        user_batna: dom.userBatna.value
    };

    switchUI('chat');
    dom.chatTitle.textContent = scenario.title;
    dom.chatContainer.innerHTML = '';
    
    const negotiatorPrompt = createNegotiatorPrompt();
    conversationHistory = [{ role: 'system', content: negotiatorPrompt.split('---')[0] }];
    const initialUserMessage = { role: 'user', content: `你好，我是${negotiationData.user_role}。我的目标是：${negotiationData.user_goal}。` };
    conversationHistory.push(initialUserMessage);
    addMessage('user', `(我的目标: ${negotiationData.user_goal})`);

    setTyping(true);
    try {
        const aiResponse = await callApi(conversationHistory);
        conversationHistory.push({ role: 'assistant', content: aiResponse });
        addMessage('assistant', aiResponse);
    } catch (error) {
        addMessage('assistant', `抱歉，模拟器出错了: ${error.message}`);
    } finally {
        setTyping(false);
        dom.messageInput.focus();
    }
}

async function sendMessage() {
    const messageText = dom.messageInput.value.trim();
    if (!messageText) return;

    dom.messageInput.value = '';
    addMessage('user', messageText);
    conversationHistory.push({ role: 'user', content: messageText });
    
    setTyping(true);
    dom.messageInput.disabled = true;
    dom.sendBtn.disabled = true;

    try {
        const aiResponse = await callApi(conversationHistory);
        conversationHistory.push({ role: 'assistant', content: aiResponse });
        addMessage('assistant', aiResponse);
    } catch (error) {
        addMessage('assistant', `抱歉，模拟器出错了: ${error.message}`);
    } finally {
        setTyping(false);
        dom.messageInput.disabled = false;
        dom.sendBtn.disabled = false;
        dom.messageInput.focus();
    }
}

function createAnalysisPrompt() {
    let transcript = "这是本次谈判的完整对话记录:\n\n";
    conversationHistory.slice(1).forEach(msg => {
        transcript += `${msg.role === 'user' ? negotiationData.user_role : negotiationData.ai_role}: ${msg.content}\n\n`;
    });
    
    return `你是一位顶级的哈佛大学谈判学教授。请根据以下完整信息，对 **${negotiationData.user_role}** 的表现进行一次全面、专业、深刻的复盘分析。

---
**谈判背景:**
- **场景:** ${negotiationData.title}
- **你的学生 (${negotiationData.user_role}) 的目标:** ${negotiationData.user_goal}
- **你的学生 (${negotiationData.user_role}) 的底线 (BATNA):** ${negotiationData.user_batna}
- **谈判对手 (${negotiationData.ai_role}) 的秘密目标:** ${negotiationData.ai_goal}
- **谈判对手 (${negotiationData.ai_role}) 的秘密底线 (BATNA):** ${negotiationData.ai_batna}
---
**谈判过程:**
${transcript}
---

### 分析要求
请从以下几个维度进行结构化分析，并给出具体分数（满分10分）和改进建议：

- **谈判结果 (Outcome)**: (双方是否达成协议？协议是否对学生有利？是否达到了双赢？)
- **价值创造 (Value Creation)**: (学生是否尝试将蛋糕做大，寻找双赢可能？还是只在单一维度上进行拉锯？)
- **价值获取 (Value Claiming)**: (学生在分配价值时是否有效？是否守住了自己的底线？)
- **策略运用 (Strategy)**: (学生是否使用了有效的谈判策略，如建立良好关系、有效提问、合理让步、管理期望等？)
- **综合评价与核心建议**: (总结学生的整体表现，并提供3条最关键的改进建议。)

### 输出格式
请严格使用以下格式，不要有任何前言。

**谈判复盘报告**

**1. 谈判结果:** [达成协议/未达成/达成部分协议]
   - [具体分析...]

**2. 价值创造能力:** [分数]/10
   - [具体分析...]

**3. 价值获取能力:** [分数]/10
   - [具体分析...]

**4. 策略运用水平:** [分数]/10
   - [具体分析...]

**5. 综合评价与核心建议:**
   - [综合评价...]
   - **核心建议:**
     1. [建议1]
     2. [建议2]
     3. [建议3]
`;
}


async function handleAnalysis() {
    dom.analysisModal.classList.remove('hidden');
    dom.analysisContent.innerHTML = '';
    dom.analysisLoader.classList.remove('hidden');

    const analysisPrompt = createAnalysisPrompt();
    const analysisMessages = [{ role: 'user', content: analysisPrompt }];
    
    try {
        const analysisModel = localStorage.getItem('apiModel')?.includes('thinking') ? localStorage.getItem('apiModel') : 'doubao-seed-1-6-thinking-250615';
        const response = await fetch(getApiUrl(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getApiKey()}` },
            body: JSON.stringify({ model: analysisModel, messages: analysisMessages, temperature: 0.5 })
        });
        
        if (!response.ok) throw new Error((await response.json()).error.message || `API 请求失败: ${response.status}`);
        
        const data = await response.json();
        let analysisText = data.choices[0].message.content;
        analysisText = analysisText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

        dom.analysisLoader.classList.add('hidden');
        dom.analysisContent.innerHTML = analysisText;
    } catch(error) {
        dom.analysisLoader.classList.add('hidden');
        dom.analysisContent.innerHTML = `<p class="text-red-500">分析失败: ${error.message}</p>`;
    }
}

async function callApi(messages) {
    const response = await fetch(getApiUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getApiKey()}` },
        body: JSON.stringify({ model: getModel(), messages: messages, temperature: 0.7 })
    });
    if (!response.ok) throw new Error((await response.json()).error.message || `API 请求失败: ${response.status}`);
    const data = await response.json();
    return data.choices[0].message.content;
}

function resetSimulation() {
    switchUI('setup');
    conversationHistory = [];
    negotiationData = {};
    dom.chatContainer.innerHTML = '';
}

dom.startBtn.addEventListener('click', startNegotiation);
dom.resetBtn.addEventListener('click', resetSimulation);
dom.sendBtn.addEventListener('click', sendMessage);
dom.messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
dom.analyzeBtn.addEventListener('click', handleAnalysis);
dom.closeModalBtn.addEventListener('click', () => dom.analysisModal.classList.add('hidden'));
dom.settingsBtn.addEventListener('click', () => dom.settingsPanel.classList.add('open'));
dom.closeSettingsBtn.addEventListener('click', () => dom.settingsPanel.classList.remove('open'));
dom.saveSettingsBtn.addEventListener('click', saveSettings);

document.addEventListener('DOMContentLoaded', () => {
    loadSettings();
    populateScenarios();
});
</script>
