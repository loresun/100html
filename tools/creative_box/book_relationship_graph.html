    <!-- Mermaid 多版本回退支持 - 使用 npmmirror 中国 CDN -->
    <script>
        // Mermaid CDN 配置 - 支持多版本回退
        // 优先尝试新版本，如果渲染失败则回退到旧版本
        const MERMAID_VERSIONS = [
            { version: '10.9.1', url: 'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js' },
            { version: '9.4.3', url: 'https://registry.npmmirror.com/mermaid/9.4.3/files/dist/mermaid.min.js' },
            { version: '8.14.0', url: 'https://registry.npmmirror.com/mermaid/8.14.0/files/dist/mermaid.min.js' }
        ];
        
        // 备用 CDN 源
        const MERMAID_FALLBACK_CDN = [
            (v) => `https://cdn.bootcdn.net/ajax/libs/mermaid/${v}/mermaid.min.js`,
            (v) => `https://cdn.jsdelivr.net/npm/mermaid@${v}/dist/mermaid.min.js`,
            (v) => `https://unpkg.com/mermaid@${v}/dist/mermaid.min.js`
        ];
        
        // 当前加载的 Mermaid 版本索引
        let currentMermaidVersionIndex = 0;
        let mermaidLoaded = false;
        
        // 动态加载脚本的辅助函数
        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        // 加载 Mermaid（带版本回退）
        async function loadMermaidVersion(versionIndex = 0) {
            if (versionIndex >= MERMAID_VERSIONS.length) {

                return false;
            }
            
            const { version, url } = MERMAID_VERSIONS[versionIndex];

            
            try {
                await loadScript(url);
                currentMermaidVersionIndex = versionIndex;
                mermaidLoaded = true;
                console.log(`Mermaid v${version} 加载成功`);
                return true;
            } catch (error) {
                // 尝试备用 CDN
                for (const cdnFn of MERMAID_FALLBACK_CDN) {
                    try {
                        await loadScript(cdnFn(version));
                        currentMermaidVersionIndex = versionIndex;
                        mermaidLoaded = true;

                        return true;
                    } catch (e) {
                        continue;
                    }
                }
                
                // 当前版本所有 CDN 都失败，尝试下一个版本
                return loadMermaidVersion(versionIndex + 1);
            }
        }
    </script>

        // === 渲染状态追踪 ===

        // === 初始化 Mermaid（延迟加载）===
        async function initMermaid() {
            if (!mermaidLoaded) {
                const loaded = await loadMermaidVersion(0);
                if (!loaded) {
                    throw new Error('Mermaid 加载失败，请刷新页面重试');
                }
            }
            
            mermaid.initialize({ 
                startOnLoad: false, 
                theme: 'default',
                flowchart: { useMaxWidth: false, htmlLabels: true },
                securityLevel: 'loose'
            });
        }

        const exportPngBtn = document.getElementById('exportPngBtn');
        const viewSourceBtn = document.getElementById('viewSourceBtn');
        const copySourceBtn = document.getElementById('copySourceBtn');
        const sourceContainer = document.getElementById('sourceContainer');
        const mermaidSource = document.getElementById('mermaidSource');
        const zoomControls = document.getElementById('zoomControls');
        const toast = document.getElementById('toast');
        
        // 版本历史相关 DOM
        const historyBtn = document.getElementById('historyBtn');
        const historyPanel = document.getElementById('historyPanel');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const versionList = document.getElementById('versionList');
        
        // 对话修改相关 DOM
        const editChatBtn = document.getElementById('editChatBtn');
        const chatModal = document.getElementById('chatModal');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        let currentMermaidCode = '';
        let panZoomInstance = null;
        let currentSvgElement = null;
        
        // === 版本历史管理 ===

        function buildPrompt(bookTitle) {
            return `请根据书名"${bookTitle}"生成该书籍的人物关系、主要情节和主题相关的 Mermaid 关系图代码。

要求：
1. 使用 graph TD 或 graph LR 格式
2. 节点使用中文，包含主要人物和他们之间的关系
3. 关系连线上标注关系类型（如：父子、师徒、敌对、恋人等）
4. 适当使用不同形状区分不同类型的节点

**重要语法规则**（必须严格遵守）：
- 节点ID只用英文字母和数字，如 A, B1, Person1
- 节点显示文本放在方括号/圆括号等中，如 A[张三] 或 B(李四)
- 不要在 subgraph 标题中使用引号，直接写文字，如：subgraph 第一代
- 连线标签用 |标签文字| 格式，如：A -->|父子| B
- 避免使用特殊符号和嵌套引号

请直接输出 Mermaid 代码，用 \`\`\`mermaid 和 \`\`\` 包裹。`;
        }

        // === 调用 API 生成 Mermaid 代码 ===
        async function fetchMermaidCode(bookTitle) {
            const { url, key, model } = getApiConfig();

            if (!key) {
                throw new Error('请先配置 API Key（点击右上角设置按钮，或在主页配置全局 DeepSeek Key）');
            }

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        { role: 'system', content: '你是一个专门生成 Mermaid 图表代码的助手。根据用户提供的书名，生成结构清晰的人物关系图。请使用简洁的语法，避免引号和特殊字符问题。' },
                        { role: 'user', content: buildPrompt(bookTitle) }
                    ],
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error?.message || `API 请求失败: ${response.status}`);
            }

            const data = await response.json();
            const content = data.choices?.[0]?.message?.content?.trim() || '';

            // 提取 Mermaid 代码
            const mermaidMatch = content.match(/```(?:mermaid)?\s*\n?([\s\S]*?)\n?```/);
            if (mermaidMatch && mermaidMatch[1]) {
                return sanitizeMermaidCode(mermaidMatch[1].trim());
            }

            // 备用检查
            if (content.includes('graph') || content.includes('flowchart')) {
                return sanitizeMermaidCode(content);
            }

            throw new Error('无法从 API 响应中提取 Mermaid 代码');
        }
        
        // === 清理 Mermaid 代码，修复常见语法问题 ===
        function sanitizeMermaidCode(code) {
            let sanitized = code;
            
            // 移除 subgraph 标题中的引号
            // 匹配 subgraph "xxx" 或 subgraph 'xxx' 格式
            sanitized = sanitized.replace(/subgraph\s+["']([^"']+)["']/g, 'subgraph $1');
            
            // 修复节点定义中的特殊字符
            // 将 【】替换为 []
            sanitized = sanitized.replace(/【/g, '[').replace(/】/g, ']');
            
            // 替换中文引号为英文引号
            sanitized = sanitized.replace(/"/g, '"').replace(/"/g, '"');
            sanitized = sanitized.replace(/'/g, "'").replace(/'/g, "'");
            
            // 移除可能导致问题的多余空行
            sanitized = sanitized.replace(/\n{3,}/g, '\n\n');
            

            return sanitized;
        }

        // === 切换到下一个 Mermaid 版本 ===
        async function switchToNextMermaidVersion() {
            const nextIndex = currentMermaidVersionIndex + 1;
            
            if (nextIndex >= MERMAID_VERSIONS.length) {
                return false; // 没有更多版本可尝试
            }
            
            // 移除当前已加载的 mermaid 脚本（无法真正卸载，但可以重新加载）
            // 由于 JS 模块的特性，我们需要重新加载页面或使用 iframe
            // 这里采用动态加载新版本的方式
            

            
            // 尝试加载下一个版本
            const loaded = await loadMermaidVersion(nextIndex);
            if (loaded) {
                // 重新初始化
                mermaid.initialize({ 
                    startOnLoad: false, 
                    theme: 'default',
                    flowchart: { useMaxWidth: false, htmlLabels: true },
                    securityLevel: 'loose'
                });
                return true;
            }
            
            return false;
        }

        // === 渲染 Mermaid 图表（支持多版本回退）===
        async function renderMermaid(code, attemptCount = 0) {
            currentMermaidCode = code;
            mermaidSource.textContent = code;

            if (panZoomInstance) {
                panZoomInstance.destroy();
                panZoomInstance = null;
            }
            
            // 确保 Mermaid 已加载
            if (!mermaidLoaded) {
                await initMermaid();
            }

            const currentVersion = MERMAID_VERSIONS[currentMermaidVersionIndex]?.version || 'unknown';
            
            try {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: 'default',
                    flowchart: { useMaxWidth: false, htmlLabels: true },
                    securityLevel: 'loose'
                });

                const { svg } = await mermaid.render('graph-' + Date.now(), code);
                mermaidChartContainer.innerHTML = svg;
                currentSvgElement = mermaidChartContainer.querySelector('svg');

                if (currentSvgElement) {
                    currentSvgElement.style.width = '100%';
                    currentSvgElement.style.height = 'auto';

                    panZoomInstance = svgPanZoom(currentSvgElement, {
                        zoomEnabled: true,
                        controlIconsEnabled: false,
                        fit: true,
                        center: true,
                        minZoom: 0.3,
                        maxZoom: 5
                    });

                    zoomControls.style.display = 'flex';
                }
                
                // 显示渲染版本信息
                renderVersionInfo = currentVersion;


                enableButtons(true);
                
                // 添加版本信息提示
                showVersionBadge(currentVersion);
                
            } catch (error) {

                
                // 尝试切换到下一个版本
                if (attemptCount < MERMAID_VERSIONS.length - 1) {
                    showToast(`v${currentVersion} 渲染失败，尝试切换版本...`);
                    
                    const switched = await switchToNextMermaidVersion();
                    if (switched) {
                        // 使用新版本重新渲染
                        return renderMermaid(code, attemptCount + 1);
                    }
                }
                
                // 所有版本都失败了
                const triedVersions = MERMAID_VERSIONS
                    .slice(0, attemptCount + 1)
                    .map(v => `v${v.version}`)
                    .join(', ');
                    
                mermaidChartContainer.innerHTML = `
                    <div class="text-center text-red-500 p-4">
                        <i class="fas fa-exclamation-triangle text-3xl mb-2"></i>

                        <p class="text-xs text-gray-500 mb-3">错误: ${error.message}</p>
                        <div class="flex gap-2 justify-center">
                            <button onclick="copyMermaidCode()" class="btn-secondary text-xs">
                                <i class="fas fa-copy mr-1"></i>复制代码

            }
        }

        // === 导出 PNG（修复版）===
        exportPngBtn.addEventListener('click', async () => {
            if (!currentSvgElement) return;
            
            showToast('正在生成 PNG...');
            
            try {
                // 克隆 SVG 并内联所有样式
                const clonedSvg = currentSvgElement.cloneNode(true);
                
                // 获取 SVG 的实际尺寸
                const bbox = currentSvgElement.getBBox();
                const viewBox = currentSvgElement.getAttribute('viewBox') || `0 0 ${bbox.width} ${bbox.height}`;
                const [, , vbWidth, vbHeight] = viewBox.split(' ').map(Number);
                
                // 设置合理的导出尺寸
                const scale = 2; // 2x 清晰度
                const width = Math.max(vbWidth || bbox.width || 800, 400);
                const height = Math.max(vbHeight || bbox.height || 600, 300);
                
                clonedSvg.setAttribute('width', width);
                clonedSvg.setAttribute('height', height);
                clonedSvg.setAttribute('viewBox', viewBox);
                
                // 添加白色背景
                const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                bgRect.setAttribute('width', '100%');
                bgRect.setAttribute('height', '100%');
                bgRect.setAttribute('fill', '#ffffff');
                clonedSvg.insertBefore(bgRect, clonedSvg.firstChild);
                
                // 内联所有计算样式到元素
                const allElements = clonedSvg.querySelectorAll('*');
                allElements.forEach(el => {
                    const computed = window.getComputedStyle(el);
                    // 保留关键样式
                    ['fill', 'stroke', 'stroke-width', 'font-family', 'font-size', 'font-weight'].forEach(prop => {
                        const value = computed.getPropertyValue(prop);
                        if (value && value !== 'none' && value !== 'initial') {
                            el.style[prop] = value;
                        }
                    });
                });
                
                // 添加字体声明到 SVG
                const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
                styleEl.textContent = `
                    text, .nodeLabel, .edgeLabel { 
                        font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif !important; 
                    }
                `;
                clonedSvg.insertBefore(styleEl, clonedSvg.firstChild);
                
                // 序列化 SVG
                const svgData = new XMLSerializer().serializeToString(clonedSvg);
                const svgBase64 = btoa(unescape(encodeURIComponent(svgData)));
                const dataUrl = `data:image/svg+xml;base64,${svgBase64}`;
                
                // 创建图片并绘制到 Canvas
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = width * scale;
                    canvas.height = height * scale;
                    const ctx = canvas.getContext('2d');
                    
                    // 白色背景
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 绘制图像
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // 导出
                    canvas.toBlob(blob => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${bookTitleInput.value || '书籍关系图'}.png`;
                        a.click();
                        URL.revokeObjectURL(url);
                        showToast('PNG 已导出');
                    }, 'image/png', 1.0);
                };
                
                img.onerror = () => {
                    showToast('PNG 导出失败，请尝试导出 SVG');
                };
                
                img.src = dataUrl;
            } catch (error) {

                showToast('PNG 导出失败: ' + error.message);
            }
        });

        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const closeFsBtn = document.getElementById('closeFsBtn');
        const fsResetBtn = document.getElementById('fsResetBtn');
        const fullscreenContainer = document.getElementById('fullscreenContainer');
        let fsPanZoomInstance = null;
        
        // 打开全屏
        fullscreenBtn.addEventListener('click', () => {
            if (!currentSvgElement) return;
            
            // 1. 克隆当前的 SVG 到全屏容器
            const clonedSvg = currentSvgElement.cloneNode(true);
            
            // 2. 关键修复：清理 svg-pan-zoom 产生的副作用
            // 移除可能存在的尺寸限制
            clonedSvg.setAttribute('width', '100%');
            clonedSvg.setAttribute('height', '100%');
            clonedSvg.removeAttribute('style');
            clonedSvg.style.width = '100%';
            clonedSvg.style.height = '100%';
            
            // 查找并解包 viewport（还原 SVG 结构）
            const oldViewport = clonedSvg.querySelector('.svg-pan-zoom_viewport');
            if (oldViewport) {
                // 将 viewport 内的内容移回到 svg 根节点下
                const fragment = document.createDocumentFragment();
                while (oldViewport.firstChild) {
                    fragment.appendChild(oldViewport.firstChild);
                }
                clonedSvg.appendChild(fragment);
                oldViewport.remove();
            }
            
            // 3. 放入全屏容器
            fullscreenContainer.innerHTML = '';
            fullscreenContainer.appendChild(clonedSvg);
            
            // 显示模态框
            fullscreenModal.classList.add('open');
            document.body.style.overflow = 'hidden'; // 禁止背景滚动
            
            // 4. 初始化全屏缩放（使用 requestAnimationFrame 确保 DOM 更新）
            requestAnimationFrame(() => {
                // 再次延时一帧，确保 layout 计算完成
                requestAnimationFrame(() => {
                    fsPanZoomInstance = svgPanZoom(clonedSvg, {
                        zoomEnabled: true,
                        controlIconsEnabled: false,
                        fit: true,
                        center: true,
                        minZoom: 0.1,
                        maxZoom: 20
                    });
                    
                    // 强制调整大小和居中
                    fsPanZoomInstance.resize();
                    fsPanZoomInstance.fit();
                    fsPanZoomInstance.center();
                });
            });
        });
        
        // 关闭全屏
        function closeFullscreen() {
            fullscreenModal.classList.remove('open');
            document.body.style.overflow = '';
            
            // 销毁实例
            if (fsPanZoomInstance) {
                fsPanZoomInstance.destroy();
                fsPanZoomInstance = null;
            }
            fullscreenContainer.innerHTML = '';
        }
        
        closeFsBtn.addEventListener('click', closeFullscreen);
        
        // ESC 键退出全屏
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && fullscreenModal.classList.contains('open')) {
                closeFullscreen();
            }
        });
        
        // 全屏重置视角
        fsResetBtn.addEventListener('click', () => {
            if (fsPanZoomInstance) {
                fsPanZoomInstance.resetZoom();
                fsPanZoomInstance.fit();
                fsPanZoomInstance.center();
            }
        });
