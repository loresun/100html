    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试官模拟器 - AI创意生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #64748b;
            font-size: 1.1rem;
        }

        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .settings-panel.collapsed {
            width: 60px;
            height: 60px;
            padding: 18px;
        }

        .settings-toggle {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #667eea;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-content {
            margin-top: 20px;
        }

        .collapsed .settings-content {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 面试配置 */
        .interview-setup {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .setup-group {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #e5e7eb;
        }

        .setup-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .setup-group select,
        .setup-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .setup-group select:focus,
        .setup-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .start-interview-btn {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-interview-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        /* 面试界面 */
        .interview-interface {
            display: none;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            margin-top: 30px;
        }

        .interview-main {
            background: white;
            border-radius: 16px;
            padding: 30px;
            border: 2px solid #e5e7eb;
        }

        .interview-sidebar {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #e5e7eb;
            height: fit-content;
        }

        .interviewer-info {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
        }

        .interviewer-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .interviewer-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .interviewer-role {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .chat-area {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .message.interviewer {
            flex-direction: row;
        }

        .message.candidate {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .message.interviewer .message-avatar {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .message.candidate .message-avatar {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .message-content {
            background: white;
            padding: 15px;
            border-radius: 12px;
            max-width: 70%;
            border: 1px solid #e5e7eb;
            line-height: 1.5;
        }

        .message.interviewer .message-content {
            border-left: 4px solid #667eea;
        }

        .message.candidate .message-content {
            border-left: 4px solid #10b981;
        }

        .response-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .response-input textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
            transition: all 0.3s ease;
        }

        .response-input textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-end;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
        }

        .interview-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 侧边栏 */
        .sidebar-section {
            margin-bottom: 25px;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .score-item {
            display: flex;
            justify-content: between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .score-label {
            font-size: 0.9rem;
            color: #6b7280;
            flex: 1;
        }

        .score-value {
            font-weight: 600;
            color: #1f2937;
        }

        /* 面试结果 */
        .interview-result {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            border: 2px solid #e5e7eb;
            display: none;
        }

        .result-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-score {
            display: inline-block;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .result-subtitle {
            color: #6b7280;
            font-size: 1.1rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .settings-panel {
                position: relative;
                top: auto;
                right: auto;
                margin-bottom: 20px;
            }

            .interview-interface {
                grid-template-columns: 1fr;
            }

            .interview-setup {
                grid-template-columns: 1fr;
            }

            .message-content {
                max-width: 85%;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>
    <div class="container">
        <!-- 设置面板 -->
        <div class="settings-panel collapsed" id="settingsPanel">
            <button class="settings-toggle" onclick="toggleSettings()">
                <i class="fas fa-cog"></i>
            </button>
            <div class="settings-content">
                <div class="form-group">
                    <label for="modelSelect">AI模型</label>
                    <select id="modelSelect">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v3-turbo-250106">豆包思维版</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="apiKey">API密钥</label>
                    <input type="password" id="apiKey" placeholder="留空使用默认密钥">
                </div>
            </div>
        </div>

        <div class="header">
            <h1><i class="fas fa-user-tie"></i> 面试官模拟器</h1>
            <p>AI模拟真实面试场景，提升你的面试技能与表现</p>
        </div>

        <!-- 面试配置 -->
        <div class="interview-setup">
            <div class="setup-group">
                <label for="position">面试职位</label>
                <select id="position">
                    <option value="frontend">前端工程师</option>
                    <option value="backend">后端工程师</option>
                    <option value="fullstack">全栈工程师</option>
                    <option value="mobile">移动端开发</option>
                    <option value="data">数据分析师</option>
                    <option value="pm">产品经理</option>
                    <option value="design">UI/UX设计师</option>
                    <option value="marketing">市场营销</option>
                    <option value="sales">销售代表</option>
                    <option value="hr">人力资源</option>
                    <option value="finance">财务分析</option>
                    <option value="consultant">管理咨询</option>
                </select>
            </div>

            <div class="setup-group">
                <label for="company">公司类型</label>
                <select id="company">
                    <option value="tech-startup">科技创业公司</option>
                    <option value="big-tech">大型科技公司</option>
                    <option value="traditional">传统企业</option>
                    <option value="consulting">咨询公司</option>
                    <option value="finance">金融机构</option>
                    <option value="government">政府机构</option>
                    <option value="nonprofit">非营利组织</option>
                    <option value="international">外企</option>
                </select>
            </div>

            <div class="setup-group">
                <label for="experience">工作经验</label>
                <select id="experience">
                    <option value="fresh">应届毕业生</option>
                    <option value="1-2">1-2年经验</option>
                    <option value="3-5">3-5年经验</option>
                    <option value="5-10">5-10年经验</option>
                    <option value="senior">10年以上</option>
                </select>
            </div>

            <div class="setup-group">
                <label for="style">面试风格</label>
                <select id="style">
                    <option value="friendly">友好轻松</option>
                    <option value="professional">专业严肃</option>
                    <option value="challenging">具有挑战性</option>
                    <option value="behavioral">行为面试</option>
                    <option value="technical">技术深入</option>
                    <option value="case-study">案例分析</option>
                </select>
            </div>

            <div class="setup-group">
                <label for="duration">面试时长</label>
                <select id="duration">
                    <option value="15">15分钟</option>
                    <option value="30">30分钟</option>
                    <option value="45">45分钟</option>
                    <option value="60">60分钟</option>
                </select>
            </div>

            <div class="setup-group">
                <label for="focus">重点考察</label>
                <select id="focus">
                    <option value="general">综合能力</option>
                    <option value="technical">技术能力</option>
                    <option value="communication">沟通能力</option>
                    <option value="leadership">领导力</option>
                    <option value="problem-solving">问题解决</option>
                    <option value="culture-fit">文化匹配</option>
                </select>
            </div>

            <button class="start-interview-btn" onclick="startInterview()">
                <i class="fas fa-play"></i> 开始面试
            </button>
        </div>

        <!-- 面试界面 -->
        <div class="interview-interface" id="interviewInterface">
            <div class="interview-main">
                <div class="interviewer-info">
                    <div class="interviewer-avatar" id="interviewerAvatar">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <div class="interviewer-name" id="interviewerName">面试官</div>
                    <div class="interviewer-role" id="interviewerRole">高级技术经理</div>
                </div>

                <div class="chat-area" id="chatArea">
                    <!-- 对话内容将在这里显示 -->
                </div>

                <div class="response-input">
                    <textarea id="responseInput" placeholder="请输入你的回答..."></textarea>
                    <button class="send-btn" onclick="sendResponse()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>

                <div class="interview-controls">
                    <button class="control-btn" onclick="requestHint()">
                        <i class="fas fa-lightbulb"></i> 提示
                    </button>
                    <button class="control-btn" onclick="skipQuestion()">
                        <i class="fas fa-forward"></i> 跳过
                    </button>
                    <button class="control-btn" onclick="endInterview()">
                        <i class="fas fa-stop"></i> 结束面试
                    </button>
                </div>
            </div>

            <div class="interview-sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">
                        <i class="fas fa-clock"></i> 面试进度
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #6b7280;">
                        <span id="currentTime">0分钟</span>
                        <span id="totalTime">30分钟</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">
                        <i class="fas fa-chart-line"></i> 实时评分
                    </div>
                    <div class="score-item">
                        <span class="score-label">专业知识</span>
                        <span class="score-value" id="knowledgeScore">-</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">沟通表达</span>
                        <span class="score-value" id="communicationScore">-</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">逻辑思维</span>
                        <span class="score-value" id="logicScore">-</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">应变能力</span>
                        <span class="score-value" id="adaptabilityScore">-</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">
                        <i class="fas fa-list-check"></i> 问题统计
                    </div>
                    <div class="score-item">
                        <span class="score-label">已回答</span>
                        <span class="score-value" id="answeredCount">0</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">剩余问题</span>
                        <span class="score-value" id="remainingCount">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 面试结果 -->
        <div class="interview-result" id="interviewResult">
            <div class="result-header">
                <div class="result-score" id="finalScore">0</div>
                <div class="result-title">面试评估完成</div>
                <div class="result-subtitle">以下是你的面试表现分析</div>
            </div>
            <div id="detailedFeedback"></div>
            <button class="start-interview-btn" onclick="restartInterview()" style="margin-top: 30px;">
                <i class="fas fa-redo"></i> 重新面试
            </button>
        </div>

        <!-- 加载状态 -->
        <div class="loading" id="loadingState" style="display: none;">
            <i class="fas fa-spinner"></i>
            <p>AI面试官正在准备...</p>
        </div>
    </div>

    <script>
        // 全局变量
        let interviewSession = null;
        let startTime = null;
        let currentQuestion = 0;
        let totalQuestions = 0;
        let interviewInProgress = false;
        let interviewData = {
            responses: [],
            scores: {
                knowledge: 0,
                communication: 0,
                logic: 0,
                adaptability: 0
            }
        };

        // 设置面板控制
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('collapsed');
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
        });

        // 加载保存的设置
        function loadSettings() {
            const savedModel = localStorage.getItem('interview_model');
            const savedApiKey = localStorage.getItem('interview_apikey');
            
            if (savedModel) {
                document.getElementById('modelSelect').value = savedModel;
            }
            if (savedApiKey) {
                document.getElementById('apiKey').value = savedApiKey;
            }
        }

        // 保存设置
        function saveSettings() {
            const model = document.getElementById('modelSelect').value;
            const apiKey = document.getElementById('apiKey').value;
            
            localStorage.setItem('interview_model', model);
            localStorage.setItem('interview_apikey', apiKey);
        }

        // 开始面试
        async function startInterview() {
            try {
                saveSettings();
                
                const position = document.getElementById('position').value;
                const company = document.getElementById('company').value;
                const experience = document.getElementById('experience').value;
                const style = document.getElementById('style').value;
                const duration = document.getElementById('duration').value;
                const focus = document.getElementById('focus').value;

                // 显示加载状态
                document.getElementById('loadingState').style.display = 'block';
                document.getElementById('interviewInterface').style.display = 'none';
                document.getElementById('interviewResult').style.display = 'none';

                // 生成面试官信息和开场
                const setupPrompt = `作为一个专业的面试模拟系统，请为以下面试设置生成面试官信息和开场问题：

面试配置：
- 职位：${getPositionName(position)}
- 公司类型：${getCompanyName(company)}
- 候选人经验：${experience}
- 面试风格：${getStyleName(style)}
- 面试时长：${duration}分钟
- 重点考察：${getFocusName(focus)}

请以JSON格式返回：
{
  "interviewer": {
    "name": "面试官姓名",
    "role": "职位头衔",
    "style": "面试风格描述"
  },
  "opening": "开场介绍和第一个问题",
  "questions_count": 8,
  "session_id": "unique_session_id"
}

要求面试官专业、真实，开场自然友好。`;

                const setupResponse = await callAPI(setupPrompt);
                const setupData = extractJSON(setupResponse);
                
                // 初始化面试会话
                interviewSession = setupData;
                startTime = Date.now();
                currentQuestion = 1;
                totalQuestions = setupData.questions_count || 8;
                interviewInProgress = true;
                
                // 更新界面
                document.getElementById('interviewerName').textContent = setupData.interviewer.name;
                document.getElementById('interviewerRole').textContent = setupData.interviewer.role;
                document.getElementById('totalTime').textContent = duration + '分钟';
                document.getElementById('remainingCount').textContent = totalQuestions - 1;
                
                // 显示开场消息
                displayMessage('interviewer', setupData.opening);
                
                // 显示面试界面
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('interviewInterface').style.display = 'grid';
                document.getElementById('interviewInterface').classList.add('fade-in');
                
                // 开始计时
                startTimer(parseInt(duration));
                
            } catch (error) {
                console.error('开始面试失败:', error);
                document.getElementById('loadingState').style.display = 'none';
                alert('启动面试失败，请检查网络连接和API设置');
            }
        }

        // 发送回答
        async function sendResponse() {
            if (!interviewInProgress) return;
            
            const response = document.getElementById('responseInput').value.trim();
            if (!response) {
                alert('请输入你的回答');
                return;
            }
            
            try {
                // 显示用户回答
                displayMessage('candidate', response);
                document.getElementById('responseInput').value = '';
                
                // 记录回答
                interviewData.responses.push({
                    question: currentQuestion,
                    answer: response,
                    timestamp: Date.now() - startTime
                });
                
                // 显示AI正在思考
                const thinkingMessage = displayMessage('interviewer', '');
                thinkingMessage.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在思考下一个问题...';
                
                // 生成下一个问题和评分
                const nextPrompt = `作为面试官，根据候选人的回答继续面试：

当前问题序号：${currentQuestion}/${totalQuestions}
候选人回答：${response}
面试配置：${JSON.stringify(getInterviewConfig())}

请以JSON格式返回：
{
  "feedback": "对当前回答的简短反馈",
  "next_question": "下一个问题",
  "scores": {
    "knowledge": 85,
    "communication": 78,
    "logic": 82,
    "adaptability": 80
  },
  "is_final": false
}

如果已经是最后一个问题，设置is_final为true，并准备结束面试。`;

                const nextResponse = await callAPI(nextPrompt);
                const nextData = extractJSON(nextResponse);
                
                // 移除思考消息，显示实际回复
                thinkingMessage.innerHTML = `${nextData.feedback}<br><br>${nextData.next_question}`;
                
                // 更新评分
                updateScores(nextData.scores);
                
                // 更新进度
                currentQuestion++;
                updateProgress();
                
                // 检查是否结束
                if (nextData.is_final || currentQuestion > totalQuestions) {
                    setTimeout(() => {
                        endInterview();
                    }, 2000);
                }
                
            } catch (error) {
                console.error('处理回答失败:', error);
                alert('处理回答时出现错误，请重试');
            }
        }

        // 显示消息
        function displayMessage(sender, content) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender} fade-in`;
            
            const avatar = sender === 'interviewer' ? 
                '<i class="fas fa-user-tie"></i>' : 
                '<i class="fas fa-user"></i>';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${content}</div>
            `;
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            return messageDiv.querySelector('.message-content');
        }

        // 更新评分
        function updateScores(scores) {
            document.getElementById('knowledgeScore').textContent = scores.knowledge || '-';
            document.getElementById('communicationScore').textContent = scores.communication || '-';
            document.getElementById('logicScore').textContent = scores.logic || '-';
            document.getElementById('adaptabilityScore').textContent = scores.adaptability || '-';
            
            interviewData.scores = scores;
        }

        // 更新进度
        function updateProgress() {
            const progress = (currentQuestion / totalQuestions) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('answeredCount').textContent = currentQuestion - 1;
            document.getElementById('remainingCount').textContent = Math.max(0, totalQuestions - currentQuestion + 1);
        }

        // 开始计时
        function startTimer(duration) {
            const startTime = Date.now();
            const endTime = startTime + duration * 60 * 1000;
            
            const timer = setInterval(() => {
                const now = Date.now();
                const elapsed = Math.floor((now - startTime) / 60000);
                const remaining = duration - elapsed;
                
                document.getElementById('currentTime').textContent = elapsed + '分钟';
                
                if (remaining <= 0 || !interviewInProgress) {
                    clearInterval(timer);
                    if (interviewInProgress) {
                        endInterview();
                    }
                }
            }, 1000);
        }

        // 请求提示
        async function requestHint() {
            if (!interviewInProgress) return;
            
            try {
                const hintPrompt = `为当前面试问题提供一个简短的回答提示，不要直接给出答案，而是提供思路方向。`;
                const hint = await callAPI(hintPrompt);
                
                displayMessage('interviewer', `💡 提示：${hint}`);
            } catch (error) {
                console.error('获取提示失败:', error);
            }
        }

        // 跳过问题
        function skipQuestion() {
            if (!interviewInProgress) return;
            
            displayMessage('candidate', '[已跳过此问题]');
            currentQuestion++;
            updateProgress();
            
            if (currentQuestion > totalQuestions) {
                endInterview();
            } else {
                displayMessage('interviewer', '好的，我们继续下一个问题...');
            }
        }

        // 结束面试
        async function endInterview() {
            if (!interviewInProgress) return;
            
            interviewInProgress = false;
            
            try {
                // 生成最终评估
                const evaluationPrompt = `请为以下面试表现生成详细评估报告：

面试数据：${JSON.stringify(interviewData)}
面试配置：${JSON.stringify(getInterviewConfig())}

请以JSON格式返回：
{
  "overall_score": 82,
  "summary": "整体表现总结",
  "strengths": ["优势1", "优势2", "优势3"],
  "improvements": ["改进建议1", "改进建议2"],
  "detailed_analysis": "详细分析",
  "recommendations": "后续建议"
}`;

                document.getElementById('loadingState').style.display = 'block';
                const evaluation = await callAPI(evaluationPrompt);
                const evalData = extractJSON(evaluation);
                
                // 显示结果
                displayResult(evalData);
                
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('interviewInterface').style.display = 'none';
                document.getElementById('interviewResult').style.display = 'block';
                
            } catch (error) {
                console.error('生成评估失败:', error);
                document.getElementById('loadingState').style.display = 'none';
                alert('生成面试评估时出现错误');
            }
        }

        // 显示结果
        function displayResult(evalData) {
            document.getElementById('finalScore').textContent = evalData.overall_score;
            document.getElementById('finalScore').style.background = getScoreColor(evalData.overall_score);
            
            const feedbackHTML = `
                <h3>综合评价</h3>
                <p style="line-height: 1.6; margin: 15px 0;">${evalData.summary}</p>
                
                <h3>优势表现</h3>
                <ul style="margin: 15px 0; padding-left: 20px;">
                    ${evalData.strengths.map(s => `<li style="margin: 5px 0;">${s}</li>`).join('')}
                </ul>
                
                <h3>改进建议</h3>
                <ul style="margin: 15px 0; padding-left: 20px;">
                    ${evalData.improvements.map(i => `<li style="margin: 5px 0;">${i}</li>`).join('')}
                </ul>
                
                <h3>详细分析</h3>
                <p style="line-height: 1.6; margin: 15px 0;">${evalData.detailed_analysis}</p>
                
                <h3>后续建议</h3>
                <p style="line-height: 1.6; margin: 15px 0;">${evalData.recommendations}</p>
            `;
            
            document.getElementById('detailedFeedback').innerHTML = feedbackHTML;
        }

        // 重新开始面试
        function restartInterview() {
            // 重置所有状态
            interviewSession = null;
            startTime = null;
            currentQuestion = 0;
            totalQuestions = 0;
            interviewInProgress = false;
            interviewData = {
                responses: [],
                scores: {
                    knowledge: 0,
                    communication: 0,
                    logic: 0,
                    adaptability: 0
                }
            };
            
            // 清空界面
            document.getElementById('chatArea').innerHTML = '';
            document.getElementById('responseInput').value = '';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('currentTime').textContent = '0分钟';
            document.getElementById('answeredCount').textContent = '0';
            document.getElementById('remainingCount').textContent = '-';
            
            // 重置评分
            document.getElementById('knowledgeScore').textContent = '-';
            document.getElementById('communicationScore').textContent = '-';
            document.getElementById('logicScore').textContent = '-';
            document.getElementById('adaptabilityScore').textContent = '-';
            
            // 隐藏结果，显示配置
            document.getElementById('interviewResult').style.display = 'none';
        }

        // 辅助函数
        function getPositionName(key) {
            const names = {
                frontend: '前端工程师',
                backend: '后端工程师',
                fullstack: '全栈工程师',
                mobile: '移动端开发',
                data: '数据分析师',
                pm: '产品经理',
                design: 'UI/UX设计师',
                marketing: '市场营销',
                sales: '销售代表',
                hr: '人力资源',
                finance: '财务分析',
                consultant: '管理咨询'
            };
            return names[key] || key;
        }

        function getCompanyName(key) {
            const names = {
                'tech-startup': '科技创业公司',
                'big-tech': '大型科技公司',
                traditional: '传统企业',
                consulting: '咨询公司',
                finance: '金融机构',
                government: '政府机构',
                nonprofit: '非营利组织',
                international: '外企'
            };
            return names[key] || key;
        }

        function getStyleName(key) {
            const names = {
                friendly: '友好轻松',
                professional: '专业严肃',
                challenging: '具有挑战性',
                behavioral: '行为面试',
                technical: '技术深入',
                'case-study': '案例分析'
            };
            return names[key] || key;
        }

        function getFocusName(key) {
            const names = {
                general: '综合能力',
                technical: '技术能力',
                communication: '沟通能力',
                leadership: '领导力',
                'problem-solving': '问题解决',
                'culture-fit': '文化匹配'
            };
            return names[key] || key;
        }

        function getInterviewConfig() {
            return {
                position: getPositionName(document.getElementById('position').value),
                company: getCompanyName(document.getElementById('company').value),
                experience: document.getElementById('experience').value,
                style: getStyleName(document.getElementById('style').value),
                duration: document.getElementById('duration').value,
                focus: getFocusName(document.getElementById('focus').value)
            };
        }

        function getScoreColor(score) {
            if (score >= 90) return 'linear-gradient(135deg, #10b981, #059669)';
            if (score >= 80) return 'linear-gradient(135deg, #3b82f6, #1d4ed8)';
            if (score >= 70) return 'linear-gradient(135deg, #f59e0b, #d97706)';
            if (score >= 60) return 'linear-gradient(135deg, #ef4444, #dc2626)';
            return 'linear-gradient(135deg, #6b7280, #4b5563)';
        }

        // 提取并解析 JSON（处理可能的 Markdown 代码块包裹）
        function extractJSON(text) {
            // 尝试直接解析
            try {
                return JSON.parse(text);
            } catch (e) {
                // 尝试从 Markdown 代码块中提取
                const jsonMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
                if (jsonMatch) {
                    return JSON.parse(jsonMatch[1].trim());
                }
                // 尝试查找 JSON 对象边界
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}');
                if (start !== -1 && end !== -1 && end > start) {
                    return JSON.parse(text.slice(start, end + 1));
                }
                throw new Error('无法解析 JSON: ' + text.substring(0, 100));
            }
        }

        // 获取全局 DeepSeek Key
        function getGlobalDeepSeekKey() {
            try {
                const config = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                return config.deepseek || '';
            } catch (e) {
                return '';
            }
        }

        // API调用函数
        async function callAPI(prompt) {
            const model = document.getElementById('modelSelect').value || 'deepseek-v4-flash';
            // 优先使用本地自定义 key，否则使用全局 key
            const apiKey = document.getElementById('apiKey').value || getGlobalDeepSeekKey();
            
            if (!apiKey) {
                throw new Error('请先在设置中配置 API Key，或在 index.html 配置全局 DeepSeek Key');
            }
            
            const response = await fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        {
                            role: "system",
                            content: "你是一个专业的面试官，具有丰富的招聘经验。你需要根据岗位要求进行专业、公平的面试，并提供建设性的反馈。"
                        },
                        {
                            role: "user", 
                            content: prompt
                        }
                    ],
                    temperature: 0.7,
                    max_tokens: 2000
                })
            });
            
            if (!response.ok) {
                throw new Error(`API请求失败: ${response.status}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }
    </script>
