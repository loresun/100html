    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识体系构建器 - AI创意生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .header h1 {
            color: #5E6AD2;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .subtitle {
            color: #64748B;
            font-size: 16px;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-primary {
            background: #5E6AD2;
            color: white;
            border: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #4C63D2;
            transform: translateY(-1px);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card h3 {
            color: #1E293B;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E1E5E9;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #5E6AD2;
            box-shadow: 0 0 0 3px rgba(94, 106, 210, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .tag {
            background: #F1F5F9;
            color: #64748B;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag:hover, .tag.active {
            background: #5E6AD2;
            color: white;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #5E6AD2, #4C63D2);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(94, 106, 210, 0.3);
        }

        .generate-btn:disabled {
            background: #94A3B8;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .knowledge-system {
            display: grid;
            gap: 24px;
        }

        .system-overview {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #F1F3F5;
        }

        .overview-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .stat-item {
            text-align: center;
            background: #F8FAFC;
            padding: 12px;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #5E6AD2;
        }

        .stat-label {
            font-size: 12px;
            color: #64748B;
            margin-top: 4px;
        }

        .knowledge-levels {
            display: grid;
            gap: 20px;
        }

        .level-section {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }

        .level-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .level-number {
            background: #5E6AD2;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .level-title {
            color: #1E293B;
            font-size: 18px;
            font-weight: 600;
        }

        .level-description {
            color: #64748B;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .knowledge-modules {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .module-card {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 16px;
            position: relative;
        }

        .module-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .module-icon {
            background: linear-gradient(135deg, #5E6AD2, #4C63D2);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .module-title {
            font-weight: 600;
            color: #1E293B;
            font-size: 14px;
        }

        .module-content {
            color: #64748B;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .module-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 11px;
            color: #64748B;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .connections-map {
            background: #FAFBFC;
            border: 2px dashed #CBD5E1;
            border-radius: 12px;
            padding: 24px;
            margin: 16px 0;
            position: relative;
            min-height: 200px;
        }

        .connection-node {
            position: absolute;
            background: white;
            border: 2px solid #5E6AD2;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            color: #5E6AD2;
            white-space: nowrap;
        }

        .connection-line {
            position: absolute;
            height: 2px;
            background: #5E6AD2;
            transform-origin: left center;
        }

        .learning-path {
            background: linear-gradient(135deg, #F0F9FF, #E0F2FE);
            border: 1px solid #BAE6FD;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }

        .path-title {
            color: #0C4A6E;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .path-steps {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .path-step {
            background: #0369A1;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .assessment-framework {
            background: #F0FDF4;
            border: 1px solid #BBF7D0;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }

        .assessment-title {
            color: #166534;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .assessment-criteria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
        }

        .criteria-item {
            background: #DCFCE7;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            color: #166534;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: white;
            color: #5E6AD2;
            border: 1px solid #5E6AD2;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: #5E6AD2;
            color: white;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .knowledge-modules {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            padding: 24px;
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .settings-panel.active {
            right: 0;
        }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .settings-overlay.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fas fa-sitemap"></i> 知识体系构建器</h1>
                <div class="subtitle">系统化构建专业知识体系，设计完整的学习和认知框架</div>
            </div>
            <div class="controls">
                <select id="modelSelect">
                    <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                    <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    <option value="doubao-seed-1-6-thinking-250615">豆包思维版</option>
                    <option value="doubao-seed-1-6-250615">豆包标准版</option>
                </select>
                <button class="btn-primary" onclick="toggleSettings()">
                    <i class="fas fa-cog"></i> 设置
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <h3><i class="fas fa-brain"></i> 知识领域</h3>
                <div class="form-group">
                    <label for="knowledgeDomain">知识领域</label>
                    <input type="text" id="knowledgeDomain" placeholder="例如：人工智能、数字营销、心理学等">
                </div>
                <div class="form-group">
                    <label for="domainScope">领域范围</label>
                    <select id="domainScope">
                        <option value="fundamental">基础理论</option>
                        <option value="applied">应用实践</option>
                        <option value="comprehensive">理论+实践</option>
                        <option value="specialized">专业细分</option>
                        <option value="interdisciplinary">跨学科</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="targetLevel">目标层次</label>
                    <select id="targetLevel">
                        <option value="beginner">入门级</option>
                        <option value="intermediate">中级</option>
                        <option value="advanced">高级</option>
                        <option value="expert">专家级</option>
                        <option value="master">大师级</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="existingKnowledge">已有知识基础</label>
                    <textarea id="existingKnowledge" placeholder="描述您在该领域已有的知识背景和经验"></textarea>
                </div>
                <div class="form-group">
                    <label for="specificGoals">具体目标</label>
                    <textarea id="specificGoals" placeholder="描述您希望通过知识体系达成的具体目标"></textarea>
                </div>
            </div>

            <div class="card">
                <h3><i class="fas fa-cogs"></i> 体系设计</h3>
                <div class="form-group">
                    <label for="structureType">体系结构</label>
                    <select id="structureType">
                        <option value="hierarchical">层次递进</option>
                        <option value="modular">模块化</option>
                        <option value="network">网络关联</option>
                        <option value="spiral">螺旋递进</option>
                        <option value="matrix">矩阵结构</option>
                        <option value="hybrid">混合模式</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="learningDepth">学习深度</label>
                    <select id="learningDepth">
                        <option value="overview">概览理解</option>
                        <option value="proficient">熟练掌握</option>
                        <option value="mastery">精通运用</option>
                        <option value="innovation">创新应用</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="timeframe">完成时间</label>
                    <select id="timeframe">
                        <option value="1-month">1个月</option>
                        <option value="3-months">3个月</option>
                        <option value="6-months">6个月</option>
                        <option value="1-year">1年</option>
                        <option value="2-years">2年</option>
                        <option value="long-term">长期规划</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>体系特色 (可多选)</label>
                    <div class="tag-group">
                        <span class="tag active" data-feature="systematic">系统性</span>
                        <span class="tag active" data-feature="practical">实用性</span>
                        <span class="tag" data-feature="cutting-edge">前沿性</span>
                        <span class="tag" data-feature="comprehensive">全面性</span>
                        <span class="tag" data-feature="flexible">灵活性</span>
                        <span class="tag" data-feature="measurable">可量化</span>
                        <span class="tag" data-feature="collaborative">协作性</span>
                        <span class="tag" data-feature="adaptive">适应性</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="applicationContext">应用场景</label>
                    <select id="applicationContext">
                        <option value="academic">学术研究</option>
                        <option value="professional">职业发展</option>
                        <option value="business">商业应用</option>
                        <option value="teaching">教学培训</option>
                        <option value="personal">个人兴趣</option>
                        <option value="consulting">咨询服务</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="constraints">限制条件</label>
                    <textarea id="constraints" placeholder="时间、资源、技术等限制条件（可选）"></textarea>
                </div>
            </div>
        </div>

        <div class="card">
            <button class="generate-btn" onclick="generateKnowledgeSystem()">
                <i class="fas fa-magic"></i> 构建知识体系
            </button>
        </div>

        <div class="results" id="results" style="display: none;">
            <h3><i class="fas fa-project-diagram"></i> 知识体系架构</h3>
            <div id="knowledgeSystemContent" class="knowledge-system"></div>
            
            <div class="action-buttons">
                <button class="btn-secondary" onclick="copyKnowledgeSystem()">
                    <i class="fas fa-copy"></i> 复制体系
                </button>
                <button class="btn-secondary" onclick="downloadKnowledgeSystem()">
                    <i class="fas fa-download"></i> 下载架构
                </button>
                <button class="btn-secondary" onclick="customizeSystem()">
                    <i class="fas fa-edit"></i> 自定义调整
                </button>
                <button class="btn-secondary" onclick="generateCurriculum()">
                    <i class="fas fa-graduation-cap"></i> 生成课程
                </button>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
    <div class="settings-panel" id="settingsPanel">
        <h3><i class="fas fa-cog"></i> API 设置</h3>
        <div class="form-group">
            <label for="apiKey">API 密钥</label>
            <input type="password" id="apiKey" placeholder="输入您的API密钥">
        </div>
        <div class="form-group">
            <label for="apiUrl">API 地址</label>
            <input type="text" id="apiUrl" value="https://api.deepseek.com/chat/completions">
        </div>
        <button class="btn-primary" onclick="saveSettings()">保存设置</button>
        <button class="btn-primary" onclick="toggleSettings()" style="margin-left: 8px;">关闭</button>
    </div>

    <script>
        // 获取全局 DeepSeek Key
        function getGlobalDeepSeekKey() {
            try {
                const config = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                return config.deepseek || '';
            } catch (e) {
                return '';
            }
        }

        // 全局变量
        let selectedFeatures = ['systematic', 'practical'];
        let currentKnowledgeSystem = '';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            initializeFeatureTags();
        });

        // 设置面板控制
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            const overlay = document.getElementById('settingsOverlay');
            panel.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // 保存设置
        function saveSettings() {
            const apiKey = document.getElementById('apiKey').value;
            const apiUrl = document.getElementById('apiUrl').value;
            const model = document.getElementById('modelSelect').value;

            localStorage.setItem('knowledge_system_api_key', apiKey);
            localStorage.setItem('knowledge_system_api_url', apiUrl);
            localStorage.setItem('knowledge_system_model', model);

            alert('设置已保存！');
            toggleSettings();
        }

        // 加载设置
        function loadSettings() {
            const apiKey = localStorage.getItem('knowledge_system_api_key') || '';
            const apiUrl = localStorage.getItem('knowledge_system_api_url') || 'https://api.deepseek.com/chat/completions';
            const model = localStorage.getItem('knowledge_system_model') || 'deepseek-v4-flash';

            document.getElementById('apiKey').value = apiKey;
            document.getElementById('apiUrl').value = apiUrl;
            document.getElementById('modelSelect').value = model;
        }

        // 初始化特色标签
        function initializeFeatureTags() {
            const tags = document.querySelectorAll('.tag[data-feature]');
            tags.forEach(tag => {
                tag.addEventListener('click', function() {
                    const feature = this.dataset.feature;
                    if (this.classList.contains('active')) {
                        this.classList.remove('active');
                        selectedFeatures = selectedFeatures.filter(f => f !== feature);
                    } else {
                        this.classList.add('active');
                        selectedFeatures.push(feature);
                    }
                });
            });
        }

        // 生成知识体系
        async function generateKnowledgeSystem() {
            // 获取表单数据
            const formData = {
                domain: document.getElementById('knowledgeDomain').value.trim(),
                scope: document.getElementById('domainScope').value,
                targetLevel: document.getElementById('targetLevel').value,
                existingKnowledge: document.getElementById('existingKnowledge').value.trim(),
                specificGoals: document.getElementById('specificGoals').value.trim(),
                structureType: document.getElementById('structureType').value,
                learningDepth: document.getElementById('learningDepth').value,
                timeframe: document.getElementById('timeframe').value,
                applicationContext: document.getElementById('applicationContext').value,
                constraints: document.getElementById('constraints').value.trim(),
                features: selectedFeatures
            };

            // 验证必填字段
            if (!formData.domain || !formData.specificGoals) {
                alert('请填写知识领域和具体目标！');
                return;
            }

            const button = document.querySelector('.generate-btn');
            const results = document.getElementById('results');
            
            // 设置加载状态
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在构建知识体系...';

            try {
                // 构建提示词
                const prompt = buildKnowledgeSystemPrompt(formData);
                
                // 调用AI API
                const knowledgeSystem = await callAI([
                    {
                        role: "system",
                        content: "你是一位资深的教育专家和知识架构师，擅长设计系统化的知识体系和学习框架。请提供科学、完整、实用的知识架构方案。"
                    },
                    {
                        role: "user",
                        content: prompt
                    }
                ]);

                // 显示结果
                currentKnowledgeSystem = knowledgeSystem;
                displayKnowledgeSystem(knowledgeSystem);
                
                results.style.display = 'block';
                results.scrollIntoView({ behavior: 'smooth' });
                
            } catch (error) {
                console.error('生成失败:', error);
                alert('生成失败，请检查API设置或网络连接：' + error.message);
            } finally {
                // 恢复按钮状态
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-magic"></i> 构建知识体系';
            }
        }

        // 构建知识体系提示词
        function buildKnowledgeSystemPrompt(data) {
            const scopeMap = {
                'fundamental': '基础理论',
                'applied': '应用实践',

        // API调用函数
        // 调用 AI API 获取响应，包含完整的错误处理
        async function callAI(messages) {
            const apiKey = localStorage.getItem('knowledge_system_api_key') || '';
            const apiUrl = localStorage.getItem('knowledge_system_api_url') || 'https://api.deepseek.com/chat/completions';
            const model = document.getElementById('modelSelect').value;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 4000
                    })
                });

                if (!response.ok) {
                    // 尝试解析错误响应获取详细信息
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `API请求失败: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                // 区分网络错误和 API 错误
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    throw new Error('网络连接失败，请检查网络设置');
                }
                throw error; // 重新抛出其他错误供调用方处理
            }
        }
