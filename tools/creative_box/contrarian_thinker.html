<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反直觉思考者 - AI 创意生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f7f8fa; }
        .linear-button { background-color: #5E6AD2; color: white; padding: 10px 20px; border-radius: 8px; font-weight: 500; transition: background-color 0.2s; }
        .linear-button:hover { background-color: #4a54a8; }
        .linear-button:disabled { background-color: #a5b4fc; cursor: not-allowed; }
        .input-field { border: 1px solid #E1E5E9; border-radius: 8px; padding: 12px 16px; width: 100%; transition: border-color 0.2s, box-shadow 0.2s; }
        .input-field:focus { outline: none; border-color: #5E6AD2; box-shadow: 0 0 0 2px rgba(94, 106, 210, 0.2); }
        #settings-panel { transition: transform 0.3s ease-in-out; transform: translateX(100%); }
        #settings-panel.open { transform: translateX(0); }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: #333; color: white; padding: 10px 20px; border-radius: 8px; z-index: 1000; opacity: 0; transition: opacity 0.3s, transform 0.3s; }
        .toast.show { opacity: 1; transform: translate(-50%, -10px); }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #5E6AD2; animation: spin 1s ease infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result-container { background-color: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05); border: 1px solid #e5e7eb; padding: 24px; transition: all 0.3s; }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { font-weight: bold; margin-top: 1.5em; margin-bottom: 0.5em; color: #1e293b; }
        .markdown-content h1 { font-size: 1.75rem; }
        .markdown-content h2 { font-size: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3em; }
        .markdown-content h3 { font-size: 1.25rem; }
        .markdown-content p { margin-bottom: 1em; line-height: 1.7; }
        .markdown-content ul, .markdown-content ol { padding-left: 2em; margin-bottom: 1em; }
        .markdown-content li { margin-bottom: 0.5em; }
        .markdown-content strong { font-weight: 600; }
        .markdown-content blockquote { border-left: 4px solid #dbeafe; padding-left: 1em; margin-left: 0; color: #64748b; }
        .example-tag { background-color: #eef2ff; color: #4338ca; padding: 4px 12px; border-radius: 999px; font-size: 0.875rem; cursor: pointer; transition: background-color 0.2s; display: inline-block; margin: 4px; }
        .example-tag:hover { background-color: #e0e7ff; }
        .argument-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; transition: box-shadow 0.2s; }
        .argument-card:hover { box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .argument-title { font-weight: bold; color: #4f46e5; margin-bottom: 8px; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800">
                <i class="fa-solid fa-brain-circuit text-indigo-500"></i>
                反直觉思考者
            </h1>
            <button id="settings-btn" class="text-gray-600 hover:text-indigo-500 transition-colors">
                <i class="fa-solid fa-gear fa-lg"></i>
            </button>
        </header>

        <!-- Input Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <h2 class="text-xl font-bold mb-4 text-gray-700">输入一个普遍接受的观点</h2>
            <p class="text-gray-500 mb-4">AI将从多个角度提出强有力的反驳论证，挑战你的传统智慧。</p>
            <textarea id="viewpoint-input" class="input-field" rows="3" placeholder="例如：失败是成功之母。"></textarea>
            <div class="mt-4">
                <p class="text-sm text-gray-600 mb-2">或尝试一些示例：</p>
                <span class="example-tag">多多益善。</span>
                <span class="example-tag">勤能补拙。</span>
                <span class="example-tag">眼见为实。</span>
            </div>
            <div class="mt-6 flex justify-end">
                <button id="generate-btn" class="linear-button text-lg">
                    <i class="fa-solid fa-lightbulb-exclamation mr-2"></i>挑战该观点
                </button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="result-wrapper" class="hidden">
             <div id="loader" class="text-center py-10 hidden">
                <div class="spinner mx-auto"></div>
                <p class="mt-4 text-gray-600">正在打破思维定势，构建新视角...</p>
            </div>
            <div id="result-container" class="result-container hidden">
                 <div class="flex justify-between items-start mb-4">
                     <h2 id="result-title" class="text-2xl font-bold text-indigo-600"></h2>
                     <div>
                         <button id="copy-btn" class="text-gray-500 hover:text-indigo-500" title="复制所有论证"><i class="fa-solid fa-copy"></i></button>
                         <button id="download-btn" class="text-gray-500 hover:text-indigo-500 ml-2" title="下载为Markdown"><i class="fa-solid fa-download"></i></button>
                     </div>
                 </div>
                <div id="result-output"></div>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="fixed top-0 right-0 h-full w-96 bg-white shadow-lg p-6 z-50">
        <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">API 设置</h2><button id="close-settings-btn" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-xmark fa-2x"></i></button></div>
        <div class="space-y-4">
            <div><label for="api-url" class="font-medium text-gray-700">API URL</label><input type="text" id="api-url" class="input-field mt-1"></div>
            <div><label for="api-key" class="font-medium text-gray-700">API Key</label><input type="password" id="api-key" class="input-field mt-1" placeholder="留空使用默认Key"></div>
            <div><label for="api-model" class="font-medium text-gray-700">模型选择</label><select id="api-model" class="input-field mt-1"><option value="deepseek-v4-flash">DeepSeek V4 Flash</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option></select></div>
            <button id="save-settings-btn" class="linear-button w-full mt-4">保存设置</button>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script>
        // 获取全局 DeepSeek Key
        function getGlobalDeepSeekKey() {
            try {
                const config = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                return config.deepseek || '';
            } catch (e) {
                return '';
            }
        }

        // --- DOM Elements ---
        const viewpointInput = document.getElementById('viewpoint-input');
        const generateBtn = document.getElementById('generate-btn');
        const resultWrapper = document.getElementById('result-wrapper');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const resultTitle = document.getElementById('result-title');
        const resultOutput = document.getElementById('result-output');
        const copyBtn = document.getElementById('copy-btn');
        const downloadBtn = document.getElementById('download-btn');

        const settingsBtn = document.getElementById('settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const apiUrlInput = document.getElementById('api-url');
        const apiKeyInput = document.getElementById('api-key');
        const apiModelInput = document.getElementById('api-model');
        const toast = document.getElementById('toast');

        // --- State & Defaults ---
        const DEFAULT_API_KEY = "";
        let lastResultRaw = '';

        // --- Settings Logic ---
        function loadSettings() {
            apiUrlInput.value = localStorage.getItem('apiUrl') || 'https://api.deepseek.com/chat/completions';
            apiKeyInput.value = localStorage.getItem('apiKey') || '';
            apiModelInput.value = localStorage.getItem('apiModel') || 'deepseek-v4-flash';
        }

        function saveSettings() {
            localStorage.setItem('apiUrl', apiUrlInput.value);
            localStorage.setItem('apiKey', apiKeyInput.value);
            localStorage.setItem('apiModel', apiModelInput.value);

            // Sync with global config if possible
            try {
                const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                localStorage.setItem('global_llm_config', JSON.stringify({
                    ...current,
                    deepseek: apiKeyInput.value.trim()
                }));
            } catch (e) {
                console.error('Failed to sync with global_llm_config', e);
            }

            showToast('设置已保存！');
            settingsPanel.classList.remove('open');
        }

        function getApiKey() { return apiKeyInput.value.trim() || getGlobalDeepSeekKey(); }
        function getApiUrl() { return apiUrlInput.value.trim(); }
        function getModel() { return apiModelInput.value; }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- UI Logic ---
        function setLoading(isLoading) {
            resultWrapper.classList.remove('hidden');
            if (isLoading) {
                loader.classList.remove('hidden');
                resultContainer.classList.add('hidden');
                generateBtn.disabled = true;
                generateBtn.innerHTML = `<i class="fa-solid fa-sync fa-spin mr-2"></i>正在思考...`;
            } else {
                loader.classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.innerHTML = `<i class="fa-solid fa-lightbulb-exclamation mr-2"></i>挑战该观点`;
            }
        }
        
        function renderArguments(args) {
            resultOutput.innerHTML = '';
            args.forEach(arg => {
                const card = document.createElement('div');
                card.className = 'argument-card';
                card.innerHTML = `
                    <h3 class="argument-title">${arg.title}</h3>
                    <p class="text-gray-700">${arg.explanation}</p>
                `;
                resultOutput.appendChild(card);
            });
        }
        
        function parseResponse(responseText) {
            const lines = responseText.split('\n').filter(line => line.trim() !== '');
            const args = [];
            let currentArg = null;
            for (const line of lines) {
                if (line.startsWith('**视角')) {
                    if (currentArg) {
                        args.push(currentArg);
                    }
                    currentArg = { title: line.replace(/\*\*/g, '').trim(), explanation: '' };
                } else if (currentArg && !line.startsWith('---')) {
                    currentArg.explanation += line.trim() + ' ';
                }
            }
            if (currentArg) {
                args.push(currentArg);
            }
            return args.filter(arg => arg.title && arg.explanation);
        }
        
        function toMarkdown(args, viewpoint) {
            let markdown = `## 对“${viewpoint}”的反直觉思考\n\n`;
            args.forEach(arg => {
                markdown += `### ${arg.title}\n${arg.explanation.trim()}\n\n`;
            });
            return markdown;
        }

        // --- Core Logic ---
        async function generateArguments() {
            const viewpoint = viewpointInput.value.trim();
            if (!viewpoint) {
                showToast('请输入一个观点。');
                return;
            }

            setLoading(true);
            lastResultRaw = ''; // Reset last result

            try {
                const prompt = `你是一位顶级的批判性思维专家和“杠精”。你的任务是针对用户提出的一个普遍接受的观点，从多个角度提出强有力的、反直觉的、颠覆性的反驳论证。

                **用户观点:** "${viewpoint}"

                **请严格按照以下格式，生成3-5个完全不同角度的反驳论证。每个论证都必须包含视角标题和详细解释。请务必直接输出结果，不要有任何多余的开头或结尾。**

                **格式要求:**
                **视角一：[从一个刁钻的角度命名，例如：幸存者偏差的陷阱]**
                [详细解释这个角度下的反驳论证，用具体的例子或逻辑来支撑。]

                ---
                **视角二：[另一个完全不同的角度，例如：机会成本的诅咒]**
                [详细解释这个角度下的反驳论证。]

                ---
                **视角三：[再一个角度，例如：定义模糊的谬误]**
                [详细解释...]`;

                const messages = [{ role: 'system', content: '你是一位顶级的批判性思维专家和“杠精”，你的目标是挑战传统智慧。' }, { role: 'user', content: prompt }];
                
                let response;
                try {
                    response = await fetch(getApiUrl(), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getApiKey()}` },
                        body: JSON.stringify({ model: getModel(), messages: messages, temperature: 0.8 })
                    });
                } catch (e) {
                    throw new Error(`网络请求失败: ${e.message}`);
                }

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error.message || `API 请求失败: ${response.status}`);
                }

                const data = await response.json();
                const rawContent = data.choices[0].message.content;
                lastResultRaw = rawContent;
                
                const parsedArgs = parseResponse(rawContent);
                
                if (parsedArgs.length === 0) {
                   throw new Error("未能解析出有效的论证，请检查API返回格式。")
                }

                resultTitle.textContent = `对“${viewpoint}”的反思`;
                renderArguments(parsedArgs);
                resultContainer.classList.remove('hidden');

            } catch (error) {
                console.error("API Error:", error);
                resultContainer.classList.remove('hidden');
                resultOutput.innerHTML = `<p class="text-red-500">生成失败: ${error.message}</p><p class="text-gray-500 mt-2">原始返回: <pre class="whitespace-pre-wrap bg-gray-100 p-2 rounded">${lastResultRaw}</pre></p>`;
            } finally {
                setLoading(false);
            }
        }
        
        function copyResult() {
            if (!lastResultRaw) {
                showToast('没有可复制的内容。');
                return;
            }
             const parsedArgs = parseResponse(lastResultRaw);
             const markdownText = toMarkdown(parsedArgs, viewpointInput.value.trim());
            navigator.clipboard.writeText(markdownText).then(() => {
                showToast('已复制为Markdown格式！');
            }, () => {
                showToast('复制失败！');
            });
        }
        
        function downloadResult() {
             if (!lastResultRaw) {
                showToast('没有可下载的内容。');
                return;
            }
            const parsedArgs = parseResponse(lastResultRaw);
            const markdownText = toMarkdown(parsedArgs, viewpointInput.value.trim());
            const blob = new Blob([markdownText], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `反直觉思考_${viewpointInput.value.trim().substring(0,15).replace(/[\\/:*?"<>|]/g, '_')}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- Event Listeners ---
        generateBtn.addEventListener('click', generateArguments);
        copyBtn.addEventListener('click', copyResult);
        downloadBtn.addEventListener('click', downloadResult);
        
        document.querySelectorAll('.example-tag').forEach(tag => {
            tag.addEventListener('click', () => {
                viewpointInput.value = tag.textContent;
                generateArguments();
            });
        });
        
        settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
        closeSettingsBtn.addEventListener('click', () => settingsPanel.classList.remove('open'));
        saveSettingsBtn.addEventListener('click', saveSettings);
        
        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
        });

    </script>

<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/creative_box_contrarian_thinker.md"></script>

</html>
