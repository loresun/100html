<script>
        // 获取全局 DeepSeek Key
        function getGlobalDeepSeekKey() {
            try {
                const config = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                return config.deepseek || '';
            } catch (e) {
                return '';
            }
        }

// --- DOM Elements ---
const setupContainer = document.getElementById('setup-container'), chatContainerWrapper = document.getElementById('chat-container-wrapper'), scenarioSelector = document.getElementById('scenario-selector'), startBtn = document.getElementById('start-btn'), resetBtn = document.getElementById('reset-btn'), chatContainer = document.getElementById('chat-container'), chatTitle = document.getElementById('chat-title'), chatSubtitle = document.getElementById('chat-subtitle'), messageInput = document.getElementById('message-input'), sendBtn = document.getElementById('send-btn'), typingIndicator = document.getElementById('typing-indicator'), analyzeBtn = document.getElementById('analyze-btn'), analysisModal = document.getElementById('analysis-modal'), analysisContent = document.getElementById('analysis-content'), analysisLoader = document.getElementById('analysis-loader'), closeModalBtn = document.getElementById('close-modal-btn'), settingsBtn = document.getElementById('settings-btn'), closeSettingsBtn = document.getElementById('close-settings-btn'), settingsPanel = document.getElementById('settings-panel'), saveSettingsBtn = document.getElementById('save-settings-btn'), apiUrlInput = document.getElementById('api-url'), apiKeyInput = document.getElementById('api-key'), apiModelInput = document.getElementById('api-model'), toast = document.getElementById('toast');

// --- State & Defaults ---
const DEFAULT_API_KEY = "";
let conversationHistory = [];
let currentScenario = null;

const crisisScenarios = {
    'data_leak': {
        title: "大规模数据泄露事件",
        journalist: "《科技前沿》资深调查记者",
        system_prompt: `你将扮演《科技前沿》的资深调查记者。一家名为“星云科技”的公司刚刚曝出大规模用户数据泄露。你非常敏锐、问题尖锐，目标是揭露事件真相，了解公司对用户的责任。你会连续追问细节，比如“泄露了多少用户数据？”“为何没有及时通知用户？”“公司的补救措施是什么？”“CEO是否会为此负责？”。你的语气专业且不带感情。你的开场白应直接切入主题。`
    },
    'product_safety': {
        title: "儿童玩具安全隐患",
        journalist: "“消费观察”栏目主持人",
        system_prompt: `你将扮演电视台“消费观察”栏目的主持人。一家知名玩具公司“奇乐堡”的一款畅销玩具有重大安全隐患，已导致多名儿童受伤。你代表消费者利益，语气充满关切和质询。你的问题会围绕“公司何时发现问题的？”“为何不立即召回所有产品？”“如何赔偿受害者家庭？”“如何确保未来产品安全？”。你的开场白要体现对儿童安全的担忧。`
    },
    'ceo_scandal': {
        title: "CEO 严重不当言论",
        journalist: "《财经日报》评论部主编",
        system_prompt: `你将扮演《财经日报》评论部主编。一家上市公司的CEO在公开场合发表了涉及歧视的严重不当言论，引发了公众愤怒和股价暴跌。你非常理性、注重企业价值观和市场影响。你的问题会集中在“这番言论是否代表公司立场？”“公司董事会对此有何反应？”“CEO是否会辞职？”“公司如何修复品牌形象和投资者信心？”。你的开场白需要点明事件的严重性。`
    }
};

// --- Settings Logic ---
function loadSettings() {
    apiUrlInput.value = localStorage.getItem('apiUrl') || 'https://api.deepseek.com/chat/completions';
    apiKeyInput.value = localStorage.getItem('apiKey') || '';
    apiModelInput.value = localStorage.getItem('apiModel') || 'deepseek-v4-pro';
}
function saveSettings() {
    localStorage.setItem('apiUrl', apiUrlInput.value);
    localStorage.setItem('apiKey', apiKeyInput.value);
    localStorage.setItem('apiModel', apiModelInput.value);
    showToast('设置已保存！');
    settingsPanel.classList.remove('open');
}
function getApiKey() { return apiKeyInput.value.trim() || getGlobalDeepSeekKey(); }
function getApiUrl() { return apiUrlInput.value.trim(); }
function getModel() { return apiModelInput.value; }
function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

// --- UI Logic ---
function populateScenarioSelector() {
    for (const key in crisisScenarios) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = crisisScenarios[key].title;
        scenarioSelector.appendChild(option);
    }
}

function showChatInterface(show) {
    setupContainer.classList.toggle('hidden', show);
    chatContainerWrapper.classList.toggle('hidden', !show);
    messageInput.disabled = !show;
    sendBtn.disabled = !show;
    analyzeBtn.disabled = !show;
}

function addMessageToChat(role, text) {
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${role === 'user' ? 'user-bubble' : 'ai-bubble'}`;
    bubble.textContent = text;
    chatContainer.appendChild(bubble);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function setTyping(typing) {
    typingIndicator.classList.toggle('hidden', !typing);
    if(typing) chatContainer.scrollTop = chatContainer.scrollHeight;
}

function showAnalysisModal(show) {
    analysisModal.classList.toggle('hidden', !show);
}

// --- Core Logic ---
async function startSimulation() {
    const selectedKey = scenarioSelector.value;
    currentScenario = crisisScenarios[selectedKey];
    if (!currentScenario) return;

    showChatInterface(true);
    chatTitle.textContent = currentScenario.title;
    chatSubtitle.textContent = `提问方: ${currentScenario.journalist}`;
    chatContainer.innerHTML = '';
    
    conversationHistory = [{ role: 'system', content: currentScenario.system_prompt }];
    const initialUserMessage = { role: 'user', content: '发布会现在开始，请记者提问。' };
    conversationHistory.push(initialUserMessage);

    setTyping(true);
    try {
        const aiResponse = await callApi(conversationHistory);
        conversationHistory.push({ role: 'assistant', content: aiResponse });
        addMessageToChat('assistant', aiResponse);
    } catch (error) {
        handleApiError(error);
    } finally {
        setTyping(false);
        messageInput.focus();
    }
}

async function sendMessage() {
    const messageText = messageInput.value.trim();
    if (!messageText) return;

    messageInput.value = '';
    addMessageToChat('user', messageText);
    conversationHistory.push({ role: 'user', content: messageText });
    
    setTyping(true);
    messageInput.disabled = true;
    sendBtn.disabled = true;

    try {
        const aiResponse = await callApi(conversationHistory);
        conversationHistory.push({ role: 'assistant', content: aiResponse });
        addMessageToChat('assistant', aiResponse);
    } catch (error) {
        handleApiError(error);
    } finally {
        setTyping(false);
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.focus();
    }
}

function createAnalysisPrompt() {
    let transcript = "这是本次危机公关模拟的完整对话记录:\n\n";
    conversationHistory.slice(1).forEach(msg => { // slice(1) to skip system prompt
        transcript += `${msg.role === 'user' ? '发言人' : '记者'}: ${msg.content}\n\n`;
    });
    
    return `你是一位顶级的危机公关专家。请根据以下对话记录，对“发言人”的表现进行一次全面、专业、深刻的复盘分析。

${transcript}

### 分析要求
请从以下几个维度进行结构化分析，并给出具体分数（满分10分）和改进建议：

- **信息控制力 (Clarity & Control)**: (发言人是否清晰、准确地传达了关键信息？是否有效引导了对话走向？)
- **责任与担当 (Accountability)**: (发言人是否勇于承担责任？还是在回避、推诿？)
- **同理心与态度 (Empathy & Tone)**: (发言人的语气和措辞是否表现出对公众和受害者的同理心？态度是否真诚？)
- **解决方案有效性 (Solution)**: (提出的解决方案是否具体、可信，能否有效安抚公众情绪？)
- **综合评价与核心建议**: (总结发言人的整体表现，并提供3条最关键的改进建议。)

### 输出格式
请严格使用以下格式，不要有任何前言。

**复盘分析报告**

**1. 信息控制力:** [分数]/10
   - [具体分析...]

**2. 责任与担当:** [分数]/10
   - [具体分析...]

**3. 同理心与态度:** [分数]/10
   - [具体分析...]

**4. 解决方案有效性:** [分数]/10
   - [具体分析...]

**5. 综合评价与核心建议:**
   - [综合评价...]
   - **核心建议:**
     1. [建议1]
     2. [建议2]
     3. [建议3]
`;
}


async function handleAnalysis() {
    showAnalysisModal(true);
    analysisContent.innerHTML = '';
    analysisLoader.classList.remove('hidden');

    const analysisPrompt = createAnalysisPrompt();
    const analysisMessages = [{ role: 'user', content: analysisPrompt }];
    
    try {
        // Use a more capable model for analysis if available
        const analysisModel = localStorage.getItem('apiModel')?.includes('thinking') 
            ? localStorage.getItem('apiModel') 
            : 'doubao-seed-1-6-thinking-250615';

        const response = await fetch(getApiUrl(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getApiKey()}` },
            body: JSON.stringify({ model: analysisModel, messages: analysisMessages, temperature: 0.5 })
        });
        
        if (!response.ok) throw new Error((await response.json()).error.message || `API 请求失败: ${response.status}`);
        
        const data = await response.json();
        let analysisText = data.choices[0].message.content;

        // Basic markdown to HTML
        analysisText = analysisText
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');

        analysisLoader.classList.add('hidden');
        analysisContent.innerHTML = analysisText;

    } catch(error) {
        analysisLoader.classList.add('hidden');
        analysisContent.innerHTML = `<p class="text-red-500">分析失败: ${error.message}</p>`;
    }
}


async function callApi(messages) {
    const response = await fetch(getApiUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getApiKey()}` },
        body: JSON.stringify({ model: getModel(), messages: messages, temperature: 0.8 })
    });
    if (!response.ok) throw new Error((await response.json()).error.message || `API 请求失败: ${response.status}`);
    const data = await response.json();
    return data.choices[0].message.content;
}

function handleApiError(error) {
    console.error("API Error:", error);
    addMessageToChat('assistant', `抱歉，模拟器出错了: ${error.message}`);
}

function resetSimulation() {
    showChatInterface(false);
    currentScenario = null;
    conversationHistory = [];
    chatContainer.innerHTML = '';
}

// --- Event Listeners ---
startBtn.addEventListener('click', startSimulation);
resetBtn.addEventListener('click', resetSimulation);
sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
analyzeBtn.addEventListener('click', handleAnalysis);
closeModalBtn.addEventListener('click', () => showAnalysisModal(false));
settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
closeSettingsBtn.addEventListener('click', () => settingsPanel.classList.remove('open'));
saveSettingsBtn.addEventListener('click', saveSettings);

// --- Initialization ---
document.addEventListener('DOMContentLoaded', () => {
    loadSettings();
    populateScenarioSelector();
});
</script>
