<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播客/音频脚本生成器 (Podcast Script)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                    <i class="fa-solid fa-microphone text-purple-600 text-2xl"></i>
                    <span class="font-bold text-xl text-slate-900">Podcast Script</span>
                </div>
                <button @click="showSettings = true"
                    class="text-slate-500 hover:text-purple-600 flex items-center gap-1 text-sm font-medium"><i
                        class="fa-solid fa-gear h-4 w-4"></i> 设置</button>
            </div>
        </nav>

        <div class="flex-grow flex flex-col md:flex-row overflow-hidden h-[calc(100vh-4rem)]">
            <div class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-slate-200 p-5 overflow-y-auto space-y-5 z-20">
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700">播客主题/话题</label>
                    <input type="text" v-model="input.topic" placeholder="例如：AI 时代普通人的机会"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none">
                </div>
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700">主持人与嘉宾</label>
                    <textarea v-model="input.guests" rows="3" placeholder="Host: 科技博主小王; Guest: 资深程序员老李"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none"></textarea>
                </div>
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700">风格与时长</label>
                    <select v-model="input.style"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none">
                        <option value="轻松闲聊 (30-40分钟)">☕ 轻松闲聊</option>
                        <option value="深度对谈 (60分钟+)">🧠 深度对谈</option>
                        <option value="快节奏科普 (10-15分钟)">⚡ 快节奏科普</option>
                    </select>
                </div>
                <button @click="generateScript" :disabled="isGenerating || !input.topic"
                    class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl shadow hover:bg-purple-700 disabled:opacity-50 flex items-center justify-center gap-2">
                    <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin w-4 h-4"></i>
                    <span v-else>生成对谈脚本</span>
                </button>
            </div>

            <div class="flex-grow bg-slate-50 p-6 md:p-10 overflow-y-auto">
                <div v-if="!result" class="h-full flex flex-col items-center justify-center text-slate-400">
                    <i class="fa-solid fa-podcast w-16 h-16 mb-4 opacity-50"></i>
                    <p>输入话题，生成结构化播客脚本 (时间轴+金句)</p>
                </div>

                <div v-else class="max-w-4xl mx-auto space-y-6 animate-fade-in">
                    <!-- BGM 与 氛围 -->
                    <div class="bg-purple-50 border border-purple-100 rounded-xl p-4 flex items-start gap-3">
                        <i class="fa-solid fa-music text-purple-600 mt-1"></i>
                        <div>
                            <h4 class="font-bold text-purple-900 text-sm">氛围与 BGM 建议</h4>
                            <p class="text-purple-700 text-sm">{{ result.bgm_suggestion }}</p>
                        </div>
                    </div>

                    <!-- 脚本时间轴 -->
                    <div class="space-y-4 relative">
                        <div class="absolute left-4 top-4 bottom-4 w-0.5 bg-slate-200"></div>

                        <div v-for="(section, idx) in result.timeline" :key="idx" class="relative pl-10">
                            <div
                                class="absolute left-2 top-1.5 w-4 h-4 bg-white border-2 border-purple-500 rounded-full z-10">
                            </div>
                            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="font-bold text-slate-800">{{ section.title }}</h3>
                                    <span class="text-xs font-mono bg-slate-100 px-2 py-1 rounded text-slate-500">{{
                                        section.duration }}</span>
                                </div>
                                <div class="space-y-3">
                                    <div v-for="(dialogue, dIdx) in section.dialogues" :key="dIdx" class="text-sm">
                                        <span class="font-bold text-slate-700 mr-2">{{ dialogue.speaker }}:</span>
                                        <span class="text-slate-600">{{ dialogue.content }}</span>
                                    </div>
                                </div>
                                <div v-if="section.key_point" class="mt-3 pt-3 border-t border-slate-100">
                                    <span class="text-xs font-bold text-orange-500 flex items-center gap-1"><i
                                            class="fa-solid fa-lightbulb w-3 h-3"></i> 金句预埋:</span>
                                    <p class="text-xs text-slate-500 mt-1 italic">"{{ section.key_point }}"</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2">
                        <button @click="exportScript"
                            class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm hover:bg-slate-800">导出脚本</button>
                    </div>
                </div>
            </div>
        </div>

        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-md p-6">
                <h3 class="font-bold mb-4">API 设置</h3>
                <input type="password" v-model="apiConfig.deepseek" class="w-full border p-2 rounded mb-4"
                    placeholder="DeepSeek Key">
                <div class="flex justify-end gap-2">
                    <button @click="showSettings=false" class="px-4 py-2 text-slate-500">取消</button>
                    <button @click="saveConfig" class="bg-purple-600 text-white px-4 py-2 rounded">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted, nextTick } = Vue;
        createApp({
            setup() {


                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });
                const input = reactive({ topic: '', guests: '', style: '轻松闲聊 (30-40分钟)' });
                const isGenerating = ref(false);
                const result = ref(null);

                onMounted(() => {

                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                        } catch (e) {
                            console.error('Failed to parse global_llm_config', e);
                        }
                    }
                });

                const saveConfig = () => {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) { console.error(e); }
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                const generateScript = async () => {
                    if (!apiConfig.value.deepseek) return showSettings.value = true;
                    isGenerating.value = true;
                    const prompt = `请为以下播客策划一份结构化的对谈脚本。
主题：${input.topic}
嘉宾：${input.guests}
风格：${input.style}

请返回 JSON：
{
  "bgm_suggestion": "推荐的开场/背景音乐风格",
  "timeline": [
    { 
      "title": "环节名称 (如：开场白/引入)", 
      "duration": "预估时长", 
      "dialogues": [
        { "speaker": "Host", "content": "话术要点/提问方向..." },
        { "speaker": "Guest", "content": "回答要点/故事案例..." }
      ],
      "key_point": "本环节的金句或高光时刻"
    }
  ]
}`;
                    try {
                        const res = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.value.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.value.model,
                                messages: [{ role: "system", content: "You are a professional podcast producer. Return JSON only." }, { role: "user", content: prompt }],
                                response_format: { type: 'json_object' }
                            })
                        });
                        if (!res.ok) {
                            const error = await res.json().catch(() => ({}));
                            throw new Error(error.error?.message || `HTTP error! status: ${res.status}`);
                        }
                        const data = await res.json();
                        result.value = JSON.parse(data.choices[0].message.content);
                    } catch (e) {
                        console.error('Generate error:', e);
                        alert('生成失败: ' + e.message);
                    }
                };

                const exportScript = () => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([JSON.stringify(result.value, null, 2)], { type: 'application/json' }));
                    a.download = 'podcast_script.json';
                    a.click();
                };

                return {
                    showSettings, apiConfig, saveConfig, input, isGenerating, result, generateScript, exportScript
                };
            }
        }).mount('#app');
    </script>


<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/video_podcast_script_gen.md"></script>
<!-- HELP-WIDGET-END -->
    </body>

</html>
