            -ms-overflow-style: none;

            padding: 0.75rem;

<body class="text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">

        <!-- Top Navigation -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-sky-100">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                        <i data-lucide="clapperboard" class="text-sky-600 h-6 w-6"></i>
                        <span class="font-bold text-xl tracking-tight text-slate-900">Video Script Gen</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 bg-sky-50 rounded-lg p-1">
                            <button @click="model = 'deepseek-v4-flash'"

                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="model = 'deepseek-v4-pro'"
                                :class="{'bg-white shadow text-sky-600': model === 'deepseek-v4-pro', 'text-slate-500': model !== 'deepseek-v4-pro'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showPromptSettings = true"
                            class="text-slate-500 hover:text-sky-600 transition flex items-center gap-1 text-sm font-medium">
                            <i data-lucide="edit-3" class="h-4 w-4"></i> 提示词配置
                        </button>
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-sky-600 transition flex items-center gap-1 text-sm font-medium">
                            <i data-lucide="settings" class="h-4 w-4"></i> API 设置
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Layout -->
        <div class="flex-grow flex flex-col md:flex-row overflow-hidden h-[calc(100vh-4rem)]">

            <!-- Left: Input & Controls -->
            <div class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-sky-100 flex flex-col h-full z-20 shadow-lg">
                <div class="p-5 flex-grow overflow-y-auto space-y-6">

                    <!-- Input Content -->
                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700">创意/主题 (Idea)</label>
                        <input v-model="input.topic" type="text" placeholder="例如：如何制作一杯完美的拿铁"
                            class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-sky-500 focus:outline-none transition text-sm">
                    </div>

                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700">参考文案/详细信息 (Content)</label>
                        <textarea v-model="input.content" rows="8" placeholder="在此粘贴文章内容、详细步骤或粗略的想法..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-sky-500 focus:outline-none transition resize-none text-sm leading-relaxed"></textarea>
                    </div>

                    <!-- Script Type Selection -->
                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700">脚本类型 (Type)</label>
                        <div class="grid grid-cols-1 gap-2">
                            <div v-for="type in scriptTypes" :key="type.id" @click="currentTypeId = type.id"
                                :class="{'bg-sky-50 border-sky-500 text-sky-700': currentTypeId === type.id, 'bg-slate-50 border-slate-200 text-slate-600': currentTypeId !== type.id}"
                                class="cursor-pointer border rounded-lg p-3 flex items-center justify-between transition hover:shadow-sm">
                                <div class="flex items-center gap-2">
                                    <i :data-lucide="type.icon" class="w-4 h-4"></i>
                                    <span class="text-sm font-medium">{{ type.name }}</span>
                                </div>
                                <span class="text-xs opacity-60">{{ type.desc }}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <button @click="startGenerate" :disabled="isGenerating || !input.content"
                        class="w-full bg-sky-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                        <i v-if="isGenerating" data-lucide="loader-2" class="animate-spin w-5 h-5"></i>
                        <span v-else>🎬 生成分镜脚本</span>

                    <!-- Status -->
                    <div class="text-xs text-center text-slate-400">
                        {{ statusText }}

                </div>
            </div>

            <!-- Right: Output Area -->
            <div class="flex-grow bg-[#f0f9ff] p-4 md:p-8 overflow-y-auto h-full relative flex flex-col">

                <!-- Empty State -->
                <div v-if="!result.content && !isGenerating && !result.reasoning"

                    <i data-lucide="film" class="w-24 h-24 mb-4 stroke-1 text-sky-300"></i>
                    <p class="text-lg text-sky-900/50">输入创意，一键生成专业分镜脚本</p>
                </div>

                <!-- Result Area -->
                <div v-else
                    class="max-w-6xl mx-auto w-full bg-white rounded-xl shadow-sm border border-sky-100 flex flex-col h-full overflow-hidden">

                    <!-- Header -->
                    <div class="p-4 border-b border-sky-100 flex justify-between items-center bg-sky-50/30 shrink-0">
                        <div class="flex items-center gap-2">

                                getTypeName(currentTypeId) }}</span>
                        </div>
                        <div class="flex gap-2">
                            <button v-if="result.content" @click="exportToExcel"
                                class="text-sky-600 text-sm font-medium hover:bg-sky-50 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> 导出 Excel

                            <button v-if="result.content" @click="copyContent"
                                class="text-slate-500 text-sm font-medium hover:bg-slate-100 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                                <i data-lucide="copy" class="w-4 h-4"></i> 复制 Markdown

                        </div>
                    </div>

                    <!-- Content Scroll Area -->
                    <div class="flex-grow overflow-y-auto p-6">

                        <div v-if="result.reasoning"

                                <summary
                                    class="flex items-center justify-between p-2 cursor-pointer bg-slate-100 hover:bg-slate-200 transition text-xs font-bold text-slate-600 select-none">
                                    <div class="flex items-center gap-1">
                                        <i data-lucide="brain-circuit" class="w-3 h-3"></i>
                                        <span>深度思考过程</span>
                                    </div>

                                        class="w-3 h-3 transition-transform group-open:rotate-180"></i>
                                </summary>
                                <div
                                    class="p-3 bg-slate-50 text-xs text-slate-500 font-mono whitespace-pre-wrap border-t border-slate-200 max-h-60 overflow-y-auto">
                                    {{ result.reasoning }}
                                </div>
                            </details>
                        </div>

                        <!-- Main Content (Markdown Rendered) -->

                        </div>

                        <!-- Error Message -->
                        <div v-if="result.error" class="bg-red-50 text-red-600 p-4 rounded-lg mt-4 text-sm text-center">
                            {{ result.error }}
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- API Settings Modal -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <h3 class="text-lg font-bold mb-4">API 配置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek"

                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>

                        class="bg-sky-600 text-white px-4 py-2 rounded-lg hover:bg-sky-700">保存</button>

            </div>
        </div>

        <!-- Prompt Settings Modal -->
        <div v-if="showPromptSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 h-[80vh] flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold">提示词配置</h3>
                    <button @click="resetPrompts" class="text-xs text-red-500 hover:underline">恢复默认</button>
                </div>

                <div class="flex gap-4 flex-grow overflow-hidden">
                    <!-- Left: Type List -->
                    <div class="w-1/3 border-r border-slate-100 pr-4 overflow-y-auto">
                        <div v-for="type in scriptTypes" :key="type.id" @click="currentEditingTypeId = type.id"
                            :class="{'bg-sky-50 text-sky-700 font-medium': currentEditingTypeId === type.id, 'text-slate-600 hover:bg-slate-50': currentEditingTypeId !== type.id}"
                            class="p-3 rounded-lg cursor-pointer mb-2 flex items-center gap-2 transition">
                            <i :data-lucide="type.icon" class="w-4 h-4"></i>
                            {{ type.name }}
                        </div>
                    </div>

                    <!-- Right: Prompt Editor -->
                    <div class="w-2/3 flex flex-col">
                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            {{ getTypeName(currentEditingTypeId) }} - 系统提示词
                        </label>
                        <textarea v-model="customPrompts[currentEditingTypeId]"
                            class="flex-grow w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-sky-500 focus:outline-none resize-none text-sm font-mono leading-relaxed"
                            placeholder="输入该类型的专属提示词..."></textarea>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-2 pt-4 border-t border-slate-100">
                    <button @click="showPromptSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="savePrompts"
                        class="bg-sky-600 text-white px-4 py-2 rounded-lg hover:bg-sky-700">保存设置</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, reactive, onMounted, nextTick, computed, watch } = Vue;

        // Default Prompts
        const DEFAULT_PROMPTS = {
            oral: `你是一个专业的短视频脚本编剧，擅长创作口播类（Talking Head）视频脚本。
请将用户输入的内容转化为一份标准的分镜脚本。

要求：
1. 结构清晰，包含：黄金前3秒（Hook）、痛点/引入、核心干货、结尾引导。
2. 语言口语化，简单易懂，节奏紧凑。
3. 输出格式必须为 Markdown 表格，包含以下列：
   - 镜号 (序号)
   - 景别 (如：近景、特写、中景)
   - 画面描述 (详细描述画面内容、动作、表情)
   - 运镜 (如：固定、推、拉、摇)
   - 口播台词 (具体的逐字稿)
   - 备注/音效 (BGM建议、音效、字幕提示)

请直接输出表格，不要有多余的废话。`,

            plot: `你是一个专业的短视频编剧，擅长创作剧情/段子类视频脚本。
请将用户输入的内容转化为一份有冲突、有反转的分镜脚本。

要求：
1. 剧情要有张力，开头设置悬念，中间有冲突，结尾有反转或升华。
2. 强调演员的动作、神态和台词。
3. 输出格式必须为 Markdown 表格，包含以下列：
   - 镜号
   - 景别
   - 画面/动作 (详细描述演员动作、走位)
   - 运镜
   - 台词 (对话内容)
   - 备注/音效 (BGM情绪变化、关键音效)

请直接输出表格。`,

            vlog: `你是一个生活方式博主，擅长创作 Vlog 风格的视频脚本。
请将用户输入的内容转化为一份唯美、治愈或有趣的 Vlog 脚本。

要求：
1. 强调视觉美感和氛围感，多用空镜和特写。
2. 旁白要有情感，像在讲故事。
3. 输出格式必须为 Markdown 表格，包含以下列：
   - 镜号
   - 景别
   - 画面内容 (环境、人物状态、光影)
   - 运镜 (强调镜头的流动感)
   - 旁白/同期声
   - 音乐/音效 (详细的音乐情绪建议)

请直接输出表格。`
        };

        createApp({
            setup() {
                // State
                const showSettings = ref(false);
                const showPromptSettings = ref(false);
                const apiConfig = ref({ deepseek: '' });
                const model = ref('deepseek-v4-flash');
                const isGenerating = ref(false);
                const statusText = ref('准备就绪');

                const input = reactive({
                    topic: '',
                    content: ''
                });

                const scriptTypes = [
                    { id: 'oral', name: '口播讲解类', icon: 'mic', desc: '适合知识分享、观点输出' },
                    { id: 'plot', name: '剧情/段子类', icon: 'clapperboard', desc: '适合情感、搞笑、反转' },
                    { id: 'vlog', name: 'Vlog/生活类', icon: 'camera', desc: '适合探店、旅行、日常' }
                ];
                const currentTypeId = ref('oral');
                const currentEditingTypeId = ref('oral');

                const customPrompts = reactive({ ...DEFAULT_PROMPTS });

                const result = reactive({
                    content: '',
                    reasoning: '',
                    error: null
                });

                // Initialization
                onMounted(() => {
                    const savedConfig = localStorage.getItem('global_llm_config');
                    if (savedConfig) apiConfig.value = { ...apiConfig.value, ...JSON.parse(savedConfig) };

                    const savedPrompts = localStorage.getItem('video_script_prompts');
                    if (savedPrompts) {
                        Object.assign(customPrompts, JSON.parse(savedPrompts));
                    }

                    if (window.lucide) lucide.createIcons();
                });

                // Helpers
                const getTypeName = (id) => scriptTypes.find(t => t.id === id)?.name || id;

                const renderMarkdown = (text) => {
                    if (!text) return '';
                    return marked.parse(text);
                };

                // Settings Logic
                const saveConfig = () => {
                    apiConfig.value.deepseek = apiConfig.value.deepseek.trim();
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                const savePrompts = () => {
                    localStorage.setItem('video_script_prompts', JSON.stringify(customPrompts));
                    showPromptSettings.value = false;
                };

                const resetPrompts = () => {
                    if (confirm('确定要恢复默认提示词吗？')) {
                        Object.assign(customPrompts, DEFAULT_PROMPTS);
                    }
                };

                // Core Logic
                const startGenerate = async () => {
                    if (!apiConfig.value.deepseek) {
                        showSettings.value = true;
                        return;
                    }
                    if (!input.content) return;

                    isGenerating.value = true;
                    statusText.value = '正在构思脚本...';
                    result.content = '';
                    result.reasoning = '';
                    result.error = null;

                    const systemPrompt = customPrompts[currentTypeId.value];
                    const userPrompt = `【主题】：${input.topic || '无'}\n\n【参考内容】：\n${input.content}`;

                    try {
                        await callDeepSeek(systemPrompt, userPrompt, true,
                            (chunk) => {
                                result.content += chunk;
                            },
                            (reasoningChunk) => {
                                result.reasoning += reasoningChunk;
                            }
                        );
                        statusText.value = '生成完成';
                    } catch (e) {
                        console.error(e);
                        result.error = e.message;
                        statusText.value = '生成失败';
                    } finally {
                        isGenerating.value = false;
                        nextTick(() => {
                            if (window.lucide) lucide.createIcons();
                        });
                    }
                };

                // API Call
                const callDeepSeek = async (systemPrompt, userContent, stream = false, onChunk = null, onReasoning = null) => {
                    const apiKey = (apiConfig.value.deepseek || '').trim();
                    if (!apiKey) throw new Error("API Key 未配置");

                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: model.value,
                            messages: [
                                { "role": "system", "content": systemPrompt },
                                { "role": "user", "content": userContent }
                            ],
                            stream: stream
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error?.message || `API Error: ${response.status}`);
                    }

                    if (!stream) {
                        const data = await response.json();
                        return data.choices[0].message.content;
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.trim() === '') continue;
                            if (line.trim() === 'data: [DONE]') continue;
                            if (line.startsWith('data: ')) {
                                try {
                                    const json = JSON.parse(line.substring(6));

                                    // Handle Reasoning Content (DeepSeek V4 Pro)
                                    const reasoning = json.choices[0].delta.reasoning_content;
                                    if (reasoning && onReasoning) {
                                        onReasoning(reasoning);
                                    }

                                    // Handle Normal Content
                                    const content = json.choices[0].delta.content || "";
                                    if (onChunk) onChunk(content);

                                } catch (e) {
                                    console.error("Stream parse error", e);
                                }
                            }
                        }
                    }
                };

                const copyContent = () => {
                    if (!result.content) return;
                    navigator.clipboard.writeText(result.content).then(() => {
                        // alert('已复制');
                    });
                };

                const exportToExcel = () => {
                    // Simple parser to convert Markdown table to array of arrays
                    // This is a basic implementation, might need robustness for complex markdown
                    const lines = result.content.split('\n');
                    const data = [];

                    // Filter for table lines (start with |)
                    const tableLines = lines.filter(line => line.trim().startsWith('|'));

                    if (tableLines.length < 2) {
                        alert('未检测到有效的表格数据，无法导出 Excel。');
                        return;
                    }

                    tableLines.forEach((line, index) => {
                        // Skip separator line (usually ---|---|---)
                        if (line.includes('---')) return;

                        // Split by pipe and trim whitespace
                        const row = line.split('|').map(cell => cell.trim()).filter(cell => cell !== '');
                        // Adjust for leading/trailing pipes causing empty strings if split isn't perfect
                        // The filter above handles it mostly.
                        if (row.length > 0) data.push(row);
                    });

                    if (data.length === 0) return;

                    const ws = XLSX.utils.aoa_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Script");
                    XLSX.writeFile(wb, `分镜脚本_${new Date().toLocaleDateString()}.xlsx`);
                };

                return {
                    showSettings, showPromptSettings, apiConfig, saveConfig, model,
                    input, scriptTypes, currentTypeId, currentEditingTypeId,
                    customPrompts, savePrompts, resetPrompts, getTypeName,
                    result, isGenerating, statusText, startGenerate,
                    renderMarkdown, copyContent, exportToExcel
                };
            }
        }).mount('#app');
    </script>
