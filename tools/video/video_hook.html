    <style>
        /* 基础样式 - 采用红色/橙色视频风格 */
        body {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 50%, #ffedd5 100%);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 3px; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.4s ease-out forwards; }

        /* 钩子类型卡片 */
        .hook-type-card { transition: all 0.3s ease; }
        .hook-type-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px -12px rgba(239, 68, 68, 0.3);
        }

        /* 钩子内容卡片 */
        .hook-content-card { transition: all 0.2s ease; }
        .hook-content-card:hover {
            background: #fef2f2;
            border-color: #fca5a5;
        }

        /* 播放按钮样式 */
        .play-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .play-btn:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
            transform: scale(1.05);
        }

        /* 热度标签 */
        .hot-tag { background: linear-gradient(135deg, #ef4444 0%, #f97316 100%); }

        /* 加载动画 */
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading-pulse { animation: pulse-red 1.5s ease-in-out infinite; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>

<body class="text-slate-800">
    <!--
        视频钩子优化器 - Alpine.js 应用
        功能：
        1. 生成多种类型的视频开场钩子
        2. 每类生成多个版本
        3. 可与直播脚本工具联动
    -->
    <div x-data="videoHookApp" class="min-h-screen flex flex-col">

        <!-- 顶部导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-red-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition"
                        onclick="location.href='../../index.html'">
                        <i class="fa-solid fa-clapperboard text-red-600 text-2xl"></i>
                        <span class="font-bold text-xl tracking-tight text-slate-900">视频钩子优化器</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <a href="livestream_script.html" class="text-slate-500 hover:text-red-600 transition flex items-center gap-1 text-sm font-medium">
                            <i class="fa-solid fa-microphone h-4 w-4"></i>
                            <span class="hidden sm:inline">直播脚本</span>
                        </a>
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-red-600 transition flex items-center gap-1 text-sm font-medium">
                            <i class="fa-solid fa-gear h-4 w-4"></i>
                            <span class="hidden sm:inline">设置</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="flex-grow flex flex-col lg:flex-row overflow-hidden h-[calc(100vh-4rem)]">

            <!-- 左侧：输入面板 -->
            <div class="w-full lg:w-2/5 bg-white/70 backdrop-blur-sm border-r border-red-200 p-5 overflow-y-auto space-y-5">

                <!-- 视频主题 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-video w-4 h-4 text-red-600"></i>
                        视频主题 <span class="text-red-500">*</span>
                    </label>
                    <input type="text" x-model="input.topic" placeholder="例如：如何3个月从0到10万粉丝"
                        class="w-full bg-white border border-red-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                </div>

                <!-- 目标人群 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-users w-4 h-4 text-red-600"></i>
                        目标人群
                    </label>
                    <input type="text" x-model="input.targetAudience" placeholder="例如：想做自媒体的年轻人、副业探索者"
                        class="w-full bg-white border border-red-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                </div>

                <!-- 视频平台 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-tv w-4 h-4 text-red-600"></i>
                        视频平台
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <template x-for="platform in platforms" :key="platform.value">
                            <button @click="input.platform = platform.value"
                                :class="['px-3 py-1.5 text-xs font-medium rounded-full border transition', input.platform === platform.value ? 'bg-red-500 text-white border-red-500' : 'bg-white border-red-200 text-slate-600 hover:border-red-400']"
                                x-text="platform.icon + ' ' + platform.label">
                            </button>
                        </template>
                    </div>
                </div>

                <!-- 钩子类型选择 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-anchor w-4 h-4 text-red-600"></i>
                        钩子类型（可多选）
                    </label>
                    <div class="space-y-2">
                        <template x-for="hookType in hookTypes" :key="hookType.value">
                            <label class="flex items-center gap-3 p-3 bg-white rounded-xl border border-red-200 cursor-pointer hover:border-red-400 transition"

                            </label>
                        </template>

                </div>

                <!-- 每种类型生成数量 -->

                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-hashtag w-4 h-4 text-red-600"></i>
                        每类生成数量
                    </label>
                    <div class="flex items-center gap-3">
                        <input type="range" x-model="input.countPerType" min="2" max="5" step="1"

                <!-- 额外要求 -->
                <div class="space-y-2">

                    </template>
                    <template x-if="!isGenerating">
                        <i class="fa-solid fa-wand-magic-sparkles w-5 h-5"></i>
                    </template>
                    <span x-text="isGenerating ? '正在生成中...' : '🎬 生成黄金3秒钩子'"></span>
                </button>

                <!-- 联动提示 -->
                <div class="bg-orange-50 rounded-xl p-4 border border-orange-200">
                    <p class="text-sm text-orange-700 flex items-start gap-2">
                        <i class="fa-solid fa-lightbulb w-4 h-4 mt-0.5 flex-shrink-0"></i>
                        <span>生成钩子后，可跳转到 <a href="livestream_script.html" class="font-bold underline">直播脚本工具</a> 继续完善完整话术</span>
                    </p>
                </div>

            </div>

            <!-- 右侧：结果展示区 -->
            <div class="flex-grow bg-gradient-to-br from-red-50/50 to-orange-50/50 p-6 overflow-y-auto">

                <!-- 空状态 -->
                <div x-show="Object.keys(result).length === 0 && !isGenerating"
                    class="h-full flex flex-col items-center justify-center text-slate-400">
                    <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mb-6">
                        <i class="fa-solid fa-clapperboard w-12 h-12 text-red-400"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-600 mb-2">视频钩子优化器</h3>
                    <p class="text-center max-w-md">
                        生成抓住观众注意力的「黄金3秒」开场钩子<br>
                        <span class="text-red-600 font-medium">5种钩子类型 · 多版本生成 · 直接可用</span>
                    </p>
                </div>

                <!-- 加载状态 -->
                <div x-show="isGenerating && Object.keys(result).length === 0" class="h-full flex flex-col items-center justify-center">
                    <div class="relative">
                        <div class="w-20 h-20 border-4 border-red-200 rounded-full animate-spin border-t-red-500"></div>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <i class="fa-solid fa-anchor w-8 h-8 text-red-600"></i>
                        </div>
                    </div>
                    <p class="mt-6 text-slate-600 font-medium">AI 正在生成爆款钩子...</p>
                    <p class="text-sm text-slate-400 mt-2">打造抓住观众的黄金3秒</p>
                </div>

                <!-- 结果展示 -->
                <div x-show="Object.keys(result).length > 0" class="max-w-4xl mx-auto space-y-6">

                    <!-- 顶部操作栏 -->
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-slate-500">已生成</span>
                            <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm font-bold"
                                x-text="getTotalHooksCount() + ' 个钩子'"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button @click="copyAllHooks"
                                class="flex items-center gap-1.5 px-4 py-2 bg-white border border-red-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-red-50 transition">
                                <i class="fa-solid fa-copy w-4 h-4"></i>
                                复制全部
                            </button>
                            <button @click="exportHooks"
                                class="flex items-center gap-1.5 px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition">
                                <i class="fa-solid fa-download w-4 h-4"></i>
                                导出文档
                            </button>
                        </div>
                    </div>

                    <!-- 按钩子类型分组显示 -->
                    <template x-for="(hooks, typeKey) in result" :key="typeKey">
                        <div class="hook-type-card bg-white rounded-2xl border border-red-100 overflow-hidden animate-fade-in">

                            <!-- 类型头部 -->
                            <div class="px-5 py-4 bg-gradient-to-r from-red-50 to-orange-50 border-b border-red-100">
                                <div class="flex items-center gap-3">
                                    <span class="text-3xl" x-text="getHookTypeInfo(typeKey).icon"></span>
                                    <div>
                                        <h3 class="font-bold text-slate-800 text-lg" x-text="getHookTypeInfo(typeKey).label"></h3>
                                        <p class="text-xs text-slate-500" x-text="getHookTypeInfo(typeKey).description"></p>
                                    </div>
                                    <span class="ml-auto hot-tag text-white text-xs font-bold px-2 py-1 rounded-full"
                                        x-text="hooks.length + ' 个'"></span>
                                </div>
                            </div>

                            <!-- 钩子内容列表 -->
                            <div class="p-5 space-y-3">
                                <template x-for="(hook, index) in hooks" :key="index">
                                    <div class="hook-content-card p-4 rounded-xl border border-red-100 cursor-pointer group"
                                        @click="copyHook(hook)">
                                        <div class="flex items-start justify-between gap-3">
                                            <div class="flex items-start gap-3">
                                                <div class="play-btn w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 transition">
                                                    <i class="fa-solid fa-play w-4 h-4 text-white"></i>
                                                </div>
                                                <div>
                                                    <p class="text-slate-800 font-medium leading-relaxed" x-text="hook"></p>
                                                </div>
                                            </div>
                                            <button class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-600 transition p-1">
                                                <i class="fa-solid fa-copy w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>

                        </div>
                    </template>

                    <!-- 跳转直播脚本 -->
                    <div class="bg-gradient-to-r from-red-500 to-orange-500 rounded-2xl p-6 text-white text-center">
                        <h4 class="font-bold text-lg mb-2">🎤 继续完善完整话术？</h4>
                        <p class="text-white/80 text-sm mb-4">使用「直播/口播脚本工具」生成完整的视频脚本</p>
                        <a href="livestream_script.html" @click="saveHookToLocal"
                            class="inline-flex items-center gap-2 bg-white text-red-600 font-bold px-6 py-3 rounded-xl hover:bg-red-50 transition">
                            <i class="fa-solid fa-arrow-right w-5 h-5"></i>
                            前往直播脚本工具
                        </a>
                    </div>

                </div>

            </div>

        </div>

        <!-- API 设置弹窗 -->
        <div x-show="showSettings" x-transition
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-fade-in" @click.outside="showSettings = false">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark w-5 h-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" x-model="apiConfig.deepseek"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-red-500 outline-none"
                            placeholder="sk-...">
                        <p class="text-xs text-slate-500 mt-1">Key 将保存到本地，所有工具共享使用</p>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button @click="saveConfig"
                        class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">保存配置</button>
                </div>
            </div>
        </div>

        <!-- Toast 提示 -->
        <div x-show="toast.show" x-transition
            class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in z-[200]">
            <i :class="toast.icon" class="w-4 h-4"></i>
            <span class="text-sm" x-text="toast.message"></span>
        </div>

    </div>

    <script>
        /**
         * 视频钩子优化器 - Alpine.js 应用
         * 功能：生成多种类型的视频开场钩子
         */
        document.addEventListener('alpine:init', () => {
            Alpine.data('videoHookApp', () => ({
                // ==================== 状态管理 ====================
                showSettings: false,
                apiConfig: { deepseek: '' },

                // 视频平台选项
                platforms: [
                    { value: 'douyin', label: '抖音', icon: '🎵' },
                    { value: 'kuaishou', label: '快手', icon: '⚡' },
                    { value: 'bilibili', label: 'B站', icon: '📺' },
                    { value: 'xiaohongshu', label: '小红书', icon: '📕' },
                    { value: 'shipinhao', label: '视频号', icon: '💚' }
                ],

                // 钩子类型
                hookTypes: [
                    { value: 'suspense', label: '悬念型', icon: '🤔', example: '"你知道...吗？"、"很多人都不知道..."', description: '引发好奇心，让观众想知道答案' },
                    { value: 'painpoint', label: '痛点型', icon: '😰', example: '"还在为...烦恼？"、"如果你也..."', description: '戳中用户痛点，引发共鸣' },
                    { value: 'contrast', label: '反差型', icon: '😱', example: '"99%的人都不知道..."、"千万别..."', description: '制造认知反差，打破常规' },
                    { value: 'data', label: '数据型', icon: '📊', example: '"3天涨粉10万..."、"月入5万的秘密..."', description: '用数据增强可信度和吸引力' },
                    { value: 'story', label: '故事型', icon: '📖', example: '"上周我遇到一个客户..."、"那天我..."', description: '用故事开场，增强代入感' }
                ],

                // 用户输入
                input: {
                    topic: '',
                    targetAudience: '',
                    platform: 'douyin',
                    selectedHookTypes: ['suspense', 'painpoint', 'contrast'],
                    countPerType: 3,
                    extraRequirements: ''
                },

                isGenerating: false,
                result: {},
                toast: { show: false, message: '', icon: 'fa-solid fa-check' },

                // ==================== 生命周期 ====================
                init() {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
                    }
                    this.refreshIcons();
                },

                // ==================== 方法 ====================
                refreshIcons() {
                    // Font Awesome automatically handles new icons, usually no manual refresh needed for simple cases
                    // If using dom.i2svg() we might need it, but with CSS it's automatic for class changes
                },

                showToast(message, icon = 'fa-solid fa-check') {
                    this.toast = { show: true, message, icon };
                    this.refreshIcons();
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                saveConfig() {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...this.apiConfig }));
                    this.showSettings = false;
                    this.showToast('配置已保存', 'fa-solid fa-check');
                },

                getHookTypeInfo(typeKey) {
                    return this.hookTypes.find(h => h.value === typeKey) || { label: typeKey, icon: '🎬', description: '' };
                },

                getPlatformName() {
                    return this.platforms.find(p => p.value === this.input.platform)?.label || this.input.platform;
                },

                getTotalHooksCount() {
                    return Object.values(this.result).reduce((sum, hooks) => sum + hooks.length, 0);
                },

                async generateHooks() {
                    if (!this.apiConfig.deepseek) {
                        this.showSettings = true;
                        this.showToast('请先配置 API Key', 'fa-solid fa-circle-exclamation');
                        return;
                    }

                    this.isGenerating = true;
                    this.result = {};

                    try {
                        const systemPrompt = `你是一位顶级短视频编导，精通「黄金3秒」开场钩子的创作技巧。请严格按照 JSON 格式输出。`;

                        const userPrompt = `请为以下视频主题生成多种类型的「黄金3秒」开场钩子：

## 视频信息
- **视频主题**：${this.input.topic}
- **目标人群**：${this.input.targetAudience || '泛人群'}
- **发布平台**：${this.getPlatformName()}
${this.input.extraRequirements ? `- **额外要求**：${this.input.extraRequirements}` : ''}

## 需要生成的钩子类型
${this.input.selectedHookTypes.map(t => {
    const info = this.getHookTypeInfo(t);
    return `- **${info.label}**（${info.description}）`;
}).join('\n')}

## 输出要求
1. 每种类型生成 ${this.input.countPerType} 个不同的钩子
2. 每个钩子控制在 15-30 字以内（适合3秒内说完）
3. 语言要口语化、有感染力
4. 针对 ${this.getPlatformName()} 平台特点优化

## 输出格式
{
${this.input.selectedHookTypes.map(t => `  "${t}": ["钩子1", "钩子2", "钩子3"]`).join(',\n')}
}`;

                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: 'deepseek-v4-flash',
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                response_format: { type: 'json_object' },
                                stream: false
                            })
                        });

                        if (!response.ok) throw new Error(`API 请求失败: ${response.status}`);

                        const data = await response.json();
                        const content = data.choices?.[0]?.message?.content;

                        if (content) {
                            this.result = JSON.parse(content);
                            this.showToast(`成功生成 ${this.getTotalHooksCount()} 个钩子！`, 'fa-solid fa-circle-check');
                        }

                    } catch (error) {
                        console.error('[Video Hook] 生成失败:', error);
                        this.showToast('生成失败: ' + error.message, 'fa-solid fa-circle-exclamation');
                    } finally {
                        this.isGenerating = false;
                        this.refreshIcons();
                    }
                },

                copyHook(hook) {
                    navigator.clipboard.writeText(hook).then(() => {
                        this.showToast('已复制到剪贴板', 'fa-solid fa-copy');
                    });
                },

                copyAllHooks() {
                    let text = `【${this.input.topic}】视频开场钩子\n\n`;

                    for (const [typeKey, hooks] of Object.entries(this.result)) {
                        const typeInfo = this.getHookTypeInfo(typeKey);
                        text += `## ${typeInfo.icon} ${typeInfo.label}\n\n`;
                        hooks.forEach((hook, idx) => {
                            text += `${idx + 1}. ${hook}\n`;
                        });
                        text += '\n';
                    }

                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制全部钩子', 'fa-solid fa-copy');
                    });
                },

                exportHooks() {
                    let content = `# ${this.input.topic} - 视频开场钩子\n\n`;
                    content += `生成时间: ${new Date().toLocaleString()}\n`;
                    content += `目标平台: ${this.getPlatformName()}\n`;
                    content += `目标人群: ${this.input.targetAudience || '泛人群'}\n\n---\n\n`;

                    for (const [typeKey, hooks] of Object.entries(this.result)) {
                        const typeInfo = this.getHookTypeInfo(typeKey);
                        content += `## ${typeInfo.icon} ${typeInfo.label}\n\n`;
                        content += `> ${typeInfo.description}\n\n`;
                        hooks.forEach((hook, idx) => {
                            content += `${idx + 1}. **${hook}**\n\n`;
                        });
                    }

                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `视频钩子_${this.input.topic}_${new Date().toISOString().slice(0, 10)}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    this.showToast('已导出文档', 'fa-solid fa-download');
                },

                saveHookToLocal() {
                    const data = {
                        topic: this.input.topic,
                        targetAudience: this.input.targetAudience,
                        hooks: this.result,
                        timestamp: Date.now()
                    };
                    localStorage.setItem('video_hook_data', JSON.stringify(data));
                }
            }));
        });
    </script>
