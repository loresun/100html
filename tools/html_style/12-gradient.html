    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渐变 / Mesh Gradient</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            overflow: hidden;
            position: relative;
        }

        /* 弥散光背景 */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: 200% 200%;
            z-index: -2;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.8;
            animation: float 10s ease-in-out infinite;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: #6200ff;
            animation-duration: 15s;
        }

        .orb-2 {
            bottom: -20%;
            right: -10%;
            width: 700px;
            height: 700px;
            background: #ff0055;
            animation-duration: 18s;
            animation-delay: -5s;
        }

        .orb-3 {
            bottom: 30%;
            left: 20%;
            width: 400px;
            height: 400px;
            background: #00d2ff;
            animation-duration: 12s;
            animation-delay: -2s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            50% { transform: translate(30px, 50px); }
            100% { transform: translate(0, 0); }
        }

        /* 内容卡片 */
        .container {
            width: 90%;
            max-width: 1000px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .text-content {
            max-width: 500px;
        }

        h1 {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, #ffffffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
        }

        .btn-gradient {
            background: linear-gradient(90deg, #6200ff, #ff0055);
            color: #fff;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(98, 0, 255, 0.3);
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.4);
            filter: brightness(1.1);
        }

        /* 玻璃展示卡 */
        .visual-card {
            width: 400px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05); /* 极低透明度 */
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        .visual-card::before {
             content: "AURORA UI";
             position: absolute;
             top: 20px;
             left: 20px;
             font-size: 0.8rem;
             letter-spacing: 2px;
             opacity: 0.5;
        }

        .gradient-text-large {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <div class="mesh-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <div class="text-content">
            <h1>Mesh<br>Gradients.</h1>
            <p>告别单调的线性渐变。Mesh Gradient（网格渐变）或 Aurora（极光）风格通过多点的色彩融合与模糊，创造出流动、有机且具有未来感的视觉背景。</p>
            <a href="index.html" class="btn-gradient">探索更多</a>
        </div>

        <div class="visual-card">
            <div class="gradient-text-large">Fluid</div>
            <div class="gradient-text-large" style="background: linear-gradient(135deg, #f83600 0%, #f9d423 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Color</div>
            <div class="gradient-text-large" style="background: linear-gradient(135deg, #b2fefa 0%, #0ed2f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Verse</div>
        </div>
    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个网格渐变 / Aurora 风格的网页。使用深色或浅色背景，搭配大面积、多色的模糊抽象色块 (mesh gradients)，创造梦幻、流动的视觉效果。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>

</html>
