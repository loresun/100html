<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奢华风 / Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #d4af37 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* 极简边框装饰 */
        .frame {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            z-index: 100;
        }

        /* 导航 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-family: 'Bodoni Moda', serif;
            font-size: 2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            margin-left: 40px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--gold);
        }

        /* Hero */
        .hero {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: 'Bodoni Moda', serif;
            font-size: 6rem;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 20px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            margin-bottom: 60px;
        }

        .divider {
            width: 1px;
            height: 100px;
            background: var(--gold);
            margin-bottom: 40px;
        }

        .btn-luxury {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 15px 50px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.4s ease;
        }

        .btn-luxury:hover {
            background: var(--gold);
            color: #000;
        }

        /* 产品展示 */
        .showcase {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin: 100px 0;
            align-items: center;
        }

        .image-wrapper {
            position: relative;
            padding-right: 40px;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(100%) contrast(1.2);
            transition: filter 0.5s;
        }
        
        .image-wrapper:hover img {
            filter: grayscale(0%) contrast(1);
        }

        .text-wrapper {
            padding-left: 40px;
        }

        .text-wrapper h2 {
            font-family: 'Bodoni Moda', serif;
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: 400;
        }
        
        .text-wrapper p {
            color: #999;
            line-height: 2;
            margin-bottom: 30px;
            font-weight: 300;
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <div class="frame"></div>

    <div class="container">
        <header>
            <div class="logo">L'Élégance</div>
            <nav>
                <a href="index.html">系列</a>
                <a href="#">Maison</a>
                <a href="#">联系我们</a>
            </nav>
        </header>

        <section class="hero">
            <div class="divider"></div>
            <div class="subtitle">Est. 2026</div>
            <h1>Timeless<br>Luxury</h1>
            <a href="index.html" class="btn-luxury">发现</a>
        </section>

        <section class="showcase">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1549488344-c7388568f06f?q=80&w=1974&auto=format&fit=crop" alt="Luxury Model">
            </div>
            <div class="text-wrapper">
                <h2>The Golden Standard</h2>
                <p>奢华风格不仅仅是昂贵，它是对细节的极致追求。大量留白（Negative Space）、高对比度的衬线字体（Serif）、经典的黑金配色，共同构建了尊贵与排他感。</p>
                <a href="#" class="btn-luxury" style="padding: 10px 30px; font-size: 0.7rem;">查看详情</a>
            </div>
        </section>
    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个奢华风格的网页。使用黑金配色，优雅的衬线字体 (Bodoni)，大量的负空间 (留白)，细线条装饰，以及高质量的图片展示。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>

</html>
