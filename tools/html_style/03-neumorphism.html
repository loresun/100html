<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新拟态 / Neumorphism</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #e0e5ec;
            --text-color: #4a4a4a;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent: #6d5dfc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            font-family: 'Nunito', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* 核心样式：Neumorphic Shadow */
        .neu-box {
            border-radius: 20px;
            background: var(--bg);
            box-shadow: 9px 9px 16px var(--shadow-dark), 
                        -9px -9px 16px var(--shadow-light);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .neu-inset {
            border-radius: 15px;
            background: var(--bg);
            box-shadow: inset 6px 6px 10px var(--shadow-dark), 
                        inset -6px -6px 10px var(--shadow-light);
        }

        h2 {
            margin-bottom: 20px;
            color: var(--text-color);
            font-weight: 700;
        }
        
        p {
            font-size: 0.9rem;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #666;
        }

        /* 按钮样式 */
        .btn-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .neu-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            box-shadow: 6px 6px 10px var(--shadow-dark), 
                        -6px -6px 10px var(--shadow-light);
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neu-btn:active, .neu-btn.active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                        inset -4px -4px 8px var(--shadow-light);
            color: var(--accent);
        }

        .neu-btn-rect {
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            background: var(--bg);
            box-shadow: 6px 6px 10px var(--shadow-dark), 
                        -6px -6px 10px var(--shadow-light);
            color: var(--accent);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .neu-btn-rect:active {
             box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                        inset -4px -4px 8px var(--shadow-light);
             transform: translateY(2px);
        }

        /* 输入框样式 */
        .neu-input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            outline: none;
            margin-bottom: 20px;
            color: var(--text-color);
            font-family: inherit;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .range-slider {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            appearance: none;
            background: var(--bg);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                        inset -3px -3px 6px var(--shadow-light);
            margin-bottom: 20px;
        }
        
        .range-slider::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 2px 2px 5px var(--shadow-dark);
        }

        /* 播放器示例 */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-top: 10px;
        }
        .player-info {
            font-size: 0.8rem;
            margin-top: 10px;
            color: #888;
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <a href="index.html" class="back-link">
            <button class="neu-btn" style="width: 40px; height: 40px;"><i class="fas fa-chevron-left"></i></button>
            Back to Gallery
        </a>

        <!-- 主要介绍卡片 -->
        <div class="neu-box">
            <h2>Neumorphism</h2>
            <p>新拟态（软UI）通过高光和阴影的组合，模拟物体与背景融为一体的挤压或凸起效果。仿佛元素是从材质本身"长"出来的。</p>
            
            <input type="text" class="neu-input neu-inset" placeholder="Soft UI Input...">
            
            <button class="neu-btn-rect">Soft Action</button>
        </div>

        <!-- 播放器示例 -->
        <div class="neu-box">
            <div style="width: 120px; height: 120px; border-radius: 50%; background: var(--bg); box-shadow: 6px 6px 10px var(--shadow-dark), -6px -6px 10px var(--shadow-light); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 4px solid var(--bg);">
                <div style="width: 100px; height: 100px; border-radius: 50%; background: url('https://picsum.photos/200/200?grayscale') center/cover;"></div>
            </div>
            
            <div style="width: 100%;">
                <h3 style="font-size: 1rem; color: var(--text-color);">Soft Vibes</h3>
                <div class="player-info">Unknown Artist</div>
            </div>
            
            <div style="width: 100%; margin-top: 20px;">
                <input type="range" class="range-slider">
            </div>

            <div class="player-controls">
                <button class="neu-btn"><i class="fas fa-backward"></i></button>
                <button class="neu-btn active" style="width: 60px; height: 60px; color: var(--accent); font-size: 1.4rem;"><i class="fas fa-play"></i></button>
                <button class="neu-btn"><i class="fas fa-forward"></i></button>
            </div>
        </div>
    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个新拟态 (Neumorphism/Soft UI) 风格的网页。使用低对比度的浅灰背景，通过亮暗双重阴影创造出挤压或凸起的类塑料质感，使用大圆角。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>


<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
