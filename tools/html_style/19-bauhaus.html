    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>包豪斯 / Bauhaus Style</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --b-red: #d12e2e;
            --b-blue: #1e3d8f;
            --b-yellow: #f2c94c;
            --b-black: #1a1a1a;
            --b-white: #f4f4f4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--b-white);
            color: var(--b-black);
            font-family: 'League Spartan', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 核心网格布局 */
        .grid-container {
            display: grid;
            grid-template-columns: 100px 1fr 150px;
            grid-template-rows: 150px auto 100px;
            width: 80vw;
            max-width: 900px;
            height: 80vh;
            background: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        /* 区域定义 */
        .area-1 {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            background-color: var(--b-blue);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .area-2 {
            grid-column: 2 / 4;
            grid-row: 1 / 2;
            background-color: var(--b-black);
            color: var(--b-white);
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .area-3 {
            grid-column: 1 / 2;
            grid-row: 2 / 4;
            background-color: var(--b-yellow);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 5px;
            transform: rotate(180deg);
        }

        .area-content {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .area-shape {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 0;
            align-items: center;
        }

        .area-footer {
            grid-column: 2 / 4;
            grid-row: 3 / 4;
            background-color: var(--b-red);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            color: #fff;
        }

        /* 文字样式 */
        h1 {
            font-size: 4rem;
            line-height: 0.8;
            margin: 0;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.5rem;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--b-black);
            display: inline-block;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
            text-align: justify;
        }

        /* 几何图形 */
        .circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--b-red);
        }
        
        .square {
            width: 60px;
            height: 60px;
            background-color: var(--b-blue);
        }
        
        .triangle {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 60px solid var(--b-black);
        }

        .arc {
            width: 60px;
            height: 60px;
            border-radius: 0 0 0 100%;
            background: #fff;
        }

        /* 按钮 */
        .bauhaus-btn {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 30px;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }
        
        .bauhaus-btn:hover {
            background: #fff;
            color: var(--b-red);
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <div class="grid-container">
        <!-- 蓝色方块区 -->
        <div class="area-1">
            <div class="arc"></div>
        </div>
        
        <!-- 黑色标题区 -->
        <div class="area-2">
            <h1>Bauhaus<br>Design.</h1>
        </div>
        
        <!-- 黄色侧边区 -->
        <div class="area-3">
            FORM FOLLOWS FUNCTION
        </div>
        
        <!-- 正文内容区 -->
        <div class="area-content">
            <h2>Less is More</h2>
            <p>包豪斯 (1919-1933) 是一场现代主义设计运动。如果你看到红黄蓝三原色、基本的几何形状（圆、方、三角）以及无衬线字体被组合在一起，那大概率就是包豪斯风格。它强调理性、功能主义与几何美学。</p>
        </div>
        
        <!-- 几何图形区 -->
        <div class="area-shape">
            <div class="circle"></div>
            <div class="triangle"></div>
            <div class="square"></div>
        </div>
        
        <!-- 红色底部区 -->
        <div class="area-footer">
            <span style="font-size: 1.2rem; font-weight: 700;">EST. 1919</span>
            <a href="index.html" class="bauhaus-btn">Back</a>
        </div>
    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个包豪斯 (Bauhaus) 风格的网页。使用三原色（红、蓝、黄），几何形状（圆、三角、方），对角线构图，以及无衬线字体。形式追随功能。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>
