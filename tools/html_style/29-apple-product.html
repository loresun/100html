<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple 产品风 / Product Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f7; /* Apple 经典灰底 */
            color: #1d1d1f;
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* 顶部导航 */
        nav {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-content {
            width: 980px;
            display: flex;
            justify-content: space-between;
        }
        
        .nav-content a {
            color: #d6d6d6;
            text-decoration: none;
            font-size: 12px;
            transition: color 0.3s;
        }
        
        .nav-content a:hover { color: #fff; }

        /* Hero 区域 */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 50px;
            position: relative;
            background: #000;
            color: #fff;
        }

        h1 {
            font-size: 56px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }

        .hero p {
            font-size: 28px;
            font-weight: 400;
            margin: 0 0 20px 0;
            color: #888;
        }

        .cta-links {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }

        .cta-link {
            color: #2997ff;
            text-decoration: none;
            font-size: 20px;
        }
        
        .cta-link:hover { text-decoration: underline; }

        /* 产品图片占位 (模拟滚动出现) */
        .product-shot {
            width: 80%;
            max-width: 800px;
            height: 400px;
            background: #333;
            border-radius: 20px 20px 0 0;
            background: linear-gradient(to bottom, #444, #111);
            position: relative;
            box-shadow: 0 -20px 60px rgba(255,255,255,0.05);
        }
        
        .product-shot::after {
            content: "Pro Display";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.1);
            font-size: 60px;
            font-weight: 600;
        }

        /* 滚动叙事区域 */
        .story-section {
            background: #fff;
            padding: 150px 0;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .big-text {
            font-size: 80px;
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: -0.015em;
        }

        .fade-in-text {
            background: linear-gradient(to right, #1d1d1f 50%, #d2d2d7 50%);
            background-size: 200% 100%;
            background-position: 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: background-position 1s;
        }
        
        .fade-in-text:hover {
            background-position: 0%;
        }

        /* 网格 Bento (Apple Style) */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 100px;
        }

        .bento-box {
            background: #f5f5f7;
            border-radius: 30px;
            padding: 50px;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .bento-box h3 {
            font-size: 40px;
            margin: 20px 0 10px;
        }

        .bento-box p {
            font-size: 20px;
            color: #86868b;
        }

        .bento-img {
            margin-top: auto;
            width: 80%;
            height: 200px;
            background: #fff;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .dark-box {
            background: #000;
            color: #fff;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <nav>
        <div class="nav-content">
            <a href="index.html"> Index</a>
            <a href="#">Mac</a>
            <a href="#">iPad</a>
            <a href="#">iPhone</a>
            <a href="#">Watch</a>
        </div>
    </nav>

    <div class="hero">
        <h1>iPhone 25 Pro</h1>
        <p>钛金属，强到离谱。</p>
        <div class="cta-links">
            <a href="#" class="cta-link">进一步了解 ></a>
            <a href="#" class="cta-link">购买 ></a>
        </div>
        <div class="product-shot"></div>
    </div>

    <section class="story-section">
        <div class="container">
            <div class="big-text">
                <span class="fade-in-text">进入 5 纳米芯片时代。<br></span>
                <span style="color: #86868b;">速度快到飞起。</span>
            </div>

            <div class="bento-grid">
                <div class="bento-box">
                    <h3>先进的双摄系统</h3>
                    <p>怎么拍，都上镜。</p>
                    <div class="bento-img"></div>
                </div>
                <div class="bento-box dark-box">
                    <h3 style="background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">A19 仿生</h3>
                    <p style="color: #6e6e73;">快，无止境。</p>
                    <div class="bento-img" style="background: #333;"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- AI Prompt Box -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个 Apple 产品官网风格的网页。使用超大字号排版 (80px+)，平滑的滚动叙事 (Scrollytelling)，高质量的产品渲染图，浅灰或深黑的极简背景，以及精致的 Bento Grid 布局介绍特性。SF Pro 字体，注重留白和节奏感。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
