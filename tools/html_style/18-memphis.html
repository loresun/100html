    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孟菲斯 / Memphis Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --m-yellow: #f9d923;
            --m-pink: #ff2e63;
            --m-blue: #08d9d6;
            --m-black: #252a34;
            --m-white: #eaeaea;
        }

        body {
            background-color: var(--m-white);
            /* 纸屑背景图案 */
            background-image: 
                radial-gradient(var(--m-black) 20%, transparent 20%),
                radial-gradient(var(--m-pink) 20%, transparent 20%);
            background-size: 30px 30px, 40px 40px;
            background-position: 0 0, 15px 15px;
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            position: relative;
            background: #fff;
            max-width: 800px;
            width: 100%;
            padding: 60px;
            border: 4px solid var(--m-black);
            box-shadow: 15px 15px 0 var(--m-blue);
            z-index: 10;
        }

        /* 装饰性几何图形 */
        .shape {
            position: absolute;
            z-index: -1;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid var(--m-yellow);
            top: -60px;
            right: -40px;
            transform: rotate(15deg);
            filter: drop-shadow(5px 5px 0 var(--m-black));
        }

        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--m-pink);
            bottom: -50px;
            left: -50px;
            border: 4px solid var(--m-black);
        }

        .squiggle {
            position: absolute;
            top: 50%;
            right: -80px;
            width: 60px;
            height: 120px;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='20' viewBox='0 0 40 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 10 Q10 0 20 10 T40 10' fill='none' stroke='%23252a34' stroke-width='4'/%3E%3C/svg%3E");
            transform: rotate(90deg);
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 4rem;
            color: var(--m-black);
            line-height: 1;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 var(--m-yellow);
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            color: var(--m-black);
            line-height: 1.6;
            margin-bottom: 40px;
            background: var(--m-blue);
            display: inline-block;
            padding: 5px 10px;
            transform: rotate(-1deg);
        }

        .btn-memphis {
            display: inline-block;
            padding: 15px 40px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: var(--m-white);
            background-color: var(--m-pink);
            text-decoration: none;
            border: 4px solid var(--m-black);
            box-shadow: 6px 6px 0 var(--m-black);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-memphis:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 var(--m-black);
        }
        
        .btn-memphis:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--m-black);
        }

        /* 栅格装饰条 */
        .stripes {
            height: 20px;
            width: 100%;
            background: repeating-linear-gradient(
                90deg,
                var(--m-black),
                var(--m-black) 10px,
                transparent 10px,
                transparent 20px
            );
            margin-bottom: 30px;
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <div class="container">
        <div class="shape triangle"></div>
        <div class="shape circle"></div>
        <div class="shape squiggle"></div>
        
        <div class="stripes"></div>
        
        <h1>Memphis<br>Style</h1>
        <p>Fun, Geometry, Pop, Chaos.</p>
        
        <div style="font-weight: 700; margin-bottom: 30px;">
            孟菲斯风格诞生于 80 年代。它拒绝平庸，拒绝极简。它使用了大量的几何图形、波浪线、彩纸碎片图案（Confetti）以及高饱和度的撞色。
        </div>

        <a href="index.html" class="btn-memphis">Lets Party</a>
    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个孟菲斯 (Memphis) 风格的网页。使用混乱但有趣的几何形状组合（三角形、波浪线），彩纸碎片图案 (Confetti)，粗黑轮廓线，以及波普艺术配色（黄、粉、青）。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>
