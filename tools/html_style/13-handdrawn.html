    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手绘风 / Hand-Drawn Style</title>
    <!-- 引入手写字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #fffdf5;
            --ink-color: #2c3e50;
            --highlight: #f1c40f;
            --accent: #e74c3c;
        }

        body {
            background-color: var(--paper-bg);
            /* 纸张纹理效果 */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%239C92AC' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: var(--ink-color);
            font-family: 'Patrick Hand', cursive;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .notebook {
            background-color: #fff;
            width: 100%;
            max-width: 700px;
            min-height: 80vh;
            padding: 40px 60px;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.1);
            position: relative;
            /* 笔记本线条 */
            background-image: repeating-linear-gradient(transparent, transparent 31px, #e1e1e1 31px, #e1e1e1 32px);
            line-height: 32px;
            transform: rotate(-1deg);
        }

        /* 标题打圈圈效果 */
        h1 {
            font-family: 'Gochi Hand', cursive;
            font-size: 3rem;
            margin-bottom: 30px;
            display: inline-block;
            position: relative;
            line-height: 1.5;
        }

        h1::after {
            content: "";
            position: absolute;
            left: -10px;
            right: -20px;
            top: 5px;
            bottom: -5px;
            border: 3px solid var(--accent);
            border-radius: 50% 60% 70% 40% / 40% 50% 60% 70%;
            transform: rotate(-2deg);
        }

        p {
            font-size: 1.4rem;
            margin-bottom: 32px;
        }

        /* 手绘分割线 */
        .divider {
            height: 4px;
            background: var(--ink-color);
            border-radius: 50% 20% / 10% 40%;
            margin: 40px 0;
            opacity: 0.8;
        }

        /* 手绘按钮 */
        .sketch-btn {
            display: inline-block;
            background: transparent;
            border: 2px solid var(--ink-color);
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; /* 不规则圆角 */
            padding: 10px 30px;
            font-size: 1.5rem;
            font-family: 'Gochi Hand', cursive;
            color: var(--ink-color);
            text-decoration: none;
            transition: 0.2s;
            position: relative;
        }

        .sketch-btn:hover {
            transform: scale(1.05) rotate(2deg);
            background-color: var(--highlight);
        }
        
        /* 便签效果 */
        .sticky-note {
            background-color: var(--highlight);
            width: 200px;
            padding: 20px;
            position: absolute;
            right: -40px;
            top: 100px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
            transform: rotate(5deg);
            font-size: 1.2rem;
            line-height: 1.4;
        }
        
        .pin {
            width: 15px;
            height: 15px;
            background: #d32f2f;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 2px 2px 2px rgba(0,0,0,0.3);
        }

        /* 列表 */
        .todo-list ul {
            list-style: none;
        }
        .todo-list li {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        .todo-list li::before {
            content: "☐";
            margin-right: 10px;
            font-size: 1.5rem;
        }
        .todo-list li.checked {
            text-decoration: line-through;
            color: #888;
        }
        .todo-list li.checked::before {
             content: "☑";
        }

        /* 涂鸦 */
        .doodle {
            position: absolute;
            width: 100px;
            opacity: 0.6;
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <div class="notebook">
        <!-- 便签 -->
        <div class="sticky-note">
            <div class="pin"></div>
            别忘了买牛奶和鸡蛋！<br>- Mom
        </div>

        <h1>Hand Drawn Style</h1>
        
        <p>这是充满人情味的手绘风格。<br>
        就像在笔记本上随手涂鸦一样，<br>
        不完美，但很真实。</p>

        <div class="divider"></div>

        <div class="todo-list">
            <ul>
                <li class="checked">选择手写体 (Google Fonts)</li>
                <li>使用 'Rough' 边框</li>
                <li>添加纸张纹理背景</li>
                <li>不规则的 SVG 形状</li>
            </ul>
        </div>

        <div style="margin-top: 50px; text-align: center;">
            <a href="index.html" class="sketch-btn">返回首页</a>
        </div>
        
        <!-- 手绘箭头 SVG -->
        <svg class="doodle" style="bottom: 50px; right: 50px; transform: rotate(-20deg);" viewBox="0 0 100 100">
             <path d="M10,50 Q50,10 90,50" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
             <path d="M70,40 L90,50 L75,70" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        </svg>

    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个手绘风格的网页。使用纸张纹理背景，手写字体 (Gochi Hand)，抖动的 SVG 边框或线条，以及素描风格的图标。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>


<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
