<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千禧年 / Y2K Aesthetic</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-image: url('https://img.freepik.com/free-photo/silver-metallic-texture-background_53876-104473.jpg'); /* 简单的金属纹理或星空 */
            background-size: cover;
            min-height: 100vh;
        }

        /* 覆盖一层全息渐变 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding-top: 50px;
        }

        /* 3D 浮动标题 */
        h1 {
            font-family: 'Audiowide', cursive;
            font-size: 5rem;
            color: #ccc;
            text-transform: uppercase;
            text-shadow: 
                2px 2px 0px #fff, 
                4px 4px 0px #ff00ff,
                6px 6px 0px #00ffff;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        /* 气泡式导航 */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
        }

        .pill-btn {
            background: linear-gradient(180deg, #ffffff 0%, #b0b0b0 100%);
            border-radius: 50px;
            padding: 10px 30px;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            transition: 0.2s;
            text-transform: uppercase;
            font-family: 'Audiowide', cursive;
        }

        .pill-btn:hover {
            filter: invert(1);
            transform: scale(1.1);
        }

        /* 窗口风格内容框 */
        .window-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 2px;
            margin: 20px auto;
            width: 80%;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .title-bar {
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            padding: 5px 10px;
            color: #000;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .content {
            padding: 20px;
            color: #fff;
            font-size: 1.2rem;
            text-align: left;
        }

        /* 装饰贴纸 */
        .sticker {
            position: absolute;
            z-index: 2;
        }
        
        .cd-rom {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(
                red, yellow, lime, aqua, blue, magenta, red
            );
            opacity: 0.8;
            top: 200px;
            left: -50px;
            border: 5px solid rgba(255,255,255,0.5);
            animation: spin 5s linear infinite;
        }

        .star {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            top: 100px;
            right: 0;
            transform: rotate(15deg);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-bar {
            width: 100%;
            height: 20px;
            border: 1px solid #fff;
            margin-top: 20px;
            padding: 2px;
        }
        
        .progress {
            width: 70%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                #00ffff,
                #00ffff 10px,
                #009999 10px,
                #009999 20px
            );
        }
        
        .blink {
            animation: blinker 1s linear infinite;
        }
        
        @keyframes blinker {
            50% { opacity: 0; }
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <div class="overlay"></div>
    
    <div class="sticker cd-rom"></div>
    <div class="sticker star">✦</div>

    <div class="container">
        <h1>欢迎<br>to Y2K</h1>
        
        <nav class="nav-bar">
            <a href="index.html" class="pill-btn">Exit</a>
            <a href="#" class="pill-btn">Music</a>
            <a href="#" class="pill-btn">Links</a>
        </nav>

        <div class="window-box">
            <div class="title-bar">
                <span>Aesthetic.exe</span>
                <span>X</span>
            </div>
            <div class="content">
                <p>Y2K (Year 2000) 风格是对千禧年之交科技乐观主义的怀旧。</p>
                <p>特征：金属质感、全息渐变、液态铬、厚重的 sans-serif 字体和 3D 对于未来的复古想象。</p>
                <p class="blink">> SYSTEM LOADING...</p>
                <div class="loading-bar">
                    <div class="progress"></div>
                </div>
            </div>
        </div>

        <marquee scrollamount="10" style="background: #000; color: #00ffff; font-family: 'Consolas', monospace; border-top: 1px solid #00ffff; border-bottom: 1px solid #00ffff; margin-top: 50px;">
            *** COOL VIBES ONLY *** WELCOME TO THE FUTURE *** DIGITAL DREAM *** 
        </marquee>
    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个千禧年 (Y2K) 美学风格的网页。使用金属渐变、液态铬文字、粉/青配色，复古未来主义 UI 元素，以及星空背景。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>

</body>
</html>
