<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>糖果色 / Pastel Aesthetic</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pastel-pink: #ffd1dc;
            --pastel-blue: #c1e1ec;
            --pastel-yellow: #fdfd96;
            --pastel-green: #ccf2c9;
            --pastel-purple: #e6e6fa;
            --text-color: #6d6d6d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff9f5;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #ff9aa2;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #fff;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.8;
            color: #888;
        }

        /* 糖果卡片 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 30px 20px;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: inline-block;
            padding: 20px;
            border-radius: 50%;
        }

        .bg-pink { background-color: var(--pastel-pink); color: #ff6b6b; }
        .bg-blue { background-color: var(--pastel-blue); color: #4dabf7; }
        .bg-yellow { background-color: var(--pastel-yellow); color: #fcc419; }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #555;
        }

        /* 按钮 */
        .btn-pastel {
            display: inline-block;
            margin-top: 50px;
            padding: 15px 40px;
            background-color: var(--pastel-purple);
            color: #9c7fbf;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(230, 230, 250, 0.8);
        }

        .btn-pastel:hover {
            background-color: #dcdcea;
            transform: scale(1.05);
        }
        
        /* 装饰图形 */
        .deco {
            position: fixed;
            z-index: -1;
            border-radius: 50%;
            opacity: 0.6;
        }
        
        .deco-1 { top: -50px; left: -50px; width: 200px; height: 200px; background: var(--pastel-blue); }
        .deco-2 { bottom: -80px; right: -20px; width: 300px; height: 300px; background: var(--pastel-yellow); }
        .deco-3 { top: 40%; left: 10%; width: 50px; height: 50px; background: var(--pastel-green); }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <div class="deco deco-1"></div>
    <div class="deco deco-2"></div>
    <div class="deco deco-3"></div>

    <div class="container">
        <h1>Pastel Vibes</h1>
        <p>糖果色风格（Pastel）使用低饱和度、高明度的色彩，创造出柔和、治愈、梦幻的视觉体验。常用于生活方式、母婴或女性向产品。</p>

        <div class="grid">
            <div class="card">
                <div class="card-icon bg-pink">
                    <i class="fas fa-heart"></i>
                </div>
                <h3>Soft Palette</h3>
                <p style="font-size: 0.9rem; margin-bottom: 0;">粉嫩的配色，像马卡龙一样甜美。</p>
            </div>
            
            <div class="card">
                <div class="card-icon bg-blue">
                    <i class="fas fa-cloud"></i>
                </div>
                <h3>Round Shapes</h3>
                <p style="font-size: 0.9rem; margin-bottom: 0;">大量的圆角设计，消除攻击性。</p>
            </div>
            
            <div class="card">
                <div class="card-icon bg-yellow">
                    <i class="fas fa-star"></i>
                </div>
                <h3>Playful Font</h3>
                <p style="font-size: 0.9rem; margin-bottom: 0;">使用圆润可爱的字体（如 Quicksand）。</p>
            </div>
        </div>

        <a href="index.html" class="btn-pastel">Back to Sweet Home</a>
    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个糖果色 / Pastel 风格的网页。使用柔和的低饱和度色彩（淡粉、粉蓝、柠檬黄），大圆角 (20px+)，可爱的圆体字 (Quicksand)，营造亲切友好的氛围。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>


<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
