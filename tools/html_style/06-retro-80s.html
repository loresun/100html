    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80年代复古 / Retro 80s (Synthwave)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Teko:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0c1d;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --grid-color: rgba(255, 0, 255, 0.3);
            --sun-gradient: linear-gradient(to top, #ff00ff 0%, #ffcc00 100%);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Teko', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 背景网格动画 */
        .retro-grid {
            position: fixed;
            bottom: 0;
            width: 200vw;
            height: 100vh;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center bottom;
            transform: perspective(300px) rotateX(60deg) translateY(100px) translateZ(-100px);
            animation: grid-move 20s linear infinite;
            z-index: -1;
            box-shadow: 0 0 50px var(--neon-pink);
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 60%);
        }

        @keyframes grid-move {
            0% { transform: perspective(300px) rotateX(60deg) translateY(0) translateZ(-100px); }
            100% { transform: perspective(300px) rotateX(60deg) translateY(40px) translateZ(-100px); }
        }

        /* 复古落日 */
        .sun {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--sun-gradient);
            box-shadow: 0 0 40px var(--neon-pink);
            z-index: -2;
            mask-image: linear-gradient(to bottom, black 50%, transparent 50%, transparent 55%, black 55%, black 60%, transparent 60%, transparent 65%, black 65%, black 70%, transparent 70%, transparent 75%, black 75%);
        }

        /* 标题 */
        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 3rem;
            text-align: center;
            margin-top: 10vh;
            text-transform: uppercase;
            color: var(--neon-cyan);
            text-shadow: 
                3px 3px 0px var(--neon-pink),
                6px 6px 0px #fff;
            transform: skew(-10deg);
        }

        .subtitle {
            font-size: 2rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 50px;
        }

        /* 容器 */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px var(--neon-cyan);
            backdrop-filter: blur(5px);
            margin-bottom: 100px;
        }

        .content-text {
            font-size: 1.5rem;
            line-height: 1.4;
            text-shadow: 0 0 5px #fff;
        }

        /* 按钮 */
        .retro-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            color: #fff;
            background: transparent;
            border: 4px solid var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink), inset 0 0 10px var(--neon-pink);
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.2s;
        }

        .retro-btn:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        /* CRT 扫描线效果 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        /* 闪烁光标 */
        .cursor::after {
            content: '█';
            animation: blink 1s infinite;
            color: var(--neon-cyan);
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>

<body>

    <div class="retro-grid"></div>
    <div class="sun"></div>
    <div class="scanlines"></div>

    <h1>Synthwave<br>1984</h1>
    <div class="subtitle">Future is Now</div>

    <div class="container">
        <p class="content-text cursor">
            欢迎来到复古未来主义 (Retro Futurism)。<br><br>
            这种风格也就是 Synthwave 或 Vaporwave，其特征是霓虹配色、透视网格、像素字体和落日余晖。<br><br>
            它模仿了 80 年代对未来的想象——那是 VHS 录像带、街机游戏和合成器音乐的黄金时代。
        </p>
        
        <div style="text-align: center; margin-top: 40px;">
            <a href="index.html" class="retro-btn">INSERT COIN</a>
        </div>
    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个 80年代复古 / Synthwave 风格的网页。使用深色背景，霓虹粉和青色配色，网格地面动画，复古未来主义字体（如 'Press Start 2P'）和落日渐变。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>
