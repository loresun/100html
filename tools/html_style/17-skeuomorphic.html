    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拟物风 / Skeuomorphic</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2c2c2c;
            background-image: 
                url("data:image/svg+xml,%3Csvg width='4' height='4' viewBox='0 0 4 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 3h1v1H1V3zm2-2h1v1H3V1z' fill='%23000000' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        /* 皮革材质卡片 */
        .leather-card {
            width: 350px;
            background-color: #5d4037;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E");
            border-radius: 15px;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.8),
                0 10px 20px rgba(0,0,0,0.5),
                0 0 0 4px #4e342e;
            padding: 30px;
            position: relative;
            color: #ebd1aa;
            text-shadow: 0 -1px 1px rgba(0,0,0,0.5);
        }

        /* 缝线效果 */
        .stitches {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            pointer-events: none;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            padding-bottom: 10px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.1);
        }

        /* 实体按钮 */
        .btn-3d {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #1a1a1a;
            border-radius: 5px;
            background: linear-gradient(to bottom, #dcdcdc 0%, #a0a0a0 100%);
            color: #333;
            text-shadow: 0 1px 0 #fff;
            font-weight: bold;
            box-shadow: 
                inset 0 1px 0 #fff,
                0 2px 4px rgba(0,0,0,0.4);
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .btn-3d:active {
            background: linear-gradient(to bottom, #a0a0a0 0%, #dcdcdc 100%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            transform: translateY(2px);
        }

        /* 金属旋钮 */
        .knob-container {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #e0e0e0 0%, #a0a0a0 100%);
            border-radius: 20px;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .knob {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f0f0f0, #999);
            box-shadow: 
                0 5px 10px rgba(0,0,0,0.5),
                inset 0 0 0 2px #666;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .knob::after {
            content: "";
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
            box-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }
        
        .knob:active {
            transform: rotate(45deg);
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

    <div class="container">
        <!-- 卡片 -->
        <div class="leather-card">
            <div class="stitches"></div>
            <h2>Skeuomorphism</h2>
            <p>拟物化设计致力于不仅模仿现实物体的外观（皮革、金属、木纹），还模仿其物理属性和反馈。在扁平化流行之前，它是数字界面的主宰。</p>
            <a href="index.html" class="btn-3d">返回首页</a>
        </div>

        <!-- 旋钮 -->
        <div class="knob-container">
            <div class="knob" title="Turn me!"></div>
        </div>
    </div>


    
    
    <!-- AI Prompt Box (Added by Script) -->
    <style>
        .ai-prompt-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ai-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ai-prompt-title {
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            color: #fff;
        }
        .ai-copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-copy-btn:hover { background: rgba(255,255,255,0.2); }
        .ai-prompt-content {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            user-select: all;
            word-break: break-word;
        }
    </style>
    <div class="ai-prompt-popup" id="aiPromptPopup">
        <div class="ai-prompt-header">
            <h4 class="ai-prompt-title">AI 提示词</h4>
            <button class="ai-copy-btn" onclick="copyPrompt()">复制</button>
        </div>
        <div class="ai-prompt-content" id="aiPromptText">创建一个拟物化风格的网页。模仿真实材质如皮革、金属或木纹。使用缝线边框、内阴影、金属渐变和具有物理质感的按钮。</div>
    </div>
    <script>
        function copyPrompt() {
            const text = document.getElementById('aiPromptText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.ai-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
    </script>

</html>
