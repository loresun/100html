<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行规划师 - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #f0fdfa 0%, #ccfbf1 50%, #ecfeff 100%);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 3px; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.5s ease-out forwards; }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-scale { animation: fadeInScale 0.4s ease-out forwards; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }

        @keyframes slideRight {
            from { width: 0%; }
            to { width: var(--target-width); }
        }

        .step-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 风格选择芯片 */
        .style-chip {
            transition: all 0.25s ease;
            border: 2px solid transparent;
        }
        .style-chip.active {
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 14px -4px rgba(13, 148, 136, 0.4);
            transform: translateY(-1px);
        }

        /* 目的地快捷芯片 */
        .dest-chip {
            transition: all 0.2s ease;
        }
        .dest-chip:hover {
            background: #0d9488;
            color: white;
            transform: translateY(-1px);
        }

        /* 预算选择卡片 */
        .budget-card {
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
        }
        .budget-card.active {
            border-color: #0d9488;
            background: linear-gradient(135deg, #f0fdfa, #ccfbf1);
            box-shadow: 0 8px 25px -8px rgba(13, 148, 136, 0.3);
            transform: translateY(-2px);
        }

        /* 天数滑块 */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            background: linear-gradient(90deg, #0d9488 0%, #0d9488 var(--range-progress), #e2e8f0 var(--range-progress));
            border-radius: 4px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: white;
            border: 3px solid #0d9488;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(13, 148, 136, 0.3);
            transition: all 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.4);
        }

        /* 行程时间线 */
        .timeline-line {
            position: absolute;
            left: 23px;
            top: 48px;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #0d9488 0%, #5eead4 100%);
            border-radius: 2px;
        }
        .timeline-dot {
            width: 12px;
            height: 12px;
            background: #0d9488;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
            z-index: 2;
            position: relative;
        }

        /* 日程卡片 */
        .day-card {
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        .day-card:hover {
            box-shadow: 0 8px 30px -10px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }
        .day-card.expanded {
            border-color: #0d9488;
            box-shadow: 0 12px 40px -12px rgba(13, 148, 136, 0.2);
        }

        /* 活动时段标签 */
        .time-badge-morning { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
        .time-badge-afternoon { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af; }
        .time-badge-evening { background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: #5b21b6; }

        /* Toast 通知 */
        .toast-enter { animation: fadeInUp 0.3s ease-out; }
        .toast-leave { animation: fadeInUp 0.3s ease-out reverse; }

        /* 步骤指示器 */
        .step-dot {
            transition: all 0.4s ease;
        }
        .step-dot.active {
            background: #0d9488;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.2);
        }
        .step-dot.completed {
            background: #0d9488;
        }
        .step-connector {
            transition: all 0.6s ease;
        }
        .step-connector.active {
            background: #0d9488;
        }

        /* Markdown 渲染 */
        .prose-travel h3 { font-size: 1rem; font-weight: 700; color: #0f172a; margin-top: 0.75rem; }
        .prose-travel p { margin: 0.3rem 0; line-height: 1.6; }
        .prose-travel ul { padding-left: 1.2rem; margin: 0.3rem 0; }
        .prose-travel li { margin: 0.15rem 0; }
        .prose-travel strong { color: #0d9488; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div x-data="travelPlannerApp" class="min-h-screen flex flex-col">

        <!-- 顶部导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-teal-200/60">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition"
                        onclick="location.href='../../index.html'">
                        <div class="w-10 h-10 bg-gradient-to-br from-teal-500 to-cyan-500 rounded-xl flex items-center justify-center shadow-lg">
                            <i data-lucide="map-pin" class="text-white h-5 w-5"></i>
                        </div>
                        <div>
                            <span class="font-bold text-lg text-slate-900">旅行规划师</span>
                            <span class="hidden sm:inline text-xs text-slate-500 ml-2">AI 智能行程规划</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-teal-600 transition flex items-center gap-1 text-sm font-medium px-3 py-2 rounded-lg hover:bg-teal-50">
                            <i data-lucide="settings" class="h-4 w-4"></i>
                            <span class="hidden sm:inline">设置</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 步骤指示器 -->
        <div class="bg-white/60 backdrop-blur-sm border-b border-teal-100">
            <div class="max-w-3xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <template x-for="(s, idx) in steps" :key="idx">
                        <div class="flex items-center" :class="idx < steps.length - 1 ? 'flex-1' : ''">
                            <!-- 步骤圆点 -->
                            <div class="flex flex-col items-center relative">
                                <div :class="[
                                    'step-dot w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all',
                                    currentStep > idx + 1 ? 'completed text-white' : '',
                                    currentStep === idx + 1 ? 'active text-white' : '',
                                    currentStep < idx + 1 ? 'bg-slate-200 text-slate-500' : ''
                                ]">
                                    <template x-if="currentStep > idx + 1">
                                        <i data-lucide="check" class="w-5 h-5"></i>
                                    </template>
                                    <template x-if="currentStep <= idx + 1">
                                        <span x-text="idx + 1"></span>
                                    </template>
                                </div>
                                <span class="text-xs mt-1.5 font-medium whitespace-nowrap"
                                    :class="currentStep >= idx + 1 ? 'text-teal-700' : 'text-slate-400'"
                                    x-text="s.label"></span>
                            </div>
                            <!-- 连接线 -->
                            <div x-show="idx < steps.length - 1"
                                class="flex-1 h-1 rounded mx-3 mt-[-18px]"
                                :class="currentStep > idx + 1 ? 'step-connector active' : 'bg-slate-200'">
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="flex-grow overflow-y-auto">

            <!-- ==================== 步骤1: 输入信息 ==================== -->
            <div x-show="currentStep === 1" x-transition:enter="step-transition"
                x-transition:enter-start="opacity-0 translate-x-8"
                x-transition:enter-end="opacity-100 translate-x-0"
                class="max-w-4xl mx-auto px-4 py-8">

                <div class="text-center mb-8 animate-fade-in">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">✈️ 开始规划你的旅行</h2>
                    <p class="text-slate-500">填写旅行信息，AI 将为你量身定制完美行程</p>
                </div>

                <div class="space-y-6">
                    <!-- 目的地输入 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm animate-fade-in">
                        <label class="font-bold text-sm text-slate-700 flex items-center gap-2 mb-3">
                            <i data-lucide="map-pin" class="w-4 h-4 text-teal-600"></i>
                            目的地 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" x-model="input.destination"
                            placeholder="输入你想去的城市或地区..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-base outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition">
                        <!-- 热门目的地快选 -->
                        <div class="mt-3 flex flex-wrap gap-2">
                            <span class="text-xs text-slate-400 leading-7">热门:</span>
                            <template x-for="dest in popularDests" :key="dest">
                                <button @click="input.destination = dest"
                                    :class="['dest-chip px-3 py-1 rounded-full text-xs font-medium border border-teal-200 bg-teal-50 text-teal-700 cursor-pointer',
                                        input.destination === dest ? 'bg-teal-600 !text-white !border-teal-600' : '']"
                                    x-text="dest"></button>
                            </template>
                        </div>
                    </div>

                    <!-- 天数 + 人数 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- 出行天数 -->
                        <div class="bg-white rounded-2xl p-6 shadow-sm animate-fade-in">
                            <label class="font-bold text-sm text-slate-700 flex items-center gap-2 mb-3">
                                <i data-lucide="calendar-days" class="w-4 h-4 text-teal-600"></i>
                                出行天数
                            </label>
                            <div class="flex items-center gap-4">
                                <input type="range" x-model.number="input.days" min="1" max="14" step="1"
                                    class="flex-1"
                                    :style="'--range-progress:' + ((input.days - 1) / 13 * 100) + '%'">
                                <div class="bg-teal-50 border border-teal-200 rounded-xl px-4 py-2 min-w-[80px] text-center">
                                    <span class="text-2xl font-bold text-teal-700" x-text="input.days"></span>
                                    <span class="text-xs text-teal-600 ml-1">天</span>
                                </div>
                            </div>
                            <div class="flex justify-between text-xs text-slate-400 mt-1 px-1">
                                <span>1天</span><span>7天</span><span>14天</span>
                            </div>
                        </div>

                        <!-- 出行人数 -->
                        <div class="bg-white rounded-2xl p-6 shadow-sm animate-fade-in">
                            <label class="font-bold text-sm text-slate-700 flex items-center gap-2 mb-3">
                                <i data-lucide="users" class="w-4 h-4 text-teal-600"></i>
                                出行人数
                            </label>
                            <div class="flex items-center gap-3">
                                <button @click="input.travelers > 1 && input.travelers--"
                                    class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition text-lg font-bold text-slate-600">−</button>
                                <div class="flex-1 bg-teal-50 border border-teal-200 rounded-xl px-4 py-2 text-center">
                                    <span class="text-2xl font-bold text-teal-700" x-text="input.travelers"></span>
                                    <span class="text-xs text-teal-600 ml-1">人</span>
                                </div>
                                <button @click="input.travelers < 20 && input.travelers++"
                                    class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition text-lg font-bold text-slate-600">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- 预算等级 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm animate-fade-in">
                        <label class="font-bold text-sm text-slate-700 flex items-center gap-2 mb-4">
                            <i data-lucide="wallet" class="w-4 h-4 text-teal-600"></i>
                            预算等级
                        </label>
                        <div class="grid grid-cols-3 gap-3">
                            <template x-for="b in budgetOptions" :key="b.value">
                                <div @click="input.budget = b.value"
                                    :class="['budget-card rounded-2xl p-4 cursor-pointer text-center',
                                        input.budget === b.value ? 'active' : 'bg-white hover:border-teal-300']">
                                    <span class="text-3xl block mb-2" x-text="b.icon"></span>
                                    <span class="font-bold text-sm block" x-text="b.label"></span>
                                    <span class="text-xs text-slate-500 mt-1 block" x-text="b.desc"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 旅行风格 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm animate-fade-in">
                        <label class="font-bold text-sm text-slate-700 flex items-center gap-2 mb-4">
                            <i data-lucide="compass" class="w-4 h-4 text-teal-600"></i>
                            旅行风格 <span class="text-xs text-slate-400 ml-2">(可多选)</span>
                        </label>
                        <div class="flex flex-wrap gap-2">
                            <template x-for="s in travelStyles" :key="s.value">
                                <button @click="toggleStyle(s.value)"
                                    :class="['style-chip px-4 py-2 rounded-full text-sm font-medium border border-teal-200 bg-teal-50/50 text-slate-700 cursor-pointer',
                                        input.styles.includes(s.value) ? 'active' : '']">
                                    <span x-text="s.icon + ' ' + s.label"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- 特殊需求 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm animate-fade-in">
                        <label class="font-bold text-sm text-slate-700 flex items-center gap-2 mb-3">
                            <i data-lucide="message-square-plus" class="w-4 h-4 text-teal-600"></i>
                            特殊需求 <span class="text-xs text-slate-400">(可选)</span>
                        </label>
                        <textarea x-model="input.requirements" rows="3"
                            placeholder="例如：需要无障碍设施、带宠物出行、素食需求、想体验当地节日活动..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition resize-none"></textarea>
                    </div>

                    <!-- 下一步按钮 -->
                    <button @click="generateOverview"
                        :disabled="!input.destination || isGenerating"
                        class="w-full bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-700 hover:to-cyan-700 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-all text-lg">
                        <template x-if="isGenerating">
                            <span class="flex items-center gap-2">
                                <i data-lucide="loader-2" class="animate-spin w-5 h-5"></i>
                                正在生成行程概览...
                            </span>
                        </template>
                        <template x-if="!isGenerating">
                            <span class="flex items-center gap-2">
                                <i data-lucide="sparkles" class="w-5 h-5"></i>
                                生成行程概览
                                <i data-lucide="arrow-right" class="w-5 h-5"></i>
                            </span>
                        </template>
                    </button>
                </div>
            </div>

            <!-- ==================== 步骤2: 行程概览 ==================== -->
            <div x-show="currentStep === 2" x-transition:enter="step-transition"
                x-transition:enter-start="opacity-0 translate-x-8"
                x-transition:enter-end="opacity-100 translate-x-0"
                class="max-w-4xl mx-auto px-4 py-8">

                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">📋 行程概览</h2>
                    <p class="text-slate-500">
                        <span x-text="input.destination"></span> · <span x-text="input.days"></span>天 ·
                        <span x-text="budgetOptions.find(b => b.value === input.budget)?.label"></span>
                    </p>
                </div>

                <!-- 流式生成区域 / 概览卡片 -->
                <div x-show="isGenerating && overviewRaw" class="bg-white rounded-2xl p-6 shadow-sm mb-6">
                    <div class="flex items-center gap-2 mb-3">
                        <i data-lucide="loader-2" class="animate-spin w-4 h-4 text-teal-600"></i>
                        <span class="text-sm text-teal-700 font-medium">AI 正在规划行程...</span>
                    </div>
                    <div class="prose-travel text-sm text-slate-700 whitespace-pre-wrap" x-html="renderMarkdown(overviewRaw)"></div>
                </div>

                <!-- 生成完成后的概览卡片列表 -->
                <div x-show="!isGenerating && overviewDays.length > 0" class="space-y-3 mb-6">
                    <template x-for="(day, idx) in overviewDays" :key="idx">
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:border-teal-200 transition animate-fade-in"
                            :style="'animation-delay:' + (idx * 0.08) + 's'">
                            <div class="flex items-start gap-4">
                                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-teal-500 to-cyan-500 flex items-center justify-center flex-shrink-0 shadow">
                                    <span class="text-white font-bold text-lg" x-text="'D' + (idx + 1)"></span>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-bold text-slate-900 mb-1" x-text="day.title || ('第' + (idx+1) + '天')"></h3>
                                    <p class="text-sm text-slate-600 leading-relaxed" x-text="day.summary"></p>
                                    <div x-show="day.highlights && day.highlights.length" class="flex flex-wrap gap-1.5 mt-2">
                                        <template x-for="h in (day.highlights || [])" :key="h">
                                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs bg-teal-50 text-teal-700 border border-teal-200" x-text="h"></span>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- 按钮组 -->
                <div x-show="!isGenerating && overviewDays.length > 0" class="flex gap-3">
                    <button @click="currentStep = 1"
                        class="px-6 py-3 rounded-xl border-2 border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition flex items-center gap-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回修改
                    </button>
                    <button @click="goToStep3"
                        class="flex-1 bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-700 hover:to-cyan-700 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2 text-lg">
                        查看详细行程 <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- ==================== 步骤3: 详细行程 ==================== -->
            <div x-show="currentStep === 3" x-transition:enter="step-transition"
                x-transition:enter-start="opacity-0 translate-x-8"
                x-transition:enter-end="opacity-100 translate-x-0"
                class="max-w-4xl mx-auto px-4 py-8">

                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">🗺️ 详细行程</h2>
                    <p class="text-slate-500">点击每天的卡片展开详细安排，AI 将为你生成完整计划</p>
                </div>

                <!-- 时间线行程 -->
                <div class="relative space-y-4 mb-8">
                    <template x-for="(day, idx) in overviewDays" :key="idx">
                        <div class="relative pl-12 animate-fade-in" :style="'animation-delay:' + (idx * 0.06) + 's'">
                            <!-- 时间线竖线（非最后一个） -->
                            <div x-show="idx < overviewDays.length - 1"
                                class="absolute left-[22px] top-[52px] bottom-[-16px] w-[3px] bg-gradient-to-b from-teal-300 to-teal-100 rounded"></div>
                            <!-- 时间线圆点 -->
                            <div class="absolute left-[17px] top-[18px] timeline-dot"></div>

                            <!-- 日程卡片 -->
                            <div :class="['day-card bg-white rounded-2xl overflow-hidden shadow-sm cursor-pointer',
                                    expandedDay === idx ? 'expanded' : '']"
                                @click="toggleDayExpand(idx)">
                                <!-- 卡片头部 -->
                                <div class="p-5 flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-teal-500 to-cyan-500 flex items-center justify-center shadow-sm">
                                            <span class="text-white font-bold text-sm" x-text="'D' + (idx + 1)"></span>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-slate-900" x-text="day.title || ('第' + (idx+1) + '天')"></h3>
                                            <p class="text-xs text-slate-500 mt-0.5" x-text="day.summary"></p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span x-show="dayDetails[idx]?.loaded" class="text-xs text-teal-600 bg-teal-50 px-2 py-0.5 rounded-full">已展开</span>
                                        <i data-lucide="chevron-down" class="w-5 h-5 text-slate-400 transition-transform"
                                            :class="expandedDay === idx ? 'rotate-180' : ''"></i>
                                    </div>
                                </div>

                                <!-- 展开内容 -->
                                <div x-show="expandedDay === idx"
                                    x-transition:enter="transition ease-out duration-300"
                                    x-transition:enter-start="opacity-0 max-h-0"
                                    x-transition:enter-end="opacity-100 max-h-[2000px]"
                                    class="border-t border-slate-100"
                                    @click.stop>

                                    <!-- 正在加载 -->
                                    <div x-show="dayDetails[idx]?.loading" class="p-6 text-center">
                                        <i data-lucide="loader-2" class="animate-spin w-6 h-6 text-teal-600 mx-auto mb-2"></i>
                                        <p class="text-sm text-slate-500">正在为第 <span x-text="idx+1"></span> 天生成详细计划...</p>
                                    </div>

                                    <!-- 流式内容 -->
                                    <div x-show="dayDetails[idx]?.content" class="p-6">
                                        <div class="space-y-4">
                                            <!-- 上午 -->
                                            <div x-show="getDaySection(idx, 'morning')">
                                                <div class="flex items-center gap-2 mb-2">
                                                    <span class="time-badge-morning px-2.5 py-1 rounded-lg text-xs font-bold">🌅 上午</span>
                                                </div>
                                                <div class="prose-travel text-sm text-slate-700 ml-1 pl-3 border-l-2 border-amber-200"
                                                    x-html="renderMarkdown(getDaySection(idx, 'morning'))"></div>
                                            </div>
                                            <!-- 下午 -->
                                            <div x-show="getDaySection(idx, 'afternoon')">
                                                <div class="flex items-center gap-2 mb-2">
                                                    <span class="time-badge-afternoon px-2.5 py-1 rounded-lg text-xs font-bold">☀️ 下午</span>
                                                </div>
                                                <div class="prose-travel text-sm text-slate-700 ml-1 pl-3 border-l-2 border-blue-200"
                                                    x-html="renderMarkdown(getDaySection(idx, 'afternoon'))"></div>
                                            </div>
                                            <!-- 晚上 -->
                                            <div x-show="getDaySection(idx, 'evening')">
                                                <div class="flex items-center gap-2 mb-2">
                                                    <span class="time-badge-evening px-2.5 py-1 rounded-lg text-xs font-bold">🌙 晚上</span>
                                                </div>
                                                <div class="prose-travel text-sm text-slate-700 ml-1 pl-3 border-l-2 border-purple-200"
                                                    x-html="renderMarkdown(getDaySection(idx, 'evening'))"></div>
                                            </div>
                                            <!-- 无法分段时显示完整内容 -->
                                            <div x-show="!getDaySection(idx, 'morning') && dayDetails[idx]?.content">
                                                <div class="prose-travel text-sm text-slate-700"
                                                    x-html="renderMarkdown(dayDetails[idx]?.content || '')"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- 按钮组 -->
                <div class="flex gap-3">
                    <button @click="currentStep = 2"
                        class="px-6 py-3 rounded-xl border-2 border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition flex items-center gap-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> 回到概览
                    </button>
                    <button @click="generateFinalSummary"
                        :disabled="isGenerating"
                        class="flex-1 bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-700 hover:to-cyan-700 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl disabled:opacity-50 transition flex items-center justify-center gap-2 text-lg">
                        <template x-if="isGenerating">
                            <span class="flex items-center gap-2"><i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> 生成总结...</span>
                        </template>
                        <template x-if="!isGenerating">
                            <span class="flex items-center gap-2">生成完整行程单 <i data-lucide="file-text" class="w-5 h-5"></i></span>
                        </template>
                    </button>
                </div>
            </div>

            <!-- ==================== 步骤4: 完整行程单 ==================== -->
            <div x-show="currentStep === 4" x-transition:enter="step-transition"
                x-transition:enter-start="opacity-0 translate-x-8"
                x-transition:enter-end="opacity-100 translate-x-0"
                class="max-w-4xl mx-auto px-4 py-8">

                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">🎒 完整行程单</h2>
                    <p class="text-slate-500"><span x-text="input.destination"></span> · <span x-text="input.days"></span>天 完美旅行</p>
                </div>

                <!-- 旅行摘要卡片 -->
                <div class="bg-gradient-to-br from-teal-600 to-cyan-600 rounded-2xl p-6 text-white shadow-xl mb-6 animate-fade-in">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                        <div>
                            <div class="text-3xl font-bold" x-text="input.destination">—</div>
                            <div class="text-teal-200 text-xs mt-1">目的地</div>
                        </div>
                        <div>
                            <div class="text-3xl font-bold" x-text="input.days + '天'">—</div>
                            <div class="text-teal-200 text-xs mt-1">行程天数</div>
                        </div>
                        <div>
                            <div class="text-3xl font-bold" x-text="input.travelers + '人'">—</div>
                            <div class="text-teal-200 text-xs mt-1">出行人数</div>
                        </div>
                        <div>
                            <div class="text-3xl font-bold" x-text="budgetOptions.find(b => b.value === input.budget)?.label || '—'">—</div>
                            <div class="text-teal-200 text-xs mt-1">预算等级</div>
                        </div>
                    </div>
                </div>

                <!-- 总结内容（流式） -->
                <div x-show="isGenerating && finalSummaryRaw" class="bg-white rounded-2xl p-6 shadow-sm mb-6">
                    <div class="flex items-center gap-2 mb-3">
                        <i data-lucide="loader-2" class="animate-spin w-4 h-4 text-teal-600"></i>
                        <span class="text-sm text-teal-700 font-medium">正在汇总旅行建议...</span>
                    </div>
                    <div class="prose-travel text-sm text-slate-700" x-html="renderMarkdown(finalSummaryRaw)"></div>
                </div>

                <!-- 最终总结 -->
                <div x-show="!isGenerating && finalSummary" class="space-y-4 mb-6">
                    <!-- 旅行贴士 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm animate-fade-in">
                        <h3 class="font-bold text-lg text-slate-900 mb-3 flex items-center gap-2">
                            <i data-lucide="lightbulb" class="w-5 h-5 text-amber-500"></i> 旅行贴士
                        </h3>
                        <div class="prose-travel text-sm text-slate-700" x-html="renderMarkdown(finalSummary.tips || '')"></div>
                    </div>
                    <!-- 行李清单 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm animate-fade-in" style="animation-delay:0.1s">
                        <h3 class="font-bold text-lg text-slate-900 mb-3 flex items-center gap-2">
                            <i data-lucide="luggage" class="w-5 h-5 text-teal-600"></i> 行李清单
                        </h3>
                        <div class="prose-travel text-sm text-slate-700" x-html="renderMarkdown(finalSummary.packing || '')"></div>
                    </div>
                    <!-- 费用估算 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm animate-fade-in" style="animation-delay:0.2s">
                        <h3 class="font-bold text-lg text-slate-900 mb-3 flex items-center gap-2">
                            <i data-lucide="receipt" class="w-5 h-5 text-green-600"></i> 费用估算
                        </h3>
                        <div class="prose-travel text-sm text-slate-700" x-html="renderMarkdown(finalSummary.cost || '')"></div>
                    </div>
                </div>

                <!-- 按钮组 -->
                <div class="flex gap-3">
                    <button @click="currentStep = 3"
                        class="px-6 py-3 rounded-xl border-2 border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition flex items-center gap-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回
                    </button>
                    <button @click="exportMarkdown"
                        class="flex-1 bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-700 hover:to-cyan-700 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2 text-lg">
                        <i data-lucide="download" class="w-5 h-5"></i> 导出 Markdown
                    </button>
                    <button @click="copyAllText"
                        class="px-6 py-3 rounded-xl border-2 border-teal-500 text-teal-600 font-medium hover:bg-teal-50 transition flex items-center gap-2">
                        <i data-lucide="copy" class="w-4 h-4"></i> 复制
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== 设置弹窗 ==================== -->
        <div x-show="showSettings" x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
            class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4"
            @click.self="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-fade-scale">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="settings" class="w-5 h-5 text-teal-600"></i> API 配置
                    </h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600 transition">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" x-model="apiConfig.deepseek"
                            placeholder="sk-..."
                            class="w-full rounded-xl border border-slate-300 p-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">模型选择</label>
                        <select x-model="apiConfig.model"
                            class="w-full rounded-xl border border-slate-300 p-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent bg-white">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">取消</button>
                    <button @click="saveConfig"
                        class="px-6 py-2.5 rounded-xl text-sm font-medium bg-teal-600 text-white hover:bg-teal-700 transition shadow">保存</button>
                </div>
            </div>
        </div>

        <!-- ==================== Toast 通知 ==================== -->
        <div x-show="toast.show"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-4"
            class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200]">
            <div class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-sm font-medium flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4 text-teal-400"></i>
                <span x-text="toast.message"></span>
            </div>
        </div>

    </div>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('travelPlannerApp', () => ({

            // ===== 步骤控制 =====
            currentStep: 1,
            steps: [
                { label: '填写信息' },
                { label: '行程概览' },
                { label: '详细行程' },
                { label: '完整行程单' }
            ],

            // ===== UI 状态 =====
            showSettings: false,
            isGenerating: false,
            expandedDay: null,
            toast: { show: false, message: '' },

            // ===== API 配置 =====
            apiConfig: {
                deepseek: '',
                model: 'deepseek-v4-flash'
            },

            // ===== 用户输入 =====
            input: {
                destination: '',
                days: 4,
                budget: 'comfort',
                styles: [],
                travelers: 2,
                requirements: ''
            },

            // ===== 数据选项 =====
            popularDests: ['京都', '大理', '成都', '巴厘岛', '清迈', '伊斯坦布尔', '布拉格', '冰岛', '西安', '厦门', '丽江', '曼谷'],

            budgetOptions: [
                { value: 'economy', label: '经济', icon: '💰', desc: '精打细算' },
                { value: 'comfort', label: '舒适', icon: '✨', desc: '品质出行' },
                { value: 'luxury', label: '豪华', icon: '👑', desc: '奢享旅途' }
            ],

            travelStyles: [
                { value: 'culture', label: '文艺', icon: '🎨' },
                { value: 'food', label: '美食', icon: '🍜' },
                { value: 'outdoor', label: '户外', icon: '🏔️' },
                { value: 'shopping', label: '购物', icon: '🛍️' },
                { value: 'history', label: '历史', icon: '🏛️' },
                { value: 'family', label: '亲子', icon: '👨‍👩‍👧' },
                { value: 'photo', label: '摄影', icon: '📸' }
            ],

            // ===== 行程数据 =====
            overviewRaw: '',
            overviewDays: [],
            dayDetails: {},
            finalSummaryRaw: '',
            finalSummary: null,

            // ===== 初始化 =====
            init() {
                this.loadConfig();
                this.$nextTick(() => this.refreshIcons());
            },

            /** 加载 localStorage 中的全局 LLM 配置 */
            loadConfig() {
                try {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        this.apiConfig = { ...this.apiConfig, ...parsed };
                    }
                } catch (e) {
                    console.warn('配置加载失败:', e);
                }
            },

            /** 保存配置（合并策略，不覆盖其他工具的配置） */
            saveConfig() {
                try {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...current,
                        deepseek: this.apiConfig.deepseek,
                        model: this.apiConfig.model
                    }));
                    this.showSettings = false;
                    this.showToast('配置已保存');
                } catch (e) {
                    console.error('保存配置失败:', e);
                }
            },

            /** 切换旅行风格多选 */
            toggleStyle(val) {
                const idx = this.input.styles.indexOf(val);
                if (idx === -1) {
                    this.input.styles.push(val);
                } else {
                    this.input.styles.splice(idx, 1);
                }
            },

            /** 渲染 Markdown 为 HTML */
            renderMarkdown(text) {
                if (!text) return '';
                try {
                    return marked.parse(text);
                } catch (e) {
                    return text.replace(/\n/g, '<br>');
                }
            },

            /** 显示 Toast 通知 */
            showToast(msg) {
                this.toast.message = msg;
                this.toast.show = true;
                setTimeout(() => { this.toast.show = false; }, 2500);
            },

            /** 刷新 Lucide 图标 */
            refreshIcons() {
                setTimeout(() => {
                    try { lucide.createIcons(); } catch(e) {}
                }, 100);
            },

            // ===================================================================
            //  步骤2: 生成行程概览
            // ===================================================================

            /** 调用 AI 生成高层行程概览 */
            async generateOverview() {
                if (!this.input.destination) return;
                if (!this.apiConfig.deepseek) {
                    this.showSettings = true;
                    return;
                }

                this.isGenerating = true;
                this.overviewRaw = '';
                this.overviewDays = [];
                this.dayDetails = {};
                this.finalSummary = null;
                this.finalSummaryRaw = '';
                this.currentStep = 2;
                this.$nextTick(() => this.refreshIcons());

                const styleLabels = this.input.styles.map(v => {
                    const s = this.travelStyles.find(x => x.value === v);
                    return s ? s.label : v;
                }).join('、') || '自由探索';

                const budgetLabel = this.budgetOptions.find(b => b.value === this.input.budget)?.label || '舒适';

                const systemPrompt = `你是一位经验丰富的旅行规划师，精通全球各地的旅游资源。
请根据用户的需求，生成一份${this.input.days}天的旅行行程概览。

要求：
1. 返回严格的 JSON 格式，不要包含任何其他文字
2. JSON 结构如下：
{
  "days": [
    {
      "title": "第1天的主题标题",
      "summary": "当天的主要行程概要（50-80字）",
      "highlights": ["亮点1", "亮点2", "亮点3"]
    }
  ]
}
3. 每天的行程安排要合理，考虑地理位置的连贯性
4. 根据预算等级调整推荐档次
5. 融合用户偏好的旅行风格`;

                const userPrompt = `目的地：${this.input.destination}
天数：${this.input.days}天
人数：${this.input.travelers}人
预算等级：${budgetLabel}
旅行风格偏好：${styleLabels}
${this.input.requirements ? '特殊需求：' + this.input.requirements : ''}

请生成行程概览 JSON。`;

                try {
                    await this.streamAPI(
                        [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        (chunk) => { this.overviewRaw += chunk; },
                        true
                    );

                    this.parseOverview();
                } catch (e) {
                    console.error('生成概览失败:', e);
                    this.showToast('生成失败: ' + (e.message || '请检查API配置'));
                } finally {
                    this.isGenerating = false;
                    this.$nextTick(() => this.refreshIcons());
                }
            },

            /** 解析概览 JSON（兼容各种格式） */
            parseOverview() {
                try {
                    let text = this.overviewRaw.trim();
                    // 移除 markdown 代码块标记
                    text = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');

                    const data = JSON.parse(text);
                    if (data.days && Array.isArray(data.days)) {
                        this.overviewDays = data.days;
                    } else if (Array.isArray(data)) {
                        this.overviewDays = data;
                    } else {
                        throw new Error('未找到 days 数组');
                    }
                } catch (e) {
                    console.warn('JSON 解析失败，尝试回退解析:', e);
                    this.fallbackParseOverview();
                }
            },

            /** JSON 解析失败时的回退文本解析 */
            fallbackParseOverview() {
                const lines = this.overviewRaw.split('\n').filter(l => l.trim());
                const days = [];
                let current = null;

                for (const line of lines) {
                    const dayMatch = line.match(/第(\d+)天|Day\s*(\d+)/i);
                    if (dayMatch) {
                        if (current) days.push(current);
                        const num = dayMatch[1] || dayMatch[2];
                        current = { title: `第${num}天`, summary: '', highlights: [] };
                    } else if (current) {
                        current.summary += line.replace(/^[-*·•]\s*/, '') + ' ';
                    }
                }
                if (current) days.push(current);

                if (days.length === 0) {
                    for (let i = 0; i < this.input.days; i++) {
                        days.push({
                            title: `第${i + 1}天`,
                            summary: '行程安排中...',
                            highlights: []
                        });
                    }
                }
                this.overviewDays = days;
            },

            // ===================================================================
            //  步骤3: 每天详细行程
            // ===================================================================

            /** 进入步骤3 */
            goToStep3() {
                this.currentStep = 3;
                this.expandedDay = null;
                this.$nextTick(() => this.refreshIcons());
            },

            /** 展开/折叠某天的详细计划 */
            async toggleDayExpand(idx) {
                if (this.expandedDay === idx) {
                    this.expandedDay = null;
                    return;
                }
                this.expandedDay = idx;
                this.$nextTick(() => this.refreshIcons());

                if (!this.dayDetails[idx] || !this.dayDetails[idx].loaded) {
                    await this.generateDayDetail(idx);
                }
            },

            /** 为某天生成详细行程 */
            async generateDayDetail(idx) {
                if (!this.apiConfig.deepseek) {
                    this.showSettings = true;
                    return;
                }

                this.dayDetails[idx] = { loading: true, content: '', loaded: false };

                const day = this.overviewDays[idx];
                const budgetLabel = this.budgetOptions.find(b => b.value === this.input.budget)?.label || '舒适';
                const styleLabels = this.input.styles.map(v => {
                    const s = this.travelStyles.find(x => x.value === v);
                    return s ? s.label : v;
                }).join('、') || '自由探索';

                const systemPrompt = `你是一位资深旅行规划师。请为旅行的某一天生成详细的行程安排。

输出格式要求：
1. 分为"上午"、"下午"、"晚上"三个时段
2. 每个时段包含：
   - 具体活动和景点
   - 交通方式建议
   - 餐饮推荐（对应用餐时间）
   - 估算费用（人均，人民币）
3. 使用 Markdown 格式
4. 用 ### 上午、### 下午、### 晚上 作为分隔标题
5. 给出实用贴士

旅行背景：
- 目的地：${this.input.destination}
- 总行程：${this.input.days}天
- 人数：${this.input.travelers}人
- 预算等级：${budgetLabel}
- 旅行风格：${styleLabels}`;

                const userPrompt = `请为第${idx + 1}天生成详细行程。
当天概况：${day.title} - ${day.summary}
${day.highlights?.length ? '亮点关键词：' + day.highlights.join('、') : ''}`;

                try {
                    this.dayDetails[idx].loading = true;
                    await this.streamAPI(
                        [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        (chunk) => {
                            this.dayDetails[idx].content += chunk;
                        },
                        false
                    );
                    this.dayDetails[idx].loaded = true;
                } catch (e) {
                    console.error(`第${idx+1}天详情生成失败:`, e);
                    this.dayDetails[idx].content = '生成失败，请重试。';
                } finally {
                    this.dayDetails[idx].loading = false;
                    this.$nextTick(() => this.refreshIcons());
                }
            },

            /** 从每天详情中提取上午/下午/晚上分段 */
            getDaySection(idx, section) {
                const content = this.dayDetails[idx]?.content || '';
                if (!content) return '';

                const sectionMap = {
                    morning: /###\s*上午([\s\S]*?)(?=###\s*下午|###\s*晚上|$)/,
                    afternoon: /###\s*下午([\s\S]*?)(?=###\s*晚上|$)/,
                    evening: /###\s*晚上([\s\S]*?)$/
                };

                const match = content.match(sectionMap[section]);
                return match ? match[1].trim() : '';
            },

            // ===================================================================
            //  步骤4: 最终总结
            // ===================================================================

            /** 生成最终旅行总结 */
            async generateFinalSummary() {
                if (!this.apiConfig.deepseek) {
                    this.showSettings = true;
                    return;
                }

                this.isGenerating = true;
                this.finalSummaryRaw = '';
                this.finalSummary = null;
                this.currentStep = 4;
                this.$nextTick(() => this.refreshIcons());

                const budgetLabel = this.budgetOptions.find(b => b.value === this.input.budget)?.label || '舒适';

                let itineraryContext = '';
                this.overviewDays.forEach((day, i) => {
                    itineraryContext += `\n第${i+1}天: ${day.title} - ${day.summary}`;
                    if (this.dayDetails[i]?.content) {
                        itineraryContext += '\n' + this.dayDetails[i].content.substring(0, 500);
                    }
                });

                const systemPrompt = `你是一位旅行规划总结专家。请根据以下行程信息，生成三部分总结内容。

严格按以下 JSON 格式输出，不要包含其他文字：
{
  "tips": "旅行贴士（使用 Markdown 列表，5-8条实用建议，包括天气、文化、安全、交通等）",
  "packing": "行李清单（使用 Markdown 列表，按类别分组：证件/衣物/电子设备/日用品/其他）",
  "cost": "费用估算（使用 Markdown 表格或列表，分类列出：交通/住宿/餐饮/景点门票/购物预算/其他，给出人均和总计）"
}`;

                const userPrompt = `旅行信息：
- 目的地：${this.input.destination}
- 天数：${this.input.days}天
- 人数：${this.input.travelers}人
- 预算等级：${budgetLabel}
- 行程概要：${itineraryContext}

请生成旅行总结 JSON。`;

                try {
                    await this.streamAPI(
                        [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        (chunk) => { this.finalSummaryRaw += chunk; },
                        true
                    );
                    this.parseFinalSummary();
                } catch (e) {
                    console.error('生成总结失败:', e);
                    this.showToast('生成失败: ' + (e.message || '请检查API配置'));
                } finally {
                    this.isGenerating = false;
                    this.$nextTick(() => this.refreshIcons());
                }
            },

            /** 解析最终总结 JSON */
            parseFinalSummary() {
                try {
                    let text = this.finalSummaryRaw.trim();
                    text = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
                    this.finalSummary = JSON.parse(text);
                } catch (e) {
                    console.warn('总结 JSON 解析失败，使用原文:', e);
                    this.finalSummary = {
                        tips: this.finalSummaryRaw,
                        packing: '',
                        cost: ''
                    };
                }
            },

            // ===================================================================
            //  导出功能
            // ===================================================================

            /** 导出为 Markdown 文件 */
            exportMarkdown() {
                const budgetLabel = this.budgetOptions.find(b => b.value === this.input.budget)?.label || '舒适';
                const styleLabels = this.input.styles.map(v => {
                    const s = this.travelStyles.find(x => x.value === v);
                    return s ? s.label : v;
                }).join('、') || '自由探索';

                let md = `# 🗺️ ${this.input.destination} ${this.input.days}天旅行计划\n\n`;
                md += `> 📅 ${this.input.days}天 | 👥 ${this.input.travelers}人 | 💰 ${budgetLabel} | 🎯 ${styleLabels}\n\n`;
                md += `---\n\n`;

                // 每日行程
                md += `## 📋 行程安排\n\n`;
                this.overviewDays.forEach((day, i) => {
                    md += `### Day ${i+1}: ${day.title}\n\n`;
                    md += `${day.summary}\n\n`;
                    if (this.dayDetails[i]?.content) {
                        md += this.dayDetails[i].content + '\n\n';
                    }
                    md += `---\n\n`;
                });

                // 总结部分
                if (this.finalSummary) {
                    if (this.finalSummary.tips) {
                        md += `## 💡 旅行贴士\n\n${this.finalSummary.tips}\n\n`;
                    }
                    if (this.finalSummary.packing) {
                        md += `## 🎒 行李清单\n\n${this.finalSummary.packing}\n\n`;
                    }
                    if (this.finalSummary.cost) {
                        md += `## 💰 费用估算\n\n${this.finalSummary.cost}\n\n`;
                    }
                }

                md += `---\n*由 AI 旅行规划师生成 | ${new Date().toLocaleDateString('zh-CN')}*\n`;

                const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${this.input.destination}_${this.input.days}天旅行计划.md`;
                a.click();
                URL.revokeObjectURL(url);
                this.showToast('行程已导出为 Markdown');
            },

            /** 复制全部文本 */
            async copyAllText() {
                const budgetLabel = this.budgetOptions.find(b => b.value === this.input.budget)?.label || '舒适';
                let text = `${this.input.destination} ${this.input.days}天旅行计划\n\n`;

                this.overviewDays.forEach((day, i) => {
                    text += `=== Day ${i+1}: ${day.title} ===\n${day.summary}\n`;
                    if (this.dayDetails[i]?.content) {
                        text += this.dayDetails[i].content + '\n';
                    }
                    text += '\n';
                });

                if (this.finalSummary) {
                    if (this.finalSummary.tips) text += `\n--- 旅行贴士 ---\n${this.finalSummary.tips}\n`;
                    if (this.finalSummary.packing) text += `\n--- 行李清单 ---\n${this.finalSummary.packing}\n`;
                    if (this.finalSummary.cost) text += `\n--- 费用估算 ---\n${this.finalSummary.cost}\n`;
                }

                try {
                    await navigator.clipboard.writeText(text);
                    this.showToast('已复制到剪贴板');
                } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    this.showToast('已复制到剪贴板');
                }
            },

            // ===================================================================
            //  核心：流式 API 调用
            // ===================================================================

            /**
             * 调用 DeepSeek API（流式）
             * @param {Array} messages - 消息数组
             * @param {Function} onChunk - 每收到一段文本时的回调
             * @param {boolean} jsonMode - 是否启用 JSON 输出模式
             */
            async streamAPI(messages, onChunk, jsonMode = false) {
                const body = {
                    model: this.apiConfig.model,
                    messages: messages,
                    stream: true,
                    temperature: 0.7
                };

                if (jsonMode) {
                    body.response_format = { type: 'json_object' };
                }

                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${this.apiConfig.deepseek}`
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    const errBody = await response.text();
                    throw new Error(`API 请求失败 (${response.status}): ${errBody.substring(0, 200)}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6).trim();
                        if (data === '[DONE]') continue;

                        try {
                            const parsed = JSON.parse(data);
                            const delta = parsed.choices?.[0]?.delta;
                            if (delta?.content) {
                                onChunk(delta.content);
                            }
                            if (delta?.reasoning_content) {
                                // V4 Pro 模型的推理内容暂不显示
                            }
                        } catch (e) {
                            // 忽略非 JSON 行
                        }
                    }
                }
            }
        }));
    });
    </script>
