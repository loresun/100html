<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容矩阵生成器 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #f0f9ff 100%);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 3px; opacity: 0.5; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.5s ease-out forwards; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-in { animation: slideInRight 0.45s ease-out forwards; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.3); }
            50% { box-shadow: 0 0 20px 4px rgba(124, 58, 237, 0.15); }
        }
        .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-loading {
            background: linear-gradient(90deg, #e9e5f5 25%, #f3f0ff 50%, #e9e5f5 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* 步骤指示器连线 */
        .step-line {
            transition: background-color 0.5s ease;
        }

        /* 平台卡片 */
        .platform-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }
        .platform-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -12px rgba(124, 58, 237, 0.2);
        }

        /* 角度标签 */
        .angle-chip {
            transition: all 0.25s ease;
        }
        .angle-chip.selected {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px -2px rgba(124, 58, 237, 0.35);
        }

        /* Toast 通知 */
        .toast-enter { animation: fadeInUp 0.3s ease-out forwards; }
        .toast-leave { animation: fadeInUp 0.3s ease-in reverse forwards; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div x-data="contentMatrixApp" class="min-h-screen flex flex-col">

        <!-- 顶部导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-violet-200">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition"
                        onclick="location.href='../../index.html'">
                        <div class="w-10 h-10 bg-gradient-to-br from-violet-600 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                            <i data-lucide="layout-grid" class="text-white h-5 w-5"></i>
                        </div>
                        <div>
                            <span class="font-bold text-lg text-slate-900">内容矩阵生成器</span>
                            <span class="hidden sm:inline text-xs text-slate-500 ml-2">一键生成5大平台内容</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-violet-600 transition flex items-center gap-1 text-sm font-medium px-3 py-2 rounded-lg hover:bg-violet-50">
                            <i data-lucide="settings" class="h-4 w-4"></i>
                            <span class="hidden sm:inline">设置</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 步骤进度指示器 -->
        <div class="bg-white/60 backdrop-blur-sm border-b border-violet-100">
            <div class="max-w-3xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <template x-for="(s, idx) in steps" :key="idx">
                        <div class="flex items-center" :class="idx < steps.length - 1 ? 'flex-1' : ''">
                            <!-- 步骤圆圈 -->
                            <div class="flex flex-col items-center relative">
                                <div :class="[
                                    'w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all duration-500',
                                    currentStep > idx + 1 ? 'bg-violet-600 text-white shadow-lg shadow-violet-200' :
                                    currentStep === idx + 1 ? 'bg-gradient-to-br from-violet-600 to-purple-600 text-white shadow-lg shadow-violet-300 pulse-glow' :
                                    'bg-slate-200 text-slate-400'
                                ]">
                                    <template x-if="currentStep > idx + 1">
                                        <i data-lucide="check" class="w-5 h-5"></i>
                                    </template>
                                    <template x-if="currentStep <= idx + 1">
                                        <span x-text="idx + 1"></span>
                                    </template>
                                </div>
                                <span :class="[
                                    'text-xs mt-1.5 font-medium whitespace-nowrap transition-colors duration-300',
                                    currentStep >= idx + 1 ? 'text-violet-700' : 'text-slate-400'
                                ]" x-text="s.label"></span>
                            </div>
                            <!-- 连线 -->
                            <div x-show="idx < steps.length - 1"
                                :class="['step-line flex-1 h-0.5 mx-3 rounded-full mt-[-18px]',
                                    currentStep > idx + 1 ? 'bg-violet-500' : 'bg-slate-200']">
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="flex-grow flex items-start justify-center px-4 py-8">
            <div class="w-full max-w-5xl">

                <!-- ========== 步骤 1: 输入主题 ========== -->
                <div x-show="currentStep === 1" x-transition:enter="animate-fade-in" class="max-w-2xl mx-auto">
                    <div class="bg-white rounded-2xl shadow-xl shadow-violet-100/50 p-8 border border-violet-100">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-gradient-to-br from-violet-100 to-purple-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="lightbulb" class="w-8 h-8 text-violet-600"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-900">输入你的内容主题</h2>
                            <p class="text-slate-500 mt-2 text-sm">AI 将分析主题并为 5 大平台生成差异化内容</p>
                        </div>

                        <div class="space-y-5">
                            <!-- 核心主题 -->
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">
                                    核心主题 / 话题 <span class="text-red-500">*</span>
                                </label>
                                <textarea x-model="input.topic" rows="3"
                                    placeholder="例如：2026年春季护肤趋势、远程办公效率提升方法、新手理财入门指南..."
                                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition resize-none"></textarea>
                            </div>

                            <!-- 目标受众 -->
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">
                                    目标受众 <span class="text-red-500">*</span>
                                </label>
                                <input type="text" x-model="input.audience"
                                    placeholder="例如：25-35岁女性白领、大学生、宝妈群体..."
                                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                            </div>

                            <!-- 品牌信息（可选） -->
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">
                                    品牌/产品信息 <span class="text-xs text-slate-400 font-normal ml-1">（可选）</span>
                                </label>
                                <input type="text" x-model="input.brand"
                                    placeholder="如需植入品牌或产品，请在此描述品牌名称、产品特点..."
                                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                            </div>

                            <!-- 额外要求 -->
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">
                                    额外要求 <span class="text-xs text-slate-400 font-normal ml-1">（可选）</span>
                                </label>
                                <input type="text" x-model="input.extra"
                                    placeholder="例如：需要包含数据支撑、语气轻松幽默、避免敏感话题..."
                                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                            </div>
                        </div>

                        <button @click="goToStep2"
                            :disabled="!input.topic.trim() || !input.audience.trim()"
                            class="w-full mt-8 bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-violet-200 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-all duration-300">
                            <span>分析主题，提取角度</span>
                            <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- ========== 步骤 2: AI 分析角度 ========== -->
                <div x-show="currentStep === 2" x-transition:enter="animate-slide-in" class="max-w-2xl mx-auto">
                    <div class="bg-white rounded-2xl shadow-xl shadow-violet-100/50 p-8 border border-violet-100">

                        <!-- 加载中 -->
                        <div x-show="isAnalyzing" class="text-center py-12">
                            <div class="w-16 h-16 bg-violet-100 rounded-full flex items-center justify-center mx-auto mb-4 animate-float">
                                <i data-lucide="brain" class="w-8 h-8 text-violet-600 animate-pulse"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 mb-2">AI 正在分析主题...</h3>
                            <p class="text-sm text-slate-500">提取核心角度和卖点中</p>
                            <div class="mt-6 space-y-3 max-w-xs mx-auto">
                                <div class="h-4 shimmer-loading rounded-full"></div>
                                <div class="h-4 shimmer-loading rounded-full w-4/5"></div>
                                <div class="h-4 shimmer-loading rounded-full w-3/5"></div>
                            </div>
                        </div>

                        <!-- 角度结果 -->
                        <div x-show="!isAnalyzing && angles.length > 0">
                            <div class="text-center mb-6">
                                <div class="w-14 h-14 bg-gradient-to-br from-green-100 to-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                    <i data-lucide="sparkles" class="w-7 h-7 text-emerald-600"></i>
                                </div>
                                <h2 class="text-xl font-bold text-slate-900">AI 提取了以下内容角度</h2>
                                <p class="text-slate-500 mt-1 text-sm">选择你想使用的角度（可多选），然后生成多平台内容</p>
                            </div>

                            <div class="space-y-3 mb-6">
                                <template x-for="(angle, idx) in angles" :key="idx">
                                    <div @click="toggleAngle(idx)"
                                        :class="['angle-chip cursor-pointer p-4 rounded-xl border-2 transition-all',
                                            selectedAngles.includes(idx) ? 'selected' : 'border-slate-200 bg-slate-50 hover:border-violet-300']">
                                        <div class="flex items-start gap-3">
                                            <div :class="['w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-sm font-bold',
                                                selectedAngles.includes(idx) ? 'bg-white/20 text-white' : 'bg-violet-100 text-violet-600']">
                                                <span x-text="idx + 1"></span>
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <h4 :class="['font-bold text-sm',
                                                    selectedAngles.includes(idx) ? 'text-white' : 'text-slate-800']"
                                                    x-text="angle.title"></h4>
                                                <p :class="['text-xs mt-1',
                                                    selectedAngles.includes(idx) ? 'text-white/80' : 'text-slate-500']"
                                                    x-text="angle.description"></p>
                                                <div class="flex flex-wrap gap-1.5 mt-2">
                                                    <template x-for="kw in angle.keywords" :key="kw">
                                                        <span :class="['text-xs px-2 py-0.5 rounded-full',
                                                            selectedAngles.includes(idx) ? 'bg-white/20 text-white' : 'bg-violet-50 text-violet-600']"
                                                            x-text="kw"></span>
                                                    </template>
                                                </div>
                                            </div>
                                            <div :class="['w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 mt-0.5 transition',
                                                selectedAngles.includes(idx) ? 'border-white bg-white/20' : 'border-slate-300']">
                                                <i x-show="selectedAngles.includes(idx)" data-lucide="check" class="w-3.5 h-3.5 text-white"></i>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="flex gap-3">
                                <button @click="currentStep = 1"
                                    class="px-6 py-3 rounded-xl border-2 border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition flex items-center gap-2">
                                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                                    返回修改
                                </button>
                                <button @click="goToStep3"
                                    :disabled="selectedAngles.length === 0"
                                    class="flex-1 bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-violet-200 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-all duration-300">
                                    <span>生成 5 平台内容矩阵</span>
                                    <i data-lucide="zap" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 分析失败 -->
                        <div x-show="!isAnalyzing && analyzeError" class="text-center py-10">
                            <div class="w-14 h-14 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                <i data-lucide="alert-triangle" class="w-7 h-7 text-red-500"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 mb-1">分析失败</h3>
                            <p class="text-sm text-slate-500 mb-4" x-text="analyzeError"></p>
                            <div class="flex justify-center gap-3">
                                <button @click="currentStep = 1"
                                    class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm hover:bg-slate-50">
                                    返回修改
                                </button>
                                <button @click="goToStep2"
                                    class="px-5 py-2.5 rounded-xl bg-violet-600 text-white text-sm hover:bg-violet-700">
                                    重新分析
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ========== 步骤 3: 生成中 ========== -->
                <div x-show="currentStep === 3" x-transition:enter="animate-slide-in">
                    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl shadow-violet-100/50 p-8 border border-violet-100">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-gradient-to-br from-violet-100 to-purple-100 rounded-2xl flex items-center justify-center mx-auto mb-4 animate-float">
                                <i data-lucide="wand-2" class="w-8 h-8 text-violet-600"></i>
                            </div>
                            <h2 class="text-xl font-bold text-slate-900">正在生成内容矩阵</h2>
                            <p class="text-slate-500 mt-1 text-sm">为 5 个平台同步创作内容中...</p>
                        </div>

                        <!-- 各平台生成进度 -->
                        <div class="space-y-3">
                            <template x-for="p in platformList" :key="p.key">
                                <div class="flex items-center gap-3 p-3 rounded-xl"
                                    :class="platformResults[p.key]?.done ? 'bg-green-50' : platformResults[p.key]?.content ? 'bg-violet-50' : 'bg-slate-50'">
                                    <span class="text-xl flex-shrink-0" x-text="p.icon"></span>
                                    <div class="flex-1 min-w-0">
                                        <div class="text-sm font-medium" x-text="p.name"></div>
                                        <div class="text-xs text-slate-400" x-text="p.desc"></div>
                                    </div>
                                    <div class="flex-shrink-0">
                                        <template x-if="platformResults[p.key]?.done">
                                            <span class="text-green-600 flex items-center gap-1 text-xs font-medium">
                                                <i data-lucide="check-circle" class="w-4 h-4"></i> 完成
                                            </span>
                                        </template>
                                        <template x-if="!platformResults[p.key]?.done && platformResults[p.key]?.content">
                                            <span class="text-violet-600 flex items-center gap-1 text-xs font-medium">
                                                <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 生成中
                                            </span>
                                        </template>
                                        <template x-if="!platformResults[p.key]?.done && !platformResults[p.key]?.content">
                                            <span class="text-slate-400 text-xs">等待中</span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- 整体进度条 -->
                        <div class="mt-6">
                            <div class="flex justify-between text-xs text-slate-500 mb-1">
                                <span>总进度</span>
                                <span x-text="generationProgress + '%'"></span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                                <div class="bg-gradient-to-r from-violet-500 to-purple-500 h-2 rounded-full transition-all duration-500"
                                    :style="'width:' + generationProgress + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ========== 步骤 4: 结果矩阵 ========== -->
                <div x-show="currentStep === 4" x-transition:enter="animate-fade-in">
                    <!-- 顶部操作栏 -->
                    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">内容矩阵结果</h2>
                            <p class="text-sm text-slate-500 mt-0.5">主题：<span class="text-violet-600 font-medium" x-text="input.topic"></span></p>
                        </div>
                        <div class="flex gap-2">
                            <button @click="exportAllMarkdown"
                                class="px-4 py-2 rounded-lg bg-white border border-violet-200 text-violet-700 text-sm font-medium hover:bg-violet-50 transition flex items-center gap-1.5">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                导出 Markdown
                            </button>
                            <button @click="resetAll"
                                class="px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 transition flex items-center gap-1.5">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                重新开始
                            </button>
                        </div>
                    </div>

                    <!-- 平台内容网格 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        <template x-for="(p, idx) in platformList" :key="p.key">
                            <div class="platform-card bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden"
                                :style="'animation-delay:' + (idx * 80) + 'ms'" :class="'animate-fade-in'">
                                <!-- 平台头部 -->
                                <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between"
                                    :style="'background: linear-gradient(135deg, ' + p.bgFrom + ', ' + p.bgTo + ')'">
                                    <div class="flex items-center gap-2">
                                        <span class="text-xl" x-text="p.icon"></span>
                                        <span class="font-bold text-sm" :style="'color:' + p.textColor" x-text="p.name"></span>
                                    </div>
                                    <span class="text-xs px-2 py-0.5 rounded-full" :style="'background:' + p.badgeBg + ';color:' + p.textColor"
                                        x-text="p.wordCount"></span>
                                </div>

                                <!-- 内容区 -->
                                <div class="p-5 space-y-3">
                                    <!-- 标题 -->
                                    <div x-show="platformResults[p.key]?.title">
                                        <div class="text-xs text-slate-400 mb-1">标题</div>
                                        <div class="font-bold text-sm text-slate-900 leading-relaxed"
                                            x-text="platformResults[p.key]?.title"></div>
                                    </div>

                                    <!-- 正文 -->
                                    <div>
                                        <div class="text-xs text-slate-400 mb-1">正文</div>
                                        <div class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap max-h-48 overflow-y-auto"
                                            x-text="platformResults[p.key]?.content || '生成失败'"></div>
                                    </div>

                                    <!-- 标签 -->
                                    <div x-show="platformResults[p.key]?.hashtags">
                                        <div class="text-xs text-slate-400 mb-1">标签</div>
                                        <div class="text-xs text-violet-600 leading-relaxed"
                                            x-text="platformResults[p.key]?.hashtags"></div>
                                    </div>
                                </div>

                                <!-- 操作栏 -->
                                <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center gap-2">
                                    <button @click="copyPlatformContent(p.key)"
                                        class="flex-1 text-xs py-2 rounded-lg bg-white border border-slate-200 text-slate-600 hover:border-violet-300 hover:text-violet-600 transition flex items-center justify-center gap-1">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                        复制
                                    </button>
                                    <button @click="regeneratePlatform(p.key)"
                                        :disabled="isRegenerating === p.key"
                                        class="flex-1 text-xs py-2 rounded-lg bg-white border border-slate-200 text-slate-600 hover:border-violet-300 hover:text-violet-600 transition flex items-center justify-center gap-1 disabled:opacity-50">
                                        <i :data-lucide="isRegenerating === p.key ? 'loader-2' : 'refresh-cw'"
                                            :class="isRegenerating === p.key ? 'w-3.5 h-3.5 animate-spin' : 'w-3.5 h-3.5'"></i>
                                        重新生成
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </div>

        <!-- ========== 设置弹窗 ========== -->
        <div x-show="showSettings" x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
            class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4"
            @click.self="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-fade-in">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="settings" class="w-5 h-5 text-violet-600"></i>
                        API 配置
                    </h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600 transition">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" x-model="apiConfig.deepseek" placeholder="sk-..."
                            class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">模型选择</label>
                        <select x-model="apiConfig.model"
                            class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="px-4 py-2.5 rounded-xl hover:bg-slate-100 text-slate-600 text-sm font-medium transition">
                        取消
                    </button>
                    <button @click="saveConfig"
                        class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 text-white text-sm font-bold hover:from-violet-700 hover:to-purple-700 shadow-lg shadow-violet-200 transition">
                        保存
                    </button>
                </div>
            </div>
        </div>

        <!-- ========== Toast 通知 ========== -->
        <div x-show="toast.show" x-transition:enter="toast-enter" x-transition:leave="toast-leave"
            class="fixed bottom-6 right-6 z-[200] bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm">
            <i :data-lucide="toast.icon" class="w-4 h-4"></i>
            <span x-text="toast.message"></span>
        </div>

    </div>

    <script>
        /**
         * 内容矩阵生成器 - Alpine.js 应用
         * 功能：一个主题，生成 5 大平台差异化内容
         * 步骤：输入主题 → AI 提取角度 → 批量生成 → 矩阵展示
         */
        document.addEventListener('alpine:init', () => {
            Alpine.data('contentMatrixApp', () => ({
                /* ============ 基础状态 ============ */
                currentStep: 1,
                showSettings: false,
                toast: { show: false, message: '', icon: 'check-circle' },

                /* ============ 步骤配置 ============ */
                steps: [
                    { label: '输入主题' },
                    { label: '选择角度' },
                    { label: '生成内容' },
                    { label: '查看结果' }
                ],

                /* ============ 用户输入 ============ */
                input: {
                    topic: '',
                    audience: '',
                    brand: '',
                    extra: ''
                },

                /* ============ API 配置 ============ */
                apiConfig: {
                    deepseek: '',
                    model: 'deepseek-v4-flash'
                },

                /* ============ 步骤 2: 角度分析 ============ */
                isAnalyzing: false,
                analyzeError: '',
                angles: [],
                selectedAngles: [],

                /* ============ 步骤 3/4: 生成结果 ============ */
                platformResults: {},
                isRegenerating: null,

                /* ============ 5 大平台配置 ============ */
                platformList: [
                    {
                        key: 'xiaohongshu', name: '小红书', icon: '📕',
                        desc: '100-200字 · Emoji丰富 · 话题标签',
                        wordCount: '100-200字',
                        bgFrom: '#fff1f2', bgTo: '#ffe4e6', textColor: '#be123c', badgeBg: '#fecdd3',
                        prompt: `你是小红书爆款写手。请为以下主题撰写一篇小红书笔记。
要求：
- 字数：100-200字
- 大量使用emoji（每句话至少1个）
- 语气轻松亲切，像和闺蜜聊天
- 开头用吸引眼球的hook句
- 结尾引导互动（点赞/收藏/评论）
- 生成5-8个相关话题标签（#开头）
- 标题要有吸引力，可用数字或设问句`
                    },
                    {
                        key: 'gongzhonghao', name: '公众号', icon: '💚',
                        desc: '300-500字 · 专业深度 · 结构分明',
                        wordCount: '300-500字',
                        bgFrom: '#f0fdf4', bgTo: '#dcfce7', textColor: '#15803d', badgeBg: '#bbf7d0',
                        prompt: `你是微信公众号资深编辑。请为以下主题撰写一篇公众号文章。
要求：
- 字数：300-500字
- 结构清晰，使用小标题分段
- 语气专业权威但不生硬
- 有数据或案例支撑观点
- 开头抛出痛点或共鸣
- 结尾总结要点并引导关注
- 适度使用加粗强调重点
- 生成一个吸引打开的标题`
                    },
                    {
                        key: 'douyin', name: '抖音', icon: '🎵',
                        desc: '50-80字 · 钩子驱动 · 行动号召',
                        wordCount: '50-80字',
                        bgFrom: '#faf5ff', bgTo: '#f3e8ff', textColor: '#7e22ce', badgeBg: '#e9d5ff',
                        prompt: `你是抖音短视频脚本策划师。请为以下主题撰写一段抖音文案。
要求：
- 字数：50-80字（简短有力）
- 开头3秒必须有强力钩子（反常识/设问/痛点）
- 口语化表达，不要书面语
- 结尾用行动号召（关注/点赞/评论互动）
- 加入2-3个热门话题标签
- 生成一个短视频标题（15字以内）
- 风格要有节奏感，适合口播`
                    },
                    {
                        key: 'zhihu', name: '知乎', icon: '🔵',
                        desc: '200-400字 · 深度分析 · 有理有据',
                        wordCount: '200-400字',
                        bgFrom: '#eff6ff', bgTo: '#dbeafe', textColor: '#1d4ed8', badgeBg: '#bfdbfe',
                        prompt: `你是知乎高赞答主。请为以下主题撰写一个知乎风格的回答。
要求：
- 字数：200-400字
- 用专业、理性的分析视角
- 逻辑清晰，分点论述
- 引用数据、研究或专业术语增加可信度
- 先亮观点，再展开论证
- 语气克制但有洞见，避免鸡汤
- 适当加入个人经验或行业观察
- 生成一个引发思考的标题`
                    },
                    {
                        key: 'weibo', name: '微博', icon: '🟡',
                        desc: '100-140字 · 热搜风格 · 话题互动',
                        wordCount: '100-140字',
                        bgFrom: '#fefce8', bgTo: '#fef9c3', textColor: '#a16207', badgeBg: '#fef08a',
                        prompt: `你是微博话题营销达人。请为以下主题撰写一条微博。
要求：
- 字数：100-140字（微博字数限制）
- 像在发朋友圈一样自然
- 融入当下热点或流行语
- 用话题标签引流（#话题#格式）
- 可以带一点段子手风格或情绪共鸣
- 结尾可用投票/提问引导互动
- 生成一个适合微博传播的标题`
                    }
                ],

                /* ============ 初始化 ============ */
                init() {
                    this.loadConfig();
                    this.initPlatformResults();
                    this.refreshIcons();
                },

                /**
                 * 初始化各平台结果对象
                 */
                initPlatformResults() {
                    const results = {};
                    this.platformList.forEach(p => {
                        results[p.key] = { title: '', content: '', hashtags: '', done: false };
                    });
                    this.platformResults = results;
                },

                /**
                 * 从 localStorage 加载 API 配置（合并策略）
                 */
                loadConfig() {
                    try {
                        const saved = localStorage.getItem('global_llm_config');
                        if (saved) {
                            const parsed = JSON.parse(saved);
                            this.apiConfig = { ...this.apiConfig, ...parsed };
                        }
                    } catch (e) {
                        console.warn('[ContentMatrix] 加载配置失败:', e);
                    }
                },

                /**
                 * 保存 API 配置到 localStorage（合并策略，不覆盖其他工具的配置）
                 */
                saveConfig() {
                    try {
                        const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                        localStorage.setItem('global_llm_config', JSON.stringify({
                            ...current,
                            deepseek: this.apiConfig.deepseek,
                            model: this.apiConfig.model
                        }));
                        this.showSettings = false;
                        this.showToast('配置已保存', 'check-circle');
                    } catch (e) {
                        this.showToast('保存失败', 'alert-circle');
                    }
                },

                /**
                 * 刷新 Lucide 图标（DOM 更新后调用）
                 */
                refreshIcons() {
                    setTimeout(() => {
                        try { lucide.createIcons(); } catch (e) {}
                    }, 50);
                },

                /**
                 * 显示 Toast 通知
                 */
                showToast(message, icon = 'check-circle') {
                    this.toast = { show: true, message, icon };
                    this.refreshIcons();
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                /**
                 * 计算当前生成进度百分比
                 */
                get generationProgress() {
                    const total = this.platformList.length;
                    let done = 0;
                    this.platformList.forEach(p => {
                        if (this.platformResults[p.key]?.done) done++;
                    });
                    return Math.round((done / total) * 100);
                },

                /* ============ 步骤 1 → 步骤 2：分析主题 ============ */
                async goToStep2() {
                    if (!this.apiConfig.deepseek) {
                        this.showSettings = true;
                        this.showToast('请先配置 API Key', 'alert-circle');
                        return;
                    }

                    this.currentStep = 2;
                    this.isAnalyzing = true;
                    this.analyzeError = '';
                    this.angles = [];
                    this.selectedAngles = [];
                    this.refreshIcons();

                    const systemPrompt = `你是一位资深内容策略专家。分析用户给出的主题，提取3-5个独特的内容角度/卖点，这些角度将被适配到不同社交媒体平台。

请严格输出以下JSON格式（不要输出其他任何内容）：
{
  "angles": [
    {
      "title": "角度标题（4-8字）",
      "description": "该角度的简要描述（15-30字）",
      "keywords": ["关键词1", "关键词2", "关键词3"]
    }
  ]
}`;

                    const userPrompt = `主题：${this.input.topic}
目标受众：${this.input.audience}
${this.input.brand ? '品牌/产品信息：' + this.input.brand : ''}
${this.input.extra ? '额外要求：' + this.input.extra : ''}

请为以上主题提取3-5个可用于多平台内容创作的核心角度。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                temperature: 0.7,
                                response_format: { type: 'json_object' }
                            })
                        });

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(errData.error?.message || `API 请求失败 (${response.status})`);
                        }

                        const data = await response.json();
                        let text = data.choices?.[0]?.message?.content || '';

                        const parsed = this.safeParseJSON(text);
                        if (!parsed || !parsed.angles || parsed.angles.length === 0) {
                            throw new Error('AI 返回格式错误，请重试');
                        }

                        this.angles = parsed.angles;
                        this.selectedAngles = parsed.angles.map((_, i) => i);
                    } catch (error) {
                        console.error('[ContentMatrix] 分析失败:', error);
                        this.analyzeError = error.message || '分析失败，请检查网络和 API Key';
                    } finally {
                        this.isAnalyzing = false;
                        this.refreshIcons();
                    }
                },

                /**
                 * 切换角度选择
                 */
                toggleAngle(idx) {
                    const pos = this.selectedAngles.indexOf(idx);
                    if (pos > -1) {
                        this.selectedAngles.splice(pos, 1);
                    } else {
                        this.selectedAngles.push(idx);
                    }
                    this.refreshIcons();
                },

                /* ============ 步骤 2 → 步骤 3：生成内容 ============ */
                async goToStep3() {
                    this.currentStep = 3;
                    this.initPlatformResults();
                    this.refreshIcons();

                    const chosenAngles = this.selectedAngles.map(i => this.angles[i]);
                    const anglesText = chosenAngles.map((a, i) =>
                        `${i + 1}. ${a.title}：${a.description}（关键词：${a.keywords.join('、')}）`
                    ).join('\n');

                    const contextBlock = `
【主题】${this.input.topic}
【目标受众】${this.input.audience}
${this.input.brand ? '【品牌信息】' + this.input.brand : ''}
${this.input.extra ? '【额外要求】' + this.input.extra : ''}

【内容角度】
${anglesText}`;

                    const generatePromises = this.platformList.map(platform =>
                        this.generateForPlatform(platform, contextBlock)
                    );

                    await Promise.allSettled(generatePromises);

                    this.currentStep = 4;
                    this.refreshIcons();
                },

                /**
                 * 为单个平台生成内容（流式）
                 * @param {object} platform - 平台配置对象
                 * @param {string} context - 主题和角度的上下文信息
                 */
                async generateForPlatform(platform, context) {
                    const systemPrompt = `${platform.prompt}

请严格按以下JSON格式输出（不要输出其他内容）：
{
  "title": "内容标题",
  "content": "正文内容",
  "hashtags": "相关话题标签（用空格分隔）"
}`;

                    const userPrompt = `请根据以下信息为${platform.name}平台创作一篇内容：
${context}`;

                    try {
                        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                temperature: 0.8,
                                stream: true
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`API 错误 (${response.status})`);
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        let fullText = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.slice(6).trim();
                                    if (data === '[DONE]') continue;
                                    try {
                                        const parsed = JSON.parse(data);
                                        const delta = parsed.choices?.[0]?.delta;
                                        if (delta?.content) {
                                            fullText += delta.content;
                                            this.platformResults[platform.key] = {
                                                ...this.platformResults[platform.key],
                                                content: fullText.slice(0, 80) + '...',
                                                done: false
                                            };
                                        }
                                    } catch (e) {}
                                }
                            }
                        }

                        const parsed = this.safeParseJSON(fullText);
                        if (parsed && parsed.content) {
                            this.platformResults[platform.key] = {
                                title: parsed.title || '',
                                content: parsed.content || '',
                                hashtags: parsed.hashtags || '',
                                done: true
                            };
                        } else {
                            this.platformResults[platform.key] = {
                                title: '',
                                content: fullText || '生成失败，请重试',
                                hashtags: '',
                                done: true
                            };
                        }
                    } catch (error) {
                        console.error(`[ContentMatrix] ${platform.name} 生成失败:`, error);
                        this.platformResults[platform.key] = {
                            title: '',
                            content: `生成失败: ${error.message}`,
                            hashtags: '',
                            done: true
                        };
                    }
                    this.refreshIcons();
                },

                /* ============ 步骤 4: 结果操作 ============ */

                /**
                 * 复制单个平台的内容
                 */
                copyPlatformContent(key) {
                    const result = this.platformResults[key];
                    if (!result) return;
                    const platform = this.platformList.find(p => p.key === key);
                    let text = '';
                    if (result.title) text += result.title + '\n\n';
                    text += result.content;
                    if (result.hashtags) text += '\n\n' + result.hashtags;
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast(`已复制${platform?.name || ''}内容`, 'copy');
                    }).catch(() => {
                        this.showToast('复制失败', 'alert-circle');
                    });
                },

                /**
                 * 重新生成单个平台内容
                 */
                async regeneratePlatform(key) {
                    if (this.isRegenerating) return;
                    this.isRegenerating = key;
                    this.refreshIcons();

                    const platform = this.platformList.find(p => p.key === key);
                    if (!platform) { this.isRegenerating = null; return; }

                    const chosenAngles = this.selectedAngles.map(i => this.angles[i]);
                    const anglesText = chosenAngles.map((a, i) =>
                        `${i + 1}. ${a.title}：${a.description}（关键词：${a.keywords.join('、')}）`
                    ).join('\n');
                    const contextBlock = `
【主题】${this.input.topic}
【目标受众】${this.input.audience}
${this.input.brand ? '【品牌信息】' + this.input.brand : ''}
${this.input.extra ? '【额外要求】' + this.input.extra : ''}

【内容角度】
${anglesText}`;

                    this.platformResults[key] = { title: '', content: '', hashtags: '', done: false };
                    await this.generateForPlatform(platform, contextBlock);
                    this.isRegenerating = null;
                    this.refreshIcons();
                    this.showToast(`${platform.name}内容已重新生成`, 'check-circle');
                },

                /**
                 * 导出全部平台内容为 Markdown 文件
                 */
                exportAllMarkdown() {
                    let md = `# 内容矩阵 - ${this.input.topic}\n\n`;
                    md += `> 生成时间: ${new Date().toLocaleString()}\n`;
                    md += `> 目标受众: ${this.input.audience}\n`;
                    if (this.input.brand) md += `> 品牌信息: ${this.input.brand}\n`;
                    md += '\n---\n\n';

                    if (this.angles.length > 0) {
                        md += `## 内容角度\n\n`;
                        const chosenAngles = this.selectedAngles.map(i => this.angles[i]);
                        chosenAngles.forEach((a, i) => {
                            md += `${i + 1}. **${a.title}** - ${a.description}\n`;
                            md += `   关键词: ${a.keywords.join('、')}\n\n`;
                        });
                        md += '---\n\n';
                    }

                    this.platformList.forEach(p => {
                        const r = this.platformResults[p.key];
                        md += `## ${p.icon} ${p.name}（${p.wordCount}）\n\n`;
                        if (r?.title) md += `**${r.title}**\n\n`;
                        md += `${r?.content || '未生成'}\n\n`;
                        if (r?.hashtags) md += `${r.hashtags}\n\n`;
                        md += '---\n\n';
                    });

                    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const safeTitle = this.input.topic.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '_').slice(0, 30);
                    a.download = `内容矩阵_${safeTitle}_${new Date().toISOString().slice(0, 10)}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    this.showToast('Markdown 已导出', 'download');
                },

                /**
                 * 重置所有状态，回到步骤 1
                 */
                resetAll() {
                    this.currentStep = 1;
                    this.input = { topic: '', audience: '', brand: '', extra: '' };
                    this.angles = [];
                    this.selectedAngles = [];
                    this.analyzeError = '';
                    this.initPlatformResults();
                    this.refreshIcons();
                },

                /**
                 * 安全解析 JSON - 处理 AI 返回中常见的格式问题
                 * @param {string} str - 需要解析的 JSON 字符串
                 * @returns {object|null} 解析结果，失败返回 null
                 */
                safeParseJSON(str) {
                    if (!str) return null;
                    try {
                        return JSON.parse(str);
                    } catch (e) {
                        try {
                            const match = str.match(/\{[\s\S]*\}/);
                            if (match) return JSON.parse(match[0]);
                        } catch (e2) {}

                        try {
                            let fixed = str.replace(/,\s*([\]}])/g, '$1');
                            fixed = fixed.replace(/```json\s*/g, '').replace(/```\s*/g, '');
                            const match2 = fixed.match(/\{[\s\S]*\}/);
                            if (match2) return JSON.parse(match2[0]);
                        } catch (e3) {}

                        console.warn('[ContentMatrix] JSON解析最终失败:', e.message);
                        return null;
                    }
                }
            }));
        });
    </script>
