<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML 可视化编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .editor-textarea {
            font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace;
        }

        .resize-handle {
            cursor: col-resize;
        }

        .preview-frame {
            background: #fff;
        }

        .toast {
            animation: toast-in 0.2s ease-out;
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="bg-slate-50 text-slate-800">
    <div class="min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center">
                        <i class="fa-solid fa-table-columns w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg">HTML 可视化编辑器</h1>
                        <p class="text-xs text-slate-500">上传、编辑、预览与保存 HTML 文件</p>
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="openFileBtn"
                        class="px-3 py-2 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 text-sm font-medium flex items-center gap-2">
                        <i class="fa-solid fa-folder-open w-4 h-4"></i>
                        打开 HTML
                    </button>
                    <button id="loadSampleBtn"
                        class="px-3 py-2 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 text-sm font-medium flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles w-4 h-4"></i>
                        加载示例
                    </button>
                    <button id="saveBtn"
                        class="px-3 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 text-sm font-medium flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk w-4 h-4"></i>
                        保存覆盖
                    </button>
                    <button id="saveAsBtn"
                        class="px-3 py-2 rounded-lg bg-slate-900 text-white hover:bg-slate-800 text-sm font-medium flex items-center gap-2">
                        <i class="fa-solid fa-download w-4 h-4"></i>
                        另存为
                    </button>
                    <a href="../../index.html"
                        class="px-3 py-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 text-sm font-medium flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left w-4 h-4"></i>
                        返回首页
                    </a>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
            <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)] gap-6">
                <section class="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col min-h-[70vh]">
                    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200">
                        <div>
                            <h2 class="font-semibold text-slate-800">HTML 代码</h2>
                            <p class="text-xs text-slate-500">左侧编辑，右侧实时预览</p>
                        </div>
                        <div class="text-xs text-slate-500 flex items-center gap-2">
                            <i class="fa-solid fa-circle-info w-4 h-4"></i>
                            支持实时渲染与元素点击编辑
                        </div>
                    </div>
                    <div class="flex-1 p-4">
                        <textarea id="codeEditor" spellcheck="false"
                            class="editor-textarea w-full h-full min-h-[60vh] resize-none focus:outline-none text-sm leading-relaxed text-slate-700"
                            placeholder="在这里输入 HTML，右侧会实时预览。"></textarea>
                    </div>
                </section>

                <section class="flex flex-col gap-4">
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm flex-1 flex flex-col">
                        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200">
                            <div>
                                <h2 class="font-semibold text-slate-800">实时预览</h2>
                                <p class="text-xs text-slate-500">点击元素即可选择并编辑</p>
                            </div>
                            <div class="text-xs text-slate-500 flex items-center gap-2">
                                <span id="selectedTag" class="px-2 py-1 bg-slate-100 rounded-md">未选择</span>
                            </div>
                        </div>
                        <div class="flex-1 p-3 bg-slate-50">
                            <iframe id="previewFrame" class="preview-frame w-full h-[60vh] rounded-xl border border-slate-200"></iframe>
                        </div>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
                        <h3 class="font-semibold text-slate-800 mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-sliders w-4 h-4 text-blue-600"></i>
                            元素属性编辑
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="sm:col-span-2">
                                <label class="text-xs text-slate-500">文本内容</label>
                                <textarea id="textInput"
                                    class="mt-1 w-full rounded-lg border border-slate-200 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"
                                    rows="2" placeholder="选择元素后可编辑文字"></textarea>
                            </div>
                            <div>
                                <label class="text-xs text-slate-500">文字颜色</label>
                                <div class="mt-1 flex items-center gap-2">
                                    <input id="colorInput" type="color" class="h-9 w-10 border border-slate-200 rounded" />
                                    <input id="colorText" type="text"
                                        class="flex-1 rounded-lg border border-slate-200 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"
                                        placeholder="#000000" />
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-slate-500">背景颜色</label>
                                <div class="mt-1 flex items-center gap-2">
                                    <input id="bgInput" type="color" class="h-9 w-10 border border-slate-200 rounded" />
                                    <input id="bgText" type="text"
                                        class="flex-1 rounded-lg border border-slate-200 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"
                                        placeholder="transparent" />
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-slate-500">字体大小 (px)</label>
                                <input id="fontSizeInput" type="number" min="8" max="96"
                                    class="mt-1 w-full rounded-lg border border-slate-200 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"
                                    placeholder="16" />
                            </div>
                            <div>
                                <label class="text-xs text-slate-500">字重</label>
                                <select id="fontWeightInput"
                                    class="mt-1 w-full rounded-lg border border-slate-200 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200">
                                    <option value="">默认</option>
                                    <option value="300">细体 300</option>
                                    <option value="400">常规 400</option>
                                    <option value="500">中等 500</option>
                                    <option value="600">半粗 600</option>
                                    <option value="700">粗体 700</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4 flex flex-wrap gap-2">
                            <button id="clearSelectionBtn"
                                class="px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-100">
                                取消选择
                            </button>
                            <button id="syncFromPreviewBtn"
                                class="px-3 py-2 rounded-lg bg-slate-900 text-white text-sm hover:bg-slate-800">
                                从预览刷新代码
                            </button>
                        </div>
                        <p class="mt-3 text-xs text-slate-500">提示：点击右侧预览区域中的元素，然后在这里修改文本、颜色、字号等。</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <input id="fileInput" type="file" accept=".html,.htm,text/html" class="hidden" />
    <div id="toastContainer" class="fixed bottom-6 right-6 space-y-2 z-50"></div>

    <script>
        const codeEditor = document.getElementById("codeEditor");
        const previewFrame = document.getElementById("previewFrame");
        const openFileBtn = document.getElementById("openFileBtn");
        const saveBtn = document.getElementById("saveBtn");
        const saveAsBtn = document.getElementById("saveAsBtn");
        const loadSampleBtn = document.getElementById("loadSampleBtn");
        const fileInput = document.getElementById("fileInput");
        const toastContainer = document.getElementById("toastContainer");
        const selectedTag = document.getElementById("selectedTag");
        const textInput = document.getElementById("textInput");
        const colorInput = document.getElementById("colorInput");
        const colorText = document.getElementById("colorText");
        const bgInput = document.getElementById("bgInput");
        const bgText = document.getElementById("bgText");
        const fontSizeInput = document.getElementById("fontSizeInput");
        const fontWeightInput = document.getElementById("fontWeightInput");
        const clearSelectionBtn = document.getElementById("clearSelectionBtn");
        const syncFromPreviewBtn = document.getElementById("syncFromPreviewBtn");

        let debounceTimer;
        let syncTimer;
        let selectedElement = null;
        let fileHandle = null;
        let isSyncingFromPreview = false;

        const sampleHtml = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>示例页面</title>
  <style>
    body { font-family: "Noto Sans SC", sans-serif; margin: 0; background: #f8fafc; color: #1f2937; }
    header { background: linear-gradient(135deg, #2563eb, #60a5fa); color: white; padding: 40px; text-align: center; }
    main { max-width: 900px; margin: 0 auto; padding: 32px; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 16px 30px rgba(15, 23, 42, 0.08); }
    .pill { display: inline-block; padding: 6px 12px; border-radius: 999px; background: #e0f2fe; color: #0369a1; margin-right: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>可视化 HTML 编辑</h1>
    <p>点击页面元素，然后在右侧修改文字、颜色与字号。</p>
  </header>
  <main>
    <div class="card">
      <span class="pill">实时预览</span>
      <span class="pill">点击编辑</span>
      <h2>欢迎来到 HTML 预览编辑器</h2>
      <p>在左侧修改代码，右侧立即更新；也可以直接点选元素进行可视化调整。</p>
    </div>
  </main>
</body>
</html>`;

        const showToast = (message, type = "info") => {
            const toast = document.createElement("div");
            const colors = {
                info: "bg-slate-900 text-white",
                success: "bg-emerald-600 text-white",
                warn: "bg-amber-500 text-white",
                error: "bg-red-600 text-white"
            };
            toast.className = `toast px-4 py-3 rounded-lg shadow-lg text-sm ${colors[type] || colors.info}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("opacity-0", "transition");
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        };

        const updatePreviewFromEditor = () => {
            if (isSyncingFromPreview) {
                return;
            }
            const html = codeEditor.value.trim();
            previewFrame.srcdoc = html || "<!DOCTYPE html><html><body><p style='padding:16px;color:#94a3b8;'>暂无内容</p></body></html>";
        };

        const updateEditorFromPreview = () => {
            const doc = previewFrame.contentDocument;
            if (!doc) {
                return;
            }
            const serialized = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
            isSyncingFromPreview = true;
            codeEditor.value = serialized;
            isSyncingFromPreview = false;
        };

        const attachPreviewListeners = () => {
            const doc = previewFrame.contentDocument;
            if (!doc) {
                return;
            }
            const existingStyle = doc.getElementById("editor-highlight-style");
            if (!existingStyle) {
                const style = doc.createElement("style");
                style.id = "editor-highlight-style";
                style.textContent = ".__selected_outline { outline: 2px solid #3b82f6 !important; outline-offset: 2px; }";
                doc.head.appendChild(style);
            }

            doc.addEventListener("click", (event) => {
                event.preventDefault();
                event.stopPropagation();
                const target = event.target;
                if (!(target instanceof Element) || target.tagName === "HTML" || target.tagName === "BODY") {
                    return;
                }
                selectElement(target);
            });
        };

        const selectElement = (element) => {
            if (selectedElement) {
                selectedElement.classList.remove("__selected_outline");
            }
            selectedElement = element;
            selectedElement.classList.add("__selected_outline");
            selectedTag.textContent = `<${selectedElement.tagName.toLowerCase()}>`;
            textInput.value = selectedElement.textContent.trim();
            const style = previewFrame.contentWindow.getComputedStyle(selectedElement);
            const color = style.color;
            const bgColor = style.backgroundColor;
            const fontSize = parseInt(style.fontSize, 10);
            colorText.value = rgbToHex(color) || "";
            colorInput.value = rgbToHex(color) || "#000000";
            bgText.value = rgbToHex(bgColor) || "transparent";
            bgInput.value = rgbToHex(bgColor) || "#ffffff";
            fontSizeInput.value = Number.isFinite(fontSize) ? fontSize : "";
            fontWeightInput.value = style.fontWeight || "";
        };

        const clearSelection = () => {
            if (selectedElement) {
                selectedElement.classList.remove("__selected_outline");
            }
            selectedElement = null;
            selectedTag.textContent = "未选择";
            textInput.value = "";
            colorText.value = "";
            bgText.value = "";
            fontSizeInput.value = "";
            fontWeightInput.value = "";
        };

        const rgbToHex = (rgb) => {
            const match = rgb.match(/\d+/g);
            if (!match || match.length < 3) {
                return "";
            }
            const hex = match.slice(0, 3).map((value) => {
                const hexVal = parseInt(value, 10).toString(16).padStart(2, "0");
                return hexVal;
            }).join("");
            return `#${hex}`;
        };

        const scheduleSyncFromPreview = () => {
            clearTimeout(syncTimer);
            syncTimer = setTimeout(() => {
                updateEditorFromPreview();
            }, 200);
        };

        const applyTextChange = () => {
            if (!selectedElement) {
                return;
            }
            selectedElement.textContent = textInput.value;
            scheduleSyncFromPreview();
        };

        const applyStyleChange = () => {
            if (!selectedElement) {
                return;
            }
            if (colorText.value) {
                selectedElement.style.color = colorText.value;
            }
            if (bgText.value) {
                selectedElement.style.backgroundColor = bgText.value;
            }
            if (fontSizeInput.value) {
                selectedElement.style.fontSize = `${fontSizeInput.value}px`;
            }
            if (fontWeightInput.value) {
                selectedElement.style.fontWeight = fontWeightInput.value;
            }
            scheduleSyncFromPreview();
        };

        codeEditor.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePreviewFromEditor, 400);
        });

        previewFrame.addEventListener("load", attachPreviewListeners);

        textInput.addEventListener("input", () => {
            applyTextChange();
        });

        [colorInput, colorText].forEach((input) => {
            input.addEventListener("input", () => {
                if (input === colorInput) {
                    colorText.value = colorInput.value;
                }
                applyStyleChange();
            });
        });

        [bgInput, bgText].forEach((input) => {
            input.addEventListener("input", () => {
                if (input === bgInput) {
                    bgText.value = bgInput.value;
                }
                applyStyleChange();
            });
        });

        fontSizeInput.addEventListener("input", applyStyleChange);
        fontWeightInput.addEventListener("change", applyStyleChange);

        clearSelectionBtn.addEventListener("click", () => {
            clearSelection();
        });

        syncFromPreviewBtn.addEventListener("click", () => {
            updateEditorFromPreview();
            showToast("已从预览刷新代码。", "success");
        });

        loadSampleBtn.addEventListener("click", () => {
            codeEditor.value = sampleHtml;
            updatePreviewFromEditor();
            showToast("已加载示例 HTML。", "success");
        });

        openFileBtn.addEventListener("click", async () => {
            if (window.showOpenFilePicker) {
                const [handle] = await window.showOpenFilePicker({
                    types: [{ description: "HTML 文件", accept: { "text/html": [".html", ".htm"] } }]
                });
                if (handle) {
                    fileHandle = handle;
                    const file = await handle.getFile();
                    codeEditor.value = await file.text();
                    updatePreviewFromEditor();
                    showToast(`已打开 ${file.name}`, "success");
                }
                return;
            }
            fileInput.click();
        });

        fileInput.addEventListener("change", async (event) => {
            const file = event.target.files[0];
            if (!file) {
                return;
            }
            fileHandle = null;
            const content = await file.text();
            codeEditor.value = content;
            updatePreviewFromEditor();
            showToast(`已加载 ${file.name}`, "success");
        });

        saveBtn.addEventListener("click", async () => {
            if (!fileHandle) {
                showToast("当前未绑定文件，请使用“另存为”。", "warn");
                return;
            }
            const writable = await fileHandle.createWritable();
            await writable.write(codeEditor.value);
            await writable.close();
            showToast("已覆盖保存。", "success");
        });

        saveAsBtn.addEventListener("click", async () => {
            const htmlContent = codeEditor.value || sampleHtml;
            if (window.showSaveFilePicker) {
                const handle = await window.showSaveFilePicker({
                    suggestedName: "edited.html",
                    types: [{ description: "HTML 文件", accept: { "text/html": [".html"] } }]
                });
                const writable = await handle.createWritable();
                await writable.write(htmlContent);
                await writable.close();
                showToast("另存为成功。", "success");
                return;
            }
            const blob = new Blob([htmlContent], { type: "text/html" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "edited.html";
            link.click();
            URL.revokeObjectURL(link.href);
            showToast("已生成下载文件。", "success");
        });

        codeEditor.value = sampleHtml;
        updatePreviewFromEditor();

    </script>

<script src="../../help/help-widget-v2.js"></script>

</body>

</html>
