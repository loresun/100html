<!DOCTYPE html>
<html lang="zh-CN">

<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M09H8GY78X"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程大纲编排器 - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #f0fdfa 100%);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #059669; border-radius: 3px; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.4s ease-out forwards; }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }
        .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-slow { animation: spin-slow 2s linear infinite; }

        .module-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .module-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px -10px rgba(5, 150, 105, 0.2);
            border-color: #a7f3d0;
        }

        .step-connector {
            background: linear-gradient(90deg, #059669, #10b981);
            height: 3px;
            transition: width 0.5s ease;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .accordion-content.open {
            max-height: 5000px;
        }

        .toast-enter {
            animation: fadeInUp 0.3s ease-out;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .tag-chip {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }
    </style>

    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#059669',
                    'primary-light': '#10b981',
                    'primary-dark': '#047857',
                }
            }
        }
    }
    </script>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body>
<div x-data="courseOutlineApp()" x-init="init()" class="min-h-screen">

    <!-- 导航栏 -->
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-emerald-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                <i data-lucide="book-open" class="text-primary h-6 w-6"></i>
                <span class="font-bold text-xl text-slate-900">课程大纲编排器</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="hidden sm:inline text-xs text-slate-400">教育培训 · 多步编排</span>
                <button @click="showSettings = true"
                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-emerald-50 text-slate-600 transition-colors text-sm">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">设置</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- 步骤进度条 -->
        <div class="mb-10">
            <div class="flex items-center justify-between max-w-2xl mx-auto">
                <template x-for="(s, idx) in steps" :key="idx">
                    <div class="flex items-center" :class="idx < steps.length - 1 ? 'flex-1' : ''">
                        <div class="flex flex-col items-center relative">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all duration-300"
                                :class="currentStep > idx + 1 ? 'bg-primary text-white shadow-lg shadow-emerald-200' :
                                         currentStep === idx + 1 ? 'bg-primary text-white shadow-lg shadow-emerald-200 ring-4 ring-emerald-100' :
                                         'bg-white text-slate-400 border-2 border-slate-200'"
                                x-text="currentStep > idx + 1 ? '✓' : idx + 1">
                            </div>
                            <span class="absolute -bottom-6 whitespace-nowrap text-xs font-medium"
                                :class="currentStep >= idx + 1 ? 'text-primary' : 'text-slate-400'"
                                x-text="s"></span>
                        </div>
                        <div x-show="idx < steps.length - 1"
                            class="flex-1 h-1 mx-3 rounded-full bg-slate-200 overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-500"
                                :class="currentStep > idx + 1 ? 'bg-primary w-full' : 'bg-slate-200 w-0'"
                                :style="currentStep === idx + 2 ? 'width: 50%; background: #059669;' :
                                         currentStep > idx + 1 ? 'width: 100%;' : 'width: 0;'">
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- 步骤 1: 基础信息输入 -->
        <div x-show="currentStep === 1" x-transition:enter="animate-fade-in" class="mt-8">
            <div class="glass-card rounded-2xl shadow-lg p-6 sm:p-8 border border-emerald-100">
                <div class="flex items-center gap-3 mb-6">
                    <div class="p-2.5 bg-emerald-100 rounded-xl">
                        <i data-lucide="pencil-line" class="w-5 h-5 text-primary"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-900">基础信息</h2>
                        <p class="text-sm text-slate-500">填写课程基本信息，AI 将为你智能拆解知识模块</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- 课程主题 -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">课程主题 <span class="text-red-400">*</span></label>
                        <input type="text" x-model="form.topic"
                            placeholder="例如：Python 数据分析入门、小学三年级英语阅读..."
                            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-300 focus:border-emerald-400 outline-none transition-all">
                    </div>

                    <!-- 目标受众 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">目标受众 <span class="text-red-400">*</span></label>
                        <select x-model="form.audience"
                            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-300 focus:border-emerald-400 outline-none transition-all bg-white">
                            <option value="">请选择受众群体</option>
                            <option value="小学生">小学生</option>
                            <option value="中学生">中学生</option>
                            <option value="大学生">大学生</option>
                            <option value="职场人">职场人</option>
                            <option value="零基础成人">零基础成人</option>
                        </select>
                    </div>

                    <!-- 总课时 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">总课时（小时） <span class="text-red-400">*</span></label>
                        <input type="number" x-model.number="form.totalHours" min="1" max="200"
                            placeholder="例如：24"
                            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-300 focus:border-emerald-400 outline-none transition-all">
                    </div>

                    <!-- 教学风格 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">教学风格</label>
                        <div class="flex gap-3">
                            <template x-for="style in ['理论为主', '实践为主', '混合式']" :key="style">
                                <button @click="form.teachingStyle = style"
                                    class="flex-1 py-2.5 rounded-xl text-sm font-medium border-2 transition-all"
                                    :class="form.teachingStyle === style
                                        ? 'border-primary bg-emerald-50 text-primary'
                                        : 'border-slate-200 text-slate-500 hover:border-emerald-200'">
                                    <span x-text="style"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- 学习目标 -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">学习目标（选填）</label>
                        <textarea x-model="form.objectives" rows="3"
                            placeholder="描述学员学完后应掌握的核心能力，多个目标换行填写..."
                            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-300 focus:border-emerald-400 outline-none transition-all resize-none"></textarea>
                    </div>
                </div>

                <div class="mt-6 flex justify-end">
                    <button @click="generateModules()"
                        :disabled="!canProceedStep1 || loadingModules"
                        class="px-6 py-3 bg-primary text-white rounded-xl font-medium text-sm hover:bg-primary-dark disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2 shadow-lg shadow-emerald-200">
                        <template x-if="loadingModules">
                            <i data-lucide="loader-2" class="w-4 h-4 spin-slow"></i>
                        </template>
                        <template x-if="!loadingModules">
                            <i data-lucide="sparkles" class="w-4 h-4"></i>
                        </template>
                        <span x-text="loadingModules ? '正在拆解模块...' : '智能拆解模块'"></span>
                        <i data-lucide="arrow-right" class="w-4 h-4" x-show="!loadingModules"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 步骤 2: 模块拆解 -->
        <div x-show="currentStep === 2" x-transition:enter="animate-fade-in" class="mt-8">
            <div class="glass-card rounded-2xl shadow-lg p-6 sm:p-8 border border-emerald-100">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <div class="p-2.5 bg-emerald-100 rounded-xl">
                            <i data-lucide="layout-grid" class="w-5 h-5 text-primary"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-slate-900">知识模块拆解</h2>
                            <p class="text-sm text-slate-500">AI 已为你拆解出以下模块，可编辑名称和描述</p>
                        </div>
                    </div>
                    <button @click="currentStep = 1"
                        class="text-sm text-slate-500 hover:text-primary flex items-center gap-1 transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回修改
                    </button>
                </div>

                <!-- 课程概要 -->
                <div class="mb-6 p-4 bg-emerald-50/60 rounded-xl border border-emerald-100">
                    <div class="flex flex-wrap gap-4 text-sm">
                        <span class="flex items-center gap-1.5 text-slate-600">
                            <i data-lucide="book-open" class="w-4 h-4 text-primary"></i>
                            <span x-text="form.topic" class="font-medium"></span>
                        </span>
                        <span class="flex items-center gap-1.5 text-slate-600">
                            <i data-lucide="users" class="w-4 h-4 text-primary"></i>
                            <span x-text="form.audience"></span>
                        </span>
                        <span class="flex items-center gap-1.5 text-slate-600">
                            <i data-lucide="clock" class="w-4 h-4 text-primary"></i>
                            <span x-text="form.totalHours + ' 课时'"></span>
                        </span>
                        <span class="flex items-center gap-1.5 text-slate-600">
                            <i data-lucide="palette" class="w-4 h-4 text-primary"></i>
                            <span x-text="form.teachingStyle"></span>
                        </span>
                    </div>
                </div>

                <!-- 模块卡片网格 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" x-show="modules.length > 0">
                    <template x-for="(mod, idx) in modules" :key="idx">
                        <div class="module-card bg-white rounded-xl p-5 border border-slate-100 shadow-sm">
                            <div class="flex items-start justify-between mb-3">
                                <div class="flex items-center gap-2">
                                    <span class="w-8 h-8 rounded-lg bg-emerald-100 flex items-center justify-center text-sm font-bold text-primary"
                                        x-text="'M' + (idx + 1)"></span>
                                    <div class="flex items-center gap-2">
                                        <input type="text" x-model="mod.module_name"
                                            class="font-semibold text-slate-900 bg-transparent border-b border-transparent hover:border-emerald-300 focus:border-primary outline-none transition-colors text-sm px-1 py-0.5 max-w-[200px]">
                                    </div>
                                </div>
                                <span class="text-xs font-medium text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full whitespace-nowrap"
                                    x-text="mod.duration_hours + 'h'"></span>
                            </div>
                            <textarea x-model="mod.description" rows="2"
                                class="w-full text-sm text-slate-600 bg-transparent border border-transparent rounded-lg px-2 py-1.5 hover:border-slate-200 focus:border-emerald-300 outline-none transition-colors resize-none mb-3"></textarea>
                            <div class="flex flex-wrap gap-1.5">
                                <template x-for="(concept, ci) in mod.key_concepts" :key="ci">
                                    <span class="tag-chip" x-text="concept"></span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="mt-6 flex justify-between items-center">
                    <span class="text-sm text-slate-500">
                        共 <span class="font-bold text-primary" x-text="modules.length"></span> 个模块，
                        合计 <span class="font-bold text-primary" x-text="totalModuleHours"></span> 课时
                    </span>
                    <button @click="generateLessonPlans()"
                        :disabled="modules.length === 0 || loadingLessons"
                        class="px-6 py-3 bg-primary text-white rounded-xl font-medium text-sm hover:bg-primary-dark disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2 shadow-lg shadow-emerald-200">
                        <template x-if="loadingLessons">
                            <i data-lucide="loader-2" class="w-4 h-4 spin-slow"></i>
                        </template>
                        <template x-if="!loadingLessons">
                            <i data-lucide="list-checks" class="w-4 h-4"></i>
                        </template>
                        <span x-text="loadingLessons ? '正在细化课时...' : '细化课时计划'"></span>
                        <i data-lucide="arrow-right" class="w-4 h-4" x-show="!loadingLessons"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 步骤 3: 课时细化 -->
        <div x-show="currentStep === 3" x-transition:enter="animate-fade-in" class="mt-8">
            <div class="glass-card rounded-2xl shadow-lg p-6 sm:p-8 border border-emerald-100">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <div class="p-2.5 bg-emerald-100 rounded-xl">
                            <i data-lucide="list-checks" class="w-5 h-5 text-primary"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-slate-900">课时细化</h2>
                            <p class="text-sm text-slate-500">每个模块的详细教学计划，点击展开查看</p>
                        </div>
                    </div>
                    <button @click="currentStep = 2"
                        class="text-sm text-slate-500 hover:text-primary flex items-center gap-1 transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回模块
                    </button>
                </div>

                <!-- 生成进度 -->
                <div x-show="loadingLessons" class="mb-6 p-4 bg-emerald-50/60 rounded-xl border border-emerald-100">
                    <div class="flex items-center gap-3">
                        <i data-lucide="loader-2" class="w-5 h-5 text-primary spin-slow"></i>
                        <div class="flex-1">
                            <div class="text-sm font-medium text-slate-700" x-text="'正在生成第 ' + (currentGeneratingIdx + 1) + ' / ' + modules.length + ' 个模块的课时计划...'"></div>
                            <div class="mt-2 h-2 bg-emerald-100 rounded-full overflow-hidden">
                                <div class="h-full bg-primary rounded-full transition-all duration-500"
                                    :style="'width: ' + ((currentGeneratingIdx) / modules.length * 100) + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 手风琴列表 -->
                <div class="space-y-3">
                    <template x-for="(mod, idx) in modules" :key="idx">
                        <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
                            <button @click="toggleAccordion(idx)"
                                class="w-full px-5 py-4 flex items-center justify-between text-left hover:bg-emerald-50/50 transition-colors">
                                <div class="flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold"
                                        :class="mod.lessonPlan ? 'bg-primary text-white' : 'bg-slate-100 text-slate-400'"
                                        x-text="'M' + (idx + 1)"></span>
                                    <div>
                                        <span class="font-semibold text-slate-900 text-sm" x-text="mod.module_name"></span>
                                        <span class="text-xs text-slate-400 ml-2" x-text="mod.duration_hours + ' 课时'"></span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span x-show="mod.lessonPlan" class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">已生成</span>
                                    <span x-show="loadingLessons && currentGeneratingIdx === idx" class="pulse-dot w-2 h-2 rounded-full bg-primary"></span>
                                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-300"
                                        :class="openAccordions.includes(idx) ? 'rotate-180' : ''"></i>
                                </div>
                            </button>
                            <div class="accordion-content" :class="openAccordions.includes(idx) ? 'open' : ''">
                                <div class="px-5 pb-5 border-t border-slate-50">
                                    <template x-if="mod.lessonPlan">
                                        <div class="pt-4 prose prose-sm max-w-none text-slate-700" x-html="renderMarkdown(mod.lessonPlan)"></div>
                                    </template>
                                    <template x-if="!mod.lessonPlan && loadingLessons && currentGeneratingIdx === idx">
                                        <div class="pt-4">
                                            <div class="flex items-center gap-2 text-sm text-slate-500">
                                                <i data-lucide="loader-2" class="w-4 h-4 spin-slow"></i>
                                                正在生成中...
                                            </div>
                                            <div x-show="streamingText" class="mt-3 prose prose-sm max-w-none text-slate-700" x-html="renderMarkdown(streamingText)"></div>
                                        </div>
                                    </template>
                                    <template x-if="!mod.lessonPlan && !(loadingLessons && currentGeneratingIdx === idx)">
                                        <div class="pt-4 text-sm text-slate-400 flex items-center gap-2">
                                            <i data-lucide="hourglass" class="w-4 h-4"></i> 等待生成...
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="mt-6 flex justify-end" x-show="!loadingLessons && allLessonsGenerated">
                    <button @click="generateFinalOutline()"
                        :disabled="loadingFinal"
                        class="px-6 py-3 bg-primary text-white rounded-xl font-medium text-sm hover:bg-primary-dark disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2 shadow-lg shadow-emerald-200">
                        <template x-if="loadingFinal">
                            <i data-lucide="loader-2" class="w-4 h-4 spin-slow"></i>
                        </template>
                        <template x-if="!loadingFinal">
                            <i data-lucide="file-text" class="w-4 h-4"></i>
                        </template>
                        <span x-text="loadingFinal ? '正在整合大纲...' : '生成完整大纲'"></span>
                        <i data-lucide="arrow-right" class="w-4 h-4" x-show="!loadingFinal"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 步骤 4: 完整大纲 -->
        <div x-show="currentStep === 4" x-transition:enter="animate-fade-in" class="mt-8">
            <div class="glass-card rounded-2xl shadow-lg p-6 sm:p-8 border border-emerald-100">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <div class="p-2.5 bg-emerald-100 rounded-xl">
                            <i data-lucide="file-text" class="w-5 h-5 text-primary"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-slate-900">完整课程大纲</h2>
                            <p class="text-sm text-slate-500">包含课程概述、模块计划、考核方案</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button @click="currentStep = 3"
                            class="text-sm text-slate-500 hover:text-primary flex items-center gap-1 transition-colors">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回课时
                        </button>
                    </div>
                </div>

                <!-- 大纲内容 -->
                <div x-show="loadingFinal" class="flex items-center justify-center py-12">
                    <div class="text-center">
                        <i data-lucide="loader-2" class="w-8 h-8 text-primary spin-slow mx-auto mb-3"></i>
                        <p class="text-sm text-slate-500">正在整合生成完整大纲...</p>
                    </div>
                </div>

                <div x-show="finalOutline" class="bg-white rounded-xl border border-slate-100 p-6 shadow-sm">
                    <div class="prose prose-sm max-w-none text-slate-700 prose-headings:text-slate-900 prose-h1:text-xl prose-h2:text-lg prose-h3:text-base"
                        x-html="renderMarkdown(finalOutline)"></div>
                </div>

                <!-- 操作按钮 -->
                <div class="mt-6 flex flex-wrap gap-3 justify-end" x-show="finalOutline && !loadingFinal">
                    <button @click="copyOutline()"
                        class="px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50 transition-all flex items-center gap-2">
                        <i data-lucide="copy" class="w-4 h-4"></i> 复制全文
                    </button>
                    <button @click="exportMarkdown()"
                        class="px-4 py-2.5 bg-primary text-white rounded-xl text-sm font-medium hover:bg-primary-dark transition-all flex items-center gap-2 shadow-lg shadow-emerald-200">
                        <i data-lucide="download" class="w-4 h-4"></i> 导出 Markdown
                    </button>
                    <button @click="resetAll()"
                        class="px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50 transition-all flex items-center gap-2">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i> 重新开始
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- 设置弹窗 -->
    <div x-show="showSettings" x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div @click.outside="showSettings = false" class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-900">API 配置</h3>
                <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">DeepSeek API Key</label>
                    <input type="password" x-model="apiConfig.deepseek"
                        placeholder="sk-..."
                        class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-300 focus:border-emerald-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">模型选择</label>
                    <select x-model="apiConfig.model"
                        class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-300 focus:border-emerald-400 outline-none bg-white">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-2">
                <button @click="showSettings = false"
                    class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 transition-colors">取消</button>
                <button @click="saveConfig()"
                    class="px-5 py-2 bg-primary text-white rounded-lg text-sm font-medium hover:bg-primary-dark transition-colors">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div x-show="toastMsg" x-transition:enter="toast-enter" x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-2"
        class="fixed bottom-6 right-6 z-[200] bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-sm flex items-center gap-2">
        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
        <span x-text="toastMsg"></span>
    </div>

</div>

<script>
function courseOutlineApp() {
    return {
        /* ---- 基础状态 ---- */
        steps: ['基础信息', '模块拆解', '课时细化', '完整大纲'],
        currentStep: 1,
        showSettings: false,
        toastMsg: '',
        toastTimer: null,

        /* ---- API 配置 ---- */
        apiConfig: {
            deepseek: '',
            model: 'deepseek-v4-flash'
        },

        /* ---- 表单数据 ---- */
        form: {
            topic: '',
            audience: '',
            totalHours: null,
            objectives: '',
            teachingStyle: '混合式'
        },

        /* ---- 模块数据 ---- */
        modules: [],
        loadingModules: false,

        /* ---- 课时数据 ---- */
        loadingLessons: false,
        currentGeneratingIdx: 0,
        streamingText: '',
        openAccordions: [],

        /* ---- 最终大纲 ---- */
        finalOutline: '',
        loadingFinal: false,

        /* ---- 计算属性 ---- */
        get canProceedStep1() {
            return this.form.topic.trim() && this.form.audience && this.form.totalHours > 0;
        },
        get totalModuleHours() {
            return this.modules.reduce((sum, m) => sum + (parseFloat(m.duration_hours) || 0), 0);
        },
        get allLessonsGenerated() {
            return this.modules.length > 0 && this.modules.every(m => m.lessonPlan);
        },

        /* ---- 初始化 ---- */
        init() {
            this.loadConfig();
            this.$nextTick(() => lucide.createIcons());
        },

        /* ---- 配置管理（合并策略） ---- */
        loadConfig() {
            const saved = localStorage.getItem('global_llm_config');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    this.apiConfig = { ...this.apiConfig, ...parsed };
                } catch (e) { /* 忽略解析失败 */ }
            }
        },
        saveConfig() {
            const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
            localStorage.setItem('global_llm_config', JSON.stringify({
                ...current,
                deepseek: this.apiConfig.deepseek,
                model: this.apiConfig.model
            }));
            this.showSettings = false;
            this.showToast('配置已保存');
        },

        /* ---- Toast 通知 ---- */
        showToast(msg) {
            this.toastMsg = msg;
            clearTimeout(this.toastTimer);
            this.toastTimer = setTimeout(() => { this.toastMsg = ''; }, 2500);
            this.$nextTick(() => lucide.createIcons());
        },

        /* ---- Markdown 渲染 ---- */
        renderMarkdown(text) {
            if (!text) return '';
            try { return marked.parse(text); } catch { return text; }
        },

        /* ---- 手风琴切换 ---- */
        toggleAccordion(idx) {
            const pos = this.openAccordions.indexOf(idx);
            if (pos > -1) {
                this.openAccordions.splice(pos, 1);
            } else {
                this.openAccordions.push(idx);
            }
            this.$nextTick(() => lucide.createIcons());
        },

        /* ============================================
           步骤 2: 生成知识模块（JSON 模式）
           ============================================ */
        async generateModules() {
            if (!this.apiConfig.deepseek) {
                this.showSettings = true;
                return;
            }
            this.loadingModules = true;
            this.$nextTick(() => lucide.createIcons());

            const systemPrompt = `你是一位资深课程设计专家。根据用户提供的课程信息，将课程拆解为合理的知识模块。

要求：
1. 模块数量根据总课时合理拆分（一般 4-8 个模块）
2. 每个模块分配合理的课时
3. 所有模块课时之和应等于总课时
4. 模块按学习顺序排列，由浅入深
5. 每个模块包含 3-5 个核心概念关键词

请以 JSON 格式输出，结构如下：
{
  "modules": [
    {
      "module_name": "模块名称",
      "description": "模块简要描述（1-2句话）",
      "duration_hours": 数字,
      "key_concepts": ["概念1", "概念2", "概念3"]
    }
  ]
}`;

            const userPrompt = `课程主题：${this.form.topic}
目标受众：${this.form.audience}
总课时：${this.form.totalHours} 小时
教学风格：${this.form.teachingStyle}
${this.form.objectives ? '学习目标：\n' + this.form.objectives : ''}`;

            try {
                const responseText = await this.callAPI(
                    [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }],
                    false, true
                );
                const parsed = JSON.parse(responseText);
                this.modules = (parsed.modules || []).map(m => ({ ...m, lessonPlan: '' }));
                this.currentStep = 2;
                this.$nextTick(() => lucide.createIcons());
            } catch (e) {
                console.error('模块拆解失败:', e);
                this.showToast('模块拆解失败，请重试');
            } finally {
                this.loadingModules = false;
                this.$nextTick(() => lucide.createIcons());
            }
        },

        /* ============================================
           步骤 3: 逐模块生成课时计划（流式）
           ============================================ */
        async generateLessonPlans() {
            if (!this.apiConfig.deepseek) {
                this.showSettings = true;
                return;
            }
            this.loadingLessons = true;
            this.currentGeneratingIdx = 0;
            this.currentStep = 3;
            this.openAccordions = [0];
            this.$nextTick(() => lucide.createIcons());

            for (let i = 0; i < this.modules.length; i++) {
                this.currentGeneratingIdx = i;
                this.streamingText = '';
                if (!this.openAccordions.includes(i)) {
                    this.openAccordions.push(i);
                }

                const systemPrompt = `你是一位经验丰富的教学设计师。请为以下课程模块生成详细的课时计划。

输出 Markdown 格式，包含以下部分：
### 学习目标
- 列出 3-5 个具体可衡量的学习目标

### 内容大纲
按课时拆分内容，每课时包含具体知识点

### 教学活动
设计 2-3 个互动教学活动（结合教学风格）

### 练习与作业
设计课堂练习和课后作业

### 考核方式
说明本模块的评估方法和标准`;

                const userPrompt = `课程：${this.form.topic}（面向${this.form.audience}，${this.form.teachingStyle}）

当前模块：${this.modules[i].module_name}
模块描述：${this.modules[i].description}
课时：${this.modules[i].duration_hours} 小时
核心概念：${this.modules[i].key_concepts.join('、')}

请生成本模块的详细课时计划。`;

                try {
                    const result = await this.callAPI(
                        [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }],
                        true, false,
                        (chunk) => { this.streamingText += chunk; }
                    );
                    this.modules[i].lessonPlan = result;
                } catch (e) {
                    console.error(`模块 ${i + 1} 生成失败:`, e);
                    this.modules[i].lessonPlan = `> 生成失败，请重试：${e.message}`;
                }
                this.streamingText = '';
            }

            this.loadingLessons = false;
            this.$nextTick(() => lucide.createIcons());
            this.showToast('全部模块课时计划已生成');
        },

        /* ============================================
           步骤 4: 生成完整课程大纲（流式）
           ============================================ */
        async generateFinalOutline() {
            if (!this.apiConfig.deepseek) {
                this.showSettings = true;
                return;
            }
            this.loadingFinal = true;
            this.finalOutline = '';
            this.currentStep = 4;
            this.$nextTick(() => lucide.createIcons());

            const moduleSummaries = this.modules.map((m, i) =>
                `模块${i + 1}：${m.module_name}（${m.duration_hours}h）\n${m.lessonPlan}`
            ).join('\n\n---\n\n');

            const systemPrompt = `你是一位资深课程架构师。请基于已有的模块信息和课时计划，整合生成一份完整、专业的课程大纲文档。

文档结构要求（Markdown格式）：
# 课程大纲：[课程名称]

## 一、课程概述
包含：课程简介、目标受众、总课时、教学风格、先修知识

## 二、学习目标
总体学习目标（4-6条）

## 三、课程模块详览
整合各模块的课时计划，保持结构统一

## 四、教学资源
推荐教材、参考资料、在线资源

## 五、考核方案
考核方式、分值占比、评分标准

## 六、教学日历
按周/课时排列的教学进度表

请输出完整的 Markdown 文档。`;

            const userPrompt = `课程信息：
- 主题：${this.form.topic}
- 受众：${this.form.audience}
- 总课时：${this.form.totalHours} 小时
- 风格：${this.form.teachingStyle}
${this.form.objectives ? '- 学习目标：' + this.form.objectives : ''}

以下是各模块的详细课时计划：

${moduleSummaries}

请整合以上内容，生成完整课程大纲文档。`;

            try {
                const result = await this.callAPI(
                    [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }],
                    true, false,
                    (chunk) => { this.finalOutline += chunk; }
                );
                this.finalOutline = result;
            } catch (e) {
                console.error('大纲整合失败:', e);
                this.showToast('大纲整合失败，请重试');
            } finally {
                this.loadingFinal = false;
                this.$nextTick(() => lucide.createIcons());
            }
        },

        /* ============================================
           通用 API 调用（支持流式 / JSON 模式）
           ============================================ */
        async callAPI(messages, stream = false, jsonMode = false, onChunk = null) {
            const body = {
                model: this.apiConfig.model,
                messages: messages,
                temperature: 0.7,
                stream: stream,
            };
            if (jsonMode) {
                body.response_format = { type: 'json_object' };
            }

            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${this.apiConfig.deepseek}`
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API 请求失败 (${response.status}): ${errText}`);
            }

            /* 非流式：直接返回文本 */
            if (!stream) {
                const data = await response.json();
                return data.choices[0].message.content;
            }

            /* 流式：逐块读取 */
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6).trim();
                    if (data === '[DONE]') continue;

                    try {
                        const parsed = JSON.parse(data);
                        const delta = parsed.choices[0].delta;
                        if (delta.reasoning_content) {
                            /* V4 Pro 推理内容暂时忽略，可后续扩展 */
                        }
                        if (delta.content) {
                            fullText += delta.content;
                            if (onChunk) onChunk(delta.content);
                        }
                    } catch (e) { /* 跳过解析失败的行 */ }
                }
            }
            return fullText;
        },

        /* ---- 复制全文 ---- */
        async copyOutline() {
            try {
                await navigator.clipboard.writeText(this.finalOutline);
                this.showToast('已复制到剪贴板');
            } catch {
                const ta = document.createElement('textarea');
                ta.value = this.finalOutline;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                this.showToast('已复制到剪贴板');
            }
        },

        /* ---- 导出 Markdown 文件 ---- */
        exportMarkdown() {
            const blob = new Blob([this.finalOutline], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `课程大纲_${this.form.topic.replace(/\s+/g, '_')}.md`;
            a.click();
            URL.revokeObjectURL(url);
            this.showToast('Markdown 文件已下载');
        },

        /* ---- 重置所有状态 ---- */
        resetAll() {
            this.currentStep = 1;
            this.form = { topic: '', audience: '', totalHours: null, objectives: '', teachingStyle: '混合式' };
            this.modules = [];
            this.finalOutline = '';
            this.openAccordions = [];
            this.$nextTick(() => lucide.createIcons());
        }
    };
}
</script>
</body>
