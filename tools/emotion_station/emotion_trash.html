<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <!-- Google Analytics：与项目其他页面一致 -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-M09H8GY78X');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情绪垃圾桶（阅后即焚）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /**
     * 全局：深夜树洞 — 纯黑底、系统字体
     */
    body {
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #030303;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /**
     * 输入框「呼吸」微光边框：多层 box-shadow 轻微脉动
     */
    @keyframes breathe-glow {

      0%,
      100% {
        box-shadow:
          0 0 0 1px rgba(148, 163, 184, 0.15),
          0 0 20px rgba(99, 102, 241, 0.06),
          inset 0 0 40px rgba(255, 255, 255, 0.02);
      }

      50% {
        box-shadow:
          0 0 0 1px rgba(165, 180, 252, 0.35),
          0 0 32px rgba(99, 102, 241, 0.12),
          inset 0 0 48px rgba(255, 255, 255, 0.03);
      }
    }

    .trash-input-breathe {
      animation: breathe-glow 4s ease-in-out infinite;
    }

    /**
     * 单字粒子飞散：位移 + 旋转 + 缩放 + 透明
     * 方向与时长由行内 CSS 变量 --tx/--ty/--rot/--dur/--delay 注入随机值
     */
    @keyframes particle-drift {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        opacity: 1;
        filter: blur(0);
      }

      55% {
        opacity: 0.85;
      }

      100% {
        transform:
          translate3d(var(--tx), var(--ty), 0) rotate(var(--rot)) scale(0.15);
        opacity: 0;
        filter: blur(1px);
      }
    }

    .particle-char {
      display: inline-block;
      white-space: pre;
      will-change: transform, opacity;
      animation-name: particle-drift;
      animation-timing-function: cubic-bezier(0.22, 0.85, 0.45, 1);
      animation-fill-mode: forwards;
      animation-duration: var(--dur, 1.8s);
      animation-delay: var(--delay, 0s);
    }

    /** 温柔句：淡入 */
    @keyframes comfort-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /** 温柔句：淡出 */
    @keyframes comfort-out {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
        transform: translateY(-8px) scale(0.99);
      }
    }

    .comfort-visible {
      animation: comfort-in 1.1s ease-out forwards;
    }

    .comfort-hiding {
      animation: comfort-out 1s ease-in forwards;
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="antialiased">
  <div x-data="emotionTrash()" x-init="init()" class="min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- 顶栏：返回首页 + 设置 -->
    <nav class="sticky top-0 z-50 border-b border-white/[0.06] bg-black/40 backdrop-blur-md">
      <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
        <button type="button" onclick="location.href='../../index.html'"
          class="flex items-center gap-2 text-slate-400 hover:text-slate-200 transition text-sm">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>返回</span>
        </button>
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-600 hidden sm:inline">情绪垃圾桶 · 阅后即焚</span>
          <button type="button" @click="showSettings = true"
            class="p-2 rounded-lg text-slate-500 hover:text-slate-300 hover:bg-white/5 transition"
            title="API 设置">
            <i data-lucide="settings" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center px-4 py-8 relative z-10">

      <!-- 隐私说明（小字） -->
      <p class="text-[11px] text-slate-600 text-center max-w-md mb-6 leading-relaxed">
        倾诉内容仅在浏览器内销毁，不会写入本地存储、也不会随网络请求发送原文；温柔短句由 AI 独立生成，仅作陪伴。
      </p>

      <!-- 中央工作区 -->
      <div class="w-full max-w-xl min-h-[280px] flex flex-col items-center justify-center relative">

        <!-- 阶段：输入 -->
        <div x-show="phase === 'input'" x-transition.opacity.duration.300ms
          class="w-full flex flex-col gap-4 items-center">
          <label class="sr-only">倾倒负能量</label>
          <textarea x-model="draft" @keydown.enter.prevent="onEnter($event)" rows="6" maxlength="2000"
            placeholder="在这里倾倒你的负能量..."
            class="trash-input-breathe w-full rounded-2xl bg-zinc-950/80 border border-white/10 text-slate-200 placeholder:text-slate-600 px-5 py-4 text-base leading-relaxed resize-none focus:outline-none focus:ring-0 focus:border-indigo-500/30"></textarea>

          <button type="button" @click="throwAway()"
            :disabled="!draft.trim() || phase !== 'input'"
            class="group flex items-center gap-2 px-8 py-3 rounded-xl bg-zinc-900/90 border border-white/10 text-slate-300 text-sm font-medium hover:border-indigo-400/25 hover:bg-zinc-800/90 hover:text-white disabled:opacity-35 disabled:cursor-not-allowed transition">
            <i data-lucide="trash-2" class="w-4 h-4 text-slate-500 group-hover:text-indigo-400 transition"></i>
            丢进垃圾桶
          </button>
        </div>

        <!-- 阶段：粒子层（与输入区同宽，视觉连续） -->
        <div x-show="phase === 'particles'" x-cloak
          class="absolute inset-0 flex flex-wrap justify-center items-center content-center gap-y-1 px-2 text-center text-lg sm:text-xl text-slate-200 font-medium tracking-wide pointer-events-none"
          style="min-height: 200px;">
          <template x-for="(p, i) in particles" :key="i">
            <span class="particle-char" :style="p.style" x-text="p.char"></span>
          </template>
        </div>

        <!-- 阶段：AI 温柔句 / 加载（用 x-show 避免多 x-if 根节点问题） -->
        <div x-show="phase === 'comfort' || phase === 'comfortOut'" x-cloak
          class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
          <div x-show="comfortLoading" class="flex flex-col items-center gap-3 text-slate-500">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin opacity-70"></i>
            <span class="text-sm">正在为你挑一句话…</span>
          </div>
          <p x-show="!comfortLoading && comfortText"
            class="text-2xl sm:text-3xl font-light text-white leading-relaxed max-w-lg comfort-visible"
            :class="{ 'comfort-hiding': phase === 'comfortOut' }" x-text="comfortText"></p>
        </div>
      </div>
    </main>

    <!-- 底部计数 -->
    <footer class="pb-8 pt-4 text-center text-[11px] text-slate-600 z-10">
      已销毁 <span class="text-slate-500 tabular-nums" x-text="disposedCount"></span> 条负能量
    </footer>

    <!-- 设置弹窗：合并写入 global_llm_config -->
    <div x-show="showSettings" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
      @keydown.escape.window="showSettings = false">
      <div @click.outside="showSettings = false" class="bg-zinc-900 border border-white/10 rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4">
        <h3 class="text-lg font-semibold text-white flex items-center gap-2">
          <i data-lucide="key-round" class="w-5 h-5 text-indigo-400"></i>
          API 配置
        </h3>
        <div>
          <label class="block text-xs text-slate-400 mb-1">DeepSeek API Key</label>
          <input type="password" x-model="apiConfig.deepseek"
            class="w-full rounded-xl bg-black/50 border border-white/10 px-3 py-2.5 text-sm text-slate-200 focus:border-indigo-500/40 focus:outline-none"
            placeholder="sk-..." autocomplete="off" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">模型</label>
          <select x-model="apiConfig.model"
            class="w-full rounded-xl bg-black/50 border border-white/10 px-3 py-2.5 text-sm text-slate-200 focus:border-indigo-500/40 focus:outline-none">
            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
          </select>
        </div>
        <p class="text-[11px] text-slate-500 leading-relaxed">
          未配置 Key 时，消散后仍会显示本地备选温柔句。配置与其他工具共用 <code class="text-slate-400">global_llm_config</code>，保存时为合并写入。
        </p>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" @click="showSettings = false"
            class="px-4 py-2 rounded-xl text-sm text-slate-400 hover:bg-white/5">取消</button>
          <button type="button" @click="saveConfig()"
            class="px-4 py-2 rounded-xl text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * localStorage：仅保存「销毁条数」，绝不保存用户输入原文
     */
    const STORAGE_COUNT_KEY = 'emotion_trash_disposed_count';

    /**
     * 无 API 时的本地温柔句池（与 AI 风格接近，保证离线可用）
     */
    const FALLBACK_COMFORT = [
      '我都听到了，辛苦了。',
      '你已经做得很好了。',
      '没关系，慢慢来。',
      '今晚的黑夜会过去，你并不孤单。',
      '能说出来，就已经很勇敢了。',
      '不必急着好起来，我在这儿。',
      '累了就歇一会儿，世界还在转。',
      '你的感受很重要，值得被温柔对待。'
    ];

    document.addEventListener('alpine:init', () => {
      Alpine.data('emotionTrash', () => ({
        /** 当前界面阶段：input | particles | comfort | comfortOut */
        phase: 'input',
        /** 用户输入草稿（仅内存，不落盘） */
        draft: '',
        /** 粒子数组：{ char, style } */
        particles: [],
        /** AI 温柔句 */
        comfortText: '',
        comfortLoading: false,
        showSettings: false,
        /** DeepSeek 配置（与全站合并） */
        apiConfig: { deepseek: '', model: 'deepseek-v4-flash' },
        /** 已销毁条数（仅数字存盘） */
        disposedCount: 0,

        init() {
          this.loadConfig();
          this.loadDisposedCount();
          this.$nextTick(() => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
          });
        },

        /** 合并加载 global_llm_config */
        loadConfig() {
          try {
            const saved = localStorage.getItem('global_llm_config');
            if (saved) {
              this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
            }
          } catch (e) {
            console.error('解析 global_llm_config 失败:', e);
          }
        },

        /**
         * 保存配置：合并写入，禁止整表覆盖其他工具字段
         */
        saveConfig() {
          let current = {};
          try {
            current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
          } catch (e) {
            console.error('读取旧配置失败:', e);
          }
          localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...this.apiConfig }));
          this.showSettings = false;
          this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
        },

        /** 读取仅计数 */
        loadDisposedCount() {
          try {
            const n = parseInt(localStorage.getItem(STORAGE_COUNT_KEY) || '0', 10);
            this.disposedCount = Number.isFinite(n) && n >= 0 ? n : 0;
          } catch {
            this.disposedCount = 0;
          }
        },

        /** 计数 +1 并持久化（仅存数字） */
        bumpDisposedCount() {
          this.disposedCount += 1;
          try {
            localStorage.setItem(STORAGE_COUNT_KEY, String(this.disposedCount));
          } catch (e) {
            console.warn('写入计数失败:', e);
          }
        },

        /**
         * Enter 提交：单独一行时允许换行需 Shift+Enter；此处与需求一致为「按 Enter 提交」
         * @param {KeyboardEvent} e
         */
        onEnter(e) {
          if (e.shiftKey) {
            const ta = e.target;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            this.draft = this.draft.slice(0, start) + '\n' + this.draft.slice(end);
            this.$nextTick(() => {
              ta.selectionStart = ta.selectionEnd = start + 1;
            });
            return;
          }
          this.throwAway();
        },

        /**
         * 为单个字符生成随机飞散参数（像素位移、旋转、时长、延迟）
         * @param {string} ch
         * @returns {{char:string, style:string}}
         */
        makeParticle(ch) {
          const displayChar = ch === '\n' ? ' ' : ch;
          const angle = Math.random() * Math.PI * 2;
          const dist = 120 + Math.random() * 220;
          const tx = Math.cos(angle) * dist + (Math.random() - 0.5) * 60;
          const ty = Math.sin(angle) * dist + (Math.random() - 0.5) * 80 - 40;
          const rot = (Math.random() - 0.5) * 720;
          const dur = (1.4 + Math.random() * 1.2).toFixed(2) + 's';
          const delay = (Math.random() * 0.35).toFixed(3) + 's';
          const style = `--tx:${tx.toFixed(1)}px; --ty:${ty.toFixed(1)}px; --rot:${rot.toFixed(1)}deg; --dur:${dur}; --delay:${delay};`;
          return { char: displayChar, style };
        },

        /**
         * 主流程：清空内存中的原文 → 粒子动画 → 温柔句 → 淡出复位
         */
        async throwAway() {
          const raw = (this.draft || '').trim();
          if (!raw || this.phase !== 'input') return;

          const key = (this.apiConfig.deepseek || '').trim();

          // 构建粒子（立即丢弃 draft 中的语义，仅保留粒子展示用副本）
          const chars = Array.from(raw);
          this.particles = chars.map((c) => this.makeParticle(c));
          this.draft = '';
          this.phase = 'particles';
          this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });

          // 取最长粒子动画时间后进入安慰阶段
          const waitMs = 2600;
          await new Promise((r) => setTimeout(r, waitMs));

          this.particles = [];
          this.phase = 'comfort';
          this.comfortText = '';
          this.comfortLoading = true;
          this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });

          let line = '';
          try {
            if (key) {
              line = await this.fetchComfortLine();
            } else {
              line = FALLBACK_COMFORT[Math.floor(Math.random() * FALLBACK_COMFORT.length)];
            }
          } catch (err) {
            console.error(err);
            line = FALLBACK_COMFORT[Math.floor(Math.random() * FALLBACK_COMFORT.length)];
          }

          this.comfortLoading = false;
          this.comfortText = (line || '').trim() || FALLBACK_COMFORT[0];
          this.bumpDisposedCount();
          this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });

          // 温柔句停留约 5s 后淡出
          await new Promise((r) => setTimeout(r, 5000));
          this.phase = 'comfortOut';
          await new Promise((r) => setTimeout(r, 1000));

          this.phase = 'input';
          this.comfortText = '';
          this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
        },

        /**
         * 请求 AI 生成一句温柔短话。
         * 注意：不把用户倾诉原文发给模型，仅传随机种子保证每次措辞尽量不同。
         * @returns {Promise<string>}
         */
        async fetchComfortLine() {
          const seed = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
          const messages = [
            {
              role: 'system',
              content: `你是深夜树洞里的陪伴者。绝对不要讲道理、不要分析、不要提问、不要列点。
用户刚刚在本地销毁了一段负面情绪文字，你不会看到原文。
请只输出一句温柔、简短的中文回应（建议 8～24 个字），语气像轻声安慰。
禁止输出引号、前缀、后缀、换行或任何解释。`
            },
            {
              role: 'user',
              content: `请生成一句新的安慰话。随机标记（用于区分本次请求，勿照抄）：${seed}`
            }
          ];

          let full = '';
          let reasoning = '';
          await this.streamDeepSeek(messages, (chunk) => { full += chunk; }, (r) => { reasoning += r; });
          // V4 Pro 可能先推理再输出正文，取最终 content
          let text = full.trim();
          if (!text && reasoning) {
            const m = reasoning.match(/[\u4e00-\u9fff][^。\n]{4,40}[。！？]?/);
            if (m) text = m[0];
          }
          text = text.replace(/^["'「『]|["'」』]$/g, '').trim();
          const oneLine = text.split(/\n/)[0].trim();
          return oneLine || text;
        },

        /**
         * DeepSeek 流式调用（与项目其他工具一致）
         * @param {Array<{role:string,content:string}>} messages
         * @param {(s:string)=>void} onDelta
         * @param {(s:string)=>void} [onReasoning]
         */
        async streamDeepSeek(messages, onDelta, onReasoning) {
          const key = (this.apiConfig.deepseek || '').trim();
          if (!key) throw new Error('缺少 API Key');

          const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + key
            },
            body: JSON.stringify({
              model: this.apiConfig.model || 'deepseek-v4-flash',
              messages,
              stream: true,
              temperature: 1.05,
              max_tokens: 80
            })
          });

          if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(err.error?.message || 'HTTP ' + response.status);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';
            for (const line of lines) {
              const t = line.trim();
              if (!t.startsWith('data:')) continue;
              const data = t.slice(5).trim();
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                const delta = parsed.choices?.[0]?.delta;
                if (!delta) continue;
                if (delta.reasoning_content && onReasoning) onReasoning(delta.reasoning_content);
                if (delta.content) onDelta(delta.content);
              } catch (e) {
                console.warn('SSE 解析跳过:', e);
              }
            }
          }
        }
      }));
    });
  </script>
  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>
</body>

</html>
