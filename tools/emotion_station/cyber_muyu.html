<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛博电子木鱼 - 情绪驿站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /**
     * 深色禅意底 + 赛博金边氛围
     */
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse 120% 80% at 50% 20%, #2a2520 0%, #1a1814 45%, #0f0e0c 100%);
      min-height: 100vh;
      color: #e8e4dc;
    }

    /** 木鱼容器：霓虹描边 */
    .muyu-ring {
      border-radius: 50%;
      box-shadow:
        0 0 0 1px rgba(212, 165, 116, 0.35),
        0 0 24px rgba(212, 165, 116, 0.15),
        inset 0 0 40px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .muyu-ring--pressed {
      transform: scale(0.92);
    }

    /** 每满 100 下的金光脉冲 */
    .muyu-ring--gold-burst {
      animation: goldBurst 1.4s ease-out forwards;
    }

    @keyframes goldBurst {
      0% {
        box-shadow:
          0 0 0 2px rgba(255, 215, 120, 0.9),
          0 0 40px rgba(255, 200, 80, 0.55),
          0 0 80px rgba(255, 180, 40, 0.35);
      }
      100% {
        box-shadow:
          0 0 0 1px rgba(212, 165, 116, 0.35),
          0 0 24px rgba(212, 165, 116, 0.15),
          inset 0 0 40px rgba(0, 0, 0, 0.35);
      }
    }

    /** 功德 +1 上浮消失 */
    @keyframes meritFloat {
      0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
        filter: drop-shadow(0 0 8px rgba(255, 215, 120, 0.9));
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -72px) scale(1.15);
        filter: drop-shadow(0 0 16px rgba(255, 200, 80, 0.3));
      }
    }

    .merit-pop {
      animation: meritFloat 1s ease-out forwards;
      pointer-events: none;
    }

    /** 数字金色微光 */
    .text-gold-glow {
      color: #e8c547;
      text-shadow:
        0 0 20px rgba(232, 197, 71, 0.45),
        0 0 40px rgba(212, 165, 116, 0.2);
    }

    .panel-cyber {
      background: linear-gradient(145deg, rgba(35, 32, 28, 0.92) 0%, rgba(22, 20, 18, 0.96) 100%);
      border: 1px solid rgba(212, 165, 116, 0.28);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 12px 40px rgba(0, 0, 0, 0.45);
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body>
  <div x-data="cyberMuyu()" x-init="init()" class="min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- 背景：极淡网格，赛博感 -->
    <div class="pointer-events-none fixed inset-0 opacity-[0.04]"
      style="background-image: linear-gradient(rgba(212,165,116,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(212,165,116,0.5) 1px, transparent 1px); background-size: 48px 48px;">
    </div>

    <!-- 顶栏 -->
    <nav
      class="relative z-50 bg-zinc-900/80 backdrop-blur-md sticky top-0 border-b border-amber-900/30">
      <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 cursor-pointer min-w-0" onclick="location.href='../../index.html'">
          <i data-lucide="fish" class="text-amber-500/90 h-6 w-6 shrink-0"></i>
          <span class="font-bold text-base sm:text-lg text-amber-100/95 truncate">赛博电子木鱼</span>
        </div>
        <div class="flex items-center gap-1 sm:gap-2 shrink-0">
          <button type="button" @click="showHistory = true"
            class="p-2 rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-amber-200/90 text-xs sm:text-sm"
            title="历史开示">
            <i data-lucide="scroll-text" class="w-5 h-5 sm:hidden"></i>
            <span class="hidden sm:inline">开示录</span>
          </button>
          <button type="button" @click="showLeaderboard = true"
            class="p-2 rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-amber-200/90 text-xs sm:text-sm"
            title="功德榜">
            <i data-lucide="trophy" class="w-5 h-5 sm:hidden"></i>
            <span class="hidden sm:inline">功德榜</span>
          </button>
          <button type="button" @click="showSettings = true"
            class="p-2 rounded-lg text-zinc-400 hover:bg-zinc-800" title="API 设置">
            <i data-lucide="settings" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </nav>

    <main class="relative z-10 flex-1 flex flex-col items-center px-4 pb-10 pt-4 max-w-lg mx-auto w-full">

      <!-- 今日 / 累计 -->
      <div class="w-full grid grid-cols-2 gap-3 mb-4 text-center text-sm">
        <div class="panel-cyber rounded-xl py-3 px-2">
          <p class="text-zinc-500 text-xs mb-1">今日功德</p>
          <p class="text-xl font-bold text-gold-glow" x-text="todayMerit"></p>
        </div>
        <div class="panel-cyber rounded-xl py-3 px-2">
          <p class="text-zinc-500 text-xs mb-1">累计功德</p>
          <p class="text-xl font-bold text-gold-glow" x-text="totalMerit"></p>
        </div>
      </div>

      <!-- 主计数（大字）：累计功德 -->
      <p class="text-zinc-500 text-xs tracking-widest mb-2">累计功德</p>
      <p class="text-5xl sm:text-6xl font-black text-gold-glow tabular-nums mb-6" x-text="totalMerit"></p>

      <!-- 木鱼交互区 -->
      <div class="relative flex flex-col items-center w-full max-w-[320px]">

        <!-- 上浮「功德+1」层 -->
        <div class="absolute inset-0 pointer-events-none z-20 overflow-visible" aria-hidden="true">
          <template x-for="item in floatTexts" :key="item.id">
            <span
              class="merit-pop absolute left-1/2 top-1/3 text-lg font-bold text-amber-300 whitespace-nowrap z-30"
              :style="`margin-left: ${item.offset}px`"
              x-text="item.text"></span>
          </template>
        </div>

        <button type="button"
          class="relative z-10 cursor-pointer select-none touch-manipulation bg-transparent border-0 p-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/60 rounded-full"
          @click="onTap()"
          @keydown.enter.prevent="onTap()"
          :aria-label="'敲击木鱼，当前功德' + totalMerit">
          <div class="muyu-ring w-[min(280px,72vw)] h-[min(280px,72vw)] flex items-center justify-center rounded-full bg-zinc-900/40"
            :class="{ 'muyu-ring--pressed': muyuPressed, 'muyu-ring--gold-burst': goldBurst }">

            <!-- SVG 简化木鱼：圆身 + 纹理 -->
            <svg class="w-[88%] h-[88%]" viewBox="0 0 200 200" aria-hidden="true">
              <defs>
                <radialGradient id="woodBody" cx="40%" cy="35%" r="65%">
                  <stop offset="0%" stop-color="#8b5a3c" />
                  <stop offset="55%" stop-color="#5c3d2e" />
                  <stop offset="100%" stop-color="#3d2818" />
                </radialGradient>
                <linearGradient id="woodShine" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="rgba(255,220,180,0.25)" />
                  <stop offset="100%" stop-color="rgba(0,0,0,0)" />
                </linearGradient>
              </defs>
              <ellipse cx="100" cy="108" rx="78" ry="64" fill="url(#woodBody)" stroke="#c9a227"
                stroke-width="1.2" opacity="0.95" />
              <ellipse cx="100" cy="108" rx="78" ry="64" fill="url(#woodShine)" />
              <!-- 鱼鳞状弧纹 -->
              <g fill="none" stroke="#6b4423" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
                <path d="M 38 100 Q 100 78 162 100" />
                <path d="M 42 115 Q 100 95 158 115" />
                <path d="M 48 128 Q 100 110 152 128" />
                <path d="M 58 140 Q 100 125 142 140" />
              </g>
              <!-- 鱼眼（抽象） -->
              <circle cx="128" cy="88" r="5" fill="#2a1810" stroke="#d4a574" stroke-width="0.8" />
              <circle cx="129.5" cy="86.5" r="1.5" fill="rgba(255,255,255,0.5)" />
              <!-- 嘴缝 -->
              <path d="M 52 108 Q 38 108 34 102" stroke="#4a3020" stroke-width="2" fill="none"
                stroke-linecap="round" />
            </svg>
          </div>
        </button>

        <p class="mt-4 text-zinc-500 text-xs text-center leading-relaxed">
          点击或敲击木鱼 · 每满 <span class="text-amber-500/90 font-semibold">100</span> 功德，AI 赐一句开示
        </p>

        <!-- 自动敲 + 状态 -->
        <div class="mt-5 flex flex-wrap items-center justify-center gap-3 w-full">
          <button type="button" @click="toggleAuto()"
            class="px-4 py-2 rounded-xl text-sm font-semibold border transition"
            :class="autoTap
              ? 'bg-amber-600/25 border-amber-500/50 text-amber-200 shadow-[0_0_16px_rgba(245,158,11,0.2)]'
              : 'bg-zinc-800/80 border-zinc-600 text-zinc-300 hover:border-amber-700/50'">
            <span x-text="autoTap ? '停止自动敲' : '自动敲（每秒）'"></span>
          </button>
          <span x-show="zenLoading" class="text-xs text-amber-200/80 flex items-center gap-1">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
            禅师推演中…
          </span>
        </div>

        <!-- 当前开示（木鱼下方） -->
        <div class="mt-8 w-full panel-cyber rounded-2xl p-4 min-h-[4.5rem] border border-amber-900/25">
          <p class="text-xs text-zinc-500 mb-2 flex items-center gap-1">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500/80"></i>
            最新开示
          </p>
          <p class="text-amber-100/95 text-sm sm:text-base leading-relaxed whitespace-pre-wrap"
            x-show="!zenLoading || zenStreaming"
            x-text="zenStreaming || currentZen || '继续累积功德，满百即有因缘。'"></p>
        </div>
      </div>

      <p x-show="errorMsg" class="mt-4 text-sm text-red-300/90 bg-red-950/40 border border-red-800/50 rounded-xl px-3 py-2 w-full"
        x-text="errorMsg"></p>
    </main>

    <!-- 历史开示 -->
    <div x-show="showHistory" x-transition.opacity.duration.200ms
      class="fixed inset-0 z-[80] bg-black/65 flex items-end sm:items-center justify-center p-4"
      @keydown.escape.window="showHistory = false">
      <div class="panel-cyber rounded-2xl w-full max-w-md max-h-[70vh] flex flex-col shadow-2xl border border-amber-900/30"
        @click.outside="showHistory = false">
        <div class="flex items-center justify-between p-4 border-b border-zinc-700/60">
          <h2 class="font-bold text-amber-100 flex items-center gap-2">
            <i data-lucide="library" class="w-5 h-5 text-amber-500"></i>
            开示录
          </h2>
          <button type="button" @click="showHistory = false" class="p-2 rounded-lg hover:bg-zinc-800 text-zinc-400">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div class="overflow-y-auto p-4 space-y-3 flex-1">
          <template x-if="history.length === 0">
            <p class="text-zinc-500 text-sm text-center py-8">暂无记录，满百功德后自动生成。</p>
          </template>
          <template x-for="(h, idx) in history" :key="h.id">
            <div class="rounded-xl bg-zinc-900/60 border border-zinc-700/50 p-3">
              <p class="text-xs text-zinc-500 mb-1" x-text="formatTime(h.ts)"></p>
              <p class="text-sm text-zinc-200 leading-relaxed" x-text="h.text"></p>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- 功德榜（本地 Mock + 你的排名） -->
    <div x-show="showLeaderboard" x-transition.opacity.duration.200ms
      class="fixed inset-0 z-[80] bg-black/65 flex items-end sm:items-center justify-center p-4"
      @keydown.escape.window="showLeaderboard = false">
      <div class="panel-cyber rounded-2xl w-full max-w-md max-h-[70vh] flex flex-col shadow-2xl border border-amber-900/30"
        @click.outside="showLeaderboard = false">
        <div class="flex items-center justify-between p-4 border-b border-zinc-700/60">
          <h2 class="font-bold text-amber-100 flex items-center gap-2">
            <i data-lucide="crown" class="w-5 h-5 text-amber-500"></i>
            功德排行榜
          </h2>
          <button type="button" @click="showLeaderboard = false" class="p-2 rounded-lg hover:bg-zinc-800 text-zinc-400">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <p class="px-4 pt-3 text-xs text-zinc-500">赛博寺院局域网榜（演示数据），你的功德为本地真实累计。</p>
        <div class="overflow-y-auto p-4 space-y-2 flex-1">
          <template x-for="row in leaderboardRows" :key="row.rank + row.name">
            <div class="flex items-center justify-between rounded-xl px-3 py-2.5 border"
              :class="row.isYou
                ? 'bg-amber-950/40 border-amber-600/40 text-amber-100'
                : 'bg-zinc-900/40 border-zinc-700/40 text-zinc-300'">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-zinc-500 w-6 text-center font-mono text-sm" x-text="row.rank"></span>
                <span class="truncate font-medium" x-text="row.name"></span>
                <span x-show="row.isYou"
                  class="text-[10px] px-1.5 py-0.5 rounded bg-amber-600/30 text-amber-200 shrink-0">你</span>
              </div>
              <span class="text-gold-glow font-bold tabular-nums shrink-0" x-text="row.merit"></span>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- API 设置 -->
    <div x-show="showSettings" class="fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
      <div class="bg-zinc-900 border border-amber-900/40 rounded-2xl shadow-2xl w-full max-w-md p-6">
        <h3 class="text-lg font-bold text-amber-100 mb-4">API 配置</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm text-zinc-400 mb-1">DeepSeek API Key</label>
            <input type="password" x-model="apiConfig.deepseek"
              class="w-full rounded-xl border border-zinc-600 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 focus:ring-2 focus:ring-amber-600/50 focus:border-amber-600"
              placeholder="sk-..." autocomplete="off" />
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-1">模型</label>
            <select x-model="apiConfig.model"
              class="w-full rounded-xl border border-zinc-600 bg-zinc-950 px-3 py-2 text-sm text-zinc-100">
              <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
              <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
            </select>
          </div>
          <p class="text-xs text-zinc-500 leading-relaxed">
            密钥保存在浏览器本地，使用 <code class="text-amber-600/90">global_llm_config</code>；保存时<strong>合并</strong>写入，不会覆盖其他工具字段。
          </p>
        </div>
        <div class="mt-6 flex justify-end gap-2">
          <button type="button" @click="showSettings = false"
            class="px-4 py-2 rounded-xl text-zinc-400 hover:bg-zinc-800">取消</button>
          <button type="button" @click="saveConfig()"
            class="px-4 py-2 rounded-xl bg-amber-700 hover:bg-amber-600 text-white font-medium">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /** localStorage：本页功德与开示（与 global_llm_config 分离） */
    const STORAGE_GAME = 'cyber_muyu_game_v1';

    /**
     * Web Audio API 合成短促低频「咚」声，模拟木鱼敲击
     * @param {AudioContext} ctx
     */
    function playDongSound(ctx) {
      const t0 = ctx.currentTime;
      const dur = 0.28;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, t0);
      osc.frequency.exponentialRampToValueAtTime(55, t0 + 0.07);

      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.exponentialRampToValueAtTime(0.42, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur);

      /** 略加高频泛音，让音色更「实」 */
      const osc2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(380, t0);
      osc2.frequency.exponentialRampToValueAtTime(120, t0 + 0.05);
      g2.gain.setValueAtTime(0.001, t0);
      g2.gain.exponentialRampToValueAtTime(0.08, t0 + 0.01);
      g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
      osc2.connect(g2);
      g2.connect(ctx.destination);
      osc2.start(t0);
      osc2.stop(t0 + 0.15);
    }

    /**
     * 今日日期键 YYYY-MM-DD（本地时区）
     */
    function todayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function cyberMuyu() {
      return {
        totalMerit: 0,
        todayMerit: 0,
        savedDate: '',
        history: [],
        floatTexts: [],
        floatId: 0,
        muyuPressed: false,
        goldBurst: false,
        autoTap: false,
        autoTimer: null,
        audioCtx: null,
        currentZen: '',
        zenStreaming: '',
        zenLoading: false,
        /** 连续满百时排队生成开示，避免流式输出互相覆盖 */
        zenQueue: [],
        zenProcessing: false,
        errorMsg: '',
        showSettings: false,
        showHistory: false,
        showLeaderboard: false,
        apiConfig: { deepseek: '', model: 'deepseek-v4-flash' },

        /**
         * 排行榜 Mock：赛博法号 + 虚拟功德，与真实「你」合并排序
         */
        mockSangha: [
          { name: '无相 CPU', merit: 188800 },
          { name: '福报缓存', merit: 99600 },
          { name: '摸鱼金刚', merit: 88200 },
          { name: 'Deadline 菩萨', merit: 66666 },
          { name: '内耗尊者', merit: 52000 },
          { name: '通勤罗汉', merit: 38800 },
          { name: 'OKR 头陀', merit: 21000 },
          { name: '带薪悟道', merit: 12800 }
        ],

        init() {
          this.loadGame();
          this.loadConfig();
          this.$watch('showHistory', (v) => {
            if (v) this.$nextTick(() => lucide.createIcons());
          });
          this.$watch('showLeaderboard', (v) => {
            if (v) this.$nextTick(() => lucide.createIcons());
          });
          this.$watch('showSettings', (v) => {
            if (v) this.$nextTick(() => lucide.createIcons());
          });
          this.$watch('autoTap', (on) => {
            if (on) {
              if (this.autoTimer) clearInterval(this.autoTimer);
              this.autoTimer = setInterval(() => this.onTap(), 1000);
            } else if (this.autoTimer) {
              clearInterval(this.autoTimer);
              this.autoTimer = null;
            }
          });
          this.$nextTick(() => lucide.createIcons());
        },

        /** 合并加载 global_llm_config（仅 deepseek / model 等字段） */
        loadConfig() {
          try {
            const saved = localStorage.getItem('global_llm_config');
            if (saved) {
              this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
            }
          } catch (e) {
            console.error('解析 global_llm_config 失败:', e);
          }
        },

        /**
         * 保存 API：合并写入 global_llm_config，禁止整表覆盖
         */
        saveConfig() {
          let current = {};
          try {
            current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
          } catch (e) {
            console.error('读取旧配置失败:', e);
          }
          localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...this.apiConfig }));
          this.showSettings = false;
        },

        /** 读取 / 校验今日功德是否跨日重置 */
        loadGame() {
          try {
            const raw = localStorage.getItem(STORAGE_GAME);
            const tk = todayKey();
            if (raw) {
              const g = JSON.parse(raw);
              this.totalMerit = Number(g.totalMerit) || 0;
              this.savedDate = g.savedDate || tk;
              if (this.savedDate !== tk) {
                this.todayMerit = 0;
                this.savedDate = tk;
              } else {
                this.todayMerit = Number(g.todayMerit) || 0;
              }
              this.history = Array.isArray(g.history) ? g.history : [];
            } else {
              this.savedDate = tk;
              this.todayMerit = 0;
            }
          } catch (e) {
            console.error('读取本地功德失败:', e);
            this.savedDate = todayKey();
          }
        },

        persistGame() {
          const payload = {
            totalMerit: this.totalMerit,
            todayMerit: this.todayMerit,
            savedDate: this.savedDate,
            history: this.history.slice(0, 50)
          };
          try {
            localStorage.setItem(STORAGE_GAME, JSON.stringify(payload));
          } catch (e) {
            console.error('保存失败:', e);
          }
        },

        /**
         * 计算展示用排行榜（含当前用户插入排序）
         */
        get leaderboardRows() {
          const you = { name: '你（本机）', merit: this.totalMerit, isYou: true };
          const rows = [...this.mockSangha.map((x) => ({ ...x, isYou: false })), you]
            .sort((a, b) => b.merit - a.merit)
            .slice(0, 12)
            .map((r, i) => ({ ...r, rank: i + 1 }));
          return rows;
        },

        formatTime(ts) {
          const d = new Date(ts);
          return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        },

        toggleAuto() {
          this.autoTap = !this.autoTap;
          this.$nextTick(() => lucide.createIcons());
        },

        /**
         * 确保 AudioContext 处于 running（需用户手势解锁）
         */
        ensureAudio() {
          if (!this.audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.audioCtx = new AC();
          }
          if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume().catch(() => {});
          }
        },

        /**
         * 单次敲击：动画、音效、功德+1、满百触发 AI
         */
        onTap() {
          this.errorMsg = '';
          this.ensureAudio();
          if (this.audioCtx) {
            try {
              playDongSound(this.audioCtx);
            } catch (e) {
              console.warn('音效播放失败', e);
            }
          }

          this.muyuPressed = true;
          setTimeout(() => { this.muyuPressed = false; }, 110);

          const fid = ++this.floatId;
          const offset = Math.round((Math.random() - 0.5) * 36);
          this.floatTexts.push({ id: fid, text: '功德 +1', offset });
          setTimeout(() => {
            this.floatTexts = this.floatTexts.filter((x) => x.id !== fid);
          }, 1000);

          const tk = todayKey();
          if (this.savedDate !== tk) {
            this.todayMerit = 0;
            this.savedDate = tk;
          }
          this.totalMerit += 1;
          this.todayMerit += 1;
          this.persistGame();

          if (this.totalMerit > 0 && this.totalMerit % 100 === 0) {
            this.triggerGoldBurst();
            this.enqueueZen(this.totalMerit);
          }
        },

        /**
         * 将满百里程碑加入队列，顺序调用 AI（自动敲时不会并发打乱）
         * @param {number} meritAtMilestone 触发时的累计功德
         */
        enqueueZen(meritAtMilestone) {
          this.zenQueue.push(meritAtMilestone);
          this.processZenQueue();
        },

        async processZenQueue() {
          if (this.zenProcessing) return;
          this.zenProcessing = true;
          this.zenLoading = true;
          try {
            while (this.zenQueue.length > 0) {
              const m = this.zenQueue.shift();
              this.zenStreaming = '';
              await this.runZenRequest(m);
            }
          } finally {
            this.zenLoading = false;
            this.zenProcessing = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        /** 满百时的金光反馈（短时 CSS 动画类） */
        triggerGoldBurst() {
          this.goldBurst = true;
          setTimeout(() => { this.goldBurst = false; }, 1400);
        },

        /**
         * 执行单次开示请求（由队列统一控制 zenLoading）
         * @param {number} meritAtMilestone 该次开示对应的累计功德（里程碑值）
         */
        async runZenRequest(meritAtMilestone) {
          const key = (this.apiConfig.deepseek || '').trim();
          if (!key) {
            this.errorMsg = '已满百功德，但未配置 API Key。请点击右上角设置。';
            this.showSettings = true;
            this.zenQueue = [];
            return;
          }

          const systemPrompt = `你是「赛博禅寺」里的幽默禅师，说话半文半白，短句有力。
用户是当代打工人。开示要结合现代困境（加班、内耗、KPI、通勤、摸鱼等），但语气慈悲、带一点自嘲与智慧，不要说教骂人。
硬性要求：只输出一句话（一段连续文字），30～80 个汉字为宜；不要标题、不要引号、不要换行、不要列表、不要 markdown。`;

          const userPrompt = `用户累计敲击电子木鱼 ${meritAtMilestone} 次（刚满一百的倍数）。请赐一句开示。`;

          try {
            const full = await this.streamDeepSeek(
              [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userPrompt }
              ],
              (chunk) => { this.zenStreaming += chunk; },
              () => { /* V4 Pro 推理过程可忽略，仅收正文 */ }
            );
            const line = (full || this.zenStreaming || '').trim().replace(/\s+/g, ' ');
            this.currentZen = line || '因缘具足，功德自成；下班路上，亦是修行。';
            this.history.unshift({
              id: Date.now(),
              text: this.currentZen,
              ts: Date.now()
            });
            this.zenStreaming = '';
            this.persistGame();
          } catch (e) {
            console.error(e);
            this.errorMsg = e.message || '开示生成失败，请检查网络与密钥。';
            this.currentZen = '网络如浮云，开示暂不可得；心净则国土净，稍后再试。';
          }
        },

        /**
         * DeepSeek 流式请求（文本模式，非 JSON）
         * @returns {Promise<string>} 拼接后的全文
         */
        async streamDeepSeek(messages, onDelta, onReasoning) {
          const key = (this.apiConfig.deepseek || '').trim();
          const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + key
            },
            body: JSON.stringify({
              model: this.apiConfig.model || 'deepseek-v4-flash',
              messages,
              stream: true,
              temperature: 0.88,
              max_tokens: 256
            })
          });

          if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(err.error?.message || 'HTTP ' + response.status);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let full = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const t = line.trim();
              if (!t.startsWith('data:')) continue;
              const data = t.slice(5).trim();
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                const delta = parsed.choices?.[0]?.delta;
                if (!delta) continue;
                if (delta.reasoning_content && onReasoning) {
                  onReasoning(delta.reasoning_content);
                }
                if (delta.content) {
                  full += delta.content;
                  onDelta(delta.content);
                }
              } catch (err) {
                console.warn('SSE 解析跳过', err);
              }
            }
          }
          return full;
        }
      };
    }
  </script>
