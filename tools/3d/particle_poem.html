  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle Poem 3D · 粒子诗歌云</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0b1022 45%, #05060c 100%);
      color: #e2e8f0;
      overflow: hidden;
    }
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .panel {
      position: fixed;
      left: 32px;
      top: 32px;
      width: min(360px, 90vw);
      padding: 20px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.4);
    }
    .panel h1 {
      margin: 0 0 10px;
      font-size: 20px;
    }
    .panel p {
      margin: 0 0 16px;
      font-size: 13px;
      color: #c7d2fe;
      line-height: 1.6;
    }
    .panel input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.65);
      color: #f8fafc;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .panel button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: linear-gradient(120deg, #38bdf8, #f472b6);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
    .poem-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.6);
      font-size: 13px;
      line-height: 1.6;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #a5b4fc;
    }
    .settings {
      position: fixed;
      top: 24px;
      right: 24px;
    }
    .settings button {
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.7);
      color: #e2e8f0;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
    }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.65);
      backdrop-filter: blur(8px);
      z-index: 50;
    }
    .modal.active {
      display: flex;
    }
    .modal-card {
      width: min(420px, 90vw);
      background: rgba(15, 23, 42, 0.95);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 30px 70px rgba(15, 23, 42, 0.65);
    }
    .modal-card h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }
    .modal-card label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #cbd5f5;
    }
    .modal-card input,
    .modal-card select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.7);
      color: #f8fafc;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .modal-actions button {
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      background: #334155;
      color: #e2e8f0;
    }
    .modal-actions .primary {
      background: linear-gradient(120deg, #38bdf8, #f472b6);
      color: #0f172a;
      font-weight: 600;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>

<body>
  <canvas id="canvas"></canvas>

  <div class="panel">
    <h1>粒子诗歌云 · Particle Poem</h1>
    <p>输入一段话，DeepSeek 会生成诗意短句与关键词，粒子云将随之变形并漂浮。</p>
    <input id="topicInput" placeholder="例如：海边的风，带着一点点离别" />
    <button id="generateBtn">生成粒子诗歌</button>
    <div class="status" id="statusText">等待输入。</div>
    <div class="poem-box" id="poemBox">尚未生成。</div>
  </div>

  <div class="settings">
    <button id="settingsBtn">DeepSeek 设置</button>
  </div>

  <div class="modal" id="settingsModal">
    <form class="modal-card" id="settingsForm">
      <h2>DeepSeek API 设置</h2>
      <label>API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="current-password" />
      <label>模型</label>
      <select id="modelSelect">
        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
      </select>
      <div class="modal-actions">
        <button type="button" id="closeModal">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('statusText');
    const poemBox = document.getElementById('poemBox');
    const generateBtn = document.getElementById('generateBtn');
    const topicInput = document.getElementById('topicInput');

    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsForm = document.getElementById('settingsForm');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelSelect = document.getElementById('modelSelect');
    const closeModal = document.getElementById('closeModal');

    const config = {
      apiKey: '',
      model: 'deepseek-v4-flash'
    };

    const loadConfig = () => {
      const raw = localStorage.getItem('global_llm_config');
      if (!raw) return;
      const parsed = JSON.parse(raw);
      config.apiKey = parsed.apiKey || parsed.deepseek || parsed.deepseek_key || '';
      config.model = parsed.model || 'deepseek-v4-flash';
    };

    const saveConfig = () => {
      const payload = {
        apiKey: config.apiKey,
        deepseek: config.apiKey,
        deepseek_key: config.apiKey,
        model: config.model
      };
      localStorage.setItem('global_llm_config', JSON.stringify(payload));
    };

    loadConfig();
    apiKeyInput.value = config.apiKey;
    modelSelect.value = config.model;

    settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
    closeModal.addEventListener('click', () => settingsModal.classList.remove('active'));
    
    settingsForm.addEventListener('submit', (e) => {
      e.preventDefault();
      config.apiKey = apiKeyInput.value.trim();
      config.model = modelSelect.value;
      saveConfig();
      settingsModal.classList.remove('active');
      statusText.textContent = config.apiKey ? 'DeepSeek Key 已保存。' : '未配置 DeepSeek Key，将使用默认粒子云。';
    });

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05060c, 6, 50);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2, 9);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);

    const light = new THREE.PointLight(0x93c5fd, 2.2, 60);
    light.position.set(6, 5, 6);
    scene.add(light);

    let particleGroup = new THREE.Group();
    scene.add(particleGroup);
    let keywordMeshes = [];

    const createParticles = (data) => {
      particleGroup.clear();
      keywordMeshes = [];

      const palette = data.palette || ['#38bdf8', '#f472b6', '#fcd34d'];
      const density = data.density ?? 0.8;
      const drift = data.drift ?? 0.6;
      const spark = data.spark ?? 0.7;
      const count = Math.floor(600 * density);

      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i += 1) {
        positions[i * 3] = (Math.random() - 0.5) * 8;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 4;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 8;
      }
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        size: 0.06 + spark * 0.05,
        color: new THREE.Color(palette[0]),
        transparent: true,
        opacity: 0.85
      });
      const points = new THREE.Points(geometry, material);
      points.userData = { drift };
      particleGroup.add(points);

      const glowGeometry = new THREE.SphereGeometry(1.8 + drift, 32, 32);
      const glowMaterial = new THREE.MeshBasicMaterial({
        color: new THREE.Color(palette[1] || palette[0]),
        transparent: true,
        opacity: 0.1
      });
      const glow = new THREE.Mesh(glowGeometry, glowMaterial);
      particleGroup.add(glow);

      const keywords = data.keywords || [];
      keywords.forEach((word, index) => {
        const sprite = createTextSprite(word, palette[index % palette.length]);
        sprite.position.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 6);
        sprite.userData = { offset: Math.random() * Math.PI * 2 };
        particleGroup.add(sprite);
        keywordMeshes.push(sprite);
      });
    };

    const createTextSprite = (text, color) => {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = color;
      context.font = 'bold 48px "PingFang SC", sans-serif';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.shadowColor = color;
      context.shadowBlur = 18;
      context.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(2.4, 0.6, 1);
      return sprite;
    };

    const defaultData = {
      poem: '海风轻轻推着夜色，回忆像星光在浪里闪烁。',
      keywords: ['海风', '月光', '远航', '回忆'],
      palette: ['#38bdf8', '#f472b6', '#fcd34d'],
      density: 0.8,
      drift: 0.6,
      spark: 0.7
    };

    createParticles(defaultData);
    poemBox.textContent = defaultData.poem;

    const buildPrompt = (topic) => `根据主题“${topic}”生成粒子诗歌云的 JSON。只返回 JSON。字段包括 poem(短诗), keywords(4-6个词), palette(3色), density(0.4-1), drift(0.3-1), spark(0.3-1)。`;

    const callDeepSeek = async (prompt) => {
      if (!config.apiKey) return null;
      const response = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.apiKey}`
        },
        body: JSON.stringify({
          model: config.model,
          messages: [
            { role: 'system', content: '你是视觉艺术与诗歌生成助手。' },
            { role: 'user', content: prompt }
          ],
          temperature: 0.85
        })
      });
      if (!response.ok) {
        throw new Error(`API 请求失败: ${response.status}`);
      }
      const data = await response.json();
      return data.choices?.[0]?.message?.content || '';
    };

    const safeParse = (content) => {
      const jsonStart = content.indexOf('{');
      const jsonEnd = content.lastIndexOf('}');
      if (jsonStart === -1 || jsonEnd === -1) return null;
      return JSON.parse(content.slice(jsonStart, jsonEnd + 1));
    };

    generateBtn.addEventListener('click', async () => {
      const topic = topicInput.value.trim();
      if (!topic) {
        statusText.textContent = '请输入主题内容。';
        return;
      }
      
      if (!config.apiKey) {
         statusText.textContent = '未配置 DeepSeek API Key，将展示默认演示效果。请点击右上角设置配置 Key。';
         const applied = { ...defaultData, poem: '（演示模式）请配置 API Key 以启用 AI 生成。' };
         createParticles(applied);
         poemBox.textContent = applied.poem;
         return;
      }

      statusText.textContent = 'DeepSeek 正在生成诗歌云…';
      try {
        const content = await callDeepSeek(buildPrompt(topic));
        const data = content ? safeParse(content) : null;
        const applied = data || { ...defaultData, poem: 'AI 返回数据解析失败，已使用默认效果。', keywords: ['云雾', '星光', '回响', '潮汐'] };
        createParticles(applied);
        poemBox.textContent = applied.poem || '粒子诗歌已生成。';
        statusText.textContent = data ? '粒子诗歌已生成。' : '未解析到有效 JSON，已使用默认效果。';
      } catch (error) {
        statusText.textContent = `生成失败：${error.message}`;
      }
    });

    const animate = () => {
      requestAnimationFrame(animate);
      const time = performance.now() * 0.0004;

      particleGroup.rotation.y += 0.0006;
      keywordMeshes.forEach((sprite, index) => {
        sprite.position.y = Math.sin(time * 2 + sprite.userData.offset) * 0.6;
        sprite.position.x += Math.sin(time + index) * 0.0008;
      });

      controls.update();
      renderer.render(scene, camera);
    };

    const onResize = () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    };

    window.addEventListener('resize', onResize);
    onResize();
    animate();
  </script>
