  <meta charset="UTF-8" />

  <title>Mood Curve 3D · 心情曲线</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1b1b3a 0%, #070910 50%, #040407 100%);
      color: #e5e7eb;
      min-height: 100vh;
      overflow: hidden;
    }
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 32px;
      left: 32px;
      max-width: 360px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 60px rgba(15, 23, 42, 0.45);
    }
    .overlay h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    .overlay p {
      margin: 0 0 16px;
      font-size: 13px;
      color: #cbd5f5;
      line-height: 1.6;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.6);
      color: #f8fafc;
      padding: 10px 12px;
      font-size: 14px;
    }
    .input-row button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: linear-gradient(120deg, #7c3aed, #22d3ee);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .input-row button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(34, 211, 238, 0.25);
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #a5b4fc;
    }
    .card {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.6);
      font-size: 13px;
      line-height: 1.5;
    }
    .card strong {
      display: block;
      margin-bottom: 6px;
      color: #f8fafc;
    }
    .settings {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .settings button {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 999px;
      color: #e2e8f0;
      padding: 10px 16px;
      cursor: pointer;
    }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(8px);
      z-index: 40;
    }
    .modal.active {
      display: flex;
    }
    .modal-card {
      width: min(420px, 90vw);
      background: rgba(15, 23, 42, 0.95);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.6);
    }
    .modal-card h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }
    .modal-card label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #cbd5f5;
    }
    .modal-card input,
    .modal-card select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.6);
      color: #f8fafc;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .modal-actions button {
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      background: #334155;
      color: #e2e8f0;
    }
    .modal-actions .primary {
      background: linear-gradient(120deg, #22d3ee, #a855f7);
      color: #0f172a;
      font-weight: 600;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>

<body>
  <canvas id="canvas"></canvas>

  <div class="overlay">
    <h1>心情曲线 · Mood Curve 3D</h1>
    <p>输入你的心情描述，DeepSeek 会生成一条情绪曲线，曲线将变成 3D 霓虹管道并附着流动粒子。</p>
    <div class="input-row">
      <input id="moodInput" placeholder="例如：像晚风一样轻松，却带一点点不舍" />
      <button id="generateBtn">生成曲线</button>
    </div>
    <div class="status" id="statusText">等待输入。</div>
    <div class="card" id="storyCard">
      <strong>尚未生成</strong>
      <span>请先输入心情描述。</span>
    </div>
  </div>

  <div class="settings">
    <button id="settingsBtn">DeepSeek 设置</button>
  </div>

  <div class="modal" id="settingsModal">
    <form class="modal-card" id="settingsForm">
      <h2>DeepSeek API 设置</h2>
      <label>API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="current-password" />
      <label>模型</label>
      <select id="modelSelect">
        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
      </select>
      <div class="modal-actions">
        <button type="button" id="closeModal">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('statusText');
    const storyCard = document.getElementById('storyCard');
    const generateBtn = document.getElementById('generateBtn');
    const moodInput = document.getElementById('moodInput');

    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsForm = document.getElementById('settingsForm');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelSelect = document.getElementById('modelSelect');
    const closeModal = document.getElementById('closeModal');

    const config = {
      apiKey: '',
      model: 'deepseek-v4-flash'
    };

    const loadConfig = () => {
      const raw = localStorage.getItem('global_llm_config');
      if (!raw) return;
      const parsed = JSON.parse(raw);
      config.apiKey = parsed.apiKey || parsed.deepseek || parsed.deepseek_key || '';
      config.model = parsed.model || 'deepseek-v4-flash';
    };

    const saveConfig = () => {
      const payload = {
        apiKey: config.apiKey,
        deepseek: config.apiKey,
        deepseek_key: config.apiKey,
        model: config.model
      };
      localStorage.setItem('global_llm_config', JSON.stringify(payload));
    };

    loadConfig();
    apiKeyInput.value = config.apiKey;
    modelSelect.value = config.model;

    settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
    closeModal.addEventListener('click', () => settingsModal.classList.remove('active'));
    
    settingsForm.addEventListener('submit', (e) => {
      e.preventDefault();
      config.apiKey = apiKeyInput.value.trim();
      config.model = modelSelect.value;
      saveConfig();
      settingsModal.classList.remove('active');
      statusText.textContent = config.apiKey ? 'DeepSeek Key 已保存。' : '未配置 DeepSeek Key，将使用默认曲线。';
    });

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05060f, 6, 40);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2.5, 9);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);

    const keyLight = new THREE.PointLight(0x8b5cf6, 2, 50);
    keyLight.position.set(6, 6, 6);
    scene.add(keyLight);

    const secondaryLight = new THREE.PointLight(0x22d3ee, 2, 50);
    secondaryLight.position.set(-6, -4, -6);
    scene.add(secondaryLight);

    const starGeometry = new THREE.BufferGeometry();
    const starCount = 600;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i += 1) {
      starPositions[i * 3] = (Math.random() - 0.5) * 120;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 120;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 120;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, opacity: 0.7, transparent: true });
    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);

    let curveGroup = new THREE.Group();
    scene.add(curveGroup);
    let curvePoints = [];
    let particles = [];

    const createCurve = (params) => {
      curveGroup.clear();
      curvePoints = [];
      particles = [];

      const palette = params.palette || ['#8b5cf6', '#22d3ee', '#f97316'];
      const curveType = params.curveType || 'spiral';
      const amplitude = params.amplitude || 1.2;
      const frequency = params.frequency || 2.0;
      const turns = params.turns || 4.0;
      const energy = params.energy || 0.7;
      const particleCount = params.particleCount || 200;

      const points = [];
      const total = 280;
      for (let i = 0; i < total; i += 1) {
        const t = i / (total - 1);
        const angle = t * Math.PI * 2 * turns;
        let x = 0;
        let y = 0;
        let z = 0;
        if (curveType === 'sine') {
          x = (t - 0.5) * 10;
          y = Math.sin(t * Math.PI * 2 * frequency) * amplitude;
          z = Math.cos(t * Math.PI * 2 * frequency) * amplitude * 0.6;
        } else if (curveType === 'helix') {
          x = Math.cos(angle) * amplitude * 1.5;
          y = (t - 0.5) * 8;
          z = Math.sin(angle) * amplitude * 1.5;
        } else {
          x = Math.cos(angle) * amplitude * (1.4 + energy);
          y = Math.sin(angle * 0.6) * amplitude * 0.8;
          z = Math.sin(angle) * amplitude * (1.4 + energy);
        }
        points.push(new THREE.Vector3(x, y, z));
      }

      curvePoints = points;
      const curve = new THREE.CatmullRomCurve3(points);
      const geometry = new THREE.TubeGeometry(curve, 300, 0.14 + energy * 0.08, 20, false);
      const tubeMaterial = new THREE.MeshStandardMaterial({
        color: new THREE.Color(palette[0]),
        emissive: new THREE.Color(palette[1] || palette[0]),
        emissiveIntensity: 1.2,
        roughness: 0.2,
        metalness: 0.3
      });
      const tube = new THREE.Mesh(geometry, tubeMaterial);
      curveGroup.add(tube);

      const ringGeometry = new THREE.TorusGeometry(3.6, 0.03, 16, 100);
      const ringMaterial = new THREE.MeshBasicMaterial({ color: palette[2] || palette[0] });
      const ring = new THREE.Mesh(ringGeometry, ringMaterial);
      ring.rotation.x = Math.PI / 2.6;
      curveGroup.add(ring);

      const particleGeometry = new THREE.SphereGeometry(0.04, 16, 16);
      for (let i = 0; i < particleCount; i += 1) {
        const color = new THREE.Color(palette[i % palette.length]);
        const particleMaterial = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.5 });
        const particle = new THREE.Mesh(particleGeometry, particleMaterial);
        particle.userData = { t: Math.random() };
        curveGroup.add(particle);
        particles.push(particle);
      }
    };

    const defaultParams = {
      title: '夜色安静，心跳轻轻发光',
      palette: ['#8b5cf6', '#22d3ee', '#f97316'],
      curveType: 'spiral',
      amplitude: 1.3,
      frequency: 2.1,
      turns: 4.5,
      energy: 0.75,
      particleCount: 200,
      story: '像柔和的涟漪向外扩散，带着细微的期待感。'
    };

    createCurve(defaultParams);
    storyCard.innerHTML = `<strong>${defaultParams.title}</strong><span>${defaultParams.story}</span>`;

    const buildPrompt = (mood) => `你是一个情绪视觉设计师。根据“${mood}”生成 3D 情绪曲线参数。只返回 JSON，不要任何多余文字。JSON 字段遵守：title, palette(数组), curveType(spiral|sine|helix), amplitude(0.6-2.2), frequency(1.4-3.2), turns(2-6), energy(0.4-1.0), particleCount(120-320), glow(0-1), story。`;

    const callDeepSeek = async (prompt) => {
      if (!config.apiKey) return null;
      const response = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.apiKey}`
        },
        body: JSON.stringify({
          model: config.model,
          messages: [
            { role: 'system', content: '你是专业的 3D 动效与视觉设计助手。' },
            { role: 'user', content: prompt }
          ],
          temperature: 0.8
        })
      });
      if (!response.ok) {
        throw new Error(`API 请求失败: ${response.status}`);
      }
      const data = await response.json();
      return data.choices?.[0]?.message?.content || '';
    };

    const safeParse = (content) => {
      const jsonStart = content.indexOf('{');
      const jsonEnd = content.lastIndexOf('}');
      if (jsonStart === -1 || jsonEnd === -1) return null;
      const jsonText = content.slice(jsonStart, jsonEnd + 1);
      return JSON.parse(jsonText);
    };

    generateBtn.addEventListener('click', async () => {
      const mood = moodInput.value.trim();
      if (!mood) {
        statusText.textContent = '请输入心情描述。';
        return;
      }
      
      if (!config.apiKey) {
         statusText.textContent = '尚未配置 DeepSeek API Key，已展示默认演示效果。请点击右上角设置配置 Key 以生成定制曲线。';
         const applied = { ...defaultParams, title: mood, story: '（演示模式）请配置 API Key 以启用 AI 生成。' };
         createCurve(applied);
         storyCard.innerHTML = `<strong>${applied.title}</strong><span>${applied.story}</span>`;
         return;
      }

      statusText.textContent = 'DeepSeek 正在绘制曲线…';
      generateBtn.disabled = true;
      generateBtn.textContent = '生成中...';
      
      try {
        const content = await callDeepSeek(buildPrompt(mood));
        const params = content ? safeParse(content) : null;
        const applied = params || { ...defaultParams, title: mood, story: 'AI 返回数据解析失败，已使用默认曲线。' };
        createCurve(applied);
        storyCard.innerHTML = `<strong>${applied.title || mood}</strong><span>${applied.story || '情绪曲线已生成。'}</span>`;
        statusText.textContent = params ? '曲线已生成。' : '未读取到有效 JSON，已使用默认曲线。';
      } catch (error) {
        statusText.textContent = `生成失败：${error.message}`;
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = '生成曲线';
      }
    });

    const animate = () => {
      requestAnimationFrame(animate);
      const time = performance.now() * 0.0004;
      starField.rotation.y += 0.0005;
      curveGroup.rotation.y += 0.0006;

      particles.forEach((particle, index) => {
        const speed = 0.002 + (index % 10) * 0.0002;
        particle.userData.t = (particle.userData.t + speed) % 1;
        if (curvePoints.length) {
          const pointIndex = Math.floor(particle.userData.t * (curvePoints.length - 1));
          const nextIndex = (pointIndex + 1) % curvePoints.length;
          const alpha = particle.userData.t * (curvePoints.length - 1) - pointIndex;
          const position = curvePoints[pointIndex].clone().lerp(curvePoints[nextIndex], alpha);
          particle.position.copy(position);
        }
      });

      controls.update();
      renderer.render(scene, camera);
    };

    const onResize = () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    };

    window.addEventListener('resize', onResize);
    onResize();
    animate();
  </script>
