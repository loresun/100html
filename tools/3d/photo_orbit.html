  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery 3D · 多模式相册</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1f2937 0%, #0b1022 50%, #05060c 100%);
      color: #e2e8f0;
      overflow: hidden;
    }
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* 面板样式 */
    .panel {
      position: fixed;
      left: 32px;
      top: 32px;
      width: min(340px, 88vw);
      padding: 20px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.5);
      z-index: 10;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
    }
    .panel.hidden {
      transform: translateX(-110%);
      opacity: 0;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .panel h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .panel-toggle {
      position: fixed;
      left: 24px;
      top: 24px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      color: #e2e8f0;
      font-size: 20px;
      cursor: pointer;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .panel-toggle:hover {
      background: rgba(56, 189, 248, 0.3);
      transform: scale(1.05);
    }

    /* 模式选择器 */
    .mode-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-btn {
      padding: 10px 6px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.5);
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .mode-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .mode-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(34, 211, 238, 0.2));
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .mode-btn .icon {
      font-size: 20px;
      display: block;
      margin-bottom: 4px;
    }

    /* 上传区域 */
    .upload-box {
      border: 1px dashed rgba(148, 163, 184, 0.4);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      background: rgba(15, 23, 42, 0.4);
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-box.dragover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }
    .upload-box input {
      display: none;
    }
    .upload-box label {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: linear-gradient(120deg, #38bdf8, #22d3ee);
      color: #0f172a;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .upload-box span {
      display: block;
      font-size: 11px;
      color: #94a3b8;
    }
    .status {
      margin-top: 12px;
      font-size: 11px;
      color: #a5b4fc;
    }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #fbbf24;
      opacity: 0.9;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      cursor: zoom-out;
    }
    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      transform: scale(0.92);
      transition: transform 0.3s ease;
    }
    .lightbox.active img {
      transform: scale(1);
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      width: 40px;
      height: 40px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .lightbox-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .lightbox-nav.prev { left: 16px; }
    .lightbox-nav.next { right: 16px; }

    /* 模式描述 */
    .mode-desc {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 12px;
      line-height: 1.5;
      padding: 8px 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
    }

    /* 速度控制 */
    .speed-control {
      margin-bottom: 14px;
    }
    .speed-control label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #94a3b8;
    }
    .speed-control input[type="range"] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(148, 163, 184, 0.3);
      appearance: none;
      cursor: pointer;
    }
    .speed-control input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }
    .speed-control #speedValue {
      min-width: 36px;
      text-align: right;
      color: #38bdf8;
      font-weight: 600;
    }
  </style>

      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",

      }
    }

<body>
  <canvas id="canvas"></canvas>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <button class="lightbox-nav prev" id="lightboxPrev">‹</button>
    <img id="lightboxImg" src="" alt="放大图片" />
    <button class="lightbox-nav next" id="lightboxNext">›</button>
    <div class="lightbox-hint">点击关闭 · ← → 切换 · ESC 退出</div>
  </div>

  <!-- 面板切换按钮 -->
  <button class="panel-toggle" id="panelToggle" title="显示/隐藏面板">☰</button>

  <!-- 控制面板 -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <h1>🎨 3D 相册</h1>
      <button class="panel-toggle" onclick="togglePanel()" style="position:static;width:32px;height:32px;font-size:16px;">✕</button>
    </div>

    <!-- 模式选择 -->
    <div class="mode-selector" id="modeSelector">
      <button class="mode-btn active" data-mode="ring">
        <span class="icon">💫</span>星环
      </button>
      <button class="mode-btn" data-mode="starry">
        <span class="icon">✨</span>星空
      </button>
      <button class="mode-btn" data-mode="tree">
        <span class="icon">🎄</span>圣诞树
      </button>
      <button class="mode-btn" data-mode="gallery">
        <span class="icon">🖼️</span>画廊
      </button>
      <button class="mode-btn" data-mode="scroll">
        <span class="icon">📜</span>横向流
      </button>
    </div>

    <div class="mode-desc" id="modeDesc">照片环绕旋转，如同行星轨道</div>

    <!-- 速度控制 -->
    <div class="speed-control">
      <label>
        <span>动画速度</span>
        <input type="range" id="speedSlider" min="0" max="200" value="100" />
        <span id="speedValue">1.0x</span>
      </label>
    </div>

    <div class="upload-box" id="dropZone">
      <label for="fileInput">上传照片</label>
      <input type="file" id="fileInput" accept="image/*" multiple />
      <span>支持多选或拖拽</span>
    </div>
    <div class="status" id="statusText">等待上传照片</div>
    <div class="hint">点击照片放大 · 拖动旋转视角</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // === DOM 元素 ===
    const canvas = document.getElementById('canvas');
    const fileInput = document.getElementById('fileInput');
    const statusText = document.getElementById('statusText');
    const dropZone = document.getElementById('dropZone');
    const panel = document.getElementById('panel');
    const panelToggle = document.getElementById('panelToggle');
    const modeSelector = document.getElementById('modeSelector');
    const modeDesc = document.getElementById('modeDesc');

    // === Three.js 初始化 ===
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05060c, 8, 80);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 3, 12);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 3;
    controls.maxDistance = 50;

    // 灯光
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);

    const keyLight = new THREE.PointLight(0x38bdf8, 2.5, 80);
    keyLight.position.set(8, 8, 8);
    scene.add(keyLight);

    const backLight = new THREE.PointLight(0xf472b6, 1.8, 80);
    backLight.position.set(-8, -4, -8);
    scene.add(backLight);

    const fillLight = new THREE.PointLight(0x22d3ee, 1.2, 60);
    fillLight.position.set(-6, 6, 4);
    scene.add(fillLight);

    // === 状态管理 ===
    const photoGroup = new THREE.Group();
    scene.add(photoGroup);
    const photoCards = [];
    const photoTextures = [];
    const photoUrls = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let currentMode = 'ring';
    let targetCameraPos = new THREE.Vector3(0, 3, 12);
    let targetLookAt = new THREE.Vector3(0, 0, 0);

    // 模式描述
    const modeDescriptions = {
      ring: '照片环绕旋转，如同行星轨道',
      starry: '照片散落星空，随风轻轻摇曳',
      tree: '照片挂在圣诞树上，节日氛围',
      gallery: '画廊墙面，照片缓缓上升',
      scroll: '横向无限滚动，拼贴画廊风格'
    };

    // 动画速度控制
    let animationSpeed = 1.0;
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    speedSlider.addEventListener('input', (e) => {
      animationSpeed = e.target.value / 100;
      speedValue.textContent = animationSpeed.toFixed(1) + 'x';
    });

    // === 面板显示/隐藏 ===
    window.togglePanel = () => {
      panel.classList.toggle('hidden');
    };
    panelToggle.addEventListener('click', togglePanel);

    // === Lightbox ===
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    let currentLightboxIndex = -1;

    const openLightbox = (index) => {
      if (index < 0 || index >= photoUrls.length) return;
      currentLightboxIndex = index;
      lightboxImg.src = photoUrls[index];
      lightbox.classList.add('active');
      controls.enabled = false;
    };

    const closeLightbox = () => {
      lightbox.classList.remove('active');
      currentLightboxIndex = -1;
      controls.enabled = true;
    };

    const navigateLightbox = (dir) => {
      if (currentLightboxIndex === -1) return;
      let idx = currentLightboxIndex + dir;
      if (idx < 0) idx = photoUrls.length - 1;
      if (idx >= photoUrls.length) idx = 0;
      openLightbox(idx);
    };

    document.getElementById('lightboxClose').addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    document.getElementById('lightboxPrev').addEventListener('click', (e) => { e.stopPropagation(); navigateLightbox(-1); });
    document.getElementById('lightboxNext').addEventListener('click', (e) => { e.stopPropagation(); navigateLightbox(1); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox || e.target === lightboxImg) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (currentLightboxIndex === -1) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigateLightbox(-1);
      if (e.key === 'ArrowRight') navigateLightbox(1);
    });

    // === 创建照片卡片 ===
    const createCard = (texture, index) => {
      const aspect = texture.image.width / texture.image.height;
      const height = 1.4;
      const width = height * aspect;

      const geometry = new THREE.PlaneGeometry(width, height);
      const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.35,
        metalness: 0.05,
        side: THREE.DoubleSide // 双面可见
      });
      const mesh = new THREE.Mesh(geometry, material);

      // 边框
      const frameGeo = new THREE.PlaneGeometry(width + 0.1, height + 0.1);
      const frameMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.z = -0.015;
      mesh.add(frame);

      mesh.userData = {
        index,
        aspect,
        width,
        height,
        basePos: new THREE.Vector3(),
        baseRot: new THREE.Euler(),
        floatOffset: Math.random() * Math.PI * 2,
        floatSpeed: 0.5 + Math.random() * 0.5
      };

      photoGroup.add(mesh);
      photoCards.push(mesh);
      return mesh;
    };

    // === 布局函数（各模式） ===
    const layoutModes = {
      // 星环模式
      ring: (cards) => {
        const total = cards.length;
        cards.forEach((card, i) => {
          const angle = (i / total) * Math.PI * 2;
          const radius = 4.5 + (i % 3) * 0.5;
          const y = (Math.random() - 0.5) * 1.5;
          card.userData.basePos.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
          card.userData.baseRot.set(0, -angle + Math.PI, 0);
          card.userData.layoutData = { angle, radius };
        });
        targetCameraPos.set(0, 3, 12);
        targetLookAt.set(0, 0, 0);
        controls.autoRotate = false;
      },

      // 星空模式
      starry: (cards) => {
        cards.forEach((card, i) => {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const r = 6 + Math.random() * 10;
          const x = r * Math.sin(phi) * Math.cos(theta);
          const y = r * Math.sin(phi) * Math.sin(theta) - 2;
          const z = r * Math.cos(phi);
          card.userData.basePos.set(x, y, z);
          card.userData.baseRot.set(
            (Math.random() - 0.5) * 0.3,
            Math.atan2(x, z) + Math.PI,
            (Math.random() - 0.5) * 0.2
          );
        });
        targetCameraPos.set(0, 2, 15);
        targetLookAt.set(0, 0, 0);
      },

      // 圣诞树模式
      tree: (cards) => {
        const total = cards.length;
        const layers = Math.ceil(total / 5);
        let idx = 0;
        for (let layer = 0; layer < layers && idx < total; layer++) {
          const y = 6 - layer * 1.8;
          const radius = 1 + layer * 0.8;
          const count = Math.min(4 + layer, total - idx);
          for (let j = 0; j < count && idx < total; j++) {
            const angle = (j / count) * Math.PI * 2 + layer * 0.3;
            const card = cards[idx];
            card.userData.basePos.set(
              Math.cos(angle) * radius,
              y + (Math.random() - 0.5) * 0.3,
              Math.sin(angle) * radius
            );
            card.userData.baseRot.set(0, -angle + Math.PI, (Math.random() - 0.5) * 0.15);
            card.userData.layoutData = { angle, layer };
            idx++;
          }
        }
        targetCameraPos.set(0, 3, 14);
        targetLookAt.set(0, 2, 0);
      },

      // 画廊墙面（上下滚动）
      gallery: (cards) => {
        const cols = Math.ceil(Math.sqrt(cards.length * 1.5));
        const spacing = 2.2;
        const rows = Math.ceil(cards.length / cols);
        const totalHeight = rows * spacing;
        cards.forEach((card, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = (col - (cols - 1) / 2) * spacing;
          const y = -row * spacing + 2;
          card.userData.basePos.set(x, y, 0);
          card.userData.baseRot.set(0, 0, 0);
          card.userData.layoutData = { originalY: y, totalHeight };
        });
        targetCameraPos.set(0, 1, 8 + cols);
        targetLookAt.set(0, 0, 0);
      },

      // 横向滚动
      scroll: (cards) => {
        const spacing = 2.8;
        cards.forEach((card, i) => {
          card.userData.basePos.set(i * spacing - (cards.length * spacing) / 2, 0, 0);
          card.userData.baseRot.set(0, 0, 0);
          card.userData.layoutData = { originalX: card.userData.basePos.x };
        });
        targetCameraPos.set(0, 0, 10);
        targetLookAt.set(0, 0, 0);
      }
    };

    // === 应用布局 ===
    const applyLayout = (mode, animate = true) => {
      if (!layoutModes[mode] || photoCards.length === 0) return;

      currentMode = mode;
      modeDesc.textContent = modeDescriptions[mode];

      // 重置相机控制参数
      controls.enablePan = false;
      controls.minDistance = 3;
      controls.maxDistance = 50;

      // 重置 photoGroup 旋转
      photoGroup.rotation.set(0, 0, 0);

      // 更新按钮状态
      modeSelector.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      // 计算目标位置
      layoutModes[mode](photoCards);

      // 平滑过渡到目标位置
      if (animate) {
        photoCards.forEach(card => {
          card.userData.transitioning = true;
        });
      } else {
        photoCards.forEach(card => {
          card.position.copy(card.userData.basePos);
          card.rotation.copy(card.userData.baseRot);
        });
      }
    };

    // === 模式切换事件 ===
    modeSelector.addEventListener('click', (e) => {
      const btn = e.target.closest('.mode-btn');
      if (btn && btn.dataset.mode) {
        applyLayout(btn.dataset.mode, true);
      }
    });

    // === 文件加载 ===
    const loadFiles = (files) => {
      const images = Array.from(files).filter(f => f.type.startsWith('image/'));
      if (!images.length) {
        statusText.textContent = '请上传图片文件';
        return;
      }

      statusText.textContent = `加载中...`;

      // 清空旧数据
      photoGroup.clear();
      photoCards.length = 0;
      photoTextures.length = 0;
      photoUrls.length = 0;

      const loader = new THREE.TextureLoader();
      let loaded = 0;

      images.forEach((file, index) => {
        const url = URL.createObjectURL(file);
        photoUrls.push(url);

        loader.load(url, (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          photoTextures.push(texture);
          createCard(texture, index);
          loaded++;

          if (loaded === images.length) {
            statusText.textContent = `已加载 ${loaded} 张照片`;
            applyLayout(currentMode, false);
          }
        });
      });
    };

    fileInput.addEventListener('change', (e) => {
      if (e.target.files) loadFiles(e.target.files);
    });

    // 拖拽上传
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files) loadFiles(e.dataTransfer.files);
    });

    // === 交互 ===
    const onPointerMove = (e) => {
      const bounds = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - bounds.left) / bounds.width) * 2 - 1;
      mouse.y = -((e.clientY - bounds.top) / bounds.height) * 2 + 1;
    };

    const onClick = () => {
      if (currentLightboxIndex !== -1) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(photoCards, true);
      if (intersects.length) {
        const hit = intersects[0].object;
        const card = hit.userData.index !== undefined ? hit : hit.parent;
        if (card && card.userData.index !== undefined) {
          openLightbox(card.userData.index);
        }
      }
    };

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('click', onClick);

    // === 动画循环 ===
    const clock = new THREE.Clock();

    const animate = () => {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      const delta = clock.getDelta();

      // 卡片动画
      photoCards.forEach((card, i) => {
        const ud = card.userData;

        // 过渡动画
        if (ud.transitioning) {
          card.position.lerp(ud.basePos, 0.08);
          card.rotation.x += (ud.baseRot.x - card.rotation.x) * 0.08;
          card.rotation.y += (ud.baseRot.y - card.rotation.y) * 0.08;
          card.rotation.z += (ud.baseRot.z - card.rotation.z) * 0.08;

          if (card.position.distanceTo(ud.basePos) < 0.01) {
            ud.transitioning = false;
          }
        }

        // 模式特定动画（应用速度系数）
        const t = time * animationSpeed;

        if (currentMode === 'ring') {
          const float = Math.sin(t * ud.floatSpeed + ud.floatOffset) * 0.2;
          card.position.y = ud.basePos.y + float;
          photoGroup.rotation.y += 0.0005 * animationSpeed;
        }
        else if (currentMode === 'starry') {
          const float = Math.sin(t * 0.5 + ud.floatOffset) * 0.15;
          card.position.y = ud.basePos.y + float;
          card.rotation.z = ud.baseRot.z + Math.sin(t * 0.3 + ud.floatOffset) * 0.05;
        }
        else if (currentMode === 'tree') {
          const float = Math.sin(t * 0.8 + ud.floatOffset) * 0.08;
          card.position.y = ud.basePos.y + float;
          const swing = Math.sin(t * 1.2 + ud.floatOffset) * 0.03;
          card.rotation.z = swing;
          photoGroup.rotation.y += 0.001 * animationSpeed;
        }
        else if (currentMode === 'gallery' && ud.layoutData) {
          // 画廊上下滚动
          const scrollSpeed = 0.2 * animationSpeed;
          const totalHeight = ud.layoutData.totalHeight + 2;
          let newY = ud.layoutData.originalY + (time * scrollSpeed) % totalHeight;
          // 循环滚动
          if (newY > totalHeight / 2 + 2) {
            newY -= totalHeight;
          }
          card.position.y = newY;
        }
        else if (currentMode === 'scroll' && ud.layoutData) {
          // 横向无限滚动
          const scrollSpeed = 0.3 * animationSpeed;
          const totalWidth = photoCards.length * 2.8;
          card.position.x = ud.layoutData.originalX - (time * scrollSpeed) % totalWidth;
          if (card.position.x < -totalWidth / 2) {
            card.position.x += totalWidth;
          }
        }
      });

      // 相机平滑移动
      camera.position.lerp(targetCameraPos, 0.03);

      controls.update();
      renderer.render(scene, camera);
    };

    // === 窗口大小调整 ===
    const onResize = () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };

    window.addEventListener('resize', onResize);
    onResize();
    animate();
  </script>
