    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌起名大师 - AI 商业命名专家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #fafafa;
        }

        .name-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .name-card:hover {
            transform: scale(1.02);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="min-h-screen flex flex-col">
    <div id="app" class="flex-grow flex flex-col">
        <!-- 导航 -->
        <nav
            class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-award w-6 h-6"></i>
                </div>
                <h1 class="font-black text-xl text-slate-900 tracking-tight">品牌起名大师</h1>
            </div>
            <a href="../../index.html"
                class="text-slate-500 hover:text-slate-900 transition flex items-center gap-1 text-sm">
                <i class="fa-solid fa-arrow-left w-4 h-4"></i> 返回首页
            </a>
        </nav>

        <main class="flex-grow p-6 md:p-12 max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12">
            <!-- 输入 -->
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                    <div class="space-y-6">
                        <div>
                            <label
                                class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">所属行业</label>
                            <input v-model="industry" type="text" placeholder="例：精品咖啡、宠物美容、智能家居"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-slate-200 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">品牌理念 /
                                核心卖点</label>
                            <textarea v-model="concept"
                                class="w-full h-32 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-slate-200 resize-none"
                                placeholder="例：强调自然环保、极致性价比、针对 Z 世代年轻人..."></textarea>
                        </div>
                        <button @click="generateNames" :disabled="isGenerating || !industry"
                            class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition flex items-center justify-center gap-2">

                            <template v-if="isGenerating">
                                <i class="fa-solid fa-spinner fa-spin w-5 h-5"></i>
                                <span>AI 正在创作中...</span>
                            </template>
                            <span v-else>生成 10 个创意命名</span>
                        </button>

                        <button v-if="results.length > 0" @click="exportTXT"
                            class="w-full py-3 bg-white border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-download w-4 h-4"></i>
                            导出 TXT
                        </button>
                    </div>
                </div>
            </div>

            <!-- 结果 -->
            <div class="lg:col-span-8">
                <!-- 错误日志 -->
                <div v-if="errorLog"
                    class="bg-red-50 border border-red-200 rounded-xl p-4 mb-4 text-xs text-red-800 overflow-auto max-h-40">
                    <div class="font-bold mb-1">⚠️ 生成失败:</div>
                    <pre>{{ errorLog }}</pre>
                </div>

                <div v-if="results.length > 0" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div v-for="(item, i) in results" :key="i"
                        class="name-card bg-white p-6 rounded-2xl shadow-md border border-slate-100 flex flex-col justify-between">
                        <div>
                            <div class="text-[10px] font-black text-slate-300 uppercase mb-1">Option {{i+1}}</div>
                            <h3 class="text-2xl font-black text-slate-900 mb-2">{{ item.name }}</h3>
                            <p class="text-xs text-slate-500 font-bold mb-4">{{ item.slogan }}</p>
                        </div>
                        <div class="pt-4 border-t border-slate-50 text-[11px] text-slate-400 italic">
                            {{ item.reason }}
                        </div>
                    </div>
                </div>
                <div v-else-if="!isGenerating"
                    class="h-full flex flex-col items-center justify-center text-slate-300 space-y-4">

                    <i class="fa-regular fa-pen-to-square w-16 h-16 opacity-10 text-6xl"></i>
                    <p class="text-sm font-bold">输入行业和理念，让 AI 为你定义品牌第一印象</p>
                </div>
                <div v-else class="grid grid-cols-1 md:grid-cols-2 gap-4 animate-pulse">
                    <div v-for="i in 6" :key="i" class="h-40 bg-white rounded-2xl shadow-sm"></div>
                </div>
            </div>
        </main>
    </div>
    <script>
        const { createApp, ref, onMounted } = Vue;



        createApp({
            setup() {
                // Remove local renderIcon, use global definition
                // const renderIcon = ...

                const industry = ref('');
                const concept = ref('');
                const isGenerating = ref(false);
                const results = ref([]);
                const errorLog = ref('');
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });

                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        const config = JSON.parse(saved);
                        apiConfig.value = { ...apiConfig.value, ...config };
                    }
                    if (!apiConfig.value.model) apiConfig.value.model = 'deepseek-v4-flash';
                    // 仅初始化静态区域的图标（导航栏）
                    // lucide.createIcons();
                });

                const generateNames = async () => {
                    if (!apiConfig.value.deepseek) { alert('请先配置 API Key'); return; }
                    isGenerating.value = true;
                    results.value = [];
                    errorLog.value = '';

                    const prompt = `你是一个顶级品牌咨询顾问。请为以下行业创作 10 个极具创意的品牌名称。
                    行业：${industry.value}。理念：${concept.value}。
                    要求：名字要响亮、易记、具有辨识度。每个名字配一个 Slogan。
                    请直接返回 JSON 数组，格式如下：
                    [
                      { "name": "品牌名", "slogan": "品牌口号", "reason": "起名逻辑简述" }
                    ]
                    只返回 JSON，不要废话。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.value.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.value.model || 'deepseek-v4-flash',
                                messages: [{ role: "system", content: prompt }],
                                stream: false
                            })
                        });

                        if (!response.ok) {
                            const errText = await response.text();
                            throw new Error(`API Error ${response.status}: ${errText}`);
                        }

                        const data = await response.json();
                        let content = data.choices[0].message.content;

                        // 清洗 Markdown 标记
                        content = content.replace(/```json/g, '').replace(/```/g, '').trim();

                        // 修复常见 JSON 错误
                        // 1. 替换中文标点
                        content = content.replace(/：/g, ':');
                        // 2. 移除多余的中文引号（保留英文双引号）
                        content = content.replace(/["""]([^"]*?)["""]/g, '"$1"');

                        let result;
                        try {
                            result = JSON.parse(content);
                        } catch (parseError) {
                            // 尝试修复缺少引号的键或值
                            // 匹配 "key": value 且 value 不是数字/布尔/null/对象/数组的情况
                            content = content.replace(/"(\w+)":\s*([^"{\[\dtruefalsenull][^,}\]]*)/g, '"$1": "$2"');
                            try {
                                result = JSON.parse(content);
                            } catch (retryError) {
                                // 匹配数组中缺少引号的值
                                content = content.replace(/"reason":\s*([^,"}\]]+)/g, '"reason": "$1"');
                                content = content.replace(/"slogan":\s*([^,"}\]]+)/g, '"slogan": "$1"');
                                try {
                                    result = JSON.parse(content);
                                } catch (finalError) {
                                    throw new Error(`JSON 解析失败，请重试。原始内容片段: ${content.substring(0, 200)}...`);
                                }
                            }
                        }

                        // 兼容处理：支持直接返回数组或对象包含数组
                        if (Array.isArray(result)) {
                            results.value = result;
                        } else if (result.names && Array.isArray(result.names)) {
                            results.value = result.names;
                        } else if (result.brands && Array.isArray(result.brands)) {
                            results.value = result.brands;
                        } else {
                            // 尝试找可能的数组字段
                            const keys = Object.keys(result);
                            const arrayKey = keys.find(k => Array.isArray(result[k]));
                            if (arrayKey) {
                                results.value = result[arrayKey];
                            } else {
                                throw new Error("返回的 JSON 结构不符合预期，未找到数组数据");
                            }
                        }

                        if (results.value.length === 0) {
                            throw new Error("生成结果为空");
                        }

                    } catch (e) {
                        console.error(e);
                        errorLog.value = e.message;
                    } finally {
                        isGenerating.value = false;
                    }
                };
                const exportTXT = () => {
                    if (results.value.length === 0) return;
                    let text = `品牌命名方案 - ${industry.value}\n`;
                    text += `=${'='.repeat(40)}\n\n`;

                    results.value.forEach((item, i) => {
                        text += `${i + 1}. ${item.name}\n`;
                        text += `   Slogan: ${item.slogan}\n`;
                        text += `   理由: ${item.reason}\n\n`;
                    });

                    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `品牌命名_${industry.value}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                };

                return { industry, concept, isGenerating, results, errorLog, generateNames, exportTXT };
            }
        }).mount('#app');
    </script>

</html>
