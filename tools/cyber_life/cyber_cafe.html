<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <!-- Google Analytics：与项目其他工具统一 -->

  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛博咖啡馆 · 沉浸式专注空间</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <style>
    /**
     * 赛博咖啡馆 - 全局沉浸式样式
     * 原则：暖棕/奶白/暖橙、毛玻璃、无整页滚动（主视口固定）
     */
    [x-cloak] { display: none !important; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif;
    }

    /* ---------- CSS 变量：随「窗外场景」切换 ---------- */
    .cafe-root {
      --cafe-warm: #c4a574;
      --cafe-cream: #faf6ef;
      --cafe-deep: #2a1f18;
      --cafe-accent: #e8913a;
      --cafe-glass: rgba(58, 42, 32, 0.42);
      --cafe-glass-border: rgba(255, 248, 235, 0.12);
      --parallax-x: 0px;
      --parallax-y: 0px;
      height: 100vh;
      width: 100%;
      position: relative;
      color: #faf6ef;
      transition: background 1.2s ease;
    }

    /* 雨天：偏冷一点的棕蓝调 */
    .cafe-root.scene-rain {
      background:
        radial-gradient(ellipse 120% 90% at 50% 120%, rgba(30, 58, 95, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(232, 145, 58, 0.08) 0%, transparent 50%),
        linear-gradient(165deg, #1e1612 0%, #3d2e24 45%, #2a1f18 100%);
    }

    /* 晴天：暖金高光 */
    .cafe-root.scene-sunny {
      background:
        radial-gradient(ellipse 70% 50% at 85% 15%, rgba(255, 220, 150, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 10% 20%, rgba(232, 145, 58, 0.12) 0%, transparent 45%),
        linear-gradient(165deg, #2c221a 0%, #4a3628 40%, #352820 100%);
    }

    /* 夜晚：更深、星点微光 */
    .cafe-root.scene-night {
      background:
        radial-gradient(ellipse 100% 80% at 50% 0%, rgba(80, 60, 120, 0.2) 0%, transparent 45%),
        radial-gradient(ellipse 60% 50% at 90% 80%, rgba(232, 145, 58, 0.06) 0%, transparent 50%),
        linear-gradient(180deg, #120e0c 0%, #241c16 50%, #1a1410 100%);
    }

    /* ---------- 视差背景层（随鼠标微调） ---------- */
    .parallax-bg {
      position: absolute;
      inset: -4%;
      pointer-events: none;
      transform: translate3d(calc(var(--parallax-x) * 0.4), calc(var(--parallax-y) * 0.35), 0);
      transition: transform 0.2s ease-out;
      z-index: 0;
    }

    /* ---------- 雨滴动画（雨天显示） ---------- */
    .rain-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
    }
    .cafe-root.scene-rain .rain-layer { opacity: 0.55; }
    .rain-drop {
      position: absolute;
      width: 1px;
      height: 18px;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.35));
      animation: rain-fall linear infinite;
      top: -20px;
    }
    @keyframes rain-fall {
      0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(110vh) translateX(-8px); opacity: 0.3; }
    }

    /* ---------- 阳光光斑（晴天） ---------- */
    .sun-spots {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
    }
    .cafe-root.scene-sunny .sun-spots { opacity: 1; }
    .sun-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      animation: sun-drift 18s ease-in-out infinite;
    }
    @keyframes sun-drift {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(30px, 20px) scale(1.08); opacity: 0.65; }
    }

    /* ---------- 夜晚星点 ---------- */
    .stars-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
    }
    .cafe-root.scene-night .stars-layer { opacity: 0.7; }
    .star-dot {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 250, 235, 0.7);
      border-radius: 50%;
      animation: star-twinkle 4s ease-in-out infinite;
    }
    @keyframes star-twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* ---------- 呼吸灯（整体氛围脉冲） ---------- */
    .breathing-vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(ellipse 90% 70% at 50% 50%, transparent 40%, rgba(20, 14, 10, 0.45) 100%);
      animation: breathe-vignette 7s ease-in-out infinite;
    }
    @keyframes breathe-vignette {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 0.95; }
    }

    /* ---------- 咖啡杯蒸汽 ---------- */
    .steam-wrap {
      position: absolute;
      bottom: 12%;
      left: 50%;
      margin-left: -140px;
      z-index: 3;
      pointer-events: none;
      opacity: 0.85;
    }
    .coffee-cup {
      width: 56px;
      height: 42px;
      border-radius: 0 0 14px 14px;
      background: linear-gradient(180deg, #4a3428 0%, #2a1c16 100%);
      border: 2px solid rgba(255, 248, 235, 0.15);
      box-shadow: inset 0 -8px 16px rgba(0, 0, 0, 0.35);
    }
    .coffee-cup::before {
      content: '';
      position: absolute;
      right: -14px;
      top: 8px;
      width: 16px;
      height: 22px;
      border: 2px solid rgba(255, 248, 235, 0.12);
      border-left: none;
      border-radius: 0 10px 10px 0;
    }
    .steam {
      position: absolute;
      bottom: 100%;
      left: 50%;
      width: 8px;
      height: 40px;
      margin-left: -4px;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.15), transparent);
      border-radius: 50%;
      filter: blur(3px);
      animation: steam-rise 3.2s ease-in-out infinite;
    }
    .steam.s2 { left: 35%; animation-delay: 0.6s; height: 48px; }
    .steam.s3 { left: 65%; animation-delay: 1.1s; height: 36px; }
    @keyframes steam-rise {
      0% { opacity: 0; transform: translateY(0) scaleX(1); }
      30% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-36px) scaleX(1.4); }
    }

    /* ---------- 毛玻璃面板 ---------- */
    .glass-panel {
      background: var(--cafe-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--cafe-glass-border);
      border-radius: 16px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    /* ---------- 顶栏按钮 ---------- */
    .mini-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(42, 31, 24, 0.5);
      border: 1px solid rgba(255, 248, 235, 0.1);
      color: #faf6ef;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .mini-icon-btn:hover {
      background: rgba(232, 145, 58, 0.2);
      border-color: rgba(232, 145, 58, 0.35);
    }

    /* ---------- 番茄钟环形进度 ---------- */
    .pomo-ring {
      transform: rotate(-90deg);
    }
    .pomo-ring-bg {
      fill: none;
      stroke: rgba(255, 248, 235, 0.08);
      stroke-width: 6;
    }
    .pomo-ring-fg {
      fill: none;
      stroke: url(#pomoGrad);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s linear;
    }

    /* ---------- 任务完成打钩动画 ---------- */
    @keyframes check-pop {
      0% { transform: scale(0.6); opacity: 0; }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .todo-check-anim {
      animation: check-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* ---------- 混音器滑块美化 ---------- */
    input[type="range"].mixer-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 248, 235, 0.12);
      outline: none;
    }
    input[type="range"].mixer-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f4d9a4, #e8913a);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(232, 145, 58, 0.45);
    }

    /* ---------- AI 灵感区 Markdown ---------- */
    .prose-cafe :where(h2) {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(244, 217, 164, 0.9);
      margin: 0.5em 0 0.25em;
      text-transform: uppercase;
    }
    .prose-cafe :where(p, li) {
      color: rgba(250, 246, 239, 0.88);
      line-height: 1.65;
      font-size: 0.8125rem;
      margin: 0.25em 0;
    }
    .prose-cafe :where(strong) { color: #f4d9a4; }
    .prose-cafe :where(blockquote) {
      border-left: 2px solid rgba(232, 145, 58, 0.45);
      padding-left: 0.65em;
      margin: 0.35em 0;
      font-style: italic;
      color: rgba(250, 246, 239, 0.75);
    }

    /* ---------- 主布局网格：无整页滚动 ---------- */
    .cafe-layout {
      display: grid;
      grid-template-columns: minmax(200px, 240px) 1fr minmax(200px, 260px);
      grid-template-rows: auto 1fr minmax(120px, 22vh);
      gap: 10px 14px;
      height: calc(100vh - 56px);
      padding: 8px 14px 12px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    @media (max-width: 1100px) {
      .cafe-layout {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto 1fr minmax(100px, 20vh);
        height: calc(100vh - 52px);
      }
      .cafe-col-mixer { grid-column: 1; grid-row: 2; }
      .cafe-col-pomo { grid-column: 1 / -1; grid-row: 1; }
      .cafe-col-todo { grid-column: 2; grid-row: 2; }
      .cafe-col-ai { grid-column: 1 / -1; grid-row: 4; }
    }
    @media (max-width: 640px) {
      .cafe-layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto 1fr minmax(100px, 18vh);
      }
      .cafe-col-mixer, .cafe-col-todo, .cafe-col-pomo, .cafe-col-ai {
        grid-column: 1;
      }
      .cafe-col-mixer { grid-row: 2; }
      .cafe-col-pomo { grid-row: 1; }
      .cafe-col-todo { grid-row: 3; }
      .cafe-col-ai { grid-row: 5; }
    }

    .scroll-inner {
      overflow-y: auto;
      overflow-x: hidden;
      max-height: 100%;
      scrollbar-width: thin;
      scrollbar-color: rgba(232, 145, 58, 0.4) transparent;
    }
    .scroll-inner::-webkit-scrollbar { width: 4px; }
    .scroll-inner::-webkit-scrollbar-thumb {
      background: rgba(232, 145, 58, 0.35);
      border-radius: 2px;
    }

    /* ---------- 时钟字体 ---------- */
    .clock-face {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
      text-shadow: 0 0 24px rgba(232, 145, 58, 0.25);
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body>
  <!--
    赛博咖啡馆 · App 级沉浸式专注空间
    技术：Alpine.js + Tailwind CDN + Lucide + Marked + DOMPurify + DeepSeek 流式
    音频：Web Audio API 全合成（无外部音频文件）
  -->
  <div
    id="cafe-app"
    class="cafe-root scene-sunny"
    x-data="cyberCafeApp()"
    x-init="init()"
    @mousemove.window="onMouseMove($event)"
    :class="{
      'scene-rain': sceneMode === 'rain',
      'scene-sunny': sceneMode === 'sunny',
      'scene-night': sceneMode === 'night'
    }"
  >
    <!-- 视差渐变层 -->
    <div class="parallax-bg" aria-hidden="true"></div>

    <!-- 雨天雨滴 -->
    <div class="rain-layer" aria-hidden="true">
      <template x-for="(d, i) in rainDrops" :key="i">
        <div
          class="rain-drop"
          :style="`left:${d.left}%;animation-duration:${d.dur}s;animation-delay:${d.delay}s`"
        ></div>
      </template>
    </div>

    <!-- 晴天光斑 -->
    <div class="sun-spots" aria-hidden="true">
      <div class="sun-blob w-48 h-48 bg-amber-200/30 top-[8%] right-[12%]"></div>
      <div class="sun-blob w-32 h-32 bg-orange-300/20 top-[22%] right-[28%]" style="animation-delay:-4s"></div>
    </div>

    <!-- 夜晚星点 -->
    <div class="stars-layer" aria-hidden="true">
      <template x-for="(s, i) in stars" :key="'st'+i">
        <div
          class="star-dot"
          :style="`left:${s.left}%;top:${s.top}%;animation-delay:${s.delay}s`"
        ></div>
      </template>
    </div>

    <div class="breathing-vignette" aria-hidden="true"></div>

    <!-- 装饰：咖啡与蒸汽 -->
    <div class="steam-wrap hidden md:block">
      <div class="relative">
        <div class="steam"></div>
        <div class="steam s2"></div>
        <div class="steam s3"></div>
        <div class="coffee-cup relative"></div>
      </div>
    </div>

    <!-- ========== 顶栏：时钟 + 返回 + 设置 + 场景 ========== -->
    <header class="relative z-20 flex items-center justify-between px-4 pt-3 pb-1">
      <div class="flex items-center gap-3">
        <a
          href="../../index.html"
          class="mini-icon-btn"
          title="返回首页"
          aria-label="返回首页"
        >
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </a>
        <div class="glass-panel px-4 py-2 rounded-xl">
          <div class="text-[10px] uppercase tracking-widest text-amber-200/60 mb-0.5">此刻</div>
          <div class="clock-face text-xl font-semibold text-amber-50" x-text="clockStr"></div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="glass-panel flex rounded-xl p-1 gap-0.5">
          <button
            type="button"
            @click="sceneMode = 'rain'"
            class="px-2 py-1.5 rounded-lg text-xs transition"
            :class="sceneMode === 'rain' ? 'bg-amber-600/40 text-white' : 'text-amber-100/50 hover:bg-white/5'"
            title="雨天"
          >🌧</button>
          <button
            type="button"
            @click="sceneMode = 'sunny'"
            class="px-2 py-1.5 rounded-lg text-xs transition"
            :class="sceneMode === 'sunny' ? 'bg-amber-600/40 text-white' : 'text-amber-100/50 hover:bg-white/5'"
            title="晴天"
          >☀️</button>
          <button
            type="button"
            @click="sceneMode = 'night'"
            class="px-2 py-1.5 rounded-lg text-xs transition"
            :class="sceneMode === 'night' ? 'bg-amber-600/40 text-white' : 'text-amber-100/50 hover:bg-white/5'"
            title="夜晚"
          >🌙</button>
        </div>
        <button type="button" class="mini-icon-btn" @click="showSettings = true" title="设置" aria-label="设置">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- ========== 主内容区 ========== -->
    <main class="cafe-layout">
      <!-- 左侧：白噪音混音器 -->
      <aside class="cafe-col-mixer glass-panel p-3 flex flex-col min-h-0">
        <div class="flex items-center justify-between mb-2 shrink-0">
          <h2 class="text-sm font-bold text-amber-100 flex items-center gap-2">
            <i data-lucide="sliders-horizontal" class="w-4 h-4 text-amber-400"></i>
            氛围混音
          </h2>
        </div>
        <div class="scroll-inner flex-1 space-y-3 pr-1">
          <template x-for="ch in mixerChannels" :key="ch.id">
            <div class="rounded-xl bg-black/20 px-2 py-2 border border-white/5">
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs text-amber-50/90" x-text="ch.icon + ' ' + ch.label"></span>
                <span class="text-[10px] text-amber-200/50" x-text="Math.round(ch.vol * 100) + '%'"></span>
              </div>
              <input
                type="range"
                min="0"
                max="100"
                class="mixer-slider"
                :value="ch.vol * 100"
                @input="onMixerInput(ch.id, $event.target.value)"
              />
            </div>
          </template>
          <div class="flex flex-col gap-2 pt-1">
            <button
              type="button"
              @click="applyPreset('deep')"
              class="w-full py-2 rounded-xl text-xs font-medium bg-amber-900/40 border border-amber-600/30 hover:bg-amber-800/50 transition"
            >推荐 · 深度专注</button>
            <button
              type="button"
              @click="applyPreset('relax')"
              class="w-full py-2 rounded-xl text-xs font-medium bg-amber-900/40 border border-amber-600/30 hover:bg-amber-800/50 transition"
            >推荐 · 放松阅读</button>
            <button
              type="button"
              @click="applyPreset('nap')"
              class="w-full py-2 rounded-xl text-xs font-medium bg-amber-900/40 border border-amber-600/30 hover:bg-amber-800/50 transition"
            >推荐 · 午后小憩</button>
          </div>
        </div>
      </aside>

      <!-- 中间：番茄钟 -->
      <section class="cafe-col-pomo flex flex-col items-center justify-center min-h-0 py-2">
        <div class="flex gap-2 mb-3">
          <button
            type="button"
            @click="setPomoMode('work')"
            class="px-3 py-1.5 rounded-full text-xs font-medium border transition"
            :class="pomoMode === 'work' ? 'bg-amber-600/50 border-amber-400/50 text-white' : 'border-white/10 text-amber-100/60 hover:bg-white/5'"
          >专注 25</button>
          <button
            type="button"
            @click="setPomoMode('short')"
            class="px-3 py-1.5 rounded-full text-xs font-medium border transition"
            :class="pomoMode === 'short' ? 'bg-emerald-700/45 border-emerald-400/40 text-white' : 'border-white/10 text-amber-100/60 hover:bg-white/5'"
          >短休 5</button>
          <button
            type="button"
            @click="setPomoMode('long')"
            class="px-3 py-1.5 rounded-full text-xs font-medium border transition"
            :class="pomoMode === 'long' ? 'bg-violet-800/45 border-violet-400/40 text-white' : 'border-white/10 text-amber-100/60 hover:bg-white/5'"
          >长休 15</button>
        </div>

        <div class="relative w-[min(220px,40vw)] aspect-square">
          <svg class="w-full h-full pomo-ring" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="pomoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#f4d9a4"/>
                <stop offset="100%" style="stop-color:#e8913a"/>
              </linearGradient>
            </defs>
            <circle class="pomo-ring-bg" cx="50" cy="50" r="44"/>
            <circle
              class="pomo-ring-fg"
              cx="50" cy="50" r="44"
              stroke-dasharray="276.46"
              :stroke-dashoffset="276.46 * (1 - pomoProgress)"
            />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
            <div class="clock-face text-3xl sm:text-4xl font-bold tracking-tight text-amber-50" x-text="pomoDisplay"></div>
            <div class="text-[11px] text-amber-200/50 mt-1">今日完成 <span class="text-amber-300 font-semibold" x-text="pomoTodayCount"></span> 个番茄</div>
          </div>
        </div>

        <div class="flex gap-3 mt-4">
          <button
            type="button"
            @click="togglePomo()"
            class="px-6 py-2.5 rounded-2xl text-sm font-semibold bg-gradient-to-br from-amber-500 to-orange-700 text-white shadow-lg shadow-orange-900/40 hover:opacity-95 transition"
          >
            <span x-text="pomoRunning ? '暂停' : '开始'"></span>
          </button>
          <button
            type="button"
            @click="resetPomo()"
            class="px-4 py-2.5 rounded-2xl text-sm border border-white/15 text-amber-100/80 hover:bg-white/5 transition"
          >重置</button>
        </div>
      </section>

      <!-- 右侧：任务清单 -->
      <aside class="cafe-col-todo glass-panel p-3 flex flex-col min-h-0">
        <h2 class="text-sm font-bold text-amber-100 flex items-center gap-2 mb-2 shrink-0">
          <i data-lucide="list-checks" class="w-4 h-4 text-amber-400"></i>
          今日待办
        </h2>

  <script>
    /**
     * =============================================================================
     * CafeAudioEngine：赛博咖啡馆氛围声合成引擎
     * -----------------------------------------------------------------------------
     * 使用 Web Audio API 在浏览器内实时合成六路环境声，不依赖外部音频资源。
     * 每路连接独立 GainNode，再汇总到 masterGain → destination。
     *
     * 通道说明：
     * - cafe：白噪 + 低通（模拟咖啡馆嗡嗡声）+ 定时短脉冲（杯碟碰撞感）
     * - rain：强低通白噪（偏「棕噪」感）
     * - fire：带通噪声底 + 随机高频噼啪脉冲
     * - lofi：简单 kick + closed hi-hat 节拍调度
     * - ocean：低通噪声 + 慢速正弦调制增益（海浪起伏）
     * - bird：随机间隔的短促扫频正弦（鸟鸣示意）
     * =============================================================================
     */
    class CafeAudioEngine {
      constructor() {
        /** @type {AudioContext|null} */
        this.ctx = null;
        /** @type {GainNode|null} */
        this.master = null;
        /** 各通道根增益 */
        this.gains = {};
        /** 循环噪声源引用（启动后保持运行，靠增益静音） */
        this._noiseSources = {};
        this._initialized = false;
        /** 用户设定的各通道音量 0~1（ocean 由 _oceanPump 读取） */
        this._volTargets = {};
        /** 海浪缓慢起伏定时器 */
        this._oceanPumpTimer = null;
        /** lofi 调度 */
        this._lofiTimer = null;
        this._beatStep = 0;
        /** 咖啡馆杯碟声定时器 */
        this._cafeClinkTimer = null;
        /** 壁炉噼啪定时器 */
        this._fireCrackleTimer = null;
        /** 鸟鸣递归调度 */
        this._birdTimer = null;
      }

      /**
       * 生成指定秒数的白噪声 AudioBuffer（单声道）
       * @param {AudioContext} ctx
       * @param {number} seconds
       * @returns {AudioBuffer}
       */
      static createWhiteNoiseBuffer(ctx, seconds) {
        const len = Math.floor(ctx.sampleRate * seconds);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          d[i] = Math.random() * 2 - 1;
        }
        return buf;
      }

      /**
       * 懒初始化 AudioContext 与节点图（需用户手势后调用）
       */
      async ensure() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) {
          console.warn('Web Audio API 不可用');
          return false;
        }
        if (!this.ctx) {
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.85;
          this.master.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          await this.ctx.resume();
        }
        if (!this._initialized) {
          this._buildGraph();
          this._initialized = true;
        }
        return true;
      }

      /**
       * 构建六路合成节点并启动底层循环声
       */
      _buildGraph() {
        const ctx = this.ctx;
        const ids = ['cafe', 'rain', 'fire', 'lofi', 'ocean', 'bird'];
        ids.forEach((id) => {
          const g = ctx.createGain();
          g.gain.value = 0;
          g.connect(this.master);
          this.gains[id] = g;
        });

        // --- 咖啡馆：白噪 + 低通 ---
        this._startLoopNoise('cafe', 'lowpass', 650);
        // --- 雨：更低截止频率 ---
        this._startLoopNoise('rain', 'lowpass', 320);
        // --- 壁炉：带通 ---
        this._startLoopNoise('fire', 'bandpass', 400);
        if (this._noiseSources.fire && this._noiseSources.fire.filter) {
          this._noiseSources.fire.filter.Q.value = 0.7;
        }
        // --- 海浪：低通 + 后续 tremolo ---
        this._startLoopNoise('ocean', 'lowpass', 380);
        /** 海浪用正弦缓慢调制音量（见 _startOceanPump） */
        this._oceanPhase = 0;
        // --- lofi：无连续噪声，仅节拍 ---
        this._scheduleLofi();
        // --- 杯碟、噼啪、鸟鸣 ---
        this._scheduleCafeClinks();
        this._scheduleFireCrackles();
        this._scheduleBirds();
      }

      /**
       * 启动一路循环白噪声：buffer → biquad → channel gain
       */
      _startLoopNoise(channelId, filterType, freq) {
        const ctx = this.ctx;
        const buf = CafeAudioEngine.createWhiteNoiseBuffer(ctx, 2);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        const filter = ctx.createBiquadFilter();
        filter.type = filterType;
        filter.frequency.value = freq;
        src.connect(filter);
        filter.connect(this.gains[channelId]);
        src.start(0);
        this._noiseSources[channelId] = { src, filter };
      }

      /**
       * 海浪泵：周期性按正弦包络更新 ocean 的 GainNode（模拟潮起潮落）
       */
      _startOceanPump() {
        if (this._oceanPumpTimer) return;
        this._oceanPumpTimer = setInterval(() => {
          if (!this.ctx || !this.gains.ocean) return;
          const u = this._volTargets.ocean || 0;
          const t = this.ctx.currentTime;
          if (u <= 0.001) {
            this.gains.ocean.gain.setTargetAtTime(0, t, 0.06);
            return;
          }
          this._oceanPhase += 0.035;
          const lfo = 0.52 + 0.48 * Math.sin(this._oceanPhase);
          const val = u * lfo * this._channelScalar('ocean');
          this.gains.ocean.gain.setTargetAtTime(val, t, 0.1);
        }, 90);
      }

      /**
       * 咖啡馆杯碟：随机间隔播放短促带通噪声脉冲
       */
      _scheduleCafeClinks() {
        const tick = () => {
          if (!this.ctx || !this.gains.cafe) return;
          const t = this.ctx.currentTime;
          const burst = this.ctx.createBufferSource();
          const b = CafeAudioEngine.createWhiteNoiseBuffer(this.ctx, 0.04);
          burst.buffer = b;
          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.value = 1800 + Math.random() * 2200;
          bp.Q.value = 8;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.15 + Math.random() * 0.12, t + 0.008);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          burst.connect(bp);
          bp.connect(g);
          g.connect(this.gains.cafe);
          burst.start(t);
          burst.stop(t + 0.07);
          this._cafeClinkTimer = setTimeout(tick, 2000 + Math.random() * 4500);
        };
        this._cafeClinkTimer = setTimeout(tick, 1500);
      }

      /**
       * 壁炉噼啪：随机高频噪声短脉冲
       */
      _scheduleFireCrackles() {
        const tick = () => {
          if (!this.ctx || !this.gains.fire) return;
          const t = this.ctx.currentTime;
          const burst = this.ctx.createBufferSource();
          burst.buffer = CafeAudioEngine.createWhiteNoiseBuffer(this.ctx, 0.05);
          const hp = this.ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.value = 1200;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.2 + Math.random() * 0.25, t + 0.003);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
          burst.connect(hp);
          hp.connect(g);
          g.connect(this.gains.fire);
          burst.start(t);
          burst.stop(t + 0.09);
          this._fireCrackleTimer = setTimeout(tick, 400 + Math.random() * 1800);
        };
        this._fireCrackleTimer = setTimeout(tick, 800);
      }

      /**
       * Lo-fi 鼓机：约 72 BPM，每步 125ms，kick 在第 0 拍，hihat 每拍
       */
      _scheduleLofi() {
        if (this._lofiTimer) clearInterval(this._lofiTimer);
        const stepMs = 125;
        this._lofiTimer = setInterval(() => {
          if (!this.ctx || !this.gains.lofi) return;
          const t = this.ctx.currentTime;
          const step = this._beatStep % 8;
          // kick
          if (step === 0 || step === 4) {
            this._playKick(t);
          }
          // hihat
          this._playHihat(t);
          this._beatStep++;
        }, stepMs);
      }

      /**
       * 合成底鼓：音高快速下滑的正弦
       * @param {number} time AudioContext 时间
       */
      _playKick(time) {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(145, time);
        osc.frequency.exponentialRampToValueAtTime(48, time + 0.07);
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(0.35, time + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, time + 0.18);
        osc.connect(g);
        g.connect(this.gains.lofi);
        osc.start(time);
        osc.stop(time + 0.2);
      }

      /**
       * 合成闭合踩镲：短白噪 + 高通
       * @param {number} time
       */
      _playHihat(time) {
        const ctx = this.ctx;
        const burst = ctx.createBufferSource();
        burst.buffer = CafeAudioEngine.createWhiteNoiseBuffer(ctx, 0.03);
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 7000;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.12, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
        burst.connect(hp);
        hp.connect(g);
        g.connect(this.gains.lofi);
        burst.start(time);
        burst.stop(time + 0.05);
      }

      /**
       * 鸟鸣：高频正弦快速扫频
       */
      _scheduleBirds() {
        const chirp = () => {
          if (!this.ctx || !this.gains.bird) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2800 + Math.random() * 900, t);
          osc.frequency.linearRampToValueAtTime(4200 + Math.random() * 800, t + 0.12);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.08 + Math.random() * 0.06, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.connect(g);
          g.connect(this.gains.bird);
          osc.start(t);
          osc.stop(t + 0.25);
          this._birdTimer = setTimeout(chirp, 2200 + Math.random() * 5200);
        };
        this._birdTimer = setTimeout(chirp, 3000);
      }

      /**
       * 设置某通道音量（0~1）
       * @param {string} id
       * @param {number} v
       */
      setVolume(id, v) {
        const g = this.gains[id];
        if (!g || !this.ctx) return;
        const now = this.ctx.currentTime;
        const val = Math.max(0, Math.min(1, v));
        this._volTargets[id] = val;

        if (id === 'ocean') {
          if (val > 0.001) {
            this._startOceanPump();
          } else if (this._oceanPumpTimer) {
            clearInterval(this._oceanPumpTimer);
            this._oceanPumpTimer = null;
            g.gain.setTargetAtTime(0, now, 0.08);
          }
          return;
        }

        g.gain.setTargetAtTime(val * this._channelScalar(id), now, 0.02);
      }

      /**
       * 各通道基础响度微调（避免某路过响）
       * @param {string} id
       */
      _channelScalar(id) {
        const map = { cafe: 0.45, rain: 0.5, fire: 0.4, lofi: 0.55, ocean: 0.48, bird: 0.35 };
        return map[id] ?? 0.45;
      }

      /**
       * 停止所有定时调度（页面卸载时可调用）
       */
      dispose() {
        clearTimeout(this._cafeClinkTimer);
        clearTimeout(this._fireCrackleTimer);
        clearTimeout(this._birdTimer);
        if (this._lofiTimer) clearInterval(this._lofiTimer);
        if (this._oceanPumpTimer) clearInterval(this._oceanPumpTimer);
      }
    }

    /** 全局单例音频引擎（单页仅一份） */
    const cafeAudio = new CafeAudioEngine();

    /**
     * 播放番茄完成钟声：多个谐波衰减正弦叠加
     * @param {AudioContext} ctx
     */
    function playPomoChime(ctx) {
      if (!ctx) return;
      const t = ctx.currentTime;
      const freqs = [523.25, 659.25, 783.99];
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        g.gain.setValueAtTime(0, t + i * 0.05);
        g.gain.linearRampToValueAtTime(0.12, t + i * 0.05 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.9 + i * 0.08);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t + i * 0.05);
        osc.stop(t + 1.2);
      });
    }

    document.addEventListener('alpine:init', () => {
      Alpine.data('cyberCafeApp', () => ({
        // ---------- 场景与装饰 ----------
        sceneMode: 'sunny',
        rainDrops: Array.from({ length: 48 }, (_, i) => ({
          left: (i * 17 + (i % 7) * 13) % 100,
          dur: 0.85 + (i % 5) * 0.15,
          delay: (i % 10) * 0.12
        })),
        stars: Array.from({ length: 36 }, (_, i) => ({
          left: (i * 23) % 100,
          top: (i * 11) % 45,
          delay: (i % 8) * 0.5
        })),

        // ---------- 时钟 ----------
        clockStr: '',
        _clockTimer: null,

        // ---------- 混音器 ----------
        mixerChannels: [
          { id: 'cafe', icon: '☕', label: '咖啡馆人声', vol: 0 },
          { id: 'rain', icon: '🌧', label: '雨声', vol: 0 },
          { id: 'fire', icon: '🔥', label: '壁炉', vol: 0 },
          { id: 'lofi', icon: '🎵', label: 'Lo-fi 节拍', vol: 0 },
          { id: 'ocean', icon: '🌊', label: '海浪', vol: 0 },
          { id: 'bird', icon: '🐦', label: '鸟鸣', vol: 0 }
        ],

        // ---------- 番茄钟 ----------
        pomoMode: 'work',
        pomoSeconds: 25 * 60,
        pomoTotal: 25 * 60,
        pomoRunning: false,
        _pomoInterval: null,
        pomoTodayCount: 0,
        pomoTodayKey: '',

        // ---------- 待办 ----------
        todos: [],
        newTodoText: '',
        todoStorageKey: 'cyber_cafe_todos_v1',

        // ---------- AI ----------
        apiConfig: { deepseek: '', model: 'deepseek-v4-flash' },
        showSettings: false,
        inspirationRaw: '',
        inspirationHtml: '',
        reasoningBuffer: '',
        inspirationLoading: false,

        toast: { show: false, message: '' },

        /**
         * 番茄进度 0~1（环形图）
         */
        get pomoProgress() {
          if (this.pomoTotal <= 0) return 0;
          return 1 - this.pomoSeconds / this.pomoTotal;
        },

        /**
         * 番茄显示 mm:ss
         */
        get pomoDisplay() {
          const m = Math.floor(this.pomoSeconds / 60);
          const s = this.pomoSeconds % 60;
          return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        },

        /**
         * 初始化：读配置、待办、番茄统计、时钟
         */
        init() {
          const saved = localStorage.getItem('global_llm_config');
          if (saved) {
            try {
              this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
            } catch (e) {
              console.warn('读取 global_llm_config 失败', e);
            }
          }
          this.loadTodos();
          this.initPomoToday();
          this.tickClock();
          this._clockTimer = setInterval(() => this.tickClock(), 1000);
          this.$nextTick(() => {
            try { lucide.createIcons(); } catch (e) {}
          });
          // 首次进入：若已配置 Key，自动来一杯灵感
          if ((this.apiConfig.deepseek || '').trim()) {
            this.brewInspiration();
          }
        },

        tickClock() {
          const n = new Date();
          this.clockStr = n.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        },

        /**
         * 鼠标视差：写入 CSS 变量
         * @param {MouseEvent} e
         */
        onMouseMove(e) {
          const cx = window.innerWidth / 2;
          const cy = window.innerHeight / 2;
          const dx = (e.clientX - cx) / cx;
          const dy = (e.clientY - cy) / cy;
          const root = document.getElementById('cafe-app');
          if (root) {
            root.style.setProperty('--parallax-x', (dx * 14).toFixed(2) + 'px');
            root.style.setProperty('--parallax-y', (dy * 10).toFixed(2) + 'px');
          }
        },

        /**
         * 混音滑块：同步 Alpine 状态 + 音频引擎
         */
        async onMixerInput(id, val) {
          const v = Number(val) / 100;
          const ch = this.mixerChannels.find((c) => c.id === id);
          if (ch) ch.vol = v;
          const ok = await cafeAudio.ensure();
          if (ok) cafeAudio.setVolume(id, v);
          this.$nextTick(() => { try { lucide.createIcons(); } catch (e) {} });
        },

        /**
         * 一键推荐组合
         * @param {'deep'|'relax'|'nap'} name
         */
        async applyPreset(name) {
          const presets = {
            deep: { cafe: 0.35, rain: 0.25, fire: 0.15, lofi: 0.45, ocean: 0, bird: 0 },
            relax: { cafe: 0.5, rain: 0, fire: 0.35, lofi: 0.2, ocean: 0.25, bird: 0.15 },
            nap: { cafe: 0.25, rain: 0.15, fire: 0.2, lofi: 0, ocean: 0.55, bird: 0.1 }
          };
          const p = presets[name] || presets.deep;
          await cafeAudio.ensure();
          this.mixerChannels.forEach((ch) => {
            ch.vol = p[ch.id] ?? 0;
            cafeAudio.setVolume(ch.id, ch.vol);
          });
          this.showToast('已应用「' + (name === 'deep' ? '深度专注' : name === 'relax' ? '放松阅读' : '午后小憩') + '」组合');
          this.$nextTick(() => { try { lucide.createIcons(); } catch (e) {} });
        },

        // ----- 番茄钟 -----
        initPomoToday() {
          const d = new Date().toISOString().slice(0, 10);
          this.pomoTodayKey = 'cyber_cafe_pomo_' + d;
          const n = parseInt(localStorage.getItem(this.pomoTodayKey) || '0', 10);
          this.pomoTodayCount = isNaN(n) ? 0 : n;
        },

        setPomoMode(mode) {
          this.pomoMode = mode;
          const map = { work: 25 * 60, short: 5 * 60, long: 15 * 60 };
          this.pomoTotal = map[mode];
          this.pomoSeconds = this.pomoTotal;
          this.pomoRunning = false;
          if (this._pomoInterval) {
            clearInterval(this._pomoInterval);
            this._pomoInterval = null;
          }
        },

        togglePomo() {
          if (this.pomoRunning) {
            this.pomoRunning = false;
            if (this._pomoInterval) clearInterval(this._pomoInterval);
            this._pomoInterval = null;
            return;
          }
          cafeAudio.ensure().then(() => {
            this.pomoRunning = true;
            this._pomoInterval = setInterval(() => {
              if (this.pomoSeconds <= 0) return;
              this.pomoSeconds--;
              if (this.pomoSeconds <= 0) {
                this.pomoRunning = false;
                clearInterval(this._pomoInterval);
                this._pomoInterval = null;
                this.onPomoComplete();
              }
            }, 1000);
          });
        },

        resetPomo() {
          this.pomoRunning = false;
          if (this._pomoInterval) clearInterval(this._pomoInterval);
          this._pomoInterval = null;
          this.pomoSeconds = this.pomoTotal;
        },

        /**
         * 一轮结束：钟声 + 统计 + 提示
         */
        async onPomoComplete() {
          this.showToast('时间到，休息一下吧 ☕');
          if (this.pomoMode === 'work') {
            this.initPomoToday();
            this.pomoTodayCount += 1;
            localStorage.setItem(this.pomoTodayKey, String(this.pomoTodayCount));
          }
          const ok = await cafeAudio.ensure();
          if (ok && cafeAudio.ctx) playPomoChime(cafeAudio.ctx);
        },

        // ----- 待办 -----
        loadTodos() {
          try {
            const raw = localStorage.getItem(this.todoStorageKey);
            if (raw) this.todos = JSON.parse(raw);
          } catch (e) {
            this.todos = [];
          }
        },

        saveTodos() {
          localStorage.setItem(this.todoStorageKey, JSON.stringify(this.todos));
        },

        addTodo() {
          const t = (this.newTodoText || '').trim();
          if (!t) return;
          this.todos.push({ id: Date.now(), text: t, done: false });
          this.newTodoText = '';
          this.saveTodos();
          this.$nextTick(() => { try { lucide.createIcons(); } catch (e) {} });
        },

        toggleTodo(item) {
          item.done = !item.done;
          this.saveTodos();
          this.$nextTick(() => { try { lucide.createIcons(); } catch (e) {} });
        },

        removeTodo(idx) {
          this.todos.splice(idx, 1);
          this.saveTodos();
          this.$nextTick(() => { try { lucide.createIcons(); } catch (e) {} });
        },

        // ----- 配置 -----
        saveConfig() {
          const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
          localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...this.apiConfig }));
          this.showSettings = false;
          this.showToast('配置已保存');
        },

        showToast(message) {
          this.toast = { show: true, message };
          setTimeout(() => { this.toast.show = false; }, 2200);
        },

        /**
         * DeepSeek 流式：灵感角（Markdown）
         */
        async brewInspiration() {
          const key = (this.apiConfig.deepseek || '').trim();
          if (!key) {
            this.showSettings = true;
            this.showToast('请先配置 API Key');
            return;
          }
          if (this.inspirationLoading) return;
          this.inspirationLoading = true;
          this.inspirationRaw = '';
          this.reasoningBuffer = '';
          this.inspirationHtml = '';

          const system = `你是赛博咖啡馆里的温柔掌柜兼文学侍者。请严格用中文输出 Markdown（不要 JSON 围栏）。
必须包含三个二级标题，且顺序如下：
## 今日灵感
（一句原创或化用的短名言式句子，温暖、克制，30字内）

## 微小挑战
（一个今天可完成的具体小事，有趣不尴尬，一句）

## 氛围摘页
（100-180 字：描写此刻咖啡馆内光线、咖啡香气、雨声或炉火、邻座低语等，像小说节选，第二人称「你」）`;

          const user = '现在时刻：' + new Date().toLocaleString('zh-CN') + '\n请为我萃取一杯今日灵感。';

          try {
            const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + key
              },
              body: JSON.stringify({
                model: this.apiConfig.model || 'deepseek-v4-flash',
                messages: [
                  { role: 'system', content: system },
                  { role: 'user', content: user }
                ],
                stream: true,
                temperature: 0.85,
                max_tokens: 900
              })
            });

            if (!res.ok) {
              const errText = await res.text().catch(() => '');
              throw new Error('API ' + res.status + (errText ? ': ' + errText.slice(0, 120) : ''));
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop() || '';

              for (const line of lines) {
                const t = line.trim();
                if (!t.startsWith('data:')) continue;
                const data = t.slice(5).trim();
                if (data === '[DONE]') continue;
                try {
                  const parsed = JSON.parse(data);
                  const delta = parsed.choices?.[0]?.delta;
                  if (!delta) continue;
                  if (delta.reasoning_content) this.reasoningBuffer += delta.reasoning_content;
                  if (delta.content) this.inspirationRaw += delta.content;
                  this._renderInspiration();
                } catch (pe) {
                  console.warn('流解析跳过', pe);
                }
              }
            }
            this._renderInspiration();
          } catch (e) {
            console.error(e);
            this.showToast(e.message || '生成失败');
            this.inspirationHtml = '<p class="text-red-300/80 text-sm">' + (e.message || '请求失败') + '</p>';
          } finally {
            this.inspirationLoading = false;
            this.$nextTick(() => { try { lucide.createIcons(); } catch (err) {} });
          }
        },

        /**
         * 将 Markdown 渲染为安全 HTML
         */
        _renderInspiration() {
          if (typeof marked === 'undefined') {
            this.inspirationHtml = '<pre class="text-xs whitespace-pre-wrap">' + this.escapeHtml(this.inspirationRaw) + '</pre>';
            return;
          }
          const raw = marked.parse(this.inspirationRaw || '');
          this.inspirationHtml = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(raw) : raw;
        },

        escapeHtml(s) {
          const d = document.createElement('div');
          d.textContent = s;
          return d.innerHTML;
        }
      }));
    });
  </script>
</body>
