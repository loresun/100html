<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能新闻搜索 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 自定义字体和背景 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
        }

        /* 搜索框发光效果 */
        .search-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3), 0 0 60px rgba(59, 130, 246, 0.1);
        }

        .search-glow:focus-within {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5), 0 0 80px rgba(59, 130, 246, 0.2);
        }

        /* 卡片悬停效果 */
        .news-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(71, 85, 105, 0.3);
        }

        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.4);
        }

        /* 总结区域渐变边框 */
        .summary-box {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            position: relative;
        }

        .summary-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 1rem;
            padding: 1px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #3b82f6);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        /* 加载动画 */
        .pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Markdown 样式 */
        .prose-dark {
            color: #e2e8f0;
        }

        .prose-dark h1,
        .prose-dark h2,
        .prose-dark h3 {
            color: #f1f5f9;
            font-weight: 600;
        }

        .prose-dark ul,
        .prose-dark ol {
            color: #cbd5e1;
        }

        .prose-dark li {
            margin: 0.5rem 0;
        }

        .prose-dark strong {
            color: #60a5fa;
        }

        .prose-dark a {
            color: #38bdf8;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.8);
        }

        /* 骨架屏动画 */
        .skeleton {
            background: linear-gradient(90deg, rgba(51, 65, 85, 0.5) 25%, rgba(71, 85, 105, 0.5) 50%, rgba(51, 65, 85, 0.5) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }

        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-200">
    <div x-data="newsSearch" class="min-h-screen flex flex-col">

        <!-- ==================== 导航栏 ==================== -->
        <nav class="bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50 border-b border-slate-700/50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <!-- 左侧：首页链接和标题 -->
                <a href="../../index.html" class="flex items-center gap-3 group">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/25 group-hover:shadow-blue-500/40 transition-shadow">
                        <i class="fa-solid fa-magnifying-glass w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg text-white">智能新闻搜索</span>
                        <span class="hidden sm:block text-xs text-slate-400">AI-Powered News Search</span>
                    </div>
                </a>

                <!-- 右侧：模型选择和设置 -->
                <div class="flex items-center gap-3">
                    <!-- 模型切换 -->
                    <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700/50">
                        <button @click="apiConfig.model = 'deepseek-v4-flash'" :class="apiConfig.model === 'deepseek-v4-flash' 
                                ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/25' 
                                : 'text-slate-400 hover:text-white'"
                            class="px-3 py-1.5 text-xs font-medium rounded-md transition-all">V4 Flash</button>
                        <button @click="apiConfig.model = 'deepseek-v4-pro'" :class="apiConfig.model === 'deepseek-v4-pro' 
                                ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/25' 
                                : 'text-slate-400 hover:text-white'"
                            class="px-3 py-1.5 text-xs font-medium rounded-md transition-all">V4 Pro</button>
                    </div>

                    <!-- 设置按钮 -->
                    <button @click="showSettings = true"
                        class="p-2 rounded-lg bg-slate-800 border border-slate-700/50 text-slate-400 hover:text-blue-400 hover:border-blue-500/50 transition-all">
                        <i class="fa-solid fa-gear w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- ==================== 主内容区 ==================== -->
        <main class="flex-grow">
            <!-- 搜索区域 -->
            <div class="max-w-4xl mx-auto px-4 pt-12 pb-8">
                <!-- 标题 -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl sm:text-4xl font-bold text-white mb-3">
                        <span
                            class="bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                            智能搜索，AI 总结
                        </span>
                    </h1>
                    <p class="text-slate-400 text-sm sm:text-base">输入关键词，获取实时新闻并由 AI 智能总结要点</p>
                </div>

                <!-- 搜索框 -->
                <div
                    class="search-glow bg-slate-800/80 backdrop-blur-sm rounded-2xl p-2 border border-slate-600/30 transition-all duration-300">
                    <div class="flex items-center gap-2">
                        <div class="flex-shrink-0 pl-4">
                            <i class="fa-solid fa-magnifying-glass w-5 h-5 text-blue-400"></i>
                        </div>
                        <input type="text" x-model="searchQuery" @keyup.enter="search()"
                            class="flex-grow bg-transparent border-none outline-none text-white placeholder-slate-500 text-lg py-3 px-2"
                            placeholder="输入搜索关键词，如：人工智能最新进展...">
                        <!-- 搜索设置 -->
                        <div class="flex items-center gap-2 pr-2">
                            <!-- 搜索数量选择 -->
                            <select x-model="searchConfig.maxResults"
                                class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-300 outline-none focus:border-blue-500">
                                <option value="5">5 条</option>
                                <option value="10">10 条</option>
                                <option value="15">15 条</option>
                                <option value="20">20 条</option>
                            </select>

                            <!-- 搜索按钮 -->
                            <button @click="search()" :disabled="isSearching || !searchQuery.trim()"
                                class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 disabled:from-slate-600 disabled:to-slate-600 text-white px-6 py-2.5 rounded-xl font-medium transition-all disabled:cursor-not-allowed shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 disabled:shadow-none">
                                <template x-if="!isSearching">
                                    <span class="flex items-center gap-2">
                                        <i class="fa-solid fa-bolt w-4 h-4"></i>
                                        搜索
                                    </span>
                                </template>
                                <template x-if="isSearching">
                                    <span class="flex items-center gap-2">
                                        <i class="fa-solid fa-spinner fa-spin w-4 h-4"></i>
                                        搜索中
                                    </span>
                                </template>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 快捷搜索标签 -->
                <div class="flex flex-wrap gap-2 mt-4 justify-center">
                    <template x-for="tag in quickTags" :key="tag">
                        <button @click="searchQuery = tag; search()"
                            class="px-4 py-1.5 rounded-full text-sm bg-slate-800/80 border border-slate-700/50 text-slate-400 hover:text-blue-400 hover:border-blue-500/50 transition-all">
                            <span x-text="tag"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- 结果区域 -->
            <div class="max-w-7xl mx-auto px-4 pb-12">
                <!-- AI 总结区域 -->
                <template x-if="summary || isSummarizing">
                    <div class="mb-8">
                        <div class="summary-box rounded-2xl p-6 relative overflow-hidden">
                            <div class="flex items-center gap-3 mb-4">
                                <div
                                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
                                    <i class="fa-solid fa-wand-magic-sparkles w-4 h-4 text-white"></i>
                                </div>
                                <h2 class="text-lg font-semibold text-white">AI 智能总结</h2>
                                <template x-if="isSummarizing">
                                    <span class="text-xs text-blue-400 flex items-center gap-1 pulse-ring">
                                        <i class="fa-solid fa-spinner fa-spin w-3 h-3"></i>
                                        正在分析...
                                    </span>
                                </template>
                            </div>

                            <!-- 推理过程（V4 Pro 模型） -->
                            <template x-if="reasoning">
                                <details class="mb-4 bg-slate-800/50 rounded-lg border border-slate-700/50">
                                    <summary
                                        class="px-4 py-2 cursor-pointer text-sm text-purple-400 hover:text-purple-300 flex items-center gap-2">
                                        <i class="fa-solid fa-brain w-4 h-4"></i>
                                        查看 AI 思考过程
                                    </summary>
                                    <div
                                        class="px-4 py-3 text-sm text-slate-400 border-t border-slate-700/50 max-h-60 overflow-y-auto">
                                        <pre class="whitespace-pre-wrap font-mono text-xs" x-text="reasoning"></pre>
                                    </div>
                                </details>
                            </template>

                            <!-- 总结内容 -->
                            <div x-show="summary" class="prose-dark prose max-w-none"
                                x-html="marked.parse(summary || '')"></div>

                            <!-- 加载骨架屏 -->
                            <template x-if="isSummarizing && !summary">
                                <div class="space-y-3">
                                    <div class="h-4 skeleton rounded w-full"></div>
                                    <div class="h-4 skeleton rounded w-5/6"></div>
                                    <div class="h-4 skeleton rounded w-4/6"></div>
                                    <div class="h-4 skeleton rounded w-full"></div>
                                    <div class="h-4 skeleton rounded w-3/4"></div>
                                </div>
                            </template>

                            <!-- 操作按钮 -->
                            <template x-if="summary && !isSummarizing">
                                <div class="flex items-center gap-2 mt-4 pt-4 border-t border-slate-700/50">
                                    <button @click="copyToClipboard(summary)"
                                        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-400 hover:text-white text-sm transition-all">
                                        <i class="fa-regular fa-copy w-3.5 h-3.5"></i>
                                        复制总结
                                    </button>
                                    <button @click="regenerateSummary()"
                                        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-400 hover:text-white text-sm transition-all">
                                        <i class="fa-solid fa-rotate-right w-3.5 h-3.5"></i>
                                        重新总结
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- 新闻卡片网格 -->
                <template x-if="searchResults.length > 0 || isSearching">
                    <div>
                        <!-- 结果统计 -->
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                                <i class="fa-regular fa-newspaper w-5 h-5 text-blue-400"></i>
                                搜索结果
                                <template x-if="searchResults.length > 0">
                                    <span class="text-sm font-normal text-slate-400">
                                        (共 <span x-text="searchResults.length"></span> 条)
                                    </span>
                                </template>
                            </h2>
                            <template x-if="searchResults.length > 0">
                                <button @click="exportResults()"
                                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700/50 text-slate-400 hover:text-white hover:border-blue-500/50 text-sm transition-all">
                                    <i class="fa-solid fa-download w-3.5 h-3.5"></i>
                                    导出 JSON
                                </button>
                            </template>
                        </div>

                        <!-- 骨架屏加载 -->
                        <template x-if="isSearching && searchResults.length === 0">
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                <template x-for="i in 6" :key="i">
                                    <div class="news-card rounded-xl p-5">
                                        <div class="h-5 skeleton rounded w-3/4 mb-3"></div>
                                        <div class="space-y-2 mb-4">
                                            <div class="h-3 skeleton rounded w-full"></div>
                                            <div class="h-3 skeleton rounded w-5/6"></div>
                                            <div class="h-3 skeleton rounded w-4/6"></div>
                                        </div>
                                        <div class="h-3 skeleton rounded w-1/3"></div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- 新闻卡片列表 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <template x-for="(item, index) in searchResults" :key="index">
                                <div class="news-card rounded-xl p-5 flex flex-col">
                                    <!-- 来源标签 -->
                                    <div class="flex items-center gap-2 mb-3">
                                        <span
                                            class="px-2 py-0.5 rounded-full text-xs font-medium bg-blue-500/20 text-blue-400 border border-blue-500/30">
                                            <span x-text="extractDomain(item.url)"></span>
                                        </span>
                                        <template x-if="item.score">
                                            <span
                                                class="px-2 py-0.5 rounded-full text-xs font-medium bg-green-500/20 text-green-400 border border-green-500/30">
                                                相关度 <span x-text="Math.round(item.score * 100)"></span>%
                                            </span>
                                        </template>
                                    </div>

                                    <!-- 标题 -->
                                    <h3
                                        class="text-white font-semibold mb-2 line-clamp-2 hover:text-blue-400 transition-colors">
                                        <a :href="item.url" target="_blank" rel="noopener noreferrer"
                                            x-text="item.title"></a>
                                    </h3>

                                    <!-- 内容摘要 -->
                                    <p class="text-slate-400 text-sm flex-grow line-clamp-3 mb-4" x-text="item.content">
                                    </p>

                                    <!-- 底部操作 -->
                                    <div class="flex items-center justify-between pt-3 border-t border-slate-700/50">
                                        <a :href="item.url" target="_blank" rel="noopener noreferrer"
                                            class="flex items-center gap-1 text-sm text-blue-400 hover:text-blue-300 transition-colors">
                                            <i class="fa-solid fa-arrow-up-right-from-square w-3.5 h-3.5"></i>
                                            查看原文
                                        </a>
                                        <button @click="copyToClipboard(item.content)"
                                            class="text-slate-500 hover:text-white transition-colors">
                                            <i class="fa-regular fa-copy w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- 空状态 -->
                <template x-if="!isSearching && searchResults.length === 0 && hasSearched">
                    <div class="text-center py-16">
                        <div
                            class="w-20 h-20 rounded-full bg-slate-800/80 flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-magnifying-glass w-10 h-10 text-slate-600"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-slate-400 mb-2">未找到相关结果</h3>
                        <p class="text-slate-500 text-sm">请尝试使用其他关键词搜索</p>
                    </div>
                </template>

                <!-- 初始欢迎状态 -->
                <template x-if="!hasSearched && !isSearching">
                    <div class="text-center py-16">
                        <div
                            class="w-24 h-24 rounded-full bg-gradient-to-br from-blue-500/20 to-purple-500/20 flex items-center justify-center mx-auto mb-6 border border-blue-500/30">
                            <i class="fa-solid fa-earth-americas w-12 h-12 text-blue-400"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-white mb-2">开始探索世界资讯</h3>
                        <p class="text-slate-400 text-sm max-w-md mx-auto">
                            输入您感兴趣的话题，AI 将为您搜索最新资讯并智能总结要点
                        </p>
                    </div>
                </template>
            </div>
        </main>

        <!-- ==================== 设置弹窗 ==================== -->
        <div x-show="showSettings" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
            @click.self="showSettings = false">
            <div x-show="showSettings" x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 scale-100"
                x-transition:leave-end="opacity-0 scale-95"
                class="bg-slate-800 rounded-2xl w-full max-w-md p-6 border border-slate-700/50 shadow-2xl">

                <!-- 弹窗标题 -->
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-gear w-5 h-5 text-blue-400"></i>
                        API 设置
                    </h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-white transition-colors">
                        <i class="fa-solid fa-xmark w-5 h-5"></i>
                    </button>
                </div>

                <!-- 设置表单 -->
                <div class="space-y-5">
                    <!-- Tavily API Key -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-magnifying-glass w-4 h-4 text-blue-400"></i>
                            Tavily API Key
                        </label>
                        <input type="password" x-model="apiConfig.tavily"
                            class="w-full bg-slate-900/50 border border-slate-600/50 rounded-xl p-3 text-white placeholder-slate-500 outline-none focus:border-blue-500 transition-colors"
                            placeholder="tvly-...">
                        <p class="mt-1.5 text-xs text-slate-500">
                            用于搜索新闻资讯，获取地址：
                            <a href="https://tavily.com" target="_blank"
                                class="text-blue-400 hover:underline">tavily.com</a>
                        </p>
                    </div>

                    <!-- DeepSeek API Key -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-brain w-4 h-4 text-purple-400"></i>
                            DeepSeek API Key
                        </label>
                        <input type="password" x-model="apiConfig.deepseek"
                            class="w-full bg-slate-900/50 border border-slate-600/50 rounded-xl p-3 text-white placeholder-slate-500 outline-none focus:border-blue-500 transition-colors"
                            placeholder="sk-...">
                        <p class="mt-1.5 text-xs text-slate-500">
                            用于 AI 智能总结，获取地址：
                            <a href="https://platform.deepseek.com" target="_blank"
                                class="text-blue-400 hover:underline">platform.deepseek.com</a>
                        </p>
                    </div>

                    <!-- 搜索深度 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-layer-group w-4 h-4 text-green-400"></i>
                            搜索深度
                        </label>
                        <div class="flex gap-2">
                            <button @click="searchConfig.searchDepth = 'basic'" :class="searchConfig.searchDepth === 'basic' 
                                    ? 'bg-blue-600 text-white border-blue-500' 
                                    : 'bg-slate-900/50 text-slate-400 border-slate-600/50 hover:border-blue-500/50'"
                                class="flex-1 py-2 px-4 rounded-xl border text-sm font-medium transition-all">
                                基础搜索
                            </button>
                            <button @click="searchConfig.searchDepth = 'advanced'" :class="searchConfig.searchDepth === 'advanced' 
                                    ? 'bg-purple-600 text-white border-purple-500' 
                                    : 'bg-slate-900/50 text-slate-400 border-slate-600/50 hover:border-purple-500/50'"
                                class="flex-1 py-2 px-4 rounded-xl border text-sm font-medium transition-all">
                                深度搜索
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="mt-8 flex justify-end gap-3">
                    <button @click="showSettings = false"
                        class="px-5 py-2.5 rounded-xl text-slate-400 hover:text-white transition-colors">
                        取消
                    </button>
                    <button @click="saveConfig()"
                        class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-xl font-medium transition-all shadow-lg shadow-blue-500/25">
                        保存配置
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== Toast 通知 ==================== -->
        <div x-show="toast.show" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-4"
            class="fixed bottom-6 right-6 bg-slate-800 rounded-xl shadow-2xl border border-slate-700/50 px-5 py-3 flex items-center gap-3 z-50">
            <i :class="toast.icon" :class="{
                    'text-green-400': toast.icon === 'fa-solid fa-check',
                    'text-red-400': toast.icon === 'fa-solid fa-circle-xmark',
                    'text-yellow-400': toast.icon === 'fa-solid fa-circle-exclamation'
                }" class="w-5 h-5"></i>
            <span class="text-white" x-text="toast.message"></span>
        </div>
    </div>

    <script>
        /**
         * 智能新闻搜索应用
         * 功能：搜索新闻 + AI 总结
         */
        document.addEventListener('alpine:init', () => {
            Alpine.data('newsSearch', () => ({
                // ==================== 状态管理 ====================
                showSettings: false,          // 设置弹窗显示状态
                isSearching: false,           // 搜索加载状态
                isSummarizing: false,         // 总结加载状态
                hasSearched: false,           // 是否已执行过搜索

                // API 配置
                apiConfig: {
                    tavily: '',               // Tavily API Key
                    deepseek: '',             // DeepSeek API Key
                    model: 'deepseek-v4-flash'    // 当前使用的模型
                },

                // 搜索配置
                searchConfig: {
                    maxResults: '10',         // 最大结果数
                    searchDepth: 'basic'      // 搜索深度
                },

                // 搜索相关
                searchQuery: '',              // 搜索关键词
                searchResults: [],            // 搜索结果列表

                // AI 总结
                summary: '',                  // AI 总结内容
                reasoning: '',                // V4 Pro 模型推理过程

                // Toast 通知
                toast: { show: false, message: '', icon: 'fa-solid fa-check' },

                // 快捷搜索标签
                quickTags: ['人工智能', '科技创新', '经济趋势', '气候变化', '医疗健康', '国际新闻'],

                // ==================== 生命周期 ====================
                /**
                 * 组件初始化
                 */
                init() {
                    this.loadConfig();


                },

                // ==================== 配置管理 ====================
                /**
                 * 从 localStorage 加载配置
                 */
                loadConfig() {
                    // 加载全局 LLM 配置
                    const globalConfig = localStorage.getItem('global_llm_config');
                    if (globalConfig) {
                        try {
                            const parsed = JSON.parse(globalConfig);
                            this.apiConfig = { ...this.apiConfig, ...parsed };
                        } catch (e) {
                            console.error('解析 global_llm_config 失败:', e);
                        }
                    }

                    // 加载搜索配置
                    const searchConfig = localStorage.getItem('news_search_config');
                    if (searchConfig) {
                        try {
                            this.searchConfig = { ...this.searchConfig, ...JSON.parse(searchConfig) };
                        } catch (e) {
                            console.error('解析 news_search_config 失败:', e);
                        }
                    }
                },

                /**
                 * 保存配置到 localStorage
                 */
                saveConfig() {
                    // 保存全局 LLM 配置（合并策略）
                    let currentGlobal = {};
                    try {
                        currentGlobal = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('解析 global_llm_config 失败:', e);
                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...currentGlobal,
                        tavily: this.apiConfig.tavily,
                        deepseek: this.apiConfig.deepseek,
                        model: this.apiConfig.model
                    }));

                    // 保存搜索配置
                    localStorage.setItem('news_search_config', JSON.stringify(this.searchConfig));

                    this.showToast('配置已保存');
                    this.showSettings = false;

                },

                // ==================== 搜索功能 ====================
                /**
                 * 执行搜索
                 */
                async search() {
                    const query = this.searchQuery.trim();
                    if (!query) {
                        this.showToast('请输入搜索关键词', 'fa-solid fa-circle-exclamation');
                        return;
                    }

                    // 检查 Tavily API Key
                    if (!this.apiConfig.tavily) {
                        this.showToast('请先配置 Tavily API Key', 'fa-solid fa-circle-exclamation');
                        this.showSettings = true;
                        return;
                    }

                    this.isSearching = true;
                    this.hasSearched = true;
                    this.searchResults = [];
                    this.summary = '';
                    this.reasoning = '';



                    try {
                        // 调用 Tavily API 搜索
                        const results = await this.callTavilySearch(query);
                        this.searchResults = results;




                        // 如果有结果且配置了 DeepSeek，自动生成总结
                        if (results.length > 0 && this.apiConfig.deepseek) {
                            this.generateSummary(query, results);
                        }
                    } catch (error) {

                        this.showToast('搜索失败: ' + error.message, 'fa-solid fa-circle-xmark');
                    } finally {
                        this.isSearching = false;

                    }
                },

                /**
                 * 调用 Tavily Search API
                 * @param {string} query - 搜索关键词
                 * @returns {Array} 搜索结果
                 */
                async callTavilySearch(query) {
                    const response = await fetch('https://api.tavily.com/search', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            api_key: this.apiConfig.tavily,
                            query: query,
                            search_depth: this.searchConfig.searchDepth,
                            max_results: parseInt(this.searchConfig.maxResults),
                            include_answer: false,
                            include_raw_content: false
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message || 'Tavily API 调用失败');
                    }

                    const data = await response.json();
                    return data.results || [];
                },

                // ==================== AI 总结功能 ====================
                /**
                 * 生成 AI 总结
                 * @param {string} query - 搜索关键词
                 * @param {Array} results - 搜索结果
                 */
                async generateSummary(query, results) {
                    this.isSummarizing = true;
                    this.summary = '';
                    this.reasoning = '';



                    try {
                        // 构建内容摘要
                        const contentSummary = results.map((item, idx) =>
                            `【${idx + 1}】${item.title}\n${item.content}`
                        ).join('\n\n');

                        // 构建提示词
                        const messages = [
                            {
                                role: 'system',
                                content: `你是一位专业的新闻分析师。请根据用户搜索的主题和相关新闻内容，提供一份简洁但全面的总结分析。

要求：
1. 首先概述搜索主题的核心要点（2-3句话）
2. 分析主要发现和趋势（使用要点列表）
3. 如有不同观点或立场，请客观呈现
4. 总结可能的影响或未来展望

输出格式要求：
- 使用 Markdown 格式
- 适当使用标题、列表、加粗等格式
- 语言简洁专业，避免冗余`
                            },
                            {
                                role: 'user',
                                content: `搜索主题：${query}\n\n相关新闻内容：\n${contentSummary}\n\n请分析总结以上内容。`
                            }
                        ];

                        // 流式调用 DeepSeek API
                        await this.streamChat(messages);


                    } catch (error) {

                        this.showToast('总结生成失败: ' + error.message, 'fa-solid fa-circle-xmark');
                    } finally {
                        this.isSummarizing = false;

                    }
                },

                /**
                 * 重新生成总结
                 */
                regenerateSummary() {
                    if (this.searchResults.length > 0) {
                        this.generateSummary(this.searchQuery, this.searchResults);
                    }
                },

                /**
                 * 流式调用 DeepSeek Chat API
                 * @param {Array} messages - 消息列表
                 */
                async streamChat(messages) {
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiConfig.deepseek}`
                        },
                        body: JSON.stringify({
                            model: this.apiConfig.model,
                            messages: messages,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error?.message || 'DeepSeek API 调用失败');
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullContent = '';
                    let reasoningContent = '';
                    let lastUpdate = Date.now();
                    const UPDATE_INTERVAL = 100; // 节流更新间隔

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n').filter(line => line.startsWith('data: '));

                        for (const line of lines) {
                            if (line === 'data: [DONE]') continue;

                            try {
                                const data = JSON.parse(line.slice(6));
                                const delta = data.choices[0]?.delta;

                                // 处理推理内容（V4 Pro 模型）
                                if (delta?.reasoning_content) {
                                    reasoningContent += delta.reasoning_content;
                                    // 节流更新推理内容
                                    if (Date.now() - lastUpdate >= UPDATE_INTERVAL) {
                                        this.reasoning = reasoningContent;
                                        lastUpdate = Date.now();
                                    }
                                }

                                // 处理正常内容
                                if (delta?.content) {
                                    fullContent += delta.content;
                                    // 节流更新内容
                                    if (Date.now() - lastUpdate >= UPDATE_INTERVAL) {
                                        this.summary = fullContent;
                                        lastUpdate = Date.now();
                                    }
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }

                    // 最终更新
                    this.summary = fullContent;
                    this.reasoning = reasoningContent;
                },

                // ==================== 工具函数 ====================
                /**
                 * 从 URL 提取域名
                 * @param {string} url - 完整 URL
                 * @returns {string} 域名
                 */
                extractDomain(url) {
                    try {
                        const domain = new URL(url).hostname;
                        return domain.replace('www.', '');
                    } catch {
                        return '未知来源';
                    }
                },

                /**
                 * 导出搜索结果为 JSON
                 */
                exportResults() {
                    const exportData = {
                        query: this.searchQuery,
                        timestamp: new Date().toISOString(),
                        summary: this.summary,
                        reasoning: this.reasoning,
                        results: this.searchResults
                    };

                    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `news_search_${this.searchQuery}_${Date.now()}.json`;
                    a.click();
                    URL.revokeObjectURL(url);

                    this.showToast('导出成功');
                },

                /**
                 * 复制内容到剪贴板
                 * @param {string} text - 要复制的文本
                 */
                async copyToClipboard(text) {
                    try {
                        await navigator.clipboard.writeText(text);
                        this.showToast('已复制到剪贴板');
                    } catch (e) {
                        // 降级方案
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        this.showToast('已复制到剪贴板');
                    }
                },

                /**
                 * 显示 Toast 通知
                 * @param {string} message - 通知消息
                 * @param {string} icon - 图标名称
                 */
                showToast(message, icon = 'check') {
                    this.toast = { show: true, message, icon };
                    this.refreshIcons();
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                /**
                 * 刷新 Lucide 图标
                 */
                refreshIcons() {
                    setTimeout(() => {

                    }, 50);
                }
            }));
        });
    </script>
