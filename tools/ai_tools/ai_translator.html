<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 翻译助手 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 基础样式 - 采用蓝色国际化风格 */
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #e0e7ff 100%);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 3px;
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        /* 语言标签样式 */
        .lang-tag {
            transition: all 0.2s ease;
        }

        .lang-tag:hover {
            transform: scale(1.05);
        }

        .lang-tag.active {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border-color: transparent;
        }

        /* 进度条动画 */
        @keyframes progress-stripe {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 40px 0;
            }
        }

        .progress-stripe {
            background-image: linear-gradient(45deg,
                    rgba(255, 255, 255, 0.15) 25%,
                    transparent 25%,
                    transparent 50%,
                    rgba(255, 255, 255, 0.15) 50%,
                    rgba(255, 255, 255, 0.15) 75%,
                    transparent 75%,
                    transparent);
            background-size: 40px 40px;
            animation: progress-stripe 1s linear infinite;
        }

        /* 翻译结果卡片 */
        .translation-card {
            transition: all 0.3s ease;
        }

        .translation-card:hover {
            box-shadow: 0 8px 30px -12px rgba(59, 130, 246, 0.3);
        }

        /* 国旗 emoji 样式 */
        .flag-emoji {
            font-size: 1.5rem;
        }

        /* 模式切换按钮 */
        .mode-btn {
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
        }

        /* 加载动画 */
        @keyframes bounce-dot {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin: 0 2px;
            background: #3b82f6;
            border-radius: 50%;
            animation: bounce-dot 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <!-- 
        AI 翻译助手 - Alpine.js 应用
        功能：
        1. 多语言同时翻译
        2. 长文本自动分段并行翻译
        3. 失败自动重试（最多3次）
        4. 反向翻译验证
        5. 导出多语言对照表
    -->
    <div x-data="translatorApp" class="min-h-screen flex flex-col">

        <!-- 顶部导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-blue-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <!-- 左侧：返回首页 -->
                    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition"
                        onclick="location.href='../../index.html'">
                        <i class="fa-solid fa-language text-blue-600 h-6 w-6"></i>
                        <span class="font-bold text-xl tracking-tight text-slate-900">AI 翻译助手</span>
                    </div>
                    <!-- 右侧：模型切换 + 设置 -->
                    <div class="flex items-center gap-4">
                        <!-- V4 Flash/V4 Pro 模型切换器 -->
                        <div class="flex items-center gap-2 bg-slate-100 rounded-lg p-1">
                            <button @click="apiConfig.model = 'deepseek-v4-flash'"
                                :class="{'bg-white shadow text-blue-600': apiConfig.model === 'deepseek-v4-flash', 'text-slate-500': apiConfig.model !== 'deepseek-v4-flash'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="apiConfig.model = 'deepseek-v4-pro'"
                                :class="{'bg-white shadow text-blue-600': apiConfig.model === 'deepseek-v4-pro', 'text-slate-500': apiConfig.model !== 'deepseek-v4-pro'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-blue-600 transition flex items-center gap-1 text-sm font-medium">
                            <i class="fa-solid fa-gear h-4 w-4"></i>
                            <span class="hidden sm:inline">设置</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="flex-grow flex flex-col lg:flex-row overflow-hidden h-[calc(100vh-4rem)]">

            <!-- 左侧：输入面板 -->
            <div
                class="w-full lg:w-2/5 bg-white/70 backdrop-blur-sm border-r border-blue-200 p-5 overflow-y-auto space-y-5">

                <!-- 源文本输入 -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                            <i class="fa-solid fa-file-lines w-4 h-4 text-blue-600"></i>
                            源文本
                        </label>
                        <span class="text-xs text-slate-500" x-text="input.sourceText.length + ' 字符'"></span>
                    </div>
                    <textarea x-model="input.sourceText" rows="8" placeholder="输入要翻译的文本...&#10;&#10;支持长文本，将自动分段并行翻译"
                        class="w-full bg-white border border-blue-200 rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition resize-none"></textarea>
                </div>

                <!-- 源语言检测 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-magnifying-glass w-4 h-4 text-blue-600"></i>
                        源语言
                    </label>
                    <select x-model="input.sourceLanguage"
                        class="w-full bg-white border border-blue-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="auto">🔍 自动检测</option>
                        <template x-for="lang in languages" :key="lang.code">
                            <option :value="lang.code" x-text="lang.flag + ' ' + lang.name"></option>
                        </template>
                    </select>
                </div>

                <!-- 目标语言选择（多选） -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-globe w-4 h-4 text-blue-600"></i>
                        目标语言（可多选）
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <template x-for="lang in languages" :key="lang.code">
                            <button @click="toggleTargetLanguage(lang.code)"
                                :class="['lang-tag px-3 py-1.5 text-xs font-medium rounded-full border transition', input.targetLanguages.includes(lang.code) ? 'active' : 'bg-white border-blue-200 text-slate-600']"
                                x-text="lang.flag + ' ' + lang.name">
                            </button>
                        </template>
                    </div>
                    <div class="flex gap-2">
                        <button @click="selectAllLanguages" class="text-xs text-blue-600 hover:underline">全选</button>
                        <button @click="clearTargetLanguages" class="text-xs text-slate-500 hover:underline">清空</button>
                    </div>
                </div>

                <!-- 翻译模式 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-sliders w-4 h-4 text-blue-600"></i>
                        翻译模式
                    </label>
                    <div class="grid grid-cols-3 gap-2">
                        <template x-for="mode in translationModes" :key="mode.value">
                            <button @click="input.mode = mode.value"
                                :class="['mode-btn p-3 rounded-xl border text-center transition', input.mode === mode.value ? 'active' : 'border-blue-200 bg-white text-slate-600 hover:border-blue-400']">
                                <span class="text-lg block" x-text="mode.icon"></span>
                                <span class="text-xs font-medium block mt-1" x-text="mode.label"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- 高级选项 -->
                <div class="space-y-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" x-model="input.enableVerification"
                            class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                        <span class="text-sm text-slate-700">启用反向翻译验证</span>
                    </label>
                </div>

                <!-- 翻译按钮 -->
                <button @click="startTranslation"
                    :disabled="isTranslating || !input.sourceText.trim() || input.targetLanguages.length === 0"
                    class="w-full bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-all">
                    <template x-if="isTranslating">
                        <i class="fa-solid fa-spinner animate-spin w-5 h-5"></i>
                    </template>
                    <template x-if="!isTranslating">
                        <i class="fa-solid fa-language w-5 h-5"></i>
                    </template>
                    <span x-text="isTranslating ? '正在翻译...' : '🌍 开始翻译'"></span>
                </button>

                <!-- 进度显示 -->
                <div x-show="isTranslating" class="space-y-3">
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-slate-600">翻译进度</span>
                        <span class="text-blue-600 font-medium" x-text="completedCount + '/' + totalCount"></span>
                    </div>
                    <div class="h-3 bg-blue-100 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 progress-stripe transition-all"
                            :style="{ width: progressPercent + '%' }"></div>
                    </div>
                    <!-- 当前翻译状态 -->
                    <div class="text-xs text-slate-500 flex items-center gap-2">
                        <div class="loading-dots">
                            <span></span><span></span><span></span>
                        </div>
                        <span x-text="currentTranslationStatus"></span>
                    </div>
                </div>

            </div>

            <!-- 右侧：结果展示区 -->
            <div class="flex-grow bg-gradient-to-br from-blue-50/50 to-indigo-50/50 p-6 overflow-y-auto">

                <!-- 空状态 -->
                <div x-show="Object.keys(results).length === 0 && !isTranslating"
                    class="h-full flex flex-col items-center justify-center text-slate-400">
                    <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mb-6">
                        <i class="fa-solid fa-language w-12 h-12 text-blue-400"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-600 mb-2">AI 翻译助手</h3>
                    <p class="text-center max-w-md">
                        支持多语言并行翻译，长文本自动分段<br>
                        <span class="text-blue-600 font-medium">12+ 语言 · 多模式翻译 · 自动重试</span>
                    </p>
                </div>

                <!-- 结果展示 -->
                <div x-show="Object.keys(results).length > 0" class="max-w-4xl mx-auto space-y-6">

                    <!-- 顶部操作栏 -->
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-slate-500">已翻译</span>
                            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-bold"
                                x-text="Object.keys(results).length + ' 种语言'">
                            </span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button @click="copyAllResults"
                                class="flex items-center gap-1.5 px-4 py-2 bg-white border border-blue-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-blue-50 transition">
                                <i class="fa-regular fa-copy w-4 h-4"></i>
                                复制全部
                            </button>
                            <button @click="exportResults"
                                class="flex items-center gap-1.5 px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                                <i class="fa-solid fa-download w-4 h-4"></i>
                                导出对照表
                            </button>
                        </div>
                    </div>

                    <!-- 翻译结果列表 -->
                    <div class="space-y-4">
                        <template x-for="(result, langCode) in results" :key="langCode">
                            <div
                                class="translation-card bg-white rounded-2xl border border-blue-100 overflow-hidden animate-fade-in">

                                <!-- 语言头部 -->
                                <div
                                    class="px-5 py-3 bg-gradient-to-r from-blue-50 to-indigo-50 border-b border-blue-100 flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <span class="flag-emoji" x-text="getLanguageInfo(langCode).flag"></span>
                                        <div>
                                            <h3 class="font-bold text-slate-800"
                                                x-text="getLanguageInfo(langCode).name"></h3>
                                            <span class="text-xs text-slate-500" x-text="langCode.toUpperCase()"></span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <!-- 状态指示 -->
                                        <span x-show="result.status === 'loading'"
                                            class="text-xs text-blue-500 flex items-center gap-1">
                                            <i class="fa-solid fa-spinner w-3 h-3 animate-spin"></i> 翻译中...
                                        </span>
                                        <span x-show="result.status === 'error'"
                                            class="text-xs text-red-500 flex items-center gap-1">
                                            <i class="fa-solid fa-circle-exclamation w-3 h-3"></i> 失败
                                        </span>
                                        <span x-show="result.status === 'retry'"
                                            class="text-xs text-orange-500 flex items-center gap-1">
                                            <i class="fa-solid fa-rotate w-3 h-3 animate-spin"></i> 重试中
                                        </span>
                                        <span x-show="result.status === 'complete'"
                                            class="text-xs text-green-500 flex items-center gap-1">
                                            <i class="fa-solid fa-circle-check w-3 h-3"></i> 完成
                                        </span>
                                        <!-- 复制按钮 -->
                                        <button x-show="result.text" @click="copyResult(langCode)"
                                            class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition">
                                            <i class="fa-regular fa-copy w-4 h-4"></i>
                                        </button>
                                        <!-- 重试按钮 -->
                                        <button x-show="result.status === 'error'" @click="retryTranslation(langCode)"
                                            class="p-2 text-slate-400 hover:text-orange-600 hover:bg-orange-50 rounded-lg transition">
                                            <i class="fa-solid fa-rotate w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- 翻译内容 -->
                                <div class="p-5">
                                    <div x-show="result.status === 'loading'"
                                        class="text-slate-400 text-sm flex items-center gap-2">
                                        <div class="loading-dots"><span></span><span></span><span></span></div>
                                        正在翻译...
                                    </div>
                                    <div x-show="result.status === 'error'" class="text-red-500 text-sm">
                                        翻译失败：<span x-text="result.error"></span>
                                    </div>
                                    <div x-show="result.status === 'complete' || result.status === 'retry'"
                                        class="text-slate-700 leading-relaxed whitespace-pre-wrap" x-text="result.text">
                                    </div>

                                    <!-- 反向翻译验证 -->
                                    <div x-show="result.verification && input.enableVerification"
                                        class="mt-4 p-3 bg-slate-50 rounded-lg">
                                        <p class="text-xs text-slate-500 mb-1 flex items-center gap-1">
                                            <i class="fa-solid fa-shield-halved w-3 h-3"></i>
                                            反向翻译验证：
                                        </p>
                                        <p class="text-sm text-slate-600" x-text="result.verification"></p>
                                    </div>
                                </div>

                            </div>
                        </template>
                    </div>

                </div>

            </div>

        </div>

        <!-- API 设置弹窗 -->
        <div x-show="showSettings" x-transition
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-fade-in"
                @click.outside="showSettings = false">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark w-5 h-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" x-model="apiConfig.deepseek"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="sk-...">
                        <p class="text-xs text-slate-500 mt-1">Key 将保存到本地，所有工具共享使用</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">每段最大字符数</label>
                        <input type="number" x-model.number="apiConfig.chunkSize"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="3000">
                        <p class="text-xs text-slate-500 mt-1">长文本会自动分段，建议 2000-4000</p>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button @click="saveConfig"
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">保存配置</button>
                </div>
            </div>
        </div>

        <!-- Toast 提示 -->
        <div x-show="toast.show" x-transition
            class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in z-[200]">
            <i :class="toast.icon" class="w-4 h-4"></i>
            <span class="text-sm" x-text="toast.message"></span>
        </div>

    </div>

    <script>
        /**
         * AI 翻译助手 - Alpine.js 应用
         * 功能：多语言并行翻译、自动分段、失败重试、反向翻译验证
         */
        document.addEventListener('alpine:init', () => {
            Alpine.data('translatorApp', () => ({
                // ==================== 状态管理 ====================
                showSettings: false,

                // API 配置
                apiConfig: {
                    deepseek: '',
                    chunkSize: 3000,
                    model: 'deepseek-v4-flash' // 默认使用 V4 Flash
                },

                // 支持的语言列表
                languages: [
                    { code: 'en', name: '英语', flag: '🇬🇧' },
                    { code: 'ja', name: '日语', flag: '🇯🇵' },
                    { code: 'ko', name: '韩语', flag: '🇰🇷' },
                    { code: 'es', name: '西班牙语', flag: '🇪🇸' },
                    { code: 'fr', name: '法语', flag: '🇫🇷' },
                    { code: 'de', name: '德语', flag: '🇩🇪' },
                    { code: 'ru', name: '俄语', flag: '🇷🇺' },
                    { code: 'ar', name: '阿拉伯语', flag: '🇸🇦' },
                    { code: 'pt', name: '葡萄牙语', flag: '🇵🇹' },
                    { code: 'th', name: '泰语', flag: '🇹🇭' },
                    { code: 'vi', name: '越南语', flag: '🇻🇳' },
                    { code: 'id', name: '印尼语', flag: '🇮🇩' }
                ],

                // 翻译模式
                translationModes: [
                    { value: 'literal', label: '直译', icon: '📝' },
                    { value: 'localized', label: '意译本地化', icon: '🌍' },
                    { value: 'marketing', label: '营销风格', icon: '📢' }
                ],

                // 用户输入
                input: {
                    sourceText: '',
                    sourceLanguage: 'auto',
                    targetLanguages: ['en', 'ja', 'ko'],
                    mode: 'localized',
                    enableVerification: false
                },

                // 翻译状态
                isTranslating: false,
                completedCount: 0,
                totalCount: 0,
                currentTranslationStatus: '',

                // 翻译结果
                results: {},

                // Toast 提示
                toast: {
                    show: false,
                    message: '',
                    icon: 'fa-solid fa-check'
                },

                // 计算进度百分比
                get progressPercent() {
                    if (this.totalCount === 0) return 0;
                    return Math.round((this.completedCount / this.totalCount) * 100);
                },

                // ==================== 生命周期 ====================
                init() {
                    // 加载 API 配置
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        const config = JSON.parse(saved);
                        this.apiConfig.deepseek = config.deepseek || '';
                    }

                    if (savedChunk) {
                        this.apiConfig.chunkSize = parseInt(savedChunk);
                    }
                },

                // ==================== 方法 ====================

                // 显示 Toast
                showToast(message, icon = 'fa-solid fa-check') {
                    this.toast = { show: true, message, icon };
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                // 保存配置
                saveConfig() {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, deepseek: this.apiConfig.deepseek }));
                    localStorage.setItem('translator_chunk_size', this.apiConfig.chunkSize.toString());
                    this.showSettings = false;
                    this.showToast('配置已保存', 'fa-solid fa-check');
                },

                // 切换目标语言
                toggleTargetLanguage(code) {
                    const idx = this.input.targetLanguages.indexOf(code);
                    if (idx > -1) {
                        this.input.targetLanguages.splice(idx, 1);
                    } else {
                        this.input.targetLanguages.push(code);
                    }
                },

                // 全选语言
                selectAllLanguages() {
                    this.input.targetLanguages = this.languages.map(l => l.code);
                },

                // 清空目标语言
                clearTargetLanguages() {
                    this.input.targetLanguages = [];
                },

                // 获取语言信息
                getLanguageInfo(code) {
                    return this.languages.find(l => l.code === code) || { name: code, flag: '🌐' };
                },

                // 获取翻译模式名称
                getModeName() {
                    return this.translationModes.find(m => m.value === this.input.mode)?.label || this.input.mode;
                },

                // 分段长文本
                splitTextIntoChunks(text) {
                    const chunkSize = this.apiConfig.chunkSize;
                    if (text.length <= chunkSize) {
                        return [text];
                    }

                    const chunks = [];
                    const paragraphs = text.split(/\n\n+/);
                    let currentChunk = '';

                    for (const para of paragraphs) {
                        if ((currentChunk + para).length > chunkSize && currentChunk) {
                            chunks.push(currentChunk.trim());
                            currentChunk = para;
                        } else {
                            currentChunk += (currentChunk ? '\n\n' : '') + para;
                        }
                    }

                    if (currentChunk) {
                        chunks.push(currentChunk.trim());
                    }

                    return chunks;
                },

                // 单次翻译调用（带重试）
                async translateWithRetry(text, targetLang, maxRetries = 3) {
                    const langInfo = this.getLanguageInfo(targetLang);

                    let modeInstruction = '';
                    switch (this.input.mode) {
                        case 'literal':
                            modeInstruction = '请进行直译，尽量保持原文的表达方式和结构。';
                            break;
                        case 'localized':
                            modeInstruction = '请进行意译本地化，使翻译更符合目标语言的表达习惯和文化背景。';
                            break;
                        case 'marketing':
                            modeInstruction = '请按照营销文案风格翻译，使内容更具吸引力和感染力，适合广告宣传使用。';
                            break;
                    }

                    const prompt = `请将以下文本翻译成${langInfo.name}。

${modeInstruction}

要求：
1. 保持原文的含义和语气
2. 翻译要自然流畅
3. 直接输出翻译结果，不要添加任何解释或前缀

原文：
${text}`;

                    for (let attempt = 1; attempt <= maxRetries; attempt++) {
                        try {
                            if (attempt > 1) {
                                this.results[targetLang].status = 'retry';
                                this.results[targetLang].retryCount = attempt;
                            }

                            const response = await fetch('https://api.deepseek.com/chat/completions', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${this.apiConfig.deepseek}`
                                },
                                body: JSON.stringify({
                                    model: this.apiConfig.model,
                                    messages: [{ role: 'user', content: prompt }],
                                    stream: false
                                })
                            });

                            if (!response.ok) {
                                throw new Error(`HTTP ${response.status}`);
                            }

                            const data = await response.json();
                            return data.choices?.[0]?.message?.content?.trim() || '';

                        } catch (error) {
                            console.error(`[${targetLang}] 翻译失败 (尝试 ${attempt}/${maxRetries}):`, error);

                            if (attempt === maxRetries) {
                                throw error;
                            }

                            await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
                        }
                    }
                },

                // 反向翻译验证
                async verifyTranslation(translatedText) {
                    try {
                        const prompt = `请将以下文本翻译回中文，只输出翻译结果：

${translatedText}`;

                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model,
                                messages: [{ role: 'user', content: prompt }],
                                stream: false
                            })
                        });

                        const data = await response.json();
                        return data.choices?.[0]?.message?.content?.trim() || '';

                    } catch (error) {
                        console.error('反向翻译验证失败:', error);
                        return null;
                    }
                },

                // 翻译单个语言
                async translateToLanguage(targetLang) {
                    this.results[targetLang] = {
                        status: 'loading',
                        text: '',
                        error: null,
                        verification: null,
                        retryCount: 0
                    };

                    try {
                        this.currentTranslationStatus = `正在翻译 ${this.getLanguageInfo(targetLang).name}...`;

                        // 分段翻译
                        const chunks = this.splitTextIntoChunks(this.input.sourceText);
                        const translatedChunks = [];

                        for (let i = 0; i < chunks.length; i++) {
                            if (chunks.length > 1) {
                                this.currentTranslationStatus = `正在翻译 ${this.getLanguageInfo(targetLang).name} (${i + 1}/${chunks.length})...`;
                            }

                            const translated = await this.translateWithRetry(chunks[i], targetLang);
                            translatedChunks.push(translated);
                        }

                        this.results[targetLang].text = translatedChunks.join('\n\n');

                        // 反向翻译验证
                        if (this.input.enableVerification) {
                            this.currentTranslationStatus = `验证 ${this.getLanguageInfo(targetLang).name} 翻译...`;
                            this.results[targetLang].verification = await this.verifyTranslation(this.results[targetLang].text);
                        }

                        this.results[targetLang].status = 'complete';

                    } catch (error) {
                        this.results[targetLang].status = 'error';
                        this.results[targetLang].error = error.message;
                    }

                    this.completedCount++;
                },

                // 开始翻译
                async startTranslation() {
                    if (!this.apiConfig.deepseek) {
                        this.showSettings = true;
                        this.showToast('请先配置 API Key', 'fa-solid fa-circle-exclamation');
                        return;
                    }

                    // 清空之前的结果
                    this.results = {};

                    this.isTranslating = true;
                    this.completedCount = 0;
                    this.totalCount = this.input.targetLanguages.length;

                    // 并行翻译所有语言
                    const promises = this.input.targetLanguages.map(lang => this.translateToLanguage(lang));

                    try {
                        await Promise.all(promises);
                        this.showToast('翻译完成！', 'fa-solid fa-circle-check');
                    } catch (error) {
                        this.showToast('部分翻译失败', 'fa-solid fa-circle-exclamation');
                    } finally {
                        this.isTranslating = false;
                        this.currentTranslationStatus = '';
                    }
                },

                // 重试单个语言翻译
                async retryTranslation(langCode) {
                    this.completedCount--;
                    await this.translateToLanguage(langCode);
                },

                // 复制单个结果
                copyResult(langCode) {
                    const text = this.results[langCode]?.text;
                    if (text) {
                        navigator.clipboard.writeText(text).then(() => {
                            this.showToast('已复制到剪贴板', 'fa-regular fa-copy');
                        });
                    }
                },

                // 复制全部结果
                copyAllResults() {
                    let text = `【原文】\n${this.input.sourceText}\n\n`;

                    for (const langCode of this.input.targetLanguages) {
                        const langInfo = this.getLanguageInfo(langCode);
                        const result = this.results[langCode];
                        if (result?.text) {
                            text += `【${langInfo.flag} ${langInfo.name}】\n${result.text}\n\n`;
                        }
                    }

                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制全部翻译', 'fa-regular fa-copy');
                    });
                },

                // 导出多语言对照表
                exportResults() {
                    // 构建 CSV 格式
                    let csv = '语言,翻译结果\n';
                    csv += `原文,"${this.input.sourceText.replace(/"/g, '""')}"\n`;

                    for (const langCode of this.input.targetLanguages) {
                        const langInfo = this.getLanguageInfo(langCode);
                        const result = this.results[langCode];
                        if (result?.text) {
                            csv += `${langInfo.name},"${result.text.replace(/"/g, '""')}"\n`;
                        }
                    }

                    // 添加 BOM 以支持 Excel 打开
                    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `翻译对照表_${new Date().toISOString().slice(0, 10)}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    this.showToast('已导出 CSV 文件', 'fa-solid fa-download');
                }
            }));
        });
    </script>
