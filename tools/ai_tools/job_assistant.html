<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能求职招聘助手 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
        }

        /* 标签页切换动画 */
        .tab-indicator {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 卡片悬浮效果 */
        .hover-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hover-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
        }

        /* 评分环形进度条 */
        .score-ring {
            transform: rotate(-90deg);
        }

        .score-ring-circle {
            transition: stroke-dashoffset 0.6s ease;
        }

        /* Markdown 渲染样式 */
        .prose h1,
        .prose h2,
        .prose h3 {
            color: #1e293b;
            font-weight: 700;
        }

        .prose h1 {
            font-size: 1.5rem;
            margin-top: 1rem;
        }

        .prose h2 {
            font-size: 1.25rem;
            margin-top: 0.8rem;
        }

        .prose h3 {
            font-size: 1.1rem;
            margin-top: 0.6rem;
        }

        .prose ul {
            list-style: disc;
            margin-left: 1.5rem;
        }

        .prose ol {
            list-style: decimal;
            margin-left: 1.5rem;
        }

        .prose li {
            margin-bottom: 0.25rem;
        }

        .prose p {
            margin-bottom: 0.5rem;
            line-height: 1.7;
        }

        .prose strong {
            color: #7c3aed;
            font-weight: 600;
        }

        .prose blockquote {
            border-left: 3px solid #a78bfa;
            padding-left: 1rem;
            color: #64748b;
            font-style: italic;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c4b5fd;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a78bfa;
        }

        /* 闪烁动画 */
        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4);
            }

            50% {
                box-shadow: 0 0 20px 10px rgba(139, 92, 246, 0);
            }
        }

        .pulse-glow {
            animation: pulse-glow 2s infinite;
        }

        /* 文本区域自适应高度 */
        textarea {
            field-sizing: content;
            min-height: 100px;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div x-data="jobAssistant" class="min-h-screen flex flex-col">

        <!-- ==================== 导航栏 ==================== -->
        <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-purple-100 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <!-- 左侧：返回首页 + 标题 -->
                <a href="../../index.html" class="flex items-center gap-3 group">
                    <div
                        class="w-10 h-10 bg-gradient-to-br from-violet-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-violet-300 transition-shadow">
                        <i class="fa-solid fa-briefcase w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <span class="font-bold text-xl text-slate-800">智能求职招聘助手</span>
                        <p class="text-xs text-slate-500 hidden sm:block">JD生成 · 简历匹配 · 简历优化</p>
                    </div>
                </a>

                <!-- 右侧：模型选择 + 设置 -->
                <div class="flex items-center gap-3">
                    <!-- 模型切换 -->
                    <div class="flex bg-slate-100 rounded-lg p-1">
                        <button @click="apiConfig.model = 'deepseek-v4-flash'"
                            :class="apiConfig.model === 'deepseek-v4-flash' ? 'bg-white shadow text-violet-600' : 'text-slate-500'"
                            class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all">V4 Flash</button>
                        <button @click="apiConfig.model = 'deepseek-v4-pro'"
                            :class="apiConfig.model === 'deepseek-v4-pro' ? 'bg-white shadow text-violet-600' : 'text-slate-500'"
                            class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all">V4 Pro</button>
                    </div>
                    <!-- 设置按钮 -->
                    <button @click="showSettings = true"
                        class="p-2 text-slate-500 hover:text-violet-600 hover:bg-violet-50 rounded-lg transition">
                        <i class="fa-solid fa-gear w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- ==================== 主内容区 ==================== -->
        <main class="flex-grow p-4 md:p-8">
            <div class="max-w-6xl mx-auto">

                <!-- 视角切换标签 -->
                <div class="bg-white/80 backdrop-blur-md rounded-2xl p-2 mb-6 flex shadow-lg">
                    <button @click="currentView = 'jobseeker'"
                        :class="currentView === 'jobseeker' ? 'bg-gradient-to-r from-violet-500 to-purple-600 text-white shadow-lg' : 'text-slate-600 hover:bg-slate-100'"
                        class="flex-1 py-3 px-6 rounded-xl font-semibold transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-user w-5 h-5"></i>
                        <span>求职者视角</span>
                    </button>
                    <button @click="currentView = 'hr'"
                        :class="currentView === 'hr' ? 'bg-gradient-to-r from-violet-500 to-purple-600 text-white shadow-lg' : 'text-slate-600 hover:bg-slate-100'"
                        class="flex-1 py-3 px-6 rounded-xl font-semibold transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-building w-5 h-5"></i>
                        <span>HR/猎头视角</span>
                    </button>
                </div>

                <!-- ==================== 求职者视角 ==================== -->
                <div x-show="currentView === 'jobseeker'" x-transition:enter="transition ease-out duration-300"
                    x-transition:enter-start="opacity-0 translate-y-4"
                    x-transition:enter-end="opacity-100 translate-y-0">

                    <!-- 功能选项卡 -->
                    <div class="bg-white rounded-2xl shadow-lg mb-6 overflow-hidden">
                        <div class="flex border-b border-slate-100 overflow-x-auto">
                            <template x-for="tab in jobseekerTabs" :key="tab.id">
                                <button @click="activeJobseekerTab = tab.id"
                                    :class="activeJobseekerTab === tab.id ? 'text-violet-600 border-b-2 border-violet-500 bg-violet-50/50' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'"
                                    class="flex items-center gap-2 px-5 py-4 font-medium transition-all whitespace-nowrap">
                                    <i :class="tab.icon" class="w-4 h-4"></i>
                                    <span x-text="tab.name"></span>
                                </button>
                            </template>
                        </div>

                        <div class="p-6">
                            <!-- 简历匹配评分 -->
                            <div x-show="activeJobseekerTab === 'match'" class="space-y-6">
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <!-- 左侧：简历输入 -->
                                    <div class="space-y-4">
                                        <div class="flex items-center justify-between">
                                            <label class="font-semibold text-slate-700 flex items-center gap-2">
                                                <i class="fa-solid fa-file-lines w-4 h-4 text-violet-500"></i>
                                                我的简历
                                            </label>
                                            <button @click="loadSampleResume"
                                                class="text-xs text-violet-500 hover:text-violet-600">
                                                📄 加载示例
                                            </button>
                                        </div>
                                        <textarea x-model="resumeContent"
                                            class="w-full min-h-[280px] border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none resize-none text-sm"
                                            placeholder="粘贴您的简历内容...&#10;&#10;包括：个人信息、教育背景、工作经历、项目经验、技能特长等"></textarea>
                                    </div>
                                    <!-- 右侧：JD输入 -->
                                    <div class="space-y-4">
                                        <div class="flex items-center justify-between">
                                            <label class="font-semibold text-slate-700 flex items-center gap-2">
                                                <i class="fa-solid fa-scroll w-4 h-4 text-violet-500"></i>
                                                目标岗位 JD
                                            </label>
                                            <button @click="loadSampleJD"
                                                class="text-xs text-violet-500 hover:text-violet-600">
                                                📋 加载示例
                                            </button>
                                        </div>
                                        <textarea x-model="targetJD"
                                            class="w-full min-h-[280px] border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none resize-none text-sm"
                                            placeholder="粘贴目标岗位的招聘描述...&#10;&#10;包括：岗位名称、工作职责、任职要求、薪资福利等"></textarea>
                                    </div>
                                </div>

                                <!-- 操作按钮 -->
                                <div class="flex justify-center">
                                    <button @click="analyzeMatch()"
                                        :disabled="isGenerating || !resumeContent.trim() || !targetJD.trim()"
                                        class="px-8 py-3 bg-gradient-to-r from-violet-500 to-purple-600 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center gap-2">
                                        <span x-show="!isGenerating">
                                            <i class="fa-solid fa-magnifying-glass-chart w-5 h-5"></i>
                                        </span>
                                        <span x-show="isGenerating">
                                            <i class="fa-solid fa-spinner animate-spin w-5 h-5"></i>
                                        </span>
                                        <span x-text="isGenerating ? '分析中...' : '开始匹配分析'"></span>
                                    </button>
                                </div>
                            </div>

                            <!-- 简历优化 -->
                            <div x-show="activeJobseekerTab === 'optimize'" class="space-y-6">
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div class="space-y-4">
                                        <label class="font-semibold text-slate-700 flex items-center gap-2">
                                            <i class="fa-solid fa-file-lines w-4 h-4 text-violet-500"></i>
                                            原始简历
                                        </label>
                                        <textarea x-model="resumeContent"
                                            class="w-full min-h-[240px] border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none resize-none text-sm"
                                            placeholder="粘贴您需要优化的简历内容..."></textarea>
                                    </div>
                                    <div class="space-y-4">
                                        <label class="font-semibold text-slate-700 flex items-center gap-2">
                                            <i class="fa-solid fa-bullseye w-4 h-4 text-violet-500"></i>
                                            目标岗位 (可选)
                                        </label>
                                        <textarea x-model="targetJD"
                                            class="w-full min-h-[120px] border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none resize-none text-sm"
                                            placeholder="填写目标岗位JD，可获得针对性优化建议..."></textarea>

                                        <!-- 优化方向选择 -->
                                        <div class="space-y-2">
                                            <label class="text-sm font-medium text-slate-600">优化方向</label>
                                            <div class="flex flex-wrap gap-2">
                                                <template x-for="dir in optimizeDirections" :key="dir.id">
                                                    <button @click="toggleOptimizeDirection(dir.id)"
                                                        :class="selectedOptimizeDirections.includes(dir.id) ? 'bg-violet-100 text-violet-700 border-violet-300' : 'bg-white text-slate-600 border-slate-200 hover:border-violet-300'"
                                                        class="px-3 py-1.5 text-xs font-medium rounded-full border transition-all">
                                                        <span x-text="dir.icon + ' ' + dir.name"></span>
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="flex justify-center">
                                    <button @click="optimizeResume()" :disabled="isGenerating || !resumeContent.trim()"
                                        class="px-8 py-3 bg-gradient-to-r from-violet-500 to-purple-600 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center gap-2">
                                        <span x-show="!isGenerating"><i
                                                class="fa-solid fa-wand-magic-sparkles w-5 h-5"></i></span>
                                        <span x-show="isGenerating"><i
                                                class="fa-solid fa-spinner animate-spin w-5 h-5"></i></span>
                                        <span x-text="isGenerating ? '优化中...' : '一键优化简历'"></span>
                                    </button>
                                </div>
                            </div>

                            <!-- 面试助手 -->
                            <div x-show="activeJobseekerTab === 'interview'" class="space-y-6">
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div class="space-y-4">
                                        <label class="font-semibold text-slate-700 flex items-center gap-2">
                                            <i class="fa-solid fa-file-lines w-4 h-4 text-violet-500"></i>
                                            我的简历
                                        </label>
                                        <textarea x-model="resumeContent"
                                            class="w-full min-h-[200px] border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none resize-none text-sm"
                                            placeholder="粘贴您的简历内容..."></textarea>
                                    </div>
                                    <div class="space-y-4">
                                        <label class="font-semibold text-slate-700 flex items-center gap-2">
                                            <i data-lucide="scroll-text" class="w-4 h-4 text-violet-500"></i>
                                            目标岗位 JD
                                        </label>
                                        <textarea x-model="targetJD"
                                            class="w-full min-h-[200px] border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none resize-none text-sm"
                                            placeholder="粘贴目标岗位的招聘描述..."></textarea>
                                    </div>
                                </div>

                                <!-- 面试类型选择 -->
                                <div class="bg-slate-50 rounded-xl p-4">
                                    <label class="text-sm font-medium text-slate-600 mb-3 block">生成内容</label>
                                    <div class="flex flex-wrap gap-2">
                                        <template x-for="type in interviewTypes" :key="type.id">
                                            <button @click="toggleInterviewType(type.id)"
                                                :class="selectedInterviewTypes.includes(type.id) ? 'bg-violet-100 text-violet-700 border-violet-300' : 'bg-white text-slate-600 border-slate-200 hover:border-violet-300'"
                                                class="px-4 py-2 text-sm font-medium rounded-lg border transition-all flex items-center gap-2">
                                                <span x-text="type.icon"></span>
                                                <span x-text="type.name"></span>
                                            </button>
                                        </template>
                                    </div>
                                </div>

                                <div class="flex justify-center">
                                    <button @click="generateInterviewPrep()"
                                        :disabled="isGenerating || !resumeContent.trim() || !targetJD.trim() || selectedInterviewTypes.length === 0"
                                        class="px-8 py-3 bg-gradient-to-r from-violet-500 to-purple-600 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center gap-2">
                                        <span x-show="!isGenerating"><i class="fa-solid fa-comments w-5 h-5"></i></span>
                                        <span x-show="isGenerating"><i
                                                class="fa-solid fa-spinner animate-spin w-5 h-5"></i></span>
                                        <span x-text="isGenerating ? '生成中...' : '生成面试准备'"></span>
                                    </button>
                                </div>
                            </div>

                            <!-- 求职信生成 -->
                            <div x-show="activeJobseekerTab === 'letter'" class="space-y-6">
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div class="space-y-4">
                                        <label class="font-semibold text-slate-700 flex items-center gap-2">
                                            <i class="fa-solid fa-file-lines w-4 h-4 text-violet-500"></i>
                                            我的简历/个人亮点
                                        </label>
                                        <textarea x-model="resumeContent"
                                            class="w-full min-h-[200px] border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none resize-none text-sm"
                                            placeholder="粘贴您的简历或个人亮点信息..."></textarea>
                                    </div>
                                    <div class="space-y-4">
                                        <label class="font-semibold text-slate-700 flex items-center gap-2">
                                            <i data-lucide="scroll-text" class="w-4 h-4 text-violet-500"></i>
                                            目标岗位 JD
                                        </label>
                                        <textarea x-model="targetJD"
                                            class="w-full min-h-[200px] border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none resize-none text-sm"
                                            placeholder="粘贴目标岗位的招聘描述..."></textarea>
                                    </div>
                                </div>

                                <!-- 求职信风格 -->
                                <div class="bg-slate-50 rounded-xl p-4">
                                    <label class="text-sm font-medium text-slate-600 mb-3 block">求职信风格</label>
                                    <div class="flex flex-wrap gap-2">
                                        <template x-for="style in letterStyles" :key="style.id">
                                            <button @click="selectedLetterStyle = style.id"
                                                :class="selectedLetterStyle === style.id ? 'bg-violet-100 text-violet-700 border-violet-300' : 'bg-white text-slate-600 border-slate-200 hover:border-violet-300'"
                                                class="px-4 py-2 text-sm font-medium rounded-lg border transition-all">
                                                <span x-text="style.icon + ' ' + style.name"></span>
                                            </button>
                                        </template>
                                    </div>
                                </div>

                                <div class="flex justify-center">
                                    <button @click="generateCoverLetter()"
                                        :disabled="isGenerating || !resumeContent.trim() || !targetJD.trim()"
                                        class="px-8 py-3 bg-gradient-to-r from-violet-500 to-purple-600 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center gap-2">
                                        <span x-show="!isGenerating"><i class="fa-solid fa-envelope w-5 h-5"></i></span>
                                        <span x-show="isGenerating"><i
                                                class="fa-solid fa-spinner animate-spin w-5 h-5"></i></span>
                                        <span x-text="isGenerating ? '生成中...' : '生成求职信'"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ==================== HR/猎头视角 ==================== -->
                <div x-show="currentView === 'hr'" x-transition:enter="transition ease-out duration-300"
                    x-transition:enter-start="opacity-0 translate-y-4"
                    x-transition:enter-end="opacity-100 translate-y-0">

                    <!-- JD生成器 -->
                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                        <div class="p-6 border-b border-slate-100 bg-gradient-to-r from-violet-50 to-purple-50">
                            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-file-circle-plus w-6 h-6 text-violet-500"></i>
                                招聘JD生成器
                            </h2>
                            <p class="text-sm text-slate-500 mt-1">输入岗位要求，生成吸引人的招聘文案</p>
                        </div>

                        <div class="p-6 space-y-6">
                            <!-- 基础信息 -->
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                <div>
                                    <label class="text-sm font-medium text-slate-600 mb-1.5 block">岗位名称 *</label>
                                    <input type="text" x-model="jdForm.position"
                                        class="w-full border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none"
                                        placeholder="如：高级产品经理">
                                </div>
                                <div>
                                    <label class="text-sm font-medium text-slate-600 mb-1.5 block">公司名称</label>
                                    <input type="text" x-model="jdForm.company"
                                        class="w-full border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none"
                                        placeholder="如：XX科技有限公司">
                                </div>
                                <div>
                                    <label class="text-sm font-medium text-slate-600 mb-1.5 block">所属行业</label>
                                    <input type="text" x-model="jdForm.industry"
                                        class="w-full border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none"
                                        placeholder="如：互联网/人工智能">
                                </div>
                                <div>
                                    <label class="text-sm font-medium text-slate-600 mb-1.5 block">工作地点</label>
                                    <input type="text" x-model="jdForm.location"
                                        class="w-full border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none"
                                        placeholder="如：北京/上海/远程">
                                </div>
                                <div>
                                    <label class="text-sm font-medium text-slate-600 mb-1.5 block">薪资范围</label>
                                    <input type="text" x-model="jdForm.salary"
                                        class="w-full border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none"
                                        placeholder="如：30-50K·14薪">
                                </div>
                                <div>

                    { id: 'international', name: '国际范儿', icon: '🌍' }
                ],

                // ==================== 生命周期 ====================
                init() {

                // ==================== 配置管理 ====================
                /**
                 * 从 localStorage 加载配置

                },

                 */

                    this.targetJD = `【岗位名称】高级产品经理 - 电商方向

                },

                // ==================== API 调用核心方法 ====================
                /**
                 * 流式调用 DeepSeek API
                 * @param {Array} messages - 消息数组
                 * @param {Function} onChunk - 流式回调
                 * @returns {Object} { content, reasoning }
                 */
                async streamChat(messages, onChunk) {
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiConfig.deepseek}`
                        },
                        body: JSON.stringify({
                            model: this.apiConfig.model,
                            messages: messages,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error?.message || '请求失败');
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullContent = '';
                    let reasoningContent = '';
                    let lastUpdate = Date.now();
                    const UPDATE_INTERVAL = 80; // 节流间隔

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n').filter(line => line.startsWith('data: '));

                        for (const line of lines) {
                            if (line === 'data: [DONE]') continue;
                            try {
                                const data = JSON.parse(line.slice(6));
                                const delta = data.choices[0]?.delta;

                                // 处理推理内容（V4 Pro 模型）
                                if (delta?.reasoning_content) {
                                    reasoningContent += delta.reasoning_content;
                                }
                                // 处理正常内容
                                if (delta?.content) {
                                    fullContent += delta.content;
                                    // 节流更新
                                    if (Date.now() - lastUpdate >= UPDATE_INTERVAL) {

                                        lastUpdate = Date.now();
                                    }
                                }
                            } catch (e) { /* 忽略解析错误 */ }
                        }
                    }

                    // 最终更新

                    return { content: fullContent, reasoning: reasoningContent };

                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error?.message || '请求失败');
                    }

                    const data = await response.json();
                    return {
                        content: data.choices[0]?.message?.content || '',
                        reasoning: data.choices[0]?.message?.reasoning_content || ''
                    };

                /**
                 * 复制结果到剪贴板
                 */
                async copyResult() {
                    let text = '';
                    if (this.matchResult) {
                        text = `综合匹配度: ${this.matchResult.overallScore}%\n\n${this.matchResult.analysis}`;
                    } else {
                        text = this.result;
                    }

                    try {
                        await navigator.clipboard.writeText(text);
                        this.showToast('已复制到剪贴板');
                    } catch (e) {
                        // 降级方案
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        this.showToast('已复制到剪贴板');
                    }
                },

                /**
                 * 导出结果为文件
                 */
                exportResult() {
                    let content = '';
                    let filename = '';

                    if (this.matchResult) {
                        content = `# 简历匹配分析报告\n\n`;
                        content += `## 综合匹配度: ${this.matchResult.overallScore}%\n\n`;
                        content += `- 技能匹配: ${this.matchResult.detailScores.skills}%\n`;
                        content += `- 经验匹配: ${this.matchResult.detailScores.experience}%\n`;
                        content += `- 学历匹配: ${this.matchResult.detailScores.education}%\n\n`;
                        content += this.matchResult.analysis;
                        filename = '简历匹配分析报告.md';
                    } else {
                        content = `# ${this.resultTitle}\n\n`;
                        if (this.reasoningContent) {
                            content += `## 深度思考过程\n\n${this.reasoningContent}\n\n---\n\n`;
                        }
                        content += this.result;
                        filename = `${this.resultTitle}.md`;
                    }

                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                    this.showToast('已导出文件');
                }
