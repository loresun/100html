<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO 标题/描述优化器 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 基础样式 - 采用绿色/翠绿色调 */
        body {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #a7f3d0 100%);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 3px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        /* 平台卡片样式 */
        .platform-card {
            transition: all 0.2s ease;
        }

        .platform-card.active {
            border-color: #10b981;
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
        }

        /* 标题卡片 */
        .title-card {
            transition: all 0.3s ease;
        }

        .title-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -10px rgba(16, 185, 129, 0.3);
        }

        /* 关键词标签 */
        .keyword-tag {
            transition: all 0.2s ease;
        }

        .keyword-tag:hover {
            transform: scale(1.05);
            background: #10b981;
            color: white;
        }

        /* 字符计数条 */
        .char-bar {
            transition: width 0.3s ease;
        }

        .char-bar.warning {
            background: linear-gradient(90deg, #f59e0b, #d97706);
        }

        .char-bar.danger {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        .char-bar.success {
            background: linear-gradient(90deg, #10b981, #059669);
        }

        /* 搜索预览样式 */
        .search-preview {
            font-family: Arial, sans-serif;
        }

        .search-preview-title {
            color: #1a0dab;
            font-size: 18px;
            line-height: 1.3;
        }

        .search-preview-title:hover {
            text-decoration: underline;
        }

        .search-preview-url {
            color: #006621;
            font-size: 14px;
        }

        .search-preview-desc {
            color: #545454;
            font-size: 13px;
            line-height: 1.4;
        }

        /* 加载动画 */
        @keyframes seo-pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .seo-loading {
            animation: seo-pulse 1.5s ease-in-out infinite;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <!--
        SEO 标题/描述优化器 - Alpine.js 应用
        功能：
        1. 生成 SEO 优化标题（多版本）
        2. 生成 Meta Description
        3. 提取关键词
        4. 针对不同平台优化
        5. SEO 评分和建议
    -->
    <div x-data="seoOptimizerApp" class="min-h-screen flex flex-col">

        <!-- 顶部导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-emerald-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition"
                        onclick="location.href='../../index.html'">
                        <i class="fa-solid fa-magnifying-glass text-emerald-600 h-6 w-6"></i>
                        <span class="font-bold text-xl tracking-tight text-slate-900">SEO 标题/描述优化器</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-emerald-600 transition flex items-center gap-1 text-sm font-medium">
                            <i class="fa-solid fa-gear h-4 w-4"></i>
                            <span class="hidden sm:inline">设置</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="flex-grow flex flex-col lg:flex-row overflow-hidden h-[calc(100vh-4rem)]">

            <!-- 左侧：输入面板 -->
            <div
                class="w-full lg:w-2/5 bg-white/70 backdrop-blur-sm border-r border-emerald-200 p-5 overflow-y-auto space-y-5">

                <!-- 目标平台 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-globe w-4 h-4 text-emerald-600"></i>
                        目标平台
                    </label>
                    <div class="grid grid-cols-3 gap-2">
                        <template x-for="platform in platforms" :key="platform.value">
                            <div @click="input.platform = platform.value"
                                :class="['platform-card p-3 rounded-xl border cursor-pointer text-center', input.platform === platform.value ? 'active' : 'border-emerald-200 bg-white hover:border-emerald-300']">
                                <span class="text-2xl block mb-1" x-text="platform.icon"></span>
                                <span class="text-xs font-medium text-slate-700" x-text="platform.label"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 输入方式切换 -->
                <div class="flex border-b border-emerald-200">
                    <button @click="inputMode = 'title'"
                        :class="['px-4 py-2 text-sm font-medium border-b-2 transition', inputMode === 'title' ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-500']">
                        输入标题优化
                    </button>
                    <button @click="inputMode = 'content'"
                        :class="['px-4 py-2 text-sm font-medium border-b-2 transition', inputMode === 'content' ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-500']">
                        从内容生成
                    </button>
                </div>

                <!-- 标题输入模式 -->
                <div x-show="inputMode === 'title'" class="space-y-4">
                    <div class="space-y-2">
                        <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                            <i class="fa-solid fa-font w-4 h-4 text-emerald-600"></i>
                            原始标题 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" x-model="input.originalTitle" placeholder="输入要优化的标题..."
                            class="w-full bg-white border border-emerald-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                        <div class="flex items-center justify-between text-xs">
                            <span :class="getTitleLengthClass()" x-text="input.originalTitle.length + ' 字符'"></span>
                            <span class="text-slate-500"
                                x-text="'推荐: ' + getPlatformLimit().titleLimit + ' 字符以内'"></span>
                        </div>
                    </div>
                </div>

                <!-- 内容输入模式 -->
                <div x-show="inputMode === 'content'" class="space-y-4">
                    <div class="space-y-2">
                        <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                            <i class="fa-regular fa-file-lines w-4 h-4 text-emerald-600"></i>
                            文章内容 <span class="text-red-500">*</span>
                        </label>
                        <textarea x-model="input.content" rows="6" placeholder="粘贴文章内容，AI 将自动提取关键信息生成 SEO 标题和描述..."
                            class="w-full bg-white border border-emerald-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition resize-none"></textarea>
                    </div>
                </div>

                <!-- 目标关键词 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-key w-4 h-4 text-emerald-600"></i>
                        目标关键词 (可选)
                    </label>
                    <input type="text" x-model="input.keywords" placeholder="用逗号分隔，如：SEO优化, 标题技巧, 搜索排名"
                        class="w-full bg-white border border-emerald-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                </div>

                <!-- 生成数量 -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-hashtag w-4 h-4 text-emerald-600"></i>
                        生成数量
                    </label>
                    <div class="flex items-center gap-3">
                        <input type="range" x-model="input.count" min="3" max="10" step="1"
                            class="flex-grow accent-emerald-500">
                        <span class="text-sm font-bold text-emerald-600 w-8 text-center" x-text="input.count"></span>
                    </div>
                </div>

                <!-- 生成按钮 -->
                <button @click="generateSEO" :disabled="isGenerating || (!input.originalTitle && !input.content)"
                    class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-all">
                    <template x-if="isGenerating">
                        <i class="fa-solid fa-spinner fa-spin w-5 h-5"></i>
                    </template>
                    <template x-if="!isGenerating">
                        <i class="fa-solid fa-magnifying-glass w-5 h-5"></i>
                    </template>
                    <span x-text="isGenerating ? '正在优化中...' : '🔍 生成 SEO 优化方案'"></span>
                </button>

            </div>

            <!-- 右侧：结果展示区 -->
            <div class="flex-grow bg-gradient-to-br from-emerald-50/50 to-teal-50/50 p-6 overflow-y-auto">

                <!-- 空状态 -->
                <div x-show="!hasResult && !isGenerating"
                    class="h-full flex flex-col items-center justify-center text-slate-400">
                    <div class="w-24 h-24 bg-emerald-100 rounded-full flex items-center justify-center mb-6">
                        <i class="fa-solid fa-magnifying-glass w-12 h-12 text-emerald-400"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-600 mb-2">SEO 标题/描述优化器</h3>
                    <p class="text-center max-w-md">
                        生成 SEO 友好的标题和描述，提升搜索排名<br>
                        <span class="text-emerald-600 font-medium">百度 · Google · 微信搜一搜</span>
                    </p>
                </div>

                <!-- 加载状态 -->
                <div x-show="isGenerating && !hasResult" class="h-full flex flex-col items-center justify-center">
                    <div class="text-6xl seo-loading">🔍</div>
                    <p class="mt-6 text-slate-600 font-medium">AI 正在分析并优化...</p>
                    <p class="text-sm text-slate-400 mt-2">生成 SEO 友好的标题和描述</p>
                </div>

                <!-- 结果展示 -->
                <div x-show="hasResult" class="max-w-4xl mx-auto space-y-6">

                    <!-- 关键词提取 -->
                    <div class="bg-white rounded-2xl border border-emerald-100 p-5 animate-fade-in">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2 mb-4">
                            <i class="fa-solid fa-key w-5 h-5 text-emerald-600"></i>
                            提取的关键词
                        </h3>
                        <div class="flex flex-wrap gap-2">
                            <template x-for="(keyword, idx) in result.keywords" :key="idx">
                                <span
                                    class="keyword-tag px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-full text-sm font-medium cursor-pointer"
                                    x-text="keyword"></span>
                            </template>
                        </div>
                    </div>

                    <!-- SEO 标题列表 -->
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-font w-5 h-5 text-emerald-600"></i>
                                优化后的标题
                            </h3>
                            <button @click="copyAllTitles"
                                class="flex items-center gap-1 px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-emerald-50 transition">
                                <i class="fa-regular fa-copy w-3 h-3"></i>
                                复制全部
                            </button>
                        </div>

                        <template x-for="(title, idx) in result.titles" :key="idx">
                            <div class="title-card bg-white rounded-xl border border-emerald-100 p-4 animate-fade-in"
                                :style="{ animationDelay: idx * 0.1 + 's' }">
                                <div class="flex items-start justify-between gap-3">
                                    <div class="flex-grow">
                                        <!-- 评分 -->
                                        <div class="flex items-center gap-3 mb-2">
                                            <div class="flex items-center gap-1">
                                                <div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold"
                                                    :class="getScoreColor(title.score)" x-text="title.score"></div>
                                            </div>
                                            <div class="flex-grow">
                                                <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                                                    <div class="char-bar h-full rounded-full"
                                                        :class="getCharBarClass(title.text.length)"
                                                        :style="{ width: Math.min(title.text.length / getPlatformLimit().titleLimit * 100, 100) + '%' }">
                                                    </div>
                                                </div>
                                                <p class="text-xs text-slate-500 mt-1"
                                                    x-text="title.text.length + '/' + getPlatformLimit().titleLimit + ' 字符'">
                                                </p>
                                            </div>
                                        </div>
                                        <!-- 标题内容 -->
                                        <p class="text-slate-800 font-medium" x-text="title.text"></p>
                                        <!-- 优化说明 -->
                                        <p x-show="title.reason" class="text-xs text-emerald-600 mt-2">
                                            💡 <span x-text="title.reason"></span>
                                        </p>
                                    </div>
                                    <button @click="copyTitle(title.text)"
                                        class="flex-shrink-0 p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition">
                                        <i class="fa-regular fa-copy w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Meta Description -->
                    <div class="bg-white rounded-2xl border border-emerald-100 p-5 animate-fade-in">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-align-left w-5 h-5 text-emerald-600"></i>
                                Meta Description
                            </h3>
                            <button @click="copyDescription"
                                class="flex items-center gap-1 px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-medium hover:bg-emerald-100 transition">
                                <i class="fa-regular fa-copy w-3 h-3"></i>
                                复制
                            </button>
                        </div>
                        <p class="text-slate-700 leading-relaxed" x-text="result.description"></p>
                        <div class="mt-3 flex items-center gap-2 text-xs text-slate-500">
                            <span
                                x-text="result.description.length + '/' + getPlatformLimit().descLimit + ' 字符'"></span>
                            <span
                                :class="result.description.length <= getPlatformLimit().descLimit ? 'text-emerald-600' : 'text-red-500'"
                                x-text="result.description.length <= getPlatformLimit().descLimit ? '✓ 长度合适' : '⚠ 超出推荐长度'">
                            </span>
                        </div>
                    </div>

                    <!-- 搜索预览 -->
                    <div class="bg-white rounded-2xl border border-emerald-100 p-5 animate-fade-in">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2 mb-4">
                            <i class="fa-regular fa-eye w-5 h-5 text-emerald-600"></i>
                            搜索结果预览
                        </h3>
                        <div class="search-preview p-4 bg-slate-50 rounded-xl">
                            <div class="search-preview-title cursor-pointer"
                                x-text="result.titles[0]?.text || '优化后的标题'"></div>
                            <div class="search-preview-url mt-1">https://example.com/article/xxx</div>
                            <div class="search-preview-desc mt-1" x-text="result.description"></div>
                        </div>
                    </div>

                    <!-- 关键词优化建议 -->
                    <div class="bg-white rounded-2xl border border-emerald-100 p-5 animate-fade-in">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2 mb-4">
                            <i class="fa-solid fa-chart-column w-5 h-5 text-emerald-600"></i>
                            关键词优化建议
                        </h3>
                        <div class="space-y-3">
                            <template x-for="(tip, idx) in result.tips" :key="idx">
                                <div class="flex items-start gap-2 text-sm text-slate-600">
                                    <span class="text-emerald-500 mt-0.5" x-text="tip.icon"></span>
                                    <span x-text="tip.text"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 导出按钮 -->
                    <div class="flex justify-center pt-4">
                        <button @click="exportResult"
                            class="flex items-center gap-2 px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition">
                            <i class="fa-solid fa-download w-5 h-5"></i>
                            导出 SEO 优化报告
                        </button>
                    </div>

                </div>

            </div>

        </div>

        <!-- API 设置弹窗 -->
        <div x-show="showSettings" x-transition
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-fade-in"
                @click.outside="showSettings = false">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark w-5 h-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" x-model="apiConfig.deepseek"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                            placeholder="sk-...">
                        <p class="text-xs text-slate-500 mt-1">Key 将保存到本地，所有工具共享使用</p>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button @click="saveConfig"
                        class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition">保存配置</button>
                </div>
            </div>
        </div>

        <!-- Toast 提示 -->
        <div x-show="toast.show" x-transition
            class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in z-[200]">
            <i :class="toast.icon" class="w-4 h-4"></i>
            <span class="text-sm" x-text="toast.message"></span>
        </div>

    </div>

    <script>
        /**
         * SEO 标题/描述优化器 - Alpine.js 应用
         * 功能：生成 SEO 优化标题、描述、关键词提取和建议
         */
        document.addEventListener('alpine:init', () => {
            Alpine.data('seoOptimizerApp', () => ({
                // ==================== 状态管理 ====================
                showSettings: false,
                inputMode: 'title',
                apiConfig: { deepseek: '' },

                // 目标平台
                platforms: [
                    { value: 'baidu', label: '百度', icon: '🔍', titleLimit: 30, descLimit: 78 },
                    { value: 'google', label: 'Google', icon: '🌐', titleLimit: 60, descLimit: 160 },
                    { value: 'wechat', label: '微信搜一搜', icon: '💚', titleLimit: 64, descLimit: 120 }
                ],

                // 用户输入
                input: {
                    platform: 'baidu',
                    originalTitle: '',
                    content: '',
                    keywords: '',
                    count: 5
                },

                isGenerating: false,
                // 初始化为空结构，避免模板访问 null 属性时报错
                result: { keywords: [], titles: [], description: '', tips: [] },
                hasResult: false,  // 用于判断是否有结果
                toast: { show: false, message: '', icon: 'fa-solid fa-check' },

                // ==================== 生命周期 ====================
                init() {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
                    }
                    this.refreshIcons();
                },

                // ==================== 方法 ====================
                refreshIcons() {
                },

                showToast(message, icon = 'fa-solid fa-check') {
                    this.toast = { show: true, message, icon };
                    this.refreshIcons();
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                saveConfig() {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...this.apiConfig }));
                    this.showSettings = false;
                    this.showToast('配置已保存', 'fa-solid fa-check');
                },

                getPlatformLimit() {
                    return this.platforms.find(p => p.value === this.input.platform) || { titleLimit: 60, descLimit: 160 };
                },

                getTitleLengthClass() {
                    const limit = this.getPlatformLimit().titleLimit;
                    const len = this.input.originalTitle.length;
                    if (len === 0) return 'text-slate-500';
                    if (len <= limit * 0.8) return 'text-emerald-600';
                    if (len <= limit) return 'text-yellow-600';
                    return 'text-red-600';
                },

                getScoreColor(score) {
                    if (score >= 80) return 'bg-emerald-500';
                    if (score >= 60) return 'bg-yellow-500';
                    return 'bg-red-500';
                },

                getCharBarClass(len) {
                    const limit = this.getPlatformLimit().titleLimit;
                    if (len <= limit * 0.8) return 'success';
                    if (len <= limit) return 'warning';
                    return 'danger';
                },

                async generateSEO() {
                    if (!this.apiConfig.deepseek) {
                        this.showSettings = true;
                        this.showToast('请先配置 API Key', 'fa-solid fa-circle-exclamation');
                        return;
                    }

                    this.isGenerating = true;
                    this.hasResult = false;

                    try {
                        const platformInfo = this.getPlatformLimit();
                        const platformLabel = this.platforms.find(p => p.value === this.input.platform)?.label;

                        const systemPrompt = `你是一位专业的 SEO 优化专家，精通各大搜索引擎的排名算法和标题优化技巧。请严格按照 JSON 格式输出。`;

                        let contentDesc = this.inputMode === 'title'
                            ? `原始标题：${this.input.originalTitle}`
                            : `文章内容：\n${this.input.content.slice(0, 2000)}${this.input.content.length > 2000 ? '...(已截断)' : ''}`;

                        const userPrompt = `请为以下内容生成 SEO 优化方案：

## 输入信息
- **目标平台**：${platformLabel}
- **标题字符限制**：${platformInfo.titleLimit} 字符
- **描述字符限制**：${platformInfo.descLimit} 字符
${this.input.keywords ? `- **目标关键词**：${this.input.keywords}` : ''}

${contentDesc}

## 输出要求
1. 生成 ${this.input.count} 个不同的 SEO 优化标题
2. 每个标题需要评分（1-100）和优化说明
3. 生成一段 Meta Description
4. 提取 5-10 个核心关键词
5. 给出 3-5 条 SEO 优化建议

## 输出格式
{
  "titles": [
    { "text": "优化后的标题", "score": 85, "reason": "优化说明" }
  ],
  "description": "Meta Description 内容",
  "keywords": ["关键词1", "关键词2"],
  "tips": [
    { "icon": "✅", "text": "优化建议1" }
  ]
}`;

                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: 'deepseek-v4-flash',
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                response_format: { type: 'json_object' },
                                stream: false
                            })
                        });

                        if (!response.ok) throw new Error(`API 请求失败: ${response.status}`);

                        const data = await response.json();
                        const content = data.choices?.[0]?.message?.content;

                        if (content) {
                            this.result = JSON.parse(content);
                            this.hasResult = true;
                            this.showToast('SEO 优化方案生成成功！', 'fa-solid fa-circle-check');
                        }

                    } catch (error) {
                        console.error('[SEO Optimizer] 生成失败:', error);
                        this.showToast('生成失败: ' + error.message, 'fa-solid fa-circle-exclamation');
                    } finally {
                        this.isGenerating = false;
                        this.refreshIcons();
                    }
                },

                copyTitle(text) {
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制标题', 'fa-regular fa-copy');
                    });
                },

                copyAllTitles() {
                    if (!this.result?.titles) return;
                    const text = this.result.titles.map((t, i) => `${i + 1}. ${t.text} (评分: ${t.score})`).join('\n');
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制所有标题', 'fa-regular fa-copy');
                    });
                },

                copyDescription() {
                    if (this.result?.description) {
                        navigator.clipboard.writeText(this.result.description).then(() => {
                            this.showToast('已复制描述', 'fa-regular fa-copy');
                        });
                    }
                },

                exportResult() {
                    if (!this.result) return;

                    const platformLabel = this.platforms.find(p => p.value === this.input.platform)?.label;
                    let content = `# SEO 优化报告\n\n`;
                    content += `生成时间: ${new Date().toLocaleString()}\n`;
                    content += `目标平台: ${platformLabel}\n\n`;

                    content += `## 提取的关键词\n\n`;
                    content += this.result.keywords.map(k => `- ${k}`).join('\n') + '\n\n';

                    content += `## 优化后的标题\n\n`;
                    this.result.titles.forEach((t, i) => {
                        content += `### ${i + 1}. ${t.text}\n`;
                        content += `- 评分: ${t.score}/100\n`;
                        content += `- 字符数: ${t.text.length}\n`;
                        if (t.reason) content += `- 说明: ${t.reason}\n`;
                        content += '\n';
                    });

                    content += `## Meta Description\n\n${this.result.description}\n\n`;

                    content += `## SEO 优化建议\n\n`;
                    this.result.tips.forEach(tip => {
                        content += `${tip.icon} ${tip.text}\n`;
                    });

                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `SEO优化报告_${new Date().toISOString().slice(0, 10)}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    this.showToast('已导出报告', 'fa-solid fa-download');
                }
            }));
        });
    </script>
