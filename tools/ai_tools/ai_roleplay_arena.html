<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 模拟对练场 (Roleplay Arena)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Chat bubbles */
        .chat-bubble {
            max-width: 85%;
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            position: relative;
        }

        .chat-bubble.user {
            background-color: #eff6ff;
            color: #1e3a8a;
            border-top-right-radius: 0;
            margin-left: auto;
        }

        .chat-bubble.ai {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-top-left-radius: 0;
            margin-right: auto;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                    <i class="fa-solid fa-fire text-red-600 h-6 w-6"></i>
                    <span class="font-bold text-xl text-slate-900">Roleplay Arena</span>
                </div>
                <div class="flex items-center gap-4">
                    <!-- 模型快速切换 -->
                    <div class="flex items-center bg-slate-100 rounded-lg p-1">
                        <button @click="apiConfig.model = 'deepseek-v4-flash'"
                            :class="['px-3 py-1 text-xs font-bold rounded-md transition', apiConfig.model === 'deepseek-v4-flash' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-500 hover:text-slate-700']">V4 Flash</button>
                        <button @click="apiConfig.model = 'deepseek-v4-pro'"
                            :class="['px-3 py-1 text-xs font-bold rounded-md transition', apiConfig.model === 'deepseek-v4-pro' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-500 hover:text-slate-700']">V4 Pro</button>
                    </div>
                    <button @click="showSettings = true"
                        class="text-slate-500 hover:text-red-600 flex items-center gap-1 text-sm font-medium"><i
                            class="fa-solid fa-gear h-4 w-4"></i> 设置</button>
                </div>
            </div>
        </nav>

        <div class="flex-grow flex flex-col md:flex-row overflow-hidden h-[calc(100vh-4rem)]">
            <!-- Left: Setup -->
            <div
                class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-slate-200 flex flex-col h-full z-20 p-5 space-y-5">
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700">1. 待测试文案/观点</label>
                    <textarea v-model="context" rows="6" placeholder="粘贴你想发布的文案、或者想表达的观点..."
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none"></textarea>
                </div>
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-700">2. 选择对手 (AI 扮演)</label>
                    <select v-model="role"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none">
                        <option value="杠精喷子">🤬 杠精喷子 (无死角攻击逻辑漏洞)</option>
                        <option value="挑剔甲方">👔 挑剔甲方 (觉得不够大气/没亮点)</option>
                        <option value="小白用户">👶 小白用户 (完全看不懂/没兴趣)</option>
                        <option value="行业专家">🧐 行业专家 (质疑你的专业度)</option>
                    </select>
                </div>
                <button @click="startBattle" :disabled="!context || isChatting"
                    class="w-full bg-red-600 text-white font-bold py-3 rounded-xl shadow hover:bg-red-700 disabled:opacity-50 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt w-4 h-4"></i> <span>开始压力测试</span>
                </button>
                <div class="text-xs text-slate-400 mt-4 bg-slate-50 p-3 rounded-lg">
                    <p>💡 提示：AI 将扮演对方角色对你的文案提出质疑。请尝试回应或修改文案，AI 会根据你的反馈继续互动。</p>
                </div>
            </div>

            <!-- Right: Chat Area -->
            <div class="flex-grow bg-slate-100 flex flex-col h-full overflow-hidden relative">
                <div ref="chatBox" class="flex-grow overflow-y-auto p-4 space-y-4">
                    <div v-if="messages.length === 0"
                        class="h-full flex flex-col items-center justify-center text-slate-400">
                        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm"><i
                                class="fa-regular fa-comments w-8 h-8 opacity-50"></i></div>
                        <p>准备好了吗？开始你的模拟对战。</p>
                    </div>

                    <div v-for="(msg, idx) in messages" :key="idx"
                        :class="['flex w-full', msg.role === 'user' ? 'justify-end' : 'justify-start']">
                        <div v-if="msg.role === 'assistant'"
                            class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center mr-2 flex-shrink-0">
                            <i class="fa-solid fa-robot w-4 h-4 text-red-600"></i>
                        </div>
                        <div :class="['chat-bubble text-sm shadow-sm', msg.role === 'user' ? 'user' : 'ai']">
                            <!-- 思考过程 (V4 Pro 模型) -->
                            <details v-if="msg.reasoning"
                                class="mb-2 italic text-slate-500 border-l-2 border-slate-200 pl-3">
                                <summary class="cursor-pointer text-xs mb-1 hover:text-red-600 transition">查看思考过程...
                                </summary>
                                <div class="text-xs whitespace-pre-wrap leading-relaxed">{{ msg.reasoning }}</div>
                            </details>
                            <div v-html="renderMarkdown(msg.content)"></div>
                        </div>
                        <div v-if="msg.role === 'user'"
                            class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center ml-2 flex-shrink-0">
                            <i class="fa-solid fa-user w-4 h-4 text-blue-600"></i>
                        </div>
                    </div>

                    <div v-if="isThinking" class="flex w-full justify-start">
                        <div
                            class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center mr-2 flex-shrink-0">
                            <i class="fa-solid fa-robot w-4 h-4 text-red-600"></i>
                        </div>
                        <div class="chat-bubble ai text-sm text-slate-400">对方正在输入...</div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="p-4 bg-white border-t border-slate-200">
                    <div class="relative">
                        <input type="text" v-model="userReply" @keyup.enter="sendReply"
                            :disabled="!isChatting || isThinking" placeholder="输入你的回复或解释..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 pr-12 outline-none text-sm">
                        <button @click="sendReply" :disabled="!userReply || isThinking"
                            class="absolute right-2 top-2 p-1.5 bg-red-600 text-white rounded-lg hover:bg-red-700 transition disabled:opacity-50">
                            <i class="fa-solid fa-paper-plane w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-md p-6">
                <h3 class="font-bold mb-4">API 设置</h3>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">API Key</label>
                        <input type="password" v-model="apiConfig.deepseek"
                            class="w-full border border-slate-300 p-2 rounded text-sm outline-none focus:border-red-500 transition"
                            placeholder="sk-...">
                        <p class="text-[10px] text-slate-400 mt-1">支持 DeepSeek, OpenAI, Volcengine 等兼容接口</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">模型名称 (Model)</label>
                        <select v-model="apiConfig.model"
                            class="w-full border border-slate-300 p-2 rounded text-sm outline-none focus:border-red-500 transition bg-white">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Base URL (可选)</label>
                        <input type="text" v-model="apiConfig.baseUrl"
                            class="w-full border border-slate-300 p-2 rounded text-sm outline-none focus:border-red-500 transition"
                            placeholder="默认: https://api.deepseek.com/chat/completions">
                        <p class="text-[10px] text-slate-400 mt-1">DeepSeek:
                            https://api.deepseek.com/chat/completions</p>
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-6">
                    <button @click="showSettings=false"
                        class="px-4 py-2 text-slate-500 hover:text-slate-700 transition">取消</button>
                    <button @click="saveConfig"
                        class="bg-red-600 text-white px-4 py-2 rounded shadow hover:bg-red-700 transition">保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick, watch } = Vue;
        createApp({
            setup() {
                const showSettings = ref(false);
                const apiConfig = ref({
                    deepseek: '',
                    model: 'deepseek-v4-flash',
                    baseUrl: 'https://api.deepseek.com/chat/completions'
                });

                const context = ref('');
                const role = ref('杠精喷子');
                const messages = ref([]);
                const userReply = ref('');
                const isChatting = ref(false);
                const isThinking = ref(false);
                const chatBox = ref(null);

                onMounted(() => {
                    // 初始化 Lucide 图标
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);

                            // 1. 读取 deepseek (与全局配置联动)
                            if (parsed.deepseek) apiConfig.value.deepseek = parsed.deepseek;

                            // 2. 加载模型与 Base URL
                            if (parsed.model) apiConfig.value.model = parsed.model;
                            if (parsed.baseUrl) apiConfig.value.baseUrl = parsed.baseUrl;

                            // 3. 静默修正：如果当前模型是已知的图像模型，重置为默认文本模型（不显示冗余逻辑）
                            const imageModels = ['seedream', 'cogview', 'flux', 'dall-e'];
                            if (imageModels.some(m => apiConfig.value.model.includes(m))) {
                                apiConfig.value.model = 'deepseek-v4-flash';
                            }
                        } catch (e) {
                            console.error('Failed to parse global_llm_config', e);
                        }
                    }
                });

                const saveConfig = () => {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('Failed to parse global_llm_config', e);
                    }
                    const newConfig = {
                        ...current,
                        deepseek: apiConfig.value.deepseek,
                        model: apiConfig.value.model,
                        baseUrl: apiConfig.value.baseUrl
                    };
                    localStorage.setItem('global_llm_config', JSON.stringify(newConfig));
                    showSettings.value = false;
                };

                // 监听模型变化并自动保存（实现内外联动且不关闭弹窗）
                watch(() => apiConfig.value.model, (newModel) => {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('Failed to parse global_llm_config', e);
                    }
                    if (current.model !== newModel) {
                        localStorage.setItem('global_llm_config', JSON.stringify({
                            ...current,
                            model: newModel
                        }));
                    }
                });

                const renderMarkdown = (text) => marked.parse(text);

                const scrollToBottom = () => nextTick(() => { if (chatBox.value) chatBox.value.scrollTop = chatBox.value.scrollHeight; });
                watch(messages, scrollToBottom, { deep: true });

                const startBattle = async () => {
                    if (!apiConfig.value.deepseek) return showSettings.value = true;
                    isChatting.value = true;
                    messages.value = [];

                    // 根据选择的角色设置系统提示词
                    let rolePrompt = "";
                    if (role.value === '杠精喷子') rolePrompt = "你是一个网络杠精，喜欢断章取义、攻击逻辑漏洞，说话刻薄。";
                    if (role.value === '挑剔甲方') rolePrompt = "你是一个挑剔的甲方，总是觉得文案不够大气、没有转化率、不够高级。";
                    if (role.value === '小白用户') rolePrompt = "你是一个完全不懂行的小白，阅读理解能力一般，稍微复杂一点就看不懂。";
                    if (role.value === '行业专家') rolePrompt = "你是一个资深专家，喜欢质疑数据的真实性、理论的严谨性。";

                    // 调用AI，但不在界面上显示系统消息
                    await callAI([
                        { role: "system", content: rolePrompt },
                        { role: "user", content: `这是我的文案：\n${context.value}\n\n请开始评价。` }
                    ]);
                };

                const sendReply = async () => {
                    if (!userReply.value || !userReply.value.trim()) return;

                    // 添加用户消息到界面
                    const userMessage = userReply.value;
                    messages.value.push({ role: 'user', content: userMessage });

                    // 构建包含系统提示的完整历史
                    const history = messages.value.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }));

                    // 添加系统角色提示
                    let rolePrompt = "";
                    if (role.value === '杠精喷子') rolePrompt = "你是一个网络杠精，喜欢断章取义、攻击逻辑漏洞，说话刻薄。继续扮演这个角色。";
                    else if (role.value === '挑剔甲方') rolePrompt = "你是一个挑剔的甲方，总是觉得文案不够大气、没有转化率、不够高级。继续扮演这个角色。";
                    else if (role.value === '小白用户') rolePrompt = "你是一个完全不懂行的小白，阅读理解能力一般，稍微复杂一点就看不懂。继续扮演这个角色。";
                    else if (role.value === '行业专家') rolePrompt = "你是一个资深专家，喜欢质疑数据的真实性、理论的严谨性。继续扮演这个角色。";

                    history.unshift({ role: "system", content: rolePrompt });

                    // 清空输入框
                    userReply.value = '';
                    await callAI(history);
                };

                const callAI = async (msgs) => {
                    isThinking.value = true;
                    try {
                        const url = apiConfig.value.baseUrl || 'https://api.deepseek.com/chat/completions';
                        let res;
                        try {
                            res = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.value.deepseek}` },
                                body: JSON.stringify({ model: apiConfig.value.model, messages: msgs })
                            });
                        } catch (e) {
                            throw new Error(`网络请求失败: ${e.message}`);
                        }

                        // 检查HTTP响应状态
                        if (!res.ok) {
                            const errorData = await res.json().catch(() => ({ error: { message: `HTTP ${res.status}` } }));
                            throw new Error(errorData.error?.message || `请求失败: ${res.status}`);
                        }

                        const data = await res.json();

                        const message = data.choices[0].message;
                        if (!message || (!message.content && !message.reasoning_content)) {
                            throw new Error('API 响应中没有内容');
                        }

                        messages.value.push({
                            role: 'assistant',
                            content: message.content || "",
                            reasoning: message.reasoning_content || ""
                        });
                    } catch (e) {
                        console.error('API调用失败:', e);
                        alert('对话生成失败: ' + e.message + '\n请检查API Key是否有效，或稍后重试。');
                    }
                    finally { isThinking.value = false; }
                };


                return { showSettings, apiConfig, saveConfig, context, role, messages, userReply, isChatting, isThinking, chatBox, startBattle, sendReply, renderMarkdown };
            }
        }).mount('#app');
    </script>

</html>
