<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即时回复助手 - 高情商话术生成</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        [v-cloak] { display: none; }
        .bg-gradient-header {
            background: linear-gradient(135deg, #4f46e5 0%, #ec4899 100%);
        }
        /* Markdown 渲染样式 */
        .prose .inline-code {
            background-color: #f3f4f6;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            color: #9333ea;
        }
        .prose pre {
            background-color: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
        }
        .prose pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }
        .prose blockquote {
            border-left: 4px solid #a855f7;
            padding-left: 1rem;
            color: #6b7280;
            font-style: italic;
        }
        .prose h1, .prose h2, .prose h3, .prose h4 {
            color: #1e293b;
            font-weight: 700;
        }
        .prose a {
            color: #9333ea;
            text-decoration: underline;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col font-sans">
    <div id="app" v-cloak class="flex-1 flex flex-col">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-header rounded-xl flex items-center justify-center shadow-md">
                        <i class="fa-solid fa-message text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-slate-800 text-lg leading-tight">即时回复助手</h1>
                        <p class="text-xs text-slate-500">高情商话术生成器 (DeepSeek V4 Pro)</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                     <button @click="showSettings = true" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                    <a href="../../index.html" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                        <i class="fa-solid fa-arrow-left text-lg"></i>
                    </a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 grid md:grid-cols-[1fr,1.2fr] gap-6">
            
            <!-- Input Section -->
            <section class="flex flex-col gap-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
                             <i class="fa-solid fa-envelope text-indigo-500"></i>
                             对方发来的消息
                        </label>
                        <textarea v-model="form.incomingMessage" placeholder="粘贴对方的消息（微信/邮件/Slack）..." 
                            class="w-full h-32 p-3 bg-slate-50 border border-slate-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-lightbulb text-amber-500"></i>
                            你的简要意图
                        </label>
                        <textarea v-model="form.myIntent" placeholder="你想表达什么？(例如：委婉拒绝但保持联系 / 欣然接受并询问细节 / 生气但礼貌回怼)" 
                            class="w-full h-24 p-3 bg-slate-50 border border-slate-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
                             <i class="fa-solid fa-user text-pink-500"></i>
                             选择回复风格
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <button v-for="tone in tones" :key="tone.id" @click="form.tone = tone.id"
                                :class="['px-3 py-2 text-xs font-medium rounded-lg border transition-all flex items-center justify-center gap-1.5', 
                                form.tone === tone.id ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-300']">
                                <i :class="tone.icon"></i>
                                {{ tone.name }}
                            </button>
                        </div>
                    </div>

                    <button @click="generateReply" :disabled="isLoading || !form.incomingMessage"
                        class="mt-2 w-full bg-gradient-header text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transform hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i v-if="isLoading" class="fa-solid fa-spinner fa-spin"></i>
                        <i v-else class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>{{ isLoading ? '正在构思...' : '生成回复建议' }}</span>
                    </button>
                </div>

                <!-- Tips -->
                <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
                    <h3 class="text-xs font-bold text-indigo-900 mb-2 flex items-center gap-1">
                        <i class="fa-solid fa-bolt text-indigo-500"></i>
                        高情商技巧
                    </h3>
                    <ul class="text-xs text-indigo-800 space-y-1 list-disc pl-4">
                        <li>先认同再表达观点 (Yes, and...)</li>
                        <li>用"我们"代替"你/我"拉近距离</li>
                        <li>结尾抛出开放式问题延续话题</li>
                    </ul>
                </div>
            </section>

            <!-- Output Section -->
            <section class="flex flex-col h-full">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden relative min-h-[500px]">
                    <div class="p-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                         <span class="text-sm font-bold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-comments text-indigo-500"></i>
                            回复建议
                         </span>
                         <span v-if="result" class="text-xs text-green-600 bg-green-50 px-2 py-0.5 rounded-full border border-green-200">
                            生成完毕
                         </span>
                    </div>

                    <div class="flex-1 overflow-y-auto p-6 md-preview custom-scrollbar">
                        <div v-if="!result && !isLoading" class="h-full flex flex-col items-center justify-center text-slate-300 text-center p-8">
                            <i class="fa-solid fa-message text-5xl mb-4 opacity-50"></i>
                            <p class="text-sm">输入对方消息和你的意图<br>AI 将为你生成多种风格的回复建议</p>
                        </div>

                        <div v-else>
                            <!-- 思考折叠 -->
                            <div v-if="reasoning" class="mb-6 bg-slate-50 rounded-xl border border-slate-200 overflow-hidden">
                                <button @click="showReasoning = !showReasoning" 
                                    class="w-full flex items-center justify-between p-3 text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors">
                                    <span class="flex items-center gap-2">
                                        <i class="fa-solid fa-brain text-purple-500"></i>
                                        AI 思考过程 (DeepSeek V4 Pro)
                                    </span>
                                    <i class="fa-solid fa-chevron-down transition-transform" :class="{'rotate-180': showReasoning}"></i>
                                </button>
                                <div v-show="showReasoning" class="p-3 border-t border-slate-200 text-xs text-slate-500 font-mono whitespace-pre-wrap bg-white">
                                    {{ reasoning }}
                                </div>
                            </div>

                            <!-- 正文 -->
                            <div v-if="displayMode === 'rendered'" class="prose prose-sm prose-slate max-w-none prose-p:my-2 prose-ul:my-2 prose-li:my-0">
                                <div v-html="renderedResult"></div>
                            </div>
                            <div v-else class="prose prose-sm prose-slate max-w-none">
                                <pre class="whitespace-pre-wrap text-sm font-mono text-slate-600 bg-slate-50 p-4 rounded-xl">{{ result }}</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Configuration Modal -->
        <div v-if="showSettings" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
             <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden transform transition-all scale-100">
                 <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                    <h3 class="font-bold text-slate-900 text-sm">设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                 </div>
                 <div class="p-5 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">DeepSeek API Key</label>
                        <input type="password" v-model="apiKey" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Model</label>
                        <select v-model="model" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        </select>
                    </div>
                     <button @click="saveSettings" class="w-full bg-slate-900 text-white rounded-lg py-2 text-sm font-medium hover:bg-slate-800 transition-colors">
                        保存配置
                     </button>
                 </div>
             </div>
        </div>

    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;

        createApp({
            setup() {
                const showSettings = ref(false);
                const isLoading = ref(false);
                const result = ref('');
                const reasoning = ref('');
                const showReasoning = ref(false);
                const apiKey = ref('');
                const model = ref('deepseek-v4-pro');
                const displayMode = ref('rendered'); // 显示模式: rendered(渲染) 或 text(原文)

                const form = reactive({
                    incomingMessage: '',
                    myIntent: '',
                    tone: 'professional' // Default tone
                });

                const tones = [
                    { id: 'professional', name: '职场得体', icon: 'fa-solid fa-briefcase' },
                    { id: 'empathy', name: '温柔共情', icon: 'fa-solid fa-heart' },
                    { id: 'humorous', name: '幽默风趣', icon: 'fa-solid fa-face-laugh-beam' },
                    { id: 'firm', name: '坚定有力', icon: 'fa-solid fa-gavel' },
                     { id: 'casual', name: '轻松随意', icon: 'fa-solid fa-mug-hot' },
                    { id: 'high_eq', name: '高情商', icon: 'fa-solid fa-wand-magic-sparkles' }
                ];

                const renderedResult = computed(() => {
                    return result.value ? markedParse(result.value) : '';
                });

                // Markdown 解析函数（支持换行）
                const markedParse = (text) => {
                    return marked.parse(text, { breaks: true, gfm: true });
                };

                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if(saved) {
                        try {
                            const config = JSON.parse(saved);
                            if(config.deepseek) apiKey.value = config.deepseek;
                            if(config.model) model.value = config.model;
                        } catch(e){}
                    }
                });

                const saveSettings = () => {
                     try {
                        const existing = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                        const newConfig = { ...existing, deepseek: apiKey.value, model: model.value };
                        localStorage.setItem('global_llm_config', JSON.stringify(newConfig));
                        showSettings.value = false;
                    } catch (e) { alert('Save failed'); }
                };

                const generateReply = async () => {
                    if(!apiKey.value) { showSettings.value = true; return; }
                    
                    isLoading.value = true;
                    result.value = '';
                    reasoning.value = '';
                    showReasoning.value = true;

                    const prompt = `我收到一条消息：
"${form.incomingMessage}"

我的核心意图是：
"${form.myIntent}"

请根据【${tones.find(t => t.id === form.tone)?.name}】的风格，为我生成 3 个不同版本的回复建议。
要求：
1. 语言自然得体，避免翻译腔。
2. 分析对方的潜在情绪和需求。
3. 每个版本附带简短的"发送建议"（例如适合什么场景下发送）。
4. 格式清晰，使用 Markdown。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey.value}`
                            },
                            body: JSON.stringify({
                                model: model.value,
                                messages: [
                                    { role: 'system', content: '你是高情商沟通专家。' },
                                    { role: 'user', content: prompt }
                                ],
                                stream: true
                            })
                        });

                        if(!response.ok) throw new Error('API Error');

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();

                        while(true) {
                            const { done, value } = await reader.read();
                            if(done) break;

                            const chunk = decoder.decode(value, {stream: true});
                            const lines = chunk.split('\n');
                            for(const line of lines) {
                                if(line.startsWith('data: ')) {
                                    const jsonStr = line.slice(6);
                                    if(jsonStr === '[DONE]') continue;
                                    try {
                                        const data = JSON.parse(jsonStr);
                                        const delta = data.choices[0].delta;
                                        if(delta.reasoning_content) reasoning.value += delta.reasoning_content;
                                        if(delta.content) result.value += delta.content;
                                    } catch(e){}
                                }
                            }
                        }

                    } catch(e) {
                        result.value = `Error: ${e.message}`;
                    } finally {
                        isLoading.value = false;
                    }
                };

                return {
                    showSettings, isLoading, result, reasoning, showReasoning, apiKey, model,
                    form, tones, renderedResult, markedParse, displayMode, saveSettings, generateReply
                };
            }
        }).mount('#app');
    </script>
