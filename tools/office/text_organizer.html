    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长文本智能整理器 - 聊天记录/会议/邮件整理</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        [v-cloak] {
            display: none;
        }

        .primary {
            color: #10b981;
        }

        .bg-primary {
            background-color: #10b981;
        }

        .border-primary {
            border-color: #10b981;
        }

        .hover\:bg-primary:hover {
            background-color: #10b981;
        }

        .focus\:ring-primary:focus {
            --tw-ring-color: #10b981;
        }
        /* Markdown 渲染样式 */
        .prose .inline-code {
            background-color: #d1fae5;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            color: #10b981;
        }
        .prose pre {
            background-color: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
        }
        .prose pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }
        .prose blockquote {
            border-left: 4px solid #34d399;
            padding-left: 1rem;
            color: #6b7280;
            font-style: italic;
        }
        .prose h1, .prose h2, .prose h3, .prose h4 {
            color: #1e293b;
            font-weight: 700;
        }
        .prose a {
            color: #10b981;
            text-decoration: underline;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>

<body class="bg-slate-50">
    <div id="app" v-cloak>
        <!-- 导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                    <i class="fa-solid fa-file-invoice primary text-xl"></i>
                    <span class="font-bold text-xl text-slate-900">长文本智能整理器</span>
                </div>
                <div class="flex items-center gap-4">
                    <button @click="showSettings = true"
                        class="flex items-center gap-2 px-4 py-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors">
                        <i class="fa-solid fa-gear text-sm"></i>
                        <span class="hidden sm:inline">设置</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                <!-- 左侧输入区 -->
                <div class="lg:col-span-2 space-y-6">
                    <!-- 内容类型选择 -->
                    <div class="bg-white rounded-2xl shadow-sm p-6">
                        <h3 class="font-bold text-lg text-slate-900 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles primary text-lg"></i>
                            内容类型（自动识别）
                        </h3>
                        <div class="grid grid-cols-2 gap-2">
                            <label v-for="type in contentTypes" :key="type.value"
                                class="flex items-center gap-2 p-3 border-2 rounded-lg cursor-pointer transition-all"
                                :class="form.contentType === type.value ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 hover:border-emerald-300'">
                                <input type="radio" v-model="form.contentType" :value="type.value"
                                    class="text-emerald-600 focus:ring-emerald-500">
                                <span class="text-sm font-medium text-slate-700">{{ type.label }}</span>
                            </label>
                        </div>
                    </div>

                    <!-- 文本输入 -->
                    <div class="bg-white rounded-2xl shadow-sm p-6">
                        <h3 class="font-bold text-lg text-slate-900 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-font primary text-lg"></i>
                            输入内容
                        </h3>
                        <textarea v-model="form.content" placeholder="粘贴聊天记录、会议纪要、邮件线程或长报告..."
                            class="w-full h-64 p-4 border border-slate-300 rounded-lg resize-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm"></textarea>

                        <div class="mt-4 flex items-center gap-2">
                            <label
                                class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg cursor-pointer transition-colors">
                                <i class="fa-solid fa-upload text-sm"></i>
                                <span class="text-sm font-medium">上传 .txt/.md 文件</span>
                                <input type="file" accept=".txt,.md" @change="handleFileUpload" class="hidden">
                            </label>
                            <span v-if="form.content" class="text-xs text-slate-500">
                                {{ Math.floor(form.content.length / 500) }} 字符
                            </span>
                        </div>
                    </div>

                    <!-- 整理选项 -->
                    <div class="bg-white rounded-2xl shadow-sm p-6">
                        <h3 class="font-bold text-lg text-slate-900 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-sliders primary text-lg"></i>
                            整理选项
                        </h3>
                        <div class="space-y-3">
                            <label class="flex items-center gap-2">
                                <input type="checkbox" v-model="form.extractDecisions"
                                    class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span class="text-sm text-slate-700">提取关键决策</span>
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" v-model="form.extractTodos"
                                    class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span class="text-sm text-slate-700">列出待办事项（带责任人）</span>
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" v-model="form.filterNoise"
                                    class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span class="text-sm text-slate-700">过滤噪音（寒暄、表情）</span>
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" v-model="form.groupByTopic"
                                    class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span class="text-sm text-slate-700">按主题分组</span>
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" v-model="form.findUnresolved"
                                    class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span class="text-sm text-slate-700">识别未解决问题</span>
                            </label>
                        </div>
                    </div>

                    <!-- 生成按钮 -->
                    <button @click="organizeText" :disabled="isLoading || !form.content"
                        class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2">
                        <i v-if="isLoading" class="fa-solid fa-spinner fa-spin text-lg"></i>
                        <i v-else class="fa-solid fa-wand-magic text-lg"></i>
                        <span>{{ isLoading ? '整理中...' : '开始智能整理' }}</span>
                    </button>
                </div>

                <!-- 右侧结果区 -->
                <div class="lg:col-span-3 space-y-6">
                    <!-- 空状态 -->
                    <div v-if="!result && !isLoading" class="bg-white rounded-2xl shadow-sm p-12 text-center">
                        <i class="fa-solid fa-wand-magic-sparkles text-6xl mx-auto text-slate-300 mb-4"></i>
                        <p class="text-slate-500">输入长文本后点击"开始智能整理"</p>
                        <p class="text-sm text-slate-400 mt-2">支持聊天记录、会议纪要、邮件线程、长报告</p>
                    </div>

                    <!-- 结果展示 -->
                    <div v-if="result || isLoading" class="space-y-6">
                        <!-- V4 Pro 思考过程 -->
                        <div v-if="reasoning" class="bg-white rounded-2xl shadow-sm p-6">
                            <details class="group">
                                <summary
                                    class="cursor-pointer text-sm font-medium text-slate-600 flex items-center gap-2 hover:text-slate-900">
                                    <i class="fa-solid fa-brain text-xs"></i>
                                    <span>🧠 深度分析过程（点击展开）</span>
                                    <i
                                        class="fa-solid fa-chevron-down text-xs ml-auto group-open:rotate-180 transition-transform"></i>
                                </summary>
                                <div
                                    class="mt-4 p-4 bg-slate-50 rounded-lg text-sm text-slate-700 whitespace-pre-wrap max-h-96 overflow-y-auto">
                                    {{ reasoning }}
                                </div>
                            </details>
                        </div>

                        <!-- 整理结果 -->
                        <div class="bg-white rounded-2xl shadow-sm p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">
                                    <i class="fa-solid fa-file-shield primary text-lg"></i>
                                    整理结果
                                </h3>
                                <!-- 显示模式切换 -->
                                <div v-if="result" class="flex items-center gap-2">
                                    <button @click="displayMode = 'rendered'" 
                                        :class="['text-xs px-2 py-1 rounded-md transition-colors', displayMode === 'rendered' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-400 hover:text-slate-600']">
                                        <i class="fa-solid fa-eye mr-1"></i>渲染
                                    </button>
                                    <button @click="displayMode = 'text'" 
                                        :class="['text-xs px-2 py-1 rounded-md transition-colors', displayMode === 'text' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-400 hover:text-slate-600']">
                                        <i class="fa-solid fa-file-lines mr-1"></i>原文
                                    </button>
                                </div>
                                <div class="flex gap-2">
                                    <button @click="copyResult" :disabled="!result"
                                        class="flex items-center gap-2 px-3 py-2 text-sm bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors disabled:opacity-50">
                                        <i class="fa-solid fa-copy text-xs"></i>
                                        <span>复制</span>
                                    </button>
                                    <button @click="exportResult" :disabled="!result"
                                        class="flex items-center gap-2 px-3 py-2 text-sm bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded-lg transition-colors disabled:opacity-50">
                                        <i class="fa-solid fa-download text-xs"></i>
                                        <span>导出</span>
                                    </button>
                                </div>
                            </div>

                            <div v-if="isLoading" class="flex items-center justify-center py-12">
                                <i class="fa-solid fa-spinner fa-spin text-3xl text-emerald-600"></i>
                                <span class="ml-3 text-amber-600 text-sm"><i class="fa-solid fa-clock mr-1"></i>整理中...</span>
                            </div>

                            <!-- 渲染模式 -->
                            <div v-if="displayMode === 'rendered'" class="prose prose-slate max-w-none" v-html="markedParse(result)"></div>
                            <!-- 原文模式 -->
                            <div v-else class="prose prose-slate max-w-none">
                                <pre class="whitespace-pre-wrap text-sm font-mono text-slate-600 bg-slate-50 p-4 rounded-xl">{{ result }}</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-gear text-lg"></i>
                    API 配置
                </h3>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                            DeepSeek API Key
                            <a href="https://platform.deepseek.com/api_keys" target="_blank"
                                class="text-emerald-600 hover:underline text-xs ml-2">获取 Key</a>
                        </label>
                        <input type="password" v-model="apiConfig.deepseek" placeholder="sk-..."
                            class="w-full rounded-lg border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">模型选择</label>
                        <select v-model="apiConfig.model"
                            class="w-full rounded-lg border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                        <p class="text-xs text-slate-500 mt-1">推荐使用 V4 Pro 获得更好的分析质量</p>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                        取消
                    </button>
                    <button @click="saveConfig"
                        class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition-colors">
                        保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;

        createApp({
            setup() {
                // 渲染 Lucide 图标为 SVG 字符串
                // 新版 Lucide 格式: icons['IconName'] = [["path", {d: "..."}], ["circle", {...}], ...]
                const renderIcon = (name, options = {}) => {
                    const iconMap = {
                        'file-text': 'fa-solid fa-file-invoice',
                        'settings': 'fa-solid fa-gear',
                        'sparkles': 'fa-solid fa-wand-magic-sparkles',
                        'type': 'fa-solid fa-font',
                        'upload': 'fa-solid fa-upload',
                        'sliders': 'fa-solid fa-sliders',
                        'loader-2': 'fa-solid fa-spinner fa-spin',
                        'wand-2': 'fa-solid fa-wand-magic',
                        'brain': 'fa-solid fa-brain',
                        'chevron-down': 'fa-solid fa-chevron-down',
                        'file-check': 'fa-solid fa-file-shield',
                        'copy': 'fa-solid fa-copy',
                        'download': 'fa-solid fa-download'
                    };
                    const cls = typeof options === 'string' ? options : (options.class || 'w-5 h-5');
                    const faClass = iconMap[name] || `fa-solid fa-${name}`;
                    return `<i class="${faClass} ${cls}"></i>`;
                };

                const showSettings = ref(false);
                const isLoading = ref(false);
                const reasoning = ref('');
                const result = ref('');
                const displayMode = ref('rendered'); // 显示模式: rendered(渲染) 或 text(原文)

                const apiConfig = reactive({
                    deepseek: '',
                    model: 'deepseek-v4-pro'
                });

                const contentTypes = [
                    { value: 'auto', label: '自动识别' },
                    { value: 'chat', label: '聊天记录' },
                    { value: 'meeting', label: '会议纪要' },
                    { value: 'email', label: '邮件线程' },
                    { value: 'report', label: '长报告' }
                ];

                const form = reactive({
                    contentType: 'auto',
                    content: '',
                    extractDecisions: true,
                    extractTodos: true,
                    filterNoise: true,
                    groupByTopic: true,
                    findUnresolved: true
                });

                // 加载配置
                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            Object.assign(apiConfig, JSON.parse(saved));
                        } catch (e) {
                            console.error('Failed to parse global_llm_config', e);
                        }
                    }
                });

                // Markdown 解析函数（支持换行）
                const markedParse = (text) => {
                    return marked.parse(text, { breaks: true, gfm: true });
                };

                // 保存配置（合并策略）
                function saveConfig() {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('Failed to parse global_llm_config', e);
                    }
                    const merged = { ...current, ...apiConfig };
                    localStorage.setItem('global_llm_config', JSON.stringify(merged));
                    showSettings.value = false;
                }

                // 文件上传
                function handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        form.content = e.target.result;
                    };
                    reader.readAsText(file);
                }

                // 调用 DeepSeek API
                async function callDeepSeek(messages) {
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiConfig.deepseek}`
                        },
                        body: JSON.stringify({
                            model: apiConfig.model,
                            messages: messages,
                            stream: true,
                            temperature: 0.3
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API 调用失败: ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = line.slice(6);
                                if (data === '[DONE]') continue;

                                try {
                                    const parsed = JSON.parse(data);
                                    const delta = parsed.choices[0].delta;

                                    if (delta.reasoning_content) {
                                        reasoning.value += delta.reasoning_content;
                                    }

                                    if (delta.content) {
                                        result.value += delta.content;
                                    }
                                } catch (e) {
                                    console.error('Parse error:', e);
                                }
                            }
                        }
                    }
                }

                // 整理文本
                async function organizeText() {
                    if (!apiConfig.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isLoading.value = true;
                    reasoning.value = '';
                    result.value = '';

                    try {
                        const typeMap = {
                            auto: '自动识别类型',
                            chat: '聊天记录',
                            meeting: '会议纪要',
                            email: '邮件线程',
                            report: '长报告'
                        };

                        let analysisRequirements = [];
                        if (form.extractDecisions) analysisRequirements.push('提取关键决策');
                        if (form.extractTodos) analysisRequirements.push('列出待办事项（带责任人和截止日期）');
                        if (form.filterNoise) analysisRequirements.push('过滤噪音信息（寒暄、表情、重复内容）');
                        if (form.groupByTopic) analysisRequirements.push('按主题/时间线分组整理');
                        if (form.findUnresolved) analysisRequirements.push('识别未解决的问题');

                        const systemPrompt = `你是一位专业的文本整理专家，擅长从长文本中提取关键信息、识别重点并结构化呈现。

你的任务是分析用户提供的长文本（可能是聊天记录、会议纪要、邮件线程或报告），并进行智能整理。

**整理要求**：
${analysisRequirements.map((req, i) => `${i + 1}. ${req}`).join('\n')}

**输出格式**（使用 Markdown）：
1. 首先识别内容类型（聊天/会议/邮件/报告）
2. 提供结构化的整理结果，包括：
   - 📌 核心要点总结
   - 🎯 关键决策（如适用）
   - ✅ 待办事项清单（格式：- [ ] 事项 | 责任人 | 截止日期）
   - 💬 主要讨论主题（分组展示）
   - ❓ 未解决问题（如适用）
   - 📝 补充信息（如适用）

注意：
- 过滤掉寒暄、表情符号、重复内容等噪音
- 保留所有重要信息和上下文
- 使用清晰的 Markdown 格式
- 如果有多个参与者，标注发言人`;

                        const userPrompt = `内容类型：${typeMap[form.contentType]}

原始文本：
${form.content}`;

                        await callDeepSeek([
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ]);

                    } catch (error) {
                        console.error('整理失败:', error);
                        result.value = `❌ 整理失败：${error.message}\n\n请检查 API Key 是否正确，或稍后重试。`;
                    } finally {
                        isLoading.value = false;
                    }
                }

                // 复制结果
                async function copyResult() {
                    try {
                        let fullText = '';
                        if (reasoning.value) {
                            fullText += '=== 深度分析过程 ===\n\n' + reasoning.value + '\n\n';
                        }
                        fullText += '=== 整理结果 ===\n\n' + result.value;

                        await navigator.clipboard.writeText(fullText);
                        alert('✅ 已复制到剪贴板');
                    } catch (err) {
                        alert('❌ 复制失败，请手动复制');
                    }
                }

                // 导出结果
                function exportResult() {
                    let content = `# 长文本整理结果\n\n`;
                    content += `生成时间：${new Date().toLocaleString('zh-CN')}\n\n`;
                    content += `---\n\n`;

                    if (reasoning.value) {
                        content += `## 深度分析过程\n\n${reasoning.value}\n\n---\n\n`;
                    }

                    content += `## 整理结果\n\n${result.value}`;

                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `文本整理_${new Date().getTime()}.md`;
                    a.click();
                    URL.revokeObjectURL(url);
                }

                // 暴露 marked 全局变量供 Vue 模板使用
                return {
                    renderIcon,
                    showSettings,
                    isLoading,
                    reasoning,
                    result,
                    apiConfig,
                    contentTypes,
                    form,
