    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能会议纪要助手 - AI Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f1f5f9; }
        .prose h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; color: #1e293b; }
        .prose h2 { font-size: 1.25em; font-weight: bold; margin-top: 1.5em; margin-bottom: 0.5em; color: #334155; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.2em; }
        .prose h3 { font-size: 1.1em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: #475569; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .prose li { margin-bottom: 0.3em; line-height: 1.6; }
        .prose strong { color: #0f172a; font-weight: 700; }
        .prose blockquote { border-left: 4px solid #cbd5e1; padding-left: 1em; color: #64748b; font-style: italic; }
        /* Markdown 渲染样式优化 */
        .prose p { margin-bottom: 0.75rem; line-height: 1.7; }
        .prose hr { margin: 1rem 0; border-color: #e2e8f0; }
        /* 待办事项特定样式 */
        .todo-item { background: #f0fdf4; border-left: 4px solid #22c55e; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; }
        .decision-item { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>

<body class="min-h-screen flex flex-col">
    <div id="app" class="flex-grow flex flex-col">
        
        <!-- 导航栏 -->
        <nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-clipboard-list text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800">智能会议纪要助手</h1>
                    <p class="text-xs text-slate-500">DeepSeek V4 Pro 驱动 · 录音稿/笔记一键整理</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="../../index.html" class="text-slate-500 hover:text-indigo-600 transition flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> 返回首页
                </a>
                
                <!-- 模型选择 -->
                <div class="hidden md:flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                    <span class="text-xs text-slate-500 pl-2">模型:</span>
                    <select v-model="apiConfig.model" @change="saveConfig" class="text-sm bg-transparent border-none focus:ring-0 text-slate-700 font-medium outline-none cursor-pointer">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>

                <button @click="showSettings = true" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition" title="设置 API Key">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </nav>

        <!-- 主体内容 -->
        <main class="flex-grow p-6 md:p-8 max-w-[1600px] mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- 左侧：输入区 -->
            <div class="flex flex-col h-[calc(100vh-140px)] min-h-[600px]">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                        <h2 class="font-bold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-file-lines text-indigo-500"></i>
                            原始记录
                        </h2>
                        <div class="flex gap-2">
                            <button @click="clearInput" class="text-xs text-slate-500 hover:text-red-500 flex items-center gap-1 px-2 py-1 hover:bg-red-50 rounded transition">
                                <i class="fa-solid fa-trash"></i> 清空
                            </button>
                            <button @click="pasteInput" class="text-xs text-indigo-600 hover:text-indigo-700 flex items-center gap-1 px-2 py-1 bg-indigo-50 hover:bg-indigo-100 rounded transition font-medium">
                                <i class="fa-solid fa-clipboard"></i> 粘贴
                            </button>
                        </div>
                    </div>
                    
                    <textarea v-model="inputText" 
                        class="flex-grow w-full p-6 text-slate-700 text-base leading-relaxed resize-none focus:outline-none focus:bg-slate-50 transition placeholder-slate-400"
                        placeholder="在此粘贴：
1. 语音转文字后的录音稿（ASR结果）
2. 杂乱的会议速记
3. 讨论群里的聊天记录

AI 将自动提取：会议主题、参会人、关键决策、待办事项(To-Do)及详细摘要。"></textarea>

                    <div class="p-4 border-t border-slate-100 bg-white space-y-4">
                        <!-- 选项区 -->
                        <div class="flex flex-wrap gap-4">
                            <div class="flex-1 min-w-[120px]">
                                <label class="block text-xs font-medium text-slate-500 mb-1.5">纪要风格</label>
                                <select v-model="styleMode" class="w-full text-sm border-slate-200 rounded-lg focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                                    <option value="standard">标准商务 (结构清晰)</option>
                                    <option value="detailed">详细记录 (包含讨论过程)</option>
                                    <option value="action">行动导向 (重点在To-Do)</option>
                                    <option value="agile">敏捷站会 (昨日/今日/阻碍)</option>
                                </select>
                            </div>
                            <div class="flex-1 min-w-[120px]">
                                <label class="block text-xs font-medium text-slate-500 mb-1.5">源语言处理</label>
                                <select v-model="languageMode" class="w-full text-sm border-slate-200 rounded-lg focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                                    <option value="auto">自动识别并优化</option>
                                    <option value="fix_grammar">修复口语/病句 (保留原意)</option>
                                    <option value="translate_zh">翻译并整理为中文</option>
                                </select>
                            </div>
                        </div>

                        <button @click="generateMinutes" :disabled="isGenerating || !inputText"
                            class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-lg">
                            <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin"></i>
                            <span v-else>✨ 一键生成会议纪要</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧：结果区 -->
            <div class="flex flex-col h-[calc(100vh-140px)] min-h-[600px]">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                        <div class="flex items-center gap-3">
                            <h2 class="font-bold text-slate-700 flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles text-indigo-500"></i>
                                整理结果
                            </h2>
                            <span v-if="usageToken" class="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">
                                {{ usageToken }} tokens
                            </span>
                        </div>
                        <div class="flex gap-2">
                            <button v-if="resultContent" @click="copyResult" class="text-xs text-indigo-600 hover:bg-indigo-50 px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1 border border-indigo-100">
                                <i class="fa-solid fa-copy"></i> {{ copyBtnText }}
                            </button>
                            <button v-if="resultContent" @click="downloadMarkdown" class="text-xs text-slate-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1 border border-slate-200">
                                <i class="fa-solid fa-download"></i> 导出 MD
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex-grow overflow-auto p-8 bg-white relative custom-scrollbar">
                        <!-- 思考过程 (仅 V4 Pro 模型显示) -->
                        <div v-if="reasoningContent" class="mb-6 p-4 bg-slate-50 rounded-lg border border-slate-100 text-xs text-slate-500 font-mono leading-relaxed">
                            <div class="font-bold text-slate-400 mb-2 flex items-center gap-1 uppercase tracking-wider">
                                <i class="fa-solid fa-brain"></i> AI 深度思考中...
                            </div>
                            <div class="whitespace-pre-wrap">{{ reasoningContent }}</div>
                        </div>

                        <!-- 最终结果 -->
                        <div v-if="resultContent" class="space-y-4">
                            <!-- 显示模式切换 -->
                            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                                <span class="text-xs text-slate-500">
                                    <i class="fa-solid fa-info-circle mr-1"></i>
                                    会议纪要内容较长，可切换显示模式
                                </span>
                                <div class="flex items-center gap-2">
                                    <button
                                        @click="displayMode = 'rendered'"
                                        :class="displayMode === 'rendered' ? 'bg-indigo-100 text-indigo-700 border-indigo-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                                        class="px-3 py-1 text-xs border rounded-lg transition flex items-center gap-1">
                                        <i class="fa-solid fa-eye h-3 w-3"></i>
                                        <span>渲染视图</span>
                                    </button>
                                    <button
                                        @click="displayMode = 'text'"
                                        :class="displayMode === 'text' ? 'bg-indigo-100 text-indigo-700 border-indigo-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                                        class="px-3 py-1 text-xs border rounded-lg transition flex items-center gap-1">
                                        <i class="fa-solid fa-file-text h-3 w-3"></i>
                                        <span>原文文本</span>
                                    </button>
                                </div>
                            </div>

                            <!-- 渲染模式 -->
                            <div v-if="displayMode === 'rendered'" v-html="parsedResult" class="prose max-w-none text-slate-700"></div>

                            <!-- 原文文本模式 -->
                            <div v-if="displayMode === 'text'" class="prose max-w-none">
                                <pre class="whitespace-pre-wrap text-sm text-slate-700 font-mono bg-slate-50 p-4 rounded-lg">{{ resultContent }}</pre>
                            </div>
                        </div>
                        
                        <!-- 空状态 -->
                        <div v-else-if="!isGenerating" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
                            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                                <i class="fa-solid fa-file-circle-check text-4xl opacity-50"></i>
                            </div>
                            <p class="text-sm">整理后的纪要将在这里显示</p>
                        </div>
                        
                        <!-- 加载中占位符 -->
                        <div v-else-if="isGenerating && !resultContent" class="space-y-4 animate-pulse">
                            <div class="h-8 bg-slate-100 rounded w-1/3"></div>
                            <div class="h-4 bg-slate-50 rounded w-full"></div>
                            <div class="h-4 bg-slate-50 rounded w-5/6"></div>
                            <div class="h-4 bg-slate-50 rounded w-4/6"></div>
                            <div class="h-32 bg-slate-50 rounded w-full mt-6"></div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        
        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" @click.self="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold">配置 API</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek"
                            class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-indigo-500 outline-none"
                            placeholder="sk-...">
                        <p class="text-xs text-slate-500 mt-1">推荐使用 DeepSeek V4 Pro (reasoner) 以获得最佳的逻辑归纳效果。</p>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig"
                        class="bg-slate-900 text-white px-4 py-2 rounded-lg hover:bg-slate-800">保存配置</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const inputText = ref('');
                const resultContent = ref('');
                const reasoningContent = ref(''); // 存储推理过程
                const isGenerating = ref(false);
                const showSettings = ref(false);
                const displayMode = ref('rendered');
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });
                const copyBtnText = ref('复制全文');
                const usageToken = ref(0);
                
                const styleMode = ref('standard');
                const languageMode = ref('auto');

                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        apiConfig.value = JSON.parse(saved);
                    }
                });

                // Markdown 解析
                const parsedResult = computed(() => {
                    return markedParse(resultContent.value);
                });

                // Markdown 渲染函数（启用换行支持）
                const markedParse = (text) => {
                    if (!window.marked) return text;
                    return window.marked.parse(text, {
                        breaks: true,
                        gfm: true
                    });
                };

                const saveConfig = () => {
                    localStorage.setItem('global_llm_config', JSON.stringify(apiConfig.value));
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                const clearInput = () => {
                    if (confirm('确定要清空输入内容吗？')) inputText.value = '';
                };
                
                const pasteInput = async () => {
                    try {
                        const text = await navigator.clipboard.readText();
                        inputText.value = text;
                    } catch (err) {
                        alert('无法访问剪贴板，请手动粘贴');
                    }
                };

                const generateMinutes = async () => {
                    if (!apiConfig.value.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isGenerating.value = true;
                    resultContent.value = '';
                    reasoningContent.value = '';
                    usageToken.value = 0;

                    const systemPrompt = `你是一个拥有20年经验的高级行政秘书，擅长将混乱的会议记录整理成专业、清晰的会议纪要。
请根据用户提供的原始文本（可能是语音转文字的稿子，包含口语、重复、逻辑跳跃），整理出一份结构化的会议纪要。

【处理要求】
1. **风格**: ${getStylePrompt(styleMode.value)}
2. **语言**: ${getLanguagePrompt(languageMode.value)}
3. **关键提取**:
   - 必须提取【关键决策】(Decisions)：已达成一致的结论。
   - 必须提取【待办事项】(Action Items)：谁？在什么时候？做什么？（使用 <div class="todo-item">...</div> 格式包裹每个待办项，以便前端渲染）
4. **格式**: 使用 Markdown。标题层级清晰。
5. **去除废话**: 删除寒暄、重复、无关的闲聊。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.value.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.value.model,
                                messages: [
                                    { role: "system", content: systemPrompt },
                                    { role: "user", content: inputText.value }
                                ],
                                stream: true
                            })
                        });

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n');
                            
                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const jsonStr = line.slice(6);
                                    if (jsonStr === '[DONE]') break;
                                    try {
                                        const data = JSON.parse(jsonStr);
                                        
                                        // 处理推理内容 (V4 Pro)
                                        if (data.choices[0].delta.reasoning_content) {
                                            reasoningContent.value += data.choices[0].delta.reasoning_content;
                                        }
                                        
                                        // 处理最终内容
                                        if (data.choices[0].delta.content) {
                                            resultContent.value += data.choices[0].delta.content;
                                        }
                                    } catch (e) {
                                        console.error('JSON Parse Error', e);
                                    }
                                }
                            }
                        }

                    } catch (e) {
                        console.error(e);
                        alert('生成失败，请检查网络或 API Key');
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const getStylePrompt = (style) => {
                    const map = {
                        'standard': '标准商务风格。结构：会议主题、时间/地点/参会人、会议摘要、详细内容、关键决策、待办事项。语气客观正式。',
                        'detailed': '详尽记录风格。需要记录讨论的来龙去脉、不同观点的交锋（如有），不仅是结果。适合研发评审或头脑风暴。',
                        'action': '结果导向风格。极度精简摘要，用 80% 的篇幅展示“决议”和“待办”。适合高层汇报。',
                        'agile': '敏捷站会风格。结构：昨天完成了什么？今天计划做什么？遇到了什么阻碍？'
                    };
                    return map[style];
                };

                const getLanguagePrompt = (lang) => {
                    const map = {
                        'auto': '保持主要语言的一致性。如果原文是中文，输出中文；是英文输出英文。',
                        'fix_grammar': '保留原文语言，但修复所有的语病、口语化表达，使其书面化。',
                        'translate_zh': '无论原文是什么语言，最终全部翻译并整理为【简体中文】。'
                    };
                    return map[lang];
                };

                const copyResult = () => {
                    navigator.clipboard.writeText(resultContent.value);
                    copyBtnText.value = '已复制';
                    setTimeout(() => copyBtnText.value = '复制全文', 2000);
                };

                const downloadMarkdown = () => {
                    const blob = new Blob([resultContent.value], { type: 'text/markdown' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Meeting_Minutes_${new Date().toISOString().slice(0,10)}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                return {
                    inputText,
                    resultContent,
                    reasoningContent,
                    isGenerating,
                    showSettings,
                    displayMode,
                    apiConfig,
                    copyBtnText,
                    usageToken,
                    styleMode,
                    languageMode,
                    parsedResult,
                    markedParse,
                    saveConfig,
                    clearInput,
                    pasteInput,
                    generateMinutes,
                    copyResult,
                    downloadMarkdown
                };
            }
        }).mount('#app');
    </script>

<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/office_meeting_minutes.md"></script>
