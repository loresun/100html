<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 文献综述生成器 - AI Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f8fafc; }
        .font-serif { font-family: 'Noto Serif SC', serif; }
        
        /* 论文阅读模式样式 */
        .paper-view {
            background-color: #fff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            padding: 40px;
            min-height: 800px;
        }
        .prose h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; color: #1e293b; }
        .prose h2 { font-size: 1.25em; font-weight: bold; margin-top: 1.5em; margin-bottom: 0.5em; color: #334155; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .prose h3 { font-size: 1.125em; font-weight: bold; margin-top: 1.25em; margin-bottom: 0.5em; color: #475569; }
        .prose h4 { font-size: 1em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; color: #64748b; }
        .prose h5 { font-size: 0.875em; font-weight: 600; margin-top: 0.75em; margin-bottom: 0.5em; color: #94a3b8; }
        .prose h6 { font-size: 0.8125em; font-weight: 600; margin-top: 0.75em; margin-bottom: 0.5em; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
        .prose p { margin-bottom: 1em; line-height: 1.8; color: #374151; text-align: justify; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .prose blockquote { border-left: 4px solid #94a3b8; padding-left: 1em; color: #64748b; font-style: italic; background: #f8fafc; padding: 10px; }
        /* Markdown 渲染样式增强 */
        .prose .inline-code {
            background-color: #f1f5f9;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            color: #475569;
        }
        .prose pre {
            background-color: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
        }
        .prose pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }
        .prose a {
            color: #334155;
            text-decoration: underline;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col">
    <div id="app" class="flex-grow flex flex-col">
        
        <!-- 导航 -->
        <nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-700 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800">文献综述生成器</h1>
                    <p class="text-xs text-slate-500">上传论文 -> 结构化综述</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="../../index.html" class="text-slate-500 hover:text-slate-800 transition flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> 返回
                </a>
                
                <div class="hidden md:flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                    <span class="text-xs text-slate-500 pl-2">模型:</span>
                    <select v-model="apiConfig.model" @change="saveConfig" class="text-sm bg-transparent border-none focus:ring-0 text-slate-700 font-medium outline-none cursor-pointer">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>

                <button @click="showSettings = true" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </nav>

        <main class="flex-grow p-6 md:p-8 max-w-[1600px] mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- 左侧：输入区 -->
            <div class="flex flex-col h-[calc(100vh-140px)] min-h-[600px]">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                        <h2 class="font-bold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-file-lines text-slate-500"></i> 论文原文
                        </h2>
                        
                        <!-- 文件上传 -->
                        <label class="cursor-pointer text-xs bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3 py-1.5 rounded flex items-center gap-1 transition">
                            <i class="fa-solid fa-upload"></i> 上传 .txt/.md
                            <input type="file" @change="handleFileUpload" accept=".txt,.md" class="hidden">
                        </label>
                    </div>
                    
                    <textarea v-model="paperContent" 
                        class="flex-grow w-full p-6 text-slate-600 text-sm leading-relaxed resize-none focus:outline-none placeholder-slate-400 font-serif"
                        placeholder="在此粘贴论文全文内容...
或者点击上方按钮上传 Markdown/Txt 文件。

AI 将为您生成包含：
1. 研究背景与目的
2. 核心方法论
3. 主要结论
4. 创新点与不足
5. 批判性思考"></textarea>

                    <div class="p-4 border-t border-slate-100">
                        <button @click="generateReview" :disabled="isGenerating || !paperContent"
                            class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-900 transition shadow-lg shadow-slate-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                            <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin"></i>
                            <span v-else>生成结构化综述</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧：输出区 -->
            <div class="flex flex-col h-[calc(100vh-140px)] min-h-[600px]">
                <div class="bg-slate-50 rounded-2xl border border-slate-200 flex-grow flex flex-col overflow-hidden relative">
                    <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-white">
                        <h2 class="font-bold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-pen-nib text-slate-500"></i> 综述报告
                        </h2>
                        <!-- 显示模式切换 -->
                        <div v-if="reviewResult" class="flex items-center gap-2">
                            <button @click="displayMode = 'rendered'" 
                                :class="['text-xs px-2 py-1 rounded-md transition-colors', displayMode === 'rendered' ? 'bg-slate-200 text-slate-800' : 'text-slate-400 hover:text-slate-600']">
                                <i class="fa-solid fa-eye mr-1"></i>渲染
                            </button>
                            <button @click="displayMode = 'text'" 
                                :class="['text-xs px-2 py-1 rounded-md transition-colors', displayMode === 'text' ? 'bg-slate-200 text-slate-800' : 'text-slate-400 hover:text-slate-600']">
                                <i class="fa-solid fa-file-lines mr-1"></i>原文
                            </button>
                        </div>
                        <button v-if="reviewResult" @click="copyResult" class="text-xs text-slate-600 hover:text-slate-900 flex items-center gap-1 ml-2">
                            <i class="fa-solid fa-copy"></i> 复制
                        </button>
                    </div>

                    <div class="flex-grow overflow-auto p-8 custom-scrollbar">
                        <!-- V4 Pro 思考过程 -->
                        <div v-if="reasoningContent" class="mb-8 p-4 bg-yellow-50 border border-yellow-100 rounded text-xs text-yellow-800 leading-relaxed italic">
                            <div class="font-bold not-italic mb-1 flex items-center gap-1">
                                <i class="fa-solid fa-brain"></i> 深度阅读中...
                            </div>
                            {{ reasoningContent }}
                        </div>

                        <!-- 结果内容 -->
                        <!-- 渲染模式 -->
                        <div v-if="displayMode === 'rendered' && reviewResult" v-html="parsedResult" class="paper-view prose max-w-none"></div>
                        <!-- 原文模式 -->
                        <div v-else class="paper-view prose max-w-none">
                            <pre class="whitespace-pre-wrap text-sm font-mono text-slate-600">{{ reviewResult }}</pre>
                        </div>
                        <!-- 加载超时提示 -->
                        <div v-if="isGenerating" class="mt-4 flex items-center gap-2 text-amber-600 text-sm bg-amber-50 px-3 py-2 rounded-lg">
                            <i class="fa-solid fa-clock"></i>
                            <span>正在研读论文并撰写综述...</span>
                        </div>

                        <!-- 空状态 -->
                        <div v-else-if="!isGenerating" class="h-full flex flex-col items-center justify-center text-slate-400">
                            <i class="fa-solid fa-book-open-reader text-6xl mb-4 opacity-20"></i>
                            <p class="text-sm">等待论文输入...</p>
                        </div>
                        
                        <!-- 加载中 -->
                        <div v-else class="h-full flex items-center justify-center">
                            <div class="text-center space-y-3">
                                <i class="fa-solid fa-spinner fa-spin text-4xl text-slate-800 mx-auto"></i>
                                <p class="text-sm text-slate-500">正在研读论文并撰写综述...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        
        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" @click.self="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold">API 配置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-slate-500 outline-none" placeholder="sk-...">
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false" class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig" class="bg-slate-900 text-white px-4 py-2 rounded-lg hover:bg-slate-800">保存配置</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const {createApp, ref, computed, onMounted} = Vue;

        createApp({
            setup() {
                const paperContent = ref('');
                const reviewResult = ref('');
                const reasoningContent = ref('');
                const isGenerating = ref(false);
                const showSettings = ref(false);
                const displayMode = ref('rendered'); // 显示模式: rendered(渲染) 或 text(原文)
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });

                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) apiConfig.value = JSON.parse(saved);
                });

                const parsedResult = computed(() => {
                    return markedParse(reviewResult.value);
                });

                // Markdown 解析函数（支持换行）
                const markedParse = (text) => {
                    return marked.parse(text, { breaks: true, gfm: true });
                };

                const saveConfig = () => {
                    localStorage.setItem('global_llm_config', JSON.stringify(apiConfig.value));
                    showSettings.value = false;
                };

                const handleFileUpload = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        paperContent.value = e.target.result;
                    };
                    reader.readAsText(file);
                };

                const generateReview = async () => {
                    if (!apiConfig.value.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isGenerating.value = true;
                    reviewResult.value = '';
                    reasoningContent.value = '';

                    const systemPrompt = `你是一个学术研究专家。请阅读用户提供的论文文本，撰写一份结构严谨、逻辑清晰的文献综述。

【输出结构要求】
1. **标题**: 论文题目（如果能识别）
2. **摘要 (Abstract)**: 200字以内概括全通过。
3. **研究背景与问题 (Problem Statement)**: 作者试图解决什么问题？为什么这个问题重要？
4. **方法论 (Methodology)**: 使用了什么数据集、模型、实验设计？
5. **主要结论 (Key Findings)**: 核心实验结果数据支撑。
6. **批判性思考 (Critique)**: 
   - 优点：这篇论文的创新点在哪里？
   - 不足/局限性：有什么没解决的问题？
7. **总结 (Conclusion)**: 一句话总结其学术价值。

请使用 Markdown 格式输出。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.value.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.value.model,
                                messages: [
                                    { role: "system", content: systemPrompt },
                                    { role: "user", content: paperContent.value }
                                ],
                                stream: true
                            })
                        });

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            
                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n');
                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const jsonStr = line.slice(6);
                                    if (jsonStr === '[DONE]') break;
                                    try {
                                        const data = JSON.parse(jsonStr);
                                        if (data.choices[0].delta.reasoning_content) {
                                            reasoningContent.value += data.choices[0].delta.reasoning_content;
                                        }
                                        if (data.choices[0].delta.content) {
                                            reviewResult.value += data.choices[0].delta.content;
                                        }
                                    } catch(e){}
                                }
                            }
                        }

                    } catch (e) {
                        alert('生成失败');
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyResult = () => {
                    navigator.clipboard.writeText(reviewResult.value);
                    alert('已复制');
                };

                return {
                    paperContent, reviewResult, reasoningContent, isGenerating, showSettings, apiConfig,
                    parsedResult, markedParse, displayMode,
                    saveConfig, handleFileUpload, generateReview, copyResult
                };
            }
        }).mount('#app');
    </script>

</html>
