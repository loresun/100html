<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWOT 分析生成器 - AI 战略助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f1f5f9;
        }

        .swot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .swot-box {
            height: 100%;
            min-height: 200px;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="min-h-screen flex flex-col">
    <div id="app" class="flex-grow flex flex-col">
        <!-- 导航 -->
        <nav class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-chart-column text-xl"></i>
                </div>
                <h1 class="font-bold text-xl text-slate-900">SWOT 战略分析</h1>
            </div>
            <div class="flex items-center gap-4">
                <!-- V4 Flash/V4 Pro 模型切换器 -->
                <div class="flex items-center gap-2 bg-slate-100 rounded-lg p-1">
                    <button @click="apiConfig.model = 'deepseek-v4-flash'"
                        :class="{'bg-white shadow text-blue-600': apiConfig.model === 'deepseek-v4-flash', 'text-slate-500': apiConfig.model !== 'deepseek-v4-flash'}"
                        class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                    <button @click="apiConfig.model = 'deepseek-v4-pro'"
                        :class="{'bg-white shadow text-blue-600': apiConfig.model === 'deepseek-v4-pro', 'text-slate-500': apiConfig.model !== 'deepseek-v4-pro'}"
                        class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                </div>
                <button @click="showSettings = true"
                    class="text-slate-500 hover:text-blue-600 transition flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-gear text-sm"></i> 设置
                </button>
                <a href="../../index.html"
                    class="text-slate-500 hover:text-blue-600 transition flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left text-sm"></i> 返回首页
                </a>
            </div>
        </nav>

        <main class="flex-grow p-6 md:p-12 max-w-6xl mx-auto w-full space-y-8">
            <!-- 输入 -->
            <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-100 max-w-2xl mx-auto text-center">
                <h2 class="text-lg font-bold mb-4">输入你的项目或想法</h2>
                <div class="flex gap-2">
                    <input v-model="project" type="text" placeholder="例：在市中心开一家精品猫咖；做一款 AI 写作插件"
                        class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-blue-100 transition">
                    <button @click="generateSWOT" :disabled="isGenerating || !project"
                        class="bg-blue-600 text-white px-8 rounded-2xl font-bold hover:bg-blue-700 transition flex items-center gap-2">
                        <i v-if="isGenerating" class="fa-solid fa-circle-notch fa-spin text-lg"></i>
                        <span v-else>开始分析</span>
                    </button>
                </div>
            </div>

            <!-- 错误提示 -->
            <div v-if="errorLog"
                class="max-w-5xl mx-auto bg-red-100 border border-red-200 text-red-800 p-4 rounded-xl text-sm">
                <div class="font-bold mb-1">⚠️ 分析中断:</div>
                <pre class="whitespace-pre-wrap">{{ errorLog }}</pre>
            </div>

            <!-- SWOT 矩阵 -->
            <div v-if="analysis" class="swot-grid max-w-5xl mx-auto">
                <!-- Strengths -->
                <div class="swot-box bg-white p-6 rounded-3xl shadow-lg border-t-8 border-green-500">
                    <div class="flex items-center gap-2 mb-4 text-green-600">
                        <i class="fa-solid fa-arrow-trend-up text-xl"></i>
                        <h3 class="text-xl font-black">STRENGTHS (优势)</h3>
                    </div>
                    <ul class="space-y-3">
                        <li v-for="s in analysis.strengths" class="text-sm text-slate-600 flex gap-2">
                            <span class="text-green-500 font-bold">•</span> {{ s }}
                        </li>
                    </ul>
                </div>

                <!-- Weaknesses -->
                <div class="swot-box bg-white p-6 rounded-3xl shadow-lg border-t-8 border-red-500">
                    <div class="flex items-center gap-2 mb-4 text-red-600">
                        <i class="fa-solid fa-arrow-trend-down text-xl"></i>
                        <h3 class="text-xl font-black">WEAKNESSES (劣势)</h3>
                    </div>
                    <ul class="space-y-3">
                        <li v-for="w in analysis.weaknesses" class="text-sm text-slate-600 flex gap-2">
                            <span class="text-red-500 font-bold">•</span> {{ w }}
                        </li>
                    </ul>
                </div>

                <!-- Opportunities -->
                <div class="swot-box bg-white p-6 rounded-3xl shadow-lg border-t-8 border-blue-500">
                    <div class="flex items-center gap-2 mb-4 text-blue-600">
                        <i class="fa-solid fa-lightbulb text-xl"></i>
                        <h3 class="text-xl font-black">OPPORTUNITIES (机会)</h3>
                    </div>
                    <ul class="space-y-3">
                        <li v-for="o in analysis.opportunities" class="text-sm text-slate-600 flex gap-2">
                            <span class="text-blue-500 font-bold">•</span> {{ o }}
                        </li>
                    </ul>
                </div>

                <!-- Threats -->
                <div class="swot-box bg-white p-6 rounded-3xl shadow-lg border-t-8 border-orange-500">
                    <div class="flex items-center gap-2 mb-4 text-orange-600">
                        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                        <h3 class="text-xl font-black">THREATS (威胁)</h3>
                    </div>
                    <ul class="space-y-3">
                        <li v-for="t in analysis.threats" class="text-sm text-slate-600 flex gap-2">
                            <span class="text-orange-500 font-bold">•</span> {{ t }}
                        </li>
                    </ul>
                </div>
            </div>

            <!-- 战略建议 -->
            <div v-if="analysis" class="max-w-5xl mx-auto bg-slate-900 text-white p-8 rounded-3xl shadow-xl">
                <h3 class="text-xl font-black mb-4 flex items-center gap-2">
                    <i class="fa-regular fa-compass text-xl text-blue-400"></i>
                    核心战略建议
                </h3>
                <p class="text-slate-300 leading-relaxed">{{ analysis.strategy }}</p>
            </div>
        </main>

        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"
            @click="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6" @click.stop>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-slate-900">API 配置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" placeholder="sk-..."
                            class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">模型选择</label>
                        <select v-model="apiConfig.model"
                            class="w-full rounded-lg border-slate-300 border p-2 outline-none">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="px-4 py-2 hover:bg-slate-100 rounded-lg text-slate-600">取消</button>
                    <button @click="saveConfig"
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">保存</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {

                const project = ref('');
                const isGenerating = ref(false);
                const analysis = ref(null);
                const errorLog = ref('');
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });

                onMounted(() => {
                    // 初始化配置
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        const config = JSON.parse(saved);
                        apiConfig.value = { ...apiConfig.value, ...config };
                    }
                    if (!apiConfig.value.model) apiConfig.value.model = 'deepseek-v4-flash';
                });

                const generateSWOT = async () => {
                    if (!apiConfig.value.deepseek) { alert('请先配置 API Key'); return; }
                    isGenerating.value = true;
                    analysis.value = null;
                    errorLog.value = '';

                    const prompt = `你是一个资深战略规划专家。请对项目 "${project.value}" 进行 SWOT 分析。
                    必须返回一个 JSON 对象，格式如下：
                    {
                      "strengths": ["优势1", "优势2", "优势3"],
                      "weaknesses": ["劣势1", "劣势2", "劣势3"],
                      "opportunities": ["机会1", "机会2", "机会3"],
                      "threats": ["威胁1", "威胁2", "威胁3"],
                      "strategy": "综合战略建议（150字以内）"
                    }
                    只返回 JSON。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.value.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.value.model || 'deepseek-v4-flash',
                                messages: [{ role: "system", content: prompt }],
                                stream: false
                            })
                        });

                        if (!response.ok) {
                            const errText = await response.text();
                            throw new Error(`API Error ${response.status}: ${errText}`);
                        }

                        const data = await response.json();
                        const content = data.choices[0].message.content;
                        // 清洗 Markdown
                        let cleanJson = content.replace(/```json/g, '').replace(/```/g, '').trim();
                        const match = cleanJson.match(/\{[\s\S]*\}/);
                        if (match) cleanJson = match[0];

                        analysis.value = JSON.parse(cleanJson);

                    } catch (e) {
                        console.error(e);
                        errorLog.value = e.message;
                    } finally {
                        isGenerating.value = false;
                    }
                };
                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                    alert('配置已保存');
                };

                return {
                    project, isGenerating, analysis, errorLog, showSettings, apiConfig, generateSWOT, saveConfig
                };
            }
        }).mount('#app');
    </script>

</html>
