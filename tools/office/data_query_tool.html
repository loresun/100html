<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正则 & SQL 生成器 - AI Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f8fafc; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col">
    <div id="app" class="flex-grow flex flex-col">
        
        <!-- 导航 -->
        <nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-database text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800">正则 & SQL 生成器</h1>
                    <p class="text-xs text-slate-500">用人话写代码 · 数据提取神器</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="../../index.html" class="text-slate-500 hover:text-indigo-600 transition flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> 返回首页
                </a>
                
                <div class="hidden md:flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                    <span class="text-xs text-slate-500 pl-2">模型:</span>
                    <select v-model="apiConfig.model" @change="saveConfig" class="text-sm bg-transparent border-none focus:ring-0 text-slate-700 font-medium outline-none cursor-pointer">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>

                <button @click="showSettings = true" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </nav>

        <main class="flex-grow p-6 md:p-8 max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- 左侧：输入 -->
            <div class="flex flex-col space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex-grow">
                    
                    <!-- 类型切换 -->
                    <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                        <button @click="type = 'regex'" :class="['flex-1 py-2 rounded-lg text-sm font-bold transition', type === 'regex' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700']">
                            正则表达式 (Regex)
                        </button>
                        <button @click="type = 'sql'" :class="['flex-1 py-2 rounded-lg text-sm font-bold transition', type === 'sql' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700']">
                            数据库查询 (SQL)
                        </button>
                    </div>

                    <label class="block text-sm font-bold text-slate-700 mb-2">
                        {{ type === 'regex' ? '你想从文本中匹配/提取什么？' : '你想从数据库里查什么？' }}
                    </label>
                    <textarea v-model="userInput" 
                        class="w-full h-40 p-4 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none resize-none bg-slate-50 text-sm leading-relaxed"
                        :placeholder="type === 'regex' ? '例如：匹配所有163邮箱地址\n或者：提取括号里的内容\n或者：验证中国大陆手机号' : '例如：从 users 表中查找最近30天注册且消费超过100元的用户，按注册时间倒序排列。'"></textarea>

                    <button @click="generateCode" :disabled="isGenerating || !userInput"
                        class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-4">
                        <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin"></i>
                        <span v-else>🚀 生成代码</span>
                    </button>
                </div>
            </div>

            <!-- 右侧：输出 -->
            <div class="flex flex-col h-[500px] md:h-auto">
                <div class="bg-slate-900 rounded-2xl shadow-xl border border-slate-800 flex-grow flex flex-col overflow-hidden relative text-slate-300">
                    <div class="px-5 py-3 border-b border-slate-800 bg-slate-950 flex items-center justify-between">
                        <span class="text-xs font-mono text-indigo-400">
                            {{ type === 'regex' ? 'Pattern Match' : 'Query Result' }}
                        </span>
                        <button v-if="resultCode" @click="copyCode" class="text-xs hover:text-white flex items-center gap-1 transition">
                            <i class="fa-solid fa-copy"></i> 复制
                        </button>
                    </div>
                    
                    <div class="flex-grow p-6 overflow-auto custom-scrollbar font-mono">
                        <!-- 思考过程 -->
                        <div v-if="reasoningContent" class="mb-6 p-3 bg-slate-800/50 rounded border border-slate-700 text-xs text-slate-500 italic">
                            {{ reasoningContent }}
                        </div>

                        <!-- 代码结果 -->
                        <div v-if="resultCode">
                            <div class="text-green-400 text-sm break-all whitespace-pre-wrap mb-4 font-bold">{{ resultCode }}</div>
                            <div class="text-xs text-slate-500 leading-relaxed border-t border-slate-800 pt-4">
                                <strong class="text-slate-400 block mb-1">解释说明：</strong>
                                {{ explanation }}
                            </div>
                        </div>

                        <!-- 空状态 -->
                        <div v-else-if="!isGenerating" class="h-full flex flex-col items-center justify-center opacity-30">
                            <i class="fa-solid fa-code text-5xl mb-4"></i>
                            <p class="text-sm">等待指令...</p>
                        </div>
                        
                        <!-- 加载中 -->
                        <div v-else class="flex items-center justify-center h-full">
                             <i class="fa-solid fa-spinner fa-spin text-indigo-500 text-3xl"></i>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        
        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" @click.self="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold">API 配置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="sk-...">
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false" class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig" class="bg-slate-900 text-white px-4 py-2 rounded-lg hover:bg-slate-800">保存配置</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const type = ref('regex');
                const userInput = ref('');
                const resultCode = ref('');
                const explanation = ref('');
                const reasoningContent = ref('');
                const isGenerating = ref(false);
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });

                onMounted(() => {
                    try {
                        const saved = localStorage.getItem('global_llm_config');
                        if (saved) apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                    } catch (e) {
                         console.error('Failed to parse global_llm_config', e);
                    }
                });

                const saveConfig = () => {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('Failed to parse global_llm_config', e);
                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                const generateCode = async () => {
                    if (!apiConfig.value.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isGenerating.value = true;
                    resultCode.value = '';
                    explanation.value = '';
                    reasoningContent.value = '';

                    const prompt = type.value === 'regex' 
                        ? "你是一个正则表达式专家。用户描述需求，你生成 Regex。\n请返回 JSON: { \"code\": \"正则表达式\", \"explanation\": \"中文解释\" }"
                        : "你是一个 SQL 专家。用户描述需求，你生成 SQL (默认为 MySQL)。\n请返回 JSON: { \"code\": \"SQL 语句\", \"explanation\": \"中文解释\" }";

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.value.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.value.model,
                                messages: [
                                    { role: "system", content: prompt },
                                    { role: "user", content: userInput.value }
                                ],
                                stream: false
                            })
                        });
                        
                        if (!response.ok) {
                             throw new Error(`API 调用失败: ${response.status}`);
                        }

                        const data = await response.json();
                        if (data.choices && data.choices[0]) {
                            if (data.choices[0].message.reasoning_content) {
                                reasoningContent.value = data.choices[0].message.reasoning_content;
                            }
                            
                            const content = data.choices[0].message.content;
                            const jsonMatch = content.match(/\{[\s\S]*\}/);
                            if (jsonMatch) {
                                const res = JSON.parse(jsonMatch[0]);
                                resultCode.value = res.code;
                                explanation.value = res.explanation;
                            } else {
                                resultCode.value = content; // Fallback
                            }
                        }

                    } catch (e) {
                        alert('生成失败: ' + e.message);
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyCode = () => {
                    navigator.clipboard.writeText(resultCode.value);
                    alert('已复制');
                };

                return {
                    type, userInput, resultCode, explanation, reasoningContent,
                    isGenerating, showSettings, apiConfig,
                    saveConfig, generateCode, copyCode
                };
            }
        }).mount('#app');
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/office_data_query_tool.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
