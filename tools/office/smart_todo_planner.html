                        <!-- 分析结果 -->

                            <div class="flex items-center justify-between mb-4">
                                <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">

                                    <button @click="exportResult" :disabled="!result"
                                        class="flex items-center gap-2 px-3 py-2 text-sm bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-lg transition-colors disabled:opacity-50">
                                        <i class="fa-solid fa-download text-xs"></i>
                                        <span>导出</span>
                                    </button>
                                </div>
                            </div>

                            <div v-if="isLoading" class="flex items-center justify-center py-12">

                                <span class="ml-3 text-amber-600 text-sm"><i class="fa-solid fa-clock mr-1"></i>分析中...</span>

                            <!-- 渲染模式 -->

                            <!-- 原文模式 -->

                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                        <p class="text-xs text-slate-500 mt-1">推荐使用 V4 Pro 获得更智能的优先级分析</p>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-2">

                        class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;

        createApp({
            setup() {
                const renderIcon = (name, options = {}) => {
                    const iconMap = {
                        'list-checks': 'fa-solid fa-list-check',
                        'settings': 'fa-solid fa-gear',
                        'clipboard-list': 'fa-solid fa-clipboard-list',
                        'sliders': 'fa-solid fa-sliders',
                        'clock': 'fa-solid fa-clock',
                        'loader-2': 'fa-solid fa-spinner fa-spin',
                        'sparkles': 'fa-solid fa-wand-magic-sparkles',
                        'brain': 'fa-solid fa-brain',
                        'chevron-down': 'fa-solid fa-chevron-down',
                        'copy': 'fa-solid fa-copy',
                        'download': 'fa-solid fa-download'
                    };
                    const cls = typeof options === 'string' ? options : (options.class || 'w-5 h-5');
                    const faClass = iconMap[name] || `fa-solid fa-${name}`;
                    return `<i class="${faClass} ${cls}"></i>`;
                };

                const showSettings = ref(false);
                const isLoading = ref(false);
                const reasoning = ref('');
                const result = ref('');
                const displayMode = ref('rendered'); // 显示模式: rendered(渲染) 或 text(原文)

                const apiConfig = reactive({
                    deepseek: '',
                    model: 'deepseek-v4-pro'
                });

                const form = reactive({
                    todos: '',
                    prioritize: true,
                    estimateTime: true,
                    detectDependencies: true,
                    categorize: true,
                    suggestOrder: true,
                    availableTime: '',
                    timePreference: 'anytime'
                });

                // 加载配置
                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            Object.assign(apiConfig, JSON.parse(saved));
                        } catch (e) {
                            console.error('Failed to parse global_llm_config', e);
                        }
                    }
                });

                // Markdown 解析函数（支持换行）
                const markedParse = (text) => {
                    return marked.parse(text, { breaks: true, gfm: true });
                };

                // 保存配置（合并策略）
                function saveConfig() {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('Failed to parse global_llm_config', e);
                    }
                    const merged = { ...current, ...apiConfig };
                    localStorage.setItem('global_llm_config', JSON.stringify(merged));
                    showSettings.value = false;
                }

                // 调用 DeepSeek API
                async function callDeepSeek(messages) {
                    let response;
                    try {
                        response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: messages,
                                stream: true,
                                temperature: 0.3
                            })
                        });
                    } catch (e) {
                        throw new Error(`网络请求失败: ${e.message}`);
                    }

                    if (!response.ok) {
                        throw new Error(`API 调用失败: ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = line.slice(6);
                                if (data === '[DONE]') continue;

                                try {
                                    const parsed = JSON.parse(data);
                                    const delta = parsed.choices[0].delta;

                                    if (delta.reasoning_content) {
                                        reasoning.value += delta.reasoning_content;
                                    }

                                    if (delta.content) {
                                        result.value += delta.content;
                                    }
                                } catch (e) {
                                    console.error('Parse error:', e);
                                }
                            }
                        }
                    }
                }

                // 分析待办事项
                async function analyzeTodos() {
                    if (!apiConfig.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isLoading.value = true;
                    reasoning.value = '';
                    result.value = '';

                    try {
                        let analysisRequirements = [];
                        if (form.prioritize) analysisRequirements.push('使用艾森豪威尔矩阵（重要性×紧急度）进行优先级排序');
                        if (form.estimateTime) analysisRequirements.push('为每个任务估算所需时间');
                        if (form.detectDependencies) analysisRequirements.push('检测任务之间的依赖关系');
                        if (form.categorize) analysisRequirements.push('自动分类（工作/生活/学习/健康/社交等）');
                        if (form.suggestOrder) analysisRequirements.push('建议最佳执行顺序（考虑依赖、能量消耗、时间偏好）');

                        const timePrefMap = {
                            morning: '上午效率最高',
                            afternoon: '下午效率最高',
                            evening: '晚上效率最高',
                            anytime: '无时间偏好'
                        };

                        let contextInfo = `时间偏好：${timePrefMap[form.timePreference]}`;
                        if (form.availableTime) {
                            contextInfo += `\n今日可用时间：${form.availableTime}`;
                        }

                        const systemPrompt = `你是一位专业的时间管理专家，擅长使用艾森豪威尔矩阵和 GTD 方法帮助用户高效管理待办事项。

你的任务是分析用户提供的待办事项列表，并进行智能分析和排序。

**分析要求**：
${analysisRequirements.map((req, i) => `${i + 1}. ${req}`).join('\n')}

**用户信息**：
${contextInfo}

**输出格式**（使用 Markdown）：

## 📊 艾森豪威尔矩阵分类

### 🔴 重要且紧急（立即执行）
- [ ] 任务名称 | ⏱️ 预计X分钟/小时 | 🏷️ 分类

### 🟡 重要但不紧急（计划执行）
- [ ] 任务名称 | ⏱️ 预计X分钟/小时 | 🏷️ 分类

### 🟠 紧急但不重要（委托/简化）
- [ ] 任务名称 | ⏱️ 预计X分钟/小时 | 🏷️ 分类

### ⚪ 不重要不紧急（考虑删除）
- [ ] 任务名称 | ⏱️ 预计X分钟/小时 | 🏷️ 分类

---

## ✅ 今日推荐执行清单（按优先级排序）

1. **任务名称** - ⏱️ X分钟 - 原因：为什么优先做这个
2. ...

---

## 🔗 任务依赖关系（如有）

- 任务 A → 任务 B（需先完成 A）

---

## 💡 时间管理建议

- 针对用户的具体情况，给出3-5条实用建议
- 包括：任务分解、时间块分配、能量管理等

注意：
- 基于任务描述推断优先级，合理解释
- 时间估算要实际可行（考虑准备时间、休息等）
- 建议要具体、可执行`;

                        const userPrompt = `我的待办事项清单：

${form.todos}`;

                        await callDeepSeek([
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ]);

                    } catch (error) {
                        console.error('分析失败:', error);
                        result.value = `❌ 分析失败：${error.message}\n\n请检查 API Key 是否正确，或稍后重试。`;
                    } finally {
                        isLoading.value = false;
                    }
                }

                // 复制结果
                async function copyResult() {
                    try {
                        let fullText = '';
                        if (reasoning.value) {
                            fullText += '=== 深度分析过程 ===\n\n' + reasoning.value + '\n\n';
                        }
                        fullText += '=== 分析结果 ===\n\n' + result.value;

                        await navigator.clipboard.writeText(fullText);
                        alert('✅ 已复制到剪贴板');
                    } catch (err) {
                        alert('❌ 复制失败，请手动复制');
                    }
                }

                // 导出结果
                function exportResult() {
                    let content = `# 智能待办清单分析\n\n`;
                    content += `生成时间：${new Date().toLocaleString('zh-CN')}\n\n`;
                    content += `---\n\n`;

                    if (reasoning.value) {
                        content += `## 深度分析过程\n\n${reasoning.value}\n\n---\n\n`;
                    }

                    content += `## 分析结果\n\n${result.value}`;

                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `待办清单分析_${new Date().getTime()}.md`;
                    a.click();
                    URL.revokeObjectURL(url);
                }

                return {
                    renderIcon,
                    showSettings,
                    isLoading,
                    reasoning,
                    result,
                    apiConfig,
                    form,
                    markedParse,
                    displayMode,
                    saveConfig,
                    analyzeTodos,
                    copyResult,
                    exportResult
                };
            }
        }).mount('#app');
    </script>
