<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 公式生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [v-cloak] {
            display: none;
        }

        .excel-green {
            color: #16a34a;
        }

        .bg-excel-green {
            background-color: #16a34a;
        }

        .border-excel-green {
            border-color: #16a34a;
        }

        .hover\:bg-excel-green:hover {
            background-color: #15803d;
        }

        .code-block {
            font-family: 'Consolas', 'Monaco', monospace;
            background-color: #f1f5f9;
        }

        /* Markdown 渲染样式优化 */
        .prose h2 {
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            font-size: 1.125rem;
            font-weight: 600;
            color: #166534;
            border-bottom: 1px solid #bbf7d0;
            padding-bottom: 0.5rem;
        }

        .prose h3 {
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #15803d;
        }

        .prose p {
            margin-bottom: 0.75rem;
            line-height: 1.7;
        }

        .prose ul, .prose ol {
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
            padding-left: 1.25rem;
        }

        .prose li {
            margin-bottom: 0.375rem;
            line-height: 1.6;
        }

        .prose hr {
            margin: 1rem 0;
            border-color: #bbf7d0;
        }

        .prose strong {
            color: #15803d;
            font-weight: 600;
        }

        .prose code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
        }

        .prose pre {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .prose pre code {
            background: transparent;
            padding: 0;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="bg-slate-50 min-h-screen">
    <div id="app" v-cloak class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- 头部 -->
        <header class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-green-600 rounded-xl flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-file-excel text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Excel 公式生成器</h1>
                    <p class="text-slate-500 text-sm">DeepSeek V4 Pro 驱动 • 复杂公式轻松写</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button @click="showSettings = true" class="p-2.5 text-slate-500 hover:text-green-600 hover:bg-slate-100 rounded-lg transition-colors" title="设置">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
                <div class="relative">
                    <a href="../../index.html" class="p-2.5 text-slate-500 hover:text-green-600 hover:bg-slate-100 rounded-lg transition-colors inline-block" title="返回首页">
                        <i class="fa-solid fa-arrow-left text-lg"></i>
                    </a>
                </div>
            </div>
        </header>

        <!-- 主要区域 -->
        <div class="grid gap-6">
            <!-- 输入区 -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                 <div class="flex items-center gap-2 mb-4">
                    <i class="fa-solid fa-square-root-variable text-green-600 text-lg"></i>
                    <h2 class="font-bold text-slate-900">你的需求</h2>
                </div>
                <div class="relative">
                    <textarea 
                        v-model="userQuery"
                        rows="4" 
                        class="w-full p-4 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 resize-none text-slate-700 leading-relaxed transition-all"
                        placeholder="例如：
- 计算 A 列中大于 50 的数字之和
- 提取 B 列身份证号码中的出生日期
- 根据 C 列的分数判断等级（>90优秀，>60及格，否则不及格）
- 查找 D 列在 Sheet2 中的对应值..."></textarea>
                    
                    <div class="absolute bottom-3 right-3 flex gap-2">
                         <button @click="clearInput" v-if="userQuery" class="text-xs text-slate-400 hover:text-red-500 px-2 py-1 bg-white/80 rounded transition-colors">
                            清空
                        </button>
                    </div>
                </div>

                <div class="mt-4 flex flex-col sm:flex-row gap-3 justify-between items-center">
                    <!-- 模式切换 -->
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-slate-500">模式：</span>
                        <div class="flex bg-slate-100 rounded-lg p-1">
                            <button 
                                @click="mode = 'normal'"
                                :class="mode === 'normal' ? 'bg-white text-green-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                                class="px-3 py-1.5 rounded-md text-sm font-medium transition-all">
                                <i class="fa-solid fa-list-ul mr-1"></i>普通
                            </button>
                            <button 
                                @click="mode = 'quick'"
                                :class="mode === 'quick' ? 'bg-white text-green-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                                class="px-3 py-1.5 rounded-md text-sm font-medium transition-all">
                                <i class="fa-solid fa-bolt mr-1"></i>快速
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex gap-2 text-sm text-slate-500">
                         <span class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-md">
                            <i class="fa-solid fa-wand-magic-sparkles text-xs"></i> 支持 VBA
                         </span>
                         <span class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-md">
                            <i class="fa-solid fa-circle-question text-xs"></i> 复杂嵌套
                         </span>
                    </div>
                     <button 
                        @click="generateFormula" 
                        :disabled="isLoading || !userQuery"
                        class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-8 rounded-xl transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-lg shadow-green-100 transfrom active:scale-95">
                        <span v-if="isLoading">
                            <i class="fa-solid fa-spinner fa-spin mr-1"></i> 正在生成...
                        </span>
                        <span v-else>
                            <i class="fa-solid fa-calculator mr-1"></i> 生成公式
                        </span>
                    </button>
                </div>
            </section>

            <!-- 结果区 -->
             <section v-if="result || isLoading" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 min-h-[200px]">
                <div class="flex items-center justify-between mb-4">
                     <div class="flex items-center gap-2">
                        <i class="fa-solid fa-desktop text-green-600 text-lg"></i>
                        <h2 class="font-bold text-slate-900">生成的公式</h2>
                    </div>
                     <div v-if="result" class="flex gap-2">
                        <button @click="copyResult" class="text-xs font-medium text-slate-500 hover:text-green-600 bg-slate-50 hover:bg-green-50 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                            <i class="fa-solid fa-copy"></i>
                            复制
                        </button>
                    </div>
                </div>

                <div v-if="isLoading" class="flex flex-col items-center justify-center py-12 text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-green-500"></i>
                    <p class="animate-pulse">DeepSeek 正在思考最佳方案...</p>
                    <p class="text-amber-600 text-xs mt-2 bg-amber-50 px-3 py-1.5 rounded-lg">
                        <i class="fa-solid fa-clock mr-1"></i>
                        Excel 公式生成需要一定时间，请耐心等待
                    </p>
                </div>

                <div v-else>
                    <!-- 快速模式：只显示结果 -->
                    <div v-if="mode === 'quick'" class="mb-4">
                        <div v-if="result === '无法实现最优公式'" class="text-center py-8">
                            <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500 mb-3"></i>
                            <p class="text-slate-600 font-medium">{{ result }}</p>
                        </div>
                        <div v-else class="code-block p-4 rounded-xl border border-slate-200 text-slate-800 font-bold text-lg break-all select-all flex items-start gap-3">
                            <span class="text-green-600 mt-1"><i class="fa-solid fa-table"></i></span>
                            <span>{{ result }}</span>
                        </div>
                    </div>

                    <!-- 普通模式：公式 + 解释 -->
                    <template v-else>
                        <div v-if="mainFormula" class="mb-6">
                            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">核心公式</div>
                             <div class="code-block p-4 rounded-xl border border-slate-200 text-slate-800 font-bold text-lg break-all select-all flex items-start gap-3">
                                 <span class="text-green-600 mt-1"><i class="fa-solid fa-table"></i></span>
                                 <span>{{ mainFormula }}</span>
                             </div>
                        </div>

                        <!-- 显示模式切换 -->
                        <div class="flex items-center justify-between pb-2 border-b border-slate-100 mb-4">
                            <span class="text-xs text-slate-500">
                                <i class="fa-solid fa-info-circle mr-1"></i>
                                公式说明内容较长，可切换显示模式
                            </span>
                            <div class="flex items-center gap-2">
                                <button
                                    @click="displayMode = 'rendered'"
                                    :class="displayMode === 'rendered' ? 'bg-green-100 text-green-700 border-green-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                                    class="px-3 py-1 text-xs border rounded-lg transition flex items-center gap-1">
                                    <i class="fa-solid fa-eye h-3 w-3"></i>
                                    <span>渲染视图</span>
                                </button>
                                <button
                                    @click="displayMode = 'text'"
                                    :class="displayMode === 'text' ? 'bg-green-100 text-green-700 border-green-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                                    class="px-3 py-1 text-xs border rounded-lg transition flex items-center gap-1">
                                    <i class="fa-solid fa-file-text h-3 w-3"></i>
                                    <span>原文文本</span>
                                </button>
                            </div>
                        </div>

                        <!-- 渲染模式 -->
                        <div v-if="displayMode === 'rendered'" class="prose prose-sm prose-slate max-w-none bg-slate-50 p-5 rounded-xl border border-slate-100">
                            <div v-html="renderedExplanation"></div>
                        </div>

                        <!-- 原文文本模式 -->
                        <div v-else class="prose prose-sm prose-slate max-w-none">
                            <pre class="whitespace-pre-wrap text-sm text-slate-700 font-mono bg-slate-50 p-4 rounded-lg">{{ result }}</pre>
                        </div>
                    </template>
                </div>
            </section>
        </div>

        <!-- 设置模态框 -->
        <div v-if="showSettings" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
             <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100">
                <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                    <h3 class="font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-green-600"></i>
                        模型设置
                    </h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600 transition-colors">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div class="p-6 space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">DeepSeek API Key</label>
                        <input type="password" v-model="apiKey" placeholder="sk-..." class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">模型版本</label>
                        <select v-model="model" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-green-500">
                             <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                             <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>
                </div>
                <div class="p-4 bg-slate-50 flex justify-end">
                    <button @click="saveSettings" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                        保存配置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const userQuery = ref('');
                const result = ref('');
                const isLoading = ref(false);
                const showSettings = ref(false);
                const displayMode = ref('rendered');
                const apiKey = ref('');
                const model = ref('deepseek-v4-pro');
                const mode = ref('normal'); // 'normal' or 'quick'

                // Computed to extract formula and explanation
                const mainFormula = computed(() => {
                    if (!result.value) return '';
                    // 简单的正则匹配 Excel 公式，通常以 = 开头，或者在代码块中
                    // 这里假设模型输出包含 ```excel ... ``` 或者 `=...`
                    // 为了简化，我们让模型返回 JSON 或者特定的格式比较好，但这里处理自然语言输出
                    
                    // 尝试提取代码块中的内容
                    const codeBlockRegex = /```(?:excel|vb|vba)?\s*([\s\S]*?)\s*```/i;
                    const match = result.value.match(codeBlockRegex);
                    if (match) return match[1].trim();

                    // 尝试提取单行公式
                    const lines = result.value.split('\n');
                    for(const line of lines) {
                        if (line.trim().startsWith('=') && line.length > 5) {
                            return line.trim();
                        }
                    }
                    
                    return ''; 
                });

                const renderedExplanation = computed(() => {
                    // 如果提取了公式，尝试移除公式部分，只保留解释，实际上全部渲染也可以
                    return markedParse(result.value || '');
                });

                // Markdown 渲染函数（启用换行支持）
                const markedParse = (text) => {
                    if (!window.marked) return text;
                    return window.marked.parse(text, {
                        breaks: true,
                        gfm: true
                    });
                };

                onMounted(() => {
                     const savedConfig = localStorage.getItem('global_llm_config');
                    if (savedConfig) {
                        try {
                            const config = JSON.parse(savedConfig);
                            if (config.deepseek) apiKey.value = config.deepseek;
                            if (config.model) model.value = config.model;
                        } catch (e) { console.error(e); }
                    }
                });

                const saveSettings = () => {
                     try {
                        const existing = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                        const newConfig = {
                            ...existing,
                            deepseek: apiKey.value,
                            model: model.value
                        };
                        localStorage.setItem('global_llm_config', JSON.stringify(newConfig));
                        showSettings.value = false;
                    } catch (e) { alert('保存失败'); }
                };

                const clearInput = () => userQuery.value = '';

                const generateFormula = async () => {
                    if (!apiKey.value) {
                        showSettings.value = true;
                        return;
                    }
                    
                    isLoading.value = true;
                    result.value = '';

                    let prompt;
                    if (mode.value === 'quick') {
                        // 快速模式：直接返回公式或不回复
                        prompt = `你是一个Excel专家。用户有以下需求：
"${userQuery.value}"

请直接返回最优的Excel公式。如果无法实现最优公式，只返回："无法实现最优公式"

不需要任何解释、说明、markdown格式或代码块包裹。只返回公式本身或上述固定文案。`;
                    } else {
                        // 普通模式：详细解释
                        prompt = `你是一个Excel专家。用户有以下需求：
"${userQuery.value}"

请提供：
1. 最适合的 Excel 公式（如有必要提供 VBA 代码）。
2. 公式的详细解释，包括每个参数的含义。
3. 如果有多种实现方式（如普通公式 vs数组公式 vs PowerQuery），请简要说明优劣。

请直接给出答案，核心公式请用 Markdown 代码块包裹。`;
                    }

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey.value}`
                            },
                             body: JSON.stringify({
                                model: model.value,
                                messages: [
                                    { role: 'system', content: '你是 Excel 专家助手。请输出清晰的 markdown 格式。' },
                                    { role: 'user', content: prompt }
                                ],
                                stream: true
                            })
                        });

                         if (!response.ok) throw new Error('API Request Failed');

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            
                             const chunk = decoder.decode(value, { stream: true });
                            const lines = chunk.split('\n');
                            
                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const jsonStr = line.slice(6);
                                    if (jsonStr === '[DONE]') continue;
                                    try {
                                        const data = JSON.parse(jsonStr);
                                        const content = data.choices[0].delta.content;
                                        if (content) result.value += content;
                                    } catch (e) {}
                                }
                            }
                        }

                    } catch (error) {
                         result.value = `Error: ${error.message}`;
                    } finally {
                        isLoading.value = false;
                    }
                };

                const copyResult = async () => {
                     try {
                        await navigator.clipboard.writeText(result.value);
                        alert('已复制');
                    } catch (e) {}
                };

                return {
                    userQuery,
                    result,
                    isLoading,
                    showSettings,
                    displayMode,
                    apiKey,
                    model,
                    mode,
                    mainFormula,
                    renderedExplanation,
                    markedParse,
                    saveSettings,
                    clearInput,
                    generateFormula,
                    copyResult
                };
            }
        }).mount('#app');
    </script>
