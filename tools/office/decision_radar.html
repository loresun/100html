<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生小决策评分板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #f0fdf4 0%, #f8fafc 60%, #dcfce7 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen">
        <header class="py-10 px-4">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500 flex items-center justify-center">
                        <i class="fa-solid fa-bullseye text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">人生小决策评分板</h1>
                        <p class="text-slate-500">用雷达图对比选项，AI 给出参考。</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="showSettings = true" class="p-2 rounded-full bg-white border border-slate-200 text-slate-500 hover:text-emerald-600">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                    <a href="../../index.html" class="text-sm text-slate-500 hover:text-emerald-600">返回首页</a>
                </div>
            </div>
        </header>

        <main class="px-4 pb-16">
            <div class="max-w-5xl mx-auto grid lg:grid-cols-[1fr_1fr] gap-8">
                <section class="glass-card rounded-3xl p-8 shadow-lg">
                    <input v-model="decision" class="w-full border border-slate-200 rounded-xl px-4 py-3" placeholder="决策主题">
                    <div class="grid md:grid-cols-2 gap-3 mt-4">
                        <input v-model="optionA" class="border border-slate-200 rounded-xl px-4 py-3" placeholder="选项 A">
                        <input v-model="optionB" class="border border-slate-200 rounded-xl px-4 py-3" placeholder="选项 B">
                    </div>
                    <div class="mt-4">
                        <label class="text-sm text-slate-500">权重（拖动）</label>
                        <div v-for="(weight, index) in weights" :key="index" class="mt-3">
                            <div class="flex justify-between text-sm text-slate-600">
                                <span>{{ weight.label }}</span>
                                <span>{{ weight.value }}</span>
                            </div>
                            <input type="range" min="1" max="10" v-model="weight.value" class="w-full">
                        </div>
                    </div>
                    <button @click="generate" class="mt-5 px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-medium hover:bg-emerald-500" :disabled="isLoading">生成对比</button>
                    <p v-if="error" class="text-sm text-red-500 mt-3">{{ error }}</p>
                </section>

                <section class="glass-card rounded-3xl p-8 shadow-lg">
                    <canvas id="radarChart" height="260"></canvas>
                    <div class="mt-4 bg-emerald-50 rounded-2xl p-4 text-slate-700 whitespace-pre-line">{{ insight || '等待 AI 建议。' }}</div>
                </section>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-md">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                    <input v-model="apiConfig.deepseek" type="password" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">模型</label>
                    <select v-model="apiConfig.model" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>
                <button @click="saveConfig" class="mt-6 w-full px-4 py-2 rounded-lg bg-emerald-600 text-white font-medium hover:bg-emerald-500">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const decision = ref('是否参加新的项目');
                const optionA = ref('保持现状');
                const optionB = ref('加入新项目');
                const weights = ref([
                    { label: '时间成本', value: 6 },
                    { label: '成长潜力', value: 8 },
                    { label: '快乐程度', value: 7 },
                    { label: '经济收益', value: 5 }
                ]);
                const insight = ref('');
                const error = ref('');
                const isLoading = ref(false);
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });
                let chartInstance = null;

                // 调用 LLM API
                // 包含完整的错误处理，捕获网络错误和 API 错误
                const callLLM = async (prompt) => {
                    if (!apiConfig.value.deepseek) {
                        error.value = '请先配置 DeepSeek API Key。';
                        return '';
                    }
                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                Authorization: `Bearer ${apiConfig.value.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.value.model,
                                messages: [
                                    { role: 'system', content: '你是决策分析师，需要输出简洁建议。' },
                                    { role: 'user', content: prompt }
                                ],
                                temperature: 0.7
                            })
                        });
                        if (!response.ok) {
                            // 尝试解析错误响应获取详细信息
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || `API 请求失败: ${response.status}`);
                        }
                        const data = await response.json();
                        return data.choices?.[0]?.message?.content || '';
                    } catch (err) {
                        // 区分网络错误和 API 错误
                        if (err.name === 'TypeError' && err.message.includes('fetch')) {
                            throw new Error('网络连接失败，请检查网络设置');
                        }
                        throw err; // 重新抛出其他错误供调用方处理
                    }
                };

                const renderChart = (scoresA, scoresB) => {
                    const ctx = document.getElementById('radarChart').getContext('2d');
                    if (chartInstance) chartInstance.destroy();
                    chartInstance = new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: weights.value.map(item => item.label),
                            datasets: [
                                {
                                    label: optionA.value,
                                    data: scoresA,
                                    backgroundColor: 'rgba(16, 185, 129, 0.2)',
                                    borderColor: '#10b981'
                                },
                                {
                                    label: optionB.value,
                                    data: scoresB,
                                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                                    borderColor: '#3b82f6'
                                }
                            ]
                        },
                        options: {
                            scales: { r: { min: 0, max: 10 } }
                        }
                    });
                };

                const generate = async () => {
                    error.value = '';
                    insight.value = '';
                    isLoading.value = true;
                    try {
                        const prompt = `决策主题：${decision.value}\n选项A：${optionA.value}\n选项B：${optionB.value}\n权重：${weights.value.map(w => `${w.label}${w.value}`).join('，')}\n\n请给出 A/B 在四个维度的评分（1-10），并输出一句建议。格式：A: 6,7,8,5 B: 5,8,6,7 建议: ...`;
                        const text = await callLLM(prompt);
                        const matchA = text.match(/A[:：]\s*([\d,\s]+)/i);
                        const matchB = text.match(/B[:：]\s*([\d,\s]+)/i);
                        const scoresA = matchA ? matchA[1].split(/,|\s+/).map(n => Number(n)).filter(n => !Number.isNaN(n)).slice(0, 4) : [6, 7, 6, 5];
                        const scoresB = matchB ? matchB[1].split(/,|\s+/).map(n => Number(n)).filter(n => !Number.isNaN(n)).slice(0, 4) : [5, 8, 6, 7];
                        insight.value = text.split('建议:')[1]?.trim() || text;
                        renderChart(scoresA, scoresB);
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        isLoading.value = false;
                    }
                };

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                    renderChart([6, 7, 6, 5], [5, 8, 6, 7]);
                });

                return {
                    decision,
                    optionA,
                    optionB,
                    weights,
                    insight,
                    error,
                    isLoading,
                    showSettings,
                    apiConfig,
                    generate,
                    saveConfig
                };
            }
        }).mount('#app');
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/office_decision_radar.md"></script>

</body>

</html>
