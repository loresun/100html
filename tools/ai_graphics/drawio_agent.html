        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: white;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);

        .settings-panel.open { right: 0; }
        .settings-overlay {
            position: fixed;

            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;

        .settings-overlay.open { opacity: 1; visibility: visible; }
        
        /* 聊天模态框 */
        .chat-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);

        .chat-content {

        /* 渲染容器 */

    <script>
        // === 全局变量 ===
        let currentXml = '';
        let versionHistory = [];
        let currentVersionIndex = -1;
        
        // === DOM 元素 ===
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const actionPanel = document.getElementById('actionPanel');
        const graphContainer = document.getElementById('graphContainer');
        const placeholder = document.getElementById('placeholder');
        const statusBadge = document.getElementById('statusBadge');
        
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        
        const historyBtn = document.getElementById('historyBtn');
        const historyPanel = document.getElementById('historyPanel');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const versionList = document.getElementById('versionList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        
        const chatBtn = document.getElementById('chatBtn');
        const chatModal = document.getElementById('chatModal');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');
        
        const downloadBtn = document.getElementById('downloadBtn');
        const copyXmlBtn = document.getElementById('copyXmlBtn');
        const fileInput = document.getElementById('fileInput');

        // === 工具函数 ===
        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        };

        const setLoading = (loading, text) => {
            if (loading) {
                generateBtn.disabled = true;
                generateBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>${text || '生成中...'}`;
                statusBadge.textContent = '生成中...';
                statusBadge.className = 'text-xs px-2 py-1 bg-orange-100 text-orange-600 rounded animate-pulse';
            } else {
                generateBtn.disabled = false;
                generateBtn.innerHTML = `<i class="fas fa-wand-magic-sparkles mr-2"></i>生成图表`;
                statusBadge.textContent = '完成';
                statusBadge.className = 'text-xs px-2 py-1 bg-green-100 text-green-600 rounded';
            }
        };

        // === API 配置 ===
        function getApiConfig() {
            return {
                url: document.getElementById('apiUrl').value,
                key: document.getElementById('apiKey').value || getGlobalDeepSeekKey(), 
                model: document.getElementById('modelSelect').value
            };
        }
        
        // 获取全局 Key (使用 global_llm_config)
        function getGlobalDeepSeekKey() {
            try {
                const config = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                return config.deepseek || '';
            } catch { return ''; }
        }

        // 保存全局 Key (合并保存到 global_llm_config)
        function saveGlobalDeepSeekKey(key) {
            try {
                const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                current.deepseek = key;
                localStorage.setItem('global_llm_config', JSON.stringify(current));
            } catch (e) {
                console.error('保存全局配置失败', e);
            }
        }


        // === 核心：生成 Draw.io XML ===
        async function generateDrawioXml(userPrompt, mode = 'create', originalXml = '') {
            const { url, key, model } = getApiConfig();
            if (!key) {
                showToast('请先在右上角设置 API Key');
                settingsPanel.classList.add('open');
                settingsOverlay.classList.add('open');
                return;
            }

            setLoading(true, mode === 'create' ? '正在构思结构...' : '正在修改...');

            const systemPrompt = `你是一个 Draw.io (mxGraph) XML 生成专家。你的任务是根据用户的描述生成标准、合法的 mxGraph XML 代码。

**输出规则：**
1. 直接输出 XML 代码，**不要使用 markdown 代码块** (不要用 \`\`\`xml)。
2. XML 必须是 **未压缩 (Uncompressed)** 的格式。
3. 根节点必须是 \`<mxfile host="Electron" ...><diagram name="Page-1"><mxGraphModel ...> ... </mxGraphModel></diagram></mxfile>\`。
4. 确保所有标签正确闭合。
5. 使用标准的 mxGraph 样式（例如 rounded=1;whiteSpace=wrap;html=1;），可以使用不同颜色（fillColor）来美化图表。
6. 如果用户提到"流程图"，使用标准的流程图形状（矩形、菱形、圆角矩形）。
7. 确保节点位置（geometry x, y）合理分布，**不要重叠**。可以假设画布宽度为 800px，高度无限。尽量使用从上到下或从左到右的布局。

**示例结构：**
<mxfile host="Electron" modified="2023..." agent="..." version="...">
  <diagram id="..." name="Page-1">
    <mxGraphModel dx="1422" dy="794" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="827" pageHeight="1169" math="0" shadow="0">
      <root>
        <mxCell id="0" />
        <mxCell id="1" parent="0" />
        <mxCell id="2" value="Hello" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;" vertex="1" parent="1">
          <mxGeometry x="350" y="260" width="120" height="60" as="geometry" />
        </mxCell>
        ... 更多节点和连线 ...
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>
`;

            let messages = [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: mode === 'create' ? `请根据以下描述生成 Draw.io XML:\n${userPrompt}` : `这是当前的 XML:\n${originalXml}\n\n用户的修改要求是:\n${userPrompt}\n\n请输出修改后的完整 XML。` }
            ];

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({ model, messages, temperature: 0.2 }) // 低温以保证 XML 结构稳定
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                let content = data.choices[0].message.content.trim();

                // 清理可能存在的 markdown 标记
                content = content.replace(/^```xml\s*/i, '').replace(/^```\s*/, '').replace(/```$/, '');
                
                // 简单验证
                if (!content.includes('<mxfile') || !content.includes('</mxfile>')) {
                    throw new Error('AI 生成的 XML 结构不完整');
                }

                currentXml = content;
                renderGraph(currentXml);
                
                // 保存版本
                const summary = userPrompt.length > 20 ? userPrompt.substring(0, 20) + '...' : userPrompt;
                saveVersion(summary, currentXml);
                
                showToast(mode === 'create' ? '图表生成成功！' : '图表已更新！');
                
                // 启用操作面板
                actionPanel.classList.remove('opacity-50', 'pointer-events-none');
                
            } catch (error) {
                console.error(error);
                showToast('生成失败: ' + error.message);
            } finally {
                setLoading(false);
            }
        }

        // === 渲染 Graph ===
        function renderGraph(xml) {
            placeholder.style.display = 'none';
            graphContainer.innerHTML = ''; // 清空

            const div = document.createElement('div');
            div.className = 'mxgraph';
            div.style.maxWidth = '100%';
            div.style.border = '1px solid transparent';
            div.style.width = '100%';

            const config = {
                xml: xml,
                editable: false,
                highlight: '#ff9a9e',
                nav: true,
                resize: true,
                toolbar: 'pages zoom layers',
                edit: null
            };
            
            div.setAttribute('data-mxgraph', JSON.stringify(config));
            graphContainer.appendChild(div);

            try {
                GraphViewer.processElements();
                if (typeof GraphViewer.checkAndProcess == 'function') {
                    GraphViewer.checkAndProcess(); 
                }
            } catch (e) {
                console.error('Render error:', e);
                showToast('渲染 XML 时出错，可能是 XML 格式不兼容');
            }
        }

        // === 版本管理 ===
        function saveVersion(desc, xml) {
            const version = {
                id: Date.now(),
                xml: xml,
                desc: desc,
                time: new Date().toLocaleString()
            };
            versionHistory.push(version);
            currentVersionIndex = versionHistory.length - 1;
            updateHistoryUI();
            saveToLocal();
        }

        function updateHistoryUI() {
            if (versionHistory.length === 0) {
                versionList.innerHTML = '<p class="text-gray-400 text-center py-8">暂无历史版本</p>';
                return;
            }
            versionList.innerHTML = versionHistory.map((v, i) => `
                <div class="version-item ${i === currentVersionIndex ? 'active' : ''}" onclick="loadVersion(${i})">
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-medium text-gray-800 text-sm truncat flex-1">${v.desc}</span>
                        <span class="version-badge-tag ml-2">v${i + 1}</span>
                    </div>
                    <p class="text-xs text-gray-500">${v.time}</p>
                </div>
            `).reverse().join('');
        }

        function loadVersion(index) {
            currentVersionIndex = index;
            const v = versionHistory[index];
            currentXml = v.xml;
            renderGraph(currentXml);
            updateHistoryUI();
            historyPanel.classList.remove('open');
            settingsOverlay.classList.remove('open');
            actionPanel.classList.remove('opacity-50', 'pointer-events-none');
            showToast(`已恢复版本: v${index + 1}`);
        }
        
        function saveToLocal() {
            localStorage.setItem('drawio_history', JSON.stringify(versionHistory));
        }

        function loadFromLocal() {
            const saved = localStorage.getItem('drawio_history');
            if (saved) {
                versionHistory = JSON.parse(saved);
                updateHistoryUI();
                // 默认不自动加载最新，等待用户操作，或者为空
            }
        }

        // === 交互事件绑定 ===
        generateBtn.addEventListener('click', () => {
            const val = promptInput.value.trim();
            if (!val) { showToast('请先输入描述'); return; }
            generateDrawioXml(val, 'create');
        });

        // 聊天修改
        chatBtn.addEventListener('click', () => {
            chatModal.classList.add('open');
            chatInput.focus();
        });
        
        closeChatBtn.addEventListener('click', () => chatModal.classList.remove('open'));
        
        sendChatBtn.addEventListener('click', () => {
            const val = chatInput.value.trim();
            if (!val) return;
            
            // 添加用户消息
            const div = document.createElement('div');
            div.className = 'chat-message user';
            div.textContent = val;
            chatMessages.appendChild(div);
            
            // 调用 API
            generateDrawioXml(val, 'edit', currentXml).then(() => {
                 // 添加 AI 响应
                 const adiv = document.createElement('div');
                 adiv.className = 'chat-message assistant';
                 adiv.textContent = '修改已完成！';
                 chatMessages.appendChild(adiv);
                 chatMessages.scrollTop = chatMessages.scrollHeight;
            });
            
            chatInput.value = '';
            chatModal.classList.remove('open'); // 自动关闭以便查看结果
        });

        // 文件加载
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                currentXml = evt.target.result;
                renderGraph(currentXml);
                saveVersion(`加载文件: ${file.name}`, currentXml);
                actionPanel.classList.remove('opacity-50', 'pointer-events-none');
            };
            reader.readAsText(file);
        });

        // 下载
        downloadBtn.addEventListener('click', () => {
             const blob = new Blob([currentXml], { type: 'text/xml' });
             const url = URL.createObjectURL(blob);
             const a = document.createElement('a');
             a.href = url;
             a.download = `drawio_export_${Date.now()}.drawio`;
             a.click();
        });

        // 复制 XML
        copyXmlBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(currentXml).then(() => showToast('XML 已复制'));
        });

        // 历史与设置面板
        historyBtn.addEventListener('click', () => {
            historyPanel.classList.add('open');
            settingsOverlay.classList.add('open');
        });
        closeHistoryBtn.addEventListener('click', () => {
            historyPanel.classList.remove('open');
            settingsOverlay.classList.remove('open');
        });
        clearHistoryBtn.addEventListener('click', () => {
            if(confirm('清空所有历史？')) {
                versionHistory = [];
                currentXml = '';
                versionList.innerHTML = '';
                saveToLocal();
                location.reload(); 
            }
        });

        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.add('open');
            settingsOverlay.classList.add('open');
        });
        closeSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.remove('open');
            settingsOverlay.classList.remove('open');
        });
        saveSettingsBtn.addEventListener('click', () => {
            const key = document.getElementById('apiKey').value;
            if(key) {
                saveGlobalDeepSeekKey(key);
                settingsPanel.classList.remove('open');
                settingsOverlay.classList.remove('open');
                showToast('全局 API Key 已保存');
            } else {
                showToast('请输入 API Key');
            }
        });
        settingsOverlay.addEventListener('click', () => {
            historyPanel.classList.remove('open');
            settingsPanel.classList.remove('open');
            settingsOverlay.classList.remove('open');
        });

        // 初始化
        promptInput.addEventListener('input', (e) => {
            document.getElementById('charCount').textContent = `${e.target.value.length}/500`;
        });
        
        loadFromLocal();
        
        // 自动填入 Key，并给予提示
        const globalKey = getGlobalDeepSeekKey();
        if (globalKey) {
            document.getElementById('apiKey').value = globalKey;
            // 可以在界面上加个小点或者提示 key 已加载
            console.log('Global API Key loaded');
        }

    </script>
