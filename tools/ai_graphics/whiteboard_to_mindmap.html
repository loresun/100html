<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议白板转思维导图 - AI智能识别</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="min-h-screen p-4">
    <div x-data="mindmapApp()" x-init="init()" class="max-w-7xl mx-auto">
        <nav class="glass rounded-2xl shadow-2xl mb-6 p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                    <div class="p-2 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-xl">
                        <i class="fa-solid fa-code-branch text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-2xl text-slate-900">会议白板转思维导图</h1>
                        <p class="text-sm text-slate-500">AI识别 · Mermaid生成 · 可视化展示</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 px-3 py-2 bg-blue-50 rounded-lg border border-blue-200">
                        <i class="fa-solid fa-microchip text-blue-600"></i>
                        <span class="text-xs text-blue-600">当前:</span>
                        <span class="text-sm font-medium text-blue-900" x-text="getModelDisplayName()"></span>
                    </div>
                    <button @click="showSettings = true"
                        class="flex items-center gap-2 px-4 py-2 bg-blue-100 hover:bg-blue-200 rounded-lg transition">
                        <i class="fa-solid fa-gear text-blue-600"></i>
                        <span class="text-sm font-medium">模型配置</span>
                    </button>
                </div>
            </div>
        </nav>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="space-y-6">
                <div class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4">上传白板照片</h3>
                    <div @click="$refs.whiteboardInput.click()"
                        class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-blue-400 transition">
                        <div x-show="!whiteboardImage">
                            <i class="fa-solid fa-camera text-5xl mx-auto text-slate-400 mb-3"></i>
                            <p class="text-sm text-slate-600">点击上传白板照片</p>
                        </div>
                        <div x-show="whiteboardImage">
                            <img :src="whiteboardImage" class="max-h-64 mx-auto rounded-lg">
                        </div>
                    </div>
                    <input type="file" x-ref="whiteboardInput" @change="handleImageUpload($event)" accept="image/*"
                        class="hidden">
                </div>

                <button @click="analyze()" :disabled="isAnalyzing || !whiteboardImage"
                    class="w-full bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold py-4 rounded-xl disabled:opacity-50">
                    <span x-text="isAnalyzing ? '识别中...' : '开始识别'"></span>
                </button>

                <div x-show="mermaidCode" class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4">Mermaid代码</h3>
                    <p class="text-xs text-slate-500 mb-2">你可以手动编辑代码，然后点击"重新渲染"查看效果</p>
                    <textarea x-model="mermaidCode" rows="10"
                        class="w-full p-3 border rounded-lg font-mono text-sm"></textarea>
                    <div class="flex gap-2 mt-4 flex-wrap">
                        <button @click="renderMermaid()"
                            class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">重新渲染</button>
                        <button @click="copyCode()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">复制代码</button>
                        <button @click="downloadSVG()"
                            class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">导出SVG</button>
                    </div>
                </div>
            </div>

            <div class="glass rounded-2xl shadow-xl p-6">
                <h3 class="font-bold text-lg mb-4">思维导图预览</h3>
                <div x-show="!mermaidCode" class="flex flex-col items-center justify-center py-20 text-slate-400">
                    <i class="fa-solid fa-code-branch text-7xl mb-4 opacity-50"></i>
                    <p>上传白板照片后开始识别</p>
                </div>
                <div x-show="mermaidCode" id="mermaidPreview" class="p-4 bg-white rounded-lg overflow-auto"></div>
            </div>
        </div>

        <div x-show="showSettings" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div @click.away="showSettings = false" class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6">
                <h3 class="text-xl font-bold mb-6">视觉模型配置</h3>
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">选择模型</label>
                        <select x-model="apiConfig.vision_model" class="w-full rounded-lg border p-3">
                            <option value="glm4v">智谱 GLM-4V-Flash（推荐 - 免费）</option>
                            <option value="doubao-vision">豆包视觉</option>
                        </select>
                    </div>
                    <!-- 智谱GLM-4V配置 -->
                    <div x-show="apiConfig.vision_model === 'glm4v'">
                        <label class="block text-sm font-medium mb-2">智谱 API Key</label>
                        <input type="password" x-model="apiConfig.glm4v_key" placeholder="请输入智谱API Key"
                            class="w-full rounded-lg border p-3">
                        <p class="text-xs text-slate-400 mt-1">用于调用GLM-4V-Flash视觉模型（免费额度充足）</p>
                    </div>
                    <!-- 豆包视觉配置 -->
                    <div x-show="apiConfig.vision_model === 'doubao-vision'">
                        <label class="block text-sm font-medium mb-2">豆包视觉 API Key</label>
                        <input type="password" x-model="apiConfig.doubao_vision_key" placeholder="请输入火山引擎API Key"
                            class="w-full rounded-lg border p-3">
                        <p class="text-xs text-slate-400 mt-1">用于调用豆包视觉大模型（火山引擎）</p>
                        <label class="block text-sm font-medium mb-2 mt-3">豆包视觉 Endpoint ID</label>
                        <input type="text" x-model="apiConfig.doubao_vision_endpoint" placeholder="请输入Endpoint ID"
                            class="w-full rounded-lg border p-3">
                        <p class="text-xs text-slate-400 mt-1">需要在火山引擎控制台创建推理接入点获取</p>
                    </div>
                </div>
                <div class="flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-6 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig()"
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        function mindmapApp() {
            return {
                showSettings: false,
                isAnalyzing: false,
                whiteboardImage: null,
                whiteboardImageBase64: null,
                mermaidCode: '',
                apiConfig: { vision_model: 'glm4v', glm4v_key: '', doubao_vision_key: '', doubao_vision_endpoint: '' },

                init() {
                    this.loadConfig();
                    // 初始化图标已由 Font Awesome 自动处理
                },

                loadConfig() {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
                        } catch (e) {
                            console.error('解析 global_llm_config 失败:', e);
                        }
                    }
                },

                saveConfig() {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('解析 global_llm_config 失败:', e);
                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...this.apiConfig }));
                    this.showSettings = false;
                },

                getModelDisplayName() {
                    const names = {
                        'glm4v': 'GLM-4V-Flash',
                        'doubao-vision': '豆包视觉'
                    };
                    return names[this.apiConfig.vision_model] || this.apiConfig.vision_model;
                },

                handleImageUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.whiteboardImage = e.target.result;
                            this.whiteboardImageBase64 = e.target.result.split(',')[1];
                        };
                        reader.readAsDataURL(file);
                    }
                },

                // 验证API配置
                validateConfig() {
                    if (this.apiConfig.vision_model === 'glm4v') {
                        if (!this.apiConfig.glm4v_key) {
                            this.showSettings = true;
                            alert('请先配置智谱 API Key');
                            return false;
                        }
                    } else if (this.apiConfig.vision_model === 'doubao-vision') {
                        if (!this.apiConfig.doubao_vision_key) {
                            this.showSettings = true;
                            alert('请先配置豆包视觉 API Key');
                            return false;
                        }
                        if (!this.apiConfig.doubao_vision_endpoint) {
                            this.showSettings = true;
                            alert('请先配置豆包视觉 Endpoint ID');
                            return false;
                        }
                    }
                    return true;
                },

                // 调用智谱GLM-4V视觉模型
                async callGLM4V(prompt) {
                    const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiConfig.glm4v_key}`
                        },
                        body: JSON.stringify({
                            model: 'glm-4v-flash',
                            messages: [{
                                role: 'user',
                                content: [
                                    { type: 'text', text: prompt },
                                    { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${this.whiteboardImageBase64}` } }
                                ]
                            }]
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(`GLM-4V API错误: ${error.error?.message || response.status}`);
                    }

                    const data = await response.json();
                    return data.choices[0].message.content;
                },

                // 调用豆包视觉大模型（火山引擎）
                async callDoubaoVision(prompt) {
                    const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiConfig.doubao_vision_key}`
                        },
                        body: JSON.stringify({
                            model: this.apiConfig.doubao_vision_endpoint,
                            messages: [{
                                role: 'user',
                                content: [
                                    { type: 'text', text: prompt },
                                    { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${this.whiteboardImageBase64}` } }
                                ]
                            }]
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(`豆包视觉API错误: ${error.error?.message || response.status}`);
                    }

                    const data = await response.json();
                    return data.choices[0].message.content;
                },

                async analyze() {
                    if (!this.validateConfig()) {
                        return;
                    }

                    this.isAnalyzing = true;
                    try {
                        // 改进的 prompt，更明确强调使用 mindmap 缩进语法
                        const prompt = `请识别这张白板照片中的手写内容，提取关键信息和层级关系。
然后生成 Mermaid 思维导图代码。

【重要】必须使用 mindmap 语法格式，通过缩进表示层级关系。
【禁止】不要使用 graph、flowchart 或箭头语法（如 A --> B）。

正确的 mindmap 格式示例：
mindmap
  root((人工智能))
    机器学习
      监督学习
      无监督学习
    深度学习
      神经网络
      CNN
    自然语言处理
      文本分类
      机器翻译

注意事项：
1. 第一行必须是 mindmap
2. 使用空格缩进表示层级关系（每级2个空格）
3. 根节点使用 root((标题)) 格式
4. 子节点直接写文字，不需要特殊符号
5. 只返回 Mermaid 代码，不要包含任何说明文字`;

                        let content;
                        if (this.apiConfig.vision_model === 'glm4v') {
                            content = await this.callGLM4V(prompt);
                        } else if (this.apiConfig.vision_model === 'doubao-vision') {
                            content = await this.callDoubaoVision(prompt);
                        } else {
                            throw new Error('未知的视觉模型');
                        }

                        // 清理代码，移除 markdown 代码块标记
                        let code = content.replace(/```mermaid|```/g, '').trim();

                        // 验证和修正 Mermaid 代码格式
                        code = this.validateAndFixMermaidCode(code);

                        this.mermaidCode = code;

                        await this.$nextTick();
                        await this.renderMermaid();
                    } catch (error) {
                        alert('识别失败: ' + error.message);
                    } finally {
                        this.isAnalyzing = false;
                    }
                },

                /**
                 * 验证并修正 Mermaid 代码格式
                 * 检测是否使用了错误的 graph 语法，并尝试转换为 mindmap 格式
                 * @param {string} code - 原始 Mermaid 代码
                 * @returns {string} - 修正后的代码
                 */
                validateAndFixMermaidCode(code) {
                    // 如果代码已经是正确的 mindmap 格式，直接返回
                    if (code.startsWith('mindmap')) {
                        // 移除可能存在的箭头语法（有些 AI 会混用）
                        if (!code.includes('-->') && !code.includes('---')) {
                            return code;
                        }
                    }

                    // 检测是否使用了 graph/flowchart 语法
                    const isGraphSyntax = code.includes('-->') ||
                        code.includes('---') ||
                        code.startsWith('graph') ||
                        code.startsWith('flowchart');

                    if (isGraphSyntax) {
                        console.log('检测到 graph 语法，尝试转换为 mindmap 格式...');
                        return this.convertGraphToMindmap(code);
                    }

                    // 如果不是 mindmap 开头，尝试添加
                    if (!code.startsWith('mindmap')) {
                        return 'mindmap\n  root((主题))\n    ' + code.split('\n').join('\n    ');
                    }

                    return code;
                },

                /**
                 * 将 graph 语法转换为 mindmap 语法
                 * 解析节点关系，构建树形结构
                 * @param {string} graphCode - graph 格式的代码
                 * @returns {string} - mindmap 格式的代码
                 */
                convertGraphToMindmap(graphCode) {
                    // 解析所有节点定义和关系
                    const nodes = new Map(); // 节点ID -> 节点文本
                    const children = new Map(); // 父节点ID -> [子节点ID]
                    const parents = new Map(); // 节点ID -> 父节点ID

                    // 匹配节点关系: A --> B 或 A --> B[文本]
                    const relationRegex = /([A-Za-z0-9_]+)\s*-->?\s*([A-Za-z0-9_]+)(?:\[([^\]]+)\])?/g;
                    // 匹配独立节点定义: A[文本]
                    const nodeDefRegex = /([A-Za-z0-9_]+)\[([^\]]+)\]/g;

                    // 首先提取所有节点定义
                    let match;
                    while ((match = nodeDefRegex.exec(graphCode)) !== null) {
                        const [, id, text] = match;
                        nodes.set(id, text);
                    }

                    // 解析关系
                    while ((match = relationRegex.exec(graphCode)) !== null) {
                        const [, parentId, childId, childText] = match;

                        // 记录节点文本
                        if (!nodes.has(parentId)) nodes.set(parentId, parentId);
                        if (childText) {
                            nodes.set(childId, childText);
                        } else if (!nodes.has(childId)) {
                            nodes.set(childId, childId);
                        }

                        // 记录父子关系
                        if (!children.has(parentId)) children.set(parentId, []);
                        children.get(parentId).push(childId);
                        parents.set(childId, parentId);
                    }

                    // 找到根节点（没有父节点的节点）
                    let rootId = null;
                    for (const id of nodes.keys()) {
                        if (!parents.has(id)) {
                            rootId = id;
                            break;
                        }
                    }

                    if (!rootId && nodes.size > 0) {
                        rootId = nodes.keys().next().value;
                    }

                    if (!rootId) {
                        // 如果无法解析，返回默认结构
                        return 'mindmap\n  root((无法解析内容))\n    请重新识别';
                    }

                    // 递归构建 mindmap 代码
                    const buildMindmap = (nodeId, depth) => {
                        const indent = '  '.repeat(depth);
                        const nodeText = nodes.get(nodeId) || nodeId;
                        let result = '';

                        if (depth === 1) {
                            // 根节点使用 root(()) 格式
                            result = `${indent}root((${nodeText}))\n`;
                        } else {
                            result = `${indent}${nodeText}\n`;
                        }

                        // 添加子节点
                        const childIds = children.get(nodeId) || [];
                        for (const childId of childIds) {
                            result += buildMindmap(childId, depth + 1);
                        }

                        return result;
                    };

                    return 'mindmap\n' + buildMindmap(rootId, 1);
                },

                /**
                 * 渲染 Mermaid 思维导图
                 * Mermaid 10.6.1 API: mermaid.render() 返回 { svg, bindFunctions }
                 */
                async renderMermaid() {
                    const element = document.getElementById('mermaidPreview');
                    element.innerHTML = '';

                    try {
                        // 生成唯一的 ID 避免冲突
                        const id = 'mermaidSVG_' + Date.now();
                        const { svg, bindFunctions } = await mermaid.render(id, this.mermaidCode);
                        
                        // 渲染 SVG
                        element.innerHTML = svg;
                        
                        // 绑定事件（如果需要）
                        if (bindFunctions) {
                            bindFunctions(element);
                        }
                    } catch (error) {
                        console.error('Mermaid 渲染错误:', error);

                        // 显示错误信息和代码，方便调试
                        element.innerHTML = `
                            <div class="text-red-500 p-4">
                                <div class="flex items-center gap-2 mb-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                    <span class="font-bold">Mermaid 语法错误</span>
                                </div>
                                <p class="text-sm mb-2">请检查 Mermaid 代码语法是否正确：</p>
                                <ul class="text-sm list-disc list-inside mb-3">
                                    <li>第一行必须是 <code>mindmap</code></li>
                                    <li>使用空格缩进表示层级（每级2个空格）</li>
                                    <li>根节点格式：<code>root((标题))</code></li>
                                    <li>子节点直接写文字，不需要特殊符号</li>
                                </ul>
                                <details class="text-xs">
                                    <summary class="cursor-pointer text-slate-500">查看错误详情</summary>
                                    <pre class="mt-2 p-2 bg-red-50 rounded overflow-auto">${error.message || error}</pre>
                                </details>
                            </div>
                        `;
                    }
                },

                copyCode() {
                    navigator.clipboard.writeText(this.mermaidCode);
                    alert('已复制到剪贴板');
                },

                async downloadSVG() {
                    const svg = document.getElementById('mermaidPreview').innerHTML;
                    const blob = new Blob([svg], { type: 'image/svg+xml' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `mindmap_${Date.now()}.svg`;
                    a.click();
                    URL.revokeObjectURL(url);
                }
            }
        }
    </script>
