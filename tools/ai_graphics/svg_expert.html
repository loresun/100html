    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11"></script>
    <style>
        /* 基础样式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d0d1a 100%);
            min-height: 100vh;
        }

        /* SVG 预览区域样式 */
        .svg-preview {
            background: repeating-conic-gradient(#1e1e2e 0% 25%, #2a2a3e 0% 50%) 50% / 20px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .svg-preview svg {
            max-width: 100%;
            max-height: 100%;
        }

        /* 代码高亮自定义 */
        .code-block {
            background: #1e1e2e;
            border-radius: 12px;
            overflow: hidden;
        }

        .code-block pre {
            margin: 0;
            padding: 1rem;
            overflow-x: auto;
        }

        .code-block code {
            font-family: 'Fira Code', 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.5);
        }

        /* 渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 玻璃态卡片 */
        .glass-card {
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        /* 输入框样式 */
        .input-area {
            background: rgba(15, 15, 35, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.3);
            transition: all 0.3s ease;
        }

        .input-area:focus {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
            outline: none;
        }

        /* 按钮发光效果 */
        .glow-button {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
        }

        .glow-button:hover:not(:disabled) {
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.6);
            transform: translateY(-2px);
        }

        .glow-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Markdown 内容样式 */
        .prose-dark {
            color: #e2e8f0;
        }

        .prose-dark h1,
        .prose-dark h2,
        .prose-dark h3 {
            color: #f1f5f9;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .prose-dark p {
            margin-bottom: 1rem;
            line-height: 1.75;
        }

        .prose-dark ul,
        .prose-dark ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .prose-dark li {
            margin-bottom: 0.5rem;
        }

        .prose-dark code {
            background: rgba(139, 92, 246, 0.2);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .prose-dark pre code {
            background: transparent;
            padding: 0;
        }

        .prose-dark blockquote {
            border-left: 3px solid #8b5cf6;
            padding-left: 1rem;
            color: #94a3b8;
            font-style: italic;
        }

        /* 标签页样式 */
        .tab-button {
            transition: all 0.2s ease;
        }

        .tab-button.active {
            background: rgba(139, 92, 246, 0.3);
            color: #a855f7;
        }

        /* 加载动画 */
        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 5px rgba(139, 92, 246, 0.5);
            }

            50% {
                box-shadow: 0 0 20px rgba(139, 92, 246, 0.8);
            }
        }

        .loading-glow {
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        /* 示例卡片悬停效果 */
        .example-card {
            transition: all 0.3s ease;
        }

        .example-card:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.2);
        }
    </style>

<body class="text-slate-200">
    <div x-data="svgExpert" class="min-h-screen flex flex-col">

        <!-- ==================== 导航栏 ==================== -->

            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

                    <div>

                    </div>

                    <!-- 设置按钮 -->
                    <button @click="showSettings = true"

        <!-- ==================== 主内容区 ==================== -->
        <main class="flex-grow flex">
            <!-- 左侧面板：输入区 -->
            <div class="w-[420px] flex-shrink-0 border-r border-purple-500/20 flex flex-col h-[calc(100vh-64px)]">
                <!-- 输入区域 -->
                <div class="p-4 flex-grow flex flex-col">
                    <i class="fa-solid fa-comment text-purple-400"></i>
                    描述你想要的 SVG 或提问知识点
                    </h3>

                    <!-- 输入框 -->
                    <textarea x-model="input.prompt" @keydown.meta.enter="generate()" @keydown.ctrl.enter="generate()"
                        class="input-area w-full flex-grow rounded-xl p-4 text-slate-200 resize-none placeholder-slate-500"

                    <!-- 生成按钮 -->
                    <button @click="generate()" :disabled="isGenerating || !input.prompt.trim()"
                        class="glow-button mt-4 w-full py-3 rounded-xl font-medium text-white flex items-center justify-center gap-2">
                        <template x-if="!isGenerating">
                            <span class="flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                                生成 SVG / 回答
                            </span>
                        </template>
                        <template x-if="isGenerating">
                            <span class="flex items-center gap-2">
                                <i class="fa-solid fa-spinner fa-spin"></i>
                                AI 思考中...

                    </button>

                    <!-- 快捷键提示 -->
                    <p class="text-xs text-slate-500 text-center mt-2">
                        按 <kbd class="px-1.5 py-0.5 bg-slate-800 rounded text-slate-400">⌘</kbd> + <kbd
                            class="px-1.5 py-0.5 bg-slate-800 rounded text-slate-400">Enter</kbd> 快速生成
                    </p>
                </div>

                <!-- 示例卡片 -->
                <div class="p-4 border-t border-purple-500/20">
                    <h4 class="text-xs font-medium text-slate-400 mb-3">✨ 快速示例</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="example in examples" :key="example.title">
                            <button @click="input.prompt = example.prompt"
                                class="example-card text-left p-3 rounded-lg bg-slate-800/30 border border-slate-700/50 hover:bg-slate-800/50">
                                <div class="text-lg mb-1" x-text="example.icon"></div>
                                <div class="text-xs font-medium text-slate-300" x-text="example.title"></div>
                            </button>
                        </template>
                    </div>
                </div>
            </div>

            <!-- 右侧面板：结果展示 -->
            <div class="flex-grow flex flex-col h-[calc(100vh-64px)] overflow-hidden">
                <!-- 标签页切换 -->
                <div class="flex items-center justify-between px-6 py-3 border-b border-purple-500/20 bg-slate-900/30">
                    <div class="flex gap-2">
                        <button @click="activeTab = 'preview'"
                            :class="activeTab === 'preview' ? 'text-purple-400 bg-purple-500/10' : 'text-slate-400 hover:text-slate-300'"

                            预览
                        </button>
                        <button @click="activeTab = 'code'"
                            :class="activeTab === 'code' ? 'text-purple-400 bg-purple-500/10' : 'text-slate-400 hover:text-slate-300'"

                            <i class="fa-solid fa-code"></i>

                        </button>

                            :class="activeTab === 'explanation' ? 'text-purple-400 bg-purple-500/10' : 'text-slate-400 hover:text-slate-300'"

                            导出 PNG

                            class="text-xs text-purple-400 hover:text-purple-300 flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-purple-500/10 transition-colors">
                            <i class="fa-solid fa-file-image"></i>
                            导出 SVG
                        </button>
                    </div>
                </div>

                <!-- 内容区域 -->
                <div class="flex-grow overflow-auto p-6">
                    <!-- 空状态 -->
                    <template x-if="!result.svgCode && !result.explanation && !isGenerating">
                        <div
                            class="w-24 h-24 rounded-2xl bg-gradient-to-br from-purple-500/20 to-indigo-600/20 flex items-center justify-center mb-6 text-purple-400">
                            <i class="fa-solid fa-pen-nib text-5xl"></i>

                </div>

                <!-- 加载状态 -->
                <template x-if="isGenerating">
                    <div
                        class="w-24 h-24 rounded-2xl bg-gradient-to-br from-purple-500/20 to-indigo-600/20 flex items-center justify-center mb-6 loading-glow text-purple-400">
                        <i class="fa-solid fa-spinner fa-spin text-5xl"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-slate-300 mb-2">AI 正在创作...</h3>
                    <p class="text-slate-500">
                        <span x-text="streamingText || '正在分析你的需求...'"></span>
                    </p>
            </div>
            </template>

            <!-- 预览标签页 -->
            <div x-show="activeTab === 'preview' && result.svgCode && !isGenerating" class="h-full">

                <template x-if="result.reasoning">
                    <i class="fa-solid fa-brain"></i>
                    <span class="font-medium">查看 AI 深度思考过程</span>
                    </summary>
                    <div class="px-4 py-3 border-t border-purple-500/20 text-sm text-slate-400 whitespace-pre-wrap"
                        x-text="result.reasoning"></div>
                    </details>
                </template>

                <div x-html="renderMarkdown(result.explanation)"></div>
            </div>
    </div>
    </div>
    </main>

        x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"

        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        @click.self="showSettings = false">

        <div x-show="showSettings" x-transition:enter="transition ease-out duration-300"

            x-transition:leave-end="opacity-0 scale-95" class="glass-card rounded-2xl w-full max-w-md p-6">

            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-gear text-purple-400"></i>

                </h3>
                <button @click="showSettings = false"

            </div>

        <i :class="toast.icon === 'fa-check' ? 'text-green-400' : toast.icon === 'fa-triangle-exclamation' ? 'text-yellow-400' : 'text-red-400'"

        <span class="text-slate-200" x-text="toast.message"></span>

    <script>
        /**
         * SVG 绘制专家 - Alpine.js 组件
         * 功能：AI 生成 SVG、实时渲染、导出 PNG/SVG、知识点讲解
         */
        document.addEventListener('alpine:init', () => {
            Alpine.data('svgExpert', () => ({
                // ==================== 状态管理 ====================
                showSettings: false,          // 设置弹窗显示状态
                isGenerating: false,          // 是否正在生成
                activeTab: 'preview',         // 当前激活的标签页
                streamingText: '',            // 流式输出提示文字
                exportSize: '2',              // PNG 导出倍数

                // API 配置
                apiConfig: {
                    deepseek: '',
                    model: 'deepseek-v4-flash'
                },

                // 用户输入
                input: {
                    prompt: ''
                },

                // 生成结果
                result: {
                    svgCode: '',        // SVG 代码
                    explanation: '',    // 讲解内容
                    reasoning: ''       // V4 Pro 模型的思考过程
                },

                // Toast 通知
                toast: {
                    show: false,
                    message: '',
                    icon: 'fa-check'
                },

                // 快速示例
                examples: [
                    { icon: '🌈', title: '渐变图标', prompt: '创建一个带有紫色到蓝色渐变的圆形图标，中间有一个闪电符号' },
                    { icon: '⏳', title: '加载动画', prompt: '设计一个简约的环形加载动画 SVG，带有旋转效果' },
                    { icon: '📊', title: '图表元素', prompt: '画一个简单的柱状图 SVG，包含3-4个不同高度的柱子' },
                    { icon: '❓', title: 'viewBox 详解', prompt: '详细讲解 SVG 中 viewBox 属性的作用和用法，并给出示例' },
                    { icon: '🎨', title: 'path 曲线', prompt: '讲解如何使用 SVG path 元素绘制贝塞尔曲线，包含二次和三次曲线的示例' },
                    { icon: '✨', title: '滤镜效果', prompt: '介绍 SVG 滤镜（filter）的用法，创建一个发光效果的示例' }
                ],

                // ==================== 生命周期 ====================
                /**
                 * 组件初始化
                 */
                init() {
                    this.loadConfig();
                    // 初始化图标已由 Font Awesome 自动处理

                    // 配置 marked.js
                    marked.setOptions({
                        highlight: function (code, lang) {
                            if (lang && hljs.getLanguage(lang)) {
                                return hljs.highlight(code, { language: lang }).value;
                            }
                            return hljs.highlightAuto(code).value;
                        },
                        breaks: true
                    });
                },

                // ==================== 配置管理 ====================
                /**
                 * 从 localStorage 加载配置
                 */
                loadConfig() {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            this.apiConfig = { ...this.apiConfig, ...config };
                        } catch (e) {
                            console.error('解析 global_llm_config 失败:', e);
                        }
                    }

                    // 加载导出尺寸设置
                    const exportSize = localStorage.getItem('svg_expert_export_size');
                    if (exportSize) {
                        this.exportSize = exportSize;
                    }
                },

                /**
                 * 保存配置到 localStorage
                 */
                saveConfig() {
                    // 合并保存 API 配置
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('解析 global_llm_config 失败:', e);
                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...current,
                        ...this.apiConfig
                    }));

                    // 保存导出尺寸
                    localStorage.setItem('svg_expert_export_size', this.exportSize);

                    this.showToast('配置已保存', 'fa-check');
                    this.showSettings = false;
                },

                // ==================== 核心功能 ====================
                /**
                 * 生成 SVG 或回答问题
                 */
                async generate() {
                    // 检查 API Key
                    if (!this.apiConfig.deepseek) {
                        this.showToast('请先配置 DeepSeek API Key', 'fa-triangle-exclamation');
                        this.showSettings = true;
                        return;
                    }

                    // 检查输入
                    if (!this.input.prompt.trim()) {
                        this.showToast('请输入内容', 'fa-triangle-exclamation');
                        return;
                    }

                    this.isGenerating = true;
                    this.streamingText = '正在分析需求...';
                    this.result = { svgCode: '', explanation: '', reasoning: '' };

                    try {
                        // 构建系统提示词
                        const systemPrompt = `你是一位专业的 SVG 绘制专家和教育者。你的任务是：

1. **绘制 SVG**：当用户描述想要的图形时，生成高质量的 SVG 代码
2. **讲解知识**：当用户提问 SVG 相关知识时，详细讲解并提供示例

## 输出格式要求

请严格按以下 JSON 格式输出：

\`\`\`json
{
  "svgCode": "完整的 SVG 代码（如果需要绘制的话）",
  "explanation": "Markdown 格式的讲解内容"
}
\`\`\`

## SVG 代码规范

1. 必须包含完整的 <svg> 标签，包括 xmlns、viewBox 等属性
2. 使用合理的 viewBox 尺寸（通常 100x100 或 200x200）
3. 代码要简洁、语义化、易于理解
4. 优先使用 currentColor 以便用户自定义颜色
5. 如果涉及动画，使用 CSS animation 或 SMIL

## 讲解内容规范

1. 使用 Markdown 格式
2. 结构清晰，包含标题、要点、代码示例
3. 用简单易懂的语言解释复杂概念
4. 提供实际可用的代码示例

即使用户只是提问知识点，如果能用示例说明，也请提供相关的 SVG 代码。`;

                        // 调用 API（流式）
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: this.input.prompt }
                                ],
                                stream: true,
                                response_format: { type: 'json_object' }
                            })
                        });

                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.error?.message || '请求失败');
                        }

                        // 处理流式响应
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let fullContent = '';
                        let reasoningContent = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n').filter(line => line.startsWith('data: '));

                            for (const line of lines) {
                                if (line === 'data: [DONE]') continue;

                                try {
                                    const data = JSON.parse(line.slice(6));
                                    const delta = data.choices[0]?.delta;

                                    // 处理推理内容（V4 Pro 模型）
                                    if (delta?.reasoning_content) {
                                        reasoningContent += delta.reasoning_content;
                                        this.streamingText = 'AI 正在深度思考...';
                                    }

                                    // 处理正常内容
                                    if (delta?.content) {
                                        fullContent += delta.content;
                                        this.streamingText = '正在生成内容...';
                                    }
                                } catch (e) {
                                    // 忽略解析错误
                                }
                            }
                        }

                        // 解析 JSON 结果
                        try {
                            const parsed = JSON.parse(fullContent);
                            this.result.svgCode = parsed.svgCode || '';
                            this.result.explanation = parsed.explanation || '';
                            this.result.reasoning = reasoningContent;

                            // 自动切换到合适的标签页
                            if (this.result.svgCode) {
                                this.activeTab = 'preview';
                            } else if (this.result.explanation) {
                                this.activeTab = 'explanation';
                            }

                            this.showToast('生成完成！', 'fa-check');
                        } catch (parseError) {
                            console.error('JSON 解析失败:', parseError);
                            // 尝试直接显示内容
                            this.result.explanation = fullContent;
                            this.activeTab = 'explanation';
                        }

                    } catch (error) {
                        console.error('生成失败:', error);
                        this.showToast('生成失败: ' + error.message, 'fa-circle-xmark');
                    } finally {
                        this.isGenerating = false;
                        this.streamingText = '';
                        // 刷新图标已不再需要，由 Font Awesome 处理

                        // 代码高亮
                        setTimeout(() => {
                            document.querySelectorAll('pre code').forEach((block) => {
                                if (window.hljs) {
                                    window.hljs.highlightElement(block);
                                }
                            });
                        }, 0);
                    }
                },

                // ==================== 导出功能 ====================
                /**
                 * 导出为 PNG 图片
                 */
                async exportPNG() {
                    if (!this.result.svgCode) {
                        this.showToast('没有可导出的 SVG', 'fa-triangle-exclamation');
                        return;
                    }

                    try {
                        const svgElement = this.$refs.svgPreview.querySelector('svg');
                        if (!svgElement) {
                            throw new Error('未找到 SVG 元素');
                        }

                        // 获取 SVG 尺寸
                        const bbox = svgElement.getBoundingClientRect();
                        const scale = parseInt(this.exportSize);
                        const width = bbox.width * scale;
                        const height = bbox.height * scale;

                        // 创建 Canvas
                        const canvas = document.getElementById('exportCanvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');

                        // 填充白色背景
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, width, height);

                        // 将 SVG 转换为 Data URL
                        const svgData = new XMLSerializer().serializeToString(svgElement);
                        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                        const svgUrl = URL.createObjectURL(svgBlob);

                        // 加载图片并绘制到 Canvas
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, width, height);
                            URL.revokeObjectURL(svgUrl);

                            // 下载 PNG
                            const pngUrl = canvas.toDataURL('image/png');
                            const link = document.createElement('a');
                            link.download = `svg-export-${Date.now()}.png`;
                            link.href = pngUrl;
                            link.click();

                            this.showToast('PNG 导出成功！', 'fa-check');
                        };

                        img.onerror = () => {
                            throw new Error('图片加载失败');
                        };

                        img.src = svgUrl;

                    } catch (error) {
                        console.error('PNG 导出失败:', error);
                        this.showToast('PNG 导出失败: ' + error.message, 'fa-circle-xmark');
                    }
                },

                /**
                 * 导出为 SVG 文件
                 */
                exportSVG() {
                    if (!this.result.svgCode) {
                        this.showToast('没有可导出的 SVG', 'fa-triangle-exclamation');
                        return;
                    }

                    try {
                        const blob = new Blob([this.result.svgCode], { type: 'image/svg+xml' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.download = `svg-export-${Date.now()}.svg`;
                        link.href = url;
                        link.click();
                        URL.revokeObjectURL(url);
                        this.showToast('SVG 导出成功！', 'fa-check');
                    } catch (error) {
                        console.error('SVG 导出失败:', error);
                        this.showToast('SVG 导出失败', 'fa-circle-xmark');
                    }
                },

                /**
                 * 复制 SVG 代码到剪贴板
                 */
                async copyCode() {
                    const textToCopy = this.result.svgCode || this.result.explanation;
                    if (!textToCopy) {
                        this.showToast('没有可复制的内容', 'fa-triangle-exclamation');
                        return;
                    }

                    try {
                        await navigator.clipboard.writeText(textToCopy);
                        this.showToast('已复制到剪贴板', 'fa-check');
                    } catch (e) {
                        // 降级方案
                        const textarea = document.createElement('textarea');
                        textarea.value = textToCopy;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        this.showToast('已复制到剪贴板', 'fa-check');
                    }
                },

                // ==================== 工具函数 ====================
                /**
                 * 渲染 Markdown 内容
                 */
                renderMarkdown(content) {
                    if (!content) return '';
                    return marked.parse(content);
                },

                /**
                 * 显示 Toast 通知
                 */
                showToast(message, icon = 'fa-check') {
                    this.toast = { show: true, message, icon };
                    // Font Awesome icons are automatically rendered, no refresh needed
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                /**
                 * 刷新 Lucide 图标
                 */
                // 刷新图标已由 Font Awesome 自动处理
                refreshIcons() {
                    // No action needed for Font Awesome
                }
            }));
        });
    </script>
