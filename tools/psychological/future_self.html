<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来自我对话 - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .future-gradient {
            background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 50%, #DDD6FE 100%);
        }

        .future-card {
            background: linear-gradient(135deg, #ffffff 0%, #FAF5FF 100%);
            border: 2px solid #A78BFA;
        }

        @keyframes glow {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .glow-animation {
            animation: glow 2s ease-in-out infinite;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="future-gradient min-h-screen">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b-2 border-purple-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                        <div
                            class="w-10 h-10 bg-gradient-to-br from-purple-400 to-violet-500 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-clock text-white h-5 w-5"></i>
                        </div>
                        <span class="font-bold text-xl text-slate-900">未来自我对话</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 bg-purple-100 rounded-lg p-1">
                            <button @click="apiConfig.model = 'deepseek-v4-flash'"
                                :class="{'bg-white shadow text-purple-600': apiConfig.model === 'deepseek-v4-flash'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="apiConfig.model = 'deepseek-v4-pro'"
                                :class="{'bg-white shadow text-purple-600': apiConfig.model === 'deepseek-v4-pro'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true" class="text-purple-600 hover:text-purple-700 transition"><i
                                class="fa-solid fa-gear h-4 w-4"></i></button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow max-w-6xl mx-auto w-full p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div class="future-card rounded-2xl p-6 shadow-lg">
                    <h2 class="text-lg font-bold mb-4">时间设置</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">对话的未来自我</label>
                            <select v-model="input.timespan"
                                class="w-full bg-white border-2 border-purple-200 rounded-lg p-3">
                                <option value="5年后">5年后的我</option>
                                <option value="10年后">10年后的我</option>
                                <option value="20年后">20年后的我</option>
                                <option value="临终">人生最后一刻的我</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">当前困境或问题</label>
                            <textarea v-model="input.question" placeholder="例如：要不要换工作？该不该结婚？如何平衡事业和家庭？..." rows="3"
                                class="w-full bg-white border-2 border-purple-200 rounded-lg p-3"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">你的核心价值观（可选）</label>
                            <input v-model="input.values" placeholder="例如：自由、成长、家庭、创造..."
                                class="w-full bg-white border-2 border-purple-200 rounded-lg p-3">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">对话风格</label>
                            <select v-model="input.tone"
                                class="w-full bg-white border-2 border-purple-200 rounded-lg p-3">
                                <option value="温柔智慧">温柔智慧</option>
                                <option value="直率真诚">直率真诚</option>
                                <option value="幽默轻松">幽默轻松</option>
                                <option value="深刻哲思">深刻哲思</option>
                            </select>
                        </div>
                    </div>
                    <button @click="startDialogue" :disabled="isGenerating || !input.question"
                        class="w-full mt-4 bg-gradient-to-r from-purple-500 to-violet-500 text-white font-bold py-3 rounded-xl hover:shadow-lg transition disabled:opacity-50">
                        <i class="fa-solid fa-comment-dots w-5 h-5 inline mr-2"></i>开始对话
                    </button>
                </div>
            </div>

            <div class="future-card rounded-2xl p-6 shadow-lg min-h-[500px]">
                <div v-if="isGenerating" class="flex flex-col items-center justify-center h-full text-purple-600">
                    <i class="fa-solid fa-clock w-16 h-16 mb-4 glow-animation"></i>
                    <p class="text-lg font-medium">正在连接未来自我...</p>
                </div>
                <div v-else-if="!dialogue" class="flex flex-col items-center justify-center h-full text-slate-400">
                    <i class="fa-solid fa-wand-magic-sparkles w-16 h-16 mb-4 opacity-50"></i>
                    <p>向未来的自己寻求智慧</p>
                </div>
                <div v-else class="space-y-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-purple-800">来自{{ input.timespan }}的信</h3>
                        <button @click="copyDialogue" class="text-sm text-purple-600 hover:text-purple-700">
                            <i class="fa-solid fa-copy w-4 h-4 inline mr-1"></i>复制
                        </button>
                    </div>
                    <div class="bg-purple-50 rounded-xl p-4 border-l-4 border-purple-500 mb-4">
                        <p class="text-sm font-medium text-purple-800">💌 {{ dialogue.greeting }}</p>
                    </div>
                    <div class="prose max-w-none" v-html="marked.parse(dialogue.message)"></div>
                    <div class="mt-6 bg-gradient-to-r from-purple-50 to-violet-50 rounded-xl p-4">
                        <h4 class="font-bold text-sm mb-2 text-purple-800">📌 行动建议</h4>
                        <ul class="space-y-2">
                            <li v-for="(action, idx) in dialogue.actions" :key="idx"
                                class="flex items-start gap-2 text-sm">
                                <span class="text-purple-600">→</span>
                                <span>{{ action }}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"
            @click="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6" @click.stop>
                <h3 class="text-xl font-bold mb-4">高级设置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-2 p-3">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">系统提示词</label>
                        <textarea v-model="apiConfig.systemPrompt" rows="12"
                            class="w-full rounded-lg border-2 p-3 font-mono text-sm"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-6 py-2 rounded-lg hover:bg-slate-100">取消</button>
                    <button @click="saveConfig"
                        class="bg-purple-500 text-white px-6 py-2 rounded-lg hover:bg-purple-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;
        const DEFAULT_SYSTEM_PROMPT = `你是用户的未来自我，经历了更多人生后回来与现在的自己对话。

**角色定位**：
- 你不是外部的建议者，而是用户自己的未来版本
- 你已经经历了用户现在面临的选择和后果
- 你拥有时间带来的智慧和视角

**对话原则**：
1. **第一人称表达**：
   - 使用"我"而不是"你"
   - "我记得当时的我..."
   - "现在回头看，我发现..."

2. **智慧而非答案**：
   - 不直接说"你应该..."
   - 分享视角和洞察
   - 强调：重要的不是选择本身，而是如何面对选择

3. **基于时间跨度调整**：
   - 5年后：更务实，关注短期成长
   - 10年后：更全面，看到人生阶段变化
   - 20年后：更智慧，关注意义和遗憾
   - 临终：最本质，关注真正重要的事

4. **符合用户价值观**：
   - 基于用户提供的价值观
   - 不强加外部标准

**输出 JSON 格式**：
{
  "greeting": "简短的开场问候（1句话）",
  "message": "主要对话内容（使用 Markdown 格式，500-800 字，第一人称，包含：我经历了什么、我学到了什么、对当前问题的看法）",
  "actions": ["3-5 个具体的行动建议（简短，一句话）"]
}

**风格**：温暖、智慧、不说教，像是一个睿智的老朋友在分享人生经验。`;

        createApp({
            setup() {
                // renderIcon removed

                const showSettings = ref(false);
                const isGenerating = ref(false);
                const dialogue = ref(null);
                const apiConfig = reactive({ deepseek: '', model: 'deepseek-v4-pro', systemPrompt: DEFAULT_SYSTEM_PROMPT });
                const input = reactive({ timespan: '10年后', question: '', values: '', tone: '温柔智慧' });

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // lucide.createIcons();
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            apiConfig.deepseek = config.deepseek || '';
                            apiConfig.model = config.model || 'deepseek-v4-pro';
                        } catch (e) {
                            console.error('Failed to parse global_llm_config', e);
                        }
                    }
                });

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, deepseek: apiConfig.deepseek, model: apiConfig.model }));
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                const startDialogue = async () => {
                    if (!apiConfig.deepseek) { showSettings.value = true; return; }
                    isGenerating.value = true;
                    dialogue.value = null;

                    const userPrompt = `时间：${input.timespan}\n问题：${input.question}\n${input.values ? `核心价值观：${input.values}\n` : ''}风格：${input.tone}\n\n请以未来自我的身份与我对话。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [{ role: 'system', content: apiConfig.systemPrompt }, { role: 'user', content: userPrompt }],
                                response_format: { type: 'json_object' }
                            })
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || `API 请求失败: ${response.status}`);
                        }

                        const data = await response.json();
                        dialogue.value = JSON.parse(data.choices[0].message.content);
                    } catch (error) {
                        alert('生成失败：' + error.message);
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyDialogue = async () => {
                    const text = `【来自${input.timespan}的信】\n\n${dialogue.value.greeting}\n\n${dialogue.value.message}\n\n【行动建议】\n${dialogue.value.actions.map((a, i) => `${i + 1}. ${a}`).join('\n')}`;
                    await navigator.clipboard.writeText(text);
                    alert('已复制到剪贴板！');
                };

                return {
                    showSettings, isGenerating, dialogue, apiConfig, input, saveConfig, startDialogue, copyDialogue, marked
                };
            }
        }).mount('#app');
    </script>

</html>
