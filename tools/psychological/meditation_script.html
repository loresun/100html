<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冥想脚本定制器 - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .meditation-gradient { background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 50%, #6EE7B7 100%); }
        .meditation-card { background: linear-gradient(135deg, #ffffff 0%, #ECFDF5 100%); border: 2px solid #34D399; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .breathe-animation { animation: breathe 4s ease-in-out infinite; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="meditation-gradient min-h-screen">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b-2 border-green-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                        <div class="w-10 h-10 bg-gradient-to-br from-green-400 to-emerald-500 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-wind text-white text-xl"></i>
                        </div>
                        <span class="font-bold text-xl text-slate-900">冥想脚本定制器</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 bg-green-100 rounded-lg p-1">
                            <button @click="apiConfig.model = 'deepseek-v4-flash'" :class="{'bg-white shadow text-green-600': apiConfig.model === 'deepseek-v4-flash'}" class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="apiConfig.model = 'deepseek-v4-pro'" :class="{'bg-white shadow text-green-600': apiConfig.model === 'deepseek-v4-pro'}" class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true" class="text-green-600 hover:text-green-700 transition"><i class="fa-solid fa-gear text-base"></i></button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow max-w-6xl mx-auto w-full p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div class="meditation-card rounded-2xl p-6 shadow-lg">
                    <h2 class="text-lg font-bold mb-4">冥想定制</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">冥想目的</label>
                            <select v-model="input.purpose" class="w-full bg-white border-2 border-green-200 rounded-lg p-3">
                                <option value="缓解焦虑">缓解焦虑</option>
                                <option value="改善睡眠">改善睡眠</option>
                                <option value="提升专注">提升专注力</option>
                                <option value="身体扫描">身体放松扫描</option>
                                <option value="慈心冥想">慈心冥想</option>
                                <option value="正念观察">正念观察</option>
                                <option value="情绪疗愈">情绪疗愈</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">时长</label>
                            <div class="flex gap-2">
                                <button @click="input.duration = '5分钟'" :class="{'bg-green-500 text-white': input.duration === '5分钟'}" class="flex-1 py-2 rounded-lg border-2 border-green-200 transition">5 分钟</button>
                                <button @click="input.duration = '10分钟'" :class="{'bg-green-500 text-white': input.duration === '10分钟'}" class="flex-1 py-2 rounded-lg border-2 border-green-200 transition">10 分钟</button>
                                <button @click="input.duration = '20分钟'" :class="{'bg-green-500 text-white': input.duration === '20分钟'}" class="flex-1 py-2 rounded-lg border-2 border-green-200 transition">20 分钟</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">引导风格</label>
                            <select v-model="input.style" class="w-full bg-white border-2 border-green-200 rounded-lg p-3">
                                <option value="温柔缓慢">温柔缓慢</option>
                                <option value="简洁有力">简洁有力</option>
                                <option value="诗意意象">诗意意象</option>
                                <option value="科学理性">科学理性</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">个性化需求（可选）</label>
                            <textarea v-model="input.custom" placeholder="例如：我喜欢海洋意象；我需要更多停顿；我希望加入感恩元素..." rows="2" class="w-full bg-white border-2 border-green-200 rounded-lg p-3"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">背景音乐建议</label>
                            <select v-model="input.music" class="w-full bg-white border-2 border-green-200 rounded-lg p-3">
                                <option value="自然声音">自然声音（雨声、海浪）</option>
                                <option value="钵音">颂钵音</option>
                                <option value="静默">纯静默</option>
                                <option value="轻音乐">轻柔音乐</option>
                            </select>
                        </div>
                    </div>
                    <button @click="generateScript" :disabled="isGenerating" class="w-full mt-4 bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold py-3 rounded-xl hover:shadow-lg transition disabled:opacity-50">
                        <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>生成冥想脚本
                    </button>
                </div>
            </div>

            <div class="meditation-card rounded-2xl p-6 shadow-lg min-h-[500px]">
                <div v-if="isGenerating" class="flex flex-col items-center justify-center h-full text-green-600">
                    <i class="fa-regular fa-circle text-6xl mb-4 breathe-animation"></i>
                    <p class="text-lg font-medium">正在创作冥想脚本...</p>
                </div>
                <div v-else-if="!script" class="flex flex-col items-center justify-center h-full text-slate-400">
                    <i class="fa-solid fa-wind text-6xl mb-4 opacity-50"></i>
                    <p>定制专属冥想引导</p>
                </div>
                <div v-else class="space-y-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-green-800">你的冥想脚本</h3>
                        <div class="flex gap-2">
                            <button @click="copyScript" class="text-sm text-green-600 hover:text-green-700">
                                <i class="fa-solid fa-copy mr-1"></i>复制
                            </button>
                            <button @click="exportScript" class="text-sm text-green-600 hover:text-green-700">
                                <i class="fa-solid fa-download mr-1"></i>导出
                            </button>
                        </div>
                    </div>
                    <div class="bg-green-50 rounded-lg p-4 mb-4">
                        <div class="flex items-center gap-2 text-sm text-green-800 mb-2">
                            <i class="fa-solid fa-circle-info"></i>
                            <span class="font-medium">使用提示</span>
                        </div>
                        <ul class="text-xs text-green-700 space-y-1">
                            <li>• 找一个安静舒适的空间</li>
                            <li>• 建议{{ input.music }}</li>
                            <li>• 可以录音后反复使用</li>
                        </ul>
                    </div>
                    <div class="prose max-w-none prose-sm" v-html="renderMarkdown(script)"></div>
                </div>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" @click="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6" @click.stop>
                <h3 class="text-xl font-bold mb-4">高级设置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-2 p-3">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">系统提示词</label>
                        <textarea v-model="apiConfig.systemPrompt" rows="12" class="w-full rounded-lg border-2 p-3 font-mono text-sm"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-6 py-2 rounded-lg hover:bg-slate-100">取消</button>
                    <button @click="saveConfig" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;
        const DEFAULT_SYSTEM_PROMPT = `你是一位专业的 MBSR（正念减压）冥想引导师，擅长创作个性化冥想脚本。

**创作原则**：
1. **结构完整**：
   - 开场引导（身体安顿、呼吸建立）
   - 核心练习（根据目的设计）
   - 结束引导（温柔唤醒、意图设定）

2. **语言特点**：
   - 第二人称"你"
   - 现在时态（"你感受到...""你注意到..."）
   - 节奏缓慢，留有停顿
   - 使用"..."表示停顿时刻

3. **停顿设计**：
   - 短停顿：... (3-5秒)
   - 中停顿：...... (10-15秒)
   - 长停顿：......... (30秒+)
   - 在关键指令后留足时间

4. **根据时长调整**：
   - 5分钟：简洁核心练习
   - 10分钟：完整结构
   - 20分钟：深度引导，多次停顿

5. **目的导向**：
   - 缓解焦虑：呼吸锚定 + 安全感建立
   - 改善睡眠：身体扫描 + 放松意象
   - 提升专注：呼吸计数 + 正念回归
   - 身体扫描：系统性身体觉察
   - 慈心冥想：慈爱短语重复
   - 正念观察：开放式觉察
   - 情绪疗愈：情绪命名 + 接纳

**输出格式**（Markdown）：
# 冥想脚本：[目的] ([时长])

## 准备阶段（0-2分钟）
[身体姿势引导、呼吸建立]

## 核心练习（主要时间）
[根据目的的具体练习]

## 结束阶段（最后1-2分钟）
[温柔唤醒、感恩、意图设定]

---
**练习要点**：
- [2-3 个关键提示]

**风格**：温柔、缓慢、不评判，像是一个温暖的声音在耳边轻声引导。`;

        // Markdown 渲染函数
        const renderMarkdown = (text) => {
            if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                return marked.parse(text || '');
            }
            return text || '';
        };

        createApp({
            setup() {
                const showSettings = ref(false);
                const isGenerating = ref(false);
                const script = ref('');
                const apiConfig = reactive({ deepseek: '', model: 'deepseek-v4-flash', systemPrompt: DEFAULT_SYSTEM_PROMPT });
                const input = reactive({ purpose: '缓解焦虑', duration: '10分钟', style: '温柔缓慢', custom: '', music: '自然声音' });

                onMounted(() => {
                    // 初始化配置
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            apiConfig.deepseek = config.deepseek || '';
                            apiConfig.model = config.model || 'deepseek-v4-flash';
                        } catch (e) {
                            console.error('Failed to parse global_llm_config', e);
                        }
                    }
                });

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, deepseek: apiConfig.deepseek, model: apiConfig.model }));
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                const generateScript = async () => {
                    if (!apiConfig.deepseek) { showSettings.value = true; return; }
                    isGenerating.value = true;
                    script.value = '';

                    const userPrompt = `目的：${input.purpose}\n时长：${input.duration}\n风格：${input.style}\n${input.custom ? `个性化需求：${input.custom}\n` : ''}音乐建议：${input.music}\n\n请创作冥想脚本。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [{ role: 'system', content: apiConfig.systemPrompt }, { role: 'user', content: userPrompt }],
                                stream: true
                            })
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || `API 请求失败: ${response.status}`);
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                    try {
                                        const data = JSON.parse(line.slice(6));
                                        const delta = data.choices[0].delta;
                                        if (delta.content) script.value += delta.content;
                                    } catch (e) {}
                                }
                            }
                        }
                    } catch (error) {
                        alert('生成失败：' + error.message);
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyScript = async () => {
                    await navigator.clipboard.writeText(script.value);
                    alert('已复制到剪贴板！');
                };

                const exportScript = () => {
                    const text = `${script.value}\n\n---\n生成时间：${new Date().toLocaleString()}\n配置：${input.purpose} | ${input.duration} | ${input.style}`;
                    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `冥想脚本_${input.purpose}_${Date.now()}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                };

                return {
                    showSettings, isGenerating, script, apiConfig, input, saveConfig, generateScript, copyScript, exportScript, renderMarkdown };
            }
        }).mount('#app');
    </script>
