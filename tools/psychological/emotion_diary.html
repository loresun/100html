    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪日记分析师 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* 温暖的橙黄色主题 */
        .warm-gradient {
            background: linear-gradient(135deg, #FFF4E6 0%, #FFE4CC 50%, #FFD4A3 100%);
        }

        .warm-card {
            background: linear-gradient(135deg, #ffffff 0%, #FFF9F0 100%);
            border: 2px solid #FFE4CC;
        }

        /* 情绪雷达图 */
        .radar-chart {
            filter: drop-shadow(0 4px 10px rgba(255, 159, 64, 0.3));
        }

        /* 脉动动画 */
        @keyframes pulse-warm {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .animate-pulse-warm {
            animation: pulse-warm 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* 情绪标签 */
        .emotion-tag {
            transition: all 0.3s ease;
        }

        .emotion-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 159, 64, 0.3);
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #FFF9F0;
        }

        ::-webkit-scrollbar-thumb {
            background: #FFB347;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #FF9F40;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="warm-gradient min-h-screen text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- 顶部导航 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b-2 border-orange-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <!-- 左侧：Logo -->
                    <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                        <div
                            class="w-10 h-10 bg-gradient-to-br from-orange-400 to-amber-500 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-heart text-white h-5 w-5"></i>
                        </div>
                        <div>
                            <span class="font-bold text-xl text-slate-900">情绪日记分析师</span>
                            <span class="hidden sm:inline text-xs text-orange-600 ml-2">Emotion Diary Analyst</span>
                        </div>
                    </div>
                    <!-- 右侧：模型切换 + 设置 -->
                    <div class="flex items-center gap-3">
                        <!-- V4 Flash/V4 Pro 模型切换器 -->
                        <div class="flex items-center gap-2 bg-orange-100 rounded-lg p-1">
                            <button @click="apiConfig.model = 'deepseek-v4-flash'"
                                :class="{'bg-white shadow text-orange-600': apiConfig.model === 'deepseek-v4-flash', 'text-orange-400': apiConfig.model !== 'deepseek-v4-flash'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="apiConfig.model = 'deepseek-v4-pro'"
                                :class="{'bg-white shadow text-orange-600': apiConfig.model === 'deepseek-v4-pro', 'text-orange-400': apiConfig.model !== 'deepseek-v4-pro'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true"
                            class="text-orange-600 hover:text-orange-700 transition flex items-center gap-1 text-sm font-medium">
                            <i class="fa-solid fa-gear h-4 w-4"></i>
                            <span class="hidden sm:inline">设置</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="flex-grow flex flex-col lg:flex-row max-w-7xl mx-auto w-full p-4 gap-6">
            <!-- 左侧：输入区 -->
            <div class="w-full lg:w-2/5 space-y-6">
                <!-- 情绪日记卡片 -->
                <div class="warm-card rounded-2xl p-6 shadow-lg">
                    <div class="flex items-center gap-2 mb-4">
                        <i class="fa-solid fa-pen-nib text-orange-500 h-5 w-5"></i>
                        <h2 class="text-lg font-bold text-slate-900">今天的心情</h2>
                    </div>

                    <div class="space-y-4">
                        <!-- 日期选择 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">日期</label>
                            <input type="date" v-model="diary.date"
                                class="w-full bg-white border-2 border-orange-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none">
                        </div>

                        <!-- 情绪日记 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">
                                今天发生了什么？感受如何？
                            </label>
                            <textarea v-model="diary.content" rows="8"
                                placeholder="在这里写下你的感受...&#10;&#10;例如：今天工作很累，老板又批评了我，但晚上和朋友聊天后心情好了很多。"
                                class="w-full bg-white border-2 border-orange-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none resize-none"></textarea>
                            <div class="text-xs text-slate-500 mt-1 text-right">
                                {{ diary.content.length }} 字
                            </div>
                        </div>

                        <!-- 快速情绪标签 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">快速选择情绪（可选）</label>
                            <div class="flex flex-wrap gap-2">
                                <button v-for="tag in emotionTags" :key="tag" @click="toggleEmotionTag(tag)"
                                    :class="selectedTags.includes(tag) ? 'bg-orange-500 text-white' : 'bg-white text-orange-600 border-2 border-orange-200'"
                                    class="emotion-tag px-3 py-1 rounded-full text-sm font-medium">
                                    {{ tag }}
                                </button>
                            </div>
                        </div>

                        <!-- 分析按钮 -->
                        <!-- 分析按钮 - 使用 renderIcon 避免 Vue-Lucide 冲突 -->
                        <button @click="analyzeDiary" :disabled="isAnalyzing || !diary.content"
                            class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold py-3 rounded-xl shadow-md hover:shadow-lg hover:from-orange-600 hover:to-amber-600 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                            <span v-if="isAnalyzing"><i class="fa-solid fa-spinner fa-spin w-5 h-5"></i></span>
                            <span v-else><i class="fa-solid fa-wand-magic-sparkles w-5 h-5"></i></span>
                            <span>{{ isAnalyzing ? '正在分析中...' : '开始情绪分析' }}</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧：分析结果 -->
            <div class="w-full lg:w-3/5 space-y-6">
                <!-- 空状态 -->
                <div v-if="!analysis && !isAnalyzing"
                    class="warm-card rounded-2xl p-12 shadow-lg flex flex-col items-center justify-center text-center h-full min-h-[500px]">
                    <div
                        class="w-24 h-24 bg-orange-100 rounded-full flex items-center justify-center mb-6 animate-pulse-warm">
                        <i class="fa-solid fa-heart-pulse text-orange-500 w-12 h-12"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-700 mb-2">开始记录你的情绪</h3>
                    <p class="text-slate-500">写下今天的感受，AI 将帮你深度分析情绪模式</p>
                </div>

                <!-- 分析结果 -->
                <div v-if="analysis" class="space-y-6">
                    <!-- 情绪雷达图 -->
                    <div class="warm-card rounded-2xl p-6 shadow-lg">
                        <div class="flex items-center gap-2 mb-4">
                            <i class="fa-solid fa-chart-line text-orange-500 h-5 w-5"></i>
                            <h3 class="text-lg font-bold text-slate-900">情绪雷达图</h3>
                        </div>
                        <div class="flex justify-center">
                            <svg class="radar-chart" width="300" height="300" viewBox="0 0 300 300">
                                <!-- 背景网格 -->
                                <g v-for="i in 5" :key="'grid-' + i">
                                    <polygon :points="getRadarPolygonPoints(60 * i / 5)" fill="none" stroke="#FFE4CC"
                                        stroke-width="1" />
                                </g>
                                <!-- 轴线 -->
                                <g v-for="(dimension, idx) in emotionDimensions" :key="'axis-' + idx">
                                    <line x1="150" y1="150"
                                        :x2="150 + 60 * Math.cos((idx * 2 * Math.PI / 6) - Math.PI / 2)"
                                        :y2="150 + 60 * Math.sin((idx * 2 * Math.PI / 6) - Math.PI / 2)"
                                        stroke="#FFD4A3" stroke-width="1" />
                                    <text :x="150 + 80 * Math.cos((idx * 2 * Math.PI / 6) - Math.PI / 2)"
                                        :y="150 + 80 * Math.sin((idx * 2 * Math.PI / 6) - Math.PI / 2)"
                                        text-anchor="middle" dominant-baseline="middle"
                                        class="text-xs font-medium fill-slate-700">
                                        {{ dimension.name }}
                                    </text>
                                </g>
                                <!-- 数据多边形 -->
                                <polygon :points="getEmotionDataPoints()" fill="rgba(255, 159, 64, 0.3)"
                                    stroke="#FF9F40" stroke-width="2" />
                                <!-- 数据点 -->
                                <g v-for="(dimension, idx) in emotionDimensions" :key="'point-' + idx">
                                    <circle
                                        :cx="150 + (dimension.value / 100 * 60) * Math.cos((idx * 2 * Math.PI / 6) - Math.PI / 2)"
                                        :cy="150 + (dimension.value / 100 * 60) * Math.sin((idx * 2 * Math.PI / 6) - Math.PI / 2)"
                                        r="4" fill="#FF9F40" />
                                </g>
                            </svg>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mt-4">
                            <div v-for="dimension in emotionDimensions" :key="dimension.name"
                                class="text-center p-2 bg-orange-50 rounded-lg">
                                <div class="text-xs text-slate-600">{{ dimension.name }}</div>
                                <div class="text-lg font-bold text-orange-600">{{ dimension.value }}</div>
                            </div>
                        </div>
                    </div>

                    <!-- AI 分析文本 -->
                    <div class="warm-card rounded-2xl p-6 shadow-lg">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-brain text-orange-500 h-5 w-5"></i>
                                <h3 class="text-lg font-bold text-slate-900">深度分析</h3>
                            </div>
                            <button @click="copyAnalysis"
                                class="text-orange-600 hover:text-orange-700 text-sm flex items-center gap-1">
                                <i class="fa-solid fa-copy w-4 h-4"></i>
                                复制
                            </button>
                        </div>
                        <div class="prose prose-slate max-w-none" v-html="marked.parse(analysis.text)"></div>
                    </div>

                    <!-- 情绪调节建议 -->
                    <div class="warm-card rounded-2xl p-6 shadow-lg">
                        <div class="flex items-center gap-2 mb-4">
                            <i class="fa-solid fa-lightbulb text-orange-500 h-5 w-5"></i>
                            <h3 class="text-lg font-bold text-slate-900">调节建议</h3>
                        </div>
                        <div class="prose prose-slate max-w-none" v-html="marked.parse(analysis.suggestions)"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"
            @click="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto" @click.stop>
                <div class="sticky top-0 bg-white border-b border-slate-200 p-6 rounded-t-2xl">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-slate-900">高级设置</h3>
                        <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                            <i class="fa-solid fa-xmark h-6 w-6"></i>
                        </button>
                    </div>
                </div>

                <div class="p-6 space-y-6">
                    <!-- API 配置 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" placeholder="sk-..."
                            class="w-full rounded-lg border-2 border-slate-300 p-3 focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none">
                        <p class="text-xs text-slate-500 mt-1">
                            在 <a href="https://platform.deepseek.com" target="_blank"
                                class="text-orange-600 hover:underline">DeepSeek 平台</a> 获取 API Key
                        </p>
                    </div>

                    <!-- 模型选择 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">AI 模型</label>
                        <select v-model="apiConfig.model"
                            class="w-full rounded-lg border-2 border-slate-300 p-3 outline-none focus:ring-2 focus:ring-orange-400 bg-white">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>

                    <!-- 系统提示词编辑器 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-file-invoice text-white/50 w-4 h-4"></i>
                            系统提示词（高级）
                        </label>
                        <textarea v-model="apiConfig.systemPrompt" rows="12"
                            class="w-full rounded-lg border-2 border-slate-300 p-3 font-mono text-sm focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none resize-none"
                            placeholder="自定义 AI 分析风格..."></textarea>
                        <div class="flex gap-2 mt-2">
                            <button @click="resetSystemPrompt"
                                class="text-xs text-slate-600 hover:text-slate-800 flex items-center gap-1">
                                <i class="fa-solid fa-rotate-left w-3 h-3"></i>
                                恢复默认
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 底部按钮 -->
                <div
                    class="sticky bottom-0 bg-slate-50 border-t border-slate-200 p-6 rounded-b-2xl flex justify-end gap-3">
                    <button @click="showSettings = false"
                        class="px-6 py-2 hover:bg-slate-100 rounded-lg text-slate-700 font-medium transition">
                        取消
                    </button>
                    <button @click="saveConfig"
                        class="bg-gradient-to-r from-orange-500 to-amber-500 text-white px-6 py-2 rounded-lg hover:from-orange-600 hover:to-amber-600 font-medium transition">
                        保存配置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;

        // 默认系统提示词
        const DEFAULT_SYSTEM_PROMPT = `你是一位专业的情绪心理分析师，擅长通过日记内容深度分析情绪模式。

你的分析框架：
1. **情绪识别**：识别文本中的主要情绪（快乐、悲伤、焦虑、愤怒、平静、兴奋）及其强度（0-100）
2. **触发因素**：分析什么事件/想法触发了这些情绪
3. **认知模式**：识别背后的思维模式（如灾难化思维、过度概括等）
4. **身心反应**：推测可能的身体感受和行为反应
5. **调节建议**：基于认知行为疗法(CBT)和正念技巧给出具体可行的调节方法

输出格式要求：
- 使用温暖、共情的语言
- 避免专业术语堆砌，用通俗易懂的方式表达
- 提供 3-5 条具体可执行的建议
- 鼓励用户接纳情绪，而非压抑

请以 Markdown 格式输出分析结果。`;

        createApp({
            setup() {
                // Removed duplicate renderIcon definition (moved below)


                const showSettings = ref(false);
                const isAnalyzing = ref(false);

                // renderIcon function removed

                // API 配置
                const apiConfig = reactive({
                    deepseek: '',
                    model: 'deepseek-v4-pro', // 默认使用 V4 Pro 深度分析
                    systemPrompt: DEFAULT_SYSTEM_PROMPT
                });

                // 日记数据
                const diary = reactive({
                    date: new Date().toISOString().split('T')[0],
                    content: ''
                });

                // 情绪标签
                const emotionTags = ['😊 快乐', '😢 悲伤', '😰 焦虑', '😠 愤怒', '😌 平静', '😆 兴奋', '😔 失落', '😤 烦躁'];
                const selectedTags = ref([]);

                // 分析结果
                const analysis = ref(null);

                // 情绪维度（雷达图）
                const emotionDimensions = ref([
                    { name: '快乐', value: 50 },
                    { name: '悲伤', value: 50 },
                    { name: '焦虑', value: 50 },
                    { name: '愤怒', value: 50 },
                    { name: '平静', value: 50 },
                    { name: '兴奋', value: 50 }
                ]);

                // 加载配置
                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            apiConfig.deepseek = config.deepseek || '';
                            apiConfig.model = config.model || 'deepseek-v4-pro';
                        } catch (e) {
                            console.error('Failed to parse global_llm_config', e);
                        }
                    }
                    // 加载自定义提示词
                    const savedPrompt = localStorage.getItem('emotion_diary_prompt');
                    if (savedPrompt) {
                        apiConfig.systemPrompt = savedPrompt;
                    }
                    // 只为静态图标调用 createIcons（非响应式区域）
                    // lucide.createIcons();
                });

                // 保存配置
                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...current,
                        deepseek: apiConfig.deepseek,
                        model: apiConfig.model
                    }));
                    // 保存自定义提示词
                    localStorage.setItem('emotion_diary_prompt', apiConfig.systemPrompt);
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                // 重置系统提示词
                const resetSystemPrompt = () => {
                    if (confirm('确定要恢复默认提示词吗？')) {
                        apiConfig.systemPrompt = DEFAULT_SYSTEM_PROMPT;
                    }
                };

                // 切换情绪标签
                const toggleEmotionTag = (tag) => {
                    const index = selectedTags.value.indexOf(tag);
                    if (index > -1) {
                        selectedTags.value.splice(index, 1);
                    } else {
                        selectedTags.value.push(tag);
                    }
                };

                // 分析日记
                const analyzeDiary = async () => {
                    if (!apiConfig.deepseek) {
                        alert('请先配置 DeepSeek API Key');
                        showSettings.value = true;
                        return;
                    }

                    isAnalyzing.value = true;
                    analysis.value = null;

                    const userPrompt = `日期：${diary.date}

日记内容：
${diary.content}

${selectedTags.value.length > 0 ? `用户标注的情绪：${selectedTags.value.join('、')}` : ''}

请分析这篇日记的情绪状态，并提供：
1. 情绪雷达图数据（6个维度：快乐、悲伤、焦虑、愤怒、平静、兴奋，每个维度 0-100 分）
2. 深度情绪分析
3. 调节建议

请以如下 JSON 格式返回：
{
  "emotions": {
    "快乐": 60,
    "悲伤": 30,
    "焦虑": 40,
    "愤怒": 20,
    "平静": 50,
    "兴奋": 70
  },
  "analysis": "深度分析文本（Markdown格式）",
  "suggestions": "调节建议（Markdown格式）"
}`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [
                                    { role: 'system', content: apiConfig.systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                response_format: { type: 'json_object' },
                                stream: false
                            })
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || `API 请求失败: ${response.status}`);
                        }

                        const data = await response.json();
                        const result = JSON.parse(data.choices[0].message.content);

                        // 更新情绪维度
                        emotionDimensions.value = Object.entries(result.emotions).map(([name, value]) => ({
                            name,
                            value
                        }));

                        // 更新分析结果
                        analysis.value = {
                            text: result.analysis,
                            suggestions: result.suggestions
                        };

                        // 注意：不再在这里调用 lucide.createIcons()，因为响应式图标使用 renderIcon

                    } catch (error) {
                        console.error('分析失败:', error);
                        alert('分析失败: ' + error.message);
                    } finally {
                        isAnalyzing.value = false;
                    }
                };

                // 复制分析结果
                const copyAnalysis = () => {
                    if (!analysis.value) return;
                    const text = `# 情绪分析 - ${diary.date}\n\n## 深度分析\n${analysis.value.text}\n\n## 调节建议\n${analysis.value.suggestions}`;
                    navigator.clipboard.writeText(text);
                    alert('已复制到剪贴板！');
                };

                // 雷达图辅助函数
                const getRadarPolygonPoints = (radius) => {
                    const points = [];
                    for (let i = 0; i < 6; i++) {
                        const angle = (i * 2 * Math.PI / 6) - Math.PI / 2;
                        const x = 150 + radius * Math.cos(angle);
                        const y = 150 + radius * Math.sin(angle);
                        points.push(`${x},${y}`);
                    }
                    return points.join(' ');
                };

                const getEmotionDataPoints = () => {
                    const points = emotionDimensions.value.map((dimension, i) => {
                        const angle = (i * 2 * Math.PI / 6) - Math.PI / 2;
                        const radius = dimension.value / 100 * 60;
                        const x = 150 + radius * Math.cos(angle);
                        const y = 150 + radius * Math.sin(angle);
                        return `${x},${y}`;
                    });
                    return points.join(' ');
                };

                return {
                    // 状态
                    showSettings,
                    isAnalyzing,
                    apiConfig,
                    diary,
                    emotionTags,
                    selectedTags,
                    analysis,
                    emotionDimensions,
                    
                    // 方法
                    saveConfig,
                    resetSystemPrompt,
                    toggleEmotionTag,
                    analyzeDiary,
                    copyAnalysis,
                    getRadarPolygonPoints,
                    
                    // 计算属性
                    getEmotionDataPoints,
                    
                    // 库
                    marked: window.marked
                };
            }
        }).mount('#app');
    </script>
