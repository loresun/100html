<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社恐破冰话题生成器 - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .social-gradient {
            background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 50%, #A7F3D0 100%);
        }

        .social-card {
            background: linear-gradient(135deg, #ffffff 0%, #F0FDF4 100%);
            border: 2px solid #86EFAC;
        }

        /* 加载动画 - 旋转效果 */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* 按钮点击动画 - 缩放效果 */
        @keyframes buttonPress {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.97);
            }

            100% {
                transform: scale(1);
            }
        }

        .btn-generate {
            transition: all 0.3s ease;
        }

        .btn-generate:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
        }

        .btn-generate:not(:disabled):active {
            animation: buttonPress 0.2s ease-out;
            transform: translateY(0);
        }

        .btn-generate:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* 结果卡片入场动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .topic-card {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .topic-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .topic-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .topic-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .topic-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .topic-card:nth-child(5) {
            animation-delay: 0.5s;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="social-gradient min-h-screen">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b-2 border-green-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                        <div
                            class="w-10 h-10 bg-gradient-to-br from-green-400 to-emerald-500 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-comment-medical text-white text-xl"></i>
                        </div>
                        <span class="font-bold text-xl text-slate-900">社恐破冰话题</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 bg-green-100 rounded-lg p-1">
                            <button @click="apiConfig.model = 'deepseek-v4-flash'"
                                :class="{'bg-white shadow text-green-600': apiConfig.model === 'deepseek-v4-flash'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="apiConfig.model = 'deepseek-v4-pro'"
                                :class="{'bg-white shadow text-green-600': apiConfig.model === 'deepseek-v4-pro'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true" class="text-green-600 hover:text-green-700 transition"><i
                                class="fa-solid fa-gear"></i></button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow max-w-4xl mx-auto w-full p-4 space-y-6">
            <div class="social-card rounded-2xl p-6 shadow-lg">
                <h2 class="text-lg font-bold mb-4">场景设置</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">社交场景</label>
                        <select v-model="input.scenario"
                            class="w-full bg-white border-2 border-green-200 rounded-lg p-2">
                            <option value="饭局">饭局聚餐</option>
                            <option value="相亲">相亲约会</option>
                            <option value="电梯">电梯遇见</option>
                            <option value="会议">会议茶歇</option>
                            <option value="派对">派对社交</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">对方年龄</label>
                        <input v-model="input.age" placeholder="25-30岁"
                            class="w-full bg-white border-2 border-green-200 rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">对方职业</label>
                        <input v-model="input.occupation" placeholder="程序员/老师/医生..."
                            class="w-full bg-white border-2 border-green-200 rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">兴趣爱好（可选）</label>
                        <input v-model="input.interests" placeholder="摄影/旅游/运动..."
                            class="w-full bg-white border-2 border-green-200 rounded-lg p-2">
                    </div>
                </div>
                <button @click="handleGenerate" :disabled="isGenerating || !input.scenario"
                    class="btn-generate w-full mt-4 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2">
                    <i v-if="isGenerating" class="fa-solid fa-spinner animate-spin text-xl"></i>
                    <i v-else class="fa-solid fa-wand-magic-sparkles text-xl"></i>
                    <span>{{ isGenerating ? '正在生成...' : '生成破冰话题' }}</span>
                </button>
            </div>

            <div v-if="topics" class="space-y-4">
                <div v-for="(topic, idx) in topics.items" :key="idx"
                    class="topic-card social-card rounded-2xl p-6 shadow-lg" style="opacity: 0;">
                    <h3 class="font-bold text-lg mb-2">话题 {{ idx + 1 }}: {{ topic.topic }}</h3>
                    <p class="text-slate-600 mb-3">{{ topic.reason }}</p>
                    <div class="bg-green-50 rounded-lg p-3">
                        <p class="text-sm font-medium text-green-800 mb-2">如果对方这样回答...</p>
                        <ul class="text-sm text-slate-600 space-y-1">
                            <li v-for="(follow, i) in topic.followups" :key="i">→ {{ follow }}</li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"
            @click="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6" @click.stop>
                <h3 class="text-xl font-bold mb-4">高级设置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-2 p-3">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">系统提示词</label>
                        <textarea v-model="apiConfig.systemPrompt" rows="8"
                            class="w-full rounded-lg border-2 p-3 font-mono text-sm"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-6 py-2 rounded-lg">取消</button>
                    <button @click="saveConfig" class="bg-green-500 text-white px-6 py-2 rounded-lg">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;
        const DEFAULT_PROMPT = `你是社交心理学专家，擅长为社恐人士设计破冰话题。

设计原则：
1. 开放式问题（避免Yes/No）
2. 基于场景和对方背景
3. 真诚不做作
4. 提供后续问题树

输出JSON格式：
{
  "items": [
    {
      "topic": "话题内容",
      "reason": "为什么这个话题好",
      "followups": ["后续问题1", "后续问题2", "后续问题3"]
    }
  ]
}

生成3-5个高质量话题。`;

        createApp({
            setup() {
                const showSettings = ref(false);
                const isGenerating = ref(false);
                const topics = ref(null);
                const apiConfig = reactive({ deepseek: '', model: 'deepseek-v4-flash', systemPrompt: DEFAULT_PROMPT });
                const input = reactive({ scenario: '饭局', age: '', occupation: '', interests: '' });

                // 防抖标志 - 防止重复点击
                let debounceTimer = null;
                const DEBOUNCE_DELAY = 500; // 500ms 防抖延迟

                /**
                 * 渲染 Lucide 图标为 SVG 字符串
                 * 使用 v-html 方式渲染，避免与 Vue 虚拟 DOM 冲突
                 * @param {string} name - 图标名称
                 * @param {number} size - 图标尺寸，默认 24
                 * @returns {string} SVG 字符串
                 */
                // renderIcon removed

                /**
                 * 从 localStorage 加载配置
                 * 兼容多种 key 格式
                 */
                const loadConfig = () => {
                    // 优先读取 global_llm_config
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            apiConfig.deepseek = config.deepseek || config.apiKey || '';
                            apiConfig.model = config.model || 'deepseek-v4-flash';
                            return;
                        } catch (e) {
                            console.warn('解析配置失败:', e);
                        }
                    }
                    // 兼容其他 key
                    apiConfig.deepseek = localStorage.getItem('deepseek') ||
                        localStorage.getItem('apiKey') ||
                        localStorage.getItem('deepseek_key') || '';
                };

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // lucide.createIcons();
                    loadConfig();
                });

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, deepseek: apiConfig.deepseek, model: apiConfig.model }));
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                /**
                 * 生成破冰话题 - 核心 API 调用函数
                 */
                const generateTopics = async () => {
                    if (!apiConfig.deepseek) { showSettings.value = true; return; }
                    isGenerating.value = true;

                    try {
                        const userPrompt = `场景：${input.scenario}\n对方：${input.age} ${input.occupation}\n${input.interests ? `兴趣：${input.interests}` : ''}\n\n请生成适合的破冰话题。`;

                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [{ role: 'system', content: apiConfig.systemPrompt }, { role: 'user', content: userPrompt }],
                                response_format: { type: 'json_object' }
                            })
                        });

                        const data = await response.json();
                        topics.value = JSON.parse(data.choices[0].message.content);
                    } catch (error) {
                        alert('生成失败：' + error.message);
                    } finally {
                        isGenerating.value = false;
                    }
                };

                /**
                 * 处理生成按钮点击 - 带防抖功能
                 * 防止用户重复点击导致多次 API 调用
                 */
                const handleGenerate = () => {
                    // 如果正在生成中，直接返回
                    if (isGenerating.value) return;

                    // 清除之前的防抖定时器
                    if (debounceTimer) {
                        clearTimeout(debounceTimer);
                    }

                    // 设置新的防抖定时器
                    debounceTimer = setTimeout(() => {
                        generateTopics();
                    }, DEBOUNCE_DELAY);
                };

                return { showSettings, isGenerating, topics, apiConfig, input, saveConfig, generateTopics, handleGenerate };
            }
        }).mount('#app');
    </script>
