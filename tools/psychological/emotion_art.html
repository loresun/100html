<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪艺术生成器 - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .art-gradient {
            background: linear-gradient(135deg, #FAE8FF 0%, #F3E8FF 50%, #E9D5FF 100%);
        }

        .art-card {
            background: linear-gradient(135deg, #ffffff 0%, #FAF5FF 100%);
            border: 2px solid #C084FC;
        }

        @keyframes palette-rotate {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(180deg);
            }
        }

        .palette-animation {
            animation: palette-rotate 3s ease-in-out infinite;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="art-gradient min-h-screen">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b-2 border-purple-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                        <div
                            class="w-10 h-10 bg-gradient-to-br from-purple-400 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-palette text-white h-5 w-5"></i>
                        </div>
                        <span class="font-bold text-xl text-slate-900">情绪艺术生成器</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 bg-purple-100 rounded-lg px-3 py-1">
                            <span class="text-xs font-medium text-purple-700">豆包 Seedream 4.5</span>
                        </div>
                        <button @click="showSettings = true" class="text-purple-600 hover:text-purple-700 transition"><i
                                class="fa-solid fa-gear h-4 w-4"></i></button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow max-w-6xl mx-auto w-full p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div class="art-card rounded-2xl p-6 shadow-lg">
                    <h2 class="text-lg font-bold mb-4">情绪输入</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">当前情绪</label>
                            <select v-model="input.emotion"
                                class="w-full bg-white border-2 border-purple-200 rounded-lg p-3">
                                <option value="快乐">快乐 Joy</option>
                                <option value="悲伤">悲伤 Sadness</option>
                                <option value="焦虑">焦虑 Anxiety</option>
                                <option value="愤怒">愤怒 Anger</option>
                                <option value="平静">平静 Peace</option>
                                <option value="孤独">孤独 Loneliness</option>
                                <option value="希望">希望 Hope</option>
                                <option value="困惑">困惑 Confusion</option>
                                <option value="怀旧">怀旧 Nostalgia</option>
                                <option value="释然">释然 Relief</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">情绪描述（可选）</label>
                            <textarea v-model="input.description" placeholder="描述你此刻的感受、想法或场景..." rows="3"
                                class="w-full bg-white border-2 border-purple-200 rounded-lg p-3"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">艺术风格</label>
                            <select v-model="input.style"
                                class="w-full bg-white border-2 border-purple-200 rounded-lg p-3">
                                <option value="抽象表现主义">抽象表现主义</option>
                                <option value="印象派">印象派</option>
                                <option value="超现实主义">超现实主义</option>
                                <option value="极简主义">极简主义</option>
                                <option value="水彩画">水彩画</option>
                                <option value="油画">油画</option>
                                <option value="数字艺术">数字艺术</option>
                            </select>
                        </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">画面比例</label>
                                <div class="flex gap-2">
                                    <button @click="input.ratio = '1:1'"
                                        :class="{'bg-purple-500 text-white': input.ratio === '1:1'}"
                                        class="flex-1 py-2 rounded-lg border-2 border-purple-200 transition">1:1 (2048x2048)</button>
                                    <button @click="input.ratio = '16:9'"
                                        :class="{'bg-purple-500 text-white': input.ratio === '16:9'}"
                                        class="flex-1 py-2 rounded-lg border-2 border-purple-200 transition">16:9 (2048x1152)</button>
                                    <button @click="input.ratio = '9:16'"
                                        :class="{'bg-purple-500 text-white': input.ratio === '9:16'}"
                                        class="flex-1 py-2 rounded-lg border-2 border-purple-200 transition">9:16 (1152x2048)</button>
                                </div>
                            </div>
                    </div>
                    <button @click="generateArt" :disabled="isGenerating"
                        class="w-full mt-4 bg-gradient-to-r from-purple-500 to-purple-600 text-white font-bold py-3 rounded-xl hover:shadow-lg transition disabled:opacity-50 flex items-center justify-center">
                        <span v-if="isGenerating" class="flex items-center">
                            <i class="fa-solid fa-spinner w-5 h-5 mr-2 animate-spin"></i>正在生成...
                        </span>
                        <span v-else class="flex items-center">
                            <i class="fa-solid fa-wand-magic-sparkles w-5 h-5 mr-2"></i>生成情绪艺术
                        </span>
                    </button>
                </div>

                <div v-if="prompt" class="art-card rounded-2xl p-4 shadow-lg">
                    <h3 class="text-sm font-bold mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb w-4 h-4 text-purple-600"></i>
                        生成的提示词
                    </h3>
                    <p class="text-xs text-slate-600 bg-purple-50 p-3 rounded-lg">{{ prompt }}</p>
                </div>
            </div>

            <div class="art-card rounded-2xl p-6 shadow-lg flex items-center justify-center min-h-[500px]">
                <div v-if="isGenerating" class="flex flex-col items-center text-purple-600">
                    <i class="fa-solid fa-palette w-16 h-16 mb-4 palette-animation"></i>
                    <p class="text-lg font-medium">正在创作情绪艺术...</p>
                    <p class="text-sm text-slate-500 mt-2">{{ progress }}</p>
                </div>
                <div v-else-if="!imageUrl" class="flex flex-col items-center text-slate-400">
                    <i class="fa-solid fa-image w-16 h-16 mb-4 opacity-50"></i>
                    <p>选择情绪，生成专属艺术作品</p>
                </div>
                <div v-else class="w-full">
                    <img :src="imageUrl" class="w-full rounded-xl shadow-lg mb-4" alt="情绪艺术">
                    <div class="flex gap-2">
                        <button @click="downloadImage"
                            class="flex-1 bg-purple-500 text-white py-2 rounded-lg hover:bg-purple-600">
                            <i class="fa-solid fa-download w-4 h-4 inline mr-1"></i>下载
                        </button>
                        <button @click="regenerate"
                            class="flex-1 border-2 border-purple-500 text-purple-600 py-2 rounded-lg hover:bg-purple-50">
                            <i class="fa-solid fa-arrows-rotate w-4 h-4 inline mr-1"></i>重新生成
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"
            @click="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6" @click.stop>
                <h3 class="text-xl font-bold mb-4">高级设置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">豆包 API Key</label>
                        <input type="password" v-model="apiConfig.doubao" class="w-full rounded-lg border-2 p-3"
                            placeholder="请输入豆包 API Key">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">模型选择</label>
                        <select v-model="apiConfig.model" class="w-full rounded-lg border-2 p-3">
                            <option value="doubao-seedream-4-0-250828">Seedream 4.0（推荐）</option>
                            <option value="doubao-seedream-4-5-251128">Seedream 4.5</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">水印设置</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" v-model="apiConfig.disableWatermark" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
                            <span class="ml-3 text-sm font-medium text-slate-700">{{ apiConfig.disableWatermark ? '关闭水印' : '开启水印' }}</span>
                        </label>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-lg text-sm text-slate-600">
                        <p><strong>提示：</strong>本工具使用豆包 Seedream 图像生成模型。请在火山引擎控制台获取 API Key。</p>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-6 py-2 rounded-lg hover:bg-slate-100">取消</button>
                    <button @click="saveConfig"
                        class="bg-purple-500 text-white px-6 py-2 rounded-lg hover:bg-purple-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted, nextTick } = Vue;

        // 情绪到艺术元素的映射
        const EMOTION_MAPPINGS = {
            '快乐': { colors: 'bright yellow, orange, warm light', elements: 'sunlight, flowers, dancing figures', mood: 'energetic, uplifting' },
            '悲伤': { colors: 'deep blue, gray, muted purple', elements: 'rain, falling leaves, solitary figure', mood: 'melancholic, introspective' },
            '焦虑': { colors: 'chaotic red, dark green, swirling black', elements: 'tangled lines, fragmented shapes', mood: 'tense, unsettled' },
            '愤怒': { colors: 'intense red, black, sharp orange', elements: 'sharp angles, explosive bursts, fire', mood: 'powerful, aggressive' },
            '平静': { colors: 'soft blue, white, pastel green', elements: 'still water, gentle clouds, open space', mood: 'serene, balanced' },
            '孤独': { colors: 'cold blue, gray, empty white', elements: 'single figure, vast empty space, distant horizon', mood: 'isolated, contemplative' },
            '希望': { colors: 'golden light, soft pink, dawn colors', elements: 'sunrise, opening door, sprouting plant', mood: 'optimistic, gentle' },
            '困惑': { colors: 'muted purple, foggy gray, uncertain brown', elements: 'maze, question marks, blurred paths', mood: 'uncertain, searching' },
            '怀旧': { colors: 'vintage sepia, faded colors, warm brown', elements: 'old photographs, memories, childhood symbols', mood: 'nostalgic, bittersweet' },
            '释然': { colors: 'light blue, soft white, transparent', elements: 'open hands, floating away, breaking chains', mood: 'liberating, peaceful' }
        };

        createApp({
            setup() {
                // renderIcon removed

                const showSettings = ref(false);
                const isGenerating = ref(false);
                const imageUrl = ref('');
                const prompt = ref('');
                const progress = ref('');
                const apiConfig = reactive({ doubao: '', model: 'doubao-seedream-4-0-250828', disableWatermark: true });
                const input = reactive({ emotion: '快乐', description: '', style: '抽象表现主义', ratio: '1:1' });

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // lucide.createIcons();
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            apiConfig.doubao = config.doubao || '';
                            // 确保使用正确的模型名称格式
                            const savedModel = config.doubaoImageModel;
                            const validModels = ['doubao-seedream-4-5-251128', 'doubao-seedream-4-0-250828'];
                            if (savedModel && validModels.includes(savedModel)) {
                                apiConfig.model = savedModel;
                            } else {
                                // 如果保存的模型名称不正确，使用默认值
                                apiConfig.model = 'doubao-seedream-4-0-250828';
                            }
                            // 加载水印设置
                            if (typeof config.doubaoDisableWatermark === 'boolean') {
                                apiConfig.disableWatermark = config.doubaoDisableWatermark;
                            }
                        } catch (e) {
                            console.error('解析 global_llm_config 失败:', e);
                            apiConfig.model = 'doubao-seedream-4-0-250828';
                        }
                    }
                });

                const saveConfig = () => {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('解析 global_llm_config 失败:', e);
                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, doubao: apiConfig.doubao, doubaoImageModel: apiConfig.model, doubaoDisableWatermark: apiConfig.disableWatermark }));
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                const buildPrompt = () => {
                    const mapping = EMOTION_MAPPINGS[input.emotion];
                    let promptText = `${input.style}, expressing the emotion of ${input.emotion}, `;
                    promptText += `using ${mapping.colors}, featuring ${mapping.elements}, `;
                    promptText += `creating a ${mapping.mood} atmosphere`;

                    if (input.description) {
                        promptText += `, incorporating elements of: ${input.description}`;
                    }

                    promptText += ', high quality, artistic, emotional depth, masterpiece';
                    return promptText;
                };

                const generateArt = async () => {
                    if (!apiConfig.doubao) { showSettings.value = true; return; }

                    isGenerating.value = true;
                    // Refresh icons for loading spinner
                    imageUrl.value = '';
                    progress.value = '正在生成提示词...';

                    try {
                        prompt.value = buildPrompt();
                        progress.value = '正在调用豆包 Seedream API...';

                        // 豆包图像生成 API 调用
                        const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.doubao}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                prompt: prompt.value,
                                n: 1,
                                size: input.ratio === '1:1' ? '2048x2048' : (input.ratio === '16:9' ? '2048x1152' : '1152x2048'),
                                response_format: "b64_json",
                                watermark: !apiConfig.disableWatermark
                            })
                        });

                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.error?.message || '图像生成失败');
                        }

                        const data = await response.json();
                        progress.value = '图像生成完成！';

                        if (data.data && data.data[0] && data.data[0].b64_json) {
                            // 使用 base64 数据直接显示图片
                            imageUrl.value = `data:image/png;base64,${data.data[0].b64_json}`;
                            // 保存 base64 数据用于下载
                            window.generatedImageBase64 = data.data[0].b64_json;
                        } else if (data.data && data.data[0] && data.data[0].url) {
                            imageUrl.value = data.data[0].url;
                            window.generatedImageBase64 = null;
                        } else {
                            throw new Error('未获取到图像数据');
                        }

                    } catch (error) {
                        alert('生成失败：' + error.message);
                        console.error(error);
                    } finally {
                        isGenerating.value = false;
                        // Refresh icons for normal button state
                        progress.value = '';
                    }
                };

                const regenerate = () => {
                    generateArt();
                };

                const downloadImage = async () => {
                    try {
                        // 优先使用 base64 数据
                        if (window.generatedImageBase64) {
                            const blob = await fetch(`data:image/png;base64,${window.generatedImageBase64}`).then(r => r.blob());
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `emotion_art_${input.emotion}_${Date.now()}.png`;
                            a.click();
                            window.URL.revokeObjectURL(url);
                        } else {
                            // 降级方案：使用 URL 下载
                            const response = await fetch(imageUrl.value);
                            if (!response.ok) {
                                throw new Error('下载图片失败');
                            }
                            const blob = await response.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `emotion_art_${input.emotion}_${Date.now()}.png`;
                            a.click();
                            window.URL.revokeObjectURL(url);
                        }
                    } catch (error) {
                        alert('下载失败：' + error.message);
                        console.error('下载图片失败:', error);
                    }
                };

                return {
                    showSettings, isGenerating, imageUrl, prompt, progress, apiConfig, input, saveConfig, generateArt, regenerate, downloadImage
                };
            }
        }).mount('#app');
    </script>
