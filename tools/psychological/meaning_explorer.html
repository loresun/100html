<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生意义探索器 - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .meaning-gradient { background: linear-gradient(135deg, #1E1B4B 0%, #312E81 50%, #4C1D95 100%); }
        .meaning-card { background: linear-gradient(135deg, #1F2937 0%, #374151 100%); border: 2px solid #6366F1; color: #E5E7EB; }
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .sparkle-animation { animation: sparkle 2s ease-in-out infinite; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="meaning-gradient min-h-screen">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b-2 border-indigo-500">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-wand-magic-sparkles text-white text-xl"></i>
                        </div>
                        <span class="font-bold text-xl text-white">人生意义探索器</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 bg-indigo-900 rounded-lg p-1">
                            <button @click="apiConfig.model = 'deepseek-v4-flash'" :class="{'bg-indigo-600 shadow text-white': apiConfig.model === 'deepseek-v4-flash'}" class="px-3 py-1 text-xs font-medium rounded-md transition text-indigo-200">V4 Flash</button>
                            <button @click="apiConfig.model = 'deepseek-v4-pro'" :class="{'bg-indigo-600 shadow text-white': apiConfig.model === 'deepseek-v4-pro'}" class="px-3 py-1 text-xs font-medium rounded-md transition text-indigo-200">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true" class="text-indigo-400 hover:text-indigo-300 transition"><i class="fa-solid fa-gear text-base"></i></button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow max-w-6xl mx-auto w-full p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div class="meaning-card rounded-2xl p-6 shadow-lg">
                    <h2 class="text-lg font-bold mb-4 text-indigo-200">存在主义问卷</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-indigo-200">当前人生阶段</label>
                            <select v-model="input.stage" class="w-full bg-slate-800 border-2 border-indigo-500 rounded-lg p-3 text-white">
                                <option value="探索期">探索期（20-30岁）</option>
                                <option value="建立期">建立期（30-40岁）</option>
                                <option value="稳定期">稳定期（40-50岁）</option>
                                <option value="转型期">转型期（50岁+）</option>
                                <option value="危机期">人生危机期</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-indigo-200">触发意义探索的原因</label>
                            <textarea v-model="input.trigger" placeholder="例如：失业、失恋、成功后的空虚、亲人离世、突然意识到时间流逝..." rows="3" class="w-full bg-slate-800 border-2 border-indigo-500 rounded-lg p-3 text-white placeholder-slate-400"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-indigo-200">当你回顾人生时，什么让你感到骄傲？</label>
                            <textarea v-model="input.pride" placeholder="可以是成就、关系、克服的困难..." rows="2" class="w-full bg-slate-800 border-2 border-indigo-500 rounded-lg p-3 text-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-indigo-200">你希望被如何记住？（墓志铭法）</label>
                            <input v-model="input.legacy" placeholder="一句话描述你希望留下的印记" class="w-full bg-slate-800 border-2 border-indigo-500 rounded-lg p-3 text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-indigo-200">探索视角</label>
                            <select v-model="input.perspective" class="w-full bg-slate-800 border-2 border-indigo-500 rounded-lg p-3 text-white">
                                <option value="弗兰克尔">意义疗法（Viktor Frankl）</option>
                                <option value="萨特">存在主义（Sartre）</option>
                                <option value="佛教">东方智慧（佛教/道家）</option>
                                <option value="整合">多元视角整合</option>
                            </select>
                        </div>
                    </div>
                    <button @click="exploreMeaning" :disabled="isGenerating || !input.trigger" class="w-full mt-4 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3 rounded-xl hover:shadow-lg transition disabled:opacity-50">
                        <i class="fa-solid fa-compass mr-2"></i>开始探索意义
                    </button>
                </div>
            </div>

            <div class="meaning-card rounded-2xl p-6 shadow-lg min-h-[500px]">
                <div v-if="isGenerating" class="flex flex-col items-center justify-center h-full text-indigo-400">
                    <i class="fa-solid fa-wand-magic-sparkles text-6xl mb-4 fa-spin"></i>
                    <p class="text-lg font-medium">正在探索人生意义...</p>
                </div>
                <div v-else-if="!exploration" class="flex flex-col items-center justify-center h-full text-slate-500">
                    <i class="fa-solid fa-compass text-6xl mb-4 opacity-50"></i>
                    <p>开启意义之旅</p>
                </div>
                <div v-else class="space-y-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-indigo-200">你的意义地图</h3>
                        <div class="flex gap-2">
                            <button @click="copyExploration" class="text-sm text-indigo-400 hover:text-indigo-300">
                                <i class="fa-solid fa-copy mr-1"></i>复制
                            </button>
                            <button @click="exportExploration" class="text-sm text-indigo-400 hover:text-indigo-300">
                                <i class="fa-solid fa-download mr-1"></i>导出
                            </button>
                        </div>
                    </div>
                    <div class="prose prose-invert max-w-none" v-html="renderMarkdown(exploration)"></div>
                </div>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" @click="showSettings = false">
            <div class="bg-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl p-6 border-2 border-indigo-500" @click.stop>
                <h3 class="text-xl font-bold mb-4 text-white">高级设置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-2 text-indigo-200">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-2 border-indigo-500 p-3 bg-slate-700 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-indigo-200">系统提示词</label>
                        <textarea v-model="apiConfig.systemPrompt" rows="12" class="w-full rounded-lg border-2 border-indigo-500 p-3 font-mono text-sm bg-slate-700 text-white"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-6 py-2 rounded-lg hover:bg-slate-700 text-white">取消</button>
                    <button @click="saveConfig" class="bg-indigo-500 text-white px-6 py-2 rounded-lg hover:bg-indigo-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;

        // Markdown 渲染函数
        const renderMarkdown = (text) => {
            if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                return marked.parse(text || '');
            }
            return text || '';
        };

        const DEFAULT_SYSTEM_PROMPT = `你是一位存在主义心理学家和哲学导师，擅长引导人们探索人生意义。

**理论框架**：
1. **Viktor Frankl 意义疗法**：
   - 意义的三个来源：创造、体验、态度
   - 即使在苦难中也能找到意义
   - "那些有理由活着的人，几乎能承受任何境况"

2. **存在主义哲学**（Sartre, Camus）：
   - 存在先于本质 - 人是自由的
   - 荒谬与反抗
   - 创造自己的意义

3. **东方智慧**：
   - 佛教：无常、无我、慈悲
   - 道家：无为而治、顺应自然
   - 当下即是

4. **积极心理学**：
   - 意义 = 归属感 + 目的 + 叙事 + 超越

**探索方法**：
1. **意义来源分析**：
   - 创造性工作（事业、创作）
   - 爱与连接（关系）
   - 面对苦难的态度
   - 超越自我的体验

2. **人生叙事重构**：
   - 识别用户的"意义故事"
   - 看见苦难中的成长
   - 重新定义"成功"

3. **实存问题直面**：
   - 死亡焦虑 → 珍惜有限生命
   - 孤独感 → 独特存在的意义
   - 无意义感 → 创造意义的自由

**输出结构**：
# 🌟 你的意义探索报告

## 当前意义困境诊断
[分析用户触发探索的深层原因]

## 已存在的意义源泉
[从用户回答中发现的意义]

## 意义地图：四个维度
### 创造维度
[通过工作、创作、贡献获得的意义]

### 体验维度
[通过爱、美、真理获得的意义]

### 态度维度
[面对不可改变事物时的态度选择]

### 超越维度
[超越自我的体验和连接]

## 意义实践：三个练习
[具体可操作的意义培养练习]

## 存在主义智慧
[1-2 句相关的哲学洞见或诗句]

**风格**：深刻、温暖、不回避存在的苦难，但强调自由和希望。`;

        createApp({
            setup() {
                const showSettings = ref(false);
                const isGenerating = ref(false);
                const exploration = ref('');
                const apiConfig = reactive({ deepseek: '', model: 'deepseek-v4-pro', systemPrompt: DEFAULT_SYSTEM_PROMPT });
                const input = reactive({ stage: '探索期', trigger: '', pride: '', legacy: '', perspective: '整合' });

                onMounted(() => {
                    // 初始化配置
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            apiConfig.deepseek = config.deepseek || '';
                            apiConfig.model = config.model || 'deepseek-v4-pro';
                        } catch (e) {
                            console.error('解析 global_llm_config 失败:', e);
                        }
                    }
                });

                const saveConfig = () => {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                         console.error('解析 global_llm_config 失败:', e);
                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, deepseek: apiConfig.deepseek, model: apiConfig.model }));
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                const exploreMeaning = async () => {
                    if (!apiConfig.deepseek) { showSettings.value = true; return; }
                    isGenerating.value = true;
                    exploration.value = '';

                    try {
                        const userPrompt = `人生阶段：${input.stage}\n探索触发：${input.trigger}\n${input.pride ? `引以为傲：${input.pride}\n` : ''}${input.legacy ? `期望遗产：${input.legacy}\n` : ''}探索视角：${input.perspective}\n\n请帮我探索人生意义。`;

                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [{ role: 'system', content: apiConfig.systemPrompt }, { role: 'user', content: userPrompt }],
                                stream: true
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`API 请求失败: ${response.status} ${response.statusText}`);
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                    try {
                                        const data = JSON.parse(line.slice(6));
                                        const delta = data.choices[0].delta;
                                        if (delta.content) exploration.value += delta.content;
                                    } catch (e) {}
                                }
                            }
                        }
                    } catch (error) {
                        alert('生成失败：' + error.message);
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyExploration = async () => {
                    await navigator.clipboard.writeText(exploration.value);
                    alert('已复制到剪贴板！');
                };

                const exportExploration = () => {
                    const text = `【人生意义探索报告】\n生成时间：${new Date().toLocaleString()}\n\n${exploration.value}`;
                    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `意义探索_${Date.now()}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                };

                return {
                    showSettings, isGenerating, exploration, apiConfig, input, saveConfig, exploreMeaning, copyExploration, exportExploration, renderMarkdown };
            }
        }).mount('#app');
    </script>
