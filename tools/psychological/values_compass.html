<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>价值观罗盘 - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .compass-gradient { background: linear-gradient(135deg, #DBEAFE 0%, #BFDBFE 50%, #93C5FD 100%); }
        .compass-card { background: linear-gradient(135deg, #ffffff 0%, #EFF6FF 100%); border: 2px solid #60A5FA; }
        @keyframes compass-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .compass-animation { animation: compass-spin 2s linear infinite; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="compass-gradient min-h-screen">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b-2 border-blue-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-compass text-white text-xl"></i>
                        </div>
                        <span class="font-bold text-xl text-slate-900">价值观罗盘</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 bg-blue-100 rounded-lg p-1">
                            <button @click="apiConfig.model = 'deepseek-v4-flash'" :class="{'bg-white shadow text-blue-600': apiConfig.model === 'deepseek-v4-flash'}" class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="apiConfig.model = 'deepseek-v4-pro'" :class="{'bg-white shadow text-blue-600': apiConfig.model === 'deepseek-v4-pro'}" class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true" class="text-blue-600 hover:text-blue-700 transition"><i class="fa-solid fa-gear"></i></button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow max-w-4xl mx-auto w-full p-4 space-y-6">
            <div class="compass-card rounded-2xl p-6 shadow-lg">
                <h2 class="text-lg font-bold mb-4">价值观探索</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">从以下领域中选择 3-5 个最重要的（按重要性排序）</label>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-3">
                            <label v-for="value in valueOptions" :key="value" class="flex items-center gap-2 p-2 border-2 rounded-lg cursor-pointer hover:bg-blue-50" :class="{'border-blue-500 bg-blue-50': input.selectedValues.includes(value)}">
                                <input type="checkbox" :value="value" v-model="input.selectedValues" class="w-4 h-4">
                                <span class="text-sm">{{ value }}</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">当前困境或决策（可选）</label>
                        <textarea v-model="input.dilemma" placeholder="例如：换工作 vs 稳定现状；追求事业 vs 照顾家庭；..." rows="2" class="w-full bg-white border-2 border-blue-200 rounded-lg p-3"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">你希望获得什么指引？</label>
                        <select v-model="input.goal" class="w-full bg-white border-2 border-blue-200 rounded-lg p-3">
                            <option value="澄清价值观">澄清核心价值观</option>
                            <option value="决策指导">基于价值观的决策指导</option>
                            <option value="行为对齐">检查行为与价值观的对齐度</option>
                            <option value="冲突解决">解决价值观冲突</option>
                        </select>
                    </div>
                </div>
                <button @click="generateCompass" :disabled="isGenerating || input.selectedValues.length < 3" class="w-full mt-4 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold py-3 rounded-xl hover:shadow-lg transition disabled:opacity-50">
                    <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin mr-2"></i>
                    <i v-else class="fa-solid fa-wand-magic-sparkles mr-2"></i>生成价值观罗盘
                </button>
            </div>

            <div v-if="isGenerating" class="compass-card rounded-2xl p-12 shadow-lg flex flex-col items-center">
                <i class="fa-solid fa-compass text-6xl mb-4 text-blue-600 compass-animation"></i>
                <p class="text-lg font-medium text-blue-600">正在校准价值观罗盘...</p>
            </div>

            <div v-else-if="result" class="compass-card rounded-2xl p-6 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold">你的价值观罗盘</h3>
                    <button @click="copyResult" class="text-sm text-blue-600 hover:text-blue-700">
                        <i class="fa-solid fa-copy mr-1"></i>复制
                    </button>
                </div>
                <div class="prose max-w-none" v-html="marked.parse(result)"></div>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" @click="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6" @click.stop>
                <h3 class="text-xl font-bold mb-4">高级设置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-2 p-3">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">系统提示词</label>
                        <textarea v-model="apiConfig.systemPrompt" rows="12" class="w-full rounded-lg border-2 p-3 font-mono text-sm"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-6 py-2 rounded-lg hover:bg-slate-100">取消</button>
                    <button @click="saveConfig" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;

        // Markdown 渲染函数
        const renderMarkdown = (text) => {
            if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                return marked.parse(text || '');
            }
            return text || '';
        };

        const DEFAULT_SYSTEM_PROMPT = `你是一位 ACT（接纳承诺疗法）心理学家，擅长帮助人们澄清价值观并据此生活。

**理论基础**：
- 价值观是我们希望成为什么样的人、如何行动的深层指引
- 价值观不是目标（可达成），而是方向（持续追求）
- 价值观冲突是正常的，关键是觉察和选择
- 基于价值观的行动带来意义感和生命活力

**分析框架**：
1. **价值观澄清**：
   - 识别用户选择的价值观背后的深层需求
   - 区分"真实价值观"vs"社会期待"
   - 探索价值观的个人意义

2. **价值观层级**：
   - 分析用户排序背后的优先级
   - 识别核心价值观（1-3 个）
   - 探索不同价值观之间的关系

3. **行为对齐检查**：
   - 评估当前生活与价值观的一致性
   - 识别价值观与行为的脱节
   - 提供具体的"价值观导向行动"建议

4. **冲突解决**：
   - 如果存在困境，分析不同选择与价值观的关系
   - 提供"两者兼顾"的创造性方案
   - 强调：没有完美选择，只有更一致的选择

**输出结构**：
# 🧭 你的价值观罗盘

## 核心价值观（Top 3）
[详细阐述每个价值观对用户的意义]

## 价值观地图
[可视化描述价值观之间的关系]

## 当前对齐度检查
- ✅ 已对齐的行为：[...]
- ⚠️ 需要调整的领域：[...]

## 价值观导向行动清单
[10-15 个具体的小行动，每个行动对应一个价值观]

## 基于价值观的决策建议（仅当用户提供困境时需要）
如果用户提供了当前困境，请分析不同选择与价值观的关系，提供"两者兼顾"的创造性方案或建议更一致的选择。

## 价值观日记提示
[3-5 个反思问题，帮助持续觉察]

**风格**：温暖、不评判、赋能，强调价值观没有对错，只有适合与否。`;

        createApp({
            setup() {

                const showSettings = ref(false);
                const isGenerating = ref(false);
                const result = ref('');
                const apiConfig = reactive({ deepseek: '', model: 'deepseek-v4-pro', systemPrompt: DEFAULT_SYSTEM_PROMPT });
                const input = reactive({ selectedValues: [], dilemma: '', goal: '澄清价值观' });
                const valueOptions = ref(['家庭', '事业成就', '亲密关系', '友谊', '健康', '学习成长', '创造力', '冒险探索', '稳定安全', '财务自由', '社会贡献', '精神信仰', '美与艺术', '正义公平', '独立自主', '归属感']);

                onMounted(() => {
                    // 初始化配置
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            apiConfig.deepseek = config.deepseek || '';
                            apiConfig.model = config.model || 'deepseek-v4-pro';
                        } catch (e) {
                            console.error('JSON parse error:', e);
                        }
                    }
                });

                const saveConfig = () => {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                         console.error('JSON parse error:', e);
                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, deepseek: apiConfig.deepseek, model: apiConfig.model }));
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                const generateCompass = async () => {
                    if (!apiConfig.deepseek) { showSettings.value = true; return; }
                    isGenerating.value = true;
                    result.value = '';

                    try {
                        const userPrompt = `我选择的价值观（按重要性排序）：${input.selectedValues.join('、')}\n${input.dilemma ? `当前困境：${input.dilemma}\n` : ''}目标：${input.goal}\n\n请帮我生成价值观罗盘和行动指南。`;

                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [{ role: 'system', content: apiConfig.systemPrompt }, { role: 'user', content: userPrompt }],
                                stream: true
                            })
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || `API 请求失败: ${response.status}`);
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                    try {
                                        const data = JSON.parse(line.slice(6));
                                        const delta = data.choices[0].delta;
                                        if (delta.content) result.value += delta.content;
                                    } catch (e) {
                                        console.error('Stream parse error:', e);
                                    }
                                }
                            }
                        }
                    } catch (error) {
                        alert('生成失败：' + error.message);
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyResult = async () => {
                    await navigator.clipboard.writeText(result.value);
                    alert('已复制到剪贴板！');
                };

                return {
                    showSettings, isGenerating, result, apiConfig, input, valueOptions, saveConfig, generateCompass, copyResult, renderMarkdown };
            }
        }).mount('#app');
    </script>
