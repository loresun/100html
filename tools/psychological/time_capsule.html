<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生时间胶囊 - AI心理工具</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        [v-cloak] { display: none; }
        .prose { max-width: none; }
        .prose h1, .prose h2, .prose h3 { color: #7c3aed; font-weight: bold; margin-top: 1.5rem; }
        .prose p { margin: 1rem 0; line-height: 1.75; }
        .prose ul, .prose ol { margin: 1rem 0; padding-left: 2rem; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 via-violet-50 to-indigo-50 min-h-screen">
    <div id="app" v-cloak>
        <!-- 导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                    <i class="fa-solid fa-box-archive text-purple-600 text-2xl"></i>
                    <span class="font-bold text-xl text-slate-900">人生时间胶囊</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-100 rounded-lg">
                        <button
                            @click="apiConfig.model = 'deepseek-v4-flash'"
                            :class="apiConfig.model === 'deepseek-v4-flash' ? 'bg-purple-600 text-white' : 'bg-white text-slate-600'"
                            class="px-3 py-1 rounded text-sm font-medium transition-all"
                        >V4 Flash</button>
                        <button
                            @click="apiConfig.model = 'deepseek-v4-pro'"
                            :class="apiConfig.model === 'deepseek-v4-pro' ? 'bg-purple-600 text-white' : 'bg-white text-slate-600'"
                            class="px-3 py-1 rounded text-sm font-medium transition-all"
                        >V4 Pro</button>
                    </div>
                    <button @click="showSettings = true" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                        <i class="fa-solid fa-gear text-slate-600 text-lg"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 左侧输入区 -->
                <div class="space-y-6">
                    <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-envelope text-purple-600"></i>
                            写给未来的自己
                        </h2>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">时间维度</label>
                                <select v-model="formData.timeframe" class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-purple-500">
                                    <option value="1month">1个月后</option>
                                    <option value="1year">1年后</option>
                                    <option value="5years">5年后</option>
                                    <option value="10years">10年后</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">当前状态</label>
                                <textarea
                                    v-model="formData.currentState"
                                    rows="4"
                                    placeholder="描述你现在的生活状态、心情、正在做的事..."
                                    class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-purple-500"
                                ></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">未来期望</label>
                                <textarea
                                    v-model="formData.futureGoals"
                                    rows="4"
                                    placeholder="你希望未来的自己是什么样子？达成什么目标？"
                                    class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-purple-500"
                                ></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">想说的话</label>
                                <textarea
                                    v-model="formData.message"
                                    rows="4"
                                    placeholder="你想对未来的自己说些什么？鼓励、提醒、嘱咐..."
                                    class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-purple-500"
                                ></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">成就检验（可选）</label>
                                <input
                                    v-model="formData.milestone"
                                    type="text"
                                    placeholder="如果达成XX目标，就..."
                                    class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-purple-500"
                                />
                            </div>

                            <button
                                @click="generate"
                                :disabled="isLoading || !canGenerate"
                                class="w-full bg-purple-600 text-white py-3 rounded-xl font-medium hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2"
                            >
                                <i v-if="isLoading" class="fa-solid fa-spinner fa-spin"></i>
                                <i v-else class="fa-solid fa-wand-magic-sparkles"></i>
                                <span>{{ isLoading ? '生成中...' : '生成时间胶囊' }}</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 右侧结果区 -->
                <div class="space-y-6">
                    <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-200 min-h-[600px]">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                                <i class="fa-solid fa-scroll text-purple-600"></i>
                                时间胶囊
                            </h2>
                            <div v-if="result" class="flex gap-2">
                                <button @click="copyResult" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                                    <i class="fa-solid fa-copy text-slate-600"></i>
                                </button>
                                <button @click="exportResult" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                                    <i class="fa-solid fa-download text-slate-600"></i>
                                </button>
                            </div>
                        </div>

                        <div v-if="!result && !isLoading" class="flex flex-col items-center justify-center h-96 text-slate-400">
                            <i class="fa-solid fa-box-archive text-6xl mb-4 opacity-50"></i>
                            <p class="text-center">填写信息后生成时间胶囊<br/>写给未来的自己</p>
                        </div>

                        <div v-if="isLoading" class="flex flex-col items-center justify-center h-96">
                            <i class="fa-solid fa-spinner fa-spin text-5xl text-purple-600 mb-4"></i>
                            <p class="text-slate-600">正在封存时间胶囊...</p>
                        </div>

                        <div v-if="reasoningContent" class="mb-4">
                            <details class="bg-slate-50 rounded-lg p-4">
                                <summary class="cursor-pointer text-sm font-medium text-slate-600 flex items-center gap-2">
                                    <i class="fa-solid fa-brain"></i>
                                    深度思考过程 (点击展开)
                                </summary>
                                <div class="mt-2 text-sm text-slate-700 whitespace-pre-wrap">{{ reasoningContent }}</div>
                            </details>
                        </div>

                        <div v-if="result" class="prose prose-slate max-w-none" v-html="marked.parse(result)"></div>

                        <div v-if="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-700">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-circle-exclamation"></i>
                                <span>{{ errorMessage }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" @click.self="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold text-slate-900">API 配置</h3>
                    <button @click="showSettings = false" class="p-2 hover:bg-slate-100 rounded-lg">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">DeepSeek API Key</label>
                        <input
                            type="password"
                            v-model="apiConfig.deepseek"
                            placeholder="sk-..."
                            class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-purple-500"
                        />
                        <p class="mt-1 text-xs text-slate-500">获取地址: <a href="https://platform.deepseek.com" target="_blank" class="text-purple-600 hover:underline">platform.deepseek.com</a></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">模型选择</label>
                        <select v-model="apiConfig.model" class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-purple-500">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">系统提示词</label>
                        <textarea
                            v-model="apiConfig.systemPrompt"
                            rows="8"
                            class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-purple-500 font-mono text-sm"
                        ></textarea>
                        <p class="mt-1 text-xs text-slate-500">基于目标设定和自我反思</p>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                        取消
                    </button>
                    <button @click="saveConfig" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">
                        保存配置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;

        createApp({
            setup() {

                const showSettings = ref(false);
                const isLoading = ref(false);
                const result = ref('');
                const reasoningContent = ref('');
                const errorMessage = ref('');

                const formData = reactive({
                    timeframe: '1year',
                    currentState: '',
                    futureGoals: '',
                    message: '',
                    milestone: ''
                });

                const apiConfig = reactive({
                    deepseek: '',
                    model: 'deepseek-v4-flash',
                    systemPrompt: `你是一位温柔的生活导师和目标规划专家。

你的任务是帮助用户创建一封写给未来自己的时间胶囊信。

信件结构：
1. **时间锚点**：标注写信日期和预期打开日期
2. **此刻的我**：记录当前的状态、心情、环境
3. **对未来的期待**：描绘期望达成的目标和变化
4. **给未来的你**：鼓励、提醒、嘱咐
5. **成就检验**：如果用户设置了里程碑，提供检验框架
6. **预测变化**：基于时间维度，预测可能的成长和挑战

语气要求：
- 温暖、鼓励、真诚
- 既有理想主义，也有现实考量
- 帮助用户看到成长的可能性

特殊处理：
- 1个月：聚焦短期目标和习惯养成
- 1年：平衡理想与现实，设置季度里程碑
- 5年/10年：宏大视角，人生阶段性变化

输出格式：使用Markdown，文学性强，富有情感。`
                });

                const canGenerate = computed(() => {
                    return formData.currentState && formData.futureGoals;
                });

                async function generate() {
                    if (!apiConfig.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isLoading.value = true;
                    result.value = '';
                    reasoningContent.value = '';
                    errorMessage.value = '';

                    const timeframeMap = {
                        '1month': '1个月后',
                        '1year': '1年后',
                        '5years': '5年后',
                        '10years': '10年后'
                    };

                    const today = new Date().toLocaleDateString('zh-CN');

                    const userPrompt = `请帮我创建一封写给未来自己的时间胶囊信：

**写信日期**：${today}
**时间维度**：${timeframeMap[formData.timeframe]}

**当前状态**：
${formData.currentState}

**未来期望**：
${formData.futureGoals}

**想说的话**：
${formData.message || '（暂无）'}

**成就检验**：
${formData.milestone || '（暂无）'}

请创建一封温暖、鼓励、富有远见的时间胶囊信。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [
                                    { role: 'system', content: apiConfig.systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                stream: true,
                                temperature: 0.8
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`API 请求失败: ${response.status}`);
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const parsed = JSON.parse(data);
                                        const delta = parsed.choices[0].delta;

                                        if (delta.reasoning_content) {
                                            reasoningContent.value += delta.reasoning_content;
                                        }

                                        if (delta.content) {
                                            result.value += delta.content;
                                        }
                                    } catch (e) {
                                        console.error('解析错误:', e);
                                    }
                                }
                            }
                        }
                    } catch (error) {
                        console.error('生成失败:', error);
                        errorMessage.value = error.message || '生成失败，请重试';
                    } finally {
                        isLoading.value = false;
                    }
                }

                async function copyResult() {
                    try {
                        let text = result.value;
                        if (reasoningContent.value) {
                            text = `=== 思考过程 ===\n\n${reasoningContent.value}\n\n=== 时间胶囊 ===\n\n${text}`;
                        }
                        await navigator.clipboard.writeText(text);
                        alert('已复制到剪贴板');
                    } catch (err) {
                        console.error('复制失败:', err);
                    }
                }

                function exportResult() {
                    let content = '';
                    if (reasoningContent.value) {
                        content += '=== 思考过程 ===\n\n' + reasoningContent.value + '\n\n';
                    }
                    content += '=== 时间胶囊 ===\n\n' + result.value;

                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = '时间胶囊.txt';
                    a.click();
                    URL.revokeObjectURL(url);
                }

                function saveConfig() {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...current,
                        deepseek: apiConfig.deepseek,
                        model: apiConfig.model
                    }));
                    showSettings.value = false;
                    alert('配置已保存');
                }

                function loadConfig() {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        const config = JSON.parse(saved);
                        if (config.deepseek) apiConfig.deepseek = config.deepseek;
                        if (config.model) apiConfig.model = config.model;
                    }
                }

                onMounted(() => {
                    loadConfig();
                });

                return {
                    showSettings,
                    isLoading,
                    result,
                    reasoningContent,
                    errorMessage,
                    formData,
                    apiConfig,
                    canGenerate,
                    generate,
                    copyResult,
                    exportResult,
                    saveConfig,
                    marked
                };
            }
        }).mount('#app');
    </script>
