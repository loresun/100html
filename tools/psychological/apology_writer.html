<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道歉信生成器 - AI心理工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        [v-cloak] {
            display: none;
        }

        .prose {
            max-width: none;
        }

        .prose h1,
        .prose h2,
        .prose h3 {
            color: #1e40af;
            font-weight: bold;
            margin-top: 1.5rem;
        }

        .prose p {
            margin: 1rem 0;
            line-height: 1.75;
        }

        .prose ul,
        .prose ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-slate-50 min-h-screen">
    <div id="app" v-cloak>
        <!-- 导航栏 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                    <i class="fa-solid fa-hand-holding-heart text-blue-600 h-6 w-6"></i>
                    <span class="font-bold text-xl text-slate-900">道歉信生成器</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-100 rounded-lg">
                        <button @click="apiConfig.model = 'deepseek-v4-flash'"
                            :class="apiConfig.model === 'deepseek-v4-flash' ? 'bg-blue-600 text-white' : 'bg-white text-slate-600'"
                            class="px-3 py-1 rounded text-sm font-medium transition-all">V4 Flash</button>
                        <button @click="apiConfig.model = 'deepseek-v4-pro'"
                            :class="apiConfig.model === 'deepseek-v4-pro' ? 'bg-blue-600 text-white' : 'bg-white text-slate-600'"
                            class="px-3 py-1 rounded text-sm font-medium transition-all">V4 Pro</button>
                    </div>
                    <button @click="showSettings = true" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                        <i class="fa-solid fa-gear w-5 h-5 text-slate-600"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 左侧输入区 -->
                <div class="space-y-6">
                    <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square w-5 h-5 text-blue-600"></i>
                            道歉信息
                        </h2>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">道歉场景</label>
                                <select v-model="formData.scenario"
                                    class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-blue-500">
                                    <option value="lover">对恋人</option>
                                    <option value="parent">对父母</option>
                                    <option value="friend">对朋友</option>
                                    <option value="colleague">对同事</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">语气风格</label>
                                <select v-model="formData.tone"
                                    class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-blue-500">
                                    <option value="formal">正式</option>
                                    <option value="intimate">亲密</option>
                                    <option value="casual">轻松</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">具体错误</label>
                                <textarea v-model="formData.mistake" rows="4" placeholder="描述你做错了什么事情..."
                                    class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">对方感受</label>
                                <textarea v-model="formData.feelings" rows="3" placeholder="对方可能的感受（受伤、失望、愤怒等）..."
                                    class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">你的反思</label>
                                <textarea v-model="formData.reflection" rows="3" placeholder="你对此事的反思和认识..."
                                    class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>

                            <button @click="generate" :disabled="isLoading || !canGenerate"
                                class="w-full bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2">
                                <i v-if="isLoading" class="fa-solid fa-spinner animate-spin w-5 h-5"></i>
                                <i v-else class="fa-solid fa-paper-plane w-5 h-5"></i>
                                <span>{{ isLoading ? '生成中...' : '生成道歉信' }}</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 右侧结果区 -->
                <div class="space-y-6">
                    <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-200 min-h-[600px]">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                                <i class="fa-solid fa-file-lines w-5 h-5 text-blue-600"></i>
                                生成结果
                            </h2>
                            <div v-if="result" class="flex gap-2">
                                <button @click="copyResult" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                                    <i class="fa-solid fa-copy w-4 h-4 text-slate-600"></i>
                                </button>
                                <button @click="exportResult"
                                    class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                                    <i class="fa-solid fa-download w-4 h-4 text-slate-600"></i>
                                </button>
                            </div>
                        </div>

                        <div v-if="!result && !isLoading"
                            class="flex flex-col items-center justify-center h-96 text-slate-400">
                            <i class="fa-solid fa-hand-holding-heart w-16 h-16 mb-4 opacity-50"></i>
                            <p class="text-center">填写信息后点击生成<br />基于非暴力沟通（NVC）框架</p>
                        </div>

                        <div v-if="isLoading" class="flex flex-col items-center justify-center h-96">
                            <i class="fa-solid fa-spinner w-12 h-12 text-blue-600 animate-spin mb-4"></i>
                            <p class="text-slate-600">正在生成道歉信...</p>
                        </div>

                        <div v-if="reasoningContent" class="mb-4">
                            <details class="bg-slate-50 rounded-lg p-4">
                                <summary
                                    class="cursor-pointer text-sm font-medium text-slate-600 flex items-center gap-2">
                                    <i class="fa-solid fa-brain w-4 h-4"></i>
                                    深度思考过程 (点击展开)
                                </summary>
                                <div class="mt-2 text-sm text-slate-700 whitespace-pre-wrap">{{ reasoningContent }}
                                </div>
                            </details>
                        </div>

                    <div v-if="result" class="prose prose-slate max-w-none" v-html="marked.parse(result)"></div>

                    <div v-if="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-700">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-circle-exclamation w-5 h-5"></i>
                            <span>{{ errorMessage }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"
        @click.self="showSettings = false">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-slate-900">API 配置</h3>
                <button @click="showSettings = false" class="p-2 hover:bg-slate-100 rounded-lg">
                    <i class="fa-solid fa-xmark w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">DeepSeek API Key</label>
                    <input type="password" v-model="apiConfig.apiKey" placeholder="sk-..."
                        class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-blue-500" />
                    <p class="mt-1 text-xs text-slate-500">获取地址: <a href="https://platform.deepseek.com" target="_blank"
                            class="text-blue-600 hover:underline">platform.deepseek.com</a></p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">模型选择</label>
                    <select v-model="apiConfig.model"
                        class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-blue-500">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">系统提示词</label>
                    <textarea v-model="apiConfig.systemPrompt" rows="8"
                        class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-blue-500 font-mono text-sm"></textarea>
                    <p class="mt-1 text-xs text-slate-500">基于非暴力沟通（NVC）框架</p>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-3">
                <button @click="showSettings = false"
                    class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                    取消
                </button>
                <button @click="saveConfig"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                    保存配置
                </button>
            </div>
        </div>
    </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;

        createApp({
            setup() {
                // renderIcon removed

                const showSettings = ref(false);
                const isLoading = ref(false);
                const result = ref('');
                const reasoningContent = ref('');
                const errorMessage = ref('');

                const formData = reactive({
                    scenario: 'lover',
                    tone: 'intimate',
                    mistake: '',
                    feelings: '',
                    reflection: ''
                });

                const apiConfig = reactive({
                    apiKey: '', // 统一使用 apiKey
                    model: 'deepseek-v4-flash',
                    systemPrompt: `你是一位专业的心理咨询师和沟通专家，精通非暴力沟通（NVC）框架。

你的任务是帮助用户撰写真诚、有效的道歉信。道歉信应该遵循以下结构：

1. **承认错误**：明确说出具体做错了什么，不推卸责任
2. **理解感受**：体察并表达对对方感受的理解和共情
3. **承担责任**：说明自己对此事的反思和认识
4. **补救措施**：提出具体的改进行动和承诺

注意事项：
- 避免使用"但是"等转折词，不要为错误找借口
- 真诚表达，不要过度煽情或虚假
- 根据场景和语气调整措辞
- 对恋人：更亲密、情感化
- 对父母：更尊重、感恩
- 对朋友：更真诚、平等
- 对同事：更专业、得体

输出格式：使用Markdown格式，包含标题和分段结构。`
                });

                // SVG icons dictionary removed

                const canGenerate = computed(() => {
                    return formData.mistake && formData.feelings && formData.reflection;
                });

                /**
                 * 生成道歉信的主逻辑
                 */
                async function generate() {
                    if (!apiConfig.apiKey) {
                        showSettings.value = true;
                        return;
                    }

                    isLoading.value = true;
                    result.value = '';
                    reasoningContent.value = '';
                    errorMessage.value = '';

                    const scenarioMap = {
                        lover: '恋人',
                        parent: '父母',
                        friend: '朋友',
                        colleague: '同事'
                    };

                    const toneMap = {
                        formal: '正式',
                        intimate: '亲密',
                        casual: '轻松'
                    };

                    const userPrompt = `请帮我撰写一封道歉信：

**道歉对象**：${scenarioMap[formData.scenario]}
**语气风格**：${toneMap[formData.tone]}

**具体错误**：
${formData.mistake}

**对方感受**：
${formData.feelings}

**我的反思**：
${formData.reflection}

请基于非暴力沟通（NVC）框架，撰写一封真诚、有效的道歉信。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.apiKey}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [
                                    { role: 'system', content: apiConfig.systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                stream: true,
                                temperature: 0.7
                            })
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || `API 请求失败: ${response.status}`);
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const parsed = JSON.parse(data);
                                        const delta = parsed.choices[0].delta;

                                        if (delta.reasoning_content) {
                                            reasoningContent.value += delta.reasoning_content;
                                        }

                                        if (delta.content) {
                                            result.value += delta.content;
                                        }
                                    } catch (e) {
                                        console.error('流解析错误:', e);
                                    }
                                }
                            }
                        }
                    } catch (error) {
                        console.error('生成失败:', error);
                        errorMessage.value = error.message || '生成失败，请重试';
                    } finally {
                        isLoading.value = false;
                    }
                }

                /**
                 * 复制生成结果
                 */
                async function copyResult() {
                    try {
                        let text = result.value;
                        if (reasoningContent.value) {
                            text = `=== 思考过程 ===\n\n${reasoningContent.value}\n\n=== 道歉信 ===\n\n${text}`;
                        }
                        await navigator.clipboard.writeText(text);
                        alert('已复制到剪贴板');
                    } catch (err) {
                        console.error('复制失败:', err);
                        alert('复制失败，请手动选择复制');
                    }
                }

                /**
                 * 导出为文本文件
                 */
                function exportResult() {
                    let content = '';
                    if (reasoningContent.value) {
                        content += '=== 思考过程 ===\n\n' + reasoningContent.value + '\n\n';
                    }
                    content += '=== 道歉信 ===\n\n' + result.value;

                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `道歉信_${new Date().toLocaleDateString()}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                }

                /**
                 * 保存配置到本地存储
                 */
                function saveConfig() {
                    try {
                        const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                        localStorage.setItem('global_llm_config', JSON.stringify({
                            ...current,
                            apiKey: apiConfig.apiKey,
                            deepseek: apiConfig.apiKey, // 兼容旧版本
                            model: apiConfig.model
                        }));
                        showSettings.value = false;
                        alert('配置已保存');
                    } catch (e) {
                        console.error('保存配置失败:', e);
                        alert('保存失败，请检查浏览器存储权限');
                    }
                }

                /**
                 * 从本地存储加载配置
                 */
                function loadConfig() {
                    try {
                        const saved = localStorage.getItem('global_llm_config');
                        if (saved) {
                            const config = JSON.parse(saved);
                            // 按照优先级尝试读取 API Key
                            apiConfig.apiKey = config.apiKey || config.deepseek || config.deepseek_key || '';
                            if (config.model) apiConfig.model = config.model;
                        }
                    } catch (e) {
                        console.error('加载配置失败:', e);
                    }
                }

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // lucide.createIcons();
                    loadConfig();
                });

                return {
                    showSettings,
                    isLoading,
                    result,
                    reasoningContent,
                    errorMessage,
                    formData,
                    apiConfig,
                    canGenerate,
                    generate,
                    copyResult,
                    exportResult,
                    saveConfig,
                    marked
                };
            }
        }).mount('#app');
    </script>

</html>
