    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焦虑解压对话机器人 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* 平静的蓝绿色主题 */
        .calm-gradient {
            background: linear-gradient(135deg, #E0F2FE 0%, #DBEAFE 50%, #D1FAE5 100%);
        }

        .calm-card {
            background: linear-gradient(135deg, #ffffff 0%, #F0F9FF 100%);
            border: 2px solid #BFDBFE;
        }

        /* 呼吸动画 */
        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        .breathe-circle {
            animation: breathe 4s ease-in-out infinite;
        }

        /* 消息气泡 */
        .message-user {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            color: white;
        }

        .message-ai {
            background: linear-gradient(135deg, #F0F9FF 0%, #DBEAFE 100%);
            color: #1e293b;
            border: 1px solid #BFDBFE;
        }

        /* 打字动画 */
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #60A5FA;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-10px);
            }
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #F0F9FF;
        }

        ::-webkit-scrollbar-thumb {
            background: #60A5FA;
            border-radius: 3px;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="calm-gradient min-h-screen text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- 顶部导航 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b-2 border-blue-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                        <div
                            class="w-10 h-10 bg-gradient-to-br from-blue-400 to-cyan-500 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-comment-medical text-white h-5 w-5"></i>
                        </div>
                        <div>
                            <span class="font-bold text-xl text-slate-900">焦虑解压对话</span>
                            <span class="hidden sm:inline text-xs text-blue-600 ml-2">Anxiety Relief Chat</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <!-- 模式选择 -->
                        <select v-model="chatMode" @change="switchMode"
                            class="text-sm bg-blue-50 border-2 border-blue-200 rounded-lg px-3 py-1 font-medium text-blue-700 outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="cbt">CBT 认知疗法</option>
                            <option value="listen">纯倾听模式</option>
                            <option value="sos">紧急 SOS</option>
                        </select>
                        <!-- V4 Flash/V4 Pro 切换器 -->
                        <div class="flex items-center gap-2 bg-blue-100 rounded-lg p-1">
                            <button @click="apiConfig.model = 'deepseek-v4-flash'"
                                :class="{'bg-white shadow text-blue-600': apiConfig.model === 'deepseek-v4-flash', 'text-blue-400': apiConfig.model !== 'deepseek-v4-flash'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="apiConfig.model = 'deepseek-v4-pro'"
                                :class="{'bg-white shadow text-blue-600': apiConfig.model === 'deepseek-v4-pro', 'text-blue-400': apiConfig.model !== 'deepseek-v4-pro'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true"
                            class="text-blue-600 hover:text-blue-700 transition flex items-center gap-1 text-sm font-medium">
                            <i class="fa-solid fa-gear h-4 w-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="flex-grow flex flex-col max-w-4xl mx-auto w-full p-4">
            <!-- 模式说明卡片 -->
            <div class="calm-card rounded-2xl p-4 shadow-md mb-4">
                <div class="flex items-start gap-3">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
                        <i :class="['fa-solid', 'fa-' + modeInfo.icon, 'text-blue-600 h-5 w-5']"></i>
                    </div>
                    <div class="flex-grow">
                        <h3 class="font-bold text-slate-900 mb-1">{{ modeInfo.title }}</h3>
                        <p class="text-sm text-slate-600">{{ modeInfo.description }}</p>
                    </div>
                    <button v-if="chatMode === 'sos'" @click="showBreathingExercise = true"
                        class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-600 transition flex items-center gap-1">
                        <i class="fa-solid fa-wind w-4 h-4"></i>
                        呼吸练习
                    </button>
                </div>
            </div>

            <!-- 对话区域 -->
            <div class="calm-card rounded-2xl flex-grow flex flex-col shadow-lg overflow-hidden">
                <!-- 消息列表 -->
                <div ref="messageContainer" class="flex-grow overflow-y-auto p-6 space-y-4">
                    <!-- 欢迎消息 -->
                    <div v-if="messages.length === 0" class="text-center py-12">
                        <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-handshake-angle text-blue-500 w-10 h-10"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-700 mb-2">我在这里陪伴你</h3>
                        <p class="text-slate-500 text-sm max-w-md mx-auto">
                            你可以和我分享任何让你感到焦虑的事情。<br>
                            我会倾听，理解，并帮助你找到内心的平静。
                        </p>
                    </div>

                    <!-- 消息气泡 -->
                    <div v-for="(msg, index) in messages" :key="index"
                        :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                        <div :class="msg.role === 'user' ? 'message-user' : 'message-ai'"
                            class="max-w-[80%] rounded-2xl px-4 py-3 shadow-sm">
                            <div v-if="msg.role === 'user'" class="text-sm">{{ msg.content }}</div>
                            <div v-else class="prose prose-sm prose-slate max-w-none"
                                v-html="marked.parse(msg.content)"></div>
                        </div>
                    </div>

                    <!-- 正在输入指示器 -->
                    <div v-if="isTyping" class="flex justify-start">
                        <div class="message-ai max-w-[80%] rounded-2xl px-4 py-3 shadow-sm">
                            <div class="typing-indicator flex items-center gap-1">
                                <span></span>
                                <span></span>
                                <span></span>

                        </div>
                    </div>
                </div>

                <div class="border-t-2 border-blue-100 p-4 bg-white/50">
                    <div class="flex gap-3">

                            placeholder="在这里分享你的感受..."
                            class="flex-grow bg-white border-2 border-blue-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-400 focus:border-transparent outline-none resize-none disabled:opacity-50"></textarea>
                        <button @click="sendMessage" :disabled="isTyping || !userInput.trim()"

                            <i class="fa-solid fa-paper-plane w-5 h-5"></i>

                    </div>
                    <div class="flex justify-between items-center mt-2 text-xs text-slate-500">

                        <div class="flex items-center gap-3">
                            <button @click="downloadChat" v-if="messages.length > 0"
                                class="hover:text-blue-600 transition flex items-center gap-1">
                                <i class="fa-solid fa-download w-3 h-3 inline"></i> 下载记录
                            </button>
                            <button @click="clearChat" class="hover:text-red-500 transition">
                                <i class="fa-solid fa-trash-can w-3 h-3 inline"></i> 清空对话
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 呼吸练习弹窗 -->
        <div v-if="showBreathingExercise" class="fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-4"
            @click="showBreathingExercise = false">
            <div class="bg-white rounded-3xl shadow-2xl p-12 max-w-md w-full text-center" @click.stop>
                <h3 class="text-2xl font-bold text-slate-900 mb-6">4-7-8 呼吸法</h3>
                <div class="relative w-48 h-48 mx-auto mb-8">
                    <div
                        class="absolute inset-0 bg-gradient-to-br from-blue-400 to-cyan-400 rounded-full breathe-circle">

                    <div class="absolute inset-0 flex items-center justify-center">
                        <span class="text-3xl font-bold text-white">{{ breathingPhase }}</span>

                </div>
                <div class="space-y-2 text-sm text-slate-600 mb-6">

                    <p>2️⃣ 屏息 7 秒</p>
                    <p>3️⃣ 呼气 8 秒</p>
                </div>
                <button @click="showBreathingExercise = false"
                    class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition">
                    完成
                </button>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"
            @click="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto" @click.stop>
                <div class="sticky top-0 bg-white border-b border-slate-200 p-6 rounded-t-2xl">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-slate-900">高级设置</h3>
                        <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                            <i class="fa-solid fa-xmark h-6 w-6"></i>
                        </button>
                    </div>
                </div>

                <div class="p-6 space-y-6">

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" placeholder="sk-..."

                    </div>

                    <!-- 模型选择 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">AI 模型</label>
                        <select v-model="apiConfig.model"

                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>

                    <!-- 各模式的系统提示词 -->
                    <div class="space-y-4">
                        <h4 class="font-bold text-slate-900 flex items-center gap-2">

                        </h4>

                        <!-- CBT 模式 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">CBT 认知疗法模式</label>
                            <textarea v-model="prompts.cbt" rows="4"
                                class="w-full rounded-lg border-2 border-slate-300 p-3 font-mono text-xs focus:ring-2 focus:ring-blue-400 outline-none resize-none"></textarea>
                        </div>

                        <!-- 倾听模式 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">纯倾听模式</label>
                            <textarea v-model="prompts.listen" rows="4"
                                class="w-full rounded-lg border-2 border-slate-300 p-3 font-mono text-xs focus:ring-2 focus:ring-blue-400 outline-none resize-none"></textarea>
                        </div>

                        <!-- SOS 模式 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">紧急 SOS 模式</label>
                            <textarea v-model="prompts.sos" rows="4"
                                class="w-full rounded-lg border-2 border-slate-300 p-3 font-mono text-xs focus:ring-2 focus:ring-blue-400 outline-none resize-none"></textarea>
                        </div>

                        <button @click="resetPrompts"
                            class="text-xs text-slate-600 hover:text-slate-800 flex items-center gap-1">
                            <i class="fa-solid fa-rotate-left w-3 h-3"></i>
                            恢复所有默认提示词
                        </button>
                    </div>
                </div>

                <div
                    class="sticky bottom-0 bg-slate-50 border-t border-slate-200 p-6 rounded-b-2xl flex justify-end gap-3">
                    <button @click="showSettings = false"
                        class="px-6 py-2 hover:bg-slate-100 rounded-lg text-slate-700 font-medium transition">
                        取消
                    </button>
                    <button @click="saveConfig"
                        class="bg-gradient-to-r from-blue-500 to-cyan-500 text-white px-6 py-2 rounded-lg hover:from-blue-600 hover:to-cyan-600 font-medium transition">
                        保存配置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, nextTick, onMounted, watch } = Vue;

        // 默认系统提示词
        const DEFAULT_PROMPTS = {
            cbt: `你是一位专业的认知行为治疗（CBT）咨询师，专门帮助用户应对焦虑。

你的对话策略：
1. **倾听与验证**：首先共情用户的感受，让他们感到被理解
2. **识别认知扭曲**：帮助识别灾难化思维、过度概括、黑白思维等认知偏差
3. **苏格拉底式提问**：通过温和的提问引导用户自己发现思维漏洞
   - "这个想法的证据是什么？"
   - "最坏的情况真的会发生吗？即使发生了，你能应对吗？"
4. **认知重构**：帮助建立更平衡、现实的思维方式
5. **行为建议**：提供具体的应对策略（如暴露疗法、放松技巧）

语言风格：
- 温暖、非评判、鼓励性
- 使用"我理解..."、"听起来..."这样的共情语言
- 避免直接否定用户的感受，而是引导他们重新审视

请保持对话简洁（每次回复 100-200 字），让用户有空间表达。`,

            listen: `你是一位温暖的倾听者，专注于为焦虑的用户提供情感支持。

你的角色定位：
- **纯倾听**：不急于给建议，先让用户充分表达
- **深度共情**：反映用户的情绪，让他们感到被看见、被理解
- **情感验证**：确认他们的感受是正常且合理的
- **温柔陪伴**：营造安全、不被评判的空间

回应方式：
1. 重复关键情绪词："听起来你感到很[焦虑/害怕/无助]..."
2. 开放性问题："能多说一些吗？"、"这对你意味着什么？"
3. 肯定表达："你能意识到这一点已经很了不起了"
4. 避免：
   - ❌ "你应该..."、"你不必..."（不要急于解决问题）
   - ❌ 对比他人（"别人也经历过..."）
   - ✅ 专注于用户当下的感受

保持温柔、耐心，让用户主导对话节奏。`,

            sos: `你是紧急心理危机干预专家，专门帮助正在经历急性焦虑发作的用户。

紧急情况识别：
- 如果用户提到自杀/自伤念头，立即建议拨打危机热线：
  - 全国心理援助热线：400-161-9995
  - 北京心理危机干预热线：010-82951332

快速干预策略（TIPP 技巧）：
1. **Temperature（温度）**：建议用冷水洗脸，刺激迷走神经
2. **Intense Exercise（剧烈运动）**：原地跑步、开合跳，释放肾上腺素
3. **Paced Breathing（呼吸调节）**：引导 4-7-8 呼吸法
4. **Paired Muscle Relaxation（渐进式肌肉放松）**

接地技巧（5-4-3-2-1 法）：
- 说出 5 样你能看到的东西
- 4 样能触摸的
- 3 样能听到的
- 2 样能闻到的
- 1 样能尝到的

语言风格：
- 简短、清晰、具体的指令
- 使用现在时："现在，深呼吸..."
- 提供选择："你可以试试 A 或 B"
- 强调"你是安全的"、"这会过去的"

优先稳定情绪，再处理深层问题。`
        };

        createApp({
            setup() {
                // renderIcon removed

                const showSettings = ref(false);
                const showBreathingExercise = ref(false);
                const isTyping = ref(false);
                const chatMode = ref('cbt');
                const userInput = ref('');
                const messages = ref([]);
                const messageContainer = ref(null);
                const breathingPhase = ref('准备');

                // API 配置
                const apiConfig = reactive({
                    deepseek: '',
                    model: 'deepseek-v4-pro'
                });

                // 各模式的系统提示词
                const prompts = reactive({
                    cbt: DEFAULT_PROMPTS.cbt,
                    listen: DEFAULT_PROMPTS.listen,
                    sos: DEFAULT_PROMPTS.sos
                });

                // 模式信息
                const modeInfo = computed(() => {
                    const modes = {
                        cbt: {
                            icon: 'brain',
                            title: 'CBT 认知行为疗法',
                            description: '通过识别和改变不合理的思维模式，帮助你应对焦虑'
                        },
                        listen: {
                            icon: 'ear-listen',
                            title: '纯倾听模式',
                            description: '我在这里倾听你的感受，不评判，不急于给建议'
                        },
                        sos: {
                            icon: 'truck-medical',
                            title: '紧急 SOS 模式',
                            description: '立即帮助你缓解急性焦虑，使用接地技巧和呼吸练习'
                        }
                    };
                    return modes[chatMode.value];
                });

                // 加载配置
                onMounted(() => {
                    // 初始化 Lucide 图标
                    // lucide.createIcons();
                    // 加载全局 LLM 配置
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            apiConfig.deepseek = config.deepseek || '';
                            apiConfig.model = config.model || 'deepseek-v4-pro';
                        } catch (e) {

                        }
                    }
                    // 加载自定义提示词
                    const savedPrompts = localStorage.getItem('anxiety_chat_prompts');
                    if (savedPrompts) {
                        try {
                            Object.assign(prompts, JSON.parse(savedPrompts));
                        } catch (e) {

                        }
                    }
                    // 加载保存的对话记录
                    const savedSession = localStorage.getItem('anxiety_chat_session');
                    if (savedSession) {
                        try {
                            const session = JSON.parse(savedSession);
                            messages.value = session.messages || [];
                            chatMode.value = session.chatMode || 'cbt';

                        } catch (e) {

                        }
                    }

                    // 呼吸练习动画
                    setInterval(() => {
                        if (showBreathingExercise.value) {
                            const phases = ['吸气 (4s)', '屏息 (7s)', '呼气 (8s)', '放松'];
                            const currentIndex = phases.indexOf(breathingPhase.value);
                            breathingPhase.value = phases[(currentIndex + 1) % phases.length];
                        }
                    }, 4000);
                });

                // 监听对话变化，自动保存到 localStorage
                watch([messages, chatMode], () => {
                    const session = {
                        messages: messages.value,
                        chatMode: chatMode.value,
                        lastUpdated: new Date().toISOString()
                    };
                    localStorage.setItem('anxiety_chat_session', JSON.stringify(session));
                }, { deep: true });

                // 保存配置
                const saveConfig = () => {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {

                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...current,
                        deepseek: apiConfig.deepseek,
                        model: apiConfig.model
                    }));
                    localStorage.setItem('anxiety_chat_prompts', JSON.stringify(prompts));
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                // 重置提示词
                const resetPrompts = () => {
                    if (confirm('确定要恢复所有默认提示词吗？')) {
                        Object.assign(prompts, DEFAULT_PROMPTS);
                    }
                };

                // 切换模式
                const switchMode = () => {
                    if (messages.value.length > 0) {
                        if (!confirm('切换模式会清空当前对话，确定继续吗？')) {
                            chatMode.value = chatMode.value; // 恢复
                            return;
                        }
                    }
                    clearChat();
                };

                // 清空对话（同时清除缓存）
                const clearChat = () => {
                    if (messages.value.length > 0 && !confirm('确定要清空所有对话记录吗？此操作不可恢复。')) {
                        return;
                    }
                    messages.value = [];
                    localStorage.removeItem('anxiety_chat_session');
                };

                // 下载对话记录
                const downloadChat = () => {
                    if (messages.value.length === 0) {
                        alert('没有对话记录可下载');
                        return;
                    }

                    // 格式化时间
                    const now = new Date();
                    const timestamp = now.toISOString().slice(0, 19).replace(/[T:]/g, '-');
                    const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
                    const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

                    // 获取模式名称
                    const modeNames = {
                        cbt: 'CBT 认知疗法',
                        listen: '纯倾听模式',
                        sos: '紧急 SOS 模式'
                    };
                    const modeName = modeNames[chatMode.value] || chatMode.value;

                    // 生成 Markdown 格式的对话记录
                    let markdown = `# 焦虑解压对话记录\n\n`;
                    markdown += `**日期**: ${dateStr} ${timeStr}\n`;
                    markdown += `**对话模式**: ${modeName}\n`;
                    markdown += `**AI 模型**: ${apiConfig.model}\n`;
                    markdown += `**消息数量**: ${messages.value.length} 条\n\n`;
                    markdown += `---\n\n`;

                    messages.value.forEach((msg, index) => {
                        const role = msg.role === 'user' ? '👤 我' : '🤖 AI 助手';
                        markdown += `### ${role}\n\n${msg.content}\n\n`;
                    });

                    markdown += `---\n\n*导出于 ${dateStr} ${timeStr}*\n`;

                    // 创建下载链接
                    const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `焦虑对话记录_${timestamp}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };

                // 发送消息
                const sendMessage = async () => {
                    if (!userInput.value.trim()) return;

                    if (!apiConfig.deepseek) {
                        alert('请先配置 DeepSeek API Key');
                        showSettings.value = true;
                        return;
                    }

                    const userMessage = userInput.value.trim();
                    userInput.value = '';

                    // 添加用户消息
                    messages.value.push({
                        role: 'user',
                        content: userMessage
                    });

                    // 滚动到底部
                    await nextTick();
                    scrollToBottom();

                    isTyping.value = true;

                    try {
                        // 构建对话历史
                        const chatHistory = messages.value.map(msg => ({
                            role: msg.role === 'user' ? 'user' : 'assistant',
                            content: msg.content
                        }));

                        // 流式请求
                        let response;
                        try {
                            response = await fetch('https://api.deepseek.com/chat/completions', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${apiConfig.deepseek}`
                                },
                                body: JSON.stringify({
                                    model: apiConfig.model,
                                    messages: [
                                        { role: 'system', content: prompts[chatMode.value] },
                                        ...chatHistory
                                    ],
                                    stream: true,
                                    temperature: 0.7
                                })
                            });
                        } catch (e) {
                            throw new Error(`网络请求失败: ${e.message}`);
                        }

                        if (!response.ok) {
                            throw new Error(`API 请求失败: ${response.status}`);
                        }

                        // 创建 AI 消息
                        const aiMessage = {
                            role: 'assistant',
                            content: ''
                        };
                        messages.value.push(aiMessage);

                        // 处理流式响应
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const parsed = JSON.parse(data);
                                        const delta = parsed.choices[0].delta;
                                        if (delta.content) {
                                            aiMessage.content += delta.content;
                                            await nextTick();
                                            scrollToBottom();
                                        }
                                    } catch (e) {

                                    }
                                }
                            }
                        }

                    } catch (error) {

                        alert('对话失败，请检查 API 配置或网络连接');
                        messages.value.pop(); // 移除失败的消息
                    } finally {
                        isTyping.value = false;
                    }
                };

                // 滚动到底部
                const scrollToBottom = () => {
                    if (messageContainer.value) {
                        messageContainer.value.scrollTop = messageContainer.value.scrollHeight;
                    }
                };

                return {
                    showSettings,
                    showBreathingExercise,
                    isTyping,
                    chatMode,
                    userInput,
                    messages,
                    messageContainer,
                    breathingPhase,
                    apiConfig,
                    prompts,
                    modeInfo,
                    saveConfig,
                    resetPrompts,
                    switchMode,
                    clearChat,
                    sendMessage,
                    downloadChat,
                    marked: window.marked
                };
            }
        }).mount('#app');
    </script>
