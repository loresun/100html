<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福感追踪器 - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .happiness-gradient {
            background: linear-gradient(135deg, #FEF9C3 0%, #FEF08A 50%, #FDE047 100%);
        }

        .happiness-card {
            background: linear-gradient(135deg, #ffffff 0%, #FEFCE8 100%);
            border: 2px solid #FACC15;
        }

        @keyframes sunshine {

            0%,
            100% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.1);
            }
        }

        .sunshine-animation {
            animation: sunshine 4s ease-in-out infinite;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="happiness-gradient min-h-screen">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b-2 border-yellow-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                        <div
                            class="w-10 h-10 bg-gradient-to-br from-yellow-400 to-amber-500 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-sun text-white h-5 w-5"></i>
                        </div>
                        <span class="font-bold text-xl text-slate-900">幸福感追踪器</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 bg-yellow-100 rounded-lg p-1">
                            <button @click="apiConfig.model = 'deepseek-v4-flash'"
                                :class="{'bg-white shadow text-yellow-600': apiConfig.model === 'deepseek-v4-flash'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="apiConfig.model = 'deepseek-v4-pro'"
                                :class="{'bg-white shadow text-yellow-600': apiConfig.model === 'deepseek-v4-pro'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true" class="text-yellow-600 hover:text-yellow-700 transition"><i
                                class="fa-solid fa-gear h-4 w-4"></i></button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow max-w-6xl mx-auto w-full p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div class="happiness-card rounded-2xl p-6 shadow-lg">
                    <h2 class="text-lg font-bold mb-4">今日幸福捕捉</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">选择今天让你感到幸福的时刻（可多选）</label>
                            <div class="grid grid-cols-2 gap-2 mb-3">
                                <label v-for="moment in momentOptions" :key="moment"
                                    class="flex items-center gap-2 p-2 border-2 rounded-lg cursor-pointer hover:bg-yellow-50 text-sm"
                                    :class="{'border-yellow-500 bg-yellow-50': input.moments.includes(moment)}">
                                    <input type="checkbox" :value="moment" v-model="input.moments" class="w-4 h-4">
                                    <span>{{ moment }}</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">具体描述（可选）</label>
                            <textarea v-model="input.description" placeholder="描述让你感到幸福的具体细节..." rows="3"
                                class="w-full bg-white border-2 border-yellow-200 rounded-lg p-3"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">整体幸福感评分</label>
                            <div class="flex items-center gap-4">
                                <input type="range" v-model.number="input.score" min="1" max="10" class="flex-1">
                                <span class="text-2xl font-bold text-yellow-600 w-12 text-center">{{ input.score
                                    }}</span>
                            </div>
                            <div class="flex justify-between text-xs text-slate-500 mt-1">
                                <span>很低</span>
                                <span>非常高</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">分析维度</label>
                            <select v-model="input.analysis"
                                class="w-full bg-white border-2 border-yellow-200 rounded-lg p-3">
                                <option value="三好理论">三好理论（PERMA 模型）</option>
                                <option value="需求满足">需求满足分析</option>
                                <option value="幸福趋势">幸福趋势洞察</option>
                                <option value="行动建议">幸福提升建议</option>
                            </select>
                        </div>
                    </div>
                    <button @click="analyzeHappiness" :disabled="isGenerating || input.moments.length === 0"
                        class="w-full mt-4 bg-gradient-to-r from-yellow-400 to-amber-500 text-white font-bold py-3 rounded-xl hover:shadow-lg transition disabled:opacity-50">
                        <i class="fa-solid fa-wand-magic-sparkles w-5 h-5 inline mr-2"></i>分析幸福感
                    </button>
                </div>
            </div>

            <div class="happiness-card rounded-2xl p-6 shadow-lg min-h-[500px]">
                <div v-if="isGenerating" class="flex flex-col items-center justify-center h-full text-yellow-600">
                    <i class="fa-solid fa-sun w-16 h-16 mb-4 sunshine-animation"></i>
                    <p class="text-lg font-medium">正在分析你的幸福感...</p>
                </div>
                <div v-else-if="!analysis" class="flex flex-col items-center justify-center h-full text-slate-400">
                    <i class="fa-solid fa-heart w-16 h-16 mb-4 opacity-50"></i>
                    <p>记录今天的幸福时刻</p>
                </div>
                <div v-else class="space-y-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-yellow-800">幸福分析报告</h3>
                        <div class="flex gap-2">
                            <button @click="copyAnalysis" class="text-sm text-yellow-600 hover:text-yellow-700">
                                <i class="fa-solid fa-copy w-4 h-4 inline mr-1"></i>复制
                            </button>
                            <button @click="exportAnalysis" class="text-sm text-yellow-600 hover:text-yellow-700">
                                <i class="fa-solid fa-download w-4 h-4 inline mr-1"></i>导出
                            </button>
                        </div>
                    </div>
                    <div class="bg-yellow-50 rounded-lg p-4 mb-4">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-yellow-800">今日幸福指数</span>
                            <span class="text-3xl font-bold text-yellow-600">{{ input.score }}/10</span>
                        </div>
                    </div>
                    <div class="prose max-w-none" v-html="renderMarkdown(analysis)"></div>
                </div>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"
            @click="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6" @click.stop>
                <h3 class="text-xl font-bold mb-4">高级设置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-2 p-3">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">系统提示词</label>
                        <textarea v-model="apiConfig.systemPrompt" rows="12"
                            class="w-full rounded-lg border-2 p-3 font-mono text-sm"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-6 py-2 rounded-lg hover:bg-slate-100">取消</button>
                    <button @click="saveConfig"
                        class="bg-yellow-500 text-white px-6 py-2 rounded-lg hover:bg-yellow-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;

        // Markdown 渲染函数
        const renderMarkdown = (text) => {
            if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                return marked.parse(text || '');
            }
            return text || '';
        };

        const DEFAULT_SYSTEM_PROMPT = `你是一位积极心理学专家，擅长幸福科学分析和提升建议。

**理论基础**：
1. **PERMA 模型**（Seligman 幸福理论）：
   - P: Positive Emotion (积极情绪)
   - E: Engagement (投入专注)
   - R: Relationships (人际关系)
   - M: Meaning (人生意义)
   - A: Achievement (成就感)

2. **需求满足理论**（Maslow & SDT）：
   - 生理需求、安全需求
   - 归属与爱、自尊需求
   - 自我实现

3. **幸福来源**：
   - 快乐型幸福（Hedonic）：感官愉悦、即时满足
   - 意义型幸福（Eudaimonic）：价值实现、成长贡献

**分析框架**：
根据用户选择的分析维度输出不同内容：

【三好理论模式】：
# 🌈 你的 PERMA 幸福分析
## 今日幸福来源拆解
[将用户选择的时刻映射到 PERMA 五个维度]

## 幸福类型识别
[快乐型 vs 意义型，哪个更多]

## 幸福提升建议
[针对薄弱维度的具体建议]

---

【需求满足模式】：
# 🎯 你满足了哪些需求
[分析今日幸福时刻满足了哪些层级的需求]

【幸福趋势模式】：
# 📊 幸福模式洞察
[识别幸福来源的规律和模式]

【行动建议模式】：
# 💡 明天的幸福实验
[3-5 个可操作的幸福提升小实验]

**输出风格**：温暖、鼓励、科学，避免说教，强调幸福可以培养。`;

        createApp({
            setup() {
                // renderIcon removed

                const showSettings = ref(false);
                const isGenerating = ref(false);
                const analysis = ref('');
                const apiConfig = reactive({ deepseek: '', model: 'deepseek-v4-pro', systemPrompt: DEFAULT_SYSTEM_PROMPT });
                const input = reactive({ moments: [], description: '', score: 7, analysis: '三好理论' });
                const momentOptions = ref(['与人深度交流', '完成一件事', '享受美食', '运动锻炼', '学到新知识', '帮助他人', '独处时光', '大自然接触', '创作表达', '家人陪伴', '朋友聚会', '宠物互动']);

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // lucide.createIcons();
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            apiConfig.deepseek = config.deepseek || '';
                            apiConfig.model = config.model || 'deepseek-v4-pro';
                        } catch (e) {
                            console.error('Failed to parse global_llm_config', e);
                        }
                    }
                });

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, deepseek: apiConfig.deepseek, model: apiConfig.model }));
                    showSettings.value = false;
                    alert('配置已保存！');
                };

                const analyzeHappiness = async () => {
                    if (!apiConfig.deepseek) { showSettings.value = true; return; }
                    isGenerating.value = true;
                    analysis.value = '';

                    const userPrompt = `幸福时刻：${input.moments.join('、')}\n${input.description ? `具体描述：${input.description}\n` : ''}幸福评分：${input.score}/10\n分析维度：${input.analysis}\n\n请进行幸福感分析。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [{ role: 'system', content: apiConfig.systemPrompt }, { role: 'user', content: userPrompt }],
                                stream: true
                            })
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || `API 请求失败: ${response.status}`);
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                    try {
                                        const data = JSON.parse(line.slice(6));
                                        const delta = data.choices[0].delta;
                                        if (delta.content) analysis.value += delta.content;
                                    } catch (e) { }
                                }
                            }
                        }
                    } catch (error) {
                        alert('生成失败：' + error.message);
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyAnalysis = async () => {
                    await navigator.clipboard.writeText(analysis.value);
                    alert('已复制到剪贴板！');
                };

                const exportAnalysis = () => {
                    const text = `【幸福感追踪报告】\n日期：${new Date().toLocaleDateString()}\n评分：${input.score}/10\n\n${analysis.value}`;
                    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `幸福追踪_${Date.now()}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                };

                return {
                    showSettings, isGenerating, analysis, apiConfig, input, momentOptions, saveConfig, analyzeHappiness, copyAnalysis, exportAnalysis, renderMarkdown };
            }
        }).mount('#app');
    </script>
