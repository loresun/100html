    <meta charset="UTF-8">
    <title>Fractal Tree // HTML_SUPER</title>
    <style>body { margin: 0; background: #eee; overflow: hidden; display: flex; justify-content: center; align-items: center; } canvas { box-shadow: 0 10px 40px rgba(0,0,0,0.1); background: #fff; } .ui { position: absolute; top: 20px; left: 20px; font-family: sans-serif; } a { color: #000; }</style>

<body>
    <div class="ui"><a href="index.html">← BACK</a><br><small>Move mouse horizontally to change angle</small></div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let angle = Math.PI / 4;

        function drawTree(startX, startY, len, angle, branchWidth) {
            ctx.beginPath();
            ctx.save();
            ctx.strokeStyle = '#333';
            ctx.fillStyle = '#333'; // leaves
            ctx.lineWidth = branchWidth;
            ctx.translate(startX, startY);
            ctx.rotate(angle * -1);
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();

            if (len < 10) {
                ctx.restore();
                return;
            }

            drawTree(0, -len, len * 0.75, angle - 0.2 + (mouseX/window.innerWidth), branchWidth * 0.7);
            drawTree(0, -len, len * 0.75, angle + 0.2 - (mouseX/window.innerWidth), branchWidth * 0.7);
            
            ctx.restore();
        }

        let mouseX = 0;
        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
        });

        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            // Dynamic angle based on mouse
            drawTree(canvas.width/2, canvas.height, 150, 0, 15);
            requestAnimationFrame(animate);
        }
        animate();
    </script>
