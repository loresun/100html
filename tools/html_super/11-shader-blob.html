    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Vertex Shader -->
    <script type="x-shader/x-vertex" id="vertexShader">
        uniform float time;
        varying vec2 vUv;
        varying float vDisplacement;

        // Classic Perlin Noise 3D (Simplex is better but complex to inline)
        // Simple sine superposition for displacement
        void main() {
            vUv = uv;
            vec3 pos = position;
            
            // Distort sphere vertices
            float distortion = sin(pos.x * 2.0 + time) * cos(pos.y * 3.0 + time) * sin(pos.z * 2.0 + time);
            
            pos += normal * distortion * 0.3;
            vDisplacement = distortion;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>

    <!-- Fragment Shader -->
    <script type="x-shader/x-fragment" id="fragmentShader">
        uniform float time;
        varying vec2 vUv;
        varying float vDisplacement;

        void main() {
            // Iridescent color based on displacement
            float r = 0.5 + 0.5 * cos(vDisplacement * 5.0 + time);
            float g = 0.5 + 0.5 * cos(vDisplacement * 5.0 + time + 2.0);
            float b = 0.5 + 0.5 * cos(vDisplacement * 5.0 + time + 4.0);
            
            gl_FragColor = vec4(r, g, b, 1.0);
        }
    </script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry(1, 128, 128);
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 }
            },
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent
        });

        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.time.value += 0.02;
            sphere.rotation.y += 0.005;
            sphere.rotation.x += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
