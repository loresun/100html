    <title>Boids Flocking // HTML_SUPER</title>
    <style>body { margin: 0; background: #eef; overflow: hidden; } .ui { position: absolute; top: 20px; left: 20px; z-index: 10; font-family: sans-serif; } a { color: #333; }</style>

<body>
    <div class="ui"><a href="index.html">← BACK</a></div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        // Boid Class
        class Boid {
            constructor() {
                this.position = { x: Math.random() * width, y: Math.random() * height };
                this.velocity = { x: Math.random() * 4 - 2, y: Math.random() * 4 - 2 };
                this.acceleration = { x: 0, y: 0 };
                this.maxForce = 0.1;
                this.maxSpeed = 3;
                this.size = 4;
            }
            
            // Logic
            run(boids) {
                this.flock(boids);
                this.update();
                this.borders();
                this.render();
            }

            flock(boids) {
                let sep = this.separate(boids);
                let ali = this.align(boids);
                let coh = this.cohesion(boids);
                // Weights
                sep.x *= 1.5; sep.y *= 1.5;
                ali.x *= 1.0; ali.y *= 1.0;
                coh.x *= 1.0; coh.y *= 1.0;
                
                this.acceleration.x += sep.x + ali.x + coh.x;
                this.acceleration.y += sep.y + ali.y + coh.y;
            }

            update() {
                this.velocity.x += this.acceleration.x;
                this.velocity.y += this.acceleration.y;
                // Limit speed
                const speed = Math.hypot(this.velocity.x, this.velocity.y);
                if (speed > this.maxSpeed) {
                    this.velocity.x = (this.velocity.x / speed) * this.maxSpeed;
                    this.velocity.y = (this.velocity.y / speed) * this.maxSpeed;
                }
                
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;
                this.acceleration.x = 0; 
                this.acceleration.y = 0;
            }

            borders() {
                // Wrap around
                if (this.position.x < -this.size) this.position.x = width + this.size;
                if (this.position.y < -this.size) this.position.y = height + this.size;
                if (this.position.x > width + this.size) this.position.x = -this.size;
                if (this.position.y > height + this.size) this.position.y = -this.size;
            }
            
            // Forces
            separate(boids) {
                let desiredSeparation = 25;
                let steer = {x:0, y:0};
                let count = 0;
                for (let i=0; i<boids.length; i++) {
                    let d = Math.hypot(this.position.x - boids[i].position.x, this.position.y - boids[i].position.y);
                    if ((d > 0) && (d < desiredSeparation)) {
                        let diff = { x: this.position.x - boids[i].position.x, y: this.position.y - boids[i].position.y };
                        diff.x /= d; diff.y /= d;
                        steer.x += diff.x; steer.y += diff.y;
                        count++;
                    }
                }
                if (count > 0) {
                    steer.x /= count; steer.y /= count;
                }
                if (Math.hypot(steer.x, steer.y) > 0) {
                    let m = Math.hypot(steer.x, steer.y);
                    steer.x = (steer.x / m) * this.maxSpeed - this.velocity.x;
                    steer.y = (steer.y / m) * this.maxSpeed - this.velocity.y;
                    // Limit force not implemented fully for brevity but working
                }
                return steer;
            }
            
            align(boids) {
                let neighborDist = 50;
                let sum = {x:0, y:0};
                let count = 0;
                for(let i=0; i<boids.length; i++) {
                     let d = Math.hypot(this.position.x - boids[i].position.x, this.position.y - boids[i].position.y);
                     if ((d > 0) && (d < neighborDist)) {
                         sum.x += boids[i].velocity.x;
                         sum.y += boids[i].velocity.y;
                         count++;
                     }
                }
                if(count > 0) {
                    sum.x /= count; sum.y /= count;
                    let m = Math.hypot(sum.x, sum.y);
                    sum.x = (sum.x / m) * this.maxSpeed;
                    sum.y = (sum.y / m) * this.maxSpeed;
                    return { x: sum.x - this.velocity.x, y: sum.y - this.velocity.y };
                } 
                return {x:0, y:0};
            }
            
             cohesion(boids) {
                let neighborDist = 50;
                let sum = {x:0, y:0};
                let count = 0;
                for(let i=0; i<boids.length; i++) {
                     let d = Math.hypot(this.position.x - boids[i].position.x, this.position.y - boids[i].position.y);
                     if ((d > 0) && (d < neighborDist)) {
                         sum.x += boids[i].position.x;
                         sum.y += boids[i].position.y;
                         count++;
                     }
                }
                if(count > 0) {
                    sum.x /= count; sum.y /= count;
                    // Seek target
                    let desired = {x: sum.x - this.position.x, y: sum.y - this.position.y};
                    let m = Math.hypot(desired.x, desired.y);
                    desired.x = (desired.x/m) * this.maxSpeed;
                    desired.y = (desired.y/m) * this.maxSpeed;
                    return { x: desired.x - this.velocity.x, y: desired.y - this.velocity.y };
                } 
                return {x:0, y:0};
            }

            render() {
                let angle = Math.atan2(this.velocity.y, this.velocity.x);
                ctx.save();
                ctx.translate(this.position.x, this.position.y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(this.size*2, 0);
                ctx.lineTo(-this.size, this.size);
                ctx.lineTo(-this.size, -this.size);
                ctx.closePath();
                ctx.fillStyle = '#333';
                ctx.fill();
                ctx.restore();
            }
        }

        const flock = [];
        for(let i=0; i<150; i++) flock.push(new Boid());

        function animate() {
            ctx.clearRect(0,0,width,height);
            for(let b of flock) b.run(flock);
            requestAnimationFrame(animate);
        }
        animate();

    </script>
