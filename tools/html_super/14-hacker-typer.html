    <meta charset="UTF-8">
    <title>Hacker Typer // HTML_SUPER</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; overflow: hidden; font-family: monospace; }
        canvas { display: block; position: absolute; top:0; left:0; z-index: 1; opacity: 0.3; }
        .ui { position: absolute; top: 20px; left: 20px; z-index: 10; } a { color: #0f0; }
        
        #console { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 2; padding: 40px; box-sizing: border-box; 
            font-size: 16px; line-height: 1.5; pointer-events: none;
            overflow: hidden;
            word-wrap: break-word;
        }

<body>
    <div class="ui"><a href="index.html">← BACK</a></div>
    <canvas id="canvas"></canvas>
    <div id="console"></div>

    <script>
        // 1. Matrix Rain Background
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";
        const drops = [];
        const fontSize = 16;
        let columns;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = width / fontSize;
            drops.length = 0;
            for(let x=0; x<columns; x++) drops[x] = 1;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px monospace";
            
            for(let i=0; i<drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random()*chars.length));
                ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                
                if(drops[i]*fontSize > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }
        drawMatrix();


        // 2. Typer Simulation on Keypress
        const consoleDiv = document.getElementById('console');
        const code = `
struct group_info init_groups = { .usage = ATOMIC_INIT(2) };
struct group_info *groups_alloc(int gidsetsize) {
    struct group_info *group_info;
    int nblocks;
    int i; 
    nblocks = (gidsetsize + NGROUPS_PER_BLOCK - 1) / NGROUPS_PER_BLOCK;
    /* Make sure we always allocate at least one indirect block pointer */
    nblocks = nblocks ? : 1;
    group_info = kmalloc(sizeof(*group_info) + nblocks*sizeof(gid_t *), GFP_USER);
    if (!group_info) return NULL;
    group_info->ngroups = gidsetsize;
    group_info->nblocks = nblocks;
    atomic_set(&group_info->usage, 1);
    
    if (gidsetsize <= NGROUPS_SMALL)
        group_info->blocks[0] = group_info->small_block;
    else {
        for (i = 0; i < nblocks; i++) {
            gid_t *b;
            b = (void *)__get_free_page(GFP_USER);
            if (!b) goto out_undo_partial_alloc;
            group_info->blocks[i] = b;
        }
    }
    return group_info;
}
        `;
        let codeIdx = 0;
        
        document.addEventListener('keydown', (e) => {
            e.preventDefault();
            // Type a chunk of code regardless of key pressed
            const chunk = code.substring(codeIdx, codeIdx + 5 + Math.random() * 5);
            codeIdx += chunk.length;
            if(codeIdx >= code.length) codeIdx = 0;
            
            consoleDiv.innerHTML += chunk;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        });

        // Intro Text
        consoleDiv.innerText = "// ACCESS GRANTED.\n// PRESS ANY KEY TO INJECT CODE...\n\n";

    </script>
