    <meta charset="UTF-8">
    <title>Magnetic Buttons // HTML_SUPER</title>
    <style>
        body {
            margin: 0; background: #f0f0f0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;
            font-family: sans-serif; gap: 30px;
        }
        .ui { position: absolute; top: 20px; left: 20px; }
        a.back { color: #333; text-decoration: none; border-bottom: 1px solid #333; }

        .btn-container {
            position: relative;
        }

        .magnetic-btn {
            background: #111;
            color: #fff;
            border: none;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: transform 0.1s;
        }

        /* Shadow/Clone for effect */
        .btn-shadow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50px;
            background: rgba(0,0,0,0.2);
            filter: blur(10px);
            z-index: 1;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>
    <div class="ui"><a href="index.html" class="back">← BACK</a></div>

    <div class="btn-container">
        <div class="btn-shadow"></div>
        <button class="magnetic-btn">HOVER ME</button>
    </div>

    <div class="btn-container">
        <div class="btn-shadow" style="background: rgba(255,0,0,0.3);"></div>
        <button class="magnetic-btn" style="background: #ff0055;">PULL ME</button>
    </div>

    <script>
        const containers = document.querySelectorAll('.btn-container');

        containers.forEach(container => {
            const btn = container.querySelector('.magnetic-btn');
            const shadow = container.querySelector('.btn-shadow');
            
            // Magnet strength
            const strength = 0.5;

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                
                // Move button towards mouse
                btn.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
                // Shadow lags slightly
                shadow.style.transform = `translate(${x * strength * 0.5}px, ${y * strength * 0.5}px)`;
            });

            container.addEventListener('mouseleave', () => {
                // Spring back
                btn.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                shadow.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                btn.style.transform = 'translate(0, 0)';
                shadow.style.transform = 'translate(0, 0)';
                
                // Remove transition after animation to keep mousemove snappy
                setTimeout(() => {
                    btn.style.transition = '';
                    shadow.style.transition = '';
                }, 500);
            });
        });
    </script>

</html>
