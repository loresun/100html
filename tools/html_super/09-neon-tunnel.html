    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup Three.js
        const scene = new THREE.Scene();
        // Fog for depth fading
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Geometries
        // Create a tunnel using multiple rings/squares
        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);

        const count = 50;
        const spacing = 2;
        
        for(let i=0; i<count; i++) {
            const geometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(5, 5, 1));
            const material = new THREE.LineBasicMaterial({ color: 0x00ffff });
            const mesh = new THREE.LineSegments(geometry, material);
            
            mesh.position.z = -i * spacing;
            // random rotate
            mesh.rotation.z = i * 0.1;
            
            tunnelGroup.add(mesh);
        }

        // Particle stars
        const starGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPos = new Float32Array(starCount*3);
        const starVel = []; // velocity for stars
        
        for(let i=0; i<starCount; i++) {
            starPos[i*3] = (Math.random()-0.5) * 50; // x
            starPos[i*3+1] = (Math.random()-0.5) * 50; // y
            starPos[i*3+2] = -Math.random() * 100; // z
            
            // Only strictly inside the tunnel view usually, but lets make them everywhere
        }
        
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({color: 0xff00ff, size: 0.1});
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);


        // Animation
        const speed = 0.1;
        let hue = 0;

        function animate() {
            requestAnimationFrame(animate);
            
            // Move tunnel segments towards camera
            tunnelGroup.children.forEach((mesh, index) => {
                mesh.position.z += speed;
                mesh.rotation.z += 0.005;
                
                // Cyclic Color
                const h = (hue + index * 10) % 360;
                mesh.material.color.setHSL(h/360, 1, 0.5);

                // Reset check
                if(mesh.position.z > 5) {
                    mesh.position.z = -(count * spacing) + 5;
                }
            });
            
            hue += 0.5;
            
            // Move camera slightly for dynamic feel
            camera.position.x = Math.sin(Date.now() * 0.001) * 0.5;
            camera.position.y = Math.cos(Date.now() * 0.001) * 0.5;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
