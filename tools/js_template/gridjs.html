  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid.js 现代表格</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f0fdfa; color: #134e4a; }
    .glass { background: white; border: 1px solid #ccfbf1; box-shadow: 0 4px 6px -1px rgba(20, 184, 166, 0.05); }
    /* GridJS Customization */
    .gridjs-container { color: #334155; }
    .gridjs-th { background: #f0fdfa; color: #115e59; font-weight: 700; border-color: #ccfbf1; }
    .gridjs-td { border-color: #f0fdfa; }
    .gridjs-tr:hover td { background: #f0fdfa; }
    .gridjs-footer { background: white; border-top: 1px solid #ccfbf1; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-5xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-teal-900">▦ Grid.js</h1>
    <p class="text-teal-800/60 mt-2 text-lg">适用于所有地方的高级表格插件 (TypeScript 编写)</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-teal-200 text-teal-800 rounded-lg hover:bg-teal-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-5xl mx-auto space-y-8">

  <div class="glass p-8 rounded-2xl shadow-lg">
    <div id="table-wrapper"></div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="glass p-6 rounded-xl text-center">
      <div class="text-2xl mb-2">🔍</div>
      <h3 class="font-bold text-teal-900">全局搜索</h3>
      <p class="text-sm text-teal-700/70">内置模糊搜索，无需额外配置。</p>
    </div>
    <div class="glass p-6 rounded-xl text-center">
      <div class="text-2xl mb-2">📄</div>
      <h3 class="font-bold text-teal-900">分页排序</h3>
      <p class="text-sm text-teal-700/70">客户端自动分页和多列排序。</p>
    </div>
    <div class="glass p-6 rounded-xl text-center">
      <div class="text-2xl mb-2">🧩</div>
      <h3 class="font-bold text-teal-900">自定义单元格</h3>
      <p class="text-sm text-teal-700/70">支持 HTML 内容和 React/Vue/P/React 组件。</p>
    </div>
  </div>

</main>

<script>
  new gridjs.Grid({
    columns: [
      { name: 'Name', formatter: (cell) => gridjs.html(`<b class="text-teal-700">${cell}</b>`) },
      'Email',
      { name: 'Phone', sort: false },
      'City',
      { 
        name: 'Actions',
        formatter: (_, row) => gridjs.html(`<button onclick="alert('View ${row.cells[0].data}')" class="px-2 py-1 text-xs bg-teal-100 text-teal-700 rounded hover:bg-teal-200">View</button>`)
      }
    ],
    search: true,
    sort: true,
    pagination: { limit: 5 },
    data: [
      ["John", "john@example.com", "(353) 01 222 3333", "Dublin", null],
      ["Mark", "mark@gmail.com", "(01) 22 888 4444", "New York", null],
      ["Eoin", "eoin@gmail.com", "0097 22 654 00033", "London", null],
      ["Sarah", "sarahcdd@gmail.com", "+322 876 1233", "Paris", null],
      ["Afshin", "afshin@mail.com", "(353) 22 87 8356", "Berlin", null],
      ["Mike", "mike@example.com", "(353) 01 222 3333", "Dublin", null],
      ["Emily", "emily@gmail.com", "(01) 22 888 4444", "New York", null],
      ["Scott", "scott@gmail.com", "0097 22 654 00033", "London", null],
      ["Laura", "laura@gmail.com", "+322 876 1233", "Paris", null],
      ["Lisa", "lisa@mail.com", "(353) 22 87 8356", "Berlin", null]
    ],
    className: {
      table: 'w-full text-sm text-left',
      thead: 'bg-teal-50',
      th: 'p-3 font-semibold text-teal-900',
      td: 'p-3 border-b border-teal-50'
    }
  }).render(document.getElementById("table-wrapper"));
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
