  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>html2canvas 网页截图</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fffbeb; color: #78350f; }
    .glass { background: white; border: 1px solid #fde68a; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.05); }
    .capture-target { position: relative; overflow: hidden; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-amber-900">📸 html2canvas</h1>
    <p class="text-amber-800/60 mt-2 text-lg">在用户浏览器端对网页进行截图</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-amber-200 text-amber-800 rounded-lg hover:bg-amber-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-10">

  <!-- 截图目标区域 -->
  <div class="glass p-8 rounded-2xl">
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-xl text-amber-900">1. 目标元素</h3>
    </div>
    
    <div id="capture-area" class="capture-target bg-gradient-to-br from-amber-100 to-orange-100 p-8 rounded-xl border border-amber-200 text-center shadow-inner relative">
      <div class="absolute top-0 right-0 p-2 bg-amber-500 text-white text-xs font-bold rounded-bl-lg">PRO</div>
      
      <img src="https://source.unsplash.com/random/100x100/?face" class="w-24 h-24 rounded-full mx-auto border-4 border-white shadow-lg mb-4 object-cover">
      
      <h2 class="text-2xl font-bold text-amber-900 mb-1">Jane Doe</h2>
      <p class="text-amber-700 font-medium mb-4">Senior Designer</p>
      
      <div class="flex justify-center gap-2 mb-4">
        <span class="px-2 py-1 bg-white/50 rounded text-xs text-amber-800">UI/UX</span>
        <span class="px-2 py-1 bg-white/50 rounded text-xs text-amber-800">Web</span>
        <span class="px-2 py-1 bg-white/50 rounded text-xs text-amber-800">Illustration</span>
      </div>
      
      <div class="text-xs text-amber-600/50 mt-4">Generate by html2canvas</div>
    </div>

    <div class="mt-6 flex justify-center">
      <button onclick="takeScreenshot()" class="px-8 py-3 bg-amber-500 text-white rounded-full hover:bg-amber-600 font-bold shadow-lg shadow-amber-500/30 transition-transform active:scale-95 flex items-center gap-2">
        <span>📸</span> 截图并预览
      </button>
    </div>
  </div>

  <!-- 结果预览 -->
  <div class="glass p-8 rounded-2xl" id="result-container" style="display:none;">
    <h3 class="font-bold text-xl text-amber-900 mb-6">2. 截图预览 (Canvas)</h3>
    <div id="preview" class="border border-slate-200 p-2 rounded-xl bg-slate-50 flex justify-center"></div>
    <div class="mt-4 text-center">
      <button onclick="downloadImage()" class="text-blue-600 hover:text-blue-800 font-medium underline">下载图片</button>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
  function takeScreenshot() {
    const target = document.getElementById('capture-area');
    
    html2canvas(target, {
      scale: 2, // 提高清晰度
      backgroundColor: null, // 透明背景 (如果元素本身透明)
      logging: false
    }).then(canvas => {
      const preview = document.getElementById('preview');
      preview.innerHTML = '';
      preview.appendChild(canvas);
      
      document.getElementById('result-container').style.display = 'block';
      
      // 滚动到预览
      document.getElementById('result-container').scrollIntoView({ behavior: 'smooth' });
    });
  }

  function downloadImage() {
    const canvas = document.querySelector('#preview canvas');
    if(canvas) {
      const link = document.createElement('a');
      link.download = 'profile-card.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  }
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
