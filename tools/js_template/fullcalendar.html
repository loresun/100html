  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FullCalendar 日程日历</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fffbeb; color: #78350f; }
    .glass { background: white; border: 1px solid #fef3c7; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.05); }
    /* Calendar Overrides */
    .fc { --fc-border-color: #fef3c7; --fc-button-bg-color: #f59e0b; --fc-button-border-color: #f59e0b; --fc-button-hover-bg-color: #d97706; --fc-today-bg-color: #fffbeb; }
    .fc-event { border: none; border-radius: 4px; padding: 2px 4px; font-size: 0.85em; cursor: pointer; }
    .fc-toolbar-title { font-size: 1.25em !important; font-weight: 700; color: #92400e; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-6xl mx-auto flex justify-between items-center mb-8">
  <div>
    <h1 class="text-3xl font-bold text-amber-900">📅 FullCalendar</h1>
    <p class="text-amber-800/60 mt-2 text-lg">功能最强大的 JavaScript 日历组件</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-amber-200 text-amber-800 rounded-lg hover:bg-amber-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">

  <!-- 侧边栏 -->
  <div class="lg:col-span-1 space-y-6">
    <div class="glass p-6 rounded-2xl">
      <h3 class="font-bold text-amber-900 mb-4">拖拽事件</h3>
      <div id="external-events" class="space-y-2">
        <div class="fc-event p-2 bg-blue-100 text-blue-800 font-bold rounded shadow-sm" data-color="#3b82f6">🔵 商务会议</div>
        <div class="fc-event p-2 bg-green-100 text-green-800 font-bold rounded shadow-sm" data-color="#10b981">🟢 团队聚餐</div>
        <div class="fc-event p-2 bg-red-100 text-red-800 font-bold rounded shadow-sm" data-color="#ef4444">🔴 紧急修复</div>
        <div class="fc-event p-2 bg-purple-100 text-purple-800 font-bold rounded shadow-sm" data-color="#a855f7">🟣 产品发布</div>
      </div>
      <p class="text-xs text-amber-500 mt-4">
        试着将这些事件拖拽到日历中。
      </p>
    </div>

    <div class="glass p-6 rounded-2xl">
      <h3 class="font-bold text-amber-900 mb-2">交互日志</h3>
      <div id="log" class="text-xs h-32 overflow-y-auto font-mono text-amber-700/60 bg-amber-50 p-2 rounded border border-amber-100">
        Waiting for verify...
      </div>
    </div>
  </div>

  <!-- 日历主体 -->
  <div class="lg:col-span-3">
    <div class="glass p-6 rounded-2xl shadow-lg bg-white">
      <div id="calendar"></div>
    </div>
  </div>

</main>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const Draggable = FullCalendar.Draggable;
    const containerEl = document.getElementById('external-events');
    const logEl = document.getElementById('log');

    // 1. 初始化拖拽
    new Draggable(containerEl, {
      itemSelector: '.fc-event',
      eventData: function(eventEl) {
        return {
          title: eventEl.innerText,
          backgroundColor: eventEl.getAttribute('data-color'),
          borderColor: eventEl.getAttribute('data-color')
        };
      }
    });

    const now = new Date();
    const yearMonth = now.toISOString().substring(0, 7); // YYYY-MM

    // 2. 初始化日历
    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
      },
      editable: true,
      droppable: true, // 支持外部拖入
      selectable: true,
      events: [
        { title: '全天事件', start: yearMonth + '-01', backgroundColor: '#f59e0b', borderColor: '#f59e0b' },
        { title: '项目展示', start: yearMonth + '-07', end: yearMonth + '-10', backgroundColor: '#10b981', borderColor: '#10b981' },
      ],
      
      // Callbacks
      dateClick: function(info) {
        log(`点击了日期: ${info.dateStr}`);
      },
      eventClick: function(info) {
        log(`点击事件: ${info.event.title}`);
        if(confirm(`删除 '${info.event.title}'?`)) {
          info.event.remove();
        }
      },
      drop: function(info) {
        log(`拖入了事件到: ${info.dateStr}`);
      },
      eventDrop: function(info) {
        log(`移动了事件: ${info.event.title}`);
      }
    });

    calendar.render();

    function log(msg) {
      const div = document.createElement('div');
      div.innerText = `> ${msg}`;
      logEl.insertBefore(div, logEl.firstChild);
    }
  });
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
