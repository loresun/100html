  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faker.js 虚拟数据</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Using a reliable faker CDN (faker-js/faker is the community maintained fork) -->
  <script type="module">
    import { faker } from 'https://esm.sh/@faker-js/faker';
    window.faker = faker; 
    window.initDemo(); // Call init after load
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .json-box { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-12">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">🎭 Faker.js 虚拟数据</h1>
    <p class="text-slate-500 mt-1">生成海量逼真的测试数据（用户、地址、商品等）</p>
  </div>
  <a href="index.html" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">← 返回导航</a>
</header>

<main class="max-w-4xl mx-auto space-y-8">

  <!-- User Profile Card Generator -->
  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-slate-700">随机用户资料</h3>
      <button onclick="generateProfile()" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-medium rounded-lg hover:bg-indigo-100 transition">
        🔄 刷新
      </button>
    </div>
    
    <div class="flex items-start gap-6" id="profile-card">
      <div class="w-16 h-16 bg-slate-200 rounded-full animate-pulse"></div>
      <div class="flex-1 space-y-3">
        <div class="h-6 bg-slate-200 rounded w-1/3 animate-pulse"></div>
        <div class="h-4 bg-slate-200 rounded w-1/4 animate-pulse"></div>
        <div class="h-4 bg-slate-200 rounded w-2/3 animate-pulse"></div>
      </div>
    </div>
  </div>

  <!-- Table Data Generator -->
  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-slate-700">模拟交易记录表格</h3>
       <button onclick="generateTable()" class="px-4 py-2 bg-emerald-50 text-emerald-700 font-medium rounded-lg hover:bg-emerald-100 transition">
        🔄 生成 5 条
      </button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left text-slate-600">
        <thead class="text-xs text-slate-700 uppercase bg-slate-50">
          <tr>
            <th class="px-6 py-3">Transaction ID</th>
            <th class="px-6 py-3">User</th>
            <th class="px-6 py-3">Date</th>
            <th class="px-6 py-3">Amount</th>
            <th class="px-6 py-3">Status</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-slate-100">
          <!-- Rows -->
        </tbody>
      </table>
    </div>
  </div>

</main>

<script>
  window.initDemo = function() {
    generateProfile();
    generateTable();
  }

  function generateProfile() {
    const card = document.getElementById('profile-card');
    
    // Generate data
    const firstName = faker.person.firstName();
    const lastName = faker.person.lastName();
    const job = faker.person.jobTitle();
    const bio = faker.lorem.sentence();
    const avatar = faker.image.avatar();
    const email = faker.internet.email({ firstName, lastName });

    card.innerHTML = `
      <img src="${avatar}" class="w-16 h-16 rounded-full border-2 border-slate-100 shadow-sm" alt="Avatar">
      <div class="flex-1">
        <h4 class="text-lg font-bold text-slate-800">${firstName} ${lastName}</h4>
        <p class="text-sm text-indigo-600 font-medium mb-1">${job}</p>
        <p class="text-sm text-slate-500 mb-2">${email}</p>
        <p class="text-sm text-slate-600 italic">"${bio}"</p>
      </div>
    `;
  }

  function generateTable() {
    const tbody = document.getElementById('table-body');
    let html = '';
    
    for(let i=0; i<5; i++) {
        const id = faker.string.alphanumeric(8).toUpperCase();
        const user = faker.internet.userName();
        const date = faker.date.recent().toLocaleDateString();
        const amount = faker.finance.amount({ symbol: '$' });
        const status = faker.helpers.arrayElement(['Completed', 'Pending', 'Failed']);
        
        // Tailwind colors based on status
        let statusClass = 'bg-slate-100 text-slate-800';
        if(status === 'Completed') statusClass = 'bg-green-100 text-green-800';
        if(status === 'Failed') statusClass = 'bg-red-100 text-red-800';
        if(status === 'Pending') statusClass = 'bg-yellow-100 text-yellow-800';

        html += `
            <tr class="bg-white hover:bg-slate-50">
                <td class="px-6 py-4 font-mono text-xs">${id}</td>
                <td class="px-6 py-4 font-medium text-slate-900">${user}</td>
                <td class="px-6 py-4">${date}</td>
                <td class="px-6 py-4 font-mono">${amount}</td>
                <td class="px-6 py-4">
                    <span class="${statusClass} text-xs font-medium px-2.5 py-0.5 rounded">${status}</span>
                </td>
            </tr>
        `;
    }
    tbody.innerHTML = html;
  }
</script>

<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
