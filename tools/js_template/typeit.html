  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TypeIt 打字机效果</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; }
    .glass { backdrop-filter: blur(10px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
    .type-container { min-height: 60px; font-family: 'JetBrains Mono', monospace; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12 text-white">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-8">
  <div>
    <h1 class="text-3xl font-bold">⌨️ TypeIt</h1>
    <p class="text-white/60 mt-1">最强大的 JavaScript 打字机效果库</p>
  </div>
  <a href="index.html" class="px-4 py-2 glass rounded-lg text-white hover:bg-white/20">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-6">
  <!-- 基础效果 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4">📝 基础打字</h3>
    <div id="type-basic" class="type-container text-xl text-emerald-300"></div>
    <div class="mt-4 flex gap-3">
      <button onclick="startBasic()" class="px-4 py-2 bg-emerald-600 rounded-lg hover:bg-emerald-700">播放 / 重播</button>
      <button onclick="basicInstance.freeze()" class="px-4 py-2 bg-slate-700 rounded-lg hover:bg-slate-600">暂停</button>
      <button onclick="basicInstance.unfreeze()" class="px-4 py-2 bg-slate-700 rounded-lg hover:bg-slate-600">继续</button>
    </div>
  </div>

  <!-- 复杂场景 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4">🎭 复杂交互场景</h3>
    <div class="bg-slate-900/50 p-6 rounded-xl border border-white/10 min-h-[120px]">
      <span id="type-complex" class="text-2xl font-bold"></span>
    </div>
    <div class="mt-4">
      <button onclick="startComplex()" class="px-4 py-2 bg-purple-600 rounded-lg hover:bg-purple-700">演示复杂流程</button>
    </div>
  </div>

  <!-- 代码编辑器模拟 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4">💻 模拟写代码</h3>
    <div class="bg-[#1e1e1e] p-6 rounded-xl font-mono text-sm leading-6 border border-white/10 shadow-xl overflow-hidden min-h-[200px]">
      <div class="flex gap-2 mb-4">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
        <div class="w-3 h-3 rounded-full bg-green-500"></div>
      </div>
      <div id="type-code" class="text-gray-300 whitespace-pre"></div>
    </div>
    <div class="mt-4">
      <button onclick="startCode()" class="px-4 py-2 bg-indigo-600 rounded-lg hover:bg-indigo-700">开始编写代码</button>
    </div>
  </div>

  <!-- 输入框占位符 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4">🔍 输入框占位符动画</h3>
    <input type="text" id="type-input" class="w-full px-4 py-3 bg-slate-900/50 border border-white/20 rounded-xl text-white outline-none focus:border-blue-500 transition-colors" placeholder="">
  </div>

  <!-- 代码示例 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4">📝 代码示例</h3>
    <div class="bg-slate-900/80 p-4 rounded-xl overflow-x-auto">
      <pre class="text-sm font-mono text-slate-300">new TypeIt("#element", {
  speed: 50,
  startDelay: 900
})
.type("Hello World!")
.pause(1000)
.delete(6)
.type("TypeIt!")
.go();</pre>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/typeit@8.8.3/dist/index.umd.js"></script>
<script>
let basicInstance;
let complexInstance;
let codeInstance;

// 基础演示
function startBasic() {
  if (basicInstance) basicInstance.destroy();
  
  basicInstance = new TypeIt("#type-basic", {
    speed: 50,
    waitUntilVisible: true
  })
  .type("你好，我是 TypeIt。")
  .pause(1000)
  .type("<br>我可以模拟真实的打字效果。")
  .pause(500)
  .delete(10)
  .type("非常流畅！")
  .go();
}

// 复杂场景
function startComplex() {
  if (complexInstance) complexInstance.destroy();
  
  complexInstance = new TypeIt("#type-complex", {
    speed: 50,
    startDelay: 500,
    lifeLike: true
  })
  .type("这时候并不是我想说什么...")
  .pause(1000)
  .move(-3) // 移动光标
  .delete(5)
  .type("真正")
  .move(null, { to: "END" })
  .type("。")
  .break()
  .pause(500)
  .type("重点是：<span class='text-pink-400'>我可以控制一切细节。</span>")
  .go();
}

// 代码编写
function startCode() {
  if (codeInstance) codeInstance.destroy();
  
  codeInstance = new TypeIt("#type-code", {
    speed: 30, // 打字速度
    cursor: true
  })
  .type("<span class='text-purple-400'>function</span> <span class='text-blue-400'>calculate</span>() {")
  .break()
  .type("  <span class='text-purple-400'>const</span> result = 1 + ")
  .pause(500) // 思考一下
  .type("2;")
  .break()
  .type("  <span class='text-purple-400'>return</span> result;")
  .break()
  .type("}")
  .go();
}

// 输入框占位符
new TypeIt("#type-input", {
  strings: ["搜索文档...", "查找 API...", "如何使用 TypeIt?"],
  speed: 100,
  breakLines: false,
  autoStart: true,
  loop: true,
  nextStringDelay: 2000
}).go();

// 初始化
startBasic();
</script>

<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/js_template_typeit.md"></script>

</body>
</html>
