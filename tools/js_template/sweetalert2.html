  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SweetAlert2 美化弹窗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-3xl mx-auto flex justify-between items-center mb-12">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">🍭 SweetAlert2 美化弹窗</h1>
    <p class="text-slate-500 mt-1">替代原生 Alert 的美观、响应式、可定制弹出框</p>
  </div>
  <a href="index.html" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">← 返回导航</a>
</header>

<main class="max-w-3xl mx-auto space-y-8">

  <!-- Basic Types -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <button onclick="showSuccess()" class="p-4 bg-emerald-50 text-emerald-700 rounded-xl hover:bg-emerald-100 transition border border-emerald-200 font-bold text-left flex items-center gap-3">
      ✅ 成功提示 (Success)
    </button>
    <button onclick="showError()" class="p-4 bg-rose-50 text-rose-700 rounded-xl hover:bg-rose-100 transition border border-rose-200 font-bold text-left flex items-center gap-3">
      ❌ 错误提示 (Error)
    </button>
    <button onclick="showWarning()" class="p-4 bg-amber-50 text-amber-700 rounded-xl hover:bg-amber-100 transition border border-amber-200 font-bold text-left flex items-center gap-3">
      ⚠️ 确认对话框 (Confirm)
    </button>
    <button onclick="showImage()" class="p-4 bg-indigo-50 text-indigo-700 rounded-xl hover:bg-indigo-100 transition border border-indigo-200 font-bold text-left flex items-center gap-3">
      🖼 带图片弹窗 (Image)
    </button>
  </div>

  <!-- Advanced -->
  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mt-8">
    <h3 class="font-bold text-slate-700 mb-4">高级交互</h3>
    <button onclick="showInput()" class="px-6 py-3 bg-slate-800 text-white font-bold rounded-lg hover:bg-slate-900 transition shadow-lg">
      📩 输入框与异步请求 (Input & Async)
    </button>
    <p class="text-sm text-slate-500 mt-2">模拟输入 GitHub 用户名并获取头像。</p>
  </div>

</main>

<script>
  function showSuccess() {
    Swal.fire({
      icon: 'success',
      title: '操作成功',
      text: '您的数据已成功保存！',
      showConfirmButton: false,
      timer: 1500
    });
  }

  function showError() {
    Swal.fire({
      icon: 'error',
      title: '哎呀...',
      text: '出现了一些问题，请稍后再试。',
      footer: '<a href="#">需要帮助?</a>'
    });
  }

  function showWarning() {
    Swal.fire({
      title: '确定要删除吗?',
      text: "此操作无法撤销!",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3085d6',
      cancelButtonColor: '#d33',
      confirmButtonText: '是的，删除它!',
      cancelButtonText: '取消'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire(
          '已删除!',
          '文件已被删除。',
          'success'
        )
      }
    });
  }

  function showImage() {
    Swal.fire({
      title: 'Sweet!',
      text: '图片弹窗示例',
      imageUrl: 'https://unsplash.it/400/200',
      imageWidth: 400,
      imageHeight: 200,
      imageAlt: 'Custom image'
    });
  }

  function showInput() {
    Swal.fire({
      title: '输入 GitHub 用户名',
      input: 'text',
      inputAttributes: {
        autocapitalize: 'off'
      },
      showCancelButton: true,
      confirmButtonText: '查找',
      showLoaderOnConfirm: true,
      preConfirm: (login) => {
        return fetch(`https://api.github.com/users/${login}`)
          .then(response => {
            if (!response.ok) {
              throw new Error(response.statusText)
            }
            return response.json()
          })
          .catch(error => {
            Swal.showValidationMessage(
              `请求失败: ${error}`
            )
          })
      },
      allowOutsideClick: () => !Swal.isLoading()
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire({
          title: `${result.value.login}'s avatar`,
          imageUrl: result.value.avatar_url,
          imageWidth: 200
        })
      }
    })
  }
</script>

</html>
