<!doctype html>
<html lang="zh">
<head>
<!-- Google tag (gtag.js) -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Driver.js 页面引导</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css"/>
  <style>
    body { font-family: 'Inter', sans-serif; background: #e2e8f0; min-height: 100vh; color: #1e293b; }
    .glass { background: white; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    /* Driver.js 自定义样式 */
    .driver-popover.driverjs-theme {
      background-color: #1e293b;
      color: white;
    }
    .driver-popover.driverjs-theme .driver-popover-title { color: #fff; font-size: 18px; }
    .driver-popover.driverjs-theme .driver-popover-description { color: #94a3b8; }
    .driver-popover.driverjs-theme button {
      background-color: #3b82f6;
      color: white;
      text-shadow: none;
      border: none;
    }
    .driver-popover.driverjs-theme button:hover { background-color: #2563eb; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header id="page-header" class="max-w-5xl mx-auto flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">🚗 Driver.js</h1>
    <p class="text-slate-500 mt-1">轻量级、无依赖的页面引导库</p>
  </div>
  <div class="flex gap-4">
    <button onclick="startTour()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold shadow-lg shadow-blue-500/30 transition-transform hover:-translate-y-1">开始引导</button>
    <a href="index.html" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50">← 返回</a>
  </div>
</header>

<main class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
  
  <!-- 侧边栏模拟 -->
  <aside id="sidebar" class="glass p-6 rounded-2xl col-span-1 h-full">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">👤</div>
      <div>
        <div class="font-bold">用户面板</div>
        <div class="text-xs text-slate-400">管理您的账户</div>
      </div>
    </div>
    <nav class="space-y-2">
      <div class="p-3 bg-slate-50 rounded-lg text-slate-600 cursor-pointer hover:bg-blue-50 hover:text-blue-600">仪表盘</div>
      <div class="p-3 bg-slate-50 rounded-lg text-slate-600 cursor-pointer hover:bg-blue-50 hover:text-blue-600">设置</div>
      <div class="p-3 bg-slate-50 rounded-lg text-slate-600 cursor-pointer hover:bg-blue-50 hover:text-blue-600">通知</div>
    </nav>
  </aside>

  <!--哪怕主要内容 -->
  <section class="col-span-1 md:col-span-2 space-y-6">
    <!-- 统计卡片 -->
    <div class="grid grid-cols-2 gap-4">
      <div id="stat-1" class="glass p-6 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 text-white border-none">
        <div class="text-4xl font-bold mb-1">1,234</div>
        <div class="text-blue-100 text-sm">今日访问</div>
      </div>
      <div id="stat-2" class="glass p-6 rounded-2xl bg-gradient-to-br from-purple-500 to-purple-600 text-white border-none">
        <div class="text-4xl font-bold mb-1">89%</div>
        <div class="text-purple-100 text-sm">转化率</div>
      </div>
    </div>

    <!-- 复杂功能区 -->
    <div id="feature-box" class="glass p-8 rounded-2xl relative overflow-hidden">
      <div class="absolute top-0 right-0 p-4 bg-yellow-100 text-yellow-700 text-xs font-bold rounded-bl-xl">HOT Feature</div>
      <h3 class="font-bold text-xl mb-4 text-slate-800">✨ 核心功能区</h3>
      <p class="text-slate-500 mb-6 leading-relaxed">
        这是一个重要的功能模块，通常比较复杂。使用 Driver.js 可以帮助用户快速理解这里的功能，而不必编写冗长的文档。
      </p>
      <div class="flex gap-3">
        <button class="px-4 py-2 bg-slate-800 text-white rounded-lg pointer-events-none">操作 A</button>
        <button class="px-4 py-2 border border-slate-300 rounded-lg pointer-events-none text-slate-500">操作 B</button>
      </div>
    </div>

    <!-- 提示区 -->
    <div id="help-footer" class="text-center text-slate-400 text-sm py-8">
      需要帮助? <a href="#" class="text-blue-500 underline">联系支持</a>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js"></script>
<script>
const driver = window.driver.js.driver;

const driverObj = driver({
  showProgress: true,
  animate: true,
  allowClose: false,
  doneBtnText: '完成',
  nextBtnText: '下一步',
  prevBtnText: '上一步',
  // 自定义主题类名
  popoverClass: 'driverjs-theme',
  steps: [
    { 
      element: '#page-header', 
      popover: { 
        title: '欢迎使用 Driver.js', 
        description: '这是一个简单的页面引导示例。让我们花1分钟了解页面结构。', 
        side: "bottom", 
        align: 'start' 
      } 
    },
    { 
      element: '#sidebar', 
      popover: { 
        title: '侧边导航栏', 
        description: '在这里您可以访问仪表盘、设置和通知中心。', 
        side: "right", 
        align: 'start' 
      } 
    },
    { 
      element: '#stat-1', 
      popover: { 
        title: '关键指标', 
        description: '实时显示今日的核心业务数据。支持高亮任意 DOM 元素。', 
        side: "bottom" 
      } 
    },
    { 
      element: '#feature-box', 
      popover: { 
        title: '核心功能区', 
        description: '这是页面最重要的部分。您可以详细解释复杂的操作流程。', 
        side: "top", 
        align: 'center' 
      } 
    },
    { 
      element: '#help-footer', 
      popover: { 
        title: '获取帮助', 
        description: '如果遇到任何问题，随时可以点击这里联系我们。', 
        side: "top", 
        align: 'center' 
      } 
    },
    {
      popover: {
        title: '演示结束 🎉',
        description: '您已经了解了页面的基本功能。现在开始探索吧！'
      }
    }
  ],
  onDestroyStarted: () => {
    if(!driverObj.hasNextStep() || confirm("确定要退出引导吗？")) {
      driverObj.destroy();
    }
  }
});

function startTour() {
  driverObj.drive();
}

// 自动开始（仅演示）
// setTimeout(startTour, 1000);
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
