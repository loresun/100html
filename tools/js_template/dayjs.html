<html lang="zh">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day.js 日期库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/relativeTime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/zh-cn.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff7ed; color: #9a3412; }
    .glass { background: white; border: 1px solid #ffedd5; box-shadow: 0 4px 6px -1px rgba(251, 146, 60, 0.05); }
    .code { font-family: 'JetBrains Mono', monospace; color: #c2410c; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-orange-900">⏰ Day.js</h1>
    <p class="text-orange-800/60 mt-2 text-lg">仅 2KB 的轻量级日期处理库 (Moment.js 的现代替代品)</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-orange-200 text-orange-800 rounded-lg hover:bg-orange-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-6">

  <!-- 实时时钟 -->
  <div class="glass p-8 rounded-2xl text-center">
    <div class="text-sm text-orange-400 font-bold tracking-widest uppercase mb-2">Current Time</div>
    <div id="clock" class="text-5xl md:text-7xl font-bold text-orange-600 font-mono tracking-tighter">
      --:--:--
    </div>
    <div id="date-str" class="mt-4 text-orange-800/60 text-lg">
      Loading...
    </div>
  </div>

  <!-- 功能演示 -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- 格式化 -->
    <div class="glass p-6 rounded-xl">
      <h3 class="font-bold text-orange-900 mb-4">📅 格式化 (Format)</h3>
      <div class="space-y-3 text-sm">
        <div class="flex justify-between border-b border-orange-100 pb-2">
          <span class="text-orange-400">YYYY-MM-DD</span>
          <span class="code font-bold" id="fmt-1"></span>
        </div>
        <div class="flex justify-between border-b border-orange-100 pb-2">
          <span class="text-orange-400">DD/MM/YYYY</span>
          <span class="code font-bold" id="fmt-2"></span>
        </div>
        <div class="flex justify-between border-b border-orange-100 pb-2">
          <span class="text-orange-400">MMMM D, YYYY</span>
          <span class="code font-bold" id="fmt-3"></span>
        </div>
      </div>
    </div>

    <!-- 相对时间 -->
    <div class="glass p-6 rounded-xl">
      <h3 class="font-bold text-orange-900 mb-4">⏳ 相对时间 (Relative Time)</h3>
      <div class="space-y-3 text-sm">
        <div class="flex justify-between border-b border-orange-100 pb-2">
          <span class="text-orange-400">2023-01-01</span>
          <span class="code font-bold" id="rel-1"></span>
        </div>
        <div class="flex justify-between border-b border-orange-100 pb-2">
          <span class="text-orange-400">3 days ago</span>
          <span class="code font-bold" id="rel-2"></span>
        </div>
        <div class="flex justify-between border-b border-orange-100 pb-2">
          <span class="text-orange-400">Next Month</span>
          <span class="code font-bold" id="rel-3"></span>
        </div>
      </div>
    </div>

  </div>

  <!-- 操作演示 -->
  <div class="glass p-6 rounded-xl">
    <h3 class="font-bold text-orange-900 mb-4">🧮 日期运算 (Add/Subtract)</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
      <div class="bg-orange-50 p-4 rounded border border-orange-100">
        <div class="text-xs text-orange-400 mb-1">现在</div>
        <div class="font-bold text-orange-800" id="op-now"></div>
      </div>
      <div class="flex items-center justify-center text-orange-300">
        + 7 天 = 
      </div>
      <div class="bg-orange-100 p-4 rounded border border-orange-200">
        <div class="text-xs text-orange-500 mb-1">未来</div>
        <div class="font-bold text-orange-900" id="op-future"></div>
      </div>
    </div>
  </div>

</main>

<script>
  // 插件与本地化
  dayjs.extend(window.dayjs_plugin_relativeTime);
  dayjs.locale('zh-cn'); // 使用中文

  // 1. Clock
  function updateClock() {
    const now = dayjs();
    document.getElementById('clock').innerText = now.format('HH:mm:ss');
    document.getElementById('date-str').innerText = now.format('YYYY年 MMMM D日 dddd');
    requestAnimationFrame(updateClock);
  }
  updateClock();

  // 2. Format
  const now = dayjs();
  document.getElementById('fmt-1').innerText = now.format('YYYY-MM-DD');
  document.getElementById('fmt-2').innerText = now.format('DD/MM/YYYY');
  document.getElementById('fmt-3').innerText = now.format('MMMM D, YYYY');

  // 3. Relative
  document.getElementById('rel-1').innerText = dayjs('2023-01-01').fromNow();
  document.getElementById('rel-2').innerText = dayjs().subtract(3, 'day').fromNow();
  document.getElementById('rel-3').innerText = dayjs().add(1, 'month').fromNow();

  // 4. Operation
  document.getElementById('op-now').innerText = now.format('MM-DD');
  document.getElementById('op-future').innerText = now.add(7, 'day').format('MM-DD');

</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
