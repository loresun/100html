<!doctype html>
<html lang="zh">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Granim.js 渐变动画</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
    #canvas-basic { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
    .glass { backdrop-filter: blur(10px); background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="text-white">

<!-- 背景 Canvas -->
<canvas id="canvas-basic"></canvas>

<div class="relative z-10 p-6 md:p-12 min-h-screen flex flex-col">
  <header class="max-w-4xl mx-auto w-full flex justify-between items-center mb-12">
    <div>
      <h1 class="text-4xl font-bold drop-shadow-md">🌈 Granim.js</h1>
      <p class="text-white/80 mt-2 text-lg drop-shadow-md">流畅的交互式渐变动画引擎</p>
    </div>
    <a href="index.html" class="px-6 py-2 glass rounded-full text-white hover:bg-white/20 transition-all">← 返回</a>
  </header>

  <main class="max-w-4xl mx-auto w-full flex-1 flex flex-col justify-center gap-8">
    
    <!-- 状态控制 -->
    <div class="glass p-8 rounded-3xl">
      <h3 class="font-bold text-2xl mb-6 flex items-center gap-2">
        <span>🎨</span> 切换状态 (State)
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <button onclick="changeState('default-state')" class="px-6 py-4 bg-white/10 rounded-2xl hover:bg-white/20 font-bold transition-all border border-white/10 text-left group">
          <div class="text-xs text-white/50 mb-1">State: Default</div>
          <div class="text-xl group-hover:translate-x-1 transition-transform">🔵 默认渐变</div>
        </button>
        <button onclick="changeState('violet-state')" class="px-6 py-4 bg-white/10 rounded-2xl hover:bg-white/20 font-bold transition-all border border-white/10 text-left group">
          <div class="text-xs text-white/50 mb-1">State: Violet</div>
          <div class="text-xl group-hover:translate-x-1 transition-transform">💜 紫罗兰风</div>
        </button>
        <button onclick="changeState('orange-state')" class="px-6 py-4 bg-white/10 rounded-2xl hover:bg-white/20 font-bold transition-all border border-white/10 text-left group">
          <div class="text-xs text-white/50 mb-1">State: Orange</div>
          <div class="text-xl group-hover:translate-x-1 transition-transform">🧡 橙色暖阳</div>
        </button>
      </div>
    </div>

    <!-- 混合模式 -->
    <div class="glass p-8 rounded-3xl relative overflow-hidden group">
      <div class="absolute inset-0 bg-[url('https://source.unsplash.com/random/1920x1080/?texture')] bg-cover opacity-20 mix-blend-overlay pointer-events-none"></div>
      <h3 class="font-bold text-2xl mb-4 relative z-10">🖼️ 图片混合模式</h3>
      <p class="text-white/80 mb-6 relative z-10 max-w-lg">
        Granim 可以和背景图片进行混合，创造出令人惊叹的视觉效果。当前的背景正在与纹理图片进行混合。
      </p>
      <div class="flex gap-4 relative z-10">
        <div class="px-4 py-2 rounded-lg bg-black/30 border border-white/20">multiply</div>
        <div class="px-4 py-2 rounded-lg bg-black/30 border border-white/20">overlay</div>
        <div class="px-4 py-2 rounded-lg bg-black/30 border border-white/20">screen</div>
      </div>
    </div>

    <!-- 交互提示 -->
    <div class="text-center text-white/60 text-sm mt-auto">
      观察背景的平滑过渡 · 支持自定义方向、透明度和循环模式
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/granim@2.0.0/dist/granim.min.js"></script>
<script>
const granimInstance = new Granim({
    element: '#canvas-basic',
    direction: 'left-right',
    isPausedWhenNotInView: true,
    states : {
        "default-state": {
            gradients: [
                ['#ff9966', '#ff5e62'],
                ['#00F260', '#0575E6'],
                ['#e1eec3', '#f05053']
            ],
            transitionSpeed: 2000
        },
        "violet-state": {
            gradients: [
                ['#834d9b', '#d04ed6'],
                ['#1CD8D2', '#93EDC7']
            ],
            transitionSpeed: 2000
        },
        "orange-state": {
            gradients: [
                ['#FF4E50', '#F9D423'],
                ['#f12711', '#f5af19']
            ],
            transitionSpeed: 2000
        }
    }
});

function changeState(state) {
    granimInstance.changeState(state);
}
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
