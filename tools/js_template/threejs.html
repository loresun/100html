  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js 3D 展厅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #334155; margin: 0; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    .ui-panel {
      position: absolute; top: 20px; left: 20px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      width: 280px;
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div class="ui-panel">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold text-slate-800">🧊 Three.js</h1>
    <a href="index.html" class="text-xs text-blue-600 hover:underline">退出</a>
  </div>
  <p class="text-slate-500 text-sm mb-6">WebGL 3D 引擎演示</p>

  <div class="space-y-4">
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-2">几何体 (Geometry)</label>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="changeMesh('box')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded text-sm text-slate-700 transition">正方体</button>
        <button onclick="changeMesh('torus')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded text-sm text-slate-700 transition">圆环体</button>
        <button onclick="changeMesh('sphere')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded text-sm text-slate-700 transition">球体</button>
        <button onclick="changeMesh('knot')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded text-sm text-slate-700 transition">扭结</button>
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-2">材质 (Material)</label>
      <div class="flex gap-2">
        <button onclick="changeMaterial('standard')" class="flex-1 px-3 py-2 bg-blue-100 text-blue-700 rounded text-sm font-bold">标准</button>
        <button onclick="changeMaterial('wireframe')" class="flex-1 px-3 py-2 bg-slate-100 text-slate-700 rounded text-sm">线框</button>
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-2">自动旋转</label>
      <input type="checkbox" id="auto-rotate" checked class="accent-blue-600">
    </div>
  </div>
  
  <div class="mt-6 pt-4 border-t border-slate-200 text-xs text-slate-400">
    交互操作: <br>
    - 左键拖拽旋转<br>
    - 右键拖拽平移<br>
    - 滚轮缩放
  </div>
</div>

<!-- Import maps polyfill -->
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // 1. Scene Setup
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf8fafc); // Light background
  // Add some fog for depth
  scene.fog = new THREE.Fog(0xf8fafc, 10, 50);

  // 2. Camera
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 5, 10);

  // 3. Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Softer shadows
  container.appendChild(renderer.domElement);

  // 4. Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 10, 7);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  scene.add(dirLight);
  
  // Add a rim light for aesthetics
  const spotLight = new THREE.SpotLight(0x38bdf8, 5); // Light blue rim
  spotLight.position.set(-5, 5, -5);
  spotLight.lookAt(0,0,0);
  scene.add(spotLight);

  // 5. Floor
  const planeGeometry = new THREE.PlaneGeometry(100, 100);
  const planeMaterial = new THREE.MeshStandardMaterial({ 
    color: 0xffffff,
    roughness: 0.8,
    metalness: 0.1
  });
  const plane = new THREE.Mesh(planeGeometry, planeMaterial);
  plane.rotation.x = -Math.PI / 2;
  plane.receiveShadow = true;
  scene.add(plane);

  // Grid Helper
  const gridHelper = new THREE.GridHelper(100, 100, 0xe2e8f0, 0xe2e8f0);
  scene.add(gridHelper);

  // 6. Objects
  let currentMesh;
  const materials = {
    standard: new THREE.MeshPhysicalMaterial({
      color: 0x6366f1, // Indigo
      roughness: 0.1,
      metalness: 0.1,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    }),
    wireframe: new THREE.MeshBasicMaterial({
      color: 0x6366f1,
      wireframe: true
    })
  };

  const geometries = {
    box: new THREE.BoxGeometry(2, 2, 2),
    sphere: new THREE.SphereGeometry(1.5, 32, 32),
    torus: new THREE.TorusGeometry(1.5, 0.6, 16, 100),
    knot: new THREE.TorusKnotGeometry(1, 0.3, 100, 16)
  };

  function createMesh(geoKey, matKey) {
    if (currentMesh) {
      scene.remove(currentMesh);
      // Optional: dispose geometry/material if not reused to save memory
    }
    
    const geometry = geometries[geoKey];
    const material = materials[matKey];
    
    currentMesh = new THREE.Mesh(geometry, material);
    currentMesh.position.y = 2;
    currentMesh.castShadow = true;
    currentMesh.receiveShadow = true;
    scene.add(currentMesh);
  }

  // Initial Mesh
  createMesh('knot', 'standard');

  // 7. Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // 8. Animation Loop
  function animate() {
    requestAnimationFrame(animate);

    if (document.getElementById('auto-rotate').checked && currentMesh) {
      currentMesh.rotation.x += 0.005;
      currentMesh.rotation.y += 0.01;
    }

    controls.update(); // only required if controls.enableDamping = true, or if controls.autoRotate = true
    renderer.render(scene, camera);
  }

  animate();

  // Resize Handler
  window.addEventListener('resize', onWindowResize, false);
  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // UI Event Binding (Need to attach to window scope for non-module HTML onclick access, or addEventListeners properly)
  window.changeMesh = (type) => {
    // Check current material type based on which button was active (simplified logic here)
    // We default to standard for geometry change for simplicity
    createMesh(type, 'standard');
  };
  
  window.changeMaterial = (type) => {
    // Reuse current geometry
    let currentGeoKey = 'box'; // This logic is imperfect without state tracking, but sufficient for simple demo
    // Ideally we track state. 
    
    // Quick fix: find which geometry matches currentMesh.geometry params
    // Simply update current mesh material
    if(currentMesh) {
      currentMesh.material = materials[type];
    }
  };

</script>
