  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meyda 音频分析</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Meyda & Chart.js for viz -->
  <script src="https://cdn.jsdelivr.net/npm/meyda@5.6.0/dist/web/meyda.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #ecfeff; color: #164e63; }
    .glass { background: white; border: 1px solid #cffafe; box-shadow: 0 4px 6px -1px rgba(8, 145, 178, 0.05); }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12 min-h-screen flex flex-col">

  <header class="flex justify-between items-center mb-8">
     <div>
       <h1 class="text-3xl font-bold text-cyan-900">🎵 Meyda Audio</h1>
       <p class="text-cyan-800/60 mt-2">实时音频特征提取与可视化</p>
     </div>
     <a href="index.html" class="px-5 py-2 glass text-cyan-800 rounded-lg hover:bg-cyan-50 transition">返回</a>
  </header>

  <main class="max-w-4xl mx-auto w-full space-y-6 flex-1">
    
    <!-- Controls -->
    <div class="glass p-6 rounded-2xl flex justify-center gap-6 items-center">
      <button id="start-btn" class="px-8 py-3 bg-cyan-600 text-white rounded-full font-bold shadow hover:bg-cyan-700 transition">
        启动麦克风
      </button>
      <div class="text-sm text-cyan-600/60">
        Feature Extraction: <span class="font-mono font-bold text-cyan-800">MFCC + Chroma</span>
      </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Chart 1: Chroma -->
      <div class="glass p-6 rounded-2xl">
        <h3 class="font-bold text-cyan-900 mb-4">Chroma (音阶分布)</h3>
        <canvas id="chromaChart"></canvas>
      </div>

      <!-- Chart 2: RMS -->
      <div class="glass p-6 rounded-2xl flex flex-col justify-center items-center text-center">
        <h3 class="font-bold text-cyan-900 mb-4">Loudness (响度)</h3>
        <div class="w-24 h-64 bg-slate-100 rounded-full relative overflow-hidden border border-slate-200">
           <div id="rms-bar" class="absolute bottom-0 left-0 w-full bg-cyan-500 transition-all duration-75" style="height: 0%"></div>
        </div>
        <div id="rms-val" class="mt-4 font-mono text-2xl font-bold text-cyan-600">0.00</div>
      </div>
      
    </div>

  </main>

<script>
  const startBtn = document.getElementById('start-btn');
  const rmsBar = document.getElementById('rms-bar');
  const rmsVal = document.getElementById('rms-val');
  
  let audioContext;
  let source;
  let analyzer;
  let isRunning = false;
  let chromaChartRef;

  // Chart Setup
  const ctx = document.getElementById('chromaChart').getContext('2d');
  chromaChartRef = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'],
      datasets: [{
        label: 'Intensity',
        data: Array(12).fill(0),
        backgroundColor: '#06b6d4',
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      animation: { duration: 50 }, // fast update
      scales: { y: { min: 0, max: 1 } },
      plugins: { legend: { display: false } }
    }
  });

  startBtn.addEventListener('click', async () => {
    if(isRunning) return;
    
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      source = audioContext.createMediaStreamSource(stream);
      
      // Meyda Setup
      analyzer = Meyda.createMeydaAnalyzer({
        "audioContext": audioContext,
        "source": source,
        "bufferSize": 512,
        "featureExtractors": ["rms", "chroma"],
        "callback": (features) => {
          updateViz(features);
        }
      });
      
      analyzer.start();
      isRunning = true;
      startBtn.innerText = "正在分析...";
      startBtn.classList.add('opacity-50', 'cursor-not-allowed');
      startBtn.disabled = true;

    } catch(e) {
      alert("无法访问麦克风: " + e.message);
    }
  });

  function updateViz(features) {
    if(!features) return;

    // Update RMS (Loudness)
    const rms = features.rms;
    rmsBar.style.height = Math.min(rms * 400, 100) + '%'; // Scale up
    rmsVal.innerText = rms.toFixed(3);
    
    // Update Chroma Chart
    chromaChartRef.data.datasets[0].data = features.chroma;
    chromaChartRef.update('none'); // 'none' for perf
  }

</script>

<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
