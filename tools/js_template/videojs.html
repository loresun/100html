<!doctype html>
<html lang="zh">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video.js 视频播放器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
  <!-- City 皮肤 -->
  <link href="https://unpkg.com/@videojs/themes@1/dist/city/index.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #334155; }
    .glass { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    /* 自定义播放器圆角 */
    .video-js { border-radius: 12px; overflow: hidden; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-5xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">📺 Video.js</h1>
    <p class="text-slate-500 mt-2 text-lg">世界上最流行的开源 HTML5 视频播放器框架</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-lg hover:border-slate-300 hover:bg-slate-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-5xl mx-auto space-y-12">

  <!-- 主播放器 -->
  <section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2">
      <div class="rounded-2xl shadow-xl overflow-hidden bg-black aspect-video relative">
        <video
          id="my-video"
          class="video-js vjs-theme-city vjs-big-play-centered w-full h-full"
          controls
          preload="auto"
          poster="https://vjs.zencdn.net/v/oceans.png"
          data-setup="{}"
        >
          <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4" />
          <p class="vjs-no-js">
            To view this video please enable JavaScript, and consider upgrading to a
            web browser that
            <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
          </p>
        </video>
      </div>
      <div class="mt-4 flex gap-4">
        <button onclick="player.play()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">播放</button>
        <button onclick="player.pause()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 font-medium">暂停</button>
        <button onclick="changeSource()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-medium ml-auto">切换视频源</button>
      </div>
    </div>

    <!-- 侧边信息栏 -->
    <div class="space-y-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <h3 class="font-bold text-slate-800 mb-2">当前视频</h3>
        <p class="text-slate-500 text-sm mb-4">The Oceans (示例视频)</p>
        <div class="flex items-center gap-2 text-xs text-slate-400 mb-2">
          <span>分辨率: 720p</span>
          <span>•</span>
          <span>格式: MP4</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2 mt-2">
          <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-xs text-slate-400 mt-1">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <h3 class="font-bold text-slate-800 mb-4">事件日志</h3>
        <div id="video-log" class="font-mono text-xs text-slate-600 h-32 overflow-y-auto space-y-1 bg-slate-50 p-3 rounded-lg border border-slate-100">
          <div class="text-slate-400">// 播放器就绪</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 特性展示 -->
  <section class="grid grid-cols-2 md:grid-cols-4 gap-6">
    <div class="bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm hover:shadow-md transition-shadow">
      <div class="text-2xl mb-2">🎨</div>
      <div class="font-bold text-slate-700">主题支持</div>
      <div class="text-xs text-slate-400 mt-1">City, Fantasy, Forest...</div>
    </div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm hover:shadow-md transition-shadow">
      <div class="text-2xl mb-2">🔌</div>
      <div class="font-bold text-slate-700">插件生态</div>
      <div class="text-xs text-slate-400 mt-1">HLS, DASH, 广告植入</div>
    </div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm hover:shadow-md transition-shadow">
      <div class="text-2xl mb-2">📱</div>
      <div class="font-bold text-slate-700">跨平台</div>
      <div class="text-xs text-slate-400 mt-1">桌面 + 移动端完美适配</div>
    </div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm hover:shadow-md transition-shadow">
      <div class="text-2xl mb-2">♿</div>
      <div class="font-bold text-slate-700">无障碍</div>
      <div class="text-xs text-slate-400 mt-1">完全支持键盘操作</div>
    </div>
  </section>

</main>

<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
<script>
  var player = videojs('my-video');

  player.ready(function() {
    log('播放器初始化完成');
  });

  player.on('play', function() {
    log('开始播放 ▶️');
  });

  player.on('pause', function() {
    log('暂停播放 ⏸️');
  });

  player.on('timeupdate', function() {
    var percent = (player.currentTime() / player.duration()) * 100;
    document.getElementById('progress-bar').style.width = percent + '%';
    document.getElementById('current-time').innerText = formatTime(player.currentTime());
    document.getElementById('duration').innerText = formatTime(player.duration());
  });

  function log(msg) {
    var logDiv = document.getElementById('video-log');
    var p = document.createElement('div');
    p.innerText = '> ' + msg;
    logDiv.appendChild(p);
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function formatTime(seconds) {
    if(isNaN(seconds)) return "0:00";
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function changeSource() {
    log('切换视频源...');
    player.src({ type: 'video/mp4', src: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' });
    player.play();
  }
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
