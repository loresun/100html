  <meta charset="utf-8" />

  <title>FlexSearch 高速全文检索</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%); min-height: 100vh; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .highlight { background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%); color: #000; padding: 0 4px; border-radius: 4px; }

  </style>

<body class="p-6 md:p-12 text-white">

<header class="max-w-5xl mx-auto flex justify-between items-center mb-8">
  <div>
    <h1 class="text-3xl font-bold">🔍 FlexSearch 高速全文检索</h1>
    <p class="text-white/60 mt-1">Web 最快的全文搜索库 - 支持模糊匹配、分词、多语言</p>
  </div>
  <a href="index.html" class="px-4 py-2 glass rounded-lg text-white hover:bg-white/20 transition-colors">← 返回导航</a>
</header>

<main class="max-w-5xl mx-auto space-y-6">

  <!-- 搜索区域 -->
  <div class="glass p-6 rounded-2xl">
    <div class="relative">
      <input type="text" id="search-input" 
             class="w-full px-6 py-4 pl-14 bg-slate-900/60 border border-purple-500/30 rounded-2xl text-white text-lg focus:outline-none focus:ring-2 focus:ring-purple-500/50"
             placeholder="输入关键词搜索..." autocomplete="off">
      <span class="absolute left-5 top-1/2 -translate-y-1/2 text-2xl">🔍</span>
      <div id="search-stats" class="absolute right-5 top-1/2 -translate-y-1/2 text-sm text-purple-300"></div>
    </div>
  </div>

  <!-- 搜索结果 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
      <span class="w-8 h-8 bg-purple-500/30 rounded-lg flex items-center justify-center">📋</span>
      搜索结果
    </h3>
    <div id="search-results" class="space-y-3 max-h-[400px] overflow-y-auto">
      <div class="text-white/40 text-center py-8">开始输入以搜索...</div>
    </div>
  </div>

  <!-- 数据源管理 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
      <span class="w-8 h-8 bg-emerald-500/30 rounded-lg flex items-center justify-center">📚</span>
      数据源管理
    </h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 添加文档 -->
      <div class="space-y-3">
        <input type="text" id="doc-title" placeholder="标题" 
               class="w-full px-4 py-2 bg-slate-900/50 border border-white/20 rounded-lg text-white">
        <textarea id="doc-content" rows="3" placeholder="内容" 
                  class="w-full px-4 py-2 bg-slate-900/50 border border-white/20 rounded-lg text-white resize-none"></textarea>
        <div class="flex gap-2">
          <button onclick="addDocument()" class="flex-1 px-4 py-2 bg-emerald-600 rounded-lg hover:bg-emerald-700 font-bold">
            ➕ 添加文档
          </button>
          <button onclick="loadSampleData()" class="px-4 py-2 bg-slate-700 rounded-lg hover:bg-slate-600">
            📥 加载示例
          </button>
        </div>
      </div>
      
      <!-- 索引信息 -->
      <div class="bg-slate-900/50 p-4 rounded-xl">
        <div class="text-xs text-white/40 mb-3">索引统计</div>
        <div class="grid grid-cols-2 gap-4 text-center">
          <div>
            <div id="stat-docs" class="text-3xl font-bold text-emerald-400">0</div>
            <div class="text-white/50 text-sm">文档数量</div>
          </div>
          <div>
            <div id="stat-searches" class="text-3xl font-bold text-purple-400">0</div>
            <div class="text-white/50 text-sm">搜索次数</div>
          </div>
        </div>
        <button onclick="clearIndex()" class="mt-4 w-full px-4 py-2 bg-red-600/30 border border-red-500/50 rounded-lg hover:bg-red-600/50 text-red-300">
          🗑️ 清空索引
        </button>
      </div>
    </div>
  </div>

  <!-- 搜索配置 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
      <span class="w-8 h-8 bg-cyan-500/30 rounded-lg flex items-center justify-center">⚙️</span>
      搜索配置
    </h3>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="text-white/70 text-sm block mb-2">搜索限制</label>
        <select id="search-limit" class="w-full px-3 py-2 bg-slate-900/50 border border-white/20 rounded-lg text-white">
          <option value="5">5 条结果</option>
          <option value="10" selected>10 条结果</option>
          <option value="20">20 条结果</option>
          <option value="50">50 条结果</option>
        </select>
      </div>
      <div>
        <label class="text-white/70 text-sm block mb-2">匹配策略</label>
        <select id="search-suggest" class="w-full px-3 py-2 bg-slate-900/50 border border-white/20 rounded-lg text-white">
          <option value="false">精确匹配</option>
          <option value="true" selected>建议匹配 (模糊)</option>
        </select>
      </div>
      <div>
        <label class="text-white/70 text-sm block mb-2">搜索字段</label>
        <select id="search-field" class="w-full px-3 py-2 bg-slate-900/50 border border-white/20 rounded-lg text-white">
          <option value="all" selected>全部字段</option>
          <option value="title">仅标题</option>
          <option value="content">仅内容</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 高级功能演示 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
      <span class="w-8 h-8 bg-orange-500/30 rounded-lg flex items-center justify-center">🎯</span>
      高级功能演示
    </h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <button onclick="demoAsync()" class="p-4 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left transition-colors">
        <div class="text-lg mb-1">⚡ 异步搜索</div>
        <div class="text-white/50 text-sm">不阻塞主线程的搜索</div>
      </button>
      <button onclick="demoExport()" class="p-4 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left transition-colors">
        <div class="text-lg mb-1">💾 导出索引</div>
        <div class="text-white/50 text-sm">将索引序列化为 JSON</div>
      </button>
      <button onclick="demoBenchmark()" class="p-4 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left transition-colors">
        <div class="text-lg mb-1">🚀 性能测试</div>
        <div class="text-white/50 text-sm">批量搜索速度基准</div>
      </button>
      <button onclick="demoMultiWord()" class="p-4 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left transition-colors">
        <div class="text-lg mb-1">🔤 多词搜索</div>
        <div class="text-white/50 text-sm">AND/OR 组合搜索</div>
      </button>
    </div>
    
    <div id="demo-output" class="mt-4 p-4 bg-slate-900/60 rounded-xl mono text-sm text-cyan-300 min-h-[60px] hidden"></div>
  </div>

  <!-- 与其他搜索库对比 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4">📊 FlexSearch vs 其他搜索库</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-white/20">
            <th class="text-left py-2 px-3 text-white/70">特性</th>
            <th class="text-left py-2 px-3 text-purple-400">FlexSearch</th>
            <th class="text-left py-2 px-3 text-blue-400">Lunr.js</th>
            <th class="text-left py-2 px-3 text-orange-400">Fuse.js</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-white/10">
          <tr>
            <td class="py-2 px-3 text-white/70">搜索速度</td>
            <td class="py-2 px-3 text-emerald-400">⚡⚡⚡ 最快</td>
            <td class="py-2 px-3">⚡⚡ 较快</td>
            <td class="py-2 px-3">⚡ 一般</td>
          </tr>
          <tr>
            <td class="py-2 px-3 text-white/70">模糊搜索</td>
            <td class="py-2 px-3">✅ 支持</td>
            <td class="py-2 px-3">⚠️ 有限</td>
            <td class="py-2 px-3 text-emerald-400">✅ 强大</td>
          </tr>
          <tr>
            <td class="py-2 px-3 text-white/70">内存占用</td>
            <td class="py-2 px-3 text-emerald-400">低</td>
            <td class="py-2 px-3">中</td>
            <td class="py-2 px-3">低</td>
          </tr>
          <tr>
            <td class="py-2 px-3 text-white/70">中文支持</td>
            <td class="py-2 px-3">✅ 需配置</td>
            <td class="py-2 px-3">⚠️ 有限</td>
            <td class="py-2 px-3">✅ 良好</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
<script>
  // 创建 FlexSearch 文档索引
  const index = new FlexSearch.Document({
    document: {
      id: 'id',
      index: ['title', 'content'],
      store: ['title', 'content', 'category']
    },
    tokenize: 'forward',
    cache: true
  });
  
  // 统计数据
  let stats = { docs: 0, searches: 0 };
  let docId = 0;
  
  // 示例数据
  const sampleData = [
    { title: 'JavaScript 入门教程', content: '学习 JavaScript 基础语法、变量、函数和对象。', category: '编程' },
    { title: 'React 组件开发', content: 'React 函数组件、Hooks 和状态管理最佳实践。', category: '前端' },
    { title: 'Vue 3 Composition API', content: 'Vue 3 的 setup 函数、ref 和 reactive 响应式系统。', category: '前端' },
    { title: 'Node.js 服务器开发', content: '使用 Express 和 Koa 构建 RESTful API 服务。', category: '后端' },
    { title: 'TypeScript 类型系统', content: '接口、泛型、类型推断和高级类型技巧。', category: '编程' },
    { title: 'CSS Grid 布局', content: '网格布局、响应式设计和现代 CSS 技术。', category: '前端' },
    { title: 'Git 版本控制', content: '分支管理、合并冲突解决和团队协作工作流。', category: '工具' },
    { title: '机器学习入门', content: '监督学习、神经网络和深度学习基础概念。', category: 'AI' },
    { title: 'Python 数据分析', content: 'Pandas、NumPy 数据处理和可视化技术。', category: 'AI' },
    { title: 'Docker 容器化', content: '镜像构建、容器编排和 Kubernetes 部署。', category: '运维' },
  ];
  
  // =====================
  // 搜索功能
  // =====================
  document.getElementById('search-input').addEventListener('input', function(e) {
    const query = e.target.value.trim();
    if (!query) {
      document.getElementById('search-results').innerHTML = 
        '<div class="text-white/40 text-center py-8">开始输入以搜索...</div>';
      document.getElementById('search-stats').textContent = '';
      return;
    }
    
    performSearch(query);
  });
  
  function performSearch(query) {
    const startTime = performance.now();
    const limit = parseInt(document.getElementById('search-limit').value);
    const suggest = document.getElementById('search-suggest').value === 'true';
    const field = document.getElementById('search-field').value;
    
    let results;
    if (field === 'all') {
      results = index.search(query, { limit, suggest, enrich: true });
    } else {
      results = index.search(query, { limit, suggest, enrich: true, index: [field] });
    }
    
    const endTime = performance.now();
    const duration = (endTime - startTime).toFixed(2);
    
    stats.searches++;
    updateStats();
    
    // 合并结果
    const allResults = [];
    results.forEach(fieldResult => {
      fieldResult.result.forEach(item => {
        if (!allResults.find(r => r.id === item.id)) {
          allResults.push(item);
        }
      });
    });
    
    // 显示结果
    const container = document.getElementById('search-results');
    document.getElementById('search-stats').textContent = `${allResults.length} 结果 · ${duration}ms`;
    
    if (allResults.length === 0) {
      container.innerHTML = '<div class="text-white/40 text-center py-8">未找到匹配结果</div>';
      return;
    }
    
    container.innerHTML = allResults.map(item => {
      const doc = item.doc;
      const highlightedTitle = highlightText(doc.title, query);
      const highlightedContent = highlightText(doc.content, query);
      
      return `
        <div class="result-item p-4 bg-slate-800/50 rounded-xl border border-slate-700/50">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xs px-2 py-1 bg-purple-500/30 rounded text-purple-300">${doc.category}</span>
            <span class="font-bold text-white">${highlightedTitle}</span>
          </div>
          <div class="text-white/60 text-sm">${highlightedContent}</div>
        </div>
      `;
    }).join('');
  }
  
  // 高亮文本
  function highlightText(text, query) {
    if (!query) return text;
    const words = query.split(/\s+/);
    let result = text;
    words.forEach(word => {
      if (word) {
        const regex = new RegExp(`(${word})`, 'gi');
        result = result.replace(regex, '<span class="highlight">$1</span>');
      }
    });
    return result;
  }
  
  // =====================
  // 添加文档
  // =====================
  function addDocument() {
    const title = document.getElementById('doc-title').value.trim();
    const content = document.getElementById('doc-content').value.trim();
    
    if (!title || !content) {
      alert('请输入标题和内容');
      return;
    }
    
    index.add({
      id: docId++,
      title,
      content,
      category: '自定义'
    });
    
    stats.docs++;
    updateStats();
    
    document.getElementById('doc-title').value = '';
    document.getElementById('doc-content').value = '';
    
    alert('文档已添加到索引！');
  }
  
  // =====================
  // 加载示例数据
  // =====================
  function loadSampleData() {
    sampleData.forEach(doc => {
      index.add({ id: docId++, ...doc });
    });
    stats.docs += sampleData.length;
    updateStats();
    alert(`已加载 ${sampleData.length} 条示例数据！`);
  }
  
  // =====================
  // 清空索引
  // =====================
  function clearIndex() {
    if (!confirm('确定要清空所有索引数据吗？')) return;
    
    // 重新创建索引
    location.reload();
  }
  
  // =====================
  // 更新统计
  // =====================
  function updateStats() {
    document.getElementById('stat-docs').textContent = stats.docs;
    document.getElementById('stat-searches').textContent = stats.searches;
  }
  
  // =====================
  // 演示功能
  // =====================
  function showDemoOutput(content) {
    const output = document.getElementById('demo-output');
    output.classList.remove('hidden');
    output.innerHTML = content;
  }
  
  async function demoAsync() {
    showDemoOutput('⏳ 执行异步搜索...');
    
    const startTime = performance.now();
    // FlexSearch 原生支持异步
    const results = await index.searchAsync('JavaScript', { limit: 5 });
    const endTime = performance.now();
    
    showDemoOutput(`✅ 异步搜索完成！<br>耗时: ${(endTime - startTime).toFixed(2)}ms<br>结果数: ${results.length} 个字段匹配`);
  }
  
  function demoExport() {
    // FlexSearch 导出功能
    const exported = index.export();
    showDemoOutput(`💾 索引导出预览:<br><pre class="text-xs overflow-auto max-h-40">${JSON.stringify(exported, null, 2).substring(0, 500)}...</pre>`);
  }
  
  function demoBenchmark() {
    const queries = ['JavaScript', 'React', 'Vue', 'Node', 'CSS', 'Git', 'Python', 'Docker'];
    const iterations = 100;
    
    const startTime = performance.now();
    for (let i = 0; i < iterations; i++) {
      queries.forEach(q => index.search(q, { limit: 10 }));
    }
    const endTime = performance.now();
    
    const totalSearches = iterations * queries.length;
    const totalTime = endTime - startTime;
    const avgTime = (totalTime / totalSearches).toFixed(4);
    
    showDemoOutput(`🚀 性能基准测试结果:<br>总搜索次数: ${totalSearches}<br>总耗时: ${totalTime.toFixed(2)}ms<br>平均每次搜索: ${avgTime}ms`);
  }
  
  function demoMultiWord() {
    document.getElementById('search-input').value = 'JavaScript React';
    performSearch('JavaScript React');
    showDemoOutput('🔤 多词搜索示例: "JavaScript React"<br>FlexSearch 默认使用 AND 逻辑匹配多个词');
  }
  
  // 初始化：加载示例数据
  loadSampleData();
</script>
