<html lang="zh">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Handsontable 电子表格</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f0f9ff; color: #0c4a6e; }
    .glass { background: white; border: 1px solid #bae6fd; box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.1); }
    /* Excel 风格覆盖 */
    .handsontable th { background-color: #f1f5f9; font-weight: bold; color: #475569; }
    .handsontable td { color: #334155; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-6xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-sky-900">📊 Handsontable</h1>
    <p class="text-sky-700/60 mt-2 text-lg">Web 端的 Excel，功能强大的数据网格组件</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-sky-200 text-sky-700 rounded-lg hover:border-sky-300 hover:bg-sky-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-6xl mx-auto space-y-8">

  <!-- 工具栏 -->
  <div class="glass p-4 rounded-xl flex gap-4 items-center flex-wrap">
    <button onclick="hot.alter('insert_row_above')" class="px-4 py-2 bg-white border border-sky-200 text-sky-700 rounded hover:bg-sky-50 text-sm font-medium shadow-sm">➕ 插入行</button>
    <button onclick="hot.alter('insert_col_start')" class="px-4 py-2 bg-white border border-sky-200 text-sky-700 rounded hover:bg-sky-50 text-sm font-medium shadow-sm">➕ 插入列</button>
    <div class="h-6 w-px bg-sky-200 mx-2"></div>
    <button onclick="exportData()" class="px-4 py-2 bg-sky-600 text-white rounded hover:bg-sky-700 text-sm font-medium shadow-sm">📥 导出数据</button>
    <span class="ml-auto text-sm text-sky-500" id="status-text">就绪</span>
  </div>

  <!-- 表格容器 -->
  <div class="bg-white rounded-xl shadow-lg border border-sky-200 overflow-hidden p-1">
    <div id="example" class="w-full h-[500px] overflow-hidden"></div>
  </div>

  <!-- 功能说明 -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="glass p-6 rounded-xl">
      <h3 class="font-bold text-sky-900 mb-2">💡 丰富的数据类型</h3>
      <p class="text-sm text-sky-700/70">支持文本、数字、复选框、下拉菜单、日期等多种单元格类型。</p>
    </div>
    <div class="glass p-6 rounded-xl">
      <h3 class="font-bold text-sky-900 mb-2">⚡️ 高性能</h3>
      <p class="text-sm text-sky-700/70">虚拟渲染技术，轻松处理数万行数据，滚动丝滑流畅。</p>
    </div>
    <div class="glass p-6 rounded-xl">
      <h3 class="font-bold text-sky-900 mb-2">📋 类似 Excel 的体验</h3>
      <p class="text-sm text-sky-700/70">支持复制粘贴、拖拽填充、排序、筛选、公式计算等操作。</p>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
<script>
  const container = document.getElementById('example');
  
  // 模拟数据
  const data = [
    ['Tesla', 2017, 'black', 'black', 12345.67, true],
    ['Nissan', 2018, 'blue', 'blue', 23456.78, false],
    ['Chrysler', 2019, 'yellow', 'black', 34567.89, true],
    ['Volvo', 2020, 'white', 'gray', 45678.90, true],
    ['Toyota', 2021, 'red', 'black', 56789.01, false],
    ['Honda', 2022, 'silver', 'black', 67890.12, true]
  ];

  // 生成更多数据
  for (let i = 0; i < 50; i++) {
    data.push([
      ['Ford', 'BMW', 'Mercedes', 'Audi'][Math.floor(Math.random()*4)],
      2000 + Math.floor(Math.random() * 25),
      ['red', 'green', 'blue', 'white'][Math.floor(Math.random()*4)],
      ['black', 'gray', 'beige'][Math.floor(Math.random()*3)],
      Math.random() * 100000,
      Math.random() > 0.5
    ]);
  }

  const hot = new Handsontable(container, {
    data: data,
    rowHeaders: true,
    colHeaders: ['品牌', '年份', '外观颜色', '内饰颜色', '价格 ($)', '有现货'],
    height: '100%',
    width: '100%',
    licenseKey: 'non-commercial-and-evaluation', // 非商业授权 Key
    columns: [
      { type: 'text' },
      { type: 'numeric' },
      { type: 'text' },
      { type: 'text' },
      { type: 'numeric', numericFormat: { pattern: '$0,0.00' } },
      { type: 'checkbox' }
    ],
    filters: true,
    dropdownMenu: true,
    contextMenu: true, // 右键菜单
    afterChange: (changes) => {
      if (changes) {
        document.getElementById('status-text').textContent = `最后修改: 行 ${changes[0][0]}, 列 ${changes[0][1]}`;
      }
    }
  });

  function exportData() {
    const exportPlugin = hot.getPlugin('exportFile');
    exportPlugin.downloadFile('csv', {
      bom: false,
      columnDelimiter: ',',
      columnHeaders: true,
      exportHiddenColumns: true,
      exportHiddenRows: true,
      fileExtension: 'csv',
      filename: 'Handsontable-CSV-Export',
      mimeType: 'text/csv',
      rowDelimiter: '\r\n',
      rowHeaders: true
    });
  }
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
