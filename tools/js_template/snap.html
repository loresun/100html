  <meta charset="utf-8" />

  <title>Snap.svg 矢量操作</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/snap.svg/0.5.1/snap.svg-min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    #svg-container { background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-8">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">🐊 Snap.svg 矢量操作</h1>
    <p class="text-slate-500 mt-1">专为现代 Web 设计的 SVG 操作库 (类似 SVG 版的 jQuery)</p>
  </div>
  <a href="index.html" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">← 返回导航</a>
</header>

<main class="max-w-4xl mx-auto space-y-6">

  <div class="flex flex-col items-center">
    <svg id="svg-container" width="600" height="400" viewBox="0 0 600 400"></svg>
    
    <div class="mt-8 flex gap-4">
      <button onclick="morphToCircle()" class="px-6 py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition shadow-lg">
        🔴 变形为圆
      </button>
      <button onclick="morphToRect()" class="px-6 py-2 bg-emerald-600 text-white rounded-full hover:bg-emerald-700 transition shadow-lg">
        🟦 变形为方
      </button>
      <button onclick="resetAnim()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-full hover:bg-slate-300 transition">
        ↺ 重置
      </button>
    </div>
  </div>

  <div class="max-w-xl mx-auto text-center mt-6">
    <p class="text-slate-500 text-sm">点击按钮观察 SVG 路径补间动画 (Path Morphing)。</p>
  </div>

</main>

<script>
  const s = Snap("#svg-container");
  
  // Paths
  const squarePath = "M200,100 L400,100 L400,300 L200,300 Z";
  const circlePath = "M200,200 m-100,0 a100,100 0 1,0 200,0 a100,100 0 1,0 -200,0"; // approximating a circle with path

  // Draw initial shape
  let element = s.path(squarePath).attr({
    fill: "#6366f1",
    stroke: "#a5b4fc",
    strokeWidth: 5
  });

  // Eyes (just for fun)
  const eye1 = s.circle(250, 180, 20).attr({ fill: '#fff' });
  const eye2 = s.circle(350, 180, 20).attr({ fill: '#fff' });
  const pupil1 = s.circle(250, 180, 5).attr({ fill: '#000' });
  const pupil2 = s.circle(350, 180, 5).attr({ fill: '#000' });

  const faceGroup = s.group(element, eye1, eye2, pupil1, pupil2);

  function morphToCircle() {
    element.animate({ d: circlePath, fill: "#ec4899", stroke: "#fbcfe8" }, 1000, mina.elastic);
  }

  function morphToRect() {
    element.animate({ d: squarePath, fill: "#6366f1", stroke: "#a5b4fc" }, 1000, mina.bounce);
  }

  function resetAnim() {
    morphToRect();
  }

</script>

</body>
</html>
