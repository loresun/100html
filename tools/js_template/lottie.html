  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lottie 矢量动画</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #ffffff; color: #1e293b; min-height: 100vh; }
    .glass { background: #f8fafc; border: 1px solid #e2e8f0; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>

<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-12">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">🎞️ Lottie</h1>
    <p class="text-slate-500 mt-2 text-lg">Airbnb 开源的轻量级矢量动画渲染库</p>
  </div>
  <a href="index.html" class="px-6 py-2 bg-slate-100 rounded-full hover:bg-slate-200 transition-all font-medium text-slate-600">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-12">

  <!-- 主交互区 -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
    <!-- 动画容器 -->
    <div class="bg-slate-50 rounded-3xl p-8 flex items-center justify-center min-h-[400px] border border-slate-200 shadow-inner">
      <div id="lottie-container" class="w-64 h-64"></div>
    </div>

    <!-- 控制面板 -->
    <div class="space-y-8">
      <div>
        <h3 class="font-bold text-xl mb-4 text-slate-800">🎮 播放控制</h3>
        <div class="flex flex-wrap gap-3">
          <button onclick="anim.play()" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 font-medium">播放 Play</button>
          <button onclick="anim.pause()" class="px-4 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-800 font-medium">暂停 Pause</button>
          <button onclick="anim.stop()" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 font-medium">停止 Stop</button>
          <button onclick="toggleDirection()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 font-medium">反向 Reverse</button>
        </div>
      </div>

      <div>
        <h3 class="font-bold text-xl mb-4 text-slate-800">⚡ 速度控制</h3>
        <div class="flex items-center gap-4">
          <span class="text-sm font-mono text-slate-500">0.5x</span>
          <input type="range" min="0.5" max="3" step="0.5" value="1" oninput="setSpeed(this.value)" class="w-full accent-blue-500">
          <span class="text-sm font-mono text-slate-500">3x</span>
        </div>
      </div>

      <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-xl text-yellow-800 text-sm">
        <p><strong>💡 提示：</strong> Lottie 动画基于 JSON 导出，在此示例中使用网络上的开源 JSON 资源。它能在 Web、iOS 和 Android 上原生渲染。</p>
      </div>
    </div>
  </div>

  <!-- 更多示例 -->
  <section>
    <h3 class="font-bold text-2xl mb-6 text-slate-800">📂 更多场景演示</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow text-center group cursor-pointer" onclick="loadAnim('https://assets2.lottiefiles.com/packages/lf20_w51pcehl.json')">
        <div class="text-4xl mb-2 group-hover:scale-110 transition-transform">✅</div>
        <div class="font-bold text-slate-700">成功状态</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow text-center group cursor-pointer" onclick="loadAnim('https://assets9.lottiefiles.com/packages/lf20_kcsr6fcp.json')">
        <div class="text-4xl mb-2 group-hover:scale-110 transition-transform">🚀</div>
        <div class="font-bold text-slate-700">加载中</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow text-center group cursor-pointer" onclick="loadAnim('https://assets10.lottiefiles.com/packages/lf20_j1adxtyb.json')">
        <div class="text-4xl mb-2 group-hover:scale-110 transition-transform">❤️</div>
        <div class="font-bold text-slate-700">点赞互动</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow text-center group cursor-pointer" onclick="loadAnim('https://assets3.lottiefiles.com/packages/lf20_UJNc2t.json')">
        <div class="text-4xl mb-2 group-hover:scale-110 transition-transform">🎉</div>
        <div class="font-bold text-slate-700">庆祝效果</div>
      </div>
    </div>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
let anim;
let direction = 1;

function initLottie(path) {
  if (anim) anim.destroy();
  
  anim = lottie.loadAnimation({
    container: document.getElementById('lottie-container'),
    renderer: 'svg',
    loop: true,
    autoplay: true,
    path: path // 动画 JSON 路径
  });
}

function loadAnim(path) {
  initLottie(path);
}

function setSpeed(val) {
  if (anim) anim.setSpeed(Number(val));
}

function toggleDirection() {
  if (anim) {
    direction = direction * -1;
    anim.setDirection(direction);
  }
}

// 初始加载一个默认动画
initLottie('https://assets9.lottiefiles.com/packages/lf20_kcsr6fcp.json'); // 一个火箭动画
</script>

<script src="../../help/help-widget-v2.js"></script>

</body>
</html>
