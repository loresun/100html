<!doctype html>
<html lang="zh">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Viewer.js 图片查看器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css"/>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; }
    .glass { backdrop-filter: blur(10px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
    .gallery-item { cursor: pointer; transition: transform 0.3s; overflow: hidden; border-radius: 12px; }
    .gallery-item:hover img { transform: scale(1.1); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12 text-white">

<header class="max-w-6xl mx-auto flex justify-between items-center mb-8">
  <div>
    <h1 class="text-3xl font-bold">🖼️ Viewer.js</h1>
    <p class="text-white/60 mt-1">强大的图片查看器 - 支持缩放、旋转、翻转</p>
  </div>
  <a href="index.html" class="px-4 py-2 glass rounded-lg text-white hover:bg-white/20">← 返回</a>
</header>

<main class="max-w-6xl mx-auto space-y-8">
  <!-- 画廊 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-6">📸 图片画廊 (点击查看)</h3>
    <div id="gallery" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="gallery-item aspect-square bg-slate-800">
        <img src="https://source.unsplash.com/random/800x800/?nature" alt="Nature">
      </div>
      <div class="gallery-item aspect-square bg-slate-800">
        <img src="https://source.unsplash.com/random/800x800/?city" alt="City">
      </div>
      <div class="gallery-item aspect-square bg-slate-800">
        <img src="https://source.unsplash.com/random/800x800/?technology" alt="Technology">
      </div>
      <div class="gallery-item aspect-square bg-slate-800">
        <img src="https://source.unsplash.com/random/800x800/?abstract" alt="Abstract">
      </div>
      <div class="gallery-item aspect-square bg-slate-800">
        <img src="https://source.unsplash.com/random/800x800/?animal" alt="Animal">
      </div>
      <div class="gallery-item aspect-square bg-slate-800">
        <img src="https://source.unsplash.com/random/800x800/?space" alt="Space">
      </div>
      <div class="gallery-item aspect-square bg-slate-800">
        <img src="https://source.unsplash.com/random/800x800/?ocean" alt="Ocean">
      </div>
      <div class="gallery-item aspect-square bg-slate-800">
        <img src="https://source.unsplash.com/random/800x800/?mountain" alt="Mountain">
      </div>
    </div>
  </div>

  <!-- 内联模式 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-6">👁️ 内联模式 (Inline Mode)</h3>
    <div class="h-[500px] bg-slate-900 rounded-xl overflow-hidden relative" id="inline-gallery">
      <!-- 这些图片不会直接显示，而是通过 Viewer 的内联模式渲染 -->
      <ul class="hidden">
        <li><img src="https://source.unsplash.com/random/1280x720/?architecture" alt="Architecture"></li>
        <li><img src="https://source.unsplash.com/random/1280x720/?car" alt="Car"></li>
        <li><img src="https://source.unsplash.com/random/1280x720/?food" alt="Food"></li>
      </ul>
    </div>
  </div>

  <!-- 功能介绍 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-lg mb-4">✨ 功能特性</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
      <div class="bg-slate-900/50 p-4 rounded-xl">
        <div class="text-2xl mb-2">🔍</div>
        <div class="font-bold text-blue-300">缩放 Zoom</div>
      </div>
      <div class="bg-slate-900/50 p-4 rounded-xl">
        <div class="text-2xl mb-2">↻</div>
        <div class="font-bold text-blue-300">旋转 Rotate</div>
      </div>
      <div class="bg-slate-900/50 p-4 rounded-xl">
        <div class="text-2xl mb-2">↔️</div>
        <div class="font-bold text-blue-300">翻转 Flip</div>
      </div>
      <div class="bg-slate-900/50 p-4 rounded-xl">
        <div class="text-2xl mb-2">⌨️</div>
        <div class="font-bold text-blue-300">键盘支持</div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
<script>
// 初始化画廊查看器 (Modal 模式)
const gallery = document.getElementById('gallery');
const viewer = new Viewer(gallery, {
  toolbar: {
    zoomIn: 4,
    zoomOut: 4,
    oneToOne: 4,
    reset: 4,
    prev: 4,
    play: {
      show: 4,
      size: 'large'
    },
    next: 4,
    rotateLeft: 4,
    rotateRight: 4,
    flipHorizontal: 4,
    flipVertical: 4
  },
  title: [1, (image, imageData) => `${image.alt} (${imageData.naturalWidth} × ${imageData.naturalHeight})`]
});

// 初始化内联查看器
const inlineGallery = document.getElementById('inline-gallery');
// 我们需要创建一个列表结构给 Viewer
const inlineViewer = new Viewer(inlineGallery.querySelector('ul'), {
  inline: true,
  button: false,
  navbar: true,
  title: false,
  toolbar: {
    zoomIn: 1,
    zoomOut: 1,
    oneToOne: 1,
    reset: 1,
    rotateLeft: 1,
    rotateRight: 1,
    flipHorizontal: 1,
    flipVertical: 1
  },
  viewed() {
    // 强制内联容器大小
    inlineViewer.viewer.style.height = '100%';
  }
});
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
