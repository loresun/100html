  <title>Hotkeys.js 快捷键</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafafa; color: #18181b; }
    .glass { background: white; border: 1px solid #e4e4e7; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .kbd { background: #f4f4f5; border: 1px solid #d4d4d8; border-radius: 4px; padding: 2px 6px; font-family: monospace; font-size: 0.9em; box-shadow: 0 2px 0 #e4e4e7; font-weight: bold; color: #3f3f46; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-zinc-900">⌨️ Hotkeys.js</h1>
    <p class="text-zinc-500 mt-2 text-lg">强大的键盘快捷键捕获库</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-zinc-200 text-zinc-600 rounded-lg hover:border-zinc-300 hover:bg-zinc-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-8">

  <!-- 测试区域 -->
  <div class="glass p-12 rounded-2xl text-center border-t-4 border-indigo-500">
    <h3 class="text-2xl font-bold text-zinc-800 mb-4">按下快捷键测试</h3>
    <div id="status" class="text-4xl font-mono text-indigo-600 h-12 transition-all">等待输入...</div>
    <p class="text-zinc-400 mt-4 text-sm">尝试按下 <span class="kbd">Ctrl+S</span> 或 <span class="kbd">Shift+A</span></p>
  </div>

  <!-- 快捷键列表 -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="glass p-6 rounded-2xl">
      <h3 class="font-bold text-lg text-zinc-800 mb-4">常用组合</h3>
      <ul class="space-y-3">
        <li class="flex justify-between items-center">
          <span class="text-zinc-600">保存</span>
          <div><span class="kbd">Ctrl</span> + <span class="kbd">S</span></div>
        </li>
        <li class="flex justify-between items-center">
          <span class="text-zinc-600">全选</span>
          <div><span class="kbd">Ctrl</span> + <span class="kbd">A</span></div>
        </li>
        <li class="flex justify-between items-center">
          <span class="text-zinc-600">搜索</span>
          <div><span class="kbd">Ctrl</span> + <span class="kbd">F</span></div>
        </li>
      </ul>
    </div>

    <div class="glass p-6 rounded-2xl">
      <h3 class="font-bold text-lg text-zinc-800 mb-4">特殊功能</h3>
      <ul class="space-y-3">
        <li class="flex justify-between items-center">
          <span class="text-zinc-600">输入框内禁用</span>
          <input type="text" placeholder="在这里打字不会触发..." class="px-2 py-1 border border-zinc-300 rounded text-sm w-40">
        </li>
        <li class="flex justify-between items-center">
          <span class="text-zinc-600">Scope (作用域)</span>
          <span class="text-xs text-zinc-400">目前 Scope: all</span>
        </li>
        <li class="flex justify-between items-center">
          <span class="text-zinc-600">调试模式</span>
          <div><span class="kbd">D</span></div>
        </li>
      </ul>
    </div>
  </div>

  <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-yellow-800 text-sm">
    <strong>💡 提示：</strong> Hotkeys.js 默认会阻止浏览器默认事件（如果返回 false）。在这个示例中，我们阻止了 Ctrl+S 的默认保存行为。
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/hotkeys-js@3.13.7/dist/hotkeys.min.js"></script>
<script>
  const statusEl = document.getElementById('status');

  function showKey(text) {
    statusEl.textContent = text;
    statusEl.classList.remove('scale-100');
    statusEl.classList.add('scale-110');
    setTimeout(() => {
      statusEl.classList.remove('scale-110');
      statusEl.classList.add('scale-100');
    }, 100);
  }

  // 基础绑定
  hotkeys('ctrl+s, command+s', function(event, handler) {
    event.preventDefault(); 
    showKey('💾 保存 (Ctrl+S)');
    return false;
  });

  hotkeys('ctrl+a, command+a', function(event, handler) {
    event.preventDefault();
    showKey('✅ 全选 (Ctrl+A)');
  });

  hotkeys('ctrl+f, command+f', function(event, handler) {
    event.preventDefault();
    showKey('🔍 搜索 (Ctrl+F)');
  });

  hotkeys('shift+a', function(event, handler){
    showKey('🅰️ Shift + A');
  });

  hotkeys('d', function(event, handler){
    showKey('🐛 Debug Mode');
  });

  // 作用域示例 (需配合 hotkeys.setScope 使用)
  // hotkeys('o', 'files', function() { console.log('OPEN in files scope'); });
</script>

</html>
