<html lang="zh">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Frame WebVR 体验</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* UI 层覆盖在 A-Frame canvas 上 */
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .pointer-events-auto { pointer-events: auto; }
    .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.5); border-radius: 12px; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- UI 悬浮层 (亮色风格) -->
  <div id="ui-layer" class="flex flex-col justify-between p-6">
    <header class="flex justify-between items-start pointer-events-auto">
      <div class="glass px-6 py-4 shadow-lg">
        <h1 class="text-2xl font-bold text-slate-800">🕶️ A-Frame WebVR</h1>
        <p class="text-slate-600 mt-1 text-sm">无需从零开始的 Web 虚拟现实框架</p>
      </div>
      <a href="index.html" class="glass px-4 py-2 text-slate-700 hover:bg-white font-bold shadow-md transition-all">← 退出</a>
    </header>

    <footer class="flex justify-center pointer-events-auto pb-8">
      <div class="glass px-8 py-4 shadow-lg flex gap-4 text-center">
        <div>
          <div class="text-xs text-slate-500 uppercase font-bold mb-1">移动</div>
          <div class="text-slate-800 font-mono">W A S D</div>
        </div>
        <div class="w-px bg-slate-200"></div>
        <div>
          <div class="text-xs text-slate-500 uppercase font-bold mb-1">视角</div>
          <div class="text-slate-800">🖱️ 拖拽</div>
        </div>
        <div class="w-px bg-slate-200"></div>
        <div>
          <div class="text-xs text-slate-500 uppercase font-bold mb-1">交互</div>
          <div class="text-slate-800">👀 凝视</div>
        </div>
      </div>
    </footer>
  </div>

  <!-- 3D 场景 -->
  <a-scene embedded>
    <!-- 环境 (预设) -->
    <a-entity environment="preset: forest; groundColor: #445; grid: cross"></a-entity>

    <!-- 交互式盒子 -->
    <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" animation="property: rotation; to: 0 405 0; loop: true; dur: 10000">
      <a-entity 
        text="value: 交互盒子; align: center; color: white" 
        position="0 1.2 0"
        look-at="[camera]">
      </a-entity>
    </a-box>

    <!-- 球体 (可点击变色) -->
    <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" shadow
              event-set__enter="_event: mouseenter; color: #00FF00"
              event-set__leave="_event: mouseleave; color: #EF2D5E">
    </a-sphere>

    <!-- 圆柱体 -->
    <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" shadow></a-cylinder>

    <!-- 平面 (地面阴影) -->
    <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" shadow></a-plane>

    <!-- 相机与光标 (用于非 VR 模式下的交互) -->
    <a-entity camera look-controls wasd-controls position="0 1.6 0">
      <a-cursor color="black" fuse="true" fuse-timeout="1500"></a-cursor>
    </a-entity>
    
  </a-scene>

  <script>
    // 简单的交互逻辑：点击球体更换环境
    const sphere = document.querySelector('a-sphere');
    const environments = ['forest', 'contact', 'egypt', 'checkerboard', 'goaland', 'yavapai', 'goldmine', 'threetowers', 'poison', 'arches', 'tron', 'japan', 'dream', 'volcano', 'starry', 'osiris'];
    let envIndex = 0;

    sphere.addEventListener('click', function () {
      envIndex = (envIndex + 1) % environments.length;
      document.querySelector('[environment]').setAttribute('environment', 'preset', environments[envIndex]);
      
      // 更新提示
      const title = document.querySelector('h1');
      title.textContent = `🕶️ A-Frame: ${environments[envIndex]}`;
    });
  </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
