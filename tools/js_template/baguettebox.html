  <title>baguetteBox 灯箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/baguettebox.js@1.11.1/dist/baguetteBox.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/baguettebox.js@1.11.1/dist/baguetteBox.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafafa; color: #18181b; }
    .glass { background: white; border: 1px solid #e4e4e7; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    /* Image Grid */
    .gallery a { display: block; overflow: hidden; border-radius: 0.5rem; transition: opacity 0.2s; }
    .gallery a:hover { opacity: 0.8; }
    .gallery img { width: 100%; height: 200px; object-fit: cover; transition: transform 0.3s; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-zinc-900">🥖 baguetteBox</h1>
    <p class="text-zinc-500 mt-2 text-lg">纯 JS 的响应式轻量级灯箱 (Lightbox)</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-zinc-200 text-zinc-800 rounded-lg hover:bg-zinc-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto">

  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-zinc-900 mb-6">图片画廊 (点击预览)</h3>
    
    <div class="gallery grid grid-cols-2 md:grid-cols-3 gap-4" id="gallery">
      <a href="https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-1.2.1&auto=format&fit=crop&w=1600&q=80" data-caption="风景 A">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="Landscape 1">
      </a>
      <a href="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1600&q=80" data-caption="风景 B">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="Landscape 2">
      </a>
      <a href="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1600&q=80" data-caption="风景 C">
        <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="Landscape 3">
      </a>
    </div>

    <p class="mt-4 text-xs text-zinc-400 text-center">Images from Unsplash</p>
  </div>

</main>

<script>
  baguetteBox.run('.gallery', {
    animation: 'fadeIn',
    noScrollbars: true
  });
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
