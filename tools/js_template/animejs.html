<!doctype html>
<html lang="zh">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anime.js 动画引擎</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff1f2; color: #be123c; }
    .glass { background: white; border: 1px solid #fecdd3; box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.05); }
    .box { width: 50px; height: 50px; border-radius: 8px; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-rose-900">🎬 Anime.js</h1>
    <p class="text-rose-800/60 mt-2 text-lg">轻量级 JavaScript 动画库，API 简单强大</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-rose-200 text-rose-800 rounded-lg hover:bg-rose-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-10">

  <!-- 1. 基础运动 -->
  <div class="glass p-8 rounded-2xl">
    <div class="flex justify-between items-center mb-10">
      <h3 class="font-bold text-rose-900">缓动与路径 (Easing & Path)</h3>
      <button onclick="playBasic()" class="px-4 py-2 bg-rose-500 text-white rounded hover:bg-rose-600 font-bold transition">播放动画</button>
    </div>
    
    <div class="relative h-20 bg-rose-50 rounded-xl mb-4 flex items-center px-4">
      <div class="box bg-rose-500 shadow-lg shadow-rose-500/40" id="box-basic"></div>
    </div>
    <div class="flex justify-between text-xs text-rose-400 font-mono">
      <span>0%</span>
      <span>100%</span>
    </div>
  </div>

  <!-- 2. 交错动画 (Staggering) -->
  <div class="glass p-8 rounded-2xl">
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-rose-900">交错效果 (Staggering)</h3>
      <button onclick="playStagger()" class="px-4 py-2 bg-rose-100 text-rose-800 rounded hover:bg-rose-200 font-bold transition">触发效果</button>
    </div>
    
    <div class="grid grid-cols-10 gap-2 justify-center" id="grid-container">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- 3. 时间轴 (Timeline) -->
  <div class="glass p-8 rounded-2xl">
    <div class="flex justify-between items-center mb-10">
      <h3 class="font-bold text-rose-900">时间轴控制 (Timeline)</h3>
      <div class="flex gap-2">
        <button onclick="tl.play()" class="px-3 py-1 border border-rose-200 text-rose-600 rounded hover:bg-rose-50">Play</button>
        <button onclick="tl.pause()" class="px-3 py-1 border border-rose-200 text-rose-600 rounded hover:bg-rose-50">Pause</button>
        <button onclick="tl.restart()" class="px-3 py-1 border border-rose-200 text-rose-600 rounded hover:bg-rose-50">Restart</button>
      </div>
    </div>
    
    <div class="flex justify-center items-center gap-4 h-32">
      <div class="tl-box w-12 h-12 bg-blue-500 rounded-full"></div>
      <div class="tl-box w-12 h-12 bg-green-500 rounded-full"></div>
      <div class="tl-box w-12 h-12 bg-yellow-500 rounded-full"></div>
    </div>
    <div class="mt-4 text-center">
       <input type="range" min="0" max="100" value="0" class="w-full max-w-md accent-rose-500" oninput="tl.seek(tl.duration * (this.value / 100))">
    </div>
  </div>

</main>

<script>
  // 1. Basic
  function playBasic() {
    anime({
      targets: '#box-basic',
      translateX: [0, 250], // simple array-based values
      rotate: '1turn',
      backgroundColor: ['#f43f5e', '#3b82f6', '#f43f5e'], // color transition
      borderRadius: ['8px', '50%', '8px'],
      duration: 2000,
      easing: 'easeInOutExpo',
      direction: 'alternate'
    });
  }

  // 2. Stagger
  const grid = document.getElementById('grid-container');
  for(let i=0; i<50; i++) {
    const el = document.createElement('div');
    el.className = 'w-full h-8 bg-rose-300 rounded stagger-box cursor-pointer';
    el.onclick = () => playStagger();
    grid.appendChild(el);
  }

  function playStagger() {
    anime({
      targets: '.stagger-box',
      scale: [
        {value: .1, easing: 'easeOutSine', duration: 500},
        {value: 1, easing: 'easeInOutQuad', duration: 1200}
      ],
      delay: anime.stagger(100, {grid: [10, 5], from: 'center'}),
      backgroundColor: '#f43f5e'
    });
  }

  // 3. Timeline
  const tl = anime.timeline({
    easing: 'easeOutExpo',
    duration: 750,
    autoplay: false
  });

  tl
  .add({
    targets: '.tl-box:nth-child(1)',
    translateX: [-100, 0],
    opacity: [0, 1]
  })
  .add({
    targets: '.tl-box:nth-child(2)',
    translateY: [-50, 0],
    opacity: [0, 1]
  }, '-=400') // offset
  .add({
    targets: '.tl-box:nth-child(3)',
    translateX: [100, 0],
    opacity: [0, 1]
  }, '-=400');

  // Initial play
  setTimeout(() => playBasic(), 500);
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
