  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TensorFlow.js 图像分类</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 加载 MobileNet 模型 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #e0f2fe; color: #075985; }
    .glass { background: white; border: 1px solid #bae6fd; box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.05); }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0ea5e9; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-sky-900">🧠 TensorFlow.js</h1>
    <p class="text-sky-800/60 mt-2 text-lg">在浏览器端运行机器学习模型 (MobileNet)</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-sky-200 text-sky-800 rounded-lg hover:bg-sky-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

  <!-- 左侧：输入控制 -->
  <div class="space-y-6">
    <div class="glass p-6 rounded-2xl">
      <h3 class="font-bold text-sky-900 mb-4">1. 选择图片</h3>
      
      <div class="mb-4">
        <label class="block text-sm font-bold text-sky-700 mb-2">图片源</label>
        <div class="flex gap-2 mb-4">
          <button onclick="setDemoImg('cat')" class="px-3 py-1 bg-sky-100 text-sky-700 rounded hover:bg-sky-200 text-sm">🐱 猫</button>
          <button onclick="setDemoImg('coffee')" class="px-3 py-1 bg-sky-100 text-sky-700 rounded hover:bg-sky-200 text-sm">☕ 咖啡</button>
          <button onclick="setDemoImg('car')" class="px-3 py-1 bg-sky-100 text-sky-700 rounded hover:bg-sky-200 text-sm">🚗 汽车</button>
        </div>
      </div>

      <div class="relative group overflow-hidden rounded-xl border border-sky-200 bg-black aspect-video flex items-center justify-center">
        <img id="img" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&q=80" crossorigin="anonymous" class="max-h-full max-w-full object-contain">
      </div>
      
      <button onclick="classify()" id="btn-predict" class="mt-6 w-full py-3 bg-sky-600 text-white font-bold rounded-xl hover:bg-sky-700 flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
        <span>🤖</span> 开始识别
      </button>

      <div id="loading" class="hidden mt-2 text-center text-sm text-sky-500 flex justify-center items-center gap-2">
        <div class="spinner"></div> 加载模型/推理中...
      </div>
    </div>
  </div>

  <!-- 右侧：预测结果 -->
  <div class="space-y-6">
    <div class="glass p-6 rounded-2xl h-full">
      <h3 class="font-bold text-sky-900 mb-6">2. 识别结果 (Top 3)</h3>
      
      <div id="results" class="space-y-4">
        <div class="text-center text-sky-300 py-10">点击“开始识别”查看 AI 预测结果</div>
      </div>
    </div>
  </div>

</main>

<script>
  const img = document.getElementById('img');
  const resultsDiv = document.getElementById('results');
  const btnPredict = document.getElementById('btn-predict');
  const loading = document.getElementById('loading');
  let model;

  // 预加载模型
  async function loadModel() {
    btnPredict.disabled = true;
    loading.classList.remove('hidden');
    console.log('Loading MobileNet...');
    
    try {
      model = await mobilenet.load();
      console.log('Model loaded.');
      btnPredict.disabled = false;
      loading.classList.add('hidden');
    } catch(e) {
      console.error(e);
      resultsDiv.innerHTML = `<div class="text-red-500">模型加载失败，请检查网络 (需访问 Google/CDN)</div>`;
    }
  }

  // 切换图片
  function setDemoImg(type) {
    const urls = {
      cat: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&q=80',
      coffee: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600&q=80',
      car: 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=600&q=80'
    };
    img.src = urls[type];
    resultsDiv.innerHTML = '<div class="text-center text-sky-300 py-10">图片已更换，请重新识别</div>';
  }

  // 执行分类
  async function classify() {
    if(!model) return;
    
    btnPredict.disabled = true;
    loading.classList.remove('hidden');
    resultsDiv.innerHTML = '';

    try {
      // MobileNet 预测
      const predictions = await model.classify(img);
      
      // 渲染结果
      predictions.forEach((p, i) => {
        const percent = (p.probability * 100).toFixed(1);
        const div = document.createElement('div');
        div.className = `p-4 rounded-xl border ${i===0 ? 'bg-sky-50 border-sky-300 shadow-md' : 'bg-white border-sky-100 opacity-80'}`;
        div.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-sky-900 capitalize">${p.className}</span>
            <span class="font-mono text-sky-600">${percent}%</span>
          </div>
          <div class="w-full bg-sky-100 rounded-full h-2">
            <div class="bg-sky-500 h-2 rounded-full" style="width: ${percent}%"></div>
          </div>
        `;
        resultsDiv.appendChild(div);
      });
      
    } catch(err) {
      resultsDiv.innerText = "识别出错: " + err.message;
    } finally {
      btnPredict.disabled = false;
      loading.classList.add('hidden');
    }
  }

  // 初始化
  loadModel();
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
