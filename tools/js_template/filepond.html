<!doctype html>
<html lang="zh">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FilePond 文件上传</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/filepond/dist/filepond.css" rel="stylesheet" />
  <link href="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.css" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #475569; }
    .glass { background: white; border: 1px solid #cbd5e1; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
    
    /* FilePond 自定义主题 (亮色) */
    .filepond--root {
      font-family: 'Inter', sans-serif;
    }
    .filepond--panel-root {
      background-color: #f8fafc;
      border: 2px dashed #cbd5e1;
    }
    .filepond--drop-label {
      color: #64748b;
    }
    .filepond--item-panel {
      background-color: #3b82f6;
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-12">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">📁 FilePond</h1>
    <p class="text-slate-500 mt-2 text-lg">优雅、如丝般顺滑的文件上传库</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-lg hover:border-slate-300 hover:bg-slate-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-12">

  <!-- 基础上传 -->
  <section class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
    <div class="mb-6">
      <h2 class="text-xl font-bold text-slate-800 mb-2">多文件上传</h2>
      <p class="text-slate-500 text-sm">支持拖拽、图片预览、文件验证。尝试上传图片！</p>
    </div>
    
    <!-- FilePond 核心元素 -->
    <input type="file" 
           class="filepond"
           name="filepond"
           multiple 
           data-allow-reorder="true"
           data-max-file-size="3MB"
           data-max-files="3">

    <div class="mt-4 flex gap-2 text-xs text-slate-400">
      <span class="px-2 py-1 bg-slate-100 rounded">最大 3MB</span>
      <span class="px-2 py-1 bg-slate-100 rounded">最多 3 个文件</span>
      <span class="px-2 py-1 bg-slate-100 rounded">支持 JPG, PNG</span>
    </div>
  </section>

  <!-- 功能特性 -->
  <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center">
      <div class="text-3xl mb-3">👁️</div>
      <h3 class="font-bold text-slate-800">图片预览</h3>
      <p class="text-xs text-slate-500 mt-1">自动生成缩略图，并进行优化</p>
    </div>
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center">
      <div class="text-3xl mb-3">✨</div>
      <h3 class="font-bold text-slate-800">图像处理</h3>
      <p class="text-xs text-slate-500 mt-1">支持裁剪、调整大小、滤镜 (需插件)</p>
    </div>
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center">
      <div class="text-3xl mb-3">🔌</div>
      <h3 class="font-bold text-slate-800">高度可扩展</h3>
      <p class="text-xs text-slate-500 mt-1">丰富的 API 和 适配器 (React/Vue/Angular)</p>
    </div>
  </section>

  <!-- 模拟服务器日志 -->
  <section class="bg-slate-900 rounded-2xl p-6 shadow-lg">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-white font-bold">📡 事件日志</h3>
      <button onclick="clearLog()" class="text-xs px-2 py-1 bg-slate-800 text-slate-400 rounded hover:text-white">清空</button>
    </div>
    <div id="log-container" class="font-mono text-sm text-emerald-400 h-40 overflow-y-auto space-y-1">
      <div class="text-slate-500">// 等待操作...</div>
    </div>
  </section>

</main>

<!-- 引入插件 -->
<script src="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.js"></script>
<script src="https://unpkg.com/filepond-plugin-file-validate-size/dist/filepond-plugin-file-validate-size.js"></script>
<script src="https://unpkg.com/filepond-plugin-file-validate-type/dist/filepond-plugin-file-validate-type.js"></script>
<script src="https://unpkg.com/filepond/dist/filepond.js"></script>

<script>
// 注册插件
FilePond.registerPlugin(
  FilePondPluginImagePreview,
  FilePondPluginFileValidateSize,
  FilePondPluginFileValidateType
);

// 初始化
const pond = FilePond.create(document.querySelector('.filepond'), {
  labelIdle: '拖拽文件到这里 或 <span class="filepond--label-action">浏览</span>',
  imagePreviewHeight: 170,
  imageCropAspectRatio: '1:1',
  imageResizeTargetWidth: 200,
  imageResizeTargetHeight: 200,
  stylePanelLayout: 'compact circle',
  styleLoadIndicatorPosition: 'center bottom',
  styleProgressIndicatorPosition: 'right bottom',
  styleButtonRemoveItemPosition: 'left bottom',
  styleButtonProcessItemPosition: 'right bottom',
  
  // 模拟服务器处理
  server: {
    process: (fieldName, file, metadata, load, error, progress, abort) => {
      log(`上传开始: ${file.name}`);
      let p = 0;
      const interval = setInterval(() => {
        p += 5;
        progress(true, p, 100);
        if(p >= 100) {
          clearInterval(interval);
          log(`✅ 上传成功: ${file.name}`);
          load('unique-file-id'); // 返回服务器文件ID
        }
      }, 50);

      return {
        abort: () => {
          clearInterval(interval);
          log(`🛑 上传取消: ${file.name}`);
          abort();
        }
      };
    },
    revert: (uniqueFileId, load, error) => {
      log(`🗑️ 删除文件 ID: ${uniqueFileId}`);
      load();
    }
  }
});

function log(msg) {
  const container = document.getElementById('log-container');
  const div = document.createElement('div');
  const time = new Date().toLocaleTimeString();
  div.innerHTML = `<span class="text-slate-500">[${time}]</span> ${msg}`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function clearLog() {
  document.getElementById('log-container').innerHTML = '';
}
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
