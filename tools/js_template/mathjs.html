  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math.js 科学计算</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff7ed; color: #7c2d12; }
    .glass { background: white; border: 1px solid #fed7aa; box-shadow: 0 4px 6px -1px rgba(234, 88, 12, 0.05); }
    .code { font-family: 'JetBrains Mono', monospace; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-orange-900">🧮 Math.js</h1>
    <p class="text-orange-800/60 mt-2 text-lg">JavaScript 的扩展数学库，支持符号计算、矩阵和复数</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-orange-200 text-orange-800 rounded-lg hover:bg-orange-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-8">

  <!-- 计算控制台 -->
  <div class="glass p-8 rounded-2xl border-t-4 border-orange-500">
    <h3 class="font-bold text-xl text-orange-900 mb-4">表达式计算器</h3>
    <div class="flex gap-4 mb-4">
      <input type="text" id="expr-input" class="flex-1 px-4 py-3 border border-orange-200 rounded-xl text-lg code outline-none focus:ring-2 focus:ring-orange-400 bg-orange-50/50" value="det([-1, 2; 3, 1])" placeholder="输入表达式...">
      <button onclick="calc()" class="px-6 py-3 bg-orange-500 text-white font-bold rounded-xl hover:bg-orange-600 shadow-lg shadow-orange-500/20">计算</button>
    </div>
    
    <div class="bg-slate-900 text-green-400 p-4 rounded-xl code text-lg min-h-[3rem]" id="result-display">
      // 结果显示区
    </div>

    <div class="mt-4 flex gap-2 flex-wrap text-sm">
      <button onclick="setExpr('12.7 cm to inch')" class="px-3 py-1 bg-orange-100 text-orange-800 rounded hover:bg-orange-200">单位转换</button>
      <button onclick="setExpr('sin(45 deg) ^ 2')" class="px-3 py-1 bg-orange-100 text-orange-800 rounded hover:bg-orange-200">三角函数</button>
      <button onclick="setExpr('det([-1, 2; 3, 1])')" class="px-3 py-1 bg-orange-100 text-orange-800 rounded hover:bg-orange-200">矩阵行列式</button>
      <button onclick="setExpr('derivative(\'x^2 + x\', \'x\')')" class="px-3 py-1 bg-orange-100 text-orange-800 rounded hover:bg-orange-200">求导符号计算</button>
      <button onclick="setExpr('sqrt(-4)')" class="px-3 py-1 bg-orange-100 text-orange-800 rounded hover:bg-orange-200">复数</button>
    </div>
  </div>

  <!-- 功能展示区 -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- 矩阵 -->
    <div class="glass p-6 rounded-xl">
      <h3 class="font-bold text-orange-900 mb-2">📊 矩阵操作</h3>
      <div class="text-sm text-slate-600 space-y-2 code">
        <div>A = [[1, 2], [3, 4]]</div>
        <div>math.inv(A) = </div>
        <div class="text-blue-600 font-bold" id="matrix-res"></div>
      </div>
    </div>

    <!-- 统计 -->
    <div class="glass p-6 rounded-xl">
      <h3 class="font-bold text-orange-900 mb-2">📉 统计函数</h3>
      <div class="text-sm text-slate-600 space-y-2 code">
        <div>Data: [2, 0, 1, 5, 20, 2]</div>
        <div>Mean (平均): <span class="text-blue-600 font-bold" id="stat-mean"></span></div>
        <div>Std (标准差): <span class="text-blue-600 font-bold" id="stat-std"></span></div>
      </div>
    </div>

  </div>

</main>

<script>
  function calc() {
    const expr = document.getElementById('expr-input').value;
    const display = document.getElementById('result-display');
    
    try {
      const result = math.evaluate(expr);
      // Format result nicely
      const formatted = math.format(result, { precision: 14 });
      display.innerText = formatted.toString();
      display.classList.remove('text-red-400');
      display.classList.add('text-green-400');
    } catch (err) {
      display.innerText = err.toString();
      display.classList.remove('text-green-400');
      display.classList.add('text-red-400');
    }
  }

  function setExpr(val) {
    document.getElementById('expr-input').value = val;
    calc();
  }

  // Initial Calculation demos
  const matrixA = math.matrix([[1, 2], [3, 4]]);
  const invA = math.inv(matrixA);
  document.getElementById('matrix-res').innerText = math.format(invA);

  const data = [2, 0, 1, 5, 20, 2];
  document.getElementById('stat-mean').innerText = math.mean(data);
  document.getElementById('stat-std').innerText = math.std(data).toFixed(4);

  // Auto run first
  calc();
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
