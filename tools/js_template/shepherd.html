<!doctype html>
<html lang="zh">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shepherd.js 引导页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/shepherd.js@10.0.1/dist/js/shepherd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shepherd.js@10.0.1/dist/css/shepherd.css"/>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fffbe6; color: #78350f; }
    .glass { background: white; border: 1px solid #fde047; box-shadow: 0 4px 6px -1px rgba(234, 179, 8, 0.05); }
    /* Shepherd 自定义主题 */
    .shepherd-element { background: #fff; border-radius: 12px; border: 1px solid #fcd34d; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .shepherd-header { background: #fef3c7; border-top-left-radius: 12px; border-top-right-radius: 12px; padding: 1rem; }
    .shepherd-text { font-size: 0.95rem; color: #451a03; padding: 1rem; }
    .shepherd-button { background: #f59e0b; color: white; border-radius: 6px; padding: 0.5rem 1rem; font-weight: bold; transition: background 0.2s; }
    .shepherd-button:hover { background: #d97706; }
    .shepherd-button-secondary { background: #fef3c7; color: #92400e; }
    .shepherd-button-secondary:hover { background: #fde68a; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10 hero-step">
  <div>
    <h1 class="text-3xl font-bold text-yellow-900">🐑 Shepherd.js</h1>
    <p class="text-yellow-800/60 mt-2 text-lg">引导用户完成您的应用程序</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-yellow-200 text-yellow-800 rounded-lg hover:bg-yellow-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-12">

  <!-- 模拟仪表盘 -->
  <div class="glass p-8 rounded-2xl">
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-xl text-yellow-900">我的仪表盘</h3>
      <button onclick="tour.start()" class="px-6 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 font-bold shadow-lg shadow-yellow-500/30">
        ▶️ 开始引导
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="p-6 bg-yellow-50 rounded-xl border border-yellow-100 text-center feature-one">
        <div class="text-3xl mb-2">📊</div>
        <div class="font-bold text-yellow-800">数据分析</div>
      </div>
      <div class="p-6 bg-yellow-50 rounded-xl border border-yellow-100 text-center feature-two">
        <div class="text-3xl mb-2">👥</div>
        <div class="font-bold text-yellow-800">用户管理</div>
      </div>
      <div class="p-6 bg-yellow-50 rounded-xl border border-yellow-100 text-center feature-three">
        <div class="text-3xl mb-2">⚙️</div>
        <div class="font-bold text-yellow-800">系统设置</div>
      </div>
    </div>
    
    <div class="mt-8 p-6 bg-white border border-yellow-100 rounded-xl shadow-sm complex-step">
      <h4 class="font-bold text-yellow-900 mb-2">复杂操作区域</h4>
      <p class="text-sm text-yellow-700/70">这里有一些高级设置项...</p>
      <div class="mt-4 flex gap-2">
        <input type="checkbox" checked class="accent-yellow-500"><span class="text-sm">启用通知</span>
        <input type="checkbox" class="accent-yellow-500"><span class="text-sm">深色模式</span>
      </div>
    </div>
  </div>

  <div class="text-center text-yellow-800/40 text-sm">
    Shepherd 也是基于 Popper.js 构建的，定位非常精准。
  </div>

</main>

<script>
  const tour = new Shepherd.Tour({
    useModalOverlay: true,
    defaultStepOptions: {
      cancelIcon: { enabled: true },
      classes: 'shadow-md bg-purple-dark',
      scrollTo: { behavior: 'smooth', block: 'center' }
    }
  });

  // 步骤 1: 欢迎
  tour.addStep({
    title: '欢迎来到 Shepherd',
    text: '这是一个漂亮的网页引导库（Tour Library）。点击“下一步”看看它能做什么。',
    attachTo: { element: '.hero-step', on: 'bottom' },
    buttons: [
      { action() { return this.next(); }, text: '下一步' }
    ],
    id: 'welcome'
  });

  // 步骤 2: 功能区
  tour.addStep({
    title: '关键功能',
    text: '这里是您的核心功能模块。Shepherd 可以高亮显示特定的 DOM 元素。',
    attachTo: { element: '.feature-one', on: 'top' },
    buttons: [
      { action() { return this.back(); }, classes: 'shepherd-button-secondary', text: '上一步' },
      { action() { return this.next(); }, text: '继续' }
    ]
  });

  // 步骤 3: 复杂操作
  tour.addStep({
    title: '复杂交互',
    text: '您甚至可以引导用户完成复杂的表单操作或阅读说明。',
    attachTo: { element: '.complex-step', on: 'left' },
    buttons: [
      { action() { return this.back(); }, classes: 'shepherd-button-secondary', text: '上一步' },
      { action() { return this.next(); }, text: '完成' }
    ]
  });
  
  // 步骤 4: 结束
  tour.addStep({
    title: '准备就绪！',
    text: '您已经了解了基本操作。开始探索吧！',
    buttons: [
      { action() { return this.complete(); }, text: '开始使用' }
    ]
  });

</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
