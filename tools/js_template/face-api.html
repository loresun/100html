  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Face-api.js 人脸表情识别</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- face-api.js -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #1e1b4b; color: #c7d2fe; overflow: hidden; }
    .glass { background: rgba(30, 27, 75, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
    canvas { position: absolute; top: 0; left: 0; }
    video { object-fit: cover; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

  <div class="relative w-full h-full flex justify-center items-center bg-black">
    <video id="video" width="720" height="560" autoplay muted class="opacity-80"></video>
  </div>
  
  <div class="absolute top-0 left-0 w-full p-6 z-20 flex justify-between items-start pointer-events-none">
    <div class="glass px-6 py-4 rounded-2xl pointer-events-auto">
      <h1 class="text-2xl font-bold text-indigo-400">😃 Face-api.js</h1>
      <p class="text-indigo-200/60 text-sm mt-1">实时人脸检测与表情分析</p>
      <div id="status" class="text-xs text-yellow-400 mt-2 font-mono">Loading Models... (Please wait)</div>
    </div>
    
    <a href="index.html" class="glass px-5 py-2 text-indigo-300 rounded-lg hover:bg-white/10 transition pointer-events-auto font-bold no-underline">返回</a>
  </div>
  
  <!-- Info Box -->
  <div id="expression-box" class="absolute bottom-10 left-1/2 -translate-x-1/2 glass px-8 py-4 rounded-full text-center hidden pointer-events-none z-20">
    <div class="text-3xl font-bold text-white mb-1" id="main-expr">Neutral</div>
    <div class="text-xs text-indigo-300 font-mono" id="conf-val">Confidence: 0%</div>
  </div>

<script>
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const exprBox = document.getElementById('expression-box');
  const mainExprEl = document.getElementById('main-expr');
  const confValEl = document.getElementById('conf-val');

  // Load models from a reliable CDN source (justadudewhohacks repo via jsdelivr)
  // We need: tinyFaceDetector, faceLandmark68Net, faceRecognitionNet, faceExpressionNet
  const MODEL_URL = 'https://cdn.jsdelivr.net/gh/cgarciagl/face-api.js@0.22.2/weights';

  Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
    faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
  ]).then(startVideo).catch(err => {
      statusEl.innerText = "Error loading models: " + err;
      statusEl.className = "text-xs text-red-400 mt-2 font-mono";
  });

  function startVideo() {
    statusEl.innerText = "Starting Camera...";
    navigator.mediaDevices.getUserMedia({ video: {} })
      .then(stream => {
         video.srcObject = stream;
      })
      .catch(err => {
         statusEl.innerText = "Camera Error: " + err;
      });
  }

  video.addEventListener('play', () => {
    statusEl.innerText = "Active";
    statusEl.className = "text-xs text-green-400 mt-2 font-mono";
    exprBox.classList.remove('hidden');

    const canvas = faceapi.createCanvasFromMedia(video);
    document.body.append(canvas);
    
    // Style canvas to match video (overlay)
    canvas.style.position = 'absolute';
    canvas.style.left = video.offsetLeft + 'px';
    canvas.style.top = video.offsetTop + 'px';
    
    const displaySize = { width: video.width, height: video.height };
    faceapi.matchDimensions(canvas, displaySize);

    setInterval(async () => {
      const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceExpressions();
        
      const resizedDetections = faceapi.resizeResults(detections, displaySize);
      
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      faceapi.draw.drawDetections(canvas, resizedDetections);
      faceapi.draw.drawFaceExpressions(canvas, resizedDetections);
      
      if(detections.length > 0) {
        // Get dominant expression
        const expr = detections[0].expressions;
        const sorted = Object.keys(expr).sort((a,b) => expr[b] - expr[a]);
        const bestMatch = sorted[0];
        const val = Math.floor(expr[bestMatch] * 100);
        
        mainExprEl.innerText = bestMatch.toUpperCase();
        confValEl.innerText = `Confidence: ${val}%`;
        
        // Dynamic Color
        if(bestMatch === 'happy') mainExprEl.className = "text-3xl font-bold text-yellow-400 mb-1";
        else if(bestMatch === 'sad') mainExprEl.className = "text-3xl font-bold text-blue-400 mb-1";
        else if(bestMatch === 'angry') mainExprEl.className = "text-3xl font-bold text-red-500 mb-1";
        else mainExprEl.className = "text-3xl font-bold text-white mb-1";

      } else {
         mainExprEl.innerText = "No Face";
      }

    }, 100);
  });
</script>
