<!doctype html>
<html lang="zh">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flatpickr 日期时间选择</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/airbnb.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; color: #1f2937; }
    .glass { background: white; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    /* 修复 input 样式 */
    input.flatpickr-input { background: white; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">📅 Flatpickr</h1>
    <p class="text-slate-500 mt-2 text-lg">轻量强大、零依赖的日期时间选择器</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-lg hover:border-slate-300 hover:bg-slate-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-8">

  <!-- 基础功能 -->
  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-xl text-slate-800 mb-6 border-b border-slate-100 pb-2">基础选择</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2">日期选择</label>
        <input id="basic" class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none shadow-sm cursor-pointer" placeholder="请选择日期...">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2">日期 + 时间</label>
        <input id="datetime" class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none shadow-sm cursor-pointer" placeholder="选择日期和时间...">
      </div>
    </div>
  </div>

  <!-- 高级功能 -->
  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-xl text-slate-800 mb-6 border-b border-slate-100 pb-2">高级模式</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2">范围选择 (Range)</label>
        <input id="range" class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none shadow-sm cursor-pointer" placeholder="开始日期 至 结束日期">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2">多选模式 (Multiple)</label>
        <input id="multiple" class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none shadow-sm cursor-pointer" placeholder="选择多个不连续日期...">
      </div>
    </div>
  </div>

  <!-- 禁用和内联 -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="glass p-8 rounded-2xl">
      <h3 class="font-bold text-xl text-slate-800 mb-6">🚫 禁用特定日期</h3>
      <p class="text-sm text-slate-500 mb-4">禁用了周末和今天之前的日期。</p>
      <input id="disable" class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-red-500 outline-none shadow-sm cursor-pointer" placeholder="尝试选择...">
    </div>

    <div class="glass p-8 rounded-2xl flex flex-col items-center">
      <h3 class="font-bold text-xl text-slate-800 mb-6">📄 内联显示 (Inline)</h3>
      <div id="inline"></div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
  // 全局本地化配置
  flatpickr.localize(flatpickr.l10ns.zh);

  // 基础
  flatpickr("#basic", {
    dateFormat: "Y-m-d"
  });

  // 日期时间
  flatpickr("#datetime", {
    enableTime: true,
    dateFormat: "Y-m-d H:i",
    time_24hr: true
  });

  // 范围选择
  flatpickr("#range", {
    mode: "range",
    dateFormat: "Y-m-d"
  });

  // 多选
  flatpickr("#multiple", {
    mode: "multiple",
    dateFormat: "Y-m-d"
  });

  // 禁用日期
  flatpickr("#disable", {
    disable: [
      function(date) {
        // 禁用周末 (周六=6, 周日=0)
        return (date.getDay() === 0 || date.getDay() === 6);
      },
      {
        from: "1900-01-01",
        to: new Date().fp_incr(-1) // 禁用过去的时间
      }
    ]
  });

  // 内联
  flatpickr("#inline", {
    inline: true
  });
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
