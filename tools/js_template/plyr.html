<!doctype html>
<html lang="zh">
<head>
<!-- Google tag (gtag.js) -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plyr 多媒体播放器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; min-height: 100vh; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    /* Plyr 主题定制 */
    .plyr--full-ui input[type=range] { color: #3b82f6; }
    .plyr__control--overlaid { background: rgba(59, 130, 246, 0.8); }
    .plyr--video .plyr__control.plyr__tab-focus, .plyr--video .plyr__control:hover, .plyr--video .plyr__control[aria-expanded=true] {
      background: #3b82f6;
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-12">
  <div>
    <h1 class="text-3xl font-bold">▶️ Plyr</h1>
    <p class="text-slate-400 mt-2 text-lg">简单、轻量、可定制的 HTML5 媒体播放器</p>
  </div>
  <a href="index.html" class="px-6 py-2 glass rounded-full hover:bg-white/10 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-12">

  <!-- 视频播放器 -->
  <section class="space-y-4">
    <div class="flex items-center justify-between">
      <h3 class="text-xl font-bold flex items-center gap-2">🎬 视频播放 <span class="text-xs bg-blue-600 px-2 py-1 rounded text-white font-normal">HTML5</span></h3>
    </div>
    <div class="rounded-2xl overflow-hidden shadow-2xl glass">
      <video id="player" playsinline controls data-poster="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-HD.jpg">
        <source src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-576p.mp4" type="video/mp4" />
        <source src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-720p.mp4" type="video/mp4" />
        <!-- 字幕 -->
        <track kind="captions" label="English" srclang="en" src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-HD.en.vtt" default />
        <track kind="captions" label="Français" srclang="fr" src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-HD.fr.vtt" />
      </video>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
      <button onclick="player.play()" class="p-3 bg-slate-800 rounded-lg hover:bg-slate-700">播放 Play</button>
      <button onclick="player.pause()" class="p-3 bg-slate-800 rounded-lg hover:bg-slate-700">暂停 Pause</button>
      <button onclick="player.restart()" class="p-3 bg-slate-800 rounded-lg hover:bg-slate-700">重播 Restart</button>
      <button onclick="player.toggleControls(true)" class="p-3 bg-slate-800 rounded-lg hover:bg-slate-700">显示/隐藏控制栏</button>
    </div>
  </section>

  <!-- 音频播放器 -->
  <section class="space-y-4">
    <h3 class="text-xl font-bold flex items-center gap-2">🎵 音频播放 <span class="text-xs bg-purple-600 px-2 py-1 rounded text-white font-normal">MP3</span></h3>
    <div class="rounded-xl overflow-hidden glass p-4">
      <audio id="audio-player" controls>
        <source src="https://cdn.plyr.io/static/demo/Kishi_Bashi_-_It_All_Began_With_a_Burst.mp3" type="audio/mp3" />
        <source src="https://cdn.plyr.io/static/demo/Kishi_Bashi_-_It_All_Began_With_a_Burst.ogg" type="audio/ogg" />
      </audio>
    </div>
    <p class="text-slate-400 text-sm">即使是纯音频，Plyr 也能提供美观统一的 UI，支持进度条、音量控制和倍速播放。</p>
  </section>

  <!-- 第三方视频 -->
  <section class="space-y-4">
    <h3 class="text-xl font-bold flex items-center gap-2">📺 YouTube 集成 <span class="text-xs bg-red-600 px-2 py-1 rounded text-white font-normal">Embed</span></h3>
    <div class="rounded-2xl overflow-hidden shadow-2xl glass aspect-video">
      <div id="youtube-player" data-plyr-provider="youtube" data-plyr-embed-id="bTqVqk7FSmY"></div>
    </div>
  </section>

</main>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
// 初始化视频播放器
const player = new Plyr('#player', {
  controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
  settings: ['captions', 'quality', 'speed', 'loop']
});

// 初始化音频播放器
const audioPlayer = new Plyr('#audio-player');

// 初始化 YouTube 播放器
const youtubePlayer = new Plyr('#youtube-player');

// 事件监听示例
player.on('play', event => {
  console.log('Video started playing');
});
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
