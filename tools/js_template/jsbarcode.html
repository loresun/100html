<html lang="zh">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JsBarcode 条形码生成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fdf4ff; color: #4a044e; }
    .glass { background: white; border: 1px solid #f0abfc; box-shadow: 0 4px 6px -1px rgba(192, 38, 211, 0.05); }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-fuchsia-900">║▌ JsBarcode</h1>
    <p class="text-fuchsia-800/60 mt-2 text-lg">简单易用的 SVG/Canvas 条形码生成器</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-fuchsia-200 text-fuchsia-800 rounded-lg hover:bg-fuchsia-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

  <!-- 生成器 -->
  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-fuchsia-900 mb-6 text-xl">实时生成器</h3>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-fuchsia-700 mb-1">Value</label>
        <input type="text" id="barcode-value" value="123456789012" class="w-full p-2 border border-fuchsia-200 rounded focus:border-fuchsia-500 outline-none" oninput="generate()">
      </div>

      <div>
        <label class="block text-sm font-bold text-fuchsia-700 mb-1">Format</label>
        <select id="barcode-format" class="w-full p-2 border border-fuchsia-200 rounded" onchange="generate()">
          <option value="CODE128">CODE128 (Auto)</option>
          <option value="EAN13">EAN-13</option>
          <option value="UPC">UPC</option>
          <option value="CODE39">CODE39</option>
          <option value="ITF14">ITF-14</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold text-fuchsia-700 mb-1">Color</label>
        <input type="color" id="barcode-color" value="#000000" class="w-full h-10 border border-fuchsia-200 rounded p-1" oninput="generate()">
      </div>
    </div>
  </div>

  <!-- 预览 -->
  <div class="glass p-8 rounded-2xl flex flex-col items-center justify-center bg-white">
    <svg id="barcode"></svg>
    <p class="text-xs text-fuchsia-300 mt-4">SVG Vector Format</p>
  </div>

</main>

<script>
  function generate() {
    const val = document.getElementById('barcode-value').value;
    const fmt = document.getElementById('barcode-format').value;
    const col = document.getElementById('barcode-color').value;

    try {
      JsBarcode("#barcode", val, {
        format: fmt,
        lineColor: col,
        width: 2,
        height: 100,
        displayValue: true
      });
    } catch (e) {
      // Ignore errors for invalid input while typing
      console.log("Invalid barcode data");
    }
  }

  // Init
  generate();
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
