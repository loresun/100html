  <meta charset="utf-8" />

  <title>js-cookie Cookie 操作</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fffbe6; color: #78350f; }
    .glass { background: white; border: 1px solid #fde68a; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.05); }
    .cookie-item { animation: fadein 0.3s ease-out; }
    @keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-2xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-amber-900">🍪 js-cookie</h1>
    <p class="text-amber-800/60 mt-2 text-lg">简单、轻量的 JavaScript Cookie 处理 API</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-amber-200 text-amber-800 rounded-lg hover:bg-amber-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-2xl mx-auto space-y-6">

  <!-- 设置 -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-amber-900 mb-4">Set Cookie</h3>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <input type="text" id="set-key" placeholder="Key (e.g. username)" class="p-2 border border-amber-200 rounded text-sm w-full">
      <input type="text" id="set-val" placeholder="Value (e.g. John)" class="p-2 border border-amber-200 rounded text-sm w-full">
    </div>
    <div class="flex items-center gap-4 text-sm text-amber-700 mb-4">
      <label class="flex items-center gap-2">
        <input type="checkbox" id="set-expire"> Expires in 7 days
      </label>
    </div>
    <button onclick="doSet()" class="w-full py-2 bg-amber-500 text-white rounded font-bold hover:bg-amber-600 transition">Save Cookie</button>
  </div>

  <!-- 读取列表 -->
  <div class="glass p-6 rounded-2xl">
     <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-amber-900">All Cookies</h3>
        <button onclick="refresh()" class="text-xs text-amber-500 hover:underline">Refresh</button>
     </div>
     <div id="list" class="space-y-2">
       <!-- Dynamic -->
     </div>
  </div>

</main>

<script>
  function doSet() {
    const k = document.getElementById('set-key').value;
    const v = document.getElementById('set-val').value;
    const expire = document.getElementById('set-expire').checked;
    
    if(!k) return alert('Key is required');

    if(expire) {
      Cookies.set(k, v, { expires: 7 });
    } else {
      Cookies.set(k, v);
    }
    
    refresh();
    document.getElementById('set-key').value = '';
    document.getElementById('set-val').value = '';
  }

  function doRemove(k) {
    Cookies.remove(k);
    refresh();
  }

  function refresh() {
    const listEl = document.getElementById('list');
    listEl.innerHTML = '';
    
    const all = Cookies.get(); // returns object
    if(Object.keys(all).length === 0) {
      listEl.innerHTML = '<div class="text-sm text-amber-400 italic">No cookies found.</div>';
      return;
    }

    for (const [key, value] of Object.entries(all)) {
      const el = document.createElement('div');
      el.className = 'cookie-item flex justify-between items-center p-3 bg-amber-50 rounded border border-amber-100';
      el.innerHTML = `
        <div class="truncate mr-4">
          <span class="font-bold text-amber-800">${key}</span>
          <span class="text-amber-600 mx-2">=</span>
          <span class="text-amber-600 font-mono text-sm">${value}</span>
        </div>
        <button onclick="doRemove('${key}')" class="text-xs text-red-400 hover:text-red-600 px-2">Delete</button>
      `;
      listEl.appendChild(el);
    }
  }

  // Init
  refresh();
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/js_template_js-cookie.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
