  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swiper 触控滑动</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .swiper { width: 100%; height: 400px; border-radius: 16px; }
    .swiper-slide { display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: white; border-radius: 16px; position: relative; overflow: hidden; }
    .slide-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; filter: brightness(0.6); }
    .swiper-pagination-bullet-active { background: white !important; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-12">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">📱 Swiper 触控滑动</h1>
    <p class="text-slate-500 mt-1">现代移动端触控滑动插件，支持 3D 效果与视差滚动</p>
  </div>
  <a href="index.html" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">← 返回导航</a>
</header>

<main class="max-w-4xl mx-auto space-y-8">

  <!-- Main Swiper -->
  <div class="swiper mySwiper shadow-xl">
    <div class="swiper-wrapper">
      <div class="swiper-slide bg-indigo-600">
        <div class="text-center z-10">
          <h2 class="text-4xl mb-2">Slide 1</h2>
          <p class="text-lg opacity-80">Default Slide</p>
        </div>
      </div>
      <div class="swiper-slide bg-emerald-600">
        <div class="text-center z-10">
          <h2 class="text-4xl mb-2">Slide 2</h2>
          <p class="text-lg opacity-80">With Pagination</p>
        </div>
      </div>
      <div class="swiper-slide bg-pink-600">
        <div class="text-center z-10">
          <h2 class="text-4xl mb-2">Slide 3</h2>
          <p class="text-lg opacity-80">Infinite Loop</p>
        </div>
      </div>
       <div class="swiper-slide bg-blue-600">
        <div class="text-center z-10">
          <h2 class="text-4xl mb-2">Slide 4</h2>
          <p class="text-lg opacity-80">Cube Effect</p>
        </div>
      </div>
    </div>
    <div class="swiper-pagination"></div>
    <div class="swiper-button-next text-white"></div>
    <div class="swiper-button-prev text-white"></div>
  </div>

  <!-- Settings -->
  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-4 justify-center">
    <button onclick="setEffect('slide')" class="px-4 py-2 bg-slate-100 rounded-lg hover:bg-slate-200 text-sm font-medium">默认滑动</button>
    <button onclick="setEffect('fade')" class="px-4 py-2 bg-slate-100 rounded-lg hover:bg-slate-200 text-sm font-medium">淡入淡出 (Fade)</button>
    <button onclick="setEffect('cube')" class="px-4 py-2 bg-slate-100 rounded-lg hover:bg-slate-200 text-sm font-medium">3D 方块 (Cube)</button>
    <button onclick="setEffect('cards')" class="px-4 py-2 bg-slate-100 rounded-lg hover:bg-slate-200 text-sm font-medium">卡片 (Cards)</button>
    <button onclick="setEffect('coverflow')" class="px-4 py-2 bg-slate-100 rounded-lg hover:bg-slate-200 text-sm font-medium">3D 覆盖流 (Coverflow)</button>
  </div>

</main>

<script>
  let swiper = new Swiper(".mySwiper", {
    effect: "coverflow",
    grabCursor: true,
    centeredSlides: true,
    slidesPerView: "auto",
    loop: true,
    coverflowEffect: {
      rotate: 50,
      stretch: 0,
      depth: 100,
      modifier: 1,
      slideShadows: true
    },
    pagination: {
      el: ".swiper-pagination",
      clickable: true
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev"
    },
    autoplay: {
      delay: 2500,
      disableOnInteraction: false
    }
  });

  function setEffect(effectName) {
    swiper.destroy(); // Destroy old instance
    
    // Re-init with new effect
    let params = {
      effect: effectName,
      grabCursor: true,
      loop: true,
      pagination: {
        el: ".swiper-pagination",
        clickable: true
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev"
      },
       autoplay: {
        delay: 2500,
        disableOnInteraction: false
      }
    };

    if (effectName === 'coverflow') {
      params.centeredSlides = true;
      params.slidesPerView = 'auto';
      params.coverflowEffect = {
        rotate: 50, stretch: 0, depth: 100, modifier: 1, slideShadows: true
      };
    } else if (effectName === 'cards') {
      params.grabCursor = true;
    } else if (effectName === 'cube') {
      params.cubeEffect = { shadow: true, slideShadows: true, shadowOffset: 20, shadowScale: 0.94 };
    }

    swiper = new Swiper(".mySwiper", params);
  }
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
