  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choices.js 增强选择框</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Choices.js CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #eef2ff; color: #3730a3; }
    .glass { background: white; border: 1px solid #c7d2fe; box-shadow: 0 4px 6px -1px rgba(67, 56, 202, 0.05); }
    /* Overrides */
    .choices__inner { background-color: white; border-radius: 0.5rem; border: 1px solid #e0e7ff; }
    .choices__list--dropdown { border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border:none; }
    .choices[data-type*="select-one"] .choices__input { background-color: #f8fafc; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-2xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-indigo-900">☑️ Choices.js</h1>
    <p class="text-indigo-800/60 mt-2 text-lg">轻量级、可配置的选择框/输入框增强库</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-indigo-200 text-indigo-800 rounded-lg hover:bg-indigo-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-2xl mx-auto space-y-8">

  <!-- 1. 多选标签 -->
  <div class="glass p-8 rounded-2xl">
    <label class="block font-bold text-indigo-900 mb-2">多选标签 (Text Inputs)</label>
    <p class="text-sm text-indigo-500 mb-4">输入内容并按回车，或输入已存在的值。</p>
    <input id="choices-text-remove-button" type="text" value="HTML, CSS" placeholder="输入并回车..." />
  </div>

  <!-- 2. 下拉单选 -->
  <div class="glass p-8 rounded-2xl">
    <label class="block font-bold text-indigo-900 mb-2">带搜索的单选 (Select Single)</label>
    <select id="choices-single-groups">
      <option value="">选择一个城市...</option>
      <optgroup label="Europe">
        <option>London</option>
        <option>Berlin</option>
        <option>Paris</option>
      </optgroup>
      <optgroup label="Asia">
        <option>Tokyo</option>
        <option>Beijing</option>
        <option>Seoul</option>
      </optgroup>
    </select>
  </div>

  <!-- 3. 下拉多选 -->
  <div class="glass p-8 rounded-2xl">
    <label class="block font-bold text-indigo-900 mb-2">多选列表 (Select Multiple)</label>
    <select id="choices-multiple-remove-button" multiple>
      <option value="Choice 1" selected>React</option>
      <option value="Choice 2">Vue</option>
      <option value="Choice 3">Angular</option>
      <option value="Choice 4" selected>Svelte</option>
    </select>
  </div>

</main>

<script>
  // 1. Text Inputs
  const textRemove = new Choices(
    document.getElementById('choices-text-remove-button'),
    {
      delimiter: ',',
      editItems: true,
      maxItemCount: 5,
      removeItemButton: true
    }
  );

  // 2. Single Select
  const single = new Choices(
    document.getElementById('choices-single-groups'),
    {
        searchEnabled: true,
        placeholderValue: '请选择...'
    }
  );

  // 3. Multiple Select
  const multiple = new Choices(
    document.getElementById('choices-multiple-remove-button'),
    {
      removeItemButton: true,
      placeholderValue: '选择技术栈'
    }
  );
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
