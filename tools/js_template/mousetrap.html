  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mousetrap 键盘绑定</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mousetrap@1.6.5/mousetrap.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff1f2; color: #9f1239; }
    .glass { background: white; border: 1px solid #fda4af; box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.05); }
    .key { display: inline-block; padding: 2px 6px; border-radius: 4px; background: #fdf2f8; border: 1px solid #fecdd3; font-family: monospace; font-size: 0.85em; color: #be123c; margin: 0 2px; }
    #target-box { transition: all 0.2s; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-2xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-rose-900">⌨️ Mousetrap</h1>
    <p class="text-rose-800/60 mt-2 text-lg">用于处理键盘快捷键的简单库</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-rose-200 text-rose-800 rounded-lg hover:bg-rose-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-2xl mx-auto space-y-8">

  <!-- 演示区 -->
  <div class="glass p-12 rounded-2xl flex flex-col items-center justify-center text-center">
    
    <div id="target-box" class="w-32 h-32 bg-rose-500 rounded-2xl shadow-lg mb-6 flex items-center justify-center text-white font-bold text-2xl">
      Ready
    </div>
    
    <div id="status" class="text-rose-600 font-bold text-lg mb-2">按下对应按键触发效果</div>
    
    <div class="grid grid-cols-2 gap-4 text-sm text-left mt-6 w-full max-w-sm">
      <div class="p-2 border border-rose-100 rounded bg-rose-50/50">
        <span class="key">4</span> 变蓝
      </div>
      <div class="p-2 border border-rose-100 rounded bg-rose-50/50">
        <span class="key">x</span> 变红 (重置)
      </div>
      <div class="p-2 border border-rose-100 rounded bg-rose-50/50">
        <span class="key">ctrl+k</span> 旋转
      </div>
      <div class="p-2 border border-rose-100 rounded bg-rose-50/50">
        <span class="key">g</span> <span class="key">i</span> 组合键 Konami
      </div>
      <div class="p-2 border border-rose-100 rounded bg-rose-50/50">
        <span class="key">?</span> 显示帮助
      </div>
    </div>
    
  </div>

  <div class="p-4 bg-yellow-50 text-yellow-800 rounded-lg text-sm text-center">
    注意：请确保焦点在页面上（点击一下空白处）。
  </div>

</main>

<script>
  const box = document.getElementById('target-box');
  const msg = document.getElementById('status');
  
  function setStatus(text) {
    msg.innerText = text;
    // reset animation
    msg.style.transform = 'scale(1.1)';
    setTimeout(() => msg.style.transform = 'scale(1)', 100);
  }

  // Bindings
  
  Mousetrap.bind('4', function() { 
    box.className = "w-32 h-32 bg-blue-500 rounded-2xl shadow-lg mb-6 flex items-center justify-center text-white font-bold text-2xl transition-colors";
    box.innerText = "Blue";
    setStatus('Triggered: 4');
  });
  
  Mousetrap.bind('x', function() { 
    box.className = "w-32 h-32 bg-rose-500 rounded-2xl shadow-lg mb-6 flex items-center justify-center text-white font-bold text-2xl transition-colors";
    box.innerText = "Red";
    box.style.transform = 'rotate(0deg)';
    setStatus('Triggered: x (Reset)');
  });

  Mousetrap.bind('ctrl+k', function(e) {
    if (e.preventDefault) e.preventDefault();
    box.style.transform = 'rotate(180deg)';
    setStatus('Triggered: ctrl+k');
    return false;
  });

  Mousetrap.bind('g i', function() { 
    setStatus('Triggered Sequence: g then i');
    box.innerText = "Combo";
    box.className = "w-32 h-32 bg-green-500 rounded-2xl shadow-lg mb-6 flex items-center justify-center text-white font-bold text-2xl transition-colors";
  });

  Mousetrap.bind('?', function() { 
    alert('帮助: 这些快捷键由 Mousetrap.js 驱动');
  });

</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
