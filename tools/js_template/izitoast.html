  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iziToast 消息通知</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fffbff; color: #4a044e; }
    .glass { background: white; border: 1px solid #f5d0fe; box-shadow: 0 4px 6px -1px rgba(192, 38, 211, 0.05); }
    button { transition: all 0.2s; }
    button:active { transform: scale(0.95); }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-fuchsia-900">🍞 iziToast</h1>
    <p class="text-fuchsia-800/60 mt-2 text-lg">优雅、响应式、无依赖的消息通知插件</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-fuchsia-200 text-fuchsia-800 rounded-lg hover:bg-fuchsia-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-10">

  <!-- 基础类型 -->
  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-xl text-fuchsia-900 mb-6">基础通知类型</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <button onclick="showInfo()" class="px-4 py-3 bg-blue-500 text-white rounded-lg shadow-lg shadow-blue-500/30 hover:bg-blue-600 font-bold">
        ℹ️ Info
      </button>
      <button onclick="showSuccess()" class="px-4 py-3 bg-green-500 text-white rounded-lg shadow-lg shadow-green-500/30 hover:bg-green-600 font-bold">
        ✅ Success
      </button>
      <button onclick="showWarning()" class="px-4 py-3 bg-orange-500 text-white rounded-lg shadow-lg shadow-orange-500/30 hover:bg-orange-600 font-bold">
        ⚠️ Warning
      </button>
      <button onclick="showError()" class="px-4 py-3 bg-red-500 text-white rounded-lg shadow-lg shadow-red-500/30 hover:bg-red-600 font-bold">
        ❌ Error
      </button>
    </div>
  </div>

  <!-- 位置演示 -->
  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-xl text-fuchsia-900 mb-6">位置 (Positions)</h3>
    <div class="relative w-full h-48 bg-fuchsia-50 rounded-xl border-2 border-dashed border-fuchsia-200 flex flex-col justify-between p-4">
      <div class="flex justify-between w-full">
        <button onclick="showPos('topLeft')" class="w-8 h-8 bg-fuchsia-200 rounded hover:bg-fuchsia-400"></button>
        <button onclick="showPos('topCenter')" class="w-8 h-8 bg-fuchsia-200 rounded hover:bg-fuchsia-400"></button>
        <button onclick="showPos('topRight')" class="w-8 h-8 bg-fuchsia-200 rounded hover:bg-fuchsia-400"></button>
      </div>
      <div class="text-center text-fuchsia-300 pointer-events-none">点击方块触发</div>
      <div class="flex justify-between w-full">
        <button onclick="showPos('bottomLeft')" class="w-8 h-8 bg-fuchsia-200 rounded hover:bg-fuchsia-400"></button>
        <button onclick="showPos('bottomCenter')" class="w-8 h-8 bg-fuchsia-200 rounded hover:bg-fuchsia-400"></button>
        <button onclick="showPos('bottomRight')" class="w-8 h-8 bg-fuchsia-200 rounded hover:bg-fuchsia-400"></button>
      </div>
    </div>
  </div>

  <!-- 高级交互 -->
  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-xl text-fuchsia-900 mb-6">高级交互</h3>
    <div class="flex gap-4 flex-wrap">
      <button onclick="showBalloon()" class="px-6 py-2 bg-white border border-fuchsia-200 text-fuchsia-700 rounded-full hover:bg-fuchsia-50 font-bold">
        🎈 气泡模式
      </button>
      <button onclick="showInputs()" class="px-6 py-2 bg-white border border-fuchsia-200 text-fuchsia-700 rounded-full hover:bg-fuchsia-50 font-bold">
        📝 带输入框
      </button>
      <button onclick="showButtons()" class="px-6 py-2 bg-white border border-fuchsia-200 text-fuchsia-700 rounded-full hover:bg-fuchsia-50 font-bold">
        🔘 带按钮询问
      </button>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
<script>
  function showInfo() {
    iziToast.info({
      title: 'Hello',
      message: '欢迎来到 iziToast 演示页面！',
      position: 'topRight'
    });
  }

  function showSuccess() {
    iziToast.success({
      title: 'OK',
      message: '操作已成功完成！',
      position: 'topRight'
    });
  }

  function showWarning() {
    iziToast.warning({
      title: '注意',
      message: '您的账户余额不足警告。',
      position: 'topRight'
    });
  }

  function showError() {
    iziToast.error({
      title: '错误',
      message: '无法连接到服务器 500。',
      position: 'topRight'
    });
  }

  function showPos(pos) {
    iziToast.show({
      title: '位置演示',
      message: `我在 ${pos}`,
      position: pos,
      theme: 'dark',
      color: 'blue'
    });
  }

  function showBalloon() {
    iziToast.show({
      id: 'show',
      title: 'Hey',
      image: 'https://vjs.zencdn.net/v/oceans.png',
      imageWidth: 50,
      message: '这看起来像一个即时通讯消息。',
      position: 'bottomRight',
      transitionIn: 'flipInX',
      transitionOut: 'flipOutX',
      progressBarColor: 'rgb(0, 255, 184)',
      imageWidth: 70,
      layout: 2,
      onClosing: function(){
          console.info('onClosing');
      },
      onClosed: function(instance, toast, closedBy){
          console.info('Closed | closedBy: ' + closedBy);
      },
      icon: 'fa fa-user',
      backgroundColor: '#fff',
      messageColor: 'black'
    });
  }

  function showInputs() {
    iziToast.question({
      timeout: 20000,
      close: false,
      overlay: true,
      displayMode: 'once',
      id: 'question',
      zindex: 999,
      title: '嘿！',
      message: '你觉得这个库怎么样？',
      position: 'center',
      inputs: [
        ['<input type="text">', 'keyup', function (instance, toast, input, e) {
            console.info(input.value);
        }, true],
        ['<input type="number">', 'keydown', function (instance, toast, input, e) {
            console.info(input.value);
        }]
      ],
      buttons: [
        ['<button><b>提交</b></button>', function (instance, toast) {
            instance.hide({ transitionOut: 'fadeOut' }, toast, 'button');
        }, true],
      ]
    });
  }

  function showButtons() {
    iziToast.show({
      theme: 'dark',
      icon: 'icon-person',
      title: '删除账号',
      message: '你确定要删除这个账号吗？此操作不可逆。',
      position: 'center',
      progressBarColor: 'rgb(0, 255, 184)',
      buttons: [
        ['<button>确定</button>', function (instance, toast) {
            alert("Clicked YES");
            instance.hide({ transitionOut: 'fadeOut' }, toast, 'button');
        }, true],
        ['<button>取消</button>', function (instance, toast) {
            alert("Clicked NO");
            instance.hide({ transitionOut: 'fadeOut' }, toast, 'button');
        }]
      ],
      onOpening: function(instance, toast){
          console.info('callback abriu!');
      },
      onClosing: function(instance, toast, closedBy){
          console.info('closedBy: ' + closedBy);
      }
    });
  }
</script>

</body>
</html>
