  <meta charset="utf-8" />

  <title>MediaPipe Pose 姿态识别</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #18181b; color: #e4e4e7; overflow: hidden; }
    .glass { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
    canvas { transform: scaleX(-1); /* Mirror */ }
    video { transform: scaleX(-1); display: none; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="w-screen h-screen relative">

  <video class="input_video"></video>
  <canvas class="output_canvas w-full h-full object-cover absolute top-0 left-0"></canvas>

  <div class="absolute top-6 left-6 z-10 glass px-6 py-4 rounded-2xl">
     <h1 class="text-2xl font-bold text-emerald-400">🏃 MediaPipe Pose</h1>
     <p class="text-zinc-400 text-sm mt-1">全身 33 点骨架识别</p>
     <div id="status" class="text-xs text-yellow-400 mt-2 font-mono">Loading model...</div>
  </div>
  
  <a href="index.html" class="absolute top-6 right-6 z-10 glass px-5 py-2 text-zinc-300 rounded-lg font-bold no-underline">返回</a>

<script>
  const videoElement = document.getElementsByClassName('input_video')[0];
  const canvasElement = document.getElementsByClassName('output_canvas')[0];
  const canvasCtx = canvasElement.getContext('2d');
  const statusEl = document.getElementById('status');

  function onResults(results) {
    statusEl.innerText = "Tracking Active";
    statusEl.className = "text-xs text-green-400 mt-2 font-mono";

    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    
    // Draw Video
    // canvasCtx.globalCompositeOperation = 'source-in'; // Masking effect possible here
    canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

    // Draw Pose
    if (results.poseLandmarks) {
      drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS,
                     {color: '#ffffff', lineWidth: 4});
      drawLandmarks(canvasCtx, results.poseLandmarks,
                    {color: '#34d399', lineWidth: 2, radius: 6});
    }
    canvasCtx.restore();
  }

  const pose = new Pose({locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
  }});

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({image: videoElement});
    },
    width: 1280,
    height: 720
  });
  camera.start();
</script>

</html>
