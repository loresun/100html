  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dropzone.js 文件上传</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #eef2ff; color: #3730a3; }
    .glass { background: white; border: 1px solid #c7d2fe; box-shadow: 0 4px 6px -1px rgba(67, 56, 202, 0.05); }
    /* Dropzone 自定义样式 */
    .dropzone {
      border: 2px dashed #6366f1;
      border-radius: 1rem;
      background: #f5f7ff;
      color: #6366f1;
      min-height: 250px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .dropzone .dz-message { font-size: 1.1rem; font-weight: 600; }
    .dropzone:hover { background: #e0e7ff; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-indigo-900">📤 Dropzone.js</h1>
    <p class="text-indigo-800/60 mt-2 text-lg">支持拖拽的开源文件上传库</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-indigo-200 text-indigo-800 rounded-lg hover:bg-indigo-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-8">

  <!-- 上传区域 -->
  <div class="glass p-8 rounded-2xl">
    <div class="mb-4 flex justify-between items-center">
      <h3 class="font-bold text-xl text-indigo-900">上传文件</h3>
      <div class="text-xs text-indigo-500">仅用于演示，不进行服务器存储</div>
    </div>
    
    <form action="/file-upload" class="dropzone" id="my-dropzone">
      <div class="dz-message" data-dz-message>
        <span class="text-4xl block mb-2">☁️</span>
        <span>点击或将文件拖拽到这里上传</span>
      </div>
    </form>
  </div>

  <!-- 配置选项 -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="glass p-6 rounded-xl">
      <h4 class="font-bold text-indigo-900 mb-2">图片缩略图</h4>
      <p class="text-sm text-indigo-700/70">自动生成上传图片的缩略图预览。</p>
    </div>
    <div class="glass p-6 rounded-xl">
      <h4 class="font-bold text-indigo-900 mb-2">并行上传</h4>
      <p class="text-sm text-indigo-700/70">支持配置并行处理的文件数量。</p>
    </div>
    <div class="glass p-6 rounded-xl">
      <h4 class="font-bold text-indigo-900 mb-2">文件类型验证</h4>
      <p class="text-sm text-indigo-700/70">限制允许上传的文件扩展名。</p>
    </div>
  </div>

  <!-- 事件日志 -->
  <div class="glass p-6 rounded-xl">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-indigo-900">📝 事件日志</h3>
      <button onclick="clearLog()" class="text-xs text-indigo-500 hover:text-indigo-700">清空</button>
    </div>
    <div id="log" class="h-32 overflow-y-auto font-mono text-xs text-indigo-600 bg-indigo-50 p-4 rounded-lg border border-indigo-100">
      <div class="opacity-50">// 等待操作...</div>
    </div>
  </div>

</main>

<script>
  // 禁用 Dropzone 自动发现，以便手动配置
  Dropzone.autoDiscover = false;

  const logEl = document.getElementById('log');

  function log(msg) {
    const div = document.createElement('div');
    const time = new Date().toLocaleTimeString();
    div.innerHTML = `<span class="opacity-50">[${time}]</span> ${msg}`;
    logEl.insertBefore(div, logEl.firstChild);
  }

  function clearLog() {
    logEl.innerHTML = '';
  }

  const myDropzone = new Dropzone("#my-dropzone", {
    url: "#", // 演示模式
    maxFilesize: 2, // MB
    acceptedFiles: 'image/*,application/pdf',
    addRemoveLinks: true,
    dictDefaultMessage: "拖拽文件到这里",
    dictRemoveFile: "❌ 移除",
    
    // 模拟上传处理
    accept: function(file, done) {
      log(`收到文件: ${file.name} (${Math.round(file.size/1024)} KB)`);
      if (file.name === "justinbieber.jpg") {
        done("Naha, you don't.");
      } else { 
        done(); 
      }
    },
    
    init: function() {
      this.on("addedfile", function(file) { log("→ 加载文件..."); });
      this.on("success", function(file) { log("✅ 上传成功!"); });
      this.on("error", function(file, errorMessage) { log(`❌ 错误: ${errorMessage}`); });
      this.on("removedfile", function(file) { log("🗑️ 文件已移除"); });
      
      // 模拟进度条
      this.on("uploadprogress", function(file, progress, bytesSent) {
          // Dropzone 会在演示模式下瞬间完成，真实环境下会有进度
      });
    }
  });
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
