  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Axios 网络请求</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .loader { border: 3px solid #f3f3f3; border-top: 3px solid #6366f1; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-12">
  <div>
    <h1 class="text-3xl font-bold text-slate-800">📡 Axios 网络请求</h1>
    <p class="text-slate-500 mt-1">基于 Promise 的 HTTP 客户端，处理 RESTful API</p>
  </div>
  <a href="index.html" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">← 返回导航</a>
</header>

<main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">

  <!-- Left Panel: Controls -->
  <div class="space-y-6">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h3 class="font-bold text-slate-700 mb-4">API 操作 (Console)</h3>
      
      <div class="space-y-3">
        <button onclick="fetchUsers()" class="w-full text-left px-4 py-3 bg-indigo-50 text-indigo-700 rounded-lg hover:bg-indigo-100 transition flex items-center justify-between">
          <span>📅 获取用户列表 (GET)</span>
          <span class="text-xs bg-indigo-200 px-2 py-1 rounded">200 OK</span>
        </button>

        <button onclick="createUser()" class="w-full text-left px-4 py-3 bg-emerald-50 text-emerald-700 rounded-lg hover:bg-emerald-100 transition flex items-center justify-between">
          <span>➕ 创建新用户 (POST)</span>
          <span class="text-xs bg-emerald-200 px-2 py-1 rounded">201 Created</span>
        </button>

        <button onclick="simulateError()" class="w-full text-left px-4 py-3 bg-red-50 text-red-700 rounded-lg hover:bg-red-100 transition flex items-center justify-between">
          <span>⚠️ 模拟请求错误 (404)</span>
          <span class="text-xs bg-red-200 px-2 py-1 rounded">Error</span>
        </button>
      </div>
    </div>

    <!-- Status Log -->
    <div class="bg-slate-900 text-slate-300 p-4 rounded-xl font-mono text-xs h-48 overflow-y-auto" id="console-log">
      <div class="text-slate-500">// 控制台日志...</div>
    </div>
  </div>

  <!-- Right Panel: Data View -->
  <div class="md:col-span-2 space-y-4">
    <div class="flex justify-between items-center">
      <h3 class="font-bold text-slate-700">响应数据 (Response Data)</h3>
      <div id="loader" class="loader"></div>
    </div>
    
    <div id="user-list" class="grid grid-cols-1 gap-4">
      <!-- User Cards will be injected here -->
      <div class="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-500">
        点击左侧按钮发起请求
      </div>
    </div>
  </div>

</main>

<script>
  const logEl = document.getElementById('console-log');
  const listEl = document.getElementById('user-list');
  const loader = document.getElementById('loader');

  function log(method, url, status, time) {
    const div = document.createElement('div');
    div.className = 'border-b border-slate-800 py-2';
    div.innerHTML = `
      <span class="text-yellow-400 font-bold">${method}</span>
      <span class="text-slate-400">${url}</span>
      <div class="flex justify-between mt-1">
        <span class="${status >= 200 && status < 300 ? 'text-green-400' : 'text-red-400'}">${status}</span>
        <span class="text-slate-500">${time}ms</span>
      </div>
    `;
    logEl.prepend(div);
  }

  // Axios Interceptors for timing
  axios.interceptors.request.use(config => {
    config.metadata = { startTime: new Date() };
    loader.style.display = 'block';
    return config;
  }, error => Promise.reject(error));

  axios.interceptors.response.use(response => {
    response.config.metadata.endTime = new Date();
    response.duration = response.config.metadata.endTime - response.config.metadata.startTime;
    loader.style.display = 'none';
    return response;
  }, error => {
    error.config.metadata.endTime = new Date();
    error.duration = error.config.metadata.endTime - error.config.metadata.startTime;
    loader.style.display = 'none';
    return Promise.reject(error);
  });

  // 1. GET Request
  function fetchUsers() {
    listEl.innerHTML = ''; // clear
    axios.get('https://jsonplaceholder.typicode.com/users?_limit=4')
      .then(res => {
        log('GET', '/users?_limit=4', res.status, res.duration);
        renderUsers(res.data);
      })
      .catch(err => {
        console.error(err);
      });
  }

  // 2. POST Request
  function createUser() {
    axios.post('https://jsonplaceholder.typicode.com/users', {
      name: 'New User',
      email: 'newuser@example.com',
      company: { name: 'Acme Corp' }
    })
      .then(res => {
        log('POST', '/users', res.status, res.duration);
        // Prepend new user
        const card = createUserCard(res.data);
        listEl.prepend(card);
        // Show success
        alert(`User created with ID: ${res.data.id}`);
      });
  }

  // 3. Error Handling
  function simulateError() {
    axios.get('https://jsonplaceholder.typicode.com/users/9999')
      .catch(err => {
        if (err.response) {
          log('GET', '/users/9999', err.response.status, err.duration);
        } else {
           log('GET', '/users/9999', 'Net Error', 0);
        }
      });
  }

  function renderUsers(users) {
    listEl.innerHTML = '';
    users.forEach(user => {
      listEl.appendChild(createUserCard(user));
    });
  }

  function createUserCard(user) {
    const el = document.createElement('div');
    el.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4';
    el.innerHTML = `
      <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold">
        ${user.name.charAt(0)}
      </div>
      <div>
        <div class="font-bold text-slate-800">${user.name}</div>
        <div class="text-sm text-slate-500">${user.email}</div>
        <div class="text-xs text-indigo-500 mt-1">${user.company ? user.company.name : 'Freelancer'}</div>
      </div>
    `;
    return el;
  }
</script>

</body>
</html>
