  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>noUiSlider 滑块</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider/distnouislider.min.css">
  <link href="https://cdn.jsdelivr.net/npm/nouislider/dist/nouislider.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff1f2; color: #881337; }
    .glass { background: white; border: 1px solid #fecdd3; box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.05); }
    
    /* 自定义 Slider 样式 */
    .noUi-connect { background: #e11d48; }
    .noUi-handle { border-radius: 50%; box-shadow: none; border: 2px solid #e11d48; background: white; cursor: grab; }
    .noUi-handle:before, .noUi-handle:after { display: none; } /* 移除默认条纹 */
    .noUi-target { border: none; background: #ffe4e6; box-shadow: none; height: 10px; }
    .noUi-horizontal .noUi-handle { width: 24px; height: 24px; top: -7px; right: -12px; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-16">
  <div>
    <h1 class="text-3xl font-bold text-rose-900">🎚️ noUiSlider</h1>
    <p class="text-rose-800/60 mt-2 text-lg">轻量、无依赖、触摸友好的范围滑块</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-rose-200 text-rose-800 rounded-lg hover:bg-rose-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-16">

  <!-- 基础单一滑块 -->
  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-xl text-rose-900 mb-8">基础滑块</h3>
    <div id="slider-basic" class="mb-6"></div>
    <div class="text-center text-rose-700 font-mono">Value: <span id="val-basic">0</span></div>
  </div>

  <!-- 范围选择滑块 -->
  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-xl text-rose-900 mb-8">价格范围选择 (Range)</h3>
    <div id="slider-range" class="mb-6"></div>
    <div class="flex justify-between text-rose-700 font-bold">
      <span id="val-range-min">0</span>
      <span id="val-range-max">100</span>
    </div>
  </div>

  <!-- 带有 Tooltips (步长) -->
  <div class="glass p-8 rounded-2xl">
    <h3 class="font-bold text-xl text-rose-900 mb-8">带 Tooltips & 步长</h3>
    <p class="text-sm text-rose-400 mb-8">步长: 10</p>
    <div id="slider-step" class="mb-6"></div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/nouislider/dist/nouislider.min.js"></script>
<script>
  // 1. 基础滑块
  const basicSlider = document.getElementById('slider-basic');
  noUiSlider.create(basicSlider, {
    start: [20],
    connect: [true, false], // 左侧填充
    range: { 'min': 0, 'max': 100 }
  });
  
  basicSlider.noUiSlider.on('update', function (values, handle) {
    document.getElementById('val-basic').innerHTML = Math.round(values[handle]);
  });

  // 2. 范围选择
  const rangeSlider = document.getElementById('slider-range');
  noUiSlider.create(rangeSlider, {
    start: [20, 80],
    connect: true, // 中间填充
    range: { 'min': 0, 'max': 100 },
    margin: 10, // 最小间隔
    padding: 5 // 边距
  });

  rangeSlider.noUiSlider.on('update', function (values) {
    document.getElementById('val-range-min').innerHTML = '$' + Math.round(values[0]);
    document.getElementById('val-range-max').innerHTML = '$' + Math.round(values[1]);
  });

  // 3. Tooltips & Step
  const stepSlider = document.getElementById('slider-step');
  noUiSlider.create(stepSlider, {
    start: [40],
    step: 10,
    connect: [true, false],
    tooltips: {
      to: function(value) { return Math.round(value) + ' pts'; }
    },
    range: { 'min': 0, 'max': 100 },
    pips: { // 刻度
      mode: 'range',
      density: 3
    }
  });
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
