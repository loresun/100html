<html lang="zh">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Howler.js 音频播放器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafafa; color: #18181b; }
    .glass { background: white; border: 1px solid #e4e4e7; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
    .volume-slider { -webkit-appearance: none; height: 4px; background: #e4e4e7; border-radius: 2px; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #18181b; border-radius: 50%; cursor: pointer; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

<div class="glass w-full max-w-md p-8 rounded-3xl relative overflow-hidden">
  
  <!-- 背景装饰 -->
  <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-100 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 opacity-50 pointer-events-none"></div>

  <div class="flex justify-between items-start mb-8 relative z-10">
    <div>
      <h1 class="text-2xl font-bold">Howler.js</h1>
      <p class="text-sm text-zinc-400">现代 Web 音频库</p>
    </div>
    <a href="index.html" class="text-xs px-2 py-1 bg-zinc-100 rounded hover:bg-zinc-200 transition">退出</a>
  </div>

  <!-- 封面与可视化 -->
  <div class="w-full aspect-square bg-zinc-100 rounded-2xl mb-8 flex items-center justify-center relative shadow-inner overflow-hidden group">
    <div class="text-6xl group-hover:scale-110 transition-transform duration-500">🎵</div>
    
    <!-- 模拟波形 -->
    <div class="absolute bottom-0 left-0 right-0 h-16 flex items-end justify-center gap-1 p-4 opacity-30">
        <div class="w-1 bg-black h-4 animate-pulse"></div>
        <div class="w-1 bg-black h-8 animate-pulse" style="animation-delay: 0.1s"></div>
        <div class="w-1 bg-black h-6 animate-pulse" style="animation-delay: 0.2s"></div>
        <div class="w-1 bg-black h-10 animate-pulse" style="animation-delay: 0.3s"></div>
        <div class="w-1 bg-black h-5 animate-pulse" style="animation-delay: 0.4s"></div>
    </div>
  </div>

  <!-- 控制器 -->
  <div class="space-y-6">
    <!-- 进度条 (模拟) -->
    <div>
      <div class="flex justify-between text-xs text-zinc-400 mb-1 font-mono">
        <span id="timer">0:00</span>
        <span id="duration">0:00</span>
      </div>
      <div class="w-full h-1 bg-zinc-100 rounded-full overflow-hidden">
        <div id="progress" class="h-full bg-zinc-800 w-0 transition-all duration-200"></div>
      </div>
    </div>

    <!-- 按钮 -->
    <div class="flex justify-center items-center gap-6">
      <button class="text-2xl text-zinc-400 hover:text-zinc-800 transition">⏮</button>
      <button id="playBtn" onclick="togglePlay()" class="w-16 h-16 bg-zinc-900 text-white rounded-full flex items-center justify-center text-2xl shadow-lg hover:scale-105 transition active:scale-95">
        ▶
      </button>
      <button class="text-2xl text-zinc-400 hover:text-zinc-800 transition">⏭</button>
    </div>

    <!-- 音量与音效 -->
    <div class="flex items-center gap-4 pt-4 border-t border-zinc-100">
      <span class="text-xs font-bold text-zinc-500">SFX:</span>
      <button onclick="sfx('coin')" class="px-3 py-1 bg-yellow-100 text-yellow-800 text-xs rounded-full font-bold hover:bg-yellow-200">金币</button>
      <button onclick="sfx('laser')" class="px-3 py-1 bg-blue-100 text-blue-800 text-xs rounded-full font-bold hover:bg-blue-200">激光</button>
      
      <div class="flex-1"></div>
      
      <span class="text-lg">🔊</span>
      <input type="range" min="0" max="1" step="0.1" value="1" class="volume-slider w-20" oninput="Howler.volume(this.value)">
    </div>
  </div>

</div>

<script>
  // 1. Setup Sound
  // Using reliable online audio files
  const sound = new Howl({
    src: ['http://commondatastorage.googleapis.com/codeskulptor-demos/riceracer_assets/music/win.ogg'],
    html5: true, // Force HTML5 Audio for large files
    onplay: function() {
      requestAnimationFrame(step);
    },
    onload: function() {
      document.getElementById('duration').innerText = formatTime(sound.duration());
    },
    onend: function() {
      resetUI();
    }
  });

  const sfxPack = {
    coin: new Howl({ src: ['http://commondatastorage.googleapis.com/codeskulptor-assets/week7-brrring.m4a'] }), // Placeholder sound
    laser: new Howl({ src: ['http://commondatastorage.googleapis.com/codeskulptor-assets/week7-bounce.m4a'] })
  };

  // 2. Playback Control
  let isPlaying = false;
  const playBtn = document.getElementById('playBtn');
  const progress = document.getElementById('progress');
  const timer = document.getElementById('timer');

  function togglePlay() {
    if (isPlaying) {
      sound.pause();
      playBtn.innerText = '▶';
    } else {
      sound.play();
      playBtn.innerText = '⏸';
    }
    isPlaying = !isPlaying;
  }

  function step() {
    const seek = sound.seek() || 0;
    timer.innerText = formatTime(seek);
    progress.style.width = (((seek / sound.duration()) * 100) || 0) + '%';
    
    if (sound.playing()) {
      requestAnimationFrame(step);
    }
  }

  function resetUI() {
    isPlaying = false;
    playBtn.innerText = '▶';
    progress.style.width = '0%';
    timer.innerText = '0:00';
  }

  function formatTime(secs) {
    const minutes = Math.floor(secs / 60) || 0;
    const seconds = Math.floor(secs - minutes * 60) || 0;
    return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
  }

  function sfx(name) {
    // Stop previous sfx overlapping too much
    sfxPack[name].play();
  }

</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
