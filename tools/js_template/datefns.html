  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>date-fns 日期工具库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .card { backdrop-filter: blur(10px); background: rgba(255,255,255,0.95); }
    .result-box { background: #1e293b; color: #e2e8f0; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-8">
  <div>
    <h1 class="text-3xl font-bold text-white">📅 date-fns 日期工具库</h1>
    <p class="text-white/70 mt-1">现代化模块化日期处理库 - 轻量且可摇树优化</p>
  </div>
  <a href="index.html" class="px-4 py-2 bg-white/20 backdrop-blur rounded-lg text-white hover:bg-white/30 transition-colors">← 返回导航</a>
</header>

<main class="max-w-4xl mx-auto space-y-6">

  <!-- 当前时间展示 -->
  <div class="card p-6 rounded-2xl shadow-xl">
    <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
      <span class="w-8 h-8 bg-indigo-100 rounded-lg flex items-center justify-center">🕐</span>
      实时时间格式化
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="p-4 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl text-white">
        <div class="text-xs opacity-70 mb-1">当前时间</div>
        <div id="current-time" class="text-2xl font-bold mono">--:--:--</div>
      </div>
      <div class="p-4 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-xl text-white">
        <div class="text-xs opacity-70 mb-1">完整日期</div>
        <div id="full-date" class="text-lg font-bold">Loading...</div>
      </div>
      <div class="p-4 bg-gradient-to-br from-orange-500 to-red-500 rounded-xl text-white">
        <div class="text-xs opacity-70 mb-1">ISO 格式</div>
        <div id="iso-date" class="text-sm mono">Loading...</div>
      </div>
    </div>
  </div>

  <!-- 日期计算 -->
  <div class="card p-6 rounded-2xl shadow-xl">
    <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
      <span class="w-8 h-8 bg-emerald-100 rounded-lg flex items-center justify-center">➕</span>
      日期计算 (add/sub)
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-3">
        <div class="flex items-center gap-2">
          <span class="text-sm text-slate-600 w-20">增加天数:</span>
          <input type="number" id="add-days" value="7" class="w-20 px-3 py-2 border border-slate-300 rounded-lg text-center">
          <span class="text-slate-500">天</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm text-slate-600 w-20">减少月份:</span>
          <input type="number" id="sub-months" value="3" class="w-20 px-3 py-2 border border-slate-300 rounded-lg text-center">
          <span class="text-slate-500">月</span>
        </div>
      </div>
      <div class="result-box p-4 rounded-xl">
        <div class="text-xs text-slate-400 mb-2">计算结果:</div>
        <div id="calc-result" class="text-sm mono space-y-1"></div>
      </div>
    </div>
  </div>

  <!-- 日期差值 -->
  <div class="card p-6 rounded-2xl shadow-xl">
    <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
      <span class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">📏</span>
      日期差值计算 (difference)
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-3">
        <div class="flex items-center gap-2">
          <span class="text-sm text-slate-600">开始日期:</span>
          <input type="date" id="start-date" class="px-3 py-2 border border-slate-300 rounded-lg">
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm text-slate-600">结束日期:</span>
          <input type="date" id="end-date" class="px-3 py-2 border border-slate-300 rounded-lg">
        </div>
        <button onclick="calcDiff()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
          计算差值
        </button>
      </div>
      <div class="result-box p-4 rounded-xl">
        <div class="text-xs text-slate-400 mb-2">差值结果:</div>
        <div id="diff-result" class="text-sm mono space-y-1"></div>
      </div>
    </div>
  </div>

  <!-- 常用格式化模式 -->
  <div class="card p-6 rounded-2xl shadow-xl">
    <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
      <span class="w-8 h-8 bg-purple-100 rounded-lg flex items-center justify-center">🎨</span>
      常用格式化模式 (format)
    </h3>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-slate-200">
            <th class="text-left py-2 px-3 text-slate-600">模式</th>
            <th class="text-left py-2 px-3 text-slate-600">示例输出</th>
            <th class="text-left py-2 px-3 text-slate-600">说明</th>
          </tr>
        </thead>
        <tbody id="format-table" class="divide-y divide-slate-100">
        </tbody>
      </table>
    </div>
  </div>

  <!-- 实用函数列表 -->
  <div class="card p-6 rounded-2xl shadow-xl">
    <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
      <span class="w-8 h-8 bg-yellow-100 rounded-lg flex items-center justify-center">⚡</span>
      实用函数演示
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" id="utils-demo">
    </div>
  </div>

</main>

<!-- 加载 date-fns UMD 版本 -->
<script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
<script>
  // 获取 date-fns 函数 (CDN 版本挂载在 dateFns 全局对象上)
  const { 
    format, addDays, addMonths, subDays, subMonths, 
    differenceInDays, differenceInWeeks, differenceInMonths, differenceInYears,
    startOfMonth, endOfMonth, startOfWeek, endOfWeek,
    isWeekend, isSameDay, isToday, isFuture, isPast,
    formatDistanceToNow, parseISO
  } = dateFns;

  // =====================
  // 1. 实时时间更新
  // =====================
  function updateClock() {
    const now = new Date();
    document.getElementById('current-time').textContent = format(now, 'HH:mm:ss');
    document.getElementById('full-date').textContent = format(now, 'yyyy年MM月dd日 EEEE', { locale: dateFns.locale.zhCN });
    document.getElementById('iso-date').textContent = format(now, "yyyy-MM-dd'T'HH:mm:ssxxx");
  }
  setInterval(updateClock, 1000);
  updateClock();

  // =====================
  // 2. 日期计算
  // =====================
  function updateCalc() {
    const now = new Date();
    const daysToAdd = parseInt(document.getElementById('add-days').value) || 0;
    const monthsToSub = parseInt(document.getElementById('sub-months').value) || 0;
    
    const futureDate = addDays(now, daysToAdd);
    const pastDate = subMonths(now, monthsToSub);
    
    document.getElementById('calc-result').innerHTML = `
      <div class="text-emerald-400">+${daysToAdd}天: ${format(futureDate, 'yyyy-MM-dd')}</div>
      <div class="text-orange-400">-${monthsToSub}月: ${format(pastDate, 'yyyy-MM-dd')}</div>
    `;
  }
  
  document.getElementById('add-days').addEventListener('input', updateCalc);
  document.getElementById('sub-months').addEventListener('input', updateCalc);
  updateCalc();

  // =====================
  // 3. 日期差值
  // =====================
  // 设置默认日期
  const today = new Date();
  document.getElementById('start-date').value = format(today, 'yyyy-MM-dd');
  document.getElementById('end-date').value = format(addMonths(today, 6), 'yyyy-MM-dd');

  function calcDiff() {
    const startStr = document.getElementById('start-date').value;
    const endStr = document.getElementById('end-date').value;
    
    if (!startStr || !endStr) {
      document.getElementById('diff-result').innerHTML = '<span class="text-red-400">请选择两个日期</span>';
      return;
    }
    
    const start = parseISO(startStr);
    const end = parseISO(endStr);
    
    const days = differenceInDays(end, start);
    const weeks = differenceInWeeks(end, start);
    const months = differenceInMonths(end, start);
    const years = differenceInYears(end, start);
    
    document.getElementById('diff-result').innerHTML = `
      <div>相差 <span class="text-cyan-400 font-bold">${days}</span> 天</div>
      <div>相差 <span class="text-cyan-400 font-bold">${weeks}</span> 周</div>
      <div>相差 <span class="text-cyan-400 font-bold">${months}</span> 月</div>
      <div>相差 <span class="text-cyan-400 font-bold">${years}</span> 年</div>
    `;
  }
  calcDiff();

  // =====================
  // 4. 格式化模式表格
  // =====================
  const formatPatterns = [
    { pattern: 'yyyy-MM-dd', desc: '标准日期格式' },
    { pattern: 'yyyy/MM/dd HH:mm', desc: '日期时间' },
    { pattern: 'MM月dd日', desc: '中文月日' },
    { pattern: 'EEEE', desc: '星期几' },
    { pattern: 'yyyy年第Q季度', desc: '季度显示' },
    { pattern: 'HH:mm:ss.SSS', desc: '精确到毫秒' },
  ];
  
  const tableBody = document.getElementById('format-table');
  formatPatterns.forEach(item => {
    const now = new Date();
    try {
      const result = format(now, item.pattern, { locale: dateFns.locale.zhCN });
      tableBody.innerHTML += `
        <tr>
          <td class="py-2 px-3 mono text-indigo-600">${item.pattern}</td>
          <td class="py-2 px-3 mono text-slate-800">${result}</td>
          <td class="py-2 px-3 text-slate-500">${item.desc}</td>
        </tr>
      `;
    } catch (e) {
      tableBody.innerHTML += `
        <tr>
          <td class="py-2 px-3 mono text-indigo-600">${item.pattern}</td>
          <td class="py-2 px-3 mono text-red-500">格式化错误</td>
          <td class="py-2 px-3 text-slate-500">${item.desc}</td>
        </tr>
      `;
    }
  });

  // =====================
  // 5. 实用函数演示
  // =====================
  const now = new Date();
  const utilsDemos = [
    { name: 'startOfMonth', result: format(startOfMonth(now), 'yyyy-MM-dd'), desc: '本月开始' },
    { name: 'endOfMonth', result: format(endOfMonth(now), 'yyyy-MM-dd'), desc: '本月结束' },
    { name: 'startOfWeek', result: format(startOfWeek(now), 'yyyy-MM-dd'), desc: '本周开始' },
    { name: 'endOfWeek', result: format(endOfWeek(now), 'yyyy-MM-dd'), desc: '本周结束' },
    { name: 'isWeekend', result: isWeekend(now) ? '✅ 是周末' : '❌ 不是周末', desc: '是否周末' },
    { name: 'isToday', result: isToday(now) ? '✅ 是今天' : '❌ 不是今天', desc: '是否今天' },
  ];

  const utilsContainer = document.getElementById('utils-demo');
  utilsDemos.forEach(item => {
    utilsContainer.innerHTML += `
      <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
        <div class="text-xs text-slate-500">${item.desc}</div>
        <div class="mono text-sm text-indigo-600 font-bold">${item.name}()</div>
        <div class="text-sm text-slate-700 mt-1">${item.result}</div>
      </div>
    `;
  });
</script>

</html>
