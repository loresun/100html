  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Splide 轮播图</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Splide -->
  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #eef2ff; color: #312e81; }
    .glass { background: white; border: 1px solid #c7d2fe; box-shadow: 0 4px 6px -1px rgba(67, 56, 202, 0.05); }
    /* Custom Splide Theme */
    .splide__slide { display: flex; align-items: center; justify-content: center; font-size: 2rem; border-radius: 0.5rem; color: white; height: 10rem; }
    .splide__pagination__page.is-active { background: #4f46e5; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-indigo-900">🎠 Splide</h1>
    <p class="text-indigo-800/60 mt-2 text-lg">轻量级、灵活且无障碍 (A11y) 的滑块/轮播库</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-indigo-200 text-indigo-800 rounded-lg hover:bg-indigo-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-12">

  <!-- 1. Basic -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-indigo-900 mb-4">基础轮播</h3>
    <section id="basics" class="splide" aria-label="Basic Structure Example">
      <div class="splide__track">
        <ul class="splide__list">
          <li class="splide__slide bg-indigo-400">Slide 01</li>
          <li class="splide__slide bg-indigo-500">Slide 02</li>
          <li class="splide__slide bg-indigo-600">Slide 03</li>
        </ul>
      </div>
    </section>
  </div>

  <!-- 2. Multiple -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-indigo-900 mb-4">多图显示 (Per Page)</h3>
    <section id="multiple" class="splide" aria-label="Multiple Slides Example">
      <div class="splide__track">
        <ul class="splide__list">
          <li class="splide__slide bg-purple-400 mx-2">1</li>
          <li class="splide__slide bg-purple-500 mx-2">2</li>
          <li class="splide__slide bg-purple-600 mx-2">3</li>
          <li class="splide__slide bg-purple-700 mx-2">4</li>
          <li class="splide__slide bg-purple-800 mx-2">5</li>
          <li class="splide__slide bg-purple-900 mx-2">6</li>
        </ul>
      </div>
    </section>
  </div>

</main>

<script>
  // 1. Basic
  new Splide('#basics', {
    type: 'loop',
    autoplay: true
  }).mount();

  // 2. Multiple
  new Splide('#multiple', {
    type: 'loop',
    perPage: 3,
    focus: 'center',
    gap: '1rem',
    breakpoints: {
        640: { perPage: 1 }
    }
  }).mount();
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
