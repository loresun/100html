<!doctype html>
<html lang="zh">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ApexCharts 交互图表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fdf2f8; color: #831843; }
    .glass { background: white; border: 1px solid #fbcfe8; box-shadow: 0 4px 6px -1px rgba(219, 39, 119, 0.05); }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-6xl mx-auto flex justify-between items-center mb-8">
  <div>
    <h1 class="text-3xl font-bold text-pink-900">📈 ApexCharts</h1>
    <p class="text-pink-800/60 mt-2 text-lg">现代 SVG 图表库，交互性强，动画流畅</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-pink-200 text-pink-800 rounded-lg hover:bg-pink-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">

  <!-- 1. 面积图 (Area) -->
  <div class="glass p-6 rounded-2xl">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-pink-900 text-lg">网站流量 (Area Chart)</h3>
      <div id="selection-date" class="text-xs text-pink-500 font-mono">全年数据</div>
    </div>
    <div id="chart-area"></div>
  </div>

  <!-- 2. 混合图表 (Mixed) -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-pink-900 text-lg mb-4">收入与支出 (Line & Column)</h3>
    <div id="chart-mixed"></div>
  </div>

  <!-- 3. 径向条形图 (Radial) -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-pink-900 text-lg mb-4">目标完成度 (RadialBar)</h3>
    <div id="chart-radial" class="flex justify-center"></div>
  </div>

  <!-- 4. 烛台图 (Candlestick) -->
  <div class="glass p-6 rounded-2xl">
    <h3 class="font-bold text-pink-900 text-lg mb-4">股票走势 (Candlestick)</h3>
    <div id="chart-candle"></div>
  </div>

</main>

<script>
  // 通用配色
  const colors = ['#ec4899', '#8b5cf6', '#f59e0b']; // Pink, Violet, Amber

  // 1. Area Chart
  const optionsArea = {
    series: [{
      name: '访问量',
      data: [31, 40, 28, 51, 42, 109, 100]
    }, {
      name: '独立访客',
      data: [11, 32, 45, 32, 34, 52, 41]
    }],
    chart: {
      height: 350,
      type: 'area',
      toolbar: { show: false }
    },
    dataLabels: { enabled: false },
    stroke: { curve: 'smooth' },
    xaxis: {
      type: 'datetime',
      categories: ["2018-09-19T00:00:00.000Z", "2018-09-19T01:30:00.000Z", "2018-09-19T02:30:00.000Z", "2018-09-19T03:30:00.000Z", "2018-09-19T04:30:00.000Z", "2018-09-19T05:30:00.000Z", "2018-09-19T06:30:00.000Z"]
    },
    tooltip: { x: { format: 'dd/MM/yy HH:mm' } },
    colors: [colors[0], colors[1]],
    fill: { 
      type: 'gradient',
      gradient: { shadeIntensity: 1, opacityFrom: 0.7, opacityTo: 0.3 }
    }
  };
  new ApexCharts(document.querySelector("#chart-area"), optionsArea).render();

  // 2. Mixed Chart
  const optionsMixed = {
    series: [{
      name: '收入',
      type: 'column',
      data: [1.4, 2, 2.5, 1.5, 2.5, 2.8, 3.8, 4.6]
    }, {
      name: '现金流',
      type: 'column',
      data: [1.1, 3, 3.1, 4, 4.1, 4.9, 6.5, 8.5]
    }, {
      name: '支出',
      type: 'line',
      data: [20, 29, 37, 36, 44, 45, 50, 58]
    }],
    chart: { height: 350, type: 'line', toolbar: { show: false } },
    stroke: { width: [0, 0, 4] },
    colors: colors,
    xaxis: { categories: [2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016] }
  };
  new ApexCharts(document.querySelector("#chart-mixed"), optionsMixed).render();

  // 3. Radial Chart
  const optionsRadial = {
    series: [44, 55, 67, 83],
    chart: { height: 350, type: 'radialBar' },
    plotOptions: {
      radialBar: {
        dataLabels: {
          name: { fontSize: '22px' },
          value: { fontSize: '16px' },
          total: { show: true, label: '总进度', formatter: () => '249' }
        }
      }
    },
    labels: ['前端', '后端', '设计', '运维'],
    colors: ['#f43f5e', '#ec4899', '#d946ef', '#a855f7']
  };
  new ApexCharts(document.querySelector("#chart-radial"), optionsRadial).render();

  // 4. Candlestick
  const optionsCandle = {
    series: [{
      data: [
        { x: new Date(1538778600000), y: [6629.81, 6650.5, 6623.04, 6633.33] },
        { x: new Date(1538780400000), y: [6632.01, 6643.59, 6620, 6630.11] },
        { x: new Date(1538782200000), y: [6630.71, 6648.95, 6623.34, 6635.65] },
        { x: new Date(1538784000000), y: [6635.65, 6651, 6629.67, 6638.24] },
        { x: new Date(1538785800000), y: [6638.24, 6640, 6620, 6624.47] },
        { x: new Date(1538787600000), y: [6624.53, 6636.03, 6621.68, 6624.31] }
      ]
    }],
    chart: {
      type: 'candlestick',
      height: 350,
      toolbar: { show: false }
    },
    plotOptions: {
      candlestick: { colors: { upward: '#10b981', downward: '#ef4444' } }
    }
  };
  new ApexCharts(document.querySelector("#chart-candle"), optionsCandle).render();
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
