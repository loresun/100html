  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tagify 标签输入</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
  <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet" type="text/css" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #fffbeb; color: #92400e; }
    .glass { background: white; border: 1px solid #fcd34d; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.05); }
    
    /* Tagify Customization */
    .tagify { --tags-border-color: #fde68a; --tags-focus-border-color: #f59e0b; --tag-bg: #fff7ed; --tag-hover: #ffedd5; --tag-text-color: #92400e; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-2xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-amber-900">🏷️ Tagify</h1>
    <p class="text-amber-800/60 mt-2 text-lg">强大的标签输入组件，支持混合内容和自动补全</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-amber-200 text-amber-800 rounded-lg hover:bg-amber-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-2xl mx-auto space-y-8">

  <!-- 1. 基础标签 -->
  <div class="glass p-8 rounded-2xl">
    <label class="block font-bold text-amber-900 mb-2">基础用法 (Basic)</label>
    <p class="text-sm text-amber-600 mb-4">预设值: tag1, tag 2</p>
    <input name='basic' value='tag1, tag 2' autofocus class='w-full'>
  </div>

  <!-- 2. 混合内容 -->
  <div class="glass p-8 rounded-2xl">
    <label class="block font-bold text-amber-900 mb-2">混合内容 (Mix Text & Tags)</label>
    <p class="text-sm text-amber-600 mb-4">输入 @ 选择用户</p>
    <textarea name='mix' class='w-full h-24 p-2'>Hello [[Eric Cartman]], how are you?</textarea>
  </div>

  <!-- 3. 输出 -->
  <div class="glass p-6 rounded-2xl bg-amber-50 border-none">
    <h4 class="font-bold text-amber-800 mb-2">事件日志</h4>
    <div id="logs" class="text-xs font-mono text-amber-700 h-32 overflow-y-auto"></div>
  </div>

</main>

<script>
  function log(text) {
    const el = document.getElementById('logs');
    el.innerHTML = `<div>> ${text}</div>` + el.innerHTML;
  }

  // 1. Basic
  const input = document.querySelector('input[name=basic]');
  const tagify = new Tagify(input);
  
  tagify.on('add', e => log(`Added: ${e.detail.data.value}`))
        .on('remove', e => log(`Removed: ${e.detail.data.value}`));

  // 2. Mix
  const textarea = document.querySelector('textarea[name=mix]');
  const tagifyMix = new Tagify(textarea, {
    mode: 'mix',
    pattern: /@/,  // Type @ to trigger
    whitelist: [
      {value:100, value:'Eric Cartman', title:'Character'},
      {value:101, value:'Kyle Broflovski', title:'Character'},
      {value:102, value:'Stan Marsh', title:'Character'},
    ],
    dropdown: {
      enabled: 1,
      position: 'text', 
      mapValueTo: 'value', 
      highlightFirst: true 
    }
  });

</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
