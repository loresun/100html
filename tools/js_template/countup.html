  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CountUp.js 数字滚动</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #eef2ff; color: #312e81; }
    .glass { background: white; border: 1px solid #c7d2fe; box-shadow: 0 4px 6px -1px rgba(67, 56, 202, 0.05); }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
  <div>
    <h1 class="text-3xl font-bold text-indigo-900">🔢 CountUp.js</h1>
    <p class="text-indigo-800/60 mt-2 text-lg">无依赖的轻量级数字滚动动画库</p>
  </div>
  <a href="index.html" class="px-5 py-2.5 bg-white border border-indigo-200 text-indigo-800 rounded-lg hover:bg-indigo-50 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-8">

  <!-- 主要展示区 -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="glass p-6 rounded-2xl text-center">
      <div class="text-sm text-indigo-500 font-bold mb-2 uppercase tracking-wider">总收入</div>
      <div id="target-1" class="text-4xl font-black text-indigo-900">0</div>
    </div>
    <div class="glass p-6 rounded-2xl text-center">
      <div class="text-sm text-indigo-500 font-bold mb-2 uppercase tracking-wider">活跃用户</div>
      <div id="target-2" class="text-4xl font-black text-indigo-900">0</div>
    </div>
    <div class="glass p-6 rounded-2xl text-center">
      <div class="text-sm text-indigo-500 font-bold mb-2 uppercase tracking-wider">完成率</div>
      <div id="target-3" class="text-4xl font-black text-indigo-900">0</div>
    </div>
  </div>

  <!-- 控制面板 -->
  <div class="glass p-8 rounded-2xl">
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-xl text-indigo-900">🎮 动画控制</h3>
      <div class="space-x-2">
        <button onclick="startAll()" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 font-medium">开始</button>
        <button onclick="pauseResumeAll()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded hover:bg-slate-300 font-medium">暂停/继续</button>
        <button onclick="resetAll()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded hover:bg-slate-300 font-medium">重置</button>
        <button onclick="updateAll()" class="px-4 py-2 bg-pink-600 text-white rounded hover:bg-pink-700 font-medium">更新数值</button>
      </div>
    </div>
    
    <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100 text-sm text-indigo-900 grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <strong>Target 1 (总收入):</strong>
        <p class="text-indigo-600/70 mt-1">
          - 范围: 0 -> 4523.65<br>
          - 持续时间: 2秒<br>
          - 格式: $前缀, 2位小数
        </p>
      </div>
      <div>
        <strong>Target 3 (完成率):</strong>
        <p class="text-indigo-600/70 mt-1">
          - 范围: 0 -> 98<br>
          - 后缀: %<br>
          - 缓动函数: EaseOut
        </p>
      </div>
    </div>
  </div>

  <div class="text-center text-indigo-900/40 text-sm">
    CountUp.js 支持所有现代浏览器，压缩后仅 5kb
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
<script>
  let c1, c2, c3;
  
  // 初始化
  function init() {
    c1 = new countUp.CountUp('target-1', 4523.65, {
      decimalPlaces: 2,
      prefix: '$ ',
      duration: 2
    });

    c2 = new countUp.CountUp('target-2', 12450, {
      duration: 3,
      separator: ','
    });

    c3 = new countUp.CountUp('target-3', 98, {
      suffix: '%',
      duration: 4
    });

    if (!c1.error) c1.start();
    if (!c2.error) c2.start();
    if (!c3.error) c3.start();
  }

  function startAll() {
    c1.start();
    c2.start();
    c3.start();
  }

  function pauseResumeAll() {
    c1.pauseResume();
    c2.pauseResume();
    c3.pauseResume();
  }

  function resetAll() {
    c1.reset();
    c2.reset();
    c3.reset();
  }

  function updateAll() {
    c1.update(9999.99);
    c2.update(20000);
    c3.update(100);
  }

  // 页面加载完成后启动
  window.onload = init;
</script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
