  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vivus SVG 动画</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #fefce8 0%, #fef3c7 100%); min-height: 100vh; color: #78350f; }
    .glass { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    svg * { fill: none; stroke: currentColor; stroke-width: 2; transition: fill 0.3s; }
    .filled svg path { fill: #f59e0b; stroke: none; }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="p-6 md:p-12">

<header class="max-w-4xl mx-auto flex justify-between items-center mb-12">
  <div>
    <h1 class="text-4xl font-bold text-amber-800">✍️ Vivus</h1>
    <p class="text-amber-700/60 mt-2 text-lg">让 SVG 像手绘一样动起来</p>
  </div>
  <a href="index.html" class="px-6 py-2 glass rounded-full text-amber-900 hover:bg-white/80 transition-all font-medium">← 返回</a>
</header>

<main class="max-w-4xl mx-auto space-y-8">
  
  <!-- 核心演示 -->
  <div class="glass p-12 rounded-3xl flex flex-col items-center justify-center min-h-[400px]">
    <div id="svg-container" class="w-64 h-64 text-amber-600 mb-8">
      <!-- 这是一个示例 SVG，实际使用时可以是任何复杂的 SVG -->
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="40"/>
        <path d="M30 50 L45 65 L70 35"/>
        <path d="M50 10 L50 90 M10 50 L90 50" stroke-opacity="0.2"/>
        <rect x="20" y="20" width="60" height="60" rx="10"/>
      </svg>
    </div>
    
    <div class="flex flex-wrap gap-4 justify-center">
      <button onclick="playAnim('oneByOne')" class="px-6 py-3 bg-amber-500 text-white rounded-xl hover:bg-amber-600 font-bold shadow-lg shadow-amber-500/30 transition-transform active:scale-95">
        逐个绘制 (OneByOne)
      </button>
      <button onclick="playAnim('sync')" class="px-6 py-3 bg-amber-500 text-white rounded-xl hover:bg-amber-600 font-bold shadow-lg shadow-amber-500/30 transition-transform active:scale-95">
        同步绘制 (Sync)
      </button>
      <button onclick="playAnim('delayed')" class="px-6 py-3 bg-amber-500 text-white rounded-xl hover:bg-amber-600 font-bold shadow-lg shadow-amber-500/30 transition-transform active:scale-95">
        延迟绘制 (Delayed)
      </button>
      <button onclick="resetAnim()" class="px-6 py-3 bg-white text-amber-700 border border-amber-200 rounded-xl hover:bg-amber-50 font-bold">
        重置
      </button>
    </div>
  </div>

  <!-- 配置面板 -->
  <div class="glass p-8 rounded-3xl">
    <h3 class="font-bold text-2xl text-amber-900 mb-6">⚙️ 动画配置</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div>
        <label class="block text-sm font-bold text-amber-800 mb-2">动画时长 (帧)</label>
        <input type="range" id="duration" min="50" max="500" value="200" class="w-full accent-amber-500 h-2 bg-amber-200 rounded-lg appearance-none cursor-pointer">
        <div class="flex justify-between text-xs text-amber-600 mt-1">
          <span>快 (50)</span>
          <span>慢 (500)</span>
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold text-amber-800 mb-2">线条类型</label>
        <div class="flex gap-4">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="easing" value="EASE" checked class="accent-amber-500 w-5 h-5">
            <span>平滑 (Ease)</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="easing" value="LINEAR" class="accent-amber-500 w-5 h-5">
            <span>线性 (Linear)</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- HiDPI 示例 -->
  <div class="glass p-8 rounded-3xl flex items-center gap-6">
    <div id="icon-div" class="w-24 h-24 text-amber-600">
      <svg viewBox="0 0 100 100">
        <path d="M50 20 L20 80 L80 80 Z"/>
      </svg>
    </div>
    <div>
      <h3 class="font-bold text-xl text-amber-900 mb-2">交互式图标</h3>
      <p class="text-amber-700/80">将鼠标悬停在左侧图标上，触发重绘动画。适用于创建生动的微交互。</p>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/vivus@0.4.6/dist/vivus.min.js"></script>
<script>
let myVivus;

function initVivus(type = 'oneByOne') {
  if (myVivus) myVivus.destroy();
  
  const duration = parseInt(document.getElementById('duration').value);
  const animTiming = document.querySelector('input[name="easing"]:checked').value === 'EASE' ? Vivus.EASE : Vivus.LINEAR;

  // 重建 SVG 元素以确保重置
  const container = document.getElementById('svg-container');
  container.innerHTML = `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
      <circle cx="50" cy="50" r="40" stroke="currentColor" fill="none" stroke-width="2"/>
      <path d="M30 50 L45 65 L70 35" stroke="currentColor" fill="none" stroke-width="2"/>
      <path d="M50 10 L50 90 M10 50 L90 50" stroke="currentColor" fill="none" stroke-width="1" stroke-opacity="0.3"/>
      <rect x="20" y="20" width="60" height="60" rx="10" stroke="currentColor" fill="none" stroke-width="2"/>
    </svg>
  `;

  myVivus = new Vivus('svg-container', {
    type: type,
    duration: duration,
    animTimingFunction: animTiming,
    start: 'autostart'
  }, function(obj) {
    obj.el.classList.add('finished');
  });
}

function playAnim(type) {
  initVivus(type);
}

function resetAnim() {
  if (myVivus) myVivus.reset().stop();
}

// 初始播放
playAnim('oneByOne');

// 图标交互
new Vivus('icon-div', {
  duration: 50,
  type: 'sync',
  start: 'manual'
}, function(obj) {
  obj.el.addEventListener('mouseenter', () => {
    obj.reset().play();
  });
});
</script>

</body>
</html>
