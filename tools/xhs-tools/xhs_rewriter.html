<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书改稿机器人</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Marked (Markdown parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 小红书风格配色 */
        :root {
            --xhs-red: #ff2442;
            --xhs-bg: #fbfbfb;
            --xhs-gray: #f5f5f5;
        }

        body {
            background-color: var(--xhs-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 隐藏滚动条但允许滚动 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.3s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">

        <!-- 顶部导航 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                        <i class="fa-solid fa-pen-nib text-[#ff2442] text-xl"></i>
                        <span class="font-bold text-xl tracking-tight text-slate-900">小红书改稿机器人</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 bg-slate-100 rounded-lg p-1">
                            <button @click="model = 'deepseek-v4-flash'"
                                :class="{'bg-white shadow text-[#ff2442]': model === 'deepseek-v4-flash', 'text-slate-500': model !== 'deepseek-v4-flash'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="model = 'deepseek-v4-pro'"
                                :class="{'bg-white shadow text-[#ff2442]': model === 'deepseek-v4-pro', 'text-slate-500': model !== 'deepseek-v4-pro'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-[#ff2442] transition flex items-center gap-1 text-sm font-medium">
                            <i class="fa-solid fa-gear"></i> API 设置
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主布局容器 -->
        <div class="flex-grow flex flex-col md:flex-row overflow-hidden h-[calc(100vh-4rem)]">

            <!-- 左侧：输入区域 -->
            <div class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-slate-200 flex flex-col h-full z-20">
                <div class="p-5 flex-grow overflow-y-auto space-y-6">

                    <!-- 1. 参考文案 -->
                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-copy text-[#ff2442]"></i> 参考文案 (模仿风格)
                        </label>
                        <textarea v-model="input.reference" rows="8" placeholder="粘贴一篇你觉得写得很好的小红书文案..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-red-500 focus:outline-none transition text-sm"></textarea>
                    </div>

                    <!-- 2. 新资料 -->
                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-file-lines text-[#ff2442]"></i> 新资料 (改写内容)
                        </label>
                        <textarea v-model="input.material" rows="8" placeholder="输入你想写的产品信息、新闻、故事梗概等..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-red-500 focus:outline-none transition text-sm"></textarea>
                    </div>

                    <!-- 操作按钮 -->
                    <button @click="generateRewrites" :disabled="isGenerating || !input.reference || !input.material"
                        class="w-full bg-[#ff2442] text-white font-bold py-3.5 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                        <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin"></i>
                        <span v-else>✨ 生成 4 篇改写文案</span>
                    </button>
                </div>

                <!-- 底部状态 -->
                <div class="p-4 bg-slate-50 border-t border-slate-200 text-xs text-slate-500 flex justify-between">
                    <span>{{ statusText }}</span>
                    <span v-if="apiConfig.deepseek" class="text-green-600 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> API Ready</span>
                    <span v-else class="text-red-500">未配置 API</span>
                </div>
            </div>

            <!-- 右侧：输出展示 -->
            <div class="flex-grow bg-[#fbfbfb] p-4 md:p-8 overflow-y-auto h-full relative">

                <!-- 空状态 -->
                <div v-if="results.length === 0 && !isGenerating"
                    class="h-full flex flex-col items-center justify-center text-slate-400 opacity-60">
                    <i class="fa-solid fa-pen-to-square text-6xl mb-4 text-slate-300"></i>
                    <p class="text-lg">输入参考文案和新资料，一键生成 4 种版本</p>
                </div>

                <!-- 结果展示 -->
                <div v-else class="max-w-6xl mx-auto h-full flex flex-col">
                    <div class="flex justify-between items-end mb-6">
                        <h2 class="text-2xl font-bold text-slate-800">改写结果</h2>
                        <div v-if="results.length > 0" class="flex gap-3">
                            <button @click="exportAll"
                                class="text-blue-600 text-sm font-medium hover:underline flex items-center gap-1">
                                <i class="fa-solid fa-download"></i> 导出全部
                            </button>
                        </div>
                    </div>

                    <!-- 4列布局 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 h-full pb-10">
                        <div v-for="(item, index) in displayResults" :key="index"
                            class="bg-white rounded-xl shadow-sm border border-slate-100 flex flex-col h-full overflow-hidden hover:shadow-md transition">

                            <!-- 标题栏 -->
                            <div class="p-3 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                <span class="font-bold text-slate-700">版本 {{ index + 1 }}</span>
                                <div class="flex gap-2">
                                    <button @click="copyContent(item)" class="text-slate-400 hover:text-[#ff2442]"
                                        title="复制">
                                        <i class="fa-solid fa-copy"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- 内容区 -->
                            <div
                                class="p-4 flex-grow overflow-y-auto bg-white text-sm leading-relaxed whitespace-pre-wrap font-sans text-slate-700 flex flex-col gap-4">
                                <!-- 思考过程 (仅 V4 Pro 模型) -->
                                <div v-if="item.reasoning"
                                    class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-500">
                                    <div
                                        class="font-bold mb-1 flex items-center gap-1 text-slate-400 uppercase tracking-wider">
                                        <i class="fa-solid fa-brain"></i> 深度思考
                                    </div>
                                    <div class="whitespace-pre-wrap font-mono opacity-80">{{ item.reasoning }}</div>
                                </div>

                                <!-- 正文内容 -->
                                <div v-if="item.isGenerating && !item.content && !item.reasoning"
                                    class="flex flex-col items-center justify-center py-10 text-slate-400 space-y-2">
                                    <i class="fa-solid fa-spinner fa-spin text-2xl text-[#ff2442]"></i>
                                    <span>正在撰写...</span>
                                </div>
                                <div v-else v-html="renderMarkdown(item.content)"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <h3 class="text-lg font-bold mb-4">API 配置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek"
                            class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-red-500 outline-none">
                        <p class="text-xs text-slate-500 mt-1">Key 会存储在本地，与其他 DeepWriter 应用共享。</p>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig"
                        class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">保存</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, reactive, onMounted, nextTick, computed } = Vue;

        createApp({
            setup() {

                // 状态
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '' });
                const model = ref('deepseek-v4-flash');
                const isGenerating = ref(false);
                const statusText = ref('准备就绪');

                // 输入
                const input = reactive({
                    reference: '',
                    material: ''
                });

                // 结果容器 (4个槽位)
                const results = ref([]);

                // 初始化
                onMounted(() => {
                    // 初始化 Lucide 图标
                    const savedConfig = localStorage.getItem('global_llm_config');
                    if (savedConfig) {
                        try {
                            apiConfig.value = { ...apiConfig.value, ...JSON.parse(savedConfig) };
                        } catch (e) {
                            console.error('解析 global_llm_config 失败:', e);
                        }
                    }

                    const savedInputs = localStorage.getItem('xhs_rewriter_inputs');
                    if (savedInputs) {
                        const parsed = JSON.parse(savedInputs);
                        input.reference = parsed.reference || '';
                        input.material = parsed.material || '';
                    }
                });

                // 自动保存输入
                Vue.watch(input, (newVal) => {
                    localStorage.setItem('xhs_rewriter_inputs', JSON.stringify(newVal));
                }, { deep: true });

                // 确保始终显示4个卡片（即使是空的或正在生成的）
                const displayResults = computed(() => {
                    const list = [...results.value];
                    // 如果正在生成且列表为空，填充4个占位符
                    if (isGenerating.value && list.length === 0) {
                        return Array(4).fill({ content: '', isGenerating: true });
                    }
                    // 如果生成完毕但不足4个（理论上不应该），也填充
                    while (list.length < 4 && list.length > 0) {
                        list.push({ content: '', isGenerating: false });
                    }
                    return list;
                });

                // 方法
                const saveConfig = () => {
                    apiConfig.value.deepseek = apiConfig.value.deepseek.trim();
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('解析 global_llm_config 失败:', e);
                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                const renderMarkdown = (text) => {
                    if (!text) return '';
                    return marked.parse(text);
                };

                // API 调用 (支持流式 & 推理)
                const callDeepSeek = async (prompt, onChunk, onReasoning) => {
                    const apiKey = (apiConfig.value.deepseek || '').trim();
                    if (!apiKey) throw new Error("API Key 为空");

                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: model.value,
                            messages: [
                                { "role": "system", "content": "You are a professional social media content creator." },
                                { "role": "user", "content": prompt }
                            ],
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error?.message || `API Error: ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.trim() === '') continue;
                            if (line.trim() === 'data: [DONE]') continue;
                            if (line.startsWith('data: ')) {
                                try {
                                    const json = JSON.parse(line.substring(6));
                                    const delta = json.choices[0].delta;

                                    // 处理思考过程 (reasoning_content)
                                    if (delta.reasoning_content && onReasoning) {
                                        onReasoning(delta.reasoning_content);
                                    }

                                    // 处理正文内容
                                    if (delta.content && onChunk) {
                                        onChunk(delta.content);
                                    }
                                } catch (e) {
                                    console.error("Stream parse error", e);
                                }
                            }
                        }
                    }
                };

                const generateRewrites = async () => {
                    if (!apiConfig.value.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isGenerating.value = true;
                    statusText.value = '正在并行撰写 4 个版本...';

                    // 初始化 4 个空结果槽位
                    results.value = Array(4).fill(0).map(() => ({
                        content: '',
                        reasoning: '',
                        isGenerating: true
                    }));

                    // 定义 4 个略有不同的 Prompt 侧重点，确保多样性
                    const variations = [
                        "侧重于【干货分享】，强调实用价值，语气专业。",
                        "侧重于【情感共鸣】，强调个人体验，语气亲切。",
                        "侧重于【痛点直击】，强调解决问题，语气犀利。",
                        "侧重于【好物种草】，强调产品亮点，语气热情。"
                    ];

                    const tasks = results.value.map((item, index) => {
                        const prompt = `
                            你是一个专业的小红书文案改写机器人。
                            
                            【任务目标】
                            请参考提供的【参考文案】的风格、语气、排版结构，将【新资料】改写成一篇全新的小红书文案。
                            
                            【差异化要求】
                            本篇文案请：${variations[index]}

                            【参考文案】
                            ${input.reference}

                            【新资料】
                            ${input.material}

                            【输出要求】
                            1. 必须包含：标题、正文、标签。
                            2. 严格模仿参考文案的排版（Emoji、换行）。
                            3. 直接输出 Markdown 格式的正文，不要包含任何解释性文字。
                        `;

                        return callDeepSeek(
                            prompt,
                            (chunk) => { item.content += chunk; },
                            (reasoning) => { item.reasoning += reasoning; }
                        ).then(() => {
                            item.isGenerating = false;
                        }).catch(e => {
                            item.content += `\n[生成出错: ${e.message}]`;
                            item.isGenerating = false;
                        });
                    });

                    try {
                        await Promise.all(tasks);
                        statusText.value = '所有版本改写完成';
                    } catch (e) {
                        console.error(e);
                        statusText.value = '生成过程中出现错误';
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyContent = (item) => {
                    if (!item.content) return;
                    navigator.clipboard.writeText(item.content).then(() => alert('已复制'));
                };

                const exportAll = () => {
                    let text = "";
                    results.value.forEach((item, idx) => {
                        text += `=== 版本 ${idx + 1} ===\n\n${item.content}\n\n-------------------\n\n`;
                    });
                    const blob = new Blob([text], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `改写文案_${new Date().toLocaleDateString()}.txt`;
                    a.click();
                };

                return {
                    showSettings, apiConfig, saveConfig, model,
                    input, results, displayResults,
                    isGenerating, statusText,
                    generateRewrites, copyContent, exportAll,
                    renderMarkdown
                };
            }
        }).mount('#app');
    </script>
