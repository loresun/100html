<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书封面布局草案生成器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --xhs-red: #ff2442;
            --xhs-bg: #fbfbfb;
        }

        body {
            background-color: var(--xhs-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.3s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">

        <!-- 顶部导航 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
                        <i class="fa-solid fa-layer-group text-[#ff2442] text-xl"></i>
                        <span class="font-bold text-xl tracking-tight text-slate-900">小红书封面布局生成器</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 bg-slate-100 rounded-lg p-1">
                            <button @click="model = 'deepseek-v4-flash'"
                                :class="{'bg-white shadow text-[#ff2442]': model === 'deepseek-v4-flash', 'text-slate-500': model !== 'deepseek-v4-flash'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Flash</button>
                            <button @click="model = 'deepseek-v4-pro'"
                                :class="{'bg-white shadow text-[#ff2442]': model === 'deepseek-v4-pro', 'text-slate-500': model !== 'deepseek-v4-pro'}"
                                class="px-3 py-1 text-xs font-medium rounded-md transition">V4 Pro</button>
                        </div>
                        <button @click="showSettings = true"
                            class="text-slate-500 hover:text-[#ff2442] transition flex items-center gap-1 text-sm font-medium">
                            <i class="fa-solid fa-gear text-xs"></i> API 设置
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主布局 -->
        <div class="flex-grow flex flex-col md:flex-row overflow-hidden h-[calc(100vh-4rem)]">

            <!-- 左侧输入区 -->
            <div class="w-full md:w-1/3 bg-white border-r border-slate-200 flex flex-col h-full z-20 shadow-xl">
                <div class="p-5 flex-grow overflow-y-auto space-y-6">
                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700">主题</label>
                        <input v-model="input.topic" type="text" placeholder="例如：通勤极简穿搭"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-red-500 focus:outline-none transition">
                    </div>

                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700">风格</label>
                        <select v-model="input.style"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none">
                            <option>简洁</option>
                            <option>潮流</option>
                            <option>笔记风</option>
                            <option>商业风</option>
                            <option>清新</option>
                            <option>酷飒</option>
                        </select>
                    </div>

                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700">关键词</label>
                        <textarea v-model="input.keywords" rows="3" placeholder="例如：显瘦、通勤、显高、百搭"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-red-500 focus:outline-none transition text-sm"></textarea>
                    </div>

                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700">目标受众</label>
                        <textarea v-model="input.audience" rows="2" placeholder="例如：25-35 岁职场女生，追求简约质感"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-red-500 focus:outline-none transition text-sm"></textarea>
                    </div>

                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-700">生成数量</label>
                        <select v-model="input.count"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none">
                            <option value="3">3 版</option>
                            <option value="4">4 版</option>
                            <option value="6">6 版</option>
                        </select>
                    </div>

                    <button @click="generateLayouts" :disabled="isGenerating || !input.topic"
                        class="w-full bg-[#ff2442] text-white font-bold py-3.5 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                        <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin w-5 h-5"></i>
                        <span v-else>✨ 生成布局草案</span>
                    </button>

                    <div class="text-xs text-center text-slate-400">
                        {{ statusText }}
                    </div>
                </div>
            </div>

            <!-- 右侧输出区 -->
            <div class="flex-grow bg-[#fbfbfb] p-4 md:p-8 overflow-y-auto h-full relative">
                <div v-if="layouts.length === 0 && !isGenerating"
                    class="h-full flex flex-col items-center justify-center text-slate-400 opacity-60">
                    <i class="fa-solid fa-table-columns w-24 h-24 mb-4 opacity-50"></i>
                    <p class="text-lg">输入主题，生成多版封面布局草案</p>
                </div>

                <div v-else class="max-w-5xl mx-auto">
                    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3 mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-800">多版封面布局草案</h2>
                            <p class="text-sm text-slate-500">标题区 + 副标题/卖点 + 主视觉提示</p>
                        </div>
                        <div class="flex gap-2">
                            <button @click="generateLayouts"
                                class="bg-[#ff2442] text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-sm">
                                <i class="fa-solid fa-arrows-rotate w-4 h-4"></i> 重新生成
                            </button>
                            <button v-if="layouts.length" @click="copyAll"
                                class="bg-white border border-slate-200 text-slate-600 hover:text-[#ff2442] px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-sm">
                                <i class="fa-solid fa-copy w-4 h-4"></i> 复制文案
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div v-for="(layout, idx) in layouts" :key="idx"
                            class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition">
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-xs font-semibold text-slate-400">方案 {{ idx + 1 }}</span>
                                <span class="text-xs text-slate-400">{{ input.style }}</span>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">标题区文案</p>
                                    <p class="text-lg font-bold text-slate-800">{{ layout.title }}</p>
                                </div>

                                <div>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">副标题 / 卖点区
                                    </p>
                                    <p class="text-sm text-slate-700" v-if="layout.subtitle">{{ layout.subtitle }}</p>
                                    <ul v-if="layout.selling_points && layout.selling_points.length"
                                        class="list-disc list-inside text-sm text-slate-600 mt-2 space-y-1">
                                        <li v-for="(point, pIdx) in layout.selling_points" :key="pIdx">{{ point }}</li>
                                    </ul>
                                </div>

                                <div>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">主视觉提示</p>
                                    <p class="text-sm text-slate-600 whitespace-pre-line">{{ layout.visual }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <h3 class="text-lg font-bold mb-4">API 配置</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek"
                            class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-red-500 outline-none">
                        <p class="text-xs text-slate-500 mt-1">Key 会存储在本地，与其他 DeepWriter 应用共享。</p>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig"
                        class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '' });
                const model = ref('deepseek-v4-flash');
                const isGenerating = ref(false);
                const statusText = ref('准备就绪');

                const input = reactive({
                    topic: '',
                    style: '简洁',
                    keywords: '',
                    audience: '',
                    count: '4'
                });

                const layouts = ref([]);

                onMounted(() => {
                    // 初始化图标已由 Font Awesome 自动处理
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        apiConfig.value = { ...apiConfig.value, ...parsed };
                    }
                });

                const saveConfig = () => {
                    apiConfig.value.deepseek = apiConfig.value.deepseek.trim();
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                const callDeepSeek = async (prompt) => {
                    const apiKey = (apiConfig.value.deepseek || '').trim();

                    if (!apiKey) {
                        throw new Error('API Key 为空，请在设置中配置');
                    }

                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: model.value,
                            messages: [
                                { role: 'system', content: 'You are a professional social media content creator.' },
                                { role: 'user', content: prompt }
                            ],
                            stream: false
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error?.message || `API 请求失败: ${response.status}`);
                    }

                    const data = await response.json();
                    return data.choices[0].message.content;
                };

                const generateLayouts = async () => {
                    if (!apiConfig.value.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isGenerating.value = true;
                    statusText.value = '正在生成布局草案...';
                    layouts.value = [];

                    const prompt = `
你是一个小红书封面布局策划专家。请根据以下信息，输出 ${input.count} 版不同封面布局草案：
主题：${input.topic}
风格：${input.style}
关键词：${input.keywords || '无'}
目标受众：${input.audience || '无'}

要求：
1. 每版需要包含「标题区文案」「副标题/卖点区文案」「主视觉提示」。
2. 主视觉提示必须包含人物/物品/图标/留白建议，并体现布局重心与视觉层级。
3. 标题区文案 4-10 字，强调情绪或利益点；副标题更具体，突出卖点。
4. 输出合法 JSON 数组，每个对象包含：
   - title: 标题区文案
   - subtitle: 副标题文案
   - selling_points: 卖点列表 (2-4 条)
   - visual: 主视觉提示 (包含人物/物品/图标/留白建议)

示例格式：
[
  {
    "title": "",
    "subtitle": "",
    "selling_points": ["", ""],
    "visual": ""
  }
]
                    `;

                    try {
                        const jsonStr = await callDeepSeek(prompt);
                        const cleanJson = jsonStr.replace(/```json|```/g, '').trim();
                        const results = JSON.parse(cleanJson);
                        layouts.value = results;
                        statusText.value = `成功生成 ${layouts.value.length} 版布局草案`;
                    } catch (e) {
                        console.error(e);
                        alert(`生成失败: ${e.message}`);
                        statusText.value = '生成失败';
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyAll = () => {
                    if (!layouts.value.length) return;
                    const text = layouts.value
                        .map((layout, index) => {
                            const points = (layout.selling_points || []).map(point => `- ${point}`).join('\n');
                            return `方案 ${index + 1}\n标题区：${layout.title}\n副标题：${layout.subtitle}\n卖点：\n${points}\n主视觉提示：${layout.visual}`;
                        })
                        .join('\n\n');
                    navigator.clipboard.writeText(text).then(() => alert('已复制'));
                };

                return {
                    showSettings,
                    apiConfig,
                    model,
                    isGenerating,
                    statusText,
                    input,
                    layouts,
                    saveConfig,
                    generateLayouts,
                    copyAll
                };
            }
        }).mount('#app');
    </script>

</html>
