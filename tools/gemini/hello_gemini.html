    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Gemini - 基础调用示例</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- Header -->
        <div class="bg-indigo-600 px-6 py-4 flex items-center justify-between">
            <h1 class="text-white font-bold text-lg flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Hello Gemini
            </h1>
            <a href="index.html" class="text-indigo-200 hover:text-white text-sm transition">返回列表</a>
        </div>

        <div class="p-6 space-y-6">
            <!-- API Key Input -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">API Key (Google AI Studio)</label>
                <input type="password" id="apiKey" placeholder="输入你的 Gemini API Key..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                <p class="text-xs text-slate-500 mt-1">Key 仅存储在本地浏览器中，不会发送到服务器。</p>
            </div>

            <!-- Prompt Input -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">提示词 (Prompt)</label>
                <textarea id="prompt" rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm resize-none" placeholder="输入你想对 Gemini 说的话...">Explain how AI works in one sentence.</textarea>
            </div>

            <!-- Action Button -->
            <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-all shadow-md active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <span>发送请求</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>

            <!-- Result Area -->
            <div id="resultContainer" class="hidden">
                <label class="block text-sm font-medium text-slate-700 mb-1">API 响应结果</label>
                <div class="bg-slate-900 text-slate-200 p-4 rounded-lg font-mono text-sm overflow-auto max-h-60 relative group">
                    <pre id="resultOutput" class="whitespace-pre-wrap theme-dark"></pre>
                    <button id="copyBtn" class="absolute top-2 right-2 p-1.5 bg-white/10 hover:bg-white/20 rounded text-white opacity-0 group-hover:opacity-100 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white px-4 py-2 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        Copied to clipboard!
    </div>

<script>
    const apiKeyInput = document.getElementById('apiKey');
    const promptInput = document.getElementById('prompt');
    const generateBtn = document.getElementById('generateBtn');
    const resultContainer = document.getElementById('resultContainer');
    const resultOutput = document.getElementById('resultOutput');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');

    // Load saved Key
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) apiKeyInput.value = savedKey;

    // Save Key on change
    apiKeyInput.addEventListener('input', () => {
        localStorage.setItem('gemini_api_key', apiKeyInput.value);
    });

    generateBtn.addEventListener('click', async () => {
        const key = apiKeyInput.value.trim();
        const text = promptInput.value.trim();

        if (!key) {
            showToast('请先输入 API Key');
            return;
        }
        if (!text) {
            showToast('请输入提示词');
            return;
        }

        // UI Loading State
        generateBtn.disabled = true;
        generateBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Generating...`;
        resultContainer.classList.add('hidden');
        resultOutput.textContent = '';

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${key}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: text
                        }]
                    }]
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || 'API request failed');
            }

            const data = await response.json();
            const outputText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No content generated.';
            
            resultOutput.textContent = outputText;
            resultContainer.classList.remove('hidden');

        } catch (error) {
            resultOutput.textContent = `Error: ${error.message}`;
            resultContainer.classList.remove('hidden');
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerHTML = `<span>发送请求</span><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>`;
        }
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(resultOutput.textContent).then(() => {
            showToast('已复制到剪贴板');
        });
    });

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0');
        }, 2000);
    }
</script>

</html>
