  <meta charset="utf-8" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background-color: #fcfaff; }
    .category-section { margin-bottom: 4rem; opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
    .category-section.visible { opacity: 1; transform: translateY(0); }
    .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(226, 232, 240, 0.8); }
    .card:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.1), 0 10px 10px -5px rgba(139, 92, 246, 0.04); 
      border-color: rgba(139, 92, 246, 0.3);
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #ddd6fe; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #c4b5fd; }

    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .vibe-badge {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
      border: 1px solid rgba(139, 92, 246, 0.2);
    }
  </style>

<body class="text-slate-800 antialiased p-6 md:p-12 min-h-screen">

<nav class="max-w-7xl mx-auto mb-4">
  <a href="../../index.html" class="inline-flex items-center text-slate-500 hover:text-violet-600 transition-all font-medium group">
    <div class="p-2 rounded-lg bg-white shadow-sm border border-slate-100 mr-3 group-hover:border-violet-200 group-hover:shadow-md transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    </div>
    返回主页
  </a>
</nav>

<header class="max-w-7xl mx-auto mb-16 text-center pt-4">
  <div class="inline-block mb-3 px-4 py-1.5 vibe-badge text-violet-600 rounded-full text-xs font-bold tracking-widest uppercase">Vibe Coding Station</div>
  <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900 mb-6">✨ <span class="gradient-text">Vibe Coding</span> 工具站</h1>
  <p class="text-lg md:text-xl text-slate-600 max-w-2xl mx-auto leading-relaxed" id="site-description">
    Loading description...
  </p>
</header>

<main class="max-w-7xl mx-auto space-y-16" id="app-container">
  <!-- Content will be injected here -->
  <div class="flex justify-center items-center h-64">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-violet-600"></div>
  </div>
</main>

<footer class="max-w-7xl mx-auto mt-24 py-12 border-t border-slate-200 text-center text-slate-400 text-sm">
  <p class="mb-2">© 2026 Vibe Coding Station. Built with ✨ and AI.</p>
  <p>让创意像呼吸一样自然发生</p>
</footer>

<script>
  // Icon Registry
  const icons = {
    cpu: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>',
    bot: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c.6 0 1.2.5 1.2 1.1v2.8h-2.4V3.1c0-.6.6-1.1 1.2-1.1Z"></path><path d="M7 7h10a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"></path><path d="M9 13v2"></path><path d="M15 13v2"></path></svg>',
    code: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>',
    terminal: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>',
    plug: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v5M9 2v5M15 2v5M20 8v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2zM12 16v5"></path></svg>',
    sparkles: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4M3 5h4M19 17v4M17 19h4"></path></svg>',
    zap: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
    box: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>',
    default: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>'
  };

  // Color Mapping for styling
  const colors = {
    indigo: { bg: 'bg-indigo-100', text: 'text-indigo-600', tagBg: 'bg-indigo-50', tagText: 'text-indigo-500', groupHover: 'group-hover:text-indigo-600' },
    blue: { bg: 'bg-blue-100', text: 'text-blue-600', tagBg: 'bg-blue-50', tagText: 'text-blue-500', groupHover: 'group-hover:text-blue-600' },
    emerald: { bg: 'bg-emerald-100', text: 'text-emerald-600', tagBg: 'bg-emerald-50', tagText: 'text-emerald-500', groupHover: 'group-hover:text-emerald-600' },
    fuchsia: { bg: 'bg-fuchsia-100', text: 'text-fuchsia-600', tagBg: 'bg-fuchsia-50', tagText: 'text-fuchsia-500', groupHover: 'group-hover:text-fuchsia-600' },
    pink: { bg: 'bg-pink-100', text: 'text-pink-600', tagBg: 'bg-pink-50', tagText: 'text-pink-500', groupHover: 'group-hover:text-pink-600' },
    orange: { bg: 'bg-orange-100', text: 'text-orange-600', tagBg: 'bg-orange-50', tagText: 'text-orange-500', groupHover: 'group-hover:text-orange-600' },
    violet: { bg: 'bg-violet-100', text: 'text-violet-600', tagBg: 'bg-violet-50', tagText: 'text-violet-500', groupHover: 'group-hover:text-violet-600' },
    default: { bg: 'bg-slate-100', text: 'text-slate-600', tagBg: 'bg-slate-50', tagText: 'text-slate-500', groupHover: 'group-hover:text-slate-800' }
  };

  function getIcon(name) {
    return icons[name] || icons['default'];
  }

  function getColorById(id) {
    return colors[id] || colors['default'];
  }

  async function init() {
    const container = document.getElementById('app-container');
    // Ensure loading spinner is visible
    container.innerHTML = `
      <div class="flex justify-center items-center h-64">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-violet-600"></div>
      </div>
    `;

    try {
      const response = await fetch('./ai_navigation_data.json');
      if (!response.ok) throw new Error(`数据加载失败: ${response.status}`);
      const data = await response.json();
      
      render(data);
    } catch (error) {
      console.error('Error:', error);
      container.innerHTML = `
        <div class="text-center p-8 bg-red-50 rounded-xl border border-red-100 animate-fade-in">
          <p class="text-red-600 font-medium">哎呀，数据加载失败了。<br>请检查 ai_navigation_data.json 文件是否存在且格式正确。</p>
          <p class="text-xs text-slate-400 mt-2">${error.message}</p>
        </div>
      `;
    }
  }

  function render(data) {
    // Set Description
    document.getElementById('site-description').textContent = data.description;
    
    const container = document.getElementById('app-container');
    container.innerHTML = '';

    data.categories.forEach((category, index) => {
      const colorScheme = getColorById(category.color) || colors.default;
      const section = document.createElement('section');
      section.className = 'category-section';
      section.style.transitionDelay = `${index * 100}ms`; // Stagger animation

      const iconSvg = getIcon(category.icon);

      let cardsHtml = '';
      category.items.forEach(item => {
        cardsHtml += `
          <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="card bg-white p-6 rounded-xl shadow-sm block group relative overflow-hidden">
            <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-br from-transparent to-slate-50 rounded-bl-full -mr-8 -mt-8 transition-all group-hover:to-${category.color}-50"></div>
            
            <h3 class="font-bold text-lg text-slate-900 mb-1 ${colorScheme.groupHover} transition-colors relative z-10">
              ${item.name}
            </h3>
            
            <p class="text-sm text-slate-500 mb-4 h-5 relative z-10">${item.tag ? `<span class="${colorScheme.tagText} ${colorScheme.tagBg} px-2 py-0.5 rounded textxs font-medium">${item.tag}</span>` : ''}</p>
            
            <p class="text-sm text-slate-600 leading-relaxed relative z-10">
              ${item.description}
            </p>
            
            <div class="mt-4 flex items-center text-xs font-medium text-slate-400 group-hover:text-slate-600 transition-colors">
              <span>Visit Site</span>
              <svg class="w-3 h-3 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
            </div>
          </a>
        `;
      });

      section.innerHTML = `
        <div class="flex items-center gap-4 mb-8 border-b border-slate-200 pb-4">
          <div class="p-3 ${colorScheme.bg} rounded-xl ${colorScheme.text} shadow-sm">
            ${iconSvg}
          </div>
          <div>
            <h2 class="text-2xl font-bold text-slate-900">${category.name}</h2>
            <p class="text-slate-500 text-sm mt-1">${category.description}</p>
          </div>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          ${cardsHtml}
        </div>
      `;

      container.appendChild(section);
      
      // Trigger animation after append
      requestAnimationFrame(() => {
        section.classList.add('visible');
      });
    });
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', init);

</script>

</html>
