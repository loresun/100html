<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid 布局演示 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .grid-cell { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .custom-input { width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.25rem; padding: 0.5rem; font-size: 0.875rem; font-family: monospace; outline: none; transition: background-color 0.2s, border-color 0.2s; }
        .custom-input:focus { border-color: #8b5cf6; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-violet-50 min-h-screen font-sans text-slate-800" x-data="gridApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-violet-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-violet-50 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left w-5 h-5"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-600 to-fuchsia-600">
                ▦ CSS Grid 布局演示
            </h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 pb-24 grid grid-cols-1 lg:grid-cols-12 gap-6 h-[calc(100vh-64px)] min-h-[600px]">

        <!-- Sidebar Controls -->
        <div class="lg:col-span-4 space-y-4 overflow-y-auto pr-2 custom-scrollbar">
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-violet-100">
                <h3 class="font-bold text-slate-700 mb-4 text-sm uppercase flex items-center gap-2">
                    <i class="fa-solid fa-border-all w-4 h-4 text-violet-500"></i>
                    网格容器 (Container)
                </h3>
                
                <div class="space-y-4">
                    <!-- Columns -->
                    <div>
                        <div class="flex justify-between mb-1">
                             <label class="text-xs font-bold text-slate-400 block">Columns (列)</label>
                             <button @click="config.cols = '1fr 1fr 1fr'" class="text-[10px] text-violet-500 hover:underline">Reset</button>
                        </div>
                        <input type="text" x-model="config.cols" class="custom-input" placeholder="e.g. 1fr 200px 1fr">
                        <div class="flex gap-2 mt-2">
                             <button @click="config.cols += ' 1fr'" class="px-2 py-1 bg-violet-50 text-violet-600 rounded text-xs font-bold hover:bg-violet-100">+ 1fr</button>
                             <button @click="config.cols += ' 100px'" class="px-2 py-1 bg-violet-50 text-violet-600 rounded text-xs font-bold hover:bg-violet-100">+ px</button>
                        </div>
                    </div>

                    <!-- Rows -->
                    <div>
                        <div class="flex justify-between mb-1">
                             <label class="text-xs font-bold text-slate-400 block">Rows (行)</label>
                             <button @click="config.rows = '1fr 1fr 1fr'" class="text-[10px] text-violet-500 hover:underline">Reset</button>
                        </div>
                        <input type="text" x-model="config.rows" class="custom-input" placeholder="e.g. 100px auto 100px">
                        <div class="flex gap-2 mt-2">
                             <button @click="config.rows += ' 1fr'" class="px-2 py-1 bg-violet-50 text-violet-600 rounded text-xs font-bold hover:bg-violet-100">+ 1fr</button>
                             <button @click="config.rows += ' 100px'" class="px-2 py-1 bg-violet-50 text-violet-600 rounded text-xs font-bold hover:bg-violet-100">+ px</button>
                        </div>
                    </div>

                    <!-- Gap -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-slate-400 block mb-1">Gap (间距)</label>
                            <input type="text" x-model="config.gap" class="custom-input" placeholder="10px">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 block mb-1">Items</label>
                            <div class="flex items-center gap-2 h-[38px]">
                                <button @click="addItem()" class="flex-1 h-full bg-violet-600 hover:bg-violet-700 text-white rounded font-bold text-xl flex items-center justify-center transition-colors">+</button>
                                <button @click="removeItem()" class="flex-1 h-full bg-slate-200 hover:bg-rose-100 text-slate-500 hover:text-rose-500 rounded font-bold text-xl flex items-center justify-center transition-colors">-</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Alignment -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-violet-100">
                <h3 class="font-bold text-slate-700 mb-4 text-sm uppercase flex items-center gap-2">
                    <i class="fa-solid fa-align-center w-4 h-4 text-violet-500"></i>
                    对齐 (Alignment)
                </h3>
                 <div class="grid grid-cols-2 gap-4">
                     <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">Justify Items</label>
                        <select x-model="config.justifyItems" class="custom-input">
                            <option value="stretch">stretch</option>
                            <option value="start">start</option>
                            <option value="end">end</option>
                            <option value="center">center</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">Align Items</label>
                        <select x-model="config.alignItems" class="custom-input">
                            <option value="stretch">stretch</option>
                            <option value="start">start</option>
                            <option value="end">end</option>
                            <option value="center">center</option>
                        </select>
                    </div>
                 </div>
            </div>
            
             <div class="bg-slate-900 text-white p-5 rounded-2xl shadow-lg font-mono text-xs leading-relaxed overflow-x-auto">
                 <div class="text-violet-400 mb-2">// CSS Code</div>
                 <div>.container {</div>
                 <div class="pl-4 text-fuchsia-400">display: grid;</div>
                 <div class="pl-4">grid-template-columns: <span class="text-orange-300" x-text="config.cols"></span>;</div>
                 <div class="pl-4">grid-template-rows: <span class="text-orange-300" x-text="config.rows"></span>;</div>
                 <div class="pl-4">gap: <span class="text-orange-300" x-text="config.gap"></span>;</div>
                 <div class="pl-4" x-show="config.justifyItems !== 'stretch'">justify-items: <span class="text-orange-300" x-text="config.justifyItems"></span>;</div>
                 <div class="pl-4" x-show="config.alignItems !== 'stretch'">align-items: <span class="text-orange-300" x-text="config.alignItems"></span>;</div>
                 <div>}</div>
             </div>

        </div>

        <!-- Preview Area -->
        <div class="lg:col-span-8 bg-white rounded-3xl shadow-xl shadow-violet-900/5 border border-violet-100 flex flex-col relative overflow-hidden">
             
             <!-- Playground -->
            <div class="flex-1 p-8 bg-slate-50 overflow-auto">
                <div class="w-full h-full min-h-[400px] border border-violet-200 bg-white shadow-inner rounded-xl transition-all duration-300 grid"
                     :style="containerStyle">
                    
                    <template x-for="(item, index) in items" :key="item.id">
                        <div class="grid-cell rounded-lg shadow-sm border border-black/5 cursor-pointer select-none text-white font-bold text-xl flex items-center justify-center relative group hover:ring-2 ring-violet-400 z-10"
                             :style="itemStyle(item)"
                             @click="activeItemId = item.id">
                             
                             <span x-text="index + 1" class="drop-shadow-md"></span>
                             
                             <!-- Active Indicator -->
                             <div class="absolute inset-0 border-4 border-white rounded-lg opacity-30" x-show="activeItemId === item.id"></div>
                        </div>
                    </template>
                    
                    <!-- Grid Lines Overlay (Visual Only - Simplified) -->
                    <!-- In a real complex app you'd draw dynamic lines, here we rely on the gap to show separation -->

                </div>
            </div>
            
            <!-- Item Config (Bottom Sheet) -->
            <div class="bg-violet-900/95 backdrop-blur text-white p-4 transition-transform duration-300"
                 :class="activeItemId ? 'translate-y-0' : 'translate-y-full absolute bottom-0 w-full'">
                 
                 <div class="flex justify-between items-center mb-4">
                     <h4 class="font-bold flex items-center gap-2">
                         <span class="w-6 h-6 rounded bg-white text-violet-900 flex items-center justify-center text-xs" x-text="items.findIndex(i => i.id === activeItemId) + 1"></span>
                         Item Placement (Grid Area)
                     </h4>
                     <button @click="activeItemId = null" class="p-1 hover:bg-white/10 rounded-lg">
                         <i class="fa-solid fa-xmark w-5 h-5"></i>
                     </button>
                 </div>
                 
                 <div class="grid grid-cols-2 md:grid-cols-4 gap-4" x-data="{ get activeItem() { return items.find(i => i.id === activeItemId) || {} } }">
                     <div>
                         <label class="text-[10px] text-violet-300 uppercase block mb-1">Col Start</label>
                         <input type="text" x-model="activeItem.colStart" class="bg-violet-800 border border-violet-700 rounded p-1.5 w-full text-sm text-center">
                     </div>
                     <div>
                         <label class="text-[10px] text-violet-300 uppercase block mb-1">Col End</label>
                         <input type="text" x-model="activeItem.colEnd" class="bg-violet-800 border border-violet-700 rounded p-1.5 w-full text-sm text-center">
                     </div>
                     <div>
                         <label class="text-[10px] text-violet-300 uppercase block mb-1">Row Start</label>
                         <input type="text" x-model="activeItem.rowStart" class="bg-violet-800 border border-violet-700 rounded p-1.5 w-full text-sm text-center">
                     </div>
                     <div>
                         <label class="text-[10px] text-violet-300 uppercase block mb-1">Row End</label>
                         <input type="text" x-model="activeItem.rowEnd" class="bg-violet-800 border border-violet-700 rounded p-1.5 w-full text-sm text-center">
                     </div>
                 </div>
                 <div class="mt-2 text-[10px] text-violet-300 text-center">
                     Tip: Use 'span 2' to span multiple tracks, or numbers like '1', '2', '-1'.
                 </div>
            </div>

        </div>

    </main>

    <script>
        function gridApp() {
            return {
                config: {
                    cols: '1fr 1fr 1fr',
                    rows: '1fr 1fr 1fr',
                    gap: '12px',
                    justifyItems: 'stretch',
                    alignItems: 'stretch'
                },
                items: [],
                activeItemId: null,
                colors: ['#a78bfa', '#f472b6', '#34d399', '#fbbf24', '#60a5fa', '#f87171'],

                init() {
                    // Initialize with 6 items
                    for(let i=0; i<6; i++) this.addItem();
                },

                addItem() {
                    this.items.push({
                        id: Date.now(),
                        colStart: 'auto',
                        colEnd: 'auto',
                        rowStart: 'auto',
                        rowEnd: 'auto',
                        color: this.colors[this.items.length % this.colors.length]
                    });
                },

                removeItem() {
                    if (this.items.length > 1) {
                        if (this.activeItemId === this.items[this.items.length - 1].id) {
                            this.activeItemId = null;
                        }
                        this.items.pop();
                    }
                },
                
                get containerStyle() {
                    return `
                        grid-template-columns: ${this.config.cols};
                        grid-template-rows: ${this.config.rows};
                        gap: ${this.config.gap};
                        justify-items: ${this.config.justifyItems};
                        align-items: ${this.config.alignItems};
                    `;
                },
                
                itemStyle(item) {
                    return `
                        background-color: ${item.color};
                        grid-column-start: ${item.colStart};
                        grid-column-end: ${item.colEnd};
                        grid-row-start: ${item.rowStart};
                        grid-row-end: ${item.rowEnd};
                    `;
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_grid_playground.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
