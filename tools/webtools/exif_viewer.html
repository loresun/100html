<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exif 信息查看器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .data-row:nth-child(even) { background-color: #f8fafc; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-cyan-50 min-h-screen font-sans text-slate-800" x-data="exifApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-cyan-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-cyan-50 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left w-5 h-5"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-600 to-blue-600">
                📷 Exif 信息查看器
            </h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-24">

        <!-- Upload Area -->
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-cyan-100 text-center mb-8 transition-colors hover:border-cyan-300 relative group">
            <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept="image/jpeg,image/tiff" @change="loadExif($event)">
            <div class="flex flex-col items-center justify-center space-y-4">
                <div class="w-16 h-16 bg-cyan-50 text-cyan-500 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-camera w-8 h-8"></i>
                </div>
                <div>
                    <h3 class="font-bold text-lg text-slate-700">点击或拖拽上传图片</h3>
                    <p class="text-sm text-slate-400">支持 JPG/TIFF 格式，本地处理不上传服务器</p>
                </div>
            </div>
        </div>

        <!-- Result Area -->
        <div x-show="hasData" x-transition>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <!-- Thumbnail -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-cyan-100 flex items-center justify-center bg-slate-50">
                     <img :src="imageSrc" class="max-w-full max-h-64 rounded shadow-sm object-contain">
                </div>
                
                <!-- Key Stats -->
                <div class="md:col-span-2 grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-cyan-50">
                        <div class="text-xs text-slate-400 font-bold uppercase mb-1">相机型号</div>
                        <div class="text-lg font-bold text-slate-800 break-all" x-text="tags.Model || '未知'"></div>
                        <div class="text-xs text-cyan-600" x-text="tags.Make || ''"></div>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-cyan-50">
                        <div class="text-xs text-slate-400 font-bold uppercase mb-1">拍摄时间</div>
                        <div class="text-lg font-bold text-slate-800" x-text="tags.DateTimeOriginal || tags.DateTime || '未知'"></div>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-cyan-50">
                         <div class="text-xs text-slate-400 font-bold uppercase mb-1">镜头参数</div>
                         <div class="text-lg font-bold text-slate-800">
                             <span x-show="tags.FocalLength" x-text="Math.round(tags.FocalLength) + 'mm'"></span>
                             <span x-show="tags.FNumber" x-text="'f/' + tags.FNumber"></span>
                         </div>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-cyan-50">
                         <div class="text-xs text-slate-400 font-bold uppercase mb-1">曝光组合</div>
                         <div class="text-lg font-bold text-slate-800">
                             <span x-show="tags.ExposureTime" x-text="formatExposureTime(tags.ExposureTime)"></span>
                             <span x-show="tags.ISOSpeedRatings" x-text="'ISO ' + tags.ISOSpeedRatings"></span>
                         </div>
                    </div>
                </div>
            </div>

            <!-- Full Data Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-cyan-100 overflow-hidden">
                <div class="px-6 py-4 bg-cyan-50/50 border-b border-cyan-100 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-list w-4 h-4 text-cyan-500"></i>
                        完整 Exif 数据
                    </h3>
                    <button @click="copyAll()" class="text-xs font-bold text-cyan-600 hover:underline">复制 JSON</button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                            <tr>
                                <th class="px-6 py-3 w-1/3">标签名 (Tag)</th>
                                <th class="px-6 py-3">值 (Value)</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="(value, key) in filteredTags" :key="key">
                                <tr class="data-row hover:bg-cyan-50/30 transition-colors">
                                    <td class="px-6 py-3 font-mono text-slate-500" x-text="key"></td>
                                    <td class="px-6 py-3 text-slate-800 break-all" x-text="formatValue(value)"></td>
                                </tr>
                            </template>
                             <tr x-show="Object.keys(filteredTags).length === 0">
                                <td colspan="2" class="px-6 py-8 text-center text-slate-400">
                                    该图片似乎不包含 Exif 信息，或已被抹除。
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- GPS Map Link (if available) -->
            <div x-show="gpsUrl" class="mt-6 text-center">
                <a :href="gpsUrl" target="_blank" class="inline-flex items-center gap-2 px-6 py-3 bg-cyan-600 hover:bg-cyan-700 text-white rounded-full font-bold shadow-lg transition-transform active:scale-95">
                    <i class="fa-solid fa-map-pin w-4 h-4"></i>
                    在地图中查看位置
                </a>
            </div>

        </div>

    </main>

    <script>
        function exifApp() {
            return {
                hasData: false,
                imageSrc: '',
                tags: {},
                gpsUrl: '',

                init() {
                },

                loadExif(e) {
                    const file = e.target.files[0];
                    if(!file) return;

                    // Display Image Preview
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        this.imageSrc = ev.target.result;
                    };
                    reader.readAsDataURL(file);

                    // Parse Exif
                    const component = this;
                    EXIF.getData(file, function() {
                        const allTags = EXIF.getAllTags(this);
                        component.tags = allTags || {};
                        component.hasData = true;
                        component.calculateGPS(allTags);
                        
                        // Force alpine update if needed for nested objects weirdness
                        component.tags = { ...component.tags }; 
                    });
                },
                
                get filteredTags() {
                    // Filter out huge binary data like thumbnail
                    const ignored = ['MakerNote', 'UserComment', 'thumbnail'];
                    const res = {};
                    for(let k in this.tags) {
                        if(!ignored.includes(k) && this.tags[k] !== undefined) {
                            res[k] = this.tags[k];
                        }
                    }
                    return res;
                },

                formatExposureTime(t) {
                    if(!t) return '';
                    if (t >= 1) return t + 's';
                    return '1/' + Math.round(1/t) + 's';
                },
                
                formatValue(v) {
                    if(typeof v === 'object') {
                        if(v instanceof Number) return v.toString();
                        // Arrays:
                        if(Array.isArray(v)) return `[${v.join(', ')}]`;
                        return JSON.stringify(v);
                    }
                    return v;
                },
                
                calculateGPS(tags) {
                    this.gpsUrl = '';
                    if (tags.GPSLatitude && tags.GPSLongitude) {
                        const latRef = tags.GPSLatitudeRef || 'N';
                        const lonRef = tags.GPSLongitudeRef || 'E';
                        
                        const latDeg = tags.GPSLatitude[0] + tags.GPSLatitude[1]/60 + tags.GPSLatitude[2]/3600;
                        const lonDeg = tags.GPSLongitude[0] + tags.GPSLongitude[1]/60 + tags.GPSLongitude[2]/3600;
                        
                        const lat = (latRef === 'N' ? 1 : -1) * latDeg;
                        const lon = (lonRef === 'E' ? 1 : -1) * lonDeg;
                        
                        this.gpsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                    }
                },
                
                copyAll() {
                    navigator.clipboard.writeText(JSON.stringify(this.tags, null, 2)).then(() => {
                        alert('已复制所有 Exif 数据');
                    });
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_exif_viewer.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
