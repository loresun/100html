<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预算分配器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" x-data="budgetApp()" x-init="init()">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold text-slate-800">💰 预算分配器</h1>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Income Input -->
        <div class="bg-gradient-to-r from-emerald-500 to-teal-500 rounded-2xl p-8 text-white mb-8 shadow-lg">
            <div class="text-center">
                <div class="text-sm opacity-80 mb-2">月收入</div>
                <div class="flex items-center justify-center gap-2">
                    <span class="text-2xl">¥</span>
                    <input 
                        type="number" 
                        x-model.number="income"
                        @input="calculate()"
                        placeholder="0"
                        class="bg-white/20 backdrop-blur-sm border-2 border-white/30 rounded-lg px-4 py-2 text-4xl font-bold text-center outline-none w-64"
                    />
                </div>
            </div>
        </div>

        <!-- Budget Categories -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <h3 class="text-lg font-bold text-slate-800 mb-4">预算分配 (50/30/20 法则)</h3>
            
            <div class="space-y-4">
                <template x-for="category in categories" :key="category.id">
                    <div class="border border-slate-200 rounded-xl p-4">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-2xl" x-text="category.icon"></span>
                                    <h4 class="font-bold text-slate-800" x-text="category.name"></h4>
                                </div>
                                <p class="text-sm text-slate-600" x-text="category.desc"></p>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-bold text-slate-800">
                                    ¥<span x-text="category.amount.toLocaleString()"></span>
                                </div>
                                <div class="text-sm text-slate-500" x-text="category.percent + '%'"></div>
                            </div>
                        </div>

                        <!-- Slider -->
                        <div class="flex items-center gap-3">
                            <input 
                                type="range" 
                                x-model.number="category.percent"
                                @input="updateCategory(category)"
                                min="0" 
                                max="100" 
                                class="flex-1"
                            />
                            <input 
                                type="number" 
                                x-model.number="category.percent"
                                @input="updateCategory(category)"
                                min="0" 
                                max="100"
                                class="w-16 px-2 py-1 border border-slate-200 rounded text-sm text-center"
                            />
                        </div>

                        <!-- Progress Bar -->
                        <div class="mt-3 w-full bg-slate-200 rounded-full h-2">
                            <div 
                                class="h-2 rounded-full transition-all"
                                :class="category.color"
                                :style="'width: ' + category.percent + '%'"
                            ></div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Total Check -->
            <div class="mt-6 p-4 rounded-lg" :class="totalPercent === 100 ? 'bg-emerald-50 border border-emerald-200' : 'bg-amber-50 border border-amber-200'">
                <div class="flex items-center justify-between">
                    <span class="font-medium" :class="totalPercent === 100 ? 'text-emerald-700' : 'text-amber-700'">
                        总计分配比例
                    </span>
                    <span class="text-2xl font-bold" :class="totalPercent === 100 ? 'text-emerald-700' : 'text-amber-700'">
                        <span x-text="totalPercent"></span>%
                    </span>
                </div>
                <div x-show="totalPercent !== 100" class="text-sm mt-2" :class="totalPercent === 100 ? 'text-emerald-600' : 'text-amber-600'">
                    <template x-if="totalPercent < 100">
                        <span>还有 <span x-text="100 - totalPercent"></span>% 未分配</span>
                    </template>
                    <template x-if="totalPercent > 100">
                        <span>超出 <span x-text="totalPercent - 100"></span>%</span>
                    </template>
                </div>
            </div>
        </div>

        <!-- Chart -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <h3 class="text-lg font-bold text-slate-800 mb-4">可视化分配</h3>
            <canvas id="budgetChart" class="max-h-64"></canvas>
        </div>

        <!-- Templates -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">预设方案</h3>
            
            <div class="grid md:grid-cols-3 gap-3">
                <button @click="loadTemplate('503020')" class="p-4 bg-slate-50 hover:bg-slate-100 rounded-lg text-left transition-colors">
                    <div class="font-medium text-slate-800 mb-1">50/30/20 法则</div>
                    <div class="text-xs text-slate-600">必需 50% | 娱乐 30% | 储蓄 20%</div>
                </button>
                <button @click="loadTemplate('balanced')" class="p-4 bg-slate-50 hover:bg-slate-100 rounded-lg text-left transition-colors">
                    <div class="font-medium text-slate-800 mb-1">均衡分配</div>
                    <div class="text-xs text-slate-600">各类别平均分配</div>
                </button>
                <button @click="loadTemplate('aggressive')" class="p-4 bg-slate-50 hover:bg-slate-100 rounded-lg text-left transition-colors">
                    <div class="font-medium text-slate-800 mb-1">激进储蓄</div>
                    <div class="text-xs text-slate-600">必需 40% | 娱乐 20% | 储蓄 40%</div>
                </button>
            </div>
        </div>
    </main>

    <script>
        function budgetApp() {
            return {
                income: 10000,
                chart: null,
                categories: [
                    { id: 'needs', name: '必需支出', desc: '房租、水电、食物等', icon: '🏠', percent: 50, amount: 0, color: 'bg-blue-500' },
                    { id: 'wants', name: '娱乐消费', desc: '购物、旅游、娱乐等', icon: '🎉', percent: 30, amount: 0, color: 'bg-purple-500' },
                    { id: 'savings', name: '储蓄投资', desc: '存款、理财、投资等', icon: '💎', percent: 20, amount: 0, color: 'bg-emerald-500' }
                ],

                init() {
                    this.calculate();
                    this.$watch('categories', () => {
                        this.renderChart();
                    }, { deep: true });
                    this.$nextTick(() => {
                        this.renderChart();
                    });
                },

                calculate() {
                    this.categories.forEach(cat => {
                        cat.amount = (this.income * cat.percent) / 100;
                    });
                    this.renderChart();
                },

                updateCategory(category) {
                    category.amount = (this.income * category.percent) / 100;
                    this.renderChart();
                },

                loadTemplate(type) {
                    if (type === '503020') {
                        this.categories[0].percent = 50;
                        this.categories[1].percent = 30;
                        this.categories[2].percent = 20;
                    } else if (type === 'balanced') {
                        const each = Math.floor(100 / this.categories.length);
                        this.categories.forEach(cat => cat.percent = each);
                    } else if (type === 'aggressive') {
                        this.categories[0].percent = 40;
                        this.categories[1].percent = 20;
                        this.categories[2].percent = 40;
                    }
                    this.calculate();
                },

                renderChart() {
                    const canvas = document.getElementById('budgetChart');
                    if (!canvas) return;

                    if (this.chart) {
                        this.chart.destroy();
                    }

                    this.chart = new Chart(canvas, {
                        type: 'doughnut',
                        data: {
                            labels: this.categories.map(c => c.name),
                            datasets: [{
                                data: this.categories.map(c => c.amount),
                                backgroundColor: ['#3b82f6', '#a855f7', '#10b981']
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                },

                get totalPercent() {
                    return this.categories.reduce((sum, cat) => sum + cat.percent, 0);
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_budget_planner.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
