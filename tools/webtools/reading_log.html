<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读记录 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-stone-50 min-h-screen font-serif text-stone-800" x-data="bookApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-stone-200 sticky top-0 z-50 shadow-sm font-sans">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-stone-100 text-stone-600 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-stone-600 to-stone-800">
                    📖 阅读记录
                </h1>
            </div>
            
            <button @click="showModal = true" class="bg-stone-800 hover:bg-black text-white px-4 py-2 rounded-lg shadow-lg shadow-stone-800/20 transition-all flex items-center gap-2 text-sm font-medium">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">新书</span>
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 pb-24 font-sans">

        <!-- Status Filter -->
        <div class="flex gap-2 mb-6 overflow-x-auto no-scrollbar">
            <template x-for="s in ['reading', 'want', 'finished']" :key="s">
                <button @click="filter = s" 
                        class="px-4 py-2 rounded-full text-sm font-bold border transition-all capitalize"
                        :class="filter === s ? 'bg-stone-800 text-white border-stone-800' : 'bg-white border-stone-200 text-stone-500 hover:bg-stone-100'">
                    <span x-text="getStatusLabel(s)"></span>
                    <span class="ml-1 opacity-60 text-xs" x-text="'(' + getCount(s) + ')'"></span>
                </button>
            </template>
        </div>

        <!-- Books Grid -->
        <div class="grid grid-cols-1 gap-6">
            <template x-for="book in filteredBooks" :key="book.id">
                <div class="bg-white rounded-2xl p-6 border border-stone-100 shadow-sm hover:shadow-md transition-all flex gap-6 group relative">
                    
                    <!-- Cover (Placeholder) -->
                    <div class="w-24 h-36 bg-stone-200 rounded-lg shadow-inner flex items-center justify-center text-stone-400 shrink-0 select-none relative overflow-hidden">
                        <template x-if="book.cover">
                             <img :src="book.cover" class="w-full h-full object-cover">
                        </template>
                        <template x-if="!book.cover">
                            <div class="text-3xl font-serif font-bold opacity-30" x-text="book.title.charAt(0)"></div>
                        </template>
                        <!-- Status Badge overlay -->
                        <div class="absolute top-0 left-0 w-full h-1 bg-stone-300">
                            <div class="h-full bg-orange-400" :style="`width: ${getProgress(book)}%`"></div>
                        </div>
                    </div>

                    <div class="flex-1 min-w-0 flex flex-col">
                        <div class="flex justify-between items-start">
                             <div>
                                 <h3 class="text-xl font-bold font-serif leading-tight mb-1 truncate pr-4" x-text="book.title"></h3>
                                 <div class="text-sm text-stone-500 mb-3" x-text="book.author || '未知作者'"></div>
                             </div>
                             <div class="flex items-center text-yellow-400 gap-0.5" x-show="book.status === 'finished'">
                                 <i class="fa-solid fa-star"></i>
                                 <span class="text-stone-700 text-sm font-bold ml-1" x-text="book.rating"></span>
                             </div>
                        </div>

                        <!-- Progress Control (Only for reading) -->
                        <div x-show="book.status === 'reading'" class="mt-auto">
                            <div class="flex justify-between text-xs font-bold text-stone-400 mb-1">
                                <span x-text="book.currentPage + ' 页'"></span>
                                <span x-text="getProgress(book) + '%'"></span>
                            </div>
                            <div class="h-2 bg-stone-100 rounded-full overflow-hidden mb-3 relative group/progress cursor-pointer">
                                <div class="h-full bg-stone-800 rounded-full transition-all" :style="`width: ${getProgress(book)}%`"></div>
                                <input type="range" min="0" :max="book.totalPages" x-model="book.currentPage" @input="updateProgress(book)" 
                                       class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                            </div>
                            <button @click="quickNote(book)" class="text-xs text-stone-500 hover:text-stone-800 flex items-center gap-1">
                                <i class="fa-solid fa-pen"></i> 写笔记
                            </button>
                        </div>
                        
                        <!-- Actions for Want/Finished -->
                        <div x-show="book.status !== 'reading'" class="mt-auto">
                             <button x-show="book.status === 'want'" @click="startReading(book.id)" class="px-4 py-2 bg-stone-800 text-stone-50 text-sm font-bold rounded-lg hover:bg-black transition-colors">
                                 开始阅读
                             </button>
                             <div x-show="book.status === 'finished'" class="text-sm text-stone-500 italic line-clamp-2" x-text="book.review || '暂无书评...'"></div>
                        </div>
                    </div>
                    
                    <!-- Menu -->
                    <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
                        <button @click="editBook(book)" class="p-2 bg-white rounded-full shadow-sm text-stone-400 hover:text-stone-600 border border-stone-100">
                             <i class="fa-solid fa-gear"></i>
                        </button>
                        <button @click="deleteBook(book.id)" class="p-2 bg-white rounded-full shadow-sm text-stone-400 hover:text-rose-500 border border-stone-100">
                             <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            </template>
            
            <div x-show="filteredBooks.length === 0" class="text-center py-20 text-stone-400">
                <i class="fa-solid fa-book-open text-5xl mx-auto mb-4 opacity-30"></i>
                <p>书架空空如也</p>
            </div>
        </div>

    </main>

    <!-- Add/Edit Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 max-h-[90vh] overflow-y-auto" @click.away="closeModal()">
            <h3 class="text-lg font-bold text-stone-900 mb-4" x-text="tempBook.id ? '编辑书籍' : '添加新书'"></h3>
            <div class="space-y-4 font-sans">
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-1">书名</label>
                    <input type="text" x-model="tempBook.title" class="w-full rounded-xl border border-stone-200 p-3 outline-none focus:border-stone-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-1">作者</label>
                    <input type="text" x-model="tempBook.author" class="w-full rounded-xl border border-stone-200 p-3 outline-none focus:border-stone-800">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-stone-500 mb-1">总页数</label>
                        <input type="number" x-model="tempBook.totalPages" class="w-full rounded-xl border border-stone-200 p-3 outline-none focus:border-stone-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-stone-500 mb-1">当前进度</label>
                        <input type="number" x-model="tempBook.currentPage" class="w-full rounded-xl border border-stone-200 p-3 outline-none focus:border-stone-800">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-1">状态</label>
                    <select x-model="tempBook.status" class="w-full rounded-xl border border-stone-200 p-3 outline-none focus:border-stone-800 bg-white">
                        <option value="want">想读</option>
                        <option value="reading">在读</option>
                        <option value="finished">已读</option>
                    </select>
                </div>
                
                <div x-show="tempBook.status === 'finished'" class="space-y-4 border-t border-stone-100 pt-4">
                     <div>
                        <label class="block text-xs font-bold text-stone-500 mb-1">评分 (1-10)</label>
                        <input type="number" min="1" max="10" x-model="tempBook.rating" class="w-full rounded-xl border border-stone-200 p-3 outline-none focus:border-stone-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-stone-500 mb-1">书评</label>
                        <textarea x-model="tempBook.review" rows="3" class="w-full rounded-xl border border-stone-200 p-3 outline-none focus:border-stone-800"></textarea>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex gap-3 font-sans">
                <button @click="closeModal()" class="flex-1 py-3 rounded-xl bg-stone-100 text-stone-600 font-bold hover:bg-stone-200">取消</button>
                <button @click="saveBook()" 
                        :disabled="!tempBook.title"
                        class="flex-1 py-3 rounded-xl bg-stone-800 text-white font-bold hover:bg-stone-900 transition-all disabled:opacity-50">
                    保存
                </button>
            </div>
        </div>
    </div>

    <!-- Note Modal -->
    <div x-show="noteModal" x-cloak class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
         <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6" @click.away="noteModal = false">
             <h3 class="text-lg font-bold text-stone-900 mb-4">记录笔记</h3>
             <textarea x-model="currentNote" rows="6" class="w-full rounded-xl border border-stone-200 p-4 outline-none focus:border-stone-800 text-stone-700 bg-stone-50" placeholder="写下你的想法..."></textarea>
             <div class="mt-4 flex justify-end">
                 <button @click="saveNote()" class="bg-stone-800 text-white px-6 py-2 rounded-lg font-bold hover:bg-stone-900">保存</button>
             </div>
         </div>
    </div>

    <script>
        function bookApp() {
            return {
                showModal: false,
                noteModal: false,
                filter: 'reading',
                books: [],
                
                tempBook: {
                    id: null, title: '', author: '', totalPages: 300, currentPage: 0, status: 'reading', rating: '', review: '', notes: []
                },
                
                activeBookId: null,
                currentNote: '',

                init() {
                    const saved = localStorage.getItem('webtools_reading_log');
                    if (saved) {
                        this.books = JSON.parse(saved);
                    } else {
                        // Demo
                        this.books = [
                            { id: 1, title: '原子习惯', author: 'James Clear', totalPages: 306, currentPage: 120, status: 'reading', rating: '', review: '', notes: [] }
                        ];
                    }
                    this.$watch('books', () => {
                        localStorage.setItem('webtools_reading_log', JSON.stringify(this.books));
                    }, { deep: true });
                    

                },

                get filteredBooks() {
                    return this.books.filter(b => b.status === this.filter);
                },

                getStatusLabel(s) {
                    const map = { want: '想读', reading: '在读', finished: '已读' };
                    return map[s];
                },

                getCount(s) {
                    return this.books.filter(b => b.status === s).length;
                },

                getProgress(book) {
                    if (!book.totalPages) return 0;
                    return Math.min(100, Math.round((book.currentPage / book.totalPages) * 100));
                },
                
                updateProgress(book) {
                    // Reactive update handled by alpine
                    if (parseInt(book.currentPage) >= parseInt(book.totalPages)) {
                        if (confirm('恭喜读完！是否标记为"已读"？')) {
                            book.status = 'finished';
                            this.editBook(book); // Open modal to add rating
                        }
                    }
                },

                saveBook() {
                    if (this.tempBook.id) {
                        const idx = this.books.findIndex(b => b.id === this.tempBook.id);
                        if (idx !== -1) this.books[idx] = { ...this.tempBook };
                    } else {
                        this.books.unshift({
                            ...this.tempBook,
                            id: Date.now(),
                            notes: []
                        });
                    }
                    this.closeModal();
                },

                editBook(book) {
                    this.tempBook = JSON.parse(JSON.stringify(book)); // Deep copy
                    this.showModal = true;
                },

                deleteBook(id) {
                    if (confirm('确定删除这本书的记录吗？')) {
                        this.books = this.books.filter(b => b.id !== id);
                    }
                },
                
                startReading(id) {
                    const b = this.books.find(x => x.id === id);
                    if (b) {
                        b.status = 'reading';
                        this.filter = 'reading';
                    }
                },
                
                quickNote(book) {
                    this.activeBookId = book.id;
                    this.currentNote = '';
                    this.noteModal = true;
                },
                
                saveNote() {
                    if (this.currentNote.trim()) {
                        const b = this.books.find(x => x.id === this.activeBookId);
                        if (b) {
                            if (!b.notes) b.notes = [];
                            b.notes.unshift({
                                id: Date.now(),
                                text: this.currentNote,
                                date: new Date().toISOString()
                            });
                            alert('笔记已保存');
                        }
                    }
                    this.noteModal = false;
                },

                closeModal() {
                    this.showModal = false;
                    this.tempBook = { id: null, title: '', author: '', totalPages: 300, currentPage: 0, status: 'reading', rating: '', review: '', notes: [] };
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_reading_log.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
