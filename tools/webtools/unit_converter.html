<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单位转换大师 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" x-data="converterApp()" x-init="init()">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold text-slate-800">🔄 单位转换大师</h1>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Category Tabs -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6">
            <div class="flex overflow-x-auto border-b border-slate-200">
                <template x-for="cat in categories" :key="cat.id">
                    <button 
                        @click="activeCategory = cat.id"
                        :class="activeCategory === cat.id ? 'border-b-2 border-indigo-500 text-indigo-600' : 'text-slate-600'"
                        class="px-4 py-3 font-medium whitespace-nowrap transition-colors flex items-center gap-2"
                    >
                        <span x-text="cat.icon"></span>
                        <span x-text="cat.name"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Converter -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            
            <!-- From -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-2">从</label>
                <div class="grid md:grid-cols-2 gap-4">
                    <input 
                        type="number" 
                        x-model.number="fromValue"
                        @input="convert()"
                        placeholder="输入数值"
                        class="px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-lg"
                    />
                    <select 
                        x-model="fromUnit"
                        @change="convert()"
                        class="px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    >
                        <template x-for="unit in currentUnits" :key="unit.id">
                            <option :value="unit.id" x-text="unit.name + ' (' + unit.symbol + ')'"></option>
                        </template>
                    </select>
                </div>
            </div>

            <!-- Swap Button -->
            <div class="flex justify-center mb-6">
                <button 
                    @click="swap()"
                    class="p-3 bg-indigo-100 hover:bg-indigo-200 text-indigo-600 rounded-full transition-colors"
                >
                    <i class="fa-solid fa-arrow-right-arrow-left w-5 h-5 rotate-90"></i>
                </button>
            </div>

            <!-- To -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-2">到</label>
                <div class="grid md:grid-cols-2 gap-4">
                    <div class="px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-lg font-medium text-slate-800">
                        <span x-text="toValue.toLocaleString()"></span>
                    </div>
                    <select 
                        x-model="toUnit"
                        @change="convert()"
                        class="px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    >
                        <template x-for="unit in currentUnits" :key="unit.id">
                            <option :value="unit.id" x-text="unit.name + ' (' + unit.symbol + ')'"></option>
                        </template>
                    </select>
                </div>
            </div>

            <!-- Result -->
            <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-lg text-center">
                <div class="text-sm text-indigo-600 mb-1">转换结果</div>
                <div class="text-2xl font-bold text-indigo-900">
                    <span x-text="fromValue"></span> <span x-text="getUnitSymbol(fromUnit)"></span> = 
                    <span x-text="toValue.toLocaleString()"></span> <span x-text="getUnitSymbol(toUnit)"></span>
                </div>
            </div>

            <!-- Quick Conversions -->
            <div class="mt-6">
                <div class="text-sm font-medium text-slate-700 mb-3">常用转换</div>
                <div class="grid md:grid-cols-2 gap-2">
                    <template x-for="unit in currentUnits" :key="unit.id">
                        <div x-show="unit.id !== fromUnit" class="p-3 bg-slate-50 rounded-lg text-sm">
                            <span class="text-slate-600" x-text="unit.name"></span>:
                            <span class="font-medium text-slate-800 ml-2" x-text="convertTo(unit.id).toLocaleString()"></span>
                            <span class="text-slate-500 text-xs ml-1" x-text="unit.symbol"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>

    <script>
        function converterApp() {
            return {
                activeCategory: 'length',
                fromValue: 1,
                fromUnit: 'm',
                toUnit: 'km',
                toValue: 0,
                
                categories: [
                    { id: 'length', name: '长度', icon: '📏' },
                    { id: 'weight', name: '重量', icon: '⚖️' },
                    { id: 'temperature', name: '温度', icon: '🌡️' },
                    { id: 'area', name: '面积', icon: '📐' },
                    { id: 'volume', name: '体积', icon: '🧊' },
                    { id: 'speed', name: '速度', icon: '🚀' },
                    { id: 'data', name: '数据', icon: '💾' }
                ],

                units: {
                    length: [
                        { id: 'mm', name: '毫米', symbol: 'mm', toBase: 0.001 },
                        { id: 'cm', name: '厘米', symbol: 'cm', toBase: 0.01 },
                        { id: 'm', name: '米', symbol: 'm', toBase: 1 },
                        { id: 'km', name: '千米', symbol: 'km', toBase: 1000 },
                        { id: 'in', name: '英寸', symbol: 'in', toBase: 0.0254 },
                        { id: 'ft', name: '英尺', symbol: 'ft', toBase: 0.3048 },
                        { id: 'yd', name: '码', symbol: 'yd', toBase: 0.9144 },
                        { id: 'mi', name: '英里', symbol: 'mi', toBase: 1609.344 }
                    ],
                    weight: [
                        { id: 'mg', name: '毫克', symbol: 'mg', toBase: 0.000001 },
                        { id: 'g', name: '克', symbol: 'g', toBase: 0.001 },
                        { id: 'kg', name: '千克', symbol: 'kg', toBase: 1 },
                        { id: 't', name: '吨', symbol: 't', toBase: 1000 },
                        { id: 'oz', name: '盎司', symbol: 'oz', toBase: 0.0283495 },
                        { id: 'lb', name: '磅', symbol: 'lb', toBase: 0.453592 }
                    ],
                    temperature: [
                        { id: 'c', name: '摄氏度', symbol: '°C' },
                        { id: 'f', name: '华氏度', symbol: '°F' },
                        { id: 'k', name: '开尔文', symbol: 'K' }
                    ],
                    area: [
                        { id: 'mm2', name: '平方毫米', symbol: 'mm²', toBase: 0.000001 },
                        { id: 'cm2', name: '平方厘米', symbol: 'cm²', toBase: 0.0001 },
                        { id: 'm2', name: '平方米', symbol: 'm²', toBase: 1 },
                        { id: 'km2', name: '平方千米', symbol: 'km²', toBase: 1000000 },
                        { id: 'ha', name: '公顷', symbol: 'ha', toBase: 10000 }
                    ],
                    volume: [
                        { id: 'ml', name: '毫升', symbol: 'mL', toBase: 0.001 },
                        { id: 'l', name: '升', symbol: 'L', toBase: 1 },
                        { id: 'm3', name: '立方米', symbol: 'm³', toBase: 1000 }
                    ],
                    speed: [
                        { id: 'ms', name: '米/秒', symbol: 'm/s', toBase: 1 },
                        { id: 'kmh', name: '千米/时', symbol: 'km/h', toBase: 0.277778 },
                        { id: 'mph', name: '英里/时', symbol: 'mph', toBase: 0.44704 }
                    ],
                    data: [
                        { id: 'b', name: '字节', symbol: 'B', toBase: 1 },
                        { id: 'kb', name: '千字节', symbol: 'KB', toBase: 1024 },
                        { id: 'mb', name: '兆字节', symbol: 'MB', toBase: 1048576 },
                        { id: 'gb', name: '吉字节', symbol: 'GB', toBase: 1073741824 },
                        { id: 'tb', name: '太字节', symbol: 'TB', toBase: 1099511627776 }
                    ]
                },

                init() {
                    this.convert();
                    this.$watch('activeCategory', () => {
                        this.fromUnit = this.currentUnits[0].id;
                        this.toUnit = this.currentUnits[1]?.id || this.currentUnits[0].id;
                        this.convert();
                    });
                    // icons removed
                },

                convert() {
                    if (this.activeCategory === 'temperature') {
                        this.toValue = this.convertTemperature();
                    } else {
                        const fromBase = this.fromValue * this.getToBase(this.fromUnit);
                        this.toValue = fromBase / this.getToBase(this.toUnit);
                    }
                    this.$nextTick(() => { });
                },

                convertTemperature() {
                    let celsius;
                    
                    // Convert to Celsius first
                    if (this.fromUnit === 'c') celsius = this.fromValue;
                    else if (this.fromUnit === 'f') celsius = (this.fromValue - 32) * 5/9;
                    else if (this.fromUnit === 'k') celsius = this.fromValue - 273.15;
                    
                    // Convert from Celsius to target
                    if (this.toUnit === 'c') return celsius;
                    if (this.toUnit === 'f') return celsius * 9/5 + 32;
                    if (this.toUnit === 'k') return celsius + 273.15;
                    
                    return 0;
                },

                convertTo(targetUnit) {
                    if (this.activeCategory === 'temperature') {
                        const temp = this.toUnit;
                        this.toUnit = targetUnit;
                        const result = this.convertTemperature();
                        this.toUnit = temp;
                        return result;
                    } else {
                        const fromBase = this.fromValue * this.getToBase(this.fromUnit);
                        return fromBase / this.getToBase(targetUnit);
                    }
                },

                getToBase(unitId) {
                    const unit = this.currentUnits.find(u => u.id === unitId);
                    return unit?.toBase || 1;
                },

                getUnitSymbol(unitId) {
                    const unit = this.currentUnits.find(u => u.id === unitId);
                    return unit?.symbol || '';
                },

                swap() {
                    [this.fromUnit, this.toUnit] = [this.toUnit, this.fromUnit];
                    this.fromValue = this.toValue;
                    this.convert();
                },

                get currentUnits() {
                    return this.units[this.activeCategory] || [];
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_unit_converter.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
