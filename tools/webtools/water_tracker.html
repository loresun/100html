<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日喝水助手 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .water-wave {
            animation: wave 3s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-cyan-50 to-blue-100 min-h-screen font-sans" x-data="waterApp()" x-init="init()">

    <header class="bg-white/80 backdrop-blur-md border-b border-cyan-100 sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-cyan-50 text-cyan-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold text-cyan-600">💧 每日喝水助手</h1>
            </div>
            <button @click="showSettings = true" class="p-2 rounded-lg hover:bg-cyan-50 text-cyan-600 transition-colors">
                <i class="fa-solid fa-gear w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
        
        <!-- Water Cup Visualization -->
        <div class="bg-white rounded-3xl shadow-xl border-4 border-cyan-200 p-8 mb-8 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-t from-cyan-400 to-cyan-200 opacity-20 transition-all duration-700"
                 :style="'clip-path: polygon(0 ' + (100 - percentage) + '%, 100% ' + (100 - percentage) + '%, 100% 100%, 0 100%)'">
            </div>
            
            <div class="relative z-10 text-center">
                <div class="text-7xl mb-4 water-wave">💧</div>
                <div class="text-5xl font-bold text-cyan-600 mb-2" x-text="currentAmount + ' ml'">0 ml</div>
                <div class="text-lg text-slate-600 mb-4" x-text="'目标: ' + dailyGoal + ' ml'">目标: 2000 ml</div>
                <div class="w-full bg-slate-200 rounded-full h-4 mb-2">
                    <div class="bg-gradient-to-r from-cyan-400 to-blue-500 h-4 rounded-full transition-all duration-500"
                         :style="'width: ' + percentage + '%'"></div>
                </div>
                <div class="text-sm text-slate-500" x-text="percentage + '% 完成'">0% 完成</div>
            </div>
        </div>

        <!-- Quick Add Buttons -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <button @click="addWater(250)" class="bg-white hover:bg-cyan-50 p-6 rounded-2xl shadow-md border-2 border-cyan-100 transition-all hover:scale-105 active:scale-95">
                <div class="text-3xl mb-2">🥤</div>
                <div class="font-bold text-slate-800">250ml</div>
                <div class="text-xs text-slate-500">一杯</div>
            </button>
            <button @click="addWater(500)" class="bg-white hover:bg-cyan-50 p-6 rounded-2xl shadow-md border-2 border-cyan-100 transition-all hover:scale-105 active:scale-95">
                <div class="text-3xl mb-2">🍶</div>
                <div class="font-bold text-slate-800">500ml</div>
                <div class="text-xs text-slate-500">一瓶</div>
            </button>
            <button @click="addWater(1000)" class="bg-white hover:bg-cyan-50 p-6 rounded-2xl shadow-md border-2 border-cyan-100 transition-all hover:scale-105 active:scale-95">
                <div class="text-3xl mb-2">🚰</div>
                <div class="font-bold text-slate-800">1000ml</div>
                <div class="text-xs text-slate-500">大瓶</div>
            </button>
        </div>

        <!-- Custom Amount -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <label class="block text-sm font-medium text-slate-700 mb-3">自定义水量</label>
            <div class="flex gap-3">
                <input 
                    type="number" 
                    x-model.number="customAmount"
                    placeholder="输入毫升数"
                    class="flex-1 px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-transparent outline-none"
                />
                <button 
                    @click="addWater(customAmount); customAmount = null"
                    class="px-6 py-3 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl font-medium transition-colors"
                >
                    添加
                </button>
            </div>
        </div>

        <!-- Today's Records -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <h3 class="text-lg font-bold text-slate-800 mb-4">今日记录</h3>
            <div class="space-y-2">
                <template x-for="(record, index) in todayRecords" :key="index">
                    <div class="flex items-center justify-between p-3 bg-cyan-50 rounded-lg">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-cyan-100 rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-droplet w-5 h-5 text-cyan-600"></i>
                            </div>
                            <div>
                                <div class="font-medium text-slate-800" x-text="record.amount + ' ml'"></div>
                                <div class="text-xs text-slate-500" x-text="formatTime(record.time)"></div>
                            </div>
                        </div>
                        <button @click="removeRecord(index)" class="text-slate-400 hover:text-rose-500 transition-colors">
                            <i class="fa-solid fa-xmark w-4 h-4"></i>
                        </button>
                    </div>
                </template>
            </div>
            <div x-show="todayRecords.length === 0" class="text-center py-8 text-slate-400">
                还没有喝水记录，点击上方按钮开始记录吧
            </div>
        </div>

        <!-- Weekly Stats -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">本周统计</h3>
            <div class="grid grid-cols-7 gap-2">
                <template x-for="(day, index) in weekStats" :key="index">
                    <div class="text-center">
                        <div class="text-xs text-slate-500 mb-2" x-text="day.label"></div>
                        <div 
                            class="h-20 rounded-lg flex items-end justify-center pb-2 transition-all"
                            :class="day.percentage >= 100 ? 'bg-cyan-500' : day.percentage >= 50 ? 'bg-cyan-300' : 'bg-slate-100'"
                            :style="'opacity: ' + Math.min(1, day.percentage / 100)"
                        >
                            <span class="text-xs font-medium" :class="day.percentage >= 50 ? 'text-white' : 'text-slate-400'" x-text="day.percentage + '%'"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div x-show="showSettings" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" @click.self="showSettings = false">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-xl font-bold text-slate-800 mb-4">设置</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">每日目标 (ml)</label>
                    <input 
                        type="number" 
                        x-model.number="dailyGoal"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">提醒间隔 (分钟)</label>
                    <input 
                        type="number" 
                        x-model.number="reminderInterval"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none"
                    />
                </div>
            </div>
            <button @click="saveSettings()" class="w-full mt-6 py-3 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg font-medium transition-colors">
                保存
            </button>
        </div>
    </div>

    <script>
        function waterApp() {
            return {
                dailyGoal: 2000,
                currentAmount: 0,
                todayRecords: [],
                customAmount: null,
                showSettings: false,
                reminderInterval: 60,
                allRecords: {},

                init() {
                    const saved = localStorage.getItem('webtools_water');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.dailyGoal = data.dailyGoal || 2000;
                        this.reminderInterval = data.reminderInterval || 60;
                        this.allRecords = data.records || {};
                    }
                    
                    this.loadTodayRecords();
                    this.$watch('todayRecords', () => this.saveData());
                    this.$nextTick(() => { });
                },

                addWater(amount) {
                    if (!amount || amount <= 0) return;
                    
                    this.todayRecords.push({
                        amount: amount,
                        time: new Date().toISOString()
                    });
                    
                    this.currentAmount += amount;
                    
                    if (this.currentAmount >= this.dailyGoal) {
                        setTimeout(() => alert('🎉 恭喜！今日饮水目标已达成！'), 100);
                    }
                },

                removeRecord(index) {
                    const record = this.todayRecords[index];
                    this.currentAmount -= record.amount;
                    this.todayRecords.splice(index, 1);
                },

                loadTodayRecords() {
                    const today = this.getTodayKey();
                    this.todayRecords = this.allRecords[today] || [];
                    this.currentAmount = this.todayRecords.reduce((sum, r) => sum + r.amount, 0);
                },

                saveData() {
                    const today = this.getTodayKey();
                    this.allRecords[today] = this.todayRecords;
                    
                    localStorage.setItem('webtools_water', JSON.stringify({
                        dailyGoal: this.dailyGoal,
                        reminderInterval: this.reminderInterval,
                        records: this.allRecords
                    }));
                },

                saveSettings() {
                    this.saveData();
                    this.showSettings = false;
                },

                getTodayKey() {
                    const d = new Date();
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                },

                formatTime(iso) {
                    const d = new Date(iso);
                    return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
                },

                get percentage() {
                    return Math.min(100, Math.round((this.currentAmount / this.dailyGoal) * 100));
                },

                get weekStats() {
                    const stats = [];
                    const labels = ['日', '一', '二', '三', '四', '五', '六'];
                    
                    for (let i = 6; i >= 0; i--) {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        const records = this.allRecords[key] || [];
                        const total = records.reduce((sum, r) => sum + r.amount, 0);
                        
                        stats.push({
                            label: labels[d.getDay()],
                            percentage: Math.round((total / this.dailyGoal) * 100)
                        });
                    }
                    
                    return stats;
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_water_tracker.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
