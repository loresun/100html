<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生理期追踪 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .calendar-day { aspect-ratio: 1; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-pink-50 to-purple-50 min-h-screen font-sans" x-data="periodApp()" x-init="init()">

    <header class="bg-white/80 backdrop-blur-md border-b border-pink-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-pink-50 text-pink-600 transition-colors">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <h1 class="text-xl font-bold bg-gradient-to-r from-pink-600 to-purple-600 bg-clip-text text-transparent">
                    💝 生理期追踪
                </h1>
            </div>
            <button @click="showAddModal = true" class="px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white rounded-lg transition-colors">
                记录
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Predictions -->
        <div class="grid md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow-sm border border-pink-100 p-6">
                <div class="text-sm text-pink-600 font-medium mb-2">下次月经</div>
                <div class="text-2xl font-bold text-slate-800" x-text="predictions.nextPeriod || '暂无数据'"></div>
                <div class="text-xs text-slate-500 mt-1" x-show="predictions.daysUntilPeriod">
                    还有 <span x-text="predictions.daysUntilPeriod"></span> 天
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-purple-100 p-6">
                <div class="text-sm text-purple-600 font-medium mb-2">排卵期</div>
                <div class="text-2xl font-bold text-slate-800" x-text="predictions.ovulation || '暂无数据'"></div>
                <div class="text-xs text-slate-500 mt-1" x-show="predictions.daysUntilOvulation">
                    还有 <span x-text="predictions.daysUntilOvulation"></span> 天
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="text-sm text-slate-600 font-medium mb-2">平均周期</div>
                <div class="text-2xl font-bold text-slate-800">
                    <span x-text="avgCycle || '-'"></span><span x-show="avgCycle"> 天</span>
                </div>
            </div>
        </div>

        <!-- Calendar -->
        <div class="bg-white rounded-2xl shadow-sm border border-pink-100 p-6 mb-8">
            <div class="flex items-center justify-between mb-6">
                <button @click="previousMonth()" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h3 class="text-lg font-bold text-slate-800" x-text="currentMonthName"></h3>
                <button @click="nextMonth()" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Weekday Headers -->
            <div class="grid grid-cols-7 gap-2 mb-2">
                <template x-for="day in ['日', '一', '二', '三', '四', '五', '六']" :key="day">
                    <div class="text-center text-sm font-medium text-slate-500" x-text="day"></div>
                </template>
            </div>

            <!-- Calendar Days -->
            <div class="grid grid-cols-7 gap-2">
                <template x-for="day in calendarDays" :key="day.date">
                    <div 
                        @click="selectDate(day)"
                        class="calendar-day rounded-lg flex items-center justify-center text-sm font-medium cursor-pointer transition-all"
                        :class="{
                            'bg-pink-500 text-white': day.isPeriod,
                            'bg-purple-100 text-purple-700': day.isOvulation,
                            'bg-pink-50 text-pink-600': day.isFertile,
                            'bg-slate-100 text-slate-400': !day.isCurrentMonth,
                            'text-slate-800 hover:bg-slate-50': day.isCurrentMonth && !day.isPeriod && !day.isOvulation && !day.isFertile,
                            'ring-2 ring-indigo-500': day.isToday
                        }"
                    >
                        <span x-text="day.day"></span>
                    </div>
                </template>
            </div>

            <!-- Legend -->
            <div class="flex flex-wrap gap-4 mt-6 pt-6 border-t border-slate-200">
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-pink-500 rounded"></div>
                    <span class="text-xs text-slate-600">月经期</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-purple-100 rounded"></div>
                    <span class="text-xs text-slate-600">排卵期</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-pink-50 rounded"></div>
                    <span class="text-xs text-slate-600">易孕期</span>
                </div>
            </div>
        </div>

        <!-- Records -->
        <div class="bg-white rounded-2xl shadow-sm border border-pink-100 p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">历史记录</h3>
            
            <div class="space-y-3">
                <template x-for="record in recentRecords" :key="record.id">
                    <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg">
                        <div>
                            <div class="font-medium text-slate-800" x-text="formatDate(record.startDate)"></div>
                            <div class="text-sm text-slate-500">
                                持续 <span x-text="record.duration"></span> 天
                                <span x-show="record.flow"> | 流量: <span x-text="record.flow"></span></span>
                            </div>
                        </div>
                        <button @click="deleteRecord(record.id)" class="text-slate-400 hover:text-rose-500 transition-colors">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </template>
            </div>

            <div x-show="records.length === 0" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-calendar text-5xl mx-auto mb-3 text-slate-200"></i>
                <p>还没有记录,开始记录你的周期</p>
            </div>
        </div>
    </main>

    <!-- Add Modal -->
    <div x-show="showAddModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" @click.self="showAddModal = false">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold text-slate-800 mb-4">记录月经</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">开始日期</label>
                    <input 
                        type="date" 
                        x-model="newRecord.startDate"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">持续天数</label>
                    <input 
                        type="number" 
                        x-model.number="newRecord.duration"
                        min="1"
                        max="10"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">流量</label>
                    <select 
                        x-model="newRecord.flow"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"
                    >
                        <option value="轻">轻</option>
                        <option value="中">中</option>
                        <option value="重">重</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button @click="showAddModal = false" class="flex-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">
                    取消
                </button>
                <button @click="addRecord()" class="flex-1 px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white rounded-lg transition-colors">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        function periodApp() {
            return {
                records: [],
                showAddModal: false,
                currentMonth: new Date(),
                newRecord: {
                    startDate: new Date().toISOString().split('T')[0],
                    duration: 5,
                    flow: '中'
                },

                init() {
                    const saved = localStorage.getItem('webtools_period');
                    if (saved) {
                        this.records = JSON.parse(saved);
                    }
                    this.$watch('records', () => {
                        localStorage.setItem('webtools_period', JSON.stringify(this.records));
                    });
                    // init
                },

                addRecord() {
                    if (!this.newRecord.startDate) return;

                    this.records.push({
                        id: Date.now(),
                        startDate: this.newRecord.startDate,
                        duration: this.newRecord.duration,
                        flow: this.newRecord.flow,
                        createdAt: new Date().toISOString()
                    });

                    this.records.sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
                    this.newRecord = { startDate: new Date().toISOString().split('T')[0], duration: 5, flow: '中' };
                    this.showAddModal = false;
                },

                deleteRecord(id) {
                    if (confirm('确定要删除这条记录吗？')) {
                        this.records = this.records.filter(r => r.id !== id);
                    }
                },

                selectDate(day) {
                    if (!day.isCurrentMonth) return;
                    this.newRecord.startDate = day.date;
                    this.showAddModal = true;
                },

                previousMonth() {
                    this.currentMonth = new Date(this.currentMonth.getFullYear(), this.currentMonth.getMonth() - 1);
                },

                nextMonth() {
                    this.currentMonth = new Date(this.currentMonth.getFullYear(), this.currentMonth.getMonth() + 1);
                },

                formatDate(dateStr) {
                    const d = new Date(dateStr);
                    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
                },

                get currentMonthName() {
                    return `${this.currentMonth.getFullYear()}年${this.currentMonth.getMonth() + 1}月`;
                },

                get calendarDays() {
                    const year = this.currentMonth.getFullYear();
                    const month = this.currentMonth.getMonth();
                    const firstDay = new Date(year, month, 1);
                    const lastDay = new Date(year, month + 1, 0);
                    const prevLastDay = new Date(year, month, 0);
                    
                    const days = [];
                    const startPadding = firstDay.getDay();
                    
                    // Previous month days
                    for (let i = startPadding - 1; i >= 0; i--) {
                        const day = prevLastDay.getDate() - i;
                        days.push({
                            day,
                            date: new Date(year, month - 1, day).toISOString().split('T')[0],
                            isCurrentMonth: false,
                            isToday: false,
                            isPeriod: false,
                            isOvulation: false,
                            isFertile: false
                        });
                    }
                    
                    // Current month days
                    for (let day = 1; day <= lastDay.getDate(); day++) {
                        const date = new Date(year, month, day).toISOString().split('T')[0];
                        const today = new Date().toISOString().split('T')[0];
                        
                        days.push({
                            day,
                            date,
                            isCurrentMonth: true,
                            isToday: date === today,
                            isPeriod: this.isPeriodDay(date),
                            isOvulation: this.isOvulationDay(date),
                            isFertile: this.isFertileDay(date)
                        });
                    }
                    
                    // Next month days
                    const remaining = 42 - days.length;
                    for (let day = 1; day <= remaining; day++) {
                        days.push({
                            day,
                            date: new Date(year, month + 1, day).toISOString().split('T')[0],
                            isCurrentMonth: false,
                            isToday: false,
                            isPeriod: false,
                            isOvulation: false,
                            isFertile: false
                        });
                    }
                    
                    return days;
                },

                isPeriodDay(date) {
                    return this.records.some(r => {
                        const start = new Date(r.startDate);
                        const end = new Date(start);
                        end.setDate(end.getDate() + r.duration - 1);
                        const check = new Date(date);
                        return check >= start && check <= end;
                    });
                },

                isOvulationDay(date) {
                    if (!this.predictions.ovulation) return false;
                    const ovulation = new Date(this.predictions.ovulation);
                    const check = new Date(date);
                    const diff = Math.abs(check - ovulation) / (1000 * 60 * 60 * 24);
                    return diff <= 1;
                },

                isFertileDay(date) {
                    if (!this.predictions.ovulation) return false;
                    const ovulation = new Date(this.predictions.ovulation);
                    const check = new Date(date);
                    const diff = (check - ovulation) / (1000 * 60 * 60 * 24);
                    return diff >= -5 && diff <= 1;
                },

                get avgCycle() {
                    if (this.records.length < 2) return null;
                    const sorted = [...this.records].sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
                    let total = 0;
                    for (let i = 1; i < sorted.length; i++) {
                        const diff = (new Date(sorted[i].startDate) - new Date(sorted[i-1].startDate)) / (1000 * 60 * 60 * 24);
                        total += diff;
                    }
                    return Math.round(total / (sorted.length - 1));
                },

                get predictions() {
                    if (this.records.length === 0) return {};
                    
                    const cycle = this.avgCycle || 28;
                    const lastPeriod = new Date(this.records[0].startDate);
                    const nextPeriod = new Date(lastPeriod);
                    nextPeriod.setDate(nextPeriod.getDate() + cycle);
                    
                    const ovulation = new Date(nextPeriod);
                    ovulation.setDate(ovulation.getDate() - 14);
                    
                    const today = new Date();
                    const daysUntilPeriod = Math.ceil((nextPeriod - today) / (1000 * 60 * 60 * 24));
                    const daysUntilOvulation = Math.ceil((ovulation - today) / (1000 * 60 * 60 * 24));
                    
                    return {
                        nextPeriod: nextPeriod.toLocaleDateString('zh-CN'),
                        ovulation: ovulation.toLocaleDateString('zh-CN'),
                        daysUntilPeriod: daysUntilPeriod > 0 ? daysUntilPeriod : null,
                        daysUntilOvulation: daysUntilOvulation > 0 ? daysUntilOvulation : null
                    };
                },

                get recentRecords() {
                    return this.records.slice(0, 10);
                }
            }
        }
    </script>

</html>
