    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房贷计算器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800" x-data="loanApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">
                🏠 房贷计算器
            </h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-24 grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- Inputs -->
        <div class="md:col-span-4 space-y-4">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">贷款金额 (万元)</label>
                        <input type="number" x-model.number="amount" class="w-full text-lg font-bold p-3 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">贷款期限 (年)</label>
                        <select x-model.number="years" class="w-full p-3 rounded-xl border border-slate-300 focus:border-blue-500 outline-none bg-white">
                            <option value="5">5年 (60期)</option>
                            <option value="10">10年 (120期)</option>
                            <option value="15">15年 (180期)</option>
                            <option value="20">20年 (240期)</option>
                            <option value="25">25年 (300期)</option>
                            <option value="30">30年 (360期)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">年利率 (%)</label>
                        <div class="flex gap-2">
                             <input type="number" step="0.01" x-model.number="rate" class="w-full text-lg font-bold p-3 rounded-xl border border-slate-300 focus:border-blue-500 outline-none transition-all">
                             <div class="flex flex-col gap-1">
                                 <button @click="rate = 3.25" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded text-slate-600">公积金</button>
                                 <button @click="rate = 4.1" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded text-slate-600">商贷</button>
                             </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">还款方式</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button @click="type = 'benxi'" 
                                    class="py-3 rounded-xl font-bold text-sm border-2 transition-all"
                                    :class="type === 'benxi' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-100 text-slate-500 hover:bg-slate-50'">
                                等额本息
                            </button>
                            <button @click="type = 'benjin'" 
                                    class="py-3 rounded-xl font-bold text-sm border-2 transition-all"
                                    :class="type === 'benjin' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-100 text-slate-500 hover:bg-slate-50'">
                                等额本金
                            </button>
                        </div>
                    </div>
                </div>

                <button @click="calculate()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-calculator"></i>
                    开始计算
                </button>
            </div>
        </div>

        <!-- Results -->
        <div class="md:col-span-8 space-y-6">
            
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="text-xs text-slate-500 font-bold uppercase mb-1">每月还款 (首月)</div>
                    <div class="text-2xl font-bold text-slate-800" x-text="'¥' + results.monthlyPayment"></div>
                    <div x-show="type === 'benjin'" class="text-xs text-green-600 mt-1" x-text="'每月递减 ¥' + results.decrease"></div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="text-xs text-slate-500 font-bold uppercase mb-1">支付利息总额</div>
                    <div class="text-2xl font-bold text-orange-500" x-text="'¥' + results.totalInterest"></div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="text-xs text-slate-500 font-bold uppercase mb-1">还款总额</div>
                    <div class="text-2xl font-bold text-blue-600" x-text="'¥' + results.totalPayment"></div>
                </div>
            </div>

            <!-- Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-80 flex items-center justify-center relative">
                <canvas id="loanChart"></canvas>
            </div>

            <!-- Table Link (Toggle) -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <button @click="showSchedule = !showSchedule" class="w-full px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
                    <span class="font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-list text-slate-400"></i>
                        查看还款计划表
                    </span>
                    <i class="fa-solid fa-chevron-down text-slate-400 transition-transform" :class="showSchedule ? 'rotate-180' : ''"></i>
                </button>
                
                <div x-show="showSchedule" class="border-t border-slate-100 overflow-x-auto max-h-96">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 text-slate-500 sticky top-0">
                            <tr>
                                <th class="px-6 py-3 font-medium">期数</th>
                                <th class="px-6 py-3 font-medium">月供</th>
                                <th class="px-6 py-3 font-medium">本金</th>
                                <th class="px-6 py-3 font-medium">利息</th>
                                <th class="px-6 py-3 font-medium text-right">剩余本金</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="item in schedule" :key="item.month">
                                <tr class="hover:bg-slate-50/50">
                                    <td class="px-6 py-3 font-medium text-slate-600" x-text="item.month"></td>
                                    <td class="px-6 py-3 font-bold text-slate-800" x-text="item.payment"></td>
                                    <td class="px-6 py-3 text-slate-600" x-text="item.principal"></td>
                                    <td class="px-6 py-3 text-slate-600" x-text="item.interest"></td>
                                    <td class="px-6 py-3 text-right text-slate-400" x-text="item.balance"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script>
        function loanApp() {
            return {
                amount: 100, // 万
                years: 30,
                rate: 3.55,
                type: 'benxi',
                
                results: {
                    monthlyPayment: 0,
                    decrease: 0,
                    totalInterest: 0,
                    totalPayment: 0
                },
                schedule: [],
                showSchedule: false,
                chart: null,

                init() {
                    this.calculate();
                    // init
                },

                calculate() {
                    if (this.amount <= 0 || this.years <= 0 || this.rate <= 0) return;

                    const principal = this.amount * 10000;
                    const months = this.years * 12;
                    const monthlyRate = (this.rate / 100) / 12;

                    let totalInterest = 0;
                    let totalPayment = 0;
                    this.schedule = [];

                    if (this.type === 'benxi') {
                        // Equal Principal & Interest
                        // M = P * [ i(1+i)^n ] / [ (1+i)^n - 1 ]
                        const x = Math.pow(1 + monthlyRate, months);
                        const monthlyPayment = (principal * monthlyRate * x) / (x - 1);
                        
                        let balance = principal;
                        
                        for (let i = 1; i <= months; i++) {
                            const interest = balance * monthlyRate;
                            const principalPaid = monthlyPayment - interest;
                            balance -= principalPaid;
                            if(balance < 0) balance = 0; // Fix floating point
                            
                            totalInterest += interest;
                            this.schedule.push({
                                month: i,
                                payment: monthlyPayment.toFixed(2),
                                principal: principalPaid.toFixed(2),
                                interest: interest.toFixed(2),
                                balance: balance.toFixed(2)
                            });
                        }
                        
                        this.results.monthlyPayment = monthlyPayment.toFixed(2);
                        this.results.decrease = 0;

                    } else {
                        // Equal Principal
                        const monthlyPrincipal = principal / months;
                        let balance = principal;
                        const firstMonthPayment = monthlyPrincipal + (balance * monthlyRate);
                        const secondMonthPayment = monthlyPrincipal + ((balance - monthlyPrincipal) * monthlyRate);
                        
                        for (let i = 1; i <= months; i++) {
                            const interest = balance * monthlyRate;
                            const payment = monthlyPrincipal + interest;
                            balance -= monthlyPrincipal;
                            if(balance < 0) balance = 0;

                            totalInterest += interest;
                            this.schedule.push({
                                month: i,
                                payment: payment.toFixed(2),
                                principal: monthlyPrincipal.toFixed(2),
                                interest: interest.toFixed(2),
                                balance: balance.toFixed(2)
                            });
                        }

                        this.results.monthlyPayment = firstMonthPayment.toFixed(2);
                        this.results.decrease = (firstMonthPayment - secondMonthPayment).toFixed(2);
                    }

                    this.results.totalInterest = (totalInterest / 10000).toFixed(2) + '万';
                    this.results.totalPayment = ((principal + totalInterest) / 10000).toFixed(2) + '万';
                    
                    this.drawChart(this.amount, totalInterest / 10000);
                },

                drawChart(principal, interest) {
                    const ctx = document.getElementById('loanChart').getContext('2d');
                    if (this.chart) this.chart.destroy();
                    
                    this.chart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['贷款本金', '支付利息'],
                            datasets: [{
                                data: [principal, interest],
                                backgroundColor: ['#3b82f6', '#f97316'],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'bottom', labels: { padding: 20 } },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => {
                                            const val = context.raw;
                                            const total = context.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                                            const pct = ((val / total) * 100).toFixed(1) + '%';
                                            return ` ${context.label}: ${val.toFixed(2)}万 (${pct})`;
                                        }
                                    }
                                }
                            },
                            cutout: '60%'
                        }
                    });
                }
            }
        }
    </script>

</html>
