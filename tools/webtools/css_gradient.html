<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 渐变生成器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .grid-bg {
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f1f5f9 75%), linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-pink-50 min-h-screen font-sans text-slate-800" x-data="gradApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-pink-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-pink-50 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left w-5 h-5"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-600 to-rose-500">
                🎨 CSS 渐变生成器
            </h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-24 grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- Controls -->
        <div class="space-y-6">
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-pink-100">
                <h3 class="font-bold text-slate-600 mb-4 text-sm uppercase">渐变设置</h3>
                
                <div class="space-y-4">
                    <!-- Type and Angle -->
                     <div class="flex gap-4">
                        <select x-model="type" class="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none">
                            <option value="linear-gradient">Linear (线性)</option>
                            <option value="radial-gradient">Radial (径向)</option>
                        </select>
                         <div class="flex items-center gap-2 w-24" x-show="type === 'linear-gradient'">
                            <span class="text-xs text-slate-400">角度</span>
                            <input type="number" x-model="angle" class="w-full p-2 border border-slate-200 rounded-lg text-sm text-center">
                        </div>
                    </div>
                    
                    <!-- Colors -->
                    <div class="space-y-3">
                        <template x-for="(stop, index) in stops" :key="index">
                            <div class="flex items-center gap-3 animate-fade-in group">
                                <input type="color" x-model="stop.color" class="w-10 h-10 rounded-lg cursor-pointer border-0 p-0 bg-transparent">
                                
                                <div class="flex-1">
                                    <input type="range" x-model="stop.pos" min="0" max="100" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-pink-500">
                                </div>
                                <span class="text-xs font-mono w-8 text-right" x-text="stop.pos + '%'"></span>
                                
                                <button @click="removeStop(index)" class="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity" :disabled="stops.length <= 2">
                                    <i class="fa-solid fa-xmark w-4 h-4"></i>
                                </button>
                            </div>
                        </template>
                    </div>

                    <button @click="addStop()" class="w-full py-2 bg-slate-50 border border-dashed border-slate-300 rounded-lg text-xs font-bold text-slate-500 hover:bg-slate-100 hover:border-slate-400 transition-colors">
                        + 添加颜色节点
                    </button>
                </div>
            </div>

            <!-- Presets -->
            <div>
                 <h3 class="font-bold text-slate-600 mb-3 text-sm uppercase">随机预设</h3>
                 <div class="grid grid-cols-5 gap-2">
                     <template x-for="p in presets">
                         <div 
                            @click="loadPreset(p)" 
                            class="w-full h-10 rounded-lg cursor-pointer hover:scale-105 transition-transform shadow-sm border border-slate-100"
                            :style="`background: linear-gradient(135deg, ${p[0]}, ${p[1]})`"
                         ></div>
                     </template>
                 </div>
            </div>

        </div>

        <!-- Preview -->
        <div class="space-y-4">
             <div class="w-full h-64 md:h-80 rounded-2xl shadow-xl border border-white/50 grid-bg relative overflow-hidden">
                 <div class="absolute inset-0 transition-all duration-300" :style="backgroundStyle"></div>
             </div>
             
             <div class="bg-slate-900 rounded-xl p-4 relative group">
                 <div class="font-mono text-xs text-rose-300 mb-1 opacity-50">CSS Code</div>
                 <div class="font-mono text-sm text-white break-all leading-relaxed" x-text="cssCode"></div>
                 
                 <button @click="copy()" class="absolute top-3 right-3 p-2 bg-white/10 hover:bg-white/20 rounded-lg text-white transition-colors">
                     <i class="fa-solid fa-copy w-4 h-4"></i>
                 </button>
             </div>
        </div>

    </main>

    <script>
        function gradApp() {
            return {
                type: 'linear-gradient',
                angle: 135,
                stops: [
                    { color: '#8b5cf6', pos: 0 },
                    { color: '#ec4899', pos: 100 }
                ],
                presets: [
                    ['#fbc2eb', '#a6c1ee'],
                    ['#84fab0', '#8fd3f4'],
                    ['#a18cd1', '#fbc2eb'],
                    ['#ff9a9e', '#fecfef'],
                    ['#f6d365', '#fda085'],
                    ['#30cfd0', '#330867'],
                    ['#d299c2', '#fef9d7'],
                    ['#89f7fe', '#66a6ff'],
                    ['#e0c3fc', '#8ec5fc'],
                    ['#43e97b', '#38f9d7']
                ],

                init() {
                },
                
                addStop() {
                    if (this.stops.length >= 5) return;
                    // Find a middle position or just default to 50
                    this.stops.push({ color: '#ffffff', pos: 50 });
                    this.stops.sort((a,b) => a.pos - b.pos);
                },
                
                removeStop(index) {
                    if (this.stops.length <= 2) return;
                    this.stops.splice(index, 1);
                },
                
                loadPreset(colors) {
                    this.stops = [
                        { color: colors[0], pos: 0 },
                        { color: colors[1], pos: 100 }
                    ];
                    this.type = 'linear-gradient';
                    this.angle = 135;
                },
                
                get cssCode() {
                    // Sort stops by position for valid CSS
                    const sorted = [...this.stops].sort((a,b) => a.pos - b.pos);
                    const stopStr = sorted.map(s => `${s.color} ${s.pos}%`).join(', ');
                    
                    if (this.type === 'linear-gradient') {
                        return `background-image: linear-gradient(${this.angle}deg, ${stopStr});`;
                    } else {
                        return `background-image: radial-gradient(circle, ${stopStr});`;
                    }
                },
                
                get backgroundStyle() {
                   return this.cssCode; 
                },
                
                copy() {
                    navigator.clipboard.writeText(this.cssCode).then(() => {
                        alert('CSS 已复制！');
                    });
                }
            }
        }
    </script>

</html>
