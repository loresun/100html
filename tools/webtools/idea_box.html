<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感便签 Box | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .masonry {
            column-count: 1;
            column-gap: 1rem;
        }
        @media (min-width: 640px) {
            .masonry { column-count: 2; }
        }
        @media (min-width: 1024px) {
            .masonry { column-count: 3; }
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" x-data="ideaBoxApp()" x-init="init()">

    <!-- Header -->
    <header class="gradient-bg text-white sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <a href="./index.html" class="p-2 rounded-lg hover:bg-white/10 transition-colors">
                        <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                    </a>
                    <h1 class="text-2xl font-bold">💡 灵感便签 Box</h1>
                </div>
                <div class="flex items-center gap-2">
                    <button @click="view = 'grid'" :class="view === 'grid' ? 'bg-white/20' : 'bg-white/10'" class="p-2 rounded-lg transition-colors">
                        <i class="fa-solid fa-table-cells w-5 h-5"></i>
                    </button>
                    <button @click="view = 'list'" :class="view === 'list' ? 'bg-white/20' : 'bg-white/10'" class="p-2 rounded-lg transition-colors">
                        <i class="fa-solid fa-list w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Quick Add -->
            <div class="bg-white/10 backdrop-blur-md rounded-xl p-4">
                <textarea 
                    x-model="newIdea"
                    @keydown.ctrl.enter="addIdea()"
                    @keydown.meta.enter="addIdea()"
                    placeholder="捕捉稍纵即逝的灵感... (Ctrl/Cmd + Enter 保存)"
                    rows="2"
                    class="w-full bg-white/90 text-slate-800 rounded-lg px-4 py-3 placeholder-slate-400 focus:ring-2 focus:ring-white/50 outline-none resize-none"
                ></textarea>
                <div class="flex items-center justify-between mt-3">
                    <div class="flex gap-2 flex-wrap">
                        <template x-for="tag in quickTags" :key="tag">
                            <button 
                                @click="toggleQuickTag(tag)"
                                :class="selectedTags.includes(tag) ? 'bg-white text-purple-600' : 'bg-white/20 text-white hover:bg-white/30'"
                                class="px-3 py-1 rounded-full text-sm transition-colors"
                                x-text="'#' + tag"
                            ></button>
                        </template>
                    </div>
                    <button 
                        @click="addIdea()"
                        class="px-6 py-2 bg-white text-purple-600 rounded-lg font-medium hover:bg-white/90 transition-colors flex items-center gap-2"
                    >
                        <i class="fa-solid fa-plus w-4 h-4"></i>
                        保存
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Filter Bar -->
        <div class="mb-6 flex flex-wrap gap-3 items-center">
            <div class="relative flex-1 min-w-[200px]">
                <i class="fa-solid fa-magnifying-glass w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input 
                    type="text" 
                    x-model="searchQuery"
                    placeholder="搜索灵感..."
                    class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                />
            </div>
            
            <select x-model="filterTag" class="px-4 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                <option value="">全部标签</option>
                <template x-for="tag in allTags" :key="tag">
                    <option :value="tag" x-text="'#' + tag"></option>
                </template>
            </select>

            <select x-model="sortBy" class="px-4 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                <option value="newest">最新优先</option>
                <option value="oldest">最早优先</option>
            </select>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">总灵感</div>
                <div class="text-2xl font-bold text-purple-600" x-text="ideas.length">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">本周新增</div>
                <div class="text-2xl font-bold text-slate-800" x-text="weekCount">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">已收藏</div>
                <div class="text-2xl font-bold text-amber-500" x-text="favoriteCount">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">标签数</div>
                <div class="text-2xl font-bold text-slate-800" x-text="allTags.length">0</div>
            </div>
        </div>

        <!-- Ideas Grid/List -->
        <div :class="view === 'grid' ? 'masonry' : 'space-y-4'">
            <template x-for="idea in filteredIdeas" :key="idea.id">
                <div :class="view === 'grid' ? 'masonry-item' : ''" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition-all group">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex-1">
                            <p class="text-slate-800 leading-relaxed whitespace-pre-wrap" x-text="idea.content"></p>
                        </div>
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-2">
                            <button 
                                @click="toggleFavorite(idea.id)"
                                :class="idea.favorite ? 'text-amber-500' : 'text-slate-300 hover:text-amber-500'"
                                class="p-1.5 transition-colors"
                            >
                                <i :class="idea.favorite ? 'fa-solid fa-star' : 'fa-regular fa-star'" class="w-4 h-4"></i>
                            </button>
                            <button @click="deleteIdea(idea.id)" class="p-1.5 text-slate-300 hover:text-rose-500 transition-colors">
                                <i class="fa-solid fa-trash w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-xs">
                        <div class="flex gap-1.5 flex-wrap">
                            <template x-for="tag in idea.tags" :key="tag">
                                <span class="px-2 py-1 bg-purple-50 text-purple-600 rounded-full font-medium" x-text="'#' + tag"></span>
                            </template>
                        </div>
                        <span class="text-slate-400 ml-2" x-text="formatDate(idea.createdAt)"></span>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="filteredIdeas.length === 0" class="text-center py-20">
            <div class="w-20 h-20 mx-auto mb-4 bg-slate-100 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-lightbulb w-10 h-10 text-slate-300"></i>
            </div>
            <h3 class="text-lg font-medium text-slate-600 mb-2">还没有灵感记录</h3>
            <p class="text-slate-400">在上方输入框记录你的第一个想法吧</p>
        </div>
    </main>

    <script>
        function ideaBoxApp() {
            return {
                ideas: [],
                newIdea: '',
                selectedTags: [],
                searchQuery: '',
                filterTag: '',
                sortBy: 'newest',
                view: 'grid',
                quickTags: ['工作', '生活', '学习', '创意', '待办'],

                init() {
                    const saved = localStorage.getItem('webtools_ideas');
                    if (saved) {
                        this.ideas = JSON.parse(saved);
                    }
                    this.$watch('ideas', () => {
                        localStorage.setItem('webtools_ideas', JSON.stringify(this.ideas));
                    });
                },

                addIdea() {
                    if (!this.newIdea.trim()) return;

                    this.ideas.unshift({
                        id: Date.now(),
                        content: this.newIdea.trim(),
                        tags: [...this.selectedTags],
                        favorite: false,
                        createdAt: new Date().toISOString()
                    });

                    this.newIdea = '';
                    this.selectedTags = [];
                },

                deleteIdea(id) {
                    if (confirm('确定要删除这条灵感吗?')) {
                        this.ideas = this.ideas.filter(i => i.id !== id);
                    }
                },

                toggleFavorite(id) {
                    const idea = this.ideas.find(i => i.id === id);
                    if (idea) {
                        idea.favorite = !idea.favorite;
                    }
                },

                toggleQuickTag(tag) {
                    const index = this.selectedTags.indexOf(tag);
                    if (index > -1) {
                        this.selectedTags.splice(index, 1);
                    } else {
                        this.selectedTags.push(tag);
                    }
                },

                get filteredIdeas() {
                    let filtered = this.ideas;

                    // Search
                    if (this.searchQuery) {
                        const q = this.searchQuery.toLowerCase();
                        filtered = filtered.filter(i => i.content.toLowerCase().includes(q));
                    }

                    // Tag filter
                    if (this.filterTag) {
                        filtered = filtered.filter(i => i.tags.includes(this.filterTag));
                    }

                    // Sort
                    if (this.sortBy === 'oldest') {
                        filtered = [...filtered].reverse();
                    }

                    return filtered;
                },

                get allTags() {
                    const tags = new Set();
                    this.ideas.forEach(idea => {
                        idea.tags.forEach(tag => tags.add(tag));
                    });
                    return Array.from(tags).sort();
                },

                get weekCount() {
                    const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
                    return this.ideas.filter(i => new Date(i.createdAt).getTime() > weekAgo).length;
                },

                get favoriteCount() {
                    return this.ideas.filter(i => i.favorite).length;
                },

                formatDate(iso) {
                    const d = new Date(iso);
                    const now = new Date();
                    const diff = now - d;
                    
                    if (diff < 60000) return '刚刚';
                    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
                    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
                    if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
                    
                    return `${d.getMonth() + 1}/${d.getDate()}`;
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_idea_box.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
