<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视追踪 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" x-data="movieTracker()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                    🎬 影视追踪
                </h1>
            </div>
            <div class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full">
                已记录 <span x-text="movies.length"></span> 部
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 pb-24">
        
        <!-- Input Section -->
        <div class="glass rounded-2xl shadow-lg p-6 mb-8 border border-white/50">
            <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-lg text-indigo-500"></i>
                添加新影片
            </h2>
            <div class="flex gap-2">
                <input type="text" 
                       x-model="newMovie" 
                       @keydown.enter="addMovie()"
                       placeholder="输入电影/剧集名称..." 
                       class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all outline-none bg-white/50">
                <button @click="addMovie()" 
                        class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-xl shadow-lg hover:shadow-indigo-500/30 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                        :disabled="!newMovie.trim()">
                    添加
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="flex items-center gap-2 mb-6 overflow-x-auto pb-2 scrollbar-hide">
            <template x-for="filter in filters" :key="filter.value">
                <button @click="currentFilter = filter.value"
                        class="px-4 py-2 rounded-full text-sm font-medium transition-all whitespace-nowrap"
                        :class="currentFilter === filter.value 
                            ? 'bg-indigo-600 text-white shadow-md' 
                            : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'">
                    <span x-text="filter.label"></span>
                    <span class="ml-1 text-xs opacity-80" x-text="getCount(filter.value)"></span>
                </button>
            </template>
        </div>

        <!-- Movie List -->
        <div class="space-y-4">
            <template x-for="movie in filteredMovies" :key="movie.id">
                <div class="glass rounded-xl p-4 sm:p-5 border border-slate-200 shadow-sm hover:shadow-md transition-all group animate-in fade-in slide-in-from-bottom-4 duration-300">
                    <div class="flex flex-col sm:flex-row gap-4 sm:items-start justify-between">
                        
                        <!-- Movie Info -->
                        <div class="flex-1 space-y-2">
                            <div class="flex items-start justify-between">
                                <h3 class="text-lg font-bold text-slate-800 leading-tight" x-text="movie.title"></h3>
                                <button @click="deleteMovie(movie.id)" class="text-slate-400 hover:text-rose-500 transition-colors p-1 opacity-0 group-hover:opacity-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            
                            <div class="flex flex-wrap items-center gap-3">
                                <!-- Status Selector -->
                                <div class="relative group/status">
                                    <button class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium border transition-colors"
                                            :class="getStatusColor(movie.status)">
                                        <i :class="'fa-solid fa-' + getStatusIcon(movie.status)" class="text-sm"></i>
                                        <span x-text="getStatusLabel(movie.status)"></span>
                                        <i class="fa-solid fa-chevron-down text-xs opacity-50"></i>
                                    </button>
                                    
                                    <!-- Dropdown -->
                                    <div class="absolute top-full left-0 mt-1 w-32 bg-white rounded-lg shadow-xl border border-slate-100 overflow-hidden hidden group-hover/status:block z-10 p-1">
                                        <template x-for="s in statusOptions" :key="s.value">
                                            <button @click="updateStatus(movie.id, s.value)"
                                                    class="w-full text-left px-3 py-2 text-xs hover:bg-slate-50 rounded-md flex items-center gap-2"
                                                    :class="movie.status === s.value ? 'text-indigo-600 font-medium' : 'text-slate-600'">
                                                <i :class="'fa-solid fa-' + s.icon" class="text-sm"></i>
                                                <span x-text="s.label"></span>
                                            </button>
                                        </template>
                                    </div>
                                </div>

                                <span class="text-xs text-slate-400" x-text="formatDate(movie.updatedAt)"></span>
                            </div>

                            <!-- Comment & Rating -->
                            <div class="mt-3 flex flex-col sm:flex-row gap-3 pt-3 border-t border-slate-100/50">
                                <!-- Rating -->
                                <div class="flex items-center gap-1">
                                    <template x-for="star in 5">
                                        <button @click="updateRating(movie.id, star)" class="focus:outline-none transition-transform hover:scale-110">
                                             class="fa-solid fa-star text-lg transition-colors" 
                                               :class="star <= movie.rating ? 'fill-amber-400 text-amber-400' : 'text-slate-300'"></i>
                                        </button>
                                    </template>
                                </div>

                                <!-- Comment Input -->
                                <input type="text" 
                                       x-model.lazy="movie.comment" 
                                       @change="saveData()"
                                       placeholder="添加简短评价..." 
                                       class="flex-1 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-400 outline-none text-sm text-slate-600 placeholder-slate-400 py-0.5 transition-colors">
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Empty State -->
            <div x-show="filteredMovies.length === 0" class="text-center py-16" x-cloak>
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                    <i class="fa-solid fa-film text-4xl"></i>
                </div>
                <h3 class="text-lg font-medium text-slate-900">暂无影片</h3>
                <p class="text-slate-500 mt-1">
                    <span x-show="currentFilter === 'all'">开始记录你的观影之旅吧</span>
                    <span x-show="currentFilter !== 'all'">此列表下还没有影片</span>
                </p>
            </div>
        </div>
    </main>

    <script>
        function movieTracker() {
            return {
                movies: [],
                newMovie: '',
                currentFilter: 'all',
                
                filters: [
                    { label: '全部', value: 'all' },
                    { label: '想看', value: 'wish' },
                    { label: '在看', value: 'watching' },
                    { label: '已看', value: 'done' }
                ],
                
                statusOptions: [
                    { label: '想看', value: 'wish', icon: 'bookmark' },
                    { label: '在看', value: 'watching', icon: 'circle-play' },
                    { label: '已看', value: 'done', icon: 'circle-check' }
                ],

                init() {
                    const saved = localStorage.getItem('webtools_movies');
                    if (saved) {
                        this.movies = JSON.parse(saved);
                    } else {
                        // Demo data
                        this.movies = [
                            { 
                                id: Date.now(), 
                                title: '星际穿越 Interstellar', 
                                status: 'done', 
                                rating: 5, 
                                comment: '震撼人心的科幻史诗，配乐满分！', 
                                updatedAt: new Date().toISOString() 
                            }
                        ];
                    }
                    this.$watch('movies', () => {
                        this.saveData();
                    });
                    
                    // Refresh icons when DOM updates
                    this.$watch('filteredMovies', () => {
                        // icons auto update via class binding
                    });
                    
                    // init
                },

                saveData() {
                    localStorage.setItem('webtools_movies', JSON.stringify(this.movies));
                },

                addMovie() {
                    if (!this.newMovie.trim()) return;
                    
                    this.movies.unshift({
                        id: Date.now(),
                        title: this.newMovie.trim(),
                        status: 'wish',
                        rating: 0,
                        comment: '',
                        updatedAt: new Date().toISOString()
                    });
                    
                    this.newMovie = '';
                    this.newMovie = '';
                },

                deleteMovie(id) {
                    if (confirm('确定要删除这条记录吗？')) {
                        this.movies = this.movies.filter(m => m.id !== id);
                    }
                },

                updateStatus(id, newStatus) {
                    const movie = this.movies.find(m => m.id === id);
                    if (movie) {
                        movie.status = newStatus;
                        movie.updatedAt = new Date().toISOString();
                    }
                },

                updateRating(id, rating) {
                    const movie = this.movies.find(m => m.id === id);
                    if (movie) {
                        movie.rating = rating === movie.rating ? 0 : rating; // Toggle off if clicked again
                    }
                },

                get filteredMovies() {
                    if (this.currentFilter === 'all') return this.movies;
                    return this.movies.filter(m => m.status === this.currentFilter);
                },

                getCount(filter) {
                    if (filter === 'all') return this.movies.length;
                    return this.movies.filter(m => m.status === filter).length;
                },

                formatDate(isoString) {
                    const date = new Date(isoString);
                    return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
                },

                getStatusLabel(status) {
                    const option = this.statusOptions.find(o => o.value === status);
                    return option ? option.label : status;
                },

                getStatusIcon(status) {
                    const option = this.statusOptions.find(o => o.value === status);
                    return option ? option.icon : 'circle';
                },

                getStatusColor(status) {
                    switch(status) {
                        case 'wish': return 'bg-blue-50 text-blue-600 border-blue-200';
                        case 'watching': return 'bg-amber-50 text-amber-600 border-amber-200';
                        case 'done': return 'bg-emerald-50 text-emerald-600 border-emerald-200';
                        default: return 'bg-slate-50 text-slate-600 border-slate-200';
                    }
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_movie_tracker.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
