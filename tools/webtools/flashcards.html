<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识闪卡制作 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            backface-visibility: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-50 min-h-screen font-sans" x-data="flashcardApp()" x-init="init()">

    <header class="bg-white/80 backdrop-blur-md border-b border-purple-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-purple-50 text-purple-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                    🎴 知识闪卡制作
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <button @click="mode = 'manage'" :class="mode === 'manage' ? 'bg-purple-100 text-purple-700' : 'text-slate-600'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">
                    管理
                </button>
                <button @click="startStudy()" :class="mode === 'study' ? 'bg-purple-100 text-purple-700' : 'text-slate-600'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">
                    学习
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Manage Mode -->
        <div x-show="mode === 'manage'" x-transition>
            
            <!-- Add Card Form -->
            <div class="bg-white rounded-2xl shadow-sm border border-purple-100 p-6 mb-6">
                <h3 class="text-lg font-bold text-slate-800 mb-4">新增闪卡</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">分类</label>
                        <div class="flex gap-2">
                            <input 
                                type="text" 
                                x-model="newCard.category"
                                placeholder="例如：英语单词"
                                list="categories"
                                class="flex-1 px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none"
                            />
                            <datalist id="categories">
                                <template x-for="cat in categories" :key="cat">
                                    <option :value="cat"></option>
                                </template>
                            </datalist>
                        </div>
                    </div>
                    
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">正面 (问题)</label>
                            <textarea 
                                x-model="newCard.front"
                                placeholder="输入问题或单词"
                                rows="3"
                                class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none resize-none"
                            ></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">背面 (答案)</label>
                            <textarea 
                                x-model="newCard.back"
                                placeholder="输入答案或释义"
                                rows="3"
                                class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none resize-none"
                            ></textarea>
                        </div>
                    </div>
                </div>

                <button @click="addCard()" class="mt-4 w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white rounded-lg font-medium transition-all">
                    添加闪卡
                </button>
            </div>

            <!-- Cards List -->
            <div class="bg-white rounded-2xl shadow-sm border border-purple-100 p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-800">我的闪卡 (<span x-text="cards.length">0</span>)</h3>
                    <select x-model="filterCategory" class="px-3 py-1.5 border border-slate-200 rounded-lg text-sm">
                        <option value="">全部分类</option>
                        <template x-for="cat in categories" :key="cat">
                            <option :value="cat" x-text="cat"></option>
                        </template>
                    </select>
                </div>

                <div class="space-y-3">
                    <template x-for="card in filteredCards" :key="card.id">
                        <div class="bg-slate-50 rounded-lg p-4 border border-slate-200">
                            <div class="flex items-start justify-between gap-4">
                                <div class="flex-1">
                                    <div class="text-xs text-purple-600 font-medium mb-2" x-text="card.category"></div>
                                    <div class="grid md:grid-cols-2 gap-4">
                                        <div>
                                            <div class="text-xs text-slate-500 mb-1">正面</div>
                                            <div class="text-sm text-slate-800" x-text="card.front"></div>
                                        </div>
                                        <div>
                                            <div class="text-xs text-slate-500 mb-1">背面</div>
                                            <div class="text-sm text-slate-800" x-text="card.back"></div>
                                        </div>
                                    </div>
                                    <div class="mt-2 text-xs text-slate-400">
                                        复习次数: <span x-text="card.reviewCount">0</span> | 
                                        熟练度: <span :class="card.mastery >= 3 ? 'text-emerald-600' : 'text-amber-600'" x-text="card.mastery + '/5'"></span>
                                    </div>
                                </div>
                                <button @click="deleteCard(card.id)" class="text-slate-400 hover:text-rose-500 transition-colors">
                                    <i class="fa-solid fa-trash w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="filteredCards.length === 0" class="text-center py-12 text-slate-400">
                    <i class="fa-solid fa-layer-group w-12 h-12 mx-auto mb-3 text-slate-200"></i>
                    <p>还没有闪卡，开始创建吧</p>
                </div>
            </div>
        </div>

        <!-- Study Mode -->
        <div x-show="mode === 'study'" x-transition>
            
            <template x-if="studyCards.length > 0">
                <div>
                    <!-- Progress -->
                    <div class="bg-white rounded-xl p-4 mb-6 shadow-sm border border-purple-100">
                        <div class="flex justify-between text-sm text-slate-600 mb-2">
                            <span>学习进度</span>
                            <span><span x-text="currentIndex + 1">1</span> / <span x-text="studyCards.length">0</span></span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2">
                            <div 
                                class="bg-gradient-to-r from-purple-500 to-pink-500 h-2 rounded-full transition-all"
                                :style="'width: ' + ((currentIndex + 1) / studyCards.length * 100) + '%'"
                            ></div>
                        </div>
                    </div>

                    <!-- Flashcard -->
                    <div 
                        class="flip-card mb-6 cursor-pointer"
                        :class="{ 'flipped': isFlipped }"
                        @click="isFlipped = !isFlipped"
                    >
                        <div class="flip-card-inner relative">
                            <!-- Front -->
                            <div class="flip-card-front absolute inset-0 bg-gradient-to-br from-purple-500 to-pink-500 rounded-3xl p-8 flex items-center justify-center text-white shadow-2xl min-h-[400px]">
                                <div class="text-center">
                                    <div class="text-sm opacity-80 mb-4">正面</div>
                                    <div class="text-3xl font-bold mb-6" x-text="currentCard.front"></div>
                                    <div class="text-sm opacity-60">点击翻转查看答案</div>
                                </div>
                            </div>

                            <!-- Back -->
                            <div class="flip-card-back absolute inset-0 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-3xl p-8 flex items-center justify-center text-white shadow-2xl min-h-[400px]">
                                <div class="text-center">
                                    <div class="text-sm opacity-80 mb-4">背面</div>
                                    <div class="text-3xl font-bold mb-6" x-text="currentCard.back"></div>
                                    <div class="text-sm opacity-60">点击翻转返回</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-purple-100">
                        <div class="text-center mb-4 text-sm text-slate-600">掌握程度如何？</div>
                        <div class="grid grid-cols-3 gap-3">
                            <button 
                                @click="rateMastery(1)"
                                class="py-3 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-lg font-medium transition-colors"
                            >
                                😰 不熟悉
                            </button>
                            <button 
                                @click="rateMastery(3)"
                                class="py-3 bg-amber-100 hover:bg-amber-200 text-amber-700 rounded-lg font-medium transition-colors"
                            >
                                🤔 一般
                            </button>
                            <button 
                                @click="rateMastery(5)"
                                class="py-3 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-lg font-medium transition-colors"
                            >
                                😄 很熟悉
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="studyCards.length === 0">
                <div class="bg-white rounded-2xl p-12 text-center shadow-sm border border-purple-100">
                    <div class="w-20 h-20 mx-auto mb-4 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-circle-check w-10 h-10 text-purple-600"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">学习完成！</h3>
                    <p class="text-slate-600 mb-6">今天的闪卡已经全部复习完毕</p>
                    <button @click="mode = 'manage'" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors">
                        返回管理
                    </button>
                </div>
            </template>
        </div>
    </main>

    <script>
        function flashcardApp() {
            return {
                cards: [],
                mode: 'manage',
                filterCategory: '',
                isFlipped: false,
                currentIndex: 0,
                studyCards: [],
                newCard: {
                    category: '',
                    front: '',
                    back: ''
                },

                init() {
                    const saved = localStorage.getItem('webtools_flashcards');
                    if (saved) {
                        this.cards = JSON.parse(saved);
                    }
                    this.$watch('cards', () => {
                        localStorage.setItem('webtools_flashcards', JSON.stringify(this.cards));
                    });
                },

                addCard() {
                    if (!this.newCard.front || !this.newCard.back) {
                        alert('请填写正面和背面内容');
                        return;
                    }

                    this.cards.push({
                        id: Date.now(),
                        category: this.newCard.category || '未分类',
                        front: this.newCard.front.trim(),
                        back: this.newCard.back.trim(),
                        reviewCount: 0,
                        mastery: 0,
                        lastReview: null,
                        createdAt: new Date().toISOString()
                    });

                    this.newCard = { category: this.newCard.category, front: '', back: '' };
                },

                deleteCard(id) {
                    if (confirm('确定要删除这张闪卡吗？')) {
                        this.cards = this.cards.filter(c => c.id !== id);
                    }
                },

                startStudy() {
                    this.mode = 'study';
                    this.studyCards = [...this.cards].sort(() => Math.random() - 0.5);
                    this.currentIndex = 0;
                    this.isFlipped = false;
                },

                rateMastery(level) {
                    const card = this.cards.find(c => c.id === this.currentCard.id);
                    if (card) {
                        card.reviewCount++;
                        card.mastery = Math.min(5, Math.max(0, card.mastery + (level - 3)));
                        card.lastReview = new Date().toISOString();
                    }

                    this.currentIndex++;
                    this.isFlipped = false;

                    if (this.currentIndex >= this.studyCards.length) {
                        this.studyCards = [];
                    }
                },

                get categories() {
                    return [...new Set(this.cards.map(c => c.category))];
                },

                get filteredCards() {
                    if (!this.filterCategory) return this.cards;
                    return this.cards.filter(c => c.category === this.filterCategory);
                },

                get currentCard() {
                    return this.studyCards[this.currentIndex] || {};
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_flashcards.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
