<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL 生成器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-indigo-50 min-h-screen font-sans text-slate-800" x-data="sqlApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-indigo-100 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-indigo-50 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                    💿 SQL 生成器 (Create Table)
                </h1>
            </div>
            
            <div class="flex gap-2">
                 <button @click="reset()" class="px-4 py-2 text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors">重置</button>
                 <button @click="copySQL()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-copy"></i>
                    复制 SQL
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 pb-24 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Editor -->
        <div class="lg:col-span-7 space-y-4">
            
            <!-- Table Settings -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-indigo-100">
                <h2 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-gear text-indigo-500"></i>
                    基础设置
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">表名 (Table Name)</label>
                        <input type="text" x-model="tableName" class="w-full p-2 rounded-lg border border-slate-200 outline-none focus:border-indigo-500 font-mono" placeholder="users">
                    </div>
                    <div>
                         <label class="block text-xs font-bold text-slate-400 mb-1">数据库类型</label>
                         <select x-model="dbType" class="w-full p-2 rounded-lg border border-slate-200 outline-none focus:border-indigo-500 bg-white">
                             <option value="mysql">MySQL</option>
                             <option value="postgres">PostgreSQL</option>
                             <option value="sqlite">SQLite</option>
                             <option value="mssql">SQL Server</option>
                         </select>
                    </div>
                    <div class="col-span-2">
                         <label class="block text-xs font-bold text-slate-400 mb-1">表注释 (Comment)</label>
                         <input type="text" x-model="tableComment" class="w-full p-2 rounded-lg border border-slate-200 outline-none focus:border-indigo-500" placeholder="用户表">
                    </div>
                </div>
            </div>

            <!-- Columns -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-indigo-100">
                 <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-table-columns text-indigo-500"></i>
                        列定义
                    </h2>
                     <button @click="addColumn()" class="text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition-colors">+ 添加列</button>
                </div>

                <div class="space-y-3">
                    <template x-for="(col, index) in columns" :key="col.id">
                        <div class="p-3 bg-slate-50 rounded-lg border border-slate-100 relative group animate-fade-in">
                            <div class="flex flex-wrap gap-3 items-end pr-8">
                                <!-- Name -->
                                <div class="w-1/3 min-w-[120px] flex-1">
                                    <label class="text-[10px] text-slate-400 font-bold uppercase mb-0.5 block">列名</label>
                                    <input type="text" x-model="col.name" class="w-full p-1.5 text-sm rounded border border-slate-200 font-mono" placeholder="id">
                                </div>
                                <!-- Type -->
                                <div class="w-1/4 min-w-[100px]">
                                     <label class="text-[10px] text-slate-400 font-bold uppercase mb-0.5 block">类型</label>
                                     <select x-model="col.type" class="w-full p-1.5 text-sm rounded border border-slate-200 bg-white" @change="onTypeChange(col)">
                                         <optgroup label="Numeric">
                                             <option value="INT">INT</option>
                                             <option value="BIGINT">BIGINT</option>
                                             <option value="DECIMAL">DECIMAL</option>
                                             <option value="FLOAT">FLOAT</option>
                                             <option value="TINYINT">TINYINT</option>
                                         </optgroup>
                                         <optgroup label="String">
                                             <option value="VARCHAR">VARCHAR</option>
                                             <option value="TEXT">TEXT</option>
                                             <option value="CHAR">CHAR</option>
                                         </optgroup>
                                         <optgroup label="Date">
                                             <option value="DATETIME">DATETIME</option>
                                             <option value="DATE">DATE</option>
                                             <option value="TIMESTAMP">TIMESTAMP</option>
                                         </optgroup>
                                         <optgroup label="Other">
                                             <option value="BOOLEAN">BOOLEAN</option>
                                             <option value="JSON">JSON</option>
                                             <option value="UUID">UUID</option>
                                         </optgroup>
                                     </select>
                                </div>
                                <!-- Length -->
                                <div class="w-16" x-show="hasLength(col.type)">
                                    <label class="text-[10px] text-slate-400 font-bold uppercase mb-0.5 block">长度</label>
                                    <input type="number" x-model="col.length" class="w-full p-1.5 text-sm rounded border border-slate-200">
                                </div>
                                
                                <!-- Flags -->
                                <div class="flex items-center gap-3 pb-2 ml-2">
                                    <label class="flex items-center gap-1 cursor-pointer" title="Primary Key">
                                        <input type="checkbox" x-model="col.pk" class="rounded text-indigo-600 focus:ring-indigo-500">
                                        <span class="text-xs font-bold text-slate-500">PK</span>
                                    </label>
                                    <label class="flex items-center gap-1 cursor-pointer" title="Not Null">
                                        <input type="checkbox" x-model="col.nn" class="rounded text-indigo-600 focus:ring-indigo-500">
                                        <span class="text-xs font-bold text-slate-500">NN</span>
                                    </label>
                                    <label class="flex items-center gap-1 cursor-pointer" title="Auto Increment">
                                        <input type="checkbox" x-model="col.ai" class="rounded text-indigo-600 focus:ring-indigo-500">
                                        <span class="text-xs font-bold text-slate-500">AI</span>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="mt-2 flex gap-3">
                                 <input type="text" x-model="col.default" class="w-1/3 p-1.5 text-xs rounded border border-slate-200" placeholder="默认值 (NULL)">
                                 <input type="text" x-model="col.comment" class="flex-1 p-1.5 text-xs rounded border border-slate-200" placeholder="注释">
                            </div>

                            <button @click="removeColumn(index)" class="absolute top-2 right-2 text-slate-300 hover:text-rose-500 transition-colors">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </template>
                </div>
            </div>
            
            <div class="flex gap-2">
                 <button @click="addCommonColumns()" class="text-xs text-indigo-600 hover:underline px-2">
                     + 添加常用字段 (created_at, updated_at)
                 </button>
            </div>
        </div>

        <!-- Output -->
        <div class="lg:col-span-5 h-fit lg:sticky lg:top-24">
            <div class="bg-indigo-900 rounded-xl shadow-xl overflow-hidden flex flex-col h-[500px]">
                <div class="bg-indigo-950 px-4 py-3 flex justify-between items-center border-b border-indigo-800">
                    <span class="text-indigo-200 text-xs font-bold font-mono">SQL Preview</span>
                    <span class="text-indigo-400 text-xs" x-text="dbType.toUpperCase()"></span>
                </div>
                <div class="flex-1 overflow-auto p-4 custom-scrollbar">
                    <pre class="font-mono text-sm leading-relaxed"><code class="language-sql" x-html="highlightedSQL"></code></pre>
                </div>
            </div>
        </div>

    </main>

    <script>
        function sqlApp() {
            return {
                tableName: 'users',
                tableComment: '用户表',
                dbType: 'mysql',
                columns: [
                    { id: 1, name: 'id', type: 'BIGINT', length: '', pk: true, nn: true, ai: true, default: '', comment: '主键 ID' },
                    { id: 2, name: 'username', type: 'VARCHAR', length: '50', pk: false, nn: true, ai: false, default: '', comment: '用户名' },
                    { id: 3, name: 'status', type: 'TINYINT', length: '1', pk: false, nn: true, ai: false, default: '1', comment: '状态: 1启用 0禁用' }
                ],
                
                init() {

                },
                
                addColumn() {
                    this.columns.push({
                        id: Date.now(),
                        name: '',
                        type: 'VARCHAR',
                        length: '255',
                        pk: false,
                        nn: false,
                        ai: false,
                        default: '',
                        comment: ''
                    });

                },
                
                removeColumn(index) {
                    this.columns.splice(index, 1);
                },

                addCommonColumns() {
                    this.columns.push({
                         id: Date.now(), name: 'created_at', type: 'DATETIME', length: '', pk: false, nn: false, ai: false, default: 'CURRENT_TIMESTAMP', comment: '创建时间'
                    });
                    this.columns.push({
                         id: Date.now() + 1, name: 'updated_at', type: 'DATETIME', length: '', pk: false, nn: false, ai: false, default: 'CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP', comment: '更新时间'
                    });

                },
                
                reset() {
                    if(confirm("重置所有内容？")) {
                        this.tableName = 'untitled';
                        this.tableComment = '';
                        this.columns = [{ id: Date.now(), name: 'id', type: 'INT', length: '', pk: true, nn: true, ai: true, default: '', comment: '' }];
                    }
                },
                
                hasLength(type) {
                    return ['VARCHAR', 'CHAR', 'DECIMAL'].includes(type);
                },
                
                onTypeChange(col) {
                    if(col.type === 'VARCHAR') col.length = '255';
                    else if (col.type === 'INT') col.length = '';
                },

                copySQL() {
                    const sql = this.generateSQL();
                    navigator.clipboard.writeText(sql).then(() => alert('SQL 已复制！'));
                },

                generateSQL() {
                    let sql = `CREATE TABLE ${this.dbType === 'mysql' ? '`' + this.tableName + '`' : this.tableName} (\n`;
                    
                    const lines = [];
                    const pks = [];
                    
                    this.columns.forEach(col => {
                        let line = `  ${this.quote(col.name)} ${col.type}`;
                        
                        // Length
                        if (this.hasLength(col.type) && col.length) {
                            line += `(${col.length})`;
                        }
                        
                        // Unsigned (Simple logic for now)
                        if (['INT', 'BIGINT', 'TINYINT'].includes(col.type) && col.pk && this.dbType === 'mysql') {
                            line += ` UNSIGNED`;
                        }

                        // Auto Increment
                        if (col.ai) {
                            if (this.dbType === 'mysql') line += ` AUTO_INCREMENT`;
                            else if (this.dbType === 'sqlite') line += ` AUTOINCREMENT`; // Actually needs INTEGER PRIMARY KEY AUTOINCREMENT
                            else if (this.dbType === 'postgres') {
                                // PG uses SERIAL, usually implies type change, but keeping simple here
                                line += ` GENERATED ALWAYS AS IDENTITY`;
                            }
                        }

                        // Not Null
                        if (col.nn) line += ` NOT NULL`;

                        // Default
                        if (col.default) {
                            line += ` DEFAULT ${col.default}`;
                        } else if (!col.nn && !col.ai && !col.pk) {
                            line += ` DEFAULT NULL`; // optional
                        }

                        // Comment (MySQL)
                        if (col.comment && this.dbType === 'mysql') {
                            line += ` COMMENT '${col.comment}'`;
                        }
                        
                        if (col.pk) pks.push(col.name);
                        
                        lines.push(line);
                    });
                    
                    // PK Constraints
                    if (pks.length > 0 && this.dbType !== 'sqlite') { // Sqlite often defines inline
                        lines.push(`  PRIMARY KEY (${pks.map(p => this.quote(p)).join(', ')})`);
                    }

                    sql += lines.join(',\n');
                    sql += `\n)`;
                    
                    // Table Options
                    if (this.dbType === 'mysql') {
                        sql += ` ENGINE=InnoDB DEFAULT CHARSET=utf8mb4`;
                        if (this.tableComment) sql += ` COMMENT='${this.tableComment}'`;
                    }
                    
                    sql += `;\n`;
                    
                    // Comments for non-MySQL
                    if (this.dbType !== 'mysql' && this.tableComment) {
                         sql += `\n-- Table Comment: ${this.tableComment}\n`;
                         this.columns.forEach(col => {
                             if(col.comment) sql += `-- Column ${col.name}: ${col.comment}\n`;
                         });
                    }

                    return sql;
                },
                
                quote(name) {
                    if (this.dbType === 'mysql') return '`' + name + '`';
                    return '"' + name + '"';
                },

                get highlightedSQL() {
                    const sql = this.generateSQL();
                    // Simple highlighting
                    return sql
                        .replace(/(CREATE TABLE|PRIMARY KEY|NOT NULL|DEFAULT|AUTO_INCREMENT|UNSIGNED|COMMENT|ENGINE|CHARSET)/g, '<span class="text-indigo-400 font-bold">$1</span>')
                        .replace(/`([^`]+)`/g, '<span class="text-emerald-400">`$1`</span>')
                        .replace(/'([^']+)'/g, '<span class="text-orange-400">\'$1\'</span>');
                }
            }
        }
    </script>

</html>
