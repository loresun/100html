<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-900 min-h-screen text-white font-sans" x-data="passwordApp()" x-init="init()">

    <header class="bg-slate-800/50 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-700 text-slate-400 transition-colors">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <h1 class="text-xl font-bold">🔐 密码生成器</h1>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Password Generator -->
        <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-8 mb-8">
            <h2 class="text-2xl font-bold mb-6">生成强密码</h2>
            
            <!-- Generated Password Display -->
            <div class="bg-slate-900 rounded-xl p-6 mb-6 border border-slate-700">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm text-slate-400">生成的密码</span>
                    <div class="flex items-center gap-2">
                        <span class="text-xs px-2 py-1 rounded-full" :class="strengthClass" x-text="strengthText"></span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <input 
                        type="text" 
                        :value="generatedPassword"
                        readonly
                        class="flex-1 bg-transparent text-2xl font-mono text-emerald-400 outline-none select-all"
                        placeholder="点击生成密码"
                    />
                    <button 
                        @click="copyPassword(generatedPassword)"
                        class="p-3 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors"
                        title="复制"
                    >
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
            </div>

            <!-- Settings -->
            <div class="space-y-6 mb-6">
                <!-- Length -->
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-slate-300">密码长度</label>
                        <span class="text-sm text-emerald-400 font-mono" x-text="length"></span>
                    </div>
                    <input 
                        type="range" 
                        x-model.number="length"
                        min="8" 
                        max="64" 
                        step="1"
                        class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer"
                    />
                </div>

                <!-- Options -->
                <div class="grid md:grid-cols-2 gap-4">
                    <label class="flex items-center gap-3 p-4 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-emerald-500 transition-colors">
                        <input type="checkbox" x-model="includeUppercase" class="w-5 h-5 rounded bg-slate-700 border-slate-600 text-emerald-500 focus:ring-emerald-500">
                        <span>大写字母 (A-Z)</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-emerald-500 transition-colors">
                        <input type="checkbox" x-model="includeLowercase" class="w-5 h-5 rounded bg-slate-700 border-slate-600 text-emerald-500 focus:ring-emerald-500">
                        <span>小写字母 (a-z)</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-emerald-500 transition-colors">
                        <input type="checkbox" x-model="includeNumbers" class="w-5 h-5 rounded bg-slate-700 border-slate-600 text-emerald-500 focus:ring-emerald-500">
                        <span>数字 (0-9)</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-emerald-500 transition-colors">
                        <input type="checkbox" x-model="includeSymbols" class="w-5 h-5 rounded bg-slate-700 border-slate-600 text-emerald-500 focus:ring-emerald-500">
                        <span>特殊符号 (!@#$...)</span>
                    </label>
                </div>
            </div>

            <button 
                @click="generatePassword()"
                class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 rounded-xl font-bold text-lg transition-all transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2"
            >
                <i class="fa-solid fa-arrows-rotate"></i>
                生成密码
            </button>
        </div>

        <!-- Saved Passwords -->
        <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-8">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold">保存的密码</h2>
                <button 
                    @click="showAddModal = true"
                    class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg text-sm font-medium transition-colors flex items-center gap-2"
                >
                    <i class="fa-solid fa-plus"></i>
                    添加
                </button>
            </div>

            <div class="space-y-3">
                <template x-for="(item, index) in savedPasswords" :key="item.id">
                    <div class="bg-slate-900 rounded-xl p-4 border border-slate-700 hover:border-slate-600 transition-colors">
                        <div class="flex items-start justify-between gap-4">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-2">
                                    <h3 class="font-medium text-white truncate" x-text="item.name"></h3>
                                    <span class="text-xs text-slate-500" x-text="item.username"></span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <input 
                                        :type="item.visible ? 'text' : 'password'"
                                        :value="item.password"
                                        readonly
                                        class="flex-1 bg-slate-800 px-3 py-2 rounded-lg text-sm font-mono text-emerald-400 outline-none border border-slate-700"
                                    />
                                    <button 
                                        @click="item.visible = !item.visible"
                                        class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors"
                                    >
                                        <i :class="item.visible ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                                    </button>
                                    <button 
                                        @click="copyPassword(item.password)"
                                        class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors"
                                    >
                                        <i class="fa-solid fa-copy"></i>
                                    </button>
                                    <button 
                                        @click="deletePassword(index)"
                                        class="p-2 bg-slate-800 hover:bg-rose-600 rounded-lg transition-colors"
                                    >
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                                <div class="text-xs text-slate-500 mt-2" x-text="'创建于 ' + formatDate(item.createdAt)"></div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="savedPasswords.length === 0" class="text-center py-12 text-slate-500">
                <i class="fa-solid fa-lock text-5xl mx-auto mb-3 text-slate-700"></i>
                <p>还没有保存的密码</p>
            </div>
        </div>
    </main>

    <!-- Add Password Modal -->
    <div x-show="showAddModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" @click.self="showAddModal = false">
        <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl border border-slate-700">
            <h3 class="text-xl font-bold mb-4">添加密码</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">网站/应用名称</label>
                    <input 
                        type="text" 
                        x-model="newPassword.name"
                        placeholder="例如: GitHub"
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">用户名/邮箱</label>
                    <input 
                        type="text" 
                        x-model="newPassword.username"
                        placeholder="user@example.com"
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">密码</label>
                    <div class="flex gap-2">
                        <input 
                            type="text" 
                            x-model="newPassword.password"
                            placeholder="输入或生成密码"
                            class="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none"
                        />
                        <button 
                            @click="newPassword.password = generatedPassword"
                            class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg transition-colors"
                        >
                            使用生成的
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button @click="showAddModal = false" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors">
                    取消
                </button>
                <button @click="savePassword()" class="flex-1 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg transition-colors">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        function passwordApp() {
            return {
                length: 16,
                includeUppercase: true,
                includeLowercase: true,
                includeNumbers: true,
                includeSymbols: true,
                generatedPassword: '',
                savedPasswords: [],
                showAddModal: false,
                newPassword: {
                    name: '',
                    username: '',
                    password: ''
                },

                init() {
                    const saved = localStorage.getItem('webtools_passwords');
                    if (saved) {
                        this.savedPasswords = JSON.parse(saved);
                    }
                    this.generatePassword();
                    this.$watch('savedPasswords', () => {
                        localStorage.setItem('webtools_passwords', JSON.stringify(this.savedPasswords));
                    });
                    // init
                },

                generatePassword() {
                    let chars = '';
                    if (this.includeUppercase) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                    if (this.includeLowercase) chars += 'abcdefghijklmnopqrstuvwxyz';
                    if (this.includeNumbers) chars += '0123456789';
                    if (this.includeSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

                    if (!chars) {
                        this.generatedPassword = '';
                        return;
                    }

                    let password = '';
                    for (let i = 0; i < this.length; i++) {
                        password += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    this.generatedPassword = password;
                },

                copyPassword(password) {
                    navigator.clipboard.writeText(password).then(() => {
                        alert('密码已复制到剪贴板');
                    });
                },

                savePassword() {
                    if (!this.newPassword.name || !this.newPassword.password) {
                        alert('请填写名称和密码');
                        return;
                    }

                    this.savedPasswords.unshift({
                        id: Date.now(),
                        name: this.newPassword.name,
                        username: this.newPassword.username,
                        password: this.newPassword.password,
                        visible: false,
                        createdAt: new Date().toISOString()
                    });

                    this.newPassword = { name: '', username: '', password: '' };
                    this.showAddModal = false;
                },

                deletePassword(index) {
                    if (confirm('确定要删除这个密码吗？')) {
                        this.savedPasswords.splice(index, 1);
                    }
                },

                formatDate(iso) {
                    const d = new Date(iso);
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                },

                get strengthText() {
                    const len = this.generatedPassword.length;
                    const types = [this.includeUppercase, this.includeLowercase, this.includeNumbers, this.includeSymbols].filter(Boolean).length;
                    
                    if (len >= 16 && types >= 3) return '非常强';
                    if (len >= 12 && types >= 3) return '强';
                    if (len >= 8 && types >= 2) return '中等';
                    return '弱';
                },

                get strengthClass() {
                    const strength = this.strengthText;
                    if (strength === '非常强') return 'bg-emerald-500 text-white';
                    if (strength === '强') return 'bg-green-500 text-white';
                    if (strength === '中等') return 'bg-yellow-500 text-slate-900';
                    return 'bg-rose-500 text-white';
                }
            }
        }
    </script>

<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_password_manager.md"></script>

</body>
</html>
