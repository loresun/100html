    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背单词 (艾宾浩斯) | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
        .card-flip {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #7c3aed;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-violet-50 min-h-screen font-sans" x-data="vocabApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-violet-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-violet-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-600 to-indigo-600">
                    🧠 艾宾浩斯单词本
                </h1>
            </div>
            
            <div class="flex items-center gap-3">
                <button @click="showApiSettings = true" class="p-2 text-violet-600 hover:bg-violet-100 rounded-lg" title="AI设置">
                    <i class="fa-solid fa-robot w-5 h-5"></i>
                </button>
                <button @click="importWords()" class="p-2 text-violet-600 hover:bg-violet-100 rounded-lg" title="导入">
                    <i class="fa-solid fa-upload w-5 h-5"></i>
                </button>
                <button @click="exportWords()" class="p-2 text-violet-600 hover:bg-violet-100 rounded-lg" title="导出">
                    <i class="fa-solid fa-download w-5 h-5"></i>
                </button>
                <div class="bg-violet-100 text-violet-700 px-3 py-1 rounded-full text-xs font-medium">
                    待复习: <span x-text="reviewQueue.length"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-24">
        
        <!-- Navigation Tabs -->
        <div class="flex gap-4 mb-6 border-b border-violet-200">
            <template x-for="t in [
                { id: 'learn', label: '学习模式' },
                { id: 'list', label: '单词列表' },
                { id: 'add', label: '添加单词' },
                { id: 'ai', label: 'AI 生成', icon: 'wand-magic-sparkles' }
            ]">
                <button @click="tab = t.id" 
                        class="pb-2 px-3 text-sm font-medium transition-colors border-b-2 flex items-center gap-1.5"
                        :class="tab === t.id ? 'border-violet-600 text-violet-800' : 'border-transparent text-slate-500 hover:text-slate-700'">
                    <i x-show="t.icon" :class="'fa-solid fa-' + t.icon + ' w-3.5 h-3.5'"></i>
                    <span x-text="t.label"></span>
                </button>
            </template>
        </div>

        <!-- Learn Mode -->
        <div x-show="tab === 'learn'" class="space-y-6">
            <template x-if="reviewQueue.length === 0">
                <div class="text-center py-20 bg-white rounded-3xl shadow-sm border border-violet-100">
                    <div class="w-24 h-24 bg-violet-50 rounded-full flex items-center justify-center mx-auto mb-6 text-violet-400">
                        <i class="fa-solid fa-circle-check w-12 h-12"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">太棒了！</h2>
                    <p class="text-slate-500">当前没有需要复习的单词。</p>
                    <div class="flex justify-center gap-4 mt-8">
                        <button @click="tab = 'add'" class="px-6 py-3 bg-white text-violet-600 border border-violet-200 rounded-xl font-medium hover:bg-violet-50 transition-all">
                            手动添加
                        </button>
                        <button @click="tab = 'ai'" class="px-6 py-3 bg-gradient-to-r from-violet-600 to-indigo-600 text-white rounded-xl font-medium shadow-lg shadow-violet-500/30 hover:shadow-violet-500/50 transition-all flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles w-4 h-4"></i>
                             AI 生成
                        </button>
                    </div>
                </div>
            </template>

            <template x-if="reviewQueue.length > 0">
                <div class="max-w-xl mx-auto">
                    <!-- Progress -->
                    <div class="flex justify-between text-xs text-slate-400 mb-4 px-2">
                        <span>本次复习</span>
                        <span x-text="(currentReviewIndex + 1) + ' / ' + reviewQueue.length"></span>
                    </div>

                    <!-- Flashcard -->
                    <div class="card-flip h-80 w-full cursor-pointer group" @click="flipped = !flipped" :class="flipped ? 'card-flipped' : ''">
                        <div class="card-inner w-full h-full relative">
                            <!-- Front -->
                            <div class="card-front bg-white rounded-3xl shadow-xl border border-violet-100 flex flex-col items-center justify-center p-8">
                                <span class="text-xs font-bold uppercase tracking-widest text-violet-400 absolute top-6">Term</span>
                                <h2 class="text-4xl font-bold text-slate-800 text-center break-words w-full" x-text="currentCard.term"></h2>
                                <p class="text-slate-400 mt-4 text-sm">点击查看释义</p>
                            </div>

                            <!-- Back -->
                            <div class="card-back bg-slate-800 rounded-3xl shadow-xl flex flex-col items-center justify-center p-8 text-white">
                                <span class="text-xs font-bold uppercase tracking-widest text-slate-400 absolute top-6">Definition</span>
                                <h3 class="text-2xl font-bold text-center mb-4" x-text="currentCard.definition"></h3>
                                <p class="text-slate-300 text-center italic" x-show="currentCard.example" x-text="'“' + currentCard.example + '”'"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="mt-8 grid grid-cols-3 gap-4" x-show="flipped">
                        <button @click="processReview(0)" class="py-3 rounded-xl bg-rose-100 text-rose-600 font-bold hover:bg-rose-200 transition-colors">
                            忘记
                            <span class="block text-[10px] font-normal opacity-70">重置进度</span>
                        </button>
                        <button @click="processReview(1)" class="py-3 rounded-xl bg-amber-100 text-amber-600 font-bold hover:bg-amber-200 transition-colors">
                            模糊
                            <span class="block text-[10px] font-normal opacity-70">保持进度</span>
                        </button>
                        <button @click="processReview(2)" class="py-3 rounded-xl bg-emerald-100 text-emerald-600 font-bold hover:bg-emerald-200 transition-colors">
                            记得
                            <span class="block text-[10px] font-normal opacity-70">下个阶段</span>
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <!-- Add Mode -->
        <div x-show="tab === 'add'" class="max-w-xl mx-auto space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-slate-800 mb-4">手动添加</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">单词 / 短语</label>
                        <input type="text" x-model="newWord.term" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-violet-500 focus:ring-2 focus:ring-violet-200 outline-none" placeholder="e.g. Epiphany">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">释义</label>
                        <input type="text" x-model="newWord.definition" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-violet-500 focus:ring-2 focus:ring-violet-200 outline-none" placeholder="顿悟；突然的感悟">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">例句 (可选)</label>
                        <textarea x-model="newWord.example" rows="2" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-violet-500 focus:ring-2 focus:ring-violet-200 outline-none" placeholder="She had an epiphany..."></textarea>
                    </div>
                    <button @click="addWord()" 
                            :disabled="!newWord.term || !newWord.definition"
                            class="w-full py-3 bg-violet-600 text-white rounded-xl font-medium hover:bg-violet-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        添加单词
                    </button>
                </div>
            </div>
        </div>

        <!-- AI Mode -->
        <div x-show="tab === 'ai'" class="max-w-xl mx-auto space-y-6">
            
            <div x-show="!apiConfig.deepseek" class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl flex items-start gap-3">
                <i class="fa-solid fa-triangle-exclamation w-5 h-5 shrink-0 mt-0.5"></i>
                <div class="text-sm">
                    <p class="font-bold">未配置 API Key</p>
                    <p class="mt-1">请先点击右上角机器人图标配置 AI API Key，建议使用 DeepSeek 或 OpenAI 兼容接口。</p>
                    <button @click="showApiSettings = true" class="mt-2 text-amber-600 font-bold underline">去配置</button>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-3 opacity-10">
                    <i class="fa-solid fa-wand-magic-sparkles w-24 h-24 text-violet-600"></i>
                </div>
                
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2 relative z-10">
                    <i class="fa-solid fa-robot w-5 h-5 text-violet-500"></i>
                    AI 智能生成
                </h2>
                
                <div class="space-y-4 relative z-10">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">主题 / 场景</label>
                        <input type="text" x-model="ai.topic" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-violet-500 outline-none" placeholder="例如：商务英语、雅思高频、旅游场景...">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">难度等级</label>
                            <select x-model="ai.level" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-violet-500 outline-none bg-white">
                                <option value="入门">入门</option>
                                <option value="中级">中级</option>
                                <option value="高级">高级</option>
                                <option value="专业">专业</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">生成数量</label>
                            <select x-model="ai.count" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-violet-500 outline-none bg-white">
                                <option value="5">5 个</option>
                                <option value="10">10 个</option>
                                <option value="20">20 个</option>
                            </select>
                        </div>
                    </div>

                    <button @click="generateWords()" 
                            :disabled="ai.loading || !ai.topic || !apiConfig.deepseek"
                            class="w-full py-3 bg-gradient-to-r from-violet-600 to-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-violet-500/20 hover:shadow-violet-500/40 transition-all disabled:opacity-50 disabled:shadow-none flex items-center justify-center gap-2">
                        <span x-show="ai.loading" class="spinner"></span>
                        <span x-text="ai.loading ? 'AI 正在思考中...' : '开始生成'"></span>
                    </button>
                    
                    <div x-show="ai.error" class="text-sm text-rose-500 text-center" x-text="ai.error"></div>
                </div>
            </div>

            <!-- Generated Results -->
            <div x-show="ai.results.length > 0" class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <div class="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700">生成结果预览</h3>
                    <button @click="confirmAiWords()" class="text-sm font-bold text-violet-600 hover:text-violet-700">
                        全部添加
                    </button>
                </div>
                <div class="divide-y divide-slate-100 max-h-[400px] overflow-y-auto">
                    <template x-for="(w, idx) in ai.results" :key="idx">
                        <div class="p-4 hover:bg-slate-50 flex gap-3">
                            <input type="checkbox" x-model="w.selected" class="mt-1 rounded border-slate-300 text-violet-600 focus:ring-violet-500">
                            <div>
                                <div class="font-bold text-slate-800" x-text="w.term"></div>
                                <div class="text-sm text-slate-600" x-text="w.definition"></div>
                                <div class="text-xs text-slate-400 italic mt-0.5" x-text="w.example"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- List Mode -->
        <div x-show="tab === 'list'" class="space-y-4">
            <div class="flex gap-4">
                <input type="text" x-model="search" placeholder="搜索单词..." class="flex-1 px-4 py-2 rounded-xl border border-slate-200 focus:border-violet-500 outline-none">
                <div class="flex items-center gap-2 text-sm text-slate-500 bg-white px-3 border border-slate-200 rounded-xl">
                    <span>共 <span x-text="sortedWords.length"></span> 个</span>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <template x-for="word in sortedWords" :key="word.id">
                    <div class="border-b border-slate-100 last:border-0 p-4 hover:bg-slate-50 transition-colors flex justify-between items-center group">
                        <div>
                            <div class="font-bold text-slate-800" x-text="word.term"></div>
                            <div class="text-sm text-slate-600" x-text="word.definition"></div>
                            <div class="text-xs text-slate-400 mt-1 flex gap-2">
                                <span x-text="'阶段: ' + word.stage"></span>
                                <span x-show="word.nextReview" x-text="'下次复习: ' + formatDate(word.nextReview)"></span>
                            </div>
                        </div>
                        <button @click="deleteWord(word.id)" class="text-slate-300 hover:text-rose-500 p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-trash w-4 h-4"></i>
                        </button>
                    </div>
                </template>
                <div x-show="sortedWords.length === 0" class="p-8 text-center text-slate-400">
                    并没有找到任何单词
                </div>
            </div>
        </div>

    </main>

    <!-- API Settings Modal -->
    <div x-show="showApiSettings" x-cloak class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6" @click.away="showApiSettings = false">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-slate-900">API 配置</h3>
                <button @click="showApiSettings = false" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                    <input type="password" x-model="apiConfig.deepseek" placeholder="sk-..." class="w-full rounded-lg border-slate-300 border p-2 text-sm focus:border-violet-500 outline-none" />
                    <p class="text-xs text-slate-400 mt-1">从 DeepSeek 平台获取</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">模型选择</label>
                    <select x-model="apiConfig.model" class="w-full rounded-lg border-slate-300 border p-2 text-sm focus:border-violet-500 outline-none bg-white">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>
            </div>
            <button @click="saveApiConfig()" class="mt-6 w-full bg-violet-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-violet-700">保存配置</button>
        </div>
    </div>

    <script>
        function vocabApp() {
            return {
                tab: 'learn',
                words: [],
                search: '',
                currentReviewIndex: 0,
                flipped: false,
                
                showApiSettings: false,
                apiConfig: {
                    deepseek: '',
                    model: 'deepseek-v4-flash'
                },

                ai: {
                    topic: '',
                    level: '中级',
                    count: '10',
                    loading: false,
                    error: '',
                    results: []
                },
                
                newWord: {
                    term: '',
                    definition: '',
                    example: ''
                },
                
                intervals: [0, 12, 24, 48, 96, 168, 360, 720],

                init() {
                    const saved = localStorage.getItem('webtools_vocab');
                    if (saved) this.words = JSON.parse(saved);
                    else {
                        this.words = [
                            { id: 1, term: 'Serendipity', definition: '意外发现珍奇事物的本领', example: 'It was serendipity that we met.', stage: 0, nextReview: new Date().toISOString() }
                        ];
                    }

                    // Load global config based on AGENT.md
                    const savedConfig = localStorage.getItem('global_llm_config');
                    if (savedConfig) {
                        const parsed = JSON.parse(savedConfig);
                        this.apiConfig.deepseek = parsed.deepseek || '';
                        this.apiConfig.model = parsed.model || 'deepseek-v4-flash';
                    }

                    this.$watch('words', () => localStorage.setItem('webtools_vocab', JSON.stringify(this.words)));
                    
                    
                    
                    // Refresh icon when tab changes
                    
                },

                saveApiConfig() {
                    // Merge with existing global config
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...current,
                        deepseek: this.apiConfig.deepseek,
                        model: this.apiConfig.model
                    }));
                    this.showApiSettings = false;
                    alert('配置已保存 (Global)');
                },

                async generateWords() {
                    this.ai.loading = true;
                    this.ai.error = '';
                    this.ai.results = [];

                    try {
                        const prompt = `请生成 ${this.ai.count} 个关于"${this.ai.topic}"主题的英语单词，难度为${this.ai.level}。
请严格仅返回一个 JSON 数组，格式如下：
[
    {"term": "单词", "definition": "中文释义", "example": "英文例句"}
]
不要包含 markdown 格式标记 (如 \`\`\`json)，只返回纯 JSON 字符串。`;

                        // Use standard endpoint from AGENT.md
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model,
                                messages: [{ role: "user", content: prompt }],
                                stream: false
                            })
                        });

                        if (!response.ok) {
                            if (response.status === 401) throw new Error('API Key 无效');
                            throw new Error('API 请求失败: ' + response.status);
                        }

                        const data = await response.json();
                        let content = data.choices[0].message.content;
                        
                        // Simple cleanup if AI wraps in markdown
                        content = content.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim();

                        const words = JSON.parse(content);
                        if (!Array.isArray(words)) throw new Error('返回格式错误');

                        this.ai.results = words.map(w => ({ ...w, selected: true }));
                        
                    } catch (e) {
                        this.ai.error = e.message;
                        console.error(e);
                    } finally {
                        this.ai.loading = false;
                    }
                },

                confirmAiWords() {
                    const toAdd = this.ai.results.filter(w => w.selected);
                    if (toAdd.length === 0) return;

                    let count = 0;
                    toAdd.forEach(w => {
                        this.words.unshift({
                            id: Date.now() + Math.random(), // Unique enough
                            term: w.term,
                            definition: w.definition,
                            example: w.example,
                            stage: 0,
                            nextReview: new Date().toISOString()
                        });
                        count++;
                    });

                    this.ai.results = [];
                    this.ai.topic = '';
                    alert(`成功添加 ${count} 个单词！`);
                    this.tab = 'learn'; // Go to learn to see them
                },

                addWord() {
                    this.words.unshift({
                        id: Date.now(),
                        term: this.newWord.term,
                        definition: this.newWord.definition,
                        example: this.newWord.example,
                        stage: 0, 
                        nextReview: new Date().toISOString()
                    });
                    this.newWord = { term: '', definition: '', example: '' };
                    alert('添加成功！');
                    
                },

                deleteWord(id) {
                    if (confirm('确定删除这个单词吗？')) {
                        this.words = this.words.filter(w => w.id !== id);
                    }
                },

                // Review Logic
                get reviewQueue() {
                    const now = new Date();
                    return this.words.filter(w => new Date(w.nextReview) <= now);
                },

                get currentCard() {
                    if (this.reviewQueue.length === 0) return null;
                    return this.reviewQueue[0]; 
                },

                processReview(rating) {
                    const card = this.currentCard;
                    if (!card) return;

                    if (rating === 0) {
                        card.stage = 0;
                    } else if (rating === 2) {
                        card.stage = Math.min(card.stage + 1, this.intervals.length - 1);
                    }

                    const hoursToAdd = this.intervals[card.stage] || 24;
                    const jitter = hoursToAdd * 0.1 * (Math.random() - 0.5); 
                    const finalHours = hoursToAdd + jitter;
                    
                    const nextDate = new Date();
                    nextDate.setHours(nextDate.getHours() + finalHours);
                    card.nextReview = nextDate.toISOString();

                    this.flipped = false;
                },

                // List Logic
                get sortedWords() {
                    let list = this.words;
                    if (this.search) {
                        const q = this.search.toLowerCase();
                        list = list.filter(w => w.term.toLowerCase().includes(q) || w.definition.includes(q));
                    }
                    return list.sort((a, b) => new Date(b.id) - new Date(a.id));
                },

                // Utils
                formatDate(iso) {
                    const d = new Date(iso);
                    if (d < new Date()) return '现在';
                    return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
                },

                exportWords() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.words));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    downloadAnchorNode.setAttribute("download", "vocabulary.json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                },

                importWords() {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = e => {
                        const file = e.target.files[0];
                        const reader = new FileReader();
                        reader.onload = readerEvent => {
                            try {
                                const content = JSON.parse(readerEvent.target.result);
                                if (Array.isArray(content)) {
                                    this.words = [...content, ...this.words];
                                    alert(`成功导入 ${content.length} 个单词`);
                                }
                            } catch (err) {
                                alert('文件格式无效');
                            }
                        }
                        reader.readAsText(file);
                    }
                    input.click();
                }
            }
        }
    </script>
