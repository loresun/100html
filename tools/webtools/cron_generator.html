<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron 表达式生成器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .tab-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 700; color: #64748b; transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .tab-btn:hover { background-color: #f1f5f9; }
        .tab-btn.active { background-color: #e0f2fe; color: #0284c7; }
        .grid-select .item { width: 2.5rem; height: 2.5rem; display: flex; align-items: center; justify-content: center; border-radius: 0.25rem; border-width: 1px; border-color: #e2e8f0; font-size: 0.875rem; cursor: pointer; user-select: none; }
        .grid-select .item:hover { background-color: #f8fafc; }
        .grid-select .item.selected { background-color: #0ea5e9; color: white; border-color: #0ea5e9; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-sky-50 min-h-screen font-sans text-slate-800" x-data="cronApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-sky-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-sky-50 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left w-5 h-5"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600">
                ⏰ Cron 表达式生成器
            </h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-24">

        <!-- Result Display -->
        <div class="bg-slate-900 rounded-2xl p-6 shadow-xl shadow-sky-900/10 mb-8 text-center sticky top-20 z-40">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Cron Expression</div>
            <div class="flex items-center justify-center gap-4 mb-4">
                <div class="text-4xl md:text-5xl font-mono font-bold text-white tracking-wider cursor-pointer hover:text-sky-400 transition-colors"
                     @click="copy()" 
                     title="点击复制"
                     x-text="expression"></div>
            </div>
            <div class="text-sky-400 text-sm font-medium h-6" x-text="humanReadable"></div>
        </div>

        <!-- Editor -->
        <div class="bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden">
            <!-- Tabs -->
            <div class="flex flex-wrap gap-2 p-4 border-b border-slate-100 bg-slate-50/50">
                <button class="tab-btn" :class="tab === 'minute' && 'active'" @click="tab = 'minute'">分 (Minute)</button>
                <button class="tab-btn" :class="tab === 'hour' && 'active'" @click="tab = 'hour'">时 (Hour)</button>
                <button class="tab-btn" :class="tab === 'day' && 'active'" @click="tab = 'day'">日 (Day)</button>
                <button class="tab-btn" :class="tab === 'month' && 'active'" @click="tab = 'month'">月 (Month)</button>
                <button class="tab-btn" :class="tab === 'week' && 'active'" @click="tab = 'week'">周 (Week)</button>
            </div>

            <div class="p-6 min-h-[300px]">
                
                <!-- Minute -->
                <div x-show="tab === 'minute'">
                    <div class="space-y-4">
                         <label class="flex items-center gap-3">
                             <input type="radio" name="min_type" value="*" x-model="config.minute.type" class="accent-sky-500 w-5 h-5">
                             <span>每分钟 (*)</span>
                         </label>
                         
                         <label class="flex items-center gap-3">
                             <input type="radio" name="min_type" value="range" x-model="config.minute.type" class="accent-sky-500 w-5 h-5">
                             <div class="flex items-center gap-2">
                                 <span>周期：从第</span>
                                 <input type="number" min="0" max="59" x-model="config.minute.start" class="w-16 p-1 border rounded text-center">
                                 <span>分钟开始，每隔</span>
                                 <input type="number" min="1" max="59" x-model="config.minute.step" class="w-16 p-1 border rounded text-center">
                                 <span>分钟执行一次</span>
                             </div>
                         </label>
                         
                         <label class="flex items-start gap-3">
                             <input type="radio" name="min_type" value="select" x-model="config.minute.type" class="accent-sky-500 w-5 h-5 mt-1">
                             <div class="flex-1">
                                 <div class="mb-2">指定分钟：</div>
                                 <div class="flex flex-wrap gap-2 grid-select" :class="config.minute.type !== 'select' && 'opacity-50 pointer-events-none'">
                                     <template x-for="i in 60" :key="i-1">
                                         <div class="item" :class="isSelected('minute', i-1) && 'selected'" @click="toggleSelect('minute', i-1)" x-text="i-1"></div>
                                     </template>
                                 </div>
                             </div>
                         </label>
                    </div>
                </div>

                <!-- Hour -->
                 <div x-show="tab === 'hour'">
                    <div class="space-y-4">
                         <label class="flex items-center gap-3">
                             <input type="radio" name="hour_type" value="*" x-model="config.hour.type" class="accent-sky-500 w-5 h-5">
                             <span>每小时 (*)</span>
                         </label>
                         
                         <label class="flex items-start gap-3">
                             <input type="radio" name="hour_type" value="select" x-model="config.hour.type" class="accent-sky-500 w-5 h-5 mt-1">
                             <div class="flex-1">
                                 <div class="mb-2">指定小时：</div>
                                 <div class="flex flex-wrap gap-2 grid-select" :class="config.hour.type !== 'select' && 'opacity-50 pointer-events-none'">
                                     <template x-for="i in 24" :key="i-1">
                                         <div class="item" :class="isSelected('hour', i-1) && 'selected'" @click="toggleSelect('hour', i-1)" x-text="i-1"></div>
                                     </template>
                                 </div>
                             </div>
                         </label>
                    </div>
                </div>

                <!-- Day -->
                <div x-show="tab === 'day'">
                     <div class="space-y-4">
                         <label class="flex items-center gap-3">
                             <input type="radio" name="day_type" value="*" x-model="config.day.type" class="accent-sky-500 w-5 h-5">
                             <span>每日 (*)</span>
                         </label>
                         <label class="flex items-center gap-3">
                             <input type="radio" name="day_type" value="?" x-model="config.day.type" class="accent-sky-500 w-5 h-5">
                             <span>不指定 (?) <span class="text-xs text-slate-400">- 如果指定了"周"，这里必须为?</span></span>
                         </label>
    
                         <label class="flex items-start gap-3">
                             <input type="radio" name="day_type" value="select" x-model="config.day.type" class="accent-sky-500 w-5 h-5 mt-1">
                             <div class="flex-1">
                                 <div class="mb-2">指定日期：</div>
                                 <div class="flex flex-wrap gap-2 grid-select" :class="config.day.type !== 'select' && 'opacity-50 pointer-events-none'">
                                     <template x-for="i in 31" :key="i">
                                         <div class="item" :class="isSelected('day', i) && 'selected'" @click="toggleSelect('day', i)" x-text="i"></div>
                                     </template>
                                 </div>
                             </div>
                         </label>
                    </div>
                </div>
                
                 <!-- Month -->
                <div x-show="tab === 'month'">
                     <div class="space-y-4">
                         <label class="flex items-center gap-3">
                             <input type="radio" name="month_type" value="*" x-model="config.month.type" class="accent-sky-500 w-5 h-5">
                             <span>每月 (*)</span>
                         </label>
                         
                         <label class="flex items-start gap-3">
                             <input type="radio" name="month_type" value="select" x-model="config.month.type" class="accent-sky-500 w-5 h-5 mt-1">
                             <div class="flex-1">
                                 <div class="mb-2">指定月份：</div>
                                 <div class="flex flex-wrap gap-2 grid-select" :class="config.month.type !== 'select' && 'opacity-50 pointer-events-none'">
                                     <template x-for="i in 12" :key="i">
                                         <div class="item w-16" :class="isSelected('month', i) && 'selected'" @click="toggleSelect('month', i)" x-text="monthNames[i-1]"></div>
                                     </template>
                                 </div>
                             </div>
                         </label>
                    </div>
                </div>
                
                <!-- Week -->
                <div x-show="tab === 'week'">
                     <div class="space-y-4">
                         <label class="flex items-center gap-3">
                             <input type="radio" name="week_type" value="*" x-model="config.week.type" class="accent-sky-500 w-5 h-5">
                             <span>每周 (*)</span>
                         </label>
                         <label class="flex items-center gap-3">
                             <input type="radio" name="week_type" value="?" x-model="config.week.type" class="accent-sky-500 w-5 h-5">
                             <span>不指定 (?)</span>
                         </label>
                         
                         <label class="flex items-start gap-3">
                             <input type="radio" name="week_type" value="select" x-model="config.week.type" class="accent-sky-500 w-5 h-5 mt-1">
                             <div class="flex-1">
                                 <div class="mb-2">指定星期：</div>
                                 <div class="flex flex-wrap gap-2 grid-select" :class="config.week.type !== 'select' && 'opacity-50 pointer-events-none'">
                                     <template x-for="(day, index) in weekNames" :key="index + 1">
                                         <div class="item w-16" :class="isSelected('week', index + 1) && 'selected'" @click="toggleSelect('week', index + 1)" x-text="day"></div>
                                     </template>
                                 </div>
                             </div>
                         </label>
                    </div>
                </div>

            </div>
        </div>
        
        <!-- Examples -->
        <div class="mt-8">
            <h3 class="font-bold text-slate-500 mb-3 text-sm uppercase">常用示例</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <button @click="loadExample('* * * * *')" class="bg-white p-3 rounded-xl border border-slate-100 text-left hover:border-sky-300 transition-colors text-sm font-mono text-slate-600">
                    <span class="font-bold text-sky-600 mr-2">* * * * *</span>每分钟
                </button>
                 <button @click="loadExample('0 0 * * *')" class="bg-white p-3 rounded-xl border border-slate-100 text-left hover:border-sky-300 transition-colors text-sm font-mono text-slate-600">
                    <span class="font-bold text-sky-600 mr-2">0 0 * * *</span>每天午夜
                </button>
                 <button @click="loadExample('0 9-18 * * 1-5')" class="bg-white p-3 rounded-xl border border-slate-100 text-left hover:border-sky-300 transition-colors text-sm font-mono text-slate-600">
                    <span class="font-bold text-sky-600 mr-2">0 9-18 * * 1-5</span>工作日朝九晚六
                </button>
                <button @click="loadExample('0 */2 * * *')" class="bg-white p-3 rounded-xl border border-slate-100 text-left hover:border-sky-300 transition-colors text-sm font-mono text-slate-600">
                    <span class="font-bold text-sky-600 mr-2">0 */2 * * *</span>每隔2小时
                </button>
            </div>
        </div>

    </main>

    <script>
        function cronApp() {
            return {
                tab: 'minute',
                monthNames: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
                weekNames: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
                
                config: {
                    minute: { type: '*', start: 0, step: 5, selected: [] },
                    hour: { type: '*', selected: [] },
                    day: { type: '*', selected: [] },
                    month: { type: '*', selected: [] },
                    week: { type: '?', selected: [] }
                },

                init() {

                    // Sync day/week incompatibility
                    this.$watch('config.day.type', (val) => { if(val !== '?') this.config.week.type = '?'; });
                    this.$watch('config.week.type', (val) => { if(val !== '?') this.config.day.type = '?'; });
                },
                
                isSelected(field, val) {
                    return this.config[field].selected.includes(val);
                },
                
                toggleSelect(field, val) {
                    const arr = this.config[field].selected;
                    const idx = arr.indexOf(val);
                    if (idx > -1) arr.splice(idx, 1);
                    else {
                        arr.push(val);
                        arr.sort((a,b) => a-b);
                    }
                    this.config[field].type = 'select';
                },

                copy() {
                    navigator.clipboard.writeText(this.expression).then(() => alert('Copied!'));
                },

                get expression() {
                    const c = this.config;
                    
                    const getVal = (field) => {
                         const cfg = c[field];
                         if (cfg.type === '*') return '*';
                         if (cfg.type === '?') return '?';
                         if (cfg.type === 'range') return `${cfg.start}/${cfg.step}`;
                         if (cfg.type === 'select') return cfg.selected.length > 0 ? cfg.selected.join(',') : '*';
                         return '*';
                    };
                    
                    return `${getVal('minute')} ${getVal('hour')} ${getVal('day')} ${getVal('month')} ${getVal('week')}`;
                },
                
                get humanReadable() {
                    // Very simple parser for demo
                    const exp = this.expression;
                    if (exp === '* * * * *') return '每分钟执行';
                    if (exp.startsWith('0 0 * *')) return '每天 00:00 执行';
                    return 'Custom Schedule';
                },
                
                loadExample(cron) {
                    // This is a simple parser to populate the UI from string
                    // For full robustness we'd need a real cron parser library, 
                    // but here we just hardcode the logic for demo purposes or simplified parsing
                    const parts = cron.split(' ');
                    // Reset
                    this.config.minute.type = '*'; this.config.minute.selected = [];
                    this.config.hour.type = '*'; this.config.hour.selected = [];
                    this.config.day.type = '*'; this.config.day.selected = [];
                    this.config.month.type = '*'; this.config.month.selected = [];
                    this.config.week.type = '?'; this.config.week.selected = [];
                    
                    // Simple Apply (Incomplete, real parser is hard)
                    alert('Loaded example: ' + cron + '. (UI sync is limited in this simplified version)');
                }
            }
        }
    </script>

</body>
</html>
