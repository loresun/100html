<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能秒表 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
        .mono-num {
            font-family: 'Courier New', Courier, monospace;
            font-variant-numeric: tabular-nums;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-100" x-data="stopwatchApp()" x-init="init()">

    <!-- Header -->
    <header class="border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold text-white">
                    ⏱️ 秒表
                </h1>
            </div>
            <div class="flex gap-2 text-xs font-medium bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button @click="mode = 'stopwatch'" 
                        class="px-3 py-1 rounded transition-colors"
                        :class="mode === 'stopwatch' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'">
                    正计时
                </button>
                <button @click="mode = 'timer'" 
                        class="px-3 py-1 rounded transition-colors"
                        :class="mode === 'timer' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'">
                    倒计时
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-8 pb-24 h-[calc(100vh-64px)] flex flex-col">
        
        <!-- Display -->
        <div class="flex-1 flex flex-col items-center justify-center relative min-h-[300px]">
            
            <!-- Circle Progress (Timer Mode) -->
            <div x-show="mode === 'timer'" class="absolute inset-0 flex items-center justify-center -z-10 opacity-20">
                 <svg class="w-72 h-72 transform -rotate-90">
                    <circle cx="144" cy="144" r="140" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-700" />
                    <circle cx="144" cy="144" r="140" stroke="currentColor" stroke-width="8" fill="transparent" class="text-indigo-500 transition-all duration-1000 ease-linear" :stroke-dasharray="880" :stroke-dashoffset="880 - (timerProgress * 880)" />
                 </svg>
            </div>

            <div class="text-7xl font-bold tracking-tight mono-num text-white tabular-nums">
                <span x-text="formatDisplay().main">00:00.00</span>
            </div>
            <div class="text-xl text-slate-500 mt-2 font-medium mono-num" x-text="formatDisplay().sub">
                .00
            </div>

            <!-- Timer Input (when stopped and reset) -->
            <div x-show="mode === 'timer' && state === 'idle'" class="mt-8 flex gap-4">
                <div class="text-center">
                    <input type="number" x-model.number="timerInput.m" class="bg-slate-800 border-none text-white text-center rounded-lg w-20 py-2 text-xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="00">
                    <div class="text-xs text-slate-500 mt-1">分</div>
                </div>
                <div class="text-center">
                    <input type="number" x-model.number="timerInput.s" class="bg-slate-800 border-none text-white text-center rounded-lg w-20 py-2 text-xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="00">
                    <div class="text-xs text-slate-500 mt-1">秒</div>
                </div>
                <button @click="setTimer()" class="bg-indigo-600 px-4 rounded-lg flex items-center justify-center hover:bg-indigo-500">
                    <i class="fa-solid fa-check w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <template x-if="state === 'idle' || state === 'paused'">
                <button @click="start()" class="col-span-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full py-4 font-bold text-lg shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                    <span x-text="state === 'paused' ? '继续' : '开始'"></span>
                </button>
            </template>
            
            <template x-if="state === 'running'">
                <button @click="pause()" class="col-span-1 bg-amber-600 hover:bg-amber-500 text-white rounded-full py-4 font-bold text-lg shadow-lg shadow-amber-500/20 active:scale-95 transition-all">
                    暂停
                </button>
            </template>

            <button @click="reset()" 
                    :disabled="state === 'idle' && elapsed === 0 && (mode === 'stopwatch' || (mode === 'timer' && remaining === initialTimer))"
                    class="col-span-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-full py-4 font-bold text-lg transition-all">
                复位
            </button>
            
            <template x-if="mode === 'stopwatch'">
                <button @click="lap()" :disabled="state !== 'running'" class="col-span-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed text-slate-300 rounded-xl py-3 font-medium transition-all text-sm">
                    计次 (Lap)
                </button>
            </template>
        </div>

        <!-- Laps List -->
        <div x-show="mode === 'stopwatch' && laps.length > 0" class="flex-1 overflow-y-auto bg-slate-800/50 rounded-2xl p-4 space-y-2 border border-slate-700">
            <template x-for="(l, index) in laps.slice().reverse()" :key="index">
                <div class="flex justify-between items-center text-sm font-medium border-b border-slate-700 last:border-0 pb-2 last:pb-0">
                    <span class="text-slate-400" x-text="'Lap ' + (laps.length - index)"></span>
                    <span class="text-white mono-num" x-text="formatTime(l)"></span>
                </div>
            </template>
        </div>

    </main>

    <script>
        function stopwatchApp() {
            return {
                mode: 'stopwatch', // stopwatch, timer
                state: 'idle', // idle, running, paused
                
                startTime: 0,
                elapsed: 0,
                interval: null,
                
                laps: [],
                
                // Timer
                timerInput: { m: 1, s: 0 },
                initialTimer: 60000,
                remaining: 60000,

                init() {
                },

                // Logic
                start() {
                    if (this.state === 'running') return;
                    
                    this.startTime = Date.now() - (this.mode === 'stopwatch' ? this.elapsed : (this.initialTimer - this.remaining));
                    this.state = 'running';
                    
                    this.interval = requestAnimationFrame(this.tick.bind(this));
                },

                pause() {
                    this.state = 'paused';
                    cancelAnimationFrame(this.interval);
                },

                reset() {
                    this.pause();
                    this.state = 'idle';
                    
                    if (this.mode === 'stopwatch') {
                        this.elapsed = 0;
                        this.laps = [];
                    } else {
                        // Reset timer to input
                        this.setTimer();
                    }
                },

                tick() {
                    if (this.state !== 'running') return;

                    const now = Date.now();
                    const diff = now - this.startTime;

                    if (this.mode === 'stopwatch') {
                        this.elapsed = diff;
                    } else {
                        this.remaining = Math.max(0, this.initialTimer - diff);
                        if (this.remaining === 0) {
                            this.pause();
                            // Optional: Sound play
                            return;
                        }
                    }

                    this.interval = requestAnimationFrame(this.tick.bind(this));
                },

                lap() {
                    this.laps.push(this.elapsed);
                },

                setTimer() {
                    this.initialTimer = (this.timerInput.m * 60 + this.timerInput.s) * 1000;
                    this.remaining = this.initialTimer;
                    // Reset elapsed logic for timer
                    this.elapsed = 0; 
                },

                // Utils
                formatDisplay() {
                    const time = this.mode === 'stopwatch' ? this.elapsed : this.remaining;
                    const min = Math.floor(time / 60000);
                    const sec = Math.floor((time % 60000) / 1000);
                    const ms = Math.floor((time % 1000) / 10);

                    return {
                        main: `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`,
                        sub: `.${ms.toString().padStart(2, '0')}`
                    };
                },

                formatTime(msTime) {
                    const min = Math.floor(msTime / 60000);
                    const sec = Math.floor((msTime % 60000) / 1000);
                    const ms = Math.floor((msTime % 1000) / 10);
                    return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
                },
                
                get timerProgress() {
                    if (this.mode !== 'timer' || this.initialTimer === 0) return 0;
                    return this.remaining / this.initialTimer;
                }
            }
        }
    </script>

</body>
</html>
