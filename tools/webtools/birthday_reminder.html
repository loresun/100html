<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日提醒 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-pink-50 min-h-screen font-sans" x-data="birthdayApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-pink-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-pink-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-rose-500">
                    🎂 生日提醒
                </h1>
            </div>
            
             <button @click="showAddModal = true" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-lg shadow-lg shadow-pink-500/20 transition-all flex items-center gap-2">
                <i class="fa-solid fa-plus w-4 h-4"></i>
                <span class="hidden sm:inline">添加生日</span>
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 pb-24">

        <!-- Upcoming Highlights -->
        <div class="mb-8" x-show="upcomingBirthdays.length > 0">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-calendar-days w-5 h-5 text-pink-500"></i>
                近期生日
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <template x-for="bday in upcomingBirthdays.slice(0, 2)" :key="bday.id">
                    <div class="bg-gradient-to-br from-pink-500 to-rose-600 rounded-2xl p-6 text-white shadow-lg shadow-pink-500/20 relative overflow-hidden group">
                        <i class="fa-solid fa-cake-candles w-24 h-24 text-white/10 absolute -right-4 -bottom-4 rotate-12 group-hover:scale-110 transition-transform"></i>
                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <div class="text-pink-100 text-xs uppercase tracking-wider font-bold" x-text="getZodiac(bday.month, bday.day)"></div>
                                    <h3 class="text-2xl font-bold mt-1" x-text="bday.name"></h3>
                                </div>
                                <div class="bg-white/20 backdrop-blur-sm rounded-lg px-3 py-1.5 text-center">
                                    <div class="text-xs text-white/80">还有</div>
                                    <div class="font-bold text-xl leading-none" x-text="getDaysUntil(bday.month, bday.day)"></div>
                                    <div class="text-[10px] text-white/80">天</div>
                                </div>
                            </div>
                            <div class="text-pink-50 text-sm flex items-center gap-2">
                                <i class="fa-regular fa-calendar w-4 h-4"></i>
                                <span x-text="`${bday.month}月${bday.day}日`"></span>
                                <span x-show="bday.year" x-text="`(${getAge(bday.year)}岁)`"></span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Timeline List -->
        <div class="bg-white rounded-2xl shadow-sm border border-pink-100 overflow-hidden">
            <template x-for="(monthGroup, mIdx) in sortedGroups" :key="mIdx">
                <div>
                    <div class="bg-pink-50/50 px-4 py-2 text-sm font-bold text-pink-600 border-b border-pink-100 sticky top-16 backdrop-blur-md z-10 flex items-center gap-2">
                        <span x-text="monthNames[monthGroup.month - 1]"></span>
                    </div>
                    <div class="divide-y divide-slate-50">
                        <template x-for="bday in monthGroup.items" :key="bday.id">
                            <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition-colors group">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-full bg-slate-100 flex flex-col items-center justify-center border border-slate-200">
                                        <span class="text-xs text-slate-400 font-bold leading-none" x-text="monthNames[bday.month-1].substring(0,3)"></span>
                                        <span class="text-lg font-bold text-slate-800 leading-none mt-0.5" x-text="bday.day"></span>
                                    </div>
                                    <div>
                                        <div class="font-bold text-slate-800 text-lg" x-text="bday.name"></div>
                                        <div class="text-xs text-slate-400 flex items-center gap-1.5">
                                            <span x-text="getZodiac(bday.month, bday.day)"></span>
                                            <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                                            <span x-show="bday.year" x-text="`${bday.year}年出生 (${getAge(bday.year)}岁)`"></span>
                                            <span x-show="!bday.year">年份未知</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-4">
                                    <div class="text-right hidden sm:block">
                                        <div class="text-xs text-slate-400">还有</div>
                                        <div class="font-bold text-pink-500" x-text="getDaysUntil(bday.month, bday.day) + ' 天'"></div>
                                    </div>
                                    <button @click="deleteBday(bday.id)" class="text-slate-300 hover:text-rose-500 p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <i class="fa-solid fa-trash-can w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
            
            <div x-show="birthdays.length === 0" class="text-center py-20 text-slate-400">
                <i class="fa-regular fa-calendar-xmark w-12 h-12 mx-auto mb-4 opacity-50"></i>
                <p>还没有添加生日</p>
            </div>
        </div>

    </main>

    <!-- Add Modal -->
    <div x-show="showAddModal" x-cloak class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6" @click.away="showAddModal = false">
            <h3 class="text-lg font-bold text-slate-900 mb-4">添加生日</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">姓名</label>
                    <input type="text" x-model="newBday.name" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-200">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">月份</label>
                        <select x-model.number="newBday.month" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-pink-500 bg-white">
                            <template x-for="m in 12" :key="m">
                                <option :value="m" x-text="m + '月'"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">日期</label>
                        <select x-model.number="newBday.day" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-pink-500 bg-white">
                            <template x-for="d in 31" :key="d">
                                <option :value="d" x-text="d + '日'"></option>
                            </template>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">年份 (可选，用于计算年龄)</label>
                    <input type="number" x-model.number="newBday.year" placeholder="YYYY" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-pink-500">
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button @click="showAddModal = false" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-medium hover:bg-slate-200">取消</button>
                <button @click="addBday()" 
                        :disabled="!newBday.name"
                        class="flex-1 py-3 rounded-xl bg-pink-500 text-white font-medium hover:bg-pink-600 shadow-lg shadow-pink-500/20 disabled:opacity-50 disabled:shadow-none">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        function birthdayApp() {
            return {
                showAddModal: false,
                birthdays: [],
                monthNames: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'],
                
                newBday: {
                    name: '',
                    month: new Date().getMonth() + 1,
                    day: new Date().getDate(),
                    year: ''
                },

                init() {
                    const saved = localStorage.getItem('webtools_birthdays');
                    if (saved) {
                        this.birthdays = JSON.parse(saved);
                    } else {
                        // Demo
                        this.birthdays = [
                            { id: 1, name: '妈妈', month: 5, day: 20, year: 1970 },
                            { id: 2, name: '最好的朋友', month: 12, day: 25, year: 1995 }
                        ];
                    }
                    this.$watch('birthdays', () => {
                        localStorage.setItem('webtools_birthdays', JSON.stringify(this.birthdays));
                    });

                },

                deleteBday(id) {
                    if(confirm('确定删除吗？')) {
                        this.birthdays = this.birthdays.filter(b => b.id !== id);
                    }
                },

                getDaysUntil(m, d) {
                    const today = new Date();
                    const currentYear = today.getFullYear();
                    const next = new Date(currentYear, m - 1, d);
                    
                    if (next < today && (next.toDateString() !== today.toDateString())) {
                        next.setFullYear(currentYear + 1);
                    }
                    
                    const diff = next.getTime() - today.getTime();
                    return Math.ceil(diff / (1000 * 3600 * 24));
                },

                getAge(year) {
                    if (!year) return '';
                    const today = new Date();
                    return today.getFullYear() - year;
                },

                getZodiac(month, day) {
                    const signs = ["摩羯座", "水瓶座", "双鱼座", "白羊座", "金牛座", "双子座", "巨蟹座", "狮子座", "处女座", "天秤座", "天蝎座", "射手座"];
                    const dates = [20, 19, 20, 20, 21, 21, 22, 23, 23, 23, 22, 21];
                    let i = month - 1;
                    if (day > dates[i]) {
                        i = (i + 1) % 12;
                    }
                    return signs[i];
                },

                get upcomingBirthdays() {
                    return [...this.birthdays].sort((a, b) => {
                        return this.getDaysUntil(a.month, a.day) - this.getDaysUntil(b.month, b.day);
                    });
                },

                get sortedGroups() {
                    // Group by month
                    const groups = {};
                    this.upcomingBirthdays.forEach(b => {
                        if (!groups[b.month]) groups[b.month] = [];
                        groups[b.month].push(b);
                    });
                    
                    // Sort keys not by 1-12, but by upcoming order? 
                    // No, usually calendar view implies Jan-Dec (or relative to now).
                    // But "timeline list" might be better sorted by upcoming.
                    // Let's rely on upcoming order and group them dynamically in order of appearance.
                    
                    const result = [];
                    const addedMonths = new Set();
                    
                    this.upcomingBirthdays.forEach(b => {
                        if (!addedMonths.has(b.month)) {
                            result.push({
                                month: b.month,
                                items: this.upcomingBirthdays.filter(x => x.month === b.month)
                            });
                            addedMonths.add(b.month);
                        }
                    });
                    
                    return result;
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_birthday_reminder.md"></script>

</body>
</html>
