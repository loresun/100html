<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-slate-800" x-data="qrApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-gray-100 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left text-slate-600"></i>
            </a>
            <h1 class="text-xl font-bold text-slate-800">
                🔳 二维码生成器
            </h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-24 grid grid-cols-1 md:grid-cols-2 gap-8 items-start">

        <!-- Input -->
        <div class="space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <label class="block text-sm font-bold text-slate-500 uppercase mb-2">内容 (URL 或 文本)</label>
                <textarea 
                    x-model="text" 
                    @input.debounce.300ms="generate()"
                    class="w-full h-32 p-3 rounded-xl border border-gray-200 outline-none focus:border-black transition-colors resize-none"
                    placeholder="https://example.com"
                ></textarea>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <label class="block text-sm font-bold text-slate-500 uppercase mb-4">样式设置</label>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">前景色</label>
                        <div class="flex items-center gap-2">
                            <input type="color" x-model="colorDark" @change="generate()" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                            <span class="text-xs font-mono" x-text="colorDark"></span>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">背景色</label>
                        <div class="flex items-center gap-2">
                             <input type="color" x-model="colorLight" @change="generate()" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                             <span class="text-xs font-mono" x-text="colorLight"></span>
                        </div>
                    </div>
                </div>
                
                 <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-xs text-slate-400">尺寸</label>
                        <span class="text-xs font-mono" x-text="size + 'px'"></span>
                    </div>
                    <input type="range" x-model="size" @input="generate()" min="128" max="512" step="32" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-black">
                </div>
            </div>
        </div>

        <!-- Preview -->
        <div class="flex flex-col items-center justify-center p-8 bg-white rounded-3xl shadow-xl border border-gray-100 min-h-[400px]">
            <div id="qrcode" class="mb-6 p-4 bg-white rounded-lg shadow-sm"></div>
            
            <div class="flex gap-3" x-show="text">
                <button @click="download()" class="bg-black hover:bg-gray-800 text-white px-6 py-2.5 rounded-full font-bold shadow-lg transition-transform active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    下载图片的 PNG
                </button>
            </div>
            <div x-show="!text" class="text-slate-400 text-sm">
                输入内容预览二维码
            </div>
        </div>

    </main>

    <script>
        function qrApp() {
            return {
                text: 'https://webtools.example.com',
                colorDark: '#000000',
                colorLight: '#ffffff',
                size: 256,
                qrInstance: null,

                init() {
                    this.$nextTick(() => {
                        this.generate();
                    });
                },

                generate() {
                    const container = document.getElementById('qrcode');
                    container.innerHTML = '';
                    
                    if (!this.text) return;

                    // Using QRCode.js
                    try {
                        new QRCode(container, {
                            text: this.text,
                            width: parseInt(this.size),
                            height: parseInt(this.size),
                            colorDark : this.colorDark,
                            colorLight : this.colorLight,
                            correctLevel : QRCode.CorrectLevel.H
                        });
                    } catch(e) {
                        console.error(e);
                    }
                },

                download() {
                    const img = document.querySelector('#qrcode img');
                    if (img) {
                        const link = document.createElement('a');
                        link.download = `qrcode-${Date.now()}.png`;
                        link.href = img.src;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_qr_generator.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
