<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 预览器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .markdown-body { line-height: 1.6; }
        .markdown-body h1 { font-size: 2em; font-weight: bold; margin: 1em 0 0.5em; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.3em; }
        .markdown-body h2 { font-size: 1.5em; font-weight: bold; margin: 0.8em 0 0.4em; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3em; }
        .markdown-body h3 { font-size: 1.25em; font-weight: bold; margin: 0.6em 0 0.3em; }
        .markdown-body p { margin: 0.8em 0; }
        .markdown-body code { background: #f1f5f9; padding: 0.2em 0.4em; border-radius: 3px; font-family: monospace; font-size: 0.9em; }
        .markdown-body pre { background: #1e293b; color: #e2e8f0; padding: 1em; border-radius: 0.5em; overflow-x: auto; margin: 1em 0; }
        .markdown-body pre code { background: none; padding: 0; color: inherit; }
        .markdown-body ul, .markdown-body ol { margin: 0.8em 0; padding-left: 2em; }
        .markdown-body li { margin: 0.3em 0; }
        .markdown-body blockquote { border-left: 4px solid #cbd5e1; padding-left: 1em; margin: 1em 0; color: #64748b; }
        .markdown-body a { color: #3b82f6; text-decoration: underline; }
        .markdown-body table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        .markdown-body th, .markdown-body td { border: 1px solid #e2e8f0; padding: 0.5em; text-align: left; }
        .markdown-body th { background: #f8fafc; font-weight: bold; }
        .markdown-body img { max-width: 100%; height: auto; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" x-data="markdownApp()" x-init="init()">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <h1 class="text-xl font-bold text-slate-800">📝 Markdown 预览器</h1>
            </div>
            <div class="flex items-center gap-2">
                <button @click="view = 'split'" :class="view === 'split' ? 'bg-indigo-100 text-indigo-700' : 'text-slate-600'" class="px-3 py-1.5 rounded-lg text-sm transition-colors">
                    分屏
                </button>
                <button @click="view = 'preview'" :class="view === 'preview' ? 'bg-indigo-100 text-indigo-700' : 'text-slate-600'" class="px-3 py-1.5 rounded-lg text-sm transition-colors">
                    预览
                </button>
                <button @click="downloadHTML()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm transition-colors">
                    导出HTML
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <div class="grid gap-6" :class="view === 'split' ? 'md:grid-cols-2' : 'grid-cols-1'">
            
            <!-- Editor -->
            <div x-show="view === 'split'" class="bg-white rounded-xl border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                    <span class="font-medium text-sm text-slate-700">Markdown 编辑器</span>
                    <div class="flex items-center gap-2">
                        <button @click="loadTemplate()" class="text-xs text-indigo-600 hover:text-indigo-700">
                            加载示例
                        </button>
                        <button @click="markdown = ''" class="text-xs text-slate-500 hover:text-slate-700">
                            清空
                        </button>
                    </div>
                </div>
                <textarea 
                    x-model="markdown"
                    @input="updatePreview()"
                    placeholder="# 在这里输入 Markdown..."
                    class="w-full h-[calc(100vh-200px)] p-6 font-mono text-sm outline-none resize-none"
                ></textarea>
                <div class="bg-slate-50 px-4 py-2 border-t border-slate-200 text-xs text-slate-500">
                    字符数: <span x-text="markdown.length"></span> | 
                    行数: <span x-text="markdown.split('\\n').length"></span>
                </div>
            </div>

            <!-- Preview -->
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                    <span class="font-medium text-sm text-slate-700">预览</span>
                    <button @click="copyHTML()" class="text-xs text-indigo-600 hover:text-indigo-700">
                        复制HTML
                    </button>
                </div>
                <div class="h-[calc(100vh-200px)] overflow-auto p-6">
                    <div class="markdown-body prose max-w-none" x-html="html"></div>
                    <div x-show="!markdown" class="text-center py-20 text-slate-400">
                        <i class="fa-regular fa-file-lines text-5xl mx-auto mb-3 text-slate-200"></i>
                        <p>开始输入 Markdown 查看预览</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="mt-6 bg-white rounded-xl border border-slate-200 p-4">
            <div class="flex flex-wrap gap-2">
                <button @click="insertText('# ')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors">
                    H1
                </button>
                <button @click="insertText('## ')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors">
                    H2
                </button>
                <button @click="insertText('**', '**')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors">
                    <strong>粗体</strong>
                </button>
                <button @click="insertText('*', '*')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors">
                    <em>斜体</em>
                </button>
                <button @click="insertText('`', '`')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors font-mono">
                    代码
                </button>
                <button @click="insertText('[', '](url)')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors">
                    链接
                </button>
                <button @click="insertText('- ')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors">
                    列表
                </button>
                <button @click="insertText('> ')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors">
                    引用
                </button>
                <button @click="insertText('```\\n', '\\n```')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors">
                    代码块
                </button>
            </div>
        </div>
    </main>

    <script>
        function markdownApp() {
            return {
                markdown: '',
                html: '',
                view: 'split',

                init() {
                    // init
                    this.updatePreview();
                },

                updatePreview() {
                    if (typeof marked !== 'undefined') {
                        this.html = marked.parse(this.markdown);
                    }
                },

                insertText(before, after = '') {
                    const textarea = document.querySelector('textarea');
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    const selectedText = this.markdown.substring(start, end);
                    
                    const newText = this.markdown.substring(0, start) + 
                                   before + selectedText + after + 
                                   this.markdown.substring(end);
                    
                    this.markdown = newText;
                    this.updatePreview();
                    
                    this.$nextTick(() => {
                        textarea.focus();
                        textarea.setSelectionRange(start + before.length, start + before.length + selectedText.length);
                    });
                },

                loadTemplate() {
                    this.markdown = `# Markdown 示例文档

## 标题

这是一个段落。支持**粗体**、*斜体*和\`代码\`。

## 列表

- 项目 1
- 项目 2
  - 子项目 2.1
  - 子项目 2.2

## 代码块

\`\`\`javascript
function hello() {
  console.log("Hello, World!");
}
\`\`\`

## 引用

> 这是一段引用文本。

## 链接

[访问示例网站](https://example.com)

## 表格

| 列1 | 列2 | 列3 |
|-----|-----|-----|
| A   | B   | C   |
| 1   | 2   | 3   |
`;
                    this.updatePreview();
                },

                copyHTML() {
                    navigator.clipboard.writeText(this.html).then(() => {
                        alert('HTML 已复制到剪贴板');
                    });
                },

                downloadHTML() {
                    const fullHTML = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 文档</title>
    <style>
        body { max-width: 800px; margin: 2em auto; padding: 0 1em; font-family: sans-serif; line-height: 1.6; }
        h1 { border-bottom: 2px solid #e2e8f0; padding-bottom: 0.3em; }
        h2 { border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3em; }
        code { background: #f1f5f9; padding: 0.2em 0.4em; border-radius: 3px; }
        pre { background: #1e293b; color: #e2e8f0; padding: 1em; border-radius: 0.5em; overflow-x: auto; }
        blockquote { border-left: 4px solid #cbd5e1; padding-left: 1em; color: #64748b; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5em; }
        th { background: #f8fafc; }
    </style>
</head>
<body>
${this.html}
</body>
</html>`;

                    const blob = new Blob([fullHTML], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'document.html';
                    a.click();
                    URL.revokeObjectURL(url);
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_markdown_preview.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
