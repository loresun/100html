<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愿望清单 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-pink-50 min-h-screen font-sans" x-data="wishlistApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-pink-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-pink-100/50 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-rose-600">
                    🎁 愿望清单
                </h1>
            </div>
            
            <div class="bg-pink-100 text-pink-700 px-4 py-1 rounded-full text-xs font-bold">
                总预算: <span x-text="formatMoney(totalCost)"></span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-24">
        
        <!-- Add Item -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-pink-100 mb-8">
            <h2 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus w-5 h-5 text-pink-500"></i>
                添加心愿
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-500 mb-1">物品名称</label>
                    <input type="text" x-model="newItem.name" placeholder="想买什么？" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-pink-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">价格</label>
                    <input type="number" x-model.number="newItem.price" placeholder="0.00" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-pink-500 outline-none">
                </div>
                 <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">优先级</label>
                    <select x-model="newItem.priority" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-pink-500 outline-none bg-white">
                        <option value="3">🔥 必须买</option>
                        <option value="2">❤️ 很想要</option>
                        <option value="1">👀 再看看</option>
                    </select>
                </div>
                <div class="md:col-span-4 flex gap-4">
                    <input type="text" x-model="newItem.link" placeholder="链接地址 (可选)" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 focus:border-pink-500 outline-none text-sm">
                     <button @click="addItem()" 
                            :disabled="!newItem.name"
                            class="px-6 py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-xl font-medium transition-colors shadow-lg shadow-pink-500/20 disabled:opacity-50">
                        许愿
                    </button>
                </div>
            </div>
        </div>

        <!-- Filter / Tabs -->
        <div class="flex gap-4 mb-6 overflow-x-auto pb-2">
            <button @click="filter = 'all'" 
                    class="px-4 py-2 rounded-full text-sm font-medium transition-all whitespace-nowrap"
                    :class="filter === 'all' ? 'bg-pink-600 text-white shadow' : 'bg-white text-slate-600 border border-slate-200 hover:border-pink-200'">
                全部
            </button>
            <button @click="filter = 'active'" 
                    class="px-4 py-2 rounded-full text-sm font-medium transition-all whitespace-nowrap"
                    :class="filter === 'active' ? 'bg-pink-600 text-white shadow' : 'bg-white text-slate-600 border border-slate-200 hover:border-pink-200'">
                未完成
            </button>
            <button @click="filter = 'bought'" 
                    class="px-4 py-2 rounded-full text-sm font-medium transition-all whitespace-nowrap"
                    :class="filter === 'bought' ? 'bg-pink-600 text-white shadow' : 'bg-white text-slate-600 border border-slate-200 hover:border-pink-200'">
                已实现
            </button>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="item in filteredItems" :key="item.id">
                <div class="group relative bg-white rounded-2xl p-5 border border-slate-100 shadow-sm hover:shadow-md transition-all flex flex-col h-full" :class="item.bought ? 'opacity-60 bg-slate-50' : ''">
                    
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs font-bold px-2 py-1 rounded-lg"
                              :class="getPriorityClass(item.priority)">
                            <span x-text="getPriorityLabel(item.priority)"></span>
                        </span>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                             <a x-show="item.link" :href="item.link" target="_blank" class="text-slate-400 hover:text-indigo-600 p-1">
                                <i class="fa-solid fa-link w-4 h-4"></i>
                            </a>
                            <button @click="deleteItem(item.id)" class="text-slate-400 hover:text-rose-500 p-1">
                                <i class="fa-solid fa-trash w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <h3 class="font-bold text-slate-800 text-lg mb-1 flex-1" x-text="item.name" :class="item.bought ? 'line-through text-slate-400' : ''"></h3>
                    
                    <div class="text-2xl font-bold text-pink-600 mb-4" x-text="formatMoney(item.price)"></div>

                    <button @click="toggleBought(item)" 
                            class="w-full py-2 rounded-xl text-sm font-bold border transition-colors flex items-center justify-center gap-2"
                            :class="item.bought ? 'bg-emerald-100 border-emerald-200 text-emerald-600' : 'bg-white border-slate-200 text-slate-600 hover:border-pink-300 hover:text-pink-600'">
                        <i :class="item.bought ? 'fa-solid fa-circle-check' : 'fa-regular fa-circle'" class="w-4 h-4"></i>
                        <span x-text="item.bought ? '已实现' : '标记为已买'"></span>
                    </button>

                </div>
            </template>
        </div>

        <div x-show="filteredItems.length === 0" class="text-center py-20 text-slate-400">
            <div x-show="filter === 'all'" class="flex flex-col items-center">
                <i class="fa-solid fa-gift w-12 h-12 text-pink-200 mb-4"></i>
                <p>愿望清单是空的，快去许愿吧！</p>
            </div>
             <div x-show="filter !== 'all'">
                <p>这里什么都没有...</p>
            </div>
        </div>

    </main>

    <script>
        function wishlistApp() {
            return {
                items: [],
                filter: 'active', // all, active, bought
                
                newItem: {
                    name: '',
                    price: '',
                    priority: '2',
                    link: ''
                },

                init() {
                    const saved = localStorage.getItem('webtools_wishlist');
                    if (saved) {
                        this.items = JSON.parse(saved);
                    } else {
                        // Demo
                        this.items = [
                            { id: 1, name: 'Sony WH-1000XM5', price: 2499, priority: '3', link: '', bought: false, date: new Date().toISOString() },
                            { id: 2, name: 'Herman Miller Chair', price: 9000, priority: '3', link: '', bought: false, date: new Date().toISOString() },
                             { id: 3, name: 'Coffee Maker', price: 500, priority: '1', link: '', bought: true, date: new Date().toISOString() }
                        ];
                    }

                    this.$watch('items', () => {
                        localStorage.setItem('webtools_wishlist', JSON.stringify(this.items));
                    });

                    // icons removed
                },

                addItem() {
                    if (!this.newItem.name) return;

                    this.items.unshift({
                        id: Date.now(),
                        name: this.newItem.name,
                        price: parseFloat(this.newItem.price) || 0,
                        priority: this.newItem.priority,
                        link: this.newItem.link,
                        bought: false,
                        date: new Date().toISOString()
                    });

                    this.newItem = { name: '', price: '', priority: '2', link: '' };
                    this.$nextTick(() => { });
                },

                deleteItem(id) {
                    if (confirm('放弃这个愿望了？')) {
                        this.items = this.items.filter(i => i.id !== id);
                    }
                },

                toggleBought(item) {
                    item.bought = !item.bought;
                    // Force refresh visuals if needed
                    this.$nextTick(() => { });
                },

                get filteredItems() {
                    let list = this.items;
                    if (this.filter === 'active') list = list.filter(i => !i.bought);
                    if (this.filter === 'bought') list = list.filter(i => i.bought);
                    
                    // Sort: Active first, then Priority High->Low
                    return list.sort((a, b) => {
                       if (a.bought !== b.bought) return a.bought ? 1 : -1;
                       return b.priority - a.priority;
                    });
                },

                get totalCost() {
                    // Calculate cost of ACTIVE items only (usually what "budget needed" means)
                    // Or total cost of everything? Let's do Active items = Remaining Budget needed
                    return this.items.filter(i => !i.bought).reduce((acc, curr) => acc + curr.price, 0);
                },

                getPriorityLabel(p) {
                    if (p === '3') return '🔥 必须买';
                    if (p === '2') return '❤️ 很想要';
                    return '👀 再看看';
                },

                getPriorityClass(p) {
                    if (p === '3') return 'bg-rose-100 text-rose-600';
                    if (p === '2') return 'bg-pink-100 text-pink-600';
                    return 'bg-slate-100 text-slate-500';
                },

                formatMoney(amount) {
                    return '¥' + amount.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_wishlist.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
