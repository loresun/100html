<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订阅管理 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-indigo-50 min-h-screen font-sans text-slate-800" x-data="subApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-indigo-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-indigo-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                    💳 订阅管理
                </h1>
            </div>
            
            <button @click="showModal = true" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-lg shadow-lg shadow-indigo-600/20 transition-all">
                <i class="fa-solid fa-plus font-bold"></i>
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 pb-24">

        <!-- Summary Cards -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100 relative overflow-hidden group">
                <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <i class="fa-solid fa-calendar w-16 h-16 text-indigo-600"></i>
                </div>
                <div class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">每月支出</div>
                <div class="text-2xl font-bold text-slate-800">
                    <span class="text-sm">¥</span>
                    <span x-text="monthlyTotal.toFixed(2)"></span>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100 relative overflow-hidden group">
                <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <i class="fa-solid fa-piggy-bank w-16 h-16 text-indigo-600"></i>
                </div>
                <div class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">年度总计</div>
                <div class="text-2xl font-bold text-indigo-600">
                    <span class="text-sm">¥</span>
                    <span x-text="yearlyTotal.toFixed(2)"></span>
                </div>
            </div>
        </div>

        <!-- Sub List -->
        <div class="space-y-4">
            <div class="flex items-center justify-between px-2 text-xs font-bold text-slate-400 uppercase tracking-wider">
                <span>{subs.length} 个订阅</span>
                <span>排序: 价格</span>
            </div>
            
            <template x-for="sub in sortedSubs" :key="sub.id">
                <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm hover:shadow-md transition-all flex items-center justify-between group">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold text-white shadow-sm"
                             :class="getColor(sub.color)">
                            <span x-text="sub.name.charAt(0).toUpperCase()"></span>
                        </div>
                        <div>
                            <div class="font-bold text-slate-800 text-lg" x-text="sub.name"></div>
                            <div class="text-xs text-slate-400 flex items-center gap-2">
                                <span class="bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded" x-text="getCycleLabel(sub.cycle)"></span>
                                <span x-text="'下期: ' + getNextBillDate(sub)"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <div class="text-right">
                            <div class="font-bold text-slate-800" x-text="'¥' + sub.price"></div>
                            <div class="text-[10px] text-slate-400" x-text="'/' + (sub.cycle === 'yearly' ? '年' : '月')"></div>
                        </div>
                        <button @click="deleteSub(sub.id)" class="text-slate-300 hover:text-rose-500 p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            </template>
            
            <div x-show="subs.length === 0" class="text-center py-20 text-slate-400">
                <i class="fa-solid fa-credit-card text-5xl mx-auto mb-4 opacity-30"></i>
                <p>还没有订阅项目</p>
            </div>
        </div>

    </main>

    <!-- Add Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6" @click.away="showModal = false">
            <h3 class="text-lg font-bold text-slate-900 mb-4">添加订阅</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">名称 (如 Netflix, Spotify)</label>
                    <input type="text" x-model="form.name" class="w-full rounded-xl border border-slate-200 p-3 outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                         <label class="block text-xs font-medium text-slate-500 mb-1">金额 (¥)</label>
                         <input type="number" step="0.01" x-model="form.price" class="w-full rounded-xl border border-slate-200 p-3 outline-none focus:border-indigo-500 transition-colors">
                    </div>
                    <div>
                         <label class="block text-xs font-medium text-slate-500 mb-1">周期</label>
                         <select x-model="form.cycle" class="w-full rounded-xl border border-slate-200 p-3 outline-none focus:border-indigo-500 bg-white transition-colors">
                             <option value="monthly">每月</option>
                             <option value="yearly">每年</option>
                         </select>
                    </div>
                </div>
                <div>
                     <label class="block text-xs font-medium text-slate-500 mb-1">首次扣款日</label>
                     <input type="date" x-model="form.startDate" class="w-full rounded-xl border border-slate-200 p-3 outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-2">图标颜色</label>
                    <div class="flex justify-between px-2">
                        <template x-for="c in colors" :key="c">
                            <div @click="form.color = c" 
                                 class="w-6 h-6 rounded-full cursor-pointer transition-transform hover:scale-110 border-2"
                                 :class="[getBgColor(c), form.color === c ? 'border-slate-800' : 'border-transparent']"></div>
                        </template>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex gap-3">
                <button @click="showModal = false" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-medium hover:bg-slate-200">取消</button>
                <button @click="addSub()" 
                        :disabled="!form.name || !form.price"
                        class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 shadow-lg shadow-indigo-600/20 disabled:opacity-50 disabled:shadow-none transition-all">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        function subApp() {
            return {
                showModal: false,
                subs: [],
                colors: ['red', 'orange', 'green', 'blue', 'indigo', 'purple', 'black'],
                
                form: {
                    name: '',
                    price: '',
                    cycle: 'monthly',
                    startDate: new Date().toISOString().split('T')[0],
                    color: 'indigo'
                },

                init() {
                    const saved = localStorage.getItem('webtools_subscriptions');
                    if (saved) {
                        this.subs = JSON.parse(saved);
                    } else {
                        // Demo
                        this.subs = [
                            { id: 1, name: 'Netflix', price: 45, cycle: 'monthly', startDate: '2025-01-01', color: 'red' },
                            { id: 2, name: 'iCloud', price: 6, cycle: 'monthly', startDate: '2025-01-15', color: 'blue' }
                        ];
                    }

                    this.$watch('subs', () => {
                        localStorage.setItem('webtools_subscriptions', JSON.stringify(this.subs));
                    });
                    
                    // Icon refresh not needed for Font Awesome
                },

                addSub() {
                    this.subs.push({
                        id: Date.now(),
                        name: this.form.name,
                        price: parseFloat(this.form.price),
                        cycle: this.form.cycle,
                        startDate: this.form.startDate,
                        color: this.form.color
                    });
                    this.form = { name: '', price: '', cycle: 'monthly', startDate: new Date().toISOString().split('T')[0], color: 'indigo' };
                    this.showModal = false;
                    // Icon refresh not needed for Font Awesome
                },

                deleteSub(id) {
                    if(confirm('删除此订阅？')) {
                        this.subs = this.subs.filter(s => s.id !== id);
                    }
                },

                get sortedSubs() {
                    return [...this.subs].sort((a, b) => b.price - a.price);
                },

                get monthlyTotal() {
                    return this.subs.reduce((sum, s) => {
                        if (s.cycle === 'monthly') return sum + s.price;
                        if (s.cycle === 'yearly') return sum + (s.price / 12);
                        return sum;
                    }, 0);
                },

                get yearlyTotal() {
                    return this.monthlyTotal * 12;
                },
                
                getCycleLabel(c) {
                    return c === 'monthly' ? '月付' : '年付';
                },

                getNextBillDate(sub) {
                    const start = new Date(sub.startDate);
                    const today = new Date();
                    let next = new Date(start);
                    
                    while (next < today) {
                        if (sub.cycle === 'monthly') next.setMonth(next.getMonth() + 1);
                        else next.setFullYear(next.getFullYear() + 1);
                    }
                    
                    return `${next.getMonth()+1}/${next.getDate()}`;
                },

                getColor(c) {
                    const map = {
                        red: 'bg-rose-500', orange: 'bg-orange-500', green: 'bg-emerald-500', 
                        blue: 'bg-blue-500', indigo: 'bg-indigo-500', purple: 'bg-purple-500', black: 'bg-slate-800'
                    };
                    return map[c] || 'bg-indigo-500';
                },
                
                getBgColor(c) {
                    const map = {
                        red: 'bg-rose-500', orange: 'bg-orange-500', green: 'bg-emerald-500', 
                        blue: 'bg-blue-500', indigo: 'bg-indigo-500', purple: 'bg-purple-500', black: 'bg-slate-800'
                    };
                    return map[c] || 'bg-indigo-500';
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_subscription_manager.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
