<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睡眠质量追踪 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen font-sans" x-data="sleepApp()" x-init="init()">

    <header class="bg-white/80 backdrop-blur-md border-b border-indigo-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-indigo-50 text-indigo-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold text-indigo-600">😴 睡眠质量追踪</h1>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Quick Log -->
        <div class="bg-white rounded-2xl shadow-lg border border-indigo-100 p-6 mb-8">
            <h3 class="text-lg font-bold text-slate-800 mb-4">记录今晚睡眠</h3>
            
            <div class="grid md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">入睡时间</label>
                    <input 
                        type="time" 
                        x-model="newLog.bedtime"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">起床时间</label>
                    <input 
                        type="time" 
                        x-model="newLog.wakeup"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-2">睡眠质量</label>
                <div class="flex gap-2">
                    <template x-for="i in 5" :key="i">
                        <button 
                            @click="newLog.quality = i"
                            :class="newLog.quality >= i ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-400'"
                            class="flex-1 py-3 rounded-lg font-medium transition-all hover:scale-105"
                        >
                            <span x-text="['😫', '😕', '😐', '😊', '😄'][i-1]" class="text-2xl"></span>
                        </button>
                    </template>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-2">备注</label>
                <textarea 
                    x-model="newLog.note"
                    placeholder="记录影响睡眠的因素..."
                    rows="2"
                    class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none resize-none"
                ></textarea>
            </div>

            <button @click="addLog()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors">
                保存记录
            </button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">平均睡眠</div>
                <div class="text-2xl font-bold text-indigo-600" x-text="avgSleepHours + ' 小时'">0 小时</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">平均质量</div>
                <div class="text-2xl font-bold text-slate-800" x-text="avgQuality.toFixed(1) + ' / 5'">0 / 5</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">连续记录</div>
                <div class="text-2xl font-bold text-emerald-600" x-text="streakDays + ' 天'">0 天</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">总记录</div>
                <div class="text-2xl font-bold text-slate-800" x-text="logs.length">0</div>
            </div>
        </div>

        <!-- Chart -->
        <div class="bg-white rounded-2xl shadow-sm border border-indigo-100 p-6 mb-8">
            <h3 class="text-lg font-bold text-slate-800 mb-4">睡眠趋势</h3>
            <canvas id="sleepChart" class="max-h-64"></canvas>
        </div>

        <!-- Recent Logs -->
        <div class="bg-white rounded-2xl shadow-sm border border-indigo-100 p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">最近记录</h3>
            
            <div class="space-y-3">
                <template x-for="log in recentLogs" :key="log.id">
                    <div class="bg-slate-50 rounded-lg p-4 border border-slate-200">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="text-2xl" x-text="['😫', '😕', '😐', '😊', '😄'][log.quality-1]">😊</span>
                                    <div>
                                        <div class="font-medium text-slate-800" x-text="formatDate(log.date)">日期</div>
                                        <div class="text-sm text-slate-500">
                                            <span x-text="log.bedtime">22:00</span> - <span x-text="log.wakeup">07:00</span>
                                            (<span x-text="log.duration + ' 小时'">8 小时</span>)
                                        </div>
                                    </div>
                                </div>
                                <p class="text-sm text-slate-600" x-show="log.note" x-text="log.note"></p>
                            </div>
                            <button @click="deleteLog(log.id)" class="text-slate-400 hover:text-rose-500 transition-colors">
                                <i class="fa-solid fa-trash w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="logs.length === 0" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-moon w-12 h-12 mx-auto mb-3 text-slate-200"></i>
                <p>还没有睡眠记录</p>
            </div>
        </div>
    </main>

    <script>
        function sleepApp() {
            return {
                logs: [],
                chart: null,
                newLog: {
                    bedtime: '23:00',
                    wakeup: '07:00',
                    quality: 4,
                    note: ''
                },

                init() {
                    const saved = localStorage.getItem('webtools_sleep');
                    if (saved) {
                        this.logs = JSON.parse(saved);
                    }
                    this.$watch('logs', () => {
                        localStorage.setItem('webtools_sleep', JSON.stringify(this.logs));
                        this.$nextTick(() => {
                            this.renderChart();
                        });
                    });
                    this.$nextTick(() => {
                        this.renderChart();
                    });
                },

                addLog() {
                    const duration = this.calculateDuration(this.newLog.bedtime, this.newLog.wakeup);
                    
                    this.logs.unshift({
                        id: Date.now(),
                        date: new Date().toISOString().split('T')[0],
                        bedtime: this.newLog.bedtime,
                        wakeup: this.newLog.wakeup,
                        duration: duration,
                        quality: this.newLog.quality,
                        note: this.newLog.note.trim(),
                        createdAt: new Date().toISOString()
                    });

                    this.newLog.note = '';
                },

                deleteLog(id) {
                    if (confirm('确定要删除这条记录吗？')) {
                        this.logs = this.logs.filter(l => l.id !== id);
                    }
                },

                calculateDuration(bedtime, wakeup) {
                    const [bh, bm] = bedtime.split(':').map(Number);
                    const [wh, wm] = wakeup.split(':').map(Number);
                    
                    let bedMinutes = bh * 60 + bm;
                    let wakeMinutes = wh * 60 + wm;
                    
                    if (wakeMinutes < bedMinutes) {
                        wakeMinutes += 24 * 60;
                    }
                    
                    return ((wakeMinutes - bedMinutes) / 60).toFixed(1);
                },

                formatDate(dateStr) {
                    const d = new Date(dateStr);
                    const today = new Date().toISOString().split('T')[0];
                    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                    
                    if (dateStr === today) return '今天';
                    if (dateStr === yesterday) return '昨天';
                    return `${d.getMonth() + 1}/${d.getDate()}`;
                },

                renderChart() {
                    const canvas = document.getElementById('sleepChart');
                    if (!canvas) return;

                    if (this.chart) {
                        this.chart.destroy();
                    }

                    const recent = this.logs.slice(0, 14).reverse();
                    
                    this.chart = new Chart(canvas, {
                        type: 'line',
                        data: {
                            labels: recent.map(l => this.formatDate(l.date)),
                            datasets: [{
                                label: '睡眠时长 (小时)',
                                data: recent.map(l => l.duration),
                                borderColor: '#6366f1',
                                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            plugins: {
                                legend: {
                                    display: false
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 12
                                }
                            }
                        }
                    });
                },

                get recentLogs() {
                    return this.logs.slice(0, 10);
                },

                get avgSleepHours() {
                    if (this.logs.length === 0) return 0;
                    const sum = this.logs.reduce((acc, log) => acc + parseFloat(log.duration), 0);
                    return (sum / this.logs.length).toFixed(1);
                },

                get avgQuality() {
                    if (this.logs.length === 0) return 0;
                    const sum = this.logs.reduce((acc, log) => acc + log.quality, 0);
                    return sum / this.logs.length;
                },

                get streakDays() {
                    let streak = 0;
                    const today = new Date();
                    
                    for (let i = 0; i < this.logs.length; i++) {
                        const logDate = new Date(this.logs[i].date);
                        const expectedDate = new Date(today);
                        expectedDate.setDate(today.getDate() - i);
                        
                        if (logDate.toDateString() === expectedDate.toDateString()) {
                            streak++;
                        } else {
                            break;
                        }
                    }
                    
                    return streak;
                }
            }
        }
    </script>

<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_sleep_cycle.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
