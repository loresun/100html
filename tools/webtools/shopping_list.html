<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能购物清单 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" x-data="shoppingApp()" x-init="init()">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold text-slate-800">🛒 智能购物清单</h1>
            </div>
            <button @click="showAddModal = true" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors flex items-center gap-2">
                <i class="fa-solid fa-plus"></i>
                添加
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">待购买</div>
                <div class="text-2xl font-bold text-amber-600" x-text="stats.pending">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">已购买</div>
                <div class="text-2xl font-bold text-emerald-600" x-text="stats.bought">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">预算</div>
                <div class="text-2xl font-bold text-slate-800">¥<span x-text="totalPrice.toFixed(2)">0</span></div>
            </div>
        </div>

        <!-- Category Tabs -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6">
            <div class="flex overflow-x-auto border-b border-slate-200">
                <button 
                    @click="activeCategory = ''"
                    :class="activeCategory === '' ? 'border-b-2 border-emerald-500 text-emerald-600' : 'text-slate-600'"
                    class="px-4 py-3 font-medium whitespace-nowrap transition-colors"
                >
                    全部 (<span x-text="items.length">0</span>)
                </button>
                <template x-for="cat in categories" :key="cat">
                    <button 
                        @click="activeCategory = cat"
                        :class="activeCategory === cat ? 'border-b-2 border-emerald-500 text-emerald-600' : 'text-slate-600'"
                        class="px-4 py-3 font-medium whitespace-nowrap transition-colors"
                    >
                        <span x-text="cat"></span> (<span x-text="getCategoryCount(cat)">0</span>)
                    </button>
                </template>
            </div>

            <!-- Items List -->
            <div class="p-6">
                <div class="space-y-2">
                    <template x-for="item in filteredItems" :key="item.id">
                        <div 
                            :class="item.bought ? 'bg-slate-50 opacity-60' : 'bg-white'"
                            class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 hover:shadow-md transition-all"
                        >
                            <input 
                                type="checkbox" 
                                x-model="item.bought"
                                class="w-5 h-5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"
                            />
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2">
                                    <span 
                                        :class="item.bought ? 'line-through text-slate-400' : 'text-slate-800'"
                                        class="font-medium"
                                        x-text="item.name"
                                    ></span>
                                    <span class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full" x-text="item.category"></span>
                                </div>
                                <div class="flex items-center gap-3 text-sm text-slate-500 mt-1">
                                    <span>数量: <span x-text="item.quantity"></span></span>
                                    <span x-show="item.price">单价: ¥<span x-text="item.price"></span></span>
                                    <span x-show="item.price" class="font-medium text-emerald-600">
                                        小计: ¥<span x-text="(item.price * item.quantity).toFixed(2)"></span>
                                    </span>
                                </div>
                            </div>
                            <button @click="deleteItem(item.id)" class="text-slate-400 hover:text-rose-500 transition-colors">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </template>
                </div>

                <div x-show="filteredItems.length === 0" class="text-center py-12 text-slate-400">
                    <i class="fa-solid fa-cart-shopping text-5xl mx-auto mb-3 text-slate-200"></i>
                    <p>这个分类还没有商品</p>
                </div>
            </div>
        </div>

        <!-- Quick Add -->
        <div class="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-xl p-6 border border-emerald-100">
            <h4 class="font-bold text-emerald-900 mb-3">快速添加</h4>
            <div class="flex gap-2">
                <input 
                    type="text" 
                    x-model="quickAdd"
                    @keydown.enter="addQuickItem()"
                    placeholder="输入商品名称后回车"
                    class="flex-1 px-4 py-2 border border-emerald-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                />
                <button @click="addQuickItem()" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors">
                    添加
                </button>
            </div>
        </div>
    </main>

    <!-- Add Modal -->
    <div x-show="showAddModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" @click.self="showAddModal = false">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold text-slate-800 mb-4">添加商品</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">商品名称</label>
                    <input 
                        type="text" 
                        x-model="newItem.name"
                        placeholder="例如：牛奶"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">分类</label>
                    <input 
                        type="text" 
                        x-model="newItem.category"
                        list="categoryList"
                        placeholder="例如：食品"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                    />
                    <datalist id="categoryList">
                        <option value="食品"></option>
                        <option value="日用品"></option>
                        <option value="电子产品"></option>
                        <option value="服装"></option>
                        <option value="其他"></option>
                    </datalist>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">数量</label>
                        <input 
                            type="number" 
                            x-model.number="newItem.quantity"
                            min="1"
                            class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                        />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">单价 (¥)</label>
                        <input 
                            type="number" 
                            x-model.number="newItem.price"
                            step="0.01"
                            placeholder="可选"
                            class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                        />
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button @click="showAddModal = false" class="flex-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">
                    取消
                </button>
                <button @click="addItem()" class="flex-1 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors">
                    添加
                </button>
            </div>
        </div>
    </div>

    <script>
        function shoppingApp() {
            return {
                items: [],
                activeCategory: '',
                showAddModal: false,
                quickAdd: '',
                newItem: {
                    name: '',
                    category: '食品',
                    quantity: 1,
                    price: null
                },

                init() {
                    const saved = localStorage.getItem('webtools_shopping');
                    if (saved) {
                        this.items = JSON.parse(saved);
                    }
                    this.$watch('items', () => {
                        localStorage.setItem('webtools_shopping', JSON.stringify(this.items));
                    });

                },

                addItem() {
                    if (!this.newItem.name.trim()) {
                        alert('请输入商品名称');
                        return;
                    }

                    this.items.push({
                        id: Date.now(),
                        name: this.newItem.name.trim(),
                        category: this.newItem.category || '其他',
                        quantity: this.newItem.quantity || 1,
                        price: this.newItem.price || 0,
                        bought: false,
                        createdAt: new Date().toISOString()
                    });

                    this.newItem = { name: '', category: '食品', quantity: 1, price: null };
                    this.showAddModal = false;
                },

                addQuickItem() {
                    if (!this.quickAdd.trim()) return;

                    this.items.push({
                        id: Date.now(),
                        name: this.quickAdd.trim(),
                        category: '其他',
                        quantity: 1,
                        price: 0,
                        bought: false,
                        createdAt: new Date().toISOString()
                    });

                    this.quickAdd = '';
                },

                deleteItem(id) {
                    this.items = this.items.filter(i => i.id !== id);
                },

                getCategoryCount(cat) {
                    return this.items.filter(i => i.category === cat).length;
                },

                get categories() {
                    return [...new Set(this.items.map(i => i.category))];
                },

                get filteredItems() {
                    if (!this.activeCategory) return this.items;
                    return this.items.filter(i => i.category === this.activeCategory);
                },

                get stats() {
                    return {
                        pending: this.items.filter(i => !i.bought).length,
                        bought: this.items.filter(i => i.bought).length
                    };
                },

                get totalPrice() {
                    return this.items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_shopping_list.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
