<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简待办 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .drag-target {
            border: 2px dashed #cbd5e1;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-indigo-50 text-slate-800 min-h-screen font-sans" x-data="todoApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-indigo-100 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-indigo-50 text-indigo-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                    极简待办
                </h1>
            </div>
            <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                <button @click="view = 'list'" :class="view === 'list' ? 'bg-white shadow text-indigo-600' : 'text-slate-500 hover:text-slate-700'" class="p-1.5 rounded-md transition-all">
                    <i class="fa-solid fa-list w-4 h-4"></i>
                </button>
                <button @click="view = 'board'" :class="view === 'board' ? 'bg-white shadow text-indigo-600' : 'text-slate-500 hover:text-slate-700'" class="p-1.5 rounded-md transition-all">
                    <i class="fa-solid fa-list-check w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- Input Area -->
        <div class="mb-8 group">
            <div class="glass rounded-2xl shadow-sm border border-indigo-100 p-4 transition-all focus-within:ring-2 focus-within:ring-indigo-500/20 focus-within:shadow-lg">
                <div class="flex flex-col sm:flex-row gap-3">
                    <input 
                        type="text" 
                        x-model="newTask" 
                        @keydown.enter="addTask"
                        placeholder="准备做点什么？" 
                        class="flex-1 bg-transparent border-none text-lg placeholder-slate-400 focus:ring-0 p-0"
                    />
                    <div class="flex items-center gap-2">
                        <select x-model="newCategory" class="bg-slate-50 border-none text-sm rounded-lg py-1.5 px-3 focus:ring-1 focus:ring-indigo-200">
                            <option value="inbox">📥 收件箱</option>
                            <option value="work">💼 工作</option>
                            <option value="life">🏠 生活</option>
                            <option value="learn">📚 学习</option>
                        </select>
                        <select x-model="newPriority" class="bg-slate-50 border-none text-sm rounded-lg py-1.5 px-3 focus:ring-1 focus:ring-indigo-200">
                            <option value="low">🟢 低优</option>
                            <option value="medium">🟡 中优</option>
                            <option value="high">🔴 高优</option>
                        </select>
                        <button 
                            @click="addTask" 
                            class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-lg transition-colors shadow-md shadow-indigo-600/20"
                        >
                            <i class="fa-solid fa-plus w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">总任务</div>
                <div class="text-2xl font-bold text-slate-800" x-text="tasks.length">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">待完成</div>
                <div class="text-2xl font-bold text-indigo-600" x-text="pendingCount">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">已完成</div>
                <div class="text-2xl font-bold text-emerald-600" x-text="completedCount">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">完成率</div>
                <div class="text-2xl font-bold text-slate-800" x-text="completionRate + '%'">0%</div>
            </div>
        </div>

        <!-- View: List -->
        <div x-show="view === 'list'" x-transition class="space-y-3">
            <template x-for="(task, index) in sortedTasks" :key="task.id">
                <div 
                    class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex items-center justify-between group hover:border-indigo-200 transition-all"
                    :class="{'opacity-60 bg-slate-50': task.completed}"
                >
                    <div class="flex items-center gap-4 flex-1">
                        <button 
                            @click="toggleComplete(task.id)"
                            class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors"
                            :class="task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-indigo-500 text-transparent'"
                        >
                            <i class="fa-solid fa-check w-3.5 h-3.5"></i>
                        </button>
                        <div class="flex-1">
                            <div 
                                class="text-base font-medium transition-all"
                                :class="task.completed ? 'line-through text-slate-400' : 'text-slate-800'"
                                x-text="task.text"
                            ></div>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500" x-text="getCategoryLabel(task.category)"></span>
                                <span 
                                    class="text-xs px-2 py-0.5 rounded-full font-medium"
                                    :class="getPriorityClass(task.priority)"
                                    x-text="getPriorityLabel(task.priority)"
                                ></span>
                                <span class="text-xs text-slate-400 ml-auto" x-text="formatDate(task.createdAt)"></span>
                            </div>
                        </div>
                    </div>
                    <button @click="deleteTask(task.id)" class="text-slate-300 hover:text-rose-500 p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fa-solid fa-trash w-4 h-4"></i>
                    </button>
                </div>
            </template>
            
            <div x-show="tasks.length === 0" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-inbox w-12 h-12 mx-auto mb-3 text-slate-200"></i>
                <p>空空如也，添加第一个任务吧！</p>
            </div>
        </div>

        <!-- View: Board -->
        <div x-show="view === 'board'" x-transition class="grid md:grid-cols-3 gap-6 overflow-x-auto pb-4">
            
            <!-- Column: Todo -->
            <div class="bg-white/50 rounded-xl p-4 border border-slate-100 min-h-[400px]">
                <div class="flex items-center gap-2 mb-4 text-sm font-bold text-slate-600 uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                    待办
                    <span class="ml-auto bg-slate-200 text-slate-600 text-xs px-2 py-0.5 rounded-full" x-text="pendingCount">0</span>
                </div>
                <div class="space-y-3">
                    <template x-for="task in pendingTasks" :key="task.id">
                        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-100 hover:shadow-md transition-shadow cursor-grab active:cursor-grabbing">
                            <div class="flex justify-between items-start mb-2">
                                <span 
                                    class="text-xs font-bold px-1.5 py-0.5 rounded"
                                    :class="getPriorityClass(task.priority)"
                                    x-text="getPriorityLabel(task.priority)"
                                ></span>
                                <button @click="toggleComplete(task.id)" class="text-slate-400 hover:text-emerald-600">
                                    <i class="fa-regular fa-circle w-4 h-4"></i>
                                </button>
                            </div>
                            <p class="text-slate-800 font-medium mb-2" x-text="task.text"></p>
                            <div class="flex items-center justify-between text-xs text-slate-400">
                                <span x-text="getCategoryLabel(task.category)"></span>
                                <span x-text="formatDate(task.createdAt)"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Column: Doing (Simulated by Priority High/Medium maybe? No, let's just stick to Todo/Done for simplicity or add a Doing state later. For now, Board view separates by Category? Or State? Let's Separate by Category for Board view actually, or Priority. Let's do Priority Board.) -->
            <!-- Actually, usually Board is Todo -> Doing -> Done. But my data model only has 'completed' boolean. -->
            <!-- Let's make Board view grouped by PRIORITY. -->

             <div class="bg-white/50 rounded-xl p-4 border border-slate-100 min-h-[400px]">
                <div class="flex items-center gap-2 mb-4 text-sm font-bold text-amber-600 uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    高优先级 (待办)
                </div>
                 <div class="space-y-3">
                    <template x-for="task in highPriorityTasks" :key="task.id">
                        <div class="bg-white p-3 rounded-lg shadow-sm border-l-4 border-amber-500 hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xs text-slate-400" x-text="getCategoryLabel(task.category)"></span>
                                <button @click="toggleComplete(task.id)" class="text-slate-400 hover:text-emerald-600">
                                    <i class="fa-regular fa-square w-4 h-4"></i>
                                </button>
                            </div>
                             <p class="text-slate-800 font-medium" x-text="task.text"></p>
                        </div>
                    </template>
                     <p x-show="highPriorityTasks.length === 0" class="text-xs text-center text-slate-400 py-4">无高优先级任务</p>
                </div>
            </div>

             <div class="bg-white/50 rounded-xl p-4 border border-slate-100 min-h-[400px]">
                <div class="flex items-center gap-2 mb-4 text-sm font-bold text-emerald-600 uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    已完成
                    <span class="ml-auto bg-emerald-100 text-emerald-600 text-xs px-2 py-0.5 rounded-full" x-text="completedCount">0</span>
                </div>
                 <div class="space-y-3">
                    <template x-for="task in completedTasks" :key="task.id">
                         <div class="bg-slate-50 p-3 rounded-lg shadow-inner border border-slate-100 opacity-75">
                             <div class="flex justify-between items-start mb-2">
                                <span class="text-xs text-slate-400 line-through" x-text="getCategoryLabel(task.category)"></span>
                                <button @click="toggleComplete(task.id)" class="text-emerald-600">
                                    <i class="fa-solid fa-circle-check w-4 h-4"></i>
                                </button>
                            </div>
                            <p class="text-slate-500 line-through text-sm" x-text="task.text"></p>
                        </div>
                    </template>
                </div>
            </div>
            
        </div>

    </main>

    <script>
        function todoApp() {
            return {
                view: 'list', // list, board
                newTask: '',
                newCategory: 'inbox',
                newPriority: 'medium',
                tasks: [],

                init() {
                    const saved = localStorage.getItem('webtools_todo_list');
                    if (saved) {
                        this.tasks = JSON.parse(saved);
                    }
                    this.$watch('tasks', () => {
                        localStorage.setItem('webtools_todo_list', JSON.stringify(this.tasks));
                    });

                },

                addTask() {
                    if (!this.newTask.trim()) return;
                    this.tasks.unshift({
                        id: Date.now(),
                        text: this.newTask.trim(),
                        category: this.newCategory,
                        priority: this.newPriority,
                        completed: false,
                        createdAt: new Date().toISOString()
                    });
                    this.newTask = '';
                    // Keep preferences for category/priority
                },

                deleteTask(id) {
                    this.tasks = this.tasks.filter(t => t.id !== id);
                },

                toggleComplete(id) {
                    const task = this.tasks.find(t => t.id === id);
                    if (task) {
                        task.completed = !task.completed;
                    }
                },

                get sortedTasks() {
                    return [...this.tasks].sort((a, b) => {
                        if (a.completed === b.completed) return b.id - a.id; 
                        return a.completed ? 1 : -1;
                    });
                },

                get pendingTasks() {
                    return this.tasks.filter(t => !t.completed);
                },

                get highPriorityTasks() {
                    return this.tasks.filter(t => !t.completed && t.priority === 'high');
                },

                get completedTasks() {
                    return this.tasks.filter(t => t.completed);
                },

                get pendingCount() {
                    return this.tasks.filter(t => !t.completed).length;
                },

                get completedCount() {
                    return this.tasks.filter(t => t.completed).length;
                },

                get completionRate() {
                    if (this.tasks.length === 0) return 0;
                    return Math.round((this.completedCount / this.tasks.length) * 100);
                },

                getCategoryLabel(cat) {
                    const map = {
                        inbox: '收件箱',
                        work: '工作',
                        life: '生活',
                        learn: '学习'
                    };
                    return map[cat] || cat;
                },

                getPriorityLabel(p) {
                    const map = {
                        low: '低',
                        medium: '中',
                        high: '高'
                    };
                    return map[p] || p;
                },

                getPriorityClass(p) {
                    if (p === 'low') return 'text-emerald-600 bg-emerald-50';
                    if (p === 'medium') return 'text-amber-600 bg-amber-50';
                    if (p === 'high') return 'text-rose-600 bg-rose-50';
                    return 'text-slate-500 bg-slate-100';
                },

                formatDate(iso) {
                    const d = new Date(iso);
                    return `${d.getMonth() + 1}/${d.getDate()}`;
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_todo_list.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
