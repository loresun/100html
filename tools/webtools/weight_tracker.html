<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体重趋势图 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" x-data="weightTracker()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-teal-500 to-emerald-600">
                    ⚖️ 体重趋势
                </h1>
            </div>
            <button @click="showSettings = true" class="p-2 text-slate-500 hover:text-slate-700">
                <i class="fa-solid fa-gear w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 pb-20 space-y-6">
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Current -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <div class="text-slate-500 text-sm font-medium mb-1">当前体重</div>
                <div class="flex items-baseline gap-2">
                    <span class="text-3xl font-bold text-slate-800" x-text="currentWeight || '--'"></span>
                    <span class="text-sm text-slate-500">kg</span>
                </div>
                <div class="mt-2 text-sm" :class="weightChange > 0 ? 'text-rose-500' : 'text-emerald-500'" x-show="entries.length > 1">
                    <span x-text="weightChange > 0 ? '+' : ''"></span><span x-text="weightChange"></span> kg
                    <span class="text-slate-400">较上次</span>
                </div>
            </div>

            <!-- BMI -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                <div class="relative z-10">
                    <div class="text-slate-500 text-sm font-medium mb-1">BMI指数</div>
                    <div class="flex items-baseline gap-2">
                        <span class="text-3xl font-bold" :class="getBMIColor(bmi)" x-text="bmi || '--'"></span>
                        <span class="text-sm text-slate-600 font-medium" x-text="getBMIStatus(bmi)"></span>
                    </div>
                </div>
                <div class="absolute right-0 top-0 opacity-10 p-4">
                    <i class="fa-solid fa-heart-pulse w-24 h-24"></i>
                </div>
            </div>

            <!-- Goal -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-slate-500 text-sm font-medium mb-1">目标进度</div>
                        <div class="flex items-baseline gap-2">
                            <span class="text-3xl font-bold text-indigo-600" x-text="targetWeight"></span>
                            <span class="text-sm text-slate-500">kg</span>
                        </div>
                    </div>
                    <div class="h-10 w-10 rounded-full flex items-center justify-center bg-indigo-50 text-indigo-600 text-xs font-bold ring-4 ring-indigo-50/50" x-text="progress + '%'">
                    </div>
                </div>
                <div class="w-full bg-slate-100 h-2 rounded-full mt-4 overflow-hidden">
                    <div class="bg-indigo-500 h-full rounded-full transition-all duration-1000" :style="`width: ${progress}%`"></div>
                </div>
            </div>
        </div>

        <!-- Add Entry Form -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex gap-3 items-end">
            <div class="flex-1">
                <label class="text-xs text-slate-500 font-medium ml-1">日期</label>
                <input type="date" x-model="newEntry.date" class="w-full mt-1 bg-slate-50 border-transparent focus:bg-white focus:border-indigo-500 rounded-xl px-4 py-2.5 transition-all outline-none border">
            </div>
            <div class="flex-1">
                <label class="text-xs text-slate-500 font-medium ml-1">体重 (kg)</label>
                <input type="number" step="0.1" x-model="newEntry.weight" placeholder="0.0" class="w-full mt-1 bg-slate-50 border-transparent focus:bg-white focus:border-indigo-500 rounded-xl px-4 py-2.5 transition-all outline-none border">
            </div>
            <button @click="addEntry()" :disabled="!newEntry.weight" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-xl font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed h-[46px]">
                记录
            </button>
        </div>

        <!-- Chart -->
        <div class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-100">
            <h3 class="font-bold text-slate-800 mb-4">趋势分析</h3>
            <div class="h-64 md:h-80 w-full">
                <canvas id="weightChart"></canvas>
            </div>
        </div>

        <!-- History List -->
        <div class="space-y-3">
            <h3 class="font-bold text-slate-800 px-1">历史记录</h3>
            <template x-for="entry in sortedEntries" :key="entry.id">
                <div class="glass flex items-center justify-between p-4 rounded-xl border border-slate-200/60 group">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-medium text-xs">
                            <span x-text="new Date(entry.date).getDate()"></span>日
                        </div>
                        <div>
                            <div class="font-bold text-slate-800" x-text="entry.weight + ' kg'"></div>
                            <div class="text-xs text-slate-400" x-text="formatDateFull(entry.date)"></div>
                        </div>
                    </div>
                    <button @click="deleteEntry(entry.id)" class="p-2 text-slate-300 hover:text-rose-500 transition-colors">
                        <i class="fa-solid fa-trash w-4 h-4"></i>
                    </button>
                </div>
            </template>
        </div>
    </main>

    <!-- Settings Modal -->
    <div x-show="showSettings" x-cloak class="fixed inset-0 bg-black/40 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl" @click.away="showSettings = false">
            <h3 class="text-lg font-bold">设置资料</h3>
            
            <div>
                <label class="block text-sm text-slate-600 mb-1">身高 (cm)</label>
                <input type="number" x-model.number="height" class="w-full border rounded-lg px-3 py-2">
                <p class="text-xs text-slate-400 mt-1">用于计算 BMI</p>
            </div>

            <div>
                <label class="block text-sm text-slate-600 mb-1">目标体重 (kg)</label>
                <input type="number" step="0.5" x-model.number="targetWeight" class="w-full border rounded-lg px-3 py-2">
            </div>

            <button @click="saveSettings()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700">保存</button>
        </div>
    </div>

    <script>
        function weightTracker() {
            return {
                entries: [],
                height: 170,
                targetWeight: 60,
                showSettings: false,
                chart: null,
                
                newEntry: {
                    date: new Date().toISOString().split('T')[0],
                    weight: ''
                },

                init() {
                    const saved = localStorage.getItem('webtools_weight_tracker');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.entries = data.entries || [];
                        this.height = data.height || 170;
                        this.targetWeight = data.targetWeight || 60;
                    }

                    this.$watch('entries', () => {
                        this.updateChart();
                        this.saveData();
                    });

                    this.$nextTick(() => {
                        this.initChart();
                    });
                },

                saveData() {
                    localStorage.setItem('webtools_weight_tracker', JSON.stringify({
                        entries: this.entries,
                        height: this.height,
                        targetWeight: this.targetWeight
                    }));
                },

                saveSettings() {
                    this.saveData();
                    this.showSettings = false;
                    this.updateChart(); // Target line potentially changed
                },

                addEntry() {
                    if (!this.newEntry.weight) return;
                    
                    this.entries.push({
                        id: Date.now(),
                        date: this.newEntry.date,
                        weight: parseFloat(this.newEntry.weight)
                    });
                    
                    // Sort by date
                    this.entries.sort((a, b) => new Date(a.date) - new Date(b.date));
                    
                    this.newEntry.weight = '';
                    // Keep date as today or last used? Let's reset to today
                    this.newEntry.date = new Date().toISOString().split('T')[0];
                },

                deleteEntry(id) {
                    if(confirm('删除此记录?')) {
                        this.entries = this.entries.filter(e => e.id !== id);
                    }
                },

                // Properties
                get sortedEntries() {
                    // For display list, reverse chronological
                    return [...this.entries].sort((a, b) => new Date(b.date) - new Date(a.date));
                },

                get currentWeight() {
                    if (this.entries.length === 0) return 0;
                    return this.entries[this.entries.length - 1].weight;
                },

                get weightChange() {
                    if (this.entries.length < 2) return 0;
                    const current = this.entries[this.entries.length - 1].weight;
                    const prev = this.entries[this.entries.length - 2].weight;
                    return (current - prev).toFixed(1);
                },

                get bmi() {
                    if (!this.height || !this.currentWeight) return 0;
                    const h = this.height / 100;
                    return (this.currentWeight / (h * h)).toFixed(1);
                },

                get progress() {
                    if (!this.targetWeight || this.entries.length === 0) return 0;
                    const startWeight = this.entries[0].weight;
                    const current = this.currentWeight;
                    
                    // Total to lose/gain
                    const totalDiff = Math.abs(startWeight - this.targetWeight);
                    const currentDiff = Math.abs(current - this.targetWeight);
                    
                    if (totalDiff === 0) return 100;
                    
                    // Progress percentage
                    let p = ((totalDiff - currentDiff) / totalDiff) * 100;
                    
                    // If we passed the goal
                    if ((startWeight > this.targetWeight && current < this.targetWeight) || 
                        (startWeight < this.targetWeight && current > this.targetWeight)) {
                        p = 100;
                    }
                    
                    return Math.max(0, Math.min(100, Math.round(p)));
                },

                // Utils
                formatDateFull(dateStr) {
                    const date = new Date(dateStr);
                    return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
                },

                getBMIColor(bmi) {
                    if (bmi < 18.5) return 'text-blue-500';
                    if (bmi < 24) return 'text-emerald-500';
                    if (bmi < 28) return 'text-amber-500';
                    return 'text-rose-500';
                },

                getBMIStatus(bmi) {
                    if (bmi < 18.5) return '偏瘦';
                    if (bmi < 24) return '正常';
                    if (bmi < 28) return '偏胖';
                    return '肥胖';
                },

                // Chart
                initChart() {
                    const ctx = document.getElementById('weightChart');
                    if (!ctx) return;

                    Chart.defaults.font.family = "'Inter', sans-serif";
                    
                    this.chart = new Chart(ctx, {
                        type: 'line',
                        data: this.getChartData(),
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            tension: 0.3,
                            scales: {
                                y: {
                                    grid: { display: true, borderDash: [4, 4] }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(255, 255, 255, 0.9)',
                                    titleColor: '#1e293b',
                                    bodyColor: '#475569',
                                    borderColor: '#e2e8f0',
                                    borderWidth: 1,
                                    padding: 10,
                                    displayColors: false
                                }
                            }
                        }
                    });
                },

                updateChart() {
                    if (this.chart) {
                        this.chart.data = this.getChartData();
                        this.chart.update();
                    }
                },

                getChartData() {
                    const labels = this.entries.map(e => e.date.substring(5)); // MM-DD
                    const data = this.entries.map(e => e.weight);
                    
                    return {
                        labels: labels,
                        datasets: [
                            {
                                label: '体重',
                                data: data,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                pointBackgroundColor: '#fff',
                                pointBorderColor: '#10b981',
                                pointRadius: 4
                            },
                            {
                                label: '目标',
                                data: this.entries.map(() => this.targetWeight),
                                borderColor: '#a5b4fc', // indigo-300
                                borderDash: [5, 5],
                                borderWidth: 1,
                                pointRadius: 0,
                                fill: false
                            }
                        ]
                    };
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_weight_tracker.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
