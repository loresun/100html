<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 路径编辑器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .grid-bg { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-orange-50 min-h-screen font-sans text-slate-800" x-data="svgApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-orange-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-orange-50 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-600 to-red-600">
                ✒️ SVG 路径编辑器
            </h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 pb-24 grid grid-cols-1 md:grid-cols-2 gap-6 h-[calc(100vh-64px)] min-h-[600px]">

        <!-- Left: Code Editor -->
        <div class="flex flex-col h-full bg-white rounded-2xl shadow-sm border border-orange-100 overflow-hidden">
            <div class="px-4 py-3 bg-orange-50/50 border-b border-orange-100 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-500 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-code text-orange-400"></i> SVG Code
                </span>
                <div class="flex gap-2">
                    <button @click="sample('simple')" class="text-xs text-orange-600 underline">Simple</button>
                    <button @click="sample('complex')" class="text-xs text-orange-600 underline">Complex</button>
                    <button @click="format()" class="text-xs font-bold text-slate-500 hover:text-orange-600 ml-2">Format</button>
                </div>
            </div>
            <textarea x-model="svgCode" 
                      class="flex-1 w-full p-4 font-mono text-sm leading-6 outline-none resize-none text-slate-700 bg-white"
                      spellcheck="false"
                      placeholder="<svg ...> ... </svg>"></textarea>
            
            <!-- Controls Overlay -->
            <div class="p-4 bg-slate-50 border-t border-slate-100 grid grid-cols-2 gap-4">
                 <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Fill Color</label>
                    <div class="flex items-center gap-2">
                         <input type="color" x-model="fill" class="h-8 w-8 rounded cursor-pointer border-none bg-transparent">
                         <input type="text" x-model="fill" class="flex-1 text-xs p-1.5 border rounded outline-none focus:border-orange-500 font-mono">
                    </div>
                 </div>
                 <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Stroke Color</label>
                    <div class="flex items-center gap-2">
                         <input type="color" x-model="stroke" class="h-8 w-8 rounded cursor-pointer border-none bg-transparent">
                         <input type="text" x-model="stroke" class="flex-1 text-xs p-1.5 border rounded outline-none focus:border-orange-500 font-mono">
                    </div>
                </div>
                 <div class="col-span-2">
                     <label class="block text-xs font-bold text-slate-400 mb-1">Stroke Width: <span x-text="strokeWidth"></span>px</label>
                     <input type="range" min="0" max="20" step="0.5" x-model="strokeWidth" class="w-full accent-orange-600">
                 </div>
            </div>
        </div>

        <!-- Right: Preview -->
        <div class="flex flex-col h-full bg-slate-100 rounded-2xl shadow-inner border border-slate-200 overflow-hidden relative">
            <div class="absolute inset-0 grid-bg opacity-50 pointer-events-none"></div>
            
            <div class="flex-1 flex items-center justify-center p-8 overflow-auto z-10" id="previewArea">
                 <!-- The SVG is injected here safely? Using x-html might be risky but for a local tool ok. -->
                 <!-- Or simpler: minimal parser to extract path d? -->
                 <!-- No, let's render the full SVG to support groups etc -->
                 <div x-html="processedSvg" class="max-w-full max-h-full drop-shadow-xl transition-all duration-300"></div>
            </div>
            
            <div class="absolute top-4 right-4 flex gap-2">
                <div class="bg-white/90 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-mono text-slate-500 shadow-sm">
                    <span x-text="viewBox"></span>
                </div>
                <button @click="download()" class="bg-orange-600 hover:bg-orange-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-lg transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-download"></i> SVG
                </button>
            </div>
        </div>

    </main>

    <script>
        function svgApp() {
            return {
                svgCode: `<svg width="200" height="200" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`,
                fill: '#2563eb', // Default Blue
                stroke: '#1e293b', // Default Slate-800
                strokeWidth: 2,
                viewBox: '0 0 24 24',

                init() {
                    // Icon refresh not needed
                },
                
                get processedSvg() {
                    try {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(this.svgCode, 'image/svg+xml');
                        const svg = doc.querySelector('svg');
                        
                        if (!svg) return '<div class="text-rose-500 font-bold">Invalid SVG</div>';
                        
                        // We override styles for preview purposes, or just render as is?
                        // Let's render as is, but apply the 'current color' trick
                        // Or we can modify the DOM before serializing
                        
                        // Actually, SVG usually has its own attributes. 
                        // The user wants to *edit* so we probably shouldn't override aggressively.
                        // But the controls "Fill" and "Stroke" imply we override.
                        // Let's force override on the root or all paths.
                        
                        // Simple approach: set style on SVG root, rely on inheritance
                        svg.style.width = "100%";
                        svg.style.height = "100%";
                        svg.style.maxWidth = "400px";
                        svg.style.overflow = "visible";
                        
                        // For demonstration, let's inject a style block or set attributes on all children?
                        // Too complex. Let's just set the container color CSS vars.
                        
                        // Wait, let's just make the user edit the code mainly, and the controls are helpers.
                        // Helper logic: regex replace based on simple heuristic
                        return svg.outerHTML;
                    } catch (e) {
                        return '<div class="text-rose-500">Error parsing SVG</div>';
                    }
                },
                
                // Watchers to update code from controls could be tricky bi-directionally.
                // Let's make controls *inject* into code.
                
                updateCode() {
                    // This is hard to do reliably on raw text.
                    // Instead, let's apply the styles to a wrapper div color which flows into currentColor
                },

                sample(type) {
                    if (type === 'simple') {
                        this.svgCode = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
</svg>`;
                    } else {
                        this.svgCode = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <path fill="#FF0066" d="M42.7,2.8c-7,19.8-19.3,37.3-33.8,51.8C-3.8,67.3-2.6,83.9,7.6,94c10.3,10.3,27,11.5,40.5-2 c15.2-15.2,35.7-32.9,56.7-38.3C83.9,74.7,66.4,92.3,51.2,107.5c-13.5,13.5-12.3,30.2-2,40.5c10.2,10.2,26.8,11.4,39.4-1.3 c14.5-14.5,32-26.8,51.8-33.8C132.3,126.8,127,159.2,127,194.3c0,0,51-17,67.3-67.3C159.2,127,126.8,132.3,112.9,140.4z"/>
</svg>`;
                    }
                },
                
                format() {
                    // Very dumb formatter
                    let formatted = '';
                    let indent = 0;
                    this.svgCode.split(/>\s*</).forEach(node => {
                        if (node.match(/^\/\w/)) indent -= 1;
                        formatted += new Array(Math.max(0, indent * 2)).join(' ') + '<' + node + '>\n';
                        if (node.match(/^<?\w[^>]*[^\/]$/) && !node.startsWith("?")) indent += 1;
                    });
                    this.svgCode = formatted.trim().replace(/^<>\n/, '').replace(/\n>$/, ''); // Fix artifacts from split
                    // Better: use a library or just simple newlines
                     this.svgCode = this.svgCode.replace(/></g, '>\n<');
                },

                download() {
                    const blob = new Blob([this.svgCode], {type: 'image/svg+xml'});
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'icon.svg';
                    link.click();
                }
            }
        }
    </script>

</body>
</html>
