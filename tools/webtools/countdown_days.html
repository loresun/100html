<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重要日子倒计时 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .countdown-card {
            background: linear-gradient(135deg, var(--bg-from), var(--bg-to));
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" x-data="countdownApp()" x-init="init()">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold text-slate-800">⏰ 重要日子倒计时</h1>
            </div>
            <button @click="showAddModal = true" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors flex items-center gap-2">
                <i class="fa-solid fa-plus w-4 h-4"></i>
                新增
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Countdowns Grid -->
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="countdown in sortedCountdowns" :key="countdown.id">
                <div 
                    class="countdown-card rounded-2xl p-6 text-white shadow-lg hover:shadow-xl transition-all relative overflow-hidden group"
                    :style="'--bg-from: ' + countdown.colorFrom + '; --bg-to: ' + countdown.colorTo"
                >
                    <!-- Background Pattern -->
                    <div class="absolute inset-0 opacity-10">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-white rounded-full -translate-y-1/2 translate-x-1/2"></div>
                        <div class="absolute bottom-0 left-0 w-24 h-24 bg-white rounded-full translate-y-1/2 -translate-x-1/2"></div>
                    </div>

                    <!-- Content -->
                    <div class="relative z-10">
                        <!-- Header -->
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex-1">
                                <div class="text-3xl mb-2" x-text="countdown.emoji">🎂</div>
                                <h3 class="text-xl font-bold mb-1" x-text="countdown.name">生日</h3>
                                <p class="text-sm opacity-90" x-text="countdown.date">2024-12-31</p>
                            </div>
                            <button 
                                @click="deleteCountdown(countdown.id)"
                                class="opacity-0 group-hover:opacity-100 p-2 bg-white/20 hover:bg-white/30 rounded-lg transition-all"
                            >
                                <i class="fa-solid fa-trash-can w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- Countdown Display -->
                        <div class="bg-white/20 backdrop-blur-sm rounded-xl p-4 mb-4">
                            <template x-if="getTimeRemaining(countdown.date).isPast">
                                <div class="text-center">
                                    <div class="text-2xl font-bold">已过去</div>
                                    <div class="text-lg mt-1" x-text="getTimeRemaining(countdown.date).days + ' 天'"></div>
                                </div>
                            </template>
                            <template x-if="!getTimeRemaining(countdown.date).isPast">
                                <div class="grid grid-cols-4 gap-2 text-center">
                                    <div>
                                        <div class="text-2xl font-bold" x-text="getTimeRemaining(countdown.date).days">0</div>
                                        <div class="text-xs opacity-80">天</div>
                                    </div>
                                    <div>
                                        <div class="text-2xl font-bold" x-text="getTimeRemaining(countdown.date).hours">0</div>
                                        <div class="text-xs opacity-80">时</div>
                                    </div>
                                    <div>
                                        <div class="text-2xl font-bold" x-text="getTimeRemaining(countdown.date).minutes">0</div>
                                        <div class="text-xs opacity-80">分</div>
                                    </div>
                                    <div>
                                        <div class="text-2xl font-bold" x-text="getTimeRemaining(countdown.date).seconds">0</div>
                                        <div class="text-xs opacity-80">秒</div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Progress Bar -->
                        <template x-if="countdown.repeat === 'yearly'">
                            <div>
                                <div class="flex justify-between text-xs opacity-80 mb-1">
                                    <span>年度进度</span>
                                    <span x-text="getYearProgress(countdown.date) + '%'">0%</span>
                                </div>
                                <div class="w-full bg-white/20 rounded-full h-2">
                                    <div 
                                        class="bg-white h-2 rounded-full transition-all"
                                        :style="'width: ' + getYearProgress(countdown.date) + '%'"
                                    ></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="countdowns.length === 0" class="text-center py-20">
            <div class="w-20 h-20 mx-auto mb-4 bg-slate-100 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-calendar-days w-10 h-10 text-slate-300"></i>
            </div>
            <h3 class="text-lg font-medium text-slate-600 mb-2">还没有倒计时</h3>
            <p class="text-slate-400 mb-6">添加生日、纪念日或其他重要日子</p>
        </div>
    </main>

    <!-- Add Modal -->
    <div x-show="showAddModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" @click.self="showAddModal = false">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold text-slate-800 mb-4">新增倒计时</h3>
            
            <div class="space-y-4">
                <!-- Emoji Selector -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">选择图标</label>
                    <div class="grid grid-cols-8 gap-2">
                        <template x-for="emoji in emojiOptions" :key="emoji">
                            <button 
                                @click="newCountdown.emoji = emoji"
                                :class="newCountdown.emoji === emoji ? 'ring-2 ring-indigo-500 bg-indigo-50' : 'hover:bg-slate-50'"
                                class="text-2xl p-2 rounded-lg transition-all"
                                x-text="emoji"
                            ></button>
                        </template>
                    </div>
                </div>

                <!-- Name -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">名称</label>
                    <input 
                        type="text" 
                        x-model="newCountdown.name"
                        placeholder="例如：妈妈生日"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none"
                    />
                </div>

                <!-- Date -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">日期</label>
                    <input 
                        type="date" 
                        x-model="newCountdown.date"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none"
                    />
                </div>

                <!-- Repeat -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">重复</label>
                    <select 
                        x-model="newCountdown.repeat"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    >
                        <option value="none">不重复</option>
                        <option value="yearly">每年</option>
                    </select>
                </div>

                <!-- Color Theme -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">配色主题</label>
                    <div class="grid grid-cols-4 gap-2">
                        <template x-for="theme in colorThemes" :key="theme.name">
                            <button 
                                @click="newCountdown.colorFrom = theme.from; newCountdown.colorTo = theme.to"
                                class="h-12 rounded-lg border-2 transition-all"
                                :class="newCountdown.colorFrom === theme.from ? 'border-indigo-500 scale-105' : 'border-slate-200 hover:border-slate-300'"
                                :style="'background: linear-gradient(135deg, ' + theme.from + ', ' + theme.to + ')'"
                            ></button>
                        </template>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button @click="showAddModal = false" class="flex-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">
                    取消
                </button>
                <button @click="addCountdown()" class="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors">
                    创建
                </button>
            </div>
        </div>
    </div>

    <script>
        function countdownApp() {
            return {
                countdowns: [],
                showAddModal: false,
                currentTime: new Date(),
                emojiOptions: ['🎂', '💝', '🎉', '💍', '🎓', '✈️', '🏠', '👶', '💼', '🎄', '🌸', '🎊', '🎁', '❤️', '🌟', '🎈'],
                colorThemes: [
                    { name: 'pink', from: '#ec4899', to: '#f472b6' },
                    { name: 'purple', from: '#8b5cf6', to: '#a78bfa' },
                    { name: 'blue', from: '#3b82f6', to: '#60a5fa' },
                    { name: 'green', from: '#10b981', to: '#34d399' },
                    { name: 'orange', from: '#f97316', to: '#fb923c' },
                    { name: 'red', from: '#ef4444', to: '#f87171' },
                    { name: 'indigo', from: '#6366f1', to: '#818cf8' },
                    { name: 'teal', from: '#14b8a6', to: '#2dd4bf' }
                ],
                newCountdown: {
                    emoji: '🎂',
                    name: '',
                    date: '',
                    repeat: 'yearly',
                    colorFrom: '#ec4899',
                    colorTo: '#f472b6'
                },

                init() {
                    const saved = localStorage.getItem('webtools_countdowns');
                    if (saved) {
                        this.countdowns = JSON.parse(saved);
                    }
                    
                    // Update every second
                    setInterval(() => {
                        this.currentTime = new Date();
                    }, 1000);

                    this.$watch('countdowns', () => {
                        localStorage.setItem('webtools_countdowns', JSON.stringify(this.countdowns));
                    });
                },

                addCountdown() {
                    if (!this.newCountdown.name || !this.newCountdown.date) {
                        alert('请填写名称和日期');
                        return;
                    }

                    this.countdowns.push({
                        id: Date.now(),
                        emoji: this.newCountdown.emoji,
                        name: this.newCountdown.name,
                        date: this.newCountdown.date,
                        repeat: this.newCountdown.repeat,
                        colorFrom: this.newCountdown.colorFrom,
                        colorTo: this.newCountdown.colorTo,
                        createdAt: new Date().toISOString()
                    });

                    this.newCountdown = {
                        emoji: '🎂',
                        name: '',
                        date: '',
                        repeat: 'yearly',
                        colorFrom: '#ec4899',
                        colorTo: '#f472b6'
                    };
                    this.showAddModal = false;
                },

                deleteCountdown(id) {
                    if (confirm('确定要删除这个倒计时吗？')) {
                        this.countdowns = this.countdowns.filter(c => c.id !== id);
                    }
                },

                getTimeRemaining(dateStr) {
                    let targetDate = new Date(dateStr);
                    const now = this.currentTime;
                    
                    // If yearly repeat and date has passed this year, use next year
                    const countdown = this.countdowns.find(c => c.date === dateStr);
                    if (countdown && countdown.repeat === 'yearly') {
                        const thisYear = new Date(now.getFullYear(), targetDate.getMonth(), targetDate.getDate());
                        if (thisYear < now) {
                            targetDate = new Date(now.getFullYear() + 1, targetDate.getMonth(), targetDate.getDate());
                        } else {
                            targetDate = thisYear;
                        }
                    }
                    
                    const diff = targetDate - now;
                    const isPast = diff < 0;
                    const absDiff = Math.abs(diff);
                    
                    return {
                        isPast,
                        days: Math.floor(absDiff / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((absDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                        minutes: Math.floor((absDiff % (1000 * 60 * 60)) / (1000 * 60)),
                        seconds: Math.floor((absDiff % (1000 * 60)) / 1000)
                    };
                },

                getYearProgress(dateStr) {
                    const targetDate = new Date(dateStr);
                    const now = this.currentTime;
                    const yearStart = new Date(now.getFullYear(), 0, 1);
                    const thisYearTarget = new Date(now.getFullYear(), targetDate.getMonth(), targetDate.getDate());
                    
                    if (thisYearTarget < now) {
                        return 100;
                    }
                    
                    const total = thisYearTarget - yearStart;
                    const passed = now - yearStart;
                    return Math.min(100, Math.round((passed / total) * 100));
                },

                get sortedCountdowns() {
                    return [...this.countdowns].sort((a, b) => {
                        const timeA = Math.abs(new Date(a.date) - this.currentTime);
                        const timeB = Math.abs(new Date(b.date) - this.currentTime);
                        return timeA - timeB;
                    });
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_countdown_days.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
