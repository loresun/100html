<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白噪音空间 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .sound-card {
            transition: all 0.3s ease;
        }
        .sound-card:hover {
            transform: translateY(-4px);
        }
        .sound-card.active {
            box-shadow: 0 0 0 2px rgb(99, 102, 241);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-900 min-h-screen text-white font-sans" x-data="whiteNoiseApp()" x-init="init()">

    <header class="bg-slate-800/50 backdrop-blur-md border-b border-slate-700">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-700 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold">🎧 白噪音空间</h1>
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-volume-high w-4 h-4 text-slate-400"></i>
                <input 
                    type="range" 
                    x-model.number="masterVolume"
                    min="0" 
                    max="100" 
                    class="w-24"
                />
                <span class="text-sm text-slate-400 w-8" x-text="masterVolume + '%'"></span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- Sound Categories -->
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            
            <!-- Nature -->
            <div>
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span>🌿</span> 自然之声
                </h3>
                <div class="space-y-3">
                    <template x-for="sound in sounds.nature" :key="sound.id">
                        <div 
                            @click="toggleSound(sound)"
                            :class="{'active': sound.playing, 'bg-slate-800': !sound.playing, 'bg-indigo-900': sound.playing}"
                            class="sound-card p-4 rounded-xl cursor-pointer border border-slate-700 hover:border-indigo-500"
                        >
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-3">
                                    <span class="text-2xl" x-text="sound.icon"></span>
                                    <span class="font-medium" x-text="sound.name"></span>
                                </div>
                                <i :class="sound.playing ? 'fa-regular fa-circle-pause' : 'fa-regular fa-circle-play'" class="w-5 h-5"></i>
                            </div>
                            <div x-show="sound.playing" class="mt-3">
                                <input 
                                    type="range" 
                                    x-model.number="sound.volume"
                                    min="0" 
                                    max="100" 
                                    class="w-full"
                                    @click.stop
                                />
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Ambient -->
            <div>
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span>🏙️</span> 环境音效
                </h3>
                <div class="space-y-3">
                    <template x-for="sound in sounds.ambient" :key="sound.id">
                        <div 
                            @click="toggleSound(sound)"
                            :class="{'active': sound.playing, 'bg-slate-800': !sound.playing, 'bg-indigo-900': sound.playing}"
                            class="sound-card p-4 rounded-xl cursor-pointer border border-slate-700 hover:border-indigo-500"
                        >
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-3">
                                    <span class="text-2xl" x-text="sound.icon"></span>
                                    <span class="font-medium" x-text="sound.name"></span>
                                </div>
                                <i :class="sound.playing ? 'fa-regular fa-circle-pause' : 'fa-regular fa-circle-play'" class="w-5 h-5"></i>
                            </div>
                            <div x-show="sound.playing" class="mt-3">
                                <input 
                                    type="range" 
                                    x-model.number="sound.volume"
                                    min="0" 
                                    max="100" 
                                    class="w-full"
                                    @click.stop
                                />
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Focus -->
            <div>
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span>🎵</span> 专注音乐
                </h3>
                <div class="space-y-3">
                    <template x-for="sound in sounds.focus" :key="sound.id">
                        <div 
                            @click="toggleSound(sound)"
                            :class="{'active': sound.playing, 'bg-slate-800': !sound.playing, 'bg-indigo-900': sound.playing}"
                            class="sound-card p-4 rounded-xl cursor-pointer border border-slate-700 hover:border-indigo-500"
                        >
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-3">
                                    <span class="text-2xl" x-text="sound.icon"></span>
                                    <span class="font-medium" x-text="sound.name"></span>
                                </div>
                                <i :class="sound.playing ? 'fa-regular fa-circle-pause' : 'fa-regular fa-circle-play'" class="w-5 h-5"></i>
                            </div>
                            <div x-show="sound.playing" class="mt-3">
                                <input 
                                    type="range" 
                                    x-model.number="sound.volume"
                                    min="0" 
                                    max="100" 
                                    class="w-full"
                                    @click.stop
                                />
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Timer -->
        <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold mb-2">定时关闭</h3>
                    <p class="text-sm text-slate-400">设置后将自动停止所有声音</p>
                </div>
                <div class="flex items-center gap-4">
                    <select 
                        x-model.number="timerMinutes"
                        class="px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg outline-none"
                    >
                        <option value="0">关闭</option>
                        <option value="15">15 分钟</option>
                        <option value="30">30 分钟</option>
                        <option value="60">60 分钟</option>
                        <option value="90">90 分钟</option>
                    </select>
                    <button 
                        @click="startTimer()"
                        :disabled="timerMinutes === 0"
                        class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        开始
                    </button>
                </div>
            </div>
            <div x-show="timerActive" class="mt-4 text-center">
                <div class="text-2xl font-mono" x-text="timerDisplay">00:00</div>
            </div>
        </div>

        <!-- Info -->
        <div class="mt-8 bg-indigo-900/30 rounded-2xl p-6 border border-indigo-800/50">
            <h4 class="font-bold mb-2 flex items-center gap-2">
                <i class="fa-solid fa-circle-info w-4 h-4"></i>
                使用说明
            </h4>
            <ul class="text-sm text-slate-300 space-y-1">
                <li>• 点击卡片播放/暂停声音</li>
                <li>• 可同时播放多个声音进行混音</li>
                <li>• 调节每个声音的音量创造独特氛围</li>
                <li>• 建议使用耳机获得最佳体验</li>
                <li>• 注意:本演示版使用模拟音频,实际版本需要真实音频文件</li>
            </ul>
        </div>
    </main>

    <script>
        function whiteNoiseApp() {
            return {
                masterVolume: 70,
                timerMinutes: 0,
                timerActive: false,
                timerRemaining: 0,
                timerInterval: null,
                sounds: {
                    nature: [
                        { id: 'rain', name: '雨声', icon: '🌧️', playing: false, volume: 70 },
                        { id: 'ocean', name: '海浪', icon: '🌊', playing: false, volume: 70 },
                        { id: 'forest', name: '森林', icon: '🌲', playing: false, volume: 70 },
                        { id: 'fire', name: '篝火', icon: '🔥', playing: false, volume: 70 },
                        { id: 'thunder', name: '雷声', icon: '⚡', playing: false, volume: 70 }
                    ],
                    ambient: [
                        { id: 'cafe', name: '咖啡馆', icon: '☕', playing: false, volume: 70 },
                        { id: 'library', name: '图书馆', icon: '📚', playing: false, volume: 70 },
                        { id: 'train', name: '火车', icon: '🚂', playing: false, volume: 70 },
                        { id: 'fan', name: '风扇', icon: '💨', playing: false, volume: 70 }
                    ],
                    focus: [
                        { id: 'white', name: '白噪音', icon: '📻', playing: false, volume: 70 },
                        { id: 'pink', name: '粉红噪音', icon: '🎵', playing: false, volume: 70 },
                        { id: 'brown', name: '棕色噪音', icon: '🎶', playing: false, volume: 70 },
                        { id: 'lofi', name: 'Lo-Fi', icon: '🎧', playing: false, volume: 70 }
                    ]
                },

                init() {
                    // icons removed
                },

                toggleSound(sound) {
                    sound.playing = !sound.playing;
                    // 实际应用中这里会控制真实的音频播放
                    console.log(`${sound.name} ${sound.playing ? '播放' : '暂停'}`);
                    this.$nextTick(() => { });
                },

                startTimer() {
                    if (this.timerMinutes === 0) return;
                    
                    this.timerActive = true;
                    this.timerRemaining = this.timerMinutes * 60;
                    
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    
                    this.timerInterval = setInterval(() => {
                        this.timerRemaining--;
                        
                        if (this.timerRemaining <= 0) {
                            this.stopAllSounds();
                            this.timerActive = false;
                            clearInterval(this.timerInterval);
                            alert('定时结束，已停止所有声音');
                        }
                    }, 1000);
                },

                stopAllSounds() {
                    Object.values(this.sounds).forEach(category => {
                        category.forEach(sound => {
                            sound.playing = false;
                        });
                    });
                },

                get timerDisplay() {
                    const minutes = Math.floor(this.timerRemaining / 60);
                    const seconds = this.timerRemaining % 60;
                    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_white_noise.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
