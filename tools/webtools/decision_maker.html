<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择纠结终端 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        @keyframes spin-wheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(var(--rotation)); }
        }
        .spinning {
            animation: spin-wheel 3s cubic-bezier(0.17, 0.67, 0.12, 0.99) forwards;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-violet-500 via-purple-500 to-pink-500 min-h-screen text-white font-sans" x-data="decisionApp()" x-init="init()">

    <header class="bg-white/10 backdrop-blur-md border-b border-white/20">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-white/10 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold">🎲 选择纠结终端</h1>
            </div>
            <div class="flex gap-2">
                <button @click="mode = 'wheel'" :class="mode === 'wheel' ? 'bg-white/20' : 'bg-white/10'" class="px-3 py-1.5 rounded-lg text-sm transition-colors">
                    转盘
                </button>
                <button @click="mode = 'random'" :class="mode === 'random' ? 'bg-white/20' : 'bg-white/10'" class="px-3 py-1.5 rounded-lg text-sm transition-colors">
                    随机
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
        
        <!-- Wheel Mode -->
        <div x-show="mode === 'wheel'" x-transition class="text-center">
            
            <!-- Wheel -->
            <div class="relative w-80 h-80 mx-auto mb-8">
                <!-- Pointer -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-2 z-10">
                    <div class="w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[30px] border-t-white drop-shadow-lg"></div>
                </div>

                <!-- Wheel Circle -->
                <div 
                    id="wheel"
                    class="w-full h-full rounded-full shadow-2xl relative overflow-hidden border-8 border-white"
                    :class="{'spinning': isSpinning}"
                    :style="'--rotation: ' + rotation + 'deg'"
                >
                    <template x-for="(option, index) in options" :key="index">
                        <div 
                            class="absolute w-full h-full"
                            :style="getSliceStyle(index)"
                        >
                            <div class="absolute left-1/2 top-8 -translate-x-1/2 font-bold text-white drop-shadow-lg text-sm" x-text="option"></div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Result -->
            <div x-show="result" x-transition class="bg-white/20 backdrop-blur-md rounded-2xl p-6 mb-6">
                <div class="text-sm opacity-80 mb-2">结果是</div>
                <div class="text-4xl font-bold" x-text="result"></div>
            </div>

            <!-- Spin Button -->
            <button 
                @click="spinWheel()"
                :disabled="isSpinning || options.length < 2"
                class="px-8 py-4 bg-white text-purple-600 rounded-full font-bold text-lg hover:scale-105 transition-transform disabled:opacity-50 disabled:cursor-not-allowed shadow-xl"
            >
                <span x-show="!isSpinning">🎯 开始转动</span>
                <span x-show="isSpinning">转动中...</span>
            </button>
        </div>

        <!-- Random Mode -->
        <div x-show="mode === 'random'" x-transition class="text-center">
            
            <!-- Random Display -->
            <div class="bg-white/20 backdrop-blur-md rounded-3xl p-12 mb-8 min-h-[320px] flex items-center justify-center">
                <div x-show="!result" class="text-white/60">
                    <i class="fa-solid fa-shuffle w-20 h-20 mx-auto mb-4"></i>
                    <p>点击下方按钮随机抽取</p>
                </div>
                <div x-show="result" x-transition class="text-center">
                    <div class="text-6xl font-bold mb-4" x-text="result"></div>
                    <div class="text-white/80">就决定是你了！</div>
                </div>
            </div>

            <!-- Random Button -->
            <button 
                @click="randomPick()"
                :disabled="options.length < 2"
                class="px-8 py-4 bg-white text-purple-600 rounded-full font-bold text-lg hover:scale-105 transition-transform disabled:opacity-50 disabled:cursor-not-allowed shadow-xl"
            >
                🎲 随机抽取
            </button>
        </div>

        <!-- Options Management -->
        <div class="mt-12 bg-white/10 backdrop-blur-md rounded-2xl p-6">
            <h3 class="text-lg font-bold mb-4">选项管理</h3>
            
            <!-- Add Option -->
            <div class="flex gap-3 mb-4">
                <input 
                    type="text" 
                    x-model="newOption"
                    @keydown.enter="addOption()"
                    placeholder="输入选项..."
                    class="flex-1 px-4 py-2 bg-white/20 border border-white/30 rounded-lg focus:ring-2 focus:ring-white/50 outline-none placeholder-white/50"
                />
                <button 
                    @click="addOption()"
                    class="px-6 py-2 bg-white/20 hover:bg-white/30 rounded-lg transition-colors"
                >
                    添加
                </button>
            </div>

            <!-- Options List -->
            <div class="space-y-2">
                <template x-for="(option, index) in options" :key="index">
                    <div class="flex items-center justify-between p-3 bg-white/10 rounded-lg">
                        <span x-text="option"></span>
                        <button @click="removeOption(index)" class="text-white/60 hover:text-white transition-colors">
                            <i class="fa-solid fa-xmark w-4 h-4"></i>
                        </button>
                    </div>
                </template>
            </div>

            <div x-show="options.length === 0" class="text-center py-8 text-white/50">
                还没有选项，添加至少 2 个选项开始
            </div>

            <!-- Presets -->
            <div class="mt-6">
                <div class="text-sm font-medium mb-3">快速预设</div>
                <div class="flex flex-wrap gap-2">
                    <button @click="loadPreset('lunch')" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition-colors">
                        午餐吃什么
                    </button>
                    <button @click="loadPreset('yesno')" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition-colors">
                        是/否
                    </button>
                    <button @click="loadPreset('weekend')" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition-colors">
                        周末活动
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function decisionApp() {
            return {
                mode: 'wheel',
                options: ['选项 A', '选项 B', '选项 C', '选项 D'],
                newOption: '',
                result: '',
                isSpinning: false,
                rotation: 0,
                colors: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'],

                init() {
                    const saved = localStorage.getItem('webtools_decision');
                    if (saved) {
                        this.options = JSON.parse(saved);
                    }
                    this.$watch('options', () => {
                        localStorage.setItem('webtools_decision', JSON.stringify(this.options));
                    });
                },

                addOption() {
                    if (!this.newOption.trim()) return;
                    this.options.push(this.newOption.trim());
                    this.newOption = '';
                },

                removeOption(index) {
                    this.options.splice(index, 1);
                },

                spinWheel() {
                    if (this.isSpinning || this.options.length < 2) return;
                    
                    this.isSpinning = true;
                    this.result = '';
                    
                    const randomIndex = Math.floor(Math.random() * this.options.length);
                    const degreesPerSlice = 360 / this.options.length;
                    const targetRotation = 360 * 5 + (randomIndex * degreesPerSlice) + (degreesPerSlice / 2);
                    
                    this.rotation = targetRotation;
                    
                    setTimeout(() => {
                        this.result = this.options[randomIndex];
                        this.isSpinning = false;
                    }, 3000);
                },

                randomPick() {
                    if (this.options.length < 2) return;
                    
                    this.result = '';
                    let count = 0;
                    const interval = setInterval(() => {
                        this.result = this.options[Math.floor(Math.random() * this.options.length)];
                        count++;
                        if (count > 10) {
                            clearInterval(interval);
                        }
                    }, 100);
                },

                getSliceStyle(index) {
                    const degreesPerSlice = 360 / this.options.length;
                    const rotation = index * degreesPerSlice;
                    const color = this.colors[index % this.colors.length];
                    
                    return `
                        transform: rotate(${rotation}deg);
                        background: conic-gradient(from 0deg, ${color} 0deg, ${color} ${degreesPerSlice}deg, transparent ${degreesPerSlice}deg);
                    `;
                },

                loadPreset(type) {
                    const presets = {
                        lunch: ['中餐', '西餐', '日料', '韩餐', '快餐', '火锅'],
                        yesno: ['是', '否'],
                        weekend: ['看电影', '逛街', '运动', '宅家', '郊游', '聚会']
                    };
                    this.options = presets[type] || [];
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_decision_maker.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
