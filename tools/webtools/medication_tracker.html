<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用药提醒 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-teal-50 min-h-screen font-sans" x-data="medApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-teal-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-teal-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-teal-500 to-cyan-600">
                    💊 用药提醒
                </h1>
            </div>
            
            <button @click="showAddModal = true" class="bg-teal-500 hover:bg-teal-600 text-white p-2 rounded-lg shadow-lg shadow-teal-500/20 transition-all">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 pb-24">

        <!-- Date Header -->
        <div class="mb-8 flex items-end justify-between">
            <div>
                <div class="text-teal-600 font-bold uppercase tracking-wider text-xs">Today</div>
                <h2 class="text-3xl font-bold text-slate-800" x-text="todayStr"></h2>
            </div>
            <div class="text-right">
                <div class="text-slate-400 text-xs">完成度</div>
                <div class="text-xl font-bold text-teal-600" x-text="completionRate + '%'"></div>
            </div>
        </div>

        <!-- Timeline -->
        <div class="space-y-6 relative">
            <!-- Vertical Line -->
            <div class="absolute left-6 top-4 bottom-4 w-0.5 bg-teal-100 z-0"></div>

            <template x-for="time in timeSlots" :key="time.id">
                <div class="relative z-10" x-show="hasMedsForTime(time.id)">
                    <div class="flex items-center gap-4 mb-3">
                        <div class="w-12 h-12 rounded-full bg-white border-4 border-teal-100 flex items-center justify-center text-teal-500 shadow-sm z-10">
                            <i :class="getIconClass(time.icon)" class="text-sm"></i>
                        </div>
                        <h3 class="font-bold text-slate-700 text-lg" x-text="time.name"></h3>
                    </div>

                    <div class="ml-12 space-y-3">
                        <template x-for="med in getMedsForTime(time.id)" :key="med.id">
                            <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 group transition-all hover:shadow-md cursor-pointer"
                                 @click="toggleMed(med.id, time.id)"
                                 :class="isTaken(med.id, time.id) ? 'opacity-60 bg-slate-50' : 'bg-white'">
                                 
                                <div class="flex items-start justify-between">
                                    <div>
                                        <div class="font-bold text-slate-800 text-lg" :class="isTaken(med.id, time.id) ? 'line-through text-slate-400' : ''" x-text="med.name"></div>
                                        <div class="text-sm text-slate-500 mt-1 flex items-center gap-2">
                                            <span class="bg-teal-50 text-teal-700 px-2 py-0.5 rounded text-xs font-bold" x-text="med.dosage"></span>
                                            <span x-show="med.notes" class="italic text-slate-400" x-text="med.notes"></span>
                                        </div>
                                    </div>

                                    <div class="flex items-center gap-3">
                                        <button class="w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all"
                                                :class="isTaken(med.id, time.id) ? 'bg-teal-500 border-teal-500' : 'border-slate-300 hover:border-teal-400'">
                                            <i class="fa-solid fa-check text-white" x-show="isTaken(med.id, time.id)"></i>
                                        </button>
                                        <button @click.stop="deleteMed(med.id)" class="text-slate-300 hover:text-rose-500 p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <i class="fa-solid fa-trash-can text-sm"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
            
            <div x-show="medsearch.length === 0" class="text-center py-20 pl-12">
                <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm inline-block">
                    <i class="fa-solid fa-pills text-4xl text-teal-300 mx-auto mb-2"></i>
                    <p class="text-slate-500 font-medium">还没有添加药品</p>
                </div>
            </div>
        </div>

    </main>
    
    <!-- Add Modal -->
    <div x-show="showAddModal" x-cloak class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6" @click.away="showAddModal = false">
            <h3 class="text-lg font-bold text-slate-900 mb-4">添加药品</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">药品名称</label>
                    <input type="text" x-model="newMed.name" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-200" placeholder="例如: 维生素C">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">剂量</label>
                    <input type="text" x-model="newMed.dosage" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-teal-500" placeholder="例如: 1粒 / 5mg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">服用时间 (可多选)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="slot in timeSlots" :key="slot.id">
                            <button @click="toggleTimeSlot(slot.id)"
                                    class="px-3 py-2 rounded-lg text-sm font-medium border transition-colors flex items-center gap-2 justify-center"
                                    :class="newMed.times.includes(slot.id) ? 'bg-teal-500 text-white border-teal-500' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'">
                                <i :class="getIconClass(slot.icon)" class="text-xs"></i>
                                <span x-text="slot.name"></span>
                            </button>
                        </template>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">备注 (可选)</label>
                    <input type="text" x-model="newMed.notes" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-teal-500" placeholder="餐后服用">
                </div>
            </div>
            
            <div class="mt-8 flex gap-3">
                <button @click="showAddModal = false" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-medium hover:bg-slate-200">取消</button>
                <button @click="addMed()" 
                        :disabled="!newMed.name || newMed.times.length === 0"
                        class="flex-1 py-3 rounded-xl bg-teal-500 text-white font-medium hover:bg-teal-600 shadow-lg shadow-teal-500/20 disabled:opacity-50 disabled:shadow-none transition-all">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        function medApp() {
            return {
                showAddModal: false,
                meds: [],
                logs: {}, // Format: "yyyymmdd": { "medId_timeId": true }
                
                newMed: {
                    name: '',
                    dosage: '',
                    notes: '',
                    times: []
                },

                timeSlots: [
                    { id: 'morning', name: '早晨', icon: 'sunrise' },
                    { id: 'noon', name: '中午', icon: 'sun' },
                    { id: 'evening', name: '晚上', icon: 'sunset' },
                    { id: 'bedtime', name: '睡前', icon: 'moon' }
                ],
                
                // Demo data
                get medsearch() { return this.meds; }, 

                init() {
                    const savedMeds = localStorage.getItem('webtools_meds');
                    if (savedMeds) this.meds = JSON.parse(savedMeds);
                    else {
                        this.meds = [
                            { id: 1, name: '维生素C', dosage: '1粒', notes: '', times: ['morning'] }
                        ];
                    }

                    const savedLogs = localStorage.getItem('webtools_med_logs');
                    if (savedLogs) this.logs = JSON.parse(savedLogs);

                    this.$watch('meds', () => localStorage.setItem('webtools_meds', JSON.stringify(this.meds)));
                    this.$watch('logs', () => localStorage.setItem('webtools_med_logs', JSON.stringify(this.logs)));

                    // init
                },

                get todayKey() {
                    const d = new Date();
                    return `${d.getFullYear()}${d.getMonth()+1}${d.getDate()}`;
                },
                
                get todayStr() {
                    const d = new Date();
                    const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                    return `${d.getMonth()+1}月${d.getDate()}日, ${days[d.getDay()]}`;
                },

                toggleTimeSlot(id) {
                    if (this.newMed.times.includes(id)) {
                        this.newMed.times = this.newMed.times.filter(t => t !== id);
                    } else {
                        this.newMed.times.push(id);
                    }
                },

                addMed() {
                    this.meds.push({
                        id: Date.now(),
                        name: this.newMed.name,
                        dosage: this.newMed.dosage,
                        notes: this.newMed.notes,
                        times: [...this.newMed.times]
                    });
                    this.newMed = { name: '', dosage: '', notes: '', times: [] };
                    this.showAddModal = false;
                    // icons update
                },

                deleteMed(id) {
                    if(confirm('删除此药品提醒？')) {
                        this.meds = this.meds.filter(m => m.id !== id);
                    }
                },

                hasMedsForTime(timeId) {
                    return this.meds.some(m => m.times.includes(timeId));
                },

                getMedsForTime(timeId) {
                    return this.meds.filter(m => m.times.includes(timeId));
                },

                isTaken(medId, timeId) {
                    const dayLog = this.logs[this.todayKey] || {};
                    return !!dayLog[`${medId}_${timeId}`];
                },

                toggleMed(medId, timeId) {
                    const key = this.todayKey;
                    if (!this.logs[key]) this.logs[key] = {};
                    
                    const slotKey = `${medId}_${timeId}`;
                    if (this.logs[key][slotKey]) {
                        delete this.logs[key][slotKey];
                    } else {
                        this.logs[key][slotKey] = true;
                    }
                    // Trigger reactivity
                    this.logs = { ...this.logs };
                },

                get completionRate() {
                    let total = 0;
                    let taken = 0;
                    this.meds.forEach(m => {
                        m.times.forEach(t => {
                            total++;
                            if (this.isTaken(m.id, t)) taken++;
                        });
                    });
                    if (total === 0) return 0;
                    return Math.round((taken / total) * 100);
                },
                
                getIconClass(iconName) {
                    const map = {
                        'sunrise': 'fa-solid fa-sun', // Morning (soft sun?) fa-sun is fine
                        'sun': 'fa-solid fa-sun',     // Noon
                        'sunset': 'fa-solid fa-cloud-sun', // Evening
                        'moon': 'fa-solid fa-moon'    // Bedtime
                    };
                    return map[iconName] || 'fa-solid fa-' + iconName;
            }
            }
        }
    </script>

<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_medication_tracker.md"></script>

</html>
