<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复利计算器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-indigo-50 min-h-screen font-sans text-slate-800" x-data="interestApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-indigo-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-indigo-50 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left w-5 h-5"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                🚀 复利计算器
            </h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-24 grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- Inputs -->
        <div class="md:col-span-4 space-y-4">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-indigo-50">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">初始本金</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-slate-400">¥</span>
                            <input type="number" x-model.number="principal" class="w-full pl-8 font-bold p-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">每年/月追加 (定投)</label>
                         <div class="relative">
                            <span class="absolute left-3 top-3 text-slate-400">¥</span>
                            <input type="number" x-model.number="contribution" class="w-full pl-8 font-bold p-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none transition-all">
                        </div>
                        <div class="flex gap-2 mt-2">
                             <button @click="frequency = 'monthly'" class="flex-1 py-1.5 text-xs font-bold rounded-lg border transition-colors"
                                     :class="frequency === 'monthly' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'">每月</button>
                             <button @click="frequency = 'yearly'" class="flex-1 py-1.5 text-xs font-bold rounded-lg border transition-colors"
                                     :class="frequency === 'yearly' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'">每年</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">年化收益率 (%)</label>
                        <input type="number" step="0.1" x-model.number="rate" class="w-full font-bold p-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none transition-all">
                        <input type="range" min="0" max="20" step="0.5" x-model.number="rate" class="w-full mt-2 accent-indigo-600">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">投资年限 (年)</label>
                        <input type="number" x-model.number="years" class="w-full font-bold p-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none transition-all">
                        <input type="range" min="1" max="50" x-model.number="years" class="w-full mt-2 accent-indigo-600">
                    </div>
                </div>

                <div class="mt-6 p-3 bg-indigo-50 rounded-xl text-xs text-indigo-700 leading-relaxed">
                    <i class="fa-solid fa-circle-info w-3 h-3 inline mr-1"></i>
                    复利被称为"世界第八大奇迹"。时间越长，收益越惊人。
                </div>
            </div>
        </div>

        <!-- Results -->
        <div class="md:col-span-8 space-y-6">
            
            <!-- Big Numbers -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-indigo-50 text-center">
                <div class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">期末总资产</div>
                <div class="text-4xl md:text-5xl font-black text-indigo-600 tracking-tight" x-text="formatCurrency(result.final)"></div>
                
                <div class="grid grid-cols-2 gap-4 mt-8 pt-6 border-t border-slate-100">
                     <div>
                         <div class="text-xs text-slate-400 font-bold uppercase mb-1">本金投入</div>
                         <div class="text-xl font-bold text-slate-700" x-text="formatCurrency(result.totalInvested)"></div>
                     </div>
                     <div>
                         <div class="text-xs text-slate-400 font-bold uppercase mb-1">利息收益</div>
                         <div class="text-xl font-bold text-emerald-500" x-text="'+' + formatCurrency(result.totalInterest)"></div>
                     </div>
                </div>
            </div>

            <!-- Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-indigo-50 h-[400px]">
                <canvas id="growthChart"></canvas>
            </div>

            <!-- Breakdown Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-indigo-50 overflow-hidden">
                <div class="px-6 py-4 border-b border-indigo-50 font-bold text-slate-700">年度明细</div>
                <div class="overflow-x-auto max-h-80">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-indigo-50/50 text-slate-500 sticky top-0">
                            <tr>
                                <th class="px-6 py-3 font-medium">年份</th>
                                <th class="px-6 py-3 font-medium">期初金额</th>
                                <th class="px-6 py-3 font-medium">当年投入</th>
                                <th class="px-6 py-3 font-medium">当年收益</th>
                                <th class="px-6 py-3 font-medium text-right">期末余额</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="row in tableData" :key="row.year">
                                <tr class="hover:bg-indigo-50/30 transition-colors">
                                    <td class="px-6 py-3 font-bold text-indigo-900/50" x-text="row.year"></td>
                                    <td class="px-6 py-3 text-slate-500" x-text="formatNumber(row.start)"></td>
                                    <td class="px-6 py-3 text-slate-500" x-text="formatNumber(row.contribution)"></td>
                                    <td class="px-6 py-3 text-emerald-600 font-medium" x-text="'+' + formatNumber(row.interest)"></td>
                                    <td class="px-6 py-3 text-right font-bold text-slate-800" x-text="formatNumber(row.end)"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script>
        function interestApp() {
            return {
                principal: 10000,
                contribution: 1000,
                years: 20,
                rate: 5,
                frequency: 'monthly', // monthly or yearly
                
                result: { final: 0, totalInvested: 0, totalInterest: 0 },
                tableData: [],
                chart: null,

                init() {
                    // Watch for changes to recalculate
                    this.$watch('principal', () => this.calculate());
                    this.$watch('contribution', () => this.calculate());
                    this.$watch('years', () => this.calculate());
                    this.$watch('rate', () => this.calculate());
                    this.$watch('frequency', () => this.calculate());
                    
                    this.calculate();
                },

                calculate() {
                    const r = this.rate / 100;
                    let balance = this.principal;
                    let totalInvested = this.principal;
                    
                    this.tableData = [];
                    const chartLabels = [];
                    const chartInvested = [];
                    const chartBalance = [];

                    // Add year 0
                    chartLabels.push('Start');
                    chartInvested.push(this.principal);
                    chartBalance.push(this.principal);

                    for (let year = 1; year <= this.years; year++) {
                        const startBalance = balance;
                        let yearContribution = 0;
                        let yearInterest = 0;

                        if (this.frequency === 'monthly') {
                            // Monthly compounding approximation if contributions are monthly
                            // To be precise: usually rates are Annual Percentage Yield (APY) or APR.
                            // Simply: monthly rate = r / 12.
                            const monthlyRate = r / 12;
                            for (let m = 0; m < 12; m++) {
                                balance += this.contribution; 
                                yearContribution += this.contribution;
                                const interest = balance * monthlyRate;
                                yearInterest += interest;
                                balance += interest;
                            }
                        } else {
                            // Yearly contribution
                            balance += this.contribution;
                            yearContribution += this.contribution;
                            const interest = balance * r;
                            yearInterest += interest;
                            balance += interest;
                        }
                        
                        totalInvested += yearContribution;
                        
                        this.tableData.push({
                            year: year,
                            start: startBalance,
                            contribution: yearContribution,
                            interest: yearInterest,
                            end: balance
                        });

                        chartLabels.push('Year ' + year);
                        chartInvested.push(totalInvested);
                        chartBalance.push(balance);
                    }

                    this.result.final = balance;
                    this.result.totalInvested = totalInvested;
                    this.result.totalInterest = balance - totalInvested;
                    
                    this.updateChart(chartLabels, chartInvested, chartBalance);
                },

                updateChart(labels, invested, balance) {
                    const ctx = document.getElementById('growthChart').getContext('2d');
                    
                    if (this.chart) this.chart.destroy();

                    this.chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: '总资产',
                                    data: balance,
                                    borderColor: '#4f46e5', // Indigo-600
                                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                                    fill: true,
                                    tension: 0.4,
                                    pointRadius: 0,
                                    pointHitRadius: 10
                                },
                                {
                                    label: '本金投入',
                                    data: invested,
                                    borderColor: '#cbd5e1', // Slate-300
                                    borderDash: [5, 5],
                                    fill: false,
                                    tension: 0.4,
                                    pointRadius: 0
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false
                            },
                            plugins: {
                                legend: { position: 'top' },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.dataset.label || '';
                                            if (label) label += ': ';
                                            if (context.parsed.y !== null) {
                                                label += new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' }).format(context.parsed.y);
                                            }
                                            return label;
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    ticks: {
                                        callback: function(value) {
                                            if (value >= 10000) return '¥' + (value/10000).toFixed(0) + 'w';
                                            return '¥' + value;
                                        }
                                    }
                                }
                            }
                        }
                    });
                },

                formatCurrency(num) {
                    return new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY', maximumFractionDigits: 0 }).format(num);
                },
                
                formatNumber(num) {
                    return num.toLocaleString('zh-CN', { maximumFractionDigits: 0 });
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_compound_interest.md"></script>

</body>
</html>
