<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>礼物清单 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-rose-50 min-h-screen font-sans" x-data="giftApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-rose-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-rose-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-rose-500 to-pink-600">
                    🎁 礼物清单
                </h1>
            </div>
            
            <div class="flex items-center gap-4 text-sm font-medium">
                <div class="hidden sm:block text-slate-500">
                    预算: <span class="text-slate-900" x-text="'¥' + totalBudget"></span>
                </div>
                <div class="hidden sm:block text-slate-500">
                    已花: <span class="text-rose-600" x-text="'¥' + totalSpent"></span>
                </div>
                <button @click="showAddModal = true" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-lg shadow-lg shadow-rose-500/20 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-plus w-4 h-4"></i>
                    <span class="hidden sm:inline">新人选</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-24">

        <!-- Stats Cards (Mobile visible) -->
        <div class="grid grid-cols-2 gap-4 mb-8 sm:hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-100 flex flex-col items-center">
                <span class="text-xs text-slate-400 uppercase tracking-wider">总预算</span>
                <span class="text-lg font-bold text-slate-800" x-text="'¥' + totalBudget"></span>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-100 flex flex-col items-center">
                <span class="text-xs text-slate-400 uppercase tracking-wider">已支出</span>
                <span class="text-lg font-bold text-rose-600" x-text="'¥' + totalSpent"></span>
            </div>
        </div>

        <!-- Recipients Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" x-show="recipients.length > 0">
            <template x-for="person in recipients" :key="person.id">
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all overflow-hidden relative group">
                    <div class="p-5 border-b border-slate-50 flex justify-between items-start">
                        <div class="flex items-start gap-3">
                            <div class="w-12 h-12 rounded-full bg-rose-100 flex items-center justify-center text-2xl">
                                <span x-text="getAvatar(person.name)"></span>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 text-lg" x-text="person.name"></h3>
                                <div class="flex items-center gap-2 text-xs text-slate-400 mt-1">
                                    <span class="bg-slate-100 px-2 py-0.5 rounded-full" x-text="person.occasion"></span>
                                    <span x-text="person.date"></span>
                                </div>
                            </div>
                        </div>
                        <button @click="deletePerson(person.id)" class="text-slate-300 hover:text-rose-500 transition-colors p-1">
                            <i class="fa-solid fa-trash w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="p-4 space-y-3">
                        <!-- Gift Items -->
                        <template x-for="gift in person.gifts" :key="gift.id">
                            <div class="flex items-center gap-3 group/item">
                                <button @click="toggleGiftStatus(person.id, gift.id)" 
                                        class="w-5 h-5 rounded border flex items-center justify-center transition-all"
                                        :class="getStatusColor(gift.status)">
                                    <i class="fa-solid fa-check w-3 h-3 text-white" x-show="gift.status === 'wrapped' || gift.status === 'bought'"></i>
                                </button>
                                
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm font-medium truncate shrink" 
                                              :class="gift.status === 'wrapped' ? 'text-slate-400 line-through' : 'text-slate-700'"
                                              x-text="gift.name"></span>
                                        <span class="text-xs font-mono ml-2 text-slate-500 whitespace-nowrap" x-text="'¥' + gift.price"></span>
                                    </div>
                                    <!-- Simple Status Text -->
                                    <div class="text-[10px] text-slate-400 flex items-center gap-1 cursor-pointer hover:text-rose-500" @click="cycleStatus(person.id, gift.id)">
                                        <span x-text="getStatusLabel(gift.status)"></span>
                                        <i class="fa-solid fa-chevron-right w-3 h-3"></i>
                                    </div>
                                </div>
                                
                                <button @click="deleteGift(person.id, gift.id)" class="text-slate-300 hover:text-rose-500 opacity-0 group-hover/item:opacity-100 transition-opacity">
                                    <i class="fa-solid fa-xmark w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </template>

                        <!-- Add Gift Input -->
                        <div class="flex items-center gap-2 mt-4 pt-3 border-t border-slate-50">
                            <input type="text" 
                                   placeholder="添加礼物..." 
                                   class="flex-1 bg-slate-50 border-transparent focus:bg-white border focus:border-rose-300 rounded-lg px-3 py-1.5 text-sm outline-none transition-all"
                                   @keydown.enter="addGift(person.id, $event)">
                            <input type="number" 
                                   placeholder="¥" 
                                   class="w-16 bg-slate-50 border-transparent focus:bg-white border focus:border-rose-300 rounded-lg px-2 py-1.5 text-sm outline-none transition-all text-center"
                                   @keydown.enter="addGift(person.id, $event)">
                        </div>
                    </div>
                    
                    <!-- Progress Bar -->
                    <div class="h-1 bg-slate-100 w-full mt-auto">
                        <div class="h-full bg-rose-500 transition-all duration-500" :style="`width: ${getPersonProgress(person)}%`"></div>
                    </div>
                </div>
            </template>
        </div>
        
        <!-- Empty State -->
        <div x-show="recipients.length === 0" class="text-center py-20">
            <div class="w-20 h-20 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-6 text-rose-400">
                <i class="fa-solid fa-gift w-10 h-10"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900">还没有礼物清单</h3>
            <p class="text-slate-500 mt-2 mb-8">开始添加你想送礼物的人吧！</p>
            <button @click="showAddModal = true" class="px-6 py-3 bg-rose-500 text-white rounded-xl font-medium shadow-lg shadow-rose-500/30 hover:shadow-rose-500/50 transition-all">
                添加第一个人
            </button>
        </div>

    </main>

    <!-- Add Person Modal -->
    <div x-show="showAddModal" x-cloak class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6" @click.away="showAddModal = false">
            <h3 class="text-lg font-bold text-slate-900 mb-4">添加送礼对象</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">姓名 / 称呼</label>
                    <input type="text" x-model="newPerson.name" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-200">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">场合 (可选)</label>
                    <select x-model="newPerson.occasion" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-rose-500 bg-white">
                        <option value="生日">生日</option>
                        <option value="节日">节日</option>
                        <option value="纪念日">纪念日</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">日期 (可选)</label>
                    <input type="date" x-model="newPerson.date" class="w-full rounded-xl border-slate-200 border p-3 outline-none focus:border-rose-500">
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button @click="showAddModal = false" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-medium hover:bg-slate-200">取消</button>
                <button @click="addPerson()" 
                        :disabled="!newPerson.name"
                        class="flex-1 py-3 rounded-xl bg-rose-500 text-white font-medium hover:bg-rose-600 shadow-lg shadow-rose-500/20 disabled:opacity-50 disabled:shadow-none">
                    确定
                </button>
            </div>
        </div>
    </div>

    <script>
        function giftApp() {
            return {
                showAddModal: false,
                recipients: [],
                
                newPerson: {
                    name: '',
                    occasion: '生日',
                    date: ''
                },

                init() {
                    const saved = localStorage.getItem('webtools_gifts');
                    if (saved) {
                        this.recipients = JSON.parse(saved);
                    }
                    this.$watch('recipients', () => {
                        localStorage.setItem('webtools_gifts', JSON.stringify(this.recipients));
                    });
                    this.$nextTick(() => { });
                },

                addPerson() {
                    if (!this.newPerson.name) return;
                    this.recipients.unshift({
                        id: Date.now(),
                        name: this.newPerson.name,
                        occasion: this.newPerson.occasion,
                        date: this.newPerson.date,
                        gifts: []
                    });
                    this.newPerson = { name: '', occasion: '生日', date: '' };
                    this.showAddModal = false;
                    this.showAddModal = false;
                },

                deletePerson(id) {
                    if (confirm('确定删除这个人吗？')) {
                        this.recipients = this.recipients.filter(p => p.id !== id);
                    }
                },

                getAvatar(name) {
                    return name ? name.charAt(0).toUpperCase() : '?';
                },
                
                // Gift Logic
                addGift(personId, event) {
                    // Try to find both inputs in the same container to get values
                    const container = event.target.closest('div');
                    const nameInput = container.querySelector('input[type="text"]');
                    const priceInput = container.querySelector('input[type="number"]');
                    
                    const name = nameInput.value.trim();
                    const price = parseFloat(priceInput.value) || 0;
                    
                    if (!name) return;

                    const person = this.recipients.find(p => p.id === personId);
                    if (person) {
                        person.gifts.push({
                            id: Date.now(),
                            name: name,
                            price: price,
                            status: 'idea' // idea -> buy -> bought -> wrapped
                        });
                        nameInput.value = '';
                        priceInput.value = '';
                        nameInput.focus();
                    }
                    nameInput.focus();
                },

                deleteGift(personId, giftId) {
                    const person = this.recipients.find(p => p.id === personId);
                    if (person) {
                        person.gifts = person.gifts.filter(g => g.id !== giftId);
                    }
                },

                cycleStatus(personId, giftId) {
                    const person = this.recipients.find(p => p.id === personId);
                    const gift = person.gifts.find(g => g.id === giftId);
                    if (gift) {
                        const states = ['idea', 'buy', 'bought', 'wrapped'];
                        const idx = states.indexOf(gift.status);
                        gift.status = states[(idx + 1) % states.length];
                    }
                },
                
                toggleGiftStatus(personId, giftId) {
                    // Quick toggle between 'idea' and 'wrapped' (done) for simplicity in checkbox
                    const person = this.recipients.find(p => p.id === personId);
                    const gift = person.gifts.find(g => g.id === giftId);
                    if (gift) {
                        if (gift.status === 'wrapped' || gift.status === 'bought') {
                            gift.status = 'idea';
                        } else {
                            gift.status = 'wrapped';
                        }
                    }
                },

                getStatusColor(status) {
                    if (status === 'idea') return 'border-slate-300 bg-white text-slate-300';
                    if (status === 'buy') return 'border-amber-400 bg-amber-50 text-amber-500';
                    if (status === 'bought') return 'border-emerald-500 bg-emerald-500 text-white';
                    if (status === 'wrapped') return 'border-rose-500 bg-rose-500 text-white';
                    return 'border-slate-200';
                },

                getStatusLabel(status) {
                    const map = {
                        'idea': '想法',
                        'buy': '待买',
                        'bought': '已买',
                        'wrapped': '已包'
                    };
                    return map[status] || status;
                },

                getPersonProgress(person) {
                    if (!person.gifts.length) return 0;
                    const done = person.gifts.filter(g => g.status === 'wrapped' || g.status === 'bought').length;
                    return (done / person.gifts.length) * 100;
                },

                get totalBudget() {
                    return this.recipients.reduce((total, p) => {
                        return total + p.gifts.reduce((sum, g) => sum + (g.price || 0), 0);
                    }, 0);
                },

                get totalSpent() {
                    return this.recipients.reduce((total, p) => {
                        return total + p.gifts
                            .filter(g => g.status === 'bought' || g.status === 'wrapped')
                            .reduce((sum, g) => sum + (g.price || 0), 0);
                    }, 0);
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_gift_tracker.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
