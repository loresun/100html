    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .strength-bar { transition: width 0.3s ease, background-color 0.3s ease; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen font-sans text-slate-800" x-data="pwdApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-emerald-100 sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-emerald-50 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-600 to-teal-500">
                🔐 强密码生成器
            </h1>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-8 pb-24">

        <!-- Result Display -->
        <div class="bg-white rounded-2xl p-6 shadow-xl shadow-emerald-900/5 mb-6 border border-emerald-100 text-center relative overflow-hidden group">
            <div class="text-3xl md:text-4xl font-mono font-bold text-slate-800 tracking-wider break-all mb-4 min-h-[48px]" x-text="password"></div>
            
            <button @click="generate()" class="absolute top-4 right-4 p-2 text-slate-300 hover:text-emerald-500 transition-colors">
                <i class="fa-solid fa-arrows-rotate transition-transform duration-500 group-hover:rotate-180"></i>
            </button>
            
            <div class="flex justify-center">
                 <button @click="copy()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-6 py-2 rounded-full font-bold transition-all active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-copy"></i>
                    复制密码
                </button>
            </div>
            
            <!-- Strength Indicator -->
            <div class="absolute bottom-0 left-0 h-1.5 w-full bg-slate-100">
                <div class="h-full strength-bar" :style="`width: ${strengthScore}%; background-color: ${strengthColor}`"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="bg-white rounded-2xl shadow-sm border border-emerald-50 p-6 space-y-6">
            
            <!-- Length -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="font-bold text-slate-600">密码长度</label>
                    <span class="text-emerald-600 font-bold font-mono text-lg" x-text="length"></span>
                </div>
                <input type="range" min="6" max="64" x-model="length" @input="generate()" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                <div class="flex justify-between text-xs text-slate-400 mt-1">
                    <span>6</span>
                    <span>32</span>
                    <span>64</span>
                </div>
            </div>

            <!-- Options -->
            <div class="grid grid-cols-2 gap-4">
                <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 cursor-pointer hover:bg-slate-50 transition-colors">
                    <input type="checkbox" x-model="options.uppercase" @change="generate()" class="rounded text-emerald-500 focus:ring-emerald-500 w-5 h-5 accent-emerald-500">
                    <span class="text-sm font-medium">ABC (大写)</span>
                </label>
                
                 <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 cursor-pointer hover:bg-slate-50 transition-colors">
                    <input type="checkbox" x-model="options.lowercase" @change="generate()" class="rounded text-emerald-500 focus:ring-emerald-500 w-5 h-5 accent-emerald-500">
                    <span class="text-sm font-medium">abc (小写)</span>
                </label>
                
                 <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 cursor-pointer hover:bg-slate-50 transition-colors">
                    <input type="checkbox" x-model="options.numbers" @change="generate()" class="rounded text-emerald-500 focus:ring-emerald-500 w-5 h-5 accent-emerald-500">
                    <span class="text-sm font-medium">123 (数字)</span>
                </label>
                
                 <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 cursor-pointer hover:bg-slate-50 transition-colors">
                    <input type="checkbox" x-model="options.symbols" @change="generate()" class="rounded text-emerald-500 focus:ring-emerald-500 w-5 h-5 accent-emerald-500">
                    <span class="text-sm font-medium">!@# (符号)</span>
                </label>
            </div>
            
            <div class="text-xs text-slate-400 text-center pt-2">
                提示: 建议设置 16 位以上，包含大小写、数字与符号。
            </div>

        </div>

    </main>

    <script>
        function pwdApp() {
            return {
                length: 16,
                password: '',
                options: {
                    uppercase: true,
                    lowercase: true,
                    numbers: true,
                    symbols: true
                },
                
                init() {
                    this.generate();
                    // init
                },

                generate() {
                    const uppercaseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                    const lowercaseChars = 'abcdefghijklmnopqrstuvwxyz';
                    const numberChars = '0123456789';
                    const symbolChars = '!@#$%^&*()_+~`|}{[]:;?><,./-=';

                    let chars = '';
                    if (this.options.uppercase) chars += uppercaseChars;
                    if (this.options.lowercase) chars += lowercaseChars;
                    if (this.options.numbers) chars += numberChars;
                    if (this.options.symbols) chars += symbolChars;

                    if (chars === '') {
                        this.password = '';
                        return;
                    }

                    let result = '';
                    const array = new Uint32Array(this.length);
                    crypto.getRandomValues(array);

                    for (let i = 0; i < this.length; i++) {
                        result += chars.charAt(array[i] % chars.length);
                    }

                    this.password = result;
                },

                copy() {
                    if(!this.password) return;
                    navigator.clipboard.writeText(this.password).then(() => {
                        // Toast logic here if needed
                        const btn = document.querySelector('button i[class*="fa-copy"]').parentNode;
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '<i class="fa-solid fa-check"></i> 已复制';
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                        }, 2000);
                    });
                },

                get strengthScore() {
                    if (!this.password) return 0;
                    let score = 0;
                    if (this.password.length > 8) score += 20;
                    if (this.password.length > 12) score += 20;
                    if (this.password.length >= 16) score += 20;
                    if (this.options.uppercase) score += 10;
                    if (this.options.lowercase) score += 10;
                    if (this.options.numbers) score += 10;
                    if (this.options.symbols) score += 10;
                    return Math.min(100, score);
                },

                get strengthColor() {
                    const score = this.strengthScore;
                    if (score < 40) return '#ef4444'; // red
                    if (score < 70) return '#f59e0b'; // orange
                    return '#10b981'; // emerald
                }
            }
        }
    </script>

</html>
