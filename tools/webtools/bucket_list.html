<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生清单 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-cyan-50 min-h-screen font-sans text-slate-800" x-data="bucketApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur border-b border-cyan-200 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-cyan-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-600 to-teal-600">
                    🏔️ 人生清单 Bucket List
                </h1>
            </div>
            
            <div class="flex items-center gap-4">
                 <div class="hidden sm:block text-right">
                     <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">完成度</div>
                     <div class="text-lg font-bold text-cyan-600 leading-none">
                        <span x-text="completedCount"></span>/<span x-text="items.length"></span>
                    </div>
                 </div>
                 <button @click="showModal = true" class="bg-cyan-600 hover:bg-cyan-700 text-white p-2 rounded-lg shadow-lg shadow-cyan-600/20 transition-all">
                    <i class="fa-solid fa-plus w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 pb-24">

        <!-- Progress Bar -->
        <div class="h-2 bg-cyan-100 rounded-full overflow-hidden mb-8">
            <div class="h-full bg-cyan-500 transition-all duration-1000 ease-out" :style="`width: ${progress}%`"></div>
        </div>

        <!-- Filter -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
            <button @click="filter = 'all'" class="px-3 py-1.5 rounded-full text-sm font-bold border transition-colors" :class="filter === 'all' ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'">全部</button>
            <button @click="filter = 'active'" class="px-3 py-1.5 rounded-full text-sm font-bold border transition-colors" :class="filter === 'active' ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'">进行中</button>
            <button @click="filter = 'completed'" class="px-3 py-1.5 rounded-full text-sm font-bold border transition-colors" :class="filter === 'completed' ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'">已达成</button>
        </div>

        <!-- List -->
        <div class="space-y-4">
            <template x-for="item in filteredItems" :key="item.id">
                <div class="bg-white rounded-2xl p-5 border shadow-sm hover:translate-y-[-2px] transition-all duration-300 group"
                     :class="item.done ? 'border-cyan-200 bg-cyan-50/30' : 'border-slate-100'">
                    
                    <div class="flex items-start gap-4">
                        <!-- Checkbox -->
                        <button @click="toggleItem(item)" 
                                class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 mt-0.5 transition-all"
                                :class="item.done ? 'bg-cyan-500 border-cyan-500' : 'border-slate-300 hover:border-cyan-400'">
                            <i class="fa-solid fa-check w-3.5 h-3.5 text-white" x-show="item.done"></i>
                        </button>
                        
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-lg leading-tight transition-colors" 
                                :class="item.done ? 'text-cyan-800 line-through decoration-cyan-300' : 'text-slate-800'"
                                x-text="item.title"></h3>
                            
                            <div class="flex flex-wrap gap-2 mt-2">
                                <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-500 tracking-wider" x-text="getCategoryLabel(item.category)"></span>
                                <span class="text-[10px] text-cyan-600 font-medium flex items-center gap-1" x-show="item.done && item.doneDate">
                                    <i class="fa-solid fa-calendar-check w-3 h-3"></i>
                                    <span x-text="formatDate(item.doneDate)"></span>
                                </span>
                            </div>

                            <p class="text-sm text-slate-500 mt-2 bg-slate-50 p-2 rounded-lg italic" x-show="item.story" x-text="item.story"></p>
                        </div>

                        <!-- Menu -->
                         <div class="opacity-0 group-hover:opacity-100 transition-opacity flex flex-col gap-2">
                            <button @click="editItem(item)" class="text-slate-300 hover:text-cyan-600"><i class="fa-solid fa-pen w-4 h-4"></i></button>
                            <button @click="deleteItem(item.id)" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash-can w-4 h-4"></i></button>
                         </div>
                    </div>
                </div>
            </template>
            
            <div x-show="filteredItems.length === 0" class="text-center py-20 text-slate-400">
                <i class="fa-solid fa-flag w-12 h-12 mx-auto mb-4 opacity-20"></i>
                <p>这里还没有条目</p>
            </div>
        </div>

    </main>

    <!-- Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6" @click.away="closeModal()">
            <h3 class="text-lg font-bold text-slate-900 mb-4" x-text="tempItem.id ? '编辑愿望' : '添加愿望'"></h3>
            <div class="space-y-4">
                <div>
                     <label class="block text-xs font-bold text-slate-500 mb-1">愿望内容</label>
                     <input type="text" x-model="tempItem.title" class="w-full rounded-xl border border-slate-200 p-3 outline-none focus:border-cyan-500" placeholder="例如: 去冰岛看极光">
                </div>
                <div>
                     <label class="block text-xs font-bold text-slate-500 mb-1">类别</label>
                     <select x-model="tempItem.category" class="w-full rounded-xl border border-slate-200 p-3 outline-none focus:border-cyan-500 bg-white">
                         <option value="travel">✈️ 旅行</option>
                         <option value="skill">🎸 技能</option>
                         <option value="career">💼 事业</option>
                         <option value="life">❤️ 生活</option>
                         <option value="other">✨ 其他</option>
                     </select>
                </div>
                
                <div x-show="tempItem.done" class="space-y-4 pt-2 border-t border-slate-100">
                    <div>
                         <label class="block text-xs font-bold text-slate-500 mb-1">完成日期</label>
                         <input type="date" x-model="tempItem.doneDate" class="w-full rounded-xl border border-slate-200 p-3 outline-none focus:border-cyan-500">
                    </div>
                    <div>
                         <label class="block text-xs font-bold text-slate-500 mb-1">达成故事 / 感想</label>
                         <textarea x-model="tempItem.story" rows="3" class="w-full rounded-xl border border-slate-200 p-3 outline-none focus:border-cyan-500" placeholder="那一刻的感觉..."></textarea>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex gap-3">
                <button @click="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">取消</button>
                <button @click="saveItem()" 
                        :disabled="!tempItem.title"
                        class="flex-1 py-3 rounded-xl bg-cyan-600 text-white font-bold hover:bg-cyan-700 shadow-lg shadow-cyan-600/20 disabled:opacity-50 disabled:shadow-none">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        function bucketApp() {
            return {
                showModal: false,
                filter: 'all',
                items: [],
                
                tempItem: { id: null, title: '', category: 'travel', done: false, doneDate: '', story: '' },

                init() {
                    const saved = localStorage.getItem('webtools_bucket_list');
                    if (saved) {
                        this.items = JSON.parse(saved);
                    } else {
                        // Demo
                        this.items = [
                            { id: 1, title: '学会冲浪', category: 'skill', done: false, doneDate: '', story: '' },
                            { id: 2, title: '去日本看樱花', category: 'travel', done: true, doneDate: '2024-04-10', story: '即使人很多，樱花雨落下的瞬间还是很感动。' }
                        ];
                    }
                    this.$watch('items', () => {
                        localStorage.setItem('webtools_bucket_list', JSON.stringify(this.items));
                    }, { deep: true });
                    

                },

                get filteredItems() {
                    let list = this.items;
                    if (this.filter === 'active') list = list.filter(i => !i.done);
                    if (this.filter === 'completed') list = list.filter(i => i.done);
                    
                    // Sort: Completed at bottom, then by cat maybe? Or just newer first
                    return list.sort((a,b) => {
                        if (a.done === b.done) return b.id - a.id;
                        return a.done ? 1 : -1;
                    });
                },

                get progress() {
                    if (this.items.length === 0) return 0;
                    return Math.round((this.completedCount / this.items.length) * 100);
                },

                get completedCount() {
                    return this.items.filter(i => i.done).length;
                },

                saveItem() {
                    if (this.tempItem.id) {
                        const idx = this.items.findIndex(i => i.id === this.tempItem.id);
                        if (idx !== -1) this.items[idx] = { ...this.tempItem };
                    } else {
                        this.items.unshift({
                            ...this.tempItem,
                            id: Date.now()
                        });
                    }
                    this.closeModal();

                },

                editItem(item) {
                    this.tempItem = JSON.parse(JSON.stringify(item));
                    this.showModal = true;
                },
                
                toggleItem(item) {
                    item.done = !item.done;
                    if (item.done && !item.doneDate) {
                        item.doneDate = new Date().toISOString().split('T')[0];
                        // Optionally prompt for story? Nah, let user edit.
                    }
                },

                deleteItem(id) {
                    if (confirm('放弃这个目标？')) {
                        this.items = this.items.filter(i => i.id !== id);
                    }
                },
                
                closeModal() {
                    this.showModal = false;
                    this.tempItem = { id: null, title: '', category: 'travel', done: false, doneDate: '', story: '' };
                },

                getCategoryLabel(c) {
                    const map = { travel: '旅行', skill: '技能', career: '事业', life: '生活', other: '其他' };
                    return map[c] || c;
                },

                formatDate(str) {
                    if(!str) return '';
                    return str.replaceAll('-', '/');
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_bucket_list.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
