<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间戳转换器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" x-data="timestampApp()" x-init="init()">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold text-slate-800">⏱️ 时间戳转换器</h1>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Current Time -->
        <div class="bg-gradient-to-r from-indigo-500 to-purple-500 rounded-2xl p-8 text-white mb-8 shadow-lg">
            <div class="text-center">
                <div class="text-sm opacity-80 mb-2">当前时间</div>
                <div class="text-4xl font-bold mb-4" x-text="currentTime">00:00:00</div>
                <div class="text-lg opacity-90" x-text="currentDate">2024-01-01</div>
                <div class="mt-4 pt-4 border-t border-white/20">
                    <div class="text-sm opacity-80 mb-1">当前时间戳</div>
                    <div class="flex items-center justify-center gap-2">
                        <code class="text-2xl font-mono" x-text="currentTimestamp">0</code>
                        <button @click="copyText(currentTimestamp)" class="p-2 bg-white/20 hover:bg-white/30 rounded-lg transition-colors">
                            <i class="fa-solid fa-copy w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Timestamp to Date -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">时间戳 → 日期时间</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">输入时间戳</label>
                    <div class="flex gap-2">
                        <input 
                            type="text" 
                            x-model="inputTimestamp"
                            @input="convertTimestamp()"
                            placeholder="例如: 1704067200"
                            class="flex-1 px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none font-mono"
                        />
                        <button @click="inputTimestamp = currentTimestamp; convertTimestamp()" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                            当前
                        </button>
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button @click="timestampUnit = 's'; convertTimestamp()" :class="timestampUnit === 's' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'" class="px-3 py-1 rounded text-sm transition-colors">
                            秒 (s)
                        </button>
                        <button @click="timestampUnit = 'ms'; convertTimestamp()" :class="timestampUnit === 'ms' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'" class="px-3 py-1 rounded text-sm transition-colors">
                            毫秒 (ms)
                        </button>
                    </div>
                </div>

                <div x-show="convertedDate" class="space-y-3">
                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                        <div class="text-xs text-slate-500 mb-1">ISO 8601</div>
                        <div class="flex items-center justify-between">
                            <code class="font-mono text-slate-800" x-text="formats.iso"></code>
                            <button @click="copyText(formats.iso)" class="text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-copy w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                        <div class="text-xs text-slate-500 mb-1">中文格式</div>
                        <div class="flex items-center justify-between">
                            <code class="font-mono text-slate-800" x-text="formats.cn"></code>
                            <button @click="copyText(formats.cn)" class="text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-copy w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                        <div class="text-xs text-slate-500 mb-1">美式格式</div>
                        <div class="flex items-center justify-between">
                            <code class="font-mono text-slate-800" x-text="formats.us"></code>
                            <button @click="copyText(formats.us)" class="text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-copy w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                        <div class="text-xs text-slate-500 mb-1">相对时间</div>
                        <div class="text-slate-800" x-text="formats.relative"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Date to Timestamp -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">日期时间 → 时间戳</h3>
            
            <div class="space-y-4">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">日期</label>
                        <input 
                            type="date" 
                            x-model="inputDate"
                            @input="convertDate()"
                            class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                        />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">时间</label>
                        <input 
                            type="time" 
                            x-model="inputTime"
                            @input="convertDate()"
                            class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                        />
                    </div>
                </div>

                <div x-show="outputTimestamp" class="grid md:grid-cols-2 gap-4">
                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                        <div class="text-xs text-slate-500 mb-1">秒级时间戳</div>
                        <div class="flex items-center justify-between">
                            <code class="font-mono text-lg text-slate-800" x-text="outputTimestamp"></code>
                            <button @click="copyText(outputTimestamp)" class="text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-copy w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                        <div class="text-xs text-slate-500 mb-1">毫秒级时间戳</div>
                        <div class="flex items-center justify-between">
                            <code class="font-mono text-lg text-slate-800" x-text="outputTimestampMs"></code>
                            <button @click="copyText(outputTimestampMs)" class="text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-copy w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function timestampApp() {
            return {
                currentTime: '',
                currentDate: '',
                currentTimestamp: 0,
                inputTimestamp: '',
                timestampUnit: 's',
                convertedDate: null,
                formats: {},
                inputDate: '',
                inputTime: '00:00',
                outputTimestamp: '',
                outputTimestampMs: '',

                init() {
                    this.updateCurrent();
                    setInterval(() => this.updateCurrent(), 1000);
                    
                    const now = new Date();
                    this.inputDate = now.toISOString().split('T')[0];
                    this.inputTime = now.toTimeString().slice(0, 5);
                    this.convertDate();
                    
                    
                },

                updateCurrent() {
                    const now = new Date();
                    this.currentTime = now.toLocaleTimeString('zh-CN');
                    this.currentDate = now.toLocaleDateString('zh-CN', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric',
                        weekday: 'long'
                    });
                    this.currentTimestamp = Math.floor(now.getTime() / 1000);
                },

                convertTimestamp() {
                    if (!this.inputTimestamp) {
                        this.convertedDate = null;
                        return;
                    }

                    try {
                        let ts = parseInt(this.inputTimestamp);
                        if (this.timestampUnit === 's') {
                            ts = ts * 1000;
                        }

                        const date = new Date(ts);
                        if (isNaN(date.getTime())) {
                            this.convertedDate = null;
                            return;
                        }

                        this.convertedDate = date;
                        this.formats = {
                            iso: date.toISOString(),
                            cn: date.toLocaleString('zh-CN', {
                                year: 'numeric',
                                month: '2-digit',
                                day: '2-digit',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit'
                            }),
                            us: date.toLocaleString('en-US', {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit'
                            }),
                            relative: this.getRelativeTime(date)
                        };
                    } catch (e) {
                        this.convertedDate = null;
                    }

                    
                },

                convertDate() {
                    if (!this.inputDate) return;

                    const dateTime = new Date(`${this.inputDate}T${this.inputTime}`);
                    this.outputTimestamp = Math.floor(dateTime.getTime() / 1000);
                    this.outputTimestampMs = dateTime.getTime();

                    
                },

                getRelativeTime(date) {
                    const now = new Date();
                    const diff = now - date;
                    const absDiff = Math.abs(diff);
                    const isPast = diff > 0;

                    const seconds = Math.floor(absDiff / 1000);
                    const minutes = Math.floor(seconds / 60);
                    const hours = Math.floor(minutes / 60);
                    const days = Math.floor(hours / 24);

                    if (days > 0) return `${isPast ? '' : ''}${days} 天${isPast ? '前' : '后'}`;
                    if (hours > 0) return `${isPast ? '' : ''}${hours} 小时${isPast ? '前' : '后'}`;
                    if (minutes > 0) return `${isPast ? '' : ''}${minutes} 分钟${isPast ? '前' : '后'}`;
                    return `${isPast ? '' : ''}${seconds} 秒${isPast ? '前' : '后'}`;
                },

                copyText(text) {
                    navigator.clipboard.writeText(text.toString()).then(() => {
                        alert('已复制到剪贴板');
                    });
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_timestamp_converter.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
