    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简记账 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        /* @apply is not supported in CDN without build step, so we use a utility class in JS or just standard CSS where needed, but here let's just inline it in usage or define standard CSS */
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-stone-50 min-h-screen font-sans text-stone-800" x-data="budgetApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-stone-100 text-stone-600 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold text-stone-900">
                    👛 极简记账
                </h1>
            </div>
            
            <div class="text-right">
                <div class="text-[10px] text-stone-400 font-bold uppercase">本月支出</div>
                <div class="text-lg font-bold text-stone-900 font-mono" x-text="'¥' + monthlyTotal"></div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 pb-24">

        <!-- Display Area -->
        <div class="mb-4">
             <!-- Calculator Screen -->
             <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 text-right mb-4 min-h-[100px] flex flex-col justify-end">
                 <div class="text-stone-400 text-sm mb-1" x-text="categoryName ? categoryName : '选择分类...'"></div>
                 <div class="text-4xl font-mono font-bold text-stone-900 truncate" x-text="currentInput || '0'"></div>
             </div>
             
             <!-- Category Grid (Only show if no input or inputting) -->
             <div class="grid grid-cols-4 gap-2 mb-4">
                 <template x-for="cat in categories" :key="cat.id">
                     <button @click="selectCategory(cat)" 
                             class="flex flex-col items-center justify-center p-2 rounded-xl border transition-all"
                             :class="selectedCategory === cat.id ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-500 border-stone-100 hover:bg-stone-50'">
                         <i :class="cat.icon" class="mb-1 text-xl"></i>
                         <span class="text-[10px]" x-text="cat.name"></span>
                     </button>
                 </template>
             </div>
             
             <!-- Numpad -->
             <div class="grid grid-cols-4 gap-2">
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('7')">7</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('8')">8</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('9')">9</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none text-rose-500" @click="del()"><i class="fa-solid fa-delete-left"></i></button>
                 
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('4')">4</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('5')">5</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('6')">6</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none text-xs font-bold text-stone-500" @click="clear()">C</button>
                 
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('1')">1</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('2')">2</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('3')">3</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none row-span-2 bg-stone-900 text-white border-stone-900 hover:bg-black" @click="save()">
                     <i class="fa-solid fa-check"></i>
                 </button>
                 
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none col-span-2" @click="append('0')">0</button>
                 <button class="flex items-center justify-center text-xl font-bold p-4 bg-white rounded-xl shadow-sm border border-stone-200 active:bg-stone-100 active:scale-95 transition-all select-none" @click="append('.')">.</button>
             </div>
        </div>

        <!-- Recent List -->
        <h2 class="text-sm font-bold text-stone-400 uppercase tracking-widest mb-3 mt-8">最近记录</h2>
        <div class="space-y-3">
            <template x-for="item in recentItems" :key="item.id">
                <div class="flex items-center justify-between p-4 bg-white rounded-xl border border-stone-100 shadow-sm group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-stone-100 flex items-center justify-center text-stone-500">
                             <i :class="getIcon(item.category)" class="text-sm"></i>
                        </div>
                        <div>
                            <div class="font-bold text-stone-800" x-text="getCatName(item.category)"></div>
                            <div class="text-xs text-stone-400" x-text="formatDate(item.date)"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-mono font-bold text-lg" x-text="'-' + item.amount"></span>
                        <button @click="deleteItem(item.id)" class="text-stone-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            </template>
            <div x-show="items.length === 0" class="text-center py-10 text-stone-400 text-sm">暂无记录</div>
        </div>

    </main>

    <script>
        function budgetApp() {
            return {
                currentInput: '',
                selectedCategory: 'food',
                items: [],
                
                categories: [
                    { id: 'food', name: '餐饮', icon: 'fa-solid fa-utensils' },
                    { id: 'transport', name: '交通', icon: 'fa-solid fa-bus' },
                    { id: 'shopping', name: '购物', icon: 'fa-solid fa-bag-shopping' },
                    { id: 'ent', name: '娱乐', icon: 'fa-solid fa-gamepad' },
                    { id: 'home', name: '居住', icon: 'fa-solid fa-house' },
                    { id: 'groceries', name: '买菜', icon: 'fa-solid fa-carrot' },
                    { id: 'med', name: '医疗', icon: 'fa-solid fa-heart-pulse' },
                    { id: 'other', name: '其他', icon: 'fa-solid fa-ellipsis' },
                ],

                init() {
                    const saved = localStorage.getItem('webtools_simple_budget');
                    if (saved) this.items = JSON.parse(saved);

                },

                append(char) {
                    if (char === '.' && this.currentInput.includes('.')) return;
                    if (this.currentInput.length > 8) return;
                    this.currentInput += char;
                },

                del() {
                    this.currentInput = this.currentInput.slice(0, -1);
                },

                clear() {
                    this.currentInput = '';
                },
                
                selectCategory(cat) {
                    this.selectedCategory = cat.id;
                },

                save() {
                    const amount = parseFloat(this.currentInput);
                    if (!amount || isNaN(amount)) return;
                    
                    this.items.unshift({
                        id: Date.now(),
                        amount: amount,
                        category: this.selectedCategory,
                        date: new Date().toISOString()
                    });
                    
                    this.currentInput = '';
                    localStorage.setItem('webtools_simple_budget', JSON.stringify(this.items));

                },
                
                deleteItem(id) {
                    if(confirm('删除此条记录？')) {
                        this.items = this.items.filter(i => i.id !== id);
                        localStorage.setItem('webtools_simple_budget', JSON.stringify(this.items));
                    }
                },

                get recentItems() {
                    return this.items.slice(0, 20); // Show last 20
                },

                get monthlyTotal() {
                    const now = new Date();
                    return this.items
                        .filter(i => {
                            const d = new Date(i.date);
                            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                        })
                        .reduce((sum, i) => sum + i.amount, 0)
                        .toFixed(2);
                },
                
                get categoryName() {
                    const c = this.categories.find(x => x.id === this.selectedCategory);
                    return c ? c.name : '';
                },
                
                getCatName(id) {
                    const c = this.categories.find(x => x.id === id);
                    return c ? c.name : id;
                },
                
                getIcon(id) {
                    const c = this.categories.find(x => x.id === id);
                    return c ? c.icon : 'circle';
                },

                formatDate(iso) {
                    const d = new Date(iso);
                    return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_simple_budget.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
