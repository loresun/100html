<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV / JSON 转换器 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-amber-50 min-h-screen font-sans text-slate-800" x-data="convertApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-amber-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-amber-50 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left w-5 h-5"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-amber-600 to-orange-500">
                🔄 CSV / JSON 转换器
            </h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 pb-24 h-[calc(100vh-64px)] min-h-[600px] flex flex-col">

        <!-- Toolbar -->
        <div class="mb-4 flex justify-between items-center">
            <div class="flex bg-white rounded-lg p-1 border border-amber-200">
                <button @click="mode = 'csv2json'" 
                        :class="mode === 'csv2json' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-500 hover:text-amber-600'"
                        class="px-4 py-1.5 rounded-md text-sm font-bold transition-all">CSV 转 JSON</button>
                <button @click="mode = 'json2csv'" 
                        :class="mode === 'json2csv' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-500 hover:text-amber-600'"
                        class="px-4 py-1.5 rounded-md text-sm font-bold transition-all">JSON 转 CSV</button>
            </div>
            
             <div class="flex gap-2">
                 <button @click="sample()" class="text-xs font-bold text-amber-600 hover:text-amber-700 px-3 py-1.5 bg-amber-50 rounded-lg transition-colors">
                    加载示例
                 </button>
                 <button @click="input=''; output=''" class="text-xs font-bold text-slate-400 hover:text-rose-500 px-3 py-1.5 bg-slate-50 rounded-lg transition-colors">
                    清空
                 </button>
            </div>
        </div>

        <!-- Editors -->
        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 h-full overflow-hidden">
            
            <!-- Left Input -->
            <div class="flex flex-col h-full bg-white rounded-xl shadow-sm border border-amber-200 overflow-hidden">
                <div class="px-4 py-2 bg-amber-50/50 border-b border-amber-100 flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500 uppercase" x-text="mode === 'csv2json' ? 'CSV 输入' : 'JSON 输入'"></span>
                    <label class="text-xs text-amber-600 cursor-pointer hover:underline">
                        导入文件
                        <input type="file" @change="loadFile($event)" class="hidden" accept=".csv,.json,.txt">
                    </label>
                </div>
                <textarea x-model="input" 
                          class="flex-1 w-full p-4 resize-none outline-none text-slate-700 code-font text-sm leading-6"
                          :placeholder="mode === 'csv2json' ? 'Paste CSV here...' : 'Paste JSON array here...'"
                          spellcheck="false"></textarea>
            </div>

            <!-- Right Output -->
            <div class="flex flex-col h-full bg-white rounded-xl shadow-sm border border-amber-200 overflow-hidden relative">
                 <div class="px-4 py-2 bg-slate-50/80 border-b border-slate-200 flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500 uppercase" x-text="mode === 'csv2json' ? 'JSON 结果' : 'CSV 结果'"></span>
                    <button @click="copy()" class="text-xs font-bold text-blue-500 hover:text-blue-600 flex items-center gap-1">
                        <i class="fa-solid fa-copy w-3 h-3"></i> 复制
                    </button>
                </div>
                <textarea x-model="output" 
                          readonly
                          class="flex-1 w-full p-4 resize-none outline-none text-slate-600 bg-slate-50/30 code-font text-sm leading-6"
                          placeholder="Results will appear here..."></textarea>
                
                <!-- Action Button Overlay (Center) -->
                <div class="absolute top-1/2 left-0 -translate-y-1/2 -translate-x-1/2 z-10 hidden md:block" style="left: -8px;">
                     <button @click="convert()" class="h-12 w-12 bg-amber-500 hover:bg-amber-600 text-white rounded-full shadow-lg flex items-center justify-center transition-transform hover:scale-110 active:scale-95 border-4 border-white">
                         <i class="fa-solid fa-right-left w-5 h-5"></i>
                     </button>
                </div>
                <!-- Mobile Button -->
                 <div class="absolute bottom-4 right-4 z-10 md:hidden">
                     <button @click="convert()" class="h-12 w-12 bg-amber-500 text-white rounded-full shadow-lg flex items-center justify-center">
                         <i class="fa-solid fa-arrow-down w-5 h-5"></i>
                     </button>
                </div>
            </div>

        </div>

        <div x-show="error" class="mt-4 p-3 bg-rose-50 text-rose-600 text-sm rounded-lg border border-rose-100 flex items-center gap-2 animate-fade-in">
            <i class="fa-solid fa-circle-exclamation w-4 h-4"></i>
            <span x-text="error"></span>
        </div>

    </main>

    <script>
        function convertApp() {
            return {
                mode: 'csv2json', // or json2csv
                input: '',
                output: '',
                error: '',

                init() {
                    this.$watch('mode', () => {
                        this.input = '';
                        this.output = '';
                        this.error = '';
                    });
                },
                
                loadFile(e) {
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        this.input = ev.target.result;
                        this.convert();
                    };
                    reader.readAsText(file);
                },

                sample() {
                    if (this.mode === 'csv2json') {
                        this.input = `name,age,city
Alice,28,New York
Bob,35,San Francisco
Charlie,22,London`;
                    } else {
                        this.input = `[
  {
    "name": "Alice",
    "age": 28,
    "city": "New York"
  },
  {
    "name": "Bob",
    "age": 35,
    "city": "San Francisco"
  }
]`;
                    }
                    this.convert();
                },

                convert() {
                    this.error = '';
                    if (!this.input.trim()) return;

                    try {
                        if (this.mode === 'csv2json') {
                            // CSV to JSON
                            Papa.parse(this.input, {
                                header: true,
                                skipEmptyLines: true,
                                complete: (results) => {
                                    if (results.errors.length) {
                                        this.error = "CSV 解析错误: " + results.errors[0].message;
                                    } else {
                                        this.output = JSON.stringify(results.data, null, 2);
                                    }
                                }
                            });
                        } else {
                            // JSON to CSV
                            const jsonData = JSON.parse(this.input);
                            const csv = Papa.unparse(jsonData);
                            this.output = csv;
                        }
                    } catch (e) {
                         this.error = "转换失败: " + e.message;
                    }
                },
                
                copy() {
                    if(!this.output) return;
                    navigator.clipboard.writeText(this.output).then(() => {
                        // Toast?
                    });
                }
            }
        }
    </script>

</html>
