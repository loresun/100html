<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片裁剪工具 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .cropper-container { border-radius: 0.75rem; overflow: hidden; }
        .cropper-bg { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-indigo-50 min-h-screen font-sans text-slate-800" x-data="cropperApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-indigo-100 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-3">
            <a href="./index.html" class="p-2 rounded-lg hover:bg-indigo-50 text-slate-600 transition-colors">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </a>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                ✂️ 图片裁剪工具
            </h1>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 pb-24 grid grid-cols-1 md:grid-cols-12 gap-6 h-[calc(100vh-64px)] min-h-[600px]">

        <!-- Main Area -->
        <div class="md:col-span-8 lg:col-span-9 flex flex-col h-full bg-slate-900/5 rounded-3xl border border-indigo-100/50 overflow-hidden relative">
            
            <!-- Empty State -->
            <div x-show="!imageSrc" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-white">
                <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-400"></i>
                </div>
                <p class="mb-4 font-bold text-lg text-slate-600">选择一张图片开始</p>
                <label class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full font-bold cursor-pointer transition-colors shadow-lg active:scale-95">
                    上传图片
                    <input type="file" class="hidden" accept="image/*" @change="loadImage($event)">
                </label>
            </div>

            <!-- Cropper Canvas -->
            <div x-show="imageSrc" class="w-full flex-1 bg-slate-800 cropper-bg flex items-center justify-center overflow-hidden relative">
                <img id="image" class="max-w-full max-h-full block opacity-0 transition-opacity duration-300" :class="loaded && 'opacity-100'">
            </div>
        </div>

        <!-- Controls Sidebar -->
        <div class="md:col-span-4 lg:col-span-3 space-y-4 flex flex-col h-full overflow-y-auto custom-scrollbar">
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100 flex-none" x-show="imageSrc">
                <div class="flex gap-2">
                    <label class="flex-1 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg text-xs font-bold text-center cursor-pointer transition-colors">
                        更换图片
                        <input type="file" class="hidden" accept="image/*" @change="loadImage($event)">
                    </label>
                    <button @click="reset()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-bold transition-colors">
                        重置
                    </button>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100 flex-1" x-show="imageSrc">
                <h3 class="font-bold text-slate-700 mb-4 text-xs uppercase flex items-center gap-2">
                    <i class="fa-solid fa-crop text-indigo-500"></i>
                    裁剪比例
                </h3>
                
                <div class="grid grid-cols-2 gap-2 mb-6">
                    <template x-for="r in ratios">
                        <button @click="setRatio(r.value)" 
                            class="py-2 rounded-lg text-xs font-bold border transition-colors relative"
                            :class="currentRatio === r.value ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'"
                        >
                            <span x-text="r.label"></span>
                        </button>
                    </template>
                </div>
                
                <h3 class="font-bold text-slate-700 mb-4 text-xs uppercase flex items-center gap-2">
                    <i class="fa-solid fa-rotate text-indigo-500"></i>
                    旋转与翻转
                </h3>
                
                <div class="grid grid-cols-4 gap-2 mb-6">
                    <button @click="rotate(-90)" class="aspect-square flex items-center justify-center rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 transition-colors" title="左转 90°">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    <button @click="rotate(90)" class="aspect-square flex items-center justify-center rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 transition-colors" title="右转 90°">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                     <button @click="flipX()" class="aspect-square flex items-center justify-center rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 transition-colors" title="水平翻转">
                        <i class="fa-solid fa-arrows-left-right"></i>
                    </button>
                    <button @click="flipY()" class="aspect-square flex items-center justify-center rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 transition-colors" title="垂直翻转">
                        <i class="fa-solid fa-arrows-up-down"></i>
                    </button>
                </div>

                <div class="mb-4">
                     <button @click="crop()" class="w-full py-3 bg-slate-900 hover:bg-black text-white rounded-xl font-bold shadow-lg shadow-slate-900/10 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-scissors"></i>
                        裁剪并预览
                    </button>
                </div>
                
                <!-- Preview Result & Download -->
                <div x-show="croppedImage" x-transition class="space-y-4">
                     <div class="rounded-xl overflow-hidden border border-slate-200 bg-slate-100/50 p-2">
                         <img :src="croppedImage" class="w-full h-auto rounded-lg shadow-sm">
                     </div>
                     <button @click="download()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i>
                        下载结果
                    </button>
                </div>

            </div>

        </div>

    </main>

    <script>
        function cropperApp() {
            return {
                imageSrc: null,
                cropper: null,
                loaded: false,
                currentRatio: NaN, // NaN = Free
                croppedImage: null,
                scaleX: 1,
                scaleY: 1,

                ratios: [
                    { label: '自由', value: NaN },
                    { label: '1:1', value: 1 },
                    { label: '4:3', value: 4/3 },
                    { label: '16:9', value: 16/9 },
                    { label: '2:3', value: 2/3 },
                    { label: '3:4', value: 3/4 },
                ],

                init() {
                    // init
                },

                loadImage(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.imageSrc = e.target.result;
                        this.croppedImage = null;
                        this.loaded = false;
                        
                        this.$nextTick(() => {
                            const image = document.getElementById('image');
                            image.src = this.imageSrc;
                            
                            if (this.cropper) {
                                this.cropper.destroy();
                            }

                            this.cropper = new Cropper(image, {
                                viewMode: 1,
                                aspectRatio: NaN,
                                background: false,
                                autoCropArea: 0.8,
                                ready: () => {
                                    this.loaded = true;
                                }
                            });
                        });
                    };
                    reader.readAsDataURL(file);
                },

                setRatio(val) {
                    this.currentRatio = val;
                    if(this.cropper) this.cropper.setAspectRatio(val);
                },

                rotate(deg) {
                    if(this.cropper) this.cropper.rotate(deg);
                },
                
                flipX() {
                    if(!this.cropper) return;
                    this.scaleX = -this.scaleX;
                    this.cropper.scaleX(this.scaleX);
                },
                
                flipY() {
                     if(!this.cropper) return;
                    this.scaleY = -this.scaleY;
                    this.cropper.scaleY(this.scaleY);
                },
                
                reset() {
                    if(this.cropper) {
                        this.cropper.reset();
                        this.scaleX = 1;
                        this.scaleY = 1;
                        this.setRatio(NaN);
                        this.croppedImage = null;
                    }
                },

                crop() {
                    if (!this.cropper) return;
                    const canvas = this.cropper.getCroppedCanvas();
                    if(!canvas) return;
                    this.croppedImage = canvas.toDataURL('image/png');
                },

                download() {
                    if (!this.croppedImage) return;
                    const link = document.createElement('a');
                    link.download = `cropped-${Date.now()}.png`;
                    link.href = this.croppedImage;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_image_cropper.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
