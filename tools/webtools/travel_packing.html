<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行清单 | Webtools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
        .progress-transition {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-sky-50 min-h-screen font-sans" x-data="travelApp()" x-init="init()">

    <!-- Header -->
    <header class="glass border-b border-sky-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="p-2 rounded-lg hover:bg-sky-100 text-slate-600 transition-colors">
                    <i class="fa-solid fa-arrow-left w-5 h-5"></i>
                </a>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600">
                    ✈️ 旅行清单
                </h1>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="hidden sm:flex flex-col items-end mr-2">
                    <span class="text-xs text-sky-600 font-bold" x-text="Math.round(progress) + '%'"></span>
                    <div class="w-24 h-1.5 bg-sky-100 rounded-full mt-1">
                        <div class="h-full bg-sky-500 rounded-full progress-transition" :style="`width: ${progress}%`"></div>
                    </div>
                </div>
                <button @click="resetList()" class="p-2 text-sky-600 hover:bg-sky-100 rounded-lg" title="重置">
                    <i class="fa-solid fa-rotate-left w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 pb-24">
        
        <!-- Destination / Header Info -->
        <div class="bg-gradient-to-br from-sky-500 to-blue-600 rounded-2xl p-6 text-white shadow-lg shadow-sky-500/20 mb-8 relative overflow-hidden">
            <div class="relative z-10 flex justify-between items-start">
                <div>
                    <div class="text-sky-100 text-sm mb-1 uppercase tracking-wider font-medium">Next Trip</div>
                    <input type="text" x-model="tripName" placeholder="去哪里旅行？" class="bg-transparent text-2xl font-bold placeholder-sky-200/70 border-b border-white/20 focus:border-white outline-none w-full transition-colors pb-1">
                </div>
                <!-- Weather or Icon placeholder -->
                <i class="fa-solid fa-plane w-12 h-12 text-white/20 absolute right-4 top-4 rotate-12"></i>
            </div>
            <div class="mt-6 flex gap-2">
                 <template x-for="type in templates" :key="type.id">
                    <button @click="loadTemplate(type.id)" 
                            class="px-3 py-1.5 rounded-lg text-xs font-medium bg-white/10 hover:bg-white/20 transition-colors backdrop-blur-sm border border-white/10">
                        <span x-text="type.name"></span>
                    </button>
                 </template>
            </div>
        </div>

        <!-- Categories -->
        <div class="space-y-6">
            <template x-for="cat in categories" :key="cat.id">
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden transition-all hover:shadow-md">
                    <div class="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center cursor-pointer select-none" @click="cat.collapsed = !cat.collapsed">
                        <div class="flex items-center gap-2 font-bold text-slate-700">
                            <i :class="'fa-solid fa-' + cat.icon + ' w-5 h-5 text-sky-500'"></i>
                            <span x-text="cat.name"></span>
                            <span class="text-xs font-normal text-slate-400 bg-white px-2 py-0.5 rounded-full border border-slate-200" x-text="getProgress(cat)"></span>
                        </div>
                        <i class="fa-solid fa-chevron-down w-4 h-4 text-slate-400 transition-transform" :class="cat.collapsed ? '-rotate-90' : ''"></i>
                    </div>
                    
                    <div x-show="!cat.collapsed" class="p-2 space-y-1">
                        <!-- Items -->
                        <template x-for="item in cat.items" :key="item.id">
                            <label class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 cursor-pointer group transition-colors">
                                <div class="relative flex items-center">
                                    <input type="checkbox" x-model="item.checked" class="peer appearance-none w-5 h-5 border-2 border-slate-300 rounded-md checked:bg-sky-500 checked:border-sky-500 transition-all cursor-pointer">
                                    <i class="fa-solid fa-check w-3.5 h-3.5 text-white absolute left-0.5 opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity"></i>
                                </div>
                                <span class="flex-1 text-slate-700 transition-colors" :class="item.checked ? 'text-slate-400 line-through' : ''" x-text="item.name"></span>
                                <button @click.prevent="deleteItem(cat.id, item.id)" class="p-1.5 text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-all">
                                    <i class="fa-solid fa-xmark w-4 h-4"></i>
                                </button>
                            </label>
                        </template>

                        <!-- Add Item -->
                        <div class="px-2 pt-2 border-t border-slate-50 mt-1">
                            <div class="flex items-center gap-2 opacity-60 focus-within:opacity-100 transition-opacity">
                                <i class="fa-solid fa-plus w-4 h-4 text-slate-400"></i>
                                <input type="text" 
                                       placeholder="添加物品..." 
                                       @keydown.enter="addItem(cat.id, $event)"
                                       class="flex-1 bg-transparent border-none text-sm outline-none placeholder-slate-400 py-1">
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Add Category Btn -->
        <button @click="addCategory" class="w-full py-4 mt-6 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 font-medium hover:border-sky-400 hover:text-sky-500 hover:bg-sky-50 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-plus w-5 h-5"></i>
            添加新分类
        </button>

    </main>

    <script>
        function travelApp() {
            return {
                tripName: '',
                categories: [],
                
                templates: [
                    { id: 'general', name: '通用旅行' },
                    { id: 'business', name: '商务出差' },
                    { id: 'beach', name: '海边度假' },
                    { id: 'camping', name: '户外露营' }
                ],
                
                defaultData: {
                    general: [
                        { id: 'c1', name: '证件与财务', icon: 'credit-card', items: ['身份证/护照', '驾驶证', '现金/信用卡', '机票/酒店预订', '行程单'] },
                        { id: 'c2', name: '衣物鞋帽', icon: 'shirt', items: ['换洗衣物', '睡衣', '外套', '舒适的鞋子', '袜子/内衣'] },
                        { id: 'c3', name: '洗漱护肤', icon: 'droplet', items: ['牙刷牙膏', '毛巾', '沐浴露/洗发水', '护肤品/防晒', '剃须刀/化妆品'] },
                        { id: 'c4', name: '电子产品', icon: 'mobile-screen', items: ['手机', '充电器/充电宝', '耳机', '相机/存储卡', '转换插头'] },
                        { id: 'c5', name: '药品与杂物', icon: 'kit-medical', items: ['感冒药/肠胃药', '创可贴', '口罩', '雨伞/墨镜', '水杯'] }
                    ],
                    business: [
                        { id: 'c1', name: '重要文件', icon: 'file-lines', items: ['名片', '会议资料', '合同/文件', '笔记本电脑', '演示笔'] },
                        { id: 'c2', name: '正装', icon: 'briefcase', items: ['西装/衬衫', '领带', '皮鞋', '熨斗(便携)'] }
                    ],
                    beach: [
                        { id: 'c1', name: '沙滩装备', icon: 'sun', items: ['泳衣/泳裤', '人字拖', '沙滩巾', '墨镜', '遮阳帽', '防水手机袋'] }
                    ],
                    camping: [
                        { id: 'c1', name: '露营装备', icon: 'tent', items: ['帐篷', '睡袋', '防潮垫', '营地灯', '驱蚊水', '野炊具'] }
                    ]
                },

                init() {
                    const saved = localStorage.getItem('webtools_travel');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.tripName = data.tripName || '';
                        this.categories = data.categories || [];
                    } else {
                        this.loadTemplate('general');
                    }

                    this.$watch('tripName', () => this.save());
                    this.$watch('categories', () => this.save());
                    
                    
                },

                save() {
                    localStorage.setItem('webtools_travel', JSON.stringify({
                        tripName: this.tripName,
                        categories: this.categories
                    }));
                },

                loadTemplate(type) {
                    if (this.categories.length > 0 && !confirm('这将覆盖当前清单，确定吗？')) return;
                    
                    const template = this.defaultData[type] || this.defaultData.general;
                    // Deep copy
                    this.categories = template.map(cat => ({
                        id: Date.now() + Math.random(),
                        name: cat.name,
                        icon: cat.icon,
                        collapsed: false,
                        items: cat.items.map(itemName => ({
                            id: Date.now() + Math.random(),
                            name: itemName,
                            checked: false
                        }))
                    }));

                    // For specialized templates, maybe append instead? 
                    // No, "loadTemplate" usually implies reset. 
                    // But if it's "General", we load full set. If "Business", maybe we want to MERGE with general?
                    // Let's stick to simple "Replace" for now, or user can manually add.
                    // Actually, for business, I defined partial list. Let's make "Business" a full list override for better UX.
                    if (type !== 'general') {
                       // Should merge with general ideally so they have toiletries etc.
                       // Let's just prepend specific items to general for better UX
                       const general = JSON.parse(JSON.stringify(this.defaultData.general));
                       const specific = JSON.parse(JSON.stringify(this.defaultData[type]));
                       
                       this.categories = [...specific, ...general].map((cat, i) => ({
                           ...cat,
                           id: Date.now() + i, // Unique IDs
                           collapsed: false,
                           items: cat.items.map(name => ({
                               id: Date.now() + Math.random(),
                               name: name,
                               checked: false
                           }))
                       }));
                    } else {
                         this.categories = JSON.parse(JSON.stringify(this.defaultData.general)).map((cat, i) => ({
                           ...cat,
                           id: Date.now() + i,
                           collapsed: false,
                           items: cat.items.map(name => ({
                               id: Date.now() + Math.random(),
                               name: name,
                               checked: false
                           }))
                       }));
                    }
                    
                    
                },

                addItem(catId, event) {
                    const value = event.target.value.trim();
                    if (!value) return;
                    
                    const cat = this.categories.find(c => c.id === catId);
                    if (cat) {
                        cat.items.push({
                            id: Date.now(),
                            name: value,
                            checked: false
                        });
                        event.target.value = '';
                    }
                },

                deleteItem(catId, itemId) {
                    const cat = this.categories.find(c => c.id === catId);
                    if (cat) {
                        cat.items = cat.items.filter(i => i.id !== itemId);
                    }
                },

                addCategory() {
                    const name = prompt('输入分类名称:');
                    if (name) {
                        this.categories.push({
                            id: Date.now(),
                            name: name,
                            icon: 'list',
                            collapsed: false,
                            items: []
                        });
                        
                    }
                },
                
                resetList() {
                    if(confirm('确定要重置所有勾选状态吗？')) {
                        this.categories.forEach(cat => {
                            cat.items.forEach(item => item.checked = false);
                        });
                    }
                },

                getProgress(cat) {
                    if (cat.items.length === 0) return '';
                    const done = cat.items.filter(i => i.checked).length;
                    return `${done}/${cat.items.length}`;
                },

                get progress() {
                    let total = 0;
                    let checked = 0;
                    this.categories.forEach(cat => {
                        total += cat.items.length;
                        checked += cat.items.filter(i => i.checked).length;
                    });
                    return total === 0 ? 0 : (checked / total) * 100;
                }
            }
        }
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/webtools_travel_packing.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
