<html lang="zh-CN">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>词汇构建器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.0/index.css">
  <style>
    body {
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      background: linear-gradient(120deg, #fefce8 0%, #f8fafc 60%, #ffedd5 100%);
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="min-h-screen text-slate-800">
  <div x-data="vocabBuilder()" x-init="init()" class="min-h-screen flex flex-col">
    <header class="bg-white/80 backdrop-blur border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-amber-500 font-semibold">Study · 词汇构建器</p>
          <h1 class="text-xl font-bold">词汇构建器</h1>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1 bg-slate-100 rounded-full p-1">
            <button @click="setModel('v4-flash')" class="px-3 py-1 text-xs rounded-full font-semibold"
              :class="modelLabel === 'v4-flash' ? 'bg-white shadow text-amber-600' : 'text-slate-500'">V4 Flash</button>
            <button @click="setModel('v4-pro')" class="px-3 py-1 text-xs rounded-full font-semibold"
              :class="modelLabel === 'v4-pro' ? 'bg-white shadow text-amber-600' : 'text-slate-500'">V4 Pro</button>
          </div>
          <button @click="showSettings = true" class="text-sm text-slate-600 hover:text-amber-600">API 设置</button>
          <a href="index.html" class="text-sm text-slate-500 hover:text-amber-600">返回学习中心</a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto px-6 py-8 grid lg:grid-cols-[380px_1fr] gap-6">
      <section class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">主题/考试/行业</label>
          <input x-model="topic" class="w-full rounded-lg border border-slate-200 px-3 py-2" placeholder="例：商务英语、JLPT N2">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">词汇数量</label>
          <input type="number" min="5" max="20" x-model.number="count" class="w-full rounded-lg border border-slate-200 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">输出风格</label>
          <select x-model="style" class="w-full rounded-lg border border-slate-200 px-3 py-2">
            <option>实用</option>
            <option>考试</option>
            <option>场景化</option>
          </select>
        </div>
        <button @click="generate" :disabled="isLoading" class="w-full bg-amber-500 text-white rounded-lg py-2 font-semibold hover:bg-amber-400">
          <span x-show="!isLoading">生成词汇包</span>
          <span x-show="isLoading">生成中...</span>
        </button>
        <p x-show="error" class="text-sm text-rose-600" x-text="error"></p>
      </section>

      <section class="bg-white rounded-2xl border border-slate-200 p-6 min-h-[200px]">
        <h2 class="text-lg font-semibold">词汇清单</h2>
        <p class="text-sm text-slate-500 mb-4">包含释义、例句与记忆提示。</p>
        <div class="space-y-4">
          <template x-for="(item, index) in vocab" :key="index">
            <div class="border border-slate-100 rounded-xl p-4">
              <div class="flex items-center justify-between">
                <h3 class="text-base font-semibold" x-text="item.word"></h3>
                <span class="text-xs text-amber-600" x-text="item.tag"></span>
              </div>
              <p class="text-sm text-slate-600 mt-2" x-text="item.meaning"></p>
              <p class="text-sm text-slate-500 mt-2">例句：<span x-text="item.example"></span></p>
              <p class="text-xs text-slate-400 mt-2" x-text="item.mnemonic"></p>
            </div>
          </template>
        </div>
      </section>
    </main>

    <div x-show="showSettings" x-transition.opacity class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
      <div @click.away="showSettings = false" class="bg-white rounded-2xl p-6 w-full max-w-md">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-slate-900">API 配置</h3>
          <button @click="showSettings = false" class="text-slate-400">✕</button>
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
          <input x-model="apiConfig.deepseek" type="password" class="w-full rounded-lg border border-slate-200 px-3 py-2">
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">模型</label>
          <select x-model="apiConfig.model" class="w-full rounded-lg border border-slate-200 px-3 py-2">
            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
          </select>
        </div>
        <button @click="saveConfig" class="mt-6 w-full bg-amber-500 text-white rounded-lg py-2 font-medium hover:bg-amber-400">保存配置</button>
      </div>
    </div>
  </div>

  <script src="study-shared.js"></script>
  <script>
    const createBaseState = () => ({
      apiConfig: studyShared.loadConfig(),
      modelLabel: 'v4-flash',
      showSettings: false,
      init() {
        this.modelLabel = studyShared.resolveLabel(this.apiConfig.model);
      },
      setModel(label) {
        this.modelLabel = label;
        this.apiConfig.model = studyShared.modelMap[label] || this.apiConfig.model;
        studyShared.saveConfig(this.apiConfig);
      },
      saveConfig() {
        this.apiConfig.deepseek = this.apiConfig.deepseek.trim();
        studyShared.saveConfig(this.apiConfig);
        this.showSettings = false;
      }
    });

    function vocabBuilder() {
      return {
        ...createBaseState(),
        topic: '旅行英语',
        count: 10,
        style: '场景化',
        vocab: [],
        isLoading: false,
        error: '',
        async generate() {
          this.error = '';
          this.isLoading = true;
          const prompt = `请生成一个“${this.topic}”主题的词汇包，共 ${this.count} 个词条，风格：${this.style}。\n\n返回 JSON：{\"vocab\":[{\"word\":\"单词/短语\",\"meaning\":\"简明释义\",\"example\":\"例句\",\"mnemonic\":\"记忆提示\",\"tag\":\"场景标签\"}]}`;
          try {
            const content = await studyShared.callLLM({
              apiKey: this.apiConfig.deepseek,
              model: this.apiConfig.model,
              messages: [
                { role: 'system', content: '你是语言学习教练，擅长用清晰结构输出词汇学习内容。' },
                { role: 'user', content: prompt }
              ],
              temperature: 0.7
            });
            const cleaned = content.replace(/```json|```/g, '').trim();
            const parsed = JSON.parse(cleaned);
            this.vocab = parsed.vocab || [];
          } catch (error) {
            this.error = error.message || '生成失败，请稍后再试。';
          } finally {
            this.isLoading = false;
          }
        }
      };
    }
  </script>

</html>
