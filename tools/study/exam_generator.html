<html lang="zh-CN">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自动生成试题</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.0/index.css">
  <style>
    body {
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="min-h-screen text-slate-800">
  <div x-data="examGenerator()" x-init="init()" class="min-h-screen flex flex-col">
    <header class="bg-white/80 backdrop-blur border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-indigo-500 font-semibold">Study · 自动生成试题</p>
          <h1 class="text-xl font-bold">AI 试题生成器</h1>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1 bg-slate-100 rounded-full p-1">
            <button @click="setModel('v4-flash')" class="px-3 py-1 text-xs rounded-full font-semibold"
              :class="modelLabel === 'v4-flash' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'">V4 Flash</button>
            <button @click="setModel('v4-pro')" class="px-3 py-1 text-xs rounded-full font-semibold"
              :class="modelLabel === 'v4-pro' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'">V4 Pro</button>
          </div>
          <button @click="showSettings = true" class="text-sm text-slate-600 hover:text-indigo-600">API 设置</button>
          <a href="index.html" class="text-sm text-slate-500 hover:text-indigo-600">返回学习中心</a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto px-6 py-8 space-y-6">
      <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
        <div class="grid md:grid-cols-4 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">学习领域</label>
            <input x-model="topic" class="w-full rounded-lg border border-slate-200 px-3 py-2" placeholder="例：英语时态、JLPT N3">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">难度</label>
            <select x-model="level" class="w-full rounded-lg border border-slate-200 px-3 py-2">
              <option>基础</option>
              <option>进阶</option>
              <option>高阶</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">题量</label>
            <input x-model.number="count" type="number" min="3" max="10" class="w-full rounded-lg border border-slate-200 px-3 py-2">
          </div>
          <div class="flex items-end">
            <button @click="generate" :disabled="isLoading" class="w-full bg-indigo-600 text-white rounded-lg py-2 font-semibold hover:bg-indigo-500">
              <span x-show="!isLoading">生成试卷</span>
              <span x-show="isLoading">正在生成...</span>
            </button>
          </div>
        </div>
        <p class="text-xs text-slate-400 mt-3">支持多个选择题自动评分，建议输入具体学习主题。</p>
      </section>

      <section x-show="questions.length" class="space-y-4 min-h-[300px]">
        <template x-for="(question, index) in questions" :key="index">
          <div class="bg-white rounded-2xl border border-slate-200 p-6">
            <div class="flex items-center gap-2 text-sm text-indigo-500 font-semibold">
              <span>题目</span>
              <span x-text="index + 1"></span>
            </div>
            <h3 class="text-lg font-semibold mt-2" x-text="question.question"></h3>
            <div class="mt-4 grid gap-2">
              <template x-for="(option, optionIndex) in question.options" :key="optionIndex">
                <label class="flex items-center gap-3 border border-slate-200 rounded-lg px-3 py-2 cursor-pointer">
                  <input type="radio" :name="`q-${index}`" class="text-indigo-600" :value="optionIndex" x-model.number="answers[index]">
                  <span x-text="option"></span>
                </label>
              </template>
            </div>
            <div x-show="score !== null" class="mt-4 text-sm" :class="answers[index] === question.answer ? 'text-emerald-600' : 'text-rose-600'">
              <span x-text="(answers[index] === question.answer ? '回答正确' : '回答错误') + '，正确答案：' + (question.options[question.answer] || '')"></span>
              <p class="text-slate-500 mt-1" x-text="question.explanation"></p>
            </div>
          </div>
        </template>
      </section>

      <section x-show="questions.length" class="flex items-center justify-between bg-indigo-50 border border-indigo-100 rounded-2xl px-6 py-4">
        <div>
          <p class="text-sm text-indigo-500">答题完成后点击评分</p>
          <h3 class="text-lg font-semibold" x-text="score === null ? '尚未评分' : `得分：${score}/${questions.length}`"></h3>
        </div>
        <button @click="calculate" class="bg-indigo-600 text-white rounded-lg px-4 py-2 font-semibold hover:bg-indigo-500">自动评分</button>
      </section>

      <p x-show="error" class="text-sm text-rose-600" x-text="error"></p>
    </main>

    <div x-show="showSettings" x-transition.opacity class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
      <div @click.away="showSettings = false" class="bg-white rounded-2xl p-6 w-full max-w-md">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-slate-900">API 配置</h3>
          <button @click="showSettings = false" class="text-slate-400">✕</button>
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
          <input x-model="apiConfig.deepseek" type="password" class="w-full rounded-lg border border-slate-200 px-3 py-2">
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">模型</label>
          <select x-model="apiConfig.model" class="w-full rounded-lg border border-slate-200 px-3 py-2">
            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
          </select>
        </div>
        <button @click="saveConfig" class="mt-6 w-full bg-indigo-600 text-white rounded-lg py-2 font-medium hover:bg-indigo-500">保存配置</button>
      </div>
    </div>
  </div>

  <script src="study-shared.js"></script>
  <script>
    const createBaseState = () => ({
      apiConfig: studyShared.loadConfig(),
      modelLabel: 'v3',
      showSettings: false,
      init() {
        this.modelLabel = studyShared.resolveLabel(this.apiConfig.model);
      },
      setModel(label) {
        this.modelLabel = label;
        this.apiConfig.model = studyShared.modelMap[label] || this.apiConfig.model;
        studyShared.saveConfig(this.apiConfig);
      },
      saveConfig() {
        this.apiConfig.deepseek = this.apiConfig.deepseek.trim();
        studyShared.saveConfig(this.apiConfig);
        this.showSettings = false;
      }
    });

    function examGenerator() {
      return {
        ...createBaseState(),
        topic: '英语时态',
        level: '基础',
        count: 5,
        questions: [],
        answers: {},
        score: null,
        isLoading: false,
        error: '',
        async generate() {
          this.error = '';
          this.score = null;
          this.questions = [];
          this.answers = {};
          this.isLoading = true;
          const prompt = `请为主题“${this.topic}”生成 ${this.count} 道 ${this.level} 难度的选择题。\n\n要求：\n1. 每题 4 个选项。\n2. 返回 JSON 格式，字段为 questions。\n3. 每题结构：{\"question\":\"题干\",\"options\":[\"A\",\"B\",\"C\",\"D\"],\"answer\":0,\"explanation\":\"解析\"}\n4. 仅返回 JSON。`;
          try {
            const content = await studyShared.callLLM({
              apiKey: this.apiConfig.deepseek,
              model: this.apiConfig.model,
              messages: [
                { role: 'system', content: '你是出题老师，负责生成结构化试题。' },
                { role: 'user', content: prompt }
              ],
              temperature: 0.6
            });
            const cleaned = content.replace(/```json|```/g, '').trim();
            const parsed = JSON.parse(cleaned);
            this.questions = parsed.questions || [];
          } catch (error) {
            this.error = error.message || '生成失败，请稍后再试。';
          } finally {
            this.isLoading = false;
          }
        },
        calculate() {
          if (!this.questions.length) return;
          let total = 0;
          this.questions.forEach((question, index) => {
            if (this.answers[index] === question.answer) total += 1;
          });
          this.score = total;
        }
      };
    }
  </script>

<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/study_exam_generator.md"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
