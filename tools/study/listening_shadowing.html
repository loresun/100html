<html lang="zh-CN">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>听力跟读训练</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.0/index.css">
  <style>
    body {
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      background: linear-gradient(140deg, #ecfdf5 0%, #f8fafc 60%, #d1fae5 100%);
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="min-h-screen text-slate-800">
  <div x-data="shadowingTrainer()" x-init="init()" class="min-h-screen flex flex-col">
    <header class="bg-white/80 backdrop-blur border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-emerald-500 font-semibold">Study · 听力跟读训练</p>
          <h1 class="text-xl font-bold">听力跟读训练</h1>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1 bg-slate-100 rounded-full p-1">
            <button @click="setModel('v4-flash')" class="px-3 py-1 text-xs rounded-full font-semibold"
              :class="modelLabel === 'v4-flash' ? 'bg-white shadow text-emerald-600' : 'text-slate-500'">V4 Flash</button>
            <button @click="setModel('v4-pro')" class="px-3 py-1 text-xs rounded-full font-semibold"
              :class="modelLabel === 'v4-pro' ? 'bg-white shadow text-emerald-600' : 'text-slate-500'">V4 Pro</button>
          </div>
          <button @click="showSettings = true" class="text-sm text-slate-600 hover:text-emerald-600">API 设置</button>
          <a href="index.html" class="text-sm text-slate-500 hover:text-emerald-600">返回学习中心</a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto px-6 py-8 grid lg:grid-cols-[380px_1fr] gap-6">
      <section class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">语言与主题</label>
          <input x-model="topic" class="w-full rounded-lg border border-slate-200 px-3 py-2" placeholder="例：日语旅行、英语面试">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">难度</label>
          <select x-model="level" class="w-full rounded-lg border border-slate-200 px-3 py-2">
            <option>入门</option>
            <option>中级</option>
            <option>高级</option>
          </select>
        </div>
        <button @click="generate" :disabled="isLoading" class="w-full bg-emerald-600 text-white rounded-lg py-2 font-semibold hover:bg-emerald-500">
          <span x-show="!isLoading">生成跟读素材</span>
          <span x-show="isLoading">生成中...</span>
        </button>
        <p x-show="error" class="text-sm text-rose-600" x-text="error"></p>
      </section>

      <section class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4 min-h-[200px]">
        <div>
          <h2 class="text-lg font-semibold">跟读脚本</h2>
          <p class="text-sm text-slate-500">包含短文、跟读步骤与重点表达。</p>
        </div>
        <div class="space-y-4">
          <div>
            <h3 class="text-sm font-semibold text-slate-600">短文</h3>
            <p class="mt-2 text-slate-700 whitespace-pre-line" x-text="script"></p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-600">训练步骤</h3>
            <ul class="mt-2 space-y-2 text-sm text-slate-600">
              <template x-for="(step, index) in steps" :key="index">
                <li class="flex gap-2">
                  <span class="text-emerald-500 font-semibold">•</span>
                  <span x-text="step"></span>
                </li>
              </template>
            </ul>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-600">高频表达</h3>
            <div class="mt-2 flex flex-wrap gap-2">
              <template x-for="(phrase, index) in phrases" :key="index">
                <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 text-xs" x-text="phrase"></span>
              </template>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div x-show="showSettings" x-transition.opacity class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
      <div @click.away="showSettings = false" class="bg-white rounded-2xl p-6 w-full max-w-md">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-slate-900">API 配置</h3>
          <button @click="showSettings = false" class="text-slate-400">✕</button>
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
          <input x-model="apiConfig.deepseek" type="password" class="w-full rounded-lg border border-slate-200 px-3 py-2">
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">模型</label>
          <select x-model="apiConfig.model" class="w-full rounded-lg border border-slate-200 px-3 py-2">
            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
          </select>
        </div>
        <button @click="saveConfig" class="mt-6 w-full bg-emerald-600 text-white rounded-lg py-2 font-medium hover:bg-emerald-500">保存配置</button>
      </div>
    </div>
  </div>

  <script src="study-shared.js"></script>
  <script>
    const createBaseState = () => ({
      apiConfig: studyShared.loadConfig(),
      modelLabel: 'v4-flash',
      showSettings: false,
      init() {
        this.modelLabel = studyShared.resolveLabel(this.apiConfig.model);
      },
      setModel(label) {
        this.modelLabel = label;
        this.apiConfig.model = studyShared.modelMap[label] || this.apiConfig.model;
        studyShared.saveConfig(this.apiConfig);
      },
      saveConfig() {
        this.apiConfig.deepseek = this.apiConfig.deepseek.trim();
        studyShared.saveConfig(this.apiConfig);
        this.showSettings = false;
      }
    });

    function shadowingTrainer() {
      return {
        ...createBaseState(),
        topic: '英语旅行',
        level: '入门',
        script: '点击生成后将获得听力短文。',
        steps: [],
        phrases: [],
        isLoading: false,
        error: '',
        async generate() {
          this.error = '';
          this.isLoading = true;
          const prompt = `请生成一个适合 ${this.level} 学习者的${this.topic}跟读训练材料。\n\n输出 JSON：{\"script\":\"短文\",\"steps\":[\"步骤1\",\"步骤2\"],\"phrases\":[\"表达1\",\"表达2\"]}，仅返回 JSON。`;
          try {
            const content = await studyShared.callLLM({
              apiKey: this.apiConfig.deepseek,
              model: this.apiConfig.model,
              messages: [
                { role: 'system', content: '你是语言跟读训练教练，擅长输出可跟读的短文与训练步骤。' },
                { role: 'user', content: prompt }
              ],
              temperature: 0.7
            });
            const cleaned = content.replace(/```json|```/g, '').trim();
            const parsed = JSON.parse(cleaned);
            this.script = parsed.script || '';
            this.steps = parsed.steps || [];
            this.phrases = parsed.phrases || [];
          } catch (error) {
            this.error = error.message || '生成失败，请稍后再试。';
          } finally {
            this.isLoading = false;
          }
        }
      };
    }
  </script>

</html>
