<html lang="zh-CN">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>口语模拟</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.0/index.css">
  <style>
    body {
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      background: linear-gradient(130deg, #fdf2f8 0%, #f8fafc 60%, #ffe4e6 100%);
    }
  </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="min-h-screen text-slate-800">
  <div x-data="speakingSimulator()" x-init="init()" class="min-h-screen flex flex-col">
    <header class="bg-white/80 backdrop-blur border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-rose-500 font-semibold">Study · 口语模拟</p>
          <h1 class="text-xl font-bold">口语模拟练习</h1>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1 bg-slate-100 rounded-full p-1">
            <button @click="setModel('v4-flash')" class="px-3 py-1 text-xs rounded-full font-semibold"
              :class="modelLabel === 'v4-flash' ? 'bg-white shadow text-rose-600' : 'text-slate-500'">V4 Flash</button>
            <button @click="setModel('v4-pro')" class="px-3 py-1 text-xs rounded-full font-semibold"
              :class="modelLabel === 'v4-pro' ? 'bg-white shadow text-rose-600' : 'text-slate-500'">V4 Pro</button>
          </div>
          <button @click="showSettings = true" class="text-sm text-slate-600 hover:text-rose-600">API 设置</button>
          <a href="index.html" class="text-sm text-slate-500 hover:text-rose-600">返回学习中心</a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto px-6 py-8 grid lg:grid-cols-[380px_1fr] gap-6">
      <section class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">场景</label>
          <input x-model="scenario" class="w-full rounded-lg border border-slate-200 px-3 py-2" placeholder="例：英语面试、日语点餐">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">角色</label>
          <input x-model="role" class="w-full rounded-lg border border-slate-200 px-3 py-2" placeholder="例：求职者、旅客">
        </div>
        <button @click="generate" :disabled="isLoading" class="w-full bg-rose-500 text-white rounded-lg py-2 font-semibold hover:bg-rose-400">
          <span x-show="!isLoading">生成对话脚本</span>
          <span x-show="isLoading">生成中...</span>
        </button>
        <p x-show="error" class="text-sm text-rose-600" x-text="error"></p>
      </section>

      <section class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4 min-h-[200px]">
        <div>
          <h2 class="text-lg font-semibold">对话脚本</h2>
          <p class="text-sm text-slate-500">用于模拟对话与跟读训练。</p>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-slate-600">对话</h3>
          <div class="mt-2 space-y-2 text-sm text-slate-700">
            <template x-for="(line, index) in dialogue" :key="index">
              <div class="p-3 rounded-lg bg-rose-50">
                <span class="font-semibold text-rose-600" x-text="line.speaker"></span>
                <span class="ml-2" x-text="line.text"></span>
              </div>
            </template>
          </div>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-slate-600">高频表达</h3>
          <div class="mt-2 flex flex-wrap gap-2">
            <template x-for="(phrase, index) in highlights" :key="index">
              <span class="px-3 py-1 rounded-full bg-rose-50 text-rose-600 text-xs" x-text="phrase"></span>
            </template>
          </div>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-slate-600">自测问题</h3>
          <ul class="mt-2 space-y-2 text-sm text-slate-600">
            <template x-for="(question, index) in questions" :key="index">
              <li class="flex gap-2">
                <span class="text-rose-500 font-semibold">•</span>
                <span x-text="question"></span>
              </li>
            </template>
          </ul>
        </div>
      </section>
    </main>

    <div x-show="showSettings" x-transition.opacity class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
      <div @click.away="showSettings = false" class="bg-white rounded-2xl p-6 w-full max-w-md">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-slate-900">API 配置</h3>
          <button @click="showSettings = false" class="text-slate-400">✕</button>
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
          <input x-model="apiConfig.deepseek" type="password" class="w-full rounded-lg border border-slate-200 px-3 py-2">
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">模型</label>
          <select x-model="apiConfig.model" class="w-full rounded-lg border border-slate-200 px-3 py-2">
            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
          </select>
        </div>
        <button @click="saveConfig" class="mt-6 w-full bg-rose-500 text-white rounded-lg py-2 font-medium hover:bg-rose-400">保存配置</button>
      </div>
    </div>
  </div>

  <script src="study-shared.js"></script>
  <script>
    const createBaseState = () => ({
      apiConfig: studyShared.loadConfig(),
      modelLabel: 'v4-flash',
      showSettings: false,
      init() {
        this.modelLabel = studyShared.resolveLabel(this.apiConfig.model);
      },
      setModel(label) {
        this.modelLabel = label;
        this.apiConfig.model = studyShared.modelMap[label] || this.apiConfig.model;
        studyShared.saveConfig(this.apiConfig);
      },
      saveConfig() {
        this.apiConfig.deepseek = this.apiConfig.deepseek.trim();
        studyShared.saveConfig(this.apiConfig);
        this.showSettings = false;
      }
    });

    function speakingSimulator() {
      return {
        ...createBaseState(),
        scenario: '英语面试',
        role: '求职者',
        dialogue: [],
        highlights: [],
        questions: [],
        isLoading: false,
        error: '',
        async generate() {
          this.error = '';
          this.isLoading = true;
          const prompt = `请生成一个${this.scenario}场景的口语模拟对话，角色为${this.role}。返回 JSON：{\"dialogue\":[{\"speaker\":\"角色\",\"text\":\"台词\"}],\"highlights\":[\"高频表达\"],\"questions\":[\"自测问题\"]}，仅返回 JSON。`;
          try {
            const content = await studyShared.callLLM({
              apiKey: this.apiConfig.deepseek,
              model: this.apiConfig.model,
              messages: [
                { role: 'system', content: '你是口语教练，擅长输出可直接演练的对话脚本。' },
                { role: 'user', content: prompt }
              ],
              temperature: 0.7
            });
            const cleaned = content.replace(/```json|```/g, '').trim();
            const parsed = JSON.parse(cleaned);
            this.dialogue = parsed.dialogue || [];
            this.highlights = parsed.highlights || [];
            this.questions = parsed.questions || [];
          } catch (error) {
            this.error = error.message || '生成失败，请稍后再试。';
          } finally {
            this.isLoading = false;
          }
        }
      };
    }
  </script>

</html>
