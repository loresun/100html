    <script>
        function multiModelImageGen() {
            return {
                showSettings: false,
                activeProvider: 'doubao',
                isGenerating: false,
                generatedCount: 0,
                totalCount: 0,
                progress: 0,
                prompt: '',
                negativePrompt: '',
                size: '1:1',
                batchCount: 1,
                results: [],

                config: {
                    doubao: {
                        apiKey: '',
                        endpointId: 'doubao-seedream-4-5-251128',
                        model: 'doubao-seedream-4-5-251128',
                        size: '2K',
                        disableWatermark: true
                    },
                    google: {
                        apiKey: '',
                        model: 'gemini-2.5-flash-image'
                    },
                    openrouter: {
                        apiKey: '',
                        model: 'google/gemini-3-pro-image-preview',
                        quality: 'standard'
                    }
                },

                // 初始化：加载配置后自动选择第一个已配置的模型
                init() {
                    this.loadConfig();
                    this.autoSelectProvider(); // 智能选择已配置的模型
                    // 初始化图标已由 Font Awesome 自动处理
                },

                // 加载本地存储的配置
                loadConfig() {
                    // 首先加载 global_llm_config（与 emotion_art.html 保持一致）
                    const globalConfig = localStorage.getItem('global_llm_config');
                    if (globalConfig) {
                        try {
                            const data = JSON.parse(globalConfig);
                            if (data.doubao) {
                                this.config.doubao.apiKey = data.doubao;
                            }
                        } catch (e) {
                            console.warn('global_llm_config 解析失败');
                        }
                    }

                    // 然后加载 multi_model_image_config
                    const saved = localStorage.getItem('multi_model_image_config');
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            Object.keys(this.config).forEach(provider => {
                                if (data[provider]) {
                                    this.config[provider] = { ...this.config[provider], ...data[provider] };
                                }
                            });
                        } catch (e) {
                            console.warn('配置加载失败，使用默认值');
                        }
                    }
                },

                // 智能选择默认模型提供商（优先选择已配置 API Key 的）
                autoSelectProvider() {
                    const providers = ['doubao', 'google', 'openrouter'];
                    for (const p of providers) {
                        if (this.isProviderConfigured(p)) {
                            this.activeProvider = p;
                            return;
                        }
                    }
                    // 如果都没配置，默认选择 doubao
                    this.activeProvider = 'doubao';
                },

                // 豆包模型版本与 Endpoint ID 联动
                syncDoubaoEndpoint() {
                    const modelMap = {
                        'doubao-seedream-4-5-251128': 'doubao-seedream-4-5-251128',
                        'doubao-seedream-4-0-250828': 'doubao-seedream-4-0-250828'
                    };
                    if (modelMap[this.config.doubao.model]) {
                        this.config.doubao.endpointId = modelMap[this.config.doubao.model];
                    }
                    // 如果是 custom，保持用户输入的 endpointId 不变
                },

                // 检查某个模型是否已配置 API Key
                isProviderConfigured(provider) {
                    switch (provider) {
                        case 'doubao':
                            return !!(this.config.doubao.apiKey && this.config.doubao.apiKey.trim());
                        case 'google':
                            return !!(this.config.google.apiKey && this.config.google.apiKey.trim());
                        case 'openrouter':
                            return !!(this.config.openrouter.apiKey && this.config.openrouter.apiKey.trim());
                        default:
                            return false;
                    }
                },

                // 获取模型显示名称
                getProviderDisplayName(provider) {
                    const names = {
                        doubao: '豆包 Seedream',
                        google: 'Google Gemini',
                        openrouter: 'OpenRouter'
                    };
                    return names[provider] || provider;
                },

                // 获取所有模型列表及其配置状态（用于下拉菜单）
                getAvailableProviders() {
                    return [
                        { id: 'doubao', name: '豆包 Seedream', configured: this.isProviderConfigured('doubao') },
                        { id: 'google', name: 'Google Gemini', configured: this.isProviderConfigured('google') },
                        { id: 'openrouter', name: 'OpenRouter', configured: this.isProviderConfigured('openrouter') }
                    ];
                },

                saveConfig() {
                    // 保存到 multi_model_image_config
                    localStorage.setItem('multi_model_image_config', JSON.stringify(this.config));

                    // 同时保存到 global_llm_config（与 emotion_art.html 保持一致）
                    let globalConfig = {};
                    try {
                        const saved = localStorage.getItem('global_llm_config');
                        if (saved) {
                            globalConfig = JSON.parse(saved);
                        }
                    } catch (e) {
                        console.warn('global_llm_config 解析失败');
                    }
                    globalConfig.doubao = this.config.doubao.apiKey;
                    localStorage.setItem('global_llm_config', JSON.stringify(globalConfig));

                    this.showSettings = false;
                    // 保存后重新检查并选择已配置的模型
                    if (!this.isProviderConfigured(this.activeProvider)) {
                        this.autoSelectProvider();
                    }
                },

                // 检查是否可以生成：需要 prompt 且当前模型已配置
                canGenerate() {
                    return this.prompt.trim() !== '' && this.isProviderConfigured(this.activeProvider);
                },

                async generate() {
                    this.isGenerating = true;
                    this.results = [];
                    this.generatedCount = 0;
                    this.totalCount = this.batchCount;

                    try {
                        for (let i = 0; i < this.batchCount; i++) {
                            const result = await this.callProviderAPI(this.activeProvider, {
                                prompt: this.prompt,
                                negativePrompt: this.negativePrompt,
                                size: this.size,
                                index: i
                            });
                            if (result) {
                                this.results.push(result);
                            }
                            this.generatedCount++;
                            this.progress = (this.generatedCount / this.totalCount) * 100;
                        }
                    } catch (error) {
                        alert(error.message || '生成失败');
                    } finally {
                        this.isGenerating = false;
                    }
                },

                async callProviderAPI(provider, params) {
                    switch (provider) {
                        case 'doubao':
                            return await this.callDoubaoAPI(params);
                        case 'google':
                            return await this.callGoogleAPI(params);
                        case 'openrouter':
                            return await this.callOpenRouterAPI(params);
                        default:
                            throw new Error('未选择的模型提供商');
                    }
                },

                async callDoubaoAPI(params) {
                    const apiKey = this.config.doubao.apiKey;
                    if (!apiKey) throw new Error('请先配置豆包 API Key');

                    // 将比例格式转换为豆包支持的像素尺寸
                    const sizeMap = {
                        '1:1': '1024x1024',
                        '9:16': '1024x1792',
                        '16:9': '1792x1024',
                        '3:4': '1080x1440',
                        '4:3': '1440x1080',
                        '4:5': '1024x1280',
                        '2:3': '1024x1536'
                    };
                    const imageSize = sizeMap[params.size] || '1024x1024';

                    const requestBody = {
                        model: this.config.doubao.endpointId,
                        prompt: params.prompt,
                        size: imageSize,
                        watermark: !this.config.doubao.disableWatermark
                    };

                    const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    if (data.data && data.data[0]) {
                        return {
                            url: data.data[0].url || `data:image/png;base64,${data.data[0].b64_json}`,
                            base64: data.data[0].b64_json,
                            prompt: params.prompt,
                            model: '豆包 Seedream',
                            timestamp: Date.now()
                        };
                    }
                    throw new Error('API 返回格式错误');
                },

                async callGoogleAPI(params) {
                    const apiKey = this.config.google.apiKey;
                    if (!apiKey) throw new Error('请先配置 Google API Key');

                    const model = this.config.google.model;

                    // Google Gemini 原生 API 暂不支持自定义尺寸，使用默认
                    // 比例信息可用于后续扩展
                    const aspectRatio = params.size || '1:1';

                    const contents = [{
                        parts: [
                            { text: params.prompt }
                        ]
                    }];

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: contents,
                            generationConfig: {
                                responseModalities: ['TEXT', 'IMAGE']
                            }
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();

                    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                        for (const part of data.candidates[0].content.parts) {
                            if (part.inlineData && part.inlineData.data) {
                                return {
                                    url: `data:image/png;base64,${part.inlineData.data}`,
                                    base64: part.inlineData.data,
                                    prompt: params.prompt,
                                    model: 'Google Gemini',
                                    timestamp: Date.now()
                                };
                            }
                        }
                    }

                    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                        for (const part of data.candidates[0].content.parts) {
                            if (part.text) {
                                throw new Error(`API 返回文本而非图像: ${part.text.substring(0, 100)}...`);
                            }
                        }
                    }

                    throw new Error('API 返回格式错误，未找到图像数据');
                },

                async callOpenRouterAPI(params) {
                    const apiKey = this.config.openrouter.apiKey;
                    if (!apiKey) throw new Error('请先配置 OpenRouter API Key');

                    const model = this.config.openrouter.model;
                    // OpenRouter 图像生成使用 chat/completions 端点
                    const endpoint = 'https://openrouter.ai/api/v1/chat/completions';

                    // 尺寸比例映射
                    const aspectRatioMap = {
                        '1:1': { width: 1024, height: 1024 },
                        '9:16': { width: 768, height: 1344 },
                        '16:9': { width: 1344, height: 768 },
                        '3:4': { width: 864, height: 1184 },
                        '4:3': { width: 1184, height: 864 },
                        '4:5': { width: 896, height: 1152 },
                        '2:3': { width: 832, height: 1248 }
                    };
                    const aspectRatio = params.size || '1:1';
                    const dimensions = aspectRatioMap[aspectRatio] || aspectRatioMap['1:1'];

                    // 构建请求体 - 所有模型都使用统一的 chat completions 格式
                    const requestBody = {
                        model: model,
                        messages: [
                            {
                                role: "user",
                                content: params.prompt
                            }
                        ],
                        // 关键：指定输出模态包含图像
                        modalities: ["text", "image"],
                        // 图像配置：尺寸比例（主要用于 Gemini 模型）
                        image_config: {
                            aspect_ratio: aspectRatio
                        }
                    };

                    // 对于 FLUX 模型，可能需要不同的参数格式
                    if (model.includes('flux')) {
                        requestBody.width = dimensions.width;
                        requestBody.height = dimensions.height;
                    }

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`,
                            'HTTP-Referer': window.location.origin,
                            'X-Title': 'AI Content Suite'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();

                    // 解析 Chat Completions 格式的响应
                    if (data.choices && data.choices[0] && data.choices[0].message) {
                        const message = data.choices[0].message;

                        // 情况1: content 是数组（多模态响应）
                        if (Array.isArray(message.content)) {
                            for (const part of message.content) {
                                // 检查 image_url 格式
                                if (part.type === 'image_url' && part.image_url?.url) {
                                    return {
                                        url: part.image_url.url,
                                        base64: part.image_url.url.startsWith('data:')
                                            ? part.image_url.url.split(',')[1]
                                            : null,
                                        prompt: params.prompt,
                                        model: model.split('/').pop(),
                                        timestamp: Date.now()
                                    };
                                }
                                // 检查 inline_data 格式（Gemini 风格）
                                if (part.inline_data?.data) {
                                    const mimeType = part.inline_data.mime_type || 'image/png';
                                    return {
                                        url: `data:${mimeType};base64,${part.inline_data.data}`,
                                        base64: part.inline_data.data,
                                        prompt: params.prompt,
                                        model: model.split('/').pop(),
                                        timestamp: Date.now()
                                    };
                                }
                            }
                        }

                        // 情况2: content 是字符串但包含 base64 图像（某些模型）
                        if (typeof message.content === 'string' && message.content.startsWith('data:image')) {
                            return {
                                url: message.content,
                                base64: message.content.split(',')[1],
                                prompt: params.prompt,
                                model: model.split('/').pop(),
                                timestamp: Date.now()
                            };
                        }

                        // 如果只返回了文本，抛出提示
                        if (typeof message.content === 'string') {
                            throw new Error(`模型返回文本而非图像: ${message.content.substring(0, 100)}...`);
                        }
                    }

                    // 兼容：检查旧版 images API 格式（备用）
                    if (data.data && data.data[0]) {
                        return {
                            url: data.data[0].url || `data:image/png;base64,${data.data[0].b64_json}`,
                            base64: data.data[0].b64_json,
                            prompt: params.prompt,
                            model: model.split('/').pop(),
                            timestamp: Date.now()
                        };
                    }

                    console.error('OpenRouter 响应:', JSON.stringify(data, null, 2));
                    throw new Error('API 返回格式错误，未找到图像数据');
                },

                downloadImage(result) {
                    const a = document.createElement('a');
                    a.href = result.url;
                    a.download = `image_${result.timestamp}.png`;
                    a.click();
                },

                downloadAll() {
                    this.results.forEach((result, idx) => {
                        setTimeout(() => this.downloadImage(result), idx * 500);
                    });
                },

                clearResults() {
                    if (confirm('确定要清空所有生成结果吗？')) {
                        this.results = [];
                    }
                },

                copyImageUrl(result) {
                    navigator.clipboard.writeText(result.url).then(() => {
                        alert('图片链接已复制到剪贴板');
                    });
                }
            }
        }
    </script>
