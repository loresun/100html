<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI图像生成工作台 - 专业创作助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .image-preview {
            position: relative;
            overflow: hidden;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .image-preview:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .loading-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 2s infinite;
        }

        .storyboard-line {
            position: relative;
        }

        .storyboard-line::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 100%;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, #8b5cf6, transparent);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="min-h-screen p-4">
    <div x-data="imageGenApp()" x-init="init()" class="max-w-7xl mx-auto">
        <!-- 导航栏 -->
        <nav class="glass rounded-2xl shadow-2xl mb-6 p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='../../index.html'">
                    <div class="p-2 bg-gradient-to-br from-purple-600 to-pink-600 rounded-xl">
                        <i class="fa-solid fa-wand-magic-sparkles text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-2xl text-slate-900">AI图像生成工作台</h1>
                        <p class="text-sm text-slate-500">文生图 · 图生图 · 批量生成 · 连续创作</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <!-- 当前模型显示 -->
                    <div class="flex items-center gap-2 px-3 py-2 bg-white/80 rounded-lg border border-purple-200">
                        <i class="fa-solid fa-microchip text-xs text-purple-600"></i>
                        <span class="text-xs text-purple-600">当前:</span>
                        <span class="text-sm font-medium text-purple-900" x-text="getModelDisplayName()"></span>
                    </div>
                    <button @click="showSettings = true"
                        class="flex items-center gap-2 px-4 py-2 bg-purple-100 hover:bg-purple-200 rounded-lg transition">
                        <i class="fa-solid fa-gear text-sm text-purple-600"></i>
                        <span class="text-sm font-medium">模型配置</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- 模式选择标签 -->
        <div class="glass rounded-2xl shadow-xl mb-6 p-2">
            <div class="grid grid-cols-4 gap-2">
                <button @click="mode = 'text2img'"
                    :class="mode === 'text2img' ? 'bg-purple-600 text-white shadow-lg' : 'bg-white text-slate-700 hover:bg-slate-50'"
                    class="py-3 px-4 rounded-xl font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-font text-lg"></i>
                    <span>文生图</span>
                </button>
                <button @click="mode = 'img2img'"
                    :class="mode === 'img2img' ? 'bg-purple-600 text-white shadow-lg' : 'bg-white text-slate-700 hover:bg-slate-50'"
                    class="py-3 px-4 rounded-xl font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-image text-lg"></i>
                    <span>图生图</span>
                </button>
                <button @click="mode = 'batch'"
                    :class="mode === 'batch' ? 'bg-purple-600 text-white shadow-lg' : 'bg-white text-slate-700 hover:bg-slate-50'"
                    class="py-3 px-4 rounded-xl font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                    <span>批量生成</span>
                </button>
                <button @click="mode = 'storyboard'"
                    :class="mode === 'storyboard' ? 'bg-purple-600 text-white shadow-lg' : 'bg-white text-slate-700 hover:bg-slate-50'"
                    class="py-3 px-4 rounded-xl font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-film text-lg"></i>
                    <span>连续创作</span>
                </button>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：配置面板 -->
            <div class="lg:col-span-1 space-y-6">
                <!-- 文生图模式 -->
                <div x-show="mode === 'text2img'" class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-slate-900">
                        <i class="fa-solid fa-wand-magic-sparkles text-purple-600"></i>
                        文生图配置
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">描述提示词</label>
                            <textarea x-model="config.prompt" rows="5" placeholder="详细描述你想要生成的图片..."
                                class="w-full rounded-lg border-slate-200 border p-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">反向提示词（可选）</label>
                            <textarea x-model="config.negativePrompt" rows="2" placeholder="描述不想要的元素..."
                                class="w-full rounded-lg border-slate-200 border p-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 图生图模式 -->
                <div x-show="mode === 'img2img'" class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-slate-900">
                        <i class="fa-solid fa-image text-purple-600"></i>
                        图生图配置
                    </h3>
                    <div class="space-y-4">
                        <!-- 参考图上传 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">上传参考图</label>
                            <div @click="$refs.refImageInput.click()"
                                class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center cursor-pointer hover:border-purple-400 transition">
                                <div x-show="!referenceImage">
                                    <i class="fa-solid fa-cloud-arrow-up text-3xl mx-auto text-slate-400 mb-2"></i>
                                    <p class="text-sm text-slate-600">点击上传参考图片</p>
                                </div>
                                <div x-show="referenceImage" class="relative">
                                    <img :src="referenceImage" class="max-h-40 mx-auto rounded-lg">
                                    <button @click.stop="referenceImage = null"
                                        class="absolute top-2 right-2 p-1 bg-red-500 text-white rounded-full hover:bg-red-600 flex items-center justify-center">
                                        <i class="fa-solid fa-xmark text-[10px]"></i>
                                    </button>
                                </div>
                            </div>
                            <input type="file" x-ref="refImageInput" @change="handleRefImageUpload($event)"
                                accept="image/*" class="hidden">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">修改描述</label>
                            <textarea x-model="config.prompt" rows="4" placeholder="描述你想要的修改..."
                                class="w-full rounded-lg border-slate-200 border p-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm"></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                参考强度 <span class="text-purple-600" x-text="config.strength"></span>
                            </label>
                            <input type="range" x-model="config.strength" min="0" max="1" step="0.1" class="w-full">
                            <div class="flex justify-between text-xs text-slate-500 mt-1">
                                <span>更像原图</span>
                                <span>更多变化</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 批量生成模式 -->
                <div x-show="mode === 'batch'" class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-slate-900">
                        <i class="fa-solid fa-layer-group text-purple-600"></i>
                        批量生成配置
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">基础提示词</label>
                            <textarea x-model="config.prompt" rows="3" placeholder="所有图片的共同描述..."
                                class="w-full rounded-lg border-slate-200 border p-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm"></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                生成数量 <span class="text-purple-600" x-text="config.batchCount"></span>
                            </label>
                            <input type="range" x-model.number="config.batchCount" min="2" max="10" step="1"
                                class="w-full">
                        </div>

                        <div>
                            <label class="flex items-center gap-2 text-sm text-slate-700">
                                <input type="checkbox" x-model="config.variationMode" class="rounded">
                                <span>自动变体模式（每张风格略有不同）</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 连续创作模式（故事板） -->
                <div x-show="mode === 'storyboard'" class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-slate-900">
                        <i class="fa-solid fa-film text-purple-600"></i>
                        连续创作配置
                    </h3>
                    <div class="space-y-4">
                        <div class="p-3 bg-purple-50 rounded-lg border border-purple-200">
                            <div class="flex items-start gap-2">
                                <i class="fa-solid fa-circle-info text-purple-600 mt-0.5"></i>
                                <div class="text-sm text-purple-900">
                                    <div class="font-medium mb-1">智能连续生成</div>
                                    <div class="text-xs opacity-75">每张新图会参考上一张，保持风格和连贯性</div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                场景数量 <span class="text-purple-600" x-text="config.storyboardCount"></span>
                            </label>
                            <input type="range" x-model.number="config.storyboardCount" min="2" max="8" step="1"
                                class="w-full">
                        </div>

                        <!-- 场景描述 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">场景描述</label>
                            <template x-for="i in config.storyboardCount" :key="i">
                                <div class="mb-2">
                                    <textarea x-model="storyboardScenes[i-1]" rows="2"
                                        :placeholder="`场景 ${i}: 描述这一幕...`"
                                        class="w-full rounded-lg border-slate-200 border p-2 text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent"></textarea>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- 通用参数 -->
                <div class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-slate-900">
                        <i class="fa-solid fa-sliders text-purple-600"></i>
                        生成参数
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">图片尺寸</label>
                            <select x-model="config.size" class="w-full rounded-lg border-slate-200 border p-2 text-sm">
                                <option value="1024x1024">1:1 正方形 (1024x1024)</option>
                                <option value="1024x1792">9:16 竖版 (1024x1792)</option>
                                <option value="1792x1024">16:9 横版 (1792x1024)</option>
                                <option value="1080x1440">3:4 小红书 (1080x1440)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">风格</label>
                            <select x-model="config.style"
                                class="w-full rounded-lg border-slate-200 border p-2 text-sm">
                                <option value="general">通用</option>
                                <option value="anime">动漫</option>
                                <option value="photographic">写实摄影</option>
                                <option value="digital-art">数字艺术</option>
                                <option value="comic-book">漫画</option>
                                <option value="3d-model">3D模型</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">图片质量</label>
                            <select x-model="config.quality"
                                class="w-full rounded-lg border-slate-200 border p-2 text-sm">
                                <option value="standard">标准（快速）</option>
                                <option value="hd">高清（慢速）</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 生成按钮 -->
                <button @click="generate()" :disabled="isGenerating || !canGenerate()"
                    :class="isGenerating ? 'bg-slate-400' : 'bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700'"
                    class="w-full text-white font-bold py-4 rounded-xl transition disabled:opacity-50 disabled:cursor-not-allowed shadow-lg flex items-center justify-center gap-2">
                    <i :class="isGenerating ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-wand-magic-sparkles'"
                        class="text-lg"></i>
                    <span x-text="isGenerating ? generateButtonText() : '开始生成'"></span>
                </button>

                <!-- 进度显示 -->
                <div x-show="isGenerating" class="glass rounded-2xl shadow-xl p-4">
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm text-slate-700">
                            <span>生成进度</span>
                            <span><span x-text="generatedCount"></span> / <span x-text="totalCount"></span></span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div :style="`width: ${progress}%`"
                                class="bg-gradient-to-r from-purple-600 to-pink-600 h-full transition-all duration-500">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：结果展示 -->
            <div class="lg:col-span-2">
                <div class="glass rounded-2xl shadow-xl p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-bold text-xl flex items-center gap-2 text-slate-900">
                            <i class="fa-solid fa-images text-purple-600"></i>
                            生成结果
                        </h3>
                        <div x-show="results.length > 0" class="flex gap-2">
                            <button @click="downloadAll()"
                                class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center gap-2 text-sm">
                                <i class="fa-solid fa-download text-xs"></i>
                                下载全部
                            </button>
                            <button @click="clearResults()"
                                class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition flex items-center gap-2 text-sm">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                                清空
                            </button>
                        </div>
                    </div>

                    <!-- 空状态 -->
                    <div x-show="results.length === 0 && !isGenerating"
                        class="flex flex-col items-center justify-center py-20 text-slate-400">
                        <i class="fa-solid fa-wand-magic-sparkles text-6xl mb-4 opacity-50"></i>
                        <p class="text-lg font-medium">还没有生成图片</p>
                        <p class="text-sm">选择模式，填写描述，开始创作</p>
                    </div>

                    <!-- 加载状态 -->
                    <div x-show="isGenerating" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <template x-for="i in totalCount" :key="i">
                            <div class="aspect-square rounded-xl bg-slate-200 loading-shimmer relative overflow-hidden">
                                <div class="absolute inset-0 flex items-center justify-center text-slate-400">
                                    <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- 普通网格展示 -->
                    <div x-show="!isGenerating && results.length > 0 && mode !== 'storyboard'"
                        class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <template x-for="(result, idx) in results" :key="idx">
                            <div class="image-preview group">
                                <img :src="result.url" :alt="result.prompt"
                                    class="w-full aspect-square object-cover rounded-xl">
                                <div
                                    class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition p-4 flex flex-col justify-end">
                                    <p class="text-white text-xs line-clamp-2 mb-2" x-text="result.prompt"></p>
                                    <div class="flex gap-2">
                                        <button @click="downloadImage(result)"
                                            class="p-2 bg-white/20 hover:bg-white/30 rounded-lg backdrop-blur-sm flex items-center justify-center">
                                            <i class="fa-solid fa-download text-white text-xs"></i>
                                        </button>
                                        <button @click="useAsReference(result)"
                                            class="p-2 bg-white/20 hover:bg-white/30 rounded-lg backdrop-blur-sm flex items-center justify-center">
                                            <i class="fa-solid fa-clone text-white text-xs"></i>
                                        </button>
                                        <button @click="viewFullscreen(result)"
                                            class="p-2 bg-white/20 hover:bg-white/30 rounded-lg backdrop-blur-sm flex items-center justify-center">
                                            <i class="fa-solid fa-expand text-white text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- 故事板展示 -->
                    <div x-show="!isGenerating && results.length > 0 && mode === 'storyboard'" class="space-y-4">
                        <template x-for="(result, idx) in results" :key="idx">
                            <div class="storyboard-line">
                                <div class="flex items-start gap-4 bg-white p-4 rounded-xl shadow-sm">
                                    <div
                                        class="flex-shrink-0 w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                                        <span class="font-bold text-purple-600" x-text="idx + 1"></span>
                                    </div>
                                    <div class="flex-grow">
                                        <img :src="result.url" class="w-full rounded-lg mb-2">
                                        <p class="text-sm text-slate-600" x-text="result.prompt"></p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div x-show="showSettings" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div @click.away="showSettings = false"
                class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto">
                <h3 class="text-xl font-bold mb-6 flex items-center gap-2 text-slate-900">
                    <i class="fa-solid fa-gear text-purple-600"></i>
                    模型配置
                </h3>

                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">图像生成模型</label>
                        <select x-model="apiConfig.model"
                            class="w-full rounded-lg border-slate-300 border p-3 bg-white">
                            <optgroup label="豆包 (Doubao)">
                                <option value="doubao-seedream-4.5">Doubao-Seedream-4.5（推荐）</option>
                                <option value="doubao-seedream-4.0">Doubao-Seedream-4.0</option>
                            </optgroup>
                            <optgroup label="谷歌 (Google)">
                                <option value="nanobanana-flash">Nano Banana (2.5 Flash)</option>
                                <option value="nanobanana-pro">Nano Banana Pro (3.0 Pro)</option>
                                <option value="imagen-3">Imagen 3</option>
                            </optgroup>
                            <optgroup label="OpenRouter">
                                <option value="openrouter-dalle3">DALL-E 3</option>
                                <option value="openrouter-flux">FLUX.1 Schnell</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- 豆包配置 -->
                    <div x-show="apiConfig.model.startsWith('doubao-seedream')"
                        class="space-y-3 p-4 bg-orange-50 rounded-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-orange-600 font-medium">豆包 (Doubao) 配置</span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                API Key
                                <a href="https://console.volcengine.com/ark" target="_blank"
                                    class="text-xs text-blue-600 ml-2">获取Key</a>
                            </label>
                            <input type="password" x-model="apiConfig.apiKey" placeholder="输入豆包 API Key"
                                class="w-full rounded-lg border-slate-300 border p-3">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Endpoint ID</label>
                            <input type="text" x-model="apiConfig.endpointId" placeholder="ep-20241203xxxxxx"
                                class="w-full rounded-lg border-slate-300 border p-3">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">分辨率</label>
                                <select x-model="apiConfig.size"
                                    class="w-full rounded-lg border-slate-300 border p-3 bg-white">
                                    <option value="2K">2K</option>
                                    <option value="4K">4K</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">水印</label>
                                <select x-model="apiConfig.watermark"
                                    class="w-full rounded-lg border-slate-300 border p-3 bg-white">
                                    <option :value="true">关闭水印</option>
                                    <option :value="false">开启水印</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 谷歌配置 (共用) -->
                    <div x-show="apiConfig.model.startsWith('nanobanana') || apiConfig.model === 'imagen-3'"
                        class="space-y-3 p-4 bg-blue-50 rounded-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-blue-600 font-medium">谷歌 (Google) 配置</span>
                            <span class="text-xs text-slate-500">(Nano Banana / Imagen 共用)</span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                API Key
                                <a href="https://aistudio.google.com/apikey" target="_blank"
                                    class="text-xs text-blue-600 ml-2">获取Key</a>
                            </label>
                            <input type="password" x-model="apiConfig.googleApiKey" placeholder="输入 Google API Key"
                                class="w-full rounded-lg border-slate-300 border p-3">
                        </div>
                    </div>

                    <!-- OpenRouter配置 -->
                    <div x-show="apiConfig.model.startsWith('openrouter')" class="space-y-3 p-4 bg-green-50 rounded-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-green-600 font-medium">OpenRouter 配置</span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                API Key
                                <a href="https://openrouter.ai/keys" target="_blank"
                                    class="text-xs text-blue-600 ml-2">获取Key</a>
                            </label>
                            <input type="password" x-model="apiConfig.openrouterApiKey"
                                placeholder="输入 OpenRouter API Key"
                                class="w-full rounded-lg border-slate-300 border p-3">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">并发数量</label>
                        <input type="number" x-model.number="apiConfig.concurrency" min="1" max="5"
                            class="w-full rounded-lg border-slate-300 border p-3">
                        <p class="text-xs text-slate-500 mt-1">批量生成时同时处理的图片数量</p>
                    </div>
                </div>

                <div class="flex justify-end gap-3">
                    <button @click="showSettings = false"
                        class="px-6 py-2 hover:bg-slate-100 rounded-lg text-slate-700">
                        取消
                    </button>
                    <button @click="saveConfig()"
                        class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700">
                        保存配置
                    </button>
                </div>
            </div>
        </div>

        <!-- 全屏查看 -->
        <div x-show="fullscreenImage" @click="fullscreenImage = null"
            class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
            <img :src="fullscreenImage" class="max-w-full max-h-full rounded-lg">
            <button @click.stop="fullscreenImage = null"
                class="absolute top-4 right-4 p-2 bg-white/20 hover:bg-white/30 rounded-lg backdrop-blur-sm flex items-center justify-center">
                <i class="fa-solid fa-xmark text-white text-xl"></i>
            </button>
        </div>
    </div>

    <script>
        function imageGenApp() {
            return {
                // 状态
                showSettings: false,
                isGenerating: false,
                mode: 'text2img', // text2img | img2img | batch | storyboard
                fullscreenImage: null,

                // 进度
                generatedCount: 0,
                totalCount: 0,
                progress: 0,

                // 数据
                results: [],
                referenceImage: null,
                referenceImageBase64: null,
                storyboardScenes: [],

                // 配置
                config: {
                    prompt: '',
                    negativePrompt: '',
                    size: '1024x1024',
                    style: 'general',
                    quality: 'standard',
                    strength: 0.7,
                    batchCount: 4,
                    storyboardCount: 4,
                    variationMode: true
                },

                apiConfig: {
                    model: 'doubao-seedream-4.5',
                    apiKey: '',
                    endpointId: 'doubao-seedream-4-5-251128',
                    googleApiKey: '',
                    openrouterApiKey: '',
                    concurrency: 3,
                    disableWatermark: true,
                    watermark: true,
                    size: '2K'
                },

                // 初始化
                init() {
                    this.loadConfig();
                    // 初始化故事板场景
                    for (let i = 0; i < 8; i++) {
                        this.storyboardScenes.push('');
                    }
                    // 初始化图标已由 Font Awesome 自动处理

                    // 监听模型变化，自动更新接入点 ID
                    this.$watch('apiConfig.model', value => {
                        if (value === 'doubao-seedream-4.5') {
                            this.apiConfig.endpointId = 'doubao-seedream-4-5-251128';
                        } else if (value === 'doubao-seedream-4.0') {
                            this.apiConfig.endpointId = 'doubao-seedream-4-0-250828';
                        }
                    });
                },

                // 加载配置
                loadConfig() {
                    const saved = localStorage.getItem('ai_image_studio_config');
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            this.apiConfig = { ...this.apiConfig, ...data };
                        } catch (e) {
                            console.error('解析配置失败:', e);
                        }
                    }
                },

                // 保存配置
                saveConfig() {
                    localStorage.setItem('ai_image_studio_config', JSON.stringify(this.apiConfig));
                    this.showSettings = false;
                },

                // 处理参考图上传
                handleRefImageUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.referenceImage = e.target.result;
                            this.referenceImageBase64 = e.target.result.split(',')[1];
                        };
                        reader.readAsDataURL(file);
                    }
                },

                // 检查是否可以生成
                canGenerate() {
                    if (!this.config.prompt) return false;
                    if (this.mode === 'img2img' && !this.referenceImage) return false;
                    if (this.mode === 'storyboard') {
                        return this.storyboardScenes.slice(0, this.config.storyboardCount).every(s => s.trim());
                    }
                    return true;
                },

                // 生成按钮文字
                generateButtonText() {
                    return `生成中... ${this.generatedCount}/${this.totalCount}`;
                },

                // 获取模型显示名称
                getModelDisplayName() {
                    const modelNames = {
                        'doubao-seedream-4.5': 'Doubao-Seedream-4.5',
                        'doubao-seedream-4.0': 'Doubao-Seedream-4.0',
                        'nanobanana-flash': 'Nano Banana',
                        'nanobanana-pro': 'Nano Banana Pro',
                        'imagen-3': 'Imagen 3',
                        'openrouter-dalle3': 'DALL-E 3',
                        'openrouter-flux': 'FLUX.1'
                    };
                    return modelNames[this.apiConfig.model] || '未选择';
                },

                // 验证配置
                validateApiConfig() {
                    const model = this.apiConfig.model;
                    if (model.startsWith('doubao-seedream')) {
                        if (!this.apiConfig.apiKey) {
                            alert('请先配置豆包 API Key');
                            return false;
                        }
                        if (!this.apiConfig.endpointId) {
                            alert('请先配置豆包 Endpoint ID');
                            return false;
                        }
                    } else if (model.startsWith('nanobanana') || model === 'imagen-3') {
                        if (!this.apiConfig.googleApiKey) {
                            alert('请先配置 Google API Key');
                            return false;
                        }
                    } else if (model.startsWith('openrouter')) {
                        if (!this.apiConfig.openrouterApiKey) {
                            alert('请先配置 OpenRouter API Key');
                            return false;
                        }
                    }
                    return true;
                },

                // 主生成函数
                async generate() {
                    if (!this.validateApiConfig()) {
                        this.showSettings = true;
                        return;
                    }

                    this.isGenerating = true;
                    this.results = [];
                    this.generatedCount = 0;

                    try {
                        switch (this.mode) {
                            case 'text2img':
                                await this.generateText2Img();
                                break;
                            case 'img2img':
                                await this.generateImg2Img();
                                break;
                            case 'batch':
                                await this.generateBatch();
                                break;
                            case 'storyboard':
                                await this.generateStoryboard();
                                break;
                        }
                    } catch (error) {

                        alert(error.message || '生成失败，请重试');
                    } finally {
                        this.isGenerating = false;
                    }
                },

                // 文生图
                async generateText2Img() {
                    this.totalCount = 1;
                    const result = await this.callImageAPI({
                        prompt: this.config.prompt,
                        negative_prompt: this.config.negativePrompt,
                        size: this.config.size,
                        style: this.config.style,
                        quality: this.config.quality
                    });
                    this.results.push(result);
                    this.generatedCount = 1;
                    this.progress = 100;
                },

                // 图生图
                async generateImg2Img() {
                    this.totalCount = 1;
                    const result = await this.callImageAPI({
                        prompt: this.config.prompt,
                        reference_image: this.referenceImageBase64,
                        strength: this.config.strength,
                        size: this.config.size,
                        style: this.config.style,
                        quality: this.config.quality
                    });
                    this.results.push(result);
                    this.generatedCount = 1;
                    this.progress = 100;
                },

                // 批量生成
                async generateBatch() {
                    this.totalCount = this.config.batchCount;
                    const tasks = [];

                    for (let i = 0; i < this.config.batchCount; i++) {
                        let prompt = this.config.prompt;
                        if (this.config.variationMode) {
                            const variations = ['different angle', 'different lighting', 'different color scheme', 'different composition'];
                            prompt += `, ${variations[i % variations.length]}`;
                        }

                        tasks.push(this.generateWithDelay(prompt, i));
                    }

                    // 并发控制
                    await this.processConcurrent(tasks);
                },

                // 连续创作（故事板）
                async generateStoryboard() {
                    this.totalCount = this.config.storyboardCount;
                    let previousImage = null;

                    for (let i = 0; i < this.config.storyboardCount; i++) {
                        const scene = this.storyboardScenes[i];

                        const params = {
                            prompt: scene,
                            size: this.config.size,
                            style: this.config.style,
                            quality: this.config.quality
                        };

                        // 从第二张开始，使用前一张作为参考
                        if (previousImage) {
                            params.reference_image = previousImage;
                            params.strength = 0.5; // 保持连贯性
                        }

                        const result = await this.callImageAPI(params);
                        this.results.push(result);
                        previousImage = result.base64; // 保存base64用于下一张参考

                        this.generatedCount++;
                        this.progress = (this.generatedCount / this.totalCount) * 100;
                    }
                },

                // 并发控制处理
                async processConcurrent(tasks) {
                    const concurrency = this.apiConfig.concurrency;
                    const results = [];

                    for (let i = 0; i < tasks.length; i += concurrency) {
                        const batch = tasks.slice(i, i + concurrency);
                        const batchResults = await Promise.all(batch);
                        results.push(...batchResults);
                        this.results.push(...batchResults);
                        this.generatedCount += batchResults.length;
                        this.progress = (this.generatedCount / this.totalCount) * 100;
                    }

                    return results;
                },

                // 延迟生成（用于批量）
                async generateWithDelay(prompt, index) {
                    await new Promise(resolve => setTimeout(resolve, index * 100));
                    return await this.callImageAPI({
                        prompt: prompt,
                        size: this.config.size,
                        style: this.config.style,
                        quality: this.config.quality
                    });
                },

                // 调用图像生成API
                async callImageAPI(params) {
                    const model = this.apiConfig.model;

                    if (model.startsWith('doubao-seedream')) {
                        return await this.callDoubaoAPI(params);
                    } else if (model.startsWith('nanobanana') || model === 'imagen-3') {
                        return await this.callGoogleAPI(params);
                    } else if (model.startsWith('openrouter')) {
                        return await this.callOpenRouterAPI(params);
                    }

                    throw new Error('未选择的模型');
                },

                // 豆包 API
                async callDoubaoAPI(params) {
                    const endpoint = 'https://ark.cn-beijing.volces.com/api/v3/images/generations';

                    const requestBody = {
                        model: this.apiConfig.endpointId,
                        prompt: params.prompt,
                        size: this.apiConfig.size || '2K',
                        watermark: !this.apiConfig.watermark
                    };

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiConfig.apiKey}`
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(`API提示: ${errorData.error?.message || errorData.message || response.status}`);
                    }

                    const data = await response.json();

                    if (data.data && data.data[0]) {
                        const imageData = data.data[0];
                        let imageUrl = imageData.url;
                        let imageBase64 = imageData.b64_json;

                        if (imageUrl && !imageBase64) {
                            try {
                                imageBase64 = await this.urlToBase64(imageUrl);
                            } catch (e) { }
                        }

                        if (imageBase64 && !imageUrl) {
                            imageUrl = `data:image/jpeg;base64,${imageBase64}`;
                        }

                        return {
                            url: imageUrl,
                            base64: imageBase64,
                            prompt: params.prompt,
                            timestamp: Date.now()
                        };
                    }

                    throw new Error('API返回格式错误');
                },

                // 谷歌 API (Nano Banana / Imagen)
                async callGoogleAPI(params) {
                    const apiKey = this.apiConfig.googleApiKey;

                    let modelId;
                    if (this.apiConfig.model === 'nanobanana-flash') {
                        modelId = 'gemini-2.5-flash-image';
                    } else if (this.apiConfig.model === 'nanobanana-pro') {
                        modelId = 'gemini-3-pro-image-preview';
                    } else {
                        modelId = 'imagen-3.0-generate-001';
                    }

                    const sizeMap = {
                        '2K': { width: 2048, height: 2048 },
                        '4K': { width: 4096, height: 2160 },
                        '1024x1024': { width: 1024, height: 1024 },
                        '1080x1440': { width: 1080, height: 1440 },
                        '1792x1024': { width: 1792, height: 1024 }
                    };

                    const size = sizeMap[this.apiConfig.size] || sizeMap['1024x1024'];

                    let response;

                    if (modelId === 'imagen-3.0-generate-001') {
                        response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateImages?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: params.prompt,
                                imageSize: { width: size.width, height: size.height },
                                generateImageResponse: { mimeType: 'image/png' }
                            })
                        });
                    } else {
                        response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: params.prompt }] }],
                                generationConfig: {
                                    responseModalities: ['IMAGE'],
                                    imageGenerationConfig: {
                                        width: size.width,
                                        height: size.height,
                                        outputCompressionQuality: 90,
                                        outputFormat: 'PNG'
                                    }
                                }
                            })
                        });
                    }

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();

                    if (modelId === 'imagen-3.0-generate-001') {
                        if (data.generatedImages && data.generatedImages[0]) {
                            const imageBase64 = data.generatedImages[0].generatedImage;
                            return {
                                url: `data:image/png;base64,${imageBase64}`,
                                base64: imageBase64,
                                prompt: params.prompt,
                                timestamp: Date.now()
                            };
                        }
                    } else {
                        if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                            for (const part of data.candidates[0].content.parts) {
                                if (part.inlineData && part.inlineData.data) {
                                    const imageBase64 = part.inlineData.data;
                                    return {
                                        url: `data:image/png;base64,${imageBase64}`,
                                        base64: imageBase64,
                                        prompt: params.prompt,
                                        timestamp: Date.now()
                                    };
                                }
                            }
                        }
                    }

                    throw new Error('API 返回格式错误');
                },

                // OpenRouter API
                async callOpenRouterAPI(params) {
                    const apiKey = this.apiConfig.openrouterApiKey;

                    let model, size;
                    if (this.apiConfig.model === 'openrouter-dalle3') {
                        model = 'dall-e-3';
                        size = '1024x1024';
                    } else {
                        model = 'black-forest-labs/FLUX.1-schnell';
                        size = '1024x1024';
                    }

                    const requestBody = {
                        model: model,
                        prompt: params.prompt,
                        n: 1,
                        size: size
                    };

                    const response = await fetch('https://openrouter.ai/api/v1/images/generations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`,
                            'HTTP-Referer': window.location.origin,
                            'X-Title': 'AI Content Suite'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();

                    if (data.data && data.data[0]) {
                        const imageData = data.data[0];
                        return {
                            url: imageData.url || `data:image/png;base64,${imageData.b64_json}`,
                            base64: imageData.b64_json,
                            prompt: params.prompt,
                            timestamp: Date.now()
                        };
                    }

                    throw new Error('API 返回格式错误');
                },

                // URL转Base64辅助函数
                async urlToBase64(url) {
                    try {
                        const response = await fetch(url);
                        const blob = await response.blob();
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                const base64 = reader.result.split(',')[1];
                                resolve(base64);
                            };
                            reader.onerror = reject;
                            reader.readAsDataURL(blob);
                        });
                    } catch (error) {

                        return null;
                    }
                },

                // 下载图片
                downloadImage(result) {
                    const a = document.createElement('a');
                    a.href = result.url;
                    a.download = `image_${result.timestamp}.png`;
                    a.click();
                },

                // 下载全部
                downloadAll() {
                    this.results.forEach((result, idx) => {
                        setTimeout(() => {
                            this.downloadImage(result);
                        }, idx * 500);
                    });
                },

                // 清空结果
                clearResults() {
                    if (confirm('确定要清空所有生成结果吗？')) {
                        this.results = [];
                    }
                },

                // 作为参考图使用
                useAsReference(result) {
                    this.mode = 'img2img';
                    this.referenceImage = result.url;
                    this.referenceImageBase64 = result.base64;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                // 全屏查看
                viewFullscreen(result) {
                    this.fullscreenImage = result.url;
                }
            }
        }
    </script>
