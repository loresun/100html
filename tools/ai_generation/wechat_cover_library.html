<!DOCTYPE html>
<html lang="zh-CN">

<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M09H8GY78X"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信公众号封面图库 - AI封面生成</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 50%, #86efac 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .cover-preview {
            aspect-ratio: 2.35 / 1;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="min-h-screen p-4">
    <div x-data="coverApp()" x-init="init()" class="max-w-7xl mx-auto">
        <nav class="glass rounded-2xl shadow-2xl mb-6 p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div
                        class="p-2 bg-gradient-to-br from-green-500 to-emerald-500 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-table-columns text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-2xl text-slate-900">微信公众号封面图库</h1>
                        <p class="text-sm text-slate-500">AI智能生成 · 2.35:1标准比例</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 px-3 py-2 bg-green-50 rounded-lg border border-green-200">
                        <i class="fa-solid fa-microchip text-xs text-green-600"></i>
                        <span class="text-xs text-green-600">当前:</span>
                        <span class="text-sm font-medium text-green-900" x-text="getModelDisplayName()"></span>
                    </div>
                    <button @click="showSettings = true" class="px-4 py-2 bg-green-100 hover:bg-green-200 rounded-lg">
                        <i class="fa-solid fa-gear text-sm"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4">文章信息</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">文章标题</label>
                            <input type="text" x-model="title" placeholder="例如：2026年必备的10个AI工具"
                                class="w-full rounded-lg border p-3">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">文章主题</label>
                            <select x-model="theme" class="w-full rounded-lg border p-3">
                                <option value="科技">科技互联网</option>
                                <option value="职场">职场干货</option>
                                <option value="生活">生活方式</option>
                                <option value="教育">教育学习</option>
                                <option value="情感">情感心理</option>
                                <option value="财经">财经商业</option>
                                <option value="美食">美食探店</option>
                                <option value="旅行">旅行攻略</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">封面风格</label>
                            <select x-model="style" class="w-full rounded-lg border p-3">
                                <option value="简约现代">简约现代</option>
                                <option value="科技感">科技感</option>
                                <option value="温馨温暖">温馨温暖</option>
                                <option value="专业商务">专业商务</option>
                                <option value="活力年轻">活力年轻</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="glass rounded-2xl shadow-xl p-6">
                    <h3 class="font-bold text-lg mb-4">快捷生成</h3>
                    <div class="space-y-2">
                        <template x-for="preset in presets" :key="preset.id">
                            <button @click="applyPreset(preset)"
                                class="w-full text-left p-3 rounded-lg border-2 border-slate-200 hover:border-green-400 hover:bg-green-50 transition">
                                <div class="font-medium text-slate-900" x-text="preset.name"></div>
                                <div class="text-xs text-slate-500" x-text="preset.desc"></div>
                            </button>
                        </template>
                    </div>
                </div>

                <button @click="generate()" :disabled="isGenerating || !title"
                    class="w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold py-4 rounded-xl disabled:opacity-50">
                    <span x-text="isGenerating ? '生成中...' : '生成3个封面备选'"></span>
                </button>
            </div>

            <div class="lg:col-span-2 glass rounded-2xl shadow-xl p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="font-bold text-xl">封面预览</h3>
                    <button x-show="results.length > 0" @click="downloadAll()"
                        class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                        <i class="fa-solid fa-download text-xs text-white mr-2"></i>下载全部
                    </button>
                </div>

                <div x-show="!results.length && !isGenerating"
                    class="flex flex-col items-center justify-center py-20 text-slate-400">
                    <i class="fa-solid fa-table-columns text-6xl mb-4 opacity-50"></i>
                    <p>输入标题后生成封面</p>
                </div>

                <div x-show="isGenerating" class="grid grid-cols-1 gap-4">
                    <div v-for="i in 3"
                        class="cover-preview bg-gradient-to-r from-green-100 to-emerald-100 rounded-xl animate-pulse">
                    </div>
                </div>

                <div x-show="!isGenerating && results.length" class="space-y-6">
                    <template x-for="(result, idx) in results" :key="idx">
                        <div class="glass rounded-xl overflow-hidden hover:shadow-2xl transition">
                            <img :src="result.url" class="w-full cover-preview object-cover">
                            <div class="p-4 flex items-center justify-between">
                                <div>
                                    <div class="text-sm text-slate-500">方案 <span x-text="idx + 1"></span></div>
                                    <div class="font-medium text-slate-900">900 x 383</div>
                                </div>
                                <div class="flex gap-2">
                                    <button @click="downloadImage(result)"
                                        class="px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">下载</button>
                                    <button @click="regenerateOne(idx)"
                                        class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg">重新生成</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div x-show="showSettings" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div @click.away="showSettings = false" class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6">
                <h3 class="text-xl font-bold mb-6">模型配置</h3>
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">图像生成模型</label>
                        <select x-model="apiConfig.model" class="w-full rounded-lg border p-3">
                            <optgroup label="豆包 (Doubao)">
                                <option value="doubao-seedream-4.5">Doubao-Seedream-4.5（推荐）</option>
                                <option value="doubao-seedream-4.0">Doubao-Seedream-4.0</option>
                            </optgroup>
                            <optgroup label="谷歌 (Google)">
                                <option value="nanobanana-flash">Nano Banana (2.5 Flash)</option>
                                <option value="nanobanana-pro">Nano Banana Pro (3.0 Pro)</option>
                                <option value="imagen-3">Imagen 3</option>
                            </optgroup>
                            <optgroup label="OpenRouter">
                                <option value="openrouter-dalle3">DALL-E 3</option>
                                <option value="openrouter-flux">FLUX.1 Schnell</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- 豆包配置 -->
                    <div x-show="apiConfig.model.startsWith('doubao-seedream')"
                        class="space-y-3 p-4 bg-orange-50 rounded-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-orange-600 font-medium">豆包 (Doubao) 配置</span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">API Key <a
                                    href="https://console.volcengine.com/ark" target="_blank"
                                    class="text-xs text-blue-600 ml-2">获取Key</a></label>
                            <input type="password" x-model="apiConfig.apiKey" placeholder="输入火山引擎 API Key"
                                class="w-full rounded-lg border p-3">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Endpoint ID</label>
                            <input type="text" x-model="apiConfig.endpointId" placeholder="ep-20241203xxxxxx"
                                class="w-full rounded-lg border p-3">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">分辨率</label>
                                <select x-model="apiConfig.size" class="w-full rounded-lg border p-3">
                                    <option value="2K">2K</option>
                                    <option value="4K">4K</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2">水印</label>
                                <select x-model="apiConfig.watermark" class="w-full rounded-lg border p-3">
                                    <option :value="true">关闭水印</option>
                                    <option :value="false">开启水印</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 谷歌配置 -->
                    <div x-show="apiConfig.model.startsWith('nanobanana') || apiConfig.model === 'imagen-3'"
                        class="space-y-3 p-4 bg-blue-50 rounded-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-blue-600 font-medium">谷歌 (Google) 配置</span>
                            <span class="text-xs text-slate-500">(共用)</span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">API Key <a
                                    href="https://aistudio.google.com/apikey" target="_blank"
                                    class="text-xs text-blue-600 ml-2">获取Key</a></label>
                            <input type="password" x-model="apiConfig.googleApiKey" placeholder="输入 Google API Key"
                                class="w-full rounded-lg border p-3">
                        </div>
                    </div>

                    <!-- OpenRouter配置 -->
                    <div x-show="apiConfig.model.startsWith('openrouter')" class="space-y-3 p-4 bg-green-50 rounded-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-green-600 font-medium">OpenRouter 配置</span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">API Key <a href="https://openrouter.ai/keys"
                                    target="_blank" class="text-xs text-blue-600 ml-2">获取Key</a></label>
                            <input type="password" x-model="apiConfig.openrouterApiKey"
                                placeholder="输入 OpenRouter API Key" class="w-full rounded-lg border p-3">
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-3">
                    <button @click="showSettings = false" class="px-6 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig()" class="bg-green-600 text-white px-6 py-2 rounded-lg">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function coverApp() {
            return {
                showSettings: false,
                isGenerating: false,
                title: '',
                theme: '科技',
                style: '简约现代',
                results: [],
                apiConfig: {
                    model: 'doubao-seedream-4.5',
                    apiKey: '',
                    endpointId: 'doubao-seedream-4-5-251128',
                    googleApiKey: '',
                    openrouterApiKey: '',
                    size: '2K',
                    watermark: true
                },
                presets: [
                    { id: 'yearend', name: '年终总结', desc: '适合回顾盘点类', theme: '职场', style: '专业商务' },
                    { id: 'tips', name: '干货技巧', desc: '适合教程攻略类', theme: '教育', style: '简约现代' },
                    { id: 'hot', name: '热点解读', desc: '适合时事分析类', theme: '财经', style: '科技感' }
                ],

                init() {
                    this.loadConfig();
                    // 初始化图标已由 Font Awesome 自动处理

                    // 监听模型变化，自动更新接入点 ID
                    this.$watch('apiConfig.model', value => {
                        if (value === 'doubao-seedream-4.5') {
                            this.apiConfig.endpointId = 'doubao-seedream-4-5-251128';
                        } else if (value === 'doubao-seedream-4.0') {
                            this.apiConfig.endpointId = 'doubao-seedream-4-0-250828';
                        }
                    });
                },

                loadConfig() {
                    const saved = localStorage.getItem('wechat_cover_config');
                    if (saved) {
                        try {
                            this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
                        } catch (e) {
                            console.error('解析配置失败:', e);
                        }
                    }
                },

                saveConfig() {
                    localStorage.setItem('wechat_cover_config', JSON.stringify(this.apiConfig));
                    this.showSettings = false;
                },

                getModelDisplayName() {
                    const names = {
                        'doubao-seedream-4.5': 'Doubao-Seedream-4.5',
                        'doubao-seedream-4.0': 'Doubao-Seedream-4.0',
                        'nanobanana-flash': 'Nano Banana',
                        'nanobanana-pro': 'Nano Banana Pro',
                        'imagen-3': 'Imagen 3',
                        'openrouter-dalle3': 'DALL-E 3',
                        'openrouter-flux': 'FLUX.1'
                    };
                    return names[this.apiConfig.model] || '未配置';
                },

                applyPreset(preset) {
                    this.theme = preset.theme;
                    this.style = preset.style;
                },

                async generate() {
                    const model = this.apiConfig.model;
                    if (model.startsWith('doubao-seedream')) {
                        if (!this.apiConfig.apiKey || !this.apiConfig.endpointId) {
                            this.showSettings = true;
                            return;
                        }
                    } else if (model.startsWith('nanobanana') || model === 'imagen-3') {
                        if (!this.apiConfig.googleApiKey) {
                            this.showSettings = true;
                            return;
                        }
                    } else if (model.startsWith('openrouter')) {
                        if (!this.apiConfig.openrouterApiKey) {
                            this.showSettings = true;
                            return;
                        }
                    }

                    this.isGenerating = true;
                    this.results = [];

                    const variations = ['color scheme 1', 'color scheme 2', 'color scheme 3'];

                    try {
                        for (const variation of variations) {
                            const prompt = `WeChat official account cover image design.
Title: "${this.title}"
Theme: ${this.theme}
Style: ${this.style}, ${variation}
Size: 2.35:1 aspect ratio (900x383)
Clean, professional, eye-catching, suitable for WeChat article cover.`;

                            const result = await this.callImageAPI(prompt);
                            this.results.push(result);
                        }
                    } catch (error) {
                        alert('生成失败: ' + error.message);
                    } finally {
                        this.isGenerating = false;
                    }
                },

                async callImageAPI(prompt) {
                    const model = this.apiConfig.model;

                    if (model.startsWith('doubao-seedream')) {
                        const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.apiKey}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.endpointId,
                                prompt: prompt,
                                size: this.apiConfig.size || '2K',
                                watermark: !this.apiConfig.watermark
                            })
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || `API Error: ${response.status}`);
                        }

                        const data = await response.json();
                        if (data.data && data.data[0]) {
                            return { url: data.data[0].url || `data:image/png;base64,${data.data[0].b64_json}`, timestamp: Date.now() };
                        }
                    } else if (model.startsWith('nanobanana') || model === 'imagen-3') {
                        const apiKey = this.apiConfig.googleApiKey;
                        let modelId = model === 'nanobanana-flash' ? 'gemini-2.5-flash-image' : model === 'nanobanana-pro' ? 'gemini-3-pro-image-preview' : 'imagen-3.0-generate-001';

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateImages?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: prompt,
                                imageSize: { width: 900, height: 383 },
                                generateImageResponse: { mimeType: 'image/png' }
                            })
                        });

                        if (!response.ok) {
                            const error = await response.json().catch(() => ({}));
                            throw new Error(error.error?.message || `API Error: ${response.status}`);
                        }

                        const data = await response.json();
                        if (data.generatedImages && data.generatedImages[0]) {
                            return { url: `data:image/png;base64,${data.generatedImages[0].generatedImage}`, timestamp: Date.now() };
                        }
                    } else if (model.startsWith('openrouter')) {
                        const apiKey = this.apiConfig.openrouterApiKey;
                        const modelName = model === 'openrouter-dalle3' ? 'dall-e-3' : 'black-forest-labs/FLUX.1-schnell';

                        const response = await fetch('https://openrouter.ai/api/v1/images/generations', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey}`,
                                'HTTP-Referer': window.location.origin,
                                'X-Title': 'AI Content Suite'
                            },
                            body: JSON.stringify({
                                model: modelName,
                                prompt: prompt,
                                n: 1,
                                size: '1024x1024'
                            })
                        });

                        if (!response.ok) {
                            const error = await response.json().catch(() => ({}));
                            throw new Error(error.error?.message || `API Error: ${response.status}`);
                        }

                        const data = await response.json();
                        if (data.data && data.data[0]) {
                            return { url: data.data[0].url, timestamp: Date.now() };
                        }
                    }

                    throw new Error('API 返回格式错误');
                },

                downloadImage(result) {
                    const a = document.createElement('a');
                    a.href = result.url;
                    a.download = `cover_${result.timestamp}.png`;
                    a.click();
                },

                downloadAll() {
                    this.results.forEach((result, idx) => {
                        setTimeout(() => this.downloadImage(result), idx * 500);
                    });
                },

                regenerateOne(idx) {
                    this.generate();
                }
            }
        }
    </script>

</html>
