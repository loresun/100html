    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 报错诊断室 - Vibe Coding Debugger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="min-h-screen flex flex-col">

    <div id="app" class="flex-grow flex flex-col">
        <nav class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center text-red-600">
                    <i class="fa-solid fa-stethoscope text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800">AI 报错诊断室</h1>
                    <p class="text-xs text-slate-500">专治单文件 HTML 开发疑难杂症</p>
                </div>
            </div>
            <a href="../../index.html"
                class="text-slate-500 hover:text-blue-600 transition flex items-center gap-1 text-sm">
                <i class="fa-solid fa-arrow-left"></i> 返回首页
            </a>
        </nav>

        <main class="flex-grow p-6 max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- 输入区 -->
            <div class="space-y-4">
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <label class="block text-sm font-bold text-slate-700 mb-2">
                        1. 错误信息 (Console Log)
                    </label>
                    <textarea v-model="errorLog"
                        class="w-full h-24 p-3 rounded-lg border border-slate-200 bg-red-50 text-red-800 text-xs font-mono focus:border-red-300 focus:ring focus:ring-red-100 outline-none resize-none"
                        placeholder="例如：Uncaught SyntaxError: Unexpected token '}'"></textarea>
                </div>

                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex-grow flex flex-col">
                    <label class="block text-sm font-bold text-slate-700 mb-2">
                        2. 相关代码片段
                    </label>
                    <textarea v-model="codeSnippet"
                        class="w-full h-48 p-3 rounded-lg border border-slate-200 bg-slate-50 text-slate-800 text-xs font-mono focus:border-blue-300 focus:ring focus:ring-blue-100 outline-none resize-none flex-grow"
                        placeholder="粘贴你觉得有问题的代码段..."></textarea>
                </div>

                <button @click="diagnose" :disabled="isAnalyzing"
                    class="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-spinner fa-spin animate-spin"></i>
                    <span v-else><i class="fa-solid fa-wave-square inline mr-1"></i> 开始诊断</span>
                </button>
            </div>

            <!-- 诊断报告区 -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col h-full overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700">诊断报告</h3>
                    <span v-if="report" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">诊断完成</span>
                </div>

                <div class="flex-grow p-6 overflow-auto">
                    <div v-if="report" class="prose prose-sm max-w-none">
                        <!-- 渲染 Markdown (这里简化处理，直接显示文本，实际项目可引入 marked.js) -->
                        <div class="whitespace-pre-wrap leading-relaxed text-slate-600">{{ report }}</div>
                    </div>

                    <div v-else class="h-full flex flex-col items-center justify-center text-slate-400 opacity-60">
                        <i class="fa-solid fa-clipboard-check text-5xl mb-3"></i>
                        <p class="text-sm">等待输入病情...</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {


                const errorLog = ref('');
                const codeSnippet = ref('');
                const isAnalyzing = ref(false);
                const report = ref('');

                const diagnose = async () => {
                    if (!errorLog.value && !codeSnippet.value) {
                        alert('请至少提供错误信息或代码片段');
                        return;
                    }

                    isAnalyzing.value = true;

                    // 获取 API Key
                    let config = {};
                    try {
                        config = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('解析 global_llm_config 失败:', e);
                    }
                    const apiKey = config.deepseek;

                    const systemPrompt = `你是一个前端调试专家，擅长解决单文件 HTML (Vue3 + Tailwind) 开发中的问题。
                    
                    你的任务是根据用户提供的错误日志和代码，分析原因并给出修复建议。
                    
                    请按以下格式输出：
                    1. **病因分析**：用通俗的语言解释为什么会报错（例如：括号不匹配、变量未定义、Vue 挂载顺序错误）。
                    2. **修复方案**：给出具体的代码修改建议。
                    3. **避坑指南**：Vibe Coding 模式下如何避免此类问题。`;

                    const userPrompt = `错误日志：\n${errorLog.value}\n\n代码片段：\n${codeSnippet.value}`;

                    try {
                        if (apiKey) {
                            const response = await fetch('https://api.deepseek.com/chat/completions', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${apiKey}`
                                },
                                body: JSON.stringify({
                                    model: "deepseek-v4-flash",
                                    messages: [
                                        { role: "system", content: systemPrompt },
                                        { role: "user", content: userPrompt }
                                    ],
                                    temperature: 0.3 // 诊断需要准确，降低温度
                                })
                            });
                            const data = await response.json();
                            report.value = data.choices[0].message.content;
                        } else {
                            // 模拟
                            await new Promise(r => setTimeout(r, 1000));
                            report.value = "【模拟诊断结果】\n检测到您未配置 API Key。\n\n病因分析：看起来像是括号不匹配导致的 SyntaxError。\n修复方案：请检查第 528 行附近的 `},` 是否遗漏。";
                        }
                    } catch (e) {
                        report.value = "诊断服务连接失败，请检查网络或 API Key。";
                    } finally {
                        isAnalyzing.value = false;
                    }
                };

                return {

                    errorLog,
                    codeSnippet,
                    isAnalyzing,
                    report,
                    diagnose
                };
            }
        }).mount('#app');
    </script>

    </body>

</html>
