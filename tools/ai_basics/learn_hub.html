<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习中心 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        /* Markdown 内容样式 */
        .markdown-body {
            font-size: 16px;
            line-height: 1.8;
            color: #334155;
        }

        .markdown-body h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .markdown-body h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #334155;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #475569;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .markdown-body p {
            margin-bottom: 1rem;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }

        .markdown-body li {
            margin-bottom: 0.5rem;
        }

        .markdown-body ul li {
            list-style-type: disc;
        }

        .markdown-body ol li {
            list-style-type: decimal;
        }

        .markdown-body blockquote {
            border-left: 4px solid #3b82f6;
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border-radius: 0 8px 8px 0;
            color: #1e40af;
        }

        .markdown-body code {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.875em;
            color: #e11d48;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        .markdown-body pre {
            background: #1e293b;
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .markdown-body pre code {
            background: transparent;
            color: #e2e8f0;
            padding: 0;
            font-size: 0.875rem;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1rem 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* 侧边导航样式 */
        .nav-item {
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.05);
            color: #2563eb;
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.1);
            color: #2563eb;
            font-weight: 600;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background-color: #3b82f6;
            border-radius: 0 2px 2px 0;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">

        <!-- 顶部导航 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200/80">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-4">
                        <a href="../../index.html"
                            class="flex items-center gap-2 text-slate-500 hover:text-blue-600 transition">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span class="hidden sm:inline">返回首页</span>
                        </a>
                        <div class="h-6 w-px bg-slate-200"></div>
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-graduation-cap text-blue-600 text-xl"></i>
                            <span class="font-bold text-xl text-slate-900">学习中心</span>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full">

            <!-- 左侧导航（章节列表） -->
            <aside
                class="md:w-72 bg-white border-r border-slate-200 md:h-[calc(100vh-4rem)] md:sticky md:top-16 overflow-y-auto z-40">
                <div class="p-4 space-y-6">
                    <div v-for="group in groupedDocs" :key="group.name">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-2">{{ group.name }}
                        </h3>
                        <div class="space-y-1">
                            <a v-for="doc in group.docs" :key="doc.id" href="#" @click.prevent="loadDocument(doc)"
                                :class="['nav-item block px-3 py-2.5 rounded-lg text-sm', currentDoc?.id === doc.id ? 'active' : 'text-slate-600']">
                                {{ doc.title }}
                            </a>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- 中间文档内容 -->
            <div class="flex-grow p-6 md:p-10 min-w-0"> <!-- min-w-0 防止 flex 子项溢出 -->
                <!-- 加载状态 -->
                <div v-if="loading" class="flex flex-col items-center justify-center py-20">
                    <i class="fa-solid fa-spinner fa-spin text-blue-500 text-4xl mb-4"></i>
                    <p class="text-slate-500">正在加载章节...</p>
                </div>

                <!-- 错误状态 -->
                <div v-else-if="error" class="bg-red-50 border border-red-200 rounded-xl p-6 text-center">
                    <i class="fa-solid fa-circle-exclamation text-red-400 text-4xl mb-4"></i>
                    <h3 class="text-lg font-semibold text-red-700 mb-2">加载失败</h3>
                    <p class="text-red-600 mb-4">{{ error }}</p>
                </div>

                <!-- 文档内容 -->
                <article v-else-if="htmlContent" class="markdown-body bg-white rounded-2xl shadow-sm p-4 md:p-10">
                    <h1 class="text-3xl font-bold mb-6 !border-b-0">{{ currentDoc?.title }}</h1>
                    <div v-html="htmlContent"></div>
                </article>

                <div v-else class="text-center py-20 text-slate-400">
                    请选择左侧章节开始学习
                </div>
            </div>

            <!-- 右侧大纲（仅大屏显示） -->
            <aside v-if="pageToc.length > 0"
                class="hidden xl:block w-64 p-6 sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">本页导航</h4>
                <nav class="space-y-1 relative border-l border-slate-200 ml-2">
                    <a v-for="item in pageToc" :key="item.id" :href="'#' + item.id"
                        class="block pl-4 py-1 text-xs text-slate-500 hover:text-blue-600 border-l-2 border-transparent hover:border-blue-300 -ml-[1px] transition-colors truncat"
                        :class="{'font-medium text-slate-800': item.level === 1}">
                        {{ item.text }}
                    </a>
                </nav>
            </aside>
        </main>

    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                // 文档列表，来自 external file
                const courseDocs = ref(learnDocs || []);
                const currentDoc = ref(null);
                const loading = ref(false);
                const error = ref('');
                const htmlContent = ref('');
                const pageToc = ref([]);

                // 分组文档 logic
                const groupedDocs = computed(() => {
                    const groupsMap = new Map();
                    courseDocs.value.forEach(doc => {
                        const groupName = doc.group || '基础教程';
                        if (!groupsMap.has(groupName)) {
                            groupsMap.set(groupName, []);
                        }
                        groupsMap.get(groupName).push(doc);
                    });
                    return Array.from(groupsMap.entries()).map(([name, docs]) => ({ name, docs }));
                });

                /**
                 * 加载文档
                 */
                const loadDocument = async (doc) => {
                    if (currentDoc.value?.id === doc.id) return;

                    window.scrollTo(0, 0);
                    currentDoc.value = doc;
                    loading.value = true;
                    error.value = '';
                    pageToc.value = [];

                    try {
                        const response = await fetch(doc.path);
                        if (!response.ok) throw new Error(`无法找到文档: ${doc.path}`);

                        const text = await response.text();

                        // 配置 marked
                        marked.setOptions({
                            highlight: function (code, lang) {
                                if (lang && hljs.getLanguage(lang)) {
                                    return hljs.highlight(code, { language: lang }).value;
                                }
                                return code;
                            },
                            breaks: true
                        });

                        htmlContent.value = marked.parse(text);

                        // 更新 URL hash，方便分享
                        // history.replaceState(null, '', `#${doc.id}`);

                        // 提取本页 TOC
                        extractPageToc(text);

                        await nextTick();
                        addHeadingIds();

                    } catch (e) {
                        console.error(e);
                        // 检测 file:// 协议下的 CORS 错误
                        if (window.location.protocol === 'file:' && e.message.includes('Failed to fetch')) {
                            error.value = '⚠️ 本地文件访问受限。请通过本地服务器访问此页面。\n\n启动方法：在项目目录运行 `python3 -m http.server 8000` 或 `npx serve`，然后访问 http://localhost:8000';
                        } else {
                            error.value = e.message;
                        }
                    } finally {
                        loading.value = false;
                    }
                };

                const extractPageToc = (markdown) => {
                    const headingRegex = /^(#{2,3})\s+(.+)$/gm;
                    const items = [];
                    let match;
                    while ((match = headingRegex.exec(markdown)) !== null) {
                        const level = match[1].length - 1; // h2=level 1 for toc
                        const text = match[2].trim();
                        const id = text.toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9\s-]/g, '').replace(/\s+/g, '-');
                        items.push({ level, text, id });
                    }
                    pageToc.value = items;
                };

                const addHeadingIds = () => {
                    const container = document.querySelector('.markdown-body');
                    if (!container) return;
                    container.querySelectorAll('h2, h3').forEach((heading) => {
                        const text = heading.textContent.trim();
                        const id = text.toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9\s-]/g, '').replace(/\s+/g, '-');
                        heading.id = id;
                    });
                };

                onMounted(() => {
                    // 初始化图标
                    // 默认加载第一篇
                    if (courseDocs.value.length > 0) {
                        loadDocument(courseDocs.value[0]);
                    }
                });

                return {
                    courseDocs,
                    currentDoc,
                    loading,
                    error,
                    htmlContent,
                    pageToc,
                    groupedDocs,
                    loadDocument
                };
            }
        }).mount('#app');
    </script>


    <!-- HELP-WIDGET-START -->
    <script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/ai_basics_learn_hub.md"></script>

</body>

</html>
