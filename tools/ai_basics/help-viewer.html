<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帮助文档 - AI 内容创作工坊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Marked.js 用于解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js 用于代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/markdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>

    <style>
        /* 引入 Google 字体 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        /* Markdown 内容样式 */
        .markdown-body {
            font-size: 16px;
            line-height: 1.8;
            color: #334155;
        }

        .markdown-body h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .markdown-body h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #334155;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #475569;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .markdown-body p {
            margin-bottom: 1rem;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }

        .markdown-body li {
            margin-bottom: 0.5rem;
        }

        .markdown-body ul li {
            list-style-type: disc;
        }

        .markdown-body ol li {
            list-style-type: decimal;
        }

        .markdown-body blockquote {
            border-left: 4px solid #3b82f6;
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border-radius: 0 8px 8px 0;
            color: #1e40af;
        }

        .markdown-body blockquote p {
            margin: 0;
        }

        .markdown-body code {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.875em;
            color: #e11d48;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        .markdown-body pre {
            background: #1e293b;
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .markdown-body pre code {
            background: transparent;
            color: #e2e8f0;
            padding: 0;
            font-size: 0.875rem;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #e2e8f0;
            padding: 0.75rem 1rem;
            text-align: left;
        }

        .markdown-body th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
        }

        .markdown-body tr:hover {
            background: #f8fafc;
        }

        .markdown-body a {
            color: #3b82f6;
            text-decoration: none;
            border-bottom: 1px dotted #3b82f6;
        }

        .markdown-body a:hover {
            color: #1d4ed8;
            border-bottom-style: solid;
        }

        .markdown-body hr {
            border: none;
            height: 1px;
            background: #e2e8f0;
            margin: 2rem 0;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1rem 0;
        }

        /* 目录样式 */
        .toc-item {
            transition: all 0.2s ease;
        }

        .toc-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .toc-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-left-color: #3b82f6;
        }

        /* 加载动画 */
        .loading-spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen flex flex-col">

        <!-- 顶部导航 -->
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200/80">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-4">
                        <a href="../../index.html"
                            class="flex items-center gap-2 text-slate-500 hover:text-blue-600 transition">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span class="hidden sm:inline">返回首页</span>
                        </a>
                        <div class="h-6 w-px bg-slate-200"></div>
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-book-open text-blue-600"></i>
                            <span class="font-semibold text-slate-900">帮助文档</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span v-if="currentDoc" class="text-sm text-slate-500 hidden md:block">
                            {{ currentDoc }}
                        </span>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="flex-grow flex">
            <!-- 侧边目录（桌面端） -->
            <aside v-if="toc.length > 0"
                class="hidden lg:block w-64 border-r border-slate-200 bg-white/50 backdrop-blur-sm">
                <div class="sticky top-16 p-4 max-h-[calc(100vh-4rem)] overflow-y-auto">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">目录</h3>
                    <nav class="space-y-1">
                        <a v-for="item in toc" :key="item.id" :href="'#' + item.id" :class="[
                               'toc-item block px-3 py-2 rounded-lg text-sm border-l-2',
                               item.level === 1 ? 'font-medium text-slate-900 border-slate-300' : '',
                               item.level === 2 ? 'text-slate-700 pl-5 border-slate-200' : '',
                               item.level === 3 ? 'text-slate-500 pl-7 text-xs border-transparent' : ''
                           ]">
                            {{ item.text }}
                        </a>
                    </nav>
                </div>
            </aside>

            <!-- 文档内容 -->
            <div class="flex-grow p-6 md:p-12">
                <div class="max-w-4xl mx-auto">
                    <!-- 加载状态 -->
                    <div v-if="loading" class="flex flex-col items-center justify-center py-20">
                        <div class="loading-spinner mb-4"></div>
                        <p class="text-slate-500">正在加载文档...</p>
                    </div>

                    <!-- 错误状态 -->
                    <div v-else-if="error" class="bg-red-50 border border-red-200 rounded-xl p-6 text-center">
                        <i class="fa-solid fa-circle-exclamation text-red-400 text-4xl mb-4"></i>
                        <h3 class="text-lg font-semibold text-red-700 mb-2">文档加载失败</h3>
                        <p class="text-red-600 mb-4">{{ error }}</p>
                        <button @click="retryLoad"
                            class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                            重新加载
                        </button>
                    </div>

                    <!-- 无文档状态 -->
                    <div v-else-if="!docPath && !htmlContent"
                        class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center">
                        <i class="fa-solid fa-file-lines text-slate-300 text-6xl mb-6"></i>
                        <h2 class="text-2xl font-bold text-slate-700 mb-3">欢迎使用帮助文档</h2>
                        <p class="text-slate-500 mb-6">请从 URL 参数指定要查看的文档</p>
                        <div class="bg-slate-50 rounded-lg p-4 text-left max-w-md mx-auto">
                            <p class="text-sm text-slate-600 mb-2">示例用法：</p>
                            <code class="text-sm text-blue-600">help-viewer.html?doc=docs/help/meeting_minutes.md</code>
                        </div>
                        <div class="mt-8">
                            <h3 class="text-sm font-semibold text-slate-500 mb-3">快速访问</h3>
                            <div class="flex flex-wrap justify-center gap-2">
                                <a v-for="doc in sampleDocs" :key="doc.path" :href="'?doc=' + doc.path"
                                    class="px-3 py-1.5 bg-blue-50 text-blue-700 rounded-full text-sm hover:bg-blue-100 transition">
                                    {{ doc.name }}
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Markdown 内容 -->
                    <article v-else
                        class="markdown-body bg-white rounded-2xl shadow-sm border border-slate-200 p-8 md:p-12"
                        v-html="htmlContent">
                    </article>

                    <!-- 文档元信息 -->
                    <div v-if="htmlContent && !loading"
                        class="mt-8 flex items-center justify-between text-sm text-slate-400">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-file-lines"></i>
                            <span>{{ currentDoc }}</span>
                        </div>
                        <a :href="'https://github.com/yourusername/yourrepo/edit/main/' + docPath" target="_blank"
                            class="flex items-center gap-1 hover:text-blue-600 transition">
                            <i class="fa-solid fa-pen-to-square"></i>
                            <span>编辑此页</span>
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <!-- 页脚 -->
        <footer class="py-8 text-center text-slate-400 text-sm border-t border-slate-200/60 bg-white/50">
            <p>© 2025 AI Content Suite. 帮助文档系统</p>
        </footer>

    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;

        createApp({
            setup() {
                // ================== 状态管理 ==================
                // 文档路径（从 URL 参数获取）
                const docPath = ref('');
                // 当前文档名称
                const currentDoc = ref('');
                // 加载状态
                const loading = ref(false);
                // 错误信息
                const error = ref('');
                // 解析后的 HTML 内容
                const htmlContent = ref('');
                // 目录结构
                const toc = ref([]);

                // 示例文档列表
                const sampleDocs = ref([
                    { name: '智能会议纪要助手', path: 'docs/help/meeting_minutes.md' },
                    { name: 'LLM 交互原理实验室', path: 'docs/help/llm_playground.md' },
                    { name: 'AI 基础知识', path: 'docs/help/categories/ai_basics.md' },
                    { name: '职场办公提效', path: 'docs/help/categories/office.md' },
                ]);

                // ================== 方法 ==================
                /**
                 * 从 URL 获取文档路径参数
                 */
                const getDocPathFromUrl = () => {
                    const params = new URLSearchParams(window.location.search);
                    return params.get('doc') || '';
                };

                /**
                 * 加载并解析 Markdown 文档
                 * @param {string} path - 文档路径
                 */
                const loadDocument = async (path) => {
                    if (!path) return;

                    loading.value = true;
                    error.value = '';
                    htmlContent.value = '';
                    toc.value = [];

                    try {
                        // 获取 Markdown 文件内容
                        const response = await fetch(path);

                        if (!response.ok) {
                            throw new Error(`无法加载文档 (${response.status})`);
                        }

                        const markdown = await response.text();

                        // 配置 marked
                        marked.setOptions({
                            highlight: function (code, lang) {
                                if (lang && hljs.getLanguage(lang)) {
                                    try {
                                        return hljs.highlight(code, { language: lang }).value;
                                    } catch (e) { }
                                }
                                return code;
                            },
                            breaks: true,
                            gfm: true
                        });

                        // 解析 Markdown
                        htmlContent.value = marked.parse(markdown);

                        // 提取目录
                        extractToc(markdown);

                        // 更新当前文档名称
                        currentDoc.value = path.split('/').pop();

                        // 等待 DOM 更新后初始化图标和代码高亮
                        await nextTick();

                        // 为所有标题添加 ID
                        addHeadingIds();

                    } catch (e) {
                        console.error('加载文档失败:', e);
                        error.value = e.message || '文档加载失败，请检查路径是否正确';
                    } finally {
                        loading.value = false;
                    }
                };

                /**
                 * 从 Markdown 提取目录结构
                 * @param {string} markdown - Markdown 内容
                 */
                const extractToc = (markdown) => {
                    const headingRegex = /^(#{1,3})\s+(.+)$/gm;
                    const items = [];
                    let match;

                    while ((match = headingRegex.exec(markdown)) !== null) {
                        const level = match[1].length;
                        const text = match[2].trim();
                        const id = text
                            .toLowerCase()
                            .replace(/[^\u4e00-\u9fa5a-z0-9\s-]/g, '')
                            .replace(/\s+/g, '-');

                        items.push({ level, text, id });
                    }

                    toc.value = items;
                };

                /**
                 * 为文档中的标题添加 ID
                 */
                const addHeadingIds = () => {
                    const container = document.querySelector('.markdown-body');
                    if (!container) return;

                    const headings = container.querySelectorAll('h1, h2, h3');
                    headings.forEach((heading) => {
                        const text = heading.textContent.trim();
                        const id = text
                            .toLowerCase()
                            .replace(/[^\u4e00-\u9fa5a-z0-9\s-]/g, '')
                            .replace(/\s+/g, '-');
                        heading.id = id;
                    });
                };

                /**
                 * 重新加载文档
                 */
                const retryLoad = () => {
                    loadDocument(docPath.value);
                };

                // ================== 生命周期 ==================
                onMounted(() => {
                    // 初始化图标

                    // 从 URL 获取文档路径
                    docPath.value = getDocPathFromUrl();

                    // 如果有文档路径，加载文档
                    if (docPath.value) {
                        loadDocument(docPath.value);
                    }
                });

                // 监听 URL 变化（支持浏览器前进后退）
                window.addEventListener('popstate', () => {
                    docPath.value = getDocPathFromUrl();
                    if (docPath.value) {
                        loadDocument(docPath.value);
                    }
                });

                return {
                    docPath,
                    currentDoc,
                    loading,
                    error,
                    htmlContent,
                    toc,
                    sampleDocs,
                    retryLoad
                };
            }
        }).mount('#app');
    </script>


<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/ai_basics_help-viewer.md"></script>
<!-- HELP-WIDGET-END -->
    </body>
