<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本周能量预算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #ecfccb 0%, #f8fafc 60%, #d9f99d 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen">
        <header class="py-10 px-4">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-lime-500 flex items-center justify-center">
                        <i class="fa-solid fa-battery-full w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">本周能量预算</h1>
                        <p class="text-slate-500">输入一周任务，生成能量分配与 AI 建议。</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="showSettings = true" class="p-2 rounded-full bg-white border border-slate-200 text-slate-500 hover:text-lime-600">
                        <i class="fa-solid fa-cog w-5 h-5"></i>
                    </button>
                    <a href="../../index.html" class="text-sm text-slate-500 hover:text-lime-600">返回首页</a>
                </div>
            </div>
        </header>

        <main class="px-4 pb-16">
            <div class="max-w-5xl mx-auto grid lg:grid-cols-[1fr_1fr] gap-8">
                <section class="glass-card rounded-3xl p-8 shadow-lg">
                    <textarea v-model="rawInput" rows="8" class="w-full border border-slate-200 rounded-2xl px-4 py-3" placeholder="周一, 专注项目, 7\n周二, 会议, 5"></textarea>
                    <button @click="build" class="mt-4 px-5 py-2.5 rounded-xl bg-lime-600 text-white font-medium hover:bg-lime-500" :disabled="isLoading">生成预算</button>
                    <p v-if="error" class="text-sm text-red-500 mt-3">{{ error }}</p>
                    <div class="mt-6">
                        <canvas id="energyChart" height="220"></canvas>
                    </div>
                </section>

                <section class="glass-card rounded-3xl p-8 shadow-lg">
                    <h2 class="text-lg font-bold text-slate-900">AI 建议</h2>
                    <div class="mt-4 bg-lime-50 rounded-2xl p-4 text-slate-700 whitespace-pre-line min-h-[240px]">
                        {{ advice || '等待生成。' }}
                    </div>
                </section>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-md">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                    <input v-model="apiConfig.deepseek" type="password" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">模型</label>
                    <select v-model="apiConfig.model" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>
                <button @click="saveConfig" class="mt-6 w-full px-4 py-2 rounded-lg bg-lime-600 text-white font-medium hover:bg-lime-500">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {


                const rawInput = ref('周一, 专注项目, 7\n周二, 会议, 5\n周三, 深度学习, 8\n周四, 跟进协作, 6\n周五, 复盘总结, 4');
                const advice = ref('');
                const error = ref('');
                const isLoading = ref(false);
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });
                let chartInstance = null;

                const callLLM = async (prompt) => {
                    if (!apiConfig.value.deepseek) {
                        error.value = '请先配置 DeepSeek API Key。';
                        return '';
                    }
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${apiConfig.value.deepseek}`
                        },
                        body: JSON.stringify({
                            model: apiConfig.value.model,
                            messages: [
                                { role: 'system', content: '你是能量管理教练，提供可执行建议。' },
                                { role: 'user', content: prompt }
                            ],
                            temperature: 0.7
                        })
                    });
                    if (!response.ok) throw new Error(`API 请求失败: ${response.status}`);
                    const data = await response.json();
                    return data.choices?.[0]?.message?.content || '';
                };

                const build = async () => {
                    error.value = '';
                    isLoading.value = true;
                    try {
                        const rows = rawInput.value.split('\n').map(line => line.split(',').map(item => item.trim()));
                        const labels = rows.map(row => row[0] || '未知');
                        const values = rows.map(row => Number(row[2]) || 5);
                        const ctx = document.getElementById('energyChart').getContext('2d');
                        if (chartInstance) chartInstance.destroy();
                        chartInstance = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels,
                                datasets: [{
                                    label: '能量消耗',
                                    data: values,
                                    backgroundColor: '#84cc16'
                                }]
                            },
                            options: {
                                scales: { y: { min: 0, max: 10 } },
                                plugins: { legend: { display: false } }
                            }
                        });
                        const prompt = `本周任务与能量：${rows.map(row => `${row[0]} ${row[1]} 能量${row[2]}`).join('；')}\n请给出 2 条节奏优化建议 + 1 条能量补给建议。`;
                        advice.value = await callLLM(prompt);
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        isLoading.value = false;
                    }
                };

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // 初始化 Lucide 图标 (已移除)
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                });

                return {

                    rawInput,
                    advice,
                    error,
                    isLoading,
                    showSettings,
                    apiConfig,
                    build,
                    saveConfig
                };
            }
        }).mount('#app');
    </script>

</body>

</html>
