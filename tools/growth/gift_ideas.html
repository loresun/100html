<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送礼指南针 - AI 选礼专家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #fef2f2;
        }

        .gift-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gift-card:hover {
            transform: translateY(-5px);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="min-h-screen flex flex-col">
    <div id="app" class="flex-grow flex flex-col">
        <!-- 导航 -->
        <nav
            class="bg-white border-b border-rose-100 px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-rose-500 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-gift w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800">送礼指南针</h1>
                    <p class="text-xs text-slate-500">不再为送礼发愁 · 懂礼更懂心</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="../../index.html"
                    class="text-slate-500 hover:text-rose-600 transition flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left w-4 h-4"></i> 返回首页
                </a>
                <button @click="showSettings = true"
                    class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition"><i class="fa-solid fa-cog w-5 h-5"></i></button>
            </div>
        </nav>

        <main class="flex-grow p-6 md:p-12 max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-12">
            <!-- 输入区 -->
            <div class="space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-rose-100">
                    <h2 class="font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-heart w-5 h-5 text-rose-500"></i>
                        收礼人画像
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">送给谁？</label>
                            <select v-model="target"
                                class="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-rose-100 focus:border-rose-400">
                                <option value="女友/老婆">女友/老婆</option>
                                <option value="男友/老公">男友/老公</option>
                                <option value="父母长辈">父母长辈</option>
                                <option value="领导/合作伙伴">领导/合作伙伴</option>
                                <option value="普通朋友">普通朋友</option>
                                <option value="小朋友">小朋友</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">预算区间</label>
                                <select v-model="budget"
                                    class="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-rose-100">
                                    <option value="100-300">100-300 元</option>
                                    <option value="300-1000">300-1000 元</option>
                                    <option value="1000-3000">1000-3000 元</option>
                                    <option value="3000+">3000+ 元</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">送礼场合</label>
                                <input v-model="occasion" type="text" placeholder="例：生日、结婚纪念、新年"
                                    class="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-rose-100">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">更多信息 (兴趣、雷点)</label>
                            <textarea v-model="extraInfo"
                                class="w-full h-24 p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-rose-100 resize-none"
                                placeholder="例：喜欢露营、最近在健身；不喜欢护肤品。"></textarea>
                        </div>
                        <button @click="generateGifts" :disabled="isGenerating"
                            class="w-full py-3.5 bg-rose-500 text-white rounded-xl font-bold hover:bg-rose-600 transition shadow-lg shadow-rose-200 disabled:opacity-50 flex items-center justify-center gap-2">
                            <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin w-5 h-5"></i>
                            <span v-else>✨ 开启灵感指南</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 结果区 -->
            <div class="flex flex-col h-full min-h-[500px]">
                <!-- 错误日志显示 -->
                <div v-if="errorLog"
                    class="bg-red-50 border border-red-200 rounded-xl p-4 mb-4 text-xs text-red-800 overflow-auto max-h-40">
                    <div class="font-bold mb-1">⚠️ 发生错误 (请截图反馈):</div>
                    <pre>{{ errorLog }}</pre>
                </div>

                <div v-if="gifts.length > 0" class="space-y-4">
                    <div v-for="(gift, index) in gifts" :key="index"
                        class="gift-card bg-white p-5 rounded-2xl border border-rose-50 shadow-sm hover:shadow-md">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <span class="text-rose-500">#{{ index + 1 }}</span> {{ gift.name }}
                            </h3>
                            <span class="text-xs bg-rose-50 text-rose-600 px-2 py-1 rounded-full font-bold">{{
                                gift.category }}</span>
                        </div>
                        <p class="text-sm text-slate-600 leading-relaxed mb-4">{{ gift.reason }}</p>
                        <div class="bg-slate-50 rounded-xl p-3 border border-slate-100">
                            <div class="text-[10px] text-slate-400 uppercase font-bold mb-1">搭配贺卡词</div>
                            <p class="text-xs text-slate-500 italic">"{{ gift.copywriting }}"</p>
                        </div>
                    </div>
                </div>
                <div v-else-if="!isGenerating"
                    class="flex-grow border-2 border-dashed border-rose-200 rounded-3xl flex flex-col items-center justify-center text-rose-300 p-8 text-center">
                    <i class="fa-solid fa-cart-shopping w-16 h-16 mb-4 opacity-20"></i>
                    <p class="text-sm">告诉我收礼人的信息<br>为你生成定制化的礼物清单</p>
                </div>
                <div v-else class="space-y-4 animate-pulse">
                    <div v-for="i in 3" :key="i" class="h-40 bg-white rounded-2xl"></div>
                </div>
            </div>
        </main>

        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"
            @click.self="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold">配置 API</h3><button @click="showSettings = false"
                        class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-times h-5 w-5"></i></button>
                </div>
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek"
                            class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-rose-500 outline-none"
                            placeholder="sk-...">
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig"
                        class="bg-rose-600 text-white px-4 py-2 rounded-lg hover:bg-rose-500">保存配置</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {


                const target = ref('女友/老婆');
                const budget = ref('300-1000');
                const occasion = ref('');
                const extraInfo = ref('');
                const isGenerating = ref(false);
                const gifts = ref([]);
                const errorLog = ref('');
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // 初始化 Lucide 图标 (已移除)
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        const config = JSON.parse(saved);
                        apiConfig.value = { ...apiConfig.value, ...config };
                    }
                    if (!apiConfig.value.model) apiConfig.value.model = 'deepseek-v4-flash';
                });

                const saveConfig = () => {
                    localStorage.setItem('global_llm_config', JSON.stringify(apiConfig.value));
                    showSettings.value = false;
                };

                const generateGifts = async () => {
                    if (!apiConfig.value.deepseek) { showSettings.value = true; return; }
                    isGenerating.value = true;
                    gifts.value = [];
                    errorLog.value = ''; // 清空错误

                    const prompt = `你是一个极具品味的送礼专家。请根据以下信息推荐 3-5 个具体的礼物方案。
                    收礼人: ${target.value}，预算: ${budget.value}元，场合: ${occasion.value}。更多信息: ${extraInfo.value}。
                    必须返回一个 JSON 数组，格式如下：
                    [
                      { "name": "礼物名称", "category": "分类", "reason": "推荐理由（强调为什么适合这个人和这个场合）", "copywriting": "配套的温馨贺卡词" }
                    ]
                    只返回 JSON，不要 Markdown 格式。`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.value.deepseek}` },
                            body: JSON.stringify({
                                model: apiConfig.value.model || 'deepseek-v4-flash',
                                messages: [{ role: "system", content: prompt }],
                                stream: false
                            })
                        });

                        if (!response.ok) throw new Error(`API Error: ${response.status}`);

                        const data = await response.json();
                        const content = data.choices[0].message.content;

                        // 增强解析逻辑：去除 Markdown 代码块
                        let cleanJson = content.replace(/```json/g, '').replace(/```/g, '').trim();
                        // 尝试提取数组部分
                        const match = cleanJson.match(/\[[\s\S]*\]/);
                        if (match) cleanJson = match[0];

                        try {
                            gifts.value = JSON.parse(cleanJson);
                        } catch (parseErr) {
                            throw new Error('JSON 解析失败，AI 返回了非标准格式: ' + cleanJson.substring(0, 100) + '...');
                        }

                    } catch (e) {
                        console.error(e);
                        errorLog.value = e.message;
                    } finally {
                        isGenerating.value = false;
                    }
                };
                return {
                    target, budget, occasion, extraInfo, isGenerating, gifts, errorLog, showSettings, apiConfig, saveConfig, generateGifts
                };
            }
        }).mount('#app');
    </script>

</html>
