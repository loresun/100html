<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交情景彩排</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #f0fdf4 0%, #f8fafc 60%, #dcfce7 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }

        .chat-bubble {
            border-radius: 16px;
            padding: 10px 14px;
        }

        .generating {
            position: relative;
            overflow: hidden;
        }

        .generating::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.2), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .pulse-dot {
            animation: pulseDot 1.4s ease-in-out infinite;
        }

        .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
        .pulse-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulseDot {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen">
        <header class="py-10 px-4">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-green-500 flex items-center justify-center">
                        <i class="fa-solid fa-comment w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">社交情景彩排</h1>
                        <p class="text-slate-500">输入场景，让 AI 生成对话演练。</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="showSettings = true" class="p-2 rounded-full bg-white border border-slate-200 text-slate-500 hover:text-green-600">
                        <i class="fa-solid fa-cog w-5 h-5"></i>
                    </button>
                    <a href="../../index.html" class="text-sm text-slate-500 hover:text-green-600">返回首页</a>
                </div>
            </div>
        </header>

        <main class="px-4 pb-16">
            <div class="max-w-5xl mx-auto grid lg:grid-cols-[1fr_1fr] gap-8">
                <section class="glass-card rounded-3xl p-8 shadow-lg">
                    <div class="relative">
                        <input 
                            v-model="scenario" 
                            @input="handleInput"
                            class="w-full border border-slate-200 rounded-xl px-4 py-3 pr-20"
                            placeholder="例如：向同事提出协作请求"
                            :disabled="isLoading"
                        >
                        <span v-if="isTyping" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">
                            <span class="pulse-dot inline-block w-1.5 h-1.5 bg-slate-400 rounded-full"></span>
                            <span class="pulse-dot inline-block w-1.5 h-1.5 bg-slate-400 rounded-full ml-1"></span>
                            <span class="pulse-dot inline-block w-1.5 h-1.5 bg-slate-400 rounded-full ml-1"></span>
                        </span>
                    </div>
                    <select v-model="tone" class="w-full border border-slate-200 rounded-xl px-4 py-3 mt-3" :disabled="isLoading">
                        <option>礼貌稳重</option>
                        <option>轻松幽默</option>
                        <option>坚定直接</option>
                    </select>
                    <button 
                        @click="generate" 
                        class="mt-4 px-5 py-2.5 rounded-xl bg-green-600 text-white font-medium hover:bg-green-500 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                        :disabled="isLoading || !scenario.trim()"
                    >
                        <span v-if="isLoading" class="flex items-center gap-2">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                            生成中...
                        </span>
                        <span v-else>生成对话</span>
                    </button>
                    <p v-if="error" class="text-sm text-red-500 mt-3">{{ error }}</p>
                </section>

                <section class="glass-card rounded-3xl p-8 shadow-lg space-y-4">
                    <div v-if="isLoading" class="generating bg-slate-50 rounded-2xl p-4 animate-pulse">
                        <div class="text-sm text-slate-500">正在思考...</div>
                        <div class="text-slate-400 mt-2">构建对话场景中</div>
                    </div>
                    <div v-for="(line, index) in dialogue" :key="index" :class="line.role === '你' ? 'text-right' : ''" class="fade-card" :style="{ animationDelay: `${index * 0.05}s` }">
                        <div :class="['inline-block chat-bubble', line.role === '你' ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-700']">
                            <div class="text-xs opacity-70">{{ line.role }}</div>
                            <div class="text-sm mt-1">{{ line.text }}</div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-md">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                    <input v-model="apiConfig.deepseek" type="password" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">模型</label>
                    <select v-model="apiConfig.model" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>
                <button @click="saveConfig" class="mt-6 w-full px-4 py-2 rounded-lg bg-green-600 text-white font-medium hover:bg-green-500">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {


                const scenario = ref('向同事提出协作请求');
                const tone = ref('礼貌稳重');
                const dialogue = ref([
                    { role: '你', text: '等待生成…' }
                ]);
                const error = ref('');
                const isLoading = ref(false);
                const showSettings = ref(false);
                const isTyping = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });
                let debounceTimer = null;

                const callLLM = async (prompt) => {
                    if (!apiConfig.value.deepseek) {
                        error.value = '请先配置 DeepSeek API Key。';
                        return '';
                    }
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${apiConfig.value.deepseek}`
                        },
                        body: JSON.stringify({
                            model: apiConfig.value.model,
                            messages: [
                                { role: 'system', content: '你是沟通教练，输出 6 轮对话彩排。' },
                                { role: 'user', content: prompt }
                            ],
                            temperature: 0.7
                        })
                    });
                    if (!response.ok) throw new Error(`API 请求失败: ${response.status}`);
                    const data = await response.json();
                    return data.choices?.[0]?.message?.content || '';
                };

                const handleInput = () => {
                    isTyping.value = true;
                    if (debounceTimer) clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        isTyping.value = false;
                    }, 300);
                };

                const generate = async () => {
                    error.value = '';
                    isLoading.value = true;
                    try {
                        const prompt = `场景：${scenario.value}\n语气：${tone.value}\n请输出 6 轮对话，格式：你：...\n对方：...`;
                        const text = await callLLM(prompt);
                        dialogue.value = text.split(/\n|\r/).map(line => line.split('：')).filter(parts => parts.length >= 2).map(parts => ({
                            role: parts[0].trim(),
                            text: parts.slice(1).join('：').trim()
                        })).slice(0, 6);
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        isLoading.value = false;
                    }
                };

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // 初始化 Lucide 图标 (已移除)
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                });

                return {

                    scenario,
                    tone,
                    dialogue,
                    error,
                    isLoading,
                    showSettings,
                    isTyping,
                    apiConfig,
                    generate,
                    saveConfig,
                    handleInput
                };
            }
        }).mount('#app');
    </script>

<!-- HELP-WIDGET-START -->
<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/growth_social_rehearsal.md"></script>

</body>

</html>
