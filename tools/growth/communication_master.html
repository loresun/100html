<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高情商沟通助手 - AI Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #fdf2f8; } /* 柔和的粉紫色调 */
        
        .chat-bubble {
            position: relative;
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
        }
        .chat-bubble::after {
            content: '';
            position: absolute;
            width: 0; 
            height: 0; 
        }
        .chat-bubble-user {
            background-color: #fff;
            border: 1px solid #e5e7eb;
            border-bottom-right-radius: 0;
            margin-left: 2rem;
        }
        .chat-bubble-ai {
            background-color: #db2777;
            color: white;
            border-bottom-left-radius: 0;
            margin-right: 2rem;
        }
        
        /* 选项卡动画 */
        .tab-enter-active, .tab-leave-active { transition: all 0.3s ease; }
        .tab-enter-from, .tab-leave-to { opacity: 0; transform: translateY(10px); }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col">
    <div id="app" class="flex-grow flex flex-col">
        
        <!-- 导航 -->
        <nav class="bg-white border-b border-pink-100 px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-pink-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-comment-dots w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800">高情商沟通助手</h1>
                    <p class="text-xs text-slate-500">职场/情感/人际 · 嘴笨拯救者</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="../../index.html" class="text-slate-500 hover:text-pink-600 transition flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left w-4 h-4"></i> 返回首页
                </a>
                
                <div class="hidden md:flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                    <span class="text-xs text-slate-500 pl-2">模型:</span>
                    <select v-model="apiConfig.model" @change="saveConfig" class="text-sm bg-transparent border-none focus:ring-0 text-slate-700 font-medium outline-none cursor-pointer">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>

                <button @click="showSettings = true" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition">
                    <i class="fa-solid fa-cog w-5 h-5"></i>
                </button>
            </div>
        </nav>

        <!-- 主体 -->
        <main class="flex-grow p-6 md:p-8 max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- 左侧：场景设置 -->
            <div class="flex flex-col space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-pink-100 p-6 flex-grow">
                    <h2 class="font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-sliders w-5 h-5 text-pink-500"></i>
                        还原现场
                    </h2>
                    
                    <div class="space-y-5">
                        <!-- 1. 对方是谁 -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">对方是谁？</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button v-for="role in roles" :key="role.id" 
                                    @click="selectedRole = role.id"
                                    :class="['py-2 px-3 rounded-lg text-sm transition border', selectedRole === role.id ? 'bg-pink-600 text-white border-pink-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:border-pink-300']">
                                    {{ role.name }}
                                </button>
                            </div>
                        </div>

                        <!-- 2. 对方说了什么 -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">对方说了什么 / 发生了什么？</label>
                            <textarea v-model="incomingMsg" 
                                class="w-full h-24 p-3 rounded-xl border border-slate-200 focus:border-pink-500 focus:ring-2 focus:ring-pink-100 outline-none resize-none bg-slate-50 text-sm"
                                placeholder="例如：老板说'周末辛苦加个班，项目很急'；或者 朋友借钱'兄弟，最近手头紧，借我5000'"></textarea>
                        </div>

                        <!-- 3. 你的真实想法 -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">你的真实意图 (大白话)</label>
                            <input type="text" v-model="myIntent" 
                                class="w-full p-3 rounded-xl border border-slate-200 focus:border-pink-500 focus:ring-2 focus:ring-pink-100 outline-none bg-slate-50 text-sm"
                                placeholder="例如：绝对不想加班，我有约会；或者 不想借，怕他不还">
                        </div>

                        <!-- 生成按钮 -->
                        <button @click="generateReply" :disabled="isGenerating || !incomingMsg || !myIntent"
                            class="w-full py-3.5 bg-pink-600 text-white rounded-xl font-bold hover:bg-pink-700 transition shadow-lg shadow-pink-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-4">
                            <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin w-5 h-5"></i>
                            <span v-else>✨ 帮我生成高情商回复</span>
                        </button>
                    </div>
                </div>

                <!-- 小贴士 -->
                <div class="bg-pink-50 rounded-xl p-4 border border-pink-100 flex gap-3">
                    <i class="fa-solid fa-hands-holding-heart w-6 h-6 text-pink-500 flex-shrink-0"></i>
                    <p class="text-xs text-pink-700 leading-relaxed">
                        <strong>DeepSeek V4 Pro 提示：</strong> 开启 V4 Pro 模型后，AI 会深度分析对方的心理状态和潜在台词，给出的回复会更加击中人心。
                    </p>
                </div>
            </div>

            <!-- 右侧：回复方案 -->
            <div class="flex flex-col h-[600px] md:h-auto">
                <div class="bg-white rounded-2xl shadow-sm border border-pink-100 flex-grow flex flex-col overflow-hidden relative">
                    <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
                        <h2 class="font-bold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles w-4 h-4 text-pink-500"></i>
                            回复锦囊
                        </h2>
                    </div>
                    
                    <div class="flex-grow overflow-auto p-6 bg-slate-50/50 custom-scrollbar">
                        
                        <!-- V4 Pro 思考过程 -->
                        <div v-if="reasoningContent" class="mb-6 p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
                            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1">
                                <i class="fa-solid fa-brain w-3 h-3"></i> 心理分析中...
                            </div>
                            <p class="text-xs text-slate-500 italic leading-relaxed whitespace-pre-wrap">{{ reasoningContent }}</p>
                        </div>

                        <!-- 结果展示 -->
                        <div v-if="results.length > 0" class="space-y-6">
                            <div v-for="(res, index) in results" :key="index" class="bg-white p-5 rounded-2xl border border-pink-100 shadow-sm hover:shadow-md transition group">
                                <div class="flex justify-between items-start mb-3">
                                    <span :class="['px-2 py-1 rounded text-xs font-bold', getBadgeStyle(res.style)]">
                                        {{ res.style }}
                                    </span>
                                    <button @click="copyText(res.content)" class="text-slate-400 hover:text-pink-600 opacity-0 group-hover:opacity-100 transition" title="复制">
                                        <i class="fa-solid fa-copy w-4 h-4"></i>
                                    </button>
                                </div>
                                <p class="text-slate-700 text-base leading-relaxed whitespace-pre-wrap">{{ res.content }}</p>
                                <div class="mt-3 pt-3 border-t border-slate-50 text-xs text-slate-400">
                                    💡 <strong>解析：</strong> {{ res.explanation }}
                                </div>
                            </div>
                        </div>

                        <!-- 空状态 -->
                        <div v-else-if="!isGenerating" class="h-full flex flex-col items-center justify-center text-slate-400 opacity-60">
                            <i class="fa-solid fa-comment-slash w-16 h-16 mb-4 text-pink-200"></i>
                            <p class="text-sm">不知道怎么回？让我来帮你。</p>
                        </div>

                        <!-- 加载中 -->
                        <div v-else class="space-y-4 animate-pulse">
                            <div v-for="i in 3" :key="i" class="bg-white h-32 rounded-2xl border border-slate-100"></div>
                        </div>

                    </div>
                </div>
            </div>

        </main>
        
        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" @click.self="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold">API 配置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-times h-5 w-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-pink-500 outline-none" placeholder="sk-...">
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false" class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig" class="bg-slate-900 text-white px-4 py-2 rounded-lg hover:bg-slate-800">保存配置</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;

        createApp({
            setup() {


                const roles = [
                    { id: 'boss', name: '老板/上级' },
                    { id: 'client', name: '客户/甲方' },
                    { id: 'colleague', name: '同事' },
                    { id: 'friend', name: '朋友/熟人' },
                    { id: 'crush', name: '暧昧对象/伴侣' },
                    { id: 'stranger', name: '陌生人/网友' }
                ];
                
                const selectedRole = ref('boss');
                const incomingMsg = ref('');
                const myIntent = ref('');
                const isGenerating = ref(false);
                const results = ref([]);
                const reasoningContent = ref('');
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // 初始化 Lucide 图标 (已移除)
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) apiConfig.value = JSON.parse(saved);
                });

                const saveConfig = () => {
                    localStorage.setItem('global_llm_config', JSON.stringify(apiConfig.value));
                    showSettings.value = false;
                };

                const getBadgeStyle = (style) => {
                    if (style.includes('委婉') || style.includes('礼貌')) return 'bg-blue-100 text-blue-700';
                    if (style.includes('直接') || style.includes('坚定')) return 'bg-slate-100 text-slate-700';
                    if (style.includes('幽默') || style.includes('高情商')) return 'bg-pink-100 text-pink-700';
                    return 'bg-slate-100 text-slate-600';
                };

                const generateReply = async () => {
                    if (!apiConfig.value.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isGenerating.value = true;
                    results.value = [];
                    reasoningContent.value = '';

                    const systemPrompt = `你是一个高情商沟通专家。用户遇到一个沟通难题。
请根据【对方身份】、【对方的话】以及【用户的真实意图】，生成 3 种不同风格的回复话术。

【输出格式要求】
必须返回一个 JSON 数组，格式如下：
[
  {
    "style": "风格名称（如：委婉得体型、不卑不亢型、幽默化解型）",
    "content": "具体的回复话术",
    "explanation": "简短解析为什么要这么说（如：先肯定对方，再抛出困难...）"
  },
  ...
]

【回复原则】
1. **得体**: 无论怎么拒绝或反击，都要保持体面。
2. **达意**: 必须准确传达用户的真实意图（如拒绝），不能为了客气而含糊其辞导致误会。
3. **分寸**: 根据对象不同（老板 vs 朋友）调整语气。`;

                    const userPrompt = `
对方身份: ${roles.find(r => r.id === selectedRole.value).name}
对方说: "${incomingMsg.value}"
我的真实意图: "${myIntent.value}"
`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.value.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.value.model,
                                messages: [
                                    { role: "system", content: systemPrompt },
                                    { role: "user", content: userPrompt }
                                ],
                                stream: false // 用非流式方便解析 JSON
                            })
                        });

                        const data = await response.json();
                        
                        if (data.choices && data.choices[0]) {
                            // V4 Pro 思考
                            if (data.choices[0].message.reasoning_content) {
                                reasoningContent.value = data.choices[0].message.reasoning_content;
                            }

                            const content = data.choices[0].message.content;
                            // 提取 JSON
                            const jsonMatch = content.match(/\[\s*\{.*\}\s*\]/s);
                            if (jsonMatch) {
                                results.value = JSON.parse(jsonMatch[0]);
                            } else {
                                // 尝试直接解析
                                try {
                                    results.value = JSON.parse(content);
                                } catch(e) {
                                    // 如果不是数组，可能只返回了一个
                                    console.error("解析失败", content);
                                    alert('生成格式有误，请重试');
                                }
                            }
                        }

                    } catch (e) {
                        console.error(e);
                        alert('请求失败，请检查网络');
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const copyText = (text) => {
                    navigator.clipboard.writeText(text);
                    alert('已复制到剪贴板');
                };

                return {

                    roles, selectedRole, incomingMsg, myIntent,
                    isGenerating, results, reasoningContent, showSettings, apiConfig,
                    getBadgeStyle, saveConfig, generateReply, copyText
                };
            }
        }).mount('#app');
    </script>

<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/growth_communication_master.md"></script>

</html>
