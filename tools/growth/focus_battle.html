    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注对战计时器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #e0f2fe 0%, #f8fafc 60%, #bae6fd 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }

        .arena {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen">
        <header class="py-10 px-4">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-sky-500 flex items-center justify-center">
                        <i class="fa-solid fa-fire w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">专注对战计时器</h1>
                        <p class="text-slate-500">给自己设定一场 25 分钟专注对战。</p>
                    </div>
                </div>
                <a href="../../index.html" class="text-sm text-slate-500 hover:text-sky-600">返回首页</a>
            </div>
        </header>

        <main class="px-4 pb-16">
            <div class="max-w-4xl mx-auto grid md:grid-cols-[1fr_1fr] gap-6">
                <section class="glass-card rounded-3xl p-8 shadow-lg">
                    <input v-model="mission" class="w-full border border-slate-200 rounded-xl px-4 py-3" placeholder="输入本次任务">
                    <div class="flex items-center gap-3 mt-4">
                        <button @click="start" class="px-4 py-2 rounded-xl bg-sky-600 text-white font-medium hover:bg-sky-500">开始对战</button>
                        <button @click="pause" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-medium hover:bg-slate-700">暂停</button>
                    </div>
                    <div class="mt-4 text-sm text-slate-500">胜利条件：坚持到 25:00。</div>
                </section>

                <section class="arena rounded-3xl p-8 shadow-lg text-white flex flex-col items-center justify-center">
                    <div class="text-sm opacity-90">剩余时间</div>
                    <div class="text-5xl font-bold mt-2">{{ timer }}</div>
                    <div class="mt-4 text-sm">{{ mission || '你的任务' }}</div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {


                const mission = ref('完成一段写作');
                const timer = ref('25:00');
                let interval = null;

                const start = () => {
                    let remaining = 25 * 60;
                    clearInterval(interval);
                    const tick = () => {
                        const minutes = String(Math.floor(remaining / 60)).padStart(2, '0');
                        const seconds = String(remaining % 60).padStart(2, '0');
                        timer.value = `${minutes}:${seconds}`;
                        if (remaining === 0) {
                            clearInterval(interval);
                        }
                        remaining = Math.max(0, remaining - 1);
                    };
                    tick();
                    interval = setInterval(tick, 1000);
                };

                const pause = () => {
                    clearInterval(interval);
                };

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // 初始化 Lucide 图标 (已移除)
                });

                return {

                    mission,
                    timer,
                    start,
                    pause
                };
            }
        }).mount('#app');
    </script>

</html>
