    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务冒险拆解器 - 游戏化目标管理工具</title>
    <meta name="description" content="将待办事项转化为游戏化冒险任务，AI帮你拆解目标、设计打怪升级路线，让枯燥任务变得有趣！">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        [v-cloak] { display: none; }
        
        /* 游戏化主题色 */
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --secondary: #f59e0b;
            --accent: #10b981;
            --danger: #ef4444;
            --exp-bar: linear-gradient(90deg, #8b5cf6, #a78bfa);
            --fa-primary-color: #a78bfa;
            --fa-secondary-color: #8b5cf6;
        }
        
        /* 背景动画 */
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
            min-height: 100vh;
        }
        
        /* 星空背景动画 */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        /* 任务卡片悬浮效果 */
        .quest-card {
            transition: all 0.3s ease;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .quest-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.5);
        }
        
        /* 经验条动画 */
        .exp-bar {
            background: var(--exp-bar);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        /* Boss卡片特效 */
        .boss-card {
            background: linear-gradient(145deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
            border: 2px solid rgba(239, 68, 68, 0.5);
            animation: boss-pulse 2s infinite;
        }
        
        @keyframes boss-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.5); }
        }
        
        /* 成就徽章 */
        .achievement-badge {
            background: linear-gradient(145deg, #f59e0b, #d97706);
            animation: badge-glow 2s infinite;
        }
        
        @keyframes badge-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); }
        }
        
        /* Prose样式 - Markdown渲染 */
        .prose { max-width: none; color: #e2e8f0; }
        .prose h1 { font-size: 1.875rem; font-weight: bold; margin-top: 1.5rem; margin-bottom: 1rem; color: #a78bfa; }
        .prose h2 { font-size: 1.5rem; font-weight: bold; margin-top: 1.25rem; margin-bottom: 0.75rem; color: #c4b5fd; }
        .prose h3 { font-size: 1.25rem; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; color: #ddd6fe; }
        .prose p { margin: 0.75rem 0; line-height: 1.75; }
        .prose ul, .prose ol { margin: 0.75rem 0; padding-left: 1.5rem; }
        .prose li { margin: 0.25rem 0; }
        .prose strong { color: #fbbf24; }
        .prose code { background: rgba(139, 92, 246, 0.2); padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; }
        .prose blockquote { border-left: 4px solid #8b5cf6; padding-left: 1rem; margin: 1rem 0; color: #a5b4fc; font-style: italic; }
        .prose hr { border-color: rgba(139, 92, 246, 0.3); margin: 1.5rem 0; }
        
        /* 加载动画 */
        .loading-sword {
            animation: sword-swing 1s infinite ease-in-out;
        }
        
        @keyframes sword-swing {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>

<body class="text-white">
    <!-- 星空背景 -->
    <div class="starfield" id="starfield"></div>
    
    <div id="app" v-cloak class="relative z-10">
        <!-- 导航栏 -->

                        任务冒险拆解器

                <div class="flex items-center gap-4">

                    <!-- 设置按钮 -->
                    <button

        </nav>

        <!-- 主内容区 -->
        <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                <!-- 左侧：任务输入区 -->
                <div class="lg:col-span-2 space-y-6">
                    <!-- 任务输入卡片 -->
                    <div class="quest-card rounded-2xl p-6">
                        <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-purple-300">
                            <i class="fa-solid fa-scroll w-5 h-5"></i>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-indigo-200 mb-2">任务名称</label>
                                <input
                                    v-model="formData.taskName"
                                    type="text"
                                    placeholder="例如：学会弹吉他、完成毕业论文、健身减肥..."

                                    class="w-full bg-indigo-900/50 border border-indigo-600/50 rounded-lg p-3 text-white placeholder-indigo-400 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all resize-none"
                                ></textarea>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 游戏化设置 -->
                    <div class="quest-card rounded-2xl p-6">
                        <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-amber-300">
                            <i class="fa-solid fa-gamepad w-5 h-5"></i>
                            🎮 游戏化设置
                        </h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-indigo-200 mb-2">你的角色职业</label>
                                <select
                                    v-model="formData.playerClass"
                                    class="w-full bg-indigo-900/50 border border-indigo-600/50 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-500"
                                >
                                    <option value="warrior">⚔️ 战士 - 直面挑战，硬刚到底</option>
                                    <option value="mage">🔮 法师 - 策略优先，巧妙攻破</option>
                                    <option value="rogue">🗡️ 刺客 - 快速突破，逐个击破</option>
                                    <option value="ranger">🏹 游侠 - 稳扎稳打，持续推进</option>
                                    <option value="healer">💚 治疗师 - 注重平衡，可持续发展</option>
                                </select>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-indigo-200 mb-2">难度偏好</label>
                                <div class="grid grid-cols-3 gap-2">
                                    <button
                                        v-for="diff in difficulties"
                                        :key="diff.value"
                                        @click="formData.difficulty = diff.value"
                                        :class="formData.difficulty === diff.value ? 'bg-purple-600 border-purple-400' : 'bg-indigo-800/50 border-indigo-600/50 hover:border-purple-400'"
                                        class="p-2 rounded-lg border text-sm transition-all text-center"

                                        <div class="text-lg">{{ diff.icon }}</div>
                                        <div class="text-xs mt-1">{{ diff.label }}</div>
                                    </button>

                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-indigo-200 mb-2">目标周期</label>
                                <select
                                    v-model="formData.timeframe"
                                    class="w-full bg-indigo-900/50 border border-indigo-600/50 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-500"

                                    <option value="day">⚡ 今日冲刺（1天内）</option>

                                    <option value="month">🌙 月度副本（1个月）</option>
                                    <option value="quarter">🏔️ 季度远征（3个月）</option>
                                    <option value="custom">⏳ 长期战役（半年以上）</option>
                                </select>
                            </div>
                            
                            <div class="flex items-center gap-3">
                                <input
                                    type="checkbox"
                                    v-model="formData.includeBoss"
                                    id="includeBoss"
                                    class="rounded bg-indigo-900 border-indigo-600 text-purple-600 focus:ring-purple-500"
                                />
                                <label for="includeBoss" class="text-sm text-indigo-200">
                                    🐉 设置 Boss 关卡（里程碑挑战）
                                </label>
                            </div>
                            
                            <div class="flex items-center gap-3">
                                <input
                                    type="checkbox"
                                    v-model="formData.includeRewards"
                                    id="includeRewards"
                                    class="rounded bg-indigo-900 border-indigo-600 text-purple-600 focus:ring-purple-500"
                                />
                                <label for="includeRewards" class="text-sm text-indigo-200">
                                    🎁 设计阶段奖励（自我激励）
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 生成按钮 -->
                    <button
                        @click="generateQuest"
                        :disabled="isLoading || !canGenerate"
                        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-4 rounded-xl font-bold text-lg hover:from-purple-500 hover:to-pink-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-lg hover:shadow-purple-500/30 flex items-center justify-center gap-3"
                    >
                        <span v-if="isLoading" class="loading-sword">⚔️</span>
                        <span v-else>🚀</span>
                        <span>{{ isLoading ? '正在生成冒险任务...' : '开启冒险！' }}</span> </button> <!-- 快速示例 --> <div class="quest-card rounded-2xl p-4"> <p class="text-sm text-indigo-300 mb-3">💡 快速示例（点击填充）：</p> <div class="flex flex-wrap gap-2"> <button v-for="example in examples" :key="example.name" @click="fillExample(example)" class="px-3 py-1.5 bg-indigo-700/50 hover:bg-indigo-600/50 rounded-lg text-sm text-indigo-200 transition-all" > {{ example.icon }} {{ example.name }} </button> </div> </div> </div> <!-- 右侧：结果展示区 --> <div class="lg:col-span-3 space-y-6"> <!-- 空状态 --> <div v-if="!result && !isLoading" class="quest-card rounded-2xl p-12 text-center"> <div class="text-6xl mb-4">🎮</div> <h3 class="text-xl font-bold text-purple-300 mb-2">准备开启冒险！</h3> <p class="text-indigo-300 text-sm"> 输入你的目标任务，AI 将帮你转化为游戏化的冒险旅程 </p> <div class="mt-6 flex justify-center gap-4 text-sm text-indigo-400"> <div class="flex items-center gap-1"> <span>⚔️</span> 怪物拆解 </div> <div class="flex items-center gap-1"> <span>🐉</span> Boss 挑战 </div> <div class="flex items-center gap-1"> <span>🎁</span> 阶段奖励 </div> </div> </div> <!-- 加载状态 --> <div v-if="isLoading" class="quest-card rounded-2xl p-12 text-center"> <div class="text-6xl mb-4 loading-sword">⚔️</div> <h3 class="text-xl font-bold text-purple-300 mb-2">AI 正在设计冒险...</h3> <p class="text-indigo-300 text-sm"> 分析任务 → 拆解怪物 → 设计关卡 → 规划奖励 </p> <!-- 进度条动画 --> <div class="mt-6 w-full bg-indigo-800/50 rounded-full h-2 overflow-hidden"> <div class="exp-bar h-full rounded-full" style="width: 60%; animation: loading-progress 2s infinite;"></div> </div> </div> <!-- 结果展示 --> <div v-if="result && !isLoading" class="space-y-6"> <!-- 深度思考过程（V4 Pro 模型） --> <div v-if="reasoningContent" class="quest-card rounded-2xl p-6"> <details class="group"> <summary class="cursor-pointer text-sm font-medium text-indigo-300 flex items-center gap-2 hover:text-purple-300"> <i class="fa-solid fa-brain w-4 h-4"></i> <span>🧠 AI 深度思考过程（点击展开）</span> <i class="fa-solid fa-chevron-down w-4 h-4 ml-auto group-open:rotate-180 transition-transform"></i> </summary> <div class="mt-4 p-4 bg-indigo-900/50 rounded-lg text-sm text-indigo-200 whitespace-pre-wrap max-h-96 overflow-y-auto"> {{ reasoningContent }}
                                </div>
                            </details>
                        </div>
                        
                        <!-- 冒险任务结果 -->
                        <div class="quest-card rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="text-lg font-bold flex items-center gap-2 text-purple-300">
                                    <i class="fa-solid fa-map w-5 h-5"></i>
                                    🗺️ 冒险任务清单
                                </h2>
                                <div class="flex gap-2">
                                    <button 
                                        @click="copyResult" 
                                        class="p-2 hover:bg-indigo-700/50 rounded-lg transition-colors"
                                        title="复制"
                                    >
                                        <i class="fa-solid fa-copy w-4 h-4 text-indigo-300"></i>
                                    </button>
                                    <button 
                                        @click="exportResult" 
                                        class="p-2 hover:bg-indigo-700/50 rounded-lg transition-colors"
                                        title="导出"
                                    >
                                        <i class="fa-solid fa-download w-4 h-4 text-indigo-300"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="prose" v-html="marked.parse(result)"></div>
                        </div>
                    </div>
                    
                    <!-- 错误提示 -->
                    <div v-if="errorMessage" class="quest-card rounded-2xl p-6 border-red-500/50 bg-red-900/20">
                        <div class="flex items-center gap-2 text-red-400">
                            <i class="fa-solid fa-circle-exclamation w-5 h-5"></i>
                            <span>{{ errorMessage }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-4" @click.self="showSettings = false">
            <div class="bg-indigo-900 border border-indigo-700 rounded-2xl shadow-2xl w-full max-w-md p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold text-purple-300 flex items-center gap-2">
                        <i class="fa-solid fa-cog w-5 h-5"></i>
                        API 配置
                    </h3>
                    <button @click="showSettings = false" class="p-2 hover:bg-indigo-700/50 rounded-lg">
                        <i class="fa-solid fa-times w-5 h-5 text-indigo-300"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-indigo-200 mb-2">
                            DeepSeek API Key
                            <a href="https://platform.deepseek.com/api_keys" target="_blank" class="text-purple-400 hover:underline text-xs ml-2">获取 Key →</a>
                        </label>
                        <input
                            type="password"
                            v-model="apiConfig.deepseek"
                            placeholder="sk-..."
                            class="w-full bg-indigo-800/50 border border-indigo-600/50 rounded-lg p-3 text-white placeholder-indigo-400 focus:ring-2 focus:ring-purple-500"
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-indigo-200 mb-2">模型选择</label>
                        <select 
                            v-model="apiConfig.model" 
                            class="w-full bg-indigo-800/50 border border-indigo-600/50 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-500"
                        >
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                        <p class="mt-1 text-xs text-indigo-400">V4 Pro 模型会进行深度思考，生成更精细的游戏化方案</p>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-3">
                    <button 
                        @click="showSettings = false" 
                        class="px-4 py-2 text-indigo-300 hover:bg-indigo-700/50 rounded-lg transition-colors"
                    >
                        取消
                    </button>
                    <button 
                        @click="saveConfig" 
                        class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-500 transition-colors"
                    >
                        保存配置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 生成星空背景
        (function() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.width = Math.random() * 2 + 1 + 'px';
                star.style.height = star.style.width;
                starfield.appendChild(star);
            }
        })();

        const { createApp, ref, reactive, computed, onMounted } = Vue;

        createApp({
            setup() {

                // ========== 状态定义 ==========
                const showSettings = ref(false);
                const isLoading = ref(false);
                const result = ref('');
                const reasoningContent = ref('');
                const errorMessage = ref('');
                const apiConfig = reactive({ deepseek: '', model: 'deepseek-v4-flash' });
                const formData = reactive({
                    taskName: '',
                    taskDesc: '',
                    playerClass: 'warrior',
                    difficulty: 'normal',
                    timeframe: '1week',
                    includeBoss: true,
                    includeRewards: true
                });
                const difficulties = [
                    { value: 'easy', label: '🌱 简单' },
                    { value: 'normal', label: '⚔️ 普通' },
                    { value: 'hard', label: '🔥 困难' }
                ];
                const examples = [
                    { name: '写作', icon: '✍️', taskName: '写完一篇公众号文章', taskDesc: '需要 5000 字，主题是 AI 工具推荐' },
                    { name: '健身', icon: '💪', taskName: '养成健身习惯', taskDesc: '每周去健身房 3 次' },
                    { name: '学习', icon: '📚', taskName: '学习 Python 编程', taskDesc: '每天花 1 小时刷 LeetCode' }
                ];
                const canGenerate = computed(() => formData.taskName.trim() !== '');

                // ========== 配置管理 ==========
                /**
                 * 从 localStorage 加载配置
                 */
                function loadConfig() {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        try {
                            const config = JSON.parse(saved);
                            if (config.deepseek) apiConfig.deepseek = config.deepseek;
                            if (config.model) apiConfig.model = config.model;
                        } catch (e) {
                            console.error('解析 global_llm_config 失败:', e);
                        }
                    }
                }

                /**
                 * 保存配置到 localStorage（合并策略）
                 */
                function saveConfig() {
                    let current = {};
                    try {
                        current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    } catch (e) {
                        console.error('解析 global_llm_config 失败:', e);
                    }
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...current,
                        deepseek: apiConfig.deepseek,
                        model: apiConfig.model
                    }));
                    showSettings.value = false;
                    alert('✅ 配置已保存');
                }

                /**
                 * 填充快速示例
                 */
                function fillExample(example) {
                    formData.taskName = example.taskName;
                    formData.taskDesc = example.taskDesc;
                }

                // ========== AI 生成逻辑 ==========
                /**
                 * 生成游戏化任务
                 */
                async function generateQuest() {
                    // 检查 API Key
                    if (!apiConfig.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isLoading.value = true;
                    result.value = '';
                    reasoningContent.value = '';
                    errorMessage.value = '';

                    // 构建角色描述映射
                    const classDescMap = {
                        warrior: '战士型玩家：喜欢直面挑战，一鼓作气完成任务',
                        mage: '法师型玩家：善于策略规划，用巧妙方法攻破难题',
                        rogue: '刺客型玩家：追求效率，快速突破，逐个击破',
                        ranger: '游侠型玩家：稳扎稳打，保持节奏，持续推进',
                        healer: '治疗师型玩家：注重身心平衡，可持续发展'
                    };

                    const difficultyDescMap = {
                        easy: '简单模式：小步快跑，降低门槛，快速获得成就感',
                        normal: '普通模式：适中挑战，平衡难度与成就',
                        hard: '困难模式：高强度挑战，追求极限突破'
                    };

                    const timeframeDescMap = {
                        day: '今日冲刺（24小时内）',
                        week: '周任务（7天内）',
                        month: '月度副本（30天）',
                        quarter: '季度远征（90天）',
                        custom: '长期战役（180天以上）'
                    };

                    // 构建系统提示词
                    const systemPrompt = `你是一位专业的游戏化学习与任务设计专家，精通将现实任务转化为有趣的游戏冒险。

你的任务是将用户的目标/待办事项转化为一个完整的游戏化冒险任务清单。

**设计原则：**
1. **怪物化任务**：将每个子任务比喻成需要打败的怪物，有名称、难度、经验值
2. **关卡制设计**：按照难度和依赖关系，设计章节/关卡
3. **Boss机制**：关键里程碑设置为 Boss 战，需要特殊准备
4. **奖励系统**：完成任务后的自我奖励建议
5. **技能树**：完成任务后能解锁的新能力

**输出格式（使用 Markdown，带表情符号）：**

# 🎮 冒险任务：[任务名称]

## 📊 冒险概览
- ⏱️ 预计周期：XXX
- 🎯 终极目标：XXX
- 💪 推荐等级：Lv.X → Lv.Y

---

## 🗺️ 冒险地图

### 第一章：[章节名称] 🌱
> 章节目标：XXX

| 任务 | 怪物名 | 难度 | 经验值 | 预计时间 |
|------|--------|------|--------|----------|
| ⬜ 子任务1 | 🐺 怪物名 | ⭐ | +50 EXP | 30分钟 |
| ⬜ 子任务2 | 🦊 怪物名 | ⭐⭐ | +80 EXP | 1小时 |

${formData.includeBoss ? `
### 🐉 Boss 战：[里程碑名称]
- **Boss 名称**：XXX
- **挑战条件**：完成所有前置任务
- **Boss 技能**：可能遇到的困难
- **攻略建议**：如何击败
- **掉落奖励**：🏆 成就 + ✨ 技能解锁
` : ''}

---

## ⚔️ 装备推荐
- 📚 知识武器：需要学习的知识/技能
- 🛡️ 防护装备：避免失败的注意事项
- 🧪 药水道具：辅助工具/资源

${formData.includeRewards ? `
---

## 🎁 奖励设计
| 阶段 | 完成条件 | 推荐奖励 |
|------|----------|----------|
| 💫 青铜成就 | 完成第一章 | XXX |
| ⚡ 白银成就 | 击败 Boss | XXX |
| 👑 黄金成就 | 通关全部 | XXX |
` : ''}

---

## 💡 冒险锦囊
1. **新手指南**：第一步应该怎么做
2. **避坑指南**：常见错误和如何避免
3. **升级秘籍**：如何更快获得经验

---

🚀 **开始你的冒险吧，勇士！**

**注意：**
- 根据用户的角色职业特点调整建议风格
- 难度设置要符合用户选择
- 任务拆解要具体、可执行
- 时间估算要合理`;

                    // 构建用户提示词
                    const userPrompt = `请帮我将以下任务转化为游戏化冒险：

**任务名称**：${formData.taskName || '未命名任务'}

**任务描述**：
${formData.taskDesc || '无详细描述'}

**我的角色**：${classDescMap[formData.playerClass]}

**难度偏好**：${difficultyDescMap[formData.difficulty]}

**目标周期**：${timeframeDescMap[formData.timeframe]}

**额外设置**：
- Boss 关卡：${formData.includeBoss ? '需要' : '不需要'}
- 阶段奖励：${formData.includeRewards ? '需要' : '不需要'}

请设计一个完整的游戏化冒险任务清单，让我像打游戏一样完成这个目标！`;

                    try {
                        // 调用 DeepSeek API（流式输出）
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.model,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: userPrompt }
                                ],
                                stream: true,
                                temperature: 0.8
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`API 请求失败: ${response.status}`);
                        }

                        // 处理流式响应
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const parsed = JSON.parse(data);
                                        const delta = parsed.choices[0].delta;

                                        // V4 Pro 模型的推理过程
                                        if (delta.reasoning_content) {
                                            reasoningContent.value += delta.reasoning_content;
                                        }

                                        // 正式内容
                                        if (delta.content) {
                                            result.value += delta.content;
                                        }
                                    } catch (e) {
                                        console.error('解析错误:', e);
                                    }
                                }
                            }
                        }
                    } catch (error) {
                        console.error('生成失败:', error);
                        errorMessage.value = error.message || '生成失败，请检查 API Key 或稍后重试';
                    } finally {
                        isLoading.value = false;
                    }
                }

                // ========== 导出功能 ==========
                /**
                 * 复制结果到剪贴板
                 */
                async function copyResult() {
                    try {
                        let text = result.value;
                        if (reasoningContent.value) {
                            text = `=== AI 思考过程 ===\n\n${reasoningContent.value}\n\n=== 冒险任务 ===\n\n${text}`;
                        }
                        await navigator.clipboard.writeText(text);
                        alert('✅ 已复制到剪贴板');
                    } catch (err) {
                        console.error('复制失败:', err);
                        alert('❌ 复制失败，请手动复制');
                    }
                }

                /**
                 * 导出结果为 Markdown 文件
                 */
                function exportResult() {
                    let content = '';
                    if (reasoningContent.value) {
                        content += '# AI 思考过程\n\n' + reasoningContent.value + '\n\n---\n\n';
                    }
                    content += result.value;

                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `冒险任务_${formData.taskName || '未命名'}_${new Date().getTime()}.md`;
                    a.click();
                    URL.revokeObjectURL(url);
                }

                // ========== 生命周期 ==========
                onMounted(() => {
                    // 初始化 Lucide 图标
                    // lucide.createIcons();
                    loadConfig();
                });

                return {

                    showSettings,
                    isLoading,
                    result,
                    reasoningContent,
                    errorMessage,
                    apiConfig,
                    formData,
                    difficulties,
                    examples,
                    canGenerate,

                    saveConfig,
                    fillExample,
                    generateQuest,
                    copyResult,
                    exportResult,
                    marked
                };
            }
        }).mount('#app');
    </script>
