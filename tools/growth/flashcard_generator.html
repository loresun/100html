<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 记忆卡片生成器 - AI Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f0fdfa; }

        /* 翻转卡片样式 */
        .flashcard-container {
            perspective: 1000px;
            height: 300px;
            cursor: pointer;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
        }
        .is-flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: white;
            border: 1px solid #ccfbf1;
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background: #f0fdfa;
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col">
    <div id="app" class="flex-grow flex flex-col">
        
        <!-- 导航 -->
        <nav class="bg-white border-b border-teal-100 px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-teal-500 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-note-sticky w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800">记忆卡片生成器</h1>
                    <p class="text-xs text-slate-500">单词/概念 -> Anki 卡片</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="../../index.html" class="text-slate-500 hover:text-teal-600 transition flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left w-4 h-4"></i> 返回
                </a>
                <div class="hidden md:flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                    <span class="text-xs text-slate-500 pl-2">模型:</span>
                    <select v-model="apiConfig.model" @change="saveConfig" class="text-sm bg-transparent border-none focus:ring-0 text-slate-700 font-medium outline-none cursor-pointer">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                    </select>
                </div>
                <button @click="showSettings = true" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition">
                    <i class="fa-solid fa-cog w-5 h-5"></i>
                </button>
            </div>
        </nav>

        <main class="flex-grow p-6 md:p-8 max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- 左侧：输入 -->
            <div class="flex flex-col space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-teal-100 p-6 flex-grow">
                    <label class="block text-sm font-bold text-slate-700 mb-2">输入单词、短语或主题</label>
                    <textarea v-model="userInput" 
                        class="w-full h-48 p-4 rounded-xl border border-slate-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-100 outline-none resize-none bg-slate-50 text-sm leading-relaxed"
                        placeholder="例如：
serendipity
ephemeral
petrichor
...
或者直接输入主题：
'生成5个关于人工智能的高级词汇'"></textarea>

                    <div class="flex gap-2 mt-4">
                        <button @click="generateCards" :disabled="isGenerating || !userInput"
                            class="flex-1 py-3 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition shadow-lg shadow-teal-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                            <i v-if="isGenerating" class="fa-solid fa-spinner fa-spin w-5 h-5"></i>
                            <span v-else>生成卡片</span>
                        </button>
                        <button v-if="cards.length > 0" @click="exportCSV" class="px-4 py-3 bg-white border border-teal-200 text-teal-600 rounded-xl font-bold hover:bg-teal-50 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-download w-4 h-4"></i> 导出 CSV
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧：预览 -->
            <div class="flex flex-col h-[500px] md:h-auto">
                <!-- 轮播控制 -->
                <div v-if="cards.length > 0" class="flex justify-between items-center mb-4 text-sm text-slate-500">
                    <button @click="prevCard" class="hover:text-teal-600"><i class="fa-solid fa-chevron-left w-5 h-5"></i></button>
                    <span>{{ currentIndex + 1 }} / {{ cards.length }}</span>
                    <button @click="nextCard" class="hover:text-teal-600"><i class="fa-solid fa-chevron-right w-5 h-5"></i></button>
                </div>

                <!-- 卡片本体 -->
                <div v-if="cards.length > 0" class="flashcard-container" :class="{ 'is-flipped': isFlipped }" @click="isFlipped = !isFlipped">
                    <div class="flashcard-inner">
                        <!-- 正面 -->
                        <div class="flashcard-front">
                            <h2 class="text-3xl font-bold text-slate-800 mb-2">{{ currentCard.front }}</h2>
                            <p class="text-xs text-slate-400">点击查看背面</p>
                        </div>
                        <!-- 背面 -->
                        <div class="flashcard-back text-left items-start">
                            <div class="w-full">
                                <h3 class="text-lg font-bold text-teal-700 mb-2">释义</h3>
                                <p class="text-slate-600 text-sm mb-4">{{ currentCard.back_def }}</p>
                                
                                <h3 class="text-lg font-bold text-teal-700 mb-2">例句</h3>
                                <p class="text-slate-600 text-sm italic mb-4">"{{ currentCard.back_example }}"</p>
                                
                                <h3 class="text-lg font-bold text-teal-700 mb-2">记忆钩子</h3>
                                <p class="text-slate-500 text-xs">{{ currentCard.back_hook }}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 空状态 -->
                <div v-else-if="!isGenerating" class="h-full bg-white rounded-2xl border border-teal-100 border-dashed flex items-center justify-center text-slate-400">
                    <p>暂无卡片，请在左侧生成</p>
                </div>
                
                 <!-- 加载中 -->
                <div v-else class="h-full flex items-center justify-center">
                    <i class="fa-solid fa-spinner fa-spin w-8 h-8 text-teal-500"></i>
                </div>
            </div>

        </main>
        
        <!-- 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" @click.self="showSettings = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold">API 配置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-times h-5 w-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" v-model="apiConfig.deepseek" class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-teal-500 outline-none" placeholder="sk-...">
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false" class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg">取消</button>
                    <button @click="saveConfig" class="bg-slate-900 text-white px-4 py-2 rounded-lg hover:bg-slate-800">保存配置</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick } = Vue;

        createApp({
            setup() {


                const userInput = ref('');
                const cards = ref([]);
                const currentIndex = ref(0);
                const isFlipped = ref(false);
                const isGenerating = ref(false);
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });

                onMounted(() => {
                    // 初始化 Lucide 图标
                    // 初始化 Lucide 图标 (已移除)
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) apiConfig.value = JSON.parse(saved);
                });

                const saveConfig = () => {
                    localStorage.setItem('global_llm_config', JSON.stringify(apiConfig.value));
                    showSettings.value = false;
                };

                const currentCard = computed(() => cards.value[currentIndex.value] || {});

                const prevCard = () => {
                    if (currentIndex.value > 0) {
                        isFlipped.value = false;
                        setTimeout(() => currentIndex.value--, 300); // 等待翻转复位
                    }
                };
                
                const nextCard = () => {
                    if (currentIndex.value < cards.value.length - 1) {
                        isFlipped.value = false;
                        setTimeout(() => currentIndex.value++, 300);
                    }
                };

                const generateCards = async () => {
                    if (!apiConfig.value.deepseek) {
                        showSettings.value = true;
                        return;
                    }

                    isGenerating.value = true;
                    cards.value = [];
                    currentIndex.value = 0;
                    isFlipped.value = false;

                    const systemPrompt = `你是一个辅助学习专家。用户会输入一系列单词、短语或一个主题。
请为每个知识点生成一张记忆卡片。

【输出格式】
必须返回一个 JSON 数组：
[
  {
    "front": "单词/概念 (如: Serendipity)",
    "back_def": "简明释义 (如: 意外发现美好事物的运气)",
    "back_example": "一个典型例句",
    "back_hook": "助记钩子/词根记忆 (如: 电影《缘分天注定》的名字)"
  }
]`;

                    try {
                        const response = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiConfig.value.deepseek}`
                            },
                            body: JSON.stringify({
                                model: apiConfig.value.model,
                                messages: [
                                    { role: "system", content: systemPrompt },
                                    { role: "user", content: userInput.value }
                                ],
                                stream: false
                            })
                        });

                        const data = await response.json();
                        const content = data.choices[0].message.content;
                        const jsonMatch = content.match(/\[[\s\S]*\]/);
                        
                        if (jsonMatch) {
                            cards.value = JSON.parse(jsonMatch[0]);
                        } else {
                            // 简单的 Fallback
                            alert('生成格式有误，请重试');
                        }

                    } catch (e) {
                        alert('生成失败');
                    } finally {
                        isGenerating.value = false;
                    }
                };

                const exportCSV = () => {
                    let csvContent = "data:text/csv;charset=utf-8,Front,Back\n";
                    cards.value.forEach(c => {
                        // Anki 格式: Front, Back
                        // 我们把 Back 的三个字段合并成 HTML 格式
                        const backHtml = `<b>${c.back_def}</b><br><i>${c.back_example}</i><br><small>${c.back_hook}</small>`;
                        // 处理 CSV 转义
                        const front = c.front.replace(/"/g, '""');
                        const back = backHtml.replace(/"/g, '""');
                        csvContent += `"${front}","${back}"\n`;
                    });
                    
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", "flashcards.csv");
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                };

                return {

                    userInput, cards, currentIndex, isFlipped, currentCard,
                    isGenerating, showSettings, apiConfig,
                    saveConfig, generateCards, prevCard, nextCard, exportCSV
                };
            }
        }).mount('#app');
    </script>

</html>
