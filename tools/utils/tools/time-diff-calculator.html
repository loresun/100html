  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时间差计算</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
    <script src="../../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

  <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
        <i class="fa-solid fa-wrench text-indigo-600 text-xl"></i>
        <span class="font-bold text-xl text-slate-900">时间差计算</span>
      </div>
      <div class="flex items-center gap-4 text-sm text-slate-500">
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">返回主页</button>
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">Utils 工具导航</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h1 class="text-2xl font-semibold mb-2">时间差计算</h1>
      <p class="text-sm text-slate-600 mb-6">计算两个时间点之间的差值。</p>

      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <input id="startTime" type="datetime-local" class="border rounded-lg p-2 text-sm" />
          <input id="endTime" type="datetime-local" class="border rounded-lg p-2 text-sm" />
        </div>
        <button id="calcBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">计算差值</button>
        <textarea id="outputText" class="w-full h-32 border rounded-lg p-3 text-sm" readonly></textarea>
      </div>
    </section>
  </main>

  <script>
    
    document.getElementById('calcBtn').addEventListener('click', () => {
      const start = new Date(document.getElementById('startTime').value);
      const end = new Date(document.getElementById('endTime').value);
      const diff = Math.abs(end - start);
      const hours = Math.floor(diff / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);
      document.getElementById('outputText').value = `相差 ${hours} 小时 ${minutes} 分钟 ${seconds} 秒`;
    });


  </script>

<!-- HELP-WIDGET-START -->
<script src="../../../help/help-widget-v2.js"></script>

</body>
</html>
