  <meta charset="UTF-8" />

  <title>WebP 转 PNG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
    <script src="../../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

  <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
        <i class="fa-solid fa-wrench text-indigo-600 text-xl"></i>
        <span class="font-bold text-xl text-slate-900">WebP 转 PNG</span>
      </div>
      <div class="flex items-center gap-4 text-sm text-slate-500">
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">返回主页</button>
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">Utils 工具导航</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h1 class="text-2xl font-semibold mb-2">WebP 转 PNG</h1>
      <p class="text-sm text-slate-600 mb-6">WebP 图片转换为 PNG。</p>

      <div class="space-y-4">
        <input id="imageInput" type="file" accept="image/*" class="block w-full text-sm" />
        
<p class="text-xs text-slate-500">上传 WebP 转为 PNG</p>

        <div class="flex flex-wrap gap-3">
          <button id="processBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">开始处理</button>
          <button id="downloadBtn" class="px-4 py-2 rounded-lg border border-slate-200 text-sm" disabled>下载结果</button>
        </div>
        <canvas id="canvas" class="w-full max-h-[480px] border border-slate-200 rounded-xl"></canvas>
      </div>
        </section>
  </main>

  <script>
    
    const imageInput = document.getElementById('imageInput');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let currentBlob = null;

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function runProcess() {
      const file = imageInput.files[0];
      if (!file) return;
      const img = await loadImage(file);
      
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      canvas.toBlob(blob => {
        currentBlob = blob;
        downloadBtn.disabled = !blob;
      }, 'image/png');
    }

    processBtn.addEventListener('click', runProcess);
    downloadBtn.addEventListener('click', () => {
      if (!currentBlob) return;
      const url = URL.createObjectURL(currentBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'result.png';
      link.click();
      URL.revokeObjectURL(url);
    });
    

  </script>

</body>
</html>
