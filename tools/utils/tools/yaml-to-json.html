  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YAML 转 JSON</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="../../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

  <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
        <i class="fa-solid fa-wrench text-indigo-600 text-xl"></i>
        <span class="font-bold text-xl text-slate-900">YAML 转 JSON</span>
      </div>
      <div class="flex items-center gap-4 text-sm text-slate-500">
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">返回主页</button>
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">Utils 工具导航</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h1 class="text-2xl font-semibold mb-2">YAML 转 JSON</h1>
      <p class="text-sm text-slate-600 mb-6">将 YAML 转换为 JSON。</p>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-slate-500">输入</label>
          <textarea id="inputText" class="w-full h-64 border rounded-lg p-3 text-sm" placeholder="请输入内容"></textarea>
          <button id="runBtn" class="mt-3 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">转换</button>
        </div>
        <div>
          <label class="text-xs text-slate-500">输出</label>
          <textarea id="outputText" class="w-full h-64 border rounded-lg p-3 text-sm" readonly></textarea>
        </div>
      </div>
        </section>
  </main>

  <script>
    
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    document.getElementById('runBtn').addEventListener('click', () => {
      
      try {
        const data = window.jsyaml.load(inputText.value || '');
        outputText.value = JSON.stringify(data, null, 2);
      } catch (err) {
        outputText.value = 'YAML 解析失败';
      }

    });
    

  </script>

<!-- HELP-WIDGET-START -->
<script src="../../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
