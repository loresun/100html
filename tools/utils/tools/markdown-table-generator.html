  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown 表格生成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
    <script src="../../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

  <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
        <i data-lucide="wrench" class="text-indigo-600 h-6 w-6"></i>
        <span class="font-bold text-xl text-slate-900">Markdown 表格生成</span>
      </div>
      <div class="flex items-center gap-4 text-sm text-slate-500">
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../../index.html'">返回主页</button>
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">Utils 工具导航</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h1 class="text-2xl font-semibold mb-2">Markdown 表格生成</h1>
      <p class="text-sm text-slate-600 mb-6">快速生成 Markdown 表格模板。</p>

      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <input id="rowsInput" type="number" value="3" class="border rounded-lg p-2 text-sm" placeholder="行数" />
          <input id="colsInput" type="number" value="3" class="border rounded-lg p-2 text-sm" placeholder="列数" />
        </div>
        <button id="buildBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">生成表格</button>
        <textarea id="output" class="w-full h-48 border rounded-lg p-3 text-sm" readonly></textarea>
      </div>
    </section>
  </main>

  <script>
    
    document.getElementById('buildBtn').addEventListener('click', () => {
      const rows = parseInt(document.getElementById('rowsInput').value || 1, 10);
      const cols = parseInt(document.getElementById('colsInput').value || 1, 10);
      const header = Array.from({ length: cols }, (_, i) => `列${i + 1}`).join(' | ');
      const separator = Array.from({ length: cols }, () => '---').join(' | ');
      const body = Array.from({ length: rows }, () => Array.from({ length: cols }, () => '内容').join(' | ')).join('\n');
      document.getElementById('output').value = `${header}
${separator}
${body}`;
    });

    lucide.createIcons();
  </script>

<!-- HELP-WIDGET-START -->
<script src="../../../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
