  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文本拆分器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
    <script src="../../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

  <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
        <i class="fa-solid fa-wrench text-indigo-600 text-xl"></i>
        <span class="font-bold text-xl text-slate-900">文本拆分器</span>
      </div>
      <div class="flex items-center gap-4 text-sm text-slate-500">
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../../index.html'">返回主页</button>
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">Utils 工具导航</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h1 class="text-2xl font-semibold mb-2">文本拆分器</h1>
      <p class="text-sm text-slate-600 mb-6">按行数拆分文本。</p>

      <div class="space-y-4">
        <textarea id="inputText" class="w-full h-48 border rounded-lg p-3 text-sm"></textarea>
        <input id="splitSize" type="number" value="5" class="border rounded-lg p-2 text-sm" placeholder="每段行数" />
        <button id="runBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">拆分</button>
        <textarea id="outputText" class="w-full h-48 border rounded-lg p-3 text-sm" readonly></textarea>
      </div>
    </section>
  </main>

  <script>
    
    document.getElementById('runBtn').addEventListener('click', () => {
      const lines = document.getElementById('inputText').value.split(/\r?\n/);
      const size = parseInt(document.getElementById('splitSize').value || 5, 10);
      const chunks = [];
      for (let i = 0; i < lines.length; i += size) {
        chunks.push(lines.slice(i, i + size).join('\n'));
      }
      document.getElementById('outputText').value = chunks.join('\n\n---\n\n');
    });


  </script>

</html>
