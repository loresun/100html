<html lang="zh-CN">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关键词高亮</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
    <script src="../../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

  <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
        <i data-lucide="wrench" class="text-indigo-600 h-6 w-6"></i>
        <span class="font-bold text-xl text-slate-900">关键词高亮</span>
      </div>
      <div class="flex items-center gap-4 text-sm text-slate-500">
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">返回主页</button>
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">Utils 工具导航</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h1 class="text-2xl font-semibold mb-2">关键词高亮</h1>
      <p class="text-sm text-slate-600 mb-6">在文本中高亮关键词。</p>

      <div class="space-y-3">
        <input id="keyword" class="w-full border rounded-lg p-2 text-sm" placeholder="关键词" />
        <textarea id="inputText" class="w-full h-48 border rounded-lg p-3 text-sm"></textarea>
        <button id="runBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">高亮显示</button>
        <div id="output" class="border rounded-lg p-3 text-sm whitespace-pre-wrap"></div>
      </div>
    </section>
  </main>

  <script>
    
    document.getElementById('runBtn').addEventListener('click', () => {
      const keyword = document.getElementById('keyword').value;
      const text = document.getElementById('inputText').value;
      if (!keyword) return;
      const regex = new RegExp(keyword, 'g');
      document.getElementById('output').innerHTML = text.replace(regex, `<mark class="bg-yellow-200">${keyword}</mark>`);
    });

    lucide.createIcons();
  </script>

<!-- HELP-WIDGET-START -->
<script src="../../../help/help-widget-v2.js"></script>

</body>
</html>
