  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown 目录生成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
    <script src="../../../assets/js/deepseek-v4-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

  <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../../index.html'">
        <i class="fa-solid fa-wrench text-indigo-600 text-xl"></i>
        <span class="font-bold text-xl text-slate-900">Markdown 目录生成</span>
      </div>
      <div class="flex items-center gap-4 text-sm text-slate-500">
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../../index.html'">返回主页</button>
        <button class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100" onclick="location.href='../../index.html'">Utils 工具导航</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h1 class="text-2xl font-semibold mb-2">Markdown 目录生成</h1>
      <p class="text-sm text-slate-600 mb-6">自动生成 Markdown 目录。</p>

      <div class="space-y-4">
        <textarea id="markdownInput" class="w-full h-64 border rounded-lg p-3 text-sm" placeholder="输入 Markdown"></textarea>
        <button id="tocBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">生成目录</button>
        <textarea id="output" class="w-full h-48 border rounded-lg p-3 text-sm" readonly></textarea>
      </div>
    </section>
  </main>

  <script>
    
    document.getElementById('tocBtn').addEventListener('click', () => {
      const lines = document.getElementById('markdownInput').value.split(/\r?\n/);
      const toc = lines.filter(line => line.startsWith('#')).map(line => {
        const level = line.match(/^#+/)[0].length;
        const text = line.replace(/^#+\s*/, '');
        const slug = text.toLowerCase().replace(/[^a-z0-9一-龥]+/g, '-');
        return `${'  '.repeat(level - 1)}- [${text}](#${slug})`;
      });
      document.getElementById('output').value = toc.join('\n');
    });


  </script>
