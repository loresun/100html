    <meta name="description" content="让 AI 为你的愿望生成一张精美的未来签卡片，6种精美风格可选，支持导出为图片">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
         * 基础样式
         * ======================================== */
        body {
            font-family: "Outfit", "Noto Serif SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }

        /* 玻璃卡片效果 */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* 输入框样式 */
        .input-modern {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            transition: all 0.3s ease;
        }
        .input-modern::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .input-modern:focus {
            outline: none;
            border-color: rgba(251, 191, 36, 0.6);
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }

        /* 按钮悬停动画 */
        .btn-glow {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .btn-glow:hover::before {
            left: 100%;
        }
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(251, 191, 36, 0.5);
        }

        /* 模板选择器样式 */
        .template-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .template-item {
            position: relative;
            aspect-ratio: 3/4;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            border: 2px solid transparent;
        }
        .template-item:hover {
            transform: scale(1.05);
        }
        .template-item.active {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }
        .template-item .template-preview {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            padding: 8px;
        }
        .template-item .template-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4px;
            background: rgba(0, 0, 0, 0.6);
            font-size: 10px;
            text-align: center;
            color: #fff;
        }

        /* ========================================
         * 卡片模板样式
         * ======================================== */
        
        /* 模板1: 经典金橙渐变 */
        .card-template-1 {
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 50%, #dc2626 100%);
            color: #fff;
            font-family: "Outfit", sans-serif;
        }
        .card-template-1 .card-accent {
            color: rgba(255, 255, 255, 0.9);
        }
        .card-template-1 .card-subtitle {
            color: rgba(255, 255, 255, 0.7);
        }
        .card-template-1::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        /* 模板2: 梦幻紫粉渐变 */
        .card-template-2 {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #6366f1 100%);
            color: #fff;
            font-family: "Outfit", sans-serif;
        }
        .card-template-2::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
        }
        .card-template-2 .card-accent {
            color: #fce7f3;
        }
        .card-template-2 .card-subtitle {
            color: rgba(255, 255, 255, 0.7);
        }

        /* 模板3: 深邃星空 */
        .card-template-3 {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #fff;
            font-family: "Outfit", sans-serif;
            overflow: hidden;
        }
        .card-template-3::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 160px 120px, #fff, transparent),
                radial-gradient(2px 2px at 200px 50px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 50px 160px, #fff, transparent),
                radial-gradient(2px 2px at 100px 200px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 180px 180px, #fff, transparent),
                radial-gradient(2px 2px at 220px 140px, rgba(255,255,255,0.8), transparent);
            pointer-events: none;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .card-template-3 .card-accent {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }
        .card-template-3 .card-subtitle {
            color: rgba(148, 163, 184, 0.9);
        }

        /* 模板4: 清新薄荷 */
        .card-template-4 {
            background: linear-gradient(135deg, #34d399 0%, #10b981 40%, #059669 100%);
            color: #fff;
            font-family: "Outfit", sans-serif;
        }
        .card-template-4::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        .card-template-4::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .card-template-4 .card-accent {
            color: #d1fae5;
        }
        .card-template-4 .card-subtitle {
            color: rgba(255, 255, 255, 0.7);
        }

        /* 模板5: 暗金奢华 */
        .card-template-5 {
            background: linear-gradient(135deg, #1c1917 0%, #292524 50%, #44403c 100%);
            color: #fbbf24;
            font-family: "Outfit", sans-serif;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .card-template-5::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 16px;
            pointer-events: none;
        }
        .card-template-5 .card-accent {
            color: #fde68a;
            background: linear-gradient(90deg, #fbbf24, #fef3c7, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-template-5 .card-subtitle {
            color: rgba(251, 191, 36, 0.6);
        }
        .card-template-5 .card-content {
            color: #f5f5f4;
        }

        /* 模板6: 水墨中国风 */
        .card-template-6 {
            background: linear-gradient(180deg, #faf5ff 0%, #f1f5f9 50%, #e2e8f0 100%);
            color: #1e293b;
            font-family: "Noto Serif SC", serif;
            border: none;
        }
        .card-template-6::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 10% 90%, rgba(100, 116, 139, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 10%, rgba(100, 116, 139, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }
        .card-template-6::after {
            content: '签';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 80px;
            font-weight: 700;
            color: rgba(220, 38, 38, 0.08);
            font-family: "Noto Serif SC", serif;
            pointer-events: none;
        }
        .card-template-6 .card-accent {
            color: #dc2626;
        }
        .card-template-6 .card-subtitle {
            color: #64748b;
        }
        .card-template-6 .card-content {
            color: #334155;
            line-height: 1.8;
        }
        .card-template-6 .card-wish {
            border-bottom: 2px solid #dc2626;
            padding-bottom: 8px;
            display: inline-block;
        }

        /* 卡片容器基础样式 */
        .wish-card-container {
            position: relative;
            border-radius: 24px;
            padding: 32px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 加载动画 */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }
        .loading-dots span {
            width: 8px;
            height: 8px;
            background: currentColor;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 设置弹窗样式 */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-white">
    <div id="app" class="min-h-screen">
        <!-- 顶部装饰光效 -->
        <div class="fixed top-0 left-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="fixed top-0 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <!-- 头部区域 -->
        <header class="relative py-10 px-4">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/30">
                        <i class="fa-solid fa-wand-magic-sparkles text-white text-3xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold text-white">一句话愿望 + 未来签</h1>
                        <p class="text-slate-400 mt-1">让 AI 为你的愿望写一张精美的未来签卡片</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button @click="showSettings = true" 
                            class="p-3 rounded-xl glass-card text-slate-300 hover:text-amber-400 transition-colors">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                    <a href="../../index.html" 
                       class="px-4 py-2 rounded-xl glass-card text-slate-300 hover:text-amber-400 transition-colors text-sm">
                        返回首页
                    </a>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="relative px-4 pb-16">
            <div class="max-w-6xl mx-auto grid lg:grid-cols-[400px_1fr] gap-8">
                
                <!-- 左侧控制面板 -->
                <section class="space-y-6">
                    <!-- 愿望输入区 -->
                    <div class="glass-card rounded-3xl p-6">
                        <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-heart text-pink-400 text-lg"></i>
                            写下你的愿望
                        </h2>
                        <textarea v-model="wish" 
                                  class="input-modern w-full rounded-xl px-4 py-3 resize-none h-24" 
                                  placeholder="例如：希望今年更稳定自在..."></textarea>
                        
                        <div class="flex gap-3 mt-4">
                            <button @click="generate" 
                                    class="flex-1 px-5 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white font-semibold btn-glow disabled:opacity-50 disabled:cursor-not-allowed"
                                    :disabled="isLoading || !wish.trim()">
                                <span v-if="!isLoading" class="flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-wand-sparkles text-sm"></i>
                                    生成未来签
                                </span>
                                <span v-else class="loading-dots">
                                    <span></span><span></span><span></span>
                                </span>
                            </button>
                            <button @click="download" 
                                    class="px-5 py-3 rounded-xl bg-white/10 border border-white/20 text-white font-medium hover:bg-white/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                    :disabled="!cardText">
                                <i class="fa-solid fa-download text-sm"></i>
                            </button>
                        </div>
                        
                        <p v-if="error" class="text-sm text-red-400 mt-3 flex items-center gap-2">
                            <i class="fa-solid fa-circle-exclamation text-sm"></i>
                            {{ error }}
                        </p>
                    </div>

                    <!-- 模板选择区 -->
                    <div class="glass-card rounded-3xl p-6">
                        <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-palette text-purple-400 text-lg"></i>
                            选择卡片风格
                        </h2>
                        <div class="template-selector">
                            <div v-for="(template, index) in templates" 
                                 :key="index"
                                 class="template-item"
                                 :class="[template.class, { active: currentTemplate === index }]"
                                 @click="currentTemplate = index">
                                <div class="template-preview">{{ template.preview }}</div>
                                <div class="template-name">{{ template.name }}</div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 右侧卡片预览区 -->
                <section class="glass-card rounded-3xl p-8 flex items-center justify-center">
                    <div class="w-full max-w-md">
                        <!-- 卡片预览 -->
                        <div id="card" 
                             class="wish-card-container"
                             :class="templates[currentTemplate].class">
                            
                            <!-- 卡片头部标识 -->
                            <div class="card-subtitle text-sm font-medium tracking-wider uppercase mb-2" style="position: relative; z-index: 1;">
                                {{ templates[currentTemplate].label }}
                            </div>
                            
                            <!-- 愿望标题 -->
                            <div class="card-accent text-2xl font-bold mt-2" 
                                 :class="{ 'card-wish': currentTemplate === 5 }"
                                 style="position: relative; z-index: 1;">
                                {{ wish || '写下你的愿望' }} </div> <!-- 签文内容 --> <div class="card-content flex-1 mt-6 text-base leading-relaxed whitespace-pre-line"  style="position: relative; z-index: 1;"> <template v-if="isLoading"> <span class="loading-dots"> <span></span><span></span><span></span> </span> <span class="ml-2 opacity-70">正在生成中...</span> </template> <template v-else> {{ cardText || '等待生成你的未来签...' }}
                                </template>
                            </div>
                            
                            <!-- 卡片底部 -->
                            <div class="card-subtitle text-xs mt-6 pt-4 border-t border-current/20 flex justify-between items-center"
                                 style="position: relative; z-index: 1;">
                                <span>签发时间 · {{ currentDate }}</span>
                                <span class="opacity-60">✨ AI 生成</span>
                            </div>
                        </div>
                        
                        <!-- 操作提示 -->
                        <p class="text-center text-slate-500 text-sm mt-6">
                            点击左侧的风格卡片切换样式，生成后可导出为图片
                        </p>
                    </div>
                </section>
            </div>
        </main>

        <!-- API 设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
            <div class="modal-content rounded-3xl p-8 w-full max-w-md">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-key text-amber-400 text-lg"></i>
                        API 设置
                    </h3>
                    <button @click="showSettings = false" 
                            class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
                
                <div class="space-y-5">

                        <label class="block text-sm font-medium text-slate-300 mb-2">DeepSeek API Key</label>
                        <input v-model="apiConfig.deepseek"

                               class="input-modern w-full rounded-xl px-4 py-3"
                               placeholder="sk-xxxxxxxxxxxxxxxx">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">模型选择</label>
                        <select v-model="apiConfig.model" 
                                class="input-modern w-full rounded-xl px-4 py-3">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>
                </div>
                
                <button @click="saveConfig" 
                        class="mt-8 w-full px-5 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white font-semibold btn-glow">
                    保存配置
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Vue 应用主脚本
         * 实现愿望输入、AI生成、卡片预览和图片导出功能
         */
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {


                // ========================================
                // 响应式数据
                // ========================================
                
                // 用户输入的愿望
                const wish = ref('希望今年更稳定自在');
                // AI 生成的卡片文本
                const cardText = ref('');
                // 错误信息
                const error = ref('');
                // 加载状态
                const isLoading = ref(false);
                // 设置弹窗显示状态
                const showSettings = ref(false);
                // API 配置
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });
                // 当前选中的模板索引
                const currentTemplate = ref(0);

                // ========================================
                // 模板配置
                // ========================================
                const templates = ref([
                    {
                        name: '金橙渐变',
                        class: 'card-template-1',
                        preview: '🌅',
                        label: '未来签 · Fortune'
                    },
                    {
                        name: '梦幻紫粉',
                        class: 'card-template-2',
                        preview: '💜',
                        label: '星愿签 · Wish'
                    },
                    {
                        name: '深邃星空',
                        class: 'card-template-3',
                        preview: '✨',
                        label: '星辰签 · Celestial'
                    },
                    {
                        name: '清新薄荷',
                        class: 'card-template-4',
                        preview: '🌿',
                        label: '吉祥签 · Lucky'
                    },
                    {
                        name: '暗金奢华',
                        class: 'card-template-5',
                        preview: '👑',
                        label: '御赐签 · Royal'
                    },
                    {
                        name: '水墨中国',
                        class: 'card-template-6',
                        preview: '🎋',
                        label: '灵签 · Spirit'
                    }
                ]);

                // ========================================
                // 计算属性
                // ========================================
                
                // 当前日期格式化
                const currentDate = computed(() => {
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const day = String(now.getDate()).padStart(2, '0');
                    return `${year}.${month}.${day}`;
                });

                // ========================================
                // 方法
                // ========================================

                /**
                 * 调用 LLM API 生成内容
                 * @param {string} prompt - 提示词
                 * @returns {Promise<string>} 生成的文本
                 */
                const callLLM = async (prompt) => {
                    if (!apiConfig.value.deepseek) {
                        throw new Error('请先配置 DeepSeek API Key');
                    }
                    
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${apiConfig.value.deepseek}`
                        },
                        body: JSON.stringify({
                            model: apiConfig.value.model,
                            messages: [
                                { 
                                    role: 'system', 
                                    content: '你是一位温柔而智慧的占卜师，专门为人们书写未来签祝福语。你的文字充满诗意和正能量，能给人带来希望和力量。请用简洁优美的语言书写祝福。' 
                                },
                                { role: 'user', content: prompt }
                            ],
                            temperature: 0.8,
                            max_tokens: 200
                        })
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(`API 请求失败: ${response.status} - ${errorData.error?.message || '未知错误'}`);
                    }
                    
                    const data = await response.json();
                    return data.choices?.[0]?.message?.content || '';
                };

                /**
                 * 生成未来签
                 */
                const generate = async () => {
                    if (!wish.value.trim()) {
                        error.value = '请先写下你的愿望';
                        return;
                    }
                    
                    error.value = '';
                    isLoading.value = true;
                    
                    try {
                        const prompt = `愿望：「${wish.value}」

请为这个愿望写一段未来签祝福语，要求：
1. 字数控制在 50-80 字以内
2. 语言优美有诗意，带有一点神秘感
3. 内容积极向上，给人希望和力量
4. 可以用一些意象比喻，但要通俗易懂
5. 结尾可以用一句简短的吉祥话

直接输出祝福语内容，不要有任何前缀或解释。`;

                        cardText.value = await callLLM(prompt);
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        isLoading.value = false;
                    }
                };

                /**
                 * 下载卡片为图片
                 */
                const download = async () => {
                    const card = document.getElementById('card');
                    if (!card) return;
                    
                    try {
                        // html2canvas 配置，确保样式正确渲染
                        const canvas = await html2canvas(card, {
                            scale: 2, // 2倍分辨率，更清晰
                            useCORS: true,
                            backgroundColor: null,
                            logging: false
                        });
                        
                        const link = document.createElement('a');
                        link.download = `未来签-${currentDate.value}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    } catch (err) {
                        console.error('导出图片失败:', err);
                        error.value = '导出图片失败，请重试';
                    }
                };

                /**
                 * 保存 API 配置到 localStorage
                 */
                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ 
                        ...current, 
                        ...apiConfig.value 
                    }));
                    showSettings.value = false;
                };

                // ========================================
                // 生命周期钩子
                // ========================================
                onMounted(() => {
                    // 初始化 Lucide 图标

                    // 从 localStorage 加载配置
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                    }
                    
                    // 初始化 Lucide 图标
                });

                // ========================================
                // 返回模板使用的数据和方法
                // ========================================
                return {

                    wish,
                    cardText,
                    error,
                    isLoading,
                    showSettings,
                    apiConfig,
                    currentTemplate,
                    templates,
                    currentDate,
                    generate,
                    download,
                    saveConfig
                };
            }
        }).mount('#app');
    </script>
