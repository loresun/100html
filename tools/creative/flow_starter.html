    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 分钟心流启动器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #e0f2fe 0%, #f8fafc 60%, #bae6fd 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }

        .pulse-ring {
            width: 160px;
            height: 160px;
            border-radius: 999px;
            border: 2px solid rgba(14, 165, 233, 0.4);
            animation: pulse 2.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.08);
                opacity: 0.8;
            }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div class="min-h-screen">
        <header class="py-10 px-4">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-sky-500 flex items-center justify-center">
                        <i class="fa-solid fa-stopwatch w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">15 分钟心流启动器</h1>
                        <p class="text-slate-500">轻量仪式 + 倒计时，把注意力收回来。</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="px-4 pb-16">
            <div class="max-w-4xl mx-auto grid lg:grid-cols-[1.1fr_0.9fr] gap-8">
                <div class="glass-card rounded-3xl p-8 shadow-lg">
                    <h2 class="text-xl font-bold text-slate-900">启动步骤</h2>
                    <p class="text-sm text-slate-500 mt-1">完成以下四步后再开始计时。</p>
                    <ol id="flow-steps" class="mt-4 space-y-2 text-slate-700 text-sm">
                        <li>① 清理桌面，只留下当前任务。</li>
                        <li>② 深呼吸 3 次，轻轻放松肩颈。</li>
                        <li>③ 写下 1 个 15 分钟内必须完成的小目标。</li>
                        <li>④ 打开计时器，把注意力放在第一步。</li>
                    </ol>
                    <button id="flow-start"
                        class="mt-6 px-5 py-2.5 rounded-xl bg-sky-600 text-white font-medium hover:bg-sky-500 transition">开始
                        15 分钟</button>
                </div>

                <div class="glass-card rounded-3xl p-8 shadow-lg flex flex-col items-center justify-center">
                    <div class="pulse-ring flex items-center justify-center">
                        <div class="text-center">
                            <div class="text-sm text-slate-500">剩余时间</div>
                            <div id="flow-timer" class="text-4xl font-bold text-sky-600 mt-2">15:00</div>
                        </div>
                    </div>
                    <div id="flow-message" class="mt-6 text-sm text-slate-500">准备好再开始。</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // lucide.createIcons();

        let interval = null;
        const timerEl = document.getElementById('flow-timer');
        const messageEl = document.getElementById('flow-message');

        document.getElementById('flow-start').addEventListener('click', () => {
            let remaining = 15 * 60;
            if (interval) clearInterval(interval);
            messageEl.textContent = '心流已启动，专注 15 分钟。';

            const tick = () => {
                const minutes = String(Math.floor(remaining / 60)).padStart(2, '0');
                const seconds = String(remaining % 60).padStart(2, '0');
                timerEl.textContent = `${minutes}:${seconds}`;
                if (remaining === 0) {
                    clearInterval(interval);
                    messageEl.textContent = '完成！给自己一个奖励。';
                }
                remaining = Math.max(0, remaining - 1);
            };
            tick();
            interval = setInterval(tick, 1000);
        });
    </script>

    <!-- HELP-WIDGET-START -->
    <script src="../../help/help-widget-v2.js"></script>
    <!-- HELP-WIDGET-END -->
</body>

</html>
