    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市微旅行地图</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #ecfeff 0%, #f8fafc 60%, #bae6fd 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .map-node {
            background: #e0f2fe;
            border-radius: 16px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .map-node.generating {
            background: linear-gradient(90deg, #e0f2fe 0%, #bae6fd 50%, #e0f2fe 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.33); }
            80%, 100% { opacity: 0; }
        }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800">
    <div id="app" class="min-h-screen">
        <header class="py-10 px-4">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-sky-500 flex items-center justify-center">
                        <i class="fa-solid fa-map text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">城市微旅行地图</h1>
                        <p class="text-slate-500">给出城市与时间，AI 生成 3 小时微旅行路线。</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="showSettings = true" class="p-2 rounded-full bg-white border border-slate-200 text-slate-500 hover:text-sky-600">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                    <a href="../../index.html" class="text-sm text-slate-500 hover:text-sky-600">返回首页</a>
                </div>
            </div>
        </header>

        <main class="px-4 pb-16">
            <div class="max-w-5xl mx-auto grid lg:grid-cols-[1fr_1fr] gap-8">
                <section class="glass-card rounded-3xl p-8 shadow-lg">
                    <input v-model="city" class="w-full border border-slate-200 rounded-xl px-4 py-3" placeholder="城市">
                    <input v-model="time" class="w-full border border-slate-200 rounded-xl px-4 py-3 mt-3" placeholder="时间段，例如：下午 3 小时">
                    <button @click="generate" class="mt-4 px-5 py-2.5 rounded-xl font-medium flex items-center gap-2" :disabled="isLoading"
                        :class="isLoading ? 'bg-slate-300 cursor-not-allowed' : 'bg-sky-600 hover:bg-sky-500 text-white'">
                        <i v-if="isLoading" class="fa-solid fa-spinner fa-spin w-4 h-4"></i>
                        <i v-else class="fa-solid fa-wand-magic-sparkles w-4 h-4"></i>
                        <span>{{ isLoading ? '生成中...' : '生成路线' }}</span>
                    </button>
                    <p v-if="error" class="text-sm text-red-500 mt-3">{{ error }}</p>
                </section>

                <section class="glass-card rounded-3xl p-8 shadow-lg">
                    <h2 class="text-lg font-bold text-slate-900">微旅行节点</h2>
                    <div class="map-grid mt-4">
                        <template v-for="(node, index) in 6" :key="index">
                            <div class="map-node" :class="{'generating': isLoading && index < progress}">
                                <div class="text-sm text-slate-500">
                                    <span v-if="isLoading && index === progress - 1" class="flex items-center gap-1">
                                        <i class="fa-solid fa-location-dot text-sky-500 pulse-ring w-3 h-3"></i>
                                        生成中...
                                    </span>
                                    <span v-else-if="isLoading && index > progress - 1">等待生成</span>
                                    <span v-else-if="route[index]">{{ index === 0 ? '起点' : `Stop ${index + 1}` }}</span>
                                    <span v-else>等待生成</span>
                                </div>
                                <div class="text-slate-800 mt-1 text-sm">{{ route[index] || '' }}</div>
                            </div>
                        </template>
                    </div>
                </section>
            </div>
        </main>

        <div v-if="showSettings" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-md">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                    <input v-model="apiConfig.deepseek" type="password" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">模型</label>
                    <select v-model="apiConfig.model" class="w-full border border-slate-200 rounded-lg px-3 py-2">
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                </div>
                <button @click="saveConfig" class="mt-6 w-full px-4 py-2 rounded-lg bg-sky-600 text-white font-medium hover:bg-sky-500">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const city = ref('上海');
                const time = ref('下午 3 小时');
                const route = ref(['', '', '', '', '', '']);
                const error = ref('');
                const isLoading = ref(false);
                const showSettings = ref(false);
                const apiConfig = ref({ deepseek: '', model: 'deepseek-v4-flash' });
                const progress = ref(0);
                let generateTimer = null;

                const callLLM = async (prompt, onProgress) => {
                    if (!apiConfig.value.deepseek) {
                        error.value = '请先配置 DeepSeek API Key。';
                        return '';
                    }
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${apiConfig.value.deepseek}`
                        },
                        body: JSON.stringify({
                            model: apiConfig.value.model,
                            messages: [
                                { role: 'system', content: '你是城市旅行规划师。请为用户规划 3 小时的微旅行路线，只输出 6 个地点，每行一个，不要编号。格式要求：地点名称 - 简短说明' },
                                { role: 'user', content: prompt }
                            ],
                            temperature: 0.7,
                            stream: true
                        })
                    });
                    if (!response.ok) throw new Error(`API 请求失败: ${response.status}`);

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let fullText = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    const content = data.choices?.[0]?.delta?.content;
                                    if (content) {
                                        fullText += content;
                                        // 每增加一个换行符或完整地点，更新进度
                                        const linesSoFar = fullText.split(/\n/).filter(l => l.trim() && l.trim().length > 5);
                                        const newProgress = Math.min(linesSoFar.length, 6);
                                        if (newProgress !== progress.value) {
                                            progress.value = newProgress;
                                            // 更新对应位置的路线
                                            for (let i = 0; i < newProgress; i++) {
                                                if (linesSoFar[i]) {
                                                    route.value[i] = linesSoFar[i].replace(/^\d+\.?\s*/, '').trim();
                                                }
                                            }
                                        }
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                    return fullText;
                };

                const parseRoute = (text) => {
                    const lines = text.split(/\n/).filter(line => line.trim() && line.trim().length > 5);
                    return lines.slice(0, 6).map(line => line.replace(/^\d+\.?\s*/, '').trim());
                };

                const generate = () => {
                    // 防抖：300ms 内只执行一次
                    if (generateTimer) {
                        clearTimeout(generateTimer);
                    }
                    generateTimer = setTimeout(async () => {
                        error.value = '';
                        isLoading.value = true;
                        progress.value = 0;
                        route.value = ['', '', '', '', '', ''];

                        try {
                            const prompt = `城市：${city.value}\n时间段：${time.value}\n请为我规划一条 3 小时的微旅行路线，给出 6 个地点。`;
                            const text = await callLLM(prompt);
                            const parsedRoute = parseRoute(text);
                            // 填充剩余位置
                            for (let i = 0; i < 6; i++) {
                                route.value[i] = parsedRoute[i] || route.value[i] || '未能生成此节点';
                            }
                        } catch (err) {
                            error.value = err.message;
                        } finally {
                            isLoading.value = false;
                            generateTimer = null;
                        }
                    }, 300);
                };

                const saveConfig = () => {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...apiConfig.value }));
                    showSettings.value = false;
                };

                onMounted(() => {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) apiConfig.value = { ...apiConfig.value, ...JSON.parse(saved) };
                });

                return {
                    city,
                    time,
                    route,
                    error,
                    isLoading,
                    showSettings,
                    apiConfig,
                    progress,
                    generate,
                    saveConfig
                };
            }
        }).mount('#app');
    </script>

<script src="../../help/help-widget-v2.js" data-help-doc="../../docs/help/creative_travel_mini_map.md"></script>

</body>

</html>
