<!DOCTYPE html>
<html lang="zh-CN">

<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M09H8GY78X"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日能量配方</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #eef2ff 0%, #f8fafc 60%, #e0f2fe 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }

        .floating-bubble {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 999px;
            background: radial-gradient(circle at top, rgba(129, 140, 248, 0.45), rgba(56, 189, 248, 0.1));
            animation: float 6s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-16px);
            }
        }

        @keyframes typing {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .stream-text { animation: typing 0.05s ease-in; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800" x-data="energyRecipeApp()">
    <div class="min-h-screen relative overflow-hidden">
        <div class="floating-bubble top-16 left-12"></div>
        <div class="floating-bubble bottom-20 right-12" style="animation-delay: -2s"></div>

        <header class="py-10 px-4 relative">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-500 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-wand-magic-sparkles text-white w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">今日能量配方</h1>
                        <p class="text-slate-500">生成专属工作与生活能量配方</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="showSettings = true"
                        class="text-sm text-slate-500 hover:text-indigo-600 flex items-center gap-1 px-3 py-2 rounded-lg hover:bg-indigo-50 transition">
                        <i class="fa-solid fa-gear w-4 h-4"></i>
                        <span>设置</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="px-4 pb-16 relative">
            <div class="max-w-4xl mx-auto glass-card rounded-3xl p-8 shadow-lg">
                <div class="grid md:grid-cols-3 gap-4">
                    <input x-model="input.status" class="border border-slate-200 rounded-xl px-4 py-3"
                        placeholder="今天状态（如：略疲惫）">
                    <input x-model="input.weather" class="border border-slate-200 rounded-xl px-4 py-3"
                        placeholder="天气（如：微凉小雨）">
                    <input x-model="input.plan" class="border border-slate-200 rounded-xl px-4 py-3"
                        placeholder="今天重点（如：写方案）">
                </div>
                
                <!-- 风格选择 -->
                <div class="mt-4 space-y-3">
                    <label class="block text-sm font-medium text-slate-700">配方风格</label>
                    <div class="flex flex-wrap gap-2">
                        <template x-for="style in styles" :key="style.value">
                            <button @click="input.style = style.value"
                                :class="['px-4 py-2 rounded-full text-sm font-medium border transition',
                                    input.style === style.value 
                                        ? 'bg-indigo-600 text-white border-indigo-600' 
                                        : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-400']">
                                <span x-text="style.icon + ' ' + style.label"></span>
                            </button>
                        </template>
                    </div>
                </div>

                        <button @click="generateRecipe" :disabled="isGenerating"
                            class="mt-4 px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-500 transition disabled:opacity-50 flex items-center gap-2">
                            <template x-if="isGenerating">
                                <i class="fa-solid fa-spinner fa-spin w-5 h-5"></i>
                            </template>
                            <span x-text="isGenerating ? '正在生成...' : '✨ 生成配方'"></span>
                        </button>
                    
                    <div x-show="!result && !isGenerating" class="mt-6 rounded-2xl bg-indigo-50 p-5 text-slate-700">
                        <div class="text-center text-slate-400 py-4">
                            <i class="fa-solid fa-wand-magic-sparkles w-12 h-12 mx-auto mb-2 opacity-50"></i>
                            <p>输入你的状态、天气和计划，点击生成配方</p>
                        </div>
                    </div>
                    
                    <div x-show="isGenerating && !result" class="mt-6 rounded-2xl bg-indigo-50 p-8 text-center">
                        <i class="fa-solid fa-spinner fa-spin w-8 h-8 mx-auto text-indigo-600"></i>
                        <p class="mt-2 text-indigo-600">正在为你调配专属能量配方...</p>
                    </div>
                    
                    <div x-show="result" class="mt-6 rounded-2xl bg-indigo-50 p-5 text-slate-700">
                        <div class="font-semibold text-indigo-700 text-lg mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles w-5 h-5"></i>
                            <span x-text="result?.title || ''"></span>
                        </div>
                        <ul class="space-y-2 text-sm">
                            <li class="flex items-start gap-2">
                                <i class="fa-solid fa-user w-4 h-4 mt-0.5 text-indigo-500"></i>
                                <span>状态：<span x-text="input.status || '平稳'"></span>，天气：<span x-text="input.weather || '晴好'"></span></span>
                            </li>
                            <li class="flex items-start gap-2">
                                <i class="fa-solid fa-bullseye w-4 h-4 mt-0.5 text-indigo-500"></i>
                                <span>主线任务：<span x-text="input.plan || '把今天过好'"></span></span>
                            </li>
                            <template x-for="(item, key) in (result?.items || {})" :key="key">
                                <li class="flex items-start gap-2">
                                    <i :class="['fa-solid w-4 h-4 mt-0.5 text-indigo-500', getIconClass(item?.icon)]"></i>
                                    <span><span x-text="item?.label || ''"></span>：<span x-text="item?.value || ''"></span></span>
                                </li>
                            </template>
                        </ul>
                        <div class="mt-4 pt-4 border-t border-indigo-100 flex justify-end items-center">
                            <div class="flex gap-2">
                                <button @click="copyResult" 
                                    class="px-3 py-1.5 bg-white border border-indigo-200 rounded-lg text-sm text-indigo-600 hover:bg-indigo-50 transition flex items-center gap-1">
                                    <i class="fa-regular fa-copy w-4 h-4"></i>
                                    <span>复制</span>
                                </button>
                                <button @click="regenerate" :disabled="isGenerating"
                                    class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-500 transition flex items-center gap-1 disabled:opacity-50">
                                    <i class="fa-solid fa-rotate-right w-4 h-4"></i>
                                    <span>重新生成</span>
                                </button>
                            </div>
                        </div>
                    </div>
            </div>
        </main>

        <!-- Toast 提示 -->
        <div x-show="toast.show" x-transition
            class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2">
            <i :class="['fa-solid w-4 h-4', getIconClass(toast.icon)]"></i>
            <span class="text-sm" x-text="toast.message"></span>
        </div>

        <!-- API 设置弹窗 -->
        <div x-show="showSettings" x-transition
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6" @click.outside="showSettings = false">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark w-5 h-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" x-model="apiConfig.deepseek"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none"
                            placeholder="sk-...">
                        <p class="text-xs text-slate-500 mt-1">
                            <i class="fa-solid fa-lock w-3 h-3 inline-block mr-1"></i>
                            Key 仅保存在本地浏览器，所有工具共享使用
                        </p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">默认模型</label>
                        <select x-model="apiConfig.model"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button @click="saveConfig"
                        class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('energyRecipeApp', () => ({
                showSettings: false,
                apiConfig: { deepseek: '', model: 'deepseek-v4-flash' },
                isGenerating: false,
                result: null,
                toast: { show: false, message: '', icon: 'check' },

                styles: [
                    { value: 'balanced', label: '均衡', icon: '⚖️' },
                    { value: 'energetic', label: '活力', icon: '⚡' },
                    { value: 'calm', label: '平静', icon: '🌿' },
                    { value: 'focus', label: '专注', icon: '🎯' }
                ],

                input: {
                    status: '',
                    weather: '',
                    plan: '',
                    style: 'balanced'
                },

                init() {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
                    }
                    // 验证模型名称，无效则回退到默认值
                    const validModels = ['deepseek-v4-flash', 'deepseek-v4-pro'];
                    if (!validModels.includes(this.apiConfig.model)) {
                        this.apiConfig.model = 'deepseek-v4-flash';
                    }
                    this.refreshIcons();
                },

                refreshIcons() {
                    // Font Awesome 不需要初始化
                },

                getIconClass(iconName) {
                    const iconMap = {
                        'sparkles': 'fa-wand-magic-sparkles',
                        'check': 'fa-check',
                        'alert-circle': 'fa-circle-exclamation',
                        'copy': 'fa-copy',
                        'heart': 'fa-heart',
                        'lightbulb': 'fa-lightbulb',
                        'loader-2': 'fa-spinner',
                        'refresh-cw': 'fa-rotate-right',
                        'settings': 'fa-gear',
                        'x': 'fa-xmark',
                        'lock': 'fa-lock',
                        'user': 'fa-user',
                        'target': 'fa-bullseye',
                        'circle': 'fa-circle',
                        '🍽️': 'fa-utensils',
                        '🎵': 'fa-music',
                        '👔': 'fa-shirt',
                        '✨': 'fa-sparkles',
                        'meal': 'fa-utensils',
                        'music': 'fa-music',
                        'outfit': 'fa-shirt',
                        'ritual': 'fa-sparkles'
                    };
                    return iconMap[iconName] || 'fa-star';
                },

                showToast(message, icon = 'check') {
                    this.toast = { show: true, message, icon };
                    this.refreshIcons();
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                saveConfig() {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({ ...current, ...this.apiConfig }));
                    this.showSettings = false;
                    this.showToast('配置已保存', 'check');
                },

                async generateRecipe() {
                    if (!this.apiConfig.deepseek) {
                        this.showSettings = true;
                        this.showToast('请先配置 API Key', 'alert-circle');
                        return;
                    }

                    this.isGenerating = true;
                    this.result = null;

                    try {
                        const status = this.input.status || '平稳';
                        const weather = this.input.weather || '晴好';
                        const plan = this.input.plan || '把今天过好';
                        const style = this.styles.find(s => s.value === this.input.style)?.label || '均衡';

                        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model || 'deepseek-v4-flash',
                                messages: [
                                    { 
                                        role: 'system', 
                                        content: `你是一位生活美学顾问，根据用户的当日状态、天气和重点任务，推荐能量配方。

例子：
{"title":"今日能量配方","items":{"meal":{"label":"能量食谱","icon":"🍽️","value":"燕麦粥配蓝莓"},"music":{"label":"音乐氛围","icon":"🎵","value":"Lo-fi 轻音乐"},"outfit":{"label":"穿搭建议","icon":"👔","value":"灰色针织衫"},"ritual":{"label":"启动仪式","icon":"✨","value":"喝一杯温水"}}}

请根据用户输入生成类似的 JSON 格式。`
                                    },
                                    {
                                        role: 'user',
                                        content: `我的情况：
- 当前状态：${status}
- 今日天气：${weather}
- 主线任务：${plan}
- 偏好风格：${style}

请为我定制今日能量配方。`
                                    }
                                ]
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`API 错误: ${response.status}`);
                        }

                        const data = await response.json();
                        const content = data.choices?.[0]?.message?.content;
                        
                        if (content) {
                            try {
                                this.result = JSON.parse(content);
                            } catch (e) {
                                // 尝试提取 JSON
                                const jsonMatch = content.match(/\{[\s\S]*\}/);
                                if (jsonMatch) {
                                    this.result = JSON.parse(jsonMatch[0]);
                                } else {
                                    throw new Error('解析结果失败');
                                }
                            }
                        }
                        
                        this.showToast('配方生成成功', 'sparkles');
                    } catch (error) {
                        console.error('生成失败:', error);
                        this.showToast('生成失败: ' + error.message, 'alert-circle');
                    } finally {
                        this.isGenerating = false;
                        this.refreshIcons();
                    }
                },

                async regenerate() {
                    if (this.input.status || this.input.weather || this.input.plan) {
                        await this.generateRecipe();
                    } else {
                        this.showToast('请先填写输入内容', 'info');
                    }
                },

                copyResult() {
                    if (!this.result || !this.result.title) return;
                    
                    const status = this.input.status || '平稳';
                    const weather = this.input.weather || '晴好';
                    const plan = this.input.plan || '把今天过好';
                    
                    let text = `🌿 ${this.result.title || '今日能量配方'}\n\n`;
                    text += `状态：${status}，天气：${weather}。\n`;
                    text += `主线任务：${plan}。\n\n`;
                    
                    const items = this.result.items || {};
                    for (const key in items) {
                        const item = items[key];
                        text += `${item?.label || ''}：${item?.value || ''}\n`;
                    }
                    
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制到剪贴板', 'copy');
                    }).catch(() => {
                        this.showToast('复制失败', 'alert-circle');
                    });
                }
            }));
        });
    </script>

    <!-- HELP-WIDGET-START -->
    <script src="../../help/help-widget-v2.js"></script>
    <!-- HELP-WIDGET-END -->
</body>

</html>
