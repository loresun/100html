<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反向待办 Done List - AI 内容创作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #ecfdf5 0%, #f8fafc 60%, #d1fae5 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #34d399;
            animation: fall 3.5s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes fall {
            0% {
                transform: translateY(-40px) rotate(0deg);
            }
            100% {
                transform: translateY(360px) rotate(180deg);
            }
        }

        @keyframes typing {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .stream-text { animation: typing 0.05s ease-in; }
    </style>
    <script src="../../assets/js/deepseek-v4-compat.js"></script>
</head>

<body class="text-slate-800" x-data="doneListApp()">
    <div class="min-h-screen relative overflow-hidden">
        <div class="confetti left-20" style="animation-delay: -1s"></div>
        <div class="confetti left-1/2" style="animation-delay: -2s; background: #6ee7b7"></div>
        <div class="confetti right-24" style="animation-delay: -3s; background: #a7f3d0"></div>

        <header class="py-10 px-4">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-check-double text-white w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">反向待办 Done List</h1>
                        <p class="text-slate-500">AI 智能鼓励，把努力可视化。</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="showSettings = true"
                        class="text-sm text-slate-500 hover:text-emerald-600 flex items-center gap-1 px-3 py-2 rounded-lg hover:bg-emerald-50 transition">
                        <i class="fa-solid fa-gear w-4 h-4"></i>
                        <span>设置</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="px-4 pb-16">
            <div class="max-w-4xl mx-auto glass-card rounded-3xl p-8 shadow-lg">
                <textarea x-model="input.items" rows="5" class="w-full border border-slate-200 rounded-2xl px-4 py-3 focus:ring-2 focus:ring-emerald-500 outline-none"
                    placeholder="每行写一件完成的小事"></textarea>
                
                <div class="flex items-center gap-3 mt-4">
                    <button @click="generateEncouragement" :disabled="isGenerating || !input.items.trim()"
                        class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-medium hover:bg-emerald-500 transition disabled:opacity-50 flex items-center gap-2">
                        <template x-if="isGenerating">
                            <i class="fa-solid fa-spinner fa-spin w-5 h-5"></i>
                        </template>
                        <span x-text="isGenerating ? 'AI 分析中...' : '✨ AI 生成鼓励'"></span>
                    </button>
                    <span class="text-sm text-slate-400">建议写 3-6 件小事</span>
                </div>

                <!-- 空状态 -->
                <div x-show="!result && !isGenerating" class="mt-6 rounded-2xl bg-emerald-50 p-5">
                    <div class="text-center text-slate-400 py-4">
                        <i class="fa-solid fa-wand-magic-sparkles w-12 h-12 mx-auto mb-2 opacity-50"></i>
                        <p>写下今天完成的小事，AI 为你生成专属鼓励卡</p>
                    </div>
                </div>

                <!-- 加载状态 -->
                <div x-show="isGenerating && !result" class="mt-6 rounded-2xl bg-emerald-50 p-8 text-center">
                    <i class="fa-solid fa-spinner fa-spin w-8 h-8 mx-auto text-emerald-600"></i>
                    <p class="mt-2 text-emerald-600">AI 正在为你写下温暖的鼓励...</p>
                </div>

                <!-- 结果展示 -->
                <template x-if="result">
                <div class="mt-6 rounded-2xl bg-emerald-50 p-5 text-slate-700">
                    <div class="flex items-center justify-between mb-3">
                        <div class="font-semibold text-emerald-700 text-lg flex items-center gap-2">
                            <i class="fa-solid fa-heart w-5 h-5"></i>
                            <span x-text="result?.title || ''"></span>
                        </div>
                        <span class="text-xs text-slate-400" x-text="(result?.count || 0) + ' 件小事'"></span>
                    </div>
                    
                    <!-- 事项列表 -->
                    <ul class="mt-2 list-disc list-inside text-sm space-y-1 text-slate-600">
                        <template x-for="(item, index) in (result?.items || [])" :key="index">
                            <li x-text="item"></li>
                        </template>
                    </ul>

                    <!-- AI 分析和建议 -->
                    <template x-if="result?.insight">
                        <div class="mt-4 p-4 bg-white/60 rounded-xl">
                            <div class="text-sm text-emerald-700 font-medium flex items-center gap-2 mb-2">
                                <i class="fa-solid fa-lightbulb w-4 h-4"></i>
                                <span>AI 观察</span>
                            </div>
                            <p class="text-sm text-slate-600" x-text="result?.insight || ''"></p>
                        </div>
                    </template>

                    <!-- 鼓励语 -->
                    <template x-if="result?.encouragement">
                        <div class="mt-3 text-sm text-slate-500 italic border-t border-emerald-100 pt-3" x-text="'— ' + (result?.encouragement || '')"></div>
                    </template>

                    <!-- 操作按钮 -->
                    <div class="mt-4 pt-3 border-t border-emerald-100 flex justify-between items-center">
                        <span class="text-xs text-slate-400" x-text="'由 DeepSeek ' + (apiConfig.model === 'deepseek-v4-pro' ? 'V4 Pro' : 'V4 Flash') + ' 生成'"></span>
                        <div class="flex gap-2">
                            <button @click="copyResult" 
                                class="px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-sm text-emerald-600 hover:bg-emerald-50 transition flex items-center gap-1">
                                <i class="fa-regular fa-copy w-4 h-4"></i>
                                <span>复制</span>
                            </button>
                            <button @click="generateEncouragement" :disabled="isGenerating"
                                class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-sm hover:bg-emerald-500 transition flex items-center gap-1 disabled:opacity-50">
                                <i class="fa-solid fa-rotate-right w-4 h-4"></i>
                                <span>重新生成</span>
                            </button>
                        </div>
                    </div>
                </div>
                </template>
            </div>
        </main>

        <!-- Toast 提示 -->
        <div x-show="toast.show" x-transition
            class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2">
            <i :class="['fa-solid w-4 h-4', getIconClass(toast.icon)]"></i>
            <span class="text-sm" x-text="toast.message"></span>
        </div>

        <!-- API 设置弹窗 -->
        <div x-show="showSettings" x-transition
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6" @click.outside="showSettings = false">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-900">API 设置</h3>
                    <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark w-5 h-5"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek API Key</label>
                        <input type="password" x-model="apiConfig.deepseek"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                            placeholder="sk-...">
                        <p class="text-xs text-slate-500 mt-1">
                            <i class="fa-solid fa-lock w-3 h-3 inline-block mr-1"></i>
                            Key 仅保存在本地浏览器，所有工具共享使用
                        </p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">默认模型</label>
                        <select x-model="apiConfig.model"
                            class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                            <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button @click="showSettings = false"
                        class="text-slate-500 px-4 py-2 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button @click="saveConfig"
                        class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition">保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('doneListApp', () => ({
                showSettings: false,
                apiConfig: { deepseek: '', model: 'deepseek-v4-flash' },
                isGenerating: false,
                result: null,
                toast: { show: false, message: '', icon: 'check' },

                input: {
                    items: ''
                },

                init() {
                    const saved = localStorage.getItem('global_llm_config');
                    if (saved) {
                        this.apiConfig = { ...this.apiConfig, ...JSON.parse(saved) };
                    }
                    // 验证模型名称，无效则回退到默认值
                    const validModels = ['deepseek-v4-flash', 'deepseek-v4-pro'];
                    if (!validModels.includes(this.apiConfig.model)) {
                        console.warn('无效的模型名称:', this.apiConfig.model, '，已重置为 deepseek-v4-flash');
                        this.apiConfig.model = 'deepseek-v4-flash';
                    }
                },

                getIconClass(iconName) {
                    const iconMap = {
                        'sparkles': 'fa-wand-magic-sparkles',
                        'check': 'fa-check',
                        'alert-circle': 'fa-circle-exclamation',
                        'copy': 'fa-copy',
                        'heart': 'fa-heart',
                        'lightbulb': 'fa-lightbulb',
                        'loader-2': 'fa-spinner',
                        'refresh-cw': 'fa-rotate-right',
                        'settings': 'fa-gear',
                        'x': 'fa-xmark',
                        'lock': 'fa-lock',
                        'info': 'fa-circle-info'
                    };
                    return iconMap[iconName] || 'fa-star';
                },

                showToast(message, icon = 'check') {
                    this.toast = { show: true, message, icon };
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                saveConfig() {
                    const current = JSON.parse(localStorage.getItem('global_llm_config') || '{}');
                    localStorage.setItem('global_llm_config', JSON.stringify({
                        ...current,
                        deepseek: this.apiConfig.deepseek,
                        apiKey: this.apiConfig.deepseek, // 兼容其他工具
                        model: this.apiConfig.model
                    }));
                    this.showSettings = false;
                    this.showToast('配置已保存', 'check');
                },

                async generateEncouragement() {
                    if (!this.apiConfig.deepseek) {
                        this.showSettings = true;
                        this.showToast('请先配置 API Key', 'alert-circle');
                        return;
                    }

                    const lines = this.input.items.split('\n').map(item => item.trim()).filter(Boolean);
                    if (!lines.length) {
                        this.showToast('请先写下几件小事', 'info');
                        return;
                    }

                    this.isGenerating = true;
                    this.result = null;

                    try {
                        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiConfig.deepseek}`
                            },
                            body: JSON.stringify({
                                model: this.apiConfig.model || 'deepseek-v4-flash',
                                messages: [
                                    { 
                                        role: 'system', 
                                        content: `你是一位温暖的生活鼓励师。用户会写下今天完成的小事，你需要：

1. 整理用户完成的事项
2. 给出暖心的鼓励语
3. 如果能分析出规律，给出简短的洞察

请用温暖治愈的语气回复，输出 JSON 格式。
例子：
{"title":"今日完成清单","count":3,"items":["完成报告","跑步30分钟","读完一章书"],"insight":"今天你很好地平衡了工作与健康","encouragement":"每一天的小努力，都是在为自己的未来添砖加瓦，继续保持！"}`
                                    },
                                    {
                                        role: 'user',
                                        content: `今天我完成了这些小事：\n${lines.join('\n')}`
                                    }
                                ]
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            console.error('API 错误详情:', data);
                            throw new Error(data.error?.message || `API 错误: ${response.status}`);
                        }
                        const content = data.choices?.[0]?.message?.content;
                        
                        if (content) {
                            try {
                                this.result = JSON.parse(content);
                            } catch (e) {
                                // 尝试提取 JSON
                                const jsonMatch = content.match(/\{[\s\S]*\}/);
                                if (jsonMatch) {
                                    this.result = JSON.parse(jsonMatch[0]);
                                } else {
                                    throw new Error('解析结果失败');
                                }
                            }
                        }
                        
                        this.showToast('鼓励生成成功', 'heart');
                    } catch (error) {
                        console.error('生成失败:', error);
                        this.showToast('生成失败: ' + error.message, 'alert-circle');
                    } finally {
                        this.isGenerating = false;
                    }
                },

                copyResult() {
                    if (!this.result || !this.result.title) return;
                    
                    let text = `🌿 ${this.result.title || '今日完成清单'}\n\n`;
                    text += `完成 ${this.result.count || 0} 件小事：\n`;
                    (this.result.items || []).forEach(item => {
                        text += `✓ ${item}\n`;
                    });
                    
                    if (this.result.insight) {
                        text += `\n💡 ${this.result.insight}\n`;
                    }
                    
                    if (this.result.encouragement) {
                        text += `\n${this.result.encouragement}`;
                    }
                    
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast('已复制到剪贴板', 'copy');
                    }).catch(() => {
                        this.showToast('复制失败', 'alert-circle');
                    });
                }
            }));
        });
    </script>

    <!-- HELP-WIDGET-START -->
    <script src="../../help/help-widget-v2.js"></script>
    <!-- HELP-WIDGET-END -->
</body>

</html>
