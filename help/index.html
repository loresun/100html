  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>帮助中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .doc-content h1, .doc-content h2, .doc-content h3 {
      font-weight: 700;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .doc-content p {
      line-height: 1.8;
      margin: 0.75rem 0;
    }
    .doc-content ul {
      list-style: disc;
      padding-left: 1.5rem;
    }
    .doc-content ol {
      list-style: decimal;
      padding-left: 1.5rem;
    }
    .doc-content pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 0.75rem;
      overflow-x: auto;
    }
    .doc-content code {
      background: #f1f5f9;
      padding: 0.15rem 0.35rem;
      border-radius: 0.35rem;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold">帮助中心</h1>
          <p class="text-sm text-slate-500">选择左侧文档，查看详细使用说明。</p>
        </div>
        <a href="../index.html" class="text-sm text-indigo-600 hover:underline">返回首页</a>
      </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-6 grid grid-cols-1 lg:grid-cols-[240px_1fr] gap-6">
      <aside class="bg-white border border-slate-200 rounded-2xl p-4 h-fit">
        <div class="text-xs font-semibold text-slate-500 mb-3">文档列表</div>
        <ul id="docList" class="space-y-2 text-sm"></ul>
      </aside>
      <section class="bg-white border border-slate-200 rounded-2xl p-6 min-h-[400px]">
        <div id="docMeta" class="mb-4"></div>
        <article id="docContent" class="doc-content prose max-w-none"></article>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    const docListEl = document.getElementById('docList');
    const docContentEl = document.getElementById('docContent');
    const docMetaEl = document.getElementById('docMeta');

    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    const renderMarkdown = (markdown) => {
      docContentEl.innerHTML = marked.parse(markdown);
      const mermaidBlocks = docContentEl.querySelectorAll('code.language-mermaid');
      mermaidBlocks.forEach((block) => {
        const pre = block.parentElement;
        const container = document.createElement('div');
        container.className = 'mermaid';
        container.textContent = block.textContent;
        pre.replaceWith(container);
      });
      if (docContentEl.querySelector('.mermaid')) {
        mermaid.init(undefined, docContentEl.querySelectorAll('.mermaid'));
      }
    };

    const setActiveDoc = async (doc, allDocs) => {
      const response = await fetch('../docs/help/' + doc.path);
      const markdown = await response.text();
      renderMarkdown(markdown);
      docMetaEl.innerHTML = `
        <div class="text-xs text-slate-500">${doc.path}</div>
        <h2 class="text-xl font-bold mt-1">${doc.title}</h2>
        ${doc.source ? `<p class="text-sm text-slate-500 mt-1">来源：${doc.source}</p>` : ''}
      `;
      [...docListEl.children].forEach((item) => item.classList.remove('bg-indigo-50', 'text-indigo-700'));
      const activeItem = docListEl.querySelector(`[data-doc-id="${doc.id}"]`);
      if (activeItem) {
        activeItem.classList.add('bg-indigo-50', 'text-indigo-700');
      }
      history.replaceState({}, '', `#${doc.id}`);
    };

    const loadDocs = async () => {
      try {
        const response = await fetch('manifest.json');
        const data = await response.json();
        const docs = data.docs || [];
        if (!docs.length) {
          docContentEl.innerHTML = '<p class="text-slate-500">暂无文档，请先生成帮助文档。</p>';
          return;
        }

        docListEl.innerHTML = '';
        docs.forEach((doc) => {
          const li = document.createElement('li');
          li.dataset.docId = doc.id;
          li.className = 'cursor-pointer px-3 py-2 rounded-lg hover:bg-slate-100 transition';
          li.textContent = doc.title;
          li.addEventListener('click', () => setActiveDoc(doc, docs));
          docListEl.appendChild(li);
        });

        const hash = location.hash.replace('#', '');
        const defaultDoc = docs.find((doc) => doc.id === hash) || docs[0];
        await setActiveDoc(defaultDoc, docs);
      } catch (error) {
        docContentEl.innerHTML = '<p class="text-red-500">文档加载失败，请检查 manifest.json 是否存在。</p>';
      }
    };

    loadDocs();
  </script>

<!-- HELP-WIDGET-START -->
<script src="../help/help-widget-v2.js"></script>
<!-- HELP-WIDGET-END -->
</body>
</html>
